    public_excerpt: A subtler problem that I emphasized in 2001, an inability to keep track of knowledge of instances independently of kinds, seems to underlie the rampant hallucinations that allow large language models to say things like “Elon Musk died in a car crash in 2018”, even when nothing in the corpus says so, and massive amounts of data contradict the claim, because they blend together information about kinds with information about specific individuals, in haphazard ways.
