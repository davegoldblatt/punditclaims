    public_excerpt: Google’s Minerva, for example, can generalize what it knows about arithmetic to two digit multiplication problems, but fails altogether at multiplication problems that it hasn’t seen before that involve four digit times four digits (imagine a pocket calculator that was equally lousy). Despite its success on small problems, Minerva has no abstract idea what multiplication is.
