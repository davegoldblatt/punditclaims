    public_excerpt: Per my own analysis, NVIDIA’s predicted $1 trillion in Blackwell and Vera Rubin GPU sales (by the end of 2027) represents around 40GW of data center capacity, which will, assuming a PUE of 1.35, result in around 30GW of usable capacity. At a cost of around $12 million a megawatt, that works out to around $435 billion in global annual compute revenue to make these data centers necessary.
