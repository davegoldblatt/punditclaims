assessment_axis: historical_observation
explicit_source_elements:
  - has trained
  - a massive amount of copyrighted material
  - without consent
  - in many instances without compensation
evaluator_interpretation:
  - This describes cumulative training completed by publication, not a single quarter or only the latest model.
  - The ordinary reading of massive is large-scale use across substantial corpora, rather than isolated works. No exact count is imposed.
  - Without consent means without affirmative authorization from the relevant rights holder; public accessibility is not itself such authorization.
  - The claim does not say that all training material was unlicensed or unpaid.
  - The factual assessment concerns training practices, not whether those practices legally infringed copyright.
  - This is a claim about content use and permission, not a quantified financial metric.
support_condition: Training disclosures and rights-holder records jointly establish substantial copyrighted training corpora, with many uses lacking affirmative permission and compensation.
contradiction_condition: Reliable records establish that the relevant copyrighted training corpora were comprehensively authorized and compensated, or that the claimed large-scale use did not occur.
measurement_requirements: Establish corpus scale, copyrighted content, authorization, and payment separately. Do not equate total training tokens with a count of unlicensed copyrighted works.
source_requirements: Company training disclosures and policies, research documentation, licensing records, and rights-holder evidence. Treat complaints as party assertions rather than judicial findings.
