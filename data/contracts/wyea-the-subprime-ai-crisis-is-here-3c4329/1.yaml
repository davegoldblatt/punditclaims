explicit_source_elements:
  - pumping off-peak usage
  - immediately cutting it just before introducing peak hours
  - further muddies the water
  - how much actual access you get
evaluator_interpretation:
  - The checkable claim is about the policy sequence and its effect on subscribers' ability to determine their available access.
  - Swindle is evaluative rhetoric; this assessment does not infer fraud or deliberate deception.
  - I use March 13–31, covering the two-week promotion and changes discussed in the post.
  - Less access and less ascertainable access are distinct. The causal claim requires evidence of the latter compared with the prior policy.
support_condition: Dated policies establish the asserted sequence, and comparative disclosures or reproducible usage evidence show that the overlapping changes made available subscription access harder to determine.
contradiction_condition: Dated records refute the asserted sequence, or comparable evidence shows that the changes did not reduce ascertainability. A chronology error alone does not settle the whole causal assertion.
measurement_requirements: Compare plan, model, workload, session and weekly limits before and after the changes; distinguish promotion expiry, peak-hour restrictions and bugs.
source_requirements: Contemporaneous policy announcements and archived terms, supplemented by reproducible usage measurements or clearly identified user reports.
