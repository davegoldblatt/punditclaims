  - "'Untrustworthy' sets no threshold for error rates."
  - "'Massive subsidies' for coding is not quantified and names no company."
  - The speaker named no period for this ongoing-state claim. The 2025-01-01 to 2026-03-03 window is the evaluator's choice.
