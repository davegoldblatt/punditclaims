explicit_source_elements:
  - nobody has actually built
  - a 1GW data center
  - a campus of multiple buildings networked together
  - yet
evaluator_interpretation:
  - The plain reading is that no single campus worldwide had at least 1,000 MW of commissioned, operational data-center capacity by publication.
  - The surrounding discussion makes completed shells, proposed capacity and partially commissioned projects insufficient.
  - I read the threshold as total facility power capacity. Critical IT power and instantaneous electricity consumption are different measures.
  - The observation concerns the publication-time state. I use May 1–12, 2026 as the current reporting interval, ending on publication; earlier snapshots provide context rather than direct evidence of that interval.
support_condition: A sufficiently comprehensive, dated survey or equivalent operating records establishes that every plausible gigawatt campus remained below 1,000 MW of operational facility capacity at publication.
contradiction_condition: Reliable dated records establish at least one single campus with 1,000 MW or more of commissioned, operational facility capacity by publication.
measurement_requirements: Identify campus boundaries, commissioning status, capacity date and whether MW measures total facility power or critical IT power. Do not substitute planned electrical supply or generator nameplate capacity.
source_requirements: Prefer operator commissioning disclosures, utility or regulatory records, and independently documented operating-capacity estimates. A global negative requires coverage beyond a few selected campuses.
