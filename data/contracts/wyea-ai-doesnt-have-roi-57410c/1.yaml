assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI, Anthropic and other AI companies
  - actively conspired
  - mislead the world about the true costs of AI
  - working great right up until
  - charging what it actually cost
evaluator_interpretation:
  - The plain reading alleges knowing coordination between companies to deceive customers about costs, not merely similar pricing strategies or independent promotional claims.
  - The claim also alleges that the deception succeeded and ended when companies attempted cost-covering billing.
  - The surrounding references to the last few years and Q1 2026 billing changes place the alleged conduct in the period approximately June 2022 through the post.
  - This is principally an allegation about coordinated conduct and intent, rather than a specified financial amount.
support_condition: Authenticated communications, admissions, or substantiated investigative findings establish coordinated cost deception involving the named companies, customer deception resulting from it, and the claimed transition to attempted cost-covering charges.
contradiction_condition: A sufficiently comprehensive documentary record or substantiated investigation affirmatively disproves the alleged coordination or establishes that the claimed deception and billing sequence did not occur.
measurement_requirements: Identify participants, communications, misleading representations, customer effects, billing dates, and the cost definition used to determine whether charges covered costs.
source_requirements: Prefer authenticated company records, court evidence, regulatory findings, and contemporaneous contracts. Allegations, parallel conduct, and missing disclosures alone are insufficient.
