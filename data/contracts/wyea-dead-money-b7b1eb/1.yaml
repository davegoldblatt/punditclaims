assessment_axis: historical_observation
explicit_source_elements:
  - I estimate
  - since 2023
  - around $800 billion
  - global venture capital investment in AI companies
  - at least $266 billion
  - Anthropic and OpenAI
evaluator_interpretation:
  - The period runs from January 1, 2023 through publication on September 29, 2026.
  - The dollar amounts are read as US dollars.
  - The plain reading is cumulative venture financing into AI companies, including corporate participation in venture rounds. It excludes valuation, revenue, acquisitions, public-market issuance and unrelated borrowing.
  - "Both components must hold: the global total must reasonably approximate $800 billion and the combined Anthropic/OpenAI amount must reach $266 billion."
  - "'Around' allows ordinary rounding but supplies no exact tolerance. A borderline result must not be decided by inventing a favorable or unfavorable tolerance."
  - "'I estimate' is a qualification of the observation, not a conditional antecedent."
  - Announced round commitments must be distinguished from cash actually received, and overlapping commitments must not be counted twice.
support_condition: A consistently defined, deduplicated financing dataset for the target period gives a global AI venture total reasonably close to $800 billion and at least $266 billion for Anthropic and OpenAI combined.
contradiction_condition: A sufficiently complete dataset on the same basis establishes a global total materially inconsistent with approximately $800 billion, or a combined Anthropic/OpenAI total below $266 billion.
measurement_requirements: Use consistent company classification, geography, financing types, currency conversion and recognition dates across 2023 through September 29, 2026. Reconcile round extensions, corporate investments, staged funding and earlier commitments.
source_requirements: A dated PitchBook, Crunchbase or comparable deal-level dataset, checked against company and investor financing disclosures. Quarterly totals extending beyond publication are context unless adjusted to the target cutoff.
