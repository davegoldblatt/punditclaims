assessment_axis: causal_assessment
explicit_source_elements:
  - Driverless cars
  - many years longer than we were originally told
  - outliers (AKA edge cases)
  - at least so far
  - prevented them from making the transition from demo to widely-available reality
evaluator_interpretation:
  - Driverless means operating without an onboard human responsible for driving. Driver-assistance products do not qualify.
  - Widely available means broad, routine public access beyond a small number of geographically or operationally restricted services.
  - The causal reading is that edge cases were a material obstacle to wider deployment, not necessarily the only obstacle.
  - The retrospective comparison runs from earlier rollout promises through December 30, 2022. Its starting date is unspecified because Marcus identifies no original promise.
  - At least so far limits the historical assertion; it is not a conditional forecast.
  - The claim permits limited real services to exist. A literal assertion that every driverless operation remained a demonstration would be stronger than the wording about wide availability.
support_condition: Contemporary records document rollout expectations missed by multiple years, public deployment still restricted by publication, and credible operational accounts linking unusual driving situations to difficulties expanding deployment.
contradiction_condition: Records establish broad routine driverless availability on the earlier schedules, or demonstrate that edge cases were not a material obstacle to the claimed deployment delays.
measurement_requirements: Compare promised dates with actual driverless deployment, distinguishing public services from tests and driver assistance. Examine geographic, access, weather, and operating restrictions, and evidence connecting edge cases to operational limitations.
source_requirements: Prefer original company statements, regulatory permissions, and operational records. Reputable contemporaneous reporting may establish earlier promises and industry explanations where original records cannot be verified.
