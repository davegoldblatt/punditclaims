explicit_source_elements:
  - his fudges to the Senate about OpenAI equity
  - he has indirect equity, which he failed to mention
  - owns an OpenAI VC firm that trades on the company name that he failed to mention
  - his lies about Helen Toner
  - his embarrassing lies about Scarlett Johansson
evaluator_interpretation:
  - Assess the three named incidents separately, rather than treating a general reputation for dishonesty as proof.
  - Read “fudges” as a materially incomplete or misleading answer about financial interests. It does not necessarily allege perjury.
  - Read “lies” as knowingly false representations. An accusation, resemblance between voices, or an ambiguous promotional reference does not alone establish knowledge of falsity.
  - The Toner component concerns representations to other board members while seeking her removal. The Johansson component concerns the denial that Sky was intended to resemble her.
  - The target period spans the May 16, 2023 Senate testimony through publication on May 21, 2024. Later sources may establish facts about those events.
  - The parenthetical “owns” could describe ownership at publication or the interest omitted at the earlier hearing. Both readings must be distinguished.
  - This is a claim about personal interests and candor, not a quantified company financial metric; metric_scope is null.
support_condition: Records establish a materially misleading equity answer or omission at the Senate hearing, knowingly false statements about Toner, and a knowingly false denial concerning intentional resemblance to Johansson.
contradiction_condition: Reliable records establish that a named representation was accurate or that a material factual premise was false. Partial findings must identify the affected component and cannot settle the remaining allegations.
measurement_requirements: Compare the actual statements with contemporaneous interests, communications and casting records. Distinguish direct equity, indirect investment, legal control and personal economic benefit.
source_requirements: Prefer hearing records, contemporaneous disclosures and communications, casting documentation, and firsthand accounts. Identify interested-party testimony and use independent reporting where underlying records are unavailable.
