condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Every further step does not identify a unit of expansion.
  - Collapse and worse have no specified measures or dates.
  - Dangerous and reckless have no stated threshold.
  - Experimental capacity and actual harmful experiments differ.
  - The comparison against which causation is asserted is unstated.
