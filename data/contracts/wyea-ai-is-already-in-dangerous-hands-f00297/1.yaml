assessment_axis: causal_assessment
explicit_source_elements:
  - not the right path
  - every further step down it makes the bubble’s collapse worse
  - multiplying the dangerous and reckless experiments
  - thanks to their near-unlimited access to compute
evaluator_interpretation:
  - Not the right path is a value judgment and is not separately scored.
  - The ordinary causal reading is that continued expansion of the described AI development strategy increases eventual collapse damage and capacity for dangerous experiments, compared with not undertaking that expansion.
  - Capacity to conduct experiments is distinct from the number actually conducted.
  - Near-unlimited is read as unusually abundant access, not literally infinite compute.
  - The claim presupposes a collapse but gives no date. Growth in commitments alone cannot establish either an eventual collapse or greater damage caused by each expansion.
support_condition: Evidence identifies continued expansion and establishes that it causes greater collapse damage and increased dangerous experimental capacity relative to a credible comparison without that expansion.
contradiction_condition: A well-established counterexample shows a relevant expansion reducing or leaving unchanged a claimed consequence, or causal evidence rejects the asserted relationship.
measurement_requirements: Define the expansion, financial damage and experimental capability; distinguish correlation from causation and account for improvements in safeguards, efficiency and productive returns.
source_requirements: Primary financial-risk analysis, experimental records and credible causal comparisons. Investment announcements or incidents alone are insufficient.
