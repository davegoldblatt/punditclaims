assessment_axis: historical_observation
explicit_source_elements:
  - every time
  - the revenues and costs get reported
  - the revenues seem lower
  - the costs seem higher
evaluator_interpretation:
  - The surrounding discussion identifies OpenAI and Anthropic as the relevant AI labs.
  - I read lower and higher as comparisons with earlier expectations for the same reporting period. Comparing annualized revenue with realized revenue would not test this claim.
  - I use calendar 2025, the latest completed reporting year before the post. The speaker does not specify a reporting period.
  - The single metric_scope records the revenue limb. A clear exception to that limb can contradict the universal wording without resolving the separate cost limb.
  - This assesses a claimed reporting pattern, not whether the speaker sincerely had this impression.
support_condition: Comparable successive reports consistently reduce expected or reported revenue and increase total costs for the same period.
contradiction_condition: A credible report identifies realized revenue above an earlier same-period revenue target, or a comparable downward revision to total costs.
measurement_requirements: Match company, reporting year, revenue recognition basis, currency and realized versus annualized figures. Do not substitute cash burn for total expenses.
source_requirements: Prefer financial records. Reporting based on private financial information is admissible as an estimate when public primary records are unavailable.
metric_scope:
  company: OpenAI and Anthropic
  metric: Revenue
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
