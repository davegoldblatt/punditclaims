evaluator_interpretation:
  - The ordinary reading is that economically valuable solutions to demanding practical problems were insufficient to justify the technology's costs.
  - The surrounding discussion concerns model development and operation costs. Customer subscription prices alone therefore do not measure the relevant full costs.
  - "For this ongoing economic observation without a reporting period, use the latest completed calendar quarter before publication: April through June 2024."
  - An individual useful task does not by itself establish that the technology's full costs are justified. Conversely, provider losses do not prove an absence of valuable solutions.
support_condition: Representative evidence for the target period shows that benefits from solving demanding practical problems were insufficient to cover the associated development, operation, deployment and oversight costs.
contradiction_condition: Documented deployments in the target period show substantial complex problems being solved with benefits exceeding the relevant full costs, with enough coverage to address the broad claim.
measurement_requirements: Measure realized task outcomes and economic benefits against a credible alternative, including implementation, human review, failures and an explicit allocation of model development and operation costs.
source_requirements: Deployment records, credible field studies and transparent cost accounting. Benchmarks, projected savings and subscription prices alone are insufficient.
