evaluator_interpretation:
  - Whether the problems generative AI solves 'justify' its costs is a value judgment. He gives no measure of which problems count as 'complex', or what benefit would count as justifying the costs.
  - Any test would require the evaluator to choose the problems, the benefits and the cost allocation. No ordinary plain reading settles these choices, so the claim is not scored.
  - His related, measurable point about money (OpenAI losing money) is assessed in separate claims from this post.
support_condition: Not scored. It would need an agreed standard for 'complex problems' and for when benefits 'justify' costs.
contradiction_condition: Not scored, for the same reason.
