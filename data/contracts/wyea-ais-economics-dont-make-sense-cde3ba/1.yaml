assessment_axis: forecast_outcome
explicit_source_elements:
  - recent aggressive rate limit changes
  - mere months after multiple aggressive marketing campaigns
  - experiences that are now near-impossible
  - intends to start removing services
  - lower-tier $20-a-month subscribers
  - at some time in the future
evaluator_interpretation:
  - Treat the future service-removal assertion as an open-ended forecast; assess its historical marketing premise separately within the same record.
  - The ordinary reading is withdrawal of an ongoing included service from existing Pro subscriptions. A rate adjustment, temporary experiment or expiration of an explicitly temporary promotion does not necessarily establish that.
  - A documented decision to remove such a service can establish intent before implementation. Later conduct does not by itself prove what management intended on April 28.
  - For the historical premise, use the recent months through publication. 'Near-impossible' requires identifiable advertised tasks and comparable usage tests, not complaints alone.
  - Routine replacement of a model with a successor is ambiguous under 'removing services'; it is not automatically treated as withdrawal of the service.
support_condition: A dated, confirmed decision or implemented change withdraws an ongoing included service from existing $20 Pro subscribers. The historical clause additionally requires a matching campaign timeline and evidence that the advertised experience became largely infeasible under the changed limits.
contradiction_condition: Direct evidence can contradict the historical premise or the asserted contemporaneous intent. Continued service availability for a finite period cannot disprove an unlimited future forecast.
measurement_requirements: Compare dated plan entitlements and limits, distinguish existing customers from signup tests, and identify whether access was ongoing, promotional, replaced or moved behind additional payment.
source_requirements: Official plan notices, release notes or reliable contemporaneous reporting. Any announcement must be available by October 28, 2026; later implementation cannot be counted.
metric_scope: null
original_horizon: at some time in the future
horizon_interval:
  start: 2026-04-28
  end: null
  precision: day
target_period:
  start: 2026-01-01
  end: 2026-04-28
  precision: day
condition_status: not_applicable
early_resolution_rule: Resolve early only on a confirmed post-publication decision or actual withdrawal of an ongoing included Pro service affecting existing subscribers. Signup experiments, paused proposals and clearly temporary promotions are insufficient by themselves.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The claim combines a historical premise, an inference about intent and an unlimited future forecast.
  - Services are not identified.
  - The distinction between ongoing entitlements and promotions is evaluator interpretation.
  - Marketing campaigns and advertised experiences are not specifically identified.
  - "'Near-impossible' has no numerical threshold."
  - The historical period is inferred from 'recent' and 'mere months'.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
