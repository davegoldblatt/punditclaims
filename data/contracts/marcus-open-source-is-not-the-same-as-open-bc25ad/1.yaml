explicit_source_elements:
  - not releasing the raw data
  - not revealing how they preprocessed that data
  - not revealing the exact algorithms and parameters
  - used in training
evaluator_interpretation:
  - Assess the ongoing release practice as of August 10, 2026.
  - Read open-weight contrastively as releases without the complete training pipeline, excluding the fully open examples Marcus explicitly distinguishes.
  - Raw data means the original training corpus, not a summary of its sources.
  - Exact algorithms and parameters means the original training procedure and settings, not the trained weights.
  - The context suggests a missing reproducible recipe. Keep that reading separate from the stronger literal assertion that preprocessing methods are not disclosed at all.
support_condition: Representative releases omit the raw training corpus and enough original preprocessing and training details to prevent reconstruction of the complete recipe.
contradiction_condition: Representative in-scope releases provide the claimed missing materials. For the stronger literal reading, substantive published preprocessing methods would contradict the assertion of nondisclosure.
measurement_requirements: Inspect dated release inventories and technical documentation separately for raw data, preprocessing descriptions, executable preprocessing code, training algorithms and training settings.
source_requirements: Primary model repositories, technical reports and training-data disclosures; distinguish descriptive summaries from complete reproducible artifacts.
