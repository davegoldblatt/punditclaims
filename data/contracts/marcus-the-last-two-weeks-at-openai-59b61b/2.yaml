evaluator_interpretation:
  - Meltdown means a substantial episode of abnormal, incoherent responses, not necessarily complete service unavailability.
  - Mostly unexplained means the principal cause remained publicly unexplained when the post appeared.
  - A concrete public account of the main failure mechanism can explain the incident without disclosing source code or every operational detail.
  - The question mark expressly makes six hours tentative. Duration is left unscored and cannot count against the claim.
support_condition: Contemporaneous records establish a substantial malfunction during the preceding fortnight, with its principal cause still publicly unexplained by February 29.
contradiction_condition: Reliable records show no such malfunction, or a substantive public explanation of its principal cause was available before the post. A duration different from six hours is not contradiction.
measurement_requirements: Assess occurrence and the explanation available by publication separately; do not score the uncertain duration.
source_requirements: Incident records and contemporaneous accounts, with a dated public explanation if one exists.
