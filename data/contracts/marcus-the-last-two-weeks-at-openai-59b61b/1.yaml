evaluator_interpretation:
  - Meltdown means a substantial malfunction producing abnormal responses; it does not require a complete outage.
  - The question mark makes six hours a tentative estimate, not an exact threshold.
  - Mostly unexplained is assessed against what was publicly explained by February 29, rather than only at the incident's onset.
  - A substantial explanation identifies a concrete failure mechanism; it need not disclose source code or every internal detail.
support_condition: A substantial malfunction occurred in the preceding fortnight, lasted roughly several hours, and still lacked a substantial public cause explanation by the post date.
contradiction_condition: Records show no substantial malfunction, a clearly incompatible duration, or a substantial public explanation already available by the post date. Different results for these components warrant mixed.
measurement_requirements: Separate user-impact duration from investigation, monitoring, and administrative closure timestamps.
source_requirements: Prefer OpenAI's incident timeline and dated explanation; use contemporary reporting to establish observed symptoms and initial uncertainty.
