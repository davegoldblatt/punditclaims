explicit_source_elements:
  - Half of the US economy’s growth
  - came from building data centers for generative AI
  - combined revenue
  - a little more than
  - smart watch industry in 2024
evaluator_interpretation:
  - Read economic growth as real GDP growth, following the immediately preceding reference to Q2 2025.
  - The context mentions multipliers, so the growth assertion may include indirect effects as well as construction and equipment expenditure.
  - Read the revenue comparison as worldwide industry revenue, with smartwatch revenue explicitly referring to 2024.
  - "The period envelope covers the two components: 2024 smartwatch revenue and Q2 2025 GDP growth. For the undated current generative-AI revenue statement, use the latest completed quarter, Q2 2025, while retaining the missing annual or cumulative basis as a gap."
  - ‘A little more’ means a modest excess; the speaker provides no numerical tolerance.
support_condition: A transparent Q2 2025 attribution puts generative-AI data-center buildout near half of US real GDP growth, and comparable industry revenue records show generative AI modestly exceeding 2024 smartwatch revenue.
contradiction_condition: A measurement covering the claimed activities and effects places the GDP contribution materially away from half, or a consistently defined revenue comparison clearly fails the modest-excess description.
measurement_requirements: Separate generative AI from other data-center uses, construction from equipment and software, and direct accounting contributions from modeled indirect effects. Specify the generative-AI revenue period and prevent supply-chain revenue double counting.
source_requirements: BEA and Census data with a transparent attribution method, plus independently documented industry revenue totals.
