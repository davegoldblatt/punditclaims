explicit_source_elements:
  - their expected compute spend
  - as much revenue as Microsoft, Google and Amazon
  - in the next four years
  - if they don’t
  - hyperscalers will not meet analyst and investor expectations
evaluator_interpretation:
  - The four-year horizon ends on August 11, 2030.
  - Revenue ordinarily means realized annual company revenue, not an annualized monthly run rate, financing, or valuation.
  - A provisional collective reading compares the labs' combined annual revenue with the named companies' combined annual revenue. The wording does not settle this against an individual-company comparison.
  - The comparator year and whether Google means Alphabet or a narrower business are unspecified.
  - Expectations should be those identifiable at publication for the relevant future results, rather than estimates revised after the outcomes.
  - The hyperscaler forecast's antecedent is failure to reach the revenue threshold within four years; a shortfall in 2026 cannot establish that antecedent.
support_condition: After fixing the comparison and expectations measures, the labs fail to reach the stated revenue threshold by the deadline and the named hyperscalers miss the corresponding expectations. Establishing that the revenue level was necessary also requires a financing and compute-cost analysis.
contradiction_condition: The labs remain below the agreed revenue threshold through the deadline while the named hyperscalers meet the relevant expectations, or the labs demonstrably finance and fulfill the expected compute spending without the claimed revenue scale.
measurement_requirements: Use comparable realized annual revenues and identify the comparator year, aggregation, accounting treatment, expectation metrics, and forecast vintage before scoring.
source_requirements: Financial statements for the labs and hyperscalers, documented compute obligations, and archived analyst consensus or clearly identified investor expectations.
