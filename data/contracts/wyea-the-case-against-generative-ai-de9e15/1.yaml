assessment_axis: forecast_outcome
explicit_source_elements:
  - The longer that OpenAI survives
  - sap the remaining billions from the tech ecosystem
  - extend its tendrils to private credit
evaluator_interpretation:
  - The plain financial reading is continued substantial capital raising followed by access to private-credit financing.
  - Private credit means privately negotiated nonbank lending. Equity supplied by a firm that also manages credit funds does not qualify by itself.
  - Financing specifically tied to an OpenAI project can qualify, but generic supplier borrowing cannot.
  - "'Sap' also suggests harm to other firms. Fundraising alone cannot establish that causal crowding-out effect."
  - Continued survival is a description of the forecast's duration, not a separate trigger. No deadline is stated.
support_condition: Dated records establish continued substantial capital commitments to OpenAI and executed private-credit financing for OpenAI or an identified OpenAI project. Any claimed harm to other firms additionally requires evidence of displaced financing.
contradiction_condition: A decisive terminal event ends OpenAI and its relevant financing activity without entry into private credit. Failure to find borrowing during an arbitrary interval is insufficient.
measurement_requirements: Identify borrower, lender, financing instrument, execution date and connection to OpenAI. Separate committed capital from cash received, private credit from bank loans, and equity from debt.
source_requirements: Prefer executed agreements, filings and borrower or lender disclosures. Reports of talks are context, not proof of completed financing.
