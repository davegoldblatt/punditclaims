support_condition: No defensible binary condition can be specified without supplying the missing rate, capability scale, and causal mechanism.
contradiction_condition: No defensible binary condition can be specified without the same additions. Observing a later milestone would not by itself identify what caused it.
measurement_requirements: A defined incremental improvement process and a validated mapping from its accumulated gains to the scenario's milestones would be necessary.
source_requirements: Measurements would need to identify the contribution of the specified incremental process, rather than aggregate progress across changing models and methods.
