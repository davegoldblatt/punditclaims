assessment_axis: forecast_outcome
explicit_source_elements:
  - at some point
  - Anthropic and OpenAI
  - will be left with a bunch of compute reservations
  - they don't need and can't afford
  - due to miss-timed growth projections
evaluator_interpretation:
  - "Plain reading: each company ends up holding committed compute it cannot use and cannot pay for, because demand grew more slowly than planned."
  - Signs would include write-downs, cancellation or resale of committed capacity, payment defaults, or the company itself saying it has unneeded capacity it cannot afford.
  - Dropping talks on a deal that was never signed, or shifting how compute is sourced, does not by itself meet this.
support_condition: A dated disclosure or credible report that OpenAI or Anthropic holds committed compute that is surplus to demand and that it cannot afford, tied to growth that fell short of plans.
contradiction_condition: No deadline, so it cannot be contradicted outright. Evidence that both companies remain capacity-constrained and can pay their commitments argues against it for now.
measurement_requirements: Compute utilization, impairments, cancellations, or payment defaults tied to commitments, with the stated reason.
source_requirements: Company filings (for example S-1s), company statements, or reputable reporting.
metric_scope: null
original_horizon: at some point
horizon_interval:
  start: 2026-03-31
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Supported early if a filing or credible report shows OpenAI or Anthropic writing down, cancelling, reselling, or defaulting on committed compute because demand fell short of projections and it cannot pay. Both companies are named; one company meeting this would count as partial.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'At some point' sets no deadline."
  - Unclear whether both companies must end up in this state or whether one is enough.
retrospective_or_prospective: retrospective
