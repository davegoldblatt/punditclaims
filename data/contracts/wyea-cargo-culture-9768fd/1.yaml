assessment_axis: historical_observation
explicit_source_elements:
  - combined to less than $20 billion in annual revenue in 2025
  - 89% of all AI startup revenues
  - spent at least $30 billion on compute
  - Microsoft Azure, Google Cloud and Amazon Web Services
evaluator_interpretation:
  - "Read the sentence as three claims about calendar 2025: combined realized revenue, its share of all AI-startup revenue, and combined realized compute spending with the three named providers."
  - Annual revenue means recognized revenue for the year, not an annualized monthly run rate.
  - Read 89% as a whole-percentage-point rounded share, requiring a defined and adequately covered AI-startup population.
  - Do not count multi-year commitments, financing, total research expense, or total operating expense as realized cloud-compute spending.
  - The percentage links to press analysis and therefore has an estimate basis. The revenue and compute clauses identify no accounting basis; the compound financial scope is consequently unknown rather than silently assigning one basis to all three measures.
support_condition: Comparable evidence establishes combined realized 2025 revenue below $20 billion, a share rounding to 89% of a defined all-AI-startup revenue total, and at least $30 billion actually spent on compute with the named providers.
contradiction_condition: Comparable same-period evidence establishes combined revenue at least $20 billion, a materially different sector share, or combined spending below $30 billion. A different-year run-rate statistic alone does not establish the actual 2025 share.
measurement_requirements: Separate company annual revenues and provider-specific compute expenses or cash payments, reconciled before aggregation; a defined sector denominator; consistent revenue recognition and gross/net treatment.
source_requirements: Prefer company financial records and provider disclosures. Use press or research estimates only with their measurement basis, population, and limitations retained.
