assessment_axis: historical_observation
explicit_source_elements:
  - there’s so much demand for AI services
  - not actually true when you remove OpenAI and Anthropic
evaluator_interpretation:
  - Assess the parenthetical demand claim, not the separate assertion about every article.
  - The plain commercial reading is that realized demand remaining outside OpenAI and Anthropic is small. A finding that demand exists would not alone contradict that claim.
  - Exclude those companies' own purchases and demand for their models resold through other providers. The post does not clearly distinguish these two exclusions.
  - Use April–June 2026, the latest completed calendar quarter whose results could have been reported before publication.
  - Substantial paid adoption or consumption could contradict the ordinary reading. Free usage, downloads and total cloud revenue alone do not measure the remaining commercial demand.
support_condition: Credible measurements show that commercial AI-service demand remaining after the exclusions is small across the market.
contradiction_condition: Credible measurements show substantial realized paid AI-service adoption or consumption outside the excluded companies and their resold services.
measurement_requirements: Separate paid consumption from free usage, internal workloads, bookings and forecasts. Identify providers, ultimate customers and models sufficiently to avoid counting OpenAI or Anthropic through intermediaries.
source_requirements: Prefer provider disclosures and independent transaction or usage measurements with clear coverage and exclusions.
metric_scope: null
original_horizon: null
horizon_interval: null
