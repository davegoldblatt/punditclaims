  start: 2026-04-01
  end: 2026-06-30
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No quantitative threshold for much demand.
  - Removing OpenAI and Anthropic could mean removing providers, infrastructure customers, or both.
  - Demand could mean usage, paid consumption, or demand sufficient to justify the proposed buildout.
  - The latest completed calendar quarter is an evaluator-selected observation period.
