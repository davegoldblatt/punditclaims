explicit_source_elements:
  - scale actually makes the covert racism worse
evaluator_interpretation:
  - In this study discussion, 'scale' means model parameter count and 'worse' means stronger negative dialect associations.
  - The claim is read as a trend within the examined models, including comparable sizes within model families. It is not a universal law covering every future model or training method.
  - The reference to Birhane is background attribution, not a separate claim being graded.
support_condition: Comparisons involving otherwise comparable model sizes show stronger covert dialect prejudice as size increases.
contradiction_condition: Comparable scaling comparisons show consistently weaker covert prejudice, or demonstrate that the reported worsening disappears when model-family differences are accounted for.
measurement_requirements: Use the same dialect-prejudice measure across sizes. Examine architecture, training-data comparability, and whether the result is pooled across families.
source_requirements: The study’s scaling methods and results, supplemented by direct explanations from its researchers.
