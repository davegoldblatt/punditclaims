assessment_axis: historical_observation
explicit_source_elements:
  - current AI cannot learn without a tendency
  - inadvertently regurgitate big bits of text and images
  - look uncannily like their sources
  - not a logical necessity
evaluator_interpretation:
  - Current AI refers to contemporary text and image generators in the surrounding discussion.
  - Substantial reproduction means identifiable passages or near-duplicate images, rather than short common phrases or general stylistic resemblance.
  - The plain reading includes both an observed copying tendency and the stronger assertion that contemporary learning cannot avoid that tendency.
  - Deliberate extraction establishes susceptibility but does not measure accidental reproduction during ordinary use.
  - "The reporting window is the latest completed calendar research year and elapsed days before publication: 2023-01-01 through 2024-01-08."
support_condition: Research demonstrates substantial source reproduction in contemporary text and image generators and establishes that the tendency cannot be avoided while retaining useful learning under contemporary methods.
contradiction_condition: A contemporary learning method demonstrably avoids the relevant copying tendency while retaining useful learning. Merely reducing leakage or failing to find copies is insufficient.
measurement_requirements: Compare outputs with actual training material, distinguish extraction attacks from ordinary use, and distinguish probabilistic privacy guarantees from an absolute prohibition on matching output.
source_requirements: Reproducible memorization studies and documented learning methods, with appropriate qualifications about what their tests or guarantees establish.
