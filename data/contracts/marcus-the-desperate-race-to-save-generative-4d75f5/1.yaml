ambiguity_flags:
  - Cannot learn without may express practical susceptibility or a universal requirement.
  - Inadvertently could mean unintended by developers or unprompted during ordinary use.
  - Big bits and tendency have no quantitative thresholds.
  - The observation period uses an evaluator-selected annual research reporting window.
