explicit_source_elements:
  - LLMs
  - can’t be trusted
  - to run anything on their own
evaluator_interpretation:
  - The plain reading is a universal claim about practical autonomous operation, not a requirement that software never make an error.
  - A counterexample must reliably execute a defined workflow without case-by-case human approval or correction. Ordinary setup, maintenance and monitoring are allowed.
  - Marketing a workflow as automated or recording unanswered conversations as resolved does not itself establish reliability.
  - For this ongoing capability observation, use May 2026, the latest complete month before the post. No reporting cadence is specified, so this period choice is an evaluator interpretation.
support_condition: Broad operational evidence establishes that no relevant class of defined LLM workflow meets a reasonable task-specific reliability standard without case-by-case human supervision.
contradiction_condition: At least one production workflow in the target period demonstrably operates without case-by-case human supervision and meets a documented, task-appropriate standard for successful completion and errors.
measurement_requirements: Report task scope, total attempts, independently checked outcomes, errors, escalation and human intervention. Separate autonomous successful completion from silent abandonment.
source_requirements: Prefer operational evaluations or transparent deployment records with outcome validation. Vendor claims and customer anecdotes require corroboration.
