explicit_source_elements:
  - driverless will come
  - eventually
evaluator_interpretation:
  - The plain reading is that driverless cars become an established, usable transport service.
  - Because the surrounding passage acknowledges existing driverless activity and discusses reliability, a demonstration or first limited pilot is insufficient.
  - I treat sustained commercial service across multiple cities, at substantial recurring passenger volume and with measured real-world safety performance, as practical arrival.
  - Marcus does not require universal geographic coverage, private ownership, zero crashes, or the absence of all remote assistance.
  - The adjacent claim about eventually being safer than humans informs the context but is not treated as a separate universal safety guarantee.
support_condition: Documented deployments establish sustained public commercial transport without a supervising driver, at substantial recurring scale, accompanied by real-world evidence supporting practical reliability.
contradiction_condition: Decisive evidence establishes that driverless transport as described is impossible. Failure to reach it by any unstated date does not contradict eventual arrival.
measurement_requirements: Use completed passenger service and observed safety outcomes. Distinguish actual deployment from permits, announced plans, supervised driving, and demonstrations.
source_requirements: Dated operator deployment records, regulatory records, and empirical safety studies with disclosed operating scope and human comparison methods.
metric_scope: null
original_horizon: eventually
