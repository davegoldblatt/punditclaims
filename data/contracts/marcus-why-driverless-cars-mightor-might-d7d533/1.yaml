  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve supported when a dated record establishes sustained commercial driverless service at substantial recurring scale across multiple cities, with already available real-world safety evidence supporting practical reliability.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
