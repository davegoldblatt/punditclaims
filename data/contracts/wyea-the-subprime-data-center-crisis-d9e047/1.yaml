assessment_axis: forecast_outcome
explicit_source_elements:
  - The scenario I’m talking about
  - the vast majority of AI data centers go unused
  - 80% or more
  - funds invested in AI data center debt will be lost
evaluator_interpretation:
  - "This is a conditional forecast: the widespread non-use scenario must occur before its loss prediction can be scored."
  - Unused means actual operating capacity without meaningful compute use; leased space and signed contracts are imperfect proxies.
  - Loss is read as aggregate invested debt principal not recovered after payments and recoveries, rather than a temporary fall in traded bond prices.
  - The denominator is debt investment in the relevant AI data-center population, not equity investment or all technology-company debt.
  - No deadline, currency, accounting basis, numerical definition of vast majority, or duration of non-use is supplied.
support_condition: After the widespread non-use condition is established, aggregate irreversible principal losses reach at least 80% of invested debt principal for the relevant population.
contradiction_condition: After the condition is established, final repayments and recoveries show aggregate principal losses below 80%.
measurement_requirements: Representative actual utilization data and a matched debt population with invested principal, repayments, write-offs, guarantees and recoveries. Calculate principal loss divided by invested principal without double-counting refinancings.
source_requirements: Independent utilization measurements, borrower and trustee records, insolvency recoveries, and a transparent aggregate loss calculation.
metric_scope:
  company: AI data center debt projects, sector aggregate
  metric: Cumulative invested debt principal lost after repayments and recoveries
  currency: null
  units: percent of invested debt principal
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
