evaluator_interpretation:
  - "Plain reading: in 2025, AI systems could do a real share of workplace tasks, but often could not complete whole jobs or projects end to end, and often fell short of experienced professionals' quality or judgment."
  - The period is the state of AI around the post, read as calendar 2025. Capability tests of the models available then were published in September–October 2025.
support_condition: 2025 evaluations show AI matching humans on a meaningful share of tasks, while failing on many whole projects or falling short of experts on a large share of tasks.
contradiction_condition: 2025 evaluations show AI routinely completing whole junior roles end to end and matching senior professionals on nearly all tasks, or doing almost none of the work.
measurement_requirements: Benchmarks of AI on real work tasks and end-to-end projects, compared with human professionals.
