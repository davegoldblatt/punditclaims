evaluator_interpretation:
  - The statement concerns collaboration after the May 16, 2023 hearing and through publication on June 11, 2026.
  - The knowledge qualification is part of the claim. Marcus expresses his understanding that Altman had done nothing with Durbin on this subject; he does not assert independently verified absence of collaboration.
  - A public record of collaboration would establish activity, but would not by itself establish that Marcus knew about it. An unsuccessful search would establish neither absence of collaboration nor Marcus’s state of knowledge.
support_condition: Independent evidence would need to establish that Marcus’s qualified account accurately represented his knowledge at publication. Public silence alone is insufficient.
contradiction_condition: Evidence would need to establish relevant collaboration and that Marcus knew of it before publication. The existence or public availability of collaboration records alone would not contradict the knowledge qualification.
measurement_requirements: Preserve the distinction between collaboration occurring, collaboration being publicly documented, and Marcus knowing about it.
source_requirements: Independent, dated records of relevant collaboration and evidence establishing Marcus’s contemporaneous knowledge. His own assertion cannot independently verify itself.
