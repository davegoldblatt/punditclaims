explicit_source_elements:
  - SoftBank's exposure to OpenAI
  - materially harming the company
  - financial condition will likely deteriorate
  - plans to add debt
evaluator_interpretation:
  - In the surrounding financing and ratings discussion, the plain reading is that OpenAI exposure is already materially weakening SoftBank Group's credit profile or financial flexibility.
  - An adverse formal credit-outlook action attributable materially to that exposure counts as harm to the credit profile. It does not establish realized investment losses.
  - The current-state assessment uses the latest pre-publication credit-assessment window, April 1–14, 2025. Later financial outcomes cannot establish this contemporaneous claim.
  - OpenAI exposure need not be the sole cause, but must be a material identified contributor.
support_condition: A contemporaneous credit assessment, financing record or financial disclosure documents material deterioration and identifies OpenAI exposure as a material cause.
contradiction_condition: Contemporaneous evidence establishes that the alleged deterioration did not occur or was attributable to other factors without a material contribution from OpenAI exposure.
measurement_requirements: Distinguish actual rating or outlook actions from forecasts of future deterioration. Separate SoftBank Group from its listed telecommunications subsidiary.
source_requirements: Prefer the rating agency's own assessment or SoftBank Group financial disclosures, with an explicit causal explanation.
