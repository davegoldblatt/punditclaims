  - $325 billion
  - over 4 years
  - exceeds the available private capital in the world
evaluator_interpretation:
  - "The surrounding discussion of investment firms' available capital makes worldwide private-capital dry powder the ordinary measure: committed capital not yet deployed."
  - This assesses the comparison with $325 billion, not the separate accuracy of the estimated NVIDIA-related cost.
  - "'Over 4 years' describes the proposed expenditure schedule, not a condition or a four-year forecast of global capital availability."
  - For the ongoing capital-stock observation, I use Q2 2025, the most recent completed reporting quarter before September 29, 2025.
  - Available global capital does not mean capital whose owners would be willing or permitted to invest it all in OpenAI.
support_condition: Comparable worldwide private-capital dry powder in Q2 2025 was below $325 billion.
contradiction_condition: Comparable worldwide private-capital dry powder in Q2 2025 was at least $325 billion.
measurement_requirements: Measure uncalled investment commitments in USD. Do not substitute total assets under management, annual fundraising, invested assets or a single manager's cash balance.
source_requirements: Prefer global private-market data providers and their documented estimates. Later publications may establish the earlier target-period stock if available by the evaluation date.
