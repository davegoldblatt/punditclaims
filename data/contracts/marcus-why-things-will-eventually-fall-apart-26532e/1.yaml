assessment_axis: forecast_outcome
explicit_source_elements:
  - Nobody knows when this will all collapse
  - "2026"
  - will be remembered in hindsight
  - retail investors and index funds
  - left holding the bag
evaluator_interpretation:
  - The ordinary reading is that 2026 places substantial AI-related investment exposure with retail investors and index funds, leaving them to bear material losses from a subsequent correction.
  - Holding the bag requires evidence of burdensome investment losses, not merely buying shares or experiencing ordinary volatility.
  - 2026 dates the exposure or loss-bearing episode. Marcus expressly leaves the ultimate collapse date unknown, so losses need not all be realized by December 31.
  - The horizon ends December 31, 2026 for the named year; further hindsight may still be needed after that date.
  - Unknown collapse timing is a timing qualification, not a separate conditional antecedent.
  - The assessment tests the underlying investment outcome, not whether future commentators literally remember the year this way.
support_condition: Ownership and investment-flow records establish substantial 2026 exposure for both retail investors and index funds, with material subsequent losses attributable to that exposure and evidence supporting the claimed transfer of downside to those holders.
contradiction_condition: Complete records for the 2026 episode and its subsequent resolution show no substantial transfer of such exposure to both groups, or establish that the relevant holdings did not leave them bearing material losses. A short-term rally is insufficient.
measurement_requirements: Define the relevant AI-related investments transparently; match 2026 purchases and ownership to acquisition costs, distributions, disposals, and subsequent values. Avoid selecting only losing shares or confusing company losses with investor losses.
source_requirements: Offering and ownership filings, index and fund records, reliable retail investment-flow measurements, and security-level return data.
metric_scope: null
original_horizon: "2026"
horizon_interval:
  start: 2026-06-02
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Early support requires a completed 2026 exposure-transfer episode with substantial realized or otherwise irreversible losses for both retail investors and index funds. Early contradiction requires a terminal event that rules out the claimed 2026 episode. Isolated drawdowns, IPO plans, and unrealized gains are insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Holding the bag has no numerical loss threshold.
  - The investment universe and scale of exposure are unspecified.
  - 2026 may date the transfer of exposure rather than the eventual collapse.
  - The hindsight assessment has no stated date.
  - Retail investors and index funds are broad groups with different purchase prices and returns.
retrospective_or_prospective: prospective
