assessment_axis: historical_observation
explicit_source_elements:
  - a company of a few hundred people
  - just got a $14 billion investment
  - from their biggest competitor
  - just after said competitor laid off 10,000 people
evaluator_interpretation:
  - The linked CNBC investment report identifies Microsoft and the January 2023 transaction. Classify the monetary figure as an estimate based on press reporting, rather than an audited accounting figure.
  - Read 'just got an investment' as securing the newly announced investment commitment, rather than receiving its entire value in cash immediately.
  - Read 'a few hundred people' as direct employee headcount. Contractors are a material qualification.
  - Read 'laid off 10,000 people' as shorthand for the announced layoff program. Whether all departures had already occurred is assessed separately as a limitation.
  - Use January 1 through February 6, 2023 for the recent transaction, layoff announcement, and staffing state described in the post. No quarter-based financial reporting period is implied.
  - Treat 'biggest competitor' as identifying Microsoft in this context. The post supplies no market or metric for an ordinal ranking of Google's competitors.
support_condition: The January investment commitment was approximately US$14 billion, OpenAI had a few hundred direct employees, and Microsoft's 10,000-job layoff announcement shortly preceded the investment announcement.
contradiction_condition: Reliable evidence places that same investment materially away from US$14 billion, places direct employee headcount outside the ordinary meaning of a few hundred, or disproves the asserted announcement sequence. A mixed outcome identifies supported and contradicted components separately.
measurement_requirements: Separate the new investment from cumulative funding, valuation, and cash already transferred. Separate employees from contractors and announced job cuts from completed departures.
source_requirements: Prefer company announcements and filings for announcement dates and terms. Use clearly identified reporting for undisclosed transaction amounts and historical staffing.
