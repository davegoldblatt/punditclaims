evaluator_interpretation:
  - The ordinary reading is that congressional investigation into Huang and the surrounding national-security controversy continues despite the assurances accompanying reinstatement.
  - Formal continuation of an investigative interview or hearing process counts; a completed hearing or finding of wrongdoing is not required.
  - A generic demand that somebody investigate would not alone meet this test.
  - The nearby statement about prominence throughout next year is not imported as a deadline for this separate continuation claim.
support_condition: A congressional body formally opens or affirmatively continues a relevant investigative process after reinstatement and the accompanying assurances.
contradiction_condition: A decisive official record establishes that the relevant investigation has been permanently foreclosed. Temporary inactivity or cancellation of one appearance is insufficient.
measurement_requirements: Verify the official action, its connection to Huang and the controversy, and whether it follows reinstatement. Distinguish scheduled proceedings from completed testimony.
source_requirements: Official committee notices, correspondence or statements documenting investigative action; dated reporting may corroborate when a notice became public.
