plain_reading: true
ambiguity_flags:
  - No deadline.
  - "'A lot of things' does not enumerate subjects."
  - Continuing an investigative process is distinguishable from actually receiving future testimony.
  - The supplied post has no precise publication time for ordering same-day developments.
