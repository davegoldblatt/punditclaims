explicit_source_elements:
  - It’s a pattern.
  - his fudges to the Senate
  - his lies about Helen Toner
  - his embarrassing lies about Scarlett Johansson
evaluator_interpretation:
  - The ordinary reading is repeated material deception across the preceding examples, not simply repeated controversy.
  - A pattern requires at least two distinct, sufficiently established instances. It need not establish that every cited example is correct.
  - The reference to earlier examples supplies scope, not a conditional forecast.
  - The historical period covers the Senate testimony through the post. Later conduct cannot independently establish the pattern asserted at publication.
  - Personal candor is the assessed subject; metric_scope is null.
support_condition: At least two of the named episodes are established as material deception through records, admissions or sufficiently corroborated accounts.
contradiction_condition: Reliable records resolve the named episodes such that fewer than two involved material deception. Failure to prove an episode is not itself proof that no pattern existed.
measurement_requirements: Separate omissions, mistaken statements, disputed recollections and deliberate falsehoods. Do not count repeated reporting of one allegation as separate corroboration.
source_requirements: Use the underlying exchanges and independently corroborated accounts, with both participant allegations and contrary evidence represented.
