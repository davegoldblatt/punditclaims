assessment_axis: causal_assessment
explicit_source_elements:
  - Artists and creators, and now influencers
  - careers wrecked
  - software that trades on their work
  - in many cases
  - not paying for that work
evaluator_interpretation:
  - Careers wrecked means severe damage to the ability to sustain a creative livelihood, not merely exposure to risk or any income decline.
  - The claim joins career harm attributable to exploitation of creators' work with recurring uncompensated model training.
  - The historical window covers the recent harms described in the post, from 2023 through publication. Subsequent damage cannot establish that careers were already wrecked.
  - In many cases does not mean that every training use was unpaid.
support_condition: Evidence establishes severe livelihood damage caused by generative software exploiting creators' work, together with recurring unpaid training uses.
contradiction_condition: Direct evidence refutes the alleged causal career damage or establishes that the purported recurring unpaid uses were compensated.
measurement_requirements: Separate short-term earnings changes, impersonation and distress from severe career damage; connect the harm to the asserted use of creators' work.
source_requirements: Prefer employment research, documented creator histories, training records and compensation evidence. Treat litigants' allegations as allegations.
