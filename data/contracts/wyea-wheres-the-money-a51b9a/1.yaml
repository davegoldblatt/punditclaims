assessment_axis: causal_assessment
explicit_source_elements:
  - Large Language Models
  - raise money for OpenAI
  - by lying about what they’re capable of doing
  - starting with calling them “artificial intelligence.”
evaluator_interpretation:
  - The checkable core is that OpenAI obtained investment through materially false capability representations that it knew were false.
  - Calling something artificial intelligence does not, by itself, specify a promise of consciousness, human intelligence, or error-free performance.
  - The retrospective phrase 'have been used' covers fundraising before publication; the passage supplies no starting date.
  - The claim concerns deceptive fundraising conduct, not a specified financial amount.
support_condition: Dated fundraising representations, contemporaneous capability evidence, and records of knowledge and investor reliance establish that OpenAI raised money through knowingly false material capability claims.
contradiction_condition: A sufficiently complete record of the fundraising representations at issue establishes that the alleged material capability claims were accurate or appropriately qualified, and that the asserted deception did not occur.
measurement_requirements: Match each alleged representation to the model, product, date, promised task, actual performance, and qualifications presented to investors.
source_requirements: Investor materials, communications, reproducible evaluations, or adjudicated findings. Product failures alone cannot establish knowing deception or its fundraising effect.
