assessment_axis: historical_observation
explicit_source_elements:
  - CoreWeave needs to raise more debt
  - to build its data centers
evaluator_interpretation:
  - The ordinary reading is that the disclosed construction program requires further borrowing under the financing plan in place, including additional draws under existing facilities.
  - This does not require proving that every hypothetical equity-funded alternative is impossible.
  - Use April 1 through June 30, 2026, the latest reported quarter before the post, for the ongoing financial state.
  - The surrounding analyst borrowing estimates indicate an estimated financing requirement, rather than an audited accounting measure.
  - Expected or preferred borrowing alone does not establish a funding shortfall that requires debt.
support_condition: The latest reported cash resources, expected operating cash flows, construction commitments and committed non-debt financing establish a funding gap requiring additional borrowing under the disclosed program.
contradiction_condition: The same-period records establish that cash, expected operating cash flows and committed non-debt financing cover the disclosed construction program without additional borrowing.
measurement_requirements: A dated sources-and-uses schedule matching construction payments to unrestricted cash, operating cash generation, customer prepayments, committed equity and debt draws. Separate unused borrowing capacity from cash already raised.
source_requirements: Latest pre-post financial statements, construction commitments and financing plans; analyst estimates may supplement but must distinguish expected borrowing from required borrowing.
