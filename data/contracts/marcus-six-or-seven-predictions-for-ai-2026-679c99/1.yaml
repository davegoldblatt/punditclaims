assessment_axis: historical_observation
explicit_source_elements:
  - Few AI companies
  - aside from Nvidia
  - are making a profit
  - nobody has much of a technical moat
evaluator_interpretation:
  - Few means a small minority, not none. Marcus provides no company universe or numerical cutoff.
  - Profit ordinarily means bottom-line company profit, not revenue, financing, gross margin or cash flow.
  - For the ongoing financial observation, I use July–September 2025, the latest completed calendar quarter ordinarily reportable before the post. Individual fiscal calendars can differ.
  - The same quarterly observation window is used for available evidence about technical advantages; it cannot establish every company's December position.
  - A technical moat means a substantial, durable advantage that competitors cannot readily reproduce. Close benchmark scores alone do not establish its absence.
  - Aside from Nvidia is an exclusion, not a conditional antecedent. Grammatically it modifies profitability, but readers might extend it to the moat clause.
support_condition: Comparable profit evidence for a representative, defined population shows only a small minority profitable, and evidence across that population shows no substantial durable technical advantage. The accounting basis must first be established.
contradiction_condition: Comparable evidence shows profitability is common in the defined population, or establishes a substantial durable technical advantage at an included company. Individual profitable examples do not alone refute few.
measurement_requirements: Define the company population and few threshold; align reporting periods and profit accounting. Assess replication barriers and durability separately from benchmark rankings.
source_requirements: Company filings or comparable financial disclosures, plus technical and competitive evidence. Analyst moat assessments are informative judgments rather than conclusive measurements.
