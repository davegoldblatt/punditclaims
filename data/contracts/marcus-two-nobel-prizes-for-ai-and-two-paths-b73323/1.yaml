explicit_source_elements:
  - Hassabis has quietly been advancing neurosymbolic AI
  - including the recent AlphaGeometry work
  - far less dogmatic than Hinton
evaluator_interpretation:
  - The technical component concerns published systems combining neural models with explicit symbolic reasoning.
  - Advancement through a research organization need not mean personally inventing every component.
  - The full proposition also makes a comparative character judgment. Participation in hybrid research does not supply a non-arbitrary measure of how much less dogmatic someone is.
  - "'Quietly' is treated as rhetorical emphasis, not a measurable publicity threshold."
support_condition: Published hybrid systems can establish the technical component. Supporting the whole proposition would additionally require a defensible meaning and comparison standard for 'far less dogmatic', which the source does not supply.
contradiction_condition: Technical records could disprove the characterization of AlphaGeometry. A contrary ranking of personal dogmatism cannot be established without adding an evaluative standard.
measurement_requirements: No ordinary, objective scale establishes the comparative character judgment. Research choices can illustrate it but cannot determine its truth.
source_requirements: Original system documentation for the technical component; comparable public records would be relevant to a narrower claim about research choices.
