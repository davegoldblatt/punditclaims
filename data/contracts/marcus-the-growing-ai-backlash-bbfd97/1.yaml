ambiguity_flags:
  - No common population, geography, baseline, or magnitude is specified.
  - Undermining education could mean particular harmful uses or an aggregate deterioration.
  - Slop, unwanted, and over-leveraged lack operational definitions.
  - Increasing could mean enabling additional incidents or increasing population-level rates.
  - The four-year period is inferred from the surrounding comparison.
  - The recession-risk clause supplies neither a probability nor a deadline.
