assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s training and inference costs
  - in 2024
  - were around $7 billion
evaluator_interpretation:
  - The ordinary reading is expenditure attributable to calendar 2024, not a forecast made during that year.
  - The post cites press estimates, so the accounting basis is estimate.
  - Around $7 billion allows ordinary approximation, but does not license substituting all research spending or annualized commitments for training and inference expenditure.
  - Training may include preparatory runs and related model work; the source does not precisely delimit those costs.
support_condition: Reliable retrospective estimates or records place combined calendar-2024 training and inference expenditure near $7 billion on a consistent scope.
contradiction_condition: Reliable retrospective evidence places that same expenditure materially away from $7 billion, with uncertainty small enough to exclude ordinary approximation.
measurement_requirements: A completed-year total separating training, inference, other research, staffing and capital expenditure, with amortization and cloud credits explained.
source_requirements: Company financial records or reliable retrospective reporting. In-year projections can explain the claim's origin but cannot alone establish the realized annual total.
