explicit_source_elements:
  - no other path to making this revenue without OpenAI
  - these projects
  - entirely financed and paid for
  - using the projected cashflow of the data centers themselves
evaluator_interpretation:
  - This revenue refers to the Oracle Stargate campus revenue discussed in the passage, not all Oracle revenue.
  - The ordinary reading asserts both exclusive dependence on OpenAI for that revenue and exclusive dependence on campus cash flows for financing and repayment.
  - Use the latest reported Oracle fiscal quarter before the post, December 2025 through February 2026, for the ongoing financial state.
  - Distinguish project financing secured by lease income from corporate borrowing and equity. The existence of debt or equity alone does not prove that its economic repayment is independent of campus income.
  - The words specify no accounting basis for this financial-structure assertion; record unknown rather than assigning one.
support_condition: Customer contracts and financing agreements establish OpenAI as the sole feasible source of the specified revenue and campus cash flows as the exclusive financing and repayment support.
contradiction_condition: Project-specific evidence establishes another viable revenue route or financing and repayment support independent of those campus cash flows.
measurement_requirements: Identify each referenced campus, its customer and tenant, funding sources, guarantees, lender recourse and repayment obligations.
source_requirements: Executed customer, lease and financing agreements or sufficiently detailed disclosures. Oracle-wide customer lists do not establish alternative tenants for Stargate campuses.
