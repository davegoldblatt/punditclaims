ambiguity_flags:
  - The ongoing annual statement names no reporting period; calendar 2025 is an evaluator choice.
  - Losses could mean net losses, operating losses, adjusted losses, or cash burn.
  - The accounting basis underlying the press-based assertion is unspecified.
  - "'The AI labs' does not identify a complete population."
  - "'Horribly' supplies no numerical profitability threshold."
