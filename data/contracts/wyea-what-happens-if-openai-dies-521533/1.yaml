assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic loses billions of dollars a year
  - the AI labs are horribly unprofitable
evaluator_interpretation:
  - Read 'billions of dollars a year' as an annual net loss of at least USD 2 billion.
  - Use calendar 2025, the latest completed annual period before publication. The surrounding passage also compares OpenAI's 2025 results.
  - Read 'the AI labs' as Anthropic and OpenAI, the two labs discussed in the passage, rather than every company developing AI.
  - Read 'horribly unprofitable' as substantial company-wide annual losses, without assigning a precise loss-margin threshold.
  - Use estimate as the claim's accounting basis because the passage relies on financial reporting in the press. It does not specify GAAP, adjusted earnings, or a reconciliation between them.
  - Assess the financial proposition supplied for grading, not the separate allegation that Reuters omitted information.
support_condition: Comparable annual financial evidence establishes Anthropic's net loss of at least USD 2 billion in 2025 and substantial annual losses at both Anthropic and OpenAI, on the financial basis implied by the claim.
contradiction_condition: Comparable evidence establishes that Anthropic's 2025 annual net loss was below USD 2 billion, or that either named lab was profitable on the same annual financial basis.
measurement_requirements: Separate annual net loss, operating loss, adjusted earnings, and cash burn. Do not annualize one quarter or substitute revenue run rate for annual results.
source_requirements: Prefer financial statements. Independently verified financial reporting is acceptable where public statements are unavailable. The speaker's own reporting cannot independently establish the outcome.
metric_scope:
  company: Anthropic
  metric: annual net loss
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
