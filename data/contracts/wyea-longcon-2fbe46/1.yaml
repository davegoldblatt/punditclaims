  - So has OpenAI's
evaluator_interpretation:
  - Burn means annual net cash consumption, excluding financing proceeds, rather than accounting losses or gross spending.
  - Every single year requires consecutive annual comparisons for each company through 2024, the last completed year before the post.
  - The starting year is unspecified. I leave it open rather than select a short series that could establish only a weaker claim.
  - The surrounding discussion relies on press reports, so the claimed financial basis is estimate.
support_condition: Comparable annual cash-burn figures establish an increase in every successive year for both companies through 2024.
contradiction_condition: A comparable annual cash-burn series establishes at least one year without an increase for either company during the claimed historical period.
measurement_requirements: Separate annual series for each company, with consistent treatment of cloud credits, prepaid computing, capital expenditure and other noncash or timing adjustments. Accounting losses and partial-year burn cannot substitute for annual cash burn.
source_requirements: Financial records or reliable reporting that identifies the cash-burn measure and annual periods. The speaker's own writing is not outcome evidence.
