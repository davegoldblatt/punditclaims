assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic’s burn increased every single year
  - So has OpenAI's
evaluator_interpretation:
  - "'Burn' is read broadly, in line with the author's usage in the passage, which includes non-cash costs. Annual net loss, operating loss or operating cash outflow each count as a measure of burn. A year-on-year rise on the measure available for each pair of years counts as an increase."
  - "'Every single year' covers each year-to-year change from the company's founding or first operating years up to 2024, the last full year before the post. For Anthropic that is 2021 to 2024. For OpenAI it is at least 2021 to 2024, the period of its commercial scale-up for which figures are reported."
  - The claim is graded supported only if every year-to-year change in that span can be shown to be an increase. One documented decrease contradicts it. Missing years leave it unresolved.
support_condition: For both companies, reported annual burn (losses or cash outflow) rose in every year-to-year change through 2024.
contradiction_condition: For either company, a reported annual burn figure fell from one year to the next before or in 2024.
measurement_requirements: Consistent annual figures for each year through 2024 for both companies.
source_requirements: Filings or audited statements preferred. Reputable news reports otherwise.
