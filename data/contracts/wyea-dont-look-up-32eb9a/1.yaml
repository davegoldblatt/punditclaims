explicit_source_elements:
  - AI was paying off
  - Microsoft, Google, Amazon, or Meta
  - was wrong
  - the capex was well-spent
evaluator_interpretation:
  - The ordinary financial reading is that AI investments had not produced economic benefits commensurate with their costs. Merely generating revenue is insufficient to establish that capital was well spent.
  - Use April–June 2026, the latest completed reporting quarter before publication, to assess the ongoing payoff from prior investment.
  - Do not require long-lived facilities to recover their entire purchase cost in one quarter.
  - Well-spent includes a judgment about investment quality. Assess its financial component without inventing a required return or payback deadline.
  - The claim supplies no accounting basis for AI investment returns; mark it unknown.
support_condition: Comparable AI-attributable benefits and costs establish inadequate returns at all four companies under a clearly justified investment-return measure.
contradiction_condition: Matched evidence establishes adequate realized AI investment returns at at least one named company. Product usage, revenue growth or company-wide profits alone are insufficient.
measurement_requirements: AI-attributable incremental revenue, savings and profits; allocated operating costs and capital consumption; investment timing and a justified return benchmark.
source_requirements: Prefer attributable financial disclosures or credible causal estimates. Separate management descriptions of product benefits from measured investment returns.
