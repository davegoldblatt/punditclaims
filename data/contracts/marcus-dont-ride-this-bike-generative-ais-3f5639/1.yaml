explicit_source_elements:
  - current technology
  - quite poor at such sanity checks
  - New technology may be needed.
evaluator_interpretation:
  - Sanity checks means detecting whether a generated image satisfies its prompt and subsequent corrective feedback.
  - The plain reading concerns practical reliability on the compositional and part-related tasks discussed in the post.
  - Current refers to technology available by December 8, 2024. Research has no standard quarterly reporting period, so the observation window is the latest reporting year to date.
  - The suggestion that new technology may be needed expresses a possibility, not a separately resolvable forecast.
support_condition: Direct evaluations show frequent failures to detect prompt and feedback violations in images generated by contemporary systems.
contradiction_condition: Direct evaluations show reliable detection of those violations across the relevant compositional and part-related tasks.
measurement_requirements: Compare model judgments with independently checked image constraints. Distinguish mismatch detection from image generation quality, relative image ranking, and successful editing.
source_requirements: Primary evaluations of systems available by the post date, with methods and human validation. Evidence must have been available by October 28, 2026.
