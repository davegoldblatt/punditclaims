assessment_axis: historical_observation
explicit_source_elements:
  - in many instances good at memorizing factoids
  - systematically unreliable at tracking events that unfold over time
evaluator_interpretation:
  - The scope is GPT-3 and comparable contemporary language models.
  - Memorizing factoids is read as successfully answering factual questions from learned knowledge; it does not establish a particular internal storage mechanism.
  - Tracking events means updating locations, possessions, quantities or other states as a narrative progresses.
  - Systematically unreliable means recurring failures across controlled cases, not inability to solve any case.
  - The ongoing observation is assessed over the latest completed calendar year and 2022 through publication.
support_condition: Contemporary evaluations show useful factual knowledge alongside repeated failures to update or preserve narrative states.
contradiction_condition: Representative contemporary models reliably track changing narrative states across controlled tasks, or the asserted factual-recall strength is absent.
measurement_requirements: Use controlled event sequences and factual-knowledge evaluations. Distinguish unaided models from systems supplied with external state trackers; do not compare unlike benchmark scores as a numerical effect size.
source_requirements: Primary evaluations identifying models, prompts, tasks and any external reasoning components.
