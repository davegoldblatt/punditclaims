assessment_axis: forecast_outcome
explicit_source_elements:
  - coders
  - software architects
  - on their way out
evaluator_interpretation:
  - In context, the plain reading rejects AI-driven obsolescence of these occupations and the disappearance of the need for their expertise.
  - It does not promise unchanged employment, wages, hiring, or task composition.
  - Neither this sentence nor the surrounding word 'soon' supplies a calendar deadline. I do not import the separate next-year game-development reference.
  - Employment is relevant but must be combined with evidence about continuing work and AI's causal role.
support_condition: Across an agreed assessment horizon, representative employment and production evidence establishes a continuing substantive need for coders and software architects despite AI adoption.
contradiction_condition: Representative employment and production evidence establishes durable, broad obsolescence of coders and software architects caused by AI, rather than isolated layoffs or changing job titles.
measurement_requirements: Track relevant occupations and actual duties across sectors, distinguish seniority groups, and separate AI effects from other causes of employment changes.
source_requirements: Prefer official employment series, transparent payroll studies, and documented software-production practices. Employment projections are expectations, not realized outcomes.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A decisive, dated demonstration of broad and durable AI-driven occupational obsolescence can contradict the forecast. Continued employment at one date cannot establish an indefinite negative forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - "'On their way out' could mean eventual obsolescence or a declining employment trajectory."
  - "'Coders' and 'software architects' do not map exactly onto a single statistical occupation."
  - No geographic scope or employment threshold is stated.
retrospective_or_prospective: retrospective
