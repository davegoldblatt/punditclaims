ambiguity_flags:
  - Customers could mean casual chatbot users or developers with production integrations.
  - Easy switching has no stated cost or time threshold.
  - The preceding months have no exact starting date.
  - Cutting prices could mean introducing a cheaper model rather than repricing an existing model.
