explicit_source_elements:
  - Every poll I have seen
  - vast majority of the public
  - wanting AI regulation
  - I doubt people will be fond of selling fancy chips to China
evaluator_interpretation:
  - The checkable public component concerns American support for AI regulation in polling available before publication.
  - Use 2025 polling as the recent public-evidence window for the ongoing observation; this does not identify or exhaust the polls Marcus personally saw.
  - Two-thirds support is an evaluator benchmark for a large majority, not a threshold supplied by Marcus.
  - Support for some AI rules, support for government regulation, and support for a particular regulatory proposal are different measures.
  - The chip-sales clause expresses a doubt without a deadline or firm outcome commitment and is not separately scored as a forecast.
support_condition: The polls Marcus refers to can be identified, and their representative US results consistently show clear large majorities favoring AI regulation under comparable questions.
contradiction_condition: An identified poll within Marcus's stated set fails to show a clear large majority on a comparable regulation question. A poll outside that set cannot alone disprove his report of what he saw.
measurement_requirements: Record question wording, population, field dates, response options, and uncertainty. Do not equate private industry standards with government regulation.
source_requirements: Original poll releases or questionnaires published before the post, plus evidence identifying the polls encompassed by the personal qualifier.
