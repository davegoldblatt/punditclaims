assessment_axis: causal_assessment
explicit_source_elements:
  - some significant fraction
  - that science will be wrong
  - because of
  - inevitable tendency of LLMs to hallucinate
evaluator_interpretation:
  - Assess the causal generalization about science produced with LLM assistance; no deadline is supplied.
  - AI assistance defines the population being discussed, rather than a separate conditional forecast antecedent.
  - The plain reading requires a nontrivial share of scientific work to contain material falsehoods caused by LLM hallucinations.
  - Treat 'inevitable tendency' as a recurring failure risk, rather than a claim that every output must be false.
  - Errors in raw model answers and fabricated references are relevant, but do not alone establish the fraction of finished scientific work that is materially wrong.
support_condition: Representative audits of LLM-assisted scientific work establish a substantial paper-level rate of material falsehoods and connect those errors to LLM hallucinations.
contradiction_condition: Representative audits with adequate detection show that hallucination-caused material falsehoods are negligible in finished LLM-assisted scientific work, including after normal verification.
measurement_requirements: Identify the denominator of AI-assisted work, distinguish references from papers, assess error severity, and establish attribution rather than infer it solely from writing style.
source_requirements: Original audits or controlled studies with disclosed methods; include evidence about verification and successful scientific uses.
