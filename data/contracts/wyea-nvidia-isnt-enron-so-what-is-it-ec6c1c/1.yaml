assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA’s customers rely on debt to buy its GPUs
  - NVIDIA’s customers’ customers rely on debt to pay to rent them
evaluator_interpretation:
  - The ordinary reading is material dependence on borrowing among major participants at both levels of the compute chain, rather than a claim about every individual customer.
  - Debt dependence requires evidence of borrowing and its contribution to purchases or rental payments. An available credit line alone does not establish this.
  - Venture equity, customer receipts, existing cash and debt are separate funding sources.
  - For this ongoing observation, use July–September 2025, the latest completed calendar reporting quarter before the post.
  - The passage identifies credit facilities but supplies no accounting basis for measuring sector-wide dependence. The contract therefore records an unknown basis.
support_condition: Comparable records for major GPU buyers and compute renters show that borrowing materially funded purchases and rental payments during the target quarter, with insufficient alternative funding to sustain those expenditures.
contradiction_condition: Comparable records show that major participants at either level could and did fund the relevant expenditures without material dependence on borrowing.
measurement_requirements: Distinguish amounts borrowed from credit commitments, and debt proceeds from equity proceeds and operating cash receipts. Establish the funding mix and expenditure coverage at both levels.
source_requirements: Financial statements, borrowing disclosures and financing agreements. Company-specific examples cannot establish the entire chain's dependence.
