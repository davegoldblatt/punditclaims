original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A verified post-collapse counterexample can conclusively falsify one of the categorical assertions. Price changes or hobbyist uses before the antecedent do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
