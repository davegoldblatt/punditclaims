assessment_axis: forecast_outcome
explicit_source_elements:
  - when the bubble bursts
  - not going to be useful for hobbyists
  - nor will they be cheaper to run
  - nor will incomplete data centers be cheaper to finish
evaluator_interpretation:
  - The antecedent is a broad collapse in the AI investment and infrastructure market described in the post. An isolated company failure or regional stock decline does not automatically establish it.
  - The forecast concerns surplus NVIDIA data-center GPUs and unfinished data centers following that collapse.
  - Useful means practical hobbyist use. Running costs mean comparable operating expenses, excluding the hardware purchase price. Completion costs mean the remaining cost of finishing comparable projects.
  - No deadline or post-collapse observation period is supplied.
support_condition: After the antecedent is established, documented disposition and use of the surplus infrastructure, comparable GPU operating expenses, and remaining construction costs support all three assertions. A short period without counterexamples cannot conclusively establish an indefinite negative.
contradiction_condition: After the antecedent is established, documented practical hobbyist use of the surplus GPUs, lower comparable operating expenses, or lower comparable completion costs falsifies the corresponding assertion.
measurement_requirements: Identify the affected assets and collapse date. Compare operating expenses at equivalent workloads and completion costs at equivalent construction stages, specifications, locations, and purchasing power.
source_requirements: Dated evidence of the collapse, followed by documented deployments, operating-cost records, or comparable construction contracts and estimates.
