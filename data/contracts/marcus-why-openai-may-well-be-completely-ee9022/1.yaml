evaluator_interpretation:
  - A moat means a durable competitive protection, such as substantial switching costs, privileged access to scarce resources, or protected distribution. Merely possessing useful assets does not establish a moat.
  - The qualification expresses uncertainty about a checkable business assessment; it is not treated as a conditional forecast.
  - This describes OpenAI's competitive position on the post date. A market position can be observed contemporaneously, so the target is July 24, 2024, rather than a financial reporting quarter.
support_condition: Evidence establishes that customers had effective substitutes and that OpenAI lacked material competitive protection beyond its brand.
contradiction_condition: Evidence identifies at least one material, durable protection against competition that OpenAI possessed independently of brand recognition.
measurement_requirements: Evidence of actual switching burdens, barriers to comparable resource access, protected distribution, or sustained technical differentiation. Competitor availability alone cannot establish the absence of every moat.
source_requirements: Contemporaneous contracts, company disclosures, customer migration evidence, or independent competition analysis addressing OpenAI's position at the target date.
