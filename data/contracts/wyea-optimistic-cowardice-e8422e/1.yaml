assessment_axis: historical_observation
explicit_source_elements:
  - the largest tech companies
  - have burned hundreds of billions of dollars
  - to propagate software
  - doesn't really do anything that resembles what we think artificial intelligence looks like
evaluator_interpretation:
  - The monetary clause describes cumulative expenditure already incurred by the post date, not announced future budgets.
  - The ordinary minimum for hundreds of billions is USD 200 billion.
  - I read burned here as spent on developing and distributing generative AI, rather than a defined accounting loss.
  - The cumulative starting date and company roster are unspecified. Amazon, Alphabet, Microsoft and Meta are reasonable candidates, not a roster supplied by the speaker.
  - The capability clause invokes an unspecified conception of artificial intelligence. It cannot fairly be replaced with either a particular benchmark or a claim that the software has no useful applications.
support_condition: Comparable records establish at least USD 200 billion of cumulative expenditure attributable to generative AI by March 24, 2025. Supporting the entire sentence would additionally require an identifiable capability standard corresponding to the speaker's words.
contradiction_condition: Complete, comparable expenditure records place the aggregate below USD 200 billion, or evidence demonstrates the capabilities excluded by an identifiable standard supplied by the claim. A smaller partial total is insufficient.
measurement_requirements: Separate realized expenditure from planned expenditure, financial investments, accounting losses and general-purpose infrastructure. Avoid double-counting transactions between the companies.
source_requirements: Company filings and disclosures with an identifiable generative-AI allocation; independent measurements for any capability standard.
