assessment_axis: historical_observation
explicit_source_elements:
  - The people with the money
  - are not investing it as much as they used to
  - when they do, they are investing it in things
  - that suggest that they want to try and automate away labor
  - "context: venture capital, generative AI, early 2023"
evaluator_interpretation:
  - "'The people with the money' means venture and growth investors in startups, as the surrounding paragraphs about venture capital make clear."
  - "'Not investing it as much as they used to' is read as: venture funding deployed around the post date was clearly lower than in the recent boom (2021 to early 2022). No threshold was given, so any large and clear drop counts."
  - "He described an ongoing state without naming a period. I use the latest quarter public data could report on before the post: Q1 2023 (January to March 2023)."
  - "The second clause is hedged: the deals 'suggest' investors 'want to try' to automate labor. That is his reading of investor intent, and it is not scored. Following the reviewers' note, I do not try to prove or disprove intent with evidence about task automation."
  - "The factual core of the second clause that can be checked is narrow: the money that was invested leaned noticeably toward AI (the post frames generative AI as the job-taking technology). This is checked only as a secondary point, and 'when they do' is not read as 'all of it'."
support_condition: Venture-data trackers show Q1 2023 global venture funding well below the year-earlier or 2021 levels, and AI stands out as a growing or favored area of the money that was invested.
contradiction_condition: Trackers show Q1 2023 venture funding flat or up versus 2021 or early 2022 levels, or show AI getting a small or falling share of investment.
measurement_requirements: Global or US venture funding totals for Q1 2023 compared with Q1 2022 or 2021, from a recognized tracker (Crunchbase, CB Insights, PitchBook). AI's share of dollars invested in Q1 2023.
source_requirements: Venture-data trackers' own published reports. The speaker's own writing is not evidence.
metric_scope:
  company: Venture and growth investors (global startup funding)
  metric: Venture funding deployed into private startups
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2023-01-01
  period_end: 2023-03-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period:
  start: 2023-01
  end: 2023-03
  precision: month
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No period named; Q1 2023 (latest quarter before the post) chosen as the target period.
  - "'As much as they used to' gives no baseline; read as the 2021 to early-2022 boom."
  - The automation clause is a hedged reading of investor intent ('suggest', 'want to try') and is not scored on intent.
  - "'When they do' could be read as 'all of it' or 'a noticeable tilt'; the ordinary reading is a tilt."
retrospective_or_prospective: retrospective
