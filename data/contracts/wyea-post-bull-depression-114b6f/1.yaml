assessment_axis: historical_observation
explicit_source_elements:
  - The people with the money
  - not investing it as much as they used to
  - when they do
  - things that suggest that they want to try and automate away labor
evaluator_interpretation:
  - The surrounding discussion identifies venture investors as the subject.
  - I use the first quarter of 2023, the latest completed quarter reportable before publication, and compare investment with the preceding venture boom using the same quarter of 2022.
  - The ordinary reading is declining venture investment alongside meaningful investment in products intended to automate human work.
  - The words suggest and try permit an inference from funded products and stated purposes. They do not assert that layoffs had already occurred or that all investment went to automation.
  - Automation of work does not by itself establish an intention to eliminate entire jobs.
  - metric_scope is null because this is a sector-wide allocation claim, not a claim about a named company's finances.
support_condition: Comparable venture funding data show a substantial decline from the preceding boom, while contemporaneous funding and product disclosures show meaningful investment in tools designed to perform work otherwise done by people.
contradiction_condition: Comparable funding data show no decline, or representative funding and product evidence refutes the characterization that investors were backing labor-automating products.
measurement_requirements: Compare reported investment amounts on a consistent geographic and funding-stage basis. Check funded products' intended functions separately from their AI labels, and distinguish task automation from demonstrated job elimination.
source_requirements: Prefer an investment database's own analysis and contemporaneous company or investor announcements. Funding announcements establish investment and stated aims, not realized labor-market effects.
