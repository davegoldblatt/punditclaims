evaluator_interpretation:
  - The explicit alternative includes informal presidential reassurance about prosecution conveyed to Nvidia's board. It does not require a formal pardon or enforceable immunity.
  - Generic praise alone would not qualify; the reassurance must address potential legal exposure.
  - The claim concerns communications preceding the reinstatement announced on the post date; their starting date is unspecified.
  - The alternative wording is not a conditional antecedent.
support_condition: Verified communications establish a pardon offer or comparable reassurance concerning Huang's potential prosecution, conveyed to Nvidia's board in connection with reinstatement.
contradiction_condition: Reliable records establish that no such reassurance was conveyed, or that the purported exchange did not concern Huang and Nvidia.
measurement_requirements: Distinguish an actual pardon offer, binding immunity, and informal reassurance about legal exposure.
source_requirements: Prefer the original interview or official communications; reporting must identify what Trump told the board.
