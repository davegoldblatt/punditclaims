assessment_axis: causal_assessment
explicit_source_elements:
  - To reach level 3
  - Agents, systems that can take actions
  - you’d need a level of sentience
  - dependent on entirely new forms of mathematics
evaluator_interpretation:
  - This asserts a necessary technical prerequisite, not a forecast with a deadline.
  - I read level 3 operationally as a system taking actions on a user's behalf over several days.
  - Entirely new forms of mathematics means new mathematical foundations beyond established LLM computation and ordinary software orchestration, not every new algorithm or engineering improvement.
  - A documented counterexample to the mathematics requirement can contradict the combined necessity claim without proving that a system lacks subjective experience.
support_condition: A sound technical argument establishes that the specified agent capability requires sentience and that this sentience requires mathematical foundations unavailable when the claim was made.
contradiction_condition: A documented system performs the specified multi-day action-taking role using established LLM and software methods, without requiring the asserted new mathematical foundations.
measurement_requirements: Evidence of sustained action-taking over several days and a description of the system's implementation. Merely naming a product an agent is insufficient.
source_requirements: Primary implementation descriptions and demonstrations, with failures and human assistance disclosed.
