early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Sentience is undefined.
  - Entirely new forms of mathematics is undefined.
  - OpenAI's level-3 description does not specify a reliability threshold or certification procedure.
  - The result depends on an operational reading of level 3 rather than an unspecified stronger AGI milestone.
