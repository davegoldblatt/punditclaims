  - doubled, tripled, quadrupled down on generative AI
  - doesn't do much more than it did a few months ago
  - won't do much more than it can do now
evaluator_interpretation:
  - The testable core is the forecast that generative AI 'won't do much more than it can do now', with December 2024 as the baseline.
  - "Plain reading: no major new capability beyond December 2024 frontier models. A clear, independently verified jump on a hard task that frontier models could not do in December 2024 would contradict it."
  - "'Over-leveraged' is a vague financial characterization with no stated measure, so it is not scored."
support_condition: Through the evaluation date, generative AI models show no major capability beyond what December 2024 frontier models could do, on independent evaluations.
contradiction_condition: After December 3, 2024, generative AI models show an independently verified capability clearly beyond December 2024 models, such as gold-medal performance at the International Mathematical Olympiad or large measured gains in autonomous task length.
measurement_requirements: Independently graded results or benchmark trend measurements dated after December 2024, compared with the prior state of the art.
source_requirements: Official competition grading, independent evaluators such as METR, lab announcements confirmed by third parties.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled early as contradicted if, after December 3, 2024, a generative AI model achieves an independently certified result on a recognized hard task that no generative AI model achieved by December 2024, such as an officially graded IMO gold-medal score.
interpretation_determines_result: true
