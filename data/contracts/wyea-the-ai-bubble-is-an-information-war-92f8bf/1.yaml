explicit_source_elements:
  - In the end
  - I think it’ll come out
  - sources were lying
  - to multiple media outlets
  - about OpenAI’s burnrate
evaluator_interpretation:
  - Lying means knowingly supplying materially false information, rather than making an error or using a different financial measure.
  - Multiple media outlets means at least two distinct outlets.
  - The predicted event is a public revelation about the sourcing of burn-rate reports discussed in the post.
  - I think expresses uncertainty; it is not an antecedent condition.
support_condition: An admission, substantiated investigation, court finding, or authenticated documentary disclosure establishes that sources knowingly supplied materially false OpenAI burn-rate information to at least two media outlets.
contradiction_condition: A sufficiently complete investigation identifies the relevant communications and establishes that the challenged figures were accurate on their stated basis and that the alleged knowing deception did not occur.
measurement_requirements: Compare the same periods and cash-burn definitions, then separately establish knowledge of falsity and communication to multiple outlets. Financial discrepancies alone are insufficient.
source_requirements: Require authenticated communications, admissions, findings, or independently corroborated investigative reporting. The speaker's suspicions and differences between accounting losses and cash burn do not establish deception.
