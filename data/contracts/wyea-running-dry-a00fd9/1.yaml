evaluator_interpretation:
  - The plain reading is a broad end to the AI investment boom after both financing conditions occur, rather than an isolated funding failure or stock-market decline.
  - Both conditions must be established across a substantial part of the relevant market.
  - The speaker supplies neither a deadline nor a lag between financing exhaustion and the boom ending. No numerical threshold or observation window is imposed.
support_condition: Both financing conditions occur, followed by a clearly established end to the AI investment boom associated with that financing withdrawal.
contradiction_condition: Both financing conditions occur, but decisive evidence establishes that the investment boom continues through a durable replacement funding model. A short interval without collapse is insufficient.
measurement_requirements: Broad financing availability, completed investment, project cancellations and business failures; distinguish more expensive financing from unavailable financing.
source_requirements: Financing datasets and transaction records, supplemented by reporting on failed fundraising and investment cancellations.
