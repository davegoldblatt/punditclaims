  - made governments so covetous
  - allegedly like AGI
  - they have taken it by force
evaluator_interpretation:
  - The plain reading requires completed compulsory acquisition or access, not merely a threat to compel access.
  - Force can include legal or economic coercion; physical seizure is not required.
  - The surrounding passage identifies the US government's dispute with Anthropic as the principal example.
  - Doomer advocacy must have contributed materially to the government's decision. It need not have been the sole cause.
  - This concerns events completed by the post date; the source supplies no beginning date.
support_condition: Records establish that a government obtained AI technology or expanded access against its provider's wishes by March 2, 2026, and credible evidence connects that decision to advocacy portraying imminent AGI as exceptionally consequential.
contradiction_condition: Records establish that the alleged acquisition remained a threat or voluntary arrangement, or sufficiently direct evidence rules out the asserted causal contribution in the identified episode.
measurement_requirements: Distinguish demands, procurement exclusions, existing contractual access, compelled continuation of service, and completed compulsory acquisition.
source_requirements: Government orders, contracts, court records, and contemporaneous decision records. Statements by the supplier require attribution.
