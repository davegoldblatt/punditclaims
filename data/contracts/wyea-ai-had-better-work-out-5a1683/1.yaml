assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority
  - AI demand
  - selling services that do not make any economic sense
evaluator_interpretation:
  - "The surrounding discussion gives this otherwise evaluative phrase a testable reading: commercial AI spending predominantly supports services whose delivery costs exceed customer payments."
  - Measure demand by spending, because the argument concerns revenue and compute purchases. Do not substitute user counts or token volumes.
  - Use Q3 2026, the latest completed quarter before the post, for this ongoing observation.
  - Vast majority means a clear, large majority; the speaker supplies no defensible exact cutoff.
  - Company-wide losses, introductory subsidies, and losses on unusually heavy users do not by themselves establish negative economics across a service's customer base.
  - Avoid counting the same customer payment repeatedly as it passes through application providers, model labs, and infrastructure suppliers.
support_condition: Representative, spending-weighted evidence shows that a clear, large majority of commercial AI demand is generated by services whose aggregate delivery costs exceed their customer payments.
contradiction_condition: Representative evidence shows that most commercial AI spending is associated with services covering their delivery costs, leaving the asserted large majority untenable.
measurement_requirements: Market coverage, a consistent demand denominator, actual delivery costs and payments, and customer-level aggregation sufficient to distinguish typical economics from maximum allowances.
source_requirements: Representative financial or independent market data with disclosed sampling and cost allocation. Individual anecdotes are context only.
