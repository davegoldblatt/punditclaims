explicit_source_elements:
  - Fast forward to 2022
  - not a single radiologist has been replaced
  - Still true
evaluator_interpretation:
  - Still true extends the cumulative claim through March 10, 2024.
  - The ordinary reading concerns an actual radiologist's job being displaced by deep learning, anywhere in the world.
  - Automating readings, reducing workload, or avoiding future hiring does not by itself establish that an existing radiologist was replaced.
  - The target has no lower bound because the assertion is cumulative. The latest accessible pre-post UK census is used only as workforce context, not as worldwide proof.
support_condition: Evidence with sufficiently comprehensive coverage establishes that no individual radiologist's job had been displaced by deep learning through March 10, 2024.
contradiction_condition: One documented case establishes that deep learning displaced an actual radiologist from a job by March 10, 2024.
measurement_requirements: Identify the employer, displacement date, affected position, and evidence that deep learning caused the replacement. Aggregate employment growth cannot establish zero individual displacement.
source_requirements: Employer or employment records, official workforce evidence, or independently corroborated reporting of a specific replacement.
