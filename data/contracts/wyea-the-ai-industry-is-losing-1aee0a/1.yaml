  - the only revenue
  - compute spend from Anthropic and OpenAI
  - I estimate
  - 20% or more
  - cloud revenues for Google, Amazon, and Microsoft
evaluator_interpretation:
  - Use January through March 2026, the latest completed quarter publicly reportable before the June 30 post.
  - Read 20% or more as applying to each named provider; a combined-provider interpretation is also possible.
  - Treat exclusivity of GPU-generated revenue and the cloud-revenue percentage as separate assertions within this claim.
  - Author's estimate identifies the measurement basis; it is not a conditional antecedent.
  - Use recognized cloud revenue and corresponding customer compute charges, not funding, backlog, or annualized run rates.
support_condition: Matched records show that the specified GPUs generated revenue exclusively from the two labs and that their recognized compute purchases supplied at least 20% of each provider's cloud revenue during the target quarter.
contradiction_condition: Matched records show revenue from another customer on the specified GPUs, or establish a below-20% share for a named provider under the stated reading.
measurement_requirements: Provider-level quarterly customer charges and cloud-revenue denominators, with consistent recognition and gross/net treatment. Exclusivity requires actual paid use of the named GPU types.
source_requirements: Provider or customer financial records, supported by deployment records. Product availability alone does not establish realized revenue.
