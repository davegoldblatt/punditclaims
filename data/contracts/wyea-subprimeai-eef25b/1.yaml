assessment_axis: forecast_outcome
explicit_source_elements:
  - needs to raise at least $3 billion
  - more like $10 billion to survive
  - on course to lose $5 billion in 2024
evaluator_interpretation:
  - Treat $5 billion as an approximate annual loss estimate, rather than an exact-dollar prediction.
  - The surrounding discussion attributes the financial estimates to press reporting. The contract therefore uses estimate as its accounting basis.
  - The stated 2024 deadline applies to the loss forecast. The speaker supplies no separate survival deadline.
  - Raising money does not establish that the same amount was necessary for survival.
  - The structured metric scope describes the loss component. The financing-necessity component requires a separate cash and obligations analysis.
support_condition: Comparable realized 2024 losses are approximately $5 billion, and cash balances, obligations and financing records establish the claimed minimum funding need. Support for the whole claim requires both components.
contradiction_condition: Comparable 2024 losses materially differ from approximately $5 billion, or reliable liquidity records show that less than $3 billion of new financing was needed over the survival period intended by the speaker.
measurement_requirements: Reconcile the original loss estimate with the realized loss measure, including stock compensation, compute credits and ownership-related adjustments. Establish opening liquidity, mandatory payments and the survival period separately.
source_requirements: Prefer financial statements and financing disclosures. Independently verified reporting is acceptable where private-company records are unavailable.
