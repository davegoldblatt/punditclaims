assessment_axis: forecast_outcome
explicit_source_elements:
  - Hyperscalers
  - massive depreciation charges to look forward to
  - will eat their profits alive
evaluator_interpretation:
  - Use Microsoft, Alphabet, Amazon and Meta from the surrounding discussion.
  - The plain reading is that sharply higher depreciation will substantially erode net profits across the group, rather than merely appearing as an expense.
  - Net profits follows the surrounding reference to net income.
  - No numerical magnitude, deadline or accounting standard is expressly stated; company-reported financial results are implied.
  - The surrounding possibility of writing off GPUs is an alternative accounting outcome, not an antecedent that must occur.
support_condition: Realized post-publication results show large depreciation increases substantially eroding net profits across the named group, with the effect distinguished from other costs, taxes and investment gains or losses.
contradiction_condition: A finite period of strong profits does not disprove this undated forecast. Contradiction would require a decisive event eliminating the asserted future depreciation-and-profit outcome within the relevant investment cycle.
measurement_requirements: Track depreciation separately from amortization where possible, use net income rather than operating income or free cash flow, and reconcile other material drivers of profit changes.
source_requirements: Dated financial statements and company explanations of depreciation and net-profit changes; forecasts alone cannot establish realization.
metric_scope:
  company: Microsoft; Alphabet; Amazon; Meta
  metric: Future depreciation expense and attributable erosion of net income
  currency: null
  units: null
