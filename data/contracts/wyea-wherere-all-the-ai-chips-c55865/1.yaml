early_resolution_rule: Resolve early only when dated, realized post-publication financial results establish substantial net-profit erosion attributable to large depreciation increases across the named group. An increase in depreciation alone, one company's result or a profit decline caused mainly by other items does not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
