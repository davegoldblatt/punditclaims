ambiguity_flags:
  - "'Every' may be rhetorical overstatement aimed at model-heavy startups like OpenAI and Anthropic, but the words are universal."
  - "'AI startup' has no fixed definition. Gamma, a generative-AI presentation app, and Surge AI, an AI data-labeling firm, are both commonly called AI startups."
  - The basis for 'profitable' (net income, operating profit, cash flow) is not stated in the startup reports.
  - The target period is my choice (about a year before the post), because the claim describes a current state without naming a period.
