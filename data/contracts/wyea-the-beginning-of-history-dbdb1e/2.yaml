assessment_axis: historical_observation
explicit_source_elements:
  - Every AI startup
  - is unprofitable
  - which means they need to raise money from venture capitalists
evaluator_interpretation:
  - "Plain reading: the claim is universal. It says no AI startup makes a profit, so all of them depend on outside funding."
  - A single credible report of an AI startup that was profitable while the claim describes would contradict 'every'.
  - "'Unprofitable' is read in its ordinary sense: the company loses money as the company itself or credible reporting describes it. No specific accounting basis is required, because the speaker named none."
  - The claim describes an ongoing state at the time of the post (March 2026) and names no period. I use roughly the year before the post, 2025-01-01 to 2026-03-10, as the period public evidence could cover. Reports from that window inform the claim. No single quarter defines it.
support_condition: Credible reporting shows that AI startups as a class, including the prominent ones cited as profitable, were losing money in 2025 to early 2026, and no credible counterexample exists.
contradiction_condition: A credible company disclosure or reputable report shows at least one AI startup was profitable in 2025 to early 2026.
measurement_requirements: Profitability as the company reports it or as reputable press reports it, for any AI startup, in 2025 to early 2026.
source_requirements: Company announcements or reputable news reports of a named AI startup's profitability.
metric_scope:
  company: Any AI startup (e.g., Gamma, Surge AI)
  metric: Profitability (whether the company makes a profit)
  currency: null
  units: null
  accounting_basis: company_reported
  fiscal_or_calendar: unknown
  period_start: 2025-01-01
  period_end: 2026-03-10
  stock_or_flow: flow
