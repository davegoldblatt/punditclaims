assessment_axis: historical_observation
explicit_source_elements:
  - Every AI startup is unprofitable
  - they need to raise money from venture capitalists
evaluator_interpretation:
  - "‘Every’ is universal: one qualifying profitable AI startup would refute the profitability assertion."
  - The ordinary reading includes AI application startups as well as foundation-model developers.
  - ‘Unprofitable’ ordinarily means that the business incurs a net loss after its costs. Revenue, gross margin and annualized revenue alone do not establish profitability.
  - Use the fourth calendar quarter of 2025, the latest completed quarter for which financial evidence could ordinarily have been public before the post.
  - The speaker identifies no accounting basis. It remains unknown rather than being replaced with the basis of a convenient counterexample.
  - Raising investment does not itself establish that a business needed investment to survive.
support_condition: Comparable records establish net losses and necessary dependence on outside financing for every qualifying AI startup during the target period.
contradiction_condition: A qualifying startup has positive net income on a comparable accounting basis during the target period, or records establish that it operated without needing outside financing.
measurement_requirements: Identify the startup population and distinguish net income from operating profit, cash flow, gross profit and revenue. A definitive money score requires a specified accounting basis.
source_requirements: Prefer financial statements or sufficiently defined company disclosures. Founder profitability assertions without a defined measure are relevant but not equivalent to comparable net-income records.
