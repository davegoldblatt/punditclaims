explicit_source_elements:
  - OpenAI’s image software
  - accessed through Bing
  - verbatim and near-verbatim repetition of sources
evaluator_interpretation:
  - The claim concerns DALL-E as deployed through Bing during the December 2023 experiments described in the post.
  - I use December 1–29, 2023 as the latest contemporaneously observable month before publication. The post supplies no exact experiment dates.
  - The ordinary reading requires an exact or very close reproduction of identifiable source imagery. A new picture depicting a familiar character does not, by itself, establish reproduction of an existing source image.
  - This is a capability claim, not a claim about how frequently copying occurs.
support_condition: An independently documented Bing output from the target period closely reproduces an identifiable source image, with enough prompt and comparison information to verify the match.
contradiction_condition: Reliable evidence establishes that the alleged matches were misidentified, fabricated, or materially different, and that the claimed capability was absent in the relevant deployment. A few unsuccessful prompts would not suffice.
measurement_requirements: Dated prompts and outputs, identification of the Bing deployment, and comparisons with the purported source images.
source_requirements: Independent demonstrations, archived outputs, or technical records. Marcus's own demonstrations cannot independently establish the outcome.
