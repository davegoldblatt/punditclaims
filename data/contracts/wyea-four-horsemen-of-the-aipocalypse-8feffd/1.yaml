explicit_source_elements:
  - doesn’t degrade models to better serve demand
  - doesn’t really square
  - many, many users complaining about the problem
evaluator_interpretation:
  - The disputed inference is that reported degradation conflicts with a denial specifically about degrading models to meet demand.
  - Treat the wording as skepticism about that denial, not as an unequivocal allegation of deliberate deception.
  - The contextual episode runs from February 2026 through publication. Complaints establish reported experiences; establishing a conflict with the denial also requires evidence about their cause.
  - Distinguish changes to model capability from changes to product settings and software surrounding the model.
support_condition: Documented regressions are credibly linked to changes made to accommodate demand, making the specific denial inconsistent with the evidence.
contradiction_condition: A sufficiently complete investigation establishes that the relevant complaints arose from other causes and that the denied demand-driven degradation did not occur.
measurement_requirements: Comparable quality measurements, dated deployment changes, affected products, and evidence connecting those changes to demand management. Complaint counts alone cannot establish causation.
source_requirements: Primary statements, original complaints, deployment records, and independent investigations where available. A company denial alone cannot settle its own accuracy.
