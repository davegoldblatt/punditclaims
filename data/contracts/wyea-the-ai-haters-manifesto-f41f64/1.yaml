assessment_axis: historical_observation
explicit_source_elements:
  - what it does today
  - It costs too much
  - none of the businesses built on top of it are profitable
evaluator_interpretation:
  - Assess the universal profitability assertion. Costs too much and cannot be justified are judgments without stated tests.
  - Read businesses built on top of it as businesses whose products substantially depend on LLMs or generative AI.
  - The ordinary reading of profitable is earning more than all business expenses, rather than having positive gross margins, revenue growth, or financing.
  - Use April through June 2026, the latest completed calendar quarter that public reporting could cover before the post.
  - The speaker supplies no accounting basis. Do not silently treat an undefined company profitability statement as net income.
support_condition: Evidence covering the defined population establishes that no qualifying business earned a profit after all expenses during the target period.
contradiction_condition: At least one qualifying business documents a positive bottom-line profit during the target period on a defined accounting basis comparable to the claim.
measurement_requirements: Establish that the business depends materially on generative AI and identify its profit measure, expense coverage, accounting basis, and reporting period. Gross margin, adjusted operating profit, and positive cash flow are not substitutes for net profit.
source_requirements: Prefer financial statements or explicit company disclosures defining profit. Treat promotional profitability statements and interviews as leads when they omit those definitions.
