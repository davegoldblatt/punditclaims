  - Grok 3 required training
  - two new massive data centers
  - operating full time for months
  - 15x the compute of Grok 2
  - yet all these kinds of errors feel awfully familiar
evaluator_interpretation:
  - "The checkable parts are the facts about Grok 3's training: how many data centers were used, whether training ran for months, and how much compute it used compared with Grok 2."
  - "'Errors feel awfully familiar' is the author's personal impression. It is not graded."
  - "Plain reading of 'two new massive data centers': two separate data-center facilities built for Grok 3. A generous reading could treat it as the two build-out phases of one facility. That reading is noted but is not the plain one."
  - "'15x the compute of Grok 2' is read as roughly fifteen times Grok 2's training compute, as stated publicly by xAI or reported from the launch."
support_condition: Credible reports or xAI statements show that Grok 3 was trained in two new large data centers, over months of continuous training, using about 15 times Grok 2's compute.
contradiction_condition: Credible reports or xAI statements show that Grok 3 was trained in a single data center, or with compute well below 15x Grok 2, or with no months-long training run.
measurement_requirements: xAI's statements at the Grok 3 launch, and reporting on the Colossus cluster and training compute.
source_requirements: xAI announcement; reputable technical or news reports of the February 2025 launch livestream.
