assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic’s 47% quarter-over-quarter growth
  - rattled the markets
  - because
  - $413 billion of non-cancellable compute contracts
  - over the next few years
  - growth is the only thing keeping this going
evaluator_interpretation:
  - The testable core is that news of slower sequential revenue growth caused a negative investor reaction because investors worried about funding Anthropic's compute commitments.
  - The surrounding reference to recent weeks places the alleged reaction before October 20, 2026. September and October through the post date form the contextual review window; the exact reaction date is not specified.
  - Quarter-over-quarter growth is read as realized quarterly revenue growth, not growth in an annualized run rate.
  - The $413 billion is a stock of contractual commitments outstanding at the time, not annual spending, recognized expense or debt.
  - The source does not identify an accounting basis for that figure. Finding a similar press estimate does not establish the basis of the speaker's number.
  - The assertion that growth is the only sustaining factor requires stronger causal evidence than showing that investors care about growth.
support_condition: Comparable financial records establish the stated growth and commitment figures, while dated market evidence and contemporaneous investor accounts show that concern about covering those commitments drove the negative reaction. The exclusive growth explanation requires evidence addressing other material drivers.
contradiction_condition: Comparable records materially disprove the financial premises, or credible market evidence refutes the alleged reaction or its stated mechanism. Alternative influences alone do not disprove a contribution from growth concerns.
measurement_requirements: Quarterly revenue on a consistent basis; commitments by counterparty, cancellation rights and payment schedule; the relevant securities or investor valuations; announcement timing and evidence distinguishing competing causes.
source_requirements: Anthropic disclosures or reliably reported contemporaneous documents, paired with independent market records and investor reporting. The speaker's own explanation cannot establish causation.
