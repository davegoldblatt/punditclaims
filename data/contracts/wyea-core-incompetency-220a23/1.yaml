assessment_axis: historical_observation
explicit_source_elements:
  - Cloud GPUs are incredibly commoditized
  - core factors of differentiation
  - price, availability, and the exact hardware available
evaluator_interpretation:
  - Read commoditized as broadly substitutable services whose main competitive differences are the three named factors.
  - The claim allows secondary differences. The existence of proprietary software alone therefore does not contradict it.
  - Use October–December 2024, the latest completed quarter before publication, for the ongoing market observation.
  - Hardware can include networking and storage equipment; software, support, reliability, and integration must be assessed separately.
support_condition: Comparable offerings and customer purchasing evidence show that price, availability, and hardware dominate provider selection, with other differences having limited practical importance.
contradiction_condition: Comparable-workload measurements and customer purchasing evidence show that software, reliability, support, or integration materially determine provider choice independently of the named factors.
measurement_requirements: Comparisons controlling for GPU model, cluster size, networking hardware, workload, and availability, plus evidence about actual customer choices.
source_requirements: Dated provider specifications and independent measurements or customer comparisons. Marketing descriptions alone cannot establish the relative importance of selection factors.
metric_scope: null
original_horizon: null
horizon_interval: null
