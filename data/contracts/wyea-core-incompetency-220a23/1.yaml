  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Incredibly commoditized has no stated degree or test.
  - Core factors does not specify their relative importance.
  - Exact hardware could include the entire cluster configuration.
  - Latest completed quarter selected for an ongoing observation without an explicit reporting period.
retrospective_or_prospective: retrospective
