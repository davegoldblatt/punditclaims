explicit_source_elements:
  - can easily be automated
  - generate misinformation
  - at unprecedented scale
evaluator_interpretation:
  - This is a capability claim about generating content, not a claim that a successful influence campaign had already reached an unprecedented audience.
  - The ordinary reading of 'easily' is repeatable generation with modest setup and little human work per additional item.
  - The ordinary comparison for 'unprecedented scale' is earlier misinformation-production methods, including existing automation; it does not require comparison with a lone unaided writer.
  - I use November 2022 through the post date as the contemporary release period described in the surrounding discussion.
support_condition: Repeatable tests of contemporary systems demonstrate low-effort automated misinformation generation at a production scale exceeding earlier methods under comparable resource constraints.
contradiction_condition: Comparable tests establish that the systems require substantial intervention per item or cannot exceed earlier misinformation-production capacity.
measurement_requirements: Measure usable false-content output, operator effort, compute resources and time; compare with a stated historical baseline.
source_requirements: Prefer reproducible demonstrations or measured deployments. Separate demonstrated throughput from extrapolated capacity.
