assessment_axis: historical_observation
explicit_source_elements:
  - Every single AI business
  - is unprofitable
  - nor do any of them have a path to break-even
evaluator_interpretation:
  - The ordinary reading covers businesses selling AI models and AI applications, not merely OpenAI and Anthropic.
  - Profitable means the business earns more than its total expenses; revenue growth and positive gross margin alone do not establish this.
  - A path to break-even means a substantiated operating plan with plausible revenue, cost, and financing assumptions, rather than a forecast date alone.
  - Use January–March 2026, the latest completed calendar quarter before publication, for the ongoing profitability observation.
  - The words do not identify GAAP, non-GAAP, company-reported, or estimated profitability. The accounting basis remains unknown rather than being supplied by the evaluator.
support_condition: Evidence covering the claimed population establishes losses and the absence of substantiated break-even routes under a consistent definition.
contradiction_condition: At least one unambiguously in-scope business has matching-period profitability under an identified matching accounting basis, or a substantiated break-even route existing at publication.
measurement_requirements: Use whole-business profit after expenses, distinguish operating and net profit, and separate actual results from annualized revenue and forecasts. Test the assumptions behind any break-even plan.
source_requirements: Prefer company accounts and detailed operating disclosures. Founder statements and reporting without accounts require explicit qualification.
