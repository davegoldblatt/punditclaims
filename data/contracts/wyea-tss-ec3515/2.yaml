assessment_axis: causal_assessment
explicit_source_elements:
  - a trend with an actual product
  - can sell cloud compute access and proliferate more software
  - so remarkably unprofitable and unreliable
  - big tech firms are having to calm down their salespeople
evaluator_interpretation:
  - The factual core is that generative-AI products have inadequate returns relative to their costs and material reliability problems, and that these problems are causing major technology firms to restrain sales claims or expectations.
  - "'Unprofitable' requires returns that fail to cover attributable costs. High spending, high prices, uncertain customer value or slow adoption alone do not establish it."
  - "'Calm down their salespeople' means management tempering promises, sales expectations or targets. It does not require layoffs or a complete halt in selling."
  - "'Superficially-impressive doodad' is evaluative language and supplies no separate measurable threshold."
  - For the ongoing state described immediately before July 2024, use April–June 2024. Earlier financial reports and sales instructions remain context unless evidence establishes their continuation into this period.
  - The speaker specifies neither a company-level accounting measure nor a financial reporting basis; these must remain unspecified.
support_condition: Evidence establishes inadequate returns relative to attributable costs for the generative-AI businesses at issue, material reliability shortcomings, and management instructions restraining sales expectations because of those financial and reliability problems during the target period.
contradiction_condition: Matched evidence establishes that the relevant products covered their attributable costs and lacked the alleged material reliability problems, or direct evidence establishes that the asserted sales restraint did not occur or had materially different causes. Company-wide profits alone do not contradict product-level losses.
measurement_requirements: Match product revenue and attributable costs for the same companies and period, state the accounting basis, measure reliability in relevant customer uses, and obtain dated sales guidance or credible direct reporting explaining its causes.
source_requirements: Prefer financial disclosures, internal sales guidance made public, company statements and primary reliability evaluations. Use reputable reporting when underlying financial or management records are unavailable, while identifying estimates and anonymous sourcing.
