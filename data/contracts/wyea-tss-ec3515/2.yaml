ambiguity_flags:
  - No observation period is stated; April–June 2024 is an evaluator choice based on publication timing.
  - The companies and products covered by 'big tech firms' are unspecified.
  - No accounting basis, cost allocation or profitability measure is stated.
  - It is unclear whether profitability refers to vendors' products, customers' deployments or the industry overall; context favors vendors.
  - "'Calm down' does not specify whether promises, expectations or quotas were restrained."
  - The sentence asserts a causal connection without specifying the contribution of each alleged cause.
