evaluator_interpretation:
  - The ordinary reading is that almost all attributed advanced cognitive capabilities fail careful testing.
  - Controlled success on reasoning tasks counts as a capability surviving scrutiny; it does not establish human-like internal thought or general intelligence.
  - I treat cognitive reflection and reasoning about conjunctive probabilities as examples of the cognitive reasoning abilities covered by the broad wording.
  - I use March 2023 through the post date as the latest reporting window for the initial GPT-4 release. Later publications may establish results collected in that window.
support_condition: Controlled investigations of the principal attributed cognitive abilities find that apparent competence largely disappears under adequate testing.
contradiction_condition: Controlled investigations of contemporary GPT-4 establish substantial competence across multiple cognitive reasoning tasks beyond isolated demonstrations, making the near-total dismissal untenable.
measurement_requirements: Use identifiable contemporary models, multiple trials, controlled task variants, and checks against simple memorization or misleading demonstrations.
source_requirements: Primary experimental studies. Separate results collected during the target period from experiments on later models.
