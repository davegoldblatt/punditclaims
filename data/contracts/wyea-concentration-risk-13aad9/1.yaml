assessment_axis: historical_observation
explicit_source_elements:
  - Per data from fintech firm Ramp
  - 80% of OpenAI and Anthropic's enterprise revenues
  - 1% of their customers
  - hasn’t improved over the last three years
evaluator_interpretation:
  - The surrounding caveat makes this primarily a claim about concentration measured in Ramp's customer sample, rather than audited worldwide revenue.
  - Treat 80% and 1% as rounded figures.
  - Improvement means a material reduction in the revenue share attributable to the highest-spending 1%, measured consistently over the three years preceding publication.
  - The wording leaves unclear whether the figures describe each provider separately or their combined customer spending.
support_condition: Comparable Ramp observations establish approximately 80% concentration among the top 1% and no material decline over the stated three years.
contradiction_condition: Comparable Ramp observations show materially different concentration, or a material decline over those three years.
measurement_requirements: A dated concentration series, customer denominator, provider coverage, ranking method, and consistent treatment of changes in Ramp's sample.
source_requirements: Prefer Ramp's original analysis and methodology. A quotation of its economist can establish what Ramp reported but cannot supply missing historical measurements.
