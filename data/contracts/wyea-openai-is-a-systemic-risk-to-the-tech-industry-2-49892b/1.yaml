explicit_source_elements:
  - the latter cost
  - balloon
  - OpenAI's investment in physical infrastructure for Stargate
  - another billion on what infrastructure OpenAI owns
evaluator_interpretation:
  - The forecast concerns OpenAI's annual costs for infrastructure it owns, compared with the roughly $1 billion baseline in the preceding sentence.
  - The ordinary reading of 'balloon' is a substantial increase, with Stargate investment contributing materially.
  - The speaker supplies neither a numerical growth threshold nor a deadline. I do not impose a 2025 or 2026 deadline.
  - Participation in Stargate investment satisfies the antecedent; it does not establish ownership of the resulting facilities or an increase in owned-infrastructure costs.
support_condition: Comparable spending records show a substantial increase above the roughly $1 billion annual baseline for infrastructure OpenAI owns, with the increase materially attributable to Stargate.
contradiction_condition: A completed or permanently terminated Stargate investment program, together with comparable spending records, establishes that the predicted substantial increase never occurred.
measurement_requirements: Separate owned infrastructure from leased capacity, cloud purchases and equity investments. Reconcile capital expenditure and operating expense treatment with the baseline.
source_requirements: Company financial records or independently verified reporting with a separate owned-infrastructure spending figure and an identifiable Stargate contribution.
