assessment_axis: historical_observation
explicit_source_elements:
  - When people tell you Anthropic had this or that ARR
  - you really need to know which meaning they are talking about
  - They rarely tell you
  - they really mean the latter (Annualized Run Rate)
evaluator_interpretation:
  - "Core proposition: the headline revenue figures cited for Anthropic in the months before the post are annualized run-rate figures (current sales extrapolated to a year), not contracted annual recurring revenue."
  - "Secondary element: the people citing these figures 'rarely tell you' which meaning they use. I test this against the company's own announcements and the main wire reports, since those are the sources most figures come from."
  - "'People' and 'boosters' are not a defined set. Social media posts that just say 'ARR' cannot be sampled systematically, so the 'rarely tell you' part is judged on the primary and major-press sources only."
support_condition: Anthropic's disclosures and the major reports of its revenue in mid-2026 describe the figures as run-rate (annualized, extrapolated) revenue, and the source of the figure leaves its meaning unclear.
contradiction_condition: "The figures are shown to be contracted annual recurring revenue. For the secondary element: the main sources clearly label the figures as run rate."
measurement_requirements: How Anthropic and major outlets describe the revenue figures they report.
source_requirements: Anthropic's own announcements, plus wire or major news reports of investor updates.
