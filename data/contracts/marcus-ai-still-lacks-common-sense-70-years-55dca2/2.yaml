assessment_axis: forecast_outcome
explicit_source_elements:
  - Making them work reliably in the real world
  - and not just as demos
  - will require common sense
  - about objects, people, and entities in the world
evaluator_interpretation:
  - "The claim states a necessary condition: agents that work reliably in real-world use must possess relevant commonsense competence."
  - I read reliability as consistently completing the tasks entrusted to the agent under ordinary operational variation. It does not mean flawless performance or competence at every possible task.
  - I read common sense as practical understanding of relevant entities, their properties and identities, and the implications of ordinary interactions. Competence must be assessed separately from overall task success to avoid circular reasoning.
  - The claim requires possessing competence, not a recognized research advance, a particular architecture, or evidence about how that competence developed.
  - Human oversight does not automatically disqualify a deployment, but human corrections must be distinguished from the agent's own reliable performance.
  - The antecedent is established reliable real-world operation. Deployment alone, relative improvement, and simulated workplace evaluations do not establish it.
support_condition: After reliable real-world operation is established, evaluations of those same agents demonstrate relevant commonsense competence across the situations encountered in deployment. Consistent findings across deployments would support the claim within the tested scope, although coexistence alone cannot conclusively establish universal necessity.
contradiction_condition: An agent consistently performs real-world tasks involving relevant objects, people, or entities, while separate, valid evaluations establish that it lacks the commonsense competence those situations call for. Its reliability must not be attributable to humans supplying the missing judgments.
measurement_requirements: Measure repeated operational task completion, error severity, ordinary variation, and human intervention. Separately test relevant entity identities, properties, and social implications in the same deployed system. State the deployment's reliability standard and observation period; Marcus supplied neither a numerical threshold nor a duration.
source_requirements: Dated deployment evaluations and operational records, preferably independently assessed, paired with direct competence tests. Simulations and practitioner surveys can provide context but cannot alone establish both reliability and the presence or absence of relevant competence.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A dated, well-documented deployment satisfying the contradiction condition would conclusively refute the necessity claim. Continued failures, deployment announcements, or reliability gains without competence measurements cannot settle it early.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - Reliability has no numerical threshold or required duration.
  - The breadth of tasks and deployments covered is unspecified.
  - Common sense has no stated test or minimum competence level.
  - The permitted contribution of human oversight is unspecified.
  - Whether constrained, supervised deployments satisfy the antecedent depends on how reliability is interpreted.
