assessment_axis: historical_observation
explicit_source_elements:
  - In many ways, we have no idea
  - how LLMs actually get used in the real world
  - housing decisions, loan decisions, crime proceedings
  - strong evidence to suspect covert racism
  - to the extent that it is used in such use cases
evaluator_interpretation:
  - This combines a claim about substantial gaps in public knowledge with a claim that experimental evidence warrants concern about consequential uses.
  - "'In many ways' does not mean that no deployment was publicly documented."
  - "'Evidence to suspect' requires a credible experimental basis for concern, not proof that discrimination occurred in deployed housing, lending, or judicial systems."
  - This is an assessment of knowledge available at publication, not a conditional forecast. The deployment qualifier does not assert that the listed uses actually occurred.
  - The target is the public record up to March 5, 2024. No lower bound is supplied because public knowledge accumulates rather than following a reporting quarter.
support_condition: Contemporaneous evidence establishes substantial gaps in knowledge about consequential LLM deployments, and controlled decision experiments establish a credible basis for suspecting dialect-based discrimination in relevant applications.
contradiction_condition: Comprehensive contemporaneous records establish that the claimed deployment-knowledge gaps did not exist, or the cited consequential-decision experiments do not establish the claimed basis for concern.
measurement_requirements: Separate laboratory decision tasks, documented deployments, and the completeness of deployment information. Do not substitute general algorithmic systems for LLMs.
source_requirements: The original experiments plus contemporaneous deployment records or systematic transparency assessments. Older transparency findings alone cannot establish the situation in every named sector at publication.
