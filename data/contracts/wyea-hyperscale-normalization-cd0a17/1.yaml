assessment_axis: causal_assessment
explicit_source_elements:
  - Hyperscalers and NVIDIA
  - used their massive amounts of capital
  - a tech and business media incapable of seeing any other reality
  - inflate a dangerous, unstable and destructive bubble
evaluator_interpretation:
  - "Assess the factual causal core: financing and credulous reporting materially contributed to speculative AI valuations and financial fragility."
  - Read bubble ordinarily as prices or investment sustained materially beyond plausible underlying economic returns by speculative expectations.
  - Read the media language as alleging systematic uncritical amplification, not literal incapacity among every journalist.
  - Treat 'dangerous, unstable and destructive' as claims of material financial vulnerability; do not require an already completed crash or invent a crash deadline.
  - No particular company spending amount or accounting measure is asserted.
support_condition: Evidence establishes speculative mispricing or economically unjustified investment and shows that both hyperscaler/NVIDIA financing and uncritical media amplification materially caused it and associated financial fragility.
contradiction_condition: Comparable valuation and causal evidence establishes that the alleged material contribution from financing and media did not occur, or that the claimed speculative mispricing and fragility were absent in the relevant market.
measurement_requirements: Distinguish financing links from circular revenue inflation, valuation risk from demonstrated mispricing, and media attention from causal effects on investment. Address differences across firms.
source_requirements: Financing records, underlying cash flows, valuation analysis and systematic evidence linking reporting to investment decisions. Commentary or a few promotional articles alone cannot establish causation.
