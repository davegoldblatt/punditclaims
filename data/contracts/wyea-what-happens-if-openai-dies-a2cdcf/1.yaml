condition_status: not_applicable
early_resolution_rule: Resolve only after a documented substantial financing attempt ends in a clear failure or demand-driven concession, or closes promptly on the sought terms with strong demand. Preliminary discussions and changing indicative valuations are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
