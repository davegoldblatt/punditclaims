assessment_axis: forecast_outcome
explicit_source_elements:
  - raising further capital is going to be difficult
  - the sheer amounts it needs
  - the dwindling funds available
  - its already-inflated valuation
  - way behind a competitor
evaluator_interpretation:
  - "Difficult means material obstacles to obtaining the financing sought: failed commitments, a funding shortfall, unusual delay or significant concessions caused by weak investor demand."
  - A large financing requirement or routine negotiation is insufficient by itself.
  - The listed explanations are asserted reasons, not conditional antecedents.
  - The sentence supplies no deadline. The next substantial financing attempt is the earliest practical test, but this interpretation is not explicit in the source.
support_condition: A subsequent substantial financing attempt demonstrably fails, falls materially short, suffers unusual delay or requires significant concessions because investor demand is inadequate.
contradiction_condition: The next substantial financing attempt closes for the sought amount promptly and without material concessions, with reliable evidence of strong demand.
measurement_requirements: Original fundraising target, launch and closing dates, committed and received amounts, valuation basis, final terms and documented reasons for changes.
source_requirements: Prefer company or investor disclosures and transaction documents. Use reputable reporting for private negotiations, distinguishing proposals from executed agreements.
