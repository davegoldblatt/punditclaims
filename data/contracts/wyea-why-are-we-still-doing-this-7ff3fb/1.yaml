assessment_axis: forecast_outcome
explicit_source_elements:
  - no future
  - any AI company
  - subscription-based approach
  - don’t directly pass on the cost of compute
evaluator_interpretation:
  - The plain reading predicts that AI businesses cannot remain commercially viable with fixed subscriptions that absorb variation in customers' compute use.
  - Commercial viability requires sustained operations supported by the business's economics. Continued operation financed by new investment alone does not establish it.
  - Ordinary usage caps do not automatically constitute direct compute-cost billing; the post itself discusses capped subscriptions.
  - The universal wording includes AI companies beyond Anthropic and OpenAI, although those companies dominate the context.
  - This is a qualitative business-model prediction, with no stated financial metric or accounting basis.
support_condition: Broad evidence shows that businesses using the specified model fail or must abandon it because its economics cannot support continued operation. Individual failures would establish only those cases.
contradiction_condition: At least one qualifying AI business demonstrates sustained commercial viability while retaining subscriptions that do not directly bill customers for their compute consumption.
measurement_requirements: Establish the billing model, its contribution to the business, and sustained viability across multiple reporting periods. Separate investment funding, revenue growth, and profitability.
source_requirements: Dated pricing terms and reliable financial disclosures or independently corroborated reporting. A surviving website or a funding announcement is insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented, sustained commercially viable counterexample can contradict the universal prediction. An individual bankruptcy, billing change, or temporary loss cannot establish it for every qualifying AI company.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No future has no deadline or specified duration.
  - Any AI company is broader than the surrounding discussion of frontier language-model providers.
  - Directly passing on compute costs could mean metered billing or simply setting subscription prices to cover costs.
  - Commercial viability is not defined by a particular financial measure.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
