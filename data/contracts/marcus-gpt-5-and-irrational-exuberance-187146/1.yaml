assessment_axis: forecast_outcome
explicit_source_elements:
  - Their forte has been and always will be making shit up
  - they can’t for the life of them
  - check facts
  - GPT’s on their own
evaluator_interpretation:
  - Always will be makes this an open-ended forecast with no deadline.
  - The surrounding standalone qualification excludes retrieval and external verification tools. It is a scope restriction, not an antecedent that must later occur.
  - The ordinary reading concerns dependable factual verification and characteristic fabrication, not an inability to answer any factual question correctly.
  - Fact-checking requires distinguishing true from false claims against independently established ground truth. Answer generation and consistency checking are relevant but different measurements.
  - No numerical reliability threshold is supplied; isolated successes and isolated failures cannot settle the broad claim.
support_condition: Continuing factual unreliability can support the current limitation, but no finite series of evaluations establishes the assertion about every future GPT model.
contradiction_condition: Replicated evaluations establish dependable, broadly applicable fact-checking by standalone GPT models, contradicting the inability component, or establish that fabrication has ceased to be characteristic under representative use.
measurement_requirements: Report model versions, prompts, tool restrictions, independently verified labels, errors and abstentions. Address contamination, task breadth and whether the test measures verification or merely factual recall.
source_requirements: Reproducible primary evaluations with independent ground truth; model self-reports and selected demonstrations are insufficient.
metric_scope: null
original_horizon: has been and always will be
horizon_interval:
  start: 2023-04-08
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, replicated demonstration meeting the contradiction condition can falsify the relevant universal component. Continued failures cannot establish the unlimited future assertion.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Forte has no defined metric or comparison class.
  - Cannot check facts could mean no ability whatsoever or no dependable ability.
  - No acceptable error rate or task distribution is specified.
  - The boundary between a standalone model and a repeated-sampling verification procedure is unspecified.
  - The historical and perpetual assertions are bundled together.
