assessment_axis: forecast_outcome
explicit_source_elements:
  - The tech industry — and part of our economy
  - is accelerating at speed into a brick wall
  - driven by people like Sam Altman, Dario Amodei, Marc Benioff, and Larry Ellison
evaluator_interpretation:
  - "Plain reading: the tech industry, and the parts of the economy tied to it, will suffer a sharp collapse linked to the AI boom."
  - No deadline is stated, so this is an open-horizon forecast.
  - The causal attribution to particular executives is not scored. Only whether the crash happens is scored.
support_condition: A broad, sharp tech-sector collapse tied to AI, such as a major tech index falling into a bear market (20% or more from its peak) together with steep cuts in AI investment or wider economic damage.
contradiction_condition: With no deadline, it cannot be contradicted by the absence of a crash. It could only be undercut if the AI investment cycle clearly matured without a collapse over a long period.
measurement_requirements: Major tech index drawdowns (e.g., Nasdaq Composite), AI capital spending trends, and economic indicators linked to the tech sector.
source_requirements: Market data or reputable financial news. Official economic statistics.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled as supported if, before evaluation, a major US tech index fell 20% or more from its peak in a decline widely attributed to AI-investment concerns, with documented spillover to the wider economy or a sharp fall in AI investment.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - '"Brick wall" is a metaphor with no threshold.'
  - No timeframe is stated.
  - '"Part of our economy" is undefined.'
retrospective_or_prospective: retrospective
