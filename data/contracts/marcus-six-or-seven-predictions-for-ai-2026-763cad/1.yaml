explicit_source_elements:
  - Valuations may go up before they fall
  - the Oracle craze early in September
  - what has happened since
  - will in hindsight be seen as the beginning of the end
evaluator_interpretation:
  - The plain reading predicts an eventual broad unwinding of the generative-AI valuation boom, with the September 2025 Oracle episode later recognized as its beginning.
  - Possible interim valuation increases are a concession, not a conditional antecedent that must occur before scoring.
  - An Oracle-specific decline alone does not establish a broad generative-AI reversal.
  - No valuation basket, currency, accounting basis or required size of decline is supplied.
support_condition: Broad generative-AI valuations undergo a durable decline, and independent financial histories identify the September 2025 Oracle episode and its aftermath as the beginning of that unwinding.
contradiction_condition: An established history of the completed boom and reversal identifies a materially different beginning and rejects the September 2025 Oracle episode as the start.
measurement_requirements: Use a consistent company set and valuation measure across time. Separate public share prices, market capitalizations and private financing valuations. Do not infer a sector-wide collapse from Oracle alone.
source_requirements: Comparable market records plus independent financial retrospectives. News reports may supply context where primary historical price records or retrospective assessments are unavailable.
