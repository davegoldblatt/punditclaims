explicit_source_elements:
  - Outside of NVIDIA
  - nobody
  - making any profit
  - off of generative AI
evaluator_interpretation:
  - The ordinary reading covers businesses earning profit from generative AI products or their supporting infrastructure and services, not just frontier-model developers.
  - Profit means earnings after relevant business costs, rather than revenue, funding, valuation gains, or a positive gross margin alone.
  - Use calendar 2024, the latest completed annual reporting cycle before publication and the annual financial frame used elsewhere in the post.
  - The exact sentence exempts only NVIDIA. Elsewhere in the same post, Zitron explicitly also exempts consultancy Turing, creating a material contextual qualification.
  - No accounting basis is supplied for this industry-wide assertion. Do not silently impose GAAP or treat an unspecified company profitability claim as equivalent to audited net income.
support_condition: Comparable financial evidence establishes that no non-exempt business earned profit attributable to generative AI during the target period.
contradiction_condition: At least one non-exempt business demonstrably earned positive profit attributable to generative AI during the target period on the applicable accounting basis.
measurement_requirements: Identify the business, reporting period, profit measure, relevant costs, and connection to generative AI. Do not infer profit from revenue or from consolidated profits in unrelated activities.
source_requirements: Prefer financial disclosures or explicit company profitability statements with a defined basis. Treat unspecified private-company profitability statements as leads requiring qualification.
