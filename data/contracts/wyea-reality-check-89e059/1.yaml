assessment_axis: historical_observation
explicit_source_elements:
  - Nothing about anything that Anthropic or OpenAI is building or shipping
  - suggests we are anywhere near
  - any kind of autonomous computing
evaluator_interpretation:
  - The ordinary reading of autonomous computing includes systems that choose and execute multiple computing actions toward a supplied goal without a human directing every step.
  - The words any kind make bounded autonomous computing relevant; consciousness or general intelligence is not required.
  - A proposed product name or promotional promise alone is insufficient. Successful execution in documented evaluations is relevant evidence.
  - Use April 1–28, 2025 as the current-month observation window for this ongoing capability claim. Earlier evaluations can provide context; later improvements cannot retroactively contradict it.
  - The surrounding discussion of consciousness creates a plausible narrower reading about robust, general autonomy. That reading would be harder to settle.
support_condition: Contemporaneous evaluations show that the relevant systems require continuous human direction and provide no credible evidence of independently executing substantive computing tasks.
contradiction_condition: At least one system being built or shipped by either company demonstrates substantive multistep computing tasks without step-by-step human direction, providing evidence of some autonomous computing.
measurement_requirements: Documented tasks, tools, human intervention, success criteria and failures. Distinguish bounded benchmark performance from dependable general autonomy.
source_requirements: Prefer independent evaluations with disclosed methods. Company demonstrations may supplement them but must be identified as company evidence.
