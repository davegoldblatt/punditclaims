ambiguity_flags:
  - Anywhere near supplies no capability or time threshold.
  - Autonomous computing may mean bounded task execution or reliable general autonomy.
  - The consciousness and AGI context supports a narrower reading than the sentence's any kind wording.
  - The current-month observation window is an evaluator choice for an undated ongoing state.
