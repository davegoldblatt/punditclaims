explicit_source_elements:
  - nonprofit-hybrid model, introduced in 2019
  - was always a ticking time bomb
  - people trying to make money
  - those in the nonprofit that were charged with keeping the world safe
evaluator_interpretation:
  - The ordinary reading is that conflicting commercial and safety responsibilities made the hybrid structure inherently unstable.
  - The surrounding reference to the recent drama makes the November 2023 governance crisis the principal historical test of that explanation.
  - Conflict occurring under this structure does not by itself establish that profit-versus-safety incentives caused it or made it inevitable.
support_condition: Governance records and credible accounts establish that competing commercial and nonprofit safety responsibilities materially caused the governance crisis. Establishing inevitability would require more than one instance of conflict.
contradiction_condition: Credible causal evidence establishes that the relevant conflict arose independently of the alleged commercial-versus-safety mechanism. A temporary period of cooperation alone would not contradict the claim.
measurement_requirements: Distinguish the existence of board-management conflict from evidence identifying its causes. Examine competing participant accounts and the investigation's findings.
source_requirements: Contemporaneous governance records and first-hand accounts, supplemented by a sufficiently transparent investigation. Later retrospective evidence may address the 2023 events.
