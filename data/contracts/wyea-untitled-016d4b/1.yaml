evaluator_interpretation:
  - Assess the novelty of the user-facing capabilities announced at WWDC 2024, not their subsequent delivery dates.
  - The plain reading is that each substantive capability had a publicly documented functional precedent before Apple's announcement. An identical interface or implementation is not required.
  - Seen elsewhere can include a demonstrated capability; requiring a shipping equivalent would add a restriction Zitron did not state.
  - The historical comparison runs through the June 10 announcement. The source supplies no beginning date.
support_condition: A feature-by-feature comparison establishes prior functional equivalents for all substantive capabilities covered by the claim.
contradiction_condition: Reliable comparative evidence establishes that at least one substantive announced capability lacked a prior functional equivalent. Failure to find a precedent alone is insufficient.
measurement_requirements: Compare actual functions, distinguishing demonstrations, announcements, and shipped features. Broad labels such as image generation or app integration do not establish equivalence for every specific task.
source_requirements: Apple's announcement establishes the feature inventory. Dated documentation or demonstrations from other providers establish precedents.
