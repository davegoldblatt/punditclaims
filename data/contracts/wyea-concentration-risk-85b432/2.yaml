explicit_source_elements:
  - AI startups are an artificial source of revenue
  - not paying Anthropic and OpenAI out of cashflow
  - only able to do so as long as somebody else hands them endless amounts of cash
evaluator_interpretation:
  - "'Artificial' is a characterization. The checkable core is that AI startups' payments to OpenAI and Anthropic are funded mainly by venture capital rather than by operating cash flow."
  - Read as a general claim about AI startups as a group, as the speaker frames it ('in virtually every case I've found'), not as a claim about every single startup.
  - He describes an ongoing state with no named period. The target period is 2026 up to the post date, the period the post's examples (Harvey's 2025 to 2026 raises) point to.
support_condition: Evidence that most AI startups paying for model access run at operating losses or negative cash flow, and fund their token spending from venture raises.
contradiction_condition: Evidence that a substantial share of AI-startup spending with the labs comes from startups that generate positive operating cash flow, or that pay without depending on new venture funding.
measurement_requirements: Aggregate or representative data on AI startups' cash flow and funding compared with their model spending.
source_requirements: Company financial disclosures, filings, or credible reporting on startup finances; benchmark surveys of AI-startup margins.
