assessment_axis: historical_observation
explicit_source_elements:
  - AI startups are an artificial source of revenue
  - They are not paying Anthropic and OpenAI out of cashflow
  - only able to do so as long as somebody else hands them endless amounts of cash
evaluator_interpretation:
  - In context, 'artificial' means payments depend on outside financing because operating receipts cannot sustain the business and its model purchases. It is not read as an allegation of fabricated accounting revenue.
  - The plain reading concerns the venture-backed API customers discussed in the post.
  - I use the second calendar quarter of 2026, the latest completed quarter that could ordinarily have been reported before September 8. No reporting period is stated.
  - Raising venture capital does not by itself establish that model purchases could not be funded from customer receipts.
support_condition: Matched cash-flow and supplier-payment records show that the relevant startup customers could not sustain payments to the labs from operating receipts and depended on outside financing during the target quarter.
contradiction_condition: Records show that a substantial portion of the relevant customers sustainably covered their model purchases and ongoing operations from operating receipts, making the broad funding-dependence claim false.
measurement_requirements: Operating cash receipts, operating expenditures including model purchases, financing inflows and opening cash balances for the same companies and quarter.
source_requirements: Cash-flow statements and supplier-payment records, or credible reporting based on those records. Funding announcements alone are insufficient.
