explicit_source_elements:
  - SoftBank is putting itself in dire straits
  - simply to fund OpenAI once
evaluator_interpretation:
  - SoftBank means SoftBank Group, the investment holding company.
  - The ordinary reading is that financing the announced OpenAI round materially endangers the group's financial resilience, beyond the ordinary risk of making an investment.
  - The target period runs from the round's March 31 agreement through publication. March 31 is also the latest completed annual balance-sheet date available before the post.
  - Credit outlook, liquidity, asset-backed borrowing capacity and financing obligations are relevant indicators. Borrowing alone does not establish dire straits.
  - The wording specifies no financial ratio, monetary threshold or accounting basis.
support_condition: Contemporaneous financing and independent credit evidence show serious financial vulnerability attributable to this OpenAI round, such as inadequate liquidity, threatened debt service or materially impaired financing capacity.
contradiction_condition: Contemporaneous records show that the round can be financed while preserving substantial liquidity and financing capacity, with independent assessments finding no serious financial vulnerability attributable to it.
measurement_requirements: Assess holding-company resources and obligations, including undrawn facilities and asset liquidity. Distinguish rating outlook changes from rating downgrades and this round from other investments.
source_requirements: Prefer SoftBank Group financing disclosures and independent rating-agency assessments. Company assurances require corroboration.
