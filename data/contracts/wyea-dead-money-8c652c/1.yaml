assessment_axis: causal_assessment
explicit_source_elements:
  - these things are simply not getting built
  - because the power isn’t there
  - construction is taking longer than expected
  - putting pressure on effectively any data center-related debt
evaluator_interpretation:
  - Read not getting built as widespread failures to deliver usable facilities on schedule, rather than literally no construction or completions anywhere.
  - Effectively any means pressure across nearly the whole relevant debt market, not merely selected troubled projects.
  - Pressure means lower debt prices or wider borrowing spreads attributable to construction or power delays.
  - The surrounding reference to a selloff over the last two months supplies a July 29 through September 29, 2026 assessment window.
  - Effectively any is a scope claim, not a conditional antecedent.
support_condition: Representative project records establish widespread power or construction delays, and broad debt-market evidence links those delays to adverse repricing across nearly all relevant segments.
contradiction_condition: Representative evidence establishes that the asserted delivery failure or nearly market-wide causal pressure did not hold. Isolated completions or isolated unaffected securities are insufficient by themselves.
measurement_requirements: Scheduled versus actual commissioning dates, power-delivery records and representative debt returns or spreads, controlling for Treasury rates, issuance supply and issuer credit changes.
source_requirements: Project and utility records, construction surveys and dated debt-market measurements. Separate actual delays from risks and announcements.
