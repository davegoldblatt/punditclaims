explicit_source_elements:
  - standard ways to handle annualized revenue
  - they're not following them
  - $12 billion annualized revenue
  - $13 billion annualized revenue
evaluator_interpretation:
  - The claim concerns OpenAI's annualization methods behind the late-July and August 1, 2025 reports.
  - The plain reading is that OpenAI departed from ordinary annualization of a specified recent revenue period. A rolling period is not inherently nonstandard.
  - The reporting episode spans July through August 1. The underlying measurement periods are unspecified and must be established separately.
  - Different publication dates and figures do not alone establish inconsistent calculation methods.
support_condition: Disclosures identify the underlying revenue, measurement periods and calculations, and show that the reported figures did not follow an ordinary, consistently applied annualization method.
contradiction_condition: Disclosures reconcile both reported figures to ordinary annualization methods, including their measurement dates and revenue coverage.
measurement_requirements: Underlying revenue amounts, period boundaries, annualization multipliers, rounding and included revenue categories for both reports.
source_requirements: Prefer company records or attributable explanations. Reports repeating headline figures without the calculations are insufficient.
