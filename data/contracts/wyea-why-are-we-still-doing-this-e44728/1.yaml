assessment_axis: historical_observation
explicit_source_elements:
  - Uber is a completely different business
  - to Anthropic and OpenAI
  - or any other AI company
evaluator_interpretation:
  - The ordinary contextual reading is that Uber's core service and commercial model differ materially from businesses developing and selling access to generative models.
  - Completely different is treated as an emphatic business-model comparison, not a claim that the companies share no costs, technology or commercial practices.
  - Any other AI company is read within the surrounding discussion of generative model providers. It is not extended to every company using AI.
  - I use calendar 2025, the latest completed annual operating period reportable before publication.
support_condition: Primary descriptions show that Uber principally connects participants in transport, delivery and freight markets, while the named AI providers sell access to their models and applications through paid plans and APIs.
contradiction_condition: Primary descriptions show that Uber and the named providers principally supply the same service through substantially the same commercial model.
measurement_requirements: Compare the core product, parties supplying the service, and how customers purchase access. Shared subscriptions or variable costs alone do not establish equivalent businesses.
source_requirements: Uber's annual report and dated product or commercial disclosures from Anthropic and OpenAI.
