evaluator_interpretation:
  - Assess whether the presentation materially implied that the learned system determined the solution moves when its learned contribution was physical manipulation.
  - "Assess the alleged refusal separately: it requires evidence of a correction request and a decision to reject it."
  - An unchanged page or public disagreement alone does not prove refusal.
  - The target period is 2019, as explicitly stated.
support_condition: The presentation materially misrepresented the learned capability, and records establish that OpenAI rejected a request to correct that presentation.
contradiction_condition: The relevant presentation clearly communicated the capability and limitations, or records establish that OpenAI accepted and made the requested correction. A disclosure elsewhere is counterevidence but may not settle the presentation's overall impression.
measurement_requirements: Compare promotional wording with the technical system, and inspect dated correction requests, responses, and revisions.
source_requirements: OpenAI's original announcement and paper, plus a documented correction exchange or reliable independent reporting of one.
