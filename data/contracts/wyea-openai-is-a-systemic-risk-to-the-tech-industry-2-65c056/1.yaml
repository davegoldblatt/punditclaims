assessment_axis: forecast_outcome
explicit_source_elements:
  - At that rate
  - about $2.25 to make $1
  - revenue projections of $12.7 billion
  - costs ... at least $28 billion
  - burn at least $14 billion in 2025
evaluator_interpretation:
  - This is a conditional forecast requiring both the stated spending-to-revenue relationship and attainment of the revenue projection.
  - Reaching $12.7 billion means achieving at least that revenue level, rather than exactly matching it.
  - In the surrounding liquidity discussion, 'burn' ordinarily means net cash consumption. Accounting losses alone do not establish it.
  - The principal metric is net cash burn; the $28 billion total-cost prediction is a separate linked component.
support_condition: After both antecedents are established on comparable measures, calendar-2025 records show at least $28 billion in total costs and at least $14 billion in net cash burn.
contradiction_condition: After both antecedents are established, comparable calendar-2025 records show total costs below $28 billion or net cash burn below $14 billion; report separately if the components differ.
measurement_requirements: Full-year realized revenue, total costs, cash burn and the spending-to-revenue ratio, with reconciliations for noncash charges and cash-flow timing. Do not substitute annualized revenue or operating losses.
source_requirements: Financial statements or reliable reporting of full-year financial records. The condition requires a spending measure consistent with the ratio used in the forecast.
