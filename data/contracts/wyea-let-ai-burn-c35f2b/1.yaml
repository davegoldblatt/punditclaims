early_resolution_rule: Resolve early only if verified cumulative realized results already exceed a forecast's upper boundary by enough to defeat any ordinary reading of 'around', with no plausible reversal or accounting adjustment. Otherwise await full-year results.
interpretation_determines_result: false
plain_reading: true
