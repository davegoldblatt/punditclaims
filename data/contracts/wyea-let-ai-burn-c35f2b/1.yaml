assessment_axis: forecast_outcome
explicit_source_elements:
  - what I estimate
  - around $75 billion to $100 billion of 2026 compute spend
  - what will likely be around $60 billion of combined revenue
  - their actual economic presence is minor
  - the rest of the AI industry having so little
evaluator_interpretation:
  - "Assess the two numerical forecasts separately: combined OpenAI and Anthropic compute spending, and combined revenue earned during calendar 2026."
  - "'I estimate' and 'will likely' express uncertainty; they are not antecedent conditions."
  - Compute spending ordinarily includes training and serving models, but excludes unrelated spending and commitments for future years.
  - Revenue means revenue earned during the year, not an annualized revenue run rate.
  - No numerical tolerance is supplied for 'around'. A boundary case requires clarification rather than an invented pass threshold.
  - The statements about minor economic presence and the rest of the industry have no supplied denominator or threshold and cannot be settled merely by grading the two forecasts.
support_condition: Comparable full-year records place combined compute spending approximately within USD 75–100 billion and combined realized revenue around USD 60 billion. Both numerical components must be assessed independently.
contradiction_condition: Comparable realized records put either numerical component clearly outside its stated approximate range. A forecast or annualized run rate alone does not qualify.
measurement_requirements: Obtain both companies' calendar-year totals. Reconcile compute expenses with cash spending, infrastructure purchases, prepayments, and future commitments; reconcile revenue presentation and gross-versus-net treatment.
source_requirements: Prefer full-year company disclosures or filings. Credible reporting of internal realized results may be used when its measurement basis can be matched to the estimate.
metric_scope:
