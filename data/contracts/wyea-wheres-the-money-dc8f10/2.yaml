explicit_source_elements:
  - Anthropic, much like OpenAI
  - has categorically failed to productize its Large Language Model
  - the only product it appears to have pushed being Computer Use
  - similarly-useless AI model
  - can sometimes successfully do in minutes what it takes you to do in seconds
evaluator_interpretation:
  - "The firm, checkable part is 'categorically failed to productize.' Plain reading: Anthropic had not turned Claude into products that customers actually buy and use."
  - "'The only product it appears to have pushed' is hedged with 'appears', so it is not scored as a separate claim of exclusivity. It is read as part of the productization claim."
  - "'Similarly-useless' is an opinion. The speed remark about Computer Use is treated as a description that can be compared with Anthropic's own caveats, but it does not decide the outcome."
  - "Period: from Claude's commercial launch to the post date (2023-01-01 to 2025-02-24). The most recent full reported year in that span is 2024."
support_condition: Before the post, Anthropic had no meaningful commercial product built on Claude (little or no paid subscription or API business), with Computer Use as its main pushed offering.
contradiction_condition: Before the post, Anthropic sold Claude as commercial products (API, consumer and business subscription plans) and earned material revenue from them.
measurement_requirements: Company disclosures of product launches and revenue from paid products before 2025-02-24.
source_requirements: Anthropic filings and official announcements.
