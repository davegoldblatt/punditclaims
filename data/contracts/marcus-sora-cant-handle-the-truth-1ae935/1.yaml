assessment_axis: historical_observation
explicit_source_elements:
  - any global comprehension by the system
  - most or all of the errors we have seen thus far
  - virtually every bit of the images are locally correct
  - a tiny patch
  - for a single moment
evaluator_interpretation:
  - The ordinary contextual reading of global comprehension is representing and maintaining scene-wide relationships, object identities, and counts across space and time.
  - This concerns the original Sora demonstrations available by the post date, not later versions.
  - The surrounding local-correctness claim concerns most observed faulty clips, rather than all possible Sora outputs.
  - The absence of any such comprehension is stronger than occasional failures of scene consistency. Neither an isolated failure nor an isolated convincing output settles the internal-representation claim.
support_condition: A defined collection of the contemporaneous faulty demonstrations establishes predominantly correct local appearance but scene-wide failures, and model evidence supports the claimed absence of representations maintaining those relationships.
contradiction_condition: Evidence directly establishes relevant scene-wide representations in the original model, or a representative examination refutes the claimed predominance of locally correct content in its faulty demonstrations.
measurement_requirements: Specify the demonstration set, patch size, local-correctness criteria, and scene-level tests. Distinguish behavioral consistency from evidence about internal representations.
source_requirements: Authenticated contemporaneous demonstrations and systematic evaluations or studies of the original model. Promotional examples alone cannot settle the internal claim.
