assessment_axis: historical_observation
explicit_source_elements:
  - We pretty obviously don’t have a say.
  - What checks and balances will there be?
  - Where will this leave humanity?
evaluator_interpretation:
  - “We” means the general public, given the preceding reference to humanity.
  - The plain reading is that ordinary members of the public had no formal decision-making or binding consultation role in resolving the leadership and governance crisis.
  - This does not require the public to have no ability to express opinions or exert indirect pressure.
  - The observation concerns the crisis as it stood on November 19, 2023. The target period runs from the November 17 leadership removal through the post date. Later resolution events are context.
support_condition: Governance rules and accounts of the crisis place decision-making with internal governing bodies and provide no public vote, public appointment right, or binding public consultation role.
contradiction_condition: Records establish that the general public had a formal decision-making or binding consultation role in the crisis during the target period.
measurement_requirements: Distinguish public participation rights from a mission to benefit humanity, informal expressions of support, and government enforcement powers.
source_requirements: Contemporaneous governance records and reporting identifying who could appoint or remove leaders and directors. Later accounts may establish earlier facts, but later events are context.
