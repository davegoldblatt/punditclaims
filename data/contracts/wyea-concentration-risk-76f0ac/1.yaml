assessment_axis: causal_assessment
explicit_source_elements:
  - Harvey raised over $800 million in 2025 alone
  - exited the year at around $190 million in annualized run rate
  - around $15.8 million a month
  - would’ve been completely dead over a year ago
  - without venture capital propping it up
evaluator_interpretation:
  - "This is a compound claim: two historical financial figures, a monthly conversion and a causal counterfactual about survival."
  - The plain reading of 'completely dead' is unable to continue operating for lack of funds.
  - "'Over a year ago' means before September 8, 2025, measured from the post date."
  - The historical figures describe calendar 2025. The survival counterfactual concerns an earlier point within or before that year.
  - ARR divided by twelve is a monthly run-rate equivalent, not verified cash receipts or realized monthly revenue.
  - The single contract metric_scope records the 2025 financing component. ARR is separately scoped in its evidence item; neither metric is substituted for liquidity.
  - The reported financing figure is treated as an estimate from reporting. The underlying basis of the claimed counterfactual liquidity is unknown.
support_condition: Evidence confirms more than $800 million raised in calendar 2025, approximately $190 million ARR at year-end and the arithmetic monthly equivalent; dated cash-flow evidence also shows that removing the specified venture financing would have forced closure before September 8, 2025.
contradiction_condition: Comparable records materially contradict a stated financial figure, or a credible reconstruction shows Harvey could have continued operating beyond the claimed cutoff without the venture financing being removed.
measurement_requirements: Calendar-year financing totals; year-end ARR definition; and a dated reconstruction of cash balances, receipts, required expenditures and financing, specifying which venture rounds are removed.
source_requirements: Company or investor disclosures for financing and ARR, plus financial records sufficient to test the counterfactual. Funding-to-ARR comparisons alone cannot establish failure.
