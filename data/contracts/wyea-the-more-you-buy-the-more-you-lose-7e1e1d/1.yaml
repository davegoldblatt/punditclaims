evaluator_interpretation:
  - The surrounding discussion limits 'AI' to generative AI and LLMs.
  - The ordinary reading of 'fundamental use cases' is substantive, repeatable practical applications, rather than demos or isolated anecdotes.
  - The claim concerns whether such applications existed by July 28, 2026. The target is cumulative existence through that date, not only applications launched during July.
  - Creating clinical notes from live conversations is distinct from coding, query interpretation, brainstorming and document search.
  - A useful application need not demonstrate that the entire AI industry's investment is justified.
support_condition: Credible evidence establishes that substantive practical applications were confined to the listed categories by the post date.
contradiction_condition: At least one documented generative-AI application outside the listed categories delivers a meaningful practical benefit in actual use before the post.
measurement_requirements: Documented deployment, a task outside the exceptions, and measured practical results with relevant quality limitations.
source_requirements: Prefer original deployment studies or controlled workplace evaluations over promotional anecdotes.
