explicit_source_elements:
  - Consumers don’t want this shit
  - They’re intrigued by the idea
  - mostly immediately bouncing off of it once they see what it can (or can’t) do
evaluator_interpretation:
  - The ordinary reading is that more than half of consumers who try generative AI promptly abandon it after their initial experience.
  - "'Consumers don't want it' is read as a broad lack of sustained demand, not a literal assertion that no consumer wants it."
  - "'Immediately' means following the initial trial. I do not invent a precise number of days."
  - For this ongoing observation without a named reporting period, I use January 2025, the latest complete calendar month before publication.
  - "'Mostly' is a prevalence threshold, not a conditional antecedent."
support_condition: Representative consumer trial cohorts for the target period show that more than half promptly abandon generative AI after initial experience, with evidence consistent with low sustained demand.
contradiction_condition: Comparable evidence shows that a majority of consumer trial users continue using generative AI after their initial experience, undermining the asserted majority abandonment.
measurement_requirements: Use all initial trial users as the denominator, include free and paid usage, distinguish occasional use from abandonment, and track switching between products. Current-user surveys alone cannot estimate the share of all trial users who quit.
source_requirements: Representative consumer panels, transparent first-use cohort retention data, or surveys that separately identify trial, continuation, and abandonment. Aggregate growth and subscription churn are insufficient by themselves.
