assessment_axis: causal_assessment
explicit_source_elements:
  - no intention to create misinformation
  - but also no capacity to avoid it
  - because fundamentally, GPT-3 is a model of how words relate to one another
  - not a model of how language might relate to the perceived world
evaluator_interpretation:
  - Two parts. (a) GPT-3 had no reliable built-in way to avoid producing false content. (b) The cause is that it is trained only on relations among words, without grounding in the perceived world.
  - Read fairly, 'no capacity to avoid it' means it cannot reliably avoid misinformation, not that it never says anything true.
support_condition: Controlled evidence that GPT-3-era models' misinformation stems from text-only training, and that grounding in the world is what would be needed to fix it.
contradiction_condition: Evidence that GPT-3-era models without world grounding could reliably avoid misinformation, or that the errors had a different main cause.
measurement_requirements: Controlled comparisons that separate the effect of text-only training from other factors on factual error rates.
source_requirements: Peer-reviewed or preprint studies published by the evaluation date.
