evaluator_interpretation:
  - Assess the AI component identified in the normalized proposition, not every technology in the sentence or the separate assertion about desperation.
  - The context describes developments since 2015 through publication.
  - The ordinary reading of viable is a commercially sustainable business. Paying customers alone do not establish sustainability.
  - The principal companies in context are Microsoft, Google, Meta, and Amazon.
  - No accounting measure or basis is supplied; I will not substitute revenue, customer counts, or parent-company profits for AI-business viability.
support_condition: Comparable AI-business economics establish that the relevant businesses had not become commercially sustainable by publication.
contradiction_condition: Evidence establishes an operating, commercially sustainable AI business within the relevant big-tech companies by publication.
measurement_requirements: AI-specific revenues and attributable costs, or comparably strong evidence of sustained commercial viability. Separate realized revenue, annualized revenue, and profit.
source_requirements: Prefer segment or product disclosures with clear cost allocation. Reports of losses or profitability require a defined period and accounting scope.
