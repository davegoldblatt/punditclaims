  - fits in some ways
  - suggesting
evaluator_interpretation:
  - The checkable commitment is the prevalence of smooth, slow-moving shots among unique Sora samples publicly available by February 17, 2024.
  - Vast majority means a clearly overwhelming share, not merely more than half. No precise percentage is supplied or imposed.
  - Each sample should be classified by its predominant visible motion, distinguishing camera movement from subject movement.
  - The local-patches explanation is a tentative inference. Motion prevalence alone cannot establish the model's internal understanding.
  - Samples so far includes public launch material and publicly shared demonstrations, rather than only examples selected by the evaluator.
support_condition: A dated, sufficiently complete inventory and reproducible motion review show that a clearly overwhelming share of the eligible samples predominantly use smooth pans and slow motion.
contradiction_condition: The same review shows that such samples are clearly not an overwhelming share. A few fast or multi-shot examples alone do not contradict a majority claim.
measurement_requirements: Deduplicate samples, verify publication by the post date, record duration and predominant camera and subject motion, and report counts with ambiguous classifications separately.
source_requirements: Archived original videos and publication records, or an independent review with a disclosed corpus and coding method.
