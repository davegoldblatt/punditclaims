explicit_source_elements:
  - mechanistic interpretability
  - derive (or infer) world models from LLMs
  - very limited success
evaluator_interpretation:
  - The ordinary reading is that successful recovery remains narrow or incomplete, especially for coherent, dynamic models of complex environments. It does not mean that no useful representations have been found.
  - The surrounding discussion reviews developments from the January 2023 Othello result through publication. I use that cumulative literature period.
  - Recovering individual features or decoding information is weaker evidence than showing that a model maintains and uses the recovered representation.
support_condition: Published research shows useful but restricted recoveries, substantial failures of coherence or updating, and incomplete understanding of larger models.
contradiction_condition: Published research demonstrates systematic recovery and causal validation of coherent, updatable world models across substantially broader environments and models.
measurement_requirements: Assess domain breadth, completeness, robustness, and causal use of recovered representations. Do not equate probe accuracy alone with recovery of a complete world model.
source_requirements: Primary representation studies, intervention experiments, and documented limitations available for the literature period.
