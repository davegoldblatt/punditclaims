assessment_axis: forecast_outcome
explicit_source_elements:
  - the majority
  - these AI data center debt deals
  - ever get paid
  - I do not think
evaluator_interpretation:
  - This is a forecast of eventual nonpayment, despite its expression as a belief.
  - Majority means more than half of the deals by count, rather than by dollars lent.
  - The relevant population is the AI data center financing deals discussed or referenced at publication. The post does not provide a complete list.
  - A deal is unpaid if its final resolution leaves creditors short of the payments contractually owed. Distressed trading prices or a temporary missed payment do not establish that it never gets paid.
support_condition: A defined population of the referenced deals has final creditor shortfalls in more than half its members.
contradiction_condition: At least half of that same population is fully paid or otherwise satisfied under its original contractual terms, making a majority of unpaid deals impossible.
measurement_requirements: Identify each deal once, establish the denominator, and track principal, contractual interest, recoveries and final settlement. Do not substitute dollar-weighted losses for deal counts.
source_requirements: Credit agreements, trustee payment records, borrower disclosures, court-approved resolutions or reliable deal-level credit records available by the evaluation date.
metric_scope:
  company: AI data center borrowers in the referenced, unspecified deal population
  metric: Proportion of debt deals ultimately not paid in full
  currency: null
