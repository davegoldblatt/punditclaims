assessment_axis: forecast_outcome
explicit_source_elements:
  - venture capitalists that have sunk money into AI stocks
  - a bunch of assets under management
  - will eventually crater or go to zero
  - there will be no way for any liquidity event to occur
evaluator_interpretation:
  - The forecast concerns losses on VC holdings in AI startups, not merely whether an AI company raises financing.
  - Crater means a severe loss of investment value. No percentage threshold, investment cohort or deadline is supplied.
  - A completed acquisition challenges the asserted absence of exit routes. Establishing realized liquidity for VC holders requires evidence about their consideration, sale restrictions or proceeds.
  - A single successful exit does not settle whether an unspecified substantial collection of other holdings will eventually collapse.
support_condition: Identifiable VC-held AI investments suffer severe, durable write-downs or write-offs without realizable exits, with evidence that unavailable liquidity caused the losses.
contradiction_condition: Documented realized exits for the relevant VC holdings contradict the no-liquidity component. Resolving the broader collapse forecast also requires a defined investment population and loss criterion.
measurement_requirements: Match investment cost, ownership, share class, valuation dates, realized proceeds and remaining holdings. Do not equate company financing proceeds, paper valuations or employee share sales with VC distributions.
source_requirements: Prefer fund reports, investor disclosures, completed transaction filings and documented secondary sales.
metric_scope:
  company: Unspecified VC-held AI startups
  metric: Value and eventual realized recovery of VC equity holdings
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented completed exit delivering realizable consideration to identified VC holders can settle the categorical no-liquidity component. An IPO or acquisition announcement alone cannot settle the unspecified aggregate collapse forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No defined investment population.
  - Crater has no numerical threshold.
  - A bunch does not specify how many holdings must fail.
  - Liquidity event may mean a corporate exit, investor cash realization or distributions to limited partners.
  - Valuation and accounting basis are unspecified.
retrospective_or_prospective: retrospective
