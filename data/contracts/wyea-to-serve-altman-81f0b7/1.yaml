assessment_axis: forecast_outcome
explicit_source_elements:
  - I believe will
  - another huge, industry-defining round
  - Canadian pension funds, Saudi sovereign wealth funds, or massive investment funds
  - would require swaths of equity
evaluator_interpretation:
  - The forecast combines a major funding round with a claim about the investors and equity concessions needed to obtain it.
  - The investor categories are alternatives. Participation by a large investment fund can satisfy that part without Canadian or Saudi participation.
  - The ordinary reading of 'swaths of equity' is a substantial ownership concession, without an implied majority stake.
  - Participation alone does not establish that particular investors or concessions were necessary.
  - "'I believe' expresses confidence; it is not an external condition."
  - No deadline or accounting basis is specified. The financing amount is a flow; ownership concessions require separate stock measurements.
support_condition: A completed major round after publication involves at least one named investor category, with disclosed terms establishing a substantial required equity concession.
contradiction_condition: A qualifying completed round is demonstrably financed without the specified investor categories or without substantial equity concessions.
measurement_requirements: Distinguish completed funding from commitments, primary financing from secondary share sales, and ownership attributable to the round from cumulative ownership acquired across several transactions.
source_requirements: Company or investor disclosures establishing completion and ownership terms; reputable reporting where contractual details are not publicly disclosed.
metric_scope:
  company: OpenAI
  metric: New financing and associated equity concessions
  currency: USD
  units: dollars raised; ownership percentages assessed separately
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve upon a completed qualifying round whose disclosed participants and equity terms establish or refute the combined forecast. An announcement or investor list alone is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No numerical definition of 'huge' or 'industry-defining'.
  - No ownership threshold for 'swaths of equity'.
  - "'Require' could describe actual financing terms or a stronger claim of unavoidable necessity."
  - "'Another' does not expressly identify the immediately next round."
  - No stated accounting basis or deadline.
retrospective_or_prospective: retrospective
