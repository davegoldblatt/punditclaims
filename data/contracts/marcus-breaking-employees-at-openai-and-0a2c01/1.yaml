assessment_axis: causal_assessment
explicit_source_elements:
  - so much of the immediate problem
  - stems from
  - large-scale deployment of agents with internet access
evaluator_interpretation:
  - The immediate problem means the recent harmful or uncontrolled generative-AI behavior discussed in the post.
  - Use the surrounding six-month reference to delimit the recent period.
  - Much means a substantial contribution, without inventing a numerical majority threshold.
  - The proposed removal of agents from the market makes large-scale public deployment the central reading. Internal testing is relevant context but cannot substitute for evidence about that deployment.
  - A demonstrated pathway to harm does not establish its share of the overall problem.
support_condition: Comparative incident or evaluation evidence establishes that large-scale internet-connected agent deployment makes a substantial causal contribution to the recent safety problem, accounting for other important causes and reporting differences.
contradiction_condition: Representative evidence shows that such deployment contributes little, or that the identified failures principally arise independently of internet-connected agent deployment.
measurement_requirements: Separate public deployment from internal testing, intentional misuse from unauthorized model actions, and internet access from other permissions. Assess frequency and severity using a defined comparison population.
source_requirements: Primary incident investigations, comparative safety studies, or systematically collected incident records with explicit coverage limitations.
