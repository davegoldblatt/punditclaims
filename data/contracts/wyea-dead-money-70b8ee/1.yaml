target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires an irreversible event making the labs' target attainment impossible, such as permanent cessation, plus decisive evidence of the specified consequences. Interim growth disappointments, valuation declines and refinancing pressure do not suffice.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - OpenAI's revenue threshold is not supplied.
  - It is unclear whether one lab missing its target is sufficient.
  - The range does not specify whether $190 billion or $200 billion is the minimum success threshold.
  - No consequence deadline or observation lag is stated.
  - The affected hyperscalers, debts and venture holdings are not individually identified.
  - The antecedent's revenue accounting basis is unspecified.
