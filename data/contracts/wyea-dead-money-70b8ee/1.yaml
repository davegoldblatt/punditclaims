assessment_axis: forecast_outcome
explicit_source_elements:
  - If they fail to do so
  - everybody suffers
  - Hyperscalers miss revenue estimates
  - AI data center debt goes unpaid
  - Venture capitalists find their holdings washed out
  - within the next two years
evaluator_interpretation:
  - "'Fail to do so' refers to the preceding revenue expectations, including Anthropic's $190–200 billion of annual revenue within two years."
  - The plain reading predicts material harm across the three named groups, rather than literally every company and investor suffering.
  - Hyperscaler misses must be measured against estimates fixed before results; unpaid debt means missed contractual payments; washed-out holdings means severe realized losses or write-downs.
  - The two-year deadline applies to the revenue condition. The speaker gives no separate deadline for the consequences.
  - The horizon ends September 29, 2028 for the antecedent; failure during an interim quarter does not establish failure by that deadline.
support_condition: "After the specified revenue failure is established, evidence shows all three material consequences: hyperscaler revenue misses, AI data center debt nonpayment and severe venture investment losses, linked to the labs' shortfall."
contradiction_condition: After the antecedent is established and sufficient follow-up is available, comparable evidence shows the asserted consequences do not occur. If only some consequences occur, evaluate the components separately rather than treating the entire forecast as supported.
measurement_requirements: Measure realized annual revenue against the original targets. Preserve contemporaneous hyperscaler estimates, contractual debt due dates and venture investment carrying values; distinguish market-price declines from debt defaults.
source_requirements: Company financial disclosures must establish the revenue condition. Earnings releases and archived estimates, creditor or court records, and fund disclosures should establish the three consequences.
metric_scope:
  company: Anthropic
  metric: Annual revenue threshold in the conditional antecedent
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: 2028-09-29
  stock_or_flow: flow
