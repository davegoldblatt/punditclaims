explicit_source_elements:
  - a manifest of sources
  - current systems don’t
evaluator_interpretation:
  - Assess the factual second clause; the statement about what a good system should do is normative.
  - In the surrounding discussion, a manifest means a reliable account of the underlying source materials behind generated outputs, including training sources.
  - The ordinary contextual scope is mainstream foundation-model systems such as DALL-E and ChatGPT. A bibliography of retrieved pages is not necessarily a training-source manifest.
  - Use December 2023 as the latest contemporaneous capability snapshot before the post. This is a month-level description of the state at publication, not an assessment of later product changes.
support_condition: Evidence addressing December 2023 shows that mainstream systems did not provide users with reliable output-specific manifests of underlying training sources.
contradiction_condition: A mainstream system available at the time demonstrably provided such a manifest to users.
measurement_requirements: Distinguish underlying training-source provenance from retrieved citations, lists of entire training datasets, and AI-origin labels.
source_requirements: Contemporary product records or technical research explicitly describing the December 2023 state.
