assessment_axis: forecast_outcome
explicit_source_elements:
  - Assuming that Microsoft gave OpenAI $10 billion of cloud credits
  - it spent $4 billion on server costs
  - let's say, $2 billion on training
  - costs that are both sure to increase
  - OpenAI will either need more credits or will have to start paying actual cash to Microsoft
  - sometime in 2025
evaluator_interpretation:
  - This is a conditional forecast. The antecedent is that Microsoft's support took the form of about $10 billion in Azure credits, and that OpenAI was using those credits for about $4 billion a year of server (inference) costs and about $2 billion of training. The implied premise is that OpenAI was not yet paying Microsoft cash for compute.
  - The consequent is that during calendar 2025, OpenAI either gets more credits or starts paying Microsoft cash for compute.
  - The forecast can be scored only if public evidence shows the antecedent held, including that credits, not cash, were paying for server costs.
support_condition: "The antecedent is shown to hold: about $10 billion in credits that were covering both inference and training. Then evidence shows that in 2025 OpenAI received more credits or began paying Microsoft cash for compute."
contradiction_condition: The antecedent is shown to hold, but through 2025 OpenAI neither received more credits nor began cash payments, for example because its credits lasted past 2025.
measurement_requirements: Public reporting or filings on the credit share of Microsoft's investment, on which compute costs credits paid for, and on how OpenAI paid Microsoft for compute in 2025.
source_requirements: Microsoft or OpenAI filings and announcements, or reputable reporting with independent sourcing. Reporting based only on the speaker's own leaked-document analysis does not count as evidence that he was right.
