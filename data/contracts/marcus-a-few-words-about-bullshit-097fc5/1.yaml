explicit_source_elements:
  - every other large language model I have seen
  - It prevaricates. A lot.
evaluator_interpretation:
  - Prevaricates means generates fabricated or false factual content; it does not require intentional deception.
  - A lot means a recurring, substantial problem, rather than an isolated mistake. Marcus supplies no numerical threshold or distribution of prompts.
  - The scope is the models Marcus had encountered by publication, not every model subsequently released.
  - The present-perfect phrase 'I have seen' describes accumulated experience through 2022-11-16. Its starting date is unspecified, so the target period has no asserted start.
support_condition: Identify the models Marcus had encountered by publication and establish recurring fabrication in each through documented outputs or suitable evaluations.
contradiction_condition: Identify a model within that set and show, through sufficiently broad and relevant evaluations, that fabrication was exceptional rather than recurring. Occasional correct answers would not suffice.
measurement_requirements: Model versions, prompts, evaluation procedures, and denominators are needed to distinguish recurring fabrication from selected failures. Benchmark falsehood rates must not be treated as general-use fabrication rates.
source_requirements: Independent evaluations or original model evaluations, plus records identifying Marcus's model exposure. His own assertions cannot establish the claimed behavior.
