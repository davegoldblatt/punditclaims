explicit_source_elements:
  - current revenues
  - tens of billions
  - low hundreds of billions if you are really optimistic
  - against Capex in the trillions
evaluator_interpretation:
  - The surrounding discussion implies US dollars and revenues from selling AI services, rather than all revenue earned by companies involved in AI.
  - The plain reading compares the current scale of revenue with the infrastructure investment being undertaken or planned. It does not clearly specify equal measurement periods.
  - For current reported financial activity, use April–June 2026, the latest completed calendar quarter before publication. This does not turn an annualized estimate into realized quarterly or annual revenue.
  - The cited economic analyses indicate an estimate basis. The optimistic revenue range is an allowance, not a conditional forecast.
support_condition: A clearly defined industry revenue estimate in the stated range, together with a separately defined trillion-dollar capex total, using the revenue basis and investment window intended by the claim.
contradiction_condition: Comparable estimates establish that revenue materially exceeds the allowed range or that capex is below a trillion dollars over the intended investment window.
measurement_requirements: Identify the companies, remove overlapping revenue, distinguish realized revenue from annualized revenue, and distinguish completed expenditure from forecasts and commitments. Specify the capex accumulation window before comparing amounts.
source_requirements: Company disclosures or transparent aggregate estimates. An analyst's forecast is evidence of projected expenditure, not completed expenditure.
