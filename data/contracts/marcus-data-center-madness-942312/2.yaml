interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Current revenues has no named measurement date; the latest completed month and subsequent pre-post updates are used.
  - AI revenues does not specify geographic coverage, service categories, or treatment of transactions between providers.
  - Low hundreds has no exact numerical ceiling.
  - Capex in the trillions does not distinguish an annual spending rate from cumulative expenditure or the capital stock supported by repeated spending.
  - The context names 2027 annual capex but no cumulative spending endpoint.
