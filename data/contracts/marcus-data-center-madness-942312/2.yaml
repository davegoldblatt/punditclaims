assessment_axis: historical_observation
explicit_source_elements:
  - current revenues
  - tens of billions
  - low hundreds of billions if you are really optimistic
  - against Capex in the trillions
evaluator_interpretation:
  - Read current revenues as the estimated annual revenue run rate of AI services. Do not require realized quarterly revenue.
  - Use July 2026, the latest completed calendar month before publication, and updates through August 21 as the observation period. This identifies when the revenue rate held, not a period over which revenue must be accumulated.
  - "The context allows projected capital spending: it explicitly cites expected hyperscaler capex in 2027. It does not require trillions already spent by publication."
  - The capex comparison must retain each source's spending window. The passage supplies 2027 for an annual projection but supplies no ending date for cumulative spending. Do not silently substitute an evaluator-selected multiyear total.
  - Treat the optimistic qualification as an allowance for estimation uncertainty, not a conditional forecast.
  - The single metric_scope object below describes the revenue component. The separate capex measures and periods are specified in measurement_requirements and on their evidence items.
support_condition: Contemporaneous estimates place annualized AI-service revenue in the tens or low hundreds of billions of US dollars, and the referenced investment program establishes trillion-scale data-center capex on an identifiable spending basis and time window.
contradiction_condition: Comparable evidence places annualized AI-service revenue clearly outside the allowed range, or establishes that the referenced capex is below trillion scale over its actual stated window. A smaller current-year spending figure alone does not contradict a comparison involving projected investment.
measurement_requirements: "Revenue: annualized AI-service sales estimates, with coverage and double counting disclosed; hardware sales and all-purpose cloud revenue are not substitutes. Capex: estimated or announced capital expenditure in USD, retaining its annual or cumulative period. Test the explicitly referenced annual 2027 projection separately from cumulative buildout estimates. Do not equate required revenue, depreciated asset stocks, financing, or operating commitments with capital expenditure."
source_requirements: Prefer original research and company disclosures available by 2026-10-28. Reporting may establish industry estimates where no consolidated company disclosure exists. Later publications must describe the relevant pre-post state.
