assessment_axis: historical_observation
explicit_source_elements:
  - SoftBank, based on my analysis, does not appear to have the money
  - to cover the $40 billion or more in commitments it's made
  - without taking on significantly more debt
  - or selling valuable shares in the companies it holds ownership stakes in
  - "commitments: at least $30 billion of OpenAI's $40 billion round, paid over 12 to 24 months starting as soon as spring; $19 billion to Stargate; $3 billion a year on OpenAI agents"
evaluator_interpretation:
  - "He hedged ('based on my analysis', 'does not appear'). We do not treat this as a claim that SoftBank could not possibly have paid any other way. The plain reading is narrower: to meet these commitments, SoftBank would have to rely on significant new borrowing or on selling valuable stakes, not on cash it already had."
  - Whether SoftBank could have paid from existing cash cannot be observed directly. The best test is how SoftBank actually paid. If its own disclosures show it funded the OpenAI payments mainly with significant new debt or sales of valuable holdings, that supports the claim. If it paid from existing cash without material new debt or stake sales, that contradicts it.
  - "Target period: 24 March 2025 (the post date) to 31 March 2026. This is the shortest payment schedule he cited for the OpenAI money ('12 to 24 months starting as soon as spring'). It covers the main OpenAI payments."
  - Commitments SoftBank made later (such as the further $30 billion OpenAI investment agreed in February 2026) are outside the commitments he described. They are context only.
support_condition: SoftBank disclosures, or reliable reports of them, show that it paid its 2025 OpenAI commitments with significant new borrowing (bridge loans, margin loans, bonds) and/or by selling valuable stakes in companies it held.
contradiction_condition: SoftBank paid these commitments mainly from cash it already had or from operating cash flow, without significant new debt or sales of valuable holdings.
measurement_requirements: "SoftBank's disclosed funding sources for its OpenAI payments between March 2025 and March 2026: new debt taken on and stakes sold, compared with the size of the payments."
source_requirements: SoftBank earnings disclosures or reputable news reports of them.
