ambiguity_flags:
  - Hedged wording ('does not appear'); the claim is graded as a judgement about what SoftBank would need, not as proof that it could not have paid any other way.
  - The size of the commitments changed after the post. The OpenAI round was restructured, with $22.5 billion paid in December 2025.
  - Target period chosen from his stated 12-to-24-month payment schedule.
