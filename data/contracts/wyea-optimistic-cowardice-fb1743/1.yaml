evaluator_interpretation:
  - Assess SoftBank Group's available funding against the commitments' payment requirements, rather than its market capitalization or investment gains.
  - The latest reported balance-sheet date before the post was December 31, 2024; use that date for the liquidity observation.
  - A present cash shortfall is relevant but does not by itself prove that borrowing or stake sales were necessary over a multiyear payment schedule.
  - Significant means a material financing gap relative to the stated $40 billion, rather than routine refinancing. No arbitrary percentage is imposed.
support_condition: Available liquidity and reasonably available non-debt, non-stake-sale funding were materially insufficient to meet the specified commitments when payable.
contradiction_condition: A documented funding schedule shows that the commitments could be met using existing liquidity and other permitted funding without material additional borrowing or sales of ownership stakes.
measurement_requirements: Reconcile parent and consolidated liquidity, exclude undrawn debt from cash already held, convert currencies using a dated rate, and identify payment dates and overlapping obligations.
source_requirements: SoftBank financial disclosures and commitment terms. Later financing decisions can provide context but do not alone prove earlier necessity.
