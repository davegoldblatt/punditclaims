assessment_axis: historical_observation
explicit_source_elements:
  - Within a single quarter
  - nearly half of its last fiscal year contribution to Microsoft
  - concentration of overall revenues growing at an alarming rate
  - having trouble raising money to pay its bills
  - almost 11%
  - around 7% of Microsoft’s Fiscal Year 2026 revenues
evaluator_interpretation:
  - Assess the factual revenue comparison and the accompanying financing difficulty. 'Alarming' expresses the author's judgment and has no separate numerical test.
  - The revenue comparison is Microsoft FY2026, July 2025 through June 2026, against Q1 FY2027, July through September 2026. Compare revenue shares, not annual revenue against annualized quarterly revenue.
  - The ongoing fundraising statement describes conditions immediately before the November 3 post. The target interval includes the annual baseline, the latest reported quarter and that contemporaneous financing state.
  - The plain reading of 'to pay its bills' is difficulty obtaining financing needed for operating or contractual payments. It does not require an actual default, but reduced investor interest alone does not establish the connection to payment needs.
  - "'Nearly half' is an approximate description without a specified tolerance. Report the calculated fraction rather than invent a pass threshold."
  - Use estimate for the contract's accounting basis because the context explicitly relies on press reporting. Preserve company-reported figures separately.
support_condition: Comparable records establish approximately 7% annual and 11% quarterly revenue concentration, a quarterly contribution reasonably described as nearly half the annual contribution, and contemporaneous difficulty securing financing needed for OpenAI's payments.
contradiction_condition: Comparable records materially refute the revenue comparison, or contemporaneous financing and payment records establish that the claimed financing difficulty did not exist. A successful investment alone does not establish the latter.
measurement_requirements: Use Microsoft's realized revenue from commercial arrangements with OpenAI, including revenue-sharing payments, divided by Microsoft's consolidated revenue for each matching period. Calculate the quarterly contribution divided by the prior annual contribution. For financing, distinguish commitments, completed investments, available cash and payments due.
source_requirements: Prefer Microsoft filings and investor disclosures. Where unavailable, use accessible reputable reporting identifying the underlying records. Establish the fundraising-to-payments connection through company records or attributable contemporaneous reporting.
metric_scope:
