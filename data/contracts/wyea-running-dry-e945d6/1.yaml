ambiguity_flags:
  - No numerical tolerance for 'nearly half'.
  - "'Alarming' is evaluative."
  - "'Pay its bills' does not identify payment amounts, deadlines or available liquidity."
  - The ongoing fundraising state is interpreted as the latest publicly reportable state before the post.
  - The claim combines two revenue periods with a later contemporaneous fundraising observation.
  - Reading 'pay its bills' merely as raising capital for general corporate purposes would require less evidence.
