  - He's the one
  - misled investors
  - the concentration of Microsoft's AI revenue
evaluator_interpretation:
  - "Plain reading: Satya Nadella made public statements to investors that gave a false or materially incomplete picture of how much of Microsoft's AI revenue came from a few customers, chiefly OpenAI."
  - The speaker gave no date. I read it as covering Nadella's investor communications from Microsoft's expanded OpenAI investment (January 2023) up to the post date (2026-08-18).
  - Because 'misled' is a charge of deception, a fair test needs an identifiable misleading statement. That could come from a court or regulator finding, a company correction or restatement, or a clear clash between a specific Nadella statement and later disclosed facts. Pending allegations or analyst ratios on their own do not settle it.
support_condition: A court or regulator finding, a settlement admission, a Microsoft correction, or a specific Nadella statement about AI revenue makeup that later disclosures clearly show was false or materially incomplete about OpenAI's share.
contradiction_condition: Records showing Microsoft and Nadella disclosed OpenAI's share of AI revenue or backlog at the time in a way that left investors fairly informed, or a court dismissing misleading-disclosure claims on the merits.
measurement_requirements: Compare specific Nadella statements to investors about AI revenue with Microsoft's own disclosures of OpenAI-related revenue and backlog, plus any legal findings.
source_requirements: Microsoft filings and earnings calls, court records, or reputable news reports of them.
