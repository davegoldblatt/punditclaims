explicit_source_elements:
  - He’s the one that’s misled investors
  - the concentration of Microsoft’s AI revenue
  - At 70% of Microsoft’s AI revenues
evaluator_interpretation:
  - The pronoun refers to Satya Nadella.
  - The ordinary reading is that his investor communications materially misstated or obscured dependence on OpenAI as a source of AI revenue.
  - Misleading requires an identifiable representation or omission that creates a materially inaccurate impression; customer concentration alone does not establish it.
  - No particular statement or period is named. The financial target is the latest completed fiscal quarter before publication, April through June 2026, with associated disclosures examined as context.
  - The claim does not specify an accounting basis or whether AI revenue means realized revenue or annualized run rate. The scope below uses realized revenue as the ordinary reading, without treating run rate as equivalent.
  - Intentional deception is not required for this assessment.
support_condition: An identified Nadella investor communication materially misrepresents OpenAI's share of Microsoft AI revenue when compared with reliable, contemporaneous figures using the same period, revenue definition, and accounting basis.
contradiction_condition: The identified allegedly misleading communication accurately conveys the actual concentration on the same measure and period, with sufficient disclosure to avoid the alleged misleading impression.
measurement_requirements: Match OpenAI-related revenue to total Microsoft AI revenue for the same period and basis. Separate realized revenue, annualized run rate, broader cloud revenue, and remaining performance obligations.
source_requirements: Complete investor communications and reliable customer-level and total AI revenue records; an authoritative finding identifying a specific misrepresentation could also resolve the claim.
