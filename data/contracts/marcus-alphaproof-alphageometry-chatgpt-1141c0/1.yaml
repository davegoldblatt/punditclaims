explicit_source_elements:
  - LLMs literally can't sanity-check their own work
  - with no inherent way of verifying whether their predictions are correct
  - in literally every transformer released, from GPT-2 to ... SearchGPT
evaluator_interpretation:
  - "Plain reading: LLMs of that era, unaided by external tools or feedback, cannot check their own outputs for errors in a useful way."
  - "'Literally can't' is absolute. Evidence of meaningful self-evaluation ability counts against it. Evidence of failed self-correction counts for it."
  - "Target period: GPT-2 (2019) to the post date (2024-07-28), following the post's own list of models."
support_condition: Controlled studies from the period show that unaided LLMs fail to detect or correct their own errors.
contradiction_condition: Controlled studies from the period show that unaided LLMs can meaningfully evaluate whether their own outputs are correct.
