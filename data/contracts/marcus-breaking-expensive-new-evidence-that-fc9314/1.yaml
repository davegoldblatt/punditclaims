assessment_axis: not_applicable
explicit_source_elements:
  - Two of the most expensive scientific experiments in history
  - Sooo much money down the drain
  - expensive experiments from two of the world's wealthiest men
  - Meta's latest model ... good but not great
  - xAI 'not built right first time around'
evaluator_interpretation:
  - "The 'experiments' are Meta's and xAI's efforts to reach frontier AI mainly by scaling compute and data. The post does not say which costs count: the training of one model, AI capex, talent, or whole data-center build-outs."
  - "'Most expensive scientific experiments in history' is a rhetorical comparison. It treats corporate product and infrastructure spending as a 'scientific experiment' and sets no cost figure or comparison list."
  - "'Money down the drain' is a value judgment. It says the spending was wasted, but gives no test, time frame, or measure of return. Data centers, chips, and models keep running and earning after one model release disappoints, so 'wasted' has no plain reading that can be checked."
  - Reading this as a firm factual claim would require choosing a cost basis and a definition of waste that the speaker did not give. The result would then depend on the evaluator's choice.
support_condition: "It would hold if an agreed cost for each effort ranked it among history's costliest science projects (e.g. Apollo, ISS, LHC, ITER), and if the spending clearly produced no lasting value: for example, assets written off, models abandoned, or programs shut down."
contradiction_condition: It would fail if the attributable costs were well below those of major science projects, or if the spending clearly produced lasting value, such as competitive models, infrastructure in use, and revenue.
measurement_requirements: A defined cost basis for each 'experiment' (capex, training compute, talent) and a defined test for 'down the drain'. The speaker supplied neither.
source_requirements: Company filings or official disclosures of AI spending, plus records of what that spending produced (model releases, asset write-downs, program closures).
metric_scope: null
