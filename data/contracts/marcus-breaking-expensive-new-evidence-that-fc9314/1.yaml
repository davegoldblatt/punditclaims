interpretation_determines_result: true
ambiguity_flags:
  - "Which costs count as 'the experiment' is not defined: AI capex, the training cost of one model, talent, or total investment."
  - Calling corporate AI build-outs 'scientific experiments' is a metaphor, so there is no set list of experiments to rank against.
  - "'Money down the drain' is an evaluative, hyperbolic judgment with no measure and no time frame."
  - The infrastructure bought is general-purpose and still in use, so whether the money was 'lost' depends on judgment, not on any single fact.
