evaluator_interpretation:
  - In context, 'innocent' means free of substantive fault concerning candor toward the board; it is not a claim about criminal liability or every aspect of Altman's character.
  - The claim asserts that the public evidence available by May 29, 2024 established this conclusion, rather than merely raising serious questions.
  - No starting date is supplied for the underlying conduct, so the target period has an open beginning and ends at publication.
  - Later disclosures may test the underlying conduct, but cannot retroactively establish what the public evidence had already demonstrated.
support_condition: The evidence public by publication sufficiently corroborates a material instance of withholding or misrepresentation to reject the specified defense of Altman's candor.
contradiction_condition: Reliable evidence establishes that the material allegations relied upon were false or materially mischaracterized, leaving the specified defense intact.
measurement_requirements: Separate firsthand allegations, independently corroborated facts, and evaluative conclusions. Identify what 'innocent' means in this dispute.
source_requirements: Board accounts, contemporaneous records, and corroborated reporting; Marcus's own descriptions of other OpenAI statements are not independent evidence.
