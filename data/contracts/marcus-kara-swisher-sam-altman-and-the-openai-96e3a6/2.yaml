evaluator_interpretation:
  - "Read the claim through Marcus’s own explanation of the disputed position: whether the board had legitimate reasons to question Altman’s candor. This avoids imposing a separate definition of innocence."
  - Support requires substantive evidence of withholding or misrepresentation relevant to those concerns. It does not require a legal finding, validation of every accusation, or proof that dismissal was necessary.
  - The target is the conduct and disclosures discussed retrospectively through the post date. The post supplies no precise beginning, so the target period has no fixed start.
  - The assessment concerns the position Marcus disputes; it does not independently establish that his description captures all of Swisher’s views.
support_condition: Specific firsthand disclosures, supported by contemporaneous reporting or records, give the board legitimate reasons to question Altman’s candor and thus rebut the position Marcus describes.
contradiction_condition: Reliable records materially refute the cited examples of withholding or misrepresentation and show that they supplied no legitimate basis for the board’s candor concerns.
measurement_requirements: Distinguish evidence of misleading conduct from disagreement over whether that conduct justified dismissal. Distinguish firsthand allegations, corroborating reporting, documentary evidence, and denials.
source_requirements: Use the original interview, relevant company disclosures, and reporting based on participants or documents. Marcus’s writing may establish his meaning but cannot establish the truth of his allegations.
