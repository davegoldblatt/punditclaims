assessment_axis: historical_observation
explicit_source_elements:
  - data center developers have no exit route
  - US economic growth has become shouldered entirely by big tech
evaluator_interpretation:
  - An exit means selling a developer or its projects, or taking the business public.
  - The ordinary reading of 'entirely' is that growth comes exclusively from big tech, not merely that technology investment contributes disproportionately.
  - For this ongoing observation, use July–September 2025, the latest calendar quarter with published GDP estimates before the post.
  - The sentence summarizes an earlier article. It could instead refer to conditions when that article appeared; that date is not specified in the supplied passage.
  - A contradiction of either absolute defeats the combined proposition, but does not establish the opposite of its other component.
support_condition: Evidence establishes that developers had no feasible sale or listing route and that all US real GDP growth in the target period came from big tech.
contradiction_condition: A documented feasible developer exit in the target period, or national accounts showing growth attributable to activities outside big tech, contradicts the corresponding absolute.
measurement_requirements: Distinguish completed transactions from announcements. Distinguish GDP contributions from capital spending, and technology investment categories from particular companies.
source_requirements: Transaction disclosures and official national accounts; independent economic analysis may supply context.
