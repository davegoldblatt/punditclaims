evaluator_interpretation:
  - The plain reading is that generating paraphrases and combining learned textual associations recurrently produces incorrect factual relationships.
  - The claim concerns the model class discussed in December 2022. The metaphor does not require literal copying and pasting.
  - Often means a recurring problem, without an invented numerical threshold.
  - Evidence of factual errors alone establishes the observed problem, but does not fully establish the proposed cause.
support_condition: Controlled evaluations show recurring incorrect factual combinations and connect those errors to combining or paraphrasing textual associations.
contradiction_condition: Comparable evaluations show that factual relationships are reliably preserved, or controlled interventions establish that the proposed process does not explain the alleged recurring errors.
measurement_requirements: Evaluate factual relationships in generated text against verified source material. Distinguish incorrect combinations from repetition of false information already present in training material.
source_requirements: Primary evaluations or controlled studies of models relevant to the December 2022 claim.
