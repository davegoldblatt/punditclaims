explicit_source_elements:
  - we have yet to see any evidence
  - any kind of prompt helps
  - say “I give up” when they can’t
  - solve more USAMO problems
evaluator_interpretation:
  - Assess the publicly checkable research claim, rather than whether the authors personally encountered particular evidence.
  - "Read “in that regard” in its immediate context: acknowledging inability to produce a valid mathematical proof instead of presenting an invalid proof as successful."
  - “Helps” requires evidence of an improvement over a comparison prompt; it does not require perfect reliability.
  - The period covers evidence available through publication on April 5, 2025. “Yet” supplies no starting date.
  - Results about factual questions or deliberately unanswerable multiple-choice problems are relevant context, but do not by themselves establish improved recognition of failure on solvable proof problems.
support_condition: A sufficiently comprehensive contemporaneous review establishes that available research had not demonstrated prompting improvements in acknowledging failure to solve mathematical proof problems. Individual failures under one prompt are insufficient.
contradiction_condition: Research available by April 5, 2025 demonstrates that changing prompts improves appropriate admissions of failure on mathematical proof problems, with independently assessed solution correctness.
measurement_requirements: Compare prompting conditions on comparable problems and models. Measure appropriate admissions of failure and incorrect claims of success; distinguish these from increased solution accuracy, blanket refusal, and recognition of missing problem information.
source_requirements: Use dated primary studies or documented experiments available by the post date. Later experiments cannot establish what evidence existed when the claim was made.
