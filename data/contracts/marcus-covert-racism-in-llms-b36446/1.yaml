explicit_source_elements:
  - On overt measures
  - the systems were fine
  - On covert measures, they were a disaster
evaluator_interpretation:
  - The surrounding discussion identifies the systems and measures as those in Hofmann and colleagues’ newly released study.
  - The ordinary reading is a marked contrast between generally favorable overt associations and strongly negative dialect-based associations. 'Fine' is not interpreted as a guarantee of zero overt bias.
  - The target is the study reported before the post. Its experimental dates are unspecified, so the target period has no invented lower bound.
support_condition: The cited study finds generally favorable overt associations with African Americans alongside strongly negative associations with speakers of African American English.
contradiction_condition: The study finds no substantial covert prejudice, or finds overt associations comparably negative rather than the claimed contrast.
measurement_requirements: Compare overt and covert stereotype results for the same tested models. Distinguish the study’s association measures from unrestricted conversational behavior.
source_requirements: The original study and, where relevant, its subsequent peer-reviewed publication. Later reporting must concern the original findings.
