evaluator_interpretation:
  - The ordinary reading concerns the leading civilian federal AI governance initiatives directed at private companies, rather than every existing law applicable to AI.
  - For the most part means the dominant approach among those initiatives, not a numerical majority of all legal instruments.
  - Company comfort means public acceptance of the voluntary commitments, not proof that companies liked every provision.
  - So far makes this a cumulative observation through 2023-08-29. No historical starting date is supplied.
support_condition: The leading federal initiatives available by the post were principally voluntary guidance or commitments accepted by participating companies, while binding AI-specific obligations were exceptions.
contradiction_condition: Binding AI-specific requirements predominated among the leading initiatives, or the central supposedly accepted voluntary measures were rejected by the companies concerned.
measurement_requirements: Establish the legal status and company acceptance of the principal initiatives. Distinguish new AI guidance from existing enforceable consumer-protection and civil-rights law.
