assessment_axis: historical_observation
explicit_source_elements:
  - Large language models
  - still hallucinate
  - still make boneheaded errors
  - lack a proper concept of reality
evaluator_interpretation:
  - Hallucinate means produce plausible factual claims that are false or unsupported.
  - Boneheaded errors means failures on seemingly simple reasoning tasks.
  - "Read a proper concept of reality behaviorally: dependable, coherent reasoning about real-world facts, physical constraints and actions. Do not interpret it as asserting that models contain no representations of the world."
  - For this ongoing state, use the latest pre-publication reporting month, February 2026, through the post date.
  - The claim concerns recurring limitations across LLMs, not failure by every model on every task.
support_condition: Contemporaneous evaluations document hallucinations, simple reasoning failures and recurring failures to respect real-world constraints in capable LLMs.
contradiction_condition: Contemporaneous, broad evaluations establish that these limitations had been reliably resolved across relevant tasks and model configurations.
measurement_requirements: Use factuality evaluations and reasoning studies covering elementary and real-world tasks. Distinguish behavioral failure from claims about the complete absence of internal world representations.
source_requirements: Independent benchmarks and research reviews available by the cutoff, describing models and capabilities at publication.
