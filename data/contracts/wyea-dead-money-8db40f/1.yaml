evaluator_interpretation:
  - The plain reading is a broad retreat from financing AI data center projects because lenders find their risks unacceptable. One rejected project would not establish the sector-wide claim.
  - Higher Treasury rates and project problems are proposed accelerants, not prerequisites for the main forecast.
  - The speaker gives neither a deadline nor a numerical threshold for lender withdrawal.
support_condition: Documented, widespread withdrawal of financing from AI data center projects because of credit risk, including withdrawal by lenders previously willing to finance risky projects. The acceleration component additionally requires evidence connecting earlier withdrawals to Treasury rates or cashflow or construction problems.
contradiction_condition: Continued lending at a particular date cannot disprove an indefinite eventual forecast. Evidence that the specified problems did not accelerate withdrawal could challenge that component, but would require a credible comparison.
measurement_requirements: Track completed and failed financings, lender participation, withdrawal reasons and project cancellations. Distinguish higher prices and selective lending from a broad inability to obtain financing.
source_requirements: Prefer lender disclosures, financing agreements and project records. Use reputable reporting for confidential lender decisions, identifying its limitations.
