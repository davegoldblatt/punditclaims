  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented broad financing shutdown attributable to unacceptable project risk can settle the main forecast without a deadline. Isolated refusals, market warnings or increased yields cannot settle the whole claim.
