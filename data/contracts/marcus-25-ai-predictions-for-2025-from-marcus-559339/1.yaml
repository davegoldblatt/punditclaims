assessment_axis: forecast_outcome
explicit_source_elements:
  - Less than 10% of the work force
  - will be replaced by AI
  - Probably less than 5%
evaluator_interpretation:
  - The post frames the forecast as replacement during calendar 2025.
  - With no country specified, workforce is read globally. The denominator is people employed at the beginning of 2025.
  - Replaced means a worker's job is eliminated because AI takes over the work. Task changes, exposure to automation, and announced plans are not realized replacement.
  - The firm threshold is below 10%. Below 5% is a secondary, explicitly probabilistic expectation.
  - Net employment growth cannot by itself establish low replacement, because new jobs can offset displaced jobs.
support_condition: A representative estimate or credible upper bound places actual AI replacement during 2025 below 10% of the starting workforce. An estimate below 5% also aligns with the secondary expectation.
contradiction_condition: A representative estimate or credible lower bound establishes replacement of at least 10% during 2025. A result between 5% and 10% supports the firm threshold while missing the secondary expectation.
measurement_requirements: Measure realized gross worker displacement attributable to AI during 2025 against a matching workforce denominator, with uncertainty sufficient to distinguish the thresholds.
source_requirements: Prefer representative labour statistics and studies identifying actual replacement. Exposure indexes, employer intentions, selected layoffs, and net employment changes are context only.
metric_scope: null
original_horizon: end of this year
horizon_interval:
  start: 2025-01-01
  end: 2025-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A reliable count establishing that at least 10% of the starting workforce had already been replaced during 2025 could contradict the firm threshold before year-end.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No geographic workforce is specified.
  - The workforce denominator is not defined.
  - Replaced could refer to gross displacement or lasting exclusion from employment.
  - Probably supplies no numerical probability for the secondary 5% expectation.
retrospective_or_prospective: retrospective
