explicit_source_elements:
  - systems like GPT
  - reliably distinguish truth from fiction
  - routinely lose coherence over long passages of text
  - fabricate endlessly
evaluator_interpretation:
  - The scope is GPT-3-era models available when the post appeared, including InstructGPT.
  - The ordinary reading is recurrent factual and narrative failures, not that every answer is false or that fabrication literally never stops.
  - Long passages means connected, multi-sentence text; Marcus supplies no length threshold.
  - "For this ongoing research assessment, the reporting window is the latest completed calendar year and the current year through publication: 2021-01-01 to 2022-05-21. Research evaluations have no fixed quarterly reporting cycle."
support_condition: Contemporary evaluations show substantial truthfulness failures, repeated fabrication, and recurring inconsistency in connected text.
contradiction_condition: Representative contemporary evaluations show dependable factual discrimination and sustained coherence, with fabrication confined to exceptional cases.
measurement_requirements: Distinguish answer truthfulness, invented information, and narrative consistency. Report task and prompting limitations; isolated demonstrations cannot establish frequency.
source_requirements: Primary evaluations of contemporary models, with inspectable methods and results.
