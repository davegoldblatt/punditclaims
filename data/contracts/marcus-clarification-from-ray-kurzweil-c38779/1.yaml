assessment_axis: forecast_outcome
explicit_source_elements:
  - we will not see AGI
  - by 2029
  - per criteria he discussed here
  - at least three
  - with a single system
evaluator_interpretation:
  - The post links to Marcus's May 2022 proposed bet, including a clarification identified there as added in June 2024.
  - "The linked test requires one system to achieve at least three of five capabilities: explain a movie's characters and motivations; reliably understand a novel beyond its literal text; cook competently in an arbitrary kitchen; reliably produce more than 10,000 lines of bug-free code from natural-language instructions or interaction with a nonexpert, excluding assembly of existing libraries; and con…"
  - I read 'by 2029' as through December 31, 2029, consistent with the linked tests referring to performance in 2029.
  - The reference to criteria defines the outcome; it is not a conditional antecedent that must separately occur.
  - Reliable capability requires repeatable performance across representative tasks. An isolated success does not establish it. Marcus supplies no numerical reliability threshold.
support_condition: After the deadline, a sufficiently comprehensive public evaluation record establishes that no single AI system achieved at least three of the five referenced capabilities by December 31, 2029. A lack of published tests alone is insufficient.
contradiction_condition: Public demonstrations and evaluations establish that a single AI system achieved at least three of the five referenced capabilities on or before December 31, 2029, with the breadth and reliability those criteria require.
measurement_requirements: Evaluate the referenced capabilities directly and identify the system, version, tools, human assistance, task selection, and repeatability. Do not combine successes from unrelated systems or substitute a differently defined AGI benchmark.
source_requirements: Publicly inspectable demonstrations and evaluation records, preferably independently evaluated or replicated. A declaration that AGI has arrived is insufficient without evidence meeting the referenced criteria.
metric_scope: null
original_horizon: by 2029
horizon_interval:
  start: 2024-06-22
  end: 2029-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as contradicted only if a dated, publicly inspectable evaluation establishes that one system has achieved at least three referenced capabilities. Present failures cannot establish the negative forecast before its deadline.
interpretation_determines_result: false
ambiguity_flags:
  - The post says 'by 2029'; the linked proposal says 'in 2029'.
  - The criteria do not specify numerical thresholds for accuracy, reliability, or competence.
  - The boundaries of a single system and permitted assistance are not fully specified.
  - The linked page identifies its single-system clarification only as added in June 2024, without an exact date.
retrospective_or_prospective: prospective
