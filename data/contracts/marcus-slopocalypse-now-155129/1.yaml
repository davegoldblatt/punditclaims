explicit_source_elements:
  - The AI industry magic sauce of “scaling”
  - hasn’t made the enshittification situation better
  - it has made it worse
evaluator_interpretation:
  - The plain technical reading of scaling is increasing model size, training data or computation.
  - The asserted outcome is a worsening public information environment through erroneous, deceptive or low-quality AI content by August 4, 2025.
  - The claim requires a causal contribution from scaling, rather than merely concurrent growth in AI adoption or detected incidents.
  - Improved benchmark accuracy and increased total production of bad content can coexist; neither alone settles the overall claim.
support_condition: Comparisons that separate scaling from other changes show that increased AI scale caused greater production, dissemination or exposure to defective content by the post date.
contradiction_condition: Comparable causal evidence shows that scaling reduced the relevant content harms, with no offsetting increase sufficient to support the asserted worsening.
measurement_requirements: Specify the scaling intervention and measure downstream content quality or exposure. Separate model size and compute from post-training, deployment volume, user behavior and detection changes.
source_requirements: Prefer controlled scaling comparisons and deployment studies with a credible causal design. Model benchmarks alone are contextual unless connected to the claimed public-content outcome.
