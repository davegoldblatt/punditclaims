assessment_axis: causal_assessment
explicit_source_elements:
  - post-SVB
  - AI companies with no revenue
  - raise tens of millions
  - $150 million, in the case of Character.ai
  - because they resemble what’s “hot”
  - without any consideration as to whether they’re real businesses
evaluator_interpretation:
  - Assess both the financing example and the asserted reason investors supplied the money. Funding announcements alone cannot establish the causal claim.
  - Read no revenue as the company's status when it raised the cited round, rather than a claim that Character.AI remained without revenue on publication day.
  - Read real businesses in context as businesses with a credible route to sustaining operations through sales.
  - The target period is the post-SVB portion of March 2023 through publication on June 28, 2023. Month precision reflects the period described; later June events are excluded.
  - The financial scope records the explicitly quantified Character.AI example. The post links to press reporting, so its financial basis is estimate.
support_condition: Evidence establishes the cited pre-revenue financing and shows that perceived AI popularity drove the investment without substantive consideration of commercial viability.
contradiction_condition: Reliable evidence disproves the cited financing or pre-revenue status, or contemporaneous investment records show substantive consideration of commercial viability inconsistent with the categorical claim.
measurement_requirements: Distinguish financing proceeds from revenue. Establish revenue status at the financing date. Assess investment motives using contemporaneous decision records, rather than inferring them solely from a large funding round.
source_requirements: Prefer financing disclosures and investor decision records. Reputable reporting may establish private-company revenue status. Promotional investment announcements provide limited evidence about actual diligence.
