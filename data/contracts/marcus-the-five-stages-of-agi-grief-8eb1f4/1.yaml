assessment_axis: historical_observation
explicit_source_elements:
  - zero justification
  - current technology
  - has achieved general intelligence
  - flexible and general, with resourcefulness and reliability comparable to (or beyond) human intelligence
evaluator_interpretation:
  - Read the claim as saying there was no adequate empirical basis for declaring general intelligence achieved under Marcus's accompanying definition. Evidence of individual general abilities would not by itself contradict this reading.
  - The target is the state of technology on the publication date, 2025-01-07. Capability evaluations have no regular reporting period, so use that snapshot rather than inventing a reporting quarter. Earlier evaluations provide context.
  - Include demonstrated research systems existing by publication, even if they were not generally available.
  - Human-comparable reliability does not require perfection. The relevant comparison is performance across varied unfamiliar tasks, including failures, under comparable testing conditions.
support_condition: Broad, credible evaluations establish that contemporary systems lacked human-comparable flexibility, resourcefulness and reliability, with sufficient coverage to establish that claims of achieved general intelligence had no adequate empirical basis.
contradiction_condition: Credible evaluations establish that a system existing by publication exhibited flexible, general capability with human-comparable resourcefulness and reliability across representative unfamiliar tasks. Success on one benchmark or an assertion using a weaker definition does not suffice.
measurement_requirements: Comparisons across varied tasks, with human baselines, repeated trials, failure rates and disclosed assistance. Marcus supplies neither a numerical reliability threshold nor a specified task distribution.
source_requirements: Prefer original evaluations and research reports concerning systems existing by 2025-01-07. Sources must have been available by 2026-10-28. Later systems cannot settle this historical claim.
