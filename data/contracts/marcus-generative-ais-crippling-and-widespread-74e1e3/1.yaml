assessment_axis: causal_assessment
explicit_source_elements:
  - ChatGPT
  - can’t play it reliably
  - precisely because
  - despite immense relevant evidence
  - never induces proper world model of the board and the rules
evaluator_interpretation:
  - The claim attributes unreliable chess play to failure to learn an adequate board-and-rules representation.
  - The assessment concerns the ChatGPT systems discussed at publication, not subsequent releases.
  - A causal conclusion requires evidence separating representation failure from failures to access or use a representation, prompting effects, and output errors.
  - Proper means functionally adequate for tracking positions and applying rules; it does not require a particular symbolic implementation.
support_condition: Controlled evidence on the relevant ChatGPT versions establishes an inadequate learned board-and-rules representation and shows that this inadequacy causes their unreliable chess behavior.
contradiction_condition: Controlled evidence establishes an adequate learned representation in those versions and attributes the observed failures to another mechanism, or establishes reliable unaided chess play under comparable conditions.
measurement_requirements: Model-specific representation measurements and interventions that isolate their effects on board tracking and legal play while controlling prompting, decoding, and external assistance.
source_requirements: Primary causal or mechanistic studies. Error examples alone cannot establish the proposed cause.
