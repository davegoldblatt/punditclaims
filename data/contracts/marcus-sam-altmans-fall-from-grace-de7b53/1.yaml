explicit_source_elements:
  - In November
  - the narrative
  - everybody loved Sam
  - Things have changed. A lot.
evaluator_interpretation:
  - November means November 2023; the comparison ends on the post date, May 22, 2024.
  - The ordinary reading concerns prominent public coverage and commentary about Altman. It does not assert literal unanimity or a measured change in the whole population's opinion.
  - A substantial shift means a conspicuous critical narrative had developed by May, compared with the widespread support prominent in coverage of his November reinstatement.
support_condition: Contemporaneous records show widespread public support during the November reinstatement episode and a substantial, publicly reported backlash against Altman by May 22, 2024.
contradiction_condition: Comparable records show that the favorable November narrative was absent, or that no substantial critical turn had occurred by May 22, 2024.
measurement_requirements: Compare dated coverage of the November episode with coverage available by the post date. Distinguish public narratives from representative population sentiment and account for criticism in November and continuing support in May.
source_requirements: Contemporaneous reporting and directly attributable public statements. Statements establish the existence of attitudes, not the truth of accusations.
