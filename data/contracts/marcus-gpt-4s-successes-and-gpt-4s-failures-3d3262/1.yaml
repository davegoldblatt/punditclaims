evaluator_interpretation:
  - A bunch means several distinct organizational products or services; three documented integrations suffice.
  - Adopted includes implemented limited pilots, but excludes an announcement of interest without an integration.
  - Because his example is Khan Academy, commercial systems is read as real organizational applications, including nonprofit services.
  - The launch-to-post interval is the latest publicly documented snapshot of adoption at publication.
support_condition: At least three distinct organizational systems, including Khan Academy, had implemented GPT-4 by publication.
contradiction_condition: Reliable records establish that Khan Academy had not implemented GPT-4, or that the claimed several integrations were only unimplemented plans.
