assessment_axis: historical_observation
explicit_source_elements:
  - companies wouldn’t lower the quality of their output
  - just to theoretically save a dollar
  - they would be wrong
evaluator_interpretation:
  - The plain reading is that some companies knowingly accept inferior AI output in pursuit of anticipated savings; actual realized savings are unnecessary.
  - This is an observation about willingness, not a forecast of a particular financial figure.
  - For this ongoing state, use July 2023, the latest complete month before publication. The surrounding passage identifies contemporaneous AI publishing experiments.
  - Publishing an erroneous article alone does not establish either knowing acceptance of lower quality or a cost-saving motive.
support_condition: Contemporaneous evidence connects an employer's acceptance of inferior AI output with anticipated production-cost savings.
contradiction_condition: Reliable evidence establishes that the alleged quality-for-savings decisions did not occur, rather than merely showing that some companies maintained quality.
measurement_requirements: Identify concrete quality defects, management's awareness or acceptance, and evidence of the proposed cost-saving motive.
source_requirements: Prefer internal records or management statements connecting quality and cost. Independent reporting can establish defects but must distinguish observed facts from inferred motives.
