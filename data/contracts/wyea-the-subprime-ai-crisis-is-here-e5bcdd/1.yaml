early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No baseline or numerical meaning is given for far more tokens.
  - Costs could mean customer charges, provider costs per task or aggregate spending.
  - Across the board could mean a general tendency or an exceptionless increase.
  - Marketing move attributes a motive without specifying supporting records.
