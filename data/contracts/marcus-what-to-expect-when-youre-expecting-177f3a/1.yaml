explicit_source_elements:
  - Without external aids
  - won’t be able beat Meta’s Cicero in Diplomacy
  - won’t be able to drive a car reliably
  - won’t be able to reliably guide a robot like Optimus
  - anything like as versatile as Rosie the Robot
evaluator_interpretation:
  - The claim contains three capability limitations, each requiring its own evidence.
  - Minimal interfaces for receiving observations and issuing actions are allowed. Separate planning, retrieval, perception or autonomous-control systems count as external aids.
  - Beat Cicero ordinarily means demonstrated competitive superiority, rather than one lucky result.
  - Reliable driving requires sustained safe performance across realistic driving conditions.
  - Rosie is read as broad household-task versatility, rather than a literal requirement to reproduce a fictional character.
  - Without external aids is a configuration restriction, not an external triggering event.
support_condition: Controlled evaluations establish all three limitations for GPT-4 under the specified restriction.
contradiction_condition: A reproducible evaluation establishes at least one asserted capability under the restriction. If another limitation is independently established, the combined claim is mixed.
measurement_requirements: Direct Cicero comparisons; realistic driving tests with failures and interventions reported; varied household robot tasks with reliability measured. Disclose all assistance and model versions.
source_requirements: Primary experimental reports with sufficient configuration details to distinguish GPT-4 from an augmented system.
