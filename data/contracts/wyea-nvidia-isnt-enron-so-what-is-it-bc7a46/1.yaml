assessment_axis: forecast_outcome
explicit_source_elements:
  - make more money than they cost
  - in the next six years, let alone three
  - They don’t make a profit now
  - have no path to doing so in the future
  - Oracle’s Blackwell GPUs have a negative 100% gross margin
evaluator_interpretation:
  - In the surrounding discussion of recovering capital expenditure, the ordinary reading concerns whether AI GPU deployments can earn back their attributable capital and operating costs.
  - The exact quotation supplies a six-year testing window despite the supplied normalized horizon being null. Three years is the shorter comparison.
  - The present-tense profitability assertion is a premise within the broader forecast; it is not separately resolved here.
  - The cited Oracle example uses gross margin, which is a plausible alternative reading of profit. A positive quarterly gross margin does not by itself establish cumulative recovery of deployment costs.
  - The estimate accounting basis follows the press-report example. No GAAP, IFRS or company-reported basis is specified for the broader forecast.
support_condition: By December 8, 2031, sufficiently comprehensive deployment-level accounts show that the relevant AI GPU investments failed to recover their attributable capital and operating costs.
contradiction_condition: Credible accounts establish that a relevant big-tech AI GPU deployment recovered its attributable capital and operating costs and earned a positive cumulative surplus within the six-year window.
measurement_requirements: Match revenue and costs to identified GPU deployments and operating periods. Include the relevant original investment, power, facilities and operating costs without double-counting capital expenditure and depreciation. Distinguish quarterly gross margin, operating profit, net income and cumulative investment recovery.
source_requirements: Deployment-level financial disclosures or credible reporting based on identifiable accounts. Company-wide cloud profits and management profitability forecasts alone are insufficient.
