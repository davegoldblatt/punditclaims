explicit_source_elements:
  - Google got better results
  - than it is competitors
  - without using Nvidia GPUs
  - relying solely on their own TPUs
  - buried in the methods
evaluator_interpretation:
  - The methods reference makes model-training accelerators the ordinary hardware scope. This does not assert that Google's entire business uses no Nvidia hardware.
  - Better results means broad benchmark leadership at launch, consistent with the surrounding phrase 'on most measures'; it does not mean winning every benchmark.
  - The period covers development of the launch model and its results through November 19. The training start date is unspecified.
  - Evidence dates for hardware provenance refer to the released model whose provenance is described, not an invented training-completion date.
support_condition: Technical disclosure and reliable reporting establish TPU-only training without Nvidia GPUs for Gemini 3 Pro, while comparable launch evaluations establish broad performance leadership over competing models.
contradiction_condition: Reliable records establish Nvidia GPU use in the model's training, or comparable launch evaluations show that the claimed broad performance advantage did not exist.
measurement_requirements: Identify the model and training hardware. Keep training separate from inference, preprocessing and unrelated Google infrastructure. Compare identifiable competing models under disclosed benchmark conditions.
source_requirements: Prefer Google's model documentation for training hardware and independent launch evaluations for performance. Clearly identify any reliance on reporting for hardware exclusivity.
