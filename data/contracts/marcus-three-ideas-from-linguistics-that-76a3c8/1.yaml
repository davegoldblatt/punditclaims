assessment_axis: causal_assessment
explicit_source_elements:
  - inadequate attention to these three factors
  - the tendency of large language models to lose coherence over time
  - drifting into “empty” language
  - no clear connection to reality
evaluator_interpretation:
  - The causal introduction applies to this bullet; the assessment therefore retains the proposed explanation instead of grading only the existence of incoherent output.
  - Over time means as a generation or discourse continues, rather than deterioration across successive model releases.
  - The ordinary measurable outcomes are loss of consistency, relevance and factual grounding over longer generations. Empty language has no separate technical definition.
  - The causal phrase is part of the proposition, not an antecedent of a conditional forecast.
support_condition: Controlled changes to reference, persistent state representations or compositional mechanisms establish that deficits in the specified capabilities materially cause worsening coherence and grounding over extended generation.
contradiction_condition: Well-controlled tests show that the specified deficits do not materially contribute to length-related coherence and grounding failures, or reliably produce the opposite effect.
measurement_requirements: Compare otherwise similar models or systems across generation lengths. Measure discourse consistency and external factual grounding separately, and control for extra context, sampling, revision and computation.
source_requirements: Primary experiments involving models available at the post. Later experiments are relevant only with a clear link to the historical models and mechanism.
