explicit_source_elements:
  - around $269.4 billion
  - non-cancellable compute commitments
  - the majority of which
  - yet to be realized on Anthropic’s actual books
evaluator_interpretation:
  - The amount is the subtotal for Google, Amazon and Microsoft identified immediately before the claim, not Anthropic’s total infrastructure obligations.
  - Non-cancellable means Anthropic cannot ordinarily cancel at will; contractual remedies for supplier breach do not invalidate that description.
  - I read 'realized on its books' as recognized in the financial statements, rather than merely disclosed in commitment notes or paid in cash.
  - The assessment covers the 2026 agreements and amendments through the post date. The recognition comparison requires the latest financial statements available before the post.
support_condition: The three agreements establish approximately $269.4 billion in minimum commitments, and a comparable accounting reconciliation establishes that more than $134.7 billion remained unrecognized.
contradiction_condition: Comparable disclosures establish a materially different subtotal, ordinary cancellation rights, or recognition of at least half of the stated commitments.
measurement_requirements: Distinguish original contract values from remaining obligations, recognized expenses, balance-sheet liabilities and prepayments. Do not infer accounting recognition solely from payment dates.
source_requirements: Anthropic’s filed agreements, commitment notes and financial statements, with a reconciliation covering the same contracts.
