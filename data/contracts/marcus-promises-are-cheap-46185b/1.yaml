evaluator_interpretation:
  - Fulfillment means at least one million Tesla vehicles deployed in autonomous passenger taxi service by December 31, 2026.
  - Count operating robotaxis, including qualifying owner-supplied vehicles. Vehicle production, registrations, supervised driving subscriptions and cumulative miles do not establish this threshold.
  - The claim concerns the operating fleet, not one million vehicles simultaneously carrying passengers.
support_condition: Reliable records covering the completed deadline establish that Tesla did not reach one million operating robotaxis during 2026.
contradiction_condition: Reliable deployment records establish that Tesla reached at least one million operating robotaxis during 2026.
measurement_requirements: A dated fleet count with definitions distinguishing autonomous taxi operation from supervised driving, registrations, production and mileage.
source_requirements: Tesla deployment disclosures, regulatory records or independently verified fleet measurements available by the evaluation cutoff.
