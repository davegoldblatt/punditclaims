assessment_axis: forecast_outcome
explicit_source_elements:
  - At some point
  - these ugly messes will collapse
  - their entire infrastructure
  - increasingly-automated levels of crap
  - rife with hallucinations
  - devoid of any human touch
evaluator_interpretation:
  - The surrounding discussion identifies Microsoft and Google as examples, but does not define an exhaustive set of companies.
  - The ordinary reading of collapse is a major business or sustained operational breakdown. An isolated, repaired outage is insufficient.
  - "The forecast includes a mechanism: dependence on defective automated work must materially contribute to the breakdown."
  - The descriptions of automation are asserted premises, not an explicit conditional forecast.
support_condition: Public records establish a collapse within the described company scope, and credible technical investigations connect it materially to dependence on defective automated infrastructure.
contradiction_condition: A decisive event permanently rules out the specified outcome for a clearly defined target scope. Continued operation, human oversight today, or improved software alone cannot disprove an indefinite forecast.
measurement_requirements: Establish the affected company, severity and duration of failure, extent of automated work, human oversight, and investigated causes. Distinguish defective AI-generated infrastructure from infrastructure merely serving AI products.
source_requirements: Company or legal records documenting the breakdown, supported by technical incident investigations or independently verified reporting.
metric_scope: null
original_horizon: At some point
horizon_interval:
  start: 2024-11-01
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, verified collapse with the specified causal mechanism can settle the forecast for an unambiguously identified target. A subsidiary outage cannot establish collapse of the broader company class.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The company class is not exhaustively defined.
  - Collapse has no stated severity or duration threshold.
  - No deadline is supplied.
  - The wording leaves unclear whether every described company must collapse.
