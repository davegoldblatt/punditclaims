evaluator_interpretation:
  - ‘Made’ means revenue, not profit, as established by the preceding paragraph.
  - The comparison subtracts combined realized H1 2026 revenue from Anthropic's announced May annualized run rate.
  - The stated gap is assessed to one decimal place in billions of US dollars.
  - The comparison deliberately involves two different measures. Its arithmetic can be checked, but neither measure is substituted for the other.
  - The single metric_scope describes the composite comparison; its component evidence retains separate scopes.
support_condition: Independently established inputs on the stated reporting bases produce a difference rounding to $19.1 billion.
contradiction_condition: Independently established comparable inputs produce a different rounded difference, or an authoritative reconciliation directly disproves the stated difference.
measurement_requirements: Verify both companies' H1 recognized revenue and the precise May run-rate figure. Preserve each company's accounting treatment and distinguish an exact value from a lower bound.
source_requirements: Prefer company disclosures and filings. Use identifiable financial reporting for private-company figures, with any basis differences disclosed.
