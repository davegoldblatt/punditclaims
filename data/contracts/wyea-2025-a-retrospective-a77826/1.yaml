explicit_source_elements:
  - reported cash burn and investments in OpenAI
  - burned more than $4 billion more than we know
  - OpenAI Burned $4.1 Billion More Than We Knew
evaluator_interpretation:
  - Read burned as realized net cash consumption, not accounting net loss, announced investment commitments or gross expenditure.
  - The test is a strictly greater than USD 4 billion difference between actual cash burn and previously public estimates for exactly the same interval and definition.
  - The supplied wording does not identify the burn interval or the earlier public baseline. Bound the historical claim by the post date and leave its starting date unspecified.
  - The contract's period end is an outer temporal bound, not an assumption that the calculation covers all of 2025.
  - Use estimate as the accounting basis because the claim explicitly rests on reported figures.
support_condition: A complete reconciliation identifies the claimed interval and prior public estimate, then establishes realized net cash burn more than USD 4 billion above that estimate on a consistent basis.
contradiction_condition: A complete reconciliation for the same interval and baseline establishes an excess of USD 4 billion or less, or shows that the alleged excess consists of noncash losses, unfunded commitments or transfers between cash and investments.
measurement_requirements: Opening and closing cash and equivalent balances, securities movements, actual financing receipts, cash operating and investing flows, and the contemporaneous baseline estimate. Separate noncash expenses and committed but undisbursed financing.
source_requirements: OpenAI cash-flow records and financing disclosures, or authenticated financial statements reported by independent journalists. Microsoft's investment losses alone cannot establish OpenAI cash burn.
