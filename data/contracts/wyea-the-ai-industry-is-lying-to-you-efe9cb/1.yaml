assessment_axis: historical_observation
explicit_source_elements:
  - nobody appears to be making a profit
  - renting out AI compute
evaluator_interpretation:
  - I treat 'appears' as a claim about publicly evidenced profitability, rather than an uncheckable statement of personal belief.
  - The plain reading is profit attributable to the AI-compute rental activity after relevant costs, including depreciation and financing costs. Positive revenue or adjusted EBITDA alone does not establish this.
  - Use October–December 2025, the latest completed quarter commonly reportable before the post. Providers with different fiscal calendars are aligned to these dates.
  - The surrounding post discusses company financial results, but the claim supplies no common accounting convention. Its accounting basis remains unknown.
  - One verified profitable rental business could defeat the universal statement. Losses at a few providers cannot establish it for everyone.
support_condition: Comprehensive, comparable public results establish that AI-compute rental providers did not earn positive net profit from that activity during the target quarter.
contradiction_condition: At least one provider demonstrably earned positive net profit attributable to AI-compute rentals during the target quarter, after relevant costs and without relying on unrelated business or investment gains.
measurement_requirements: Separate AI-compute rental revenue and costs from other activities. Include depreciation, attributable overhead and financing costs. Distinguish net income from operating income, gross margin and adjusted EBITDA.
source_requirements: Company financial statements or adequately documented activity-level accounts, with reconciliations for any adjusted measures.
