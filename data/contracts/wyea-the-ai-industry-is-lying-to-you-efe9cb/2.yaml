explicit_source_elements:
  - Despite all of those data centers supposedly being built
  - nobody appears to be making a profit
  - on renting out AI compute
evaluator_interpretation:
  - The words 'appears to be' make this a statement of his impression, not a firm claim that no company profits. Turning it into a universal test would add a firmness he did not commit to.
  - He names no profit measure (gross, operating, or net) and no set of companies. The biggest renters of AI compute (AWS, Azure, Google Cloud, Oracle) do not report AI compute profit on its own, so his impression can't be tested without choices he never made.
  - So the claim is treated as not adjudicable. Dedicated AI cloud results are recorded only as context.
support_condition: Not applicable. The claim is a hedged impression with no stated profit measure or company scope.
