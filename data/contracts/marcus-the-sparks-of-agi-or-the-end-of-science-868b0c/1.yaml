explicit_source_elements:
  - Microsoft and OpenAI are rolling out
  - extraordinarily powerful yet unreliable systems
  - multiple disclosed risks
  - no clear measure either of their safety or how to constrain them
evaluator_interpretation:
  - The relevant products are the GPT-4 and Bing systems discussed in the post.
  - Because this describes an ongoing rollout, I use March 1 through March 24, 2023, the contemporaneous reporting window for these releases.
  - Strong capabilities and unreliability mean substantial demonstrated capabilities alongside consequential errors or unsafe responses.
  - I read 'clear measure' as concrete safety evaluations and identifiable constraints. It does not require a comprehensive guarantee of safety.
support_condition: Deployment, capability and failure records support the first clauses, while the contemporary record establishes that usable safety evaluations and constraints were absent.
contradiction_condition: Published safety tests and concrete controls contradict the absence clause. A mixed result is appropriate if the deployment, capability and risk clauses hold while that clause fails.
measurement_requirements: Separate specific safety measurements from overall safety guarantees, and reported mitigations from proof that all risks were controlled.
source_requirements: Contemporaneous deployment records, risk disclosures, documented controls and preferably independent behavioral testing.
