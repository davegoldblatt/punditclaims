assessment_axis: historical_observation
explicit_source_elements:
  - a massive, massively trained large model
  - accompanied by a massive amount of human labor
  - built to filter our bad stuff
evaluator_interpretation:
  - The ordinary reading is that substantial human labeling and feedback contributed to ChatGPT's safeguards against harmful content.
  - The surrounding discussion concerns work used to build the system. It does not assert that humans manually approve every response.
  - I read 'massive' as sustained, large-volume labeling work, rather than a specified minimum headcount or number of hours.
  - The target is the ChatGPT available when the post appeared and the accumulated development work behind it. I use the latest publicly reportable state through 2023-01-18; the source supplies no beginning date.
support_condition: Documentation or reliable reporting establishes substantial organized human labeling or feedback used to develop ChatGPT's harmful-content safeguards.
contradiction_condition: Reliable records establish that the relevant safeguards involved only negligible human work, or that the substantial labeling work described did not contribute to ChatGPT.
measurement_requirements: Evidence should connect human work to ChatGPT and establish its scale through labeling volume, staffing, duration, or comparable records. Human feedback for general quality alone does not establish the harmful-content component.
source_requirements: Prefer contemporary OpenAI documentation and development records. Investigative reporting based on records, worker interviews, and company responses can establish labor details unavailable in public primary records.
