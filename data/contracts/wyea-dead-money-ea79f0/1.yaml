assessment_axis: historical_observation
explicit_source_elements:
  - economics have decayed for the last two years
  - at least in 2025
  - more toxic than OpenAI’s
evaluator_interpretation:
  - Read the last two years as completed calendar years 2024 and 2025 because the passage discusses annual historical financial results and separately allows that 2026 could improve.
  - Read economics through the immediately preceding expense-per-revenue-dollar comparison.
  - Read more toxic in 2025 as the same comparative expense burden, not a separate measurable toxicity claim.
  - Rising dollar losses and worsening loss margins are different propositions.
  - An improvement from 2024 to 2025 is sufficient to refute continuous deterioration across those years; confirming two annual deteriorations would additionally require a 2023 baseline.
  - The compound metric covers Anthropic’s trend and its 2025 comparison with OpenAI. The basis is estimate because the cited historical figures come through reporting.
support_condition: Comparable annual expense-to-revenue ratios deteriorate across the two years, and Anthropic’s 2025 ratio exceeds OpenAI’s.
contradiction_condition: Comparable evidence shows improvement in the claimed two-year deterioration period or reverses the 2025 comparison. If one component holds and the other fails, classify the compound claim as mixed.
measurement_requirements: Compare total operating expenses with realized annual revenue on consistent definitions. Do not treat larger absolute losses as sufficient evidence of worsening margins.
source_requirements: Independent financial reporting or statements covering the annual trend and both companies’ 2025 results.
