evaluator_interpretation:
  - The plain reading is uneven correspondence between prompts and generated images, including difficulty with relationships and role reversals.
  - The horse examples illustrate the general claim; they do not assert that every generation of either prompt must have the same result.
  - The surrounding discussion concerns the generation of systems available since DALL-E 2 appeared in 2022, through the post date. April through September 18 is the assessment window.
  - Support requires documented successes as well as failures, rather than attractive images alone.
support_condition: Contemporaneous evaluations document successful prompt matching alongside substantial failures on other prompts, especially compositional or relational instructions.
contradiction_condition: Representative contemporaneous evaluations show consistently accurate correspondence across ordinary and relational prompts, with the alleged failure pattern absent.
measurement_requirements: Identified models, disclosed prompts and outputs, and human assessment of whether requested objects, attributes, and relationships appear correctly.
source_requirements: Independent experiments or primary reports of inspectable evaluations. Marcus's own descriptions cannot independently confirm the claim.
