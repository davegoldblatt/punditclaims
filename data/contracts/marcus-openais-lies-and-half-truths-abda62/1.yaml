  - decide which faces of the cube to turn
  - taught a robot to do motor control
  - specially instrumented Rubik’s cube
  - bluetooth sensors inside
  - October 2019
evaluator_interpretation:
  - The claim describes the division between an existing move-planning algorithm and learned robotic manipulation.
  - Bluetooth sensors means internal sensors whose readings are communicated through Bluetooth.
  - Teaching the robot includes training in simulation and transferring the learned controller to physical hardware.
  - The wording asserts use of an instrumented cube; it does not explicitly assert that every experiment used one or that OpenAI concealed these details.
support_condition: The October 2019 documentation identifies an existing external solver for move selection, learned manipulation, and use of a customized cube with internal sensing and Bluetooth communication.
contradiction_condition: The documentation shows that OpenAI's learned system originated the solution algorithm, or that the described instrumented Bluetooth cube was not used in the reported work.
measurement_requirements: Check the solver attribution, controller training method, hardware specification and experimental variants.
source_requirements: OpenAI's contemporaneous technical paper and announcement.
