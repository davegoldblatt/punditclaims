assessment_axis: forecast_outcome
explicit_source_elements:
  - artificial intelligence has three quarters to prove itself
  - before the apocalypse comes
  - savaging the revenues of the biggest companies in tech
evaluator_interpretation:
  - "Plain reading: a firm prediction that an AI bust would arrive about three quarters after the March 2024 post (around the end of 2024) and would sharply cut the revenues of the largest tech companies."
  - "'Biggest companies in tech' means the largest US tech firms by market value whose revenue is tied to AI: Microsoft, Alphabet, Amazon, Meta, Nvidia, and Apple."
  - "'Savaging the revenues' means steep, broad year-over-year declines in these firms' reported total revenue. Slower growth alone does not count."
  - The collapse was due around end-2024. Revenue reports lag, so the window runs to mid-2025 (quarters ending by 2025-06-30). This gives the speaker extra time.
  - I do not treat the claim as conditional on a separate test of whether AI 'proved itself'. The sentence says the apocalypse 'comes' and 'will' savage revenues.
support_condition: Most of the largest tech companies report steep year-over-year revenue declines in quarters ending between late 2024 and 2025-06-30, linked to falling AI demand.
contradiction_condition: The largest tech companies report rising year-over-year revenue through the quarters ending late 2024 to mid-2025, with no broad AI-driven revenue collapse.
measurement_requirements: Company-reported total quarterly revenue and year-over-year change for the largest tech companies, for quarters ending between 2024-10 and 2025-06.
source_requirements: Company earnings releases or SEC filings.
metric_scope:
  company: Largest tech companies (Microsoft, Alphabet, Amazon, Meta, Nvidia, Apple)
  metric: Total reported revenue, year-over-year change
  currency: USD
