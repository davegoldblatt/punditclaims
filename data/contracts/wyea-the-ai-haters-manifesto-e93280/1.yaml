assessment_axis: historical_observation
explicit_source_elements:
  - Every single year
  - every single part of the AI bubble becomes more expensive
  - AI labs want to spend more money
  - AI data centers cost more money
  - AI services become more expensive
  - AI debt becomes more expensive
  - everybody becomes decidedly less-patient
evaluator_interpretation:
  - The claim describes an ongoing trend with no named period. I read it as the year before the post (Aug 2025 to Aug 2026), which matches his nearby line 'in the last year'.
  - "Plain reading: in that year, each of the five things rose. Lab spending, data center build cost, the effective price of AI services, borrowing costs for AI debt, and impatience among investors and customers for results."
  - The context concedes that token prices fell or stayed flat. So 'AI services become more expensive' most fairly means total spend or effective cost per task, not list price per token.
support_condition: "Dated evidence from the period showing that all five parts rose: lab spending, data center build costs, the effective cost of AI services, borrowing costs for AI-linked debt, and measurable impatience (for example surveys or investor pressure)."
contradiction_condition: "Dated evidence from the period showing that one or more of the named parts clearly did not rise. Examples: flat or falling effective service costs, cheaper or easier AI borrowing, or steady or rising patience among investors and customers."
measurement_requirements: "Year-over-year comparisons for each component, Aug 2025 to Aug 2026. Needed: lab spending, data center cost per GW, effective AI service prices, AI debt spreads or yields, and survey or market measures of patience."
source_requirements: Company filings and disclosures, credit market data, pricing indexes built from official price pages, and investor or customer surveys. Reputable news when no primary source exists.
