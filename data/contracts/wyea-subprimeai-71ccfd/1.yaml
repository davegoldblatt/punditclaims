assessment_axis: forecast_outcome
explicit_source_elements:
  - potential human cost of an AI bubble implosion
  - Whether Microsoft and Google
  - slowly wind down their positions
  - cannibalize their companies
  - I fear tens of thousands of people will lose their jobs
  - much of the tech industry will suffer
evaluator_interpretation:
  - The surrounding passage makes an AI bubble implosion the antecedent of the forecast.
  - The alternatives concerning backers describe possible routes, not two conditions that must both occur.
  - Tens of thousands is read as at least 20,000 job losses attributable to the implosion, without imposing an upper limit.
  - Much of the tech industry requires harm across multiple substantial parts of the industry, not one employer.
  - I fear expresses uncertainty, but the passage still presents a conditional outcome that can be investigated.
  - Job losses caused by successful automation or increased AI investment do not alone establish losses caused by an AI bubble implosion.
support_condition: After a documented broad AI bubble implosion, credible records attribute at least 20,000 job losses to it and establish widespread tech-industry harm.
contradiction_condition: After the antecedent occurs, a sufficiently complete account of the implosion and its aftermath establishes that the predicted employment scale or widespread industry harm did not occur.
measurement_requirements: Count actual job losses without double counting announcements, vacancies or overlapping totals. Establish attribution to the implosion and distinguish it from automation, ordinary restructuring and investment expansion.
source_requirements: Employment records, company disclosures and credible causal analysis, preceded by evidence establishing the bubble implosion.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after evidence establishes the antecedent and the predicted attributable job losses and widespread harm. A completed, comprehensively documented aftermath could also establish contradiction.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AI bubble implosion has no geographic or numerical definition.
  - Tens of thousands supplies an approximate scale rather than an exact threshold.
  - Much of the tech industry and suffer lack specified measures.
  - No deadline or duration of the aftermath is supplied.
  - The wording expresses fear rather than certainty.
retrospective_or_prospective: retrospective
