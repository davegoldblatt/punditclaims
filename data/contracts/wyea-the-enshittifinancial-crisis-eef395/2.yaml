assessment_axis: causal_assessment
explicit_source_elements:
  - generative AI is inherently unprofitable
  - thus every single company is on the Silicon Valley Welfare System
  - all signs suggest that the current pace of funding must continue in perpetuity
  - until everybody gives up, or the system itself cannot sustain the pressure
evaluator_interpretation:
  - The funding forecast ('all signs suggest ... must continue in perpetuity ... until everybody gives up') is hedged and open-ended, so it is not scored.
  - The firm, categorical part is the causal premise. Generative AI is 'inherently' unprofitable, and as a result 'every single company' depends on continued venture money ('the Silicon Valley Welfare System').
  - "Plain reading: no generative AI company can run profitably without ongoing outside investor funding. One credible example of a generative AI company that was profitable and self-funded contradicts both 'inherently' and 'every single company'."
  - "'Inherently' is a claim about the technology's nature, not one quarter. So the period is the commercial generative AI era up to the post, 2022 through 2025-12-29. That choice is noted in the ambiguity flags."
support_condition: Evidence shows that every generative AI company, without exception, was unprofitable and kept going only on repeated outside funding during 2022–2025.
contradiction_condition: Credible evidence shows at least one generative AI company that was profitable and funded itself without venture or other outside investors during 2022–2025.
measurement_requirements: Company or founder statements, or reputable reporting, on a generative AI company's profitability and funding sources.
source_requirements: Company disclosures, founder statements in reputable outlets, or reputable news reports.
metric_scope:
  company: Generative AI companies (all)
  metric: Profitability and dependence on outside venture funding
