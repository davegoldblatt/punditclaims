assessment_axis: forecast_outcome
explicit_source_elements:
  - None of these companies are profitable
  - nor do they have any path to an acquisition or IPO
  - "these companies: Cursor, Perplexity, Cognition, Cohere"
  - Because even the most advanced AI software company is ultimately prompting Anthropic or OpenAI's models
evaluator_interpretation:
  - The claim joins two parts. Both must hold for it to be true.
  - "'No path to an acquisition or IPO' is in substance a forward-looking claim: none of the four can expect to be bought or to go public. A real acquisition or IPO of any one of them shows a path existed and contradicts it."
  - The profitability part ('none ... are profitable') describes the state at the post date (December 2025). It is not scored here, because the exit part decides the outcome on its own.
  - He waved away earlier deals as acquihires, licensing arrangements and all-stock purchases. So a 'real' acquisition here means a full purchase of the company that actually closes, with stock that holders can sell.
support_condition: None of Cursor, Perplexity, Cognition or Cohere is fully acquired or completes an IPO, and credible reporting shows no serious buyer or listing route; and none was profitable at the post date.
contradiction_condition: Any of the four signs and completes a full acquisition, or completes an IPO. Or credible evidence shows any of them was profitable in late 2025.
measurement_requirements: A completed, full acquisition of one of the named companies (not a licensing deal or acquihire), or a completed IPO, confirmed by filings or reputable reporting.
source_requirements: SEC filings, company announcements, or reputable news reports (CNBC, TechCrunch, Bloomberg).
