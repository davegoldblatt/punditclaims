assessment_axis: historical_observation
explicit_source_elements:
  - None of these companies are profitable
  - nor do they have any path to an acquisition or IPO
evaluator_interpretation:
  - These companies refers to Cursor, Perplexity, Cognition and Cohere.
  - Profitable ordinarily means positive company-level earnings after expenses, not positive gross margin or growing annualized revenue.
  - For profitability, use July through September 2025, the latest completed quarter that could have been reported before publication. No common public reporting schedule was established for these private companies.
  - For available exit paths, assess circumstances existing by December 29, 2025. The target interval accommodates the financial quarter and the contemporaneous exit-path assertion.
  - A path means a credible, documented route to an acquisition or IPO; it need not already be completed. A stated hope alone is insufficient.
  - A later acquisition does not, by itself, establish that an actionable route existed at the post date.
support_condition: Comparable evidence shows all four companies were unprofitable in the selected financial period, together with evidence of substantive barriers leaving each without a credible acquisition or IPO route at publication.
contradiction_condition: Comparable evidence establishes profitability for at least one named company, or contemporaneous records establish a credible acquisition or IPO route for one of them.
measurement_requirements: Obtain company-level earnings for the same period and identify the accounting basis. Keep cash burn, gross profit, annualized revenue and financing separate. Date exit arrangements to when they existed.
source_requirements: Prefer financial statements, company disclosures, transaction agreements and listing documents. News reporting can provide context where primary records are unavailable.
