explicit_source_elements:
  - 80% of Anthropic and OpenAI’s revenues
  - come from 1% of their customers
  - the vast majority of which are unprofitable AI startups
  - the largest purchasers of these tokens
  - Perplexity, Cursor, and Reflection AI
  - all funded by NVIDIA
evaluator_interpretation:
  - The plain reading applies the concentration claim to total realized revenue and paying customers at each company.
  - A combined-company reading is also possible and should be checked separately if suitable data exist.
  - Use July–September 2026, the latest completed calendar quarter before publication, for revenue concentration, purchaser rankings and profitability.
  - The loss-making-startup qualifier refers to the top customer group. Venture backing alone does not establish losses.
  - Treat the named firms as examples of leading token purchasers, rather than an exact ranking of the three largest.
  - Earlier investment announcements can document financing history, but cannot establish target-quarter purchaser rankings or profitability.
  - No accounting basis is stated. The nearby reference to Ramp concerns growth, so it does not establish a basis for the whole concentration claim.
  - Vast majority and largest purchasers are qualifiers, not conditional antecedents.
support_condition: Comparable customer records establish approximately 80% of total realized revenue from the top 1% of paying customers, show that the overwhelming majority of that group are loss-making AI startups, and verify both the named firms' leading purchaser status and NVIDIA funding.
contradiction_condition: Comparable records materially reject the concentration figures, the claimed composition of the top customer group, or the asserted purchaser and financing relationships.
measurement_requirements: Total revenue and paying-customer counts for each firm; revenue ranked by customer; customer financial results; token-purchase rankings; and investment records. Enterprise samples must remain separate from total company revenue.
source_requirements: Company customer-concentration disclosures or representative transaction data with documented coverage, purchaser accounts and investment announcements.
