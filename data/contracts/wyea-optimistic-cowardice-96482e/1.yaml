assessment_axis: forecast_outcome
explicit_source_elements:
  - I estimate
  - will lose
  - as much as $14 billion
  - in 2025
evaluator_interpretation:
  - The ordinary financial reading of company losses is its annual bottom-line net loss attributable to the company.
  - Read 'as much as' as an upper-end estimate of $14 billion, not a prediction of at least $14 billion.
  - The estimate is based on financial reporting discussed in the context; no GAAP, adjusted-loss, or cash-flow definition is supplied.
  - Calendar 2025 is the measurement year. Cash burn is a separate measure and cannot substitute for net loss.
support_condition: Comparable full-year evidence shows a positive net loss no greater than $14 billion under the upper-bound reading.
contradiction_condition: Comparable full-year evidence shows a net loss greater than $14 billion, or a profit.
measurement_requirements: Calendar-year realized net loss attributable to OpenAI, including applicable accounting charges. Separately identify cash burn and adjusted figures.
source_requirements: Prefer public financial statements. If unavailable, use reputable reporting on full-year financial records and disclose the indirect access.
