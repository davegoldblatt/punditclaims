assessment_axis: causal_assessment
explicit_source_elements:
  - Claude Code isn’t better because of scaling
  - It’s better because it is neurosymbolic
evaluator_interpretation:
  - Read better as greater practical coding capability than the underlying language model used without Claude Code's execution and orchestration components.
  - The contrast attributes the advantage to the claimed symbolic components and excludes scaling as a material explanation.
  - Scaling could mean training compute, model size, data or inference-time compute; evaluate these separately rather than silently selecting one.
  - The causal target is the product discussed on April 11, 2026. Studies of later models and harnesses are context unless they reconstruct that product.
support_condition: Controlled comparisons independently vary the relevant symbolic components and model scale, demonstrating that the components explain the specified coding advantage and scaling does not materially explain it.
contradiction_condition: Comparable controlled evidence establishes a material contribution from scaling to that advantage, or establishes that the claimed symbolic components do not explain it.
measurement_requirements: Specify the comparator, coding tasks, success measure, product version, model, tool access, prompts and compute budgets. Independently vary the proposed causes and report uncertainty.
source_requirements: Reproducible controlled evaluations or sufficiently detailed experiments. Source-code inspection and model rankings alone do not identify the cause.
