assessment_axis: historical_observation
explicit_source_elements:
  - my experience in his commentary on AI
  - of late
  - comment as if he were knowledgeable
  - on just about every topic imaginable
  - often spouting things that simply aren’t true
evaluator_interpretation:
  - The checkable core is a recurring pattern of confidently presented false factual statements across subjects, including AI. Marcus's personal experience and Musk's private knowledge cannot be independently established.
  - I read 'just about every topic imaginable' as ordinary rhetorical language for a broad range of subjects, rather than literally every subject.
  - I read 'often' as recurring errors, without imposing a numerical error rate. Isolated examples alone cannot establish the full breadth claimed.
  - "For the recent pattern, I use January 1 through March 4, 2025: the calendar year through publication. This is an evaluator-selected boundary for 'of late', not a date Marcus supplied."
  - Marcus's reference to his earlier experience with AI commentary has no stated starting date. Recent evidence cannot by itself settle that retrospective component.
  - Confident assertions and endorsements can establish the outward manner of commentary. They do not establish deliberate deception or actual ignorance.
support_condition: Documented statements and reliable checks establish recurring, confidently presented factual falsehoods across a broad range of subjects, with evidence addressing the AI component. The examples must be attributable to Musk and distinguish falsehoods from opinions, unsettled predictions, and merely unsupported allegations.
contradiction_condition: A sufficiently broad record shows that the statements offered as examples were accurate, materially misattributed, or accurately qualified, and that the alleged recurring pattern does not hold. A few accurate statements would not suffice.
measurement_requirements: Dated statements in context, independent checks against underlying records, and enough subject coverage to assess a pattern. Treat reposting as amplification, not necessarily authorship. Do not infer private knowledge from factual error.
source_requirements: Prefer original statements and primary records establishing the underlying facts. Use reputable reporting when direct records cannot be obtained, identifying that limitation. Exclude Marcus's own writing as outcome evidence.
