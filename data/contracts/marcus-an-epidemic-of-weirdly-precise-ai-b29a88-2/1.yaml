  - at any price
evaluator_interpretation:
  - "The plain reading concerns established engineering capability as of October 2024: an autonomous humanoid that safely and dependably performs a broad range of useful tasks in ordinary operation."
  - Generally useful requires broader capability than a narrow industrial task or a selected demonstration. It does not require performing every human task.
  - Safe and reliable mean suitable for ordinary intended operation, not zero risk or perfect success.
  - Commercial sale is not required; a sufficiently validated research prototype could contradict the claim.
  - Right now is assessed over October 1–30, 2024, ending on the post date. Earlier demonstrations are context.
  - At any price removes an affordability restriction; it is not a conditional antecedent.
  - Nobody knows is read as no established demonstrated capability, rather than a claim about inaccessible private knowledge.
support_condition: Contemporaneous technical assessments and operational records show that broad, dependable, safe humanoid operation remains an unsolved development goal, while leading demonstrated systems perform restricted tasks.
contradiction_condition: At least one humanoid existing by the post date has credible operational validation of safe, reliable autonomous performance across a broad range of useful tasks, regardless of cost.
measurement_requirements: Assess task breadth, autonomy, repeated performance, operating conditions, human intervention, and safety evidence together. A marketing label or successful isolated demonstration is insufficient.
source_requirements: Contemporaneous technical assessments, manufacturer and customer operational disclosures, and preferably independent evaluations. Later advances cannot contradict an October 2024 observation.
