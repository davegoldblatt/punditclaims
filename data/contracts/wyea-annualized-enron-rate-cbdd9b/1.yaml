explicit_source_elements:
  - Anthropic and OpenAI
  - a massive bump of new revenues
  - funded by AI startups
  - allowing users to burn tokens without restraint
  - with every release
evaluator_interpretation:
  - The plain reading is that each provider's model releases consistently cause substantial incremental revenue through subsidized consumption by startup customers.
  - New revenue means additional realized revenue, not migration between models or an increase in an annualized run rate.
  - Every release is a universal claim about the release history through publication. The source supplies no starting date, measurement window, or numerical definition of massive.
  - The surrounding argument relies on reported figures and spending estimates, so the financial basis is estimate.
support_condition: Release-level records for both providers show substantial incremental realized revenue after every relevant release, attributable to startup customers subsidizing additional token consumption.
contradiction_condition: A documented release produces no substantial incremental revenue, or reliable attribution shows that its increase came predominantly from another source rather than the claimed startup subsidy mechanism.
measurement_requirements: Comparable revenue windows around releases; customer-level token charges and actual supplier discounts; startup subscription receipts and subsidies; controls for price changes, seasonality, customer acquisition, and migration from older models.
source_requirements: Provider revenue records matched to release dates and startup billing records. Aggregate adoption, token volume, and annualized revenue are insufficient.
