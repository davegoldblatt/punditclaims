assessment_axis: forecast_outcome
explicit_source_elements:
  - requires more compute resources than anyone has ever needed
  - will continue to do so
  - in perpetuity
evaluator_interpretation:
  - Read as a claim that OpenAI’s total organizational compute requirement exceeds every other organization’s historical requirement and will retain that position indefinitely.
  - Compare total compute across research, training, and inference, including rented capacity. A single cluster, hardware ownership, spending, or announced construction is not the same measure.
  - Comparable deployed computing capacity can inform requirements, but does not automatically measure unmet demand.
  - In perpetuity supplies no finite deadline. The present-tense assertion is retained as part of the continuing claim.
support_condition: Comparable evidence establishes the claimed historical maximum and its continuation. Finite observations can support a bounded portion but cannot establish perpetuity.
contradiction_condition: A dated, comparable organizational measurement establishes that OpenAI did not hold the claimed maximum at publication or subsequently ceased to hold it; permanent cessation of its compute-requiring operations would also contradict continuation.
measurement_requirements: Organization-wide compute requirements measured consistently, with processor performance normalized and rented capacity attributed without double counting. Separate actual requirements, available capacity, and future commitments.
source_requirements: Technical disclosures or independent measurements with transparent coverage, dates, attribution, and uncertainty.
metric_scope: null
original_horizon: in perpetuity
horizon_interval:
  start: 2025-04-14
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A verified loss or absence of the claimed organizational maximum, or permanent cessation of OpenAI’s relevant operations, can conclusively contradict the unlimited assertion. No finite lead conclusively supports perpetuity.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Compute resources has no stated unit.
  - Needed could mean actual usage, installed capacity, unmet demand, or future plans.
  - Anyone could include entire hyperscalers or only their AI laboratories.
  - The claim combines a current historical maximum with indefinite continuation.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
