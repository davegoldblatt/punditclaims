assessment_axis: forecast_outcome
explicit_source_elements:
  - in the next few months and years
  - as the AI bubble unravels
  - just about every part of the industry
  - its own flavor of concentration risk
evaluator_interpretation:
  - Unravels means a broad reversal of the AI investment boom, visible across financing, valuations and infrastructure investment, rather than one company's setback.
  - Concentration risk means material dependence on a small set of customers, funders, suppliers or counterparties across the industry's main segments.
  - The timing phrase indicates the coming months and years but supplies no finite latest date. Assigning an exact number of years would invent a deadline.
  - More frequent use of the term is an accompanying expectation, not sufficient evidence that the financial unwind occurred.
support_condition: Evidence establishes a broad, sustained AI investment unwind accompanied by material concentration exposures across the principal industry segments.
contradiction_condition: A bounded version could be contradicted by sustained expansion without the claimed unwind through its deadline. This wording supplies no finite deadline, so continued expansion alone cannot conclusively falsify it.
measurement_requirements: Comparable sector-wide financing, valuation and investment series, plus documented customer, supplier and funding exposures. Isolated price falls or project delays are insufficient.
source_requirements: Primary financial and market records, official financial-stability analysis and independently verified reporting covering multiple industry segments.
metric_scope: null
original_horizon: in the next few months and years
horizon_interval:
  start: 2026-09-08
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A decisive event must establish a broad AI-sector financial unwind through connected financing failures, defaults or cancellations and sustained investment contraction, with documented concentration exposures across major industry segments. A single market selloff does not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Few months and years has no finite numerical upper bound.
  - Unravels has no numerical magnitude or duration threshold.
  - Just about every part does not specify industry segments or a coverage threshold.
  - The frequency implied by a lot has no baseline.
retrospective_or_prospective: retrospective
