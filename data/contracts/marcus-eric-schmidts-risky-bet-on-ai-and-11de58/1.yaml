explicit_source_elements:
  - Almost every putative virtue of AI
  - aside from making a small number of people rich
  - has been promissory
evaluator_interpretation:
  - The ordinary reading is that an overwhelming majority of claimed societal benefits had not been realized by publication.
  - The surrounding 'so far' makes this a cumulative historical claim through October 5, 2024. No starting date is specified.
  - Individual demonstrated benefits are relevant exceptions, but cannot by themselves disprove 'almost every'.
  - AI includes specialized systems because this sentence does not restrict its scope to generative AI.
support_condition: A reasonably representative inventory of publicly claimed societal benefits shows that an overwhelming majority remained unrealized by publication, excluding personal enrichment.
contradiction_condition: A reasonably representative inventory shows substantial realization across enough distinct claimed benefits that describing almost all as merely promised is untenable.
measurement_requirements: Define distinct benefits, avoid counting repeated promises separately, and distinguish demonstrated outcomes from forecasts, prototypes and research possibilities.
source_requirements: Use original studies and deployment records to assess realization, alongside a representative record of the promises being evaluated.
