  - Relevant resource denominator and threshold for largely excluded are unspecified.
  - Other approaches could mean other architectures, training methods, or application domains.
  - Many and diminishing returns have no specified population or performance measure.
  - Third-quarter 2025 reporting interval supplied for an ongoing observation.
