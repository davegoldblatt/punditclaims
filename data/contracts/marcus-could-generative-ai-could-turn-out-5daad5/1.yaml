  - By the end of 2026
  - President Trump
  - will have begun to distance himself
  - aggressively pro-AI industry policies
  - his AI strategy in 2025
evaluator_interpretation:
  - Beginning to distance himself requires a material policy departure, not a complete rejection of AI development.
  - A presidentially authorized administration policy and its implementation can establish the beginning of a shift without Trump personally using distancing language.
  - Considering a proposal or continuing existing voluntary evaluations is insufficient by itself.
  - The horizon starts with this May 20 post, as instructed, although Marcus describes an earlier January prediction.
support_condition: By December 31, Trump publicly endorses or his administration adopts and implements a material departure from the 2025 approach, such as government intervention constraining a frontier-model release.
contradiction_condition: At the deadline, a sufficiently complete policy record shows no material departure and continued adherence to the relevant 2025 approach.
measurement_requirements: Compare concrete actions with the actual 2025 policy, including its existing national-security evaluation provisions.
source_requirements: Prefer presidential orders, official policy documents, and direct disclosures from affected companies.
