explicit_source_elements:
  - LLMs
  - great at seeming ... plausible
  - much less good at getting their facts straight
evaluator_interpretation:
  - The plain reading is that LLM answers often sound substantially more credible than their factual correctness warrants.
  - Plausibility means credibility to human readers, not the model's expressed confidence.
  - The claim describes the current state. With no reporting cycle specified, the target period is November 2025 through the post date.
  - The comparison requires evidence connecting perceived credibility with verified correctness. Separate demonstrations of fluency and factual errors are insufficient to establish the size or breadth of the gap.
support_condition: Evaluations of contemporary LLMs show a substantial, recurring gap between human assessments of answer credibility and independently verified factual correctness across a reasonable range of factual tasks.
contradiction_condition: Comparable evaluations show that perceived credibility generally tracks factual correctness, with no substantial recurring gap.
measurement_requirements: Human credibility judgments and independent factual verification of the same answers, with model versions, prompts, sampling methods and uncertainty reported.
source_requirements: Primary evaluations with inspectable methods and results, available by 2026-10-28. Studies of earlier models or periods provide context.
