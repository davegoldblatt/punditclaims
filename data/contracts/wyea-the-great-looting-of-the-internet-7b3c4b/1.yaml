assessment_axis: historical_observation
explicit_source_elements:
  - LLMs are running out of training data
evaluator_interpretation:
  - This assessment covers the supplied normalized proposition about data availability. It does not grade the separate forecast of legal consequences in the same sentence.
  - The ordinary reading is that frontier LLM training was approaching a shortage of useful additional human-generated text at prevailing scaling rates, rather than that every possible training source was already exhausted.
  - A projection can inform that assessment, but its assumptions and distinction between high-quality text and all usable data must be preserved.
  - No period is stated. I use 2024 through publication as the current-state reporting window.
support_condition: Stock-and-demand estimates applicable to the target period show useful additional training text approaching exhaustion at prevailing frontier training rates.
contradiction_condition: Comparable estimates applicable to the target period show that usable new data was not approaching a constraint under then-current training practices.
measurement_requirements: Compare usable data stocks with frontier training demand on consistent token, quality, language, deduplication, and repetition assumptions. Distinguish human-generated text from synthetic or other modalities.
source_requirements: Prefer original supply-and-demand research and dated disclosures from model developers. Preserve the distinction between a conditional projection and an observed shortage.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2024-01-01
  end: 2024-04-15
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - High-quality human text versus all usable training data
  - No time-to-exhaustion threshold for 'running out'
  - Availability may mean technical suitability, access, or legal permission
  - Current-state reporting window inferred because no period is stated
retrospective_or_prospective: retrospective
