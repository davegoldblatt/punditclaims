assessment_axis: causal_assessment
explicit_source_elements:
  - AWS and Azure and Google Cloud
  - their revenues are being buoyed
  - two unprofitable, unsustainable AI labs
  - cannot exist without being funneled tens of billions of dollars each year
evaluator_interpretation:
  - The substantive claim concerns revenue dependence and financing needs. The opening reference to every publication is rhetorical framing.
  - Buoyed means a material contribution to recognized cloud revenue. It does not by itself mean a majority.
  - Unsustainable means unable to maintain the described operations without continuing outside financing, not certain eventual failure.
  - I use April–June 2026, the latest completed reporting quarter before the post, for the current cloud-revenue state.
  - The annual funding assertion requires an annual cash-needs analysis. Quarterly losses or a large fundraising round alone cannot establish it.
  - The focal revenue attribution is an estimate, consistent with the analyst estimates cited in the surrounding passage.
support_condition: Comparable revenue records show material contributions from the labs to all three cloud businesses, and financial records show both labs were loss-making and required recurring outside funding amounting to tens of billions of dollars annually to maintain their operations.
contradiction_condition: Comparable records show that the labs did not materially buoy one or more named cloud businesses, or that a lab could maintain the described operations without the asserted recurring financing requirement.
measurement_requirements: Separate recognized cloud revenue from bookings, commitments and annualized run rates. Assess each lab's losses, operating cash flows, capital spending, existing liquidity and payment obligations separately. Do not equate accounting losses or funds raised with annual funding required.
source_requirements: Provider disclosures or credible customer-level revenue estimates, plus lab financial statements or well-sourced financial reporting. Financing announcements alone are insufficient.
