explicit_source_elements:
  - '"Microsoft, Google, Amazon, Meta, Oracle, and far too many other companies"'
  - '"have been hoarding"'
  - '"hundreds of billions of dollars of AI chips"'
  - "\"either ... can't plug in or simply want to have in supply\""
evaluator_interpretation:
  - "Plain reading: taken together, these firms hold at least $200 billion of AI chips that are bought but not installed or not powered, or are kept in reserve."
  - '"Have been hoarding" describes an ongoing state at the post date. Target period: Q3 2026 through the post date (2026-07-01 to 2026-09-29), the latest period public reporting could cover.'
  - Chips installed and running, even if lightly used, do not count.
support_condition: Credible disclosures or reporting showing that the named firms and others together hold at least about $200B of AI chips not installed, not powered, or held in reserve, around Q3 2026.
contradiction_condition: Credible measurement showing that the combined value of such idle or reserve AI chips at these firms is well below $200B in Q3 2026.
measurement_requirements: Aggregate dollar value of AI accelerators owned by the named firms but not placed in service, around July-September 2026.
source_requirements: Company filings or disclosures on equipment not yet placed in service, or credible reporting or analysis that sizes idle AI chip inventory across firms.
