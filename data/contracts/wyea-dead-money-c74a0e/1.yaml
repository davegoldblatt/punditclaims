explicit_source_elements:
  - Microsoft, Google, Amazon, Meta, Oracle
  - far too many other companies
  - hundreds of billions of dollars of AI chips
  - can’t plug in or simply want to have in supply
evaluator_interpretation:
  - Read 'hundreds of billions' as at least USD 200 billion collectively, not that amount at each company.
  - Read 'hoarding' as holding purchased chips unused pending deployment or as reserves; no separate claim about wrongful intent is required.
  - Value chips at acquisition cost, excluding buildings, power equipment and unfulfilled purchase commitments.
  - Use April–June 2026, the latest completed calendar quarter broadly reportable by the named customers before the post.
  - The estimated accounting basis follows the surrounding discussion of inferred unused-chip values, rather than a cited company inventory total.
support_condition: Reliable company-level inventory evidence establishes aggregate unused or reserve AI chip acquisition value of at least USD 200 billion across the named firms and an identified set of other purchasers.
contradiction_condition: A sufficiently comprehensive, comparable inventory estimate places the total below USD 200 billion, with uncertainty that excludes that threshold.
measurement_requirements: Identify actual purchased chips, ownership, acquisition prices and unused status. Distinguish inventory stocks from purchase flows and broader construction-in-progress balances.
source_requirements: Company inventory records, procurement and commissioning records, or credible independent reporting with a transparent aggregate valuation.
