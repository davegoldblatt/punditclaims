explicit_source_elements:
  - Large language models are not databases
  - glommers-together-of-bits-that don’t always belong together
evaluator_interpretation:
  - "Read 'databases' using the post's explanation: systems that store, retrieve and update explicit records."
  - Read the metaphor as saying that models generate text from learned relationships and sometimes produce incorrect combinations or associations. It need not mean literal copying and pasting of stored passages.
  - Assess the late-2022 model generation discussed in the post, using November–December as the latest deployment and reporting period before publication.
  - The claim does not supply a failure-rate threshold; documented instances suffice for 'don’t always'.
support_condition: Technical descriptions distinguish predictive text generation from conventional record retrieval, and documented results show invented or incorrectly associated factual content.
contradiction_condition: Technical records establish that the relevant models operate as conventional record databases, or establish that the alleged factual combinations were accurate and provide no support for the stated failure mode.
measurement_requirements: Model training and generation descriptions, together with documented factual or citation-generation errors. No claim about the frequency of all errors is inferred.
source_requirements: Primary technical papers or developer documentation, preferably with measured results.
