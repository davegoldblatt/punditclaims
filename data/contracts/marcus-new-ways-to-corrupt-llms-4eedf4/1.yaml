evaluator_interpretation:
  - The scope is the semantic-leakage errors discussed in context, not every representation learned by every LLM.
  - "The plain reading has two components: the generated associations do not warrant the asserted relationship about the person, and the errors arise from word associations rather than concept-level processing."
  - The contextual reference to this summer sets the described observation period to June through August 2025. The dating discrepancy in the cited paper is recorded rather than silently changing that period.
  - Nth order is read as indirect association, not a specified mathematical order.
support_condition: Controlled evidence for the described errors separates irrelevant textual associations from genuine relationships and establishes the word-association explanation over concept-level alternatives.
contradiction_condition: Controlled evidence attributes these same errors to genuine relationships about the entities or establishes a concept-level mechanism incompatible with the claimed word-only explanation.
measurement_requirements: Distinguish an unwarranted relationship about a person from a genuine association between concepts. Use controls that discriminate lexical and conceptual explanations.
source_requirements: Primary experiments; later publications may establish historical facts only if their reported observations concern the target period.
