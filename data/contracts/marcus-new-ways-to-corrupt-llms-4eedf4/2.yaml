assessment_axis: causal_assessment
explicit_source_elements:
  - These kinds of errors
  - not even that LLMs are picking up on real correlations in the world
  - learn weird nth order correlations between words (rather than concepts)
evaluator_interpretation:
  - This is a present-tense explanation of errors such as semantic leakage. The reference to research from 'this summer' does not restrict the mechanism claim to that season.
  - The plain reading is that these errors arise from learned associations among words, rather than genuine relationships between the attributes being inferred or their underlying meanings.
  - The claim concerns the mechanism behind these errors. It does not require proving that LLMs lack conceptual representations in every task.
  - "'Nth order' is read as indirect associations through other words, without assigning a numerical order."
  - The words-versus-concepts distinction has no operational definition in the post. Experiments must distinguish these explanations rather than merely demonstrate erroneous outputs.
  - The assessment axis is causal because the contested assertion explains why the errors occur. No observation reporting window is imposed.
support_condition: Controlled experiments on semantic-leakage errors show that learned word associations explain the erroneous inferences, independently of genuine relationships between the relevant attributes, and distinguish that explanation from one involving conceptual representations.
contradiction_condition: Controlled experiments on the same kinds of errors show that conceptual representations causally explain the effect independently of word associations, or that the disputed inferences reliably track verified real-world relationships between the relevant attributes.
measurement_requirements: Compare matched prompts and interventions that separate wording, meaning, and actual attribute relationships. Output similarity alone establishes leakage but cannot settle whether its internal cause is lexical or conceptual.
source_requirements: Primary experimental research available by 2026-10-28, with methods and controls sufficient to assess the competing explanations. General demonstrations of conceptual processing elsewhere are contextual counterevidence, not a direct refutation.
