assessment_axis: historical_observation
explicit_source_elements:
  - Data centers for AI
  - anywhere from 10 to 100 times
  - larger and more power-intensive
  - those used for things like social media or streaming
evaluator_interpretation:
  - The context measures size in megawatts, so the main comparison is facility electrical capacity. Physical floor area and energy per computation are not silently substituted.
  - The passage includes announced AI projects. Operating capacity and announced ultimate capacity must therefore be identified separately.
  - The ordinary reading is a general facility-level comparison, not a ratio constructed by selecting the largest AI campus and the smallest conventional building.
  - There is no common reporting quarter for these facilities. I use the inventory and capacity state immediately before publication on August 25, 2026; earlier snapshots provide context unless persistence is established.
support_condition: Comparable, sufficiently representative facility data show AI capacity generally within the asserted 10-to-100-fold range relative to social-media or streaming facilities, with consistent facility boundaries and project status.
contradiction_condition: Comparable, sufficiently representative data show that the asserted range does not describe the two facility classes. Selected extremes or comparisons of campuses with individual buildings are insufficient.
measurement_requirements: Match total facility power with total facility power, distinguish IT load from total load, distinguish capacity from actual electricity consumption, and separate buildings, campuses, operating sites, and planned projects.
source_requirements: Prefer operator disclosures, utility or permit records, and documented facility datasets identifying workload, capacity, date, and physical boundary.
