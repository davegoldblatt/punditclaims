ambiguity_flags:
  - The ongoing state has no stated reporting period; the assessment uses the pre-publication inventory snapshot.
  - Larger could mean electrical capacity or physical area; the context uses electrical capacity.
  - Power-intensive could mean total power, power density, or energy per task.
  - AI facilities can also support other workloads.
  - The context compares announced projects with established facilities.
  - Building and campus boundaries are unspecified.
  - The numerical range could describe typical facilities or selected examples.
