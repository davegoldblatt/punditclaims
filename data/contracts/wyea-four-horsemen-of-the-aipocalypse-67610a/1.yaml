assessment_axis: historical_observation
explicit_source_elements:
  - at least 4.6GW
  - of the 15.2GW of data center capacity under construction
  - for OpenAI
  - at least another 4GW
  - reserved for Anthropic
  - through partners like Microsoft, Google and Amazon
evaluator_interpretation:
  - Both customer allocations must belong to the same 15.2GW construction cohort identified in the preceding claim.
  - Another 4GW means additional capacity, without counting the same capacity for both companies.
  - Use April 2026 through the post date as the reporting period for the ongoing construction statement.
  - A future compute agreement establishes a reservation only to its stated extent; it does not automatically establish that the corresponding facilities are under construction.
  - This is assessed as a physical capacity allocation claim, not as a claim about the monetary value of contracts.
support_condition: A reconciled project inventory identifies at least 4.6GW allocated to OpenAI and a separate minimum 4GW reserved for Anthropic within the stated 15.2GW construction cohort.
contradiction_condition: A sufficiently complete inventory of that same cohort shows either allocation below its stated minimum, or shows that meeting the thresholds requires duplicate, operational, unstarted or out-of-cohort capacity.
measurement_requirements: Project and phase identifiers, construction status dates, customer allocations, completion schedules and a consistent power basis across all numerator and denominator figures.
source_requirements: Sightline's dated inventory cross-referenced with construction records and customer or supplier contracts. Aggregate announcements alone are insufficient.
