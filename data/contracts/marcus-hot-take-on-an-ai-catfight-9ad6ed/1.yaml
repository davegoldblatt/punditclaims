explicit_source_elements:
  - immense environmental cost
evaluator_interpretation:
  - Read as a claim of a large aggregate environmental burden from AI data-center infrastructure, including emissions and water consumption.
  - Read 'cost' as physical environmental harm and resource use, not a monetary expense.
  - Use calendar 2023, the latest completed annual historical period covered by the public national data-center assessment available before the post.
  - Treat planned Stargate impacts as context, not as already realized environmental damage.
support_condition: Historical evidence isolates AI infrastructure's contribution and establishes a large aggregate burden through emissions, water consumption or other environmental damage.
contradiction_condition: Comparable historical evidence shows AI infrastructure's aggregate environmental burden was small or negligible, after accounting for its electricity supply and cooling arrangements.
measurement_requirements: Separate AI workloads from other data-center uses; distinguish electricity consumption from emissions, water withdrawal from consumption, and historical estimates from projections.
source_requirements: Primary environmental measurements or transparent research estimates with identifiable workload, geographic and temporal coverage.
