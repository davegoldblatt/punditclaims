evaluator_interpretation:
  - Read the claim as denying that one broad prompt produces a complete, operationally usable Salesforce competitor.
  - A plausible competing CRM need not reproduce every Salesforce product, but must offer usable core CRM workflows, persistent data, access control, and a practical way to operate it.
  - Allow ordinary preconfigured tools and infrastructure, while distinguishing their existence from manual engineering after the prompt.
  - The surrounding discussion concerns late-2025 and early-2026 capabilities. Use that pre-publication capability window, rather than later versions.
  - The hosting and customer-data remarks clarify the intended completeness standard; they are not treated as a universal claim that all CRM software must use public-cloud hosting.
support_condition: Direct contemporary testing and technical evidence establish that a single broad prompt cannot deliver a usable CRM competitor without substantive additional human engineering or setup.
contradiction_condition: A reproducible contemporary trial shows one broad prompt producing a functioning, deployable CRM competitor, with its core workflows and operational requirements verified and interventions disclosed.
measurement_requirements: Specify the model, Claude Code version, initial environment, prompt, human interventions, CRM acceptance tests, and operational checks. A visual mockup or isolated Salesforce extension does not qualify.
source_requirements: Direct trials, artifacts, and technical documentation addressing end-to-end application construction. A lack of published successes is not proof of incapability.
