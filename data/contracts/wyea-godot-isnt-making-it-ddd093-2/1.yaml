evaluator_interpretation:
  - "'This year' means calendar 2024. The threshold is strictly greater than $2.7 billion."
  - I assess the eventual result, rather than only the existence of a forecast.
  - The ordinary reading of an unqualified company loss is an annual net loss. However, the linked contemporaneous report describes its $2.7 billion forecast as cash burn.
  - I preserve the claim's press-estimate basis and do not silently replace it with GAAP net loss, adjusted net loss, or operating cash flow.
support_condition: A realized 2024 loss exceeding $2.7 billion is established on the same financial definition as the forecast cited in the claim.
contradiction_condition: A realized 2024 loss of $2.7 billion or less is established on that same definition.
measurement_requirements: Identify the original loss measure and reconcile the final result to it. Cash burn, GAAP net loss, and adjusted net loss must remain distinct.
source_requirements: Primary financial records, or independently sourced reporting with the definition and period stated.
