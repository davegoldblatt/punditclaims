evaluator_interpretation:
  - "Plain reading: the AI business, meaning the leading generative-AI companies that the spending supports (chiefly OpenAI and Anthropic), was losing money overall around June 2026."
  - Chip suppliers such as Nvidia that profit from selling to the AI buildout are not counted. In context, Marcus means whether AI itself pays back its costs.
  - Net income is the main measure. Operating results are noted as a check.
support_condition: Reported results for the leading AI labs in the first half of 2026 show losses, with no sign of overall profit across the sector.
contradiction_condition: The leading AI labs report net profits for the period, or reliable figures show the generative-AI sector as a whole was profitable.
measurement_requirements: Net income or loss and operating income or loss for OpenAI and Anthropic, covering early to mid 2026.
