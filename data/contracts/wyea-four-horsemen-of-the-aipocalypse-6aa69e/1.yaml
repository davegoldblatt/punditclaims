  - selling more GPUs
  - than can be possibly installed
evaluator_interpretation:
  - The surrounding discussion concerns data-center AI GPUs, rather than gaming graphics cards.
  - The plain reading is that sales outpace physically feasible installation capacity, creating an accumulating backlog. It need not mean that those GPUs can never be installed.
  - Use NVIDIA's latest reported quarter before the post, ending January 25, 2026, for the ongoing sales claim.
  - The contextual claims about warehouse values and installation delays motivate the comparison but are not assumed to be established facts.
  - Market-cap ranking and whether observers care are outside the normalized proposition.
support_condition: Matched shipment and capacity records show that NVIDIA's data-center GPU sales exceeded physically feasible installations during the target quarter, with an accumulating backlog attributable to installation constraints.
contradiction_condition: Matched records show that compatible installation capacity could accommodate the quarter's GPU sales, including ordinary installation lead times.
measurement_requirements: GPU quantities and configurations, compatible powered and cooled capacity, installation dates, existing spare capacity, replacements, geographic coverage and normal delivery lead times. Revenue dollars and total data-center megawatts alone are insufficient.
source_requirements: Prefer NVIDIA shipment records and customer deployment records, corroborated by independent facility-capacity measurements.
