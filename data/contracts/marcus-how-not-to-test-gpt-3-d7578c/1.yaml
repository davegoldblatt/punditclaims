assessment_axis: historical_observation
explicit_source_elements:
  - AI and AI test sets
  - a huge English-language bias
  - DO run tests in other languages
evaluator_interpretation:
  - In context, AI refers to GPT-like language systems and their language and reasoning evaluations, not every kind of artificial intelligence.
  - The plain reading is substantial English predominance in model development and evaluation coverage, with weaker representation of other languages. It does not assert that every model or benchmark is English-only.
  - Huge describes a conspicuous imbalance; no numerical cutoff or population-weighting formula is supplied.
  - "For this ongoing research-state observation, use the latest completed research year and the elapsed publication year: 2022 through 17 February 2023. This observation window is evaluator-selected."
support_condition: Primary documentation shows substantial English predominance in the training or tuning of prominent contemporary language models and in major general-purpose evaluation suites.
contradiction_condition: Representative documentation shows broadly balanced language coverage in both contemporary language-model development and major evaluation suites, without substantial English predominance.
measurement_requirements: Keep pretraining, instruction tuning, benchmark coverage, and cross-language performance distinct. Examine multilingual exceptions and do not equate a training-language share with an accuracy gap.
source_requirements: Prefer developer dataset documentation and benchmark authors' descriptions available for the observation period.
