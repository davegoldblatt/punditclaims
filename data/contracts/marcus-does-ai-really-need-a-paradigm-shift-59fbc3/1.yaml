assessment_axis: forecast_outcome
explicit_source_elements:
  - whenever AGI comes
  - large-scale symbolic knowledge
  - will be crucial
  - tied not to time but to architecture
evaluator_interpretation:
  - Treat AGI's arrival as a demonstrated system with broadly accepted human-level general cognitive capability. Broad acceptance is an evaluator safeguard, not a condition Marcus explicitly specified.
  - Read large-scale symbolic knowledge as an extensive collection of explicitly represented concepts, facts, or propositions used in reasoning. Text in training data alone does not establish this.
  - "Read crucial as central dependence: removing or disabling that knowledge would substantially undermine the system's general capability."
  - Use the first broadly accepted AGI to test the prediction about arrival. Dependence in that system would support this prediction without proving necessity for every possible AGI.
support_condition: The AGI condition is established, and architectural documentation plus component tests show that the arriving system centrally depends on large-scale symbolic knowledge.
contradiction_condition: The AGI condition is established, and sufficiently complete architectural evidence shows that the system achieves its general capability without large-scale symbolic knowledge, or retains that capability when it is removed.
measurement_requirements: Broad capability evaluations, inspectable knowledge representations, and controlled component-removal tests or comparably strong evidence of dependence.
source_requirements: Public technical documentation and independent capability assessments available by 2026-10-28. A developer's AGI declaration alone does not establish the condition.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only when a dated AGI demonstration establishes the condition and architectural evidence establishes central dependence on, or successful operation without, the specified knowledge.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AGI is undefined.
  - Large-scale has no numerical threshold.
  - The boundary between explicit symbolic knowledge and knowledge encoded in neural weights is unspecified.
  - Crucial has no stated measurement.
  - The wording does not distinguish the first AGI from every possible AGI.
  - No deadline is given.
