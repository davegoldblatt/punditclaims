ambiguity_flags:
  - The sentence contains an apparent transcription or editing error.
  - The ongoing observation has no exact period; the preceding week is an evaluator-selected window.
  - "'New' could mean newly discovered, newly publicized, or newly brought to Marcus's attention."
  - "'Almost daily' supplies no numerical tolerance."
  - The distinction between a new concern and another instance of an existing concern is unspecified.
