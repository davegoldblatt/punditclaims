  - Data center debt
  - now pricing
  - increasingly-sour sentiment
  - power delays
  - local pushback
  - these debts won’t actually get paid
evaluator_interpretation:
  - The plain reading is that these concerns are materially increasing lenders' required compensation for risk across the sector, not merely appearing in commentary.
  - I interpret 'now' as conditions prevailing during October 1–6, 2026, before publication. Debt markets report daily, so a quarterly reporting period would be inappropriate.
  - Earlier transactions provide comparison evidence. Later market movements cannot establish conditions at publication.
support_condition: Comparable financing prices or spreads, together with credible lender or investor attribution, establish that power delays, local opposition and repayment concerns materially increased required risk premiums in the target period.
contradiction_condition: Representative comparable pricing and lender evidence establish that the asserted repricing did not occur, or that the named concerns did not materially contribute.
measurement_requirements: Compare similar maturities, credit quality, collateral, guarantees and construction stages. Separate changes in benchmark rates from changes in credit spreads.
source_requirements: Prefer financing documents and dated lender research. Independent market reporting can establish investor explanations, but commentary about possible risks alone cannot establish causation.
