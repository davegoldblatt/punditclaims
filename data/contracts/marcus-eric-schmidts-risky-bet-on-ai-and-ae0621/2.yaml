assessment_axis: causal_assessment
explicit_source_elements:
  - The only potent trick anyone seems to have is scaling
  - the more scaling the big tech companies do, the more power they will consume
  - if we continue on the current path
evaluator_interpretation:
  - The exclusivity statement is qualified by 'seems'. It is not scored as a definite assertion that no other effective method exists.
  - The firm, testable commitment is the directional link between expanding AI computation and increasing electricity consumption at big technology companies.
  - The ordinary reading concerns total electricity needed for larger training and deployment workloads along the described development path. It does not specify proportional growth, a minimum increase, or increasing electricity per individual query.
  - This is assessed as a causal relationship, not a forecast with an invented deadline. Later observations can test that relationship.
  - Efficiency improvements must be considered when assessing total consumption; constant efficiency is not assumed.
support_condition: Evidence links increased AI computation at big technology companies to rising total electricity consumption, with measurements or documented analysis supporting the causal explanation rather than merely showing unrelated company growth.
contradiction_condition: Comparable evidence shows that expanding AI computation along the described path does not increase total electricity consumption, or establishes that the apparent electricity increase comes from other activities while AI electricity use remains flat or falls. Improvements per query alone do not establish this.
measurement_requirements: Distinguish total electricity consumption from electricity per query, installed power capacity, carbon emissions, and projected demand. Identify how AI expansion contributes and disclose whether company totals include other workloads.
source_requirements: Prefer company electricity disclosures and primary research explaining the contribution of AI computation. Company-wide totals without AI attribution provide only limited causal evidence.
