explicit_source_elements:
  - temporary ban
  - on mass deployment
  - not research
evaluator_interpretation:
  - Read 'temporary' as the provisional legal status of the restriction, not a prediction of its duration.
  - Read 'mass deployment, not research' as distinguishing restrictions on the public ChatGPT service from a general prohibition on AI research. This does not imply an exemption for research that processes the personal data covered by the order.
  - "The target is the newly announced Italian restriction: its adoption on 30 March and public announcement on 31 March 2023."
support_condition: The regulator imposed a provisional restriction on OpenAI's processing of personal data through ChatGPT, rather than a general prohibition on conducting AI research.
contradiction_condition: The restriction was permanent, or its operative provisions prohibited AI research generally rather than targeting processing through ChatGPT.
measurement_requirements: Examine the order's operative provisions for duration, regulated entity, application and data-processing scope. Distinguish a general research prohibition from restrictions that could also affect research using covered data.
source_requirements: The Italian data protection regulator's original order and contemporaneous official explanation.
