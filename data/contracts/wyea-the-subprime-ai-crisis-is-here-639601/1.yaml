evaluator_interpretation:
  - The context concerns included usage on paid subscriptions at both companies.
  - The ordinary reading is a large reduction in usable subscription allowances, compared with the allowances available when the claim was published. No numerical threshold is supplied.
  - Comparable measurements must account for model choice, token accounting, billing period and temporary promotions.
  - The subsidy argument predicts economic pressure requiring the cuts. A temporary service interruption alone would not establish that claim.
support_condition: Both companies implement large reductions in comparable included subscription usage after publication, with evidence connecting those reductions to the economics of providing the service.
contradiction_condition: A decisive event establishes that the predicted required cuts cannot occur. An allowance increase or continued generous service for a finite period does not disprove an eventual forecast.
measurement_requirements: Dated before-and-after allowances for comparable plans and models, the affected subscriber population, and evidence explaining the changes.
source_requirements: Prefer dated company announcements and archived plan terms, corroborated by reproducible usage measurements where allowances are not published.
