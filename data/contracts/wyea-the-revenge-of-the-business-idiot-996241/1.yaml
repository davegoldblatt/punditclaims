explicit_source_elements:
  - Anthropic’s customers burning millions of dollars’ worth of tokens
  - nobody knows how much it’s costing
  - whatever it costs today isn’t sustainable
evaluator_interpretation:
  - The ordinary contextual reading concerns customers' total AI costs and financial returns, rather than whether Anthropic can issue an invoice.
  - Sustainable means that continuing the spending can be justified by attributable financial benefits after associated costs.
  - The population is customers spending millions of dollars on Anthropic tokens. The spending threshold has no specified measurement period.
  - I interpret 'today' as the current state during the publication month through May 26, 2026. Earlier financial records provide context unless they establish that state.
  - No accounting basis is identified. Under the money-claim rules, that prevents a supported or contradicted financial verdict.
support_condition: Comparable customer records establish both inadequate knowledge of total costs and financial returns insufficient to sustain the spending across the claimed population. One customer's difficulty does not establish the generalization.
contradiction_condition: A qualifying customer documents its total costs and attributable financial benefits sufficient to sustain the spending. Reliable cost records alone would challenge the cost-knowledge clause but would not establish sustainability.
measurement_requirements: Identify qualifying customers, actual token expenditures, implementation and oversight costs, attributable financial benefits, and the periods measured. Distinguish realized savings from hours saved, forecasts, and annualized spending.
source_requirements: Prefer customer financial records and documented cost-benefit analyses. Vendor testimonials and executive interviews require corroboration for a decisive financial finding.
