explicit_source_elements:
  - Every story about Anthropic’s customers burning millions of dollars’ worth of tokens
  - nobody knows how much it’s costing
  - whatever it costs today isn’t sustainable
evaluator_interpretation:
  - "Plain reading: in public reports about Anthropic customers with token bills in the millions, total costs are unclear or poorly controlled, and current spending is not justified by its attributable benefits."
  - "'Nobody knows how much it's costing' is read as not knowing the full or future cost in relation to output, not as lacking an invoice. The speaker himself cites a known Salesforce figure, so a literal reading would be unfair."
  - "'Isn't sustainable' is read as spending that is not justified by measured returns and is being questioned or cut back."
  - "He named no period. I use reports around the post: April 1 to May 26, 2026."
support_condition: Reports on Anthropic customers with token spend in the millions consistently describe unclear or runaway costs and spending that executives cannot justify or are pulling back.
contradiction_condition: A report on an Anthropic customer spending millions on tokens shows it knows its costs and that the spending is paying for itself (measured returns above cost).
measurement_requirements: News reports or company statements on specific Anthropic customers' token spend, cost control, and measured returns.
source_requirements: Reputable news reports quoting company officials, or company disclosures.
