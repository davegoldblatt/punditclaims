ambiguity_flags:
  - What counts as teaching us 'why' rather than merely predicting or correlating is undefined and philosophically contested.
  - "'Anything whatsoever' is absolute, but the bar ('rather than some other way') is very high."
  - No period was named; I read 'haven't' as cumulative up to the post date.
