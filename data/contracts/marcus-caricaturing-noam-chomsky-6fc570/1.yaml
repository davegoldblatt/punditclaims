explicit_source_elements:
  - certainly haven't taught us anything whatsoever
  - about why the world is as it is, rather than some other way
  - Ditto for the human mind
evaluator_interpretation:
  - "Plain reading: as of March 2023, LLMs had produced no explanatory scientific insight, of any kind, into why the world or the human mind is as it is."
  - "'Haven't' is cumulative, so the period runs from the start of the transformer LLM era (2018) to the post date."
  - Whether a finding counts as teaching us 'why ... rather than some other way' is an explanatory standard (Chomsky's) that the speaker did not define.
support_condition: Published research up to the post date shows no case where LLMs gave widely accepted explanatory insight into why the world or the human mind works as it does.
contradiction_condition: Peer-reviewed research up to the post date in which LLMs yielded an explanatory insight about the world or the mind that informed researchers accept as such.
measurement_requirements: null
source_requirements: Peer-reviewed or preprint scientific work using LLMs to draw explanatory conclusions about cognition, the brain, or the world, published before 2023-03-12.
