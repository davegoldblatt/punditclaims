assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s newly-released video generation system Sora
  - seems
  - extensively trained on copyrighted materials
evaluator_interpretation:
  - Assess the training provenance of the Sora version publicly available when the post appeared.
  - The observation period is the launch-to-post window, December 9–14, 2024. Training itself necessarily preceded release.
  - Read extensively as substantial use, without inventing a percentage or requiring a majority of training material.
  - Copyrighted material includes licensed material. The claim does not explicitly require unauthorized use or a finding of infringement.
  - Treat seems as an inference about training provenance, preserving its uncertainty.
support_condition: Disclosures, training records, or sufficiently strong independent evidence establish substantial use of copyrighted works in training the December 2024 Sora version.
contradiction_condition: Reliable records establish that this version used no copyrighted training material, or only incidental amounts inconsistent with substantial use.
measurement_requirements: Evidence must identify the relevant model and establish the scale of copyrighted training material. Output resemblance alone does not measure that scale.
source_requirements: Prefer model-specific disclosures or independently examined training records. Demonstrations may provide circumstantial evidence but cannot alone establish extensive training.
