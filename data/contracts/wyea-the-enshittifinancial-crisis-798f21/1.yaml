assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA's diversified revenue is collapsing
  - In Q1FY26, two customers represented 16% and 14% of revenue
  - in Q2FY26 two customers represented 23% and 16%
  - in Q3FY26 four customers represented 22%, 15%, 13% and 11%
  - Q1FY26 $30.84 billion of diversified revenue, Q2 $28.51 billion, and Q3 $22.23 billion
evaluator_interpretation:
  - "'Diversified revenue' is his own measure: total revenue minus revenue from direct customers that each exceed 10% of revenue."
  - Target period is NVIDIA fiscal Q1-Q3 2026 (late January to October 26, 2025), the quarters he cites.
  - "'Collapsing' read as a large sustained drop over those quarters; a fall of roughly a quarter or more counts."
support_condition: Revenue outside the disclosed 10%-plus direct customers fell sharply from fiscal Q1 to Q3 2026.
contradiction_condition: That revenue was flat or rising across the period, or the disclosed customer shares differ from his figures in a way that removes the decline.
measurement_requirements: Quarterly total revenue and the share of disclosed 10%-plus direct customers from NVIDIA's 10-Qs.
source_requirements: NVIDIA 10-Q filings or reporting that quotes them.
metric_scope:
  company: NVIDIA
  metric: revenue from customers each below 10% of total revenue (derived)
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: fiscal
  period_start: 2025-01-27
  period_end: 2025-10-26
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01-27
  end: 2025-10-26
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - "'Diversified revenue' is his own construction, not an NVIDIA metric."
  - Direct customers are mostly ODMs, OEMs and distributors buying for many end users, so the measure may not show end-demand diversity.
  - Revenue moves between buckets mechanically when a customer crosses the 10% threshold.
  - Press reports differ on whether four more customers were above 10% in Q2.
retrospective_or_prospective: retrospective
