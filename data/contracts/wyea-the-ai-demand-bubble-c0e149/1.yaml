evaluator_interpretation:
  - "The surrounding discussion makes financial sustainability the ordinary reading: neither company has established a credible way to cover its continuing costs without repeated outside funding."
  - Having subscriptions, customers, or a monetization plan alone does not establish financial sustainability. Conversely, current losses alone do not establish that a business model cannot work.
  - Use April–June 2026, the latest completed calendar quarter before publication, as the reference period for this ongoing observation.
support_condition: Evidence about both companies establishes that their existing commercial arrangements and reasonably supported operating plans cannot cover continuing costs without repeated outside funding.
contradiction_condition: At least one company has demonstrated sustainable economics or a sufficiently substantiated operating plan that covers continuing costs without repeated outside funding.
measurement_requirements: Assess revenues, continuing costs, investment needs, financing dependence, and the assumptions supporting each operating plan together.
source_requirements: Company financial disclosures and operating plans, supported where possible by independent examination. Financing announcements or revenue growth alone are insufficient.
