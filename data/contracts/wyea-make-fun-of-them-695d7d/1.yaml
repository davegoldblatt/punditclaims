explicit_source_elements:
  - OpenAI has a consumer product
  - loses billions of dollars
evaluator_interpretation:
  - The consumer product means ChatGPT. The claim concerns losses attributable to that product.
  - The ordinary reading of 'billions' is at least $2 billion.
  - No reporting period is specified. I use calendar 2024, the latest completed annual reporting period before publication, rather than annualizing an unspecified current loss.
  - Neither the accounting basis nor the allocation of shared research and development costs is specified. Company-wide losses cannot establish the product's losses.
support_condition: Comparable product-level accounts show ChatGPT incurred at least $2 billion in losses during 2024, with an identified accounting basis and cost allocation.
contradiction_condition: Comparable product-level accounts show ChatGPT incurred less than $2 billion in losses, or made a profit, during 2024.
measurement_requirements: Realized annual revenue and attributable expenses for consumer ChatGPT, including an explicit treatment of shared costs. Company-wide losses, cash burn and annualized revenue are insufficient.
source_requirements: Product-level financial disclosures or credible reporting based on identifiable financial records.
