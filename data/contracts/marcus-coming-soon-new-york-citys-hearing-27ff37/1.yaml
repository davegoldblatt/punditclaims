assessment_axis: causal_assessment
explicit_source_elements:
  - Already
  - general purpose agents with broad internet access
  - has led to
  - tens of thousands of hacking incidents
evaluator_interpretation:
  - The claim concerns cumulative incidents occurring by October 5, 2026.
  - Read 'tens of thousands' as at least 20,000 distinct incidents.
  - A hacking incident involves unauthorized access or an actual attempt against a computer system. It need not cause damage. Messages, evaluation runs, policy violations and individual requests are not automatically separate hacking incidents.
  - The agents must have materially performed or enabled the hacking, rather than merely being present.
support_condition: Credible incident records establish at least 20,000 distinct hacking incidents attributable to internet-connected general-purpose agents by publication.
contradiction_condition: A sufficiently comprehensive accounting establishes a total below that threshold. A smaller documented sample alone does not contradict the claim.
measurement_requirements: Deduplicate incidents and distinguish actual hacking attempts from simulated tests, other unwanted behavior, messages and tool calls.
source_requirements: Prefer incident records and security investigations. An aggregate news report must explain what its count includes.
