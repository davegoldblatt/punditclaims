explicit_source_elements:
  - Data center operators
  - have yet to show substantive proof
  - a sustainable business model renting out GPUs
  - profits that would justify taking on billions in debt
evaluator_interpretation:
  - The ordinary reading concerns specialist GPU-rental operators, rather than the consolidated profits of diversified hyperscalers.
  - Sustainability means recurring rental receipts sufficient to cover operating costs, realistic equipment replacement and debt service.
  - Use January–March 2026, the latest reported quarter for the examined operators before publication, as the financial observation period.
  - The closing remark expresses uncertainty about eventual payoff; it supplies no forecast deadline.
  - The claim does not identify an accounting basis. GAAP and adjusted results can inform the assessment but cannot silently supply that missing basis.
support_condition: Representative, sufficiently comprehensive operator records show no demonstrated recurring GPU-rental earnings and cash generation adequate for replacement and debt obligations.
contradiction_condition: A qualifying operator demonstrates recurring GPU-rental economics that cover operating costs, equipment replacement and its debt obligations on a clearly identified basis.
measurement_requirements: Separate rental operating results from investment gains, adjusted EBITDA and financing receipts. Examine debt service and replacement needs over more than one equipment cycle where possible.
source_requirements: Operator financial statements, segment disclosures, debt terms and evidence on equipment replacement economics.
