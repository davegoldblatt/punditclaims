assessment_axis: forecast_outcome
explicit_source_elements:
  - assuming a $2 trillion valuation
  - $50 billion ... on a yearly basis
  - debt alone
  - ratings agencies defaulting on their jobs
evaluator_interpretation:
  - The threshold applies to each company separately, in the contemplated post-IPO setting.
  - Raising $50 billion means receiving that amount in debt proceeds during a twelve-month period. Undrawn facilities, equity financing and borrowing by suppliers do not automatically qualify.
  - The valuation and yearly funding need must be established before scoring this conditional forecast.
  - A sub-investment-grade rating would provide a concrete test of the claim's argument. The assertion about ratings agencies failing at their jobs requires separate evidence; it cannot be presumed whenever financing succeeds.
support_condition: Under the stated conditions, evidence establishes that neither company can obtain $50 billion in annual debt proceeds under ordinary credit standards. Mere failure to raise that amount during an arbitrary observation window is insufficient.
contradiction_condition: Either company meets the stated conditions and receives at least $50 billion in debt proceeds within twelve months with a sub-investment-grade rating, without the alleged exceptional regulatory or ratings failure.
measurement_requirements: Establish valuation, annual funding need, issuer identity, actual proceeds, transaction dates, guarantees and applicable credit ratings. Exclude double counting and distinguish refinancing from funding available to meet the stated need.
source_requirements: Financing agreements, issuer disclosures and rating reports are preferred. Alleged regulatory or ratings failures require independently documented findings.
