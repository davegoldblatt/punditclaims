assessment_axis: historical_observation
explicit_source_elements:
  - these models don't really do much more
  - than they did a year ago
  - overall diminishing returns of Large Language Models
evaluator_interpretation:
  - The plain reading is that frontier LLM capabilities improved little between April 2024 and publication in April 2025.
  - Substantial improvements in completing useful software and reasoning tasks count as doing materially more, even without reliable automation of entire jobs.
  - Diminishing returns could mean slowing capability gains or declining gains per unit of investment. Those meanings require different measurements.
  - The assessment covers the supplied capability proposition, not the separate allegation about investors' and journalists' conduct.
  - A substantial contradiction of the little-progress component is sufficient to contradict the combined assertion; it does not establish increasing returns to investment.
support_condition: Comparable evaluations show little meaningful capability improvement over the preceding year, with declining incremental gains on a defined measure of returns.
contradiction_condition: Comparable evaluations covering models available during the preceding year show substantial improvements on meaningful tasks, contradicting the assertion that the models do little more.
measurement_requirements: Use stable tasks, comparable evaluation conditions, and models available by publication. Assess gains per compute or dollar separately from capability gains over time.
source_requirements: Prefer independent evaluations with disclosed methods and historical model comparisons. Do not treat later model releases as evidence about April 2025.
