explicit_source_elements:
  - With all the circular financing
  - it was always hard to tell what was really happening
evaluator_interpretation:
  - The ordinary financial reading concerns difficulty distinguishing independently funded demand from demand supported by supplier investment.
  - Hard to tell means public financial figures do not readily separate those sources of demand.
  - Always is read as a recurring feature of the financing arrangements under discussion, rather than a claim about every transaction at every moment.
  - This does not assert fabricated revenue, fraud or a particular amount of overstatement.
support_condition: Documented supplier-investor relationships and financial analysis show that public revenue or demand figures do not readily distinguish independent customer demand from financing-supported demand.
contradiction_condition: Public disclosures consistently separate these flows sufficiently to assess independent demand, or evidence shows that the alleged financing relationships do not exist.
measurement_requirements: Trace investment and purchasing relationships and assess whether public disclosures separate their effects on demand.
source_requirements: Primary deal announcements or filings, supported by independent accounting or industry analysis of disclosure limitations.
