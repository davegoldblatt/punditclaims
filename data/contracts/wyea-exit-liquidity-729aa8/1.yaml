assessment_axis: forecast_outcome
explicit_source_elements:
  - at least $5 billion next year
  - if not more like $10 billion
  - growing to as much as $30 billion a year
evaluator_interpretation:
  - Next year means calendar 2027.
  - The firm threshold is at least USD 5 billion of Anthropic payments under the Broadcom-related equipment leases during 2027.
  - USD 10 billion is a qualified estimate, not a second minimum.
  - As much as USD 30 billion describes possible later annual scale without a deadline. It is not a requirement to pay USD 30 billion in 2027.
  - Unclear capacity timing is an acknowledged uncertainty, not an explicit antecedent that excuses the firm 2027 minimum.
  - The annual amounts are the speaker's estimates from reported lease commitments, rather than quoted annual payment guidance. Payments through an assigned lease or financing vehicle count only if they discharge the same Anthropic lease obligation.
support_condition: Records show Anthropic paid at least USD 5 billion under the relevant Broadcom-related lease arrangements during calendar 2027. Assess any later rise toward USD 30 billion separately when comparable annual payment records exist.
contradiction_condition: Complete calendar-2027 records show relevant payments below USD 5 billion. A later annual amount below USD 30 billion alone does not contradict the undated, qualified possibility.
measurement_requirements: Measure actual annual lease payments attributable to Anthropic, distinguishing them from supplier revenue, financing proceeds, deposits, and aggregate multiyear contract value. Identify treatment of interest separately.
source_requirements: Anthropic or counterparty payment disclosures, lease schedules reconciled to actual payments, or equivalent reliable records.
