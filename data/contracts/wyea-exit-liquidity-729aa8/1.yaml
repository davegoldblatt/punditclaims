target_period: null
condition_status: not_applicable
early_resolution_rule: The firm 2027 minimum can be supported early once verified, non-reversed payments during 2027 cumulatively reach USD 5 billion. It can be contradicted early only by an irreversible event making that amount impossible. Financing announcements and expected deliveries do not qualify; the later USD 30 billion possibility remains undated.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The later USD 30 billion figure has no deadline and is qualified by as much as.
  - The context quotes aggregate lease value excluding interest, while the annual payment sentence does not specify interest treatment.
  - Capacity timing is uncertain but is not expressed as an if-then condition.
retrospective_or_prospective: prospective
