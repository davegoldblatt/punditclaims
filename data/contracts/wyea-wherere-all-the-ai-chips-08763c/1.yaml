assessment_axis: historical_observation
explicit_source_elements:
  - we don’t have much (if any) clarity
  - how much data center capacity is even being built
evaluator_interpretation:
  - Assess the public availability of meaningful construction-capacity information, rather than the author's personal understanding.
  - The ordinary reading is that public records provide little reliable industry-wide visibility into capacity actually under construction, distinct from announcements and operational facilities.
  - This does not require a complete census or perfect forecasts to count as clarity.
  - "For this ongoing information-availability claim, use the latest calendar reporting cycle before publication: July 1 through September 22, 2026. Earlier physical measurements remain context."
support_condition: A representative examination establishes that public records generally cannot distinguish or meaningfully quantify capacity under construction, with major unresolvable coverage or definition gaps.
contradiction_condition: Publicly available, transparent and sufficiently broad records consistently distinguish announced, under-construction and operational capacity and provide meaningful quantities for the industry described.
measurement_requirements: Compare coverage, status definitions, power basis, dates and uncertainty. Separate uncertainty about eventual completion from uncertainty about current construction.
source_requirements: Project records, company disclosures and independent trackers with stated methods and coverage. A tracker limited to one region or project class cannot alone settle the industry-wide claim.
