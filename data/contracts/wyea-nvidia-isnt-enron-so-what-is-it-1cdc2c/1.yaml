assessment_axis: causal_assessment
explicit_source_elements:
  - nobody else has really caught up with CUDA
  - NVIDIA has a functional monopoly
  - even if there is, at least in theory, competition
evaluator_interpretation:
  - Read functional monopoly as entrenched practical dominance in general-purpose data-center AI GPUs, with limited comparably mature alternatives. It does not require a sole supplier or a legal monopoly finding.
  - CUDA's maturity and switching costs must materially sustain that dominance. The wording does not require CUDA to be its only cause.
  - Assess the causal account as it stood at publication. Earlier investigations can explain the mechanism but cannot alone establish the competitive position in late 2025.
  - Distinguish AI GPUs from gaming graphics cards and from the broader market including custom AI accelerators.
support_condition: Contemporaneous market and adoption evidence establishes practical dominance in AI GPUs, while customer or technical evidence shows that CUDA's maturity and switching barriers materially sustain it.
contradiction_condition: Contemporaneous evidence shows broadly comparable competing GPU software ecosystems and meaningful substitution that defeats practical dominance, or shows the asserted CUDA mechanism is materially mistaken.
measurement_requirements: Use clearly defined AI GPU market shares, production adoption, software breadth and switching evidence. Individual benchmark wins do not establish ecosystem parity.
source_requirements: Prefer competition investigations, original market research, independent technical evaluations and documented production deployments.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Functional monopoly has no stated market-share or substitutability threshold.
  - The market boundary is inferred from the surrounding discussion of AI GPUs.
  - Caught up could refer to performance, software breadth, adoption or switching costs.
  - The contribution of CUDA is not quantified.
