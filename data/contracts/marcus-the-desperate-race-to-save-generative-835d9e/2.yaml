explicit_source_elements:
  - the image generation programs
  - have not been using it
  - at least so far
  - it would be much much harder to do with images
evaluator_interpretation:
  - In context, 'the image generation programs' means the deployed products discussed in Marcus and Southen's investigation, particularly Midjourney and DALL-E 3. It does not mean every research prototype.
  - "'It' refers to retrieval-augmented generation: retrieving external material to condition generation. Training on images or accepting user-supplied reference images does not alone establish RAG."
  - "'So far' describes product use through 2024-01-08. No starting date is supplied, so the historical interval has an unspecified start."
  - The difficulty comparison concerns adding retrieval augmentation to image generation versus text generation using methods available by that date. 'Much much harder' means substantially greater practical implementation difficulty; no numerical threshold is added.
  - The difficulty clause is a technical comparison at publication, not a forecast with a future deadline.
support_condition: Reliable records establish non-use of RAG in the relevant deployed product versions through the post date, and comparable technical evidence establishes substantially greater implementation difficulty for image RAG than text RAG.
contradiction_condition: Reliable records establish that a relevant deployed product version used RAG by the post date, or a comparable technical assessment establishes that image RAG did not entail substantially greater implementation difficulty. Research prototypes alone do not contradict product non-use.
measurement_requirements: Version-specific deployment or architecture records for product use. The difficulty comparison requires comparable tasks, quality requirements, and measures of implementation effort or technical obstacles; feasibility alone is insufficient.
source_requirements: Prefer developer disclosures, implementation records, and primary research. Silence about retrieval in product documentation is insufficient to establish non-use.
