assessment_axis: historical_observation
explicit_source_elements:
  - every single LLM-based application
  - ChatGPT, Google Gemini, Anthropic's Claude, Meta's LLaMA
  - trained on an indeterminately-large portion of the internet
  - made up of both Common Crawl
  - what appears to be as much of the rest of the internet as they're able to download
  - legally or otherwise
evaluator_interpretation:
  - The claim concerns the completed training of models underlying applications available by 2024-04-15. The historical training interval has no stated beginning.
  - I take 'every single' literally, including specialized LLM applications; the named products are examples, not an exclusive list.
  - The testable commitment is that each underlying model used Common Crawl and substantial additional internet material.
  - The hedged language does not supply a minimum corpus size or establish that every developer acted illegally.
support_condition: Training records establish the stated combination of Common Crawl and additional internet material for every application within scope.
contradiction_condition: A documented LLM application available before the post used an underlying model trained without Common Crawl or without the stated combination of sources.
measurement_requirements: Identify the actual pretraining corpus and any inherited base-model training. Distinguish Common Crawl provenance from independently collected content that also appears on the web.
source_requirements: Model papers, dataset documentation, and application release records. Incomplete disclosure alone is not a counterexample.
