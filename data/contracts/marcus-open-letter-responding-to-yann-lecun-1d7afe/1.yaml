evaluator_interpretation:
  - This is a claim about what Marcus publicly argued in 2019, not whether those technical arguments were correct.
  - The series must substantively express all the listed criticisms. It need not use exactly the terminology used in 2024.
  - The prediction of inadequacy is assessed as something allegedly stated in 2019; its eventual truth is outside this claim.
support_condition: Dated records establish that Marcus's 2019 GPT-2 Twitter examples expressed the listed concerns about data requirements, interpretability, reasoning, hallucinations, world models and standalone inadequacy.
contradiction_condition: A sufficiently complete contemporaneous record establishes that the attributed series occurred outside 2019 or materially misrepresents what Marcus argued. Failure to retrieve a tweet is insufficient.
measurement_requirements: Match each listed criticism to a dated passage and distinguish an example of failure from an explicit general criticism.
source_requirements: Contemporaneous records or independently preserved quotations. Marcus's later account cannot establish its own accuracy.
