assessment_axis: forecast_outcome
explicit_source_elements:
  - as capacity limits get hit
  - both Anthropic and OpenAI
  - will degrade the experience
  - model degradation or rate limit decay
  - as much as they can
evaluator_interpretation:
  - Capacity limits means insufficient serving capacity for demand, not a customer's exhaustion of an existing allowance.
  - The ordinary testable core is that each company responds to capacity pressure by reducing model quality or allowed usage.
  - Temporary errors or an unrelated software regression do not by themselves establish the predicted response.
  - Retain the maximality assertion as an additional requirement; evidence of any deterioration alone cannot establish 'as much as they can'.
support_condition: For both companies, verified capacity constraints are followed by attributable reductions in model quality or usage allowances, with evidence supporting the claimed extent of those reductions.
contradiction_condition: A well-documented completed response to capacity pressure preserves or improves quality and allowances despite feasible reductions, undermining the asserted response. An unrelated improvement after capacity expands is not sufficient.
measurement_requirements: Match capacity incidents to contemporaneous allowance policies or controlled quality measurements. Distinguish deliberate service choices, bugs, overload failures and user-specific restrictions.
source_requirements: Provider incident reports, capacity disclosures, dated policy changes and reproducible quality evaluations. Claims about the maximum feasible degradation require additional evidence about available choices.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Resolve early only on a documented completed capacity-response episode that establishes or refutes the specified behavior. Support for the whole claim requires evidence covering both companies and its asserted extent.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline or duration for the response.
  - No measurable definition of 'as much as they can'.
  - The wording does not specify whether every capacity episode or an overall tendency is intended.
  - User experience and model degradation have no specified benchmark.
retrospective_or_prospective: retrospective
