assessment_axis: causal_assessment
explicit_source_elements:
  - the parsimonious explanation
  - pattern recognition over stored examples
  - 2-digit cases more densely sampled than 4-digit cases
  - rather than genuinely understanding what multiplication is about
evaluator_interpretation:
  - This reading treats the claim as a causal account. Minerva's multiplication accuracy falls off with more digits because the model relies on how often similar examples appeared in its training data, not on a general multiplication procedure.
  - It could be tested by controlled studies linking Minerva's accuracy to how often the terms appear in its training data, or by tests of transfer to new cases.
support_condition: Controlled studies of Minerva show its arithmetic accuracy tracks how often the cases appear in training, and that it fails on novel cases in ways a general procedure would not.
contradiction_condition: Controlled studies of Minerva show its arithmetic accuracy does not depend on training frequency, or that its failures come from something else, such as how numbers are split into tokens or the length of the calculation.
measurement_requirements: Analysis of Minerva's training data frequency against its accuracy, or a mechanistic study of how it does arithmetic.
source_requirements: Peer-reviewed or preprint studies of Minerva or PaLM specifically.
