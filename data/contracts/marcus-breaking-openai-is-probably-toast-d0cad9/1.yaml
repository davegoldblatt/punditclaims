assessment_axis: historical_observation
explicit_source_elements:
  - Google and Anthropic have each largely caught up
  - various Chinese companies are closing in
evaluator_interpretation:
  - The ordinary reading in this context concerns frontier model capabilities, not company revenue, market share, or profitability.
  - "'Largely caught up' means broadly competitive performance across important capability evaluations; it does not require winning every task."
  - "'Various Chinese companies' requires evidence concerning more than one Chinese developer."
  - "'Closing in' requires improvement toward the frontier, rather than merely the existence of competing models."
  - The current comparison is assessed using evaluations public by February 13, 2026. The target period includes late 2025 because the statement also describes a recent direction of change.
support_condition: Contemporaneous evaluations place Google and Anthropic alongside or ahead of OpenAI on important capabilities, while evaluations of at least two Chinese developers show meaningful progress toward that frontier.
contradiction_condition: Comparable evaluations show a persistent broad capability separation favoring OpenAI over Google or Anthropic, or show Chinese competitors collectively falling farther behind rather than approaching the frontier.
measurement_requirements: Use dated evaluations of then-available models. Keep benchmark versions, reasoning settings, and task coverage explicit. Do not substitute present-day rankings.
source_requirements: Prefer independent benchmark operators and original evaluation papers. Manufacturer claims alone are insufficient for a broad comparative conclusion.
