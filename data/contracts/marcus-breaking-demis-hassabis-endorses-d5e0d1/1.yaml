explicit_source_elements:
  - In my 2023 Senate testimony
  - in a 2023 essay here
  - in my 2024 book Taming Silicon Valley
  - strongly advocated for a system of preflight testing
  - AI models deployed at large scale
  - ideally mandatory, transparent and independent
  - modeled perhaps on the FDA’s analysis of costs and benefits for pharmaceuticals
evaluator_interpretation:
  - The target period is 2023–2024, the publication years expressly named.
  - Preflight testing means substantive safety assessment before widespread public deployment. The historical works need not use that exact term.
  - The plain reading is that each work advocated predeployment review, with the listed safeguards describing his preferred approach across these interventions. It does not require an identical regulatory blueprint in all three.
  - Strong advocacy means an affirmative policy recommendation, rather than merely mentioning an option.
  - Original advocacy is evidence of what Marcus advocated, not evidence that his policy recommendations were correct.
support_condition: The three historical records substantively advocate safety assessment before widespread AI deployment, with mandatory oversight, transparency, independent assessment and pharmaceutical regulation appearing as preferred features of his proposals.
contradiction_condition: Complete relevant records show that one or more named works did not advocate predeployment safety assessment, or materially opposed the safeguards he now attributes to his proposals.
measurement_requirements: Compare the policy recommendations in each named work. Distinguish predeployment review from monitoring after release, and explicit recommendations from passing references.
source_requirements: Use contemporaneous testimony and original publications where accessible. A reputable contemporary review can establish book content with that limitation disclosed. Do not use the 2026 retrospective assertion as proof.
