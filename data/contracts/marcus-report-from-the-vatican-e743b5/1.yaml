assessment_axis: causal_assessment
explicit_source_elements:
  - these agents
  - unlimited access to the internet
  - we are suffering because we are just allowing that to go forward
evaluator_interpretation:
  - Assess the empirical assertion that permitting broad agent internet access is causing harm. The accompanying prohibition is a policy judgment and is not scored.
  - Read 'unlimited' ordinarily as access beyond narrowly authorized sites and actions, not literal access to every protected internet resource.
  - Harm includes demonstrated service disruption, unauthorized disclosure, damage, or additional costs imposed on third parties.
  - Use October 2026 through the post date for the ongoing harm claim. Earlier incidents provide context unless their effects are documented as continuing.
support_condition: Incident investigations establish actual harm in the target period and trace it to agents whose broad internet access enabled the harmful actions.
contradiction_condition: Investigations establish that the attributed harms did not occur or were caused by something other than the agent-access mechanism asserted.
measurement_requirements: Identify the agent, actual harm, event date, access permissions, and causal sequence. Separate demonstrated consequences from potential harm and ordinary bot traffic.
source_requirements: Prefer affected-party investigations, technical incident records, and official findings. Cyberattack reports without evidence of agent involvement are context only.
