assessment_axis: forecast_outcome
explicit_source_elements:
  - Microsoft, Google and Amazon’s hypergrowth era ends
  - if Anthropic and OpenAI can’t spend hundreds of billions of dollars on compute
  - Oracle, CoreWeave, Nebius, and IREN
  - face apocalyptic circumstances when they fail to do so
evaluator_interpretation:
  - Read the antecedent as demonstrated financial inability to make compute expenditures on the stated scale, not merely spending less than that amount so far.
  - The passage does not specify whether the spending threshold is annual or cumulative, or combined across the labs or required from each.
  - Read an end to hypergrowth as a substantial, sustained end to unusually rapid business growth, not a share-price decline.
  - Read apocalyptic circumstances as severe financial distress threatening ordinary operations, rather than disappointing earnings alone.
  - No deadline or response lag is supplied. Do not import one.
  - No accounting basis is supplied for the spending threshold; it remains unknown.
support_condition: After the antecedent is established on a defined spending basis, evidence shows the end of rapid growth at all three named hyperscalers and severe financial distress at the four named infrastructure companies.
contradiction_condition: After the same antecedent is established, the named businesses demonstrably sustain the growth and financial viability that the forecast says would fail, over a relevant subsequent period. The wording does not specify that period.
measurement_requirements: Establish the labs' inability to finance actual compute spending, distinguishing it from multiyear commitments and temporary capacity shortages. Specify annual versus cumulative spending, combined versus individual labs, the hyperscaler growth measure and the financial-distress criteria.
source_requirements: Lab financial records or documented funding failures for the antecedent; subsequent company filings and creditor or court records for the consequences.
metric_scope:
  company: OpenAI and Anthropic
  metric: Compute spending in the conditional antecedent
  currency: USD
  units: hundreds of billions of dollars
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Early support requires a documented inability to finance the stated compute spending followed by clear occurrence of all the named consequences. Risk disclosures, spending below the threshold to date, commitments and stock-price declines alone do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No spending period or deadline.
  - Combined spending versus spending by each lab is unspecified.
  - The relevant accounting basis is unknown.
  - Hypergrowth may refer to consolidated businesses or cloud divisions.
  - No growth threshold, distress threshold or response lag.
  - Apocalyptic circumstances is figurative language.
