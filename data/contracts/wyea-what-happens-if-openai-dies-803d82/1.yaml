  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Early support requires a distinct completed financing, evidence that its size plainly qualifies as massive, and payment and liquidity records establishing that the specified obligations required it. Negotiations or an installment of the prior round are not decisive.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Much has no numerical threshold.
  - Massive has no numerical threshold.
  - Required financing differs from opportunistic financing.
retrospective_or_prospective: prospective
