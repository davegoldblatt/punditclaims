explicit_source_elements:
  - AI 2027 isn’t slowing them down
  - putting wind (and money, and political power) in their sails
  - companies like OpenAI and Anthropic
evaluator_interpretation:
  - The plain reading is that AI 2027 causes additional financing and political influence for frontier AI companies, including OpenAI and Anthropic, and facilitates their development efforts.
  - "Funding growth alone is insufficient: the additional money must be attributable to the scenario."
  - The claim supplies no currency, amount, accounting basis, or financial reporting period. These are not inferred from unrelated company announcements.
  - This is an ongoing causal assertion as of the post date.
support_condition: Investor and policy records credibly attribute additional financing and increased political influence to AI 2027, alongside evidence that it facilitated rather than slowed development.
contradiction_condition: Comparable records establish that AI 2027 reduced financing or political influence, or slowed development, contrary to the claimed direction. Failure to find attribution alone is insufficient.
measurement_requirements: Separate financing commitments from money received and identify the incremental effect of AI 2027. Assess political influence separately through concrete access, authority, or policy decisions.
source_requirements: Company or investor financing disclosures plus explicit decision rationales, and government or lobbying records linking political effects to AI 2027.
