assessment_axis: historical_observation
explicit_source_elements:
  - the US is apparently using these tools
  - almost certainly regularly reporting false alarms
evaluator_interpretation:
  - The post's linked reporting identifies CBP's use of Fivecast ONYX. The assessment concerns those surveillance tools, rather than every AI system used by American authorities.
  - Regularly reporting false alarms means recurring incorrect flags of suspicious people, activity, or content during ordinary operational use. No numerical error threshold is supplied.
  - The statement describes an ongoing state. I use August 1–24, 2023, the portion of the current month preceding publication, as the latest contemporaneous reporting period. The post supplies no operational reporting cycle.
  - Almost certainly expresses confidence in an observation; it does not create a conditional forecast.
support_condition: Operational records, an audit, or documented investigations establish recurring false alerts from the identified tools during the target period.
contradiction_condition: Representative operational records establish that false alerts were absent or exceptional, rather than recurring, during the target period.
measurement_requirements: Identify the deployed system and configuration, distinguish an automated flag from a confirmed finding, and verify false alerts against independent ground truth. Evidence must establish recurrence, not merely the possibility of error.
source_requirements: Prefer operational audits, inspector-general findings, or agency records. Investigative reporting must identify its underlying records or documented cases. Studies of other systems provide context only.
