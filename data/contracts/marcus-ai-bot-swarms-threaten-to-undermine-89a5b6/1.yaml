support_condition: Credible evidence that coordinated AI bot swarms ran influence operations with measurably greater reach, deception or persuasive effect than earlier botnets. One example would be a documented AI swarm campaign that broke into authentic communities at scale.
contradiction_condition: With no deadline, only a decisive showing that such swarms cannot or will not exceed earlier bots' impact would contradict it. Absence of such events so far is not failure.
measurement_requirements: Comparative impact measures, such as the Breakout Scale, engagement from authentic users, or measured persuasion.
source_requirements: Platform or AI-company threat reports, government findings, or peer-reviewed studies.
