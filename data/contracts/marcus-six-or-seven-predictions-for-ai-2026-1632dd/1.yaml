assessment_axis: historical_observation
explicit_source_elements:
  - LLMs still aren’t reliable
  - the economics look dubious
evaluator_interpretation:
  - Reliable ordinarily means dependable factual and task performance across common uses, without frequent consequential failures. It does not require literal perfection.
  - "For this ongoing technical state, I use the latest publicly reportable December model evaluations before publication: December 1–20, 2025."
  - The economics look dubious is a hedged judgment. It specifies neither a company nor a financial measure, and is not a forecast of insolvency.
  - I retain the complete bundle rather than treating evidence of occasional errors as proof of both clauses.
support_condition: Representative contemporary evaluations show material reliability failures across common uses. The economic component additionally needs a specified economic test and evidence meeting it.
contradiction_condition: Representative evaluations demonstrate dependable performance across the intended uses at an appropriate error tolerance. Resolving the economic component against Marcus requires a specified economic test, not revenue growth alone.
measurement_requirements: Specify task mix, model versions, error severity, tool access and acceptable failure rates. Economic assessment requires a defined measure of costs, returns or profitability.
source_requirements: Contemporary evaluations and, for any concrete financial interpretation, comparable primary financial disclosures.
