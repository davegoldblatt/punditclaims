explicit_source_elements:
  - Examples of concealed bias
  - will be discovered
  - within days or months
evaluator_interpretation:
  - The surrounding discussion makes GPT-5 the target and its release the timing anchor.
  - Concealed bias means latent systematic skew revealed by testing, rather than deliberate concealment by OpenAI.
  - Political asymmetry in otherwise comparable responses is an ordinary example of bias.
  - The phrase supplies no exact month count. The interval therefore retains an unknown end; an affirmative discovery within approximately two months can settle it without inventing a cutoff.
support_condition: A dated public evaluation within days or months of release identifies latent, systematic GPT-5 bias.
contradiction_condition: Adequate testing throughout a defensibly specified deadline finds no qualifying bias, and purported timely discoveries are shown to be invalid or about other models.
measurement_requirements: Identify the model, bias definition, comparison method, discovery date, and relationship to release. Distinguish latent bias from intentional concealment.
source_requirements: Primary evaluations with a stated method, preferably corroborated across organizations.
