  - imperfect
  - costly to run
  - held up as a solution
  - many problems
  - can't even begin to fix
evaluator_interpretation:
  - Errors and inference resource costs are independently measurable factual components.
  - The complete assertion does not identify the set of promoted problems, the promoters, or what counts as beginning to fix a problem.
  - The surrounding examples suggest concerns about coding, image generation and assistants, but do not define the broader set denoted by many problems.
  - Choosing a task basket and a minimum useful contribution would determine the verdict. There is no sufficiently stable plain reading for grading the complete assertion.
  - Many problems is a scope qualifier, not a conditional forecast antecedent. The sentence does not assert that generative AI is useless for every task.
support_condition: No stable whole-claim support test is available without specifying the promoted problems and the standard for useful progress. Errors or high resource costs alone would not establish the concluding assertion.
contradiction_condition: No stable whole-claim contradiction test is available. Demonstrating benefits on some tasks would not disprove failure on many other unspecified tasks.
measurement_requirements: A defined set of dated vendor promises, corresponding model versions and tasks, and a standard distinguishing imperfect assistance from inability to make useful progress.
source_requirements: Primary vendor representations paired with reproducible independent evaluations, plus separately measured inference costs.
