assessment_axis: forecast_outcome
explicit_source_elements:
  - projects it'll make $11.6 billion in 2025
  - assuming that OpenAI burns at the same rate it did in 2024
  - spending $2.25 to make $1
  - burn over $26 billion in 2025
  - a loss of $14.4 billion
evaluator_interpretation:
  - Assess the conditional scenario, rather than treating its spending and loss figures as unconditional predictions.
  - The conditions are annual revenue of approximately $11.6 billion and spending of approximately $2.25 per dollar of revenue.
  - Treat $11.6 billion as the assumed revenue level, rather than a minimum threshold.
  - In this passage, burn means total spending. Loss means spending minus revenue; the passage does not establish a formal net-income accounting definition.
  - Allow ordinary rounding in the approximate loss figure.
support_condition: Both assumptions hold on a comparable accounting basis, and realized calendar-2025 spending exceeds $26 billion with an approximately $14.4 billion spending-minus-revenue loss.
contradiction_condition: Both assumptions hold, but comparable realized spending or loss materially conflicts with the forecast.
measurement_requirements: Full-year realized revenue, total spending and the resulting loss, with consistent treatment of stock compensation, compute credits and noncash items. Annualized revenue and net cash burn cannot substitute for these measures.
source_requirements: Company financial records or reputable reporting on those records. Independent reporting is necessary if the underlying records are unavailable.
