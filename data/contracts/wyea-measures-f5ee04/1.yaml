explicit_source_elements:
  - the entire Texas project
  - is contingent on debt
evaluator_interpretation:
  - The Texas project means the Abilene campus discussed in the surrounding passage.
  - Contingent on debt means the planned development relies materially on borrowed construction funding. It does not mean every dollar is borrowed.
  - The financing structure is treated as press-reported, consistent with the adjacent attribution to Bloomberg.
  - For the ongoing financing observation, the target is the current reporting month through publication, May 1–27, 2025.
support_condition: The campus financing structure uses material construction debt needed to execute the planned buildout.
contradiction_condition: The planned campus is fully funded without debt, or borrowing is demonstrably incidental and unnecessary to its construction financing.
measurement_requirements: Identify project-level construction borrowing and its role in funding the campus; distinguish it from corporate borrowing by SoftBank or OpenAI.
source_requirements: Project financing disclosures or reliable reporting identifying the borrowers, lenders and funded construction.
