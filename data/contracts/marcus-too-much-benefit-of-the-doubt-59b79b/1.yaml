assessment_axis: forecast_outcome
explicit_source_elements:
  - AI will not fully displace radiologists
  - as opposed to merely augmenting them
  - before the year 2033
evaluator_interpretation:
  - Full displacement means replacement of the profession in clinical practice, rather than automation of selected tasks or elimination of some positions.
  - No country is specified; isolated deployment at one institution would not establish displacement of radiologists as a profession.
  - Before 2033 ends on December 31, 2032. The horizon starts on the supplied post date, although the embedded tweet is dated October 15.
support_condition: At the end of 2032, credible workforce and clinical-practice records establish that radiologists remain a practicing profession and have not been fully displaced by AI.
contradiction_condition: Before January 1, 2033, independently verified deployment and workforce records establish that AI has fully replaced radiologists as a profession.
measurement_requirements: Assess actual clinical replacement and continued professional employment. Benchmarks, regulatory clearance, task automation and workforce reductions alone are insufficient.
source_requirements: Dated workforce records and independent clinical deployment evidence available by the evaluation date.
metric_scope: null
original_horizon: before the year 2033
horizon_interval:
  start: 2022-10-16
  end: 2032-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as contradicted only if dated evidence establishes full professional displacement by AI before 2033. Continued employment before the deadline cannot establish early support.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Geographic scope is unspecified.
  - No numerical employment threshold defines full displacement.
  - The embedded forecast predates the post by one day.
