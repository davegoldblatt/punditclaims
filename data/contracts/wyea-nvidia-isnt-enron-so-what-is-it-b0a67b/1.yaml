explicit_source_elements:
  - deals with both Lambda and CoreWeave
  - guarantee that they will have compute revenue
  - use to raise debt
  - used to buy more of your GPUs
evaluator_interpretation:
  - The claim commits to the financing chain for both companies. Evidence of purchases, borrowing and GPU ownership separately does not establish their connection.
  - A revenue guarantee can mean a binding capacity-purchase commitment or demand backstop, subject to ordinary delivery conditions. It need not mean NVIDIA guarantees repayment of the debt.
  - For this ongoing state, use July–September 2025, the latest completed calendar quarter reported before the post.
  - The passage supplies no monetary amount, accounting basis or common measurement period for the commitments and borrowing. These are not treated as recognized revenue.
support_condition: Contracts and financing records establish that both Lambda and CoreWeave had NVIDIA-backed compute revenue commitments supporting debt used to acquire NVIDIA GPUs.
contradiction_condition: Reliable records establish that a material link in that chain was absent or different for at least one named company. Missing disclosure alone is insufficient.
measurement_requirements: Identify each purchase commitment, the borrowing it supported, and the financed GPU purchases. Distinguish capacity purchases, debt guarantees, collateral and recognized revenue.
source_requirements: Prefer contracts, filings and borrower or lender disclosures. Reporting may establish undisclosed arrangements, but must identify the financing connection.
