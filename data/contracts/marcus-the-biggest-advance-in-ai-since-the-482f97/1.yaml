  - in large part a big IF-THEN conditional
  - 486 branch points
  - 12 levels of nesting
  - inside a deterministic, symbolic loop
evaluator_interpretation:
  - Assess the source snapshot exposed on March 31, 2026, which the post discusses.
  - Read classical symbolic AI as substantive processing of explicit representations or rules. Ordinary conditionals alone do not establish that classification.
  - Separate deterministic execution of control-flow instructions from deterministic behavior of the complete system, which can call a probabilistic model.
  - Treat the hypothetical recognition by historical researchers as rhetoric, not a separately measurable commitment.
support_condition: Inspection of an authenticated copy of the relevant release reproduces 486 branch points and a maximum nesting depth of 12 under stated counting rules, and establishes the claimed conditional structure and substantive symbolic processing.
contradiction_condition: Reproducible inspection of the same release establishes incompatible counts or shows that the claimed symbolic processing and conditional-loop architecture are materially misdescribed.
measurement_requirements: Pin the release and file hash. Define whether branch points include switch cases, ternaries, short-circuit operators, exception handlers and nested functions. Identify the function boundary and define how nesting is counted.
source_requirements: The original release artifact or an authenticated mirror, accompanied by reproducible analysis. Firsthand inspection reports can corroborate individual details but cannot replace the missing count.
