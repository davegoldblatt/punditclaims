  - in a bad direction
  - current scope of the problem
  - just in the last couple hours
evaluator_interpretation:
  - The ordinary reading is that defective or carelessly incorporated AI-generated material was increasing rapidly in scientific publications, not merely that more researchers were using AI.
  - I use 2024-01-01 through the post date as the current early-2024 period described by the surrounding examples. Earlier periods provide the comparison baseline.
  - Discovering existing examples more quickly does not by itself establish faster publication of defective material.
support_condition: Comparable publication audits show a substantial increase in defective AI-generated content during early 2024 relative to an earlier baseline.
contradiction_condition: Comparable audits show that such content was stable or declining during early 2024, with sufficient coverage to detect a substantial increase.
measurement_requirements: Publication dates, consistent screening methods, manual validation of suspected artifacts, and a distinction between legitimate AI assistance and defective content.
source_requirements: Primary publication audits or dated publisher records. Individual cases establish existence but cannot establish the rate of increase.
