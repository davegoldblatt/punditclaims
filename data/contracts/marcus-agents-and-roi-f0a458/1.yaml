assessment_axis: historical_observation
explicit_source_elements:
  - The situation for agents thus far
  - looks to be similar
  - lots of hype
  - not so much ROI
  - similar to the MIT finding that ROI for generative AI wasn't there for most businesses
evaluator_interpretation:
  - "Plain reading: up to the post date, most businesses that tried AI agents had not seen significant or clear return on investment, even though agents were heavily promoted."
  - He named no study or threshold, so I read 'not so much ROI' as 'a minority of adopters report significant returns', judged by broad enterprise surveys and analyst assessments.
  - "Target period: 2025-01 to the post date (2026-05-08). This covers the period when enterprise agent deployments and surveys about them appeared. 'Thus far' names no start date."
support_condition: Broad surveys or analyst reports from 2025 to May 2026 show that only a minority of organizations report significant or clear ROI from AI agents, or say most agent projects lack clear value.
contradiction_condition: Broad surveys or analyst reports from the same period show that most organizations using agents report clear, measurable returns from them.
measurement_requirements: Enterprise survey or analyst data on the share of organizations reporting ROI or measurable value from AI agents, with fieldwork or findings from 2025-01 to 2026-05-08.
source_requirements: Primary survey publishers (company or analyst press releases and report pages), or reputable news reports of them. Do not use Marcus's own writing.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01
  end: 2026-05-08
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Not so much ROI' has no threshold. Surveys asking about 'significant ROI' give low figures. Surveys asking about any 'measurable value' or 'positive ROI on at least one use case' give high figures."
  - "'Thus far' names no start date. I chose 2025-01 to the post date."
  - "'Looks to be' is a mild hedge."
  - Most available surveys are self-reported, and many come from vendors.
