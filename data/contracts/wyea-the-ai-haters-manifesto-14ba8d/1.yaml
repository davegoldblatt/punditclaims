explicit_source_elements:
  - anthropomorphism and overpromising
  - suffocated and obfuscated what they can actually do
  - in pursuit of endless growth
  - the only reason they can do anything
  - OpenAI and Anthropic
  - hundreds of billions of dollars on training
evaluator_interpretation:
  - The spending assertion concerns cumulative expenditure already incurred by the post date, not future commitments, fundraising, valuation, or industry-wide infrastructure investment.
  - I read the two companies jointly and interpret hundreds of billions as at least USD 200 billion. The wording does not specify whether the threshold applies jointly or individually.
  - The ordinary causal reading is that this expenditure was necessary for meaningful LLM capabilities and that humanlike presentation and exaggerated promises materially impaired understanding of those capabilities.
  - The passage supplies no accounting basis or attribution for its spending figure. Its accounting basis therefore remains unknown.
  - Suffocated and endless growth are rhetorical descriptions. The assessable component is material distortion of public understanding, not the rhetoric itself.
support_condition: Comparable records establish the stated cumulative training expenditure, and credible causal evidence establishes both its necessity for meaningful capabilities and the asserted distortion of public understanding.
contradiction_condition: Comparable cumulative training accounts fall below the threshold, or credible evidence defeats the claimed necessity or material distortion. Evidence about another company's model can challenge necessity but cannot settle the named companies' expenditure.
measurement_requirements: Separate training from inference, broader research, capital investment, and future contractual commitments. Tests of public understanding must distinguish anthropomorphic framing from the substance of capability claims.
source_requirements: Prefer company accounts and training disclosures, reproducible capability evaluations, and controlled research on public understanding. Press estimates require explicit identification as estimates.
