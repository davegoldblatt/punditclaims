ambiguity_flags:
  - "Tentative wording: does seem to."
  - Neither a lot of chips nor a lot of companies has a numerical threshold.
  - Buying chips could loosely refer to obtaining computing capacity, but those arrangements have different purchasers and obligations.
  - The statement does not distinguish newly announced purchases from earlier projects incorporated into Genesis.
