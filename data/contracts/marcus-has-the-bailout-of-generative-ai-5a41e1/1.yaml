explicit_source_elements:
  - Genesis
  - announced by Executive Order on Monday
  - does seem to involve
  - the government buying a lot of chips
  - from a lot of AI companies
evaluator_interpretation:
  - This describes the program as announced between November 24 and the November 27 post. It does not claim that purchases had already been completed.
  - The ordinary reading is substantial federal hardware purchasing involving numerous AI suppliers. Access to privately owned computing resources does not by itself establish government chip purchases.
  - The hedge expresses uncertainty about a factual arrangement; it does not make the statement uncheckable.
  - No numerical threshold for chip quantities or supplier count is supplied. I do not invent one.
  - This is a claim about procurement arrangements and hardware quantities, rather than a specified company's financial metric; metric_scope is null.
support_condition: Launch documents or records of arrangements existing by November 27 establish substantial federal chip purchases or purchase commitments involving numerous AI suppliers.
contradiction_condition: Sufficiently comprehensive records establish that the announced arrangement excluded substantial federal chip purchases across numerous suppliers. Silence about purchases alone is insufficient.
measurement_requirements: Identify the purchaser, suppliers, hardware quantities, funding obligations, and connection to Genesis. Distinguish purchases from donations, shared investments, research partnerships, and access to computing services.
source_requirements: Executive order, agency announcements, procurement records, or supplier agreements. Later publications may establish arrangements existing during the target period, but later agreements are context only.
