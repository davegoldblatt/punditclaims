assessment_axis: historical_observation
explicit_source_elements:
  - Most of Amazon, Google and Microsoft’s capex
  - capacity mostly used by OpenAI and Anthropic
  - neither of whom have the money to pay
  - without continual infusions of more capital
evaluator_interpretation:
  - "The claim contains two majority tests: more than half of capex funds the relevant capacity, and more than half of that capacity's use is attributable to OpenAI and Anthropic."
  - The main reading aggregates the three hyperscalers, while also requiring company-level results to expose differences.
  - Use January–March 2026, the latest completed reporting quarter before the post, for the ongoing spending, allocation and financing observations.
  - Treat the allocation as an estimate in the context of the author's surrounding capacity estimates. The accounting treatment of capex is not specified.
  - Current use is the plain reading. Future contracted use should be reported separately.
  - Continuing financing dependence means operating receipts and available cash cannot cover payment obligations without repeated external funding.
support_condition: Matched spending and allocation records establish both majority tests, and both labs' cash-flow and obligation records establish continuing dependence on external funding.
contradiction_condition: Comparable records establish that either majority test fails, or that either lab can sustainably meet its obligations without continuing external funding.
measurement_requirements: Reconcile cash purchases, finance leases and other capex measures across companies. Link expenditure to identifiable capacity and its customer allocation. Separately compare each lab's operating cash flows, available liquidity and payment obligations.
source_requirements: Hyperscaler capital expenditure records and customer allocation data, plus lab cash-flow statements and payment schedules. Financing announcements alone cannot establish financing necessity.
