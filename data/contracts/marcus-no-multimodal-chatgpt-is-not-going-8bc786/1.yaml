explicit_source_elements:
  - The challenge of identifying sources is not a solved problem
  - by no means 'trivial to build a classifier that detects and suppresses generated images containing copyrighted characters'
  - It might be trivial ... for the most popular characters, presented in the most canonical ways
  - getting it right for all copyright materials is an entirely different matter
evaluator_interpretation:
  - "Plain reading: as of the post, no ready-made tool reliably detected generated images containing copyrighted characters across all copyrighted material, including less popular characters and non-canonical depictions. Building one would take real effort and would face errors such as false alarms."
  - Marcus concedes it may be easy for the most popular characters shown in canonical ways.
  - This is an ongoing state with no named period. The target period is January 2024, the month of the post.
support_condition: Evidence from around January 2024 shows that available detectors, such as multimodal ChatGPT, missed or misclassified copyrighted characters beyond the most iconic cases, or that no reliable, broad-coverage classifier existed.
contradiction_condition: Evidence from around January 2024 shows that a simple classifier built on available tools reliably detected copyrighted characters across a broad range of copyrighted material, including lesser-known characters.
measurement_requirements: Published accuracy, precision and recall of copyrighted-character detection on a broad set that includes lesser-known characters.
source_requirements: Peer-reviewed or preprint evaluations, benchmarks, or deployment reports from developers.
