assessment_axis: causal_assessment
explicit_source_elements:
  - money made by Anthropic or OpenAI
  - from an AI startup in that 1% spend
  - contingent on their continued ability to raise venture capital
evaluator_interpretation:
  - The ordinary reading is that the relevant startup customers cannot sustain their model payments without additional venture financing.
  - Receiving venture funding does not by itself establish that customer receipts cannot cover model bills.
  - The surrounding discussion narrows attention to startups subsidizing customers' token consumption, but it does not identify which members of Ramp's top 1% qualify.
  - Use August 2026, the last complete month before publication, as the reference period for the asserted ongoing dependency.
  - No accounting basis is supplied for the asserted dependency.
support_condition: Identified startups in the relevant spending cohort have recurring cash deficits that make continued payments to the labs dependent on further venture funding, after accounting for existing cash and other financing.
contradiction_condition: Financial records show the relevant startups can sustain their model payments from customer cash receipts or other durable resources without additional venture funding.
measurement_requirements: Cohort membership, model bills, customer cash receipts, operating cash flow, cash reserves, financing sources, and a defensible analysis of continued payments without new venture funding.
source_requirements: Prefer customer financial disclosures or records directly linking funding to model payments. Funding announcements alone are insufficient.
