assessment_axis: historical_observation
explicit_source_elements:
  - Sam Altman, to the Senate, May 2023
  - I do have equity in YCombinator
  - YCombinator has equity in OpenAI
  - I own the OpenAI venture fund
  - if I acknowledged that
evaluator_interpretation:
  - Assess whether both interests existed at the May 2023 hearing and whether Altman disclosed them in his testimony.
  - Distinguish an indirect economic interest through a Y Combinator fund from direct OpenAI equity.
  - Read ownership of the venture fund as legal ownership or control of its managing entity, not ownership of investors' capital.
  - The speculation about value and motive is excluded from the factual assessment.
  - This is a qualitative ownership-and-disclosure claim, not a measurement of company finances; metric_scope is null.
support_condition: Records establish both interests at the hearing date, and the testimony omits both.
contradiction_condition: Records establish that either alleged interest did not exist at the hearing date, or the testimony disclosed an interest Marcus says was omitted.
measurement_requirements: Establish the ownership chain and legal capacity as of the hearing. Management, ownership, and entitlement to profits must remain distinct.
source_requirements: The hearing record plus dated ownership records or reliable reporting explicitly establishing the historical ownership arrangements.
