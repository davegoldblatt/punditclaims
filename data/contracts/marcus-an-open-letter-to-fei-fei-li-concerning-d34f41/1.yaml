explicit_source_elements:
  - much of the bill's requirements
  - models with training runs of $100 million+
  - Companies that can afford that
  - presumably valued in the billions
  - not exactly "little-tech."
evaluator_interpretation:
  - Assess the proposed bill current when the post appeared, rather than later amendments or its eventual disposition.
  - Read 'much' as the main developer safety, assessment, testing and reporting obligations, without requiring every provision to share the threshold.
  - Read '$100 million+' as an approximate description of the statutory training-compute cost threshold, rather than a claim about treatment of a model costing exactly $100 million.
  - Read the company-size sentence as a qualitative inference about the resources needed to afford such training. 'Presumably' does not firmly assert a verified billion-dollar valuation for every affected developer.
  - The target period covers the July 3 version through the post date. This is an observation about a pending legislative text, not a financial reporting period.
  - Metric scope is null because the testable monetary threshold defines legislative coverage; no named company's financial results or valuation are being measured.
support_condition: The contemporaneous bill ties its main developer obligations to covered models whose initial training exceeds approximately $100 million in compute costs, supporting the ordinary description of that training as financially substantial. Separate provisions or derivative-model rules do not by themselves defeat 'much.'
contradiction_condition: The contemporaneous bill lacks the claimed initial-training cost threshold, or its main developer obligations generally apply to independently trained models below it. Evidence that some smaller firms face indirect effects would not alone contradict the narrower wording.
measurement_requirements: Distinguish initial training from fine-tuning, standardized compute cost from actual cash expenditure, and a model threshold from a company-size exemption.
source_requirements: Use the contemporaneous legislative text or legislative analyses, with dated legal commentary as corroboration. Later amendments cannot establish the earlier version's terms.
