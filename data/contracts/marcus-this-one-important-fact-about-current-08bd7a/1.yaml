ambiguity_flags:
  - "'Far enough' has no distance measure or threshold."
  - "'Fail' has no accuracy threshold or frequency."
  - "'GenAI' covers more model families and tasks than the cited experiments."
  - The wording can describe a recurring practical weakness or an inevitable limitation of all such techniques.
