assessment_axis: historical_observation
explicit_source_elements:
  - services cost too much to run
  - no path to profitability
  - you can’t measure the cost of an LLM-driven task or its return on investment
evaluator_interpretation:
  - "The ordinary reading combines three assertions: unsustainable service economics, no credible route to profitability, and inability to measure task costs or returns."
  - Measurement means a reproducible estimate using observed usage, expenditure and outcomes. It need not predict every future task exactly.
  - For the ongoing financial state, I use January–March 2026, the latest completed calendar quarter before publication. The post supplies no reporting period.
  - Current losses alone would not establish that no path to profitability exists.
  - The words identify no accounting basis. Under the supplied money rule, the bundled claim cannot receive a supported or contradicted score while that basis remains unknown.
support_condition: Comparable financial records would need to establish unsustainable service economics and substantiate the absence of a credible profitability route. Evidence would also need to establish that task costs and returns cannot be measured, rather than merely showing that measurement is difficult.
contradiction_condition: A documented, reproducible measurement of an LLM task's full costs and attributable returns would refute the measurement assertion. Demonstrably sustainable service economics would refute the corresponding economic assertion. Financial evidence must match the stated accounting basis before supporting a decisive score.
measurement_requirements: Separate inference charges, integration, human review, retries and maintenance. Measure benefits against a defined alternative and distinguish provider profitability from customer ROI.
source_requirements: Provider financial disclosures and documented customer deployments or controlled studies with reproducible methods. Vendor estimates require explicit qualification.
