assessment_axis: historical_observation
explicit_source_elements:
  - reliable ability to reason over abstractions
  - Ongoing unpredictable errors in LLMs
evaluator_interpretation:
  - The empirical claim is that contemporary LLMs still make recurring errors when applying abstract rules. The normative statement about what AGI should possess is not separately scored.
  - Reliable means dependable performance across relevant new examples and task variations, not literal perfection or an absence of any reasoning ability.
  - Unpredictable is read as unexpected or inconsistent failures in use, not as a mathematical claim that aggregate error rates cannot be predicted.
  - With no reporting period supplied, the target is the latest pre-publication evaluation period in 2025, through March 5. Older experiments are context only.
support_condition: Controlled evaluations of contemporary LLMs document recurring failures in applying or inferring abstract rules across new examples, despite success on easier or familiar cases.
contradiction_condition: Broad, controlled contemporary evaluations establish dependable abstract-rule reasoning across relevant variations, with the alleged recurring failures explained by invalid tests or otherwise not reproduced.
measurement_requirements: Specify models, prompts, task generation, correctness criteria, and robustness checks. Separate benchmark success, general reliability, and claims about internal mechanisms.
source_requirements: Reproducible primary evaluations, with methods and preferably code or data; include material evidence of successful reasoning.
