ambiguity_flags:
  - No numerical reliability threshold or task distribution is supplied.
  - LLMs does not specify an exhaustive set of models.
  - Unpredictable can mean unexpected individual errors or statistically unpredictable performance.
  - The observation period is interpreted as the current 2025 evaluation period before publication.
  - Benchmark errors do not by themselves establish an absence of abstract representations.
