evaluator_interpretation:
  - The ordinary contextual reading concerns changing business economics, not a change of legal issuer.
  - Assess whether the S-1 explicitly describes an investment and payment model materially different from the historical financial snapshot. Do not treat this as proof that future results are guaranteed.
  - The target is the latest public S-1 preceding the post, filed October 26, 2026. This is a documentary assessment, not an assessment of a particular financial amount.
support_condition: The filing explicitly describes a substantial transition in how the business invests, incurs costs or pays for infrastructure, alongside expectations that differ from its historical presentation.
contradiction_condition: The filing describes no such transition, or the alleged change rests entirely on generic warnings that results could differ.
measurement_requirements: Read the financial discussion and relevant risk disclosures together. Distinguish explicit changes in business arrangements from uncertain financial consequences.
source_requirements: The public S-1 available before the post.
