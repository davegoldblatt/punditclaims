assessment_axis: forecast_outcome
explicit_source_elements:
  - not this year (or next, or the one after that
  - probably not this decade
  - except in narrow use cases
evaluator_interpretation:
  - "Read as: in 2025, 2026 and 2027, AI agents will not do a huge fraction of human knowledge work, except in narrow use cases."
  - The firm deadline is the end of 2027. 'Probably not this decade' is hedged, so it is not scored.
  - "'Huge fraction' is read as a large share of knowledge work across the economy, well beyond a few narrow tasks."
support_condition: Through the end of 2027, labor and adoption data show that agents do only a small share of knowledge work overall, beyond narrow uses such as coding or customer service.
contradiction_condition: Credible data show that, at some point in 2025–2027, agents did a large share of knowledge work broadly, not just in narrow niches.
measurement_requirements: Economy-wide share of knowledge-work tasks or hours done by AI agents.
source_requirements: Official statistics, peer-reviewed or independent measurement, or large representative surveys.
metric_scope: null
original_horizon: this year (or next, or the one after that
horizon_interval:
  start: 2025-01-15
  end: 2027-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Contradicted early if credible measurement before 2028 shows agents doing a large share of knowledge work broadly. It cannot be supported early, because the window runs to the end of 2027.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'huge fraction' has no threshold"
  - "'narrow use cases' is not defined (coding may count as one)"
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
