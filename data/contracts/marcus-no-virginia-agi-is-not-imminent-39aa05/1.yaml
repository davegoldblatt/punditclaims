evaluator_interpretation:
  - Gameable means that shortcuts, dataset biases or leakage can produce strong scores without the intended capability; deliberate cheating is not required.
  - Often means a recurring problem across established benchmarks and research areas, rather than a specified majority of all benchmarks.
  - The context explicitly invokes research from 2019 and its continuing relevance four years later. Assess that cumulative period through publication.
  - Industry awareness is assessed through published research recognition, not a literal survey of every practitioner.
support_condition: Research documents recurring benchmark vulnerabilities across tasks or domains, including successful shortcuts that bypass the intended capability.
contradiction_condition: Broad controlled audits show that such vulnerabilities are rare or ineffective, and that strong scores generally require the intended capabilities.
measurement_requirements: Experiments that isolate shortcuts or remove task-relevant information, supplemented by research surveying their occurrence across domains.
