assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI has projected
  - $750 billion or more
  - in the next three years
  - across compute contracts
  - Microsoft, Google, Amazon, CoreWeave, Cerebras and other providers
evaluator_interpretation:
  - Assess the existence and content of OpenAI's standing projection, not whether future spending ultimately occurs.
  - The statement that Altman's position is worrying is evaluative and is not scored.
  - Read the next three years as the rolling period from September 14, 2026 through September 14, 2029. Calendar-year interpretations remain possible.
  - For this ongoing projection, use a snapshot as of the post date rather than an earnings quarter. The spending period is recorded separately in metric_scope.
  - Use estimate as the accounting basis because the post links its amount to press reporting of projections.
  - Projected cumulative spending is neither an annualized run rate nor already realized spending.
support_condition: A projection current at publication assigns at least USD 750 billion of OpenAI compute spending to the specified three-year period.
contradiction_condition: A comprehensive projection current at publication assigns less than USD 750 billion to the same company, compute-spending scope, and three-year period.
measurement_requirements: Require a dated spending schedule covering the three-year window. Do not substitute total contract values, financing, cash burn, or spending through a later year.
source_requirements: Prefer an OpenAI projection or underlying financial presentation. Full accessible reporting may be used when the underlying document is unavailable.
