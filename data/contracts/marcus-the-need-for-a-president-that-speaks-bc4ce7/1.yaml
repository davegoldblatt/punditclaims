explicit_source_elements:
  - LLMs can’t be trusted
  - becoming more widely known
  - big AI leaders have switched their focus
  - long term promises that are impossible to verify
  - even more grandiose
  - which has turned out to be mostly untrue
evaluator_interpretation:
  - The ordinary reading concerns growing recognition of unreliable outputs, a shift in promotional emphasis, and failure to deliver most of the extraordinary business benefits previously promoted.
  - Cannot be trusted means outputs require checking in consequential applications, not that every output is false or every business use is worthless.
  - Impossible to verify is read as not verifiable when promised, rather than logically untestable forever.
  - The preceding paragraph supplies an approximate 2022 baseline. The historical comparison and business outcomes end on June 28, 2024.
  - With describes accompanying developments. It does not clearly commit to a separately testable causal explanation for leaders' motives.
support_condition: Comparable records establish growing awareness of reliability problems, a broad shift toward more expansive long-term promises, and failure by the post date to deliver most of the earlier extraordinary business benefits under their stated terms.
contradiction_condition: Representative evidence establishes no asserted shift or rise in awareness, or shows that most of the earlier business promises were delivered under their stated terms.
measurement_requirements: Measure messaging emphasis and awareness over comparable periods. Match business promises to actual outcomes, retaining deadlines, qualifications, implementation costs, and required human oversight.
source_requirements: Original executive statements, independent reliability studies, repeated awareness measures, and business-outcome evidence. Product failures and isolated productivity gains cannot establish the overall majority.
