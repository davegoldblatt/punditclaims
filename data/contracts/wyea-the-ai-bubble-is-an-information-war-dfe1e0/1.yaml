assessment_axis: historical_observation
explicit_source_elements:
  - neither OpenAI nor its peers have any plan
  - beyond saying “well we’ll just keep making more money”
  - I’m being quite literal
evaluator_interpretation:
  - Assess the existence of economic strategies, not whether those strategies will succeed.
  - The plain reading excludes a concrete plan to improve economics through cost control, efficiency, or capital discipline beyond revenue growth.
  - Treat 'sounds like a scam' as commentary, not a separate allegation of legally established fraud.
  - Use 2026 through publication as the current planning period. Earlier plans disclosed during this period qualify; strategies first adopted after publication do not.
  - A concrete OpenAI strategy beyond revenue growth is sufficient to contradict the categorical 'neither' assertion.
support_condition: Reliable evidence of the relevant plans establishes that they rely solely on rising revenue, with no concrete strategy addressing costs, efficiency, margins, or capital exposure.
contradiction_condition: A plan in existence before publication specifies concrete economic measures beyond increasing revenue at OpenAI or a covered peer.
measurement_requirements: Identify an economic mechanism and its existence before publication. Product launches or optimistic revenue forecasts alone do not qualify as counterexamples.
source_requirements: Contemporaneous company strategy disclosures or subsequently disclosed records documenting plans already in existence before March 3.
