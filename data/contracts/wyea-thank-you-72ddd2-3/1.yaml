assessment_axis: forecast_outcome
explicit_source_elements:
  - AI bubble popping
  - a depression will begin in the tech industry
evaluator_interpretation:
  - The surrounding discussion makes the predicted industry depression a consequence of the AI bubble popping.
  - The ordinary reading of depression is a severe, sustained, broad downturn in the technology industry.
  - Employment, investment, business activity, and business failures can establish its breadth and persistence. No single numerical depression threshold is imposed.
  - The context concerns the broader technology industry centered on major US firms; weakness in one company or regional stock market is insufficient by itself.
  - Although the claim concerns the beginning of a depression, later observations are needed to distinguish a sustained downturn from a temporary setback.
  - No deadline or fixed duration is supplied.
support_condition: A qualifying AI-boom collapse is independently established, followed by a severe and sustained technology-industry contraction across several measures, with credible evidence linking the contraction to the collapse.
contradiction_condition: A qualifying collapse occurs and sufficiently complete subsequent evidence shows that its industry consequences ended without a severe, sustained, broad contraction. An isolated positive indicator or an unfinished aftermath cannot establish failure.
measurement_requirements: Consistently defined sector data across multiple reporting periods, covering employment and business activity or investment, with corroborating evidence on failures and financing where available.
source_requirements: Prefer official sector statistics, industry datasets, company filings, and independent causal analysis. Stock-price declines or layoff announcements alone cannot establish an industry depression.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve as supported when the qualifying collapse and the onset of a severe sector-wide contraction are documented, with subsequent evidence confirming persistence. No failure can be inferred merely from the absence of a collapse by the evaluation date.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The AI bubble and its collapse are undefined.
  - Depression has no specified sector-level numerical threshold or duration.
  - Technology-industry and geographic boundaries are unstated.
  - No deadline or maximum lag between collapse and contraction is given.
