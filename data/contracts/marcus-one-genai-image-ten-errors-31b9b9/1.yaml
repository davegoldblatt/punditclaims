assessment_axis: historical_observation
explicit_source_elements:
  - current systems
  - good at local coherence
  - between words, and between pixels
  - not at lining up their outputs with a global comprehension of the world
evaluator_interpretation:
  - The ordinary reading is a contrast between convincing surface output and unreliable consistency with facts, relationships, and whole prompts.
  - This describes a general weakness, not a claim that every model fails every task or has no useful world knowledge.
  - Because no reporting period is specified, the target is January 2024 through the post date, the latest reporting window for the ongoing state described.
  - Fluent language and high-quality visual rendering are proxies for local coherence. Factual, explanatory, and spatial consistency are behavioral proxies for aligning outputs with the world.
  - These behavioral tests do not establish whether a model possesses an internal global comprehension of the world.
support_condition: Contemporary research reports convincing language and visual output alongside recurring failures to maintain factual, explanatory, or compositional consistency across the outputs of then-current systems.
contradiction_condition: Broad evaluations of then-current text and image systems show reliable factual and compositional consistency across varied tasks, undermining the claimed general contrast with surface quality.
measurement_requirements: Evidence covering both language and image generation, with tasks that distinguish surface plausibility from factual or relational consistency. Isolated failures alone are insufficient.
source_requirements: Primary research describing systems and capabilities current in January 2024. Later systems and earlier experimental results cannot independently settle the observation.
