assessment_axis: historical_observation
explicit_source_elements:
  - can’t reliably sanity check themselves for hallucinations
  - can’t reliably sanity check for whether what they are doing is harmful
evaluator_interpretation:
  - The plain reading concerns dependable detection of their own factual fabrications and harmful outputs or actions across ordinary uses.
  - Reliable does not mean infallible. Neither occasional failures nor isolated successes settle broad dependability.
  - Self-checking includes a fresh review by the same model, but excludes external factual answers or a separate specialist verifier.
  - The two components require separate evidence. Generating harmful content, refusing a request, detecting harm, and correcting an answer are different measurements.
  - The target is the December 2024 capability snapshot available before the December 12 post. Earlier model evaluations provide context unless they establish that current state.
support_condition: Direct self-review evaluations of the relevant models show material, repeated detection failures across both hallucinations and harmful outputs or actions, sufficient to undermine broad dependability.
contradiction_condition: Broad, independently checked evaluations establish dependable self-detection for the relevant models and uses. Narrow successes alone do not settle the general claim.
measurement_requirements: Measure false negatives and false positives against independently established factual and harm labels. Report models, prompts, task coverage, and whether detection uses outside information.
source_requirements: Primary self-detection evaluations; reviews may map the evidence but cannot substitute for missing measurements of the two components.
