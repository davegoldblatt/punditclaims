explicit_source_elements:
  - generative AI is a deeply unprofitable product
  - demanding massive amounts of cloud computing power
evaluator_interpretation:
  - The ordinary reading is that selling generative AI generally produces substantial overall losses, with computing a major expense. This does not mean every provider loses money.
  - Use calendar 2023, the latest completed year before publication and the year used for revenues in the surrounding passage.
  - Overall profitability includes development and operating expenses. Positive gross margins alone would not contradict this reading.
  - The surrounding financial figures are attributed to press reports, so the implied accounting basis is estimate.
support_condition: Representative evidence for 2023 establishes substantial losses across generative AI providers and substantial computing requirements.
contradiction_condition: Representative evidence for 2023 establishes that generative AI provision was generally profitable, or that computing requirements were modest.
measurement_requirements: Comparable realized revenues, total expenses and computing expenses for a representative set of providers. Distinguish net losses, operating losses, cash burn and gross margins.
source_requirements: Company financial statements or credible reporting on their accounts, supplemented by direct computing disclosures. Individual companies are context for the sector-wide conclusion.
metric_scope:
  company: Generative AI providers collectively; OpenAI and Anthropic are the examples named
  metric: Overall profitability and computing expenses
  currency: USD
  units: dollars; no numerical loss threshold stated
