explicit_source_elements:
  - Consensus estimates
  - Microsoft’s FY2027 capex
  - around $186 billion
  - non-OpenAI/Anthropic AI revenue
  - $18.7 billion
  - 100% net profit margins
  - a decade of those revenues
evaluator_interpretation:
  - This is an observation about estimates available when the post appeared, not a prediction that actual FY2027 results will equal them.
  - The observation date is August 4, 2026. The underlying financial estimates concern Microsoft's fiscal year ending June 30, 2027.
  - The hypothetical payback calculation holds annual revenue constant, applies all of it to the stated capex, and assumes zero costs. It does not establish the actual return on Microsoft's entire investment.
  - The full post attributes AI revenue estimates to Wells Fargo; 'consensus' may describe only the capex estimate.
  - The single metric_scope represents the paired estimated flows. Each input must be verified separately before their ratio is treated as evidence.
support_condition: Independent records verify an approximately $186 billion FY2027 capex consensus and a same-year $18.7 billion estimate for the defined non-OpenAI/Anthropic AI revenue. Dividing capex by annual revenue yields approximately ten years under the stated zero-cost assumption.
contradiction_condition: Contemporaneous estimate records materially disagree with either quoted input, show incompatible definitions or periods, or establish that the arithmetic does not yield approximately ten years.
measurement_requirements: Verify the consensus date and contributor set; distinguish cash capex from capex including finance leases. Define which revenue streams exclude OpenAI and Anthropic, including model resale and revenue sharing. Use annual fiscal-year revenue, not an exit run rate.
source_requirements: The original analyst estimate tables and dated consensus dataset, or independent reporting reproducing their values and definitions. Company guidance alone cannot verify analyst consensus.
