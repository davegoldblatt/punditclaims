ambiguity_flags:
  - "'On the same level' supplies no common measure of scientific importance."
  - "'Contributions to science' could include foundational computer-science research as well as applications in other scientific fields."
  - The relative credit assigned to model developers and independent scientists using their models is unspecified.
  - "'Culture' is not defined, and the relationship between culture and research contributions is not demonstrated."
  - The cumulative historical record has no stated starting date.
