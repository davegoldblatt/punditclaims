assessment_axis: historical_observation
explicit_source_elements:
  - a clear attempt to use the media to misinform investors and the general public
  - OpenAI claimed SoftBank would spend $3bn a year on agents in 2025
  - That never happened!
evaluator_interpretation:
  - Assess both the cited spending example and the allegation that it demonstrates intentional misinformation.
  - Read 'in 2025' as calendar 2025, rather than SoftBank's fiscal year or a future annual spending rate.
  - Read 'never happened' as failure to spend approximately $3 billion during that year, not proof that no OpenAI products were used.
  - A missed projection alone does not establish that its maker intended to deceive.
support_condition: A documented commitment to approximately $3 billion of agent spending during calendar 2025, evidence that the spending did not occur, and evidence connecting the representation to an attempt to mislead.
contradiction_condition: Comparable records establish that the promised 2025 spending occurred, or establish that the attributed calendar-2025 promise was materially misstated. Lack of evidence of intent alone is not contradiction.
measurement_requirements: Calendar-2025 payments or recognized spending for the specified OpenAI services across the relevant SoftBank group companies. Separate product spending from equity investments and infrastructure financing.
source_requirements: The original announcement and contractual timing, plus SoftBank or OpenAI spending records. Intent requires contemporaneous communications or comparably strong evidence.
metric_scope:
  company: SoftBank Group and its group companies
  metric: Spending on OpenAI agent products
  currency: USD
  units: billions
