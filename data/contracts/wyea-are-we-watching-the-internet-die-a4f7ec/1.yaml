assessment_axis: forecast_outcome
explicit_source_elements:
  - As more internet content is created
  - partially or entirely through generative AI
  - models themselves will find themselves increasingly inbred
  - training themselves on content written by their own models
  - on some level, permanently locked in 2023
evaluator_interpretation:
  - The antecedent is growth in AI-generated internet content.
  - The predicted outcome is increasing recursive dependence on earlier model outputs in subsequent model training, with resulting homogenization or loss of fresh human information.
  - The qualified reference to being locked in 2023 is read as a claim about information ancestry, not an exact technical cutoff shared by every model.
  - The claim concerns the trajectory of models trained from the internet. Deliberately constructed laboratory feedback loops alone do not establish that trajectory.
support_condition: Longitudinal training-data and model analyses show that growing AI web content increasingly enters successive models' training sets, creates recursive ancestry and produces the predicted narrowing.
contradiction_condition: Comparable analyses show that successive models avoid increasing recursive dependence or retain diverse fresh information despite the antecedent. A limited successful mitigation is counterevidence but does not settle an unlimited forecast.
measurement_requirements: Measure AI content in web samples and in the actual post-filtering training corpora separately. Track provenance across model generations and distinguish intentional synthetic training from accidental web feedback.
source_requirements: Primary corpus audits, disclosed training-data analyses and controlled evaluations with reproducible methods; account for AI-detector errors.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A dated longitudinal audit must establish the complete web-to-training feedback process and its effects across successive model generations. Web contamination or a single experimental training run is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or required magnitude of increase.
  - Inbred is a metaphor without a specified measure.
  - Own models could mean the same model lineage or generative models collectively.
  - Permanently locked in 2023 is qualified by on some level.
retrospective_or_prospective: retrospective
