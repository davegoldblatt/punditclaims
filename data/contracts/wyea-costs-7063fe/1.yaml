assessment_axis: historical_observation
explicit_source_elements:
  - It’s becoming increasingly apparent
  - Large Language Models
  - are not a profitable business
evaluator_interpretation:
  - The ordinary reading concerns the current profitability of developing and selling LLM services, especially the major standalone developers discussed in context.
  - Profitability means revenue exceeding full operating costs, including research and model development. Positive gross margin alone is insufficient.
  - This is not read as a prediction that LLMs can never become profitable.
  - Because the sentence names no reporting period, use the first half of 2025, the latest completed financial reporting period identified in contemporaneous public reporting before the post.
  - The statement specifies no accounting basis. The contract therefore records unknown rather than assigning GAAP, non-GAAP, or an estimated basis.
support_condition: Comparable financial records show that the major LLM-development businesses were operating at a loss after full operating costs during the target period, with enough coverage to justify the generalization.
contradiction_condition: Comparable records show that the major LLM-development businesses generally earned operating profits after full operating costs during the target period. Isolated profitable products would qualify the generalization but would not necessarily refute its ordinary reading.
measurement_requirements: Revenue and all attributable operating costs for LLM businesses, on a stated and comparable accounting basis. Separate operating income from net income, cash burn, gross margin, and parent-company profits.
source_requirements: Prefer financial statements and segment disclosures. Where unavailable, use reputable reporting based on financial records and identify its limitations.
