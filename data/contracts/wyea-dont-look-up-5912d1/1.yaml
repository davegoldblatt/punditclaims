assessment_axis: forecast_outcome
explicit_source_elements:
  - The only way all that compute gets used
  - Anthropic and OpenAI rent all of it
  - multiple $10 billion-a-year customers
  - appear virtually overnight
evaluator_interpretation:
  - "This is a necessary-condition forecast: without either stated exception, the capacity will not become fully used."
  - The capacity refers to the buildout discussed in the post, associated with roughly 30 GW and projected annual compute demand, not every existing AI chip.
  - No deadline is supplied. The nearby discussion of 2027 spending does not expressly set a utilization deadline.
  - Actual utilization must be distinguished from ownership, operational availability and reservation under a contract.
  - The spending threshold describes a condition on customer composition; the forecast's outcome measure is capacity utilization.
support_condition: For a clearly identified capacity cohort, both exceptions are absent and a decisive terminal event establishes that some capacity will never be used.
contradiction_condition: The identified capacity becomes fully used while neither lab rents all of it and no rapid emergence of multiple customers each spending at least $10 billion annually accounts for that use.
measurement_requirements: Identify the capacity cohort, operational dates, actual utilization and ultimate customers. Measure each qualifying customer's annual spending separately; do not annualize a multiyear contract total without its delivery schedule.
source_requirements: Require operator utilization records and customer spending or contract records covering the same capacity and period.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A dated demonstration of full utilization of the identified cohort while both exceptions are absent conclusively contradicts the forecast. Support requires a terminal event, such as permanent retirement of unused cohort capacity, with both exceptions demonstrably absent. Temporary vacancies or announced contracts do not settle it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The capacity cohort is not enumerated.
  - No deadline is stated.
  - "'Virtually overnight' has no specified duration."
  - "'All ... gets used' does not distinguish full commercial occupancy from actual hardware utilization."
  - The scope of the labs' renting 'all of it' is unclear.
retrospective_or_prospective: retrospective
