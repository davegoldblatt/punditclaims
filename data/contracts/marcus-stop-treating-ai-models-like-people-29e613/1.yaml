assessment_axis: causal_assessment
explicit_source_elements:
  - When we do so
  - amplify the hype around AI
  - lead people into thinking
  - trustworthy oracles capable of manipulation or decision-making
  - which they are not
evaluator_interpretation:
  - When we do so refers to treating AI models like people. This is a proposed causal relationship, not a conditional forecast.
  - The ordinary reading of hype and trustworthy oracles is inflated expectations and unwarranted reliance on chatbot answers.
  - The surrounding discussion of fabricated biographies supports reading the final clause as denying dependable oracle-like authority, rather than denying every capacity to influence people or produce a decision.
  - The causal assertion concerns the chatbot setting described in early 2023. Later studies may inform the mechanism but do not automatically establish effects in that earlier population.
support_condition: Relevant controlled comparisons show that anthropomorphic treatment increases inflated expectations or unwarranted trust, and contemporary evaluations establish that the targeted chatbots are insufficiently reliable for the authority attributed to them.
contradiction_condition: Relevant comparisons establish no increase or a reduction in inflated expectations and unwarranted trust, or demonstrate the dependable oracle-like reliability denied by the claim.
measurement_requirements: Compare anthropomorphic and neutral framing while holding response quality constant. Distinguish trust, perceived accuracy, actual reliance and public hype.
source_requirements: Controlled human-subject research and version-specific reliability evaluations. Associations alone cannot establish the framing effect.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Hype has no supplied measure.
  - Trustworthy oracles may mean general reliability or dependable authority in consequential decisions.
  - Which they are not could deny oracle-like reliability or all manipulation and decision-making capacity.
  - Treating like people could mean interface cues, explicit framing or users' pre-existing beliefs.
