assessment_axis: historical_observation
explicit_source_elements:
  - they remain superficial
  - their responses invariably have the right kind of language
  - for any given problem
  - rarely trustworthy
evaluator_interpretation:
  - The ordinary reading is that contemporary LLM answers consistently sound appropriate to the task, while dependable answers are uncommon across ordinary uses.
  - Trustworthy means sufficiently correct and reliable for the task, rather than merely fluent. It does not require perfect performance on every conceivable question.
  - Superficial is assessed through the stated contrast between appropriate language and dependable answers, not as a separate claim about consciousness or internal understanding.
  - Because this is an ongoing state without a reporting interval, the target is the latest reportable snapshot immediately before publication, January 13, 2025. Earlier evaluations are context unless they establish that snapshot.
  - No numerical cutoff for 'rarely' is imposed; the evidence must establish that dependable answers are clearly uncommon or clearly common across a representative task mix.
support_condition: Representative evaluations of contemporary systems show consistently appropriate language but dependable answers only as an uncommon exception across ordinary tasks.
contradiction_condition: Representative evaluations show that dependable answers are common across ordinary tasks, or verified in-scope responses clearly fail the asserted invariant of task-appropriate language.
measurement_requirements: Evaluate linguistic appropriateness separately from correctness and reliability. Identify model versions, task selection, repeated trials and grading standards; do not equate selected benchmark accuracy with general trustworthiness.
source_requirements: Independent evaluations are preferred. Company evaluations may inform the assessment with their selection and independence limitations stated. Marcus's own examples cannot establish population-wide frequency.
