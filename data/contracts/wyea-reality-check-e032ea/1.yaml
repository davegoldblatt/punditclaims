assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI
  - spent $9 billion in 2024
  - lose $5 billion
evaluator_interpretation:
  - Assess the financial assertion, not the surrounding opinion about concern or risk.
  - Read the amounts as rounded to the nearest billion dollars.
  - The context relies on press reporting, so the claimed accounting basis is estimate.
  - Both spending and losses must describe completed calendar-year 2024 results. A forecast published during 2024 does not establish those results.
  - The wording does not specify whether spending includes noncash expenses or whether loss means consolidated net loss or loss attributable to OpenAI.
support_condition: Comparable retrospective evidence establishes approximately $9 billion of spending and approximately $5 billion of losses in calendar 2024 on the basis underlying the reported estimates.
contradiction_condition: Comparable retrospective evidence establishes that either amount falls outside its nearest-billion rounding interval on that same basis.
measurement_requirements: Separate spending from cash burn, operating loss, and net loss. Reconcile excluded expenses and ownership allocations before comparing different financial presentations.
source_requirements: Company financial records or reputable reporting based on those records. Forecasts and unreconciled accounting measures are context only.
