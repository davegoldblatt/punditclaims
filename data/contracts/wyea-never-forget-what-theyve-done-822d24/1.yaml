  - but their inconsistency
  - even ardent AI cultists warning people not to trust their output
evaluator_interpretation:
  - Read the pejorative description as referring to enthusiastic AI advocates, without adopting the characterization.
  - Read the warning as advice against accepting output without verification, rather than advice never to use LLMs.
  - "'Famous not for ... but ...' asserts comparative public reputation. The existence of warnings alone does not establish that inconsistency predominated over efficacy."
  - Use the current calendar year through publication, 2025-01-01 to 2025-06-09, as the reporting window for this ongoing observation; no reporting period is supplied.
support_condition: Contemporaneous advocates publicly warn against unverified reliance, and representative reputation evidence shows inconsistency predominating over efficacy.
contradiction_condition: Representative contemporaneous evidence establishes that efficacy predominated over inconsistency in LLMs' reputation, or sufficiently comprehensive evidence disproves the asserted advocate warnings.
measurement_requirements: Separate actual reliability, public perceptions, and statements by advocates. Reputation evidence needs a defined population and a defensible comparison.
source_requirements: Use advocates' original statements for the warning clause and representative surveys or systematic coverage analysis for the reputation clause.
