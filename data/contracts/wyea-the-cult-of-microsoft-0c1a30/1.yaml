evaluator_interpretation:
  - Assess the substantive claim about Copilot's personalized work summaries, not merely whether Zitron spoke to someone.
  - Prone to hallucinations means susceptible to inventing or misattributing achievements, numerical results, or supporting citations in ordinary use. It does not mean every summary is wrong.
  - The source attribution is an evidential qualifier, not a conditional forecast.
  - For the ongoing behavior, use October 2024, the latest complete month before publication. The illustrative source tests are not separately dated.
support_condition: Contemporaneous personalized achievement summaries, checked against the user's underlying work records, demonstrate invented or misattributed accomplishments, metrics, or citations in ordinary use.
contradiction_condition: Authenticated records disprove the alleged examples, and suitably scoped contemporary tests provide evidence against the asserted susceptibility in this workflow. A few correct summaries would not suffice.
measurement_requirements: Compare generated claims and citations with the employee's actual contributions, correspondence, and documents. Distinguish false assertions from omissions and stylistic differences.
source_requirements: Inspectable tests, independently verified employee records, or a Microsoft disclosure specifically addressing this workflow. General model warnings are context only.
