assessment_axis: historical_observation
explicit_source_elements:
  - Every company loses money
  - Seemingly every AI data center is behind schedule
  - the vast majority of them aren’t even under construction
evaluator_interpretation:
  - The warning-sign language is rhetorical; the loss, delay, and construction assertions are the checkable components.
  - The surrounding discussion principally concerns AI labs and startups buying compute. Whether 'every company' also includes chip suppliers and diversified technology companies is unresolved.
  - The ordinary reading of 'loses money' is an overall loss, not simply expenditure or negative cash flow.
  - For the financial component, 2025 is the latest completed annual reporting period before the post; the claim does not supply a common quarterly reporting period.
  - Construction and schedule status refer to the state immediately before the April 8 post, informed by the latest available pre-post observations. The target interval bounds these different component periods; they are not interchangeable.
  - "'Vast majority' means substantially more than half of announced AI data-center projects by count. I do not substitute capacity in gigawatts or invent a percentage threshold."
  - "'Seemingly' qualifies the delay assertion; it is not a conditional antecedent."
support_condition: A defined population shows overall losses for every included company, nearly universal delays against original schedules, and a substantially greater-than-half share of announced AI data-center projects without construction underway.
contradiction_condition: Comparable financial records identify a profitable company within the intended population, or representative project records show that delays are not nearly universal or that most projects are already under construction.
measurement_requirements: Company-level results on a consistent accounting basis; a dated project register distinguishing announcements, site preparation, construction, and operation; original schedules and project-count denominators.
source_requirements: Financial statements and independently maintained construction records, with developer disclosures used cautiously. Forecast delays must be separated from delays already incurred.
