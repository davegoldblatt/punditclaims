assessment_axis: historical_observation
explicit_source_elements:
  - every big, flashing warning sign
  - Every company loses money.
  - Seemingly every AI data center is behind schedule
  - the vast majority of them aren’t even under construction
evaluator_interpretation:
  - The warning-sign language is an evaluative introduction. Assess the factual statements that follow without treating them as proof that a bubble exists.
  - In context, the ordinary reading of 'every company' concerns generative-AI businesses. Whether it includes diversified technology companies, infrastructure suppliers, or only standalone model and application companies is unspecified.
  - The ordinary reading of 'loses money' is an overall business loss after expenses. The passage supplies no accounting basis, so the financial assertion cannot receive a supported or contradicted verdict under the money rules.
  - "'Seemingly' qualifies the entire delay assertion. Treat it as an impression from the information then available, not a commitment that every, or a specified percentage of, projects was demonstrably late. Neither an isolated on-time project nor a forecast of future delays settles that impression."
  - For the construction assertion, read 'them' as announced AI data-center projects in the development pipeline. 'Vast majority' means an overwhelming majority by project count; no precise percentage is supplied. A capacity-weighted estimate is relevant context but does not establish that count.
  - "For the ongoing financial assertion, use the latest normally reportable completed quarter before publication: October–December 2025, subject to company-specific fiscal calendars. For construction and apparent delays, assess the latest public status through April 8, 2026. The target interval encompasses these distinct observation windows; it does not make annual financial results interchangeable w…"
support_condition: Comparable accounts would need to establish losses throughout the relevant company population, and a representative inventory would need to show an overwhelming majority of announced AI projects had not started construction. Contemporaneous reporting could corroborate the qualified impression of pervasive delays, but cannot turn it into a numerical universal. Financial scoring additionally requires an identifiable accounting basis.
contradiction_condition: A profitable company clearly within the intended population, measured for the appropriate period on the applicable basis, would contradict the universal loss assertion. A representative inventory showing that projects without construction were a minority or only a narrow majority would contradict 'vast majority.' The qualified delay impression is not falsified merely by finding an on-time project.
measurement_requirements: Specify the company population, financial period and accounting basis. For construction, use dated project-level records with a consistent project definition, an announced-project denominator, original schedules and physical construction status. Keep project counts separate from gigawatts, and actual lateness separate from forecast delay risk.
source_requirements: Prefer financial filings and company accounts, construction records and independent project trackers. Assess the delay impression using reporting available by April 8, 2026. Later evidence available by October 28 may establish earlier facts, but cannot establish what appeared publicly known when the post was written.
