assessment_axis: historical_observation
explicit_source_elements:
  - I severely doubt
  - Microsoft is spending
  - more than a few billion
  - on CPUs
evaluator_interpretation:
  - Read this as a tentative empirical estimate that CPU purchases account for only a low-single-digit number of billions of dollars.
  - Use FY2025–FY2026 together because the sentence qualifies the combined spending calculation immediately preceding it. An annual interpretation is also plausible.
  - Measure CPUs themselves, not the entire cost of CPU servers, memory, storage or networking.
  - Do not convert 'a few' into an arbitrary exact cutoff or assign a numerical probability to 'severely doubt'.
support_condition: A credible CPU-specific spending breakdown places the FY2025–FY2026 total clearly within a low-single-digit number of billions of dollars.
contradiction_condition: A comparable breakdown places CPU spending clearly beyond an ordinary reading of a few billion dollars. Borderline values would remain unresolved.
measurement_requirements: CPU acquisition spending separated from complete server systems and other equipment, with explicit period coverage and estimation uncertainty.
source_requirements: Microsoft purchasing disclosures or a credible supplier-based or analyst estimate with a reproducible allocation to Microsoft.
