assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT’s most frequent free users
  - become less valuable over time
  - become a burden
  - Unlike Facebook and Google
evaluator_interpretation:
  - Value means net economic value to the provider, including serving costs and benefits from conversion, referrals and useful training data.
  - A decline over time requires evidence following comparable users or cohorts. Positive inference costs alone do not establish declining net value.
  - The comparison also requires evidence about comparable Facebook and Google users.
  - Because this is an ongoing observation without dates, I use July through September 2024, the latest completed calendar quarter before publication.
  - The claim supplies no accounting basis, currency, valuation method or threshold for the most frequent users.
support_condition: Comparable cohort evidence shows declining net economic value and a net cost burden from persistent heavy free ChatGPT use during the target period, alongside a different trajectory for comparable Facebook and Google users.
contradiction_condition: Comparable cohort evidence shows that heavy free ChatGPT users maintained or increased net economic value, were not a net burden, or did not differ from the comparison services as claimed.
measurement_requirements: User-level or cohort-level serving costs, usage, conversion and other attributable benefits over time, with consistent cost allocation and matched Facebook and Google comparisons. An accounting or valuation basis must be established before a decisive monetary comparison.
source_requirements: Company cohort disclosures or credible independent estimates with transparent methods. Aggregate losses, API prices and company-wide advertising revenue are insufficient.
