evaluator_interpretation:
  - The ordinary contextual reading concerns the original Sora and comparable general-purpose generative systems, across their intended real-world uses.
  - The claim concerns enforceable truthfulness, physical consistency, or object continuity, rather than an improvement in average output quality.
  - A guarantee must cover the relevant property throughout the system's intended domain. Enforcing one conservation equation in a specialized scientific generator does not establish that a Sora-like system obeys real-world physics.
  - This is a claim about the technical position at the time of the post, not a prediction that no future method could ever succeed.
  - The target period is February 15–16, 2024, the latest public Sora announcement and demonstration period before the post.
  - The distinction between lacking an existing guarantee and having no way to implement one is material. Output failures alone establish only the former.
support_condition: Architectural analysis or sufficiently comprehensive technical evidence establishes that Sora and comparable general-purpose systems then lacked a way to encode and enforce these broad real-world constraints throughout their intended outputs.
contradiction_condition: A method available by the post demonstrably encodes and guarantees at least one of the named broad properties in Sora or a comparable general-purpose system across its intended domain. A narrow formal constraint or improved benchmark score is insufficient.
measurement_requirements: Specify the system, property, covered domain, assumptions, and enforcement mechanism. Distinguish guaranteed compliance from empirical success and distinguish general real-world properties from isolated mathematical constraints.
source_requirements: Use technical documentation, proofs, or validated implementations relevant to methods available by February 16, 2024. Later publications may describe that historical state but later inventions cannot contradict it.
