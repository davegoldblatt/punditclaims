assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s growth is slowing
  - at precisely the time it needs to accelerate
  - effectively 10x its current business by 2030
  - to make its obligations
  - before a company starts dying
evaluator_interpretation:
  - The central observation concerns slowing business growth at the time of publication. The ordinary financial reading is revenue growth, with user growth as supplementary evidence.
  - Use January through March 2026, the latest completed calendar quarter before the post, as the target period. Earlier comparable periods are needed to assess whether growth slowed.
  - The tenfold statement is a claim about the financial growth requirement understood at publication, not a prediction that OpenAI will actually achieve tenfold growth.
  - Current business does not specify realized annual revenue, monthly revenue or annualized run rate. No denominator is silently substituted.
  - To make its obligations describes the purpose of the asserted growth requirement, not a conditional forecast antecedent.
  - Starts dying is read as financial deterioration, not as a separate forecast with an invented insolvency deadline.
support_condition: Comparable revenue data show a declining growth rate entering or during the target quarter, and a documented obligations-and-funding analysis establishes that roughly tenfold expansion from the contemporaneous baseline is needed by 2030.
contradiction_condition: Comparable revenue data establish that the asserted slowdown did not occur, or a sufficiently complete obligations-and-funding analysis disproves the claimed tenfold requirement. Conflicting settled components would warrant mixed.
measurement_requirements: Use consistent revenue definitions and intervals to compare growth rates. Distinguish missed targets from slowing actual growth, and distinguish realized revenue from annualized run rate. The tenfold requirement needs a baseline, payment schedule, costs and financing assumptions.
source_requirements: Prefer company financial disclosures and contracts. Clearly attributed reporting may provide context where private company records are unavailable.
