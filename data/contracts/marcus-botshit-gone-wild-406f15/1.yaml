assessment_axis: causal_assessment
explicit_source_elements:
  - deleterious effects on education
  - students learning essentially nothing
  - during the all too frequent trips to ChatGPT
evaluator_interpretation:
  - The plain reading is that students generally acquire negligible knowledge or skill when studying with ChatGPT, and that this use harms learning.
  - Learning means knowledge or skill demonstrated independently after assistance is removed. Better AI-assisted submissions alone do not establish learning.
  - The claim concerns educational use at the time of the July 4, 2025 post. The decisive studies examine use before that date.
  - Ordinary conversational assistance is distinguished from specially designed tutoring systems and prewritten AI-generated hints.
  - Essentially nothing is read as negligible learning, not merely no additional benefit over conventional study. Marcus supplies no numerical threshold.
  - A mixed assessment distinguishes evidence of harm in particular settings from the stronger claim that students generally learn essentially nothing.
support_condition: Controlled studies of ordinary ChatGPT-assisted study show negligible independently measured learning gains and worse outcomes than comparable unassisted study. General support requires evidence extending beyond one subject or setting.
contradiction_condition: Controlled studies show substantial independently measured learning during ChatGPT-assisted study, contradicting the negligible-learning component. Comparable or better outcomes than unassisted study also count against generalized harm; a statistically insignificant difference alone does not establish equivalence.
measurement_requirements: Use controlled comparisons and independent post-tests, preferably with baseline measurements and delayed retention tests. Separate absolute learning gains from the additional effect of AI access, and separate assisted task performance from learning.
source_requirements: Primary research with inspectable methods and results, published by October 28, 2026. Identify preprints and distinguish randomized findings from exploratory associations.
