explicit_source_elements:
  - Uber’s economics
  - absolutely nothing like generative AI
  - Uber did not have capex
  - ride-by-ride basis, not a monthly subscription
evaluator_interpretation:
  - The ordinary reading is that the businesses have materially different capital requirements, service costs and revenue models. It does not require literally zero similarities.
  - Use calendar 2025, the latest completed financial year before publication, for the financial comparison.
  - OpenAI and Anthropic are the principal AI providers identified in the surrounding passage.
  - The statement supplies neither a common accounting basis nor a rule for weighing the three dimensions.
support_condition: Comparable records show substantial differences in capital requirements, costs attributable to serving customers and revenue models.
contradiction_condition: Comparable records show broadly similar economics across those dimensions. An isolated similarity or difference does not settle the overall comparison.
measurement_requirements: Compare owned assets, leased capacity and purchased services separately. Compare variable service costs and actual pricing arrangements without equating spending commitments with capital expenditure.
source_requirements: Company financial statements and dated product disclosures covering the comparison period.
