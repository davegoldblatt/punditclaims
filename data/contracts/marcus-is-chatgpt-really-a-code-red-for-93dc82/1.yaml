explicit_source_elements:
  - they are not databases
  - they are text predictors
  - turbocharged versions of autocomplete
evaluator_interpretation:
  - Read 'autocomplete' as an analogy for predicting text continuations, not as a limit on the complexity of tasks models can perform.
  - Read 'not databases' in the post's stated sense of conventional systems for storing, retrieving and updating explicit records.
  - Assess the generative language models discussed in the late-2022 post, rather than every possible language-model architecture.
  - Use the November–December 2022 deployment and reporting period described by the surrounding discussion.
support_condition: Contemporaneous technical documentation identifies text prediction as the models' underlying training or generation mechanism, rather than conventional record lookup.
contradiction_condition: Technical documentation shows that the relevant generative models principally retrieve stored records and do not predict text continuations.
measurement_requirements: Descriptions of training objectives and token-generation mechanisms. No benchmark threshold is needed.
source_requirements: Primary technical papers or developer documentation concerning the model generation available at the time.
