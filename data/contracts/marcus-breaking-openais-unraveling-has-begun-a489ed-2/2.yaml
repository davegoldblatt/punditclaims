ambiguity_flags:
  - No population or geography is specified.
  - Trust could mean institutional honesty, safety, privacy or product reliability.
  - Hardly anyone has no numerical threshold.
  - Anymore supplies no comparison date.
  - The business clause expresses a qualified unfavorable judgment without a specified effect or magnitude.
  - The ongoing state is anchored to the post date because no survey reporting period is named.
