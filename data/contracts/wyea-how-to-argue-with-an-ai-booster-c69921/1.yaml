assessment_axis: historical_observation
explicit_source_elements:
  - These data centers
  - not, in and of themselves, driving much economic growth
  - other than in the costs of building them
  - throughout America
evaluator_interpretation:
  - The subject is US data centers serving generative AI, following the surrounding discussion.
  - The plain reading is that continuing operations contribute little to economic growth beyond the facilities' construction.
  - Use the second quarter of 2025, the latest completed quarter that national economic reporting could cover before the post, for this ongoing observation.
  - Assess growth in real value added from operations separately from construction. Existing output levels, revenue, employment, and profits are not interchangeable with economic growth.
  - No numerical cutoff for much is supplied; do not invent one to decide a borderline result.
support_condition: A credible decomposition for the target quarter finds that AI data-center operations contributed little to US real economic growth once construction is excluded.
contradiction_condition: A credible decomposition for the same quarter finds a substantial contribution to US real economic growth from AI data-center operations independently of construction.
measurement_requirements: Separate AI from other data-center activity, operations from construction, domestic value added from gross spending, and changes in output from output levels. Report effects relative to the economy and the construction contribution.
source_requirements: Official economic statistics or transparent economic studies with identifiable periods, geography, assumptions, and separate operating and construction estimates.
