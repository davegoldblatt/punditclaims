evaluator_interpretation:
  - In context, the antecedent is a broad hyperscaler spending retrenchment accompanied by a pullback in data-center lending.
  - I read 'everybody' as the relevant spending and financing ecosystem, rather than literally every investor.
  - Both laboratories must seek substantial external financing during the same documented retrenchment. Routine fundraising outside that episode is insufficient.
  - The claim specifies neither a financing amount nor an accounting basis. Those omissions are retained rather than supplied from later reports.
support_condition: The broad spending-and-lending pullback occurs, and dated records show both laboratories seeking substantial new external funding during it.
contradiction_condition: A completed pullback episode occurs, and affirmative financing and liquidity records show that at least one laboratory did not need or seek new external money throughout that episode.
measurement_requirements: Consistent industry spending and lending measures, dates of financing solicitations by both laboratories, and evidence that the periods overlap.
source_requirements: Company financing disclosures or filings where available; reputable reporting for private fundraising and lending negotiations, with its limitations stated.
