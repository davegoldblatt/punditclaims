support_condition: A contemporary assessment of BCI capabilities places substantial AI-mediated cognitive enhancement beyond demonstrated capabilities, with existing demonstrations limited to narrower functions.
contradiction_condition: A validated human BCI demonstration establishes substantial cognitive improvement from integration with AI, beyond communication or motor assistance alone.
measurement_requirements: Cognitive outcomes must measure improvement in human reasoning, learning, memory, or comparable abilities, rather than simply the speed or accuracy of operating an external device.
source_requirements: Contemporary scientific reviews and human demonstrations, preferably with controlled cognitive evaluations, available by the evaluation date.
