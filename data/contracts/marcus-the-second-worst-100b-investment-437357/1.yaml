assessment_axis: forecast_outcome
explicit_source_elements:
  - a $100B LLM
  - worked noticeably better than a $1B LLM
  - the economics for that investment are problematic
  - a $100B LLM plus infrastructure
  - customers probably would not be willing to pay the required premium
evaluator_interpretation:
  - The ordinary reading of problematic economics is difficulty recovering the investment and operating costs from customer payments while earning a commercial return.
  - The $100 billion refers to the model and its supporting infrastructure, consistent with the surrounding passage. It is not necessarily the cost of one training run.
  - The condition requires a roughly $100 billion investment producing a model demonstrably better than a roughly $1 billion alternative, with both costs measured comparably.
  - The surrounding 2028–2030 dates describe planned deployment, not a deadline for investment recovery. The economic forecast has no stated deadline.
  - The investment amount has an estimate basis because the context attributes it to press reporting.
support_condition: After the performance and investment condition is established, attributable costs, customer payments and returns show that the investment cannot reasonably recover its capital and operating costs with a commercial return over its economic life.
contradiction_condition: After the same condition is established, attributable customer cash flows demonstrate recovery of the investment and operating costs with a commercial return.
measurement_requirements: Comparable accounting of the $100 billion project and $1 billion alternative; credible performance comparisons on commercially relevant tasks; project-specific capital costs, operating costs, revenues and cash flows; and an explicit asset life and cost of capital. Financing commitments and company-wide revenue alone do not settle the claim.
source_requirements: Prefer project accounts, company disclosures and independently verified performance comparisons. Distinguish planned commitments from actual expenditure and infrastructure costs from training costs.
metric_scope:
