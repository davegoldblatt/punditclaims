early_resolution_rule: Once the cost and performance condition is verified, realized project cash flows establishing investment recovery and a commercial return would contradict the claim. Permanent closure with final accounts establishing unrecovered costs would support it. Funding announcements, interim losses and construction progress alone cannot settle it.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Problematic economics has no specified return threshold or recovery period.
  - Noticeably better has no named benchmark or performance threshold.
  - The allocation of shared infrastructure costs to the model is unspecified.
  - The relationship between the originally proposed project and later projects carrying the Stargate name requires verification.
  - The forecast supplies no economic deadline.
