assessment_axis: forecast_outcome
explicit_source_elements:
  - Around six months from going public
  - around 9 billion shares
  - can be traded on the market
  - they’ll be dumped en masse
evaluator_interpretation:
  - Treat the forecast as conditional on roughly nine billion shares becoming eligible for public sale near the six-month IPO anniversary.
  - The plain reading of dumped en masse is substantial, widespread selling by holders whose restrictions have lifted. Eligibility alone, ordinary turnover or a price decline alone does not establish it.
  - Use May 2027 as the approximate six-month window and May 31 as its operational endpoint. The speaker supplied no exact tolerance for around.
  - The nine-billion figure is read as approximate total eligible shares, not necessarily nine billion newly unlocked shares.
support_condition: The eligibility condition occurs, and sale disclosures and attributable trading evidence show substantial, widespread selling around the relevant release.
contradiction_condition: The eligibility condition occurs, but sufficiently complete ownership and sale records show that holders largely retain their newly tradable holdings through the relevant window.
measurement_requirements: Reconcile cumulative eligible shares with outstanding shares, issuable awards, share-class conversions and registration restrictions. Distinguish actual holder sales from repeated trading of the same shares.
source_requirements: Final lockup and registration disclosures, dated release notices, insider-sale and ownership filings, and trading records covering the release window.
metric_scope: null
original_horizon: Around six months from going public
horizon_interval:
  start: 2026-11-24
  end: 2027-05-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only if the specified eligibility condition actually occurs early and completed, attributable sales conclusively establish widespread selling. A release schedule or falling share price is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Around six months gives no exact deadline; May 31 is an evaluator-selected endpoint.
  - Around nine billion has no numerical tolerance.
  - The wording does not distinguish total eligible shares from newly released shares.
  - Dumped en masse specifies neither a sales percentage nor an observation window.
retrospective_or_prospective: prospective
