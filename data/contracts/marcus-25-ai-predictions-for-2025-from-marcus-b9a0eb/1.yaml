explicit_source_elements:
  - Corporate adoption
  - far more limited than most people expected
  - total profits across all companies
  - except of course hardware companies like NVidia
  - modest at best
evaluator_interpretation:
  - The surrounding review of 2024 makes calendar 2024 the target period.
  - The ordinary reading concerns corporate adoption of generative AI and aggregate profits from the generative-AI business, excluding hardware suppliers.
  - The adoption comparison requires earlier expectations and subsequent adoption measured for comparable populations. Low adoption alone does not establish disappointed expectations.
  - Profits means earnings after expenses. The company universe, accounting basis, currency and threshold for modest are unspecified.
support_condition: Comparable expectation and adoption evidence shows a substantial shortfall in 2024, and comparable financial records show small or negative aggregate profits across the specified industry excluding hardware suppliers.
contradiction_condition: Comparable evidence shows adoption substantially met or exceeded earlier expectations, or a sufficiently complete industry profit total materially exceeds an established meaning of modest.
measurement_requirements: Matched adoption definitions, populations and expectation horizons; a defined company universe and consistent profit measure. The unknown accounting basis prevents a supported or contradicted financial verdict under the money rules.
source_requirements: Original adoption surveys and company financial disclosures where available. Press estimates must remain identified as estimates and cannot establish an industry total by themselves.
