ambiguity_flags:
  - Almost every has no numerical threshold or defined model population.
  - Desperate has no measurable severity threshold.
  - The observation includes historical training but supplies no starting date.
  - Copyrighted does not mean unlicensed or infringing.
  - The suggested causal link between scarcity and copyrighted-data use is not independently specified.
