assessment_axis: forecast_outcome
explicit_source_elements:
  - By the time
  - all the Blackwells
  - Vera Rubin will be two years old
evaluator_interpretation:
  - Read 'all the Blackwells' as the purchased but not yet installed cohort discussed at publication, not every Blackwell ever sold in the future.
  - Read Rubin's age from first commercial availability, rather than its announcement or the start of manufacturing.
  - The ordinary substance is that this cohort will not finish deployment until Rubin is at least approximately two years old.
  - "'By the time' identifies the forecast's endpoint. It is not a separate conditional antecedent that excuses the forecast."
  - No calendar deadline is stated; do not manufacture one from an announced Rubin release window.
support_condition: Dated records establish the relevant cohort and show its installation completion occurring approximately two years or more after Rubin's first commercial availability.
contradiction_condition: Dated records establish that the entire relevant cohort completed installation materially before Rubin reached two years of commercial availability.
measurement_requirements: Identify the purchase cohort, account for every included deployment, distinguish delivery from operational installation, and establish the relevant Rubin availability milestone.
source_requirements: Purchase and commissioning records from the relevant operators, corroborated where possible, plus NVIDIA or partner records of commercial Rubin availability.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only when dated records establish completion of the entire identified Blackwell cohort and Rubin's commercial-availability date, allowing its age at completion to be determined. Individual deployments, shipment announcements and revised plans do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The purchased Blackwell cohort is not enumerated.
  - Rubin's age could be measured from announcement, production or commercial availability.
  - "'Two years old' may be approximate."
  - No calendar deadline is supplied.
retrospective_or_prospective: retrospective
