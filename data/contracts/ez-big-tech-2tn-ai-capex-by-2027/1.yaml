  - big tech
  - will have sunk $2 trillion
  - into AI capex
  - with very little to show for it
  - the preceding sentence names Microsoft, Google, Amazon, and Meta and their expected AI capex for 2026 and 2027
  - post dated 2026-05-06
evaluator_interpretation:
  - We read 'big tech' as Microsoft, Alphabet (Google), Amazon, and Meta, the four companies the preceding sentence names.
  - We read the $2 trillion as the four companies' combined capital expenditures for calendar 2026 and 2027, because the preceding sentence gives expected spending for those two years. The sentence itself states no start date.
  - None of the four reports AI capex separately. We would use total reported capital expenditures, as the preceding sentence does.
  - "'With very little to show for it' is a value judgment and is not tested."
support_condition: The four companies' reported capital expenditures for calendar 2026 and 2027 together reach about $2 trillion or more.
contradiction_condition: The four companies' reported capital expenditures for calendar 2026 and 2027 together fall clearly short of $2 trillion.
measurement_requirements: Each company's reported capital expenditures for each quarter of calendar 2026 and 2027, from its own filings, summed with the inputs and rounding shown. Microsoft's fiscal quarters are mapped to calendar quarters.
source_requirements: The companies' own earnings releases or filings.
