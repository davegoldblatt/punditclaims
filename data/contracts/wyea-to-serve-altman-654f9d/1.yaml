assessment_axis: forecast_outcome
explicit_source_elements:
  - $10+ billion revenue a year
  - it needs to survive
  - would need to replace entire chunks of the labor force
evaluator_interpretation:
  - The revenue threshold means revenue earned over a full year, not an annualized run rate.
  - The conditional proposition is that reaching this revenue requires substantial worker displacement attributable to OpenAI products.
  - Subscriptions and API sales describe payment channels. Either could finance uses that replace workers, so those channels do not themselves disprove displacement.
  - The financial argument uses press-derived estimates; the threshold is not presented on a specified GAAP or IFRS basis.
  - The separate assertion that this revenue is necessary for survival requires evidence about financial necessity.
support_condition: OpenAI reaches at least $10 billion in realized annual revenue, and credible evidence establishes that substantial worker displacement was necessary to reach it. Financial records must also substantiate the claimed survival requirement.
contradiction_condition: OpenAI reaches the revenue threshold with credible, sufficiently comprehensive evidence showing it did not require substantial worker displacement; alternatively, evidence establishes sustainable survival below the asserted revenue requirement.
measurement_requirements: Realized annual revenue, revenue-linked customer deployment evidence, and employment changes attributable to those deployments. Individual examples and aggregate employment trends alone cannot establish necessity.
source_requirements: Company financial disclosures or reputable reporting on financial records, together with independent employment research or sufficiently comprehensive customer records.
