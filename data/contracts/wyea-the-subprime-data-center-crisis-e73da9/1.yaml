assessment_axis: causal_assessment
explicit_source_elements:
  - Every time
  - the media has accepted
  - a spurious announcement
  - a questionable run rate
  - a circular deal
  - the outright refusal of hyperscalers to disclose their AI revenues
  - help inflate the AI bubble
  - endanger the futures of millions of people
evaluator_interpretation:
  - Accepted means presenting the specified corporate claims or practices without material scrutiny.
  - Help inflate means making a causal contribution to speculative investment or valuations beyond what underlying business prospects justify.
  - Endanger means increasing financial downside exposure for millions of people; realized losses are not required.
  - Every time asserts a consistent causal contribution across qualifying coverage episodes. It does not require each article to independently affect millions of people.
  - The claim concerns coverage before publication. Its starting date is unspecified, so the target period has an open start and ends on July 22, 2026.
support_condition: Evidence identifies qualifying coverage episodes and credibly shows that accepting the specified claims consistently increased speculative investment or overvaluation, with the resulting risk reaching millions of financially exposed people.
contradiction_condition: Credible causal evidence identifies a qualifying episode that did not contribute to speculative investment or financial risk, or establishes that the alleged media contribution was absent or reversed. A statistically imprecise null result alone is insufficient.
measurement_requirements: A reproducible classification of coverage; identification of the underlying misleading claims or practices; an appropriate comparison separating coverage effects from company news and market conditions; valuation or investment measures; and household exposure estimates.
source_requirements: Archived coverage, underlying corporate records, market data, credible causal research, and representative household investment or pension exposure statistics.
