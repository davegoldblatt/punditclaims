explicit_source_elements:
  - guarantees
  - almost every dollar spent on any AI product
  - eventually shared
  - one of a few multi-trillion dollar tech firms
evaluator_interpretation:
  - Read shared as some portion of nearly all AI-product spending reaching a major technology supplier through direct or indirect payments; the claim does not say suppliers retain the entire dollar.
  - The surrounding discussion identifies Amazon, Microsoft, and Google as the relevant supplier group.
  - Assess the existing payment structure using the latest completed quarter before publication, October through December 2023; the preceding paragraph also refers to the last quarter.
  - Eventually refers to the supplier payment chain, not a forecast with a future deadline.
  - No accounting basis is supplied for the asserted spending coverage, so accounting_basis is unknown.
support_condition: Representative payment-chain data show that nearly all AI-product expenditure generates some attributable supplier revenue for the identified technology firms, with only negligible exceptions.
contradiction_condition: Comparable payment-chain data show a material share of AI-product expenditure whose attributable supplier payments do not reach those firms.
measurement_requirements: Measure the coverage of AI-product expenditure by direct and indirect supplier payments. Overall cloud market shares, investment announcements, and supplier profits do not measure that coverage.
source_requirements: Require AI-specific expenditure and supplier-payment data with a defined market, period, and treatment of indirect payments.
