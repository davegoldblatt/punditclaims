evaluator_interpretation:
  - Around then is read as a typographical error for around them, referring to generative AI systems.
  - A safety guarantee means an engineered assurance that a specified harmful behavior is prevented under stated conditions. Merely lowering observed failure rates does not qualify.
  - A guarantee may have explicit assumptions and a bounded scope. The words do not require protection against every possible harm, or deployment in a commercial service.
  - Ever covers work completed through February 21, 2024; the claim supplies no historical starting date.
support_condition: A sufficiently comprehensive technical record establishes that no implemented, demonstrable safety guarantee for a generative AI system existed by publication.
contradiction_condition: At least one pre-publication implemented method provides a valid guarantee of a specified safety property around a generative AI system, with its assumptions and scope made explicit.
measurement_requirements: Inspect the guarantee, its assumptions, implementation, and proof or verification. Distinguish conditional guarantees from empirical improvements and from comprehensive safety.
source_requirements: Primary technical papers available before publication, with particular attention to critiques and limitations.
