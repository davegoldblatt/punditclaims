  - "'Thinly disguised bailout' does not define the degree of distress, the rescue mechanism, or the claimed concealment."
  - "'Pay $250 billion' can misleadingly suggest cash consideration instead of a transaction valuation."
  - The concession does not identify which foundations were wrong or establish a financial cause.
