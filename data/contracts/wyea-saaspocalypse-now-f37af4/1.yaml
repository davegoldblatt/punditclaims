evaluator_interpretation:
  - Assess the public-record proposition, not what the author personally searched or knew.
  - An explicit company attribution of substantial realized revenue growth qualifies; a separately audited generative-AI revenue line is not required by appears to have attributed.
  - Bookings, contract values, forecasts and annualized run rates alone do not qualify.
  - Public SaaS companies includes publicly traded vendors selling hosted software subscriptions even if they also sell on-premises software and services.
  - Use April through June 2024 as the latest completed calendar quarter ordinarily reported before publication. Earnings commentary published afterward but before the post can describe that quarter.
  - The Microsoft parenthetical has no sales threshold and is assessed only as contextual qualification, not as a separately resolved quantitative proposition.
support_condition: A sufficiently comprehensive review of contemporaneous public SaaS disclosures finds no qualifying attribution outside Microsoft, with apparent counterexamples shown to concern other metrics, other technologies or immaterial growth.
contradiction_condition: At least one qualifying public SaaS company other than Microsoft publicly links substantial realized revenue growth in the target period to its generative-AI offering.
measurement_requirements: Distinguish realized revenue from bookings and run rates. Verify the company's hosted-software business and the offering's generative-AI component. Identify management attribution separately from independent causal proof.
source_requirements: Company filings and earnings disclosures available before September 26, 2024. Clearly identified reproductions may be used when original pages cannot be read.
