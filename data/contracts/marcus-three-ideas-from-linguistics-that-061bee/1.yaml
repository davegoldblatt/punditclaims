assessment_axis: historical_observation
explicit_source_elements:
  - we see no reason to think
  - current large language models
  - encode stable representations of the world at all
  - All they are doing, literally, is predicting next words in sentences
evaluator_interpretation:
  - Assess the empirical assertion about model representations, not the authors' private state of knowledge.
  - The plain reading of 'at all' excludes even limited, repeatable representations of entities and their changing states. It does not require a complete or infallible model of reality.
  - Next-word prediction is a training or output task; the relevant question is whether internal representations support that task.
  - The target is the stock of model capabilities available as of 22 June 2022. There is no regular reporting period for this capability claim and no stated beginning; pre-existing models remain in scope, while later-created models do not.
support_condition: Appropriate probing and intervention studies of the relevant models establish that apparent state tracking does not depend on repeatable internal representations of entities and situations.
contradiction_condition: A model available by the post date demonstrably encodes structured entity or situation states, with controls and interventions showing more than superficial word associations.
measurement_requirements: Use held-out state decoding, suitable control representations and interventions linking encoded states to model outputs. Distinguish limited state representations from comprehensive human understanding.
source_requirements: Primary analyses of models existing by the post date. Later studies must identify the historical model tested.
