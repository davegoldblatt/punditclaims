assessment_axis: historical_observation
explicit_source_elements:
  - LLMs have become commodities
  - the world has indeed gone in this direction
evaluator_interpretation:
  - The plain reading is that competing LLMs had become broadly interchangeable commercial offerings for ordinary uses. It does not require identical performance on every task.
  - Comparable benchmarks and falling prices are relevant, but do not alone establish practical substitutability or low switching costs.
  - For this ongoing market observation, use June 1–25, 2026, the current month through publication. Marcus supplies no reporting period.
support_condition: Representative evidence from the target period shows comparable models from several providers, including open-weight alternatives, and practical customer substitution with limited differentiation or switching costs.
contradiction_condition: Representative evidence from the target period shows that substantial capability differences, persistent provider preferences, or switching costs prevent broad interchangeability across ordinary commercial uses.
measurement_requirements: Compare capabilities, total task costs, availability, and actual substitution across representative workloads. A single benchmark or low token price is insufficient.
source_requirements: Prefer dated independent benchmarks and customer-usage research. Treat vendor comparisons as limited evidence.
