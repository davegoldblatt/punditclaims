evaluator_interpretation:
  - The supplied normalized claim isolates the present-tense premise about model availability; the hedged near-term prediction is not separately assessed.
  - The quotation marks and word level allow a capability comparison extending beyond the product named GPT-5.
  - An ordinary reader could understand a major next-generation capability advance, but the statement supplies no threshold for identifying one.
  - Equating GPT-5-level exclusively with OpenAI's product name would narrow the claim in a way the speaker did not specify.
support_condition: A capability-based assessment would require an identifiable contemporaneous GPT-5-level standard and evidence that available models had not met it. A product-release record alone establishes only the narrower naming question.
contradiction_condition: A released model meeting that same contemporaneous capability standard would contradict the premise. No such standard is specified here.
measurement_requirements: A defined capability threshold, evaluation suite, or identifiable consensus standard for GPT-5-level performance.
source_requirements: Dated release announcements and comparable capability evaluations available for the period described.
