  - few signs
  - these companies can be sold to anyone or taken public
evaluator_interpretation:
  - The plain reading is that credible acquisition and IPO prospects are scarce across VC-backed AI companies.
  - Needs a miracle expresses the claimed severity of the exit problem; it is not treated as a literal supernatural prediction or a specified investment-return threshold.
  - The broad phrase every VC invested in AI includes AI infrastructure and application companies, while the surrounding discussion also makes frontier labs relevant.
  - Because this describes an ongoing market state without a period, use April through June 2026, the latest completed calendar quarter reportable before the August 11 post.
  - An IPO filing is a sign of a possible exit, not proof of a completed listing or investor profit. A few examples cannot by themselves disprove few signs.
support_condition: Representative evidence for the target quarter shows scarce credible acquisition and IPO routes across VC-backed AI companies, with sufficiently broad difficulty to substantiate the sweeping inference about their investors.
contradiction_condition: Representative evidence shows sufficiently widespread credible acquisition or IPO routes to defeat the asserted scarcity and its sweeping inference. Completed listings and announced transactions count, but funding rounds alone do not.
measurement_requirements: An AI-specific record of completed acquisitions, announced sales, IPO filings and listings, with company coverage and an appropriate population or historical comparison.
source_requirements: Prefer issuer announcements, filings and original venture-exit datasets. Distinguish proposed transactions, completed exits and investor returns.
