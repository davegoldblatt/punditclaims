assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA has $36 billion in compute commitments
  - because
  - actual demand for AI compute is much, much smaller
  - the demand he created for his GPUs
  - as of its last earnings report
evaluator_interpretation:
  - The claim attributes NVIDIA's compute commitments to substantially weaker underlying compute demand than the demand reflected in GPU purchases.
  - The post identifies the amount as coming from the latest earnings report, so its basis is company_reported.
  - Use the latest reported fiscal quarter-end before the post, July 26, 2026, for the outstanding commitment stock.
  - The amount is the aggregate outstanding face value of AI cloud agreements, not cash already spent, annual spending or all NVIDIA commitments.
  - A causal assessment requires comparable compute-capacity measures and evidence explaining why NVIDIA entered the agreements. Their existence alone does not establish the asserted cause.
support_condition: The matching disclosure establishes approximately $36 billion in commitments, and reliable utilization, sales and decision records establish that a substantial underlying demand shortfall caused those commitments.
contradiction_condition: Matching records refute the commitment amount, or reliable causal evidence establishes that the asserted demand shortfall did not explain the agreements.
measurement_requirements: Compare GPU-implied capacity and independently purchased compute over compatible deployment periods, allowing for construction delays, hardware differences and reserved capacity. Separate financing constraints from insufficient end demand.
source_requirements: Company commitment disclosures plus customer sales, utilization and contract records, supported by decision documents or credible causal analysis.
