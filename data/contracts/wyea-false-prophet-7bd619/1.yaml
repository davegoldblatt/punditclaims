explicit_source_elements:
  - transparently lying about the technology he creates
  - his boosters further propagate said lies
  - either because they don’t know or don’t care
evaluator_interpretation:
  - Lying means making materially false factual representations while knowing they are false. Optimistic predictions, opinions, and mistakes alone do not meet that standard.
  - The booster allegation requires identifiable repetition of the same false technology representation. It does not require proof that the booster knew it was false.
  - "For this ongoing allegation, use the recent public reporting period described by the post's discussion of the last month: May 1 through June 11, 2024. Earlier conduct remains context rather than decisive outcome evidence."
  - A documented instance can support the allegation; it need not establish that every statement by Altman or every supporter was deceptive.
support_condition: Identify a public technology representation by Altman in the target period, establish its material falsity and his knowledge at the time, and document its repetition by a supporter.
contradiction_condition: Identify the technology representations reasonably at issue and establish that they were accurate, not knowingly false, or not repeated as alleged. Failure to find proof of lying is not itself contradiction.
measurement_requirements: Compare exact statements with contemporaneous capabilities and records of Altman's knowledge. Trace specific repetitions rather than general enthusiasm or personal support.
source_requirements: Prefer original statements, technical documentation, internal records, and adjudicated findings. Treat testimony and litigation allegations as allegations unless independently established.
