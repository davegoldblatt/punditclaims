explicit_source_elements:
  - Outside of those two
  - the only other competitive AI businesses
  - Amazon, Microsoft and Google
  - annualized AI revenues of around 6%
  - capital expenditures so far
evaluator_interpretation:
  - The two companies with disclosed ratios are Amazon and Microsoft, as identified in the surrounding discussion.
  - The numerator is annualized AI revenue, not realized annual revenue or monthly revenue.
  - The ordinary reading of competitive is a commercially substantial AI business. The speaker supplies no market-share or profitability threshold.
  - Use January–March 2026, the latest reported quarter before publication, for the current revenue snapshots. The starting date and coverage of cumulative capital expenditure remain unspecified.
  - The surrounding discussion calls the expenditure AI capex, but that does not establish that all company capital expenditure was attributable to AI.
support_condition: Comparable disclosures establish approximately 6% for both companies using identifiable cumulative capital-expenditure windows, and market evidence supports the claimed exclusion of other competitive AI businesses.
contradiction_condition: A reproducible calculation materially differs from approximately 6% for either company, or a clearly comparable business outside the named five meets the ordinary competitive-business reading.
measurement_requirements: Identify each AI revenue definition, annualization date, cumulative capex starting date, inclusion of finance leases, and allocation between AI and other activities. Do not substitute monthly revenue for annualized revenue.
source_requirements: Company financial disclosures for the numerators and denominators; independent market evidence for the exclusivity assertion.
