assessment_axis: causal_assessment
explicit_source_elements:
  - inference is expensive too
  - That leaves very little room for profits
  - especially in such a competitive market
evaluator_interpretation:
  - "'That' refers to both training and inference expenses in the preceding sentences."
  - The ordinary reading is that these costs materially constrain major model developers' bottom-line margins at prevailing competitive prices.
  - For the ongoing financial state, use July–September 2026, the latest completed reporting quarter before the post.
  - Competition is part of the proposed explanation, not a conditional forecast antecedent.
  - No accounting basis or numerical threshold for 'very little room' is supplied.
support_condition: Representative provider financial breakdowns show thin or negative net margins and identify training, inference, and competitive pricing as material causes.
contradiction_condition: Comparable representative results show ample net profitability after those costs, or show that other expenses explain the apparent profit constraint while training and inference economics leave substantial margins.
measurement_requirements: Match revenue, inference expense, training expense, other operating expenses, and net results for the same providers and quarter. Separate non-cash financing charges, future-model investment, gross margins, and adjusted operating margins.
source_requirements: Prefer financial disclosures with cost attribution. Aggregate losses alone cannot establish the causal mechanism; secondary reporting must retain its original accounting distinctions.
