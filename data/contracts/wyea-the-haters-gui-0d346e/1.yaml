evaluator_interpretation:
  - In the surrounding annual-capex discussion, I read the amount as the 2025 spending budgets known at publication, rather than spending already completed by July.
  - The principal companies are Amazon, Alphabet, Microsoft and Meta. The word each makes the amount a company-by-company assertion.
  - Nearly $100 billion means close to that amount, not merely tens of billions. No precise tolerance was supplied.
  - Data-center infrastructure includes its computing equipment. A company's total capital budget provides an upper bound for this component when measured on the same basis.
  - The lack-of-profit language is separately unresolved; for no real reason is an evaluative judgment rather than a measurable financial result.
  - Microsoft uses a fiscal year ending in June; the other principal companies use calendar years.
support_condition: Each principal company's 2025 data-center infrastructure budget, as known at publication, is close to $100 billion. Supporting the profit component additionally requires attributable AI financial results.
contradiction_condition: At least one principal company's comparable data-center budget, or a valid upper bound on it, is materially below nearly $100 billion. This would contradict the each assertion without settling the profit or value judgment.
measurement_requirements: Use annual budgets known by July 21, 2025. Keep total capex, data-center capex, lease payments and multiyear commitments distinct. Derive and label any upper bound.
source_requirements: Contemporaneous company guidance or filings, with the spending definition and relevant fiscal year identified.
