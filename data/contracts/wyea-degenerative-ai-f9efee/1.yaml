ambiguity_flags:
  - Easy and difficult have no supplied measure.
  - Unlearning can mean information removal, behavior modification, or output suppression.
  - More consumes could refer to unique data volume or repeated training exposure.
  - The first clause is hedged, while the comparative causal assertion is firmer.
  - No deadline or discrete future outcome is specified.
