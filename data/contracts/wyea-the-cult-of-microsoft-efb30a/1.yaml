evaluator_interpretation:
  - This describes particular source tests before publication, not a forecast or a general claim about all Copilot prompts.
  - Wildly different means materially different numerical values for corresponding metrics, not minor wording changes.
  - Hallucinated means unsupported numbers presented as factual results. Clearly labeled hypothetical examples are not, by themselves, fabricated claims about actual achievements.
  - The test dates are unspecified. Leave the lower date bound unknown and use publication as the latest possible bound.
support_condition: Authenticated records of the source's repeated runs show materially different, unsupported factual values for the same metrics under the specified prompt.
contradiction_condition: The relevant run records show that the alleged numerical discrepancies did not occur, were supported by the underlying data, or were clearly hypothetical suggestions rather than asserted achievements.
measurement_requirements: Compare complete prompts, conversation context, outputs, corresponding metrics, and available grounding records. Preserve the model version and run dates where available.
source_requirements: Original prompt/output records or independent reporting that inspected those records. Generic hallucination examples cannot verify these particular runs.
