explicit_source_elements:
  - No AI system
  - can reliably do every five-hour long task humans can do
  - without error, or even close
  - hallucination and boneheaded errors that are so common in every day experience
evaluator_interpretation:
  - "The core testable part: as of the post, no AI system came anywhere near high-reliability performance on five-hour human tasks."
  - The best public yardstick is METR's 80%-time horizon, a stricter measure than the 50% one. 'Reliably ... without error' implies an even higher bar.
  - "'Or even close' is read as: the best high-reliability horizons were well below five hours, for example under about half of it."
  - The clause about hallucinations being 'so common' is a vague framing and is treated as secondary.
support_condition: Public measurements from the period show frontier systems' high-reliability (80%) time horizons well below five hours, even on METR's coding-focused tasks.
contradiction_condition: A public measurement from the period shows an AI system completing five-hour human tasks at high reliability (80% or more) across a broad range of domains.
measurement_requirements: METR 80%-time horizons for frontier models measured by or around the post date.
source_requirements: METR publications, or faithful reproductions of METR's statements.
