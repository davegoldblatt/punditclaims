assessment_axis: forecast_outcome
explicit_source_elements:
  - the vast majority of big tech
  - will be fine
  - at least in the short term
  - when the bubble bursts
evaluator_interpretation:
  - The antecedent is a broad collapse of the AI investment boom. A market selloff is relevant evidence but does not automatically establish that event.
  - Big tech is anchored by the surrounding references to the Magnificent Seven and specifically Microsoft, Google, Meta, Amazon and NVIDIA.
  - Fine means remaining financially viable and continuing ordinary operations. The context expressly permits large valuation declines and impairments.
  - Vast majority means a clear large majority, without inventing an exact percentage.
  - Short term refers to the immediate reporting periods after an established collapse. The speaker supplies no fixed duration.
support_condition: After a documented broad AI-bubble collapse, a clear large majority of the relevant major technology companies remain solvent, maintain adequate liquidity and continue ordinary operations during the immediate aftermath.
contradiction_condition: After the same documented trigger, financial failures, emergency rescues or severe operational disruption affect enough major technology companies that a clear large majority cannot be described as financially viable.
measurement_requirements: Establish the collapse date and scope, identify the company population, and examine post-event liquidity, solvency, going-concern disclosures and operations over comparable reporting periods.
source_requirements: Market measurements for the trigger and company filings, court records or official rescue records for financial viability. Pre-collapse earnings and stock prices alone cannot settle the forecast.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A documented bubble collapse followed by sufficiently complete evidence of the immediate financial aftermath can settle the claim without a calendar deadline. No pre-collapse observation qualifies.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Bubble bursts has no specified market or investment threshold.
  - The exact big-tech population is unspecified.
  - Vast majority has no numerical threshold.
  - Short term has no fixed duration.
  - Treating an ordinary selloff as the trigger could change the assessment.
retrospective_or_prospective: retrospective
