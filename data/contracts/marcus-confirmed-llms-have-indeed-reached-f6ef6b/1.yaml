explicit_source_elements:
  - scaling is running out
  - adding more data and more compute
  - without making fundamental architectural changes
  - a period of diminishing returns
evaluator_interpretation:
  - The ordinary reading is that increasing pretraining scale was yielding smaller useful capability improvements by publication, not that all improvement had stopped.
  - Compare capability gains for comparable proportional increases in training resources across successive frontier generations.
  - Use calendar 2024 through publication as the current development period indicated by the post's references to April and recent developments. Earlier generations supply comparison baselines.
  - A declining gain per additional FLOP alone does not establish that an established scaling relationship had newly weakened.
support_condition: Comparable resource and capability measurements show a broad decline in the gains from additional pretraining scale during the target period, after accounting for material changes in data quality, architecture and evaluation.
contradiction_condition: Comparable measurements show sustained or increasing capability gains for comparable increases in pretraining resources across the relevant frontier generations.
measurement_requirements: Training compute and data quantities, consistent capability evaluations, multiple scales or generations, and enough methodological disclosure to distinguish scaling from other changes.
source_requirements: Prefer lab reports and reproducible evaluations. Reports of private testing can establish reported concerns but cannot replace comparable measurements.
