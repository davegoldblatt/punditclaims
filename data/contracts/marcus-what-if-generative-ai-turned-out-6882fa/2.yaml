target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve the firm continued-use prediction once dated surveys across successive post-publication academic periods demonstrate persistent, substantial undergraduate generative AI use. Open-source migration is neither required nor scored.
interpretation_determines_result: false
plain_reading: true
