evaluator_interpretation:
  - Training includes distributing instructional documents and prompts; it need not mean mandatory classes.
  - The claim concerns instructions to employees, not how many employees actually followed them.
  - For this ongoing practice, use October 2024, the latest complete month before publication. No regular reporting period is specified.
support_condition: Authenticated guidance, training records, or independently verified employee accounts establish that Microsoft instructed employees to draft Connect responses with Copilot during the target period.
contradiction_condition: Authenticated records establish that the alleged guidance did not exist or did not instruct employees to draft Connect responses with Copilot. Restrictions on managers making employment decisions would not alone contradict the claim.
measurement_requirements: Establish the instructional content, Microsoft authorization or distribution, and when it was in effect.
source_requirements: Microsoft records or independently verified accounts. Repetitions of Zitron's reporting do not independently establish the claim.
