assessment_axis: historical_observation
explicit_source_elements:
  - the actual outcomes
  - half-functional internal dashboards
  - measure random user data or convert files
  - spending hours to save minutes of time
  - at some theoretical point
evaluator_interpretation:
  - The ordinary reading is that the internal tools produced by the described AI push generally work poorly and cost substantially more human time to build and repair than they save.
  - This is about the described hyperscaler projects, not every use of AI coding tools.
  - Time savings must account for repeated use and maintenance. Comparing hours of development with minutes saved on just one use would not fairly test the claim.
  - For this ongoing observation, the target is March 1–24, 2026, the current reportable month through publication.
  - The claim concerns observed project quality and returns. It does not by itself establish that mandatory use caused those outcomes.
support_condition: A representative assessment of the described projects shows substantial missing functionality and development plus repair time measured in hours against only minutes of credible cumulative savings.
contradiction_condition: Representative records for the same projects show reliable functionality and substantial net time savings. A successful project is counterevidence to the broad description but cannot alone establish typical results.
measurement_requirements: Identify the projects, intended functions, defects, development and repair hours, use frequency, realized savings and measurement horizon.
source_requirements: Project records, functionality assessments and measured time use. Company case studies may provide counterexamples but cannot establish representative outcomes without independent verification.
