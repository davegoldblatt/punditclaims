explicit_source_elements:
  - In the current relationship
  - nor will it send it that much money
  - $100 Billion
  - 90% of OpenAI’s funding is gated behind building 9 or 10 gigawatts
evaluator_interpretation:
  - Assess cumulative cash investment under the arrangement announced in September 2025, not all future financial relationships between the companies.
  - The existing deployment-linked relationship is the antecedent. Completing 9–10 GW is the asserted obstacle, not a condition that must occur before evaluating the prediction.
  - Distinguish the predicted investment outcome from the explanation involving the exact 90% gate.
support_condition: The original arrangement definitively ends or completes with less than $100 billion invested. Supporting the explanation additionally requires evidence of the stated funding gate and its role in preventing the investment.
contradiction_condition: NVIDIA actually delivers at least $100 billion in cash investment under the original arrangement.
measurement_requirements: Cumulative completed investment payments, their allocation to the September 2025 arrangement, and authoritative records of that arrangement’s final status. Announcements, guarantees and financing commitments are not completed investment payments.
source_requirements: Company disclosures, filings or definitive transaction records; clearly attributed reporting where those records are unavailable.
