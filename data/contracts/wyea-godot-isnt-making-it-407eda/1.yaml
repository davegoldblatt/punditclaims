assessment_axis: forecast_outcome
explicit_source_elements:
  - Once the AI bubble pops
  - there are no other hyper-growth markets left
  - will in turn lead to a bloodbath in big tech stocks
evaluator_interpretation:
  - The antecedent means a broad, sustained collapse of the AI investment boom discussed in the post, centered on the large US technology companies.
  - Bloodbath means a severe and broad decline in those companies' shares, rather than an isolated company's fall or brief volatility.
  - "The claim requires a causal link: lack of credible alternative fast-growing markets must materially drive the selloff."
  - The speaker supplies neither a deadline nor a numerical stock-market threshold.
support_condition: After the defined AI-boom collapse is established, big-tech shares suffer a severe broad decline, with credible evidence that the absence of alternative growth markets materially caused it.
contradiction_condition: After the antecedent is established and its aftermath observable, big-tech shares remain broadly resilient or recover through credible alternative growth markets, or evidence attributes a severe decline to causes inconsistent with the claimed mechanism.
measurement_requirements: Establish the antecedent separately; then examine a broad big-tech share-price basket, business growth opportunities, and evidence distinguishing AI-related causes from macroeconomic or company-specific shocks.
source_requirements: Primary investment and financial disclosures, reliable market measurements, and independently supported causal analysis.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Only a verified broad AI-boom collapse followed by a sufficiently observed stock-market and business aftermath can settle the conditional forecast. A regional correction or single-day selloff does not suffice.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No operational definition of the bubble popping.
  - US big-tech focus is inferred from the surrounding company discussion.
  - No threshold for bloodbath or hyper-growth.
  - No interval between the antecedent and the predicted selloff.
  - The causal mechanism requires evidence beyond co-occurring price declines.
