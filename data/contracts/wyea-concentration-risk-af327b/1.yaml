explicit_source_elements:
  - They are the largest direct consumer of AI compute
  - more than 70%
  - all AI revenues
  - Google, Microsoft, Amazon, Oracle, SpaceX, Cerebras and Lambda
  - either through direct contracts or via hyperscalers renting compute
evaluator_interpretation:
  - They means OpenAI and Anthropic jointly.
  - The plain reading applies the greater-than-70% threshold to each named provider; a pooled interpretation is also possible.
  - Use April–June 2026, the latest completed common calendar quarter that could have been reported before the post.
  - Measure realized AI revenue attributable to the two labs, directly or through identifiable intermediaries, against each provider's realized AI revenue for the same period.
  - Do not substitute total cloud revenue, annualized run rate, contract value, or backlog for realized AI revenue.
  - The passage does not specify an accounting basis or a consistent definition of AI revenue.
support_condition: Comparable evidence shows that OpenAI and Anthropic jointly account for strictly more than 70% of realized AI revenue at every named provider during the target period.
contradiction_condition: Comparable evidence establishes a share of 70% or less for at least one named provider under the each-provider reading.
measurement_requirements: For each provider, establish a consistent AI revenue denominator and a direct-plus-intermediary numerator attributable to the labs. Reconcile gross versus net recognition and prevent double counting within each provider.
source_requirements: Provider revenue disclosures and customer attribution records, or transparent independent estimates with matching periods and accounting definitions.
