explicit_source_elements:
  - immediate problems of LLMs
  - cybercrime to misinformation to nonconsensual deepfake porn
  - tend to be underplayed
  - because unrealistic melodrama sucks away attention
evaluator_interpretation:
  - The plain reading is a recurring displacement of attention to present harms by speculative catastrophic-AI narratives.
  - Underplayed is assessed as receiving less attention because of those narratives, rather than against an evaluator's preferred level of concern.
  - Relevant attention includes public concern, media coverage, and policy priorities; the source does not select one.
  - Tend to describes a general tendency, not a conditional forecast or a claim that every audience responds identically.
  - The causal account concerns discourse up to the post date; no fixed measurement window is supplied.
support_condition: Representative longitudinal, experimental, or decision-level evidence shows that catastrophic-AI narratives reduced attention to immediate LLM harms across relevant settings.
contradiction_condition: Evidence covering the claimed settings consistently shows no meaningful displacement, or increased attention to immediate harms following exposure to catastrophic narratives.
measurement_requirements: Measure attention to immediate harms and exposure to catastrophic narratives, with a credible comparison that separates displacement from other causes. Public concern and institutional resource allocation must remain distinct.
source_requirements: Experiments, systematically sampled media studies, policy agendas, or resource-allocation records with transparent methods.
