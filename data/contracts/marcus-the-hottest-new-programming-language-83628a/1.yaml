evaluator_interpretation:
  - "'Much' means a substantial portion of the referenced examples, not merely one possible violation; no precise percentage is supplied."
  - Compare the examples with the alleged directives as written, including their scope and exceptions.
  - A textual comparison with an alleged prompt does not require proving it genuine, but calling an output an actual operational violation requires establishing applicability.
  - The recent examples are assessed over January 1 through February 15, 2024. This is an inferred early-2024 period, not an explicit date range.
  - Examples from Bing or Midjourney cannot establish that ChatGPT violated its own instructions.
support_condition: An identifiable substantial subset of the referenced examples is independently corroborated and clearly conflicts with the relevant directives, with product, session timing, and instruction applicability established.
contradiction_condition: A sufficiently complete comparison shows that the referenced examples generally comply, involve other products, or fall outside the directives, leaving no substantial set of clear violations.
measurement_requirements: Identify the example corpus and compare each applicable example with the precise instruction. Separate image resemblance, ChatGPT response text, and the rewritten prompt sent to DALL-E.
source_requirements: The alleged instruction text, independent corroboration of the referenced examples, and records sufficient to establish which instructions applied. Marcus's own descriptions cannot independently verify his claim.
