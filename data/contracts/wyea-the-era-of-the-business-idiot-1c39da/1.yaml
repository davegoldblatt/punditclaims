assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI can spend billions of dollars on cloud compute
  - losing billions more in the process
  - requiring Microsoft to invest further money to keep them alive
evaluator_interpretation:
  - Assess the supplied proposition about OpenAI, excluding the surrounding claims about Xbox and Microsoft monopolies.
  - The ordinary reading combines multibillion-dollar losses associated with compute spending with a specific dependence on additional Microsoft investment.
  - "Use calendar 2024 for the financial flows: the latest completed annual reporting period before publication. The speaker supplies no period or quarterly figure. The alleged financing dependence describes the position at publication on 2025-05-21."
  - The words do not identify an accounting basis. Do not silently substitute operating losses, net losses or cash burn for one another.
  - Funding from Microsoft establishes participation, not that OpenAI could not survive without additional Microsoft funding.
support_condition: Comparable financial records establish multibillion-dollar losses and compute expenditure, and liquidity and financing records establish that continued operation at publication required additional Microsoft investment.
contradiction_condition: Comparable records disprove the claimed financial magnitude, or establish that OpenAI could continue operating without further Microsoft investment. Other investors' participation alone does not establish the latter.
measurement_requirements: Separate compute expenditure, accounting losses, cash burn, available liquidity and financing commitments. Establish the loss definition and whether funding was committed, conditional or received.
source_requirements: Prefer financial statements, financing agreements and company disclosures. Clearly label press estimates. Do not use Zitron's own reporting as independent confirmation.
