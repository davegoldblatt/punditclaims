ambiguity_flags:
  - No financial period is stated; calendar 2024 is the evaluator's reporting-period interpretation.
  - The financial flows and the present-tense financing dependence concern different times.
  - Losses could mean accounting losses or cash burn.
  - No accounting basis or source for the financial amounts is supplied.
  - The statement does not specify how soon OpenAI would fail without further Microsoft investment.
