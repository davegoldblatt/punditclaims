explicit_source_elements:
  - as it stands
  - not economically viable for anybody involved
  - other than the construction firms, NVIDIA, and the surrounding hardware companies
  - a data center buildout that doesn’t appear to be happening at the speed we believed
evaluator_interpretation:
  - Economic viability means an AI business or deployment can sustainably cover its attributable costs. Revenue growth or a profitable parent company alone is insufficient.
  - Treat the named industries as exceptions to the population, not as a conditional antecedent.
  - Use January–March 2026, the latest completed quarter generally reportable before May 19, for the ongoing state described.
  - Assess construction pace against previously announced schedules for comparable projects and usable capacity.
  - The passage supplies no accounting basis for the financial assertion; retain unknown rather than choosing one from the evidence.
support_condition: Comparable evidence shows that participants outside the named exceptions cannot sustainably cover AI costs, and that actual construction progress falls below prior schedules.
contradiction_condition: A qualifying participant outside the exceptions demonstrably covers its attributable AI costs sustainably during the target period, or comparable construction records establish that the relevant buildout met prior expectations.
measurement_requirements: AI-specific revenue, operating and capital costs, and a stated treatment of depreciation and financing; separately, project schedules and actual usable capacity. A single profitable quarter is evidence but does not automatically establish sustainability.
source_requirements: Prefer financial statements, attributable cost disclosures, developer schedules and independent project tracking. Identify unaudited management claims and distinguish forecasts of delays from actual delays.
