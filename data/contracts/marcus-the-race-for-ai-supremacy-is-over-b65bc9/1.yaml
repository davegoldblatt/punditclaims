assessment_axis: historical_observation
explicit_source_elements:
  - revenue (order of $5B)
  - outlays that have been much greater
  - no actual killer app (relative to the costs) has emerged
evaluator_interpretation:
  - I use calendar 2024, the latest completed annual period before the post, because the surrounding comparison concerns annual company revenue and spending.
  - Order of $5B means approximately several billion dollars, not an exact $5 billion threshold.
  - Revenue means revenue earned over the year, rather than an annualized run rate.
  - Outlays means company spending, but Marcus does not specify cash payments, operating expenses, or another accounting measure.
  - A killer app relative to costs means an application with commercial returns sufficient to justify its attributable costs. Company-wide losses alone cannot establish the absence of such an application.
  - The supplied text does not attribute the figures or identify their accounting basis, so the contract basis remains unknown.
  - Relative to the costs qualifies the observation; it is not a forecast antecedent.
support_condition: Comparable calendar-2024 financial records show revenue of several billion dollars and substantially greater outlays, while application-level revenue and attributable costs establish the absence of a commercially justifying application.
contradiction_condition: Comparable records refute the revenue scale or spending gap, or establish an application whose commercial returns justify its attributable costs.
measurement_requirements: Match period and accounting basis. Separate realized revenue from run rate, expenses from cash spending, operating losses from net losses, and company results from application margins.
source_requirements: Company financial records are preferred. Press estimates must be labeled and cannot silently establish an unstated accounting basis.
