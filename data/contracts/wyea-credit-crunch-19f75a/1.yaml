assessment_axis: historical_observation
explicit_source_elements:
  - no other AI companies
  - growing anywhere near as fast
  - customer bases that come close
  - those customers are mostly other AI startups
evaluator_interpretation:
  - In this discussion of business viability, customers means paying customers; free consumer users are not automatically comparable.
  - Those customers refers to the customers of OpenAI and Anthropic. Mostly means more than half by customer count, not by revenue.
  - The preceding discussion of revenue run rates makes commercial revenue growth the natural growth measure. Realized revenue and annualized run rates must be compared separately.
  - The comparison includes businesses selling competing AI services, including AI businesses within larger companies, but excludes their unrelated operations.
  - Use July through September 2026, the latest completed calendar quarter before the post, for the ongoing observation. Customer counts can be snapshots within that quarter.
  - No accounting basis, growth interval, or numerical meaning of close is supplied.
support_condition: Comparable industry data establish a clear growth and paying-customer gap separating both labs from competitors, and representative customer classifications show that AI startups comprise more than half of each lab's customers.
contradiction_condition: Comparable records establish a competitor with similar commercial growth or customer scale, or representative customer classifications establish that AI startups are not a majority of the relevant customer base.
measurement_requirements: Use matching periods, customer definitions, and revenue bases. Distinguish customers from seats and users, and customer-count shares from spending shares. A partial sample cannot establish a worldwide universal claim without justified coverage.
source_requirements: Company customer disclosures and financial records, or representative independent measurements with disclosed definitions and coverage.
