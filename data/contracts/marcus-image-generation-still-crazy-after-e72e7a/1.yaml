assessment_axis: historical_observation
explicit_source_elements:
  - asked ChatGPT to draw a tree on top of monkey
  - stubbornly insists on tree growing out of (rather than on top of the) monkey
  - recognizes its own error but still can't get the image right
evaluator_interpretation:
  - The claim describes one ChatGPT conversation he had around June 2025.
  - It holds if, in that conversation, ChatGPT kept drawing a tree growing out of the monkey instead of resting on top of it, and also said in text that it had made this error.
support_condition: An independent record of that conversation, or a reproduction from the same period, shows ChatGPT admitting the error in text and still producing images with the tree growing out of the monkey.
contradiction_condition: An independent record shows that the conversation went differently, for example that ChatGPT did produce a tree on top of the monkey, or never admitted the error.
measurement_requirements: The full ChatGPT dialogue and images for the 'tree on top of monkey' prompt, from about June 2025.
source_requirements: A shared ChatGPT conversation link, an independent reproduction, or a third-party record. The speaker's own screenshots cannot count as proof that he was right.
