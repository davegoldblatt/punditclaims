explicit_source_elements:
  - ChatGPT
  - can’t leverage that kind of information reliably
  - doesn’t have its own an explicit, stable, internal model
evaluator_interpretation:
  - "The claim joins two propositions: unreliable use of well-documented facts and absence of an explicit, stable internal world model."
  - Reliability means dependable factual answers across ordinary contexts, not perfect accuracy on every possible question.
  - A behavioral error does not establish the absence of an internal representation.
  - No version or period is named. I use June 2025 through publication as the latest monthly observation window; older model evaluations remain context.
  - The Harry Shearer example motivates the claim but is not treated as an independently verified experiment.
support_condition: Replicated tests of the relevant ChatGPT configuration show material factual inconsistency, and independent architectural or mechanistic evidence establishes the claimed absence of an explicit, stable model.
contradiction_condition: Matched tests establish dependable use of the relevant facts under ordinary contextual variation, or mechanistic evidence identifies a stable, explicit, updatable internal model in the relevant ChatGPT system.
measurement_requirements: Identify model version, date, prompts, repeated trials, retrieval settings, source availability, and factual ground truth. Evaluate internal representations separately from output accuracy.
source_requirements: Independent reproducible factual-consistency tests and primary architectural or mechanistic evidence concerning ChatGPT itself.
