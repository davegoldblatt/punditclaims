explicit_source_elements:
  - ChatGPT
  - can’t leverage that kind of information reliably
  - doesn’t have its own an explicit, stable, internal model
  - One day it may tell you Shearer is British, another day that he is American
evaluator_interpretation:
  - "The plain reading has two components: unreliable use of well-documented factual information and absence of an explicit, stable internal representation."
  - Reliability means ordinarily dependable factual answers across reasonable variations in context. It does not mean that every answer must be correct.
  - The reference to Wikipedia concerns information available for learning; it does not establish that a particular response used browsing or retrieved the relevant page.
  - The target is ChatGPT configurations relevant at publication, assessed using the latest applicable public evaluations. Earlier tests are eligible when their configuration remains relevant; there is no June-only boundary.
support_condition: Applicable tests show recurring factual errors or contradictions across reasonable contexts, and direct architectural or representation evidence establishes the absence of the claimed stable internal model.
contradiction_condition: Applicable tests demonstrate dependable factual use across contexts, or direct evidence establishes the explicit, stable internal representation whose existence is denied. Partial findings must be reported separately.
measurement_requirements: Record ChatGPT model, date, prompts, sampling settings, tool access and factual ground truth. Test repeated and paraphrased questions separately from internal representations.
source_requirements: Primary evaluations or company disclosures tied to relevant ChatGPT configurations. Studies of other model families cannot establish ChatGPT's internal architecture.
