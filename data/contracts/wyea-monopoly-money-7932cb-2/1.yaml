assessment_axis: historical_observation
explicit_source_elements:
  - generative AI loses so much more money than it makes
  - has yet to solve the complex problems to justify its costs
evaluator_interpretation:
  - The ordinary financial reading compares losses with revenue across generative AI providers, rather than comparing their total corporate finances.
  - The financial comparison uses calendar Q2 2024, the latest completed quarter that could have been publicly reported before the post.
  - The utility assertion concerns demonstrated solutions to complex business problems whose benefits cover their costs. Productivity improvements alone do not establish that comparison.
  - Earlier deployments are relevant background to 'has yet', but are not treated as measurements of Q2 2024 outcomes.
  - The statement supplies no accounting basis; none is inferred from later evidence.
support_condition: Comparable realized financial records establish losses substantially exceeding revenue across the claimed sector, and representative deployment evidence establishes inadequate benefits relative to full costs.
contradiction_condition: Comparable financial records refute the claimed shortfall, or credible deployment evidence establishes cost-justified solutions to complex problems within the claimed scope. A financial verdict also requires an identifiable accounting basis.
measurement_requirements: Separate revenue from annualized run rate, losses from expenditure, and provider economics from customer economics. Include deployment, supervision, integration, and error costs when measuring benefits.
source_requirements: Provider financial disclosures or clearly identified estimates with matching scope and period; primary deployment studies with credible cost-benefit measurements.
