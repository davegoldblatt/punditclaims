assessment_axis: historical_observation
explicit_source_elements:
  - '"generative AI loses so much more money than it makes"'
  - '"has yet to solve the complex problems to justify its costs"'
  - present tense, as of the post (2024-08-12)
evaluator_interpretation:
  - "\"Generative AI\" is read, in the post's context, as the business of building and selling large language models and products built on them. The leading standalone model makers (OpenAI, Anthropic) are the clearest measure, because the big tech firms do not break out generative AI profit. Chip suppliers such as Nvidia are not the generative AI business itself."
  - "\"Loses so much more money than it makes\" is read plainly: the leading model makers' losses were large compared with their revenue. Losses bigger than revenue clearly meet it."
  - He names no period. The claim describes an ongoing state at the post date, so the period is calendar 2024, the year in progress. Reports before the post projected 2024 losses, and full-year 2024 figures were reported later.
  - '"Has yet to solve the complex problems to justify its costs" is partly a value judgment. It is read here in economic terms: as of 2024, what customers paid for generative AI did not cover what it cost to provide. This clause is not graded as a separate technical claim.'
support_condition: Credible reports or filings show that leading generative AI model makers had 2024 losses large compared with their revenue (for example, losses equal to or above revenue), so revenue did not cover costs.
contradiction_condition: Credible reports or filings show that leading generative AI model makers were profitable in 2024, or had small losses compared with revenue.
measurement_requirements: 2024 revenue against 2024 net or operating loss for OpenAI and Anthropic, from company figures or credible reports of company documents.
source_requirements: Company filings or reputable news reports of company financial documents.
