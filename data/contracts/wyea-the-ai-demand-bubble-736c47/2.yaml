evaluator_interpretation:
  - The figure is his own hedged synthesis ('there appears to be') of analyst estimates that are not public. He gives no period or definition of 'compute demand'.
  - None of the three companies discloses AI revenue split by customer. No public measure exists to test the '<$30B' figure or the 'overestimate' qualifier.
  - Scoring the number as a firm fact would ignore his hedge, so the claim is treated as not adjudicable.
support_condition: Not applicable. A company or credible independent figure for non-lab AI compute revenue across all three companies, below $30B, would support it if one existed.
contradiction_condition: Not applicable. A credible figure for non-lab AI compute revenue clearly above $30B would contradict it if one existed.
measurement_requirements: AI compute revenue at AWS, Google Cloud and Azure, excluding Anthropic and OpenAI, for a stated period. No such disclosure exists.
