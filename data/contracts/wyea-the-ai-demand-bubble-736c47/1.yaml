explicit_source_elements:
  - Outside of OpenAI and Anthropic
  - there appears to be less than $30 billion dollars
  - non-AI lab compute demand across Amazon, Google and Microsoft
  - almost certainly an overestimate
  - includes revenues from Azure Foundry, Amazon Bedrock, and Google Vertex
  - both compute and API spend on Anthropic and OpenAI’s models
evaluator_interpretation:
  - This is a numerical estimate with a checkable threshold despite its hedging.
  - The surrounding article uses annual 2026 analyst estimates, including Microsoft's fiscal 2026. I treat the statement as an observation about the estimated demand represented by those figures at publication, not as a newly specified year-end forecast.
  - "'Compute demand' is read as annual revenue attributable to AI compute and related model-platform usage, rather than total cloud demand, financing, or contractual commitments."
  - The annual figures require reconciliation because the context mixes fiscal and calendar periods. The target is recorded at year precision without inventing a common fiscal boundary.
  - The asserted overestimate requires demonstrating that the calculation actually includes revenue attributable to the two labs' models. Merely offering those models does not establish the amount included.
  - "'Non-AI lab' could exclude all model labs, while 'outside of OpenAI and Anthropic' could exclude only these two. Both readings must be distinguished."
support_condition: An independently reproducible estimate on a consistent annual basis places qualifying demand across the three providers below USD 30 billion and shows that included model-platform revenue overstates demand independent of the two labs.
contradiction_condition: A comparable independently documented estimate places qualifying demand at or above USD 30 billion, or a reconstruction shows that the asserted model-related overcount is absent. Evidence addressing only one component resolves only that component.
measurement_requirements: Provider-level AI compute and model-platform revenues, customer and model attribution, consistent annual periods, gross-versus-net treatment of resale, and a reconciliation avoiding double counting. Annualized run rates cannot substitute for annual revenue estimates.
source_requirements: Original analyst reports with methodology, company disclosures, or independently documented estimates. Repetition of Zitron's figures is not independent confirmation.
