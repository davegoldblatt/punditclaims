explicit_source_elements:
  - Altman lied about the whole thing to the entire world
  - OpenAI explicitly asked the White House office of science and technology (OSTP) to consider Federal loan guarantees
  - government guarantees for OpenAI data centers
evaluator_interpretation:
  - The ordinary meaning of 'lied' is knowingly making a false or materially misleading statement. An apparent inconsistency alone does not establish this.
  - Assess the November 6, 2025 public statement identified in the context. Earlier requests provide context for whether that statement was knowingly false.
  - Compare the beneficiaries and purposes of the guarantees. Support for suppliers, guarantees for OpenAI data centers, and tax credits are distinct, though they may benefit overlapping projects.
  - This is a claim about the truthfulness of a public statement, not a financial measurement; metric_scope is null.
support_condition: Records establish that Altman's public account materially misrepresented OpenAI's pursuit of the relevant guarantees and that he knew this when he made the statement.
contradiction_condition: Reliable records establish that his account accurately represented the relevant requests and discussions, or otherwise establish that the alleged knowing misrepresentation did not occur.
measurement_requirements: Compare the complete public statement with dated requests and discussions, including their intended beneficiaries. Assess evidence of Altman's knowledge at the time.
source_requirements: Prefer the original public statement, OpenAI's submission, government correspondence, and authenticated communications or testimony. Repeated allegations are not independent proof of knowledge.
