condition_status: not_applicable
early_resolution_rule: Resolve only upon documented durable enterprise-funded self-sufficiency that supplies a clear counterexample, or definitive business termination that removes the possibility of rescue for the relevant providers. Fundraising, revenue growth and isolated positive quarters do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - The companies covered by 'these companies' are not enumerated.
  - "'Save' and 'suddenly' have no supplied thresholds."
  - No accounting basis or financial measure is specified.
retrospective_or_prospective: retrospective
