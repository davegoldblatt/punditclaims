assessment_axis: forecast_outcome
explicit_source_elements:
  - '"the enterprise" is suddenly going to save these companies'
  - the enterprise already tried
  - it isn't working
evaluator_interpretation:
  - Read 'save' as making leading stand-alone generative AI providers financially self-sustaining through enterprise sales. OpenAI and Anthropic are relevant examples, not an exhaustive population supplied by Zitron.
  - Financial sustainability requires customer receipts to cover continuing operations, model development and necessary infrastructure over a sustained period. Revenue growth, financing and an isolated positive quarter do not establish this.
  - The explanation beginning 'because' is an asserted reason, not a conditional antecedent.
  - No deadline, financial measure or accounting basis is supplied.
support_condition: A definitive end to the relevant providers' businesses without an enterprise-led rescue could support the forecast. Continuing losses alone cannot establish an unlimited forecast.
contradiction_condition: Comparable disclosures establish that enterprise demand has made a major provider durably financially self-sustaining, providing a material counterexample to the blanket prediction.
measurement_requirements: Separate enterprise receipts from consumer revenue and financing; include recurring operating, training and infrastructure costs. Reconcile accounting earnings with cash flow.
source_requirements: Prefer financial filings and comparable company disclosures with an enterprise breakdown. Press estimates and management forecasts cannot by themselves establish realized sustainability.
metric_scope:
  company: Generative AI companies; individual companies unspecified
  metric: Financial sustainability attributable to enterprise demand
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: null
horizon_interval: null
