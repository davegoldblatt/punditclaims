  - The approximate $12 billion figure is rounded relative to the claimed doubling.
  - Cash spending and supplier revenue may differ in timing and scope.
  - The historical bill includes all AWS services, while the comparison denominator is AI revenue.
  - No numerical tolerance is supplied for 'around 80%'.
