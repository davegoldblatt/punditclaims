assessment_axis: historical_observation
explicit_source_elements:
  - $518.9 million
  - about $6.2 billion in annualized spend
  - at least doubled
  - $12 billion in annualized revenue
  - around 80% of Amazon’s AI revenue
  - fair to assume
evaluator_interpretation:
  - In context, 'will have at least doubled' estimates growth already achieved. It is not a forecast with a future deadline.
  - Use January–March 2026, the period explicitly given for Amazon's comparison revenue run rate and the latest completed quarter before publication.
  - Read $518.9 million as a monthly AWS bill, annualized by multiplying by twelve.
  - The linked baseline reporting defines the bills as cash paid after discounts and credits. That definition informs scope only; Zitron's reporting is not independent outcome evidence.
  - Read $12 billion as an approximate annualized spending level, not an exact equality that overrides 'at least doubled'.
  - The 80% comparison requires Amazon's matching AI revenue run rate and a reconciliation from Anthropic's cash payments to Amazon's recognized revenue.
  - The single metric_scope records Anthropic's annualized AWS spending. Amazon's AI revenue run rate is the separate denominator.
support_condition: Independent matched records verify the baseline monthly AWS bill, show a contemporaneous monthly spending rate at least twice that baseline and approximately $12 billion annualized, and establish that the corresponding Amazon AI revenue contribution was around 80% of its total.
contradiction_condition: Matched records show that spending had not doubled, or that the annualized amount or corresponding AI revenue share was materially inconsistent with the approximate figures.
measurement_requirements: Baseline and current monthly AWS cash bills net of discounts and credits; annualization by twelve; matching AWS AI revenue run rate; reconciliation for payment timing, prepayments, non-AI services and revenue recognition. Future commitments cannot substitute for current spending.
source_requirements: Anthropic or AWS billing records, company disclosures, or independently corroborated reporting covering the same monthly basis and period.
