assessment_axis: historical_observation
explicit_source_elements:
  - The vast, vast majority of AI compute demand
  - services provided to people either for free
  - sold at such a massive discount
  - impossible that anyone on a $20 or $200-a-month plan could even afford
  - actual token cost
evaluator_interpretation:
  - Vast, vast majority means an overwhelming share of compute consumed, not merely a majority of users or accounts. No arbitrary percentage is imposed.
  - In context, the claim concerns compute serving AI applications, principally generative AI; whether training is included remains ambiguous.
  - Use April through June 2026, the latest completed quarter before publication that usage evidence could report on.
  - The affordability assertion concerns equivalent actual usage at unsubsidized cost, not the maximum theoretical subscription allowance.
  - API list prices are not assumed to equal providers' actual token costs.
  - This is an industry usage-share and household-affordability claim, not a stated financial metric for a particular company.
support_condition: Representative compute-weighted data show overwhelming use by free or deeply subsidized services, and usage, cost and financial-capacity data substantiate the subscriber affordability assertion.
contradiction_condition: Representative data show a substantial non-subsidized compute share inconsistent with overwhelming dominance, or documented subscribers can afford their equivalent usage at actual cost.
measurement_requirements: Compute consumption by free, subscription, API and enterprise tiers; comparable model-serving costs; actual subscriber usage distributions; and affordability evidence.
source_requirements: Provider telemetry or representative independent measurement. Account counts, revenue shares, maximum plan allowances and API prices alone are insufficient.
