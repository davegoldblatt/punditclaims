explicit_source_elements:
  - cannot build AI in the real world
  - from Big Data and deep learning alone
evaluator_interpretation:
  - The ordinary reading is that deep learning trained on large datasets is insufficient for dependable performance in intended real-world applications.
  - Mere deployment does not establish dependable performance, and dependable performance does not require perfection.
  - Ordinary preprocessing and decoding do not automatically constitute a new AI approach; a separate substantive reasoning or knowledge mechanism would matter.
  - For the ongoing state, I use February 6–16, 2023, the contemporary launch-and-recall window identified in the post. Earlier research is context.
support_condition: Evidence establishes that contemporary systems relying on data and deep learning could not meet practical reliability requirements for the applications covered by the claim without additional substantive methods.
contradiction_condition: A documented contemporary real-world application achieves adequate reliability for its intended task through deep learning trained on data, without a separate substantive reasoning or knowledge mechanism.
measurement_requirements: Architecture documentation matched to independent deployment evaluations, with stated tasks, operating conditions and acceptable error levels.
source_requirements: Primary architecture records and independently verified real-world results. Usage counts, demonstrations and isolated benchmark scores alone are insufficient.
