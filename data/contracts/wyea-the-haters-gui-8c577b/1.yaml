explicit_source_elements:
  - agents
  - don’t fucking work
  - will never fucking work
evaluator_interpretation:
  - The ordinary reading is that AI agents cannot become practically useful at carrying out their intended multistep tasks.
  - A bounded agent can work without being a universal worker. Human setup and review are compatible with useful autonomous execution of the intervening task.
  - A single selected demonstration is insufficient. Repeated useful results, verified outside the model developer, can contradict the categorical future claim.
  - The present-tense component concerns publication, but the supplied forecast classification makes the categorical never component the main adjudication target.
support_condition: No finite period of failures establishes that agents will never work. Supporting that categorical prediction would require a demonstrated general barrier that rules out useful future agent execution.
contradiction_condition: A deployed agent repeatedly performs useful multistep work, with its results independently verified by the organization using them.
measurement_requirements: Identify the agent's task, tool-driven execution, repeated successful outputs, practical use, and remaining human involvement. Do not equate benchmark scores or mere deployment with success.
source_requirements: Primary workflow documentation plus verification by users or independent evaluators; disclose developer involvement and limits on independence.
