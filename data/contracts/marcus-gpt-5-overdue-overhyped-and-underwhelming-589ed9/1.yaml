evaluator_interpretation:
  - The ordinary reading is that only a small proportion of promises of transformative AI-assisted scientific advances had delivered the promised results by the post date.
  - The surrounding text describes several preceding years without specifying their beginning. The target period therefore has an unspecified start and ends on the post date.
  - Individual successes or failures cannot establish how frequently promises materialized. Promises whose stated deadlines had not arrived must not be counted as failures.
support_condition: A reasonably representative inventory of scientific promises and independently validated outcomes shows that fulfillment was infrequent by the post date, accounting for the promises' deadlines.
contradiction_condition: A reasonably representative inventory shows that fulfillment was common by the post date.
measurement_requirements: Identify the promise population, original commitments, deadlines, delivered outcomes, and a defensible meaning of transformative scientific impact. Report sensitivity to the undefined frequency threshold.
source_requirements: Original records of promises, paired with independent scientific validation. Selected examples alone cannot establish the claimed frequency.
