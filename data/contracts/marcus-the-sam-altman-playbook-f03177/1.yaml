evaluator_interpretation:
  - The ordinary reading is that substantial general problems remained unsolved, not that researchers had made no progress or solved no restricted tasks.
  - The reference to decades concerns the history of general AI reliability and reasoning problems; it does not imply that modern language models existed throughout that history.
  - The observation combines a current assessment with an explicitly historical duration. The target therefore ends on the post date and has no specified starting date.
  - Industry capitalization is background to this technical assessment, not a claim about a particular company's finances.
support_condition: Research and evaluations document substantial unresolved weaknesses across the four named areas, alongside evidence of sustained research and substantial industry investment.
contradiction_condition: Evidence establishes dependable general solutions to the named problems by the post date, or shows that the claimed history of research and substantial investment is materially mistaken.
measurement_requirements: Use evaluations of correctness, factuality, reasoning and executable planning. Distinguish improvements and restricted solutions from general resolution.
source_requirements: Contemporary research and model disclosures, historical research, and independently compiled investment records.
