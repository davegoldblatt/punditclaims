assessment_axis: forecast_outcome
explicit_source_elements:
  - it will pop
  - because there is simply not enough money to do this forever
  - the AI bubble
evaluator_interpretation:
  - The ordinary reading is a broad, substantial reversal in AI investment and valuations caused materially by a shortage of financing.
  - A brief share-price decline or one company's financing failure does not by itself establish that broad event.
  - The speaker gives no deadline. 'Another good quarter or two' explicitly allows continued success and does not set a bursting deadline.
  - The financing-shortage language supplies a proposed cause, not an 'if' condition that must occur before the forecast can be assessed.
  - The demand for a referendum is normative and is not part of the forecast outcome.
support_condition: Dated evidence establishes a broad collapse in AI valuations and investment, with financing shortages materially causing spending cuts, cancellations or failures across major participants.
contradiction_condition: There is no finite non-occurrence test for this undated forecast. Continued growth alone cannot contradict it; an independently decisive event would have to rule out the predicted outcome.
measurement_requirements: Assess market breadth, persistence of valuation declines, realized investment reductions and evidence linking them to financing constraints. Do not invent a numerical crash threshold.
source_requirements: Market measurements, company spending and financing disclosures, and independent reporting on defaults, withdrawn funding and project cancellations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only after a documented, broad AI valuation and investment collapse with financing shortages established as a material cause. An isolated failure, temporary sell-off or warning about future funding is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical definition of 'pop'.
  - No specified market basket or investment measure.
  - The contribution of financing shortages must be distinguished from other causes.
