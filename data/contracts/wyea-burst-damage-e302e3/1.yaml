early_resolution_rule: Before the deadline, completed financing demonstrably sufficient to cover the stated survival requirement and outside all named channels could refute the necessary-source assertion.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'If not $10 billion' is not a clear upper bound."
  - "'Private debt' may include convertible notes."
  - "'Through' may describe arrangers as well as ultimate providers."
  - The named channels may be intended as an exhaustive restriction or as a prediction of principal sources.
  - The minimum survival requirement differs from funds raised for expansion.
