assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI can be bankrolled further
  - needs another $5 billion, if not $10 billion
  - to make it to the end of 2025
  - will have to come through the Kingdom of Saudi Arabia, SoftBank, and private debt
evaluator_interpretation:
  - Read the amount as at least $5 billion of additional financing needed for survival, possibly $10 billion, rather than a firm $10 billion ceiling.
  - The target interval runs from publication through December 31, 2025.
  - The amount is an estimate of a financing requirement, not reported revenue, realized losses or an announced fundraising target.
  - The source language ordinarily suggests restricted financing alternatives. However, 'private debt' may include convertible notes, and 'through' may include financing arranged with co-investors.
  - Actual fundraising does not by itself establish the minimum funding required for survival.
support_condition: Cash and obligation records establish a minimum additional financing requirement of at least $5 billion through 2025, and financing records establish the asserted necessary reliance on the named channels.
contradiction_condition: Comparable cash records establish that less than $5 billion was required, or completed financing sufficient to meet the requirement demonstrably bypasses the named channels, including the reasonable scope of private debt.
measurement_requirements: Opening unrestricted cash, subsequent operating cash flows, unavoidable payments and financing receipts through December 2025; identify instruments, providers and arrangers. Separate undrawn facilities from cash received.
source_requirements: Prefer financial statements, financing agreements and company or investor disclosures. Press estimates must be identified and cannot substitute for a reconciled minimum cash requirement.
