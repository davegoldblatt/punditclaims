assessment_axis: forecast_outcome
explicit_source_elements:
  - Secure, trustworthy AI
  - LLMs will never be that
evaluator_interpretation:
  - In context, secure and trustworthy means dependable operation against adversarial prompting, including jailbreaks, unauthorized actions, and disclosure of protected information.
  - I use practical security for a meaningful intended deployment, rather than requiring perfection against every conceivable threat.
  - A protected LLM-based system can be a candidate counterexample, but a guarantee for one narrow property does not by itself establish overall security and trustworthiness.
  - Never supplies no finite deadline. Continued failures cannot establish the forecast for all future LLMs.
support_condition: A general impossibility result would have to rule out practically secure and trustworthy LLM-based systems across the claim's scope. A finite collection of failed systems cannot establish never.
contradiction_condition: A publicly documented LLM-based system receives credible independent evaluation establishing dependable security and trustworthiness in a meaningful deployment against realistic jailbreak and prompt-injection threats.
measurement_requirements: Assess adaptive attacks, confidentiality, unauthorized actions, output reliability, and retained usefulness under a stated deployment and threat model. A narrow certificate or zero failures on one benchmark is insufficient.
source_requirements: Independent technical evaluations with reproducible methods, supplemented by primary documentation of the system's guarantees and limitations.
metric_scope: null
original_horizon: never
horizon_interval:
  start: 2024-04-02
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted upon a dated public independent evaluation establishing a useful LLM-based system as practically secure and trustworthy under realistic adversarial conditions, with sufficient coverage beyond a single property or benchmark. Limited defense proposals and self-reported success rates do not meet this rule.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Secure and trustworthy has no numerical threshold or specified deployment.
  - The boundary between an underlying LLM and a system containing one is unspecified.
  - Never has no finite deadline.
retrospective_or_prospective: retrospective
