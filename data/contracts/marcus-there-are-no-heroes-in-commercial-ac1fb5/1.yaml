evaluator_interpretation:
  - The plain reading is that Anthropic was an early, prominent developer and promoter of AI that carries out tasks by operating computer interfaces.
  - At the forefront means among the leading participants; it does not assert sole invention, absolute chronological priority, or consistently superior performance.
  - Pushing is assessed through public release, developer availability, demonstrations, and promotion.
  - The retrospective wording describes activity before the March 8, 2026 post. No starting date is supplied, so the target period has an open start.
  - The surrounding anecdotes do not make this sentence a claim that Anthropic caused every cited incident.
support_condition: Dated records establish that Anthropic publicly promoted and made general computer-control capabilities available during the early commercial development of this category, with a release chronology consistent with a leading role.
contradiction_condition: Dated records establish that Anthropic entered only after the category was well established and played no early or prominent role in developing or promoting it.
measurement_requirements: Compare public release and demonstration dates, distinguish general computer-interface control from ordinary chat or narrow tool calls, and distinguish public availability from private testing.
source_requirements: Prefer dated company release announcements. Include earlier competing demonstrations as context against interpreting the claim as absolute priority.
