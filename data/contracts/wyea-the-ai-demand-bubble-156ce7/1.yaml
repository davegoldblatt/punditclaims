assessment_axis: forecast_outcome
explicit_source_elements:
  - At the end of this hype cycle
  - Microsoft, Google and Amazon
  - (and, I guess, Meta)
  - a much-worse condition than before
  - revenue expectations that are overwhelmingly inflated by two unsustainable companies
evaluator_interpretation:
  - The core prediction concerns Microsoft, Alphabet's Google business, and Amazon. Meta is a tentative extension.
  - The ordinary reading of worse condition is materially weaker financial resilience and earning capacity, assessed using cash generation, debt, asset impairments, and sustainable earnings together.
  - Before means before the AI investment cycle, not automatically the publication date. The source supplies no precise baseline date.
  - The two companies are OpenAI and Anthropic. The forecast requires evidence that their unsustainable spending predominantly inflated the relevant revenue expectations.
  - The end of the hype cycle is an event-based horizon without a calendar deadline. A temporary market decline or one weak quarter does not establish that endpoint.
support_condition: After an independently documented unwinding of the AI investment cycle, comparable financial records show material deterioration at the three core companies, alongside evidence that unsustainable OpenAI and Anthropic spending predominantly inflated the relevant revenue expectations.
contradiction_condition: A documented completed cycle and comparable financial records show the core companies did not materially deteriorate, or that the relevant revenue expectations were predominantly supported by sustainable demand. Divergent company results would warrant a partial assessment.
measurement_requirements: Comparable pre-cycle and post-cycle financial statements, asset impairments, cash generation, debt obligations, dated revenue expectations and revisions, and customer concentration data. No single accounting metric or numerical deterioration threshold is supplied.
source_requirements: Company filings and dated investor guidance, supplemented by independently documented customer exposure and analyst forecasts. Statements by Zitron cannot establish the outcome.
