explicit_source_elements:
  - Based on the amount under construction
  - even with OpenAI and Anthropic
  - hundreds of billions of dollars’ worth of demand
  - in the next few years
  - just to monetize
evaluator_interpretation:
  - This states a present economic requirement for the construction pipeline, rather than predicting that the demand will arrive.
  - Assess the facilities under construction on August 11, 2026.
  - Hundreds of billions means at least $200 billion, including demand from the two labs.
  - Monetize ordinarily means obtain revenue from the capacity. It does not by itself specify full investment recovery, profitability or a target return.
  - Do not silently convert the unspecified demand total into annual revenue or assign an exact deadline to the next few years.
support_condition: A reproducible model of the facilities already under construction shows that monetizing that capacity over the stated near-term period requires at least $200 billion of customer spending under clearly specified pricing and utilization assumptions.
contradiction_condition: A comparable model of the same construction cohort shows that its monetization requires materially less than $200 billion under reasonable assumptions.
measurement_requirements: A dated construction inventory, commissioning schedule, AI share, rental prices, utilization and operating assumptions; explicit annual versus cumulative treatment and definition of monetization.
source_requirements: Prefer construction inventories and transparent industry models. Broad capital-spending forecasts cannot substitute for revenue requirements for this particular cohort.
