ambiguity_flags:
  - Tons of controls supplies no numerical or effectiveness threshold.
  - Current AI does not specify a representative set of systems or deployments.
  - The passage quotes a March essay but is presented again in October.
  - The latest partial calendar month is an evaluator-selected reporting window because no reporting period is named.
  - Control could encompass model safeguards, application permissions, human approval, or regulation.
