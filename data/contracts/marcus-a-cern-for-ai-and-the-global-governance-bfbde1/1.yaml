explicit_source_elements:
  - we don’t have tons of controls over current AI
  - people can hook them up to TaskRabbit and real-world software APIs
  - I don’t know when we will get to such machines
evaluator_interpretation:
  - The ordinary reading concerns the adequacy of safeguards against unsafe or unauthorized behavior, rather than a literal count of controls.
  - "Current AI is assessed at the October republication. With no regular reporting cycle, use the latest partial calendar month before the post: October 1–26, 2023."
  - The reference to TaskRabbit and APIs identifies external-action integrations as a particular concern; it does not assert that every deployment has unrestricted access.
  - The statement about not knowing when future machines will arrive is not a forecast being scored.
support_condition: Contemporaneous evaluations establish material shortcomings in safeguards across relevant AI deployments, particularly integrations that can take external actions.
contradiction_condition: Contemporaneous deployment evidence establishes broadly effective safeguards against unsafe or unauthorized actions in the relevant integrations.
measurement_requirements: Distinguish available safeguards from deployed safeguards and measured effectiveness. Model-output vulnerabilities alone do not establish the absence of effective external authorization controls.
source_requirements: Prefer dated integration documentation and independent security evaluations identifying tested systems, safeguards, and test periods.
