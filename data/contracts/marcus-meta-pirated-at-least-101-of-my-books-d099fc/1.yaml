explicit_source_elements:
  - AI systems
  - an established tendency towards regurgitation
evaluator_interpretation:
  - The ordinary reading is a demonstrated, recurring capacity of relevant language models, including Meta models, to reproduce passages from training data.
  - No numerical frequency, minimum passage length, or claim that most ordinary outputs are copied is supplied.
  - "'Established' refers to the accumulated empirical record available before the post, so the target period has an unspecified beginning and ends on the post date."
  - This does not assert that Marcus's particular works were reproduced.
support_condition: Published empirical studies repeatedly recover verbatim training passages from relevant language models, including Meta models.
contradiction_condition: Relevant evaluations establish that the alleged repeated reproduction was an artifact, was not training-data reproduction, or was not demonstrated in the relevant systems.
measurement_requirements: Compare generated continuations with source text; disclose prompting conditions, model versions, and limitations in access to training datasets.
source_requirements: Research papers or documented company evaluations with methods and results, rather than isolated unattributed screenshots.
