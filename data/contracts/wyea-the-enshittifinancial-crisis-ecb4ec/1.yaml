assessment_axis: forecast_outcome
explicit_source_elements:
  - not enough actual demand for AI to meet the data centers being built
  - most data center loans
  - underwater within the next two years
evaluator_interpretation:
  - The two-year deadline is December 29, 2027.
  - The plain financial reading of underwater is outstanding loan principal exceeding the realizable value of its collateral.
  - Most means more than half by loan count. Principal-weighted results should also be reported because the speaker supplied no weighting.
  - The relevant cohort is AI-related data-center loans outstanding or committed at publication, consistent with the surrounding discussion of facilities then being built.
  - Insufficient demand means delivered capacity cannot attract enough paying use to sustain its economics; announced contracts alone do not measure actual use.
  - The demand statement is part of the forecast and its proposed explanation, not an antecedent that must occur before the forecast can be assessed.
  - No accounting or valuation basis is stated. It remains unknown and cannot be silently supplied to produce a supported or contradicted financial verdict.
support_condition: By December 29, 2027, representative matched loan and collateral records establish that more than half of the defined cohort became underwater, accompanied by evidence of insufficient paying demand for the relevant new capacity.
contradiction_condition: Complete or representative evidence through the deadline establishes that no more than half of the cohort became underwater, or that the forecast demand shortfall did not occur. If the two components diverge, assess them separately rather than treating one as proof of the other.
measurement_requirements: A defined loan universe, outstanding principal, collateral rights and comparable contemporaneous valuations; loan-count and principal-weighted results; realized utilization, rental prices and operating costs for the associated capacity.
source_requirements: Loan-level lender, servicer, regulatory or court records and documented appraisals, together with operator and independent demand measurements. Bond prices, credit spreads and isolated defaults are insufficient proxies.
metric_scope:
  company: AI-related data-center borrowers collectively
  metric: Share of data-center loans with outstanding principal exceeding collateral value
  currency: null
  units: percent of loan count
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2025-12-29
  period_end: 2027-12-29
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: within the next two years
horizon_interval:
  start: 2025-12-29
  end: 2027-12-29
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An early event must establish that more than half of a fixed, adequately covered loan cohort has already crossed the collateral-value threshold, alongside the demand shortfall. Individual distressed borrowers, rising yields and absence of widespread distress before the deadline do not settle the forecast. Any financial verdict also requires resolution of the unspecified valuation basis.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Underwater could mean collateral shortfall, impairment, payment distress or below-par trading.
  - Most does not specify loan-count or principal weighting.
  - The loan cohort, geographic scope and treatment of later originations are unspecified.
  - No collateral valuation or accounting basis is supplied.
  - Actual demand has no numerical utilization or pricing threshold.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
