evaluator_interpretation:
  - "This is a historical attribution: the named people publicly raised limitations well before the post. It does not establish that their arguments were correct."
  - Read 'principled limits' as arguments connecting limitations to training, representation, understanding, or reasoning mechanisms, rather than isolated mistakes.
  - Read 'for ages' colloquially as a pre-existing body of criticism, not a specified minimum number of years for every person.
  - The historical period has no stated beginning and ends immediately before publication.
support_condition: Dated publications and independent contemporary reporting document such arguments across the named researchers before November 9, 2024, including substantial history before 2024.
contradiction_condition: Reliable historical records refute the attributions or show that the supposed longstanding arguments only arose contemporaneously with or after the post.
measurement_requirements: Verify authorship, publication dates, and the substance of the arguments. Distinguish warnings about limitations from proofs of permanent impossibility.
source_requirements: Use the other researchers' publications and independent reporting about Marcus and Davis; do not use Marcus's own assertions to validate his account.
