assessment_axis: forecast_outcome
explicit_source_elements:
  - hyperscalers
  - at least $2 trillion in annual AI revenue
  - by 2030
  - or they’ve wasted their capex
evaluator_interpretation:
  - The nearby discussion identifies Google, Amazon, Meta, Microsoft, Oracle and SpaceX as the relevant hyperscalers.
  - The antecedent is failure to reach the stated annual revenue threshold by December 31, 2030.
  - The ordinary financial reading of 'wasted their capex' is failure to recover the investment and its financing costs, not that the assets produce no revenue.
  - The nearby 10% return calculation is context; the quoted claim does not explicitly make 10% its definition of waste.
  - Annual revenue means revenue earned over a year. An annualized monthly or quarterly run rate does not by itself establish that amount.
support_condition: If combined annual AI revenue fails to reach $2 trillion by the deadline, records must also show that the relevant AI capital investment failed to recover its costs. A revenue shortfall alone is insufficient.
contradiction_condition: If the revenue antecedent is met, reliable financial records show that the relevant AI capital investment recovered its costs despite annual AI revenue remaining below $2 trillion.
measurement_requirements: Consistent annual AI revenue definitions across the six companies, identification of the relevant capital investment, and returns measured after operating costs, depreciation or asset recovery, and financing costs. Avoid counting the same cost twice.
source_requirements: Company financial records and independently reproducible investment-return calculations. Forecast models and isolated asset write-downs cannot establish the aggregate outcome.
metric_scope:
  company: Google, Amazon, Meta, Microsoft, Oracle and SpaceX
  metric: Combined annual AI revenue required to recover AI capital investment
  currency: USD
  units: trillions per year
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: by 2030
horizon_interval:
  start: 2026-09-29
  end: 2030-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires an irreversible event fixing both the revenue antecedent and the recovery of the entire relevant investment, such as final liquidation of the whole investment cohort. An analyst model, a temporary revenue shortfall, or one company's write-down is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The exact capital-expenditure cohort is unspecified.
  - "'Wasted' does not specify a return hurdle or investment recovery period."
  - Annual revenue could refer to fiscal-year revenue, calendar-year revenue, or a run rate; these are not interchangeable.
  - AI revenue and the treatment of internal AI benefits are undefined.
retrospective_or_prospective: prospective
