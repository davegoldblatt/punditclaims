evaluator_interpretation:
  - The ordinary reading concerns commercially offered LLM agents performing multistep tasks, including Claude-based agents.
  - Expense means substantial operating costs relative to simpler workflows; reliability means dependable task completion without frequent correction; security concerns include malicious instructions encountered through tools.
  - No universal failure rate, cost threshold or security guarantee is implied.
  - The ongoing state is assessed for February 2026, the latest completed month before the post. This reporting window is an evaluator choice.
  - “Profits from” ordinarily means commercial benefit here. It does not clearly specify revenue, gross profit or net income, so the monetary component has an unknown accounting basis.
support_condition: Representative evidence establishes substantial operating costs, material reliability limitations and persistent security difficulties in the target period, alongside substantiated commercial benefit to Anthropic.
contradiction_condition: Representative evidence refutes one or more asserted characteristics across the relevant agent uses. Isolated successes or inexpensive tasks do not by themselves refute a broad tendency.
measurement_requirements: Task-level costs with comparators, repeated task-success measurements, realistic adversarial security tests and evidence distinguishing commercial sales from accounting profit.
source_requirements: Dated primary evaluations, reproducible research and company disclosures; anecdotes alone are insufficient.
