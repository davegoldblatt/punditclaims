assessment_axis: historical_observation
explicit_source_elements:
  - all of these companies
  - actually have financial problems
  - spending much more money than they’re earnings
evaluator_interpretation:
  - Read 'earnings' colloquially as money earned from business activity, rather than comparing spending with accounting profit.
  - Read 'much more' as a substantial excess, not a marginal difference; do not invent a percentage threshold.
  - The relevant population is companies selling the open-ended agents under discussion. OpenAI is named; including Anthropic is a contextual inference, and the full membership is unspecified.
  - Use April–June 2026, the latest quarter with reported revenue and operating results located for the principal companies before the post. Later financial periods are not substitutes.
  - Marcus cites no company figures, press estimate, or accounting convention. The contract's accounting basis therefore remains unknown.
  - The company population is a scope restriction, not a conditional forecast antecedent.
support_condition: For every company in the intended population, comparable realized spending and earned revenue for the target period show a substantial spending excess on an identified accounting basis.
contradiction_condition: Comparable evidence shows that at least one company in the intended population did not spend substantially more than it earned. This requires resolving the claim's accounting basis first.
measurement_requirements: Match company, period, accounting basis, currency, and realized spending and revenue. Separate cash spending, operating expenses, net losses, noncash valuation changes, and future commitments.
source_requirements: Company filings where available; otherwise credible reporting of identified financial records. Annualized revenue and financing cannot replace realized revenue.
