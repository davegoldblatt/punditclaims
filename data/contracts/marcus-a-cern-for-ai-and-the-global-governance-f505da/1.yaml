explicit_source_elements:
  - no way of guaranteeing
  - large language models won’t be jailbroken
  - saying unethical things
  - a just-published technique
  - current LLMs
  - quickly, and automatically
evaluator_interpretation:
  - The ordinary reading concerns general immunity from jailbreaks in useful, general-purpose LLMs, rather than guarantees limited to a specified attack family.
  - Unethical things means harmful outputs that violate the tested models' safety restrictions.
  - Quickly and automatically means an attack-generation process requiring no human intervention during its iterations and a modest number of queries or minutes. It does not imply success on every attempt or every model.
  - I use October 1 through October 26, 2023, for the current research-state observation and the just-published technique.
support_condition: An October 2023 publication demonstrates automated, relatively fast jailbreaks on multiple current LLMs, while examined defense guarantees do not establish general immunity.
contradiction_condition: The cited technique does not automate successful jailbreak discovery or does not operate quickly, or a contemporary defense establishes general immunity across the relevant jailbreak threat space.
measurement_requirements: Check attack success, automation, query counts, running time, model coverage, and defense assumptions. Separate resistance to one tested attack from immunity to jailbreaks generally.
source_requirements: Original attack and defense papers in versions available by October 26, 2023, including unsuccessful attacks and restricted guarantees.
