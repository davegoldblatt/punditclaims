explicit_source_elements:
  - The money is running out
  - a funding gap of hundreds of billions of dollars in 2027
  - all this cronyism has done is prolong the collapse
evaluator_interpretation:
  - The plain reading is that financing resources available to the AI industry are being depleted relative to its spending and obligations.
  - Use July through September 2026, the latest completed calendar quarter before the post, for the ongoing financial observation.
  - The reference to 2027 is supporting rhetoric about a future funding need, not the target period for the current observation.
  - The exact words say cronyism, not a specified government financing intervention. The asserted causal effect requires separate evidence.
support_condition: Comparable industry-wide data show shrinking available liquidity relative to obligations, after financing inflows, and evidence establishes that the identified interventions merely delayed financial failure.
contradiction_condition: Comparable industry-wide data show financing resources keeping pace with obligations without depletion, or credible causal evidence shows the identified interventions sustainably resolved the alleged shortage.
measurement_requirements: A defined AI-industry population; comparable opening and closing liquidity, financing inflows, cash spending and obligations; and identification of the intervention and its effect.
source_requirements: Company cash-flow and balance-sheet disclosures aggregated on a consistent basis, supplemented by financing databases. Causal attribution needs evidence beyond simultaneous market movements.
