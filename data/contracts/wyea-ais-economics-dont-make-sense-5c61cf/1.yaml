assessment_axis: forecast_outcome
explicit_source_elements:
  - projects like Stargate Abilene
  - incurring billions of dollars of costs up front
  - will take years to turn a profit
  - even if OpenAI makes every single payment in a timely manner
evaluator_interpretation:
  - The plain reading concerns Oracle's Stargate projects, not Oracle's consolidated profitability.
  - I read 'years' as multiple years after commercial operations begin. The speaker supplies neither a calendar deadline nor a precise starting point.
  - I read profit as project earnings after attributable costs. Recovering the original investment is a different measure and must be reported separately.
  - "'Even if' describes a best-case payment scenario rather than an antecedent that must occur before the forecast applies. Losses caused by missed payments would not establish the stronger claim."
  - "'Mortgaging its entire future' expresses the scale of the alleged exposure; it supplies no separate measurable threshold."
support_condition: Project accounts establish that first profitability took multiple years despite timely customer payments, with attributable upfront costs documented.
contradiction_condition: Project accounts establish profitability before two years of commercial operations under timely payments, on a measure that includes the relevant project costs.
measurement_requirements: Project-specific revenue, expenses, depreciation, financing costs, operating commencement dates, and payment records. Separate periodic earnings from cumulative investment payback.
source_requirements: Prefer project accounts, Oracle disclosures, and contractual payment records. Consolidated Oracle results or general cloud margins cannot settle project profitability.
metric_scope:
  company: Oracle
  metric: Stargate project profit after attributable costs
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
