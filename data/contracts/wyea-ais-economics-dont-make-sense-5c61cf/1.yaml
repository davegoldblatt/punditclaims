condition_status: not_applicable
early_resolution_rule: A dated project account establishes the operating start and first profitable period, includes the relevant costs, and documents timely payments. Profit before two years can contradict; first profit after multiple years can support.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Profit could mean periodic earnings or cumulative recovery of upfront investment.
  - The starting point for 'years' is unspecified.
  - The scope could be Abilene alone or Oracle's wider Stargate portfolio.
  - No calendar deadline is stated.
