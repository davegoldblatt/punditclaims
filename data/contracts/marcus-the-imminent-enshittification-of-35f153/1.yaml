assessment_axis: forecast_outcome
explicit_source_elements:
  - once they do make stuff up like that
  - that garbage will circulate
  - from one stochastic parrot to the next
evaluator_interpretation:
  - The ordinary reading is that fabricated information from an LLM will be taken up and repeated as factual by another LLM-based system.
  - The surrounding discussion includes search engines, so circulation through a public webpage into generative search qualifies.
  - I read 'stuff up like that' as fabricated information or advice generally, rather than exclusively the particular poisonous recipe.
  - One verified occurrence establishes the predicted phenomenon. It does not establish that every fabrication circulates, or that circulation is widespread.
  - A conventional search snippet alone does not establish transfer into another LLM; the receiving system must also be generative.
support_condition: After publication, a documented case traces false information generated by one LLM through an identifiable source into another LLM-based system's factual output.
contradiction_condition: A decisive event establishes that the predicted circulation cannot occur under the stated scope. Failed transfers or the absence of examples over a finite period do not contradict an undated forecast.
measurement_requirements: Establish the initial fabrication, its LLM origin, the intervening source, and the receiving generative system's output. Matching errors without evidence of transfer are insufficient.
source_requirements: Prefer original outputs or a firsthand investigation documenting the chain. Distinguish conventional search extraction from generative search and disclose uncertainties in model attribution.
