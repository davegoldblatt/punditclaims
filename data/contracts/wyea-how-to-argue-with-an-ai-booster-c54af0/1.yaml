explicit_source_elements:
  - AI Is Replacing Young Coders! — No it's not
  - salaried positions
  - at scale
  - in the millions
evaluator_interpretation:
  - Assess actual substitution of generative AI for salaried young or junior programmers, including hiring forgone because of substitution.
  - At scale is a scope qualification, not a conditional forecast antecedent.
  - The nearby reference to millions must be preserved, although it is unclear whether that number applies specifically to coders or to worker replacement generally.
  - Use July 2025, the latest completed monthly employment period before publication. Historical comparisons may establish changes leading into that month.
  - Lack of proof of replacement does not establish that replacement was absent.
support_condition: Representative evidence establishes that AI substitution for junior coding positions was absent or below the scale described during the target period.
contradiction_condition: Representative employment and employer-adoption evidence establishes AI substitution for junior coding positions at the described scale during the target period.
measurement_requirements: Measure junior coding positions separately, distinguish gross displacement from net employment changes, and identify AI substitution rather than infer it solely from falling employment.
source_requirements: Employment records linked to AI adoption, credible causal research, or sufficiently comprehensive documented employer substitution.
