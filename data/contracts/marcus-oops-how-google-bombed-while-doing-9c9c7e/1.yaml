explicit_source_elements:
  - both demoed prototypes
  - neither fully ready for public use
  - apparently comparable technology
  - apparently similar bugs
  - within a day of each other
  - one demo was presented as a revolution, the other as a disaster
evaluator_interpretation:
  - The target is the launch-week demonstrations and reception discussed in the February 9 post, covering February 6–9, 2023.
  - "Within a day means demonstrations on adjacent calendar dates: Microsoft's February 7 event and Google's February 8 Paris event. Google's February 6 Bard announcement is distinguished from its Paris presentation."
  - Prototypes and not fully ready mean experimental or preview systems with restricted access and unresolved reliability problems. This does not mean nobody could use them.
  - Apparently comparable technology means language-model-based conversational information tools, without requiring identical models, integrations, capabilities, or accuracy.
  - Apparently similar bugs means factual errors presented as answers, without requiring equal error rates.
  - The reception contrast means prominent contemporary examples of transformative praise for Bing and sharply negative treatment of Google. It does not require unanimous coverage or those exact labels.
support_condition: Records establish adjacent-day demonstrations, experimental or preview status, broadly comparable language-model technology and factual-error problems, together with prominent contemporary examples of the stated reception contrast.
contradiction_condition: Reliable records materially refute the timing, developmental status, broad technological or error similarity, or claimed reception contrast. Differences in implementation alone do not refute apparent comparability.
measurement_requirements: Dated event records, access and testing descriptions, documented factual errors, and identifiable contemporary coverage. No equal-performance threshold or comprehensive media-sentiment measure is implied.
source_requirements: Prefer company records for technology, access and events. Use firsthand reporting for observed errors and the coverage itself for reception. Exclude the speaker's writing as outcome evidence.
