assessment_axis: historical_observation
explicit_source_elements:
  - systems like GPT-3
  - comprehension of the world is scattershot
  - bound to the particulars of what input they are trained on
  - lacking in genuine abstraction
evaluator_interpretation:
  - The scope is contemporary GPT-3-like models, not future language models.
  - Scattershot means materially uneven performance across related tasks and unfamiliar examples.
  - Genuine abstraction is read behaviorally as learning relations or rules that transfer to unfamiliar instances, without requiring human-like consciousness or flawless performance.
  - The ongoing observation is assessed over the latest completed calendar year and 2022 through publication, reflecting the recent research discussed in the post.
support_condition: Controlled evaluations show broad failures to transfer rules or relations beyond familiar training patterns, alongside substantial dependence on particular training examples.
contradiction_condition: Controlled evaluations demonstrate meaningful transfer of learned rules to unfamiliar instances in the relevant models. Such findings would challenge the categorical absence of abstraction even if performance remains uneven.
measurement_requirements: Separate imperfect generalization from absence of abstraction. Control training overlap and task difficulty where possible; distinguish prompting from additional task-specific training.
source_requirements: Primary generalization studies identifying model versions, training conditions and held-out tests.
