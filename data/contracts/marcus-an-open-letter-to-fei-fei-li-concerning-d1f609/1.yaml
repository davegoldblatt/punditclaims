  - already
  - companies committed to voluntarily
  - at the White House and in Seoul
evaluator_interpretation:
  - Read 'much' as substantial overlap across important safety practices, not a numerical majority of statutory clauses.
  - Compare the bill's developer safety obligations with the July 2023 White House and May 2024 Seoul commitments.
  - The claim concerns promises already made, not proof that companies had implemented them.
  - The target period covers those commitments through the post date.
support_condition: The published commitments overlap substantially with the bill in several central areas, such as testing, risk assessment, cybersecurity, mitigation, governance and information sharing.
contradiction_condition: The commitments contain only superficial overlap, with most central developer safety practices absent or expressly excluded.
measurement_requirements: Compare substantive practices and their scope. Separately identify legal enforcement, reporting deadlines and compliance machinery that voluntary promises did not duplicate.
source_requirements: Official commitment documents and contemporaneous legislative records describing the applicable bill.
