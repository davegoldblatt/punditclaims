explicit_source_elements:
  - current AI systems
  - roughly speaking
  - without those grammar rules and trees
  - aren’t really all that close to understanding human language
evaluator_interpretation:
  - The ordinary reading is that contemporary neural language systems remained substantially below reliable human language comprehension across varied situations.
  - The cutting-and-pasting description identifies the systems under discussion; it is not treated as a separate, literal claim about their implementation.
  - Current refers to systems existing on July 20, 2022. With no regular reporting cycle for capabilities, I use current-year evaluations through that date as the observation window.
  - Benchmark performance is evidence about particular abilities, not automatically a measure of distance from general language understanding.
support_condition: Broad, representative evaluations establish substantial and persistent deficits relative to human comprehension across syntax, semantics, and contextual interpretation.
contradiction_condition: Representative systems in the described class demonstrate reliably human-comparable comprehension across those areas and varied unfamiliar situations.
measurement_requirements: Human comparisons, varied tasks, and robustness checks. Neither isolated failures nor a single aggregate benchmark score settles general comprehension.
source_requirements: Primary evaluations of systems existing by July 20, 2022. Later publications must clearly describe those historical systems and capabilities.
