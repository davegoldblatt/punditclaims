assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI is burning money
  - will only burn more money
  - will have to raise money
  - investors that are signing a document
  - we may never make a profit
evaluator_interpretation:
  - I read burning money as net cash consumption, rather than revenue, gross spending, or accounting losses. The surrounding financial figures are press estimates.
  - I use comparable completed annual periods to test the direction of cash burn. The speaker supplies no accounting definition or comparison interval.
  - The forecast has no deadline. The surrounding reference to 2025 does not impose a deadline on this sentence.
  - The funding component requires subsequent financing under agreements containing the stated warning or its substantive equivalent. A historical warning alone does not establish later terms.
support_condition: Comparable annual cash-flow evidence shows increasing cash burn, and executed subsequent financing documents establish continued investor financing with the warning. A finite sequence would support the direction so far but cannot conclusively establish an unlimited forecast.
contradiction_condition: A completed annual period shows lower cash burn on a comparable basis, or definitive subsequent financing documents establish that the asserted warning requirement no longer applies.
measurement_requirements: Compare net cash consumption over equal annual periods using consistent treatment of financing proceeds, computing credits, acquisitions, and non-cash expenses. Do not substitute net losses or spending forecasts.
source_requirements: Financial statements or clearly attributed reporting on financial records, plus executed investor agreements or authoritative disclosures of their terms.
metric_scope:
  company: OpenAI
  metric: net cash burn
  currency: USD
  units: dollars per year
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented decline in completed annual cash burn on a consistent basis, or definitive financing terms removing the asserted warning requirement, can contradict the forecast early. Fundraising and increased burn over a finite interval cannot conclusively support its unlimited wording.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Burning money is used alongside accounting-loss and spending figures without distinguishing them.
  - No comparison interval or deadline is specified.
  - Will only burn more may describe the foreseeable trend rather than every future year.
  - The forecast does not identify which future investor agreements must contain the warning.
retrospective_or_prospective: retrospective
