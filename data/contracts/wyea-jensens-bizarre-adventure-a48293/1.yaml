assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA has inflated its earnings
  - more than $4.8 billion
  - using sales
  - what appears to be a passthrough entity
  - customers in Mainland China
evaluator_interpretation:
  - The ordinary financial meaning of earnings is profit, not revenue or the purchase price of equipment containing NVIDIA components.
  - Inflated is read as earnings increased through the alleged improper sales; an accounting restatement is not required if the incremental earnings can otherwise be established.
  - The surrounding discussion identifies Megaspeed and its associated operation as the apparent intermediary.
  - This is a cumulative historical transaction claim through publication, not a claim about the latest quarter. The speaker supplies no starting date.
  - The accounting basis is estimate because the dollar amount is adopted from outside reporting, without a stated GAAP or non-GAAP earnings measure.
support_condition: Reliable records establish that the identified sales to a Mainland China passthrough increased NVIDIA's earnings by more than $4.8 billion.
contradiction_condition: A sufficiently complete transaction and profit reconciliation establishes that the attributable earnings were no more than $4.8 billion, or that the alleged passthrough sales did not occur.
measurement_requirements: Identify NVIDIA's recognized sales, associated costs and earnings contribution, and trace the intermediary's customers and destinations. Equipment purchases, orders and revenue cannot substitute for earnings.
source_requirements: Transaction-level financial records, independently verified profit estimates, or findings establishing both the intermediary role and attributable NVIDIA earnings.
