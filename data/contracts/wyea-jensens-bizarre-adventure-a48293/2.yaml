assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA has inflated its earnings
  - by more than $4.8 billion
  - using sales
  - what appears to be a passthrough entity
  - customers in Mainland China
evaluator_interpretation:
  - In the section about inflated revenues and orders, 'earnings' ordinarily means revenue here, rather than net profit.
  - "'Inflated' means revenue increased through the alleged channel. It does not independently require fictitious transactions or an accounting restatement."
  - The monetary assertion is firm; the identification of the buyer as a passthrough is qualified.
  - The target is cumulative sales described in the multiyear account through publication. The speaker supplies no exact starting date or fiscal accounting period.
  - The basis is an estimate drawn from the surrounding press and short-seller reports.
support_condition: Reliable transaction evidence or a reconciled estimate establishes more than USD 4.8 billion of NVIDIA revenue from the identified Megaspeed/Speedmatrix channel, with credible evidence that it apparently served Mainland China customers.
contradiction_condition: A sufficiently complete reconciliation establishes that NVIDIA revenue from that channel was USD 4.8 billion or less, or that the attributed revenue did not arise from the described channel. Missing disclosure alone is insufficient.
measurement_requirements: Separate NVIDIA revenue from intermediary purchases, complete server prices, orders and financing. Count realized revenue once and retain the strict 'more than' threshold.
source_requirements: Prefer NVIDIA disclosures and transaction records. Reporting must distinguish purchased equipment value from NVIDIA's revenue and explain the connection to Chinese customers.
