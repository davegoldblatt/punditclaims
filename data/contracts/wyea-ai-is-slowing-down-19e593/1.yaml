explicit_source_elements:
  - At present
  - no other major purchasers of AI compute
  - outside of NVIDIA, hyperscalers
  - OpenAI, and Anthropic
  - outside of Jane Street
evaluator_interpretation:
  - The claim concerns the existence of substantial compute buyers, rather than a precise market-share or spending estimate.
  - Major includes a business acquiring or leasing compute infrastructure at multibillion-dollar scale for its own AI development. Purchasing hardware and leasing compute both count.
  - Hyperscalers means large cloud infrastructure providers. An AI developer does not automatically become an excluded hyperscaler because it operates a large training cluster.
  - Use January–March 2026, the latest completed calendar quarter before publication, for the ongoing market observation.
  - Respect the following sentence's Jane Street exception. Jane Street alone will not establish contradiction.
support_condition: Broad market evidence establishes that all substantial compute buyers in the target period belong to the named groups, allowing the expressly acknowledged Jane Street exception.
contradiction_condition: A documented substantial compute acquisition or lease identifies another AI buyer outside those groups during the target period.
measurement_requirements: Identify the actual compute customer and intended use. Distinguish hardware acquisition or compute leasing from an equity investment, general fundraising, and annual spending.
source_requirements: Prefer disclosures by the buyer, infrastructure provider, financing counterparty, or public authority directly involved.
