assessment_axis: historical_observation
explicit_source_elements:
  - committed to over $40 billion of costs
  - cannot currently afford
  - as much as $24 billion in debt
  - in the next year
  - funding round and the construction of data centers
  - loses money on literally every single customer
evaluator_interpretation:
  - This is a compound claim about commitments, financing capacity, prospective borrowing and customer economics. Evidence for one component does not establish the others.
  - The ordinary reading of 'cannot currently afford' is that SoftBank lacked sufficient available financial resources to meet its own commitments as payments became due. A cash balance below the headline investment amount does not establish this.
  - For current financial resources and customer economics, the reference period is the latest completed quarter before the post, October–December 2024. The target window also includes commitments made through the post date.
  - The borrowing clause concerns March 3, 2025 through March 3, 2026. 'As much as' describes a possible amount, not a promise to borrow exactly $24 billion.
  - The ordinary reading of the customer claim requires losses attributable to every customer. Company-wide losses cannot establish that universal statement.
  - The contract metric records the principal commitment claim. Liquidity, borrowing and customer profitability are separate measures and are identified separately in the evidence.
support_condition: Establish SoftBank's own commitments above $40 billion by the post date, a financing shortfall against their payment schedule, the stated borrowing plans, and negative customer-level economics across all OpenAI customers.
contradiction_condition: "Comparable evidence establishes that a material component is false: commitments did not exceed the threshold, available resources covered scheduled obligations, or at least one customer generated a positive return under a specified and appropriate cost measure. Borrowing less than the possible maximum alone is not a contradiction."
measurement_requirements: Separate SoftBank's own obligations from syndicated investments and project-level financing. Compare payment dates with accessible resources. Distinguish loan facilities from drawdowns and refinancing from incremental debt. Customer economics require a stated treatment of inference, training and shared costs.
source_requirements: Prefer dated agreements, SoftBank financial disclosures and OpenAI customer-level financial records. Attribute press estimates explicitly.
