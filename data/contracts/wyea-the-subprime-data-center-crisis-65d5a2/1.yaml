  - Right now
  - appears to be roughly $100 billion or so in annual compute spend
  - OpenAI representing around $50 billion
  - per their statements in the Musk trial
  - Anthropic likely spending similar amounts
evaluator_interpretation:
  - Treat this as a checkable estimate despite its expressed uncertainty.
  - The plain reading is current annualized AI compute spending, with OpenAI and Anthropic each contributing approximately half of a global $100 billion total.
  - Use April through June 2026, the latest completed calendar quarter before the post, to assess the current spending level.
  - A projected calendar-year budget, quarterly accounting expense and current annualized cash spending are distinct measures.
support_condition: Comparable spending evidence establishes approximately $100 billion globally at the current annual rate, including approximately $50 billion each for OpenAI and Anthropic.
contradiction_condition: Comparable evidence for the same period and spending definition establishes materially different global or company amounts.
measurement_requirements: Separate current annualized spending from full-year plans, realized expenses, capital investment and multiyear commitments. Define compute coverage and remove double counting between purchasers and providers.
source_requirements: Prefer trial testimony, company financial disclosures and a transparent industry spending reconciliation. News reporting may establish testimony where a primary transcript cannot be retrieved.
