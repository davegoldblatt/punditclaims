  - in the last three years
  - $28 billion of that coming in the last month
  - another $50 billion from Google and Amazon
  - if certain performance obligations are met
evaluator_interpretation:
  - Read the 70% statement as a capacity-weighted share of the three companies' combined operational compute. The wording does not limit the denominator to AI revenue, backlog, or newly added GPUs.
  - For the ongoing compute observation, use January–March 2026, the latest reportable quarter before publication.
  - Read 'already fed' as funding actually provided, rather than the maximum value of announced future commitments.
  - Read the three-year funding window as May 19, 2023 through May 19, 2026, and the last-month window as April 19 through May 19, 2026.
  - The conditional $50 billion is an observation about outstanding commitments, not a forecast that the conditions will be met.
  - The target_period covers the explicit cumulative funding window; evidence about compute must additionally match the latest-quarter interpretation.
  - The metric_scope describes the aggregate funding component. Compute allocation is a separate physical measure.
support_condition: Matching allocation records show at least 70% of the specified compute dedicated to the two labs, and transaction records reconcile $54 billion actually provided in the three-year window, including $28 billion in the final month, plus $50 billion of separately conditional commitments.
contradiction_condition: Comparable records establish a compute share below 70%, or a complete funding ledger contradicts a stated total or timing window, or the stated conditional commitments are materially misstated.
measurement_requirements: Define a consistent compute-capacity unit and denominator. For funding, separate paid investment from commitments, valuations, commercial purchases, and investment announced outside the window.
source_requirements: Dated company allocation disclosures or independent capacity estimates with matching coverage; company transaction records, supplemented by reputable direct reporting when primary disclosures are unavailable.
