assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft, Amazon, Google and Meta
  - all have other products that are making them money
  - AI is not doing it
  - every single stock you see 'growing because of AI' ... is actually growing because of something else
evaluator_interpretation:
  - "Plain reading: at the time of the post, AI products were not a real source of revenue or profit for these four companies. Their money came from other products."
  - The first half (they have other money-making products) is uncontroversial. The test is the second half, 'AI is not doing it'.
  - "He describes an ongoing state and names no period. So we use the most recent quarter the companies had reported before the post: calendar Q3 2025 (July to September 2025), reported in late October 2025."
  - Because 'AI is not doing it' covers all four together, clear company-reported evidence that AI was a key driver of revenue and margin at even one of them in that quarter contradicts it. Claims that AI drives earnings are company-reported. The firms do not report AI profit as a separate line.
support_condition: Company disclosures for Q3 2025 show AI products produced no meaningful revenue or profit at these companies, with growth coming from non-AI products.
contradiction_condition: Company disclosures for Q3 2025 show AI products producing meaningful, growing revenue, or named as a key driver of revenue or margin growth, at one or more of the four companies.
measurement_requirements: Company-reported revenue, growth drivers, or margin statements about AI products for the quarter ended 2025-09-30.
source_requirements: Earnings releases, earnings call remarks, or filings from Microsoft, Amazon, Alphabet or Meta; reputable news reports of those disclosures.
