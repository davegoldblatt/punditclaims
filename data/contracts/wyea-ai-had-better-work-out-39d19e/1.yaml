assessment_axis: causal_assessment
explicit_source_elements:
  - This has led to
  - single-highest inflow of foreign investments into US equities in history
  - larger than the Dot-Com Bubble
  - the leadup to the Great Financial Crisis
  - "2021"
  - per Apollo
evaluator_interpretation:
  - The ordinary reading is a record flow into US equities, materially driven by foreign demand for AI exposure.
  - Treat inflow as foreign net purchases, rather than the market value of foreign holdings or total flows into all US assets.
  - Compare nominal US-dollar flows over identical measurement windows and with consistent coverage.
  - The claimed record must have occurred by publication. The beginning and aggregation window cannot be recovered from the words alone, so no monthly or trailing-year window is silently imposed.
  - The claim includes causation; establishing a record flow alone would not establish the whole proposition.
support_condition: A consistent historical equity-flow series establishes a record by October 20, 2026, exceeding the named episodes, and credible allocation or investor evidence shows that demand for AI exposure materially drove it.
contradiction_condition: The same flow series and aggregation window show a larger earlier inflow, or credible causal evidence rules out a material AI contribution. A record in holdings rather than flows does not satisfy the claim.
measurement_requirements: Identify Apollo's exact series, endpoint, aggregation window, private and official investor coverage, and historical comparability. Test the record using the complete comparable series and assess the AI attribution separately.
source_requirements: Apollo's underlying chart and methodology, Treasury TIC data available by the evaluation date, and independently verifiable evidence of investor allocation or motivation.
