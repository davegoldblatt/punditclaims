condition_status: not_applicable
early_resolution_rule: A decisive contrary event, such as permanent termination of free service with the financial burden ended, could settle the continuing-burden component. Complete 2026 subscriber records can settle the dated churn component, but interim observations cannot settle the entire compound forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Massive has no numerical threshold.
  - Remain has no stated duration.
  - Only the churn component explicitly names 2026.
  - Churn cohort, denominator and treatment of tier migration are unspecified.
  - Paid subscriber totals may not use the weekly-active-user denominator.
