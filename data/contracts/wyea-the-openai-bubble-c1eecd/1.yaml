assessment_axis: forecast_outcome
explicit_source_elements:
  - 900 million weekly active users
  - will remain a massive drain on the company’s finances
  - only 5% or so of them opting to pay
  - a projected 80%
  - $20-a-month users
  - expected to churn in 2026
evaluator_interpretation:
  - In context, the financial burden concerns serving free ChatGPT users, rather than treating every weekly user as free.
  - Massive drain means a material net financial burden after attributable revenue. The speaker supplies no numerical materiality threshold.
  - The 900 million users and approximately 5% paying describe the starting position; they are not promises that the user count will remain fixed.
  - The explicit 2026 deadline applies to churn. The broader statement that users will remain a drain has no stated end date.
  - Churn ordinarily means subscribers leaving the $20 plan. Net decline in subscriber count, migration to another paid plan and cohort cancellation rates must be distinguished.
  - The cited advertising forecasts are reasons for the prediction, not an explicit conditional antecedent.
  - The financial burden is an estimate inferred from the surrounding press and analyst projections.
support_condition: Comparable subscriber records substantiate the approximate starting paid share and roughly 80% churn from the $20 plan during 2026, while attributable financial records establish a continuing material net burden from free users.
contradiction_condition: Comparable records materially contradict a substantive component, such as complete 2026 cohort records showing churn far below 80%, or financial records showing free users do not impose the claimed continuing material net burden.
measurement_requirements: Use a consistent weekly-active-user denominator, identify which paid subscribers belong to it, define the churn cohort and treatment of plan changes, and measure attributable free-service costs and revenue.
source_requirements: Subscriber cohort records and attributable financial disclosures, or independent measurements with matching populations and periods. Projections are not realized outcomes.
metric_scope:
  company: OpenAI
  metric: Net financial burden of serving free ChatGPT users
  currency: USD
  units: dollars
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-07-15
  period_end: null
