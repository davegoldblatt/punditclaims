evaluator_interpretation:
  - The sentence is hedged, but the surrounding passage explicitly alleges intentional market manipulation. Its factual allegation is therefore assessable.
  - The ordinary reading is intentional, materially misleading investor communication, not a claim that a court has already found a particular securities-law violation.
  - The alleged internal concern and public guidance concern August 2026. Repeated conduct is assessed over the year preceding publication.
  - The September 2025 announcement offered as an earlier example falls outside a literal trailing year and is context only.
  - This assesses alleged conduct, not the accuracy of a particular revenue or investment amount.
support_condition: Reliable records establish that NVIDIA knowingly conveyed materially misleading supply or sales expectations to investors in August 2026, and establish at least one earlier comparable episode within the stated year.
contradiction_condition: Reliable records establish that the alleged internal and public statements were materially consistent and honestly represented, or disprove the asserted earlier comparable conduct within the stated year.
measurement_requirements: Compare the same products, periods, assumptions, and information available when statements were made. Distinguish a risk or conditional intention from a known contradiction, and allegations from findings.
source_requirements: Contemporaneous internal records, complete investor statements and disclosures, or reliable investigative or adjudicative findings addressing knowledge and misleadingness.
