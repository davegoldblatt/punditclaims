assessment_axis: causal_assessment
explicit_source_elements:
  - DeepSeek launched a price war
  - forced Altman
  - cut prices dramatically
evaluator_interpretation:
  - Altman refers to OpenAI's pricing decisions.
  - The plain reading concerns substantial reductions in model API prices before the post.
  - Forced means DeepSeek's competition materially caused the reductions; it need not have been the sole cause.
  - A price reduction following a competitor's release is insufficient by itself to establish causation.
  - The source specifies no currency, price schedule, accounting basis or exact comparison period.
support_condition: Dated pricing records establish substantial OpenAI reductions, and credible statements, documents or reporting connect those decisions materially to DeepSeek's competition.
contradiction_condition: Relevant records show no substantial reduction, or direct evidence establishes that the identified reductions were decided independently of DeepSeek and were not materially changed by its competition.
measurement_requirements: Compare equivalent API products and billing units. Separate reductions for an existing model from cheaper replacement models, discounts and changes in token usage.
source_requirements: Prefer dated vendor pricing announcements and direct evidence about pricing decisions. General competitive commentary is insufficient to establish compulsion.
