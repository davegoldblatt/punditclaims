explicit_source_elements:
  - it has no path to profitability
  - it’s not even anything new
  - It’s a search engine
evaluator_interpretation:
  - Perplexity is the subject.
  - The ordinary financial reading is that its business lacked a commercially viable route to company-wide profit when the post was published.
  - This is assessed as an observation about viability at that time, not an unlimited prediction that the company could never become profitable.
  - For the ongoing financial state, use April–June 2025, the latest completed calendar quarter before publication. The surrounding 2024 figures are historical context.
  - Profitability means revenue covering the company's full expenses, not merely a positive gross margin.
  - Nothing new supplies no objective novelty threshold and receives no separate binary grade.
support_condition: Reliable unit economics and realistic operating scenarios show that the business then lacked a workable route to covering its full expenses.
contradiction_condition: Matched-period financial results establish company-wide profit, or a credible, costed plan demonstrates a viable route from the business then operating to company-wide profit.
measurement_requirements: Separate paid and free-user serving costs, customer acquisition, retention, research, administration and other expenses. Revenue growth and product launches alone cannot establish profitability.
source_requirements: Prefer financial statements, documented unit economics and costed management plans. Later disclosures may establish earlier facts, but later business changes cannot automatically refute the historical observation.
