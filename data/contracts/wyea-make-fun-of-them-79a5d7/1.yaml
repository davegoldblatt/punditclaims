assessment_axis: forecast_outcome
explicit_source_elements:
  - if it’s not fed
  - $20 billion to $40 billion a year
  - it will die
evaluator_interpretation:
  - OpenAI is the company identified by the surrounding paragraph.
  - Read 'fed' as receiving outside financing and 'die' as ceasing operations because it cannot finance them.
  - Use less than $20 billion, the bottom of the stated range, as the unambiguous funding shortfall.
  - Test completed twelve-month periods beginning on or after publication. The speaker did not specify calendar years or a delay between a funding shortfall and failure.
  - Continued operation while receiving substantial financing does not test this conditional claim.
support_condition: A documented financing shortfall below $20 billion over a completed twelve-month period is followed by OpenAI ceasing operations because it cannot finance them.
contradiction_condition: After the financing shortfall occurs, reliable operating and financial records establish that OpenAI has become sustainably viable without the stated annual financing.
measurement_requirements: Measure financing actually received, including any documented financing in kind. Exclude undrawn commitments, secondary share sales, revenue and valuations. Distinguish temporary survival on reserves from sustainable viability.
source_requirements: Company or investor funding disclosures and reliable operating records; insolvency or court records if failure occurs.
metric_scope:
  company: OpenAI
  metric: Outside financing received per year
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_met
early_resolution_rule: Require a documented funding shortfall and either financing-related cessation of operations or demonstrated sustainable independence from the stated financing. Survival for an arbitrarily chosen interval is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Financing instruments and accounting basis are unspecified.
  - Calendar years versus rolling twelve-month periods are unspecified.
  - The required amount is a range.
  - No deadline or failure lag is supplied.
  - "'Die' does not specify bankruptcy, liquidation or cessation of operations."
retrospective_or_prospective: retrospective
