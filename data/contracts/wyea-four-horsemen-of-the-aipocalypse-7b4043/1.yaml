explicit_source_elements:
  - everybody else
  - making single or double-digit millions of dollars
  - losing hundreds of millions of dollars
  - to get there
evaluator_interpretation:
  - The surrounding paragraph makes OpenAI, Cursor and Anthropic the exceptions. Read everybody else as other AI startups, rather than established technology conglomerates.
  - The ordinary literal reading is a universal statement, so one comparable counterexample would defeat it.
  - Use calendar 2025, the latest completed annual reporting period before the post, because the surrounding discussion concerns annual industry revenue. The sentence itself supplies no period.
  - Read single- or double-digit millions as at least $1 million and below $100 million in realized annual revenue, and hundreds of millions as at least $200 million and below $1 billion in annual losses.
  - The statement gives no accounting basis or definition of losses. Nearby references to reported revenues do not establish a common accounting basis for this universal claim.
support_condition: Comparable records show that every startup in the stated population had annual revenue and losses within the asserted ranges.
contradiction_condition: A verified startup within the population had revenue or losses outside the asserted ranges on the same period and accounting basis. Under the supplied rules, a decisive grade also requires resolving the claim's unknown accounting basis.
measurement_requirements: Realized revenue and a defined loss measure for the same annual period. Do not substitute ARR, financing, gross margin or operating profit for those measures.
source_requirements: Prefer financial statements or company disclosures with explicit periods and accounting definitions. Clearly identify press estimates.
