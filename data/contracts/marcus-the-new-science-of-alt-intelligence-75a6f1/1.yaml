explicit_source_elements:
  - DALL-E 2, GPT-3, Flamingo, and Gato
  - nobody who has looked at them carefully
  - would confuse them for human intelligence
evaluator_interpretation:
  - The ordinary contextual reading concerns broad, flexible human intelligence, rather than human-level performance on a particular task.
  - The statement also asserts agreement among careful observers; demonstrations of errors do not independently establish that agreement.
  - I use April 1 through May 14, 2022, as the latest public evaluation cycle surrounding the systems discussed. This is an ongoing observation, not a claim about subsequent versions.
  - Mind-blowing is an expression of admiration and is not separately scored.
support_condition: Careful contemporaneous evaluations covering all four systems establish a clear distinction from broad human intelligence and substantiate the asserted agreement among informed observers.
contradiction_condition: A documented careful contemporary evaluator regards a named system as exhibiting broadly equivalent human intelligence, or a suitable evaluation establishes such equivalence.
measurement_requirements: Distinguish general capability from narrow task performance, and distinguish capability evidence from evidence about observers' judgments.
source_requirements: Original evaluations and documented judgments independent of Marcus, tied to the versions available before the post.
