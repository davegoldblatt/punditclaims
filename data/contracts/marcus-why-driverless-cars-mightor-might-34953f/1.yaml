explicit_source_elements:
  - Tesla doesn’t even build driverless cars
  - to my knowledge
  - not ... testing anything without a human in the loop
evaluator_interpretation:
  - Driverless means driving without a human responsible for supervising and taking over the driving task.
  - The knowledge qualification makes this a claim about publicly established capabilities and testing, not undisclosed research.
  - The observation concerns October 2023 through publication. I use October 1–27 as the current reporting window because this describes an ongoing operational state rather than a quarterly financial result.
  - The production and testing statements both need support. Evidence about customer software alone cannot establish the scope of all Tesla testing.
support_condition: Contemporaneous disclosures establish that Tesla's available vehicles required human supervision, and sufficiently comprehensive testing records establish that its publicly documented testing also retained human supervision.
contradiction_condition: A dated, credible record establishes that Tesla built an operationally driverless vehicle or tested one without a supervising human during the target period.
measurement_requirements: Distinguish driver assistance, supervised testing, and operation without a supervising driver. Hands-free operation alone does not qualify as driverless.
source_requirements: Dated Tesla disclosures, regulatory testing records, or reputable reporting describing those records. Current product pages cannot establish October 2023 capabilities.
