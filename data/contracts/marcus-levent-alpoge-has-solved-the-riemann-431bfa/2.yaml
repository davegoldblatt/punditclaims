explicit_source_elements:
  - It doesn’t even mean the result is that useful or technically innovative
  - it is 250,000 pages
  - hardly elegant
  - no general lessons about how to do math have yet been drawn
  - nor (so far as I have heard) have any new techniques or concepts yet been introduced
evaluator_interpretation:
  - Assess the result announced on the Friday before the post, through publication on November 22. This is an observation about that announcement and its immediate reception.
  - Read 250,000 pages as an approximate factual description of the proof's length. Distinguish the formal proof from an informal rendering; do not manufacture a contradiction from rounding alone.
  - Read general lessons as articulated, reusable lessons about mathematical practice. A proof outline or a suggestion of possible applications does not automatically establish such lessons.
  - Preserve the explicit awareness qualification on new techniques or concepts. Public identification of novelty alone cannot contradict what Marcus had heard. Contradiction of that clause requires evidence that he had actually encountered the relevant information before posting.
  - The statements about elegance and how useful or innovative the result is are evaluative. They receive no separate factual verdict.
  - An established error in an unqualified factual component can justify a contradicted outcome, but the rationale must identify that component and leave other components ungraded where necessary.
support_condition: Reliable documentation establishes a proof or informal rendering approximately 250,000 pages long, and contemporaneous evidence substantiates the absence of articulated general lessons. Supporting the awareness-qualified clause additionally requires evidence about Marcus's information at publication; silence in search results is insufficient.
contradiction_condition: Reliable evidence establishes that the literal page-count description is wrong, or identifies an articulated general lesson already drawn by publication. The techniques-and-concepts clause can be contradicted only with evidence that Marcus had heard of relevant novelty before posting. Public availability by itself does not meet that test.
measurement_requirements: Identify which artifact the page count describes and distinguish counted pages from estimates, jokes, code lines and shorter explanatory documents. Date any general lesson and any evidence of Marcus's awareness to no later than publication.
source_requirements: Prefer the proof author's documentation, released artifacts and mathematical analyses. Later evidence available by November 23 may clarify facts about the original announcement, but later discoveries cannot retroactively contradict 'yet'.
