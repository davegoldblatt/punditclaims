explicit_source_elements:
  - proper world models
  - simply “emerge”
  - but they don’t
  - reliably maintains and uses a full model
  - explicit, dynamic, updatable models
evaluator_interpretation:
  - The plain reading concerns coherent internal representations that track a domain and reliably guide predictions as its state changes. Merely recalling facts or decoding a feature is insufficient; perfect performance is not required.
  - Emergence means that the representation develops through training without an explicitly programmed world model. Training a model on domain-specific text does not automatically disqualify it.
  - The observation concerns what had emerged by publication. Earlier demonstrations remain relevant; there is no June-only restriction or source-specified starting date.
  - The acknowledged Othello result alone cannot refute the claim. Specialized models beyond Othello are relevant, but their applicability to general-purpose LLMs must be stated.
support_condition: Representative studies of relevant models find that apparently learned representations fail to remain coherent, update correctly, or guide predictions reliably across the tested domains. Limited failures alone cannot establish a categorical absence.
contradiction_condition: A reproducible demonstration beyond the acknowledged Othello example shows a learned internal representation that coherently tracks changing states and reliably guides predictions, without an explicitly engineered world model.
measurement_requirements: Identify model, training procedure, represented state, update tests, causal interventions and generalization tests. Distinguish probe accuracy from reliable use of a complete domain model.
source_requirements: Primary representation studies and reproducible evaluations available by 2026-10-28, concerning models and capabilities existing by publication.
