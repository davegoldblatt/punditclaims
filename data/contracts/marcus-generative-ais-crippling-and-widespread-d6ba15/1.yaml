evaluator_interpretation:
  - This is a claim about the state of LLMs at publication, not a prediction that emergence is forever impossible.
  - In context, proper means a coherent internal representation that tracks a domain and can be updated and used. A probe decoding some information is insufficient by itself.
  - An identifiable distributed representation can qualify; I do not require a hand-written symbolic database or perfect performance.
  - Because no observation period is named, I use June 2025 through publication as the latest monthly observation window. Earlier experiments are background evidence rather than direct measurements in that window.
support_condition: Representative tests of relevant models show that apparent representations fail coherent state tracking, updating, and causal-use tests across the domains covered by the claim.
contradiction_condition: A relevant model develops, through ordinary predictive training without an explicitly supplied world-model mechanism, a coherent and updatable internal representation that demonstrably guides behavior in a nontrivial domain.
measurement_requirements: State-tracking and updating tests, held-out situations, controls for information learned by probes, and interventions establishing that the model uses the representation.
source_requirements: Primary representation and behavioral studies with identifiable models, training procedures, test periods, and robustness limits.
