  - CoreWeave will still burn
  - $15 billion
  - in 2025
evaluator_interpretation:
  - The deal means the original March 2025 OpenAI agreement.
  - The antecedent requires its material delivery and payment assumptions relevant to 2025 to have proceeded as planned; merely signing or expanding a contract is insufficient.
  - The ordinary cash-burn reading is cash capital expenditure minus operating cash flow, before financing.
  - Treat $15 billion as rounded to the nearest billion, giving a comparison interval of $14.5 billion to less than $15.5 billion.
  - Use calendar 2025. Net loss and infrastructure placed in service are separate measures.
support_condition: The antecedent is established and comparable 2025 net cash burn falls between $14.5 billion and less than $15.5 billion.
contradiction_condition: The antecedent is established and comparable 2025 net cash burn falls outside that interval.
measurement_requirements: Use cash purchases of property and equipment, including capitalized software, less operating cash flow. Exclude borrowing and equity proceeds; distinguish cash capex from accrued or placed-in-service capex.
source_requirements: Annual cash-flow statements plus evidence of the original OpenAI agreement's material 2025 performance and schedule.
