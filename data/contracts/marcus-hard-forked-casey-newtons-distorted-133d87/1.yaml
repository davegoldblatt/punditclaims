explicit_source_elements:
  - LLMs
  - do not deliver remotely
  - what was initially promised of them
evaluator_interpretation:
  - The plain reading is that LLM capabilities substantially fall short of early public promises, not that LLMs have no useful applications.
  - A fair comparison requires identifiable promises about capabilities that were supposed to be available by December 6, 2024. Undated aspirations and forecasts with later deadlines cannot count as broken promises.
  - Because this is an ongoing technology claim without a reporting cycle, use the current calendar year through publication as the observation window. Earlier statements establish the promised baseline and are context.
  - Marcus does not identify which promises represent the baseline or how to measure the overall shortfall. Selecting these could determine the verdict.
support_condition: A representative set of identifiable early commitments, due by publication, remains substantially unmet in comparable evaluations of the promised capabilities.
contradiction_condition: Comparable evaluations show that LLMs substantially deliver the representative early commitments due by publication.
measurement_requirements: Match promises to the capabilities, systems, conditions and deadlines they describe. Neither isolated failures nor isolated successes settle the broad comparison.
source_requirements: Original public statements establishing the promises, together with dated capability evaluations available by publication.
