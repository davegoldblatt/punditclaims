explicit_source_elements:
  - LLM’s in particular
  - do not deliver remotely
  - what was initially promised of them
evaluator_interpretation:
  - The sentence describes a substantial gap between initial promises and LLM capabilities at the time of the December 6, 2024 post.
  - Marcus does not identify the promises, who made them, what counts as initial, or how to assess delivery across different capabilities.
  - The surrounding acknowledgment of writing and coding uses rules out treating this as a claim that LLMs deliver nothing useful.
  - Selecting a representative set of promises and deciding their relative importance would supply substantive criteria that Marcus did not give. No such selection is imposed.
support_condition: A support test would require an identifiable promised baseline and an ordinary standard for a substantial overall shortfall by the post date. The passage does not establish either sufficiently to score the claim.
contradiction_condition: A contradiction test would require the same baseline and evidence that LLMs substantially delivered it by the post date. Demonstrating selected useful capabilities would not by itself contradict this claim.
measurement_requirements: Identify the relevant initial promises, their intended delivery dates, and a defensible way to compare their fulfillment without selecting or weighting them to determine the verdict.
source_requirements: Original dated statements of the relevant promises and documented performance available by the post date. Marcus's own writing can establish his meaning, but cannot establish that the claim is true.
