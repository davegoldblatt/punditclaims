assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI
  - has made commitments so significant
  - now represent
  - at least 20% of hyperscaler cloud revenues
  - in the coming years
  - if not more like 30% to 40%
evaluator_interpretation:
  - The claim is about OpenAI's commitments as they stood at the post date (2026-08-18), measured against hyperscalers' cloud revenue in future years.
  - "The best measure observable at the post date is contracted future revenue: OpenAI's cloud commitments as a share of the major sellers' reported backlog (remaining performance obligations). The sellers are Microsoft, Oracle, Amazon, and Alphabet."
  - The firm threshold is 20%. The 30-40% range is hedged ('if not more like') and is not required.
  - "Target period: the latest backlog reports before the post (Oracle's quarter ending May 2026; the others' June 2026 quarters) through the post date."
support_condition: OpenAI's commitments with the major cloud sellers equal at least 20% of their combined reported backlog as of mid-2026.
contradiction_condition: OpenAI's commitments are clearly under 20% of the combined backlog, or of a reasonable estimate of those sellers' cloud revenue over the coming years.
measurement_requirements: Sum OpenAI's disclosed or reported commitments to Microsoft, Amazon, Oracle (and Google if known), then divide by the combined reported backlog of those sellers at the latest quarter before the post.
source_requirements: Company filings or earnings calls, or reputable reports and analyses of them.
metric_scope:
  company: OpenAI (vs Microsoft, Oracle, Amazon, Alphabet)
  metric: OpenAI cloud compute commitments as a share of hyperscaler contracted future cloud revenue (backlog)
  currency: USD
  units: percent
