evaluator_interpretation:
  - Assess the specified commitments-to-cloud-revenue proposition, not the separate description of profitability.
  - The ordinary reading compares OpenAI's scheduled purchases from hyperscalers with those same providers' projected cloud revenues over matching future periods.
  - At least 20% is the firm threshold; 30–40% is a tentative higher estimate.
  - For this ongoing financial observation without a reporting period, use the latest completed publicly reportable calendar quarter before the post, April–June 2026, as the observation reference period. The future years covered by the ratio remain unspecified.
  - The surrounding context identifies Amazon, Microsoft, Google and Oracle as relevant hyperscalers, but does not establish an exhaustive denominator.
  - The supplied claim does not identify an accounting basis or attribute the ratio to company figures or a named estimate. Record the basis as unknown.
support_condition: A complete, consistently scoped schedule and contemporaneous revenue forecast establish that OpenAI commitments represent at least 20% of aggregate hyperscaler cloud revenue over the same future period.
contradiction_condition: Complete matching commitments and projected cloud revenues establish a share below 20% over the relevant future period.
measurement_requirements: Match providers, currencies, future years, accounting treatment and service scope. Avoid double counting overlapping agreements. Do not divide multiyear commitments by one year's revenue or substitute backlog, capital spending or total corporate revenue for cloud revenue.
source_requirements: Contract disclosures or credible documented commitment estimates, together with contemporaneous provider-level cloud revenue forecasts. The claim's accounting basis and future period must be established before a decisive score.
