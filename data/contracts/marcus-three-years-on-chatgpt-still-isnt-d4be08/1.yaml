assessment_axis: causal_assessment
explicit_source_elements:
  - because of the discrepancy between reliability and the immense costs
  - inherent inefficiency
  - dependent on absorbing internet-scale data
  - thus far failed to make profits
  - companies like OpenAI
evaluator_interpretation:
  - Assess the stated causal explanation, not merely whether a loss was reported.
  - The ordinary financial reading is company-wide net profitability at OpenAI. ChatGPT-specific profitability, operating income and cash flow are separate measures.
  - Use January–June 2025, the latest directly reported OpenAI financial reporting window located in evidence available before the post. Microsoft’s later investment results are a different company's metric.
  - The claim requires reliability constraints and the stated training-cost mechanism to contribute materially to the lack of profits; they need not be the only causes.
  - The source identifies no accounting basis or financial source. Preserve accounting_basis as unknown rather than infer it from evidence found later.
  - OpenAI is the named example. No defined set of comparable companies is supplied.
support_condition: Matching financial evidence establishes a lack of company-wide net profit, and credible financial or deployment evidence shows that reliability constraints and costs arising from the stated data-intensive training mechanism materially contributed to that result.
contradiction_condition: Matching financial evidence establishes company-wide net profitability, or credible causal evidence rules out a material role for the stated explanation.
measurement_requirements: Distinguish net income, operating income, cash burn, product contribution margins and investor accounting losses. Identify the accounting basis and separate training, serving, expansion and other costs.
source_requirements: Prefer OpenAI financial statements and documented cost or deployment analyses. News reports may supply context where primary financial records are unavailable, but losses alone cannot establish the causal explanation.
