evaluator_interpretation:
  - The antecedent is Huang ceasing to lead NVIDIA.
  - The ordinary reading of a bursting bubble is a broad collapse in the NVIDIA-centered speculative financing and valuation boom, with material consequences for investment or spending.
  - The quoted sentence gives no deadline. The surrounding assertion that collapse took less than a week creates a competing historical reading, but does not supply a clear deadline for this conditional forecast.
  - A brief selloff or concern about future funding is insufficient to establish the predicted collapse.
support_condition: After Huang ceases to lead NVIDIA, dated evidence establishes a broad collapse in the NVIDIA-centered AI financing and valuation boom, accompanied by material investment cancellations, financing failures, or spending contraction.
contradiction_condition: A decisive episode demonstrates that the same speculative boom continued through the leadership transition without dependence on Huang. Mere survival for a short period cannot falsify an undated forecast.
measurement_requirements: Assess financing, valuations, commitments, cancellations, and spending together. Separate losses preceding the departure from developments afterward.
source_requirements: Primary leadership disclosures and dated financial or market records; independent reporting may establish financing failures where primary records are unavailable.
