explicit_source_elements:
  - without Jensen
  - the NVIDIA Bubble bursts
  - it took less than a week for it to collapse
  - the NVIDIA Bubble has popped
evaluator_interpretation:
  - The surrounding text says the collapse has already occurred. I assess that assertion by the post date, rather than turn it into an indefinite forecast.
  - The target period is the less-than-one-week episode immediately preceding publication, November 11–17, 2026.
  - Without Jensen means Huang has ceased leading NVIDIA.
  - The ordinary reading of a burst NVIDIA-driven AI bubble is a substantial breakdown in the financing and investment activity sustaining the boom. The context particularly emphasizes NVIDIA's backing of customers and partners.
  - A sharp NVIDIA share-price decline is relevant but does not alone establish that this financing system collapsed. Conversely, the claim does not require every AI company or investment to fail.
  - The speaker supplies no numerical collapse threshold. I do not impose one.
  - This assessment tests whether the asserted collapse occurred. Establishing that Huang's departure caused it would require additional evidence.
support_condition: Huang's departure is independently established, and contemporaneous evidence shows that the NVIDIA-backed AI financing and investment system substantially broke down during the described week. Widespread financing withdrawals, failed funding arrangements or halted projects could establish this, with market declines providing corroboration.
contradiction_condition: Huang's departure is independently established, and evidence covering the described week shows that the financing and investment system continued functioning substantially, despite the leadership change and market losses. Continued deal discussions or assurances alone are insufficient to settle this.
measurement_requirements: Distinguish actual withdrawals, funding failures and investment cancellations from concerns, proposed deals and management intentions. Compare activity before and after the departure. Separate NVIDIA's share-price performance from conditions across its financing ecosystem.
source_requirements: Use dated company disclosures and financing records where available. Independent reporting may establish private negotiations and market conditions, with its limitations stated. Do not use the post as outcome evidence.
