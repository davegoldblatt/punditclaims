evaluator_interpretation:
  - "The claim reports the authors' own informal experiment: GPT-3 (2020 version) at 45% right, and text-davinci-002 in June 2022 at 50% right / 40% wrong / 10% borderline, on their commonsense examples."
  - Verification needs an independent record of the prompts, outputs and scoring. The authors' own report cannot serve as evidence that they were right.
support_condition: An independent rerun or audit of the authors' example set confirming roughly 45% right in 2020 and 50% right in June 2022.
contradiction_condition: An independent audit of the same examples and outputs showing materially different success rates, or showing that the two runs did not cover the same examples.
measurement_requirements: The complete example sets, outputs and scoring for 2020 and 2022, scored by someone other than the authors.
source_requirements: An independent replication or audit. The co-authors' own reports count as context only.
