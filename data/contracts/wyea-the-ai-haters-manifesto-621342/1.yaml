ambiguity_flags:
  - Meaningful impact has no numerical threshold.
  - Little-to-no could describe limited economy-wide diffusion rather than the absence of substantial individual deployments.
  - No starting date for accumulated progress.
  - The retail study identifies generative language applications without disclosing model architecture.
