assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA’s perpetual quarterly revenue growth
  - almost entirely-speculative purchases based on potential revenues
  - mostly driven by the compute spend from OpenAI and Anthropic
  - two unprofitable and unsustainable AI labs
evaluator_interpretation:
  - The plain reading is that nearly all NVIDIA revenue growth depends on purchases for anticipated business, with OpenAI and Anthropic providing most of the expected compute spending behind those purchases.
  - Speculative means dependent on prospective demand whose commercial viability remains unproven. Buying equipment before installation does not alone establish this.
  - Mostly means more than half. Almost entirely means nearly all; the speaker supplies no exact percentage.
  - Use NVIDIA’s latest reported quarter before the post, ending July 26, 2026, for the ongoing revenue-growth claim.
  - Unprofitable concerns current financial results. Unsustainable additionally asserts that the labs cannot maintain their spending economically; losses alone do not establish that.
support_condition: Purchase, deployment and customer-spending records establish that nearly all quarterly revenue growth came from speculative capacity purchases, and more than half of the underlying prospective spending depended on OpenAI and Anthropic. Financial evidence must also establish the claimed losses and inability to sustain that spending.
contradiction_condition: Comparable records establish a substantial contribution from commercially supported uses outside that speculative category, or show that OpenAI and Anthropic accounted for no more than half of the relevant prospective spending. Clear evidence of sustainable profitability would contradict the associated characterization of the labs.
measurement_requirements: Connect NVIDIA sales and revenue growth to purchasing decisions, installed capacity, actual workloads and ultimate customers. Separate current spending from commitments, and operating losses from net losses and cash consumption.
source_requirements: NVIDIA filings, buyer deployment records, cloud customer concentration disclosures and lab financial statements. Management assertions alone cannot establish the causal shares.
