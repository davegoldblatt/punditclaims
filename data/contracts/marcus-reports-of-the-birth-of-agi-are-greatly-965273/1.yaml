explicit_source_elements:
  - many purely language-based tasks
  - humans can do
  - question answering, writing factual prose, summarizing
  - examining the truth of a claim
  - cross-examining a hostile witness in court
  - reading and understanding a full-length book
  - existing AI systems cannot perform “competently”
evaluator_interpretation:
  - Competence means producing ordinarily usable, substantially correct work on representative tasks, allowing occasional mistakes. It does not require perfection.
  - The named activities are substantive examples of the asserted limitations. Findings can support some examples while contradicting others.
  - Existing systems refers to systems available by October 18, 2023. With no reporting cadence specified, the observation window is the current calendar year through the post date; later systems do not count.
  - Human preference and factual accuracy are relevant measures, but neither alone establishes competence across every version of a task.
support_condition: Representative evaluations of contemporary systems show substantial reliability failures on several named activities that competent humans can perform. Evidence confined to one activity supports only that part.
contradiction_condition: Contemporary systems produce reliably usable work comparable to human work on the named activities. Evidence of competence on one activity contradicts its inclusion, without disproving every other limitation.
measurement_requirements: Identify model versions, prompts, task distributions, factuality measures and human comparison methods. Distinguish generating summaries from evaluating them, and long-context retrieval from understanding an entire book.
source_requirements: Primary evaluations of systems available by the post date, preferably with human assessments and reproducible methods.
