  - forcing LLMs to consistently align
  - (any) set of ethical values
evaluator_interpretation:
  - The ordinary reading is that reliable adherence to specified ethical rules remained a substantial technical problem for contemporary general-purpose LLMs.
  - The parenthetical does not assert that every conceivable rule set is impossible to satisfy. It emphasizes the difficulty of reliable adherence even after values have been specified.
  - Because there is no regular reporting period for model capabilities, the target is the current public state documented during early 2023 through the post date.
support_condition: Contemporary evaluations or developer disclosures show that safety-trained LLMs could still be induced to violate their stated ethical or safety rules.
contradiction_condition: Broad, credible evaluations demonstrate reliable adherence to specified ethical rules, including under adversarial prompting, sufficient to show that this was no longer a substantial unresolved problem.
measurement_requirements: Distinguish reliable adherence from average improvements. Evaluate specified rules and identify the models and prompting conditions tested.
source_requirements: Contemporaneous primary evaluations or developer disclosures. Later evidence must specifically establish the behavior of models during the target period.
