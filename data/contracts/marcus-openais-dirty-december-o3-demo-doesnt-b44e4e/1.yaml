evaluator_interpretation:
  - The context refers to contemporary evaluations of the 2025 USAMO, covering March and early April 2025 through the post date.
  - Struggled heavily means generally low scores for complete mathematical proofs, not merely incorrect final numerical answers.
  - Current models means the contemporary frontier models evaluated, not every possible model or later release.
  - Hard to prepare for means limited opportunity to train on those exact newly released problems; it does not mean models could not train on olympiad mathematics generally.
support_condition: Expert evaluations show poor full-proof performance across contemporary frontier models on newly released 2025 USAMO problems, with limited opportunity for prior exposure to the exact questions.
contradiction_condition: Comparable evaluations show reliable complete proofs for most problems across representative contemporary models, or the purportedly fresh questions had been widely available well before the tests.
measurement_requirements: Use expert-graded proof scores, report partial credit and sampling, and distinguish the initial evaluation from models added later.
