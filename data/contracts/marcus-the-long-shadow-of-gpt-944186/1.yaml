assessment_axis: historical_observation
explicit_source_elements:
  - LLM-generated prose
  - has already disrupted
  - web forums and peer review processes
  - flooding outlets with fake submissions
evaluator_interpretation:
  - "'Already' requires disruption before publication, without specifying a starting date."
  - The conjunction requires evidence for both web forums and peer review.
  - The ordinary meaning of peer review is scholarly review. The accompanying Clarkesworld example suggests a possible broader meaning of editorial screening, which is assessed separately.
  - Fake submissions means fabricated or inauthentic contributions passed off as legitimate work; it does not mean all LLM-assisted writing.
support_condition: Dated records establish actual disruption from substantial volumes of inauthentic LLM submissions in both web forums and scholarly peer review before publication.
contradiction_condition: Affirmative evidence refutes one or both asserted disruptions. Failure to locate evidence for a component is not itself contradiction.
measurement_requirements: Establish volume, LLM attribution, and an operational consequence such as overwhelmed moderation or suspended submissions. Distinguish scholarly peer review from fiction editorial screening.
source_requirements: Prefer forum moderation records and editorial or journal records; use contemporaneous reporting when primary pages cannot be read.
