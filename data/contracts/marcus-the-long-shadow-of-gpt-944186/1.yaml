ambiguity_flags:
  - Peer review may mean scholarly review or, given the Clarkesworld example, editorial screening.
  - "'Fake' does not specify whether the defect is factual fabrication, undisclosed authorship, or prohibited generation."
  - "'Already' supplies no lower date."
