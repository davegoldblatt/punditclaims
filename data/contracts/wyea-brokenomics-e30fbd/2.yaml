ambiguity_flags:
  - No observation period or lower time bound was supplied; the evidence-existence assertion includes previously published studies.
  - The latest publicly reportable observations differ across workforce records and productivity studies.
  - Compelling has no specified evidentiary standard.
  - Replacing could refer to layoffs, substitution through attrition, or displacement of tasks.
  - Non-technical and delivery of software are not defined.
  - The broad productivity wording could be read more narrowly as organization-wide gains; the assessment uses its ordinary, unqualified wording.
