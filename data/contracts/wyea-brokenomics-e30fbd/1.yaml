explicit_source_elements:
  - They’re not replacing anyone
  - there isn’t compelling evidence that AI models speed people up
  - non-technical people
  - delivery of software in a measurable way
evaluator_interpretation:
  - The passage contains three distinct assertions. Evidence about professional programmers does not directly settle software delivery by non-technical users.
  - For the ongoing employment and productivity claims, use January–March 2026, the latest completed calendar quarter before publication. Earlier experiments remain context.
  - Replacement means actual substitution of AI for human work that eliminates positions or reduces required staffing. A layoff attributed to AI is relevant but does not independently establish that substitution.
  - Compelling productivity evidence means credible measured improvements with suitable comparisons and attention to output quality. Software delivery means completed usable software, not merely generated code.
support_condition: Evidence establishes the absence of actual worker substitution and credible productivity gains in the specified scope, including no measurable improvement in completed software delivery by non-technical users.
contradiction_condition: Verified worker substitution or credible measured productivity gains contradicts the corresponding categorical assertion. A controlled comparison involving non-technical users and completed usable software would directly test the final assertion.
measurement_requirements: Distinguish announced layoffs from completed substitution, task throughput from delivery, professional developers from non-technical users, and self-reported gains from measured effects.
source_requirements: Employer records corroborated where possible, and controlled studies or credible independent measurements.
