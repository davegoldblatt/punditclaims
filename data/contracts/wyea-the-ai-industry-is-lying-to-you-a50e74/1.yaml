original_horizon: sometime in late 2027
horizon_interval:
  start: 2026-03-24
  end: 2027-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Completion before October 2027 would contradict the forecast early only if evidence also establishes that the March 2026 construction-rate condition held through completion. Completion following a changed rate does not score this conditional forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
