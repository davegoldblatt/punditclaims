evaluator_interpretation:
  - "Preserve the explicit condition: the construction rate prevailing around March 24, 2026 continues."
  - The target is completion of construction of the original eight-building campus, excluding adjacent developments.
  - For an eventual timing test, interpret late 2027 as October through December 2027. This boundary is supplied by the evaluator.
  - Construction rate requires comparable measurements of work completed over time. Counts of delivered buildings alone do not establish an unchanged rate because buildings can progress concurrently.
support_condition: Evidence establishes that the March 2026 construction rate continued and that the original eight-building campus first became fully built during October–December 2027.
contradiction_condition: With the unchanged-rate condition established, the campus first becomes fully built before October 2027 or remains unfinished after December 31, 2027.
measurement_requirements: A documented March 2026 baseline and comparable subsequent construction-progress measurements, followed by a dated whole-campus construction completion record.
source_requirements: Developer construction logs, independently measured progress, comparable dated site surveys or equivalent records. Revised completion targets alone establish neither the condition nor the outcome.
