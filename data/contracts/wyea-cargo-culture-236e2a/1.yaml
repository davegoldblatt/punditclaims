assessment_axis: historical_observation
explicit_source_elements:
  - Both companies
  - everything paid for them either by hyperscalers or venture capitalists
  - fundamentally incapable of operating without infinite resources
evaluator_interpretation:
  - Read infinite resources as rhetorical language for continuing dependence on outside financing, not a literal mathematical infinity.
  - The checkable core is whether customer cash generation could sustain the companies’ ongoing operations without repeated external financing.
  - Do not silently replace everything with some losses, or infer permanent inability to self-fund from a period of negative cash flow.
  - Use January–March 2026, the latest completed quarter public reporting could cover before the post, for the ongoing financial state.
  - The claim identifies neither a cash-flow measure nor an accounting basis.
support_condition: Comparable cash-flow and financing records show that both companies could not sustain their then-current operations from customer cash and depended on external financing to cover the shortfall. Establishing the stronger permanent-inability wording would require additional evidence beyond historical losses.
contradiction_condition: Comparable records demonstrate sustained self-funding of ongoing operations, or establish that the asserted comprehensive outside funding is false. Temporary positive cash flow or an existing cash reserve alone would not establish sustainable independence.
measurement_requirements: Operating receipts and payments, capital expenditure, working-capital effects, available cash, external financing, and the duration over which self-funding is assessed.
source_requirements: Prefer cash-flow statements and financing agreements. Revenue, net losses, valuation changes, and fundraising must remain separate measures.
