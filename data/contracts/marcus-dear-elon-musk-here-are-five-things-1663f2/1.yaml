explicit_source_elements:
  - in 2015
  - (truly) self-driving cars were two years away
  - pretty much said the same thing every year since
  - It still hasn’t happened
evaluator_interpretation:
  - The surrounding discussion makes Tesla the ordinary scope of the claim.
  - Truly self-driving means driving without a human continuously supervising and being ready to intervene.
  - Pretty much the same thing means repeated near-term forecasts, usually within about two years, rather than an identical two-year promise every calendar year.
  - The target period covers the explicitly named prediction history through the post date. The non-arrival assertion concerns the end of that period.
support_condition: Records establish the 2015 two-year prediction, substantially annual repetitions of near-term autonomy predictions, and Tesla's continued reliance on supervised driving assistance before the post.
contradiction_condition: Records disprove the attributed 2015 statement or the recurring prediction pattern, or establish that Tesla had delivered the promised unsupervised driving capability before the post.
measurement_requirements: Distinguish supervised assistance, feature-complete software, demonstrations, regulatory approval, and deployed unsupervised driving.
source_requirements: Use dated interviews, company statements, regulatory records, or contemporary reporting. Another company's driverless service is context for the scope ambiguity.
