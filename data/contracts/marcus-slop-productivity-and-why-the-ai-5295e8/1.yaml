evaluator_interpretation:
  - The ordinary reading is large realized financial losses across several business layers, including model providers, coding applications and infrastructure intermediaries.
  - Net income or loss is the ordinary company-wide profitability measure; cash spending and financing needs are separate measures.
  - Use January–March 2026, the latest completed calendar quarter that could have been reported before publication. Earlier annual results provide context.
  - The coding emphasis requires evidence connecting losses to coding activities; aggregate model-company losses alone are insufficient.
  - The passage supplies no accounting basis for these company-wide losses. The nearby analyst quotation concerns a different cost-to-payment comparison, so it does not establish their accounting basis.
support_condition: Comparable realized financial results establish large losses at multiple named business layers, with evidence supporting the special emphasis on agentic coding.
contradiction_condition: Comparable results establish profitability or negligible losses across the claimed layers, or directly contradict the coding emphasis.
measurement_requirements: Identify each company's reporting period and loss measure. Do not combine net losses, operating losses, gross margins, capital spending or cash burn as interchangeable amounts.
source_requirements: Prefer filings and company financial disclosures. Identify press estimates and their underlying documents.
