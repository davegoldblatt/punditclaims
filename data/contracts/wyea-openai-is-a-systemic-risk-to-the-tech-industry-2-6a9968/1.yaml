assessment_axis: forecast_outcome
explicit_source_elements:
  - it is impossible
  - any of this project is done
  - by the end of the year, or even in 2026
  - CoreWeave's (alleged) contracted 1.3 Gigawatts of capacity
evaluator_interpretation:
  - "'This project' is CoreWeave's roughly 1.3 GW of contracted power reported in its S-1 as of December 31, 2024."
  - "Plain reading of 'any of this project is done': no part of the not-yet-active contracted capacity comes online (is energized or active) before the end of 2026."
  - A part counts as done when CoreWeave or its data center provider reports it energized or active.
support_condition: No part of the capacity CoreWeave had contracted at the end of 2024 beyond its then-active ~360 MW is reported energized or active by December 31, 2026.
contradiction_condition: Any part of the capacity contracted by the end of 2024 that was not yet active is reported energized or active before December 31, 2026.
measurement_requirements: CoreWeave active-power figures and provider (e.g. Core Scientific) energization reports, tied to capacity contracted by the end of 2024.
source_requirements: CoreWeave and Core Scientific earnings releases or filings.
metric_scope: null
original_horizon: by the end of the year, or even in 2026
horizon_interval:
  start: 2025-04-14
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: If, before December 31, 2026, any portion of the capacity CoreWeave had contracted at the end of 2024 (and not then active) is reported energized or active, the forecast is contradicted at that point.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Any of this project is done' could be read as the whole 1.3 GW being finished. Under that reading the forecast is not due until the end of 2026."
  - The 1.3 GW figure includes about 360 MW already active at the end of 2024.
  - CoreWeave does not break active power out by contract date.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
