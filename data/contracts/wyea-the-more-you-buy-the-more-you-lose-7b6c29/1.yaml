assessment_axis: causal_assessment
explicit_source_elements:
  - the longer this goes on
  - the more expensive it gets
  - the more extreme the payoff has to be
evaluator_interpretation:
  - This refers to the continuing AI infrastructure buildout described in the surrounding paragraphs.
  - The ordinary reading is that continued expansion raises construction and financing costs and therefore the future receipts needed to recover investment.
  - Merely adding more projects to cumulative spending does not establish the claimed cost escalation.
  - Payoff means the receipts needed to recover investment and financing costs, not a specified investment-return target.
support_condition: Comparable project and financing records show that continued buildout causes higher costs, with lifecycle calculations showing a corresponding increase in required receipts after efficiency improvements are included.
contradiction_condition: Comparable records show that continued buildout reduces or stabilizes all-in costs and required receipts, undermining the claimed escalating mechanism.
measurement_requirements: Separate construction cost per comparable capacity, financing terms, total investment, operating efficiency and lifecycle recovery requirements.
source_requirements: Construction cost studies, financing records and transparent lifecycle calculations that distinguish causation from coincident inflation or changing project specifications.
