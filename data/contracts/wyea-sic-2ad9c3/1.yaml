contradiction_condition: At least one pre-publication report identifies employees replaced at a named business and describes the generative AI system's replacement work.
measurement_requirements: Distinguish employees from freelancers, completed replacements from plans, and operational descriptions from generic efficiency claims.
source_requirements: Read contemporaneous reporting in full. Identify management-supplied assertions and distinguish reporting existence from independent verification.
