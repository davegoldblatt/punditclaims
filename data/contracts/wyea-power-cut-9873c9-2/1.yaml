assessment_axis: forecast_outcome
explicit_source_elements:
  - will continue burning money in perpetuity
evaluator_interpretation:
  - Only the normalized perpetual-cash-burn forecast is graded here. The adjacent 2024 and 2025 figures are not separate claims in this item.
  - The ordinary financial reading of burning money is negative cash flow from operations and necessary investment, excluding financing inflows. Accounting losses and financing proceeds are not substitutes.
  - A full financial year of positive free cash flow from the continuing business would decisively contradict continued cash burn. This annual measurement period is an evaluator convention intended to exclude temporary cash timing effects.
  - No finite sequence of negative results establishes perpetual future cash burn.
support_condition: No finite reporting history can establish the forecast's unlimited future duration.
contradiction_condition: Reliable financial records establish a full financial year of positive free cash flow from OpenAI's continuing business, excluding financing proceeds and one-time asset disposals.
measurement_requirements: Reconcile operating cash flow and capital expenditure. Separate realized cash flow from forecasts, accounting earnings, equity funding and changes in cash balances.
source_requirements: Prefer OpenAI cash-flow statements or independently verified financial disclosures. Press reports of forecasts are context only.
