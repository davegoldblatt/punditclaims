assessment_axis: causal_assessment
explicit_source_elements:
  - Demand for NVIDIA GPUs
  - those from Broadcom, AMD and other semiconductor companies
  - driven by speculative capital
  - far more demand for compute capacity than actually exists
evaluator_interpretation:
  - The plain reading is that inflated expectations of future compute demand are a major driver of current AI chip purchases across the industry.
  - Investment in future capacity is not sufficient by itself. The claim also requires evidence that buyers materially overestimate demand and that this overestimate drives their orders.
  - The relevant state is the market at publication, September 22, 2026. Earlier disclosures provide context rather than a complete measurement of that state.
  - Everybody is read as a broad market characterization, not a literal assertion about every individual.
support_condition: Representative purchasing records and investment cases show that materially inflated compute-demand expectations are a major cause of chip orders, corroborated by comparable actual demand and utilization.
contradiction_condition: Representative purchasing records show that orders principally serve demonstrated demand or reasonably matched future requirements, and that the alleged demand overestimate does not materially explain purchases.
measurement_requirements: Match purchaser forecasts, chip orders, deployment dates, paid compute demand and utilization. Distinguish inefficient hardware use from a lack of customers willing to purchase compute.
source_requirements: Purchaser disclosures or procurement records, supported by independent demand measurements. Supplier assurances alone cannot establish market-wide causation.
