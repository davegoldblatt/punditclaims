explicit_source_elements:
  - there is no AI trade
  - because generative AI is not making anybody any money
evaluator_interpretation:
  - The surrounding passage makes profit, rather than revenue, the ordinary meaning of making money.
  - The immediately following NVIDIA exception qualifies the otherwise universal wording. I do not use NVIDIA alone to refute this sentence.
  - For the ongoing financial premise, I use January–March 2025, the latest common reported quarter before publication for the calendar-quarter companies discussed. This is an evaluator-selected reporting window.
  - The causal conclusion concerns whether current generative-AI profits justify the investment thesis. The speaker supplies no investment portfolio, return threshold, or holding period.
support_condition: Comparable financial evidence establishes no positive profit from generative AI outside the acknowledged NVIDIA exception during the target period, and evidence establishes the asserted connection to the investment thesis.
contradiction_condition: Comparable financial evidence establishes positive profit attributable to generative AI at another business during the target period, refuting the stated premise. Revenue alone does not suffice.
measurement_requirements: Separate revenue from profit, and attribute both revenue and relevant costs to generative AI. Do not substitute consolidated company margins or share-price gains.
source_requirements: Financial disclosures or credible reporting describing the target period, published by 2026-10-28. Later reporting may establish earlier facts, but later profitability cannot be backdated without evidence.
