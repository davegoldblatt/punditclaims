evaluator_interpretation:
  - The ordinary reading concerns investors' willingness to finance neocloud expansion on the strength of contracted business and projected growth.
  - Treat 'anyone' as rhetorical emphasis, not a claim about every individual investor.
  - Use October 1 through November 3, 2026, for the ongoing market conditions described as developing in recent weeks.
  - Financing outcomes indicate investor confidence but do not directly measure how investors value backlogs.
support_condition: Contemporaneous financing failures, tougher terms and investor commentary show materially reduced confidence in neocloud growth plans.
contradiction_condition: Material contemporaneous financing and lender backing show that neocloud expansion plans continue to attract capital. Evidence of retrenchment alongside continuing backing warrants a mixed assessment.
measurement_requirements: Distinguish unsecured bonds, secured loans and equity. Customer demand alone does not establish investor willingness to finance expansion.
source_requirements: Prefer financing announcements and filings; use independent reporting for abandoned transactions and investor views.
