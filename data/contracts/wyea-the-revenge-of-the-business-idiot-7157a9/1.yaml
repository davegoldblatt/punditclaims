evaluator_interpretation:
  - Take down means cause Figma's business failure or a sustained loss of its established market position through competitive displacement by Claude Design.
  - A product launch, a share-price decline, or individual customer switching does not by itself meet that threshold.
  - The statement supplies no deadline, so continued operation through the evaluation date cannot establish that displacement will never happen.
support_condition: A decisive event permanently forecloses competitive displacement by Claude Design while Figma retains its business and market position.
contradiction_condition: Figma fails or suffers sustained displacement from its established market position, with credible evidence attributing that outcome materially to Claude Design.
measurement_requirements: Business status, sustained market-position or customer-retention evidence, and evidence connecting any displacement to Claude Design.
source_requirements: Company filings and operating disclosures, supplemented by independent market measurements and documented customer migration.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve against the claim upon documented business failure or sustained competitive displacement materially caused by Claude Design. Resolve in its favor only if a dated event permanently forecloses that route; temporary survival or product withdrawal is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Take down has no stated market-share or business-failure threshold.
  - No deadline is supplied.
  - The wording may concern present capability, but the surrounding discussion of destroying competitors supports a forecast reading.
retrospective_or_prospective: retrospective
