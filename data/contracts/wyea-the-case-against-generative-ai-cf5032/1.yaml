explicit_source_elements:
  - Replit has now released an update that lets you choose how autonomous you want Agent 3 to be
  - tacit admission
  - you can't trust coding LLMs to build software
evaluator_interpretation:
  - The factual premise is that Replit shipped a setting for Agent autonomy. Its changelog confirms this.
  - The claim itself is an interpretation of what that feature 'tacitly admits', plus a judgment that coding LLMs 'can't be trusted' to build software. 'Trust' has no stated threshold, task scope, or measure. Some software built with LLMs works and some fails, so no single test settles a blanket judgment about trust.
support_condition: Not adjudicable. There is no agreed threshold for when coding LLMs count as 'trusted' to build software.
contradiction_condition: Not adjudicable for the same reason.
