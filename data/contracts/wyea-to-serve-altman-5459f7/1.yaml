explicit_source_elements:
  - at this point
  - effectively owns OpenAI
  - owns — or at least has access to — all of the intellectual property
  - bound to use Azure
evaluator_interpretation:
  - The ordinary reading is ownership-like practical control, including control through contracts and dependence, rather than necessarily majority legal ownership.
  - Substantial influence, access to technology, or an important supplier relationship does not alone establish effective ownership.
  - The claim describes the relationship at publication. I use July 2024 through July 29 as the current-state reporting window.
  - This is a claim about control, not a specified investment amount or valuation; metric_scope is null.
support_condition: Evidence establishes that Microsoft could determine OpenAI's major decisions or exercise contractual control over its business and assets substantially equivalent to ownership during the target period.
contradiction_condition: Evidence establishes that OpenAI retained meaningful independent control over major decisions and commercialization despite Microsoft's contractual rights and economic influence.
measurement_requirements: Assess governance, decision rights, intellectual-property rights, compute restrictions, and actual conduct together. Neither formal ownership alone nor commercial dependence alone is sufficient.
source_requirements: Prefer governing agreements, regulatory findings, and contemporaneous company disclosures. Distinguish contractual provisions applicable in July 2024 from later amendments.
