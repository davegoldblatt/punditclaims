assessment_axis: historical_observation
explicit_source_elements:
  - From what I hear
  - the vast majority of those 1% of customers
  - AI startups
  - power their products using OpenAI and Anthropic’s models
  - predominantly using monthly subscriptions
  - allow users to burn way more in tokens than their subscriptions actually make
evaluator_interpretation:
  - Treat 'from what I hear' as attribution to unnamed sources, not a conditional forecast.
  - Read 'those 1%' as the high-spending customer group referenced in the Ramp chart. Do not silently equate Ramp's sample with the providers' entire customer bases.
  - Vast majority means a large majority by customer count; no precise percentage is supplied.
  - The subscription statement concerns permitted usage, not proof that the average subscriber exhausts the allowance.
  - Use September 2026, the latest complete month before the post, for the ongoing customer-composition claim.
  - The principal test is customer composition and business-model prevalence, not a numerical revenue estimate.
support_condition: A representative breakdown of the referenced top-spending cohort shows a large majority are AI product startups using these models, and that monthly plans permitting substantially greater token expense than subscription receipts predominate among them.
contradiction_condition: Comparable customer-level evidence shows the cohort is not largely composed of those startups, or that the described subscription arrangements do not predominate.
measurement_requirements: Identify the cohort, ranking method, customer classifications and pricing terms. Separate API list-price equivalents from actual token procurement costs and maximum permitted usage from realized usage.
source_requirements: Provider records or representative payment data linked to customer identities and subscription economics. A few selected startup examples cannot establish prevalence.
