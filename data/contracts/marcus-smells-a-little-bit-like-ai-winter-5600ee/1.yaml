evaluator_interpretation:
  - The ordinary reading is that contemporary public capability promotion materially exaggerated what the systems could deliver.
  - I assess the launch examples identified in the post, rather than stock valuations, intentional deception or every AI application.
  - A promotional demonstration can overstate capability by presenting materially inaccurate outputs as successful examples. General warnings and experimental labels must also be considered.
  - For the ongoing observation, I use February 6–16, 2023, the launch-and-recall window described in the post.
support_condition: Specific public promotional representations or showcased results materially exceed the systems' documented capabilities or the correctness of the showcased outputs, after considering accompanying qualifications.
contradiction_condition: The relevant promotional representations accurately reflect demonstrated capabilities and clearly communicate the limitations relevant to the alleged exaggeration.
measurement_requirements: Compare identifiable promotional statements and examples with independently documented outputs or source checks. A stock-price decline alone is irrelevant.
source_requirements: Primary launch material paired with independent examination of the demonstrated results. Reputable contemporary reporting may establish an advertisement's contents when accessible primary text is unavailable.
