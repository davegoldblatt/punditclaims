assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI
  - lacks mass-market utility
  - burns cash with every prompt
evaluator_interpretation:
  - Mass-market utility ordinarily means practical benefits for a substantial population across everyday tasks, rather than usefulness only to specialists.
  - Repeated practical use and reported helpfulness are relevant evidence, but adoption alone does not establish benefits after errors and verification costs.
  - In this financial context, 'burns cash with every prompt' is read as a claim of net cash loss from serving prompts, not merely that computing consumes resources.
  - Use July–September 2024, the latest completed quarter before the post, for this ongoing cross-industry observation.
  - No individual company's money is specified, so metric_scope is null. Company-level losses can provide context but cannot substitute for industry-wide per-prompt economics.
support_condition: Evidence for the target period shows no substantial practical mass-market benefit and shows that serving prompts loses cash after attributable receipts across the claimed scope.
contradiction_condition: Evidence establishes sustained practical benefits at mass-market scale, or a documented class of prompts earns more attributable cash than it costs to serve.
measurement_requirements: Practical outcomes or sustained useful task completion, with errors and verification costs considered; matched prompt-serving costs and receipts, separated from training, financing, and company-wide losses.
source_requirements: Prefer representative independent studies and disclosed unit economics. Company-wide financial estimates are context only.
