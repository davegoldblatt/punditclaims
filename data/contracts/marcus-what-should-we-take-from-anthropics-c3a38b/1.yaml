explicit_source_elements:
  - ChatGPT can’t reliably run a timer
  - has still been implicated
  - delusions
  - suicides
  - cognitive surrender
  - mass disinformation
evaluator_interpretation:
  - The statement combines a current capability claim with a cumulative claim about reported harms.
  - The target period covers ChatGPT's history through publication. The timer component concerns the product available immediately before the post; the product has no regular reporting period comparable to a financial quarter.
  - Implicated means credibly linked in reports, legal allegations, or research; it does not mean causation has been judicially or scientifically established.
  - Running a timer means accurately measuring an interval or providing the requested timely alert, without pretending to have performed an unavailable action.
  - Cognitive surrender means accepting AI answers with little independent scrutiny.
  - Mass disinformation requires evidence of organized dissemination at substantial scale. It does not require proof that audiences were persuaded.
  - The unspecified phrase 'and so much more' adds no separately measurable requirement.
support_condition: Evidence supports unreliable timer operation in the relevant ChatGPT product and credible public links to every named category, including substantial-scale disinformation.
contradiction_condition: Relevant testing establishes dependable timer operation, or affirmative evidence disproves a named implication. Missing evidence for a component leaves the combined claim unresolved.
measurement_requirements: Timer evidence must identify the mode, available tools, and observed behavior. Harm evidence must concern ChatGPT specifically. Disinformation evidence must distinguish production, dissemination, reach, and persuasion.
source_requirements: Prefer legal records, original research, company incident investigations, and reproducible product tests. Treat allegations as allegations and distinguish product modes.
