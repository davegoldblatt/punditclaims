assessment_axis: historical_observation
explicit_source_elements:
  - When finished
  - a data center creates roughly 100 to 200 jobs
  - less than a large Walmart
  - little or no economic value
evaluator_interpretation:
  - Read this as a generalization about typical completed large AI data centers, not an assertion that every facility has identical staffing.
  - Count ongoing on-site employment, including regular contractors, separately from construction and indirect employment.
  - Use Q2 2026, the latest complete calendar quarter before the post, for the ongoing employment observation.
  - Read economic value in the surrounding community-benefits discussion as net local economic benefit, considering taxes, wages, subsidies, infrastructure costs, and other material local costs.
  - "'When finished' restricts the population to operating facilities; it is not a conditional forecast."
support_condition: Representative records for completed AI facilities show typical ongoing staffing around 100–200, below comparable large Walmart stores, and net local benefits that are small or absent after material costs.
contradiction_condition: Representative comparable records show typical operating staffing substantially outside the stated range, or demonstrate substantial net local benefits inconsistent with the economic-value assertion.
measurement_requirements: Define facility versus campus, size, AI workload, operating status, headcount versus full-time equivalents, contractor treatment, and the boundary of net economic benefits. Do not substitute construction job-years or gross output for permanent staffing or net benefit.
source_requirements: Prefer facility employment records, public audits, local fiscal records, and independent economic-impact studies. Announced future job promises are insufficient.
