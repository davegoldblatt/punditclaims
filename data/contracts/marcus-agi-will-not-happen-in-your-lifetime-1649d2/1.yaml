assessment_axis: forecast_outcome
explicit_source_elements:
  - I don’t think
  - more than 5 years
  - a substantial fraction of AI effort
  - looking outside the limited streetlight
evaluator_interpretation:
  - The five-year deadline is January 22, 2028, measured from publication.
  - The surrounding discussion identifies the streetlight as contemporary LLM-centered approaches and motivates alternatives addressing semantics, causality, commonsense reasoning, and integration.
  - The plain reading requires a material share of field-wide research effort, not merely the existence of alternative projects.
  - Hybrid systems can qualify when they materially pursue these alternatives; using an LLM does not automatically disqualify them.
  - Substantial need not mean a majority. No numerical cutoff or preferred measure of effort is supplied.
support_condition: By January 22, 2028, representative research-output, staffing, or funding records establish an unambiguously substantial share of AI effort pursuing approaches beyond the contemporary LLM-centered focus.
contradiction_condition: Representative records through the deadline show that such work remains marginal under reasonable measures and classifications of AI effort.
measurement_requirements: A field-wide denominator, a documented classification of research approaches, and comparable measures over time. Distinguish research effort from adoption of existing AI tools.
source_requirements: Prefer original bibliometric datasets, staffing records, and funding records. Individual project announcements establish activity but not its field-wide share.
metric_scope: null
original_horizon: not more than 5 years
horizon_interval:
  start: 2023-01-22
  end: 2028-01-22
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as supported only if dated, representative records already establish an unambiguously substantial field-wide share pursuing qualifying alternatives. Isolated projects and announcements do not meet this rule; current concentration on LLMs cannot establish failure before the deadline.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Substantial fraction has no numerical cutoff.
  - AI effort could mean publications, researcher time, staffing, or funding.
  - The boundary between LLM-centered work and qualifying hybrid approaches is unspecified.
  - The statement does not quantify how much the allocation must change from its starting point.
retrospective_or_prospective: prospective
