assessment_axis: forecast_outcome
explicit_source_elements:
  - costs could foreseeably come down
  - all signs point to them increasing
evaluator_interpretation:
  - In context, costs means OpenAI's aggregate expenses, including model training, serving and personnel.
  - This is a directional forecast, not a claim that every unit cost or expense category must rise.
  - No deadline is stated. A completed full-year comparison after publication can establish the predicted increase.
  - The first full calendar year after publication, 2025, compared with 2024 is an evaluator-selected test, not a deadline attributed to Zitron.
  - The basis is press-reported financial estimates, matching the surrounding reliance on reporting about OpenAI's finances.
support_condition: Credible comparable annual figures show aggregate OpenAI costs increasing after publication.
contradiction_condition: Comparable figures for the first full calendar year after publication show aggregate costs falling or remaining flat. This would contradict the near-term reading, not an unlimited claim about all future years.
measurement_requirements: Annual total costs and expenses on a consistent basis. Separate these from net losses, cash burn, financing and future compute commitments.
source_requirements: Company financial records or credible reporting that verifies comparable annual costs. The speaker's own assertions are insufficient.
metric_scope:
  company: OpenAI
  metric: Aggregate annual costs and expenses
  currency: USD
  units: USD billions per year
  accounting_basis: estimate
