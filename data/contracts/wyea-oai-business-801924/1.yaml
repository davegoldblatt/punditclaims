early_resolution_rule: Resolve as supported once credible, independently verified reporting establishes that aggregate costs in the first completed full calendar year after publication exceeded the preceding year's costs on a comparable basis.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - Costs could mean aggregate expenses or costs per unit of revenue; the surrounding list favors aggregate expenses.
  - The annual comparison window is supplied by the evaluator.
  - The statement allows uncertainty and does not promise uninterrupted increases.
