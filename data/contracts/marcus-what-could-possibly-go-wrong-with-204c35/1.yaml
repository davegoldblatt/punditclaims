explicit_source_elements:
  - the field of AI has not yet learned enough
  - make that remotely reliable
  - either from a security perspective or from the perspective of the underlying technology
evaluator_interpretation:
  - In context, 'that' means broadly capable LLM agents entrusted with autonomous actions across users' devices, rather than every narrow system called an AI agent.
  - The plain reading of reliable is dependable task execution with adequate resistance to malicious inputs. It does not mean perfect performance.
  - The observation concerns accumulated technical capability as of February 9, 2024. The target has no stated beginning; the latest public evaluations available by that date are used, without importing later improvements.
support_condition: Contemporaneously available evaluations show frequent failures on realistic multi-step tasks and unresolved security weaknesses relevant to broadly autonomous LLM agents.
contradiction_condition: Evidence available by the post shows broadly capable autonomous LLM agents executing realistic tasks dependably and maintaining effective security across the relevant threat surface.
measurement_requirements: Use realistic task success and practical security evaluations. Keep narrow benchmark defenses separate from security of a complete general-purpose agent.
source_requirements: Versioned primary research or documented evaluations available by February 9, 2024.
