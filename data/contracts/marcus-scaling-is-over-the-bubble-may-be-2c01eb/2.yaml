interpretation_determines_result: true
ambiguity_flags:
  - "'Appeared' qualifies the assertion despite the accompanying 'in fact'."
  - "'For lying' can refer to the board's perception or to independently established deliberate falsehoods. This assessment uses the former reading."
  - The claim does not specify individual lies or say dishonesty was the sole reason.
