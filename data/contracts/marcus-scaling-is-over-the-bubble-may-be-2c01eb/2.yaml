  - in 2023
  - for lying
evaluator_interpretation:
  - "Preserve the qualification: assess whether the record reasonably supports the appearance that perceived dishonesty motivated Altman's dismissal, not whether every allegation of lying is conclusively established."
  - Read 'for lying' as describing the dismissing board's reason. It need not have been the sole reason.
  - The target period is 2023, the year explicitly named. Later accounts can provide evidence about that dismissal.
  - The comparison with Marcus's earlier speculation is not a separate claim being graded.
support_condition: Contemporaneous board statements and credible firsthand accounts reasonably support perceived dishonesty as a material reason for the 2023 dismissal. They need not conclusively establish the underlying allegations.
contradiction_condition: Reliable evidence establishes that perceived dishonesty was not a material reason for the dismissal, or discredits the accounts sufficiently that the qualified appearance is no longer reasonably supported. Disagreement about whether dismissal was justified is insufficient by itself.
measurement_requirements: Distinguish the board's stated or reported motivation from proof of deliberate falsehoods and from whether removal was warranted.
source_requirements: Prefer the contemporaneous announcement and firsthand accounts from participants. Consider contrary accounts and subsequent investigations. Use only evidence published by 2026-10-28.
