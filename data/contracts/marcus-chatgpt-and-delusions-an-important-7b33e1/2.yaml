explicit_source_elements:
  - Lots of internal warnings
  - were ignored
  - "Context: ChatGPT users experiencing mental health crises and reporting about OpenAI."
evaluator_interpretation:
  - The plain reading is that OpenAI disregarded a substantial body of internal warnings about risks to ChatGPT users' mental health.
  - Lots means many warnings, not merely more than one. Several testers discussing one launch can contribute evidence, but do not automatically establish this quantity. No numerical cutoff is supplied or imposed.
  - Ignored means relevant decision-makers dismissed warnings or proceeded without meaningful responsive action at the relevant time. Later remedies do not erase earlier disregard; an imperfect response does not by itself establish disregard.
  - The statement describes past conduct preceding the post, rather than a reporting quarter. The target period ends on the post date; its start remains unspecified because the supplied context gives no starting date.
  - Warnings about other products provide context unless evidence connects them to decisions about ChatGPT.
support_condition: Credible records or corroborated reporting establish a substantial number or sustained pattern of distinct internal mental-health warnings concerning ChatGPT, and show that OpenAI disregarded those warnings at the relevant decisions.
contradiction_condition: A sufficiently comprehensive record shows that the alleged body of ignored warnings was not substantial, did not concern ChatGPT's mental-health risks, or received meaningful responses at the relevant decisions. Examples of warnings receiving responses are insufficient by themselves to disprove that many others were ignored.
measurement_requirements: Identify the warnings, their subjects, approximate dates, recipients, and responses. Distinguish separate warnings from multiple witnesses describing the same warning or decision. An exact count is unnecessary if the record clearly establishes a substantial pattern.
source_requirements: Prefer internal communications, decision records, and firsthand company disclosures. Use reputable investigative reporting where underlying records are unavailable, distinguishing reported testimony from independently published documents.
