assessment_axis: historical_observation
explicit_source_elements:
  - An AI data center full of AI GPUs
  - useful for AI and very little else
  - There are GPU-powered analytics tools, GPU-powered modeling and scientific applications
  - impractical for most of what modern computing demands
evaluator_interpretation:
  - The ordinary reading concerns practical usefulness outside AI, including economic and operational suitability, rather than whether another program can technically execute.
  - The explicit acknowledgment of analytics, modeling and science means isolated examples in those fields do not automatically contradict the claim.
  - I use May 2026, the latest completed calendar month before the post, as the reference period for this ongoing technical state. This is an evaluator-selected reporting window.
  - Evidence must address AI-oriented GPU facilities, rather than treating every graphics card or purpose-built scientific supercomputer as interchangeable.
support_condition: Representative workload and deployment evidence shows that practical non-AI uses of the relevant GPU facilities were narrow and economically marginal during the target period.
contradiction_condition: Representative deployment evidence shows substantial, practically viable non-AI uses across the relevant AI-oriented GPU facilities during the target period.
measurement_requirements: Workload inventories, actual or feasible capacity shares, application performance, adaptation requirements and costs. Distinguish GPU generations and AI workloads from conventional numerical simulation.
source_requirements: Operator workload records and application deployment studies, preferably with independent measurements. Vendor capability lists alone cannot establish prevalence or economics.
