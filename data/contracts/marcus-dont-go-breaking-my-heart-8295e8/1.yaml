evaluator_interpretation:
  - The change is Replika's February restriction on erotic and intimate interaction.
  - Some people apparently experiencing emotional pain requires credible individual accounts linking distress to the change, not a prevalence estimate or clinical diagnosis.
  - The claim does not require the restriction to be the sole cause of distress.
  - The relevant experiences occurred in February 2023 before publication.
support_condition: Credible accounts describe users experiencing distress after the restriction and attribute that distress to the resulting rejection or loss of intimacy.
contradiction_condition: Evidence establishes that the reported distress did not occur or was unrelated to the change.
measurement_requirements: Separate users' accounts of emotional pain from clinical diagnoses, population-wide harm, and proof that removal of erotic role play was the sole cause.
source_requirements: Contemporaneous testimony or later interviews clearly describing the February events; prefer independently reported accounts.
