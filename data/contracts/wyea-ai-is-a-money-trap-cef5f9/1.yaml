assessment_axis: forecast_outcome
explicit_source_elements:
  - Cursor’s product is now worse
  - People are going to cancel their subscriptions
  - Its annualized revenue will drop
  - its ability to raise capital will suffer as a direct result
evaluator_interpretation:
  - "The claim predicts a causal sequence: less attractive service causes cancellations, a decline in annualized revenue, and impaired fundraising."
  - The comparison is with Cursor before the service changes discussed in the post. No numerical baseline or deadline is supplied.
  - Some dissatisfied customers would not establish the full prediction. Conversely, subsequent fundraising or revenue milestones alone cannot exclude a temporary decline or establish what would have happened without the changes.
  - The supplied passage does not identify an accounting basis for the revenue forecast. Monetary evidence is therefore context, not decisive evidence under the scoring rules.
support_condition: Comparable revenue records and subscriber data establish the predicted decline, while fundraising records establish that the revenue decline impaired access to capital.
contradiction_condition: A completed, adequately documented episode establishes that the alleged causal sequence did not occur, or a decisive event makes that sequence impossible. Isolated positive milestones are insufficient to refute an undated forecast.
measurement_requirements: Consistent annualized revenue definitions; dated cancellations and their reasons; fundraising amounts, terms, and investor explanations; evidence connecting each step.
source_requirements: Company financial and subscription records, investor disclosures, or reliable reporting with identified measurement methods. Complaints alone do not measure aggregate cancellations.
