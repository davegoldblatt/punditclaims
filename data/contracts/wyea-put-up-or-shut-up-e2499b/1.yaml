explicit_source_elements:
  - these pieces aren’t about breakthroughs
  - marketing collateral dressed up as technological progress
  - hollow on the inside
evaluator_interpretation:
  - These pieces means the July 2024 Bloomberg levels report and Reuters Strawberry report discussed in the post.
  - The ordinary factual reading is that the stories promote unverified development claims rather than establish a substantial demonstrated technical advance.
  - Marketing collateral is treated as an assertion about promotional substance, not automatically as an allegation of payment or company authorship.
  - The target period covers the articles and their pre-post updates. Later releases cannot establish what the articles demonstrated at publication.
support_condition: The articles and underlying records establish that their apparent progress claims consisted of promotional plans without a substantiated material capability advance.
contradiction_condition: The reporting and its underlying records substantiate a material demonstrated advance, or establish a factual basis inconsistent with the characterization that the stories were substantively hollow promotion.
measurement_requirements: Separate development plans, attributed demonstration claims, reproducible evidence, and promotional intent. An unpublished result is not automatically nonexistent.
source_requirements: The articles themselves are primary evidence of their contents. Technical records or sourcing records are needed to settle the underlying advance or promotional characterization.
