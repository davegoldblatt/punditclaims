assessment_axis: causal_assessment
explicit_source_elements:
  - doomers, especially those who have screamed that AGI is nigh
  - wanted to slow AI acceleration
  - at least until we could make AI safe
  - instead have only accelerated it
evaluator_interpretation:
  - "The plain reading is that advocacy for restraint backfired: it caused faster AI development or deployment and produced no meaningful slowing."
  - The context concerns the preceding several years through the post date. No exact starting date is supplied.
  - A failed campaign to stop development does not by itself establish that the campaign accelerated development.
  - Safety policies count against the claim only if their adoption and restraining effects can be attributed to the advocacy.
support_condition: Evidence establishes the advocates' intent to slow development, traces faster development or deployment to their advocacy, and supports the claim that the campaign produced no meaningful restraining effects.
contradiction_condition: Credible causal evidence establishes that the advocacy slowed development or deployment, or that its overall effect did not accelerate either.
measurement_requirements: Identify the advocates, the relevant advocacy, and resulting changes in development or deployment decisions. Distinguish actual effects from intentions, publicity, and changes that would have happened anyway.
source_requirements: Contemporaneous advocacy records plus decision records, attributable testimony, or credible causal research. Policy announcements alone cannot establish effects on development speed.
