explicit_source_elements:
  - ripping apart our educational system
  - our information ecosphere
  - flooding the zone
  - nonconsensual deepfake porn
evaluator_interpretation:
  - Ripping apart means widespread, substantial damage to the functioning of education and the information environment, rather than the existence of individual harms.
  - Flooding the zone means large-scale production or dissemination of nonconsensual sexual deepfakes.
  - The conjunction commits to all three components. I assess the state described as of February 23, 2026; later publications may document earlier events.
  - No country is specified. Evidence from individual institutions or jurisdictions cannot alone establish system-wide damage.
support_condition: Evidence establishes substantial, widespread educational and information-system damage caused by generative AI, together with large-scale nonconsensual sexual deepfake production or dissemination.
contradiction_condition: Representative evidence demonstrates that a material component of the asserted widespread damage is absent or materially overstated. Benefits in isolated settings alone would not establish this.
measurement_requirements: Separate learning from assisted task performance, erroneous outputs from measured effects on the information system, and sexualized images from verified nonconsensual pornography. Establish scale and causal contribution.
source_requirements: Original educational studies, information-integrity measurements, image-abuse research, and official investigative findings.
