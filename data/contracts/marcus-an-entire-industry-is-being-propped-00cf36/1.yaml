early_resolution_rule: A documented threshold crossing can contradict the corresponding component immediately. Final cancellation of all relevant equity without a continuing successor interest could support the prediction if a complete history establishes that neither threshold was reached. An IPO delay, a lower valuation or ordinary delisting is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - The 100-times component is expressed as an evaluative judgment rather than an explicit 'never'.
  - IPO price, equity valuation and shareholder return are used somewhat interchangeably.
  - Expected $1 trillion baseline versus the eventual actual IPO valuation.
  - No identified valuation source or accounting basis.
