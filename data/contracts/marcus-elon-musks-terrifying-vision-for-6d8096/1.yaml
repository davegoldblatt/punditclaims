  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Ongoing-state reporting window is supplied by the evaluator.
  - "'Immediately' has no precise deadline."
  - No particular government system or deployment is named.
  - "'Biased' and 'unreliable' have no specified measures."
  - The wording moves between Musk personally and actions by his associates.
  - Treating the claim as only a deployment-plan claim would omit its asserted system defects.
