explicit_source_elements:
  - LLMs
  - aren’t AGI
  - aren’t reliable
evaluator_interpretation:
  - The ordinary reading concerns publicly available LLMs at the time of the post, not every future system based on language models.
  - AGI means broadly human-level cognitive competence across domains. Human-level competence does not require perfection.
  - Not reliable means users cannot generally depend on correct outputs without verification; it does not mean that every task or response fails.
  - For this ongoing capability claim, use the current calendar month through publication, February 1–4, as the reporting window. This is an evaluator-selected window because model capabilities have no standard reporting quarter.
  - Great is an evaluative concession and is not separately scored.
support_condition: Contemporaneous evaluations establish persistent failures that prevent dependable general-purpose use and show that available LLMs fall short of broad human-level cognitive competence.
contradiction_condition: Contemporaneous evaluations establish broad human-level cognitive competence, or dependable general-purpose performance under representative operating conditions.
measurement_requirements: Representative tasks, stated operating conditions, reproducible error measurements, and appropriate human comparisons. Isolated errors do not establish absence of general intelligence.
source_requirements: Independent evaluations and scientific syntheses covering systems available at publication. Expert interpretations must be distinguished from measured outcomes.
