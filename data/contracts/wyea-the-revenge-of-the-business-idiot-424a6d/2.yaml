assessment_axis: historical_observation
explicit_source_elements:
  - the things that they need to happen
  - actual profitability, actual returns on investment
  - actual tangible proof that this is a real thing
  - aren't happening at all
  - '"they" = AI executives such as Pichai, Jassy, Ellison, Musk, Zuckerberg, Nadella'
evaluator_interpretation:
  - "Plain reading: in the AI industry, and specifically the AI businesses run by these executives, there is no actual profit or return being made from AI at all."
  - "\"Aren't happening at all\" is categorical. Clear, reported profit from AI-driven businesses in the period would contradict it."
  - '"Actual tangible proof that this is a real thing" is rhetorical and not separately testable. The test rests on the financial parts (profitability, returns).'
  - He names no period. This is an ongoing state at the post date, so the target period runs from 1 January 2026 to the post date, covering the latest results reported before the post (calendar Q1 2026; NVIDIA's quarter ended April 2026).
  - Company-reported operating income or net income is accepted as the ordinary measure of profitability.
support_condition: Evidence that, in early 2026, AI businesses (AI labs, hyperscaler AI and cloud units, AI hardware sellers) reported no profit or return from AI.
contradiction_condition: Reported profit in early 2026 from businesses whose results the companies attribute to AI, for example cloud segments growing on AI demand, or AI hardware sales.
measurement_requirements: Company-reported segment operating income or net income, linked by the company to AI demand, in the target period.
source_requirements: Earnings releases or filings.
metric_scope:
  company: AI industry (AI businesses of hyperscalers and AI vendors)
  metric: Profitability from AI (operating income / net income)
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-05-26
