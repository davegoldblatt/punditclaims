assessment_axis: historical_observation
explicit_source_elements:
  - actual profitability
  - actual returns on investment
  - actual tangible proof that this is a real thing
  - aren’t happening at all
evaluator_interpretation:
  - "The plain reading is categorical: AI businesses are not producing actual profits, and customers are not realizing positive financial returns from AI."
  - I use January–March 2026, the latest completed common calendar quarter before the May 26 post. This is an evaluator choice because the sentence describes an ongoing state without dates.
  - Relevant profit and return evidence must isolate AI activity and account for the relevant costs. Broad company or cloud profits, revenue growth, and gross productivity savings are insufficient by themselves.
  - The tangible-proof phrase reinforces the financial assertion; I do not create a separate test for whether AI is real.
  - The quote supplies no accounting basis. Under the supplied money-claim rule, unknown basis prevents a supported or contradicted score.
support_condition: Comprehensive, comparable evidence establishes no positive AI-specific profits or realized positive financial returns in the target period. Losses at a few AI labs cannot establish this industry-wide absence.
contradiction_condition: At least one documented AI-specific positive profit or realized positive financial return in the target period refutes the categorical absence, provided company, period, metric, and accounting basis match the contract.
measurement_requirements: Identify the relevant AI business or deployment, realized financial benefits, associated costs, and accounting basis. Distinguish survey perceptions and operational improvements from measured financial returns.
source_requirements: AI-specific financial disclosures or customer records documenting realized returns and costs. Surveys can provide countervailing context but do not automatically establish financial profit.
metric_scope:
  company: AI industry, including AI providers and enterprise adopters
  metric: AI-specific profitability and realized financial return on AI investment
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-03-31
