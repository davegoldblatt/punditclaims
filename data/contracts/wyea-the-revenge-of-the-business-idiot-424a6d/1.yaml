ambiguity_flags:
  - The reference period is evaluator-selected as the latest completed common calendar quarter.
  - The scope of they could emphasize the named technology companies rather than the entire AI industry.
  - Profitability does not specify operating profit, net income, or another accounting measure.
  - Accounting basis is unspecified.
  - Returns on investment could include operational benefits rather than financial returns.
  - Actual tangible proof has no separate measurable definition.
