evaluator_interpretation:
  - This describes capabilities at publication, rather than only the capabilities of models studied in 2023.
  - "Because occupational evaluations have no common reporting quarter, the target period covers the latest evaluation cycle: 2025 through February 17, 2026."
  - Reliably perform means complete tasks to an acceptable professional standard with consistent success, rather than merely assist workers or potentially shorten task duration.
  - Small fraction means a clearly small minority. No numerical cutoff is supplied or imposed.
  - Typical occupations requires coverage representative of occupational tasks, rather than only selected digital projects.
support_condition: Representative evaluations of contemporary frontier systems show reliable completion of only a small share of occupational tasks.
contradiction_condition: Representative evaluations show reliable completion of a broad share of occupational tasks inconsistent with a small minority.
measurement_requirements: Specify the task population, occupational weighting, human assistance, quality threshold and repeatability standard. Exposure estimates and preference comparisons are not interchangeable with reliable task-completion rates.
source_requirements: The cited 2023 papers and primary occupational evaluations of systems available by publication.
