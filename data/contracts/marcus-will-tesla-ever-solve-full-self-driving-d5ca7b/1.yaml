evaluator_interpretation:
  - The plain reading concerns readiness for broadly usable driving without human supervision across ordinary locations and difficult driving conditions.
  - The context distinguishes this ambition from supervised assistance and geographically restricted driverless services. It does not deny that restricted driverless services exist.
  - I treat 'not even close' as a claim of substantial remaining capability gaps, without adding a number of years or a performance threshold.
  - The target is the operational state on June 15, 2022. This is a current capability snapshot, for which no quarterly reporting period applies.
support_condition: Contemporaneous evidence establishes substantial unresolved capability gaps preventing broadly usable, unsupervised driving across the conditions described. Restricted deployment alone establishes limited availability but does not necessarily establish distance from readiness.
contradiction_condition: Contemporaneous evidence establishes that a system could already perform broadly usable, unsupervised driving across the described conditions, or that independently validated capabilities left only minor deployment barriers.
measurement_requirements: Evidence must distinguish demonstrated capability, permitted deployment, and remaining technical limitations. Driverless operation inside a restricted service area is relevant but does not alone settle general readiness.
source_requirements: Contemporaneous regulator records, documented operating capabilities, or independent evaluations. Company accounts may establish claimed operations but require caution when assessing technical readiness.
