assessment_axis: causal_assessment
explicit_source_elements:
  - the architecture underlying Large Language Models
  - inherently unreliable
evaluator_interpretation:
  - Although phrased as an observation, the claim attributes unreliability to architecture, so it is assessed as a causal claim.
  - The plain reading is that the design of general-purpose LLMs itself creates systematic factual errors or inconsistent answers.
  - Ordinary unreliability is stronger than merely failing to guarantee perfect answers to every possible question, but does not mean every answer is wrong.
support_condition: Reproducible studies establish systematic reliability failures and architectural analysis links those failures to the model design, beyond particular datasets, training incentives, or deployment choices.
contradiction_condition: Controlled evidence shows that the alleged systematic failures are removable within the same architecture, or that the proposed architectural explanation is false.
measurement_requirements: Measure factual errors, inconsistency, abstention, and task coverage; distinguish architecture from training data, objectives, prompting, and external safeguards.
source_requirements: Primary reliability experiments and theoretical analyses with their assumptions and limitations stated.
