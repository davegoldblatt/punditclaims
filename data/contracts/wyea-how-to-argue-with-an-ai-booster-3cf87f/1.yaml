early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Architecture could mean the neural network structure or the entire training and generation design.
  - No reliability threshold or task distribution is specified.
  - Inherent could mean a structural tendency or an unavoidable defect under every mitigation.
