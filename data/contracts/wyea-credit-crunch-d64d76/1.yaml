evaluator_interpretation:
  - The firm numerical commitment is an issuance-yield floor of 8% for future debt issued directly by OpenAI or Anthropic.
  - Use original issue yield, accounting for issue price; coupon rate alone is insufficient.
  - Investment-grade status is not an antecedent. The floor is asserted regardless of rating.
  - Supplier, investor and special-purpose-vehicle debt is not automatically debt issued by either lab.
  - The surrounding post-IPO discussion makes the start of the intended issuance scope ambiguous; searches covered future direct issuance under either reading.
support_condition: Observed qualifying issues have original issue yields of at least 8%; a finite set can support those instances but cannot establish the unrestricted future guarantee.
contradiction_condition: A completed qualifying issue by either company has an original issue yield below 8%.
measurement_requirements: Identify the legal issuer, issue date, currency, maturity, issue price, coupon and original issue yield. Distinguish corporate debt, convertible financing, supplier debt and secondary-market yields.
source_requirements: Final offering documents, issuer disclosures or reliable completed-deal pricing records.
