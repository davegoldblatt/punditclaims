evaluator_interpretation:
  - A different operational test is not, by itself, a redefinition.
  - Read 'hinge on' as requiring that Chen's conclusion depends on removing or weakening a previously central requirement.
  - Compare with historical definitions, including the Legg–Hutter and Goertzel traditions named in the context, without assuming a single uncontested historical definition.
  - The target includes the historical definitions and the identified 2026 argument through publication.
support_condition: The complete argument weakens a historically central requirement, and its conclusion that AGI has arrived requires that weakening.
contradiction_condition: The argument retains substantively established historical requirements, and the disagreement concerns whether the evidence satisfies them rather than changing their meaning.
measurement_requirements: Compare definitions, exclusions, tests, and reasoning separately. Establish argumentative dependence rather than merely identifying different terminology.
source_requirements: Complete primary text of Chen et al. and historical primary definitions; summaries alone cannot conclusively establish dependence.
