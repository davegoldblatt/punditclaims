explicit_source_elements:
  - a study from last year from METR
  - despite thinking they were 24% faster
  - LLM coding tools made engineers 19% slower
evaluator_interpretation:
  - The claim reports what a 2025 METR study found. It is supported if that study found developers took about 19% longer with AI tools while believing AI would speed them up by about 24%.
  - "'Engineers' is read as the study's participants (experienced open-source developers), not all engineers. His sentence states the study's result, not a general law."
  - "'Thinking they were 24% faster' is read as the developers' 24% expected speedup. The study separately reports a 20% speedup they believed in after the tasks."
support_condition: METR's 2025 study reports a slowdown of about 19% with AI tools, together with a perceived or expected speedup of about 24%.
contradiction_condition: METR's 2025 study reports a materially different slowdown, a speedup, or no gap between perceived and measured effect.
measurement_requirements: The study's headline completion-time effect and the participants' forecast or perceived speedup.
source_requirements: METR's own publication of the study.
