  - The historical statement about after-hours trading is background to the submitted forecast, not a separately graded claim.
support_condition: No sufficiently definite condition can be set from these words alone. Support would require identifying what further development constitutes 'just the start' without imposing an evaluator-selected stock-price or broader-crisis test.
contradiction_condition: No sufficiently definite contradiction condition follows from the wording. A recovery or a limited decline over an evaluator-selected interval would not disprove an unspecified forecast of further trouble.
measurement_requirements: If the intended claim concerns stock prices, clarification is needed about what pattern of further losses would count. If it concerns broader consequences, those consequences must be identified.
source_requirements: Any clarified price forecast should use dated market records covering the initial after-hours decline and subsequent trading. Broader consequences would require records of the specified events.
