assessment_axis: forecast_outcome
explicit_source_elements:
  - the infrastructure being built and compute commitments being made
  - demands that generative AI and AI compute generate
  - over $2 trillion in annual revenue
  - by 2030
evaluator_interpretation:
  - "This is a conditional necessity claim: financial justification of the referenced buildout requires annual revenue above USD 2 trillion by December 31, 2030. It is not an unconditional prediction that revenue will reach that amount."
  - I read financial justification as covering operating costs, financing costs, and capital recovery over the assets' useful lives. The speaker supplies no required investor return.
  - Annual revenue means realized revenue over a year, not a monthly revenue figure multiplied by twelve.
  - The relevant infrastructure and commitments are those discussed as existing or being built at the post date. Later expansion must be identified separately.
  - The threshold is the author's industry estimate, not a reported accounting result. The industry aggregation must disclose and reconcile payments between AI service providers and compute suppliers.
support_condition: If the referenced buildout is financially justified, realized industry revenue and a defensible cost reconciliation establish that annual revenue above USD 2 trillion was necessary by 2030. Revenue exceeding the threshold alone does not prove necessity.
contradiction_condition: The referenced buildout demonstrably covers its costs and capital recovery while annual revenue remains at or below USD 2 trillion through the deadline.
measurement_requirements: Measure realized annual revenue, asset deployment, operating expenses, financing costs, useful lives, capital recovery, and contractual payments on consistent industry boundaries. Reconcile transactions within the supply chain and distinguish revenue from economic savings.
source_requirements: Industry measurements and financial or contractual records sufficient to test viability. Consultant scenarios may provide context but cannot substitute for the conditional outcome.
metric_scope:
  company: Worldwide generative AI and AI compute industry
  metric: Annual revenue required for financial viability of the referenced infrastructure and commitments
  currency: USD
  units: trillions per year
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2030-01-01
  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: by 2030
horizon_interval:
  start: 2026-06-08
  end: 2030-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires evidence that conclusively establishes the financial-viability antecedent and the revenue necessity or counterexample through the deadline. An industry revenue forecast, investment announcement, or current loss does not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Financial justification has no stated return threshold or asset life.
  - The boundaries of generative AI and AI compute revenue are unspecified.
  - Adding service revenue and upstream compute revenue can count the same spending at multiple stages.
  - By 2030 does not specify whether the threshold must hold during 2030 or in an earlier annual period.
  - The exact set of infrastructure projects and commitments is not enumerated.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
