assessment_axis: forecast_outcome
explicit_source_elements:
  - If Cursor is allowed to die
  - unable to pay a chunk of Anthropic’s revenue
  - the revenue of other providers too
  - bring into question whether it’s possible to build
  - bring into doubt the veracity of investing in this sector
evaluator_interpretation:
  - “Die” means permanent closure of Cursor’s business. An acquisition that continues the business does not meet this condition.
  - The financial consequence means meaningful lost provider revenue attributable to Cursor’s inability to pay. No amount, accounting basis, or measurement period is specified.
  - The broader consequence means public investor or industry commentary explicitly linking Cursor’s failure to doubts about AI application businesses and investment.
  - The claim supplies no deadline or required duration for the broader reaction.
support_condition: Following a documented permanent shutdown, provider records establish meaningful lost payments from Cursor, and public commentary explicitly links that failure to broader doubts about building and investing in generative AI businesses.
contradiction_condition: After the shutdown condition occurs, records establish that Cursor’s payment obligations were fulfilled or assumed without the predicted revenue loss, or sufficiently broad evidence establishes a response inconsistent with the predicted sector-wide doubts.
measurement_requirements: Separate unpaid obligations, lost future sales, and recognized revenue. Identify affected providers and amounts on a consistent accounting basis. Assess the broader response using commentary explicitly attributable to Cursor’s failure.
source_requirements: Closure records, provider disclosures or creditor records, and attributable investor commentary. Acquisition and operating announcements can establish whether the antecedent occurred.
metric_scope:
  company: Anthropic and other model providers serving Cursor
  metric: Revenue lost because Cursor cannot pay following its shutdown
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
