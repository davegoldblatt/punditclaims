condition_status: not_met
early_resolution_rule: Resolve only after documented permanent closure and decisive evidence about the resulting payment losses and broader reaction. Acquisition or continued operation does not settle the hypothetical consequences.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - “Die” is not formally defined.
  - “A chunk” supplies no monetary threshold.
  - Revenue, payment obligations, and cash receipts are not distinguished.
  - The breadth and duration of the predicted doubts are unspecified.
  - No deadline is stated.
  - No accounting basis is supplied.
retrospective_or_prospective: retrospective
