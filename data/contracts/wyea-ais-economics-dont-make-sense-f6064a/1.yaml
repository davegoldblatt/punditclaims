assessment_axis: historical_observation
explicit_source_elements:
  - the monthly subscription model
  - does not make sense
  - for any service connected to a Large Language Model
evaluator_interpretation:
  - The ordinary economic reading is that no LLM-connected service can sustain monthly subscription pricing under actual customer usage.
  - A subscription may include disclosed usage limits. Monthly billing alone does not qualify if customers also pay their actual token consumption.
  - I use January–March 2026, the latest completed calendar quarter before the post, for this ongoing observation.
  - A counterexample must connect subscription revenue to the recurring costs of delivering that service. Company-wide profitability without the relevant pricing and cost breakdown is suggestive but insufficient.
  - No particular company's monetary metric is asserted, so metric_scope is null.
support_condition: Representative service-level financial evidence establishes that monthly subscriptions cannot cover recurring delivery costs under actual usage, with evidence sufficient to justify the universal scope.
contradiction_condition: At least one LLM-connected service demonstrates sustainable positive unit economics from monthly subscriptions during the target period without billing each user's actual token consumption.
measurement_requirements: Match subscription revenue, actual usage, inference costs, hosting, payment processing and recurring support costs for the same service and period. Separate subscriptions from token overages and other revenue.
source_requirements: Prefer company financial disclosures and contemporaneous pricing records. Revenue growth, fundraising and continued availability alone do not establish economic viability.
