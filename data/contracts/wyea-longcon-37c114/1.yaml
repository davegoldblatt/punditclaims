  - making anyone any real money
  - putting aside the hype, bluster and ungodly amounts of money
evaluator_interpretation:
  - The claim reports the result of the author's own search ('I can find no evidence'). It does not commit to a stated fact about a named company.
  - "'Real money' has no stated threshold. In the same passage the author calls Microsoft's $13 billion AI revenue run rate 'pathetic' and 'not profit', so he sets his own bar for 'real', and it is not an ordinary revenue or profit test."
  - "'Anyone' could mean app makers, users or suppliers, and the post does not say which. No ordinary reading gives a test that would not stretch the claim either for him or against him."
support_condition: "Not adjudicable: there is no fixed threshold for 'real money' and no defined set of apps or of who earns the money."
contradiction_condition: Not adjudicable for the same reason. Large reported generative AI revenues exist, but the author explicitly treats revenue without profit as not 'real money'.
