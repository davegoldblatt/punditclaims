explicit_source_elements:
  - Neural networks
  - don’t have a good way
  - acquiring sufficiently general abstractions
  - both familiar and unfamiliar
evaluator_interpretation:
  - The contextual plain reading is that available neural methods lack dependable learned rules that transfer across substantially unfamiliar cases.
  - I do not read this as denying every instance of abstraction or successful generalization.
  - For the ongoing scientific state, I use 2024-01-01 through the 2024-08-01 post, the latest calendar year to date. Older experiments are context.
  - ARC performance is evidence about unfamiliar task solving, not a complete measurement of all abstraction.
support_condition: Representative controlled evaluations show that available methods repeatedly fail to acquire rules that transfer reliably across substantially unfamiliar cases.
contradiction_condition: Available neural training methods demonstrably acquire dependable abstract rules across a sufficiently broad set of unfamiliar cases to rebut the general lack claimed.
measurement_requirements: Separate learned rule transfer from memorization, distinguish neural-only methods from systems using program execution, and test multiple forms of novelty.
source_requirements: Primary abstraction benchmarks, controlled generalization experiments and reproducible demonstrations.
