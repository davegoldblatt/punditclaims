explicit_source_elements:
  - LLMs won’t lead the way
  - AGI
  - new paths
evaluator_interpretation:
  - In context, 'lead the way' means provide the principal technological approach behind the first broadly accepted AGI systems.
  - An LLM-based system may include tools, search, reinforcement learning and other components. Their presence alone does not make it a non-LLM approach.
  - The preceding discussion of GPT-5 and METR supplies reasons for the prediction, not conditional antecedents.
  - There is no stated deadline. I do not substitute ordinary useful or trustworthy software for the contextual destination of AGI.
support_condition: The first independently demonstrated, broadly accepted AGI systems principally depend on a non-LLM approach, with technical evidence showing LLMs were not the leading mechanism.
contradiction_condition: The first independently demonstrated, broadly accepted AGI systems principally depend on LLMs.
measurement_requirements: Establish the AGI achievement and its timing, then examine architecture and component-level evidence sufficient to identify the principal source of capability.
source_requirements: Independent AGI evaluations plus public technical documentation and, where possible, component-removal experiments. Marketing labels and benchmark rankings alone are insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve upon the first independently demonstrated and broadly accepted AGI achievement when technical evidence establishes whether LLMs supplied the principal approach. Leave unresolved if the architecture or attribution remains unclear.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
