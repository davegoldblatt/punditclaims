explicit_source_elements:
  - As of April 27 2026
  - only two buildings are operational and generating revenue
  - the third barely has any IT gear in it
  - I estimate
  - total cost of Stargate Abilene
  - around $52.8 billion
evaluator_interpretation:
  - Assess the complete compound claim, preserving its explicit April 27 date.
  - Operational and generating revenue requires customer service and billing, rather than an externally complete building or an energized shell.
  - Read barely any IT gear as only a small fraction of the third building's intended IT installation; no numerical cutoff was supplied.
  - Read total cost as the completed eight-building campus including IT equipment, rather than construction financing alone.
  - Assess whether the cost estimate has independent support, not merely whether Zitron published that estimate.
support_condition: Dated records establish exactly two revenue-generating buildings on April 27, very limited IT installation in the third, and a reasonably comparable all-in campus estimate near $52.8 billion.
contradiction_condition: Comparable records establish a different operating and billing count, substantial IT installation in the third building, or an all-in cost materially inconsistent with $52.8 billion.
measurement_requirements: Building-level commissioning, customer acceptance, billing, IT inventory, and a cost breakdown including construction and installed equipment.
source_requirements: Prefer Oracle, Crusoe, customer acceptance records, project budgets, and independently documented inspections. Nearby dates and construction-only funding totals are context.
