assessment_axis: historical_observation
explicit_source_elements:
  - this industry is, for the most part, functionally in default
  - the money is running out
  - both data centers and AI startups alike
  - tumbling value of AI stocks
  - will eventually continue
evaluator_interpretation:
  - The ordinary financial reading is widespread inability to meet obligations as they fall due, accompanied by declining available funding among data centers and AI startups.
  - Functionally allows economic payment incapacity without a formal default declaration. Losses or dependence on external financing alone do not establish it.
  - For most part means a predominant share of the industry, but the speaker supplies neither a company population nor a weighting method.
  - For financial conditions, use the latest completed calendar quarter ordinarily reportable before the post, July through September 2026. The overall observation window extends through November 24 because the same sentence describes the recent stock-market episode.
  - The eventual continuation of stock declines is a separate, undated forecast embedded in the observation. It cannot be scored as an already observed outcome.
  - No accounting basis is specified.
support_condition: Representative financial records establish that a predominant share of the relevant industry cannot meet obligations, that funding availability is deteriorating in both named groups, and that the claimed stock declines occurred. Evidence must distinguish actual payment incapacity from ordinary financing dependence.
contradiction_condition: Representative records show that the predominant share can meet obligations and retain adequate funding, or establish that the claimed financial deterioration did not occur. A few solvent firms do not disprove a claim about most of an industry.
measurement_requirements: Define the industry population and weighting; compare unrestricted liquidity and committed financing with obligations due, track payment failures and funding access, and separately measure a consistent AI-equity basket.
source_requirements: Financial statements, debt and payment disclosures, insolvency records, representative industry data, and dated stock-price records.
