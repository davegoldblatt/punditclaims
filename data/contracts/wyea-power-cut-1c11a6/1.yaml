assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft canceling over a gigawatt of data center expansion
  - the most conservative estimate
  - The realistic number is much, much higher.
evaluator_interpretation:
  - The plain reading is that the capacity Microsoft had already abandoned substantially exceeded one gigawatt by March 3, 2025.
  - The surrounding post includes canceled leases, expired letters of intent, abandoned negotiations and land deals. The claim therefore concerns abandoned planned capacity, not exclusively terminated binding leases.
  - The target is the cumulative abandonment described as of publication. Its beginning is unspecified; no arbitrary starting date is imposed.
  - Substantially higher requires a material excess over one gigawatt. The speaker supplied no numerical multiplier.
  - Later reporting can establish earlier cancellations, but cancellations occurring after publication cannot establish this observation.
support_condition: Credible reporting or project records establish a nonduplicated total of abandoned planned capacity substantially above one gigawatt by March 3, 2025.
contradiction_condition: A sufficiently comprehensive accounting establishes that the abandoned capacity by March 3, 2025 was at or below one gigawatt, or exceeded it only marginally.
measurement_requirements: Capacity in MW or GW, with project dates and enough detail to avoid counting the same site under its lease, letter of intent and land agreement. Separate abandoned projects from temporary delays and subsequent cancellations.
source_requirements: Prefer original analyst research, company disclosures and project records. News reporting of analyst findings is acceptable where the underlying research is unavailable, with that limitation stated.
