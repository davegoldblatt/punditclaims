explicit_source_elements:
  - I estimate
  - around $22 billion
  - annual
  - non-OpenAI/Anthropic AI compute demand
  - most of that coming from Jane Street
  - on a much larger scale, NVIDIA renting back its own GPUs
  - this number could be smaller
evaluator_interpretation:
  - Treat this as an approximate market estimate, not a claim of exact expenditure.
  - The context concerns third-party purchases of AI compute capacity. Exclude hardware purchases for self-operated infrastructure and avoid counting the same rented capacity repeatedly through intermediaries.
  - Read annual demand as the contemporary annual purchasing pace, rather than the face value of contracts covering several years.
  - Read 'most' as more than half of the estimated total, with NVIDIA materially larger than Jane Street.
  - "Use July 2026 as the reporting snapshot: the latest financial reporting available before the post includes NVIDIA's quarter ending July 26. This is an annual pace measured at that snapshot, not one month's expenditure."
  - The annual window, aggregation method and tolerance around $22 billion are not supplied.
support_condition: A reconciled estimate puts annual third-party AI compute purchases excluding OpenAI and Anthropic near $22 billion, with Jane Street and NVIDIA together accounting for more than half and NVIDIA materially larger.
contradiction_condition: A comparable reconciled estimate or firm lower bound places annual demand materially outside the claimed approximate magnitude, or demonstrates that the named buyers do not supply the majority or the asserted ranking.
measurement_requirements: Buyer-level annual compute purchases with contract delivery schedules, exclusions for the two labs, treatment of intermediaries, and separation of actual purchases from unused-capacity guarantees. Do not divide contract totals by assumed durations.
source_requirements: Supplier filings and buyer disclosures, supplemented by a transparent market estimate covering omitted providers and purchasers.
