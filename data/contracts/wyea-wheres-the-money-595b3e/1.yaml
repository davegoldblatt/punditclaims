evaluator_interpretation:
  - Assess the factual allegation of deliberate manipulation; the judgment that the conduct is extremely questionable is subjective.
  - Gaming means intentionally choosing or presenting measurements to materially exaggerate user activity or growth.
  - The relevant observation is the latest weekly-user disclosure before the post. Use February 1–24, 2025, to cover that disclosure episode; the underlying seven-day measurement window is unspecified.
  - Failure to provide a definition does not by itself demonstrate manipulation.
  - The opinion and definition caveats qualify the allegation; they are not a future conditional forecast.
support_condition: Contemporaneous records, an audit or independently corroborated reporting show deliberate misleading measurement or presentation behind the February 2025 weekly-user disclosure.
contradiction_condition: Verified methodology and underlying records for that disclosure establish consistent measurement and presentation without the alleged manipulation.
measurement_requirements: The activity threshold, counting unit, reporting window, treatment of duplicate accounts and devices, underlying counts, and evidence about selection or presentation of the published figure.
source_requirements: Contemporaneous correspondence, measurement records or independent investigation. Repetition of the company's headline number is insufficient.
