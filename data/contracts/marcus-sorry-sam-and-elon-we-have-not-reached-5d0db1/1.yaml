assessment_axis: historical_observation
explicit_source_elements:
  - once again
  - employers boast of using AI to reduce head count
  - only to quietly rehire humans
  - If we were, we wouldn’t
evaluator_interpretation:
  - Assess the observable staffing sequence separately from the inference about singularity.
  - The same employers must have publicly linked actual staff reductions to AI and subsequently restored human staffing for work AI was expected to cover.
  - Rehire can mean restoring human roles; it need not mean employing the identical individuals.
  - Quietly means less prominently publicized than the original AI claims, not secret.
  - The immediate context is a late-July report of a renewed pattern. Use July 1–28, 2026 as the current reporting period; earlier episodes are context.
support_condition: Employer records or reliable reporting establish renewed instances of the same employers advertising AI-driven staff reductions and then restoring human staffing because AI did not adequately cover the work.
contradiction_condition: Evidence establishes that the alleged current examples involved no AI-linked reductions, no subsequent restoration of human staffing, or materially different reasons for hiring.
measurement_requirements: Link the original reduction, its stated AI rationale, and subsequent hiring at each employer. Distinguish completed hiring from plans and hiring freezes from staff cuts.
source_requirements: Prefer employer announcements and staffing records; use original reporting when those records are unavailable.
