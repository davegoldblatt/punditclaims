assessment_axis: historical_observation
explicit_source_elements:
  - thanks to readily-available debt
  - started 200GW of projects
  - only started building 5GW of them
  - AI demand that doesn’t exist
  - entirely based on the theoretical sense that maybe it will in the future
evaluator_interpretation:
  - Read 'started projects' as announced or initiated development, distinguished from physical construction.
  - Treat 200 GW and 5 GW as approximate totals for the same project population.
  - Use March 2026, through the post date, as the current-state reporting window. The speaker supplies no tracker date.
  - Read the demand assertion as saying these projects lack existing commercial demand sufficient to underpin their development. Merely showing that some people use AI would not rebut it.
  - The claim also attributes project initiation to accessible debt; capacity totals alone cannot establish that explanation.
support_condition: A contemporaneous, consistently defined project inventory shows approximately 200 GW initiated and approximately 5 GW under construction, with financing and customer records showing that readily available debt enabled projects unsupported by existing commercial demand.
contradiction_condition: Comparable records materially contradict either capacity total, or establish substantial existing commercial demand underpinning the identified project population. Evidence that debt did not enable the projects would contradict the financing explanation.
measurement_requirements: Use one geography, observation date, project population and capacity definition. Separate whole-campus plans from phases under construction, IT load from generation capacity, and AI projects from other data centers. Examine customer commitments separately from ultimate customer profitability.
source_requirements: Dated project-level tracker records, construction records, financing documents and customer contracts. Company announcements can identify customers but cannot independently establish ultimate demand or project viability.
