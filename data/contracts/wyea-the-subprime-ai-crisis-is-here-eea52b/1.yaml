ambiguity_flags:
  - No geography or tracker is specified.
  - The current-state reporting window is an evaluator choice.
  - "'Started projects' does not specify a development milestone."
  - GW may describe IT load, utility capacity or onsite generation.
  - "'Demand that doesn’t exist' could mean absent contracts, inadequate present utilization or economically unsustainable end demand."
