assessment_axis: causal_assessment
explicit_source_elements:
  - now
  - one of the most brittle situations in economic history
  - our markets held up by whether four or five companies will continue to buy chips
  - start losing them money the second they’re installed
evaluator_interpretation:
  - The checkable core is that US equity-market valuations depend materially on continued AI-chip purchases by four or five major buyers, whose installed chips generate negative attributable returns.
  - Use July 18, 2025, the last trading day before the post, for the current-market snapshot. Earlier concentration and financial reports provide context rather than an exact snapshot.
  - For the underlying ongoing buyer economics, January–March 2025 is the latest commonly reported financial quarter before publication.
  - Market concentration is a possible vulnerability indicator, not proof of dependence on a particular spending decision.
  - The historical superlative supplies no ranking measure and cannot be separately established from concentration alone.
support_condition: Evidence identifies the relevant buyers, quantifies the market's dependence on their continued chip purchases, establishes negative attributable chip returns, and supports exceptional historical vulnerability under a defensible comparison.
contradiction_condition: Comparable evidence establishes that the asserted dependence or negative installed-chip economics is false. A rising market alone is insufficient.
measurement_requirements: Buyer-level chip purchases and deployment returns, market exposure to that spending, and a causal analysis separating AI demand from other earnings and macroeconomic drivers. Historical ranking needs a common vulnerability measure.
source_requirements: Prefer company filings, index records and independent causal research. Do not equate direct chip customers with ultimate users or supplier profits with buyer returns.
