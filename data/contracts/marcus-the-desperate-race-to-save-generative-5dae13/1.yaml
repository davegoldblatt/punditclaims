explicit_source_elements:
  - for now
  - they aren’t going anywhere
  - even if some of the commercial purveyors go out of business
  - may eventually be replaced by better technologies
evaluator_interpretation:
  - The forecast concerns continued availability of LLMs as a technology, not survival of every provider.
  - For now supplies no calendar deadline. No fixed duration is added.
  - "Even if is a robustness clause: the forecast asserts persistence whether or not some providers fail. It is not an antecedent that must happen before the basic persistence prediction applies."
  - The possible eventual replacement is a concession, not a separate firm prediction.
support_condition: LLMs remain available throughout the intended near-term period, including any relevant provider exits. The source does not define when that period ends.
contradiction_condition: A verified disappearance of usable LLMs across providers and independently deployable releases occurs within the intended near term.
measurement_requirements: Track actual model availability, including independent deployment. Individual product closures do not establish disappearance of the technology.
source_requirements: Dated release and availability records; broad independent corroboration would be needed for a claim of field-wide disappearance.
