condition_status: not_applicable
early_resolution_rule: Verified field-wide cessation of usable LLM availability in an unambiguously near-term period could decisively contradict the forecast. Continued availability for an evaluator-selected duration cannot conclusively support an undated forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
