explicit_source_elements:
  - data center construction is a debt-funded asset bubble
  - with ruinous consequences
  - AI compute demand does not exist at the scale that it needs to
  - will likely never reach that scale
evaluator_interpretation:
  - "'Asset bubble' is a judgment about future value: assets priced far above what demand will support. Whether it holds can only be known after the fact. The post sets no test, threshold, or deadline for it."
  - "'Ruinous consequences' is a forecast with no deadline and no measure. It says nothing about who would suffer losses, how large they would be, or when."
  - The one checkable piece is that construction is partly debt-funded. That alone is not the claim, and checking it would not test the bubble or the ruin.
  - He frames the sentence as a view people are 'not taking me seriously' about. It reads as his thesis, not as a dated factual report.
support_condition: Not adjudicable as written. Support would need dated evidence of a debt-financed overbuild that collapsed in value and caused large creditor or investor losses. The post gives no deadline or threshold for this.
contradiction_condition: Not adjudicable as written. Contradiction would need a long run of evidence that debt-funded data centers earned enough to service their debt without large losses. No horizon is given for this.
