explicit_source_elements:
  - OpenAI’s expenses to Microsoft
  - $17.2 billion
  - 2025 calendar year
  - $6.047 billion charge related to “cost of revenue”
evaluator_interpretation:
  - The surrounding paragraph supplies calendar 2025 as the period.
  - Expenses means amounts recognized for Microsoft services, without assuming that all were paid in cash during the year.
  - The total should round to $17.2 billion at one decimal place; the cost-of-revenue component should round to $6.047 billion at three decimal places.
  - The cost-of-revenue component is part of the observation, not a conditional forecast.
  - The accounting basis is company_reported because Zitron attributes the amounts to company financial documents.
support_condition: Independently verified 2025 disclosures establish approximately $17.2 billion in total expenses to Microsoft, including approximately $6.047 billion classified as cost of revenue.
contradiction_condition: Comparable disclosures establish that either the total or the cost-of-revenue component differs beyond the stated rounding precision.
measurement_requirements: Use calendar-year expenses to Microsoft, with consistent classifications and no double counting. Do not substitute Microsoft's revenue for a different fiscal year or OpenAI's cash payments.
source_requirements: OpenAI's related-party expense disclosures or independent reporting specifically verifying the total and component.
