ambiguity_flags:
  - "'Ripped off' could refer to unauthorized acquisition, unlawful training, or a moral judgment; this assessment uses unauthorized acquisition."
  - "'A lot' supplies no numerical threshold."
  - The historical period has no explicit beginning.
  - The settlement reference does not distinguish agreement, preliminary approval, final approval, and payment.
