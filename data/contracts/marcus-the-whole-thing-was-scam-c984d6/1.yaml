assessment_axis: historical_observation
explicit_source_elements:
  - The company
  - ripped off a lot of writer’s work
  - per the $1.5B settlement
evaluator_interpretation:
  - The company means Anthropic.
  - The ordinary reading of 'ripped off' is that Anthropic obtained unauthorized copies of many writers' books. It does not require a criminal conviction or establish that all AI training infringes copyright.
  - The settlement reference identifies the Bartz litigation and asserts an approximately $1.5 billion settlement agreement, not that this amount had already been paid.
  - This is principally a copyright-conduct claim. The settlement amount identifies the associated legal resolution, so metric_scope is null.
  - The claim concerns past conduct and its settlement before publication. No beginning date is supplied, so the target period has an unspecified start.
support_condition: Court records establish substantial unauthorized copying of writers' books by Anthropic, and the related litigation produced an approximately $1.5 billion settlement agreement before the post.
contradiction_condition: The records establish that the relevant copying was authorized or did not occur on a substantial scale, or that the cited settlement did not exist or concerned materially different conduct.
measurement_requirements: Distinguish downloaded copies, distinct works, and writers. Distinguish acquiring pirated copies from subsequent training use, and a settlement agreement from an admission or final liability judgment.
source_requirements: Court findings and filed settlement documents. A settlement alone cannot establish the alleged wrongdoing.
