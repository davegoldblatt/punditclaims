  - AI comes with serious risks
evaluator_interpretation:
  - The ordinary contextual reading is that some AI uses pose a demonstrated risk of substantial harm, including unauthorized access, sexual exploitation or physical harm.
  - This does not assert that every AI system is dangerous or that human extinction is imminent.
  - For this ongoing state, use the latest completed calendar quarter before publication, July through September 2026. There is no specified reporting period.
support_condition: Credible evidence from the target period demonstrates an AI-related failure or capability that creates a substantial risk to people, sensitive data or important systems.
contradiction_condition: Strong evidence establishes that the alleged substantial risks are absent or rest on invalid demonstrations. Benefits or low average failure rates alone do not contradict the existence of serious risks.
measurement_requirements: Identify a concrete mechanism and consequential exposure. Distinguish demonstrated risk from speculation and from realized damage.
source_requirements: Prefer independent investigations, documented incidents and primary research.
