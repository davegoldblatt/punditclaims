evaluator_interpretation:
  - The plain reading is that prominent actors substantially changed AGI criteria after February 2023, moving away from general cognitive competence.
  - The comparison runs from the February 2023 definition identified in the post through publication.
  - Different definitions existing simultaneously do not by themselves establish that an actor changed its definition.
  - Mission creep does not require proof of dishonest intent.
support_condition: Dated comparisons establish multiple substantial changes during the target period toward narrower economic criteria or acceptance of existing capabilities.
contradiction_condition: The principal alleged changes demonstrably predate the target period or preserve the relevant cognitive requirements, and a sufficiently broad record establishes continuity rather than substantial change.
measurement_requirements: Compare the wording, dates, authors and purposes of definitions. Distinguish changes from longstanding disagreement and contractual terminology.
source_requirements: Prefer dated original definitions and papers. Identify reporting about private agreements as reporting.
