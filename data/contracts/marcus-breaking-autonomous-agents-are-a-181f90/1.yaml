  - 89.4% of agents showed drift relative to their goals
  - after about 30 steps
  - 94% of agents with some form of memory-augmentation
  - vulnerable to poisoning attacks
evaluator_interpretation:
  - This claim reports the study's findings. It holds if the study reported about 89.4% (nearly 90%) of agents drifting from goals after roughly 30 steps, and 94% of memory-augmented agents vulnerable to poisoning.
  - A reputable news report of the paper's findings counts as evidence when the paper is unavailable.
support_condition: The study, or a reliable report of it, gives roughly 89.4% goal drift after about 30 steps and 94% poisoning vulnerability among memory-augmented agents.
contradiction_condition: The study, or a reliable report of it, gives materially different figures for either statistic, or does not report them.
measurement_requirements: Goal-drift share of about 89.4% at roughly 30 steps; poisoning-vulnerability share of 94% among memory-augmented agents.
source_requirements: Ideally the paper itself. Failing that, reputable news reports of its findings.
