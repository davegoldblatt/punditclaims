assessment_axis: causal_assessment
explicit_source_elements:
  - On the low end
  - over $200 billion dollars worth of expected revenues
  - Microsoft, Google and Amazon
  - in 2027
  - contingent on their ability to raise venture capital or debt
  - continued growth of their businesses
  - growing AI spend from a small subset of customers
  - many of whom are funded by venture capital
evaluator_interpretation:
  - Assess the stated expectations and financing dependency as of the post, not whether realized 2027 revenue ultimately exceeds the threshold.
  - The financial target is combined calendar-2027 supplier revenue attributable to the two labs.
  - Treat the financing and customer-growth clauses as asserted causal dependencies, not antecedents that must first occur before assessment.
  - Read contingent as a material funding requirement, rather than a claim that every revenue dollar must originate in venture capital.
  - "The Azure input is ambiguous: $50 billion combined yields a stated low-end subtotal of $174 billion; $50 billion per lab yields $224 billion. Neither interpretation independently verifies the analyst estimates."
support_condition: Contemporaneous, comparable estimates establish a low-end total above USD 200 billion, and documented funding needs and customer exposures establish the asserted material dependency chain.
contradiction_condition: Comparable source estimates place the low-end total at USD 200 billion or less, or financing and customer records disprove a material link in the asserted chain.
measurement_requirements: Use calendar-year supplier revenue estimates, avoid double counting compute spending and revenue shares, and test financing needs against cash, cash generation, and committed funding. Measure customer concentration and financing status directly.
source_requirements: Original UBS and Barclays research or independently authenticated tables, plus company financing disclosures and representative customer-spending evidence.
