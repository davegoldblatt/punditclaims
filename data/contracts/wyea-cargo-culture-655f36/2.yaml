evaluator_interpretation:
  - The sentence's main point is causal and about market psychology. It says the 'build your own SaaS' story took hold because it confirmed a pro-AI bias, not because of real events. That mechanism has no measure the speaker supplied.
  - "'Nobody' is plainly rhetorical. It means no meaningful trend of replacing whole SAP, Salesforce or Office 365 suites, not literally zero companies. One or two partial examples would not test it fairly."
  - "'Some stocks went up and some stocks went down' is trivially true and adds nothing to test."
support_condition: Not scorable. It would need a measurable test of why investors adopted the story, plus a defined threshold for 'nobody'. The speaker gave neither.
contradiction_condition: Not scorable for the same reasons. A broad, documented trend of large companies replacing whole SAP, Salesforce or Office 365 suites with in-house builds would undercut the premise. Isolated partial cases would not.
