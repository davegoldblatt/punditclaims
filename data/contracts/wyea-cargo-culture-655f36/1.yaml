assessment_axis: causal_assessment
explicit_source_elements:
  - Nobody is actually building their own SAP or Salesforce or Office 365
  - affirms the greater bias of the growth of AI
  - it set in
  - some stocks went up and some stocks went down
evaluator_interpretation:
  - Building one's own Salesforce means developing an internal replacement for the Salesforce functions a company uses. It does not require copying every Salesforce product.
  - A working internal replacement counts; a demonstration or announced intention alone does not.
  - "The causal claim has separate components: absence of actual replacements, influence on stock prices, and an explanation involving pro-AI bias."
  - I assess the narrative and relevant events preceding June 23, 2026. No precise starting date is supplied.
support_condition: Evidence supports the absence of substantive internal replacements and links the narrative's adoption and stock-price effects to pro-AI bias rather than demonstrated replacement activity.
contradiction_condition: A documented substantive internal replacement contradicts the categorical absence claim. Evidence of actual product developments or other identifiable causes also challenges the assertion that the market reaction lacked a factual basis.
measurement_requirements: Identify what software was replaced, whether the replacement was internally developed and operational, and the timing and stated reasons for market reactions.
source_requirements: Prefer company implementation records for replacements. Use contemporaneous market reporting for investor reactions; price movements alone cannot establish investor motives.
