assessment_axis: causal_assessment
explicit_source_elements:
  - generative AI is a dead end
  - due to the limitations of probabilistic models that hallucinate
  - authoritatively state things that aren't true
  - separate to any lack of a core value proposition, training data drought, or unsustainable economics
evaluator_interpretation:
  - The plain reading is that hallucinations impose a fundamental barrier to meaningful progress toward dependable applications.
  - The existence of hallucinations is a premise. Establishing that premise alone does not establish the claimed technological dead end.
  - I assess the asserted causal barrier, rather than imposing an unstated deadline or requiring perfect accuracy on every possible task.
support_condition: Evidence establishes that hallucinations inherent to the relevant models prevent meaningful progress toward dependable applications, including when reasonable mitigations are used.
contradiction_condition: Independent evaluations establish sustained progress toward dependable applications using these models, with evidence that their hallucination risk is controlled sufficiently for those applications.
measurement_requirements: Distinguish model errors from application-level reliability. Measure factual errors, verification requirements and successful task completion under realistic conditions.
source_requirements: Prefer theoretical results with explicit assumptions and independently evaluated deployments. Neither marketing claims nor isolated errors establish the broad causal conclusion.
