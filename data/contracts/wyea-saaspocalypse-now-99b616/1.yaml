early_resolution_rule: A dated, documented causal sequence can settle the combined forecast once AI delivery costs erode relevant providers' profitability and cause substantial comparable-price increases or withdrawals, with the competitive antecedent established. Mere repricing does not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - At some point supplies no deadline.
  - Some does not identify providers or a minimum count.
  - Profitability and AI margins have no specified accounting basis.
  - Vastly supplies no numerical threshold.
  - The competitive condition qualifies the follow-on prediction, not the initial margin-pressure prediction.
  - Treating the sentence as a combined forecast affects its adjudicability.
