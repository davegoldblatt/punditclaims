assessment_axis: causal_assessment
explicit_source_elements:
  - Certainly
  - no commercial product
  - could ever work at a profit
  - if you needed remote operators anything like that often
evaluator_interpretation:
  - In context, commercial product means a driverless transport service.
  - The claim asserts that needing remote help every few miles prevents profitable operation. It is stronger than saying Cruise was losing money.
  - Profit ordinarily means service revenue exceeding its full operating costs. Marcus specifies neither an accounting basis nor how shared development costs should be allocated.
  - Assistance frequency, assistance duration, and employees per vehicle are different measures.
support_condition: Operating evidence establishes that necessary assistance at approximately the reported frequency makes full service costs exceed achievable revenue across the claimed scope.
contradiction_condition: A commercial driverless service earns a documented operating profit while requiring remote human assistance approximately every few miles, with matching financial and assistance measurement periods.
measurement_requirements: Matched service revenue, full operating costs, necessary human interventions per mile, intervention duration, staffing, utilization, and geographic coverage.
source_requirements: Financial disclosures and operational records for the same service and period. Models and company-wide results alone cannot establish service profitability at the specified assistance frequency.
