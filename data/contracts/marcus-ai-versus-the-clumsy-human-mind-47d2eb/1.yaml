assessment_axis: historical_observation
explicit_source_elements:
  - Machines are actually already light years ahead of humans
  - on some variables (like computing floating point arithmetic)
  - yet way behind on others
  - like cognitive flexibility
  - and long-term planning in unusual situations
evaluator_interpretation:
  - "'Machines' means the best available computers and AI systems in 2023."
  - "'Light years ahead' on floating point arithmetic means machine speed and accuracy far beyond a human, which plainly holds if machines perform many orders of magnitude more operations per second."
  - "'Way behind' on cognitive flexibility and on long-term planning in unusual situations means leading AI systems scoring well below humans on tests of novel abstraction and of plan generation in unfamiliar settings."
  - No period is named. I use 2023-01 to the post date of 2023-11-25, the period covered by evaluations of GPT-4-era systems and the November 2023 TOP500 list.
support_condition: 2023 evidence shows machines doing floating point arithmetic at enormous rates, and leading AI systems far below humans on tests of flexible abstraction and planning in novel settings.
contradiction_condition: 2023 evidence shows leading AI systems at or near human level on flexible abstraction or novel planning tasks.
measurement_requirements: Machine floating point throughput, and human-versus-AI comparisons on abstraction tests (for example ARC/ConceptARC) and planning benchmarks.
source_requirements: Benchmark lists, peer-reviewed papers, or preprints from 2023.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2023-01
  end: 2023-11-25
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Way behind' and 'light years ahead' are rhetorical, with no threshold."
  - "'Unusual situations' is not defined. Read as novel or out-of-distribution planning problems."
  - No period is named. 2023 up to the post date was chosen as the most recent period that evaluations could cover.
