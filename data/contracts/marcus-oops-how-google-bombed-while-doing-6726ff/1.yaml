explicit_source_elements:
  - Hallucinations are in their silicon blood
  - a byproduct of the way they compress their inputs
  - losing track of factual relations in the process
  - they = scaled neural network language models
evaluator_interpretation:
  - "Plain reading: hallucination is a built-in tendency of neural language models that comes from how they learn, not a passing bug. One cause is that models compress their training data with some loss, so specific facts and relations get blurred."
  - The claim does not say compression is the only cause. It does not say a model can never be trained to abstain.
  - The claim describes a lasting property of this class of models. It is judged with research published from the post date to the evaluation date.
support_condition: Independent research shows that hallucination is inherent or persistent in neural language models and links it to lossy compression or limited-capacity memorisation of facts.
contradiction_condition: Research shows that hallucination is not tied to how these models store information, for example that it disappears with scale or simple fixes, or that its causes have nothing to do with compression or loss of factual detail.
