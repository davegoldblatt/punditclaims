explicit_source_elements:
  - "generality: the ability to cope with new things"
  - current AI
  - still lacking
evaluator_interpretation:
  - The checkable assertion is that contemporary AI had substantial limitations in handling unfamiliar tasks reliably. The opening statement supplies his meaning of generality.
  - The plain reading allows successful generalization on some tasks. It does not assert that AI cannot solve anything new.
  - Assess the latest publicly evaluated capabilities of systems available before the post on 2023-08-20. This is an as-of observation, not a reporting-period statistic; the source supplies no lower temporal bound, so target_period.start is unspecified.
  - Use controlled tests of unfamiliar rules and conceptual variations as evidence of generalization. No single benchmark defines general intelligence.
support_condition: Contemporary evaluations show substantial, systematic failures to transfer capabilities to unfamiliar task variants or to generalize concepts, including marked gaps against humans where comparable human results exist.
contradiction_condition: Broad contemporary evaluations show reliable adaptation across unfamiliar tasks and conceptual variations, making substantial generalization limitations an inaccurate description of leading AI systems.
measurement_requirements: Identify the tested systems, task variations, prompting and representation conditions. Distinguish generalization failures from isolated mistakes, and consider successful transfer and methodological limitations.
source_requirements: Primary empirical evaluations of systems available by the post date, with evidence published by 2026-10-28. Later systems cannot settle this historical observation.
