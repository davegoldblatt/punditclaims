assessment_axis: forecast_outcome
explicit_source_elements:
  - 70%+ Of Microsoft’s AI Revenue
  - 80%+ Of Its AI GPU Compute Capacity
  - Creating The Illusion Of Growth
  - Will Lose $25 Billion+ In 2026
evaluator_interpretation:
  - "Preserve the compound claim: two historical concentration assertions and a calendar-2026 OpenAI loss forecast."
  - The context calculates the revenue share using Microsoft's January–March 2025 fiscal quarter, while the headline uses present tense. The compute estimate draws on end-2025 capacity. Neither is silently converted into a fiscal-2026 annual observation.
  - For the headline's ongoing-state reading, the latest reporting period before the post is January–March 2026. A historical calculation alone does not establish that current share.
  - Read 'lose' ordinarily as net loss, with cash burn and operating loss treated as separate measures. The monetary forecast is an estimate, not an assertion of a stated GAAP basis.
  - Read 'illusion of growth' as a criticism of customer concentration and durability, not an independently specified allegation that booked revenue was fictitious.
support_condition: Matched-period records establish both stated Microsoft concentration thresholds, and OpenAI's realized calendar-2026 net loss reaches at least $25 billion. Historical and contemporaneous readings must be distinguished.
contradiction_condition: A reliable matched-period record disproves either concentration threshold, or OpenAI's finalized calendar-2026 net loss is below $25 billion. A cash-burn projection cannot establish or contradict net loss.
measurement_requirements: Obtain Microsoft's AI revenue denominator and OpenAI-derived numerator on the same period and recognition basis. Measure OpenAI's allocated share of Microsoft's operational AI GPU capacity without double-counting leased capacity. Obtain full-year OpenAI net loss with any exclusions and noncontrolling interests explained.
source_requirements: Microsoft disclosures or independently verified customer-level records and capacity allocations; OpenAI financial statements or credible independently verified reporting of those statements.
metric_scope:
  company: OpenAI
  metric: Calendar-year net loss
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: In 2026
horizon_interval:
  start: 2026-05-06
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A conclusive matched-period disproof of a historical concentration threshold can contradict the compound claim early. Otherwise, settlement requires finalized full-year loss evidence and verified concentration figures. Interim losses or projected cash burn do not fix full-year net loss.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Compound claim combines historical observations with a forecast.
  - Present-tense headline and historical calculation periods differ.
  - Latest-reporting-period reading would use January–March 2026.
  - GPU capacity allocation, ownership and rented capacity are not fully defined.
  - "'Lose' does not specify net loss, operating loss or cash burn."
  - "'Illusion of growth' supplies no separate causal test."
retrospective_or_prospective: prospective
