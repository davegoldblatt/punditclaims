explicit_source_elements:
  - The thing you pay for
  - is not sustainable at its current price
  - they have no way to fix that problem
  - OpenAI and Anthropic subscriptions
evaluator_interpretation:
  - "Plain reading: at the time of the post, OpenAI's and Anthropic's paid subscriptions (ChatGPT Plus and Pro, Claude Pro and Max) cost more to provide at the service levels sold than they bring in at current prices. The companies also cannot close that gap without raising prices or cutting the service."
  - "Target period: the claim describes the state at the post date (2026-04-14). The most recent public evidence on these economics covers 2025 and early 2026, so the period runs from 2025-01-01 to 2026-04-14. This choice is flagged as an ambiguity."
  - Evidence would come from press-reported or analyst figures, since neither company publishes audited unit economics for its subscriptions.
support_condition: Credible reporting shows that consumer subscriptions lose money per subscriber at current prices (cost to serve above price), with no workable path to fix this other than raising prices or cutting service.
contradiction_condition: Credible reporting shows that consumer subscriptions are profitable per subscriber at current prices, or that the companies made them sustainable without raising prices or cutting service.
measurement_requirements: Subscription-level revenue and cost-to-serve figures, or gross margin for the consumer subscription business specifically, for OpenAI and Anthropic.
source_requirements: Company disclosures or reputable reporting on company financials (for example The Information, Reuters), not the speaker's own writing.
