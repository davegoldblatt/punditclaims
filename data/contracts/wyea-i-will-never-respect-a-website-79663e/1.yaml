explicit_source_elements:
  - not sustainable at its current price
  - they have no way to fix that problem
evaluator_interpretation:
  - The target is the OpenAI and Anthropic subscription service offered at publication.
  - The ordinary reading is that existing prices cannot sustainably cover the costs of preserving the offered service, and that no feasible efficiency improvement can remedy this.
  - I use January through March 2026, the latest completed quarter that could be reported before the post, as the observation period. The claim names no financial reporting period.
  - Company-wide losses do not establish subscription-level losses. Retail API prices do not measure a provider's costs.
  - The words specify no accounting basis, currency, numerical margin, or cost allocation. The accounting basis is therefore unknown, which prevents a supported or contradicted financial score under the stated rules.
  - OpenAI and Anthropic are the scope of the observation, not a conditional antecedent.
support_condition: Comparable subscription revenue and attributable costs show that the offered service cannot cover its costs at existing prices, and credible evidence excludes feasible remedies preserving that price and service.
contradiction_condition: Comparable evidence establishes sustainable subscription economics at the existing price and service level, or demonstrates a feasible remedy to the alleged deficit.
measurement_requirements: Plan-level revenue, actual usage distributions, serving costs, and a disclosed allocation of necessary continuing costs. Keep subscription economics separate from API sales, free users, financing, and company-wide investment.
source_requirements: Provider financial disclosures or independently substantiated cost studies covering the target period and the same service.
