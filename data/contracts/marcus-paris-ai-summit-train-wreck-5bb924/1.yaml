ambiguity_flags:
  - No population or numerical threshold is specified for 'almost everyone'.
  - "'Train wreck' is evaluative language."
  - The ongoing-state observation is anchored to the post date; the context also discusses earlier complaints.
  - The post's publication time is not supplied, so some same-day reactions may have followed it.
  - Widespread criticism and near-universal dissatisfaction are materially different readings.
