assessment_axis: causal_assessment
explicit_source_elements:
  - generalizing beyond a space of training examples
  - “localism” in how neural networks are trained
  - an inherent problem
evaluator_interpretation:
  - I read localism as learning driven by observed examples that does not adequately constrain behavior on substantially different inputs.
  - I read inherent problem as an intrinsic obstacle to reliable generalization, rather than a claim that every neural network must fail on every unfamiliar input.
  - The causal claim requires evidence connecting this training mechanism to the difficulty; performance failures alone are insufficient.
support_condition: Theory and controlled experiments establish that the specified training mechanism systematically impedes extrapolation across relevant neural architectures, while separating its effects from architecture, representation and task difficulty.
contradiction_condition: Theory or controlled interventions establish that the alleged mechanism does not explain the difficulty, or that ordinary neural training reliably removes that obstacle across the claimed scope.
measurement_requirements: Define localism operationally, distinguish distribution shift from merely unseen examples, and compare training procedures while controlling architecture, representation and training coverage.
source_requirements: Primary theoretical research and controlled experiments with stated assumptions.
