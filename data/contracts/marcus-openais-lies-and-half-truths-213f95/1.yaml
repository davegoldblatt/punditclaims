explicit_source_elements:
  - We licensed some
  - took whatever else we could find
  - licensed or not
  - materials to train Sora
  - March 2024
evaluator_interpretation:
  - The claim concerns training of the Sora model discussed by March 15, 2024. The training period has no stated start, so the target period has an unknown start and ends on the post date.
  - The ordinary reading is that OpenAI combined licensed material with copyrighted material collected without licenses. 'Whatever else we could find' describes broad collection without requiring proof that every accessible item was collected.
  - Public availability alone does not establish a material's licensing status. Unlicensed use and unlawful use are separate questions; this assessment does not require a finding of copyright infringement.
support_condition: Reliable disclosures, reporting, or authenticated records establish that the Sora model discussed by March 15, 2024 was trained on both licensed material and copyrighted material obtained without a license.
contradiction_condition: Reliable, sufficiently comprehensive records establish that this Sora model used no licensed material, or that all copyrighted training material was licensed and any remaining material was outside copyright.
measurement_requirements: Evidence must identify actual training use and licensing status for the relevant Sora model. Output resemblance, unanswered interview questions, and allegations alone do not establish both.
source_requirements: Prefer model-specific disclosures, licensing records, authenticated discovery, or court findings. Independent reporting may establish facts when primary records are unavailable. Later publications must clearly concern training completed by the post date.
