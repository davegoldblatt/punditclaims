evaluator_interpretation:
  - This is a model-based estimate, not a reported realized margin for a named operator.
  - I use September 1–29, 2026 for the current cost and model assertions repeated in the post. This does not supply a missing revenue period.
  - The surrounding GPU discussion suggests an equipped AI facility; shell-only construction estimates are not directly comparable.
  - I preserve '$12.10 a megawatt' as written. I do not silently insert million or an annual revenue period.
  - Continuous customer occupancy and no debt are scenario assumptions, not a conditional forecast requiring a subsequent event.
  - Estimate denotes the author's model basis, not GAAP or audited company accounts.
support_condition: Accessible model inputs and reproducible calculations yield approximately $4–5 billion in total cost and the stated margins under the specified occupancy and debt assumptions, with independent evidence supporting comparable inputs.
contradiction_condition: Reproducible calculations or sufficiently comparable independent measurements materially conflict with the stated costs or margins under the same units, cost coverage and scenario assumptions.
measurement_requirements: Specify whether 100MW means IT load or total facility power; identify hardware, land, construction and power costs; specify the revenue period, utilization, depreciation, equipment life and costs included in gross margin.
source_requirements: The complete model is needed to establish definitions and reproduce arithmetic. Independent cost measurements are needed to assess its economic inputs; the author's assertions alone cannot establish correctness.
