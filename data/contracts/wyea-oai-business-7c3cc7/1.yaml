evaluator_interpretation:
  - The ordinary reading is a substantial concentration of departures among senior people responsible for research, technology and products. It does not require most employees to have left.
  - For this ongoing observation, use July–September 2024, the latest completed quarter before publication. Earlier departures provide context only.
  - Relevant responsibilities establish the departing employees' importance. They cannot establish that those particular people were indispensable.
support_condition: Several senior research, technology or product leaders announced departures during the target period, representing a substantial concentration of relevant leadership.
contradiction_condition: Departure records show only isolated departures, departures outside the target period, or departures primarily unrelated to research and product development.
measurement_requirements: Identify departing individuals, announcement dates and responsibilities. Distinguish resignations from temporary leave.
source_requirements: Prefer company or employee announcements; use reputable reporting when the underlying announcement cannot be read directly.
