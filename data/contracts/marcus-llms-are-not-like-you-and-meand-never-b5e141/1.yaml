explicit_source_elements:
  - don’t induce abstract models of the world
  - that they can reliably engage
  - even when those models are given to them
  - the rules of chess
evaluator_interpretation:
  - The ordinary reading concerns dependable application of learned states and rules, including when relevant rules are explicitly supplied.
  - Reliability requires repeated successful application on held-out cases, rather than an isolated correct answer. The source supplies no numerical cutoff.
  - Treat the supplied-rules phrase as an observational test setting, not a conditional forecast.
  - Assess the accumulated capability record through 2025-08-12, with no lower bound supplied by the post.
support_condition: Controlled tests show substantial failures to apply explicitly supplied rules across relevant LLMs, with evidence that these failures reflect inadequate usable representations rather than only arithmetic or interface mistakes.
contradiction_condition: Controlled tests demonstrate that an in-scope LLM learns and repeatedly uses an abstract state-and-rule model on held-out cases, including the supplied-rules setting, without an external system enforcing correct actions.
measurement_requirements: Report supplied rules, model versions, prompts, legality and state-tracking rates, held-out tests, and any retries or external legality filtering. Behavioral success alone does not identify an internal mechanism.
source_requirements: Primary evaluations with reproducible protocols and clear separation of model outputs from tool assistance.
