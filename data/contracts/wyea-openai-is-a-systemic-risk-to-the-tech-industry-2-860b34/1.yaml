assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI loses money
  - on every single user
evaluator_interpretation:
  - The ordinary reading is that revenue attributable to each individual user falls short of the costs attributable to serving that user. A company-wide loss divided by user count does not establish this.
  - Use January through March 2025, the latest completed calendar quarter before publication, for the unspecified ongoing period.
  - Treat the financial basis as an estimate because the surrounding argument relies on reported financial estimates.
  - The statement does not specify how research, training and other shared expenses should be allocated to individual users.
support_condition: Reliable user-level records establish negative attributable profit for every user in the target period. Negative averages for the company or one subscription tier are insufficient.
contradiction_condition: Reliable records identify at least one profitable user, or a profitable user cohort whose consistently measured aggregate profit necessarily implies at least one profitable member, during the target period.
measurement_requirements: Match user revenue with attributable serving costs over the same period. State the treatment of training, overhead, revenue sharing, free users and unused subscriptions.
source_requirements: Prefer company records or documented unit-economics measurements. Executive statements and financial reporting must identify their population and cost definition.
