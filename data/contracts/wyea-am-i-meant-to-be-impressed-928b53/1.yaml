explicit_source_elements:
  - SpaceX funds Cursor for a bit
  - a falling out between Musk and CEO Michael Truell
  - the company either rushes an acquisition or dies
evaluator_interpretation:
  - "The prediction commits to a sequence: temporary financial support, a substantive breakdown between Musk and Truell, then a hurried acquisition or Cursor's shutdown."
  - An acquisition alone does not establish the predicted sequence.
  - A rushed acquisition requires evidence of unusual urgency associated with the falling-out; a short transaction timetable alone is insufficient.
  - No deadline or amount of financial support is specified.
support_condition: Reliable dated records establish all three stages in the stated order, including evidence connecting the falling-out to a hurried acquisition or shutdown.
contradiction_condition: Reliable records establish a terminal disposition of Cursor that precludes the predicted sequence, including affirmative evidence inconsistent with the alleged falling-out and resulting rushed transaction.
measurement_requirements: Distinguish actual financial support from an acquisition option, computing access, or a proposed investment. Establish the relationship breakdown and transaction circumstances independently.
source_requirements: Prefer company disclosures, transaction filings, court records, and attributable reporting. Corporate silence about a dispute cannot establish that none occurred.
