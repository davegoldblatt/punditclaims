explicit_source_elements:
  - for the most part
  - all the major tech companies
  - bigger and bigger LLMs based on more data
  - achieving almost exactly the same results
  - GPT-4 level models
  - all struggling with hallucinations and boneheaded errors
  - hardly any investment in anything else
evaluator_interpretation:
  - The ordinary reading is a claim about the dominant direction of industry work, broadly comparable frontier-model capabilities, persistent errors, and a negligible share of investment in alternative approaches.
  - The qualification 'for the most part' allows exceptions. An isolated alternative project cannot by itself contradict the investment claim.
  - Use July 2024 through publication as the latest publicly observable industry state. This is a current research and product snapshot, rather than a claim about a particular financial quarter.
  - Interpret 'investment' as resources devoted to AI development. Marcus supplies neither a spending definition nor an accounting basis.
  - Do not invent numerical cutoffs for 'almost exactly' or 'hardly any'. A definitive assessment requires evidence strong enough to withstand ordinary variations in those terms.
support_condition: Contemporaneous comparisons show broadly similar frontier capabilities and persistent factual or elementary reasoning errors, while comparable resource-allocation records show that major companies overwhelmingly concentrated AI development on scaling LLMs, with negligible investment elsewhere.
contradiction_condition: Comparable evidence shows substantial, systematic capability differences inconsistent with the claimed clustering, or a material industry-wide share of AI investment in alternative approaches. Exceptions already allowed by 'for the most part' are insufficient alone.
measurement_requirements: Comparable model evaluations, including error measurements, and a consistent breakdown of AI development spending or resources by approach across major companies. Aggregate capital expenditure and counts of research announcements cannot establish the allocation share.
source_requirements: Primary model evaluations and company resource-allocation disclosures, supplemented where available by independent measurements covering the same models and period.
