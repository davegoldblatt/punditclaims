assessment_axis: forecast_outcome
explicit_source_elements:
  - LLMs will know everything you say
  - be in perfect position to use that knowledge
  - to talk you into almost anything
  - (context) via always-worn gadgets like the necklace
evaluator_interpretation:
  - "Read as a forecast with no deadline: LLM-powered always-on gadgets will capture essentially all of a user's speech, and LLMs will use that knowledge to persuade users across nearly any decision."
  - "'Perfect position' and 'almost anything' are rhetorical. A fair test needs widely deployed devices capturing all of a user's speech, plus evidence of broad, effective persuasion using that data."
support_condition: Widely used LLM devices or services capture essentially all of a user's speech, and studies or documented cases show LLMs using that knowledge to persuade users across a wide range of decisions.
contradiction_condition: Hard to establish for an open-ended forecast. Strong evidence that deployed LLMs with full personal context have only narrow or weak persuasive effects would count against it.
measurement_requirements: Deployment data on always-on capture; persuasion studies using LLMs with rich personal context.
source_requirements: Product documentation, independent testing, peer-reviewed persuasion research.
