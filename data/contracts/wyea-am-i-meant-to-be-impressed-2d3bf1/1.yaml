evaluator_interpretation:
  - The referenced line items are actual AI revenues, including product or service detail such as Azure AI compute.
  - Use the latest reportable quarter before the post, January–March 2026, for the alleged internal schedules and corresponding disclosure practice.
  - The claim requires both complete internal itemization and a deliberate decision not to disclose equivalent detail.
  - Publication of an aggregate run rate neither supplies complete quarterly line items nor proves that complete internal schedules exist.
  - This is not a conditional forecast; the claimed existence and nondisclosure are factual components.
support_condition: Authenticated internal revenue schedules establish the claimed itemization, and records or attributable testimony establish a deliberate decision to withhold that detail from public disclosure.
contradiction_condition: Authenticated records establish that the alleged itemization did not exist, or contemporaneous public disclosures provide the complete equivalent detail.
