explicit_source_elements:
  - GPT-4
  - can’t even play a good game of chess
  - about as good as chess computers from 1978
evaluator_interpretation:
  - The target is the original publicly available GPT-4 during March 2023 through the post date, using the latest completed month and current partial month.
  - Playing a good game means sustained competent, legal play across complete games, rather than answering isolated chess puzzles.
  - The ordinary comparison concerns GPT-4 choosing moves without a separate chess engine.
  - About as good requires broadly comparable playing strength under comparable conditions. Marcus supplies neither a particular 1978 machine nor a tolerance.
support_condition: Reproducible tests of the contemporary GPT-4 show weak full-game play and establish approximate parity with identified, representative 1978 chess computers under comparable conditions.
contradiction_condition: Reliable contemporary tests establish sustained competent full-game play materially stronger than representative 1978 computers, or otherwise clearly refute a specified component.
measurement_requirements: Identify model version, prompts, move-history or board-state assistance, handling of illegal moves, opponents, sample size, time controls, and rating pool. Do not transfer GPT-3.5 ratings to GPT-4.
source_requirements: Original game records or reproducible evaluations, plus documented performance of the historical comparison systems.
