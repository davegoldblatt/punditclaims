evaluator_interpretation:
  - The plain reading is that contemporary coding agents do not generally replace skilled engineering oversight across software creation, maintenance, and operational safeguards.
  - This does not deny that agents can complete substantial individual tasks autonomously.
  - Use April 1–27, 2026, the current month through publication, for the ongoing capability claim.
  - Assess the sufficiency claim, not whether Amodei intended the position Marcus attributes to him.
support_condition: Contemporary evaluations and deployment records show material engineering tasks or operational failures that agents do not reliably handle without human engineering support.
contradiction_condition: Representative production deployments and evaluations establish that agents alone reliably perform architecture, implementation, maintenance, and operational safeguards across ordinary software work.
measurement_requirements: Distinguish bounded task completion from full software lifecycle responsibility. Identify human setup, review, recovery, and maintenance.
source_requirements: Prefer contemporary evaluations, deployment records, and firsthand incident accounts; retain evidence of successful autonomous work.
