assessment_axis: causal_assessment
explicit_source_elements:
  - Companies incentivizing the amount of tokens you burn
  - guaranteeing
  - poorly-written and maintained
evaluator_interpretation:
  - The claim concerns rewarding token consumption, rather than merely providing AI coding tools.
  - The ordinary reading of 'guaranteeing' is that these incentives necessarily produce poor software quality and maintenance.
  - Poor quality means material defects, reliability problems or maintainability problems assessed against ordinary engineering standards.
support_condition: Audits and credible causal comparisons establish that rewarding token consumption necessarily produces poor code and maintenance. Examples of defective AI-generated code alone are insufficient.
contradiction_condition: A documented company rewards token consumption while independently verified software quality and maintenance remain good, providing a counterexample to the guarantee.
measurement_requirements: Verify the incentive policy, measure defects and maintenance over time, and distinguish the policy's effects from staffing, review practices, project complexity and ordinary AI adoption.
source_requirements: Prefer independent audits, repository measurements and documented incentive policies. Commentary and employee impressions can provide context but cannot establish inevitability.
