explicit_source_elements:
  - headed for perdition
  - leaving its counterparties unpaid
evaluator_interpretation:
  - Assess the specified forecast of collapse and unpaid counterparties, not the separate historical assertion about economic instability.
  - The plain reading is business failure that leaves counterparties with unpaid contractual obligations.
  - No deadline is stated for collapse. The surrounding financial projections do not establish a definite collapse deadline.
support_condition: Documented business failure accompanied by unpaid counterparty obligations attributable to that failure.
contradiction_condition: A completed terminal resolution of OpenAI's business and obligations that establishes that counterparties were paid in full. Continued operation or another financing round alone cannot contradict an unlimited-horizon forecast.
measurement_requirements: Distinguish business failure from a temporary outage, operating losses, restructuring without default, or acquisition with obligations honored.
source_requirements: Court records, insolvency documents, creditor disclosures, or company filings establishing failure and the disposition of contractual obligations.
