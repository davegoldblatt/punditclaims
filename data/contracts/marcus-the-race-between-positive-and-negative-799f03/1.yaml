  - OpenAI
  - asked the British goverment
  - exempt them from copyright laws
evaluator_interpretation:
  - In context, an exemption means permission to train on copyrighted works without the ordinary licensing requirement, not necessarily immunity from every copyright obligation.
  - A claim that existing law already permits training is distinguishable from a request to change or waive the law.
  - The target is the recent pre-post UK policy engagement described by the sentence, covering 2023 through publication.
  - Brazenly and the attributed desire for all gain at no cost are evaluative language, not independently scored factual commitments.
support_condition: A pre-post OpenAI submission or statement to UK authorities requests a copyright exemption or equivalent relaxation for model training.
contradiction_condition: The relevant request is affirmatively shown to have a materially different purpose, or a sufficiently complete record establishes that the attributed exemption request was not made.
measurement_requirements: Identify the requested legal change, recipient and date. Do not substitute later lobbying for an earlier request.
source_requirements: Prefer the full submission or official record; distinguish OpenAI's legal position from a reporter's characterization.
