explicit_source_elements:
  - only possible because
  - both Anthropic and OpenAI
  - subsidize the compute of their subscribers
  - $3 to $15 for every dollar of subscription revenue
evaluator_interpretation:
  - The ordinary reading concerns actual subscriber-serving compute costs compared with actual subscription revenue at each company.
  - Use January–March 2026, the latest completed quarter before the post, for the ongoing subsidy and growth claim.
  - Read the stated range as compute expenditure per subscription dollar, while flagging that 'burn' could instead mean losses after revenue.
  - API retail prices are not the companies' compute costs. Heavy-user maximum allowances are not average realized subscriber costs.
  - "'Only possible' asserts that subsidies were necessary for the fast growth, not merely that subsidies and growth occurred together."
support_condition: Matched subscription revenue and subscriber compute costs establish the stated range at both companies, and credible causal evidence shows that comparable fast growth could not have occurred without those subsidies.
contradiction_condition: Matched figures place either company's relevant ratio outside the claimed range, or credible evidence demonstrates comparable fast growth without subscriber compute subsidies.
measurement_requirements: Company-specific realized subscription revenue, attributable inference compute costs, utilization distributions, and growth responses to price or usage-limit changes. Exclude free users, API revenue, and research spending unless explicitly allocated and justified.
source_requirements: Segment disclosures or transparent, independently validated cost estimates; a credible experimental or observational design for the growth counterfactual.
