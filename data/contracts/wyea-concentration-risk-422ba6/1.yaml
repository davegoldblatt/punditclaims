assessment_axis: forecast_outcome
explicit_source_elements:
  - start happening next year
  - get dramatically worse
  - month after month
  - as capacity comes online
evaluator_interpretation:
  - Next year means calendar 2027.
  - In context, start happening means substantial new obligations coming due at scale, not the first compute payment either company has ever made.
  - Read worse as a substantial increase in monthly compute payment obligations, without requiring bankruptcy or default.
  - Read month after month as sustained monthly escalation during the deployment ramp, not merely an increase in the annual total.
  - As capacity comes online describes the predicted timing and mechanism, rather than a separate if-clause excusing the forecast if deployment does not occur.
  - The speaker gives no numerical definition of substantial or dramatic; retain that ambiguity rather than inventing a percentage.
support_condition: Records for 2027 show substantial new compute obligations beginning for both labs and sustained monthly increases associated with commissioning capacity.
contradiction_condition: Complete 2027 records show no substantial onset of the described obligations, or a payment trajectory inconsistent with sustained monthly escalation despite the relevant capacity being commissioned.
measurement_requirements: Monthly payment obligations and commissioning dates for the relevant contracts, with existing spending, deposits, financing, and new capacity payments distinguished.
source_requirements: Executed payment schedules, invoices, filings, and commissioning records; announcements of expected capacity alone cannot establish payment outcomes.
metric_scope:
  company: OpenAI and Anthropic
  metric: Monthly payments due on newly commissioned compute commitments
  currency: USD
  units: dollars per month
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2027-01-01
  period_end: 2027-12-31
  stock_or_flow: flow
  annualized_or_realized: not_applicable
  gross_or_net: gross
original_horizon: next year
horizon_interval:
  start: 2026-09-08
  end: 2027-12-31
  precision: day
target_period:
  start: "2027"
  end: "2027"
  precision: year
condition_status: not_applicable
early_resolution_rule: Early contradiction requires a documented irreversible event that makes the forecast impossible, such as termination of all relevant agreements without replacement. Capacity announcements, existing payments, or partial cancellations do not suffice. Early support requires the actual onset and sustained monthly escalation, which cannot be observed before 2027.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - That refers to the preceding discussion of new capacity-related payments.
  - Substantial and dramatic have no numerical thresholds.
  - Month after month may describe a sustained trend rather than strict monotonic growth.
  - The payment measure and accounting basis are unstated.
  - As capacity comes online is interpreted as a predicted mechanism rather than an independent conditional antecedent.
retrospective_or_prospective: prospective
