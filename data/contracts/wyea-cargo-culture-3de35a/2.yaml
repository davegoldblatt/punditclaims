assessment_axis: historical_observation
explicit_source_elements:
  - Neither Anthropic nor OpenAI are actually startups
  - enough money and clout to hire just about anybody
  - can deploy billions of dollars in stock for acquisitions
  - have their infrastructure fully paid for by other companies
  - effectively nobody else can train models or serve inference at their scale
  - functional equivalent of a hyperscaler
evaluator_interpretation:
  - This describes the two labs' standing up to the post. The speaker's own context covers 'the space of two years', so the target period is July 2024 to the post date. I flag this choice.
  - "'Effectively nobody else' is read as nobody outside the hyperscalers (Google, Microsoft, Amazon), since he calls the labs hyperscaler-equivalents funded by those firms. Hyperscalers are not counterexamples."
  - "'Fully paid for by other companies' is read as: the labs do not fund their own data-center build-out, and the capital comes from partners such as Microsoft, Amazon, Google and Oracle. A large self-funded build-out commitment by either lab would contradict this."
  - "'Hire just about anybody' and 'functional equivalent of a hyperscaler' are characterizations and are not scored on their own."
  - The claim has several parts, so mixed is possible if some parts hold and others fail.
support_condition: Evidence that the labs used billions of dollars in stock for acquisitions, that their compute capacity was built and financed by other companies, and that no non-hyperscaler trained or served models at comparable scale.
contradiction_condition: Evidence that either lab committed its own large sums to building its own data centers, or that a non-hyperscaler (such as xAI) trained models at comparable scale. Evidence that neither lab could do stock acquisitions in the billions would also contradict it.
measurement_requirements: Deal terms for acquisitions (stock or cash, size). Who funds data-center capex for each lab. Training-cluster capacity of non-hyperscaler rivals compared with the labs.
source_requirements: Company announcements, filings, or reputable news reports. Vendor blogs and unsourced comparisons are context only.
