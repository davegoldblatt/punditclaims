assessment_axis: historical_observation
explicit_source_elements:
  - hire just about anybody
  - billions of dollars in stock for acquisitions
  - infrastructure fully paid for by other companies
  - effectively nobody else can train models or serve inference at their scale
  - because it’s taken so much money
  - functional equivalent of a hyperscaler
evaluator_interpretation:
  - Read hiring language as exceptional recruiting resources, not the ability to compel any individual to join.
  - Distinguish other companies financing and owning physical infrastructure from providing cloud services without charging the labs.
  - Read nobody else as including other major AI developers; the passage supplies no explicit exception for Google, Meta, or xAI.
  - Comparable scale requires operating training capacity or inference throughput, rather than model benchmark scores alone.
  - For the ongoing observation, use January–March 2026, the latest completed quarter public reporting could cover before the post. Later announcements and older installations remain context unless their state in this quarter is established.
  - Assess the capital-cost explanation separately from the existence of large resources. Neither alone establishes that competing at comparable scale is impossible.
support_condition: Evidence establishes the stated recruiting and acquisition resources, comprehensive third-party infrastructure funding, and the absence of material competitors at comparable operating scale, with evidence connecting that absence to capital requirements.
contradiction_condition: Comparable records establish a material rival operating at similar scale, material infrastructure costs not covered as claimed, or another directly false factual component. Support for some components and contradiction of others should be identified separately.
measurement_requirements: Company-specific financing and acquisition records; allocation of infrastructure ownership, capital costs, and service charges; comparable deployed training capacity and inference throughput; evidence supporting the alleged entry barrier.
source_requirements: Prefer executed agreements, company disclosures, filings, and independently measured capacity. Funding announcements alone do not prove that all infrastructure is paid for.
metric_scope:
  company: OpenAI and Anthropic, each separately
  metric: financial resources, acquisition-stock capacity, and third-party funding of infrastructure
  currency: USD
  units: billions and proportion funded
