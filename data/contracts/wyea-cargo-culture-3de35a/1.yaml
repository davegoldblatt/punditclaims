ambiguity_flags:
  - The latest completed reporting quarter is an evaluator-selected period for an ongoing statement.
  - Fully paid for could refer to infrastructure construction, cloud-service bills, or the ultimate source of financing.
  - Scale has no common quantitative measure.
  - The scope of nobody else is unspecified.
  - Hyperscaler is a functional analogy without stated requirements.
  - The financial clauses have no identified accounting basis.
