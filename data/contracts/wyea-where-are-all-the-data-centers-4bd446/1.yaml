assessment_axis: forecast_outcome
explicit_source_elements:
  - Anthropic
  - suggests
  - limits of its capacity
  - will continue to do so
  - as long as it continues to subsidize its users
evaluator_interpretation:
  - The tentative statement about current capacity is background to a conditional forecast of continuing constraints.
  - Capacity constraints mean insufficient compute to meet customer demand, demonstrated by restrictions attributed to compute shortages. Ordinary commercial usage limits alone are insufficient.
  - Following the subscription context, subsidizing users means subscription receipts fail to cover the costs of serving those subscribers. Discounts from API prices do not establish this.
  - No deadline is supplied.
support_condition: Evidence establishes subscription subsidies and capacity constraints throughout the ensuing subsidy period. An ongoing sequence of shortages can support the prediction provisionally but cannot settle its indefinite continuation.
contradiction_condition: Reliable evidence establishes that capacity constraints ceased while subscriptions remained subsidized.
measurement_requirements: Matched subscription receipts and serving costs, together with dated capacity availability, demand, and explanations for service restrictions.
source_requirements: Company disclosures or independently documented subscription economics and capacity conditions. Neither company-wide losses nor API-equivalent subscription value establishes subscription losses.
metric_scope:
  company: Anthropic
  metric: Subscription receipts less subscriber-serving costs, as the forecast's condition
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A documented end to binding capacity constraints while subsidies continue would contradict persistence. Support requires a completed subsidy period with evidence that constraints persisted throughout it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Subsidize could mean below serving cost, below API prices, or free access.
  - No duration or severity threshold for capacity constraints is given.
  - The current-capacity clause is explicitly tentative.
  - The accounting basis for subsidies is unspecified.
retrospective_or_prospective: retrospective
