explicit_source_elements:
  - The US
  - has done almost nothing legislatively
  - about the risks of AI
  - aside from deepfake porn
evaluator_interpretation:
  - Read 'the US' primarily as the federal government, consistent with the screening questions. The words could also encompass state governments.
  - Read 'almost nothing' as very limited substantive legislative protection, not literally zero enactments.
  - Count enacted requirements addressing AI risks, including government procurement and use. Exclude executive orders, voluntary commitments, proposed bills, and deepfake-pornography provisions.
  - The claim concerns the cumulative legislative record through the post date. No starting date is supplied.
support_condition: The enacted federal record outside deepfake pornography contains only isolated, narrowly scoped AI-risk protections.
contradiction_condition: The enacted federal record contains substantial protections addressing AI risks across multiple important activities, even without a comprehensive AI law.
measurement_requirements: Examine the coverage and obligations of enacted laws. Bill counts alone cannot establish whether legislative protection was negligible.
source_requirements: Enacted statutory text and authoritative legislative inventories distinguishing laws from proposals and executive actions.
