  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: "No early resolution from a partial-year figure: subsequent cash generation could change full-year net burn. Resolve using the completed calendar-year result."
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
