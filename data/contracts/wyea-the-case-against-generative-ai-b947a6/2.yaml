assessment_axis: forecast_outcome
explicit_source_elements:
  - burn $8 billion or more in 2025
  - if my estimates are right
  - nearly a trillion dollars by 2030
evaluator_interpretation:
  - The firm, scored forecast is at least USD 8 billion of cash burn during calendar 2025.
  - Burn means net cash consumed by the business, not gross expenditure, financing raised, annualized revenue, or accounting net loss.
  - The 2030 amount is expressly qualified by if my estimates are right. It is a hedged estimate and is excluded from the scored forecast, preserving the caveat's effect.
  - The caveat is not an independently observable antecedent whose occurrence can be tested. No conditional-forecast score is assigned to the 2030 estimate.
  - The surrounding illusion-of-demand characterization is not part of the supplied normalized monetary forecast being scored.
  - Amounts are assessed at the precision of credible financial reporting; no unreported decimal precision is invented.
support_condition: Reliable reporting of realized calendar-2025 net cash burn of USD 8 billion or more.
contradiction_condition: Reliable reporting of realized calendar-2025 net cash burn below USD 8 billion.
measurement_requirements: Use the full calendar year and net cash burn. Do not substitute an earlier budget, gross compute spending, accounting loss, or future spending commitment.
source_requirements: Prefer a cash-flow disclosure. If no primary disclosure is available, use reputable reporting explicitly describing the realized 2025 result and retain its attribution and precision limitations.
metric_scope:
  company: OpenAI
  metric: Annual net cash burn
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
