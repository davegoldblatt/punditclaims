assessment_axis: forecast_outcome
explicit_source_elements:
  - burn $8 billion or more in 2025
  - if my estimates are right
  - nearly a trillion dollars by 2030
evaluator_interpretation:
  - Burn means net cash consumed, rather than revenue, accounting losses, gross spending or announced commitments.
  - "The statement contains two tests: calendar-year 2025 cash burn and cumulative cash burn through December 31, 2030. Both must hold to support the whole claim."
  - I read the cumulative window as 2025–2030, but its starting date is not explicit. The single metric_scope describes that combined window.
  - "'If my estimates are right' expresses uncertainty about the estimate. It is not an independently observable antecedent that must occur before the forecast can be tested."
  - "'Nearly' supplies no numerical tolerance. I do not impose one while the deadline remains outstanding."
support_condition: Comparable actual cash-flow evidence establishes at least $8 billion burned in 2025 and cumulative burn close to $1 trillion by the end of 2030.
contradiction_condition: Comparable actual evidence establishes less than $8 billion burned in 2025, or completed-period cumulative burn clearly inconsistent with nearly $1 trillion.
measurement_requirements: Keep net cash burn separate from accounting losses, inference costs, infrastructure commitments and gross compute expenditure. Resolve the cumulative starting date and tolerance before scoring the 2030 amount.
source_requirements: Prefer company cash-flow disclosures. Explicitly attributed financial reporting may establish an estimated figure when public company accounts are unavailable.
metric_scope:
  company: OpenAI
  metric: Net cash burn
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: in 2025; by 2030
