target_period: null
condition_status: not_applicable
early_resolution_rule: A definitive full-year 2025 cash-burn result below $8 billion would contradict the conjunction early. Support requires both periods to be established; revised forecasts and spending commitments cannot settle actual cumulative burn.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
