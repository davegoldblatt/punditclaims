explicit_source_elements:
  - October loan payments
  - will crush the life out of the company
evaluator_interpretation:
  - The company is CoreWeave and October means October 2025.
  - October dates the payments. The sentence supplies no deadline for the resulting harm.
  - The ordinary reading is financial collapse or severe financial distress materially caused by those payment obligations, rather than merely interest expense, losses or a falling share price.
  - This is an unconditional prediction about asserted obligations, not an if-then forecast.
support_condition: Dated records establish collapse or severe financial distress and materially connect it to the loan payments identified as due in October 2025.
contradiction_condition: A decisive record establishes that the identified payment burden was fully discharged or extinguished without the predicted distress or continuing consequences capable of producing it. Continued operation alone is insufficient.
measurement_requirements: Identify the obligations, actual payment or amendment history, distress events and causal connection. Distinguish ordinary refinancing from distressed restructuring.
source_requirements: Debt agreements, filings, court records and reliable reporting available by October 28, 2026.
