evaluator_interpretation:
  - October means October 2025, the next October after publication.
  - "The ordinary reading is severe financial distress caused by those payments: default, a distressed restructuring, or a material inability to continue normal operations. Continued losses alone do not meet that standard."
  - I treat October 31 as the deadline, while flagging that October explicitly dates the payments rather than the resulting harm.
  - The linked earlier article identifies DDTL repayments and describes its payment calculations as estimates. That establishes the forecast's basis, not its accuracy.
support_condition: Dated records establish that October 2025 loan payments caused default, a distressed restructuring, or a material inability to continue normal operations by the deadline.
contradiction_condition: Records covering the October obligations establish that they were met or ordinarily refinanced without the predicted severe distress, or that the identified payment shock was removed without such distress.
measurement_requirements: Identify the relevant facilities, their actual October payment schedules, amendments, payments, liquidity consequences, and any distress attributable to those payments. Distinguish ordinary refinancing from distressed restructuring.
source_requirements: Credit agreements, amendments, lender notices, court records, and company financial disclosures. Later reporting must identify when the underlying event occurred.
