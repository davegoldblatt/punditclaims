condition_status: not_applicable
early_resolution_rule: A dated, independently established achievement of broadly human-level general intelligence would contradict the forecast immediately.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AGI is undefined and placed in scare quotes.
  - No deadline is supplied.
  - There is no universally accepted empirical test or human-performance threshold.
