assessment_axis: forecast_outcome
explicit_source_elements:
  - “AGI”
  - isn’t coming
evaluator_interpretation:
  - The ordinary reading is broadly human-level general intellectual capability across varied, unfamiliar tasks.
  - A company declaration or saturation of one benchmark is insufficient to establish AGI.
  - No deadline is stated. Failure to establish AGI by October 28, 2026 cannot support an indefinite prediction that it will not arrive.
support_condition: An indefinite no-arrival forecast cannot be supported by non-arrival to date; support would require decisive evidence excluding the eventual development of systems meeting the stated general-capability criterion.
contradiction_condition: A system is publicly demonstrated through broad, reproducible independent evaluations to possess human-level general intellectual capability, with substantial recognition by independent experts.
measurement_requirements: Assess breadth, transfer to unfamiliar tasks and human-relative performance across domains. Do not aggregate different systems' accomplishments into one system's general capability.
source_requirements: Independent reproducible evaluations and broad expert assessment are required; vendor declarations and narrow benchmark scores are insufficient.
