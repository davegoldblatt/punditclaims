explicit_source_elements:
  - GPT often fails
  - problems involving theory of mind
evaluator_interpretation:
  - The context concerns the GPT-3 family, including systems then described as GPT-3.5 and ChatGPT, rather than every subsequent GPT model.
  - The plain reading of 'often' is recurring, substantive failures across theory-of-mind problems or ordinary variations. It does not necessarily mean failure on most questions.
  - The target period is February 2023, as of the February 17 post. This is the latest contemporary evaluation period, rather than a formal reporting quarter.
support_condition: Contemporary independent testing documents recurring failures across several theory-of-mind tasks or meaningful variations.
contradiction_condition: Comparable contemporary testing establishes reliable performance across those tasks and variations, and shows that the reported failures were mistaken or invalid.
measurement_requirements: Identify the model generation, task wording, expected answer and observed response. Distinguish selected failure examples from an estimate of the overall failure rate.
source_requirements: Independent experimental reports or authenticated contemporaneous transcripts. The speaker's own examples cannot independently establish the claim.
