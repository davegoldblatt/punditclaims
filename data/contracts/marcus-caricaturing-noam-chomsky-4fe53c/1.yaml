evaluator_interpretation:
  - "Plain reading: for LLMs of the time, correct outputs almost never come from the same internal abstractions (rules, algorithms, representations) that humans or symbolic programs use for the same task."
  - "Target period: LLMs as studied in the roughly 14 months before the post (2022-01 to 2023-03-12). This is my choice, because the claim describes a present state without naming a period."
support_condition: Interpretability or generalization studies of contemporary LLMs show that correct outputs usually rest on surface patterns or frequency effects rather than human-like or symbolic abstractions, with little or no counterexample.
contradiction_condition: Studies of contemporary LLMs show that, on a substantial range of tasks, their correct outputs rest on internal representations matching human or symbolic abstractions.
measurement_requirements: Some measure of how often correct LLM outputs rest on human-like or symbolic abstractions, across tasks.
source_requirements: Peer-reviewed or preprint interpretability and generalization studies of LLMs published by the post date.
