assessment_axis: historical_observation
explicit_source_elements:
  - I estimate
  - $2 for every $1 of capex
  - This revenue must also be brand spanking new
  - this capex is only for AI
evaluator_interpretation:
  - The ordinary reading is an estimated revenue requirement for recovering AI capital spending and associated costs, not merely a claim that Zitron made an estimate.
  - I estimate is a qualification of precision, not a conditional antecedent.
  - The estimate is treated as approximately two dollars of incremental revenue per dollar of AI capital spending. No recovery deadline or margin assumption is supplied.
  - Use July through September 2025 as the latest pre-post reporting period for testing the asserted current economics. This does not impose a one-quarter repayment deadline.
support_condition: A transparent calculation using attributable AI capital costs, operating costs, margins, and an identified recovery period substantiates approximately two dollars of incremental revenue per dollar invested for the named hyperscalers.
contradiction_condition: Comparable evidence using the same investment scope and recovery period establishes a materially different revenue requirement, showing that the proposed ratio is insufficient or unnecessary.
measurement_requirements: Specify recovery period, cost allocation, utilization, residual value, financing costs, and margins. Avoid counting capital spending and its depreciation twice, and distinguish AI-only from total capex.
source_requirements: Company disclosures and a reproducible economic model with independently supported assumptions.
