assessment_axis: historical_observation
explicit_source_elements:
  - always unsustainable
  - training data that necessitated stealing from millions of people
  - its utility vague
  - its ubiquity overstated
evaluator_interpretation:
  - Read as a description of generative AI through publication, not a forecast about its later development. 'Always' supplies no starting date.
  - The ordinary reading concerns economic viability, dependence on taking creators' work without permission, demonstrated practical benefits, and actual adoption compared with publicity.
  - Unauthorized use, copyright infringement and theft are not interchangeable legal findings. Licensing claims alone do not establish complete training-data provenance.
  - Evidence of particular useful applications bears on the utility assertion but does not by itself settle the broader assessment.
  - No particular adoption claim, profitability threshold or definition of sustainability is supplied.
support_condition: Evidence covering the historical industry establishes dependence on unauthorized material, an economically unviable business model, weak practical benefits, and adoption materially below identifiable contemporary claims.
contradiction_condition: Reliable historical evidence directly defeats an asserted necessity or establishes that the claimed lack of clear utility or exaggeration of adoption is materially false. Narrow counterexamples must not be treated as proof of industry-wide profitability or clean provenance.
measurement_requirements: Training-data provenance and permissions; costs and returns measured consistently; independent performance studies; representative adoption measurements compared with identifiable publicity claims.
source_requirements: Prefer provenance records, financial disclosures and independent research. Treat company assurances and analyst opinions according to their limits.
