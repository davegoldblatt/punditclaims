ambiguity_flags:
  - No starting date for 'always'.
  - Economic and environmental meanings of 'unsustainable' are not separated.
  - "'Stealing' could describe lack of permission, infringement or an ethical objection."
  - No benchmark defines 'vague' utility.
  - No specific claim or population defines overstated ubiquity.
  - The sentence combines four assertions without specifying how to aggregate their results.
