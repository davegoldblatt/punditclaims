evaluator_interpretation:
  - "Plain reading: as of the post (May 2025), even the newest frontier language models did not follow instructions reliably. They still failed a large share of tasks on public instruction-following tests."
  - Marcus named no time window. I use the period from January 2025 to the post date (2025-05-12), when the frontier models he was writing about were current.
  - "Marcus set no threshold for 'reliably'. I take an ordinary reading: failure rates near or above half on realistic instruction-following benchmarks clearly mean 'not reliable'. Near-perfect scores on hard, realistic tests would mean the opposite."
support_condition: Public benchmarks or studies from the period show frontier models of early to mid 2025 failing a substantial share of realistic instruction-following tasks.
contradiction_condition: Public evidence from the period shows frontier models following instructions near-perfectly on hard, realistic instruction-following benchmarks, not just on saturated simple ones.
measurement_requirements: Accuracy of current frontier models on instruction-following benchmarks such as MultiChallenge, IFEval or IFBench.
source_requirements: Peer-reviewed papers, preprints or benchmark operators' own results. Not Marcus's own writing.
