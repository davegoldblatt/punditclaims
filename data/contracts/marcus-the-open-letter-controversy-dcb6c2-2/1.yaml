assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - a very poor basis for factuality
evaluator_interpretation:
  - The ordinary practical reading is that LLM-generated assertions were not dependable standalone factual authorities.
  - Very poor supplies no numerical cutoff. The assessment concerns material factual fabrication, not whether models sometimes answer correctly.
  - The claim does not automatically extend to an entire system that checks model output against external sources.
  - The current-state assessment uses March 1–30, 2023, the publication month through the post date.
support_condition: Contemporary evaluations show substantial factual fabrication in ordinary knowledge-generation tasks, undermining reliance on generated text alone.
contradiction_condition: Representative contemporary evaluations show dependable standalone factual generation across ordinary knowledge tasks, with fabrication sufficiently rare to support routine unchecked reliance.
measurement_requirements: Identify the model, task, sampling and factuality criteria. Do not generalize a task-specific error rate to all LLM use.
source_requirements: Versioned contemporary factuality research, with developer disclosures used to identify relevant alternative approaches and limitations.
