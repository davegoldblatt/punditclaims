explicit_source_elements:
  - Hundreds of billions of dollars of debt has been issued
  - the price of every imaginable consumer electronic has been inflated
  - most of our stock market
  - parts of our economy
  - dependent on the sales of GPUs
  - most of which are going to a handful of companies
  - for the most part, not fucking using them
evaluator_interpretation:
  - Read the debt assertion as at least USD 200 billion of cumulative issued debt associated with the AI infrastructure buildout, rather than commitments, equity funding or outstanding debt balances.
  - Read 'every imaginable consumer electronic' as a claim of pervasive price pressure across major electronics categories, rather than every individual product.
  - Read 'our stock market' as the US market and 'most' as a majority of market value materially dependent on GPU sales. This weighting is an evaluator choice.
  - Read nonuse as a majority of the relevant purchased GPUs remaining undeployed or unused, rather than merely operating below theoretical peak throughput.
  - Use calendar Q2 2026 for the ongoing economic and deployment state, the latest completed common reporting quarter before the post. The debt assertion is cumulative through that reporting point, with no stated starting date.
  - The supplied passage identifies neither a debt issuer universe nor an accounting basis.
support_condition: A matching debt aggregate establishes the cumulative threshold; evidence establishes pervasive AI-related electronics price pressure, majority market dependence and majority nonuse among the dominant GPU buyers.
contradiction_condition: Matching broad evidence disproves a component. A narrow debt subtotal, one unaffected product, or a few active GPU deployments is insufficient.
measurement_requirements: Define and deduplicate debt issuers and instruments; separate issuance from commitments and balances. Measure price effects against a counterfactual, market dependence rather than sector weight alone, and GPU nonuse against a shipment-linked denominator.
source_requirements: Debt issuance records, official price data with causal analysis, market exposure analysis, and purchaser deployment records. Forecast financing and selected company anecdotes cannot settle the compound assertion.
