assessment_axis: historical_observation
explicit_source_elements:
  - Hundreds of billions of dollars of debt has been issued
  - the price of every imaginable consumer electronic has been inflated
  - most of our stock market and parts of our economy have become dependent on the sales of GPUs
  - most of which are going to a handful of companies
  - that are, for the most part, not fucking using them
evaluator_interpretation:
  - This is a compound claim. The plain reading is that each part must hold. The central factual charge, and the one the sentence builds to, is that most GPU sales go to a few companies that mostly are not using them.
  - "'Hundreds of billions of dollars of debt' is read as cumulative AI-related debt issuance in the boom up to the post date. The target period runs from 2025-01 to the post date, 2026-09-22."
  - "'Every imaginable consumer electronic' and 'most of our stock market' are rhetorical. They are read loosely as broad consumer electronics price rises and heavy market dependence on GPU sales."
  - "'For the most part, not using them' is read as most GPUs bought by these few companies being uninstalled or idle at the time of the post."
support_condition: Evidence that AI-related debt issuance reached hundreds of billions of dollars by September 2026, that consumer electronics prices rose broadly, that GPU sales are concentrated in a few buyers, and representative evidence that most GPUs those buyers bought were not in use.
contradiction_condition: Evidence that AI debt issuance was well below $200 billion, or representative evidence that most GPUs sold to the large buyers were installed and running around September 2026.
measurement_requirements: Cumulative AI-related debt issuance in USD to September 2026; share of NVIDIA sales to top buyers; share of those buyers' GPUs in use.
source_requirements: Bank or rating-agency debt tallies; NVIDIA filings; representative deployment data. Anecdotes are context only.
