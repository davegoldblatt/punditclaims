ambiguity_flags:
  - Affordable has no stated liquidity or stress threshold.
  - Flagging demand does not specify bookings, utilization, prices or a comparison period.
  - Propping up can describe contractual support or imply dependence for survival.
  - The companies have different latest reported quarter-end dates.
  - No jurisdiction or legal test is specified.
