evaluator_interpretation:
  - The ordinary reading is that customers were recognizing reliability, production-readiness and maintenance limitations by the post date.
  - Recognition does not require abandoning the tools, reducing use or rejecting their benefits.
  - Customers means users of these tools; the claim supplies neither a paying-customer restriction nor a majority threshold.
  - I use 2025 through the post date as the current customer-experience period. Finally indicates emerging recognition, without specifying a measurable rate of change.
support_condition: Systematically collected customer accounts or surveys show recurring recognition that rapid initial results do not make these tools dependable for complex applications without substantial debugging, verification or maintenance work.
contradiction_condition: Comparable direct evidence shows that recognition of these limitations was exceptional and customers generally considered the tools dependable for complex applications without substantial corrective work. Growth or continued use alone cannot contradict the claim.
measurement_requirements: Measure customer perceptions and experiences directly. Distinguish recurring recognition from isolated complaints and distinguish recognition from withdrawal.
source_requirements: Customer surveys, firsthand accounts or systematic research examining those accounts, describing experiences before the post.
