  - "Read as: by October 2025, vibe-coding customers were recognizing these limits and pulling back, as shown by declining usage or churn tied to those limits."
  - Target period is June 2025, the reported traffic peaks, to October 2025, the post month.
  - Showing the claim true needs both a pullback and some sign that the limits drove it. A usage dip alone with other causes, or growth in usage and revenue, would weigh against it.
support_condition: Data from mid- to late 2025 shows customers leaving or reducing use of vibe-coding tools, with surveys, churn reasons or credible reporting tying this to reliability, complexity or maintainability limits.
