early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - Good prediction has no threshold or distribution.
  - Understanding could mean behavioral competence, internal representations, grounded meaning, or humanlike comprehension.
  - The statement is about logical necessity rather than a dated performance result.
