explicit_source_elements:
  - large language models aren’t just looking things up
  - a good prediction of next word
  - necessarily implies understanding
  - is fallacious
evaluator_interpretation:
  - Marcus disputes a necessary implication between prediction performance and understanding. He does not claim here that every LLM lacks every form of understanding.
  - An ordinary reader can distinguish prediction success from comprehension, but the statement supplies neither a prediction threshold nor a sufficiently determinate meaning of understanding for a binary empirical verdict.
  - Equating understanding with flawless performance on a selected benchmark would add a decisive premise Marcus did not supply. Intelligent humans can also make comprehension errors.
support_condition: Under specified definitions, demonstrate adequate next-word prediction together with independently established absence of the relevant understanding, or establish a valid counterexample to the proposed implication.
contradiction_condition: Under those same definitions, establish that the specified prediction performance requires the specified understanding. Examples of models that exhibit both are insufficient.
measurement_requirements: A definition of understanding independent of the prediction score, a prediction threshold, and a stated domain of the necessity claim.
source_requirements: A valid theoretical argument or controlled experiments addressing the specified implication; benchmark mistakes alone cannot establish absence of understanding.
