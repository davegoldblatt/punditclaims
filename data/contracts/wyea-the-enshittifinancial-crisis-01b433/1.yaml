assessment_axis: historical_observation
explicit_source_elements:
  - Large Language Models do not create novel concepts
  - inconsistent and unreliable
  - even the “good” things they do vary wildly
evaluator_interpretation:
  - The ordinary reading is that LLMs cannot originate useful new ideas or methods and cannot consistently deliver correct results. Novel wording alone does not count as conceptual novelty.
  - LLM-generated methods tested by external evaluators count as contributions from LLMs, while the contribution of search, verification and human problem selection must remain explicit.
  - There is no standard reporting quarter for model capabilities. I use the current 2025 evaluation year through publication, reflecting the post's retrospective discussion of the past year.
  - Reliability means repeated correctness on specified tasks, not identical wording. No universal acceptable error rate is supplied.
support_condition: Evaluations show substantial repeated-task failures and provide strong evidence that apparent novel ideas are reproductions of existing ideas. Reliability failures alone cannot establish the categorical absence of novelty.
contradiction_condition: A documented LLM contribution produces a genuinely new, independently checked idea or method. Reliable performance on some tasks also limits any reading that all uses are unreliable.
measurement_requirements: Identify model versions, task definitions, repeated trials and objective correctness checks. For novelty, establish the previous state of knowledge and distinguish model contributions from surrounding software and human contributions.
source_requirements: Original evaluations and inspectable research results, preferably with independent confirmation. Developer announcements require corroboration for novelty.
