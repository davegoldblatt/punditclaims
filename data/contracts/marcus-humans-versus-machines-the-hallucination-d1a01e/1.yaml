assessment_axis: causal_assessment
explicit_source_elements:
  - LLM "hallucinations" arise, regularly, because
  - literally don't know the difference between truth and falsehood
  - don't have reliably reasoning processes to guarantee that their inferences are correct
  - incapable of fact-checking their own work
evaluator_interpretation:
  - Assess models and methods available by the post date, 2024-04-21. This is a claim about existing capabilities and causes, not a forecast about future models.
  - "Read knowing the difference behaviorally: distinguishing true from false claims or accurately assessing whether an answer is correct. This does not require consciousness."
  - Read fact-checking their own work as checking factual assertions in an initial response and identifying or correcting errors. Prompted verification using the same model qualifies; it need not be automatic or infallible.
  - Use tests without external factual feedback for the strongest comparison with the claimed intrinsic incapacity.
  - Assess the components separately. Evidence of unreliable reasoning supports that limitation, but does not by itself establish the entire causal explanation.
support_condition: Controlled evaluations show unreliable reasoning and factual self-evaluation, while interventions link those failures to hallucinations. Full support for the categorical components would require evidence of inability, rather than merely imperfect performance.
contradiction_condition: Reproducible truth discrimination or successful verification of a model's own factual responses contradicts the categorical absence of those abilities. Successful self-verification that reduces hallucinations also challenges the proposed explanation based on incapacity.
measurement_requirements: Measure factual correctness against independently established answers. Compare initial and revised responses, identify external feedback and prompting, and distinguish reasoning errors from factual hallucinations.
source_requirements: Primary experiments on models and methods available by 2024-04-21, with evidence published by 2026-10-28.
