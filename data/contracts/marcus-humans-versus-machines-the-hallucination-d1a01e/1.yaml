ambiguity_flags:
  - Knowing the difference could mean measurable discrimination or a philosophical conception of knowledge.
  - Fact-checking could mean internal factual verification or checking against independent external sources.
  - The wording does not distinguish ordinary single-pass generation from prompted multistep verification.
  - Regularly has no numerical threshold.
  - The causal contribution of each proposed limitation is unspecified.
