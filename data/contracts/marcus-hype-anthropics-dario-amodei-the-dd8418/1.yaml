evaluator_interpretation:
  - The ordinary reading concerns material functional difficulty producing a basic playable Pac-Man-style game with contemporary AI coding tools.
  - It does not assert impossibility, require an exact arcade reproduction, or imply that every attempt fails.
  - Current tools is operationalized as tools available in the first half of March 2025, through the post date.
  - A general statement about tools requires more than an isolated failure or an isolated successful demonstration.
support_condition: Documented, adequately dated trials across relevant contemporary tools show substantial gameplay errors or considerable corrective intervention under ordinary prompting.
contradiction_condition: Comparable trials show that those tools reliably produce functionally correct basic implementations with little corrective intervention.
measurement_requirements: Record tool versions, prompts, attempts, human edits, elapsed effort, and functional checks of movement, collision, pellets, enemies, and completion.
source_requirements: Reproducible trials or documented firsthand attempts. Reputable reporting can establish individual experiences, with its limits stated.
