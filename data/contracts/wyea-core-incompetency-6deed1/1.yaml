assessment_axis: forecast_outcome
explicit_source_elements:
  - If CoreWeave makes it to IPO
  - it will raise about $4 billion
  - by October 2025
  - upwards of $500 million of loan payments a quarter
  - might give it enough runway
  - doesn't appear to have a path to profit
evaluator_interpretation:
  - The firm commitments are the IPO proceeds and quarterly loan-payment forecasts. The timing suggestion, possible runway and apparent lack of profitability are qualifications, not additional firm predictions.
  - I read 'raise' as gross IPO proceeds received by CoreWeave, excluding proceeds paid to selling shareholders.
  - The financial discussion relies on company disclosures and financing plans; company_reported describes the proceeds measurement without assuming a GAAP earnings measure.
  - I read loan payments as contractual principal and cash interest, excluding operating leases and voluntary refinancing.
  - The single metric_scope below describes the IPO component. The debt component requires a separate measurement and is assessed separately in the explanation.
  - Contradicted applies to the explicit IPO amount. It does not mean that the quarterly loan-payment forecast has been disproved.
support_condition: IPO completion followed by approximately $4 billion of gross proceeds to CoreWeave, together with contractual quarterly loan principal and interest obligations exceeding $500 million by October 2025.
contradiction_condition: A completed IPO raising an amount plainly outside an ordinary reading of approximately $4 billion contradicts the proceeds component. A complete loan-payment schedule below the stated threshold would separately contradict the debt component.
measurement_requirements: Separate issuer proceeds from selling-shareholder proceeds and fees. For debt, identify mandatory principal and cash interest by quarter and instrument; do not substitute interest expense, annual averages or total debt balances.
source_requirements: Company offering disclosures and subsequent filings confirming completion; contemporaneous debt agreements or filings describing obligations effective by October 2025.
