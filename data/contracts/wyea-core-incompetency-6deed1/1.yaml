  - Approximately $4 billion has no specified tolerance.
  - Issuer proceeds versus total offering proceeds is unspecified.
  - Loan payments could mean bank loans alone or a broader set of financing obligations.
  - The aggregate label reflects the contradicted IPO component; the precise debt component remains unresolved.
