evaluator_interpretation:
  - Assess the findings reported in the original June 2025 paper available before the post.
  - "The plain reading is comparative: models have more difficulty with problems requiring original insights than with familiar algorithmic patterns."
  - Treat the paper's knowledge-heavy versus observation-heavy categories as an indirect measure of familiarity. They do not measure distance from each model's training examples.
  - Converging evidence means evidence consistent with the claim, not proof of a universal or causal law.
support_condition: The paper reports reasoning-related failures and worse performance on problems demanding novel insights than on problems built from familiar patterns.
contradiction_condition: The paper reports no relevant reasoning weakness or shows equally strong or stronger performance on the less template-based problems.
measurement_requirements: Inspect expert failure annotations and performance by problem category. Do not equate difficulty alone with unfamiliarity.
source_requirements: Use the original benchmark paper and its reported category comparisons.
