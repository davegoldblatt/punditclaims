explicit_source_elements:
  - large language models
  - didn’t represent robust world models
  - how events fold over time
  - I stand by this 100% even today
evaluator_interpretation:
  - The context compares GPT-2 in October 2019 with language models available by February 2, 2023.
  - The plain reading is that these models lacked dependable representations for tracking events and their consequences across varied descriptions. It does not require a complete absence of internal state information.
  - Repeated behavioral failures bear on robustness, but do not by themselves establish what internal representations are absent.
support_condition: Evaluations of representative models across the stated period show persistent failures to track novel event sequences and resulting states across ordinary variations, with evidence linking those failures to unreliable state representations.
contradiction_condition: Representative models available within the period demonstrably maintain and use dependable event-state representations across varied novel sequences and formulations. Success on a narrow task alone is insufficient.
measurement_requirements: Identify model versions, tasks, prompting and training conditions. Evaluate sequence length, changed wording, novel combinations, and resulting states. Distinguish representation failures from failures to use or decode representations.
source_requirements: Primary evaluations and representation studies concerning models available during the target period.
