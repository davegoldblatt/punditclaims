  - expanding what OpenAI can sell
  - address the entirety of corporate America
  - use cases that I do not believe generative AI is capable of meeting
  - automating chunks of the economy
evaluator_interpretation:
  - Assess capabilities existing at publication, rather than capabilities developed later.
  - For this ongoing capability observation, use July 1–29, 2024, the current deployment period before publication; there is no common quarterly reporting cycle for AI capability.
  - The ordinary reading concerns substantial, commercially useful workflow automation with broad business applicability, rather than merely drafting assistance.
  - Do not interpret entirety of corporate America as requiring successful automation at literally every company.
  - The claim also links the required capability to OpenAI's survival. Evidence of one useful deployment does not by itself establish that survival requirement.
support_condition: Representative evidence for the target period shows that available generative AI could not reliably and economically automate substantial business workflows at the breadth required by the stated survival argument.
contradiction_condition: Representative deployments in the target period establish reliable, commercially useful automation of substantial business workflows at that breadth and connect it to the claimed survival requirement.
measurement_requirements: Measure completed workflows, human intervention, reliability, deployment volume and economics; distinguish assistance from automation.
source_requirements: Dated deployment records and independent capability evaluations, together with evidence defining the claimed commercial requirement.
