explicit_source_elements:
  - "\"these products are 'trained' on datasets\""
  - '"creating massive issues of bias and copyright infringement"'
  - "\"these generative AIs have to learn to construct whatever they're generating from somewhere\""
  - "\"inherently learning from other people's work\""
evaluator_interpretation:
  - "Plain reading: training generative AI products (such as ChatGPT and Stable Diffusion) on large collected datasets had, by the time of the post, produced serious, widely recognized problems in two areas: (1) biased or stereotyped outputs, and (2) copyright-infringement disputes over training on other people's work without permission."
  - '"Issues of copyright infringement" is read as substantial infringement allegations and disputes, such as major lawsuits. It is not read as a final court finding that training is infringement.'
  - "Target period: he describes a current state without naming a period, so the period runs from 2022 (when these products spread widely) to the post date."
support_condition: Before the post, credible research documented significant bias in widely used generative models, and major copyright-infringement lawsuits were filed over the use of training data.
contradiction_condition: No significant documented bias in generative model outputs, and no notable copyright disputes over training data, as of early 2023.
measurement_requirements: null
source_requirements: Peer-reviewed or preprint research on model bias; court filings or reputable reporting on lawsuits.
