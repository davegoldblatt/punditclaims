explicit_source_elements:
  - rely in part
  - completely hand-written, symbolic reasoning systems
  - LLMs are not similarly immune
  - they cannot generate an incorrect proof
evaluator_interpretation:
  - The comparison concerns the systems discussed in connection with the 2024 IMO and ordinary LLM proof generation as understood by the post date.
  - I read the correctness claim as applying to completed proofs accepted by the symbolic machinery, assuming its implementation and mathematical premises are sound. It does not apply to every candidate generated during search.
  - Hand-written means programmed checking and deduction rules, rather than learned proof-search behavior.
  - LLMs means models producing unchecked proofs, not every possible system combining an LLM with a verifier.
support_condition: Technical descriptions establish that symbolic verification or rule-based deduction controls accepted proofs in both systems, while unchecked language-model output lacks that guarantee.
contradiction_condition: Technical descriptions show that accepted proofs bypass those checks, or that the claimed correctness protection comes from learned generation alone. A documented invalid accepted proof would challenge the guarantee.
measurement_requirements: Distinguish candidate generation from accepted proofs, formalized statements from their natural-language originals, and formal checking from model self-evaluation.
source_requirements: Primary technical descriptions of AlphaProof and AlphaGeometry, including their checking mechanisms and limitations.
