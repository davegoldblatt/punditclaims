evaluator_interpretation:
  - Next year means 2025, relative to the April 2024 post.
  - "Treat Marcus's interpretation of Musk's statement as an explicit condition: Musk must have meant universal intellectual-task capability."
  - Assess the predicted event separately from the confidence phrase. One outcome cannot establish whether an unspecified probability was well calibrated.
support_condition: Independent evidence establishes that Musk intended the universal intellectual-work threshold, and qualifying capability had not arrived by December 31, 2025.
contradiction_condition: Independent evidence establishes that Musk intended that threshold, and a qualifying system arrived by December 31, 2025.
measurement_requirements: First establish the intended scope of Musk's prediction. Only then apply human-comparative capability evaluations to the stated deadline.
source_requirements: Use the original interview or a reliable contemporaneous account to establish the condition. Marcus's interpretation alone cannot establish Musk's intended meaning.
