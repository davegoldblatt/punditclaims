explicit_source_elements:
  - Work on new approaches
  - such as world models and neurosymbolic
  - will escalate
  - predictions for 2026
evaluator_interpretation:
  - The plain reading is noticeably increased research and development activity in 2026 compared with 2025.
  - World models and neurosymbolic AI are the named examples. Evidence should cover both rather than infer a broad shift from one company's announcement.
  - Activity can be measured through comparable publications, funded projects, staffing and investment. No numerical growth threshold was stated.
support_condition: Comparable evidence shows a broad increase in research and development activity during 2026 over 2025, including the named approaches.
contradiction_condition: Comparable evidence covering 2026 shows that activity across the named approaches remained broadly flat or declined.
measurement_requirements: Use consistent definitions and coverage across years. Separate announced financing from research spending, and new projects from renamed existing work.
source_requirements: Prefer research repositories, conference records and direct disclosures from laboratories, funders and companies. Individual announcements cannot establish the aggregate trend.
metric_scope: null
original_horizon: "2026"
horizon_interval:
  start: 2025-12-20
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Early support requires comprehensive, comparable cumulative activity already exceeding the full 2025 baseline across the named approaches. Isolated announcements or papers are insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Escalate has no numerical threshold.
  - Work could mean funding, staffing, publications or projects.
  - The approaches are illustrative, and their boundaries are not defined.
  - The comparison with 2025 is inferred from the annual forecast context.
