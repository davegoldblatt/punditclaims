evaluator_interpretation:
  - In the surrounding discussion of losses, 'money ... make' ordinarily means profit from supplying AI compute, rather than revenue.
  - For this ongoing observation, use the quarter ended December 31, 2024, the latest common reporting quarter available before the post. Annual CoreWeave results can provide context but cannot substitute for that quarter.
  - The relevant scope is AI-compute services, not all cloud services or the entire parent companies.
  - Little profit means negligible or weak profitability relative to the revenue and capital required by those services. The speaker supplies no numerical cutoff or accounting basis.
support_condition: Comparable AI-compute revenue and fully allocated cost disclosures show negligible profits or losses across the providers being generalized about during the target quarter.
contradiction_condition: Comparable disclosures establish substantial profits and healthy profitability from AI-compute services across the relevant providers during that quarter.
measurement_requirements: Identify AI-compute profits separately, including attributable infrastructure and financing costs. Annualized revenue, broader cloud operating income, and company-wide earnings are context only.
source_requirements: Provider disclosures or credible independently documented estimates that isolate AI-compute revenue and costs for the target period.
