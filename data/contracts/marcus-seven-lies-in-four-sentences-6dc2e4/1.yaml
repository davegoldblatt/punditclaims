evaluator_interpretation:
  - Last night refers to October 3, 2023, relative to the October 4 post.
  - Count distinct factual assertions in the specific four-sentence answer, rather than sentences or repeated implications of the same assertion.
  - A fabricated election can contain separately checkable assertions about the winner, nomination, tally, and opponent. The actual wording is needed to decide which assertions were made.
  - The claim concerns factual falsity, not intentional deception.
  - The surrounding description identifies the answer being assessed; it is not a conditional forecast.
support_condition: The recoverable original answer contains at least seven distinct factual assertions demonstrably false against the public record as of October 3, 2023.
contradiction_condition: The complete original answer and public record establish fewer than seven distinct false factual assertions under a consistent counting rule.
measurement_requirements: Recover the exact answer and enough preceding conversation to establish whether it purported to describe real events. Map each counted assertion to contrary evidence and avoid duplicate counting.
source_requirements: An original conversation record or reliable independent reproduction, together with contemporary House records and other authoritative factual records.
