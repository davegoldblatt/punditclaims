assessment_axis: forecast_outcome
explicit_source_elements:
  - what I think will burst this bubble
  - part of the collapse will be investor dissent
  - punishing one of the major providers (Microsoft or Google, most likely)
  - for a massive investment in an industry that produces little actual revenue
  - no deadline stated
evaluator_interpretation:
  - Read as a forecast with no deadline that the AI bubble will collapse, and that investors punishing a major provider (most likely Microsoft or Google) for its AI spending will be part of that collapse.
  - "Both parts are needed: a recognizable collapse of the AI investment bubble, plus documented investor punishment of a major provider's AI spending that contributed to it. Investor sell-offs without a collapse do not resolve the claim."
support_condition: A broad AI-bubble collapse occurs, for example a sustained steep fall in AI-linked equities and investment along with failures of AI firms, and investor punishment of Microsoft, Google, or another major provider over AI spending is documented as part of it.
contradiction_condition: An AI downturn happens in which major providers are not punished by investors for AI spending, or AI investment proves durable with no collapse over a long period.
measurement_requirements: Market data and reporting on stock reactions tied to AI spending; evidence of a sector-wide collapse.
source_requirements: Reputable financial news, company filings, market data.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Supported once a recognized AI-bubble collapse occurs that includes documented investor punishment of a major provider's AI spending. Contradicted if a recognized collapse occurs without such punishment.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'collapse' and 'bubble' are not defined"
  - how much investor dissent counts as 'punishing' is unclear
  - no deadline
