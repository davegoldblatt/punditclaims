assessment_axis: forecast_outcome
explicit_source_elements:
  - what I think will burst this bubble
  - part of the collapse will be investor dissent
  - punishing one of the major providers (Microsoft or Google, most likely)
  - for a massive investment in an industry that produces little actual revenue
  - no deadline stated
evaluator_interpretation:
  - The forecast has two parts. First, the generative AI bubble collapses. Second, investors punishing a major provider for its AI spending is part of that collapse.
  - An ordinary stock drop or market correction is not the predicted collapse. A collapse means a widely recognised bursting of the AI boom, such as a broad and lasting fall in AI valuations, funding and spending.
  - Investor punishment can be shown by a sharp share sell-off, shareholder litigation or activist action aimed at a major provider's AI spending. Microsoft or Google is most likely, but any major provider counts.
  - No deadline was given. So the claim cannot fail just because the bubble has not collapsed yet.
support_condition: A recognisable collapse of the generative AI bubble occurs, and dated reporting shows that investors punishing a major provider (most likely Microsoft or Google) for its AI spending was part of that collapse.
contradiction_condition: A recognisable collapse of the generative AI bubble occurs, but the record shows it happened without any meaningful investor punishment of a major provider for its AI spending, for example if it was driven only by startup failures while the big providers' investors stayed supportive.
measurement_requirements: Dated market and news reporting that describes a collapse of the AI boom, not just a correction, together with evidence of investor action against a major provider's AI investment, such as share price reactions tied to capex, shareholder lawsuits or activist campaigns.
source_requirements: Reputable financial news (Reuters, Bloomberg, CNBC), company filings, or court records, published on or before the evaluation date.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settle the claim early only if, by the evaluation date, a widely recognised collapse of the generative AI bubble has happened. Score it supported if investor punishment of a major provider for AI spending is documented as part of that collapse, and contradicted if the collapse clearly happened without it. Isolated sell-offs or lawsuits without a collapse do not settle it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is given for the collapse.
  - The speaker gives no threshold for what counts as a 'collapse' or as investor 'punishment'.
  - "'Part of the collapse' leaves open how central investor dissent must be."
