evaluator_interpretation:
  - Read prices wars as price wars.
  - The plain reading is substantial competitive price cutting among LLM providers, rather than a claim that every provider or model became cheaper.
  - Use January 2024 through publication because Marcus explicitly compares developments with his January 2024 warning.
  - This concerns market pricing behavior, not a particular company's financial accounts; metric_scope is therefore null.
support_condition: Dated records show substantial price cuts by major LLM providers and competitive responses or credible reporting connecting those cuts to rivalry.
contradiction_condition: Representative pricing histories show no substantial competitive cuts during the period, or establish that the alleged cuts were merely incomparable product changes.
measurement_requirements: Distinguish input, output, cached-token, and task prices. Identify actual reductions for named offerings and evidence of competitive responses.
source_requirements: Prefer provider announcements for prices and independent reporting for the sequence of competitive responses.
