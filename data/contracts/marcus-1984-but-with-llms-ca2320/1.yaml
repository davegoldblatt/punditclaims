assessment_axis: causal_assessment
explicit_source_elements:
  - Necessity has (heretofore) meant
  - pretty much every recent LLM
  - trained on more or less the same data
  - every bit of data they can scrape from the internet
  - explains why models cluster not far from the middle
evaluator_interpretation:
  - The claim has two parts. First, almost all recent major LLMs were trained on largely overlapping web data. Second, that shared data is why their views cluster near the middle.
  - "'Heretofore' covers roughly 2020 to the post date."
support_condition: Documentation shows that nearly all recent major LLMs draw heavily on the same web corpora, and studies link shared pretraining data to the convergence of their expressed views.
contradiction_condition: Documentation shows that recent major LLMs use largely different data, or studies show the convergence in views comes mainly from post-training rather than shared pretraining data.
measurement_requirements: Disclosures of training-data sources across many LLMs, plus studies that separate the effect of pretraining from fine-tuning on expressed views.
source_requirements: Research reports, papers, or company documentation.
