condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Society could mean the world, the United States, or a coordinated public response.
  - Really have a plan could mean either an existing concrete plan or an adequate comprehensive system.
  - The surrounding passage emphasizes inadequate machinery, which is a weaker claim than no plan whatsoever.
  - The reporting window is inferred from the title.
