explicit_source_elements:
  - For everything to “work out”
  - continue in perpetuity
  - hyperscaler AI revenues
  - hyperscaler capex
  - expand infinitely
evaluator_interpretation:
  - The passage asserts that indefinite expansion is necessary for a successful AI investment cycle.
  - Neither successful investment outcomes nor the duration needed to establish success is defined. Replacing these with a particular stock index, return threshold or observation window would materially rewrite the claim.
  - The description of revenues as depressingly small supplies no numerical comparison.
support_condition: No finite observation can establish perpetual expansion or its necessity under the undefined success condition.
contradiction_condition: A counterexample would require an independently specified meaning of success and evidence that it persists after expansion stops. The passage does not supply that meaning.
measurement_requirements: A defined investment universe, success measure, observation window and separate measures for revenue, capital spending and infrastructure plans.
source_requirements: Company disclosures and market measurements could test a more specific proposition, but cannot supply the missing definition on the speaker's behalf.
