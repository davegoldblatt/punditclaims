  - built, in-service gigawatt data center of any kind
  - OpenAI, a company that cannot afford to pay its bills
evaluator_interpretation:
  - This combines three assertions requiring different evidence. They are retained together because only one claim_id was supplied.
  - The age assertion concerns the history of the 100 MW concept before publication. The target period therefore has no specified historical starting date.
  - For the operating-capacity assertion, the ordinary reading is a single campus with approximately 1 GW commissioned and usable by March 24, 2026. Announced ultimate capacity and aggregate capacity across unrelated sites do not qualify.
  - The wording reports the author's unsuccessful search. It is weaker than an unqualified assertion that no such facility exists.
  - For OpenAI, the ordinary reading is inability to meet obligations when due, rather than operating losses or dependence on investors. The latest year-end cash position reported before the post is relevant financial context, but cannot alone establish March payment capacity.
  - No accounting basis is supplied for the assertion about paying bills.
support_condition: Historical records establish that the 100 MW concept emerged only a few years before publication; sufficiently comprehensive operating records establish the apparent absence of a commissioned 1 GW campus; and contemporaneous liquidity and payment records show OpenAI could not meet bills due.
contradiction_condition: A substantially older documented 100 MW design contradicts the age component. A verified operating 1 GW campus by publication contradicts the implied absence component. Matched liquidity and obligations records demonstrating payment capacity contradict the OpenAI component. Findings must identify which component they settle.
measurement_requirements: Distinguish campus from individual building, total facility power from IT power, and commissioned capacity from planned capacity. For OpenAI, compare available liquidity with obligations actually due.
source_requirements: Dated designs or announcements, commissioning or operating records, and financial disclosures or reliable reporting on liquidity and payment obligations. The author's own search is not outcome evidence.
