assessment_axis: forecast_outcome
explicit_source_elements:
  - Almost nobody
  - will give you their definition
  - In 2025
  - claim we have reached AGI
evaluator_interpretation:
  - The relevant population is distinct AI influencers and company speakers claiming during 2025 that AGI had already been reached.
  - Almost nobody means definitions would be exceptional among those claimants, not merely absent from a majority.
  - A definition is an explicit description of the capabilities or threshold the claimant means by AGI. It need not be persuasive or universally accepted.
  - Count definitions in the declaration, its linked explanation, or a subsequent public explanation during 2025.
  - The antecedent is the existence of qualifying 2025 AGI claimants; it does not require first proving that there were a lot of them.
support_condition: A representative collection of qualifying claimants and their explanations shows that only exceptional cases supplied an explicit definition.
contradiction_condition: Such a collection shows that a substantial share supplied definitions, beyond isolated exceptions.
measurement_requirements: Establish the claimant denominator; deduplicate people and company statements; search accompanying and later 2025 explanations; code explicit definitions consistently.
source_requirements: Original declarations and explanations, supplemented by transparent archives when originals cannot be retrieved. An isolated short post cannot establish that its author never supplied a definition.
metric_scope: null
original_horizon: In 2025
horizon_interval:
  start: 2024-12-21
  end: 2025-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Individual definitions cannot settle a population-share forecast early. Resolution requires sufficiently complete claimant and explanation records for 2025.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Almost nobody has no numerical threshold.
  - The boundary of the influencer and company-speaker population is unspecified.
  - The wording does not specify whether definitions must accompany the initial declaration or may be supplied later.
  - A definition and an operational test are not necessarily the same.
retrospective_or_prospective: retrospective
