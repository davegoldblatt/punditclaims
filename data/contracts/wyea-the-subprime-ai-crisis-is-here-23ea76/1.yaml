assessment_axis: causal_assessment
explicit_source_elements:
  - As AI labs raise prices on their AI startup clients
  - forced to reduce the quality of their services and/or increase their costs
  - leading to customer churn
evaluator_interpretation:
  - "The ordinary reading is a general causal sequence: higher supplier charges cause startups to raise customer prices or reduce service, causing customers to leave."
  - The surrounding context includes higher token consumption per task as an effective price increase.
  - Churn means actual customer departures. Complaints, slower growth and lower market share are not sufficient.
  - The statement describes a causal mechanism without a specified observation window or forecast deadline.
support_condition: Dated evidence connects higher lab charges to startup price increases or service reductions, and connects those changes to actual customer departures. Evidence must establish more than events occurring in sequence.
contradiction_condition: "Comparable evidence shows that the asserted general mechanism fails: affected startups can maintain service and prices without resulting churn, or the attributed departures demonstrably arise from other causes."
measurement_requirements: Matched supplier bills or effective task costs, startup pricing and service records, and customer cancellation or retention records. Account for competing products, product changes and customer mix.
source_requirements: Prefer startup disclosures and customer records. Independent reporting can supplement them; anonymous complaints alone cannot establish the full causal chain.
