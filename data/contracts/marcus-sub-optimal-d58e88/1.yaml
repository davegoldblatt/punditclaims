explicit_source_elements:
  - no clearly outlined vision for what Optimus would do
  - nor much justification
  - building the robot the in this specific way
  - no clarity about the first big application
  - no clear go-to-market strategy
  - no clear product differentiator
evaluator_interpretation:
  - The target is the September 30, 2022 presentation, including its question period.
  - A clear vision means identifiable intended work and a proposed initial application. Design justification means explaining how design choices serve that work.
  - The claim does not require a finished business plan or proof that Tesla's proposed design was optimal.
support_condition: The presentation offers only broad aspirations, without concrete initial work or substantive explanations connecting design choices to intended use.
contradiction_condition: The presentation identifies concrete initial work and gives substantive functional reasons for its design choices.
measurement_requirements: Inspect the intended-use discussion, design explanations and questions about initial deployment; distinguish proposed uses from completed capabilities.
source_requirements: The presentation and question period, or a readable transcript reproducing them.
