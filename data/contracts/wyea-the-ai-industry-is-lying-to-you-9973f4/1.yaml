assessment_axis: forecast_outcome
explicit_source_elements:
  - will be seen as one of the largest wastes of capital of all time
  - the majority of the data center deals you’re reading about
  - simply never get built
evaluator_interpretation:
  - The checkable core is that more than half of the relevant announced deals fail to produce their proposed facilities.
  - Freeze the population at the post date. Count distinct projects or deals, rather than weighting by announced dollars or gigawatts.
  - A delay, tenant change, financing revision or unfinished phase is not by itself permanent noncompletion.
  - The historical ranking of capital waste has no specified measure or comparison set and cannot independently receive a factual score.
support_condition: A documented population of relevant deals announced by March 24, 2026 shows that more than half have definitively and irreversibly failed to produce the proposed facilities.
contradiction_condition: At least half of that same population is completed under a consistent definition of completion, making a majority of permanent failures impossible.
measurement_requirements: Deduplicate announcements and identify project boundaries, phases, original scope, completion and permanent abandonment. Preserve the original denominator.
source_requirements: Original announcements and dated commissioning, cancellation, permit or court records. Project trackers must disclose coverage and distinguish delays from cancellations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only when verified completions or irreversible failures cross the relevant threshold in a fixed, documented population. Elapsed time or isolated examples cannot settle 'never'.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The relevant population of deals is unspecified.
  - Geographic scope is unclear despite the surrounding US examples.
  - Deals may refer to campuses, phases, leases or financing arrangements.
  - Built could mean partial delivery or completion of the entire announced scope.
  - Never supplies no deadline.
  - Largest wastes of capital has no stated loss measure or historical comparison.
retrospective_or_prospective: retrospective
