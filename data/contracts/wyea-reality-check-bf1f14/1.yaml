assessment_axis: historical_observation
explicit_source_elements:
  - They still hallucinate
  - ungodly expensive to run
  - still unreliable
  - still don’t do much
evaluator_interpretation:
  - This describes models available at the time of the post. I use April 1–28, 2025 as the current reporting window for product evaluations.
  - Hallucination means generating false factual assertions. Unreliability means a material risk of failure when users rely on outputs without verification.
  - The plain reading of 'don’t do much' is limited useful task capability, rather than a claim that models literally do nothing.
  - Expense means the resources needed to operate models relative to the work delivered. Customer API prices alone do not establish providers' operating costs.
  - The cost clause names no company or company financial figure, so the company-money metric schema is not applicable.
support_condition: Contemporaneous evaluations show factual fabrication and material failures, operating-cost evidence establishes high expense relative to useful output, and practical task evaluations show little useful capability.
contradiction_condition: Contemporaneous evidence establishes a contrary result for a component, such as substantial useful task capability or dependable performance on representative workloads. Assess the four components separately.
measurement_requirements: Use dated evaluations of contemporaneous models, defined workloads, and explicit distinctions between factual errors, successful tasks, customer prices, training expense, and operating costs.
source_requirements: Prefer documented evaluations and actual operating-cost measurements; disclose reliance on developers' own tests.
