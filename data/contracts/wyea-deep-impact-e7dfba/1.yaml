assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI doesn’t solve any trillion-dollar problems
  - nor does it create outcomes that are profitable
  - for any particular business
evaluator_interpretation:
  - These are universal negatives about realized results, not forecasts about eventual economic potential.
  - A profitable business outcome means attributable financial benefits exceeding implementation and operating costs. Neither revenue nor the customer's overall profit establishes this.
  - A single adequately documented profitable deployment would defeat the profitable-outcomes limb, without settling the trillion-dollar limb.
  - For this cross-business financial observation, use calendar 2024, the latest completed operating year before publication. The speaker supplied no common quarter or reporting calendar.
  - The financial scope represents unspecified deploying businesses, not a claim about any one AI vendor's income statement.
support_condition: Evidence establishes the absence of both realized solutions at the stated economic scale and positive net financial outcomes from business deployments across the claimed scope.
contradiction_condition: At least one documented deployment produces attributable financial gains exceeding all implementation and operating costs during the target period, or a documented solution addresses a problem of the stated trillion-dollar scale.
measurement_requirements: Separate realized benefits from forecasts and annualized savings; account for implementation, inference, integration, supervision and other operating costs. State the economic meaning and time basis of trillion-dollar.
source_requirements: Deployment-level financial records or transparent evaluations with attributable benefits and full costs. Promotional savings claims and macroeconomic forecasts are insufficient by themselves.
