explicit_source_elements:
  - ChatGPT Plus and free users
  - will eventually get access
  - a few Deep Research queries a month
  - will only increase its cash burn further
evaluator_interpretation:
  - The antecedent requires Deep Research access for both Plus and free users.
  - The plain reading predicts increased net cash outflow attributable to expanding access, compared with not expanding access.
  - Additional computing expense alone does not establish additional net cash burn; associated revenue, retention and efficiency effects must be included.
  - The claim provides no deadline or accounting definition of cash burn. No deadline is added.
  - The lightweight version counts as Deep Research access because the claim does not require an unchanged underlying model.
support_condition: After both tiers receive access, credible matched cash-flow evidence establishes that the expansion increases net cash outflow after attributable revenue and savings.
contradiction_condition: After both tiers receive access, credible matched evidence establishes that the expansion is cash-neutral or reduces net cash outflow over a representative operating period.
measurement_requirements: Measure incremental cash costs, attributable receipts and savings against a credible no-rollout comparison. Separate cash payments from accounting losses and company-wide forecasts.
source_requirements: Dated rollout records plus disclosed product-level cash-flow records or a credible causal financial analysis.
