explicit_source_elements:
  - Too many edge cases
  - not enough reasoning
evaluator_interpretation:
  - Read the sentence in its immediate context as describing practical weaknesses of the contemporary systems exemplified by Tesla FSD, Bing, and Bard.
  - The ordinary reading is that unusual inputs or situations exposed material reliability problems and that reasoning was insufficient for dependable intended use. It does not assert that the systems had no reasoning ability.
  - "Use the latest reporting window identified by the surrounding post: the preceding calendar week through February 16, 2023. This is a snapshot of contemporary performance, not a claim about later systems."
  - Evaluations of other contemporary systems can inform the broader observation, but cannot by themselves establish the capabilities of the three named products.
support_condition: Contemporaneous evaluations or failure analyses establish both material failures on unusual situations and inadequate reasoning for the intended uses of the systems under discussion.
contradiction_condition: Representative evaluations of the relevant systems establish dependable handling of unusual situations and sufficient reasoning for their intended uses, undermining the claimed practical shortfall.
measurement_requirements: Identify system versions, test dates, intended tasks, unusual-input performance, and reasoning performance. Distinguish factual retrieval errors from failures to reason, and isolated examples from representative reliability evidence.
source_requirements: Prefer contemporaneous technical evaluations, reproducible tests, regulatory findings, and engineering disclosures. Tests of other systems or unidentified versions are contextual.
