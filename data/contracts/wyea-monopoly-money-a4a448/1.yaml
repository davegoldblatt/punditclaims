assessment_axis: historical_observation
explicit_source_elements:
  - No private startup
  - afford to build and scale a Large Language Model
  - without the help of Google, Amazon or Microsoft
evaluator_interpretation:
  - The ordinary reading is a universal claim of necessary financial or computing dependence on at least one of the three named companies.
  - A privately financed startup qualifies even if its founder or parent business is wealthy. The source does not exclude such startups.
  - Building and scaling means training a substantial competitive model and deploying inference, not merely announcing a model or fine-tuning someone else's small model.
  - Help means material funding or computing infrastructure necessary for development and deployment. Incidental use of ordinary software or public research is not effective dependence.
  - "For the ongoing state, use the latest completed calendar quarter before publication: April through June 2024."
  - No particular company's financial amount or accounting measure is asserted, so metric_scope is null.
support_condition: Comprehensive evidence shows that private startups developing and deploying substantial LLMs necessarily depended on funding or compute from Google, Amazon, or Microsoft.
contradiction_condition: At least one private startup trained and deployed a substantial competitive LLM using independently identified financing and infrastructure outside the three named companies.
measurement_requirements: Establish the model's existence and deployment during the target period, the startup's private status, and the sources of its financing and compute.
source_requirements: Prefer technical reports and corporate records. Retrospective reporting may establish earlier arrangements, but later model achievements cannot substitute for a pre-post counterexample.
