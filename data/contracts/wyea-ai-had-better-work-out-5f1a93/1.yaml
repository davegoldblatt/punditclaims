assessment_axis: forecast_outcome
explicit_source_elements:
  - if one customer can’t pay
  - other customers can’t pay
  - less demand for AI data centers in general
  - a glut of data center infrastructure
  - assets you intend to resell
  - won’t be worth as much
evaluator_interpretation:
  - Treat this as a conditional prediction of linked payment failures, weaker aggregate demand, excess capacity, and lower comparable resale values.
  - The speaker supplies no minimum customer size. Include customers buying AI compute through cloud providers rather than adding a major-tenant threshold.
  - An ongoing payment inability that began shortly before publication can satisfy the condition; it need not originate after the post.
  - Exclude the rhetorical claim that nobody considers the risk from the forecast outcome.
  - No deadline or response lag is supplied.
support_condition: A verified customer inability to pay is followed by linked failures among other customers, weaker aggregate AI data-center demand, excess capacity, and lower comparable resale values attributable to that sequence.
contradiction_condition: A completed, well-documented episode establishes that the asserted necessary chain failed, with the initial payment problem durably resolved and no continuing transmission mechanism. Mere nonoccurrence by the evaluation date is insufficient.
measurement_requirements: Payment-default or insolvency records, evidence connecting subsequent failures, capacity demand and vacancy, and comparable asset resale transactions adjusted for equipment age and technology.
source_requirements: Prefer court records, creditor disclosures, customer filings, independent capacity surveys, and completed asset sales. Clearly identify reporting used in place of court documents.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Resolve only upon a documented completed chain, or a completed episode that decisively rules out the claimed necessary transmission. A bankruptcy filing alone does not settle the outcome.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Customer size and whether indirect cloud customers count are unspecified.
  - The condition does not specify whether an already ongoing inability to pay qualifies.
  - No deadline or causal response lag is stated.
  - The comparison baseline for asset values is unspecified.
retrospective_or_prospective: retrospective
