assessment_axis: forecast_outcome
explicit_source_elements:
  - if one customer can't pay
  - other customers can't pay
  - less demand for AI data centers in general
  - a glut of data center infrastructure
  - those assets you intend to resell ... won't be worth as much
evaluator_interpretation:
  - In context, 'customer' means a tenant of an AI data center whose lease payments back data-center bonds or loans (for example a lab, hyperscaler or neocloud leasing capacity). It does not mean any company that buys cloud compute indirectly.
  - The antecedent is met only if such a tenant publicly fails to pay its data center obligations (missed lease payments, default, or bankruptcy that stops payment).
  - "Only if that happens can the chain be scored: other tenants failing to pay, falling demand, a capacity glut, and lower resale values for data center assets."
  - No deadline is stated, so this is an open conditional.
support_condition: After a data center tenant fails to pay, public records show other tenants also failing to pay, falling demand or rising vacancy for AI data center capacity, and lower resale or collateral values for data center assets.
contradiction_condition: After a data center tenant fails to pay, other tenants keep paying, demand for AI data center capacity holds, and the affected assets are re-leased or sold without a material loss in value.
measurement_requirements: A dated, public tenant non-payment on an AI data center. Then default records, vacancy or absorption data, lease pricing, and transaction or collateral values for data center assets.
source_requirements: Court records, company filings, lender disclosures, credit-rating actions, or reputable financial press, plus industry vacancy and pricing data.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_met
early_resolution_rule: The forecast can be scored only after a dated public event in which an AI data center tenant fails to pay. It is supported if other tenant defaults, falling demand and lower asset values follow. It is contradicted if the failed tenant's capacity is re-leased or sold at little or no loss while demand holds.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Customer' could be read more broadly as any buyer of cloud compute. In context it means a data-center tenant whose payments back the debt."
  - No time frame is given for the chain to play out.
retrospective_or_prospective: retrospective
