assessment_axis: historical_observation
explicit_source_elements:
  - $35 billion cloud compute deal
  - there wasn’t anyone else willing or capable of signing a deal that large
  - nor was there enough diverse demand
evaluator_interpretation:
  - The assessed proposition is the inference about alternative buyers and demand, rather than the separate prediction about publicity.
  - I read anyone else as another credible buyer for comparable Lambda capacity on commercially comparable terms.
  - Diverse demand means sufficient commitments from multiple independent customers to absorb comparable capacity; a count of small customers alone cannot establish this.
  - The target is the transaction described immediately before publication, using August 2026 through September 1 as its contemporaneous observation window.
support_condition: Procurement, sales or financing records show that Lambda lacked another willing and financially capable buyer at approximately the stated scale, and lacked sufficient diversified customer commitments for comparable capacity.
contradiction_condition: Records identify a credible alternative buyer willing and able to make a comparable commitment, or demonstrate sufficient diversified commitments for that capacity at the time.
measurement_requirements: Compare contract value, duration, capacity, delivery dates, credit support and payment terms. Distinguish customer count from demand weighted by committed capacity or spending.
source_requirements: Prefer bids, contracts, customer concentration disclosures and lender underwriting records. A single large contract does not establish the absence of alternatives.
