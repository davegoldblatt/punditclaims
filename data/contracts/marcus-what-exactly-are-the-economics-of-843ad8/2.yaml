evaluator_interpretation:
  - Only the firm rejection of hundreds of billions is eligible for scoring. Billion-scale revenue would not contradict the qualified phrase 'probably not billions'.
  - The ordinary revenue reading is money earned from generative AI products and services. The surrounding discussion also mentions profits, so this reading is not explicit.
  - "'So far' means cumulative earnings through August 14, 2023. No starting date or reporting quarter is supplied."
  - Treat hundreds of billions as the $100-billion order of magnitude. Evidence near the boundary would require clarification.
  - Marcus supplies no accounting basis for the sector-wide amount. Reports about OpenAI elsewhere in the passage do not establish a basis for the entire sector.
support_condition: Comparable evidence establishes that cumulative generative AI revenue through August 14, 2023 remained below the hundreds-of-billions band, with sufficiently complete coverage to bound the total.
contradiction_condition: Comparable evidence establishes cumulative generative AI revenue clearly within or above the hundreds-of-billions band by August 14, 2023. Merely reaching billions does not contradict the scored commitment.
measurement_requirements: Cumulative realized revenue, a defined industry boundary, consistent accounting, and treatment of transactions between suppliers and vendors that avoids double counting. Financing, valuations, forecasts and annualized run rates cannot substitute.
source_requirements: Company disclosures or a documented industry reconstruction covering the claimed period. An unknown accounting basis prevents a supported or contradicted score.
