evaluator_interpretation:
  - I read 'made' provisionally as revenue earned from generative-AI products and services. The surrounding discussion explicitly compares revenue with investment and costs, although its references to profits leave a material ambiguity.
  - "'So far' means cumulative revenue through August 14, 2023. No starting date is supplied."
  - The ordinary scope is generative-AI products and services, excluding financing, valuations, and revenue from hardware not specifically attributable to generative AI.
  - The hundreds-of-millions estimate and the rejection of billions are qualified. The rejection of hundreds of billions is firm.
  - No accounting basis or source for the industry-wide figure is identified; accounting_basis therefore remains unknown.
support_condition: A sufficiently complete, consistently defined estimate of cumulative realized generative-AI revenue through August 14, 2023 places it in the hundreds of millions, below the billion-dollar scale and far below $100 billion.
contradiction_condition: Comparable cumulative realized revenue clearly reaches the billion-dollar scale, challenging the qualified estimate, or reaches at least $100 billion, contradicting the firm upper bound. Annualized rates, later revenue, and forecasts alone do not qualify.
measurement_requirements: Industry-wide realized revenue, with coverage, accounting treatment, and treatment of transactions between vendors disclosed. Separate cumulative revenue from annual forecasts, run rates, profits, financing, and infrastructure sales.
source_requirements: Company disclosures or a transparent industry revenue estimate covering the relevant period and product scope.
