evaluator_interpretation:
  - In context, Marcus disputes trouble-free symbolic and compositional processing in contemporary neural networks. He does not claim that neural networks can never manipulate symbols.
  - Symbolic manipulation includes preserving structured relationships when interpreting or transforming expressions.
  - For this ongoing technical state, I use the 2022 research period through publication. Unlike financial reporting, this field has no standard reporting quarter.
  - The historical elaboration is assessed separately in the next listed claim.
support_condition: Contemporary controlled tests document substantial failures in symbolic or compositional manipulation by capable neural models.
contradiction_condition: Evidence establishes reliable handling of the relevant symbolic and compositional tasks across the tested conditions, or shows that the alleged contemporary failures did not occur. Success on unrelated symbolic tasks alone is insufficient.
measurement_requirements: Use clearly specified tasks, model identities, and generalization conditions. Distinguish observed performance from theoretical computational capability.
source_requirements: Original experimental papers or documented contemporary demonstrations, with successful symbolic applications included as qualifications.
