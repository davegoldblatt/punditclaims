early_resolution_rule: An early resolution requires an irrevocable settlement or legally complete funding arrangement that settles the deadline-period affordability test and establishes the relevant revenue condition. Present revenue, financing announcements, or projections alone cannot do so.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
