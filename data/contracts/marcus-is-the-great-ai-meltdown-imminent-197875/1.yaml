explicit_source_elements:
  - over the last few days
  - apparently pulled back
  - $100B promise
  - hinting at something like a more modest $20B
evaluator_interpretation:
  - Interpret 'the last few days' as the week ending with the February 5 post.
  - "Preserve 'apparently' and 'hinting': assess whether contemporary reports reasonably indicated a stalled $100 billion plan and a prospective investment around $20 billion."
  - Do not interpret this as claiming a legally binding commitment was cancelled or that $20 billion had already been transferred.
  - The numbers are reported estimates of contemplated financing. A single funding-round investment is not necessarily a replacement ceiling for the entire multiyear relationship.
support_condition: Contemporary reliable reporting describes the original plan as stalled or being reconsidered and identifies roughly $20 billion as Nvidia's contemplated investment.
contradiction_condition: The apparent retreat or $20 billion reporting did not exist, was corrected as erroneous, or contemporaneous definitive records established an unchanged binding $100 billion commitment and excluded the suggested shift.
measurement_requirements: Compare proposed investments, not completed payments. Distinguish one funding round from the original multiyear ceiling.
source_requirements: Reporting and company statements describing the January 30–February 5 state of negotiations; preserve denials and uncertainty.
