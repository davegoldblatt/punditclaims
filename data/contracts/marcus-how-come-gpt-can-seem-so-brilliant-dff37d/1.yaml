  - At least for now
  - it still takes a human
  - to know which plausible bits actually belong together
evaluator_interpretation:
  - For now describes the present at publication; it is not a conditional forecast.
  - The ordinary reading is that dependable assessment of factual and relational compatibility still required human checking.
  - The claim is not read as denying that automated checks sometimes succeed or asserting that humans never err.
  - The full post discusses the preceding 24 hours, so the target is the public system snapshot from November 30 through December 1, 2022.
support_condition: Evaluations of the relevant systems and available automated checking methods establish that dependable judgments of plausible factual and relational combinations still require human assessment.
contradiction_condition: A system available in the target period reliably performs the claimed judgments across ordinary contexts without human assessment of its outputs.
measurement_requirements: Compare generation and verification separately, including automated checking methods and human review on representative plausible errors. Hallucination rates alone do not establish that human review is necessary.
source_requirements: Primary evaluations of systems available in the target period. Earlier or different-model self-evaluation results are context unless directly applicable.
