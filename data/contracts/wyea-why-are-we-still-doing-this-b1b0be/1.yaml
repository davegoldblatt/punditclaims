assessment_axis: historical_observation
explicit_source_elements:
  - Pretty much every AI startup
  - is in SaaS
  - raises hundreds of millions of dollars
  - single or double-digit millions of dollars a month
evaluator_interpretation:
  - "'Pretty much every' means an overwhelming proportion, allowing exceptions; one outlier cannot refute it."
  - The claim jointly concerns business model, funding and revenue. Evidence must link those attributes for the same companies.
  - The surrounding examples divide annualized revenue by twelve. Read monthly revenue as a monthly run-rate equivalent, not independently verified revenue earned in a particular month.
  - Use the latest information available before the post, including the 2025 fundraising explicitly discussed in the context. The target window therefore covers 2025 through March 17, 2026.
  - The financial basis is estimate because the context relies on reported private-company figures. The single metric_scope describes the revenue component; funding remains a separate required measure.
support_condition: A representative dataset shows that an overwhelming proportion of AI startups jointly sell SaaS, have raised hundreds of millions of dollars, and have monthly revenue run rates of at least $1 million but less than $100 million.
contradiction_condition: A representative dataset shows that a substantial share of AI startups fails one or more of those conditions.
measurement_requirements: Define the startup population and denominator, identify SaaS business models, measure cumulative funding separately from revenue, and distinguish monthly run-rate equivalents from realized monthly revenue.
source_requirements: Representative company-level funding and revenue records with dates and coverage information. Selected prominent startups cannot establish a population-wide proportion.
metric_scope:
  company: AI startups
  metric: Monthly revenue run-rate equivalent
  currency: USD
  units: millions per month
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2026-03-17
  stock_or_flow: flow
  annualized_or_realized: annualized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period:
