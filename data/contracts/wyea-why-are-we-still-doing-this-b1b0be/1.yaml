  end: 2026-03-17
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No numerical threshold for 'pretty much every'.
  - AI startup and SaaS are not defined.
  - The context emphasizes prominent application startups, while the wording covers all AI startups.
  - Funding could mean cumulative capital or individual rounds.
  - Monthly revenue is inferred from annualized figures.
  - The observation window is inferred from current revenue claims and the contextual 2025 funding history.
retrospective_or_prospective: retrospective
