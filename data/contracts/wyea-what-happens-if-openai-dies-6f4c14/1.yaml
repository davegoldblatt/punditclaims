assessment_axis: forecast_outcome
explicit_source_elements:
  - at some point in the next three months
  - going to need more money
  - likely tens of billions of dollars
  - will likely require up-front payments
  - capacity that OpenAI does not have
evaluator_interpretation:
  - The deadline is November 18, 2026, three calendar months after publication.
  - The firm prediction is that additional outside money becomes necessary within that interval to cover operations or payment obligations.
  - The amount and proposed supplier-payment mechanism are qualified by 'likely'; they are not antecedents conditioning the main prediction.
  - Seeking financing is relevant evidence, but precautionary fundraising or receiving an already scheduled installment does not alone prove an uncovered payment need.
  - Use estimate accounting basis because the surrounding argument relies on reported financial estimates.
support_condition: Dated financial records or well-sourced reporting establish that OpenAI requires additional outside funds to cover obligations within August 18 through November 18, 2026.
contradiction_condition: After the deadline, complete liquidity and payment records show that available funds and operating receipts covered obligations throughout the interval without additional outside money being needed.
measurement_requirements: Distinguish funds sought, funds received and funds needed. Establish payment dates, available liquidity and whether new receipts were previously committed.
source_requirements: Prefer company liquidity disclosures and contractual payment schedules. Reliable reporting may establish necessity if it identifies the timing and basis.
metric_scope:
  company: OpenAI
  metric: Additional outside financing needed to cover obligations during the forecast interval
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-08-18
  period_end: 2026-11-18
  stock_or_flow: flow
