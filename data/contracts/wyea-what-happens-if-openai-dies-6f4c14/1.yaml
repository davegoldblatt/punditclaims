plain_reading: true
ambiguity_flags:
  - "'Need more money' could mean an actual funding requirement or merely another fundraising effort."
  - The amount and supplier-payment mechanism are explicitly probabilistic.
  - It is unclear whether scheduled receipts under existing commitments count as 'more money'.
