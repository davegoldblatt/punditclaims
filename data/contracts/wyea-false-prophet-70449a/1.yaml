assessment_axis: historical_observation
explicit_source_elements:
  - many, many, many examples
  - OpenAI — or AI more broadly
  - will do something it can’t and likely won’t
  - without any real pushback
evaluator_interpretation:
  - The plain reading alleges a recurring pattern of unsupported capability promises receiving uncritical coverage before the post.
  - Many does not mean every statement or every outlet. Individual critical articles cannot disprove the alleged pattern.
  - A promised future capability is not disproved merely because it was unavailable when promised. The assessment needs the actual promise, its qualifications, contemporary capability evidence, and the associated coverage.
support_condition: A substantial set of documented examples establishes both unsupported capability promises and reporting that accepted those promises without meaningful scrutiny.
contradiction_condition: A sufficiently representative examination of the relevant promises and coverage shows that the alleged recurring pattern does not hold.
measurement_requirements: Pair original statements with contemporary capability evidence and coverage. Distinguish reporting a claim from endorsing it.
source_requirements: Original recordings or transcripts, contemporary technical evidence, and the actual news coverage.
