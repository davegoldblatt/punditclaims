evaluator_interpretation:
  - "Plain reading: as of the post date (2024-01-30), new Teslas still could not drive themselves without a human supervising. That is, the self-driving promise had not been delivered."
  - No period is named for 'has yet to keep', so I use the weeks just before the post (December 2023 to the post date). Public Tesla and regulatory documents from that time could report on it.
  - The claim is about what was delivered. It does not turn on Musk's exact 2016 wording.
support_condition: Tesla or regulator documents from around January 2024 show that Tesla's driving features, including Full Self-Driving, needed active driver supervision and did not make the car autonomous.
contradiction_condition: Evidence that by January 2024 new Teslas could drive themselves without human supervision, for example a released unsupervised or driverless capability.
measurement_requirements: Tesla's own description of its features and their supervision requirements, or regulator filings, dated in the target period.
source_requirements: Tesla support pages or filings, or NHTSA recall documents. News reports only as context.
