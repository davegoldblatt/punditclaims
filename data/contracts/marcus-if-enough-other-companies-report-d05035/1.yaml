evaluator_interpretation:
  - The plain reading is that customers were showing limits to their willingness to purchase or deploy AI at prevailing costs and usefulness.
  - A documented pricing objection, restriction, or cancellation qualifies as a sign. The claim does not require aggregate AI demand to be falling.
  - I use May 1–26, 2026 because the surrounding examples concern recent customer decisions.
support_condition: Contemporaneous evidence shows a customer reconsidering AI deployment because of price or practical usefulness, indicating that willingness to buy is conditional.
contradiction_condition: Reliable evidence refutes the alleged customer constraints and shows that the cited actions did not reflect concerns about costs or usefulness.
measurement_requirements: An identifiable customer statement or decision linked to price or usefulness; no aggregate spending decline is required.
source_requirements: Company disclosures or credible reporting of customer decisions and statements.
