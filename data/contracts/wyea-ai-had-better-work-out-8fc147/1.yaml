explicit_source_elements:
  - Amazon
  - $54 billion in capex last quarter
  - $3 billion worth of GPU deliveries every month
  - for the foreseeable future
  - cannot install them
  - in some cases lacks an idea of when
evaluator_interpretation:
  - "Read 'last quarter' as the latest reported quarter before publication: April–June 2026."
  - Read the delivery assertion as actual receipts under an ongoing procurement schedule. The surrounding quotation describes a projection, so actual receipts and planned receipts must be distinguished.
  - Read 'GPUs' as GPU-containing racks, consistent with the quoted reporting, rather than the value of bare GPU chips.
  - Read 'supply glut' as equipment exceeding immediate installation capacity at some Amazon sites, not proof of an industry-wide surplus.
  - The target period encompasses the separate quarterly spending assertion and the August–October procurement account. The contract's single metric_scope describes the principal delivery claim; capex is checked separately.
support_condition: Records establish approximately $54 billion of capex in the latest reported quarter, approximately $3 billion of actual monthly rack receipts after August, and some received equipment awaiting installation without a clear installation schedule.
contradiction_condition: Comparable records materially disprove the spending figure, recurring delivery amount, or reported installation backlog. A projection without confirmation is insufficient support, but is not itself a contradiction.
measurement_requirements: Separate completed receipts from forecasts; rack value from chip value; equipment awaiting power from equipment without eventual demand. Check quarterly capex independently of monthly procurement.
source_requirements: Prefer Amazon disclosures and procurement or installation records. Original reporting on internal documents can establish reported plans; derivative summaries require caution.
