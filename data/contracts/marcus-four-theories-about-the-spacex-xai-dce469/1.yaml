evaluator_interpretation:
  - The claim concerns the purpose of the February 2, 2026 merger, not a forecast.
  - A bailout means financial support intended to relieve substantial financial distress. It need not involve insolvency or a cash purchase price.
  - High spending and access to a larger company's resources are relevant but do not, alone, establish a rescue motive.
  - The surrounding discussion relies on financial reporting, so the implied financial basis is estimate. Marcus specifies no cash amount.
support_condition: Transaction records or well-sourced reporting establish that relieving xAI's financial distress through substantial financial support was a material purpose of the merger.
contradiction_condition: Reliable records establish that xAI was not financially distressed and that the transaction did not provide or arrange material financial support for it.
measurement_requirements: Distinguish money available to xAI from payments to selling shareholders, acquisition valuation, and proposed IPO proceeds.
source_requirements: Prefer transaction documents, financing agreements, and contemporaneous internal records. External commentary about motives is insufficient by itself.
