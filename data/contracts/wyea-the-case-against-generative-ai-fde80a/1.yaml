explicit_source_elements:
  - now, at this point
  - on the hook for over a trillion dollars
  - no clear explanation as to how it’ll afford any of this
  - beyond “we need more money”
evaluator_interpretation:
  - Assess spending commitments attributable to OpenAI and outstanding at publication, rather than spending actually incurred.
  - The wider post builds its total from reported contracts and estimated infrastructure and operating costs. Treat its accounting basis as estimate.
  - The ordinary reading of 'on the hook' requires commitments attributable to OpenAI; an entire partner project's construction budget is not automatically OpenAI's obligation.
  - Avoid counting the same infrastructure through both construction costs and payments for access to it unless the obligations are demonstrably separate.
  - Interpret the funding clause as absence of a sufficiently specified plan covering the commitments, not absence of any financing announcement.
  - Use a publication-date snapshot because the claim explicitly says 'now, at this point' and aggregates commitments announced at different times.
support_condition: A non-overlapping reconstruction establishes more than USD 1 trillion of OpenAI's own spending commitments existing on September 29, 2025, and the contemporaneous disclosure record lacks a specified plan covering their funding needs.
contradiction_condition: A sufficiently complete reconstruction establishes commitments of USD 1 trillion or less, or contemporaneous disclosures provide a specified funding plan covering the claimed obligations. Partial disclosures alone cannot establish an upper bound.
measurement_requirements: Identify each obligation, responsible entity, duration, conditionality, payment amount, and overlap. Separate financing proceeds, project investment, estimated future costs, and OpenAI purchase commitments.
source_requirements: Contracts, filings, company announcements, or independently sourced estimates with an explicit reconciliation. Later agreements cannot be backdated.
