  - The post combines estimated operating costs, infrastructure costs, and compute contracts.
  - The amount of partner-financed infrastructure attributable to OpenAI is unspecified.
  - No clear explanation supplies no objective standard for funding-plan completeness.
  - The commitment stock is evaluated at publication rather than over an accounting quarter.
