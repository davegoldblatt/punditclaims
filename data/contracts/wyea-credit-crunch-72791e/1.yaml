explicit_source_elements:
  - 50% to 60% of NVIDIA’s revenues
  - hyperscalers
  - without that boom
  - the debt necessary to keep buying chips
  - nobody else is buying them at anything close to today’s scale
evaluator_interpretation:
  - This combines a current revenue-share assertion with a conditional prediction. The overall proposal follows the conditional prediction; the current assertion is examined separately.
  - "For the revenue-share assertion, use NVIDIA's latest reported fiscal quarter before October 6: the quarter ended July 26, 2026."
  - Use total NVIDIA revenue as the denominator, not only Data Center revenue.
  - Read the condition as a broad end to the debt-supported AI purchasing boom, not a stock-price decline or financing difficulty at one company.
  - Read replacement demand as purchases by buyers outside the named hyperscaler group at a scale comparable to the pre-collapse business. The speaker supplies no percentage for 'anything close'.
  - The supplied words do not identify the accounting basis or the source underlying the 50–60% figure.
support_condition: After the specified boom and its supporting financing end, comparable sales records show that other buyers do not sustain purchases near the pre-event scale. The current numerical premise separately requires a matching hyperscaler share between 50% and 60%.
contradiction_condition: After the condition occurs, durable purchases by other buyers reach approximately the pre-event scale. A matching current-period revenue share outside 50–60% would separately contradict the numerical premise.
measurement_requirements: Separate direct and ultimate buyers, use a consistent hyperscaler classification, compare realized revenue over equivalent periods, and identify when the conditional funding and demand change occurred.
source_requirements: Company revenue disclosures and customer-concentration records, followed by dated financing and purchasing evidence establishing the condition and subsequent outcome.
