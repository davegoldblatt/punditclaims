assessment_axis: historical_observation
explicit_source_elements:
  - cheaper open source Chinese models
  - offering similar performance to their premium products
  - something that has also already happened
evaluator_interpretation:
  - Assess the supplied normalized proposition about model availability, performance and price. The claim about American labs' exclusive private fears is not established by benchmarks.
  - Already happened is an existence claim extending through publication; it does not require every Chinese model to match every American model.
  - Similar performance means broadly comparable measured capability against premium American products available at the time of comparison.
  - Cheaper means a lower comparable access price, not lower training expenditure or equal cost for every completed task.
  - Open source is read in the common model-market sense of publicly available weights usable for deployment, rather than complete disclosure of training data and a reproducible training pipeline.
support_condition: A dated pre-publication example establishes an available Chinese open-weight model with comparable measured capability and a lower comparable serving price than a contemporaneous premium American product.
contradiction_condition: The claimed examples fail on openness, comparative price or meaningful performance, and sufficiently broad contemporaneous evidence finds no qualifying example.
measurement_requirements: Dated model availability, openness information, comparable benchmark settings and prices measured on the same token or workload basis.
source_requirements: Model releases or papers plus independent benchmarks and dated prices. A dated report preserving historical benchmark data may substitute for an overwritten live leaderboard.
