assessment_axis: causal_assessment
explicit_source_elements:
  - ChatGPT is only free to hundreds of millions of people
  - because OpenAI is able to raise hundreds of billions of dollars
  - subsidize its subscribers anywhere from $8 to $13.50 for every dollar of revenue
  - because of endless venture welfare
evaluator_interpretation:
  - Only because asserts that outside financing is necessary to maintain the described access, rather than merely contributing to it.
  - Subsidy ordinarily means actual service costs exceeding subscription receipts. API list-price equivalents are not provider costs.
  - The ongoing financial state is assessed over Q1 2026, the latest completed calendar quarter before the post that public reporting could describe.
  - The single contract metric records the quantified Anthropic subsidy assertion. OpenAI financing and access require separate evidence and cannot substitute for subscriber economics.
  - The supplied passage identifies no accounting basis for the subsidy calculation; it remains unknown.
support_condition: Matched subscriber revenue and actual attributable costs establish an $8–$13.50 subsidy per revenue dollar, and financing records establish that both companies could not maintain the described access without outside capital.
contradiction_condition: Comparable subscriber economics place the subsidy outside the stated range, or financial evidence establishes that either described service could be maintained without the asserted dependence on outside capital.
measurement_requirements: Separate subscription revenue, actual serving costs, training costs, financing commitments, cash received, free users, and paid users. State whether subsidy means cost minus revenue or total cost.
source_requirements: Company financial disclosures or well-sourced reporting with matched subscriber costs and revenue; financing and user disclosures for the other components.
metric_scope:
  company: Anthropic
  metric: Subscriber service subsidy per dollar of subscription revenue
  currency: USD
  units: USD subsidy per USD subscription revenue
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-03-31
  stock_or_flow: flow
