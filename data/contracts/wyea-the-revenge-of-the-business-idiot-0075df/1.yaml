plain_reading: true
ambiguity_flags:
  - No financial reporting period is named; Q1 2026 is the evaluator’s latest-completed-quarter convention.
  - Subsidy could mean actual losses or discounted API-equivalent usage.
  - The passage does not distinguish average subscribers from unusually heavy users.
  - Accounting basis and cost allocation are unspecified.
  - Ability to raise capital is not the same as cash already received.
