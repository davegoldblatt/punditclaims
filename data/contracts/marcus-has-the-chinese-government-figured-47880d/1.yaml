assessment_axis: causal_assessment
explicit_source_elements:
  - Part of Beijing’s response
  - no doubt about protectionism
  - They want homegrown companies like Huawei to prosper
evaluator_interpretation:
  - Protectionism means government limits on foreign-chip purchases intended partly to favor domestic chipmakers.
  - The claim concerns Beijing’s initial response to the H200 export announcement, on December 8–9, 2025.
  - The ordinary reading includes policy deliberations and proposed restrictions; it does not require an enacted import ban.
  - Only a contributing motive is claimed. Protectionism need not be the main or sole reason.
support_condition: Credible reporting about the contemporaneous deliberations, or official records, links Beijing’s proposed or actual H200 restrictions to favoring domestic chip suppliers. Reluctance or restrictions alone are insufficient.
contradiction_condition: Reliable evidence establishes that the reported domestic preference was mistaken and that favoring domestic chipmakers played no part in Beijing’s initial H200 response. Evidence of additional motives alone does not contradict the claim.
measurement_requirements: Identify a connection between the H200 purchase policy being considered and preferential treatment for domestic suppliers. No numerical share of causation is required.
source_requirements: Prefer official policy records or statements. Where these do not disclose the deliberations, use reputable reporting with sources familiar with them, distinguishing proposals from adopted measures.
