early_resolution_rule: A documented broad profitability failure followed by a substantial, sustained and attributable collapse in Nvidia AI-chip orders could establish the predicted sequence. Ordinary fluctuations or revenue growth cannot settle this undated conditional forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Meaningful profits has no threshold or specified cost allocation.
  - Customer and provider populations are unspecified.
  - Dramatically slow does not distinguish falling order levels from slower growth.
  - No deadline or response lag is stated.
  - The canary metaphor has no specified distress measure.
  - The order measure and accounting basis are unspecified.
