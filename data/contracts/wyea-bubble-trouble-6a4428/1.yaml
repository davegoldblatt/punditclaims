assessment_axis: forecast_outcome
explicit_source_elements:
  - likely to be the canary in the coal mine
  - if AI fails to drive meaningful profits for both the customer and the provider
  - orders for Nvidia chips will dramatically slow
evaluator_interpretation:
  - The surrounding discussion concerns generative AI and the demand for Nvidia chips used for it.
  - The condition requires evidence of inadequate profits across customers and providers. Losses at one provider do not establish it.
  - Dramatically slow means a substantial, sustained weakening of orders. Reported revenue is relevant context but is not a measure of orders.
  - The canary metaphor suggests Nvidia would show distress before the wider industry. The speaker gives neither a deadline nor a quantitative probability.
support_condition: After the profitability condition is established, documented Nvidia AI-chip orders weaken substantially and persistently, with evidence linking that weakening to customers' and providers' poor AI economics.
contradiction_condition: After the profitability condition is established, sufficiently complete order records demonstrate sustained strong demand through the resulting customer spending adjustment. Without a specified adjustment period, temporary continued growth is insufficient.
measurement_requirements: Comparable order or cancellation records, together with attributable AI profits after relevant costs for both customers and providers. Revenue and investment announcements cannot substitute for these measures.
source_requirements: Prefer company order disclosures, filings and independently documented customer spending decisions. Profitability surveys must identify their population and limitations.
