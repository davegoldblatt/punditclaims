evaluator_interpretation:
  - The plain reading is a sharp, broad reversal of the generative AI investment boom, visible in valuations and financing or investment activity.
  - An isolated company failure or brief stock-market correction would not establish an industry collapse.
  - Near future expresses urgency but supplies no calendar deadline. I do not substitute a one-year or other fixed deadline.
support_condition: A dated, broad collapse in AI-linked valuations accompanied by substantial financing disruption or investment cancellations establishes the predicted bust.
contradiction_condition: Continued expansion can count against the forecast but cannot conclusively falsify an inevitable future collapse without a specified deadline.
measurement_requirements: Compare broad AI-exposed equity and private-company valuations with completed financing, investment spending, cancellations, and failures. Distinguish forecasts and announced commitments from realized activity.
source_requirements: Prefer market measurements, filings, and financing disclosures; corroborate claims of an industry-wide collapse across independent sources.
