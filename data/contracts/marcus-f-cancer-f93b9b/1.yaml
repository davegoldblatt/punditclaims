assessment_axis: causal_assessment
explicit_source_elements:
  - Over and over
  - discover drugs with AI
  - work on trials in animals
  - not safely enough in humans
  - we just don’t understand biology well enough
evaluator_interpretation:
  - The claim concerns repeated failures across distinct AI-discovered drug candidates, not merely adverse events in several patients receiving one drug.
  - “Not safely enough” means human safety or tolerability prevented viable development or use at an effective dose. An efficacy failure or commercial cancellation does not suffice.
  - The final clause attributes these failures to inadequate biological understanding.
  - The statement describes cumulative experience through publication, without supplying a starting date.
  - The wording concerns AI drug discovery generally, although the surrounding essay discusses cancer.
support_condition: Multiple documented candidates show animal efficacy followed by human safety failure, with investigations supporting inadequate biological understanding as the cause.
contradiction_condition: A sufficiently complete account of relevant candidates and failure causes shows that the asserted recurring animal-efficacy-to-human-toxicity pattern did not occur, or that its claimed causal explanation is wrong. Individual successes alone do not disprove recurrence.
measurement_requirements: Candidate-level records linking material AI involvement, animal efficacy, human adverse outcomes, development decisions, and the reason for failure.
source_requirements: Primary preclinical papers, human trial results, regulatory or registry records, and sponsor disclosures. General drug attrition statistics cannot substitute for AI-specific safety records.
