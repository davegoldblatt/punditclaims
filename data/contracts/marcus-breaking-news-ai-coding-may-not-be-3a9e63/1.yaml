explicit_source_elements:
  - A significant fraction
  - the money that people have paid for Generative AI
  - for coding assistance
evaluator_interpretation:
  - The plain reading is that coding assistance accounted for a substantial, non-negligible share of customer payments for generative AI.
  - The phrase 'have paid' describes payments accumulated through publication, rather than projected revenue or an annualized run rate. The starting date is unspecified.
  - The denominator includes generative AI purchases generally, including consumer and business purchases. Restricting it to enterprise applications would narrow the claim.
  - No numerical threshold, currency, geography, named company or accounting basis is supplied. The metric scope represents the industry aggregate, not a particular company.
support_condition: Comparable data on realized customer payments for coding assistance and generative AI overall establish a substantial share through July 10, 2025.
contradiction_condition: Comparable data establish that coding assistance accounted for only a negligible share of those payments.
measurement_requirements: A consistent numerator and denominator covering the same period and market, with coding use of general-purpose subscriptions and APIs allocated explicitly and intermediary payments not double-counted. Annualized revenue, financing and adoption rates cannot substitute for payments.
source_requirements: Provider disclosures or credible spending measurements with stated coverage and methods. Estimates must be identified as estimates.
