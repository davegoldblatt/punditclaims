assessment_axis: forecast_outcome
explicit_source_elements:
  - All that we will have this year are demos
  - those demos won't work all that reliably
  - this year (2025)
evaluator_interpretation:
  - "Plain reading: AI agents released or shown in 2025 would fail a large share of realistic multi-step tasks, falling well short of the near-perfect reliability needed to trust them without supervision."
  - Independent or academic benchmarks of realistic agent tasks published in 2025 are the right test. Top-agent success rates well below 90% on such tasks count as 'not all that reliable'.
  - This assessment does not test whether 'all we will have are demos'. It tests only the reliability part.
support_condition: Evaluations published in 2025 show leading agents failing a substantial share (for example, a third or more) of realistic multi-step tasks, or documented live deployments show frequent errors.
contradiction_condition: Evaluations published in 2025 show leading agents completing realistic, varied multi-step tasks with high reliability (for example, above about 90%) across the board.
measurement_requirements: Task-completion rates for leading 2025 agents on realistic benchmarks, or documented failure rates from live trials.
source_requirements: Benchmark papers, company evaluation disclosures, or documented experiments published in 2025.
metric_scope: null
original_horizon: this year
horizon_interval:
  start: 2025-01-15
  end: 2025-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Not all that reliably' has no numeric threshold."
  - "'Demos' could mean only showcase demos or all agent products released in 2025."
  - Reliability varies a lot by domain. Coding agents scored much higher than general office or web agents.
retrospective_or_prospective: retrospective
