assessment_axis: forecast_outcome
explicit_source_elements:
  - '"Vibe coding" does not work'
  - it will not work
  - a fully-functional, secure, and useful app made entirely by someone who cannot code
evaluator_interpretation:
  - "Use the surrounding app description to define works: a non-coder produces useful, functional software with reasonable security for its intended deployment."
  - Assess the continuing future impossibility assertion. The present-tense component is addressed by claim 965aba.
  - No deadline is supplied, so the forecast has an open horizon.
  - A qualifying app may use ordinary libraries and hosted services, but cannot depend on a programmer supplying application-specific implementation or repairs.
  - Security requires credible testing against the app's intended risks, not proof that no vulnerability could ever exist.
support_condition: Establish a general impossibility that applies to future vibe-coding systems. Failures or the absence of a qualifying example by a finite evaluation date cannot support an unlimited negative forecast.
contradiction_condition: A documented qualifying app exists during the forecast period, with verified non-coder authorship, useful functionality, and independent security validation.
measurement_requirements: Tie the authorship record, functional tests, practical use, and security assessment to the same deployed app version.
source_requirements: Dated build records plus independent functionality and security validation. Vendor case studies and automated scan summaries alone are insufficient.
metric_scope: null
