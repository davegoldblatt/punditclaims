evaluator_interpretation:
  - "The ordinary reading concerns the underlying activities: understanding and summarizing messages, discussing podcast content, preparing for meetings, and researching a subject."
  - It does not claim that people can reproduce an AI assistant's exact interface without AI, or that AI cannot save time.
  - AI means the assistant technology discussed in the passage. Conventional software and search engines do not disqualify an otherwise human method.
  - This is a capability claim established by the publication date, rather than an activity rate with a quarterly reporting period. Earlier demonstrations therefore qualify; the source supplies no lower date bound.
  - The assessment covers the named tasks. The unidentified 'other tasks' cannot be evaluated.
support_condition: Documented human methods or examples establish that each named activity can be performed without an AI assistant.
contradiction_condition: At least one named underlying activity requires an AI assistant, rather than merely benefiting from one.
measurement_requirements: Evidence of feasible human performance is sufficient. Equal speed, cost, workload, and convenience are not required.
source_requirements: Prefer documented human work, research methods, and instructions from the people or institutions performing the activities.
