assessment_axis: causal_assessment
explicit_source_elements:
  - every single AI service you use
  - subsidized compute
  - every single service is losing money
  - as a result
evaluator_interpretation:
  - The ordinary contextual scope is paid generative-AI services, including the chat and coding subscriptions discussed nearby, rather than every business that uses AI.
  - Subsidized compute means actual service-delivery costs exceed the receipts supporting that usage. Discounts from API list prices do not establish this.
  - The statement concerns service-level losses caused by compute subsidies, rather than merely company-wide losses from training, research or expansion.
  - "For the ongoing financial state, use the latest completed calendar quarter before publication: January through March 2026."
  - The claim names no accounting basis for its universal loss assertion; accounting_basis is therefore unknown.
support_condition: Comparable service-level accounts establish losses and compute subsidies throughout the relevant population, with evidence connecting those subsidies to the losses.
contradiction_condition: A clearly in-scope service has matching-period records showing profitability or a cost reconciliation disproving the claimed compute subsidy. An unspecified accounting basis must be resolved before a definitive financial outcome.
measurement_requirements: Service-level revenue, actual inference expense, other costs and profitability on a consistent basis. Separate subscriptions from API sales, and serving costs from training and financing effects.
source_requirements: Service-level financial disclosures or credible reporting with clear periods and definitions. Company-wide results and isolated heavy-user examples are context only.
metric_scope:
  company: Generative-AI subscription services, including OpenAI, Anthropic, GitHub Copilot, Perplexity and Lovable
  metric: Service-level losses attributable to compute costs exceeding subscription receipts
