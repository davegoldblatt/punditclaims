explicit_source_elements:
  - Nobody has a moat
  - generative AI
evaluator_interpretation:
  - The ordinary business meaning of a moat is a durable competitive advantage that competitors cannot readily reproduce or overcome.
  - I read the scope as companies supplying generative AI, including incumbent technology companies, rather than only independent model laboratories.
  - Relevant advantages include defensible technology, exclusive resources, distribution, switching costs and network effects. A temporary benchmark lead alone is insufficient.
  - I use July 2024 through the post date as the reporting window for the claimed ongoing competitive state.
support_condition: Broad contemporary evidence establishes that no generative AI supplier possessed a durable competitive advantage across the relevant sources of advantage.
contradiction_condition: Evidence identifies at least one generative AI supplier with an established, durable advantage protecting its generative AI business against competitors.
measurement_requirements: Identify the company, relevant market, mechanism of advantage and evidence of durability. Distinguish present advantages from hypothetical future barriers.
source_requirements: Prefer competition-authority assessments, contracts, company disclosures and independent market evidence. Treat interested companies' competitive claims cautiously.
