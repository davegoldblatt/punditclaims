explicit_source_elements:
  - Oracle’s $18 billion September bond sale
  - would have
  - over $7 billion in added interest
  - over the course of the bonds
  - both the sell-off of Oracle’s debt and the overall Treasuries market
evaluator_interpretation:
  - "This is a publication-date counterfactual: the same borrowing repriced at then-current market rates. It does not claim that existing fixed coupons reset."
  - The plain reading compares undiscounted lifetime interest on the same principal amounts and original borrowing tenors.
  - Use rates available when the post appeared on October 6, 2026. Later October rates cannot settle this observation.
  - Treat the added-interest figure as an estimate based on market pricing, rather than a reported accounting expense.
  - The September year is not explicit in the quotation; the referenced transaction must be identified from its amount and terms.
support_condition: A reproducible calculation using the identified September issuance and publication-date comparable borrowing rates gives additional lifetime interest strictly above USD 7 billion, with increases in both Treasury benchmarks and Oracle spreads contributing.
contradiction_condition: A comparable calculation gives USD 7 billion or less, or establishes that the asserted two-source repricing does not explain the increase.
measurement_requirements: For each tranche obtain principal, coupon, original tenor and publication-date comparable yield. Calculate the sum of principal multiplied by tenor multiplied by the estimated new coupon minus the original coupon. Check original versus remaining tenor, issue discounts, callable features and new-issue concessions; do not apply the ten-year Treasury change uniformly across maturities.
source_requirements: Oracle's offering documents plus dated transaction or reliable pricing records for every tranche. Clearly label any interpolation and estimated new-issue coupon.
