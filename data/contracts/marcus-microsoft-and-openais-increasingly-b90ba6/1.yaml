assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI said
  - we don’t want our software used for military purposes
  - Microsoft would respect that
  - but they haven’t
evaluator_interpretation:
  - Read as a claim about Microsoft's conduct before publication, against OpenAI's publicly expressed position at the time of that conduct.
  - Promoting a military application counts as disregarding that stated position; completed deployment is not required.
  - Respecting a stated preference is distinct from complying with a legally binding restriction.
  - The wording describes accumulated past conduct without a starting date, so the target period has no specified lower bound.
support_condition: Documented Microsoft promotion or provision of OpenAI software for military purposes while OpenAI publicly opposed that category of use.
contradiction_condition: Reliable records show that the alleged conduct did not occur, or that OpenAI expressly endorsed the same application when Microsoft promoted or provided it.
measurement_requirements: Establish the date and nature of Microsoft's conduct and distinguish a proposal from deployment. Compare it with OpenAI's position at that time.
source_requirements: Prefer the presentation and contemporaneous policies. Reporting based on those documents and company responses is acceptable when the originals cannot be verified.
