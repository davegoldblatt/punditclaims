ambiguity_flags:
  - Respecting a stated wish could mean following its spirit or obeying binding contractual terms.
  - Military purposes could include proposals, operational deployment, weapons applications, or noncombat work.
  - No starting date is stated for the past conduct.
  - The wording does not distinguish OpenAI's earlier blanket prohibition from its revised policy.
