assessment_axis: causal_assessment
explicit_source_elements:
  - The apparent economics of AI
  - we will see if they yet come to pass as imagined
  - too seductive to too many
  - people building AI companies
  - people investing in AI companies
  - people getting paid 6 and even 7 digit salaries
  - people expecting campaign donations from big tech companies
evaluator_interpretation:
  - Read with the preceding sentence, Marcus attributes the failure to secure a near-term moratorium to anticipated financial rewards among developers, investors, employees, and political recipients.
  - The testable plain reading is that those incentives materially prevented agreement on a broad frontier-development pause.
  - The parenthetical hedges eventual profitability. It is not an antecedent requiring those profits to materialize before the causal claim can be assessed.
  - This is a claim about incentives and political causation, not a specified company financial metric or a separate salary estimate.
  - “Near-term” remains unbounded; later records may illuminate the mechanism but do not establish a deadline.
support_condition: Decision records, documented lobbying effects, or credible comparative studies show that anticipated financial rewards materially caused relevant actors to reject or block a broad moratorium.
contradiction_condition: Comparable decision evidence shows that the asserted incentives did not materially block agreement, or a broad moratorium was agreed during the relevant period despite those incentives.
measurement_requirements: Connect financial incentives to actual moratorium decisions. Investment, salaries, donations, opposition to regulation, and continued development alone do not establish the asserted causal effect.
source_requirements: Primary communications, lobbying and donation records linked to decisions, government deliberations, or credible causal research. Actors’ public explanations require corroboration before being treated as their full motives.
metric_scope: null
original_horizon: anytime in the near-term
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - “Too seductive to too many” gives no magnitude or required number of actors.
  - The relative importance of financial motives and other barriers is unstated.
  - The connected “near-term” forecast has no fixed endpoint.
  - The relevant jurisdictions and moratorium decision processes are unspecified.
