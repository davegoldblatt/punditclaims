evaluator_interpretation:
  - Assess whether investment-linked agreements already guaranteed the stated annual cloud receipts, not whether those receipts were later recognised as revenue.
  - The attribution to an unnamed source describes provenance; it is not a conditional antecedent.
  - Treat the annual figures as source-based estimates of contractual commitments, not audited revenue.
  - The target is the contractual state at publication. The claim identifies no particular fiscal year or contract anniversary.
support_condition: Agreements or reliable disclosures establish required Anthropic cloud spending that guarantees Google Cloud $750 million and AWS $800 million per year under the arrangements in force at publication.
contradiction_condition: Reliable agreement terms establish incompatible annual amounts, no such minimum obligations, or conditions that rule out the claimed guarantees.
measurement_requirements: Identify each provider's annual contractual minimum, applicable years, investment linkage, and treatment of credits, discounts, and usage conditions. Multi-year totals cannot be divided into annual guarantees without contractual support.
source_requirements: Investment or cloud-service agreements, regulatory records, company disclosures, or independently corroborated reporting of their terms.
