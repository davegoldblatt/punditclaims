condition_status: not_met
early_resolution_rule: Completed conversion closes this conditional case as not adjudicable. Otherwise, definitive conversion failure followed by sustained financing without an IPO prospect, or terminal financing failure demonstrably caused by their absence, could resolve the forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Conversion could be read literally as changing the nonprofit parent, although the surrounding financing discussion points to the commercial subsidiary.
  - No path forward does not specify an operational or financing threshold.
  - Promise of an IPO could mean a legal commitment or merely investor expectations.
  - No forecast deadline is stated.
retrospective_or_prospective: retrospective
