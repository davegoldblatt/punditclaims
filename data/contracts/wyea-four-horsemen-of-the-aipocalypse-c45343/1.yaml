evaluator_interpretation:
  - This describes construction status at the time of the post. End-2028 identifies the scheduled-completion cohort, not a forecast deadline.
  - Because the statement reports fresh correspondence and a current construction snapshot, use April 2026 through the post date as the reporting period.
  - Test the figures within Sightline's project universe. Do not silently treat its tracked projects as a complete census of every data center worldwide.
  - Allow ordinary rounding to the precision stated.
support_condition: A dated Sightline snapshot or independently reproducible project inventory shows approximately 114GW scheduled through end-2028, of which approximately 15.2GW was under construction, including approximately 5GW scheduled for 2026.
contradiction_condition: A comparable snapshot for the same dates, project universe, construction definition and power measure gives materially different totals.
measurement_requirements: Project identifiers, scheduled completion dates, construction status dates, capacity, geographic coverage, inclusion rules, and a consistent distinction between IT power and total facility power.
source_requirements: Sightline's contemporaneous dataset or authenticated clarification, preferably checked against project records. Repetition of Zitron's account is not independent verification.
