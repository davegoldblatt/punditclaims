assessment_axis: forecast_outcome
explicit_source_elements:
  - Their collapse is inevitable
  - ongoing payments are made out of customer revenue
  - in the vast majority of cases
  - entirely theoretical or contingent on payments from unprofitable and unsustainable AI companies
evaluator_interpretation:
  - Their refers to the AI data center projects and associated debt described immediately before the sentence.
  - Collapse means widespread inability to service debt, resulting in defaults, insolvencies or distressed restructurings; a bond-price decline alone does not qualify.
  - The phrase in the vast majority of cases qualifies the asserted revenue dependence. It is not an if-condition that makes the collapse forecast conditional.
  - No deadline is supplied. The assessment cannot impose one.
  - The claimed revenue mechanism must be distinguished from other causes of financial distress.
support_condition: A broad collapse of the described project-debt population occurs, and records connect it materially to the customer-revenue dependence asserted in the claim.
contradiction_condition: The relevant project-debt population reaches final repayment without the predicted broad collapse, or other definitive evidence establishes that collapse is not inevitable. Continued operation for a limited period is insufficient.
measurement_requirements: Representative project-level defaults, insolvencies, distressed restructurings and repayments, together with customer-payment records and reasons for distress.
source_requirements: Court records, borrower filings, lender or trustee reports, and independent default data. Market-price changes and forecasts are not substitutes for realized distress.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon documented widespread project-debt collapse attributable to the stated revenue mechanism, or definitive final repayment records for the relevant debt population that rule it out. Individual failures or temporary survival do not suffice.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - Collapse has no specified prevalence threshold.
  - The relevant project population and geographic scope are not precisely defined.
  - The forecast includes a causal explanation as well as an outcome.
retrospective_or_prospective: retrospective
