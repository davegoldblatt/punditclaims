explicit_source_elements:
  - the cutting edge
  - finally
  - quietly and without public acknowledgement
  - tilting towards neurosymbolic AI
evaluator_interpretation:
  - The ordinary technical reading is increasing integration of neural models with explicitly executed symbolic operations, including code interpreters. It does not require replacing the neural model.
  - The essay makes o3 and Grok 4 its central examples. I read the acknowledgement qualifier as their developers not presenting this integration as a turn toward neurosymbolic AI, rather than concealing the existence of tools.
  - The essay separately recognizes Google DeepMind's hybrid systems. I therefore do not read the qualifier as denying every public acknowledgement by every laboratory.
  - The surrounding text repeatedly locates the development in 2025. The target is 2025 through publication, the latest public development window described by the essay.
  - The allegation about past personal disparagement is background to the supplied normalized proposition and is not separately scored.
support_condition: Public descriptions of the named frontier systems show increased integration of neural reasoning with executable symbolic tools in 2025, while describing that integration without adopting the neurosymbolic label.
contradiction_condition: The named systems do not incorporate the claimed symbolic operations, or their relevant announcements explicitly acknowledge their development as a turn toward neurosymbolic AI.
measurement_requirements: Distinguish code execution from merely generating code, and distinguish acknowledging tool use from adopting a particular architectural label.
source_requirements: Dated technical descriptions from the developers of the named systems, checked against primary descriptions of explicitly neurosymbolic systems.
