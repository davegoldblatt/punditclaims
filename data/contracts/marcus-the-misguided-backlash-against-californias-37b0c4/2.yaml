  - or offering anything substantive in its place
evaluator_interpretation:
  - Preserve the explicit limit to Marcus's knowledge at publication. Do not replace it with an unconditional assertion about the public record.
  - "Read the company group through the supplied context: OpenAI, Microsoft, Alphabet, and the companies referenced through the Biden commitments or Senate appearances. Do not extend it to any startup that published a policy essay."
  - The statement concerns positions current on June 7, 2024. Public statements could establish company positions, but their publication alone would not establish Marcus's awareness.
  - An alternative must address the regulatory purpose of SB-1047 to count as being offered 'in its place.' Marcus supplies no precise threshold for 'substantive.'
support_condition: A literal test would require reliable evidence of Marcus's knowledge at publication, showing that he knew of no qualifying company's support or substantive substitute. An unsuccessful public-record search would not establish this.
contradiction_condition: A literal test would require evidence that, before publication, Marcus knew a company within the contextual group supported SB-1047 or offered a substantive substitute. A company statement alone would not suffice.
measurement_requirements: Preserve both the knowledge qualifier and the contextual company group. No objective public-record measure fully captures the qualified statement.
source_requirements: Any factual adjudication would require authenticated, contemporaneous evidence of awareness as well as dated company positions. The post itself cannot independently establish its accuracy.
