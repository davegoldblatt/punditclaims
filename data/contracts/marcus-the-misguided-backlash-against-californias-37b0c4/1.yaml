contradiction_condition: At least one company with an earlier public pro-regulation position publicly supported SB-1047 or offered a substantive replacement before the post.
measurement_requirements: Match the same company across its earlier regulatory position and its position on SB-1047. Employee endorsements do not automatically establish a company position.
