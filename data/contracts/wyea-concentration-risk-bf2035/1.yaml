assessment_axis: causal_assessment
explicit_source_elements:
  - user doesn’t have to worry about their actual costs
  - provider doesn’t have to either because it’s bankrolled by venture capital
  - surges of revenue around every new model launch
  - beckon users back to the platform
  - AI labs a bump in revenue
evaluator_interpretation:
  - "This asserts a recurring causal mechanism: VC-funded subsidies encourage returning users and additional usage at model launches, increasing lab revenue."
  - A model gaining spending share is insufficient; the claim concerns additional revenue caused by subsidized use.
  - Every new model launch requires evidence across launches, including unsuccessful launches, rather than selected successes.
  - No bounded historical period or future deadline is stated. Assess the mechanism using evidence about launches on or before the post.
support_condition: Launch-level records repeatedly show increased startup usage, returning users and lab receipts attributable to VC-funded subsidies, after accounting for prices, substitution and other demand changes.
contradiction_condition: Comparable launch-level records show that the stated subsidy conditions hold but the claimed recurring revenue increases do not, or establish that the attributed mechanism does not explain them.
measurement_requirements: Measure absolute lab receipts, startup usage and user returns before and after launches. Identify subsidized customers and funding sources, and account for model substitution, price changes and seasonality.
source_requirements: Transaction and usage records linked to launch dates and customer financing, preferably with a credible comparison group.
