assessment_axis: historical_observation
explicit_source_elements:
  - two companies that are deeply unprofitable
  - Anthropic is on course to lose $2.7 billion this year
  - pricing designed to get more customers
  - rather than make any kind of profit
evaluator_interpretation:
  - The two companies are OpenAI and Anthropic.
  - This year means calendar 2024.
  - On course describes the financial outlook at publication, not a promise that the eventual audited result would equal exactly $2.7 billion.
  - Deeply unprofitable ordinarily means substantial company-wide losses relative to revenue.
  - The pricing clause asserts a growth-first pricing strategy. Losses alone cannot establish that intent or the absence of service-level profit.
  - The financial figures are treated as press estimates, consistent with the surrounding attribution to The Information. No GAAP or IFRS basis is supplied.
support_condition: Reliable contemporaneous reporting establishes substantial losses at both companies, an approximately $2.7 billion Anthropic loss outlook for 2024, and evidence that their pricing strategy prioritized customer acquisition over profit.
contradiction_condition: Comparable records establish profitability at either company, materially refute Anthropic's contemporaneous loss outlook, or directly refute the asserted pricing strategy.
measurement_requirements: Separate company losses, operating spending, cash burn, service margins, and annualized revenue. Establish pricing intent independently of company losses.
source_requirements: Contemporaneous financial records or credible reporting on internal forecasts, and company statements or documents concerning pricing strategy.
