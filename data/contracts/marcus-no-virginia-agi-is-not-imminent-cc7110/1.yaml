explicit_source_elements:
  - 18 months ago
  - before the LLM euphoria
  - we all took for granted
  - AGI wasn’t just about beating ordinary humans
evaluator_interpretation:
  - Eighteen months before the post places the observation around February 2022.
  - I read we all as a claim of broad agreement in the AI field, not literal unanimity among every researcher.
  - The proposed agreement concerns requirements beyond outperforming ordinary humans, such as stronger reliability, resourcefulness, or specialist capabilities.
  - Publication of Marcus's criteria or willingness to host his bet would establish attention to those criteria, not field-wide acceptance.
support_condition: Representative contemporaneous statements, surveys, or documented discussion establish broad early-2022 agreement that ordinary-human performance was insufficient for AGI.
contradiction_condition: Representative contemporaneous evidence shows that ordinary-human general capability was widely accepted as sufficient, or that the claimed shared requirement was substantially disputed.
measurement_requirements: Identify whose views are represented, what capabilities their definitions require, and whether they endorsed those requirements rather than merely discussing them.
source_requirements: Dated early-2022 primary definitions, surveys, or reactions. Earlier and later definitions provide context unless they explicitly establish what the field believed during the target period.
