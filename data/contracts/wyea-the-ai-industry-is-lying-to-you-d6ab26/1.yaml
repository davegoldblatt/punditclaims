assessment_axis: historical_observation
explicit_source_elements:
  - actual demand for AI services is pretty weak
  - mostly taken up by a few companies
  - or hyperscalers running their own services
  - this heavily suggests
evaluator_interpretation:
  - Assess the demand conclusion, rather than treating the two spending estimates as separate claims.
  - The ordinary reading is that paying demand is limited relative to available AI compute, with most purchases concentrated among a small number of buyers.
  - Use calendar Q4 2025, the latest completed quarter that public reporting could cover before the post.
  - Distinguish companies buying compute from the customers purchasing services built on that compute. Concentration among intermediaries does not establish weak end-user demand.
  - No numerical definition of weak or few is supplied; do not invent one.
support_condition: Representative evidence for the target period shows weak paid demand relative to available AI compute and shows that a small group of buyers accounts for most purchases.
contradiction_condition: Representative evidence for the same market and period shows strong paid demand relative to available compute, or shows that purchases are broadly distributed rather than mostly concentrated among a small group.
measurement_requirements: Comparable AI-specific utilization, paid usage, capacity, and buyer-concentration data. Separate reservations from actual consumption and distinguish direct compute buyers from downstream users.
source_requirements: Provider disclosures or representative independent measurements. The speaker's estimates alone cannot establish the conclusion.
