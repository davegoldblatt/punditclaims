support_condition: Credible reports show major LLM providers running operating losses, and provider statements or actions show agent use costs them much more than chat under existing pricing.
contradiction_condition: Credible reports show the providers are profitable on serving their AI products, or that agent use does not raise their costs relative to what users pay.
measurement_requirements: Reported operating losses of LLM providers, and provider evidence that agent workloads cost more to serve than flat prices recover.
