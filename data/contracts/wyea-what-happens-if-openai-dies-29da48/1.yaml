evaluator_interpretation:
  - This denies an existing government rescue arrangement of approximately $150 billion benefiting OpenAI or the AI industry at publication.
  - The US government is inferred from the surrounding references to Trump and government loans.
  - The target is the arrangement's existence on August 18, 2026, rather than spending during a reporting quarter.
  - A proposal, ordinary procurement contract, private financing round, or company valuation does not by itself constitute a bailout.
  - No accounting basis or financial instrument is identified.
support_condition: Authoritative records or disclosures addressing the alleged arrangement establish that no such rescue had been authorized or agreed at publication.
contradiction_condition: Authenticated agreements, appropriations, guarantees, or subsequent disclosures establish that a qualifying $150 billion government rescue arrangement existed at publication.
measurement_requirements: Distinguish committed rescue support from disbursements, guarantees, investment valuations, private funding, and ordinary procurement. Establish the arrangement's status on the publication date.
source_requirements: Government agreements, appropriations, official disclosures, or reliable reporting based on identifiable records. A search finding no announcement is insufficient to rule out a secret arrangement.
