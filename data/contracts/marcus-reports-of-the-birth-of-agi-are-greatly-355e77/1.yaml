explicit_source_elements:
  - Transformers and generative AI
  - getting a lot of attention
  - have considerable utility
  - nothing like the all purpose tools some people seems to imagine
evaluator_interpretation:
  - The ordinary reading is that these technologies were prominent and useful but could not reliably perform the broad range of practical tasks expected of an all-purpose AI system.
  - I assess the current calendar month through publication, October 1–18, 2023. This is an evaluator-selected reporting window for the ongoing state described.
  - This does not require proving that transformers were unused in the fields mentioned nearby. Their use in several fields would not itself establish all-purpose reliability.
  - The reference to what some people imagine is a comparison, not a conditional antecedent.
support_condition: Contemporaneous records establish substantial attention and practical uses, while evaluations demonstrate major limitations across distinct kinds of tasks.
contradiction_condition: Contemporaneous evaluations establish broadly reliable performance across the practical tasks at issue, or strong evidence refutes the claimed prominence or meaningful utility.
measurement_requirements: Use demonstrated applications and task evaluations of systems available in October 2023. Distinguish usage from reliability and performance in selected domains from all-purpose competence.
source_requirements: Primary deployment disclosures and original evaluations, preferably versions public by the post date.
