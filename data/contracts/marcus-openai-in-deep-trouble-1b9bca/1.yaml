  - The wording describes accumulated departures before publication, including earlier departures, rather than departures within a single quarter.
  - Many is assessed against the named examples and additional senior departures, without inventing a precise numerical threshold.
  - Temporary leave is not counted as a departure.
support_condition: Public records confirm multiple named senior departures and additional senior departures before March 1, 2025.
contradiction_condition: The named examples are substantially incorrect, or the record shows only isolated departures rather than a substantial group of senior personnel.
measurement_requirements: Verify seniority and departure status. Distinguish resignations from temporary sabbaticals and avoid counting the same person twice.
