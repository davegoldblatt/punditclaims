assessment_axis: historical_observation
explicit_source_elements:
  - their inability to build and maintain
  - adequate, interpretable, dynamically updated models of the world
  - arguably even more fundamental
evaluator_interpretation:
  - The ordinary reading concerns reliable internal representations of entities and their changing states, not perfect knowledge of everything.
  - Adequacy means reliability for the domain being represented. Marcus supplies no required accuracy, duration, or range of domains.
  - The target is the publicly documented state of LLMs available by 2025-06-28. Architecture and capability research has no recurring reporting period; the interval has an open beginning to include existing models documented before the post.
  - The comparison with reasoning failures is explicitly hedged. It is not an antecedent condition or a separately measurable ranking.
  - A successful specialized model bears on categorical impossibility, but does not by itself establish reliable world modeling in general-purpose LLMs.
support_condition: Representative evaluations show that contemporary LLMs cannot reliably maintain interpretable representations through relevant state changes, including within the domains being tested.
contradiction_condition: Evaluations demonstrate reliable, interpretable, dynamically updated internal representations in the relevant LLM population and domains. A narrow demonstration challenges categorical impossibility but need not settle the broader adequacy claim.
measurement_requirements: Identify the models, represented entities, update sequences, accuracy, generalization tests, and evidence that decoded representations actually influence behavior.
source_requirements: Primary experimental research with reproducible methods. Distinguish general-purpose LLMs from specialized sequence models and successful probes from causal validation.
