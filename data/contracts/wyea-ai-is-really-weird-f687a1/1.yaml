assessment_axis: historical_observation
explicit_source_elements:
  - further compute-intensive ways
  - having a hallucination-prone chatbot do actual work
evaluator_interpretation:
  - Use 2026 Q1, the latest completed quarter before publication.
  - The immediate referents are OpenClaw and Perplexity Computer, rather than every product described as an agent.
  - Read 'chatbot' as an LLM generating responses and action decisions within a tool-using system.
  - Read 'compute-intensive' as materially greater inference and orchestration work than an ordinary single-response interaction.
  - Read 'hallucination-prone' as a demonstrated tendency to invent facts or report actions that did not occur, not a claim that every task fails.
  - The square-peg metaphor is rhetorical and adds no separate measurable condition.
support_condition: Product architecture, resource measurements, and error evaluations establish LLM-driven work, substantial additional inference, and hallucination failures in the named products.
contradiction_condition: Reliable evidence shows that the named systems do not use LLM-generated action decisions, or representative matched evaluations refute the added-compute or hallucination characterization.
measurement_requirements: Distinguish repeated model calls and context processing from measured resource consumption. Distinguish fabricated completion reports from ordinary software errors and adversarial instruction following.
source_requirements: Contemporaneous product documentation, reproducible token or compute measurements, and directly observed error evaluations. Findings about one product cannot automatically settle another.
