  - not particularly good at
  - fully autonomous killing machines
  - flat out cannot do
evaluator_interpretation:
  - Following the supplied normalized proposition, this assessment concerns Claude's capabilities, not whether the Pentagon accepted contractual restrictions.
  - The ordinary reading is that contemporary Claude performs poorly at large-scale analysis of Americans' personal data and cannot operate a weapon that selects and engages targets without human approval.
  - Not particularly good implies poor practical accuracy or usefulness, without supplying a numerical threshold.
  - The target is the latest publicly describable capability state during the late-February negotiations through publication. Later models or later demonstrations cannot establish that earlier state without a documented connection.
support_condition: Representative evaluations show poor practical surveillance performance, and technical evidence establishes inability to perform autonomous target selection and engagement in the relevant configuration.
contradiction_condition: Representative evaluations demonstrate useful surveillance performance, or a documented contemporary system using Claude successfully performs autonomous target selection and engagement.
measurement_requirements: Identify the Claude version, tools, data, integration, task conditions, accuracy, error rates, and human involvement. Separate inability from unsafe performance and contractual prohibition.
source_requirements: Documented evaluations, technical system descriptions, or independently inspectable demonstrations. Statements of concern alone cannot establish inability.
