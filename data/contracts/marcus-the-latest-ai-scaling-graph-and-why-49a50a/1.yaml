evaluator_interpretation:
  - "Read anything in parallel with all tasks: GPT-3 lacks universal coverage, rather than being incapable of every short task."
  - Assess cognitive or computer tasks relevant to the graph, excluding trivial counterexamples based on lacking a physical body.
  - Read the durations as upper limits on human completion time.
  - The period covers the historical GPT-3 capability comparison and the o3 capabilities available by the post. It does not include later successor models.
  - Require evidence linking model failures to human completion times, rather than assuming that an apparently easy task satisfies the limit.
support_condition: For each named model, credible evaluations demonstrate failures on tasks that humans successfully complete within its stated time limit.
contradiction_condition: Evidence establishes the asserted universal task coverage for the relevant model and time limit. High average benchmark scores alone would not do so.
measurement_requirements: Identify model version, task, testing conditions, model failure, and a human completion time at or below 102 minutes for o3 or 15 seconds for GPT-3.
source_requirements: Primary evaluations or reproducible demonstrations with matched human timing; model scores without matched timing are context only.
