explicit_source_elements:
  - robots
  - robots with natural language interfaces
  - a la Google’s new system
  - exempt from these problems
evaluator_interpretation:
  - "Read this as a claim of susceptibility: adding a robot body or language interface does not remove unfamiliar-situation failures or forgetting during further training."
  - Do not interpret it as saying every robot necessarily forgets every exception, or that a frozen network forgets merely as time passes.
  - Use the 2022 research record through the post as the latest public technical reporting window. Robotics research has no fixed quarterly reporting cycle.
  - The language-interface phrase identifies included systems; it is not a conditional forecast.
support_condition: Contemporaneous robot evaluations show failures outside reliably handled instructions or situations, and robotics research establishes that learned components can suffer forgetting when updated.
contradiction_condition: Evidence establishes that the relevant robotic architecture or language interface removes these vulnerabilities across unfamiliar situations and subsequent learning, rather than merely reducing them on selected tests.
measurement_requirements: Distinguish generalization failures from forgetting. A direct forgetting test must compare retained performance before and after further training.
source_requirements: Original robot evaluations and research on continual learning in robotic components.
