evaluator_interpretation:
  - This assesses what the ASU study available before the post actually demonstrated.
  - The target period covers the study's initial publication through the post, August 2–9, 2025.
  - The plain reading requires empirical results on contemporary leading models showing unreliable application of learned rules beyond training examples.
  - Every gadget is rhetorical emphasis on modern methods, not a literal assertion that every invention was tested.
  - The claim is about this study's demonstrated scope, not whether generalization failures exist elsewhere.
support_condition: The available ASU study tests contemporary leading models and demonstrates unreliable generalization beyond their training examples.
contradiction_condition: The study's methods establish that its experiments used a materially different model class, with application to contemporary leading models asserted rather than demonstrated.
measurement_requirements: Inspect the model configurations, training setup, distribution shifts, results, and limits of the version available before August 9.
source_requirements: The original ASU paper, using its pre-post version rather than later revisions.
