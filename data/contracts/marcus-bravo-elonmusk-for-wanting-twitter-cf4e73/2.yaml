assessment_axis: historical_observation
explicit_source_elements:
  - Accuracy depends on some reference standard of truth
  - they have no way of reasoning about truth
  - Large language models
evaluator_interpretation:
  - The plain reading concerns the ability of then-existing LLMs to assess factual claims against an external reference standard. Merely producing inference chains from internal beliefs does not test this claim.
  - A reference standard means identified evidence against which factual claims can be checked. Agreement with an arbitrary source is not automatically truth.
  - An evaluated LLM that retrieves reference material and reasons about whether it supports or refutes factual claims counts as having a way to perform this task. This interpretation includes tools that supply evidence, provided the LLM performs the assessment.
  - The observation describes capabilities as of the post on 2022-11-09. There is no regular reporting period for this capability. The target therefore has that cutoff and no invented starting date; earlier evaluations are relevant only to capabilities already demonstrated by then.
  - The reference-standard clause and the asserted absence of capability are assessed separately. The adjacent prediction about scaling is outside this claim.
support_condition: Evidence supports the reference-standard clause if factual accuracy is assessed against independently specified evidence or judgments. Supporting the capability clause requires evidence establishing that contemporary LLMs lacked a means of assessing factual claims against such standards; examples of hallucination or imperfect performance alone are insufficient.
contradiction_condition: A contemporaneous evaluation demonstrates that an LLM makes successful, repeated support-or-refutation judgments using identified external factual evidence. Internal consistency, unsupported reasoning chains, and later models do not qualify. This contradicts the asserted absence of capability without disproving the need for a reference standard.
measurement_requirements: Identify the model, external reference material, factual-verification task, evaluation method, results, and limitations. Distinguish assessing claims against a supplied standard from independently establishing the trustworthiness of that standard.
source_requirements: Use original research or documented evaluations of capabilities existing by 2022-11-09, available by 2026-10-28. Prefer versions published before the post.
