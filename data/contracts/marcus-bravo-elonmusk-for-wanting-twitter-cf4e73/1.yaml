assessment_axis: historical_observation
explicit_source_elements:
  - Accuracy depends on some reference standard of truth
  - they have no way of reasoning about truth
  - Large language models
evaluator_interpretation:
  - I read the first clause as saying that factual accuracy must be judged against independently justified facts or reference answers.
  - The ordinary testable reading of the second clause is an absence of any demonstrated ability to draw and assess factual conclusions through reasoning, not merely an absence of guaranteed correctness.
  - I include language models trained or prompted for reasoning and used in an inference procedure; the claim does not expressly exclude these.
  - For the ongoing capability claim, I use public evaluations of the then-current model generation during 2022 through November 9. This calendar-year-to-date period is an evaluator choice because model capabilities have no standard quarterly reporting cycle.
  - The two clauses are assessed separately, allowing a mixed result.
support_condition: Evidence supports the reference-standard clause if factual evaluation explicitly relies on justified reference facts. Supporting the categorical second clause would require evidence of an absence of factual reasoning capability, rather than examples of mistakes alone.
contradiction_condition: A contemporaneous language-model system that demonstrably draws factual conclusions through evaluated inference contradicts the categorical absence claim. This need not establish universal reliability or philosophical understanding.
measurement_requirements: Use pre-post models and evaluations that distinguish factual inference from fluent explanations or answer recall. Inspect reference standards, reasoning validity, task performance and limitations.
source_requirements: Primary research publicly available by November 9, 2022 for capability evidence. Later model achievements cannot settle this historical observation.
