ambiguity_flags:
  - "'Reasoning about truth' could mean observable factual inference or a stronger philosophical account of grounding."
  - The wording does not distinguish base models from trained models embedded in reasoning procedures.
  - The calendar-year-to-date observation period is an evaluator choice for an ongoing capability claim.
  - A universal requirement for reference standards is broader than any individual benchmark can empirically prove.
