explicit_source_elements:
  - if someone put in that kind of effort
  - carefully built out the test
  - no current system
  - would come close to human performance
evaluator_interpretation:
  - "The condition is that someone builds the comprehension challenge he describes: a well-funded ($25-50M scale) test where systems watch full TV shows or films and answer questions. The questions are refreshed to avoid contamination, answers are scored carefully (perhaps by hand), and the machine is kept on the same footing as a first-time human viewer."
  - "'Current system' means AI systems available around the post date, 2025-04-02."
  - "'Not come close' means a large gap between the best such system and human viewers."
support_condition: A test meeting the condition is built, and systems from around April 2025 score far below human viewers on it.
contradiction_condition: A test meeting the condition is built, and a system from around April 2025 scores at or near human level on it.
measurement_requirements: Published results from a test that meets the stated design conditions, comparing April-2025-era systems with human first-time viewers.
source_requirements: Benchmark paper or official results from the test builders.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Scored only once a test meeting the stated conditions is published with human and April-2025-era system results. A large gap supports the claim; near-human performance contradicts it.
interpretation_determines_result: true
ambiguity_flags:
  - What counts as 'carefully built out' is not precisely defined.
  - "'Come close' has no numeric threshold."
  - Existing long-video benchmarks are partial versions and may or may not count.
