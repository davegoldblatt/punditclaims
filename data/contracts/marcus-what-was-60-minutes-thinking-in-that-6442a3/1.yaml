explicit_source_elements:
  - cannot be trusted
  - make random mistakes
  - have no basis in factuality
  - “Work well” remains a tendentious claim
evaluator_interpretation:
  - The surrounding discussion primarily concerns generative language models, although Hinton's statement concerns neural networks more broadly.
  - Cannot be trusted is read as requiring verification before relying on factual outputs, not as being useless for every purpose.
  - Random mistakes means mistakes that users cannot reliably anticipate, not a mathematical claim about independent random errors.
  - No basis in factuality could mean no dependable truth guarantee or the stronger absence of factual grounding. The assessment must not silently substitute one for the other.
  - The systems described as working well specify the subject; this is not a conditional forecast.
  - Use July–September 2023, the latest completed calendar quarter before publication, as the reporting window.
support_condition: Contemporary evidence establishes recurring factual errors, a need for verification, and the claimed absence of dependable factual grounding in the relevant systems.
contradiction_condition: Evidence establishes dependable factual grounding and reliability across the relevant uses. Grounded systems also counter a literal blanket claim that there is no factual basis.
measurement_requirements: Identify the system and task, distinguish unaided generation from retrieval or verification, and distinguish factual errors from absence of factual knowledge.
source_requirements: Primary factuality evaluations and dated developer disclosures about contemporary systems and verification requirements.
