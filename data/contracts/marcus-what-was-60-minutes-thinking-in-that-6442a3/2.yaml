explicit_source_elements:
  - “Work well” remains a tendentious claim
  - they still cannot be trusted
  - make random mistakes
  - have no basis in factuality
evaluator_interpretation:
  - The context moves between neural networks generally and generative AI. It does not identify one consistently defined system population.
  - "'No basis in factuality' could mean an absence of factual knowledge or an absence of a dependable guarantee of truth. Those are materially different claims."
  - "'Cannot be trusted' lacks a specified use or required level of accuracy, while 'work well' is expressly evaluative."
  - No single categorical contract can resolve these differences without adding a meaning the speaker did not clearly supply.
support_condition: No single support condition applies as written. Frequent errors could support a warning against unchecked reliance, but would not establish that systems contain no factual knowledge.
contradiction_condition: No single contradiction condition applies as written. Verified factual answers could contradict a literal absence of factual knowledge, but would not establish dependable truthfulness.
measurement_requirements: A narrower assessment would need named systems, intended uses, a factuality measure, and a distinction between unsupported answers and absence of factual knowledge.
source_requirements: Controlled factuality evaluations of the specified contemporary systems, with independently checked reference facts.
