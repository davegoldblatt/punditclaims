assessment_axis: historical_observation
explicit_source_elements:
  - Large Language Models
  - do not do what their progenitors have promised
  - do not produce ROI or productivity benefits
  - in any way measurable
evaluator_interpretation:
  - The ordinary reading is a categorical denial of measurable benefits, rather than a claim that benefits are uncommon or insufficient to justify industry investment.
  - For this undated ongoing observation, use April–June 2026, the latest completed calendar quarter before publication. Earlier measurements provide context only.
  - A credible measured improvement in productive output can contradict the productivity clause. It does not establish positive financial ROI.
  - Productive output per worker is an ordinary productivity indicator, but its adequacy depends on whether changes in hours, quality and downstream work explain the increase.
  - The makers, promises and promised deadlines are unspecified. That clause cannot receive a separate definitive assessment.
  - No particular company's financial metric is asserted, so metric_scope is null.
support_condition: Credible, sufficiently broad measurements for the target period establish no positive productivity or net financial returns from LLM use, and evaluations of identifiable maker promises establish their failure. Isolated unsuccessful deployments are insufficient to establish the categorical denial.
contradiction_condition: At least one credible comparison for the target period measures a positive productivity benefit attributable to LLM use, or a positive financial return after relevant costs. This contradicts the categorical benefits clause without establishing that all promises were fulfilled.
measurement_requirements: Observed outcomes with an explicit comparison, identifiable LLM use and a defensible productivity measure. Examine selection, working time, output quality and downstream burdens. Financial ROI requires costs as well as benefits; perceptions alone are insufficient.
source_requirements: Prefer original studies with disclosed methods and dated observations. Distinguish preprints, company claims and self-reports from independently measured outcomes.
