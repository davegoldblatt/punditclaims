assessment_axis: causal_assessment
explicit_source_elements:
  - now it’s bursting
  - Anthropic and OpenAI’s customers are in revolt
  - planning “drastic” price cuts
evaluator_interpretation:
  - Read 'customers are in revolt' as substantial customer resistance to usage costs, expressed through complaints, spending controls, cancellations, or switching.
  - Read 'bursting' as a material breakdown of the subsidized-usage business model described in the surrounding passage, not necessarily corporate failure.
  - The claim requires customer resistance to have materially prompted contemplated large price reductions at both companies by June 15, 2026. Implemented cuts are not required.
support_condition: Dated customer records and company statements or well-sourced reporting establish substantial resistance, contemplated large cuts at both companies, and a causal connection between them. Evidence also establishes the claimed material breakdown.
contradiction_condition: Direct evidence establishes that the asserted pricing plans did not exist, or that the claimed customer resistance and resulting breakdown did not occur. Evidence of competition alone would not exclude customer resistance as another cause.
measurement_requirements: Distinguish complaints from actual spending changes, contemplated cuts from adopted prices, and customer resistance from competitive positioning or declining inference costs.
source_requirements: Prefer dated company and customer statements. Reporting based on identified or well-placed sources may establish private pricing deliberations.
