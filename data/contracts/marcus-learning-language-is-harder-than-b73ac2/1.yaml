assessment_axis: historical_observation
explicit_source_elements:
  - what we are doing with machines currently
  - isn’t really working
evaluator_interpretation:
  - Working refers to the immediately preceding goal of interpreting sentences and expressing intended meanings with general language competence.
  - The claim is not read as denying every useful application or every improvement on a language benchmark.
  - The separate statement about how children learn is outside the normalized proposition being assessed.
  - Currently refers to approaches existing on July 20, 2022. With no regular reporting cycle, I use current-year evaluations through that date.
support_condition: Convergent evaluations establish that contemporary approaches failed to achieve reliable general interpretation and expression of meanings.
contradiction_condition: A contemporary approach demonstrably achieves reliable general interpretation and expression of meanings across varied unfamiliar situations.
measurement_requirements: Assess semantic fidelity, robustness, and both comprehension and generation. Separate progress on components from achievement of the stated general goal.
source_requirements: Primary empirical evaluations of approaches existing by the post date, including successful approaches and important limitations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2022-01-01
  end: 2022-07-20
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Really working specifies neither an achievement threshold nor an acceptable error rate.
  - The scope of current machine approaches is broad.
  - General language acquisition and useful task performance would yield different assessments.
  - The current-year observation window is an evaluator choice because no reporting period is stated.
retrospective_or_prospective: retrospective
