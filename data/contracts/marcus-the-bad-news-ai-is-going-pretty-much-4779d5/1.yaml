ambiguity_flags:
  - Mainstream has no stated population or numerical threshold.
  - The current-year reporting period is an evaluator choice for an ongoing public debate.
  - Unlikely to succeed is weaker than a categorical prediction that scaling will never succeed.
  - The AAAI question concerns current AI approaches, a broader category than LLM scaling.
