evaluator_interpretation:
  - The plain reading is that factual answers from leading general-purpose LLMs still require independent verification when accuracy matters.
  - This does not mean that every answer is wrong or that no bounded application can be reliable.
  - Because the statement describes an ongoing state without dates, use the latest completed quarter before publication, October–December 2025.
support_condition: Contemporaneous evaluations show recurring factual errors and failures to acknowledge uncertainty across leading models and multiple domains.
contradiction_condition: Broad, representative evaluations show that leading models reliably answer or abstain across factual domains, making independent verification generally unnecessary.
measurement_requirements: Distinguish difficult factual-recall tests from ordinary conversations, and errors per answer from errors conditional on not knowing. Record whether browsing is enabled.
source_requirements: Prefer dated independent evaluations and original model evaluations. Improvements and successful settings must also be considered.
