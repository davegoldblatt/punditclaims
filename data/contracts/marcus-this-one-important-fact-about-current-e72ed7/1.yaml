assessment_axis: historical_observation
explicit_source_elements:
  - Those who don’t
  - have burned $100M on driverless cars
  - are in process of burning similar amounts of money on GenAI
evaluator_interpretation:
  - The ordinary reading is that people who misunderstand outlier limitations have already lost or wasted roughly $100 million on autonomous driving and are spending comparable sums on generative AI.
  - The driverless-car statement is cumulative through the post, with no stated starting date. For the ongoing generative-AI statement, the latest completed calendar quarter before publication is April–June 2024.
  - The combined target period ends at publication and has an unspecified start because the sentence combines cumulative expenditure with an ongoing state.
  - Investment, expenditure, cash burn and accounting losses are distinct measures. The word 'burned' does not identify which measure Marcus intended.
  - The stated amount remains $100 million. It is not silently changed to $100 billion.
support_condition: Records identify the relevant people or businesses independently of their losses, establish their misunderstanding of outliers, and document roughly $100 million of driverless-car losses or wasted expenditure plus comparable ongoing generative-AI expenditure on a consistent basis.
contradiction_condition: Comparable records for the identified group establish materially different amounts, or show that the attribution to misunderstanding outliers is false.
measurement_requirements: An identified population, a definition of 'burned', comparable reporting periods, and a stated accounting basis. Financing raised cannot substitute for money spent or lost.
source_requirements: Financial disclosures or documented estimates, together with contemporaneous evidence about the identified participants' understanding of outliers.
