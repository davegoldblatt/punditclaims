explicit_source_elements:
  - Fast-forward to today
  - basically
  - Meta Muse is trying to do exactly what Facebook M tried to do
  - restaurant reservations, theatre tickets and so on
evaluator_interpretation:
  - The plain reading is substantial overlap in consumer assistant tasks, particularly making reservations and obtaining tickets.
  - Trying to do concerns product aims. It does not assert equal reliability, identical technology, or that either product completed every task successfully.
  - "Because the claim describes a current product without a reporting period, use September 2026 through the September 22 post: the current product-announcement period."
  - Facebook M's earlier aims provide the historical comparison and are recorded as context.
  - Read theatre tickets as an example of the broader ticket-booking category. Evidence limited to concert tickets supports that broader comparison but does not independently establish the exact theatre example.
support_condition: Product descriptions or credible reporting show that Muse pursued substantially the same consumer booking and purchasing tasks as M, including restaurant reservations and event tickets.
contradiction_condition: Product descriptions or credible reporting establish that Muse's intended role materially excluded these booking tasks or that M had not pursued them.
measurement_requirements: Compare intended tasks. Do not substitute model benchmarks, commercial success, or automation rates for product aims.
source_requirements: Prefer dated company descriptions and demonstrations. Use contemporaneous reporting where accessible primary material does not establish a specific task.
