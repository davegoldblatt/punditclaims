assessment_axis: historical_observation
explicit_source_elements:
  - I estimate
  - 70% or more of Microsoft, Google and Amazon's compute capacity
  - taken up by OpenAI and Anthropic
  - in my analysis of non-hyperscale compute providers
  - struggled to find any customer other than them
  - spending more than $50 million a year on compute
evaluator_interpretation:
  - The first part is the speaker's estimate of an AI capacity share at the three hyperscalers at about the time of the post (mid-2026). It would be checkable only with disclosed or credibly reported capacity allocations.
  - The second part reports his own search. The testable core is whether, at the time of the post, neocloud customers other than OpenAI and Anthropic were publicly known to spend more than $50 million a year. 'Them' may also cover the hyperscalers, because the same post lists Microsoft and NVIDIA as large CoreWeave customers.
  - "Target period: the first seven months of 2026 up to the post, as the most recent state public evidence could describe."
support_condition: Credible data show OpenAI and Anthropic using at least 70% of the three hyperscalers' (AI) compute capacity, and no other customer of non-hyperscale providers publicly known to spend over $50 million a year.
contradiction_condition: Credible data show OpenAI and Anthropic using well under 70% of that capacity, or several non-OpenAI, non-Anthropic, non-hyperscaler customers of neoclouds clearly spending over $50 million a year.
measurement_requirements: Share of capacity (compute or power) allocated to OpenAI and Anthropic at Microsoft, Google and Amazon; annual spend by named neocloud customers.
source_requirements: Company disclosures, filings, or reputable reporting on capacity allocation and customer spending.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-01-01
  end: 2026-07-22
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Compute capacity' could mean all cloud capacity or only AI accelerator capacity."
  - "'Other than them' may or may not exclude the hyperscalers and NVIDIA."
  - "'Struggled to find' is a hedged report of his own search, not a firm claim that no such customer exists."
  - The claim names no period, so the 2026 up-to-post window is the evaluator's choice.
