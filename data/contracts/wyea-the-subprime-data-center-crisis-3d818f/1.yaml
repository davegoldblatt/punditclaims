  - taken up by OpenAI and Anthropic
  - in my analysis of non-hyperscale compute providers
  - I struggled to find
  - more than $50 million a year on compute
evaluator_interpretation:
  - The numerical estimate remains testable despite being labeled an estimate.
  - Given the surrounding discussion, read compute capacity as AI compute capacity, rather than all general-purpose computing.
  - Read the three providers collectively, with capacity weighted using a common physical measure rather than averaging customer revenue shares.
  - "'Taken up' means capacity currently allocated to the two labs, not future contracted capacity."
  - Use January through March 2026 as the latest common reported quarter available before the post; the speaker does not name a measurement date.
  - The spending clause reports the author's search experience. It does not categorically assert that no other customer exceeds $50 million, and cannot be scored as that stronger proposition.
  - The adjudicated numerical proposition concerns physical capacity, so no company-money metric is assigned.
support_condition: Comparable data for the target period establish that OpenAI and Anthropic together account for at least 70% of the three providers' aggregate AI compute capacity.
contradiction_condition: Comparable data establish a share below 70%, with uncertainty sufficiently narrow to exclude the stated threshold.
measurement_requirements: A common capacity unit, total available AI capacity for each provider, allocations to both labs, and consistent treatment of internal workloads, resold capacity, inference services, and idle capacity.
source_requirements: Provider allocation disclosures or credible independent measurements with transparent methods and matching dates. Spending, revenue, and future contract values alone are insufficient.
