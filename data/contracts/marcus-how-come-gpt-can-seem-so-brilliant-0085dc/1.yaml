explicit_source_elements:
  - It never fully masters abstract relationship
  - in a fully general way
  - for all countries A and all B
  - current neural networks
evaluator_interpretation:
  - In context, this describes contemporary GPT's incomplete systematic generalization, rather than predicting that every future GPT model must fail.
  - Full mastery means consistently applying a rule across equivalent instances and unfamiliar values or arrangements, rather than succeeding on selected familiar examples.
  - Arithmetic is an admissible test because the surrounding passage explicitly invokes arithmetic studies.
  - For this ongoing research claim, the target period is the 2022 research year through publication. There is no regular quarterly capability reporting period.
support_condition: Systematic evaluations of contemporary GPT models demonstrate reproducible failures to apply simple abstract rules across equivalent formulations or unfamiliar instances.
contradiction_condition: Contemporary evaluations establish reliable generalization across the relevant rule families and variations, and show that apparent failures arose from invalid tests rather than limitations of the models.
measurement_requirements: Identify the model and prompting method; test equivalent formulations and held-out instances; distinguish generalization from success within demonstrated ranges.
source_requirements: Primary systematic evaluations of GPT models available in the period. Later model improvements cannot contradict the historical observation.
