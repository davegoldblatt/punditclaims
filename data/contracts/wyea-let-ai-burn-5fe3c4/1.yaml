assessment_axis: forecast_outcome
explicit_source_elements:
  - raising money to finish (or furnish) one
  - after the bubble bursts
  - will be very, very difficult
evaluator_interpretation:
  - Read 'bubble bursts' as a broad collapse in the AI investment market described in the post, rather than a single project's delay or a temporary stock-price decline.
  - Read 'very, very difficult' as widespread inability to obtain completion or equipment financing, or materially worse financing terms and delays compared with the period before the collapse.
  - Assess a representative set of unfinished AI data centers. Neither one failed financing nor one successful financing settles the general claim.
  - This concerns sector-wide access to finance, not a stated financial amount for a named company.
support_condition: After an independently established broad AI investment collapse, representative evidence shows widespread failed or abandoned completion financing, substantial funding delays, or materially tighter terms.
contradiction_condition: After the same qualifying collapse, representative unfinished AI projects continue obtaining completion and equipment funding without substantial deterioration in success rates, terms, or timing.
measurement_requirements: Establish the collapse independently of the financing outcome being tested. Compare financing applications, completions, borrowing terms, delays, and abandonment before and after it.
source_requirements: Prefer lender and developer disclosures, financing records, and systematic market data. Distinguish announced funding from closed transactions and available facilities from actual drawdowns.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A documented broad investment collapse followed by a sufficiently representative record of completed or failed financing attempts could resolve the claim. Isolated transactions and pre-collapse financing cannot.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No objective threshold defines a bubble bursting.
  - No geographical scope is explicit.
  - No numerical threshold defines financing difficulty.
  - No deadline or post-collapse observation window is supplied.
retrospective_or_prospective: retrospective
