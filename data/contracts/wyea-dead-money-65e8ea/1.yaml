assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI and Anthropic
  - around 80% of their revenues
  - once they die
  - underlying revenues begin to decay
evaluator_interpretation:
  - Their revenues ordinarily means each lab's total revenue. Enterprise revenue, API revenue and spending observed in a payment panel are different denominators.
  - The antecedent is failure across the revenue-significant startup customer population described in the surrounding passage, not the failure of any isolated startup.
  - Decay means an absolute decline in realized revenue attributable to those customer failures, rather than merely slower growth.
  - For the current 80% premise, use April through June 2026, the latest completed calendar quarter before publication. This is not a deadline for the forecast.
  - The passage supplies no accounting basis or source for the revenue share.
support_condition: Evidence establishes the startup-failure antecedent, approximately 80% startup dependence in comparable baseline accounts, and a subsequent decline in each lab's realized revenue attributable to those failures.
contradiction_condition: After the specified customer population has failed and its spending has ceased, comparable accounts establish that the predicted revenue decline did not occur. An incorrect baseline revenue share would separately contradict the premise, but would not establish that the antecedent occurred.
measurement_requirements: Customer-class revenue for each lab, a defined startup cohort, dated business failures and spending cessation, and comparable before-and-after realized revenue with analysis of offsetting customers and price changes.
source_requirements: Lab financial accounts and customer-level disclosures, reliable failure records and evidence tracing changes in revenue to those failures.
metric_scope:
  company: OpenAI and Anthropic, each separately
  metric: AI startup share of total realized revenue and subsequent total revenue decline
  currency: USD
  units: percent of total revenue; dollars
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-04-01
  period_end: 2026-06-30
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-06-30
  precision: quarter
condition_status: unknown
early_resolution_rule: A decisive resolution requires documented failure of the relevant startup customer population and comparable subsequent lab revenue evidence. Growth before the antecedent occurs cannot refute the conditional forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The startup population and extent of failure required by once they die are unspecified.
  - No deadline or post-failure observation interval is supplied.
  - It is unclear whether 80% is asserted separately for each lab or for their combined revenue.
  - Nearby context also discusses enterprise revenue, which has a different denominator.
  - The current revenue-share premise is assigned to the latest completed pre-post calendar quarter.
  - No accounting basis is identified.
retrospective_or_prospective: retrospective
