explicit_source_elements:
  - a really large fraction
  - the AI and AI-adjacent community
  - doesn’t really want to talk about any of this at all
evaluator_interpretation:
  - The claim concerns willingness to discuss AI extinction and catastrophe risks, rather than belief that those risks are substantial.
  - A really large fraction means a substantial share, without imposing an unstated majority threshold.
  - The present-tense observation concerns August 2023 through the post date. There is no standard reporting period for this attitude.
  - Public disagreement, low risk estimates and survey nonresponse do not by themselves establish unwillingness to discuss the subject.
support_condition: Representative evidence from the target period shows that a substantial share of the relevant community rejects discussing these risks.
contradiction_condition: Representative evidence from the target period directly measures willingness to discuss these risks and shows that resistance is confined to a small share.
measurement_requirements: A defined community, sampling method, response rate and questions distinguishing unwillingness to discuss risk from skepticism about its likelihood.
source_requirements: Prefer original surveys and documented responses to discussion invitations. Individual statements provide context but cannot establish prevalence.
