assessment_axis: historical_observation
explicit_source_elements:
  - AI data centers all have "locked-in customer demand"
  - '"fundamentally untrue"'
  - '"The only guaranteed, locked-in customer demand I can find"'
  - from Amazon, Google and Microsoft (for OpenAI and Anthropic), Meta, and Google and Anthropic
  - other firms' "locked up capacity" is "only as good as their access to venture capital"
evaluator_interpretation:
  - "The core claim tested is a rebuttal: it is not true that all AI data centers have locked-in (contracted) customer demand. It holds if a meaningful share of AI data center capacity being built or delivered has no committed tenant or offtaker."
  - '"I can find" makes the named list a report of his own search. It is not scored as a complete list of every committed customer in the market. It is only checked loosely: do public sources describe large long-term commitments as coming mainly from the big cloud companies and the AI labs?'
  - "He named no period. The claim describes the state of the market when he wrote. I use the latest reported period before the post: 2026-01-01 to 2026-07-22, which covers first-half 2026 market data."
  - '"Locked-in demand" is read as signed leases, preleases or offtake contracts, not as forecast demand.'
support_condition: Credible market data or reports from the period show that a meaningful share of data center capacity under construction or coming online has no signed tenant, or that developers are building AI campuses on spec without committed customers.
contradiction_condition: Credible data show that essentially all AI data center capacity under construction is preleased or contracted. Or public records show widespread long-term commitments from many creditworthy customers outside his list, so that his description of where locked-in demand comes from is plainly misleading.
measurement_requirements: Preleasing share of capacity under construction, or documented spec builds without disclosed tenants, in H1 2026.
source_requirements: Commercial real estate research (CBRE, JLL), company disclosures, or reputable industry or news reports.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-01-01
  end: 2026-07-22
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - '"I can find" limits the named list to his own search; it is not tested as exhaustive.'
  - '"All" sets a low bar: some uncontracted capacity is enough to show not all capacity is locked in.'
  - No period stated; first-half 2026 used as the latest reported period before the post.
  - Market data cover all data centers in primary markets, not only AI-specific facilities.
retrospective_or_prospective: retrospective
