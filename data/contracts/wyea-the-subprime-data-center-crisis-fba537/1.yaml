assessment_axis: historical_observation
explicit_source_elements:
  - AI data centers all have “locked-in customer demand.”
  - fundamentally untrue
  - The only guaranteed, locked-in customer demand I can find
  - Amazon, Google and Microsoft
  - OpenAI and Anthropic
  - Meta
  - their dollars are only as good as their access to venture capital
evaluator_interpretation:
  - The first sentence rejects universal locked-in demand; it does not assert that no facilities have customers.
  - Include planned AI deployments because the surrounding discussion concerns financing and construction of the pipeline.
  - The ordinary testable reading of locked-in demand is a disclosed contractual capacity commitment. It does not mean payment is immune to every breach, cancellation or insolvency risk.
  - Treat the named-customer restriction as a claim about publicly documented commitments, not a claim about what Zitron personally searched.
  - Use April–June 2026, the latest completed calendar quarter before the post, for the publicly disclosed contracting state. Contract announcements and interim updates were reportable within that quarter.
support_condition: A disclosed planned AI deployment lacks full customer commitments, supporting the rejection of universal coverage. Support for the customer restriction additionally requires evidence that qualifying commitments are confined to the named buyers.
contradiction_condition: A disclosed AI-capacity agreement with an established customer outside the named group contradicts the customer restriction. Evidence that all relevant deployments were fully committed would contradict the first component.
measurement_requirements: Distinguish operational capacity from planned deployments, signed agreements from negotiations, and capacity purchases from equity investments. Apply the same contractual standard to named and unnamed customers.
source_requirements: Company disclosures or filed contracts identifying uncontracted deployments and named customers with capacity commitments.
