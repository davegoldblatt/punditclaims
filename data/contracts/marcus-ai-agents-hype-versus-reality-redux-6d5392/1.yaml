evaluator_interpretation:
  - The claim is conditional on a goal (agents with common sense, reasoning, grounding, reliability and theory of mind). It says generative AI alone cannot reach that goal. It has no deadline and no measure.
  - The backward-looking part (generative AI has repeatedly struggled on these points) is a broad characterisation. The forward part ('aren't the ticket') is an open-ended statement that something is impossible, which no dated evidence can settle.
support_condition: "Not adjudicable: you cannot observe that generative AI will never meet the goal."
contradiction_condition: Would be contradicted by a purely generative-AI agent that is broadly shown to have the listed capabilities reliably. No agreed test for that exists.
