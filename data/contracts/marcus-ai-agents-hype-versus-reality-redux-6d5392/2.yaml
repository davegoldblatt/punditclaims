explicit_source_elements:
  - If that’s what you want
  - generative just AI aren’t the ticket
  - the sticking points that have stymied them over and over again
  - common sense, sound reasoning, a tight grounding in reality
  - systems that reliably do you what you ask of them
  - enough theory of mind to infer your intentions
evaluator_interpretation:
  - Read the awkward phrase generative just AI as generative AI alone.
  - Assess present suitability as of 2025-01-15, and the stated explanation involving recurring capability failures. This is not a permanent impossibility claim.
  - The ordinary reading concerns agents that combine the listed abilities to dependably carry out varied requests, including interpreting intentions. It does not require human-like cognition or perfection on every task.
  - Generative AI alone permits ordinary input and action interfaces, but excludes an independent planner or verifier supplying the essential reasoning or reliability.
  - The opening if describes the desired system, not a future antecedent that must occur before assessment.
  - No numerical thresholds are added for common sense, grounding, reasoning, instruction-following or intention inference.
support_condition: Evaluations relevant to systems available at publication show recurring failures in the named capabilities that prevent dependable performance across representative delegated tasks, with technical evidence connecting those failures to reliance on generative AI alone.
contradiction_condition: Evaluations relevant to systems available at publication demonstrate dependable performance across representative delegated tasks requiring the combined capabilities, including intention inference, without another reasoning or verification system supplying them.
measurement_requirements: Task-level success and repeated-run consistency, failure analysis covering the named capabilities, tests of implicit intentions, and clear descriptions of which components perform reasoning and verification.
source_requirements: Primary evaluations and architectural descriptions of systems available by 2025-01-15. Later systems cannot retrospectively contradict this present-tense assessment.
