explicit_source_elements:
  - OpenAI
  - has no path to profitability
evaluator_interpretation:
  - The plain reading is that OpenAI's business, as it stood at publication, lacked a commercially credible route to sustained company-wide net profit.
  - This is stronger than saying OpenAI was losing money or had not demonstrated profitability.
  - Use calendar 2024 as the latest completed annual financial period before publication.
  - Assess commercial feasibility, not merely whether management published a projection. Do not convert the sentence into an unlimited forecast that OpenAI can never become profitable.
  - The linked background relies on press financial estimates; use estimate as the accounting basis without assuming GAAP or IFRS.
support_condition: Evidence about the business at publication shows that reasonably achievable revenue, pricing and cost changes could not produce sustained company-wide net profit.
contradiction_condition: Evidence establishes a commercially credible route available at publication, with achievable revenues and costs covering the company's full expenses.
measurement_requirements: A reconciled financial model covering revenue, customer economics, inference, training, staff and other material expenses, with justified growth and cost assumptions.
source_requirements: Prefer financial disclosures and independently examined financial models. Present losses, fundraising success and management forecasts alone cannot establish or exclude a viable route.
