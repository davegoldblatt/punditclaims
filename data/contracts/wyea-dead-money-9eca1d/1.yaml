evaluator_interpretation:
  - Test the reported annual expense and realized-revenue figures at their stated precision.
  - Spent means recognized operating expenses here, not cash outflow.
  - The ratio is calculated from the rounded figures supplied by the speaker.
  - The accounting basis is estimate because the passage attributes the figures to Reuters reporting on a prospectus.
support_condition: Independent reporting verifies approximately $12.65 billion in 2025 operating expenses and $4.6 billion in realized revenue; dividing those stated figures yields $2.75.
contradiction_condition: Same-period, same-scope evidence materially differs from either amount or shows that the numerator is not total operating expenses.
measurement_requirements: Calendar-year realized revenue and total operating expenses, including the costs classified within that total. Do not substitute cash burn, net loss or annualized revenue.
source_requirements: Prefer the prospectus; independently sourced reporting of its figures can establish the press-reported amounts.
