evaluator_interpretation:
  - "The ordinary reading is existential: some real uses or deployments had delivered insufficient benefits to justify their costs."
  - The claim does not say all deployments failed, or specify a failure percentage.
  - Use January–June 2025, the research period of the recent study invoked in the surrounding passage.
  - Credible deployment evaluations reporting investment without returns can support this modest claim. Failure to measure a benefit is weaker than proof that no benefit exists.
support_condition: Credible evidence documents some GenAI deployments with incurred costs and reported benefits insufficient to justify those costs during the target period.
contradiction_condition: Evidence establishes that the purported shortfall cases actually justified their costs and that the claimed exceptions lack a factual basis. Successful deployments elsewhere alone cannot contradict 'not always'.
measurement_requirements: Evidence linking practical deployment performance to incurred costs or reported returns. Distinguish short-term measured returns from lifetime value and distinguish individual productivity from company profit.
source_requirements: Primary deployment research or direct organizational evaluations; identify self-reporting, anonymization, and observation-period limitations.
