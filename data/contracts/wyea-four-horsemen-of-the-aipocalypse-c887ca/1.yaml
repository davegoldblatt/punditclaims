assessment_axis: historical_observation
explicit_source_elements:
  - industry’s future is predicated entirely
  - infinite resources
  - most AI companies
  - effectively front-ends
  - models owned by Anthropic and OpenAI
evaluator_interpretation:
  - The checkable component is the majority claim. Most means more than half of companies by count.
  - Read front-ends as companies whose principal AI product depends mainly on OpenAI or Anthropic models, without assuming that their own software adds no value.
  - The surrounding discussion concerns generative-AI startups. Treat those as the working population, while flagging that the wording could encompass a broader AI industry.
  - Use January–March 2026, the latest completed operating quarter before the post, for this ongoing-state observation.
  - Infinite resources is rhetorical language with no finite threshold or deadline. It cannot independently receive a factual score.
support_condition: A representative company-level census or survey for the target period shows that more than half of the relevant companies principally depend on OpenAI or Anthropic models.
contradiction_condition: Equivalent representative evidence shows that half or fewer principally depend on those providers.
measurement_requirements: Count companies, not tokens, API spending, developers or model calls. Establish principal dependence rather than occasional use, and account for companies using multiple providers.
source_requirements: A documented sampling frame plus product architecture or provider disclosures. Selected examples alone cannot establish a majority.
