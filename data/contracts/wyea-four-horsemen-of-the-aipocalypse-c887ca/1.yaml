ambiguity_flags:
  - No period is stated; the latest completed operating quarter is used.
  - AI companies could mean generative-AI startups, application companies or the entire AI sector.
  - Front-end has no stated architectural or economic threshold.
  - Using a provider does not necessarily establish principal dependence.
  - Infinite resources supplies no testable threshold.
