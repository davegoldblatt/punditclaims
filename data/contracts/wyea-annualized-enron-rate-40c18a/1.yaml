assessment_axis: historical_observation
explicit_source_elements:
  - SiliconData has an index
  - overwhelmingly favor spot pricing
  - what it costs to rent a GPU right now
  - versus what companies are paying on a long term basis
evaluator_interpretation:
  - Assess the index methodology in force at publication on October 13, 2026.
  - Read 'overwhelmingly' as a dominant preponderance of effective influence on the index. The speaker supplies no numerical threshold.
  - Use the speaker's definition of spot pricing, including immediately available rental prices, rather than restricting it to interruptible instances.
  - Including reserved prices does not by itself establish how much influence those prices have.
support_condition: Dated methodology, input composition and effective weights show that immediate rental prices dominate long-term contract prices in determining the index.
contradiction_condition: Those records show that long-term contract prices have substantial, comparable or dominant effective influence, inconsistent with overwhelming spot dominance.
measurement_requirements: Identify the relevant index series, input shares by rental term, provider weights, and the effects of normalization. Counts of observations alone are insufficient.
source_requirements: SiliconData methodology and underlying records applicable at publication, preferably with independent verification.
