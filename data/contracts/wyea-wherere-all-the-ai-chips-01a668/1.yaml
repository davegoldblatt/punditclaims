assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft is directly misleading
  - reporters, investors and the general public
  - about its capacity
  - for the best part of a year
evaluator_interpretation:
  - The ordinary reading is that Microsoft's communications materially overstate operational AI capacity, including through misleading presentation of total capacity.
  - The context identifies communications beginning in September 2025. I assess those communications through the post date.
  - A difference between total capacity and capacity using AI-specific chips does not by itself establish misleading communication. The surrounding disclosures and what the figures measure matter.
  - The surrounding allegation of deliberate misrepresentation requires evidence beyond ambiguous wording.
support_condition: Contemporaneous statements and operational records show that Microsoft materially overstated operational AI capacity or presented aggregate figures in a demonstrably misleading way despite relevant qualifications.
contradiction_condition: A sufficiently complete comparison shows that the challenged statements accurately described operational capacity and clearly distinguished aggregate capacity from AI-specific chip capacity.
measurement_requirements: Compare the same dates, facilities and capacity definitions. Separate announced, constructed, powered and operational capacity, and separate total infrastructure from AI-specific chips.
source_requirements: Original Microsoft statements with surrounding context, plus independently verifiable operational records. Establish deliberate concealment separately if relying on the allegation of intent.
