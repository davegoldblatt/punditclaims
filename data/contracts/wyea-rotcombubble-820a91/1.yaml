explicit_source_elements:
  - Microsoft's Super Bowl commercial
  - featured multiple things that it can't actually do
  - generate the code for a 3D open world game
evaluator_interpretation:
  - Assess the consumer Copilot capabilities depicted in the February 2024 advertisement, using the version available then.
  - Multiple means at least two distinct advertised capabilities.
  - The ordinary reading is that Copilot could not deliver the depicted results with reasonable prompting. A disappointing first response alone does not establish inability.
  - Generating game code does not necessarily mean delivering an entire finished game. The completeness of the promised code is ambiguous.
  - The target month follows the advertisement identified in the claim. The present-tense wording could alternatively refer to capabilities at publication.
support_condition: Contemporaneous tests or documented product restrictions establish that at least two depicted capabilities were unavailable, including the game-code example at the level actually represented.
contradiction_condition: Reproducible demonstrations establish that the advertised version could deliver the depicted capabilities, including usable game code, with reasonable prompting.
measurement_requirements: Preserve the advertisement, complete prompts, product version, outputs, and execution results for generated code. Distinguish unsuccessful attempts from unavailable capabilities.
source_requirements: The advertisement or an authenticated description, plus contemporaneous independent tests. Company explanations are relevant but do not independently establish performance.
