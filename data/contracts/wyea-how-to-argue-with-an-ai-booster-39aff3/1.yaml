explicit_source_elements:
  - around $77.1 billion
  - including all its funding
  - 30% of Amazon's capex
  - from the beginning of 2024
evaluator_interpretation:
  - Assess the disclosed funding-plus-capex calculation, not an accounting measure of Anthropic's losses.
  - The context supplies $83 billion for Amazon's 2024 expenditure and $105 billion for its 2025 plan.
  - Treat 30% as the speaker's allocation assumption.
  - All its funding means cumulative financing as of publication; whether an undrawn credit facility is included must be made explicit.
  - Allow ordinary rounding of the underlying inputs, without imposing an exact-cent interpretation of around.
support_condition: Dated financing records and compatible Amazon capex inputs reproduce approximately $77.1 billion under the stated 30% allocation.
contradiction_condition: Comparable verified inputs produce a materially different total or establish that an essential funding or capex input was incorrectly counted.
measurement_requirements: Separate funding received, financing commitments and credit availability. Reconcile gross cash purchases, lease-inclusive investment and spending plans.
source_requirements: Prefer company financing disclosures and Amazon filings or earnings statements; use dated reporting for unavailable private-company funding totals.
