explicit_source_elements:
  - bondholders have dumped the shit out of them in the last month
  - material concerns that CoreWeave won’t pay
  - $1.25 billion in bonds raised in June 2026
  - option-adjusted spread of 756bps
  - somewhere around 540bps on the day of issuance
evaluator_interpretation:
  - The plain reading is a substantial selloff and increased market pricing of repayment risk, not a prediction that default is certain.
  - The target period includes June issuance as the comparison baseline and trading through July 28. The stated selloff concerns approximately the preceding month.
  - The same dollar-denominated bond must be compared at issuance and near the post date. Other CoreWeave securities cannot substitute for it.
  - Spread widening alone does not establish trading volume or distinguish repayment concerns from liquidity and other risk premiums.
support_condition: Matched observations show substantial price deterioration and OAS widening from approximately 540 to 756 basis points, accompanied by contemporaneous evidence that repayment concerns materially contributed.
contradiction_condition: Comparable records show no substantial selloff or spread widening, or establish that the cited change concerns another security or measure and that repayment risk did not materially increase.
measurement_requirements: Identify the bond, observation dates, prices and OAS methodology. Distinguish OAS from coupon, yield to maturity, Treasury spread and CDS spread.
source_requirements: Dated trading or pricing records and contemporaneous credit analysis. The issuer's announcement can establish offering terms but cannot establish subsequent market sentiment.
