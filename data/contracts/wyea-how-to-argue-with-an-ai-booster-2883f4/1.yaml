assessment_axis: forecast_outcome
explicit_source_elements:
  - AI Will Do Science Research, Somehow — No it won't
  - foundation models can't do this
  - they're insufficient
evaluator_interpretation:
  - The plain reading is that foundation models will not independently conduct substantive scientific investigations, rather than that they cannot assist scientists at all.
  - A qualifying example must attribute the core hypothesis, investigation and analysis to a foundation-model system and independently validate the scientific result.
  - Human provision of tools, broad objectives, ethical oversight or physical execution is compatible with this reading; humans supplying the substantive scientific solution is not.
  - No deadline is stated. A finite period without a qualifying example cannot support the indefinite negative.
support_condition: No finite sequence of failures establishes this unrestricted prediction. Support would require a demonstrated general barrier applying to the claimed class of systems.
contradiction_condition: A dated, independently validated scientific investigation establishes that a foundation-model system performed the substantive research under the stated autonomy criteria.
measurement_requirements: Inspect research outputs, methods, human interventions, novelty and external validation. Distinguish model-led investigation from hypothesis suggestions, literature summaries and self-evaluation.
source_requirements: Original papers and research artifacts, together with independent scientific validation. A developer announcement or favorable model-generated review alone is insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted upon a dated, publicly documented independent validation of a qualifying foundation-model-led investigation. The validation must be available by the evaluation date; publication of a description alone does not establish that the scientific result was independently validated.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Do scientific research does not specify the necessary degree of autonomy.
  - The context distinguishes insufficiency from incapability without defining the distinction.
  - No deadline or standard of scientific acceptance is supplied.
retrospective_or_prospective: retrospective
