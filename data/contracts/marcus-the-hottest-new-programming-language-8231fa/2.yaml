ambiguity_flags:
  - “Apparently” qualifies the assertion.
  - “Just entered” gives no defined transition date or comparison period.
  - “New and different” supplies no criterion for distinguishing eras.
  - “Frightening” is a subjective evaluation.
  - “Uphold their end of the bargain” leaves the expected reliability and obligations unspecified.
