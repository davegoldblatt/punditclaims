condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The affected plans and other companies are unspecified.
  - All you can eat is a metaphor for generous bundled usage.
  - Many has no numerical threshold.
  - Think twice describes reconsideration, which need not produce cancellation.
  - No deadline is supplied for the customer response.
