  - big tech companies
  - A couple years ago
  - mostly lying about (or at least exaggerating)
  - current or near-term products
  - switched their focus to long term promises
evaluator_interpretation:
  - Read 'a couple years ago' as approximately 2022, compared with messaging by June 28, 2024.
  - The ordinary reading is an industry-level change in emphasis from overstated current or near-term capabilities toward distant transformative promises.
  - Because Marcus explicitly allows exaggeration as an alternative to lying, proving deliberate deception is unnecessary.
  - Read 'mostly' as a predominant pattern across a representative collection of promotional claims, not as the existence of a few misleading examples.
support_condition: A representative comparison shows predominant overstatement of current or near-term capabilities around 2022 and an increased emphasis on distant promises by June 2024.
contradiction_condition: A representative comparison shows no such change, or shows that the earlier promotional claims were predominantly accurate and appropriately qualified.
measurement_requirements: Use a consistent company sample and comparable communication types. Compare capability claims with contemporary demonstrations or evaluations and distinguish forecasts from claims about existing products.
source_requirements: Dated corporate announcements and executive statements, paired with independent capability evidence or a transparent comparative study.
