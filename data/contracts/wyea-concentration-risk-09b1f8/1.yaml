  - woefully unprofitable
  - lose tens of billions of dollars a year
evaluator_interpretation:
  - The ordinary grammatical reading applies the loss threshold to each company separately.
  - Read tens of billions as at least USD 20 billion annually, without imposing an upper ceiling.
  - Use calendar 2025, the latest completed annual period before the post, rather than annualizing a quarter or using projected 2026 results.
  - Net loss is the ordinary initial reading of an unspecified company loss, but the speaker supplies no accounting basis. Record that basis as unknown and do not issue a supported or contradicted verdict under the supplied money-claim rules.
  - Treat woefully as emphasis, not a separate numerical test.
support_condition: On an established accounting basis, both companies incurred annual losses of at least USD 20 billion in calendar 2025.
contradiction_condition: On that same established basis, either company lost less than USD 20 billion or was profitable in calendar 2025.
measurement_requirements: Use full-year results separately for each company. Distinguish net loss, operating loss, adjusted loss, and cash burn; identify noncash charges and attribution to owners.
source_requirements: Prefer financial statements. Independently verified reporting on private financial records is acceptable when those records are unavailable.
