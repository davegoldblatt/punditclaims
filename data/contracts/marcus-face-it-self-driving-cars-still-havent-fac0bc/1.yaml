assessment_axis: historical_observation
explicit_source_elements:
  - No matter how much data
  - these things are trained on
  - there’s always something new
evaluator_interpretation:
  - The ordinary reading is that accumulated training still leaves driverless cars encountering situations their training did not cover. Encountering something new does not necessarily mean failing to handle it.
  - Treat this as an observation about the systems operating when the post appeared, rather than a mathematical assertion about every possible future system.
  - "Use August 12–19, 2023: the preceding week identified in the surrounding discussion. Road incidents could be reported immediately, so a financial-style quarterly reporting period is inappropriate."
  - A driving failure alone does not establish missing training coverage. Evidence must connect operational novelty to what the relevant system had been trained on.
support_condition: Contemporaneous operational records and training documentation show that previously uncovered situations continued to arise despite expanded training.
contradiction_condition: Representative operational and training audits show that the purportedly novel situations were already covered and that the claimed continuing coverage problem was absent in the described period. Successful routine trips alone would not suffice.
measurement_requirements: Identify the deployed software version, relevant training coverage, training expansion, and the situations encountered. Distinguish unfamiliar situations from failures on familiar situations.
source_requirements: Operator records or independently verified investigations connecting actual incidents to training coverage. News reports can establish incidents but cannot independently establish what proprietary training contained.
