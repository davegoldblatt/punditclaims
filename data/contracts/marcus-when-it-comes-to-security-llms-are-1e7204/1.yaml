  - Most used does not specify visits, users, conversations or included interfaces.
  - ChatGPT contains multiple models whose safeguards may differ.
  - Nobody knows and only hinted at are rhetorical degrees of public disclosure.
  - Glorified lacks a specified media population or threshold.
  - True moral calculus has no supplied operational definition.
  - Only sorta kinda work supplies no failure-rate threshold.
