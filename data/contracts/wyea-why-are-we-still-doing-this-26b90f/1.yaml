assessment_axis: historical_observation
explicit_source_elements:
  - $20 a month
  - a Claude subscription
  - can spend as much as $163 in compute
evaluator_interpretation:
  - The surrounding paragraph separately converts $163 into an estimate of Anthropic's cost. I therefore read $163 as the retail API-equivalent value of included usage, not Anthropic's actual infrastructure expense.
  - Can spend is an attainable-capacity claim, not a claim about average subscribers or a guaranteed monthly allowance.
  - The post directly links the underlying measurement. I use January 2026, the reporting month of that contemporaneous measurement, and do not assume that later subscription limits were identical.
  - The monthly figure is an estimate obtained by converting weekly capacity into an average month, not a reported January invoice.
support_condition: A documented measurement of included Pro usage limits, valued at the applicable API prices, permits approximately $163 of usage in an average month without additional usage payments.
contradiction_condition: Reliable measurements establish that included Pro capacity under the relevant configuration cannot attain approximately $163 at applicable API prices, or that the calculation requires separately paid usage.
measurement_requirements: Identify the plan, weekly and session limits, token weights, applicable API prices and conversion to monthly capacity. Separate retail API value from internal compute cost.
source_requirements: A reproducible independent measurement or company disclosure of the limits, with applicable company API pricing. An actual monthly bill is not required for a capacity claim.
