explicit_source_elements:
  - only made $203m in revenue
  - $2.5bn ARR
  - at times
  - Anthropic spending anywhere from $8 to $13.50 for every dollar it makes
evaluator_interpretation:
  - The revenue and spending claims concern Claude Code, not Anthropic's entire business.
  - The pairing with ARR suggests a monthly revenue comparison. February 2026, the latest completed month before publication, is the provisional target period; the speaker names no month.
  - The realized revenue figure, annualized run rate, and cost-to-revenue ratio are separate assertions and require separate measurements.
  - The $203 million figure and spending ratio are treated as estimates; the linked ARR disclosure is company-reported.
  - At times refers to identifiable usage cases or intervals, not necessarily average costs across all customers.
  - Spending means Anthropic's actual service costs. The retail API value of a subscription allowance is a different measure.
support_condition: Comparable records establish $203 million of realized monthly Claude Code revenue, a roughly $2.5 billion annualized run rate, and identifiable cases with actual provider costs of $8–$13.50 per revenue dollar.
contradiction_condition: Comparable records establish a materially different realized revenue figure or run rate, or directly refute the asserted provider-cost ratios for the relevant cases. A retail-price comparison alone cannot establish either actual costs or their absence.
measurement_requirements: Identify the revenue month, annualization method, product allocation, usage cases, and actual provider expenses. Do not substitute subscription entitlements valued at API prices for provider expenses.
source_requirements: Product-level revenue disclosures and documented provider costs, or independently corroborated reporting measuring those quantities.
