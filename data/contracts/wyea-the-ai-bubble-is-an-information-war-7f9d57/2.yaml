explicit_source_elements:
  - Claude Code
  - only made $203m in revenue
  - ($2.5bn ARR)
  - at times involves Anthropic spending anywhere from $8 to $13.50 for every dollar it makes
evaluator_interpretation:
  - "The claim has three parts: (a) Claude Code's annualized run-rate (ARR) was about $2.5bn; (b) Claude Code made $203m in revenue; (c) at times Anthropic spent $8 to $13.50 to serve Claude Code for each dollar of revenue it earned."
  - He gives no period for the $203m. The parenthetical suggests it is roughly one month of revenue matching the $2.5bn run rate. I do not assign it to a specific month. The target period runs from Claude Code's general launch (May 2025) to the post date.
  - "'At times' limits part (c) to some periods or some users, not to the product's average economics. Testing it needs a documented cost-to-revenue ratio for Claude Code."
  - The claim is supported only if all three parts are shown. A documented figure that clearly conflicts with any part would contradict that part.
support_condition: Anthropic or credible reporting shows Claude Code ARR of about $2.5bn, a realized Claude Code revenue figure of about $203m, and documented instances where Anthropic's cost to serve Claude Code was $8 to $13.50 per dollar of Claude Code revenue.
contradiction_condition: Primary or credible reporting shows Claude Code ARR or revenue for the period clearly different from $2.5bn or $203m, or shows Claude Code cost to serve well below $8 per revenue dollar in every period.
measurement_requirements: Claude Code-specific revenue (realized and run-rate) and Claude Code-specific serving cost against revenue. Company-wide Anthropic figures are context only.
source_requirements: Anthropic disclosures or filings preferred. Reputable news reports are acceptable for cost data. The speaker's own newsletter cannot be cited as proof.
