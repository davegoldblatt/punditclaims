  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only upon a documented slowdown-caused cut to loss-making generative-AI spending under a defensible financial measurement scope. Mere passage of time cannot establish contradiction.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Growth could mean revenue, earnings, or a business segment's growth.
  - Neither the size nor duration of the slowdown is specified.
  - Generative-AI costs and losses are not defined.
  - No accounting basis or deadline is supplied.
retrospective_or_prospective: retrospective
