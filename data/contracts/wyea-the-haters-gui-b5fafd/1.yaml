assessment_axis: forecast_outcome
explicit_source_elements:
  - at some point
  - growth will slow at one of the Magnificent 7
  - costs will have to come down
  - such as generative AI
evaluator_interpretation:
  - Read growth slowdown as a decline in a company's reported year-over-year revenue growth rate between successive quarters after publication.
  - The predicted consequence is a reduction in spending on loss-making generative AI caused by that slowdown. General layoffs or reductions in unrelated spending do not suffice.
  - No deadline, minimum slowdown, spending measure, or accounting basis is supplied.
support_condition: A qualifying slowdown followed by documented reductions in loss-making generative-AI spending, with credible evidence linking those reductions to the slowdown.
contradiction_condition: Decisive evidence that the asserted necessity fails. Continued spending for a finite period after a slowdown weighs against the mechanism but cannot conclusively refute an eventual forecast with no deadline.
measurement_requirements: Comparable quarterly revenue growth rates for the antecedent; separately identified generative-AI spending and losses for the consequence. Aggregate capital expenditure is insufficient.
source_requirements: Company financial disclosures for the slowdown and spending changes, supplemented by reliable evidence explaining management's reasons.
metric_scope:
  company: An unspecified member of the Magnificent 7
  metric: Spending on loss-making generative AI
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
