  - For the ongoing observation, use April–June 2024, the latest complete quarter before publication.
  - "'So unprofitable' means substantial overall losses; the speaker supplies no numerical materiality threshold."
support_condition: Comparable evidence for the target quarter shows substantial aggregate losses across a representative set of generative AI providers, with revenues and total costs measured consistently.
contradiction_condition: Comparable evidence for the target quarter shows the provider industry broadly profitable or without substantial aggregate losses.
measurement_requirements: Match realized revenue and expenses for the same companies and period. Do not substitute annual forecasts, annualized revenue, financing, gross margins, or total profits of diversified technology companies.
source_requirements: Prefer financial disclosures. Where private-company figures are unavailable, identify press estimates and require enough comparable coverage to support an industry-level conclusion.
