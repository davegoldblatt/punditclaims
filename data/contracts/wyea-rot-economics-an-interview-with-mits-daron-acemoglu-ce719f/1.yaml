evaluator_interpretation:
  - The ordinary financial reading concerns generative AI providers' business profitability, including development and operating expenses, rather than revenue growth or customer productivity.
  - No individual company is named. Treat this as a claim about the provider industry broadly, not a claim solely about OpenAI or a claim that every provider loses money.
