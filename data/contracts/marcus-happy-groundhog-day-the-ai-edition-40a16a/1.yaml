explicit_source_elements:
  - made amazing progress, on other dimensions
  - hasn’t solved the core problems
  - essential 30 years ago
  - abstraction, compositionality, and the type-token distinction
evaluator_interpretation:
  - The context identifies the core problems as abstraction, compositionality, and separating knowledge about individual instances from knowledge about kinds.
  - Solved means a dependable general capability, not perfect performance on every possible input.
  - The assessment concerns the stated set of problems. Evidence about compositionality alone does not establish every named component.
  - "Hit a wall is assessed only in the limited sense Marcus supplied: important problems remain unresolved despite gains elsewhere. It is not treated as a prediction that future progress is impossible."
  - Use the latest completed research year, 2022, and the portion of 2023 preceding the post for the ongoing state.
support_condition: Contemporary evidence establishes substantial progress in generation or language interaction while controlled evaluations establish that the named core capabilities, including individual-versus-kind distinctions, remain unreliable.
contradiction_condition: Broad, reproducible contemporary evidence establishes dependable solutions to the named core capabilities, or the asserted progress elsewhere is absent.
measurement_requirements: Distinguish compositional generalization, abstraction and individual-versus-kind knowledge. Entity tracking or hallucination alone is not a direct measurement of the type-token distinction.
source_requirements: Original model evaluations and progress demonstrations available before the post. Include successful techniques and do not infer an architectural impossibility from benchmark failures.
