assessment_axis: forecast_outcome
explicit_source_elements:
  - not being able to pay its bills
  - breaching a contract with a major company
  - an inevitability in its future
evaluator_interpretation:
  - Assess the future prediction in the normalized proposition; the historical introduction is not a separate scored claim.
  - Read 'these' as predicting both inability to pay bills and a breach of a contract with a major company. One event could establish both.
  - Inability to pay means failure to meet an obligation because funds are unavailable, rather than a disputed invoice or administrative delay.
  - A contractual breach requires established nonperformance of OpenAI's own obligations. An allegation, negotiated amendment, or permitted termination alone is insufficient.
  - The nearby speculative reference to 2027 does not establish a deadline for this sentence.
support_condition: Dated records establish both a post-publication inability to pay obligations when due and a breach by OpenAI of a contract with a major company.
contradiction_condition: A definitive end to OpenAI's existence and obligations establishes that neither predicted problem can subsequently occur and that at least one never occurred. Continued operation alone cannot contradict an indefinite prediction.
measurement_requirements: Identify the debtor, obligation, due date, reason for nonpayment, contractual counterparty, breached provision, and event date. Distinguish allegations from established facts.
source_requirements: Court findings, insolvency records, admissions, creditor disclosures, or documented contractual records. Corroborated reporting may supplement unavailable primary records.
