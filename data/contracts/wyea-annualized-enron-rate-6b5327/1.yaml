explicit_source_elements:
  - I posit
  - we have little understanding
  - the true price that people are paying for AI GPUs
  - the underlying economics of AI data centers writ large
evaluator_interpretation:
  - This is a framed opinion ('I posit') about how much the public and investors collectively know. It is not a statement about a number.
  - "'Little understanding' has no threshold. There is no ordinary measure of how much knowledge would count as more than 'little'."
  - The claim describes an ongoing state. If it were scored, the period would be the state of public knowledge around the post date (October 2026).
support_condition: Would be supported if public sources showed that realized long-term GPU contract prices and data-center operating economics are mostly undisclosed, and that the public price benchmarks disagree with each other or reflect mainly short-term rentals.
contradiction_condition: Would be contradicted if realized contract prices and data-center unit economics were widely and consistently disclosed, for example in filings and in benchmarks that agree with each other.
measurement_requirements: null
source_requirements: Primary disclosures (filings, contract announcements, benchmark methodology pages) plus independent market analysis.
