explicit_source_elements:
  - $50B in, $3B out
  - obviously not sustainable
evaluator_interpretation:
  - The surrounding reference identifies these as industry estimates reported by The Wall Street Journal, rather than audited company accounts.
  - I read the figures as approximately $50 billion of investment against $3 billion of revenue. The referenced report assigns the comparison to 2023.
  - The ordinary reading of sustainability is whether the activity could cover its continuing economic costs without repeated outside funding. It does not imply that an initial investment must be recovered in its first year.
  - The numerical comparison and the sustainability conclusion must both hold to support the whole claim.
support_condition: Comparable estimates substantiate the stated spending and revenue amounts for 2023, and evidence about recurring costs, asset lives and financing shows that the activity could not maintain itself on that revenue.
contradiction_condition: Comparable evidence materially disproves the numerical comparison, or shows that revenue covered the continuing economic costs of the activity despite the initial investment.
measurement_requirements: Match the businesses covered by spending and revenue. Distinguish capital purchases from operating expenses, realized revenue from annualized revenue, and first-year receipts from lifetime returns.
source_requirements: The original estimate and its methodology, supported where possible by filings or company disclosures. A report repeating the estimate establishes its provenance but does not independently validate it.
