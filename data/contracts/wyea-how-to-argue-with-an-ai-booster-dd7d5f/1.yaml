explicit_source_elements:
  - 3.5%
  - monthly active users
  - 800 million or 900 million
  - these are guesses!
  - lower than 3%
evaluator_interpretation:
  - The numerical claim concerns paying users as a share of active users, rather than the percentage of a tracked cohort that purchases a subscription.
  - The surrounding paragraph supplies a numerator of 20 million consumer subscribers plus five million business users. Adding those groups requires checking for overlap and consistent definitions.
  - Because the claim describes an ongoing state, the target is the latest available snapshot in the current calendar quarter through publication, July 1–August 25, 2025. This does not make counts from different dates interchangeable.
  - The monthly-user figures are explicitly guesses. Their arithmetic implication can be checked separately from whether they describe actual usage.
  - The descriptions mediocre and terrible are value judgments and are not graded.
support_condition: Contemporaneous, consistently defined counts establish a paid share of approximately 3.5% of weekly active users and below 3% of monthly active users. The guessed monthly denominator must also be consistent with the stated arithmetic.
contradiction_condition: Matched counts establish a materially different weekly paid share or a monthly paid share of at least 3%. Arithmetic can contradict the implication of the guessed denominator without establishing the actual monthly share.
measurement_requirements: Paid consumer users, paid business users, their overlap, and worldwide weekly and monthly active users measured for the same date or reporting window. Visits, downloads, organizations and seats must not be treated as distinct active people.
source_requirements: Prefer OpenAI disclosures with definitions. Later reporting about the target period is admissible if available by the evaluation date, with its provenance and uncertainty stated.
