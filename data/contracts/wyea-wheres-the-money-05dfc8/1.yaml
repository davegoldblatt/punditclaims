ambiguity_flags:
  - Losing money does not specify marginal serving cost versus fully allocated cost.
  - Subscription and bundled-product revenue have no stated allocation to individual prompts.
  - The financial quarter is an evaluator choice for the ongoing financial assertion; January is the explicit adoption month.
  - The claim combines financial performance and consumer interest.
  - Nobody really cares is qualified by the immediate retraction in the next paragraph.
  - Accounting basis is unknown, preventing a supported or contradicted monetary verdict under the required rules.
