assessment_axis: causal_assessment
explicit_source_elements:
  - incentivizing as much content and as many interactions as possible
  - rather than curating the experience
  - is slowly killing Facebook
evaluator_interpretation:
  - The ordinary reading is that prioritizing engagement over experience quality is causing sustained deterioration in Facebook's audience or retention.
  - The surrounding post discusses audience trends from May 2021 through April 2024. That is the assessment period.
  - Examples of harmful recommendations establish a possible mechanism, but do not by themselves establish platform decline or its cause.
  - This assesses the present causal assertion, not the separate forecast of Facebook's eventual death.
support_condition: Comparable Facebook audience or retention measurements show sustained deterioration during the described period, and credible causal evidence attributes a material part of it to the stated engagement incentives.
contradiction_condition: Comparable measurements and credible causal evidence establish that the stated incentives did not produce the alleged sustained deterioration. Growth in one audience measure alone is insufficient.
measurement_requirements: Facebook-specific audience or retention trends with consistent geographic and product coverage, plus evidence distinguishing the proposed cause from competing explanations.
source_requirements: Independent audience measurements, platform disclosures, and causal studies. Examples of spam are insufficient alone.
