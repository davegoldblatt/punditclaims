explicit_source_elements:
  - They’re all
  - basically wrappers
  - for closed or open source models
evaluator_interpretation:
  - "'They' refers to AI startups in the preceding discussion. Preserve 'all' as a universal claim, not a claim about most startups."
  - The ordinary reading of 'basically wrappers' is that these businesses principally supply interfaces or applications around existing third-party models, without substantial model development of their own.
  - Using some third-party models or components does not by itself make an entire company basically a wrapper.
  - An established startup doing substantial model development is a counterexample even if it is atypical. A counterexample that also integrates external models addresses the narrower customer-oriented reading.
  - The statement describes an ongoing product state without a reporting period. Use the latest reportable calendar month to date, November 1–24, 2026, as the current snapshot; older documents are context only.
support_condition: Evidence covering the relevant startup population establishes that every company is principally an application or interface around third-party models, with no substantive counterexample.
contradiction_condition: At least one established AI startup in the relevant population demonstrably develops substantial models of its own as part of its business during the target period.
measurement_requirements: Technical descriptions of model ownership, architecture, training, released weights or code, and actual products. Distinguish substantial model development from merely calling or lightly adapting another provider's model.
source_requirements: Prefer dated technical reports, model releases, repositories, and company product documentation. Identify the company's startup status and any relevant third-party model integration.
