evaluator_interpretation:
  - The surrounding paragraph identifies AI application startups buying models from OpenAI and Anthropic as the relevant population.
  - The ordinary reading is that these businesses primarily supply application layers around other developers’ models. This does not necessarily mean their engineering is trivial.
  - The claim describes current product architecture. Use the publication-day snapshot, 2026-11-24, because architecture can be documented contemporaneously.
  - Treat 'all basically' as a broad generalization requiring representative evidence, rather than letting one atypical company settle the entire claim.
support_condition: Representative technical disclosures show that the relevant startups primarily provide application layers around third-party models.
contradiction_condition: Representative evidence or substantial counterexamples show that proprietary model development or other independent technology is central to the relevant startups’ products.
measurement_requirements: Identify the startup population and distinguish third-party inference, post-training, original model training, and application engineering. Individual examples cannot establish prevalence.
source_requirements: Current product documentation and technical disclosures, supplemented by a representative industry study.
