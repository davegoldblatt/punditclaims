assessment_axis: historical_observation
explicit_source_elements:
  - Right now
  - capacity is coming on very, very slowly
evaluator_interpretation:
  - Capacity means energized and usable AI data-center IT capacity.
  - In context, the ordinary comparison is actual commissioning against announced delivery schedules and the scale of promised deployment.
  - Very slowly means substantial, widespread lag, not merely that some projects encounter delays.
  - "I use January through August 2026: the current year's rollout through the latest completed calendar month before publication."
  - The accompanying remark about nobody wanting to discuss the issue is rhetorical and is not part of the supplied normalized capacity proposition.
support_condition: Broad, comparable project records show substantial capacity-weighted commissioning shortfalls against schedules due by the target-period end.
contradiction_condition: Broad, comparable records show operational AI capacity substantially meeting or exceeding schedules due during the target period, without widespread material delay.
measurement_requirements: Compare achieved AI IT MW and commissioning dates against original dated schedules for the same projects. Separate speculative announcements, committed projects, partial deliveries and full completion. Do not count capacity due later in 2026 as already overdue.
source_requirements: Prefer primary commissioning records and transparent independent project tracking. Forecast delays and general data-center statistics are context unless they establish actual AI-specific delivery shortfalls.
