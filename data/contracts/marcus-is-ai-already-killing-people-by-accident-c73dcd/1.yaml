assessment_axis: forecast_outcome
explicit_source_elements:
  - Many people
  - perhaps thousands, maybe more
  - will die, needlessly
  - those who use military algorithms bear responsibility
evaluator_interpretation:
  - The contextual forecast is that military AI use will contribute to numerous preventable deaths after March 1, 2026.
  - Perhaps thousands, maybe more describes a possible scale, not a firm minimum of one thousand.
  - "Needlessly is read as avoidably: evidence must identify an error or deficient deployment decision and a feasible precaution that could have prevented the deaths."
  - The claim can encompass harmful human deployment decisions as well as technical AI errors. Ordinary war deaths in operations using AI do not automatically qualify.
support_condition: Credible investigations establish numerous postpublication deaths causally linked to military AI use and identify how those deaths could feasibly have been prevented.
contradiction_condition: Conclusive evidence rules out the predicted preventable deaths over the entire forecast scope. A finite period without documented qualifying deaths does not contradict an undated prediction.
measurement_requirements: Document casualty counts without double counting, incident dates, AI's causal contribution and concrete grounds for preventability. Do not substitute total war casualties for AI-attributable deaths.
source_requirements: Casualty investigations, forensic evidence or credible investigative reporting establishing both causation and preventability.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when one or more dated postpublication investigations establish a clearly numerous total of preventable deaths caused or materially enabled by military AI use. A thousand deaths is not required.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Many has no numerical threshold.
  - Thousands is expressly hedged.
  - Needlessly requires a factual interpretation of preventability.
  - The causal connection to military AI is supplied by the surrounding context.
retrospective_or_prospective: retrospective
