  - Both Anthropic and OpenAI
  - Venture-Backed Startups
  - 80% Of Their Enterprise Revenues
  - Anthropic Used Discounts
  - To Pump Revenues In The Short Term
evaluator_interpretation:
  - The 80% assertion applies to each provider's enterprise revenue, rather than only their combined spending observed by Ramp.
  - Read 'pump revenues' as discounts causing additional near-term recognized revenue. It does not by itself allege improper accounting.
  - "The claim has two components: the customer-funding revenue share and the revenue effect of Anthropic's discounts."
  - For the ongoing revenue assertion and September discount discussion, use July–September 2026, the latest completed quarter before publication.
support_condition: Comparable evidence establishes approximately 80% venture-backed-startup enterprise revenue for each provider and a positive short-term revenue effect from Anthropic's discounts.
contradiction_condition: Comparable evidence establishes a materially different customer-funding revenue share or establishes that the cited discounts did not increase short-term revenue.
measurement_requirements: Separate each provider, identify venture-backed startups, and measure recognized enterprise revenue. For discounts, establish incremental revenue rather than merely lower prices, higher usage, or contractual commitments.
source_requirements: Representative transaction data or company revenue breakdowns, plus discount contracts and credible evidence of their revenue effects.
