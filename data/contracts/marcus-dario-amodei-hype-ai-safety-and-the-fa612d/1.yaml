assessment_axis: forecast_outcome
explicit_source_elements:
  - Eventually people will lose lives.
  - coding agents, and by extension most of generative AI, can’t reliably follow rules
  - system prompts
  - guardrails
evaluator_interpretation:
  - The prediction concerns deaths after publication on 2026-04-27 caused or materially contributed to by an AI agent failing to follow an applicable instruction, rule, or safety guardrail.
  - The ordinary reading requires an actual fatal incident and a documented causal connection, not merely dangerous behavior or AI use preceding a death.
  - I read 'people' as a general prediction of fatal harm, without a specified numerical threshold; one established fatal incident would suffice.
  - The context extends beyond coding agents to generative AI. Chatbot cases are therefore relevant candidates, but still require evidence of the specified failure and its causal contribution.
  - "'Eventually' supplies no deadline. The preceding data-loss example supplies context rather than a separate forecast."
support_condition: A publicly documented death after publication is credibly established to have been caused or materially contributed to by an AI agent's failure to follow an applicable rule, instruction, or guardrail.
contradiction_condition: A finite period without a qualifying death cannot contradict this indefinite forecast. Refuting individual alleged incidents would not establish that such a death will never occur.
measurement_requirements: Identify the fatality and its date, the AI system, the applicable rule or guardrail, the observed failure, and evidence connecting that failure to the death. Distinguish allegations from established findings.
source_requirements: Prefer public incident investigations, court findings, authenticated interaction records, and corroborated technical investigations. Reputable reporting may establish relevant facts when primary records are unavailable. A complaint or an association alone is insufficient.
metric_scope: null
original_horizon: Eventually
horizon_interval:
  start: 2026-04-27
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a documented post-publication fatal incident meeting the support condition, with evidence available by the evaluation date. A final court judgment is not required if other reliable records establish both the failure and its causal contribution.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline beyond 'eventually'.
  - The boundary between AI agents and conversational generative AI is unspecified.
  - No numerical fatality threshold is supplied.
  - The applicable rules and required degree of causal contribution are unspecified.
retrospective_or_prospective: retrospective
