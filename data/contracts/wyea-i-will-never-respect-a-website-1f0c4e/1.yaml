explicit_source_elements:
  - This entire industry
  - sold on a lie
  - as capacity becomes an issue
  - even true believers are turning on the AI labs
evaluator_interpretation:
  - Read in context, the alleged lie concerns selling AI services on expectations of quality and access that the labs could not sustain.
  - Turning on the labs means public criticism by previously enthusiastic users; it does not require abandoning AI.
  - The recent backlash is assessed over March 1–April 14, 2026, the latest completed month and current month before publication. Earlier sales commitments would be contextual evidence.
  - Capacity problems and complaints occurring together do not by themselves establish deception or causation.
support_condition: Identify materially misleading sales commitments, evidence that they could not be sustained, and documented reversals by prior enthusiasts linked to capacity-driven restrictions. Evidence must justify the claimed industry-wide scope.
contradiction_condition: Evidence establishes that the identified commitments were accurately qualified and fulfilled, or that the alleged reversals did not occur or arose from unrelated causes.
measurement_requirements: Compare specific sales representations with delivered service. Establish complainants' prior enthusiasm and their stated reasons for criticism.
source_requirements: Dated marketing records, service policies, and firsthand customer statements. Industry-wide conclusions require evidence beyond a single provider.
