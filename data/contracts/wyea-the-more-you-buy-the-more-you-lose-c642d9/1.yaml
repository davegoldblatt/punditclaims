assessment_axis: forecast_outcome
explicit_source_elements:
  - Hyperscalers
  - will have sunk over $1.3 trillion dollars
  - into generative AI
  - by the end of 2026
evaluator_interpretation:
  - The normalized claim concerns cumulative spending through 2026. The separate statement about plans for 2027 is not included in this assessment.
  - The following paragraph identifies the relevant companies as Meta, Alphabet/Google, Amazon and Microsoft.
  - The following paragraph's March 2022 starting point is the contextual reading of the cumulative spending baseline, although the forecast itself does not state one.
  - Spending means realized expenditure attributable to generative AI. Total corporate capital expenditure, outstanding commitments and financing cannot automatically be counted as generative-AI spending.
  - The claim does not specify a financial accounting basis or a consistent treatment of leases.
support_condition: Comparable records show that the four companies' cumulative realized generative-AI spending exceeded USD 1.3 trillion by December 31, 2026.
contradiction_condition: Complete, comparable records through December 31, 2026 show cumulative realized generative-AI spending of USD 1.3 trillion or less.
measurement_requirements: A reconciled cumulative total with a stated starting date, consistent treatment of leases and acquisitions, and documented allocation of shared infrastructure to generative AI. Do not substitute total capex, commitments, debt or forecasts.
source_requirements: Company filings or disclosures with a defensible generative-AI allocation and reconciliation across the four companies.
