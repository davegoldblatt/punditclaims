assessment_axis: causal_assessment
explicit_source_elements:
  - Amazon and Google
  - doing equally poorly
  - which is why
  - nobody wants to talk about their actual AI revenues
evaluator_interpretation:
  - In context, equally poorly means AI revenue outside OpenAI and Anthropic is similarly inadequate relative to investment at Amazon and Google as at Microsoft.
  - Treat nobody wants to talk as a claim about reluctance to disclose meaningful revenue detail, rather than a literal assertion that no person discusses AI revenue.
  - The causal claim requires evidence that weak performance explains that reluctance.
  - Use April–June 2026, the latest completed reporting quarter before publication. Full-year analyst forecasts are context, not realized results for this period.
support_condition: Comparable estimates show similarly weak AI revenue excluding the two labs, relative to investment, at both companies; direct or well-supported evidence links that weakness to disclosure decisions.
contradiction_condition: Comparable evidence shows materially stronger performance at either company, or reliable evidence contradicts the asserted explanation for withholding revenue detail.
measurement_requirements: Comparable customer exclusions, revenue definitions, reporting periods and investment allocation across all three companies, plus evidence about disclosure decisions.
source_requirements: Original analyst research or company disclosures for the comparison; documents or attributable testimony for the causal explanation.
