evaluator_interpretation:
  - The ordinary reading is a sharp, broad collapse of the generative-AI investment boom discussed in the post.
  - The surrounding references to OpenAI, NVIDIA, Oracle, US economic health, and 401Ks make the US-centered AI ecosystem central to that reading.
  - Look for a broad valuation collapse corroborated by a substantial contraction in financing or investment. An isolated company failure, regional crash, or temporary correction is insufficient.
  - No numerical decline, duration, or deadline is supplied; none is attributed to the speaker.
support_condition: A documented sharp and broad collapse of the relevant AI boom, evident in valuations and corroborated by financing or investment contraction.
contradiction_condition: Decisive evidence that the particular boom ended through an orderly adjustment without a broad collapse. Continued growth or the absence of a crash by an evaluator-selected date is insufficient.
measurement_requirements: Compare representative AI equity valuations, private financing, and infrastructure investment over time. Establish breadth and distinguish announced commitments from completed investment.
source_requirements: Prefer market data, filings, financing disclosures, and investment records. Reputable reporting may supply regional market evidence where primary records cannot be retrieved.
