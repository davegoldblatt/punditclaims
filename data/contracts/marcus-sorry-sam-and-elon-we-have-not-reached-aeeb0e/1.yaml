assessment_axis: forecast_outcome
explicit_source_elements:
  - Brain-computer interfaces
  - will surely improve greatly
  - may take many decades or even centuries
  - get where Kurzweil dreams of
evaluator_interpretation:
  - Great improvement means substantial, documented gains in useful BCI capability relative to the July 28, 2026 baseline, such as communication, control, reliability or practical usability.
  - No numerical improvement threshold is supplied; no arbitrary percentage is imposed.
  - The parenthetical permits a long wait for Kurzweil's vision. It does not promise that vision by a particular date or require all meaningful improvements to wait decades.
  - A small study or new publication does not automatically establish a substantial advance over capabilities already achieved before the post.
support_condition: Dated, independently validated results establish substantial practical capability gains beyond the July 2026 baseline.
contradiction_condition: No finite interval of slow progress contradicts this forecast without a deadline. Contradiction would require compelling evidence that the promised substantial improvement cannot occur.
measurement_requirements: Comparable pre- and post-posting measures, dates of achievement, participant numbers, assistance requirements and evidence that gains are reproducible and practically meaningful.
source_requirements: Prefer peer-reviewed human studies and reproducible clinical results. Company announcements require validation before conclusive resolution.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported on a dated post-publication demonstration of independently validated, reproducible and substantial practical BCI gains over the July 2026 baseline. A publication date alone does not establish when the advance occurred.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Greatly has no numerical threshold.
  - No deadline is stated.
  - Kurzweil's ultimate vision is not operationally specified.
  - The forecast does not identify a particular BCI modality or application.
