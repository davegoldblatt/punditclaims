evaluator_interpretation:
  - Assess the normalized OpenAI affordability claim, not the separate assertion about Blackstone's insurance funding.
  - The ordinary reading concerns ability to meet Oracle compute payments when due using available cash, cash generation and accessible financing.
  - It does not require OpenAI to hold the entire multiyear contract value in cash or fund all payments from current revenue.
  - "Because the ongoing observation names no period, use the latest completed calendar quarter before the post: October–December 2025. Annual figures and subsequent financing are context unless they establish conditions within that quarter."
  - The OpenAI affordability assertion names no accounting basis. The nearby attribution about Blackstone does not establish a basis for OpenAI's finances.
support_condition: Matched records establish that OpenAI lacked sufficient available resources to meet the relevant Oracle payments as they fell due during the target period.
contradiction_condition: Matched records establish sufficient available resources to meet those payments during the target period.
measurement_requirements: Match Oracle-specific payment amounts and dates against unrestricted cash, available financing and cash flows after competing obligations. Do not substitute revenue, valuation or announced investment for spendable cash.
source_requirements: Prefer OpenAI financial records and Oracle contract or payment records. Press estimates require explicit attribution and matching periods and definitions.
