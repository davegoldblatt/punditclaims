evaluator_interpretation:
  - "Plain reading: at the time of the post, OpenAI lacked the means (revenue, cash and available financing together) to pay what it owes for compute in the Oracle-built data centers."
  - The Oracle contract (about $300B over five years) mostly begins in 2027. So affordability is largely about future payments, which an observation as of March 2026 cannot settle.
  - "Period: the state at the post date. I use early 2026 up to 2026-03-17, the latest financial picture before the post. This choice is flagged."
support_condition: Evidence that OpenAI missed, deferred or renegotiated payments due to Oracle for lack of funds, or could not raise the money needed for payments then due.
contradiction_condition: Evidence that OpenAI was paying what was due to Oracle and had cash and committed funding enough to cover the payments falling due.
measurement_requirements: OpenAI's payments due to Oracle in the period, compared with its cash, revenue and committed funding; any missed or renegotiated payments.
source_requirements: Oracle or OpenAI disclosures, or reputable reporting on payment status and OpenAI's finances.
