assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI has yet to make a profit
  - doesn’t anticipate making one before 2029
evaluator_interpretation:
  - This describes OpenAI's financial history and its expectations as of December 11, 2024. It does not predict whether OpenAI will actually become profitable in 2029.
  - The ordinary reading of profit is company-wide earnings after expenses, rather than revenue, financing, gross margin or cash flow.
  - The post links its expectations statement to a press report, so the accounting basis is estimate.
  - Has yet describes the historical record through the post, rather than one quarter. The starting date is unspecified. Annual profitability is the working reading, but the sentence does not expressly exclude a profitable quarter.
support_condition: Comparable financial records establish no realized company-wide annual profit before the post, and contemporaneous reporting of internal projections establishes that OpenAI expected no annual profit before 2029.
contradiction_condition: Comparable records establish an earlier annual profit, or contemporaneous internal projections anticipate annual profitability before 2029.
measurement_requirements: Separate realized earnings from projected earnings. Establish the treatment of training costs, stock compensation and other excluded expenses. A projected loss cannot establish a realized loss.
source_requirements: Prefer company financial statements and dated internal projections. Credible reporting based on those documents is acceptable if its accounting scope is clear.
