assessment_axis: causal_assessment
explicit_source_elements:
  - because they’re probabilistic
  - can’t actually be relied upon
  - the same thing every single time
evaluator_interpretation:
  - The ordinary practical reading concerns repeated generation from the same prompt under normal sampling settings.
  - The categorical causal wording also suggests that probabilistic models inherently prevent repeatable outputs. That stronger implication is assessed separately.
  - Repeatability means reproducing an output, not necessarily producing a correct answer.
  - The assessment concerns mechanisms and capabilities available by publication, not later model improvements.
support_condition: Documentation or controlled experiments show that probabilistic sampling can produce different outputs for identical prompts and therefore does not guarantee repetition.
contradiction_condition: A probabilistic language model demonstrably produces repeatable outputs under controlled decoding and inference, showing that its probabilistic nature does not inherently prevent repetition.
measurement_requirements: Identify the model, prompt, sampling configuration and inference controls. Distinguish sampling randomness from numerical or batching effects and distinguish identical output from correct task performance.
source_requirements: Primary decoding documentation and reproducible inference experiments.
