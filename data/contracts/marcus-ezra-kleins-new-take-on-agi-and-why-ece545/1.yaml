explicit_source_elements:
  - AGI is imminent is false
  - underrepresented
  - current policy discussions
evaluator_interpretation:
  - The ordinary reading is that prominent policy discussions give insufficient serious consideration to AGI taking substantially longer than the next two to three years.
  - The surrounding discussion principally concerns US and UK policy. These are the main jurisdictions assessed, without treating them as the entire worldwide discussion.
  - Because no reporting period is specified, the target is the current 2025 policy discussion through publication. Individual documents can establish consideration of a scenario, but cannot establish its overall representation.
  - Underrepresentation requires a defensible comparison of attention and substantive treatment. Equal airtime is not assumed.
support_condition: A representative set of contemporaneous policy records shows systematically little substantive consideration of non-imminent AGI, relative to imminent AGI, under a justified comparison.
contradiction_condition: Representative records show substantial consideration of non-imminent AGI commensurate with the acknowledged uncertainty. Isolated counterexamples alone do not settle the claim.
measurement_requirements: Define the policy-discussion population, sampling method, treatment of prominence, and what counts as substantive consideration rather than a passing qualification.
source_requirements: Contemporaneous policy documents, official speeches, hearings, and attributable discussions; preferably a transparent comparative analysis.
