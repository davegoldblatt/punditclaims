explicit_source_elements:
  - 30 years ago
  - in the midst of a rebirth
  - The first one collapsed
  - this one has more staying power
evaluator_interpretation:
  - The comparison concerns the connectionist revival of the 1980s and early 1990s and the deep-learning revival observable by February 3, 2023.
  - The ordinary reading of staying power is sustained research activity and established practical adoption, rather than a specified number of years.
  - Collapsed means a substantial retreat in prominence and enthusiasm, not the disappearance of neural-network research.
  - The target period spans both waves because this is a historical comparison. Survival through 2026 is not an additional requirement.
support_condition: Historical evidence establishes a substantial retreat of the earlier revival, while evidence available by the post establishes sustained research and substantially broader practical adoption during the current revival.
contradiction_condition: Comparable historical records show no substantial retreat of the earlier revival, or show that the current revival had already suffered a comparable retreat without stronger practical foundations.
measurement_requirements: Use research history and actual deployment or adoption. Do not treat announcements of future products as completed adoption.
source_requirements: Expert historical accounts and primary deployment disclosures. No evidence from Marcus's own writing.
