assessment_axis: historical_observation
explicit_source_elements:
  - 9 months later
  - it’s stilly common
  - LLMs
  - spout complete, utter bullshit
evaluator_interpretation:
  - In context, complete falsehoods means invented factual assertions presented as true, rather than offensive language or every kind of mistake.
  - Common means a recurring, non-exceptional problem in ordinary factual tasks. It does not require a majority of all outputs to be false.
  - The context illustrates the present with last week's and last night's examples. I use September 25–October 4, 2023, the last complete calendar week before publication through the post date.
  - The nine-month phrase supplies timing, not a conditional antecedent.
  - Selected anecdotes alone cannot establish frequency. Results confined to one difficult task also cannot establish frequency across ordinary factual uses without qualification.
support_condition: Repeated evaluations of widely used contemporary LLMs show fabricated factual assertions at nontrivial rates across a reasonably representative range of ordinary factual tasks.
contradiction_condition: Comparable evaluations show that fabricated factual assertions were exceptional across ordinary factual tasks in the relevant contemporary systems.
measurement_requirements: Identify model versions, collection dates, prompts, denominators, and criteria for factual fabrication. Separate rates per citation, statement, response, and user interaction.
source_requirements: Dated primary evaluations or independently collected usage samples. Publication dates must not substitute for the dates outputs were generated.
