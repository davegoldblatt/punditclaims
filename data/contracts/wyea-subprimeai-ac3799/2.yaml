assessment_axis: forecast_outcome
explicit_source_elements:
  - training costs that are currently $3 billion for the year
  - will almost certainly increase
  - would likely be burning more like $6 billion a year on server costs
  - if it wasn’t so deeply wedded to Microsoft
evaluator_interpretation:
  - Score only the training-cost increase forecast. The qualified server-cost counterfactual is outside the scored commitment.
  - The baseline is the cited $3 billion annual training-cost estimate for 2024.
  - An increase means a subsequent calendar year's aggregate training costs exceed that baseline on a comparable basis.
  - Training includes experimental and unsuccessful training work; it is not restricted to final runs for released models.
  - No deadline is supplied. A later spending projection alone does not establish that the increase happened.
  - A broader R&D total requires a reconciliation to the baseline training category before it can settle the forecast.
support_condition: Reliable reporting establishes that OpenAI incurred more than $3 billion in comparable annual training costs in a calendar year after 2024.
contradiction_condition: A definitive end to OpenAI's model-training activity, with a complete comparable spending record, establishes that no subsequent annual training total exceeded $3 billion. A temporary decline or lack of an increase so far is insufficient.
measurement_requirements: Annual incurred training costs, including relevant experimental training and data costs. Separate inference, staffing, general research, infrastructure commitments and future budgets unless the source reconciles them to the baseline category.
source_requirements: Company disclosures or credible reporting on actual annual training expenditure. Category definitions must allow comparison with the cited 2024 estimate.
