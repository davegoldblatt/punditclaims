evaluator_interpretation:
  - "The surrounding passage identifies Microsoft's FY2026 second and third quarters: October–December 2025 and January–March 2026."
  - Read the denial as applying to roughly one gigawatt of operational additions in each quarter, rather than an exact 1,000MW threshold.
  - Operational additions can include commissioned portions of larger campuses and leased facilities. Completion of every planned building is not necessary for capacity to enter service.
  - Assess the two quarters separately; do not substitute their combined total.
support_condition: Comparable records show operational additions materially below approximately 1GW in both referenced quarters.
contradiction_condition: Comparable records establish approximately 1GW of operational additions in each referenced quarter. If only one quarter meets that level and the other clearly does not, the two-quarter assertion is mixed.
measurement_requirements: Separate commissioning totals for 2025-10-01 through 2025-12-31 and 2026-01-01 through 2026-03-31, using consistent power definitions and identifying operational versus merely contracted capacity.
source_requirements: Commissioning records, defined operational-capacity disclosures, utility evidence, or independent measurements sufficient to reconcile each quarterly total.
