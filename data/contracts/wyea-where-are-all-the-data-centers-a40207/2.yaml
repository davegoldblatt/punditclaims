assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft's earnings transcripts say it "added another gigawatt of capacity"
  - "\"which sounds far more like it's saying it brought them online\""
  - "\"but it didn't, right? It obviously hasn't.\""
evaluator_interpretation:
  - "Read as a claim about the quarter Microsoft referred to when it said it \"added another gigawatt\": fiscal Q3 2026 (January to March 2026), the latest quarter reported before the post. The word \"another\" also points back to the prior quarter's \"nearly 1 GW\" (October to December 2025). That quarter is context, not a separate assertion."
  - "\"Brought online\" means capacity that was energized and usable for Microsoft's workloads during the quarter, whether owned or leased. Capacity that was only contracted, or still in construction, does not count."
  - Microsoft's own use of the word "added" cannot settle the dispute, because the dispute is over what that word means.
support_condition: Independent evidence (satellite tracking, filings, utility or permit records, credible reporting) showing that Microsoft's energized, usable capacity grew by well under about 1 GW in January to March 2026, or a Microsoft statement that the gigawatt was contracted or under construction rather than live.
contradiction_condition: An explicit Microsoft statement that about 1 GW became live or in service in that quarter, or independent tallies showing about 1 GW of Microsoft-used capacity (owned or leased) energized between January and March 2026.
measurement_requirements: Megawatts of energized, usable capacity used by Microsoft, owned or leased, that became operational between 2026-01-01 and 2026-03-31.
source_requirements: Microsoft filings or transcripts that define the term, or independent site-level measurement covering most of Microsoft's footprint, including leased capacity.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-01-01
  end: 2026-03-31
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Microsoft never defined "added capacity" (energized, live, leased or contracted).
  - The speaker does not say how much below 1 GW the true figure was, so it is unclear whether a partial shortfall counts.
  - The quarter is inferred from "added another gigawatt" in the transcript he quotes.
