  - The sentence is broader than its surrounding discussion of venture-backed companies.
  - The growth period is unspecified; calendar 2025 is evaluator-selected.
  - Entirely unsustainable has no accounting basis or time horizon.
  - The wording does not distinguish direct venture funding from subsidies embedded in suppliers' prices.
