assessment_axis: causal_assessment
explicit_source_elements:
  - “Fast-growing” AI companies
  - only grew because
  - burn as much money as they wanted
  - services that are entirely unsustainable
  - raising more venture capital money with every burst of user growth
  - aggressively market to new users
evaluator_interpretation:
  - The ordinary reading is that venture-financed subsidies were necessary for the observed rapid growth, through a repeated fundraising, marketing, and user-acquisition cycle.
  - As much money as they wanted is read as readily available financing, not literally infinite funds.
  - I assess recent growth during calendar 2025, the latest completed annual reporting period before publication and the year used in the surrounding financial example.
  - Growth and fundraising occurring together do not establish that subsidies were necessary.
  - The context may restrict the population to venture-backed startups, although the sentence itself says fast-growing AI companies generally.
support_condition: Company-level causal evidence establishes that rapid growth required venture-funded subsidies and that repeated fundraising financed the asserted marketing cycle across the relevant companies.
contradiction_condition: Comparable rapid growth without venture-funded subsidies, or credible causal evidence that growth did not require those subsidies, defeats the necessity claim under the broad reading.
measurement_requirements: Connect funding receipts, service costs, pricing, marketing spending, customer acquisition, retention, and growth. Distinguish annualized revenue from realized revenue and provider subsidies from a startup's own financing.
source_requirements: Dated financial and operating records, funding histories, and evidence capable of separating causes from correlation.
