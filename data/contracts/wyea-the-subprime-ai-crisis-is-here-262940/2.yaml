assessment_axis: causal_assessment
explicit_source_elements:
  - '"Fast-growing" AI companies'
  - only grew because
  - allowed to burn as much money as they wanted
  - selling services that are entirely unsustainable
  - raising more venture capital money with every burst of user growth
  - aggressively market to new users
evaluator_interpretation:
  - "Population: venture-backed AI startups usually described as fast-growing, mostly app companies built on OpenAI and Anthropic models (the post's context). Bootstrapped companies that raised no VC are outside his words, since he describes a VC-funding loop."
  - "'Only grew because' is a necessity claim: without heavy money-losing subsidised pricing paid for by repeated VC rounds, these companies would not have grown."
  - "Period: the AI startup boom, from 2023 up to the post date. He named no narrower window, so none is imposed."
  - A strict universal reading is contradicted by any clearly fast-growing, VC-backed AI startup that grew while profitable or near break-even. A looser 'typical case' reading needs counterfactual evidence about whether the hyped companies would have grown without subsidies. Public data cannot supply that.
support_condition: Evidence that the prominent fast-growing VC-backed AI startups sold below cost (negative unit economics or margins), paid for that with repeated VC rounds, and that their growth depended on the subsidy, with no clear counterexamples of fast growth without heavy burn.
contradiction_condition: Clear examples of fast-growing VC-backed AI startups that grew while profitable or with positive unit economics, or evidence that the leading companies' growth did not depend on subsidised pricing.
measurement_requirements: Company-level revenue growth, profitability or gross margin, and funding history for fast-growing AI startups, plus some basis for judging whether growth depended on subsidy.
source_requirements: Company disclosures, filings, or reputable press reports of company figures.
