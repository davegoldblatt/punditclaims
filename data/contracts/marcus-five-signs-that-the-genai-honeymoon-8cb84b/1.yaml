evaluator_interpretation:
  - The referenced project is Meta's celebrity-persona chatbot offering.
  - Read 'bites the dust' as discontinuation of that offering, and 'monetization scheme' as an initiative intended to create commercial opportunities through engagement.
  - This is a categorical claim about a product initiative, not a claim about a measured revenue loss, profit or spending amount.
  - "'Another' supplies rhetorical context; it does not specify a separately checkable count of previous failures."
support_condition: Meta discontinued the celebrity-persona chatbot offering in late July, and primary statements establish a commercial rationale for the initiative.
contradiction_condition: The celebrity-persona offering remained available, or reliable evidence establishes that the identified initiative had no intended commercial role.
measurement_requirements: Identify the exact offering, its availability by July 30, and its stated commercial purpose. Distinguish it from Meta AI and the broader AI Studio platform.
source_requirements: Prefer Meta statements. A reputable report containing direct confirmation from a named Meta spokesperson can establish discontinuation.
