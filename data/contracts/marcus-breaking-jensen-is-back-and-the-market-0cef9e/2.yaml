  - The plain reading is that Nvidia's publicly traded share price remained approximately one-third below its historical peak on November 23, 2026.
  - Treat 'a third' as an ordinary spoken approximation, rather than exactly 33.333%. A decline of roughly 30%–37% qualifies.
  - Use the November 23 closing price against the previous record closing price as a reproducible daily comparison. Marcus did not specify a quotation time or distinguish closing and intraday peaks.
  - This is a market-price comparison. An accounting basis is irrelevant, so metric_scope is null.
support_condition: Comparable share-price records show Nvidia approximately one-third below its previous peak on November 23, 2026.
contradiction_condition: Comparable share-price records show a decline materially different from approximately one-third on November 23, 2026.
measurement_requirements: Calculate 100 × (1 − November 23 share price / previous peak share price), using USD prices on a consistent split-adjusted basis. Use closing prices for the principal comparison and identify the unspecified quotation time.
