evaluator_interpretation:
  - The ordinary reading is readiness for unsupervised everyday driving across arbitrary destinations and driving conditions, rather than usefulness within a limited service area.
  - "'Anywhere close' means substantial technical work remained; lack of a universal commercial offering alone does not establish this."
  - For the ongoing state, use June 1–15, 2022, the publication month to date. Earlier company disclosures are context.
support_condition: Evidence establishes substantial remaining technical barriers for both Tesla and Waymo to unrestricted everyday driverless use.
contradiction_condition: At least one of the two had demonstrated that broad capability, or credible evaluations showed only minor technical barriers remained.
measurement_requirements: Evaluate supervision requirements, operating domains, demonstrated safety, and remaining technical limitations separately. Do not treat geofencing alone as a measurement of distance to general capability.
source_requirements: Contemporary company documentation, regulatory records, and independent capability or safety evaluations for both companies.
