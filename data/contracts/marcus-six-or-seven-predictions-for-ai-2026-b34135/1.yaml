assessment_axis: forecast_outcome
explicit_source_elements:
  - We won't get to AGI
  - in 2026 (or 7)
evaluator_interpretation:
  - The hedge '(or 7)' extends the forecast through the end of 2027. The latest day the deadline can mean is 2027-12-31.
  - "Plain reading: no AI system will be broadly accepted as AGI (generally human-level across a wide range of cognitive tasks) by the end of 2027. A single CEO's or lab's self-declaration does not count as broad acceptance on its own."
  - "Early resolution rule: the forecast is contradicted early only if, before the deadline, a system is broadly accepted as AGI, for example through formal independent verification (such as the expert panel in the Microsoft-OpenAI agreement) plus wide agreement among independent experts. Support cannot come before 2027-12-31."
support_condition: By 2027-12-31, no AI system has been broadly accepted by independent experts as AGI.
contradiction_condition: Before 2028, a system is broadly accepted as AGI, for example confirmed by an independent verification process and widely acknowledged by independent researchers.
measurement_requirements: Independent evaluations and expert consensus. Formal verification such as the Microsoft-OpenAI expert panel would be strong evidence.
source_requirements: Primary lab announcements, independent verification panels, peer-reviewed or benchmark evaluations, and reputable news coverage of expert consensus.
metric_scope: null
original_horizon: in 2026 (or 7)
horizon_interval:
  start: 2025-12-20
  end: 2027-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Contradicted early if, before 2027-12-31, a system is broadly accepted as AGI (formal independent verification plus wide independent expert agreement). Self-declarations by executives alone do not meet the rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
