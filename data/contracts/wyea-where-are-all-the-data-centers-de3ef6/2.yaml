evaluator_interpretation:
  - This reports the result of Zitron's own search as of publication. It does not assert that no contrary public evidence exists or that Microsoft's actual additions were below a numerical ceiling.
  - The surrounding discussion challenges Microsoft's capacity disclosures, but that does not remove the qualification in this sentence.
support_condition: An independently verifiable record of the research he actually conducted would establish that he found evidence accounting for only a few hundred megawatts.
contradiction_condition: An independently verifiable record would establish that he found and recognized evidence accounting for materially more capacity before making this statement. The mere existence of other public evidence would not suffice.
measurement_requirements: Access to the scope, results and timing of his research; public capacity totals alone cannot test his reported search experience.
source_requirements: Independent records of the research or contemporaneous communications. His own article cannot independently establish the truth of his self-report.
