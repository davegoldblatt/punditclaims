explicit_source_elements:
  - I can find no evidence
  - anything more than a few hundred megawatts
  - Microsoft’s data center capacity
  - coming online
evaluator_interpretation:
  - I assess the substantive public-record assertion, not what the author personally found during his search.
  - In context, he is asking for evidence that capacity actually became operational beyond the aggregate company statements he expressly acknowledges.
  - The surrounding two-year comparison sets the target period to May 12, 2024 through May 12, 2026. The more recent quarterly claims are subsets of that period.
  - Owned facilities and leased capacity attributable to Microsoft count. A provider's entire capacity cannot be assigned to Microsoft from its revenue share.
  - A few hundred megawatts has no exact cutoff. Contradiction requires evidence comfortably above an ordinary reading of that phrase.
  - Evidence of public availability must itself predate or coincide with publication, because this claim concerns the evidence available then.
support_condition: A sufficiently complete review of contemporaneous public records establishes only a few hundred megawatts of identifiable Microsoft capacity newly commissioned during the stated period.
contradiction_condition: Public records available by May 12, 2026 establish materially more than a few hundred megawatts of newly operating Microsoft capacity on a consistent basis without double-counting.
measurement_requirements: Distinguish commissioned capacity from planned capacity, contracted capacity, existing stock, equipment efficiency gains and actual electricity consumption. Track ownership or tenant allocation and commissioning dates.
source_requirements: Prefer dated operator commissioning disclosures, utility records and regulatory documents. Aggregate management statements are material evidence, but their capacity definition must be reconciled with the operational-capacity question raised in context.
