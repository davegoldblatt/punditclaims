assessment_axis: historical_observation
explicit_source_elements:
  - Few people understand how they work
  - many people anthropomorphizing those chatbots
  - attributing to them real intelligence and emotion
evaluator_interpretation:
  - The plain reading concerns ordinary people and chatbot users, not only technical experts or selected enthusiasts.
  - Understanding means a basic functional understanding, not the ability to build a language model.
  - Anthropomorphism here includes literal attribution of intelligence and emotion; affection, politeness, or imaginative role play alone is insufficient.
  - Few and many express prevalence but supply no numerical cutoffs. No arbitrary percentage is imposed.
  - For this ongoing observation, use early 2023 through February 22 as the recent pre-publication period; no regular reporting interval is specified.
support_condition: Population evidence for the target period shows that basic understanding was uncommon and that literal attribution of intelligence and emotion to chatbots was widespread.
contradiction_condition: Comparable population evidence shows that basic understanding was common or that the specified literal attributions were rare.
measurement_requirements: Measure both components directly, report the population and sampling method, and distinguish knowledge from familiarity and emotional attachment from belief in real emotions.
source_requirements: Prefer representative surveys with fieldwork dates and question wording, supplemented by relevant observational studies. Selected user anecdotes cannot establish prevalence.
