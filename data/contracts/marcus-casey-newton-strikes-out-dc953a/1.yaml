explicit_source_elements:
  - driverless cars in 97% of the world
  - after a decade’s promises
  - hallucinations haven’t gone away
  - Home humanoid robots are nowhere in sight
evaluator_interpretation:
  - Assess the conjunction of three observations at publication, using December 1–11, 2024 as the current reporting window.
  - Driverless availability means ordinary public access to cars operating without an onboard driver.
  - Do not substitute population, land area, countries, or road mileage for the unspecified denominator of 97%.
  - Hallucinations persisting means nonzero factual fabrication in contemporary language models.
  - Read home humanoids as consumer-ready humanoid household assistants. Prototypes alone neither establish consumer readiness nor prove that readiness is imminent.
  - The decade of promises is background framing, not a separate dated forecast with identified promises.
support_condition: Evidence establishes the stated global absence rate under a defensible denominator, continuing hallucinations, and the absence of consumer-ready home humanoids in the target period.
contradiction_condition: Comparable evidence establishes a materially different global absence rate, elimination of hallucinations, or consumer-ready home humanoids in the target period. Identify any contradicted component separately.
measurement_requirements: Require a global service-coverage inventory and denominator for 97%, factuality evaluations separating errors from abstentions, and documented household product availability and autonomous capabilities.
source_requirements: Operator and regulator records, model evaluations, and manufacturer documentation or independent household trials. Announcements and demonstrations alone cannot establish general consumer readiness.
