assessment_axis: causal_assessment
explicit_source_elements:
  - Neither company can afford to exist without near-infinite resources
  - neither company can afford to slow down
  - due to their massive compute commitments
  - materially linked to the future growth trajectories of effectively every hyperscaler
  - as well as Broadcom
  - ruinous amounts of debt
  - at the worst time in history
evaluator_interpretation:
  - Read near-infinite resources as sustained dependence on very large additional financing, not a literal mathematical requirement.
  - Read cannot afford to slow down as a claim that existing compute obligations prevent a financially viable reduction in expansion.
  - The causal claim concerns circumstances at publication. Supplier forecasts are evidence of exposure, not evidence that forecast revenue will be realized.
  - Ruinous and worst time in history supply no objective financial threshold; those descriptions cannot independently receive a factual verdict.
  - No common accounting basis, financing horizon or quantified resource requirement is specified.
support_condition: Cash-flow and contractual evidence shows that both companies require continuing external financing and cannot materially reduce expansion while meeting binding payments, alongside substantial exposure in the growth expectations of the claimed supplier population.
contradiction_condition: Comparable evidence establishes a financially viable slowdown for either company, or shows that the asserted broad supplier dependence is absent. Large commitments alone establish neither necessity nor impossibility.
measurement_requirements: Company-specific liquidity, cash generation, payment schedules, cancellation rights, refinancing assumptions and supplier revenue sensitivities. Separate debt principal, guarantees and commitments.
source_requirements: Financial statements, actual contract terms and supplier disclosures. Risk warnings or management growth forecasts alone cannot establish the full causal assertion.
metric_scope:
  company: OpenAI and Anthropic; Broadcom for the debt clause
  metric: Financing requirements, outstanding compute obligations and debt; no single quantified measure supplied
