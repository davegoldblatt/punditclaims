  - Slow down does not identify which activities or what reduction.
  - Effectively every hyperscaler does not identify the supplier population.
  - Material dependence has no specified threshold.
  - Ruinous debt and worst historical timing are evaluative descriptions.
  - Several financial measures and companies are bundled without a common accounting basis.
