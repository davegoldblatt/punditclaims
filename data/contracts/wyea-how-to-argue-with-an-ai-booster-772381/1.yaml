evaluator_interpretation:
  - The surrounding explanation expressly uses funding plus attributed partner capital expenditure as its cost proxy.
  - Assess the numerical comparison under that disclosed model, accepting its stated dollar inputs solely to test the arithmetic.
  - The context supplies approximately $25 billion as the Uber comparator. More than four times therefore requires each stated estimate to exceed approximately $100 billion.
  - This narrow assessment does not establish actual cash burn or independently validate the funding and infrastructure estimates.
support_condition: Both ratios produced by the post's stated cost estimates and Uber comparator exceed four.
contradiction_condition: At least one ratio produced by those stated inputs is four or less.
measurement_requirements: Calculate each company separately. Do not add the two companies together or describe the funding-plus-capex proxy as independently measured cash burn.
source_requirements: The original text establishes the mathematical premises. Its figures may be used to test their internal comparison, but not as independent evidence that the underlying financial estimates are true.
