explicit_source_elements:
  - SPV-based deals
  - allow companies to
  - at least on a balance sheet basis
  - hide the scale of their debts
evaluator_interpretation:
  - Read 'hide' narrowly as excluding project-entity borrowing from the sponsor's consolidated balance-sheet liabilities, not concealing all disclosure or committing accounting fraud.
  - "'Allow' asserts that the mechanism exists; it does not assert that every SPV is unconsolidated."
  - Use Meta's Louisiana data-center venture as the concrete example supplied in the context.
  - Use the quarter ended March 31, 2026, the latest reported Meta quarter before the July 22 post.
  - Do not equate all venture borrowing, development costs, lease commitments, and maximum loss exposure with debt legally owed by Meta.
support_condition: Meta's latest pre-post financial statements show that the data-center venture is not consolidated, so its borrowing is not included as borrowing on Meta's consolidated balance sheet.
contradiction_condition: The relevant venture is consolidated and its borrowing is included in Meta's consolidated liabilities, or the asserted exclusion mechanism is unavailable.
measurement_requirements: Check the consolidation conclusion and balance-sheet treatment. Keep venture debt separate from Meta's equity investment, leases, guarantees, and maximum exposure.
source_requirements: Meta's financial statements and accompanying venture disclosures for the latest quarter reported before the post.
