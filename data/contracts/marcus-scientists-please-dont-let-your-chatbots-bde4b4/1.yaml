explicit_source_elements:
  - not contributing genuine ideas
  - nor coming up with carefully controlled experimental designs
  - nor summing up prior literature in thoughtful ways
  - ChatGPT
evaluator_interpretation:
  - Assess the early ChatGPT available during the six-week history described in the post, through January 14, 2023.
  - The ordinary reading concerns substantive intellectual assistance with scientific work, including work done under human guidance. It does not require autonomous discovery or eligibility for authorship.
  - Genuine ideas means scientifically meaningful research suggestions; thoughtful summaries require accurate synthesis; controlled designs require appropriate controls and treatment of confounding factors.
  - Later publications can establish earlier performance only when their relevant outputs can be dated to the target period.
support_condition: Dated outputs and substantive expert evaluations establish the claimed deficiencies across idea generation, controlled experimental design, and literature synthesis. Isolated failures alone do not establish categorical inability.
contradiction_condition: A documented contemporary example supplies a scientifically meaningful idea, a sound controlled experimental design, or an accurate substantive literature synthesis, with independent assessment establishing that contribution.
measurement_requirements: Inspect prompts, outputs, human contributions, comparison with existing literature, and relevant expert assessments. Fluency or authorship credit alone is insufficient.
source_requirements: Contemporary records or retrospective studies identifying outputs from the target period. Exclude later model capabilities.
