assessment_axis: historical_observation
explicit_source_elements:
  - likely millions of GPUs sitting in warehouses
  - no chance that 6 million Blackwell GPUs have actually been installed and turned on
  - Published November 24 2025
evaluator_interpretation:
  - Assess the situation as of November 24, 2025, the date explicitly attached to the original analysis.
  - Read GPUs as data-center accelerators in this context, excluding consumer graphics cards.
  - Read millions as at least two million. Preserve the uncertainty expressed by likely.
  - The six-million comparison must use a consistent counting convention for GPU dies and complete accelerator packages.
  - Fewer than six million operating Blackwell GPUs would not, by itself, establish that millions were in warehouses.
support_condition: Reliable deployment and inventory records establish fewer than six million installed and powered-on Blackwell GPUs, using consistent units, and substantiate the likelihood that at least two million GPUs were warehoused awaiting installation.
contradiction_condition: Reliable records establish at least six million Blackwell GPUs installed and powered on by the target date, or comprehensive inventory evidence rules out millions of warehoused GPUs. Evidence resolving only one component would leave the other component unsettled.
measurement_requirements: Worldwide deployment and inventory counts, with dates, coverage, definitions of powered-on status, and explicit treatment of dies versus packages.
source_requirements: NVIDIA or customer deployment records, infrastructure inventories, or independently documented measurements. Shipments, sales and utilization of the installed subset are insufficient alone.
