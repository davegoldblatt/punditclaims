explicit_source_elements:
  - these GPUs outside of AI
  - very few actual use cases
  - none of them are remotely hyperscale revenue drivers
  - nothing like fiber
evaluator_interpretation:
  - These GPUs means the accelerator hardware used in AI data centers, rather than every consumer graphics card.
  - The ordinary reading is that practical alternative workloads are limited and cannot provide commercial demand on the scale motivating hyperscale AI infrastructure.
  - Assess the current quarter through the day before publication, July 1 through September 28, 2025, as the latest reportable interval for the ongoing capability and market claim.
  - Treat the fiber comparison as the implication of the stated workload and commercial-scale claims, rather than a claim that the technologies have no similarities.
  - No particular company’s financial metric is asserted, so metric_scope is null. No arbitrary revenue threshold is added.
support_condition: Broad evidence shows a narrow set of practical non-AI workloads on the relevant GPUs and commercial demand too small to sustain comparable hyperscale deployment.
contradiction_condition: Evidence establishes a broad practical non-AI workload base, or a non-AI workload producing commercial demand at comparable hyperscale deployment levels on the relevant GPUs.
measurement_requirements: Separate demonstrated technical capability from deployed workloads and actual commercial demand. Revenue evidence must isolate non-AI workloads on the relevant accelerator hardware.
source_requirements: Hardware documentation, reproducible workload demonstrations and suitably separated operator or market revenue data. Aggregate HPC, cloud or graphics revenue alone is insufficient.
