assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft is apparently
  - at least for some Office subscribers, maybe most
  - scraping private documents
  - Turn on optional connected experiences
evaluator_interpretation:
  - The title and surrounding discussion make this an allegation of taking private Office document contents for generative AI training without users knowingly agreeing.
  - Ordinary cloud processing to provide document features does not, by itself, establish model training.
  - Apparently qualifies confidence; at least some supplies the minimum scope. Maybe most is not a firm majority claim.
  - This ongoing practice has no reporting cycle. I use the current month through the post date, November 1–26, 2024, as the observation period.
support_condition: Reliable evidence establishes that Microsoft was using some Office subscribers' private document contents for generative AI training without their knowing agreement during the target period.
contradiction_condition: Contemporaneous, product-specific evidence establishes that Office document contents were not used for the alleged training and that the named setting enabled document services rather than training.
measurement_requirements: Distinguish training from processing documents to deliver features. Distinguish Microsoft 365 applications from LinkedIn, Bing, and standalone consumer Copilot.
source_requirements: Dated Microsoft disclosures or documented investigations addressing the actual Office practice. A broad content license alone is insufficient.
