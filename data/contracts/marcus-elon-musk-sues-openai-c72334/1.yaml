explicit_source_elements:
  - By any reasonable metric
  - OpenAI as a whole
  - no longer works according to
  - the mission that was originally set out
evaluator_interpretation:
  - The ordinary reading is a substantial organizational departure from the founding mission, not merely a change in legal structure or the existence of a paid product.
  - "The founding commitments supply separate tests: public benefit, nonprofit oversight, freedom from shareholder-return obligations, and sharing research."
  - For the ongoing state, use the latest observable snapshot immediately before and at publication, February 29–March 1, 2024. Earlier founding and restructuring documents are comparison context.
  - Neither legal nonprofit status alone nor commercialization alone settles how the organization as a whole operates.
support_condition: Evidence about operations at publication establishes substantial abandonment across the material founding commitments.
contradiction_condition: Evidence about operations at publication establishes substantial continued adherence to the founding mission. Documented departures and meaningful continuity on distinct measures may warrant mixed.
measurement_requirements: Compare actual operations and governance with the original commitments. Distinguish legal control from practical control and research openness from access to a paid service.
source_requirements: Founding documents, governance records, model-release documentation, and evidence of actual operations at the post date.
