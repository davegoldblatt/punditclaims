evaluator_interpretation:
  - The plain reading concerns power sufficient to operate the cited cohort collectively, roughly 61 GW of IT load or 79.5 GW including facility overhead.
  - Power must be deliverable at the relevant sites. National nameplate generation alone is not a sufficient measure.
  - This is a present-state observation under a hypothetical construction assumption, not a conditional forecast requiring construction to occur first.
  - Use Q4 2025 as the latest completed reporting quarter before the post, consistent with the surrounding pipeline discussion. Do not reinterpret the claim as a forecast that power will never become available.
support_condition: Matched generation, transmission and service records show that the cited cohort could not collectively receive enough power to operate, including available on-site supply.
contradiction_condition: Matched records show sufficient deliverable grid and on-site power for the whole cited cohort at the reporting baseline.
measurement_requirements: Match project locations and load requirements to firm or explicitly interruptible service, deliverable generation, transmission constraints and operational on-site supply. Distinguish future commitments from available service.
source_requirements: Utility or grid-operator records, or a transparent independent assessment, covering the cited projects and their available power.
