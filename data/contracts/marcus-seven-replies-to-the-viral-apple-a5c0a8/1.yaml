assessment_axis: causal_assessment
explicit_source_elements:
  - downloading code
  - without conceptual understanding
  - is of less help
  - new problems
  - dynamically changing environments
evaluator_interpretation:
  - Less help means a smaller improvement from retrieving code on novel or changing tasks than on comparable familiar, stable tasks.
  - Conceptual understanding must be measured independently of the outcome; failure on a novel task cannot itself establish its absence.
  - The claim concerns the systems discussed at publication. Later systems provide context unless the study separately establishes the historical mechanism.
support_condition: Controlled comparisons show a smaller benefit from retrieved code under novelty and environmental change, with evidence connecting that difference to limited conceptual understanding rather than retrieval quality or other confounders.
contradiction_condition: Controlled comparisons show equally strong or greater retrieval benefits under novelty and change for systems independently established to lack the relevant conceptual understanding.
measurement_requirements: Matched retrieval and no-retrieval conditions; comparable task difficulty; checks on retrieved-code relevance and correctness; separate tests of novelty, environmental change, and conceptual understanding.
source_requirements: Public controlled evaluations with sufficiently described interventions and baselines.
