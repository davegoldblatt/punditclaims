evaluator_interpretation:
  - The antecedent of 'it' is a major breakthrough establishing broadly transformative practical usefulness.
  - The ordinary reading does not deny every useful application. It denies a transformative turning point.
  - No deadline is supplied. Task improvements and adoption are relevant, but do not automatically establish the predicted turning point.
support_condition: A finite period without a breakthrough cannot establish this unlimited negative forecast. Support would require decisive evidence foreclosing the described event.
contradiction_condition: A dated breakthrough, independently corroborated, establishes broadly transformative practical usefulness with demonstrated effects beyond isolated tasks or demonstrations.
measurement_requirements: Document both the breakthrough and its broad practical consequences; distinguish realized effects from adoption counts, projections and promotional claims.
source_requirements: Independent deployment evidence, measured outcomes and corroboration of any proposed decisive breakthrough.
