explicit_source_elements:
  - so many of the unfortunate consequences
  - a webscraping/big data approach to AI
  - disproportionately borne by women and minorities
evaluator_interpretation:
  - The plain reading is that multiple documented kinds of harm from this approach disproportionately affect women and minority groups. It does not require every harm to affect every such group.
  - Harm includes exclusion from training data, degrading representation, and discriminatory model outputs.
  - The observation concerns the research record and systems existing before the post. There is no standard reporting quarter for this subject; the target ends on the post date and has no stated beginning.
  - This assesses the distribution of documented harms, rather than whether web scraping alone caused them.
support_condition: Primary audits of existing datasets and models document multiple forms of disproportionate harm involving women and minority groups.
contradiction_condition: Broad, comparable audits show that the alleged disparities are absent or reversed across the relevant harms, undermining the claimed recurring pattern.
measurement_requirements: Group comparisons or clearly documented differential representation across several harms; isolated offensive examples without a group-related pattern are insufficient.
source_requirements: Original audits and research concerning datasets or models existing before 2022-06-11.
