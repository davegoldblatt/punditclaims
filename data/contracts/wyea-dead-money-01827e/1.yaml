assessment_axis: forecast_outcome
explicit_source_elements:
  - it’s going to be
  - difficult to impossible
  - raise AI data center debt
  - below 8%
evaluator_interpretation:
  - The plain reading predicts that new AI data center borrowing below 8% will generally become difficult to obtain.
  - Difficult to impossible allows some exceptions; it is not an unqualified claim that no sub-8% transaction can occur.
  - The nearby discussion of financing yields suggests effective annual borrowing cost, rather than coupon alone.
  - Building finance and GPU finance are relevant but must be distinguished. General-purpose corporate debt and convertible coupons are not automatically comparable.
  - No deadline is supplied. The evaluation date is an evidence cutoff, not an implied forecast deadline.
  - Estimate reflects the surrounding reliance on reported transaction pricing.
support_condition: Representative post-publication transactions and documented financing attempts show that sub-8% borrowing is generally difficult or unavailable. An indefinite forecast cannot receive conclusive support merely from a short period of expensive deals.
contradiction_condition: Representative post-publication financings establish that borrowers can routinely obtain comparable AI data center debt below 8% on ordinary commercial terms.
measurement_requirements: Record closing dates, purpose, borrower and tenant credit, maturity, coupon, benchmark rate, fees, discounts, security, draw conditions and evidence of financing demand or difficulty.
source_requirements: Closed financing announcements, executed agreements, filings or reliable transaction reports available by October 28, 2026.
