explicit_source_elements:
  - attempts to charge more
  - to make a premium product
  - appear to be dead on arrival
evaluator_interpretation:
  - Read as an empirical claim of weak commercial uptake for premium-priced AI models, rather than literally no customers.
  - The wording generalizes beyond the single Fable example to AI labs' premium products.
  - Use July 2026, the latest completed calendar month before the August 25 post, for the ongoing observation.
  - Assess paid adoption and model usage, not company-wide revenue or profitability. No numerical failure threshold is supplied.
support_condition: Representative July 2026 demand records show that premium-priced model launches broadly failed to attract meaningful paid uptake.
contradiction_condition: Comparable July 2026 records show substantial paid uptake across leading premium models, inconsistent with general commercial failure.
measurement_requirements: Model-level paid adoption and usage, with consistent denominators, launch dates, relative prices, and access restrictions. Separate token share from spending share.
source_requirements: Primary transaction or usage measurements are preferred. Company-wide revenue is insufficient to establish demand for particular premium models.
