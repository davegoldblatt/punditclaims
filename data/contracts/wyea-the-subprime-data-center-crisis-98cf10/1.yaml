assessment_axis: forecast_outcome
explicit_source_elements:
  - effectively every single financial institution in the world
  - write off or mark down
  - hundreds of millions or billions of dollars’ worth of loans
  - aging hopper and Blackwell GPUs
  - a market saturated with them
  - the salvage price
  - will be negligible
evaluator_interpretation:
  - The plain reading is near-universal institutional losses, with each affected institution losing hundreds of millions of dollars or more, rather than that amount across the industry collectively.
  - Dollars is read as US dollars in this financing context.
  - Negligible salvage means very little recovery relative to the collateral's preceding value and associated loan exposure; no percentage is supplied.
  - The overbuild is the asserted cause of the forecast, not an explicit 'if' antecedent. 'Assuming they get one at all' allows zero recovery and does not suspend scoring.
  - No deadline is supplied. The preceding sentence's 2030 cost comparison is not imported as a deadline for worldwide loan losses.
support_condition: Institution-level records establish near-universal losses at the stated scale attributable to AI data center overbuilding, together with liquidation records showing negligible recoveries on aging Hopper and Blackwell collateral in a saturated market.
contradiction_condition: A substantially completed unwind of the relevant lending cycle establishes that a material share of financial institutions avoided losses of the stated scale, or representative liquidation results show substantial rather than negligible GPU recoveries.
measurement_requirements: Institution-level loan write-offs and markdowns, exposure coverage across financial institutions worldwide, reasons for impairment, and completed GPU collateral sales with recovery denominators.
source_requirements: Filings, regulatory loss data, court records and completed auction or liquidation records. Credit spreads, warnings and quoted equipment prices cannot substitute for these outcomes.
metric_scope:
  company: Financial institutions worldwide; no individual company specified
  metric: AI data center loan write-offs or markdowns per institution
  currency: USD
  units: hundreds of millions or billions of dollars per institution
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only after documented losses and completed collateral liquidations establish the forecast's breadth and recovery outcome, or after a substantially completed unwind establishes its failure. Ordinary market repricing or the absence of losses so far is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Effectively every' has no numerical coverage threshold."
  - "'Negligible' has no specified recovery denominator or percentage."
  - No deadline or defined lending cohort is given.
  - Write-offs and markdowns are distinct measures, and no accounting basis is stated.
retrospective_or_prospective: retrospective
