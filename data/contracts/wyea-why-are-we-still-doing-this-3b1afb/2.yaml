assessment_axis: historical_observation
explicit_source_elements:
  - CFO Krishna Rao stated on March 9, 2026 in a legal filing
  - made "exceeding" $5 billion in revenue
  - None of these numbers line up with previous statements about annualized revenue
  - adding up all the annualized revenues is over $6 billion
  - which I believe means that Anthropic defines "annualized" in a new and innovative way
evaluator_interpretation:
  - "Plain reading: Zitron says Anthropic's public annualized (run-rate) revenue figures from 2025 to early March 2026 do not fit the 'exceeding $5 billion' lifetime revenue in the March 9 declaration. Summing them gives over $6 billion, so he infers Anthropic's 'annualized' figures run ahead of real revenue under some unusual definition."
  - Following the reviewers, the test is not the word 'exceeding' alone. It is actual cumulative revenue, which the later S-1 reports. If actual recognized revenue through the period was well above $6 billion, the annualized statements did not run ahead of real revenue. Then the 'don't line up' claim and its 'new definition' inference fail.
  - The 'which I believe' clause is a hedged inference, but it rests on the factual claim of a mismatch. It is graded only through that claim.
support_condition: Anthropic's audited or reported revenue shows lifetime revenue through early March 2026 at or near $5 billion, well below what its run-rate statements implied. Or its disclosed run-rate method is unusual and inflates figures beyond recognized revenue.
contradiction_condition: Anthropic's reported revenue shows the 'exceeding $5 billion' figure matches recognized revenue through an earlier cut-off, and actual revenue by early 2026 was at or above what the run-rate statements implied, under a conventional run-rate definition.
measurement_requirements: Cumulative recognized revenue from the start of commercial sales through the filing, from company financial statements. Compare it with the run-rate figures and the company's own run-rate definition.
source_requirements: "Primary: the March 9, 2026 Rao declaration and Anthropic's S-1 financial statements."
