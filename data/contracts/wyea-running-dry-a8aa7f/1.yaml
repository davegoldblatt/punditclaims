  - No threshold for louder, more deranged or desperate.
  - No rule for combining the listed indicators.
  - The duration required to establish a continuing trend is unspecified.
  - Anthropic's lower valuation lacks a specified valuation basis or comparator.
  - Increasing scrutiny does not identify who scrutinizes what.
  - The financial indicators have no common accounting basis.
