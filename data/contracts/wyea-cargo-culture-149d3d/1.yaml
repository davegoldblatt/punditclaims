assessment_axis: historical_observation
explicit_source_elements:
  - training and selling access to large language models at a massive loss
  - does not own its infrastructure
  - absolutely no path to profitability
  - outside of “we keep spending other people’s money.”
evaluator_interpretation:
  - The surrounding reference to a $21 billion annual loss makes calendar 2025 the financial comparison period. This is a reading of company-wide operating losses, not a claim that every paid inference request loses money.
  - Infrastructure ownership and the existence of a credible business plan describe the situation at publication, June 23, 2026. The target interval encompasses these different components; the financial metric remains restricted to 2025.
  - The ordinary reading of massive is a substantial operating loss relative to revenue, without an invented numerical cutoff.
  - Infrastructure means the physical computing infrastructure used to train and serve models. Announced joint-venture investments do not by themselves establish ownership of operational assets.
  - No path to profitability means no credible route through operating revenue, costs and margins. Continued fundraising is financing, not profit. A management forecast alone does not establish viability.
support_condition: Comparable financial records show substantial operating losses; ownership records show reliance on infrastructure owned by others; and sufficiently complete operating economics substantiate the absence of a credible route to profit.
contradiction_condition: Comparable records establish profitable operations, material ownership of the relevant operating infrastructure, or a credible and adequately evidenced route to operating profitability. Identify which component is contradicted.
measurement_requirements: Separate operating loss from net loss and cash burn. Distinguish infrastructure ownership from leases, capacity reservations and announced investments. Assess profitability plans against revenue, operating costs and financing needs.
source_requirements: Prefer financial statements, ownership records and company disclosures. Independently checked reporting may substitute where private-company records are unavailable.
