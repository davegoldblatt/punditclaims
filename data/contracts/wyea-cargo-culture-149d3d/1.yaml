  - The compound statement combines annual financial results with current ownership and business prospects.
  - The financial period is inferred from the surrounding annual-loss discussion.
  - Infrastructure could mean directly owned assets or interests held through joint ventures.
  - No path distinguishes an economically credible plan from a merely announced forecast.
