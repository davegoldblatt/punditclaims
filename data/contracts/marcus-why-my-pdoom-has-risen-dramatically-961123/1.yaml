explicit_source_elements:
  - My p(doom)
  - still lower than most industry people’s
  - I am at maybe 3% now
evaluator_interpretation:
  - Treat approximately 3% as Marcus's stated comparison value, rather than independently assessing his private belief.
  - Read 'most' as more than half of people working in the AI industry, rather than a selection of prominent executives or safety researchers.
  - Compare estimates of substantially equivalent catastrophic outcomes under comparable time horizons.
  - Read the ongoing comparison as an early-July 2025 snapshot before publication. Older expert surveys are context unless evidence establishes that they represent this population and period.
support_condition: A suitably representative contemporaneous survey establishes that more than half of AI industry people assigned a probability above approximately 3% to a comparable doom outcome.
contradiction_condition: A suitably representative contemporaneous survey establishes that no more than half assigned a probability above approximately 3%, with uncertainty small enough to distinguish the majority threshold.
measurement_requirements: The distribution of individual estimates, sampling population, field dates, uncertainty, question wording, outcome definition, and time horizon. An average alone is insufficient.
source_requirements: Primary survey data or a documented representative survey of AI industry workers. Selected public statements and surveys of different populations cannot settle the claim.
