evaluator_interpretation:
  - This combines a conditional bankruptcy forecast with a present assessment of future revenue exposure. The conditional forecast governs the overall outcome; customer relationships alone cannot settle it.
  - Bankruptcy means a formal bankruptcy proceeding involving Broadcom or NVIDIA, with evidence that an AI investment bust materially caused it.
  - An AI bubble bursting means a substantial, sustained reversal in AI investment and financing, accompanied by widespread financial distress. An isolated share-price decline does not establish that condition.
  - FY2028 dates the revenue estimate. It does not clearly impose a deadline on the bankruptcy prediction, so the bankruptcy forecast has an open horizon.
  - The ordinary reading of greater exposure is increased vulnerability to the same AI labs through both direct business and hyperscaler customers. The speaker supplies no numerical exposure measure or comparison baseline.
  - The money scope preserves the stated Broadcom revenue estimate. The surrounding reference to its earnings indicates a company-reported outlook, but the words do not distinguish total revenue from AI semiconductor revenue.
  - The FY2028 amount is an estimate cited to describe exposure, not an explicit promise that Broadcom will realize exactly that revenue.
support_condition: After a documented AI investment bust and its financial aftermath, both companies avoid bankruptcy attributable to that bust. Separately, contemporaneous disclosures must establish material direct and indirect dependence on the named labs and increased exposure relative to an identified baseline.
contradiction_condition: Either company enters bankruptcy materially caused by a documented AI investment bust. The exposure component would be contradicted by comparable disclosures showing that the alleged material dependence or increase did not exist.
measurement_requirements: Identify the bust and its aftermath, distinguish bankruptcy from share-price losses, and establish causation. For exposure, distinguish direct customers from ultimate demand sources and compare customer shares, contractual obligations, and guarantees on a consistent basis. Distinguish total revenue from AI semiconductor revenue and forecasts from realized sales.
source_requirements: Court records and company filings for bankruptcy and causation; company disclosures and contracts for customer exposure. A market decline or management forecast alone cannot settle the conditional forecast.
