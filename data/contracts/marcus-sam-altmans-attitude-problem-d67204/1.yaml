evaluator_interpretation:
  - The Senate quotation is a separately verifiable factual premise.
  - Very far cry expresses a judgment about the distance between an earlier principle and a later response. It does not specify a factual reversal or a threshold for inconsistency.
  - The normalized proposition is stronger than the exact wording if inconsistent is treated as a logical contradiction.
  - The comparison concerns the May 16, 2023 testimony and April 11, 2025 exchange; the interval below contains those two events, not continuous conduct.
support_condition: The factual premise is supported if the Senate record contains the stated principle. No stable factual criterion determines whether the later response is a very far cry from it.
contradiction_condition: The factual premise would be contradicted if the Senate attribution were materially false. Agreement or disagreement about the magnitude of the rhetorical contrast cannot settle the evaluative comparison.
measurement_requirements: Compare the actual statements without converting a tonal or moral judgment into an asserted policy reversal.
source_requirements: The Senate hearing record and the full TED copyright exchange.
