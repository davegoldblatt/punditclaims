early_resolution_rule: A company-confirmed reduction in overall AI infrastructure capital spending or its announced spending plan could settle the pullback component at the announcement date. Project reallocations and slower spending growth alone do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No spending baseline, amount, period, or accounting basis.
  - AI-specific scope comes from context rather than the quoted expenditure phrase.
  - Pullback could mean individual project cancellations or an aggregate investment retreat.
  - Going nowhere has no independently measurable threshold.
retrospective_or_prospective: retrospective
