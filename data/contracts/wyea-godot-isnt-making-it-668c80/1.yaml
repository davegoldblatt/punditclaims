assessment_axis: forecast_outcome
explicit_source_elements:
  - all of this is going nowhere
  - at some point
  - Google, Microsoft, or Meta
  - blink and pull back on their capital expenditures
evaluator_interpretation:
  - The testable commitment is an eventual investment pullback by at least one of the three named companies.
  - In context, capital expenditures refers to AI infrastructure investment. The ordinary reading of 'blink' is a deliberate retreat in spending or spending plans, rather than a quarterly fluctuation caused by delivery timing.
  - I require a reduction in the company's overall AI infrastructure spending or spending plan. Canceling an individual project does not establish this if the investment is replaced elsewhere.
  - The source specifies no amount, comparison period, currency, or accounting basis. I do not assign one.
  - "'Going nowhere' supplies no separate measurable threshold. A spending reduction would not by itself establish that broader judgment."
support_condition: A dated disclosure establishes that, after the post, Google, Microsoft, or Meta deliberately reduced its overall AI infrastructure capital spending or its previously announced spending plan on a comparable basis.
contradiction_condition: Continued investment cannot contradict this indefinite forecast. Contradiction would require a decisive event making the predicted pullback impossible; no ordinary reporting period can establish that.
measurement_requirements: Distinguish AI infrastructure investment from total company capital expenditure, project cancellations from aggregate reductions, and planned spending from realized spending. Compare like accounting treatments, including leases.
source_requirements: Prefer company disclosures or filings. Reporting about undisclosed cancellations must identify its evidentiary basis and be checked against company statements.
metric_scope:
  company: Google (Alphabet), Microsoft, or Meta
  metric: AI infrastructure capital expenditures
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
