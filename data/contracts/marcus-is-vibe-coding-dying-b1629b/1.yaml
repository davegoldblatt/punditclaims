  - vibe coding
  - amateurs using large language models to write code
  - build products that would have previously required teams of engineers
  - would never be remotely reliable
evaluator_interpretation:
  - "Read as a forecast with no deadline: amateurs relying on LLMs will not reach even rough reliability when building and running products that once needed engineering teams."
  - "'Never' cannot be confirmed at any date. It can only be refuted, by clear evidence that amateurs reliably build and run team-scale products this way."
  - Professional developers using AI assistants fall outside the claim.
support_condition: Cannot be fully confirmed because there is no deadline. Continued reports of failure, and the absence of reliable amateur-built team-scale products, are consistent with it but not decisive.
contradiction_condition: Credible documented evidence, such as independent reliability studies or several well-documented products, shows that amateurs without engineering teams routinely build, run and maintain team-scale production products reliably with LLM tools.
measurement_requirements: Independent reliability studies or documented production histories of products built mainly by non-programmers, at a scale that previously needed an engineering team.
source_requirements: Independent studies, incident records, or reputable reporting. Vendor marketing claims alone are not enough.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Contradicted early if an independent study or several well-documented cases show that amateurs using LLM tools reliably build and run team-scale production products. 'Never' cannot be supported early.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'remotely reliable' has no threshold"
  - "'amateurs' vs. semi-technical users is unclear"
  - "'products that would have previously required teams of engineers' is not quantified"
  - no deadline ('never')
