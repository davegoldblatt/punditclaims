explicit_source_elements:
  - AGI
  - that still hasn't happened
  - as of the post date, 2026-03-07
evaluator_interpretation:
  - "Marcus gives no definition of AGI. Plain reading: no AI system had been widely and credibly recognised as artificial general intelligence (broad human-level ability across tasks, including learning new tasks) as of early March 2026."
  - A single executive saying AGI is here does not count as achievement. Independent tests of general ability that compare frontier systems with ordinary humans are the main measure.
  - "Target period: March 2026. That is the month of the post and the month the normalized proposition names. Frontier models tested later in that month count as evidence of the state of the art then."
support_condition: Independent evaluations around March 2026 show frontier AI systems falling far short of ordinary humans on tests of general, novel-task ability, and no broadly accepted declaration of AGI exists.
contradiction_condition: A broadly accepted declaration or independent evaluation by March 2026 showing an AI system matching humans across general tasks, for example a recognised expert verification that AGI had been reached.
measurement_requirements: Independent benchmark results comparing frontier AI with humans on general novel-task ability, or a credible formal AGI declaration.
source_requirements: Benchmark operators or reputable news reports. Executive opinions are context only.
