condition_status: met
early_resolution_rule: Support can be established by documented broad bond-market exclusion following continued deterioration, together with evidence that equity is the only viable external funding source. A spread increase or isolated failed offering is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline for eventually.
  - No threshold or duration for continued souring.
  - Difficult to impossible spans materially different degrees of financing constraint.
  - It is unclear whether only equity excludes internal cash generation or refers only to external funding.
  - The hyperscaler population is not expressly bounded.
retrospective_or_prospective: retrospective
