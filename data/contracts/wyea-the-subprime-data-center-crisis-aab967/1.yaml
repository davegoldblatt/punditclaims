assessment_axis: forecast_outcome
explicit_source_elements:
  - If the market continues to sour on AI data center debt
  - eventually
  - difficult to impossible for hyperscalers to keep issuing bonds
  - leaving them with only equity sales
evaluator_interpretation:
  - Hyperscalers principally means Microsoft, Alphabet, Meta and Amazon, which the surrounding passage names.
  - Continued souring means persistent weakening of investor demand or widening credit spreads after publication.
  - The ordinary reading requires serious constraints on bond access and equity becoming the only viable external financing source. Higher borrowing costs alone do not establish the entire prediction.
  - No deadline or accounting measure is supplied. The surrounding borrowing-market discussion relies on press and analyst estimates.
support_condition: Following continued deterioration in AI debt markets, representative records show the named hyperscalers unable to raise needed bond financing on workable terms, with equity their only viable external financing source.
contradiction_condition: Decisive evidence rules out the asserted financing constraint for the affected cohort. Continued issuance over a finite period is counterevidence but cannot alone disprove an unrestricted prediction about what happens eventually.
measurement_requirements: Track credit spreads, order books, failed or withdrawn offerings, issuance terms and alternative financing separately for the named hyperscalers. Distinguish corporate bonds from project debt and neocloud borrowing.
source_requirements: Issuer filings and offering records, supplemented by dated market measurements. News reports may establish market conditions when underlying commercial datasets are unavailable.
metric_scope:
  company: Microsoft, Alphabet, Meta and Amazon
  metric: Corporate bond access and availability of non-equity external financing
  currency: null
  units: null
