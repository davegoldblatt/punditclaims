explicit_source_elements:
  - Current models
  - already causing serious problems
  - education
  - politics (via deepfakes and wholesale disinformation)
  - banking
evaluator_interpretation:
  - The ordinary reading is that existing generative AI materially contributes to substantial problems in each named domain; it need not be the sole cause.
  - Serious problems includes measurable learning impairment, deceptive political communications, and financial fraud or failures of banking identity controls.
  - Already permits documented harms before the post. Current models refers to existing generative AI technology, rather than only the newest model releases.
  - Across society requires evidence in the three named domains, not proof that every institution is harmed or that aggregate harms exceed benefits.
support_condition: Research and incident records establish meaningful adverse consequences to which existing AI contributed in education, political deception, and banking.
contradiction_condition: Strong evidence refutes a material AI contribution or the existence of substantial problems in a named domain. Beneficial applications alone do not contradict this existence claim.
measurement_requirements: Distinguish causal experiments from correlations, attempted deception from proven changes in election results, and financial-sector fraud from losses at unrelated companies.
source_requirements: Prefer causal research, official investigations, and documented financial-sector incidents.
