explicit_source_elements:
  - GPT-5's router mode
  - costs OpenAI more money to run
  - reported using internal documents from an infrastructure provider
evaluator_interpretation:
  - Read this as a claim about OpenAI's internal serving expense, rather than the prices charged to API customers.
  - The ordinary comparison is comparable requests served with routing versus direct model serving, including any savings from selecting cheaper models.
  - The linked analysis concerns GPT-5's initial August 2025 implementation. Use August 2025 as the target month rather than applying later implementations retroactively.
  - Treat the financial basis as an estimate reported from infrastructure documents, not a disclosed GAAP expense.
  - The comparison baseline is not specified sufficiently to assume a particular direct model or workload mix.
support_condition: Comparable production measurements or authenticated internal cost records show that routing raised OpenAI's total inference expense for matched workloads after accounting for model selection, caching and routing overhead.
contradiction_condition: Comparable records show equal or lower total inference expense with routing for the relevant workload and implementation.
measurement_requirements: Matched requests, response-quality requirements, model versions, traffic mix, caching, hardware utilization and full serving costs. Token counts or customer prices alone are insufficient.
source_requirements: OpenAI cost records, authenticated infrastructure billing and architecture records, or measurements reproducing the relevant production configuration.
