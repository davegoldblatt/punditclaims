explicit_source_elements:
  - Took almost 3 years
  - many billions of dollars
  - over a half-trillion fieldwide
evaluator_interpretation:
  - Read as an approximate elapsed-time claim ending at GPT-5's launch, accompanied by claims about spending incurred by then.
  - Marcus did not identify the starting milestone. Consider both ChatGPT's initial release and GPT-4's release without requiring a documented development start.
  - Do not impose an exact numerical tolerance on 'almost 3 years'.
  - Read 'many billions' as multiple billions spent on the effort leading to GPT-5, without limiting that effort to its final training run or assuming all OpenAI expenditure belongs to it.
  - Read 'over a half-trillion fieldwide' as more than US$500 billion of actual cumulative AI spending. The field's boundaries and accumulation start are unspecified.
  - Leave the target-period start unspecified because the post supplies no starting milestone or spending baseline.
  - No accounting basis or financial source is identified. Record the basis as unknown.
support_condition: A defensible elapsed-time baseline consistent with the context, together with comparable spending records, establishes approximately three years, multiple billions attributable to the effort leading to GPT-5, and more than US$500 billion actually spent across the stated field by launch. Financial support requires resolving the unspecified accounting basis and scope.
contradiction_condition: Comparable records establish that a stated component is false under its intended baseline and scope. A narrower spending subtotal, a different release baseline, or missing disclosures alone cannot contradict the claim.
measurement_requirements: Separate elapsed time from development duration. Separate actual spending from funding, valuations, budgets and future commitments. Define the industry coverage and accumulation period, reconcile accounting periods, and avoid double counting payments within the industry.
source_requirements: Use dated release announcements and financial disclosures where available. Estimates must identify their scope and method. Company-wide spending cannot establish GPT-5-specific costs without an allocation.
