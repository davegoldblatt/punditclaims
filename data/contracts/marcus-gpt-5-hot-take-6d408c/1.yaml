evaluator_interpretation:
  - Read the spending figures as expenditures incurred by GPT-5's launch, not financing raised or future commitments.
  - The sentence combines GPT-5 development spending with a separate industry-wide total; neither can substitute for the other.
  - The starting milestone is unspecified. GPT-4's release is a plausible reference point, but elapsed time between releases does not establish development duration.
  - No accounting basis or underlying financial source is identified, so accounting_basis remains unknown.
  - The observation ends on the post date. Its starting date remains unspecified rather than being selected to fit spending data.
support_condition: Records establish an approximately three-year development interval, multiple billions of dollars attributable to GPT-5 development, and more than USD 500 billion of actual industry spending over a consistently defined period and scope.
contradiction_condition: Comparable records establish that an asserted duration or spending threshold was not met. A lower bound, incomplete spending series, or different accounting measure is insufficient.
measurement_requirements: Identify development start, cost attribution, industry membership, accounting treatment, and cumulative period. Exclude double counting and distinguish spending from investment funding and commitments.
source_requirements: Development records, company disclosures, or clearly sourced estimates using compatible definitions. Company-wide costs cannot establish GPT-5-specific costs.
