explicit_source_elements:
  - selling a deeply speculative IPO
  - in the midst of what looks like a crash of AI stocks
  - won’t be easy
  - Thursday’s planned IPO for Anthropic
evaluator_interpretation:
  - Assess selling difficulty, as specified by the normalized claim, rather than the separate judgment about fair valuation.
  - Thursday means November 19, 2026.
  - Material difficulty means weak subscriptions, meaningful pricing concessions from the marketed range, or postponement or withdrawal attributable to insufficient demand.
  - The condition requires an observable substantial AI-stock selloff during the offering process; it does not require a particular technical definition of crash.
  - Strong preliminary orders are relevant counterevidence but do not establish final pricing or completed allocation.
support_condition: During the AI-stock selloff, the offering encounters documented weak demand, material pricing concessions, or demand-related postponement or withdrawal by November 19.
contradiction_condition: The offering completes on schedule at or above its marketed range, with strong allocations and no documented material selling difficulty.
measurement_requirements: Marketed and final terms, dated subscription and allocation evidence, timetable, and reasons for any changes.
source_requirements: Company or exchange notices and final offering documents; reputable reporting may establish investor demand and market conditions when primary records are unavailable.
metric_scope: null
original_horizon: Thursday
horizon_interval:
  start: 2026-11-16
  end: 2026-11-19
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A confirmed withdrawal or postponement beyond November 19 because of inadequate demand, or a completed priced and allocated offering with documented strong demand and no material selling difficulty, can settle the claim early if the selloff condition is established. Preliminary orders alone cannot.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
