evaluator_interpretation:
  - The ordinary reading is that existing approaches do not yet provide dependable, broadly useful causal reasoning. This does not mean they cannot solve any causal problem.
  - I assess reasoning about causal relationships, interventions, and counterfactuals, including specialized causal methods as well as language models.
  - The ongoing state described is December 2022, the month of the debate and post. Earlier experiments provide context unless their findings establish performance during that month.
  - Marcus supplies neither an adequacy threshold nor a specified application. Broad reliability is my interpretation, not an explicit benchmark requirement.
support_condition: Evaluations applicable to December 2022 establish substantial reliability or generalization failures across the relevant approaches, sufficient to support the broad claim of inadequacy.
contradiction_condition: An approach available in December 2022 demonstrably provides dependable causal reasoning across varied relevant problems, including interventions and counterfactuals, under clearly stated assumptions.
measurement_requirements: Identify the tested systems, causal tasks, assumptions, evaluation dates, accuracy and generalization limits. Distinguish causal inference from recalling familiar causal statements. Neither isolated failures nor narrow successes settle the whole claim.
source_requirements: Primary research and reproducible evaluations of approaches available by December 2022. Later publications are usable only if they establish the historical state.
