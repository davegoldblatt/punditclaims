condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Expansion could refer to Microsoft's capacity specifically or industry-wide capacity; the normalized industry-wide reading is used.
  - Evolving and expanding supplies no scale, duration or measurement.
  - Physical power capacity, useful computing capacity and electricity consumption are distinct.
  - An isolated improvement and sustained industry-wide growth would test different readings.
