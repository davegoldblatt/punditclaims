assessment_axis: causal_assessment
explicit_source_elements:
  - Expansion
  - absolutely necessary
  - generative AI to continue evolving and expanding
evaluator_interpretation:
  - The ordinary reading is that continued industry-level capability improvement and deployment growth require additional physical data center capacity.
  - The surrounding discussion concerns power capacity. More useful computation obtained from existing capacity is not automatically physical expansion.
  - The claim states necessity, not merely that expansion helps or accompanies growth.
  - No fixed historical period or future deadline is supplied.
support_condition: Evidence establishes that sustained generative-AI capability and deployment growth cannot occur within existing physical data center capacity, accounting for efficiency, utilization and workload reallocation.
contradiction_condition: Documented sustained capability and deployment growth occurs with a verified unchanged or declining relevant physical capacity footprint, or a validated causal analysis demonstrates that such growth does not require additional capacity.
measurement_requirements: Measure capability, deployment and the relevant physical capacity together. Distinguish power consumption from installed capacity, and per-task efficiency from aggregate demand.
source_requirements: Prefer controlled research and independently measured capacity and deployment records. Forecasts of rising electricity use and isolated benchmark gains provide context but do not alone establish or refute necessity.
