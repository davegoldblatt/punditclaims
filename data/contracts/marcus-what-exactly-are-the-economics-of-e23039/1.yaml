evaluator_interpretation:
  - I read this as a cumulative industry comparison through August 14, 2023, with no stated starting date.
  - The revenue side includes the driver-assistance products expressly named in the surrounding sentence, not only fully driverless taxi fares.
  - "'On order of $100 billion' is an approximate magnitude, not an exact amount."
  - "'Vastly exceeds' ordinarily means a large multiple. I do not impose an arbitrary numerical ratio."
  - Money invested, development expenditure, and acquisition payments are different measures. The claim does not specify which are included or name a source for its aggregate, so accounting_basis remains unknown.
support_condition: A consistently scoped cumulative comparison establishes investment or expenditure around the hundred-billion-dollar scale and realized revenue much smaller, including the driver-assistance businesses named in context.
contradiction_condition: Comparable cumulative evidence places investment far from the stated scale, or shows that realized revenue from the included businesses approaches or exceeds investment rather than being much smaller.
measurement_requirements: Matched industry coverage and cumulative periods for investment and realized revenue. Identify financing, acquisitions, operating expenditure, driver-assistance sales, and driverless-service revenue separately and avoid double counting.
source_requirements: Transparent investment estimates and company disclosures or an industry revenue reconstruction that includes driver assistance as well as driverless operations.
