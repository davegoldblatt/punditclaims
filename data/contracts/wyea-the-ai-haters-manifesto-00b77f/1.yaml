assessment_axis: forecast_outcome
explicit_source_elements:
  - there’s no bailout coming
  - Even if OpenAI and Anthropic were to collapse and receive some injection of government funding
  - continued ability (and requisite customer demand) to spend more money every single quarter
evaluator_interpretation:
  - "Read the statement with its immediate qualification: no government rescue will solve the industry's continuing spending and demand problem."
  - An ordinary government purchase, subsidy or temporary funding injection does not by itself contradict this contextual claim.
  - “Even if” is a concession explaining the claim, not an antecedent that must occur before the unconditional no-rescue forecast can be monitored.
  - No deadline is supplied. Do not borrow the neighboring four-year horizon.
  - The claim concerns the occurrence and effectiveness of a rescue, not a specified corporate monetary figure; metric_scope is null.
support_condition: A finite period without a bailout cannot establish this open-ended negative. A definitive end to the relevant industry episode without an effective rescue could support it if the episode's boundaries were independently clear.
contradiction_condition: An implemented government rescue demonstrably sustains the labs' continuing compute purchases and the associated demand trajectory, resolving the problem described rather than merely keeping the companies alive.
measurement_requirements: Rescue legislation or agreements, disbursements or enforceable guarantees, and evidence connecting the intervention to sustained compute purchases and customer demand.
source_requirements: Government records and recipient disclosures, supplemented by independently verified spending and demand evidence.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve contradicted only upon an implemented rescue and evidence that it sustains the continuing spending and demand described. A promise, ordinary procurement arrangement or temporary injection is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The isolated sentence denies any bailout, while its immediate qualification allows government funding.
  - No deadline or required duration of successful rescue is stated.
  - The scale of spending and customer demand needed for an effective rescue is not operationally specified.
