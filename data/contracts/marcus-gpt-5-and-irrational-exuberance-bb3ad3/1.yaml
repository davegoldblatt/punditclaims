assessment_axis: historical_observation
explicit_source_elements:
  - GPT’s regurgitate ideas
  - they don’t invent them
evaluator_interpretation:
  - This is a present-tense observation about contemporary GPT models, not a forecast about later systems.
  - Use January–March 2023, the latest completed calendar quarter before publication, as the reporting window. There is no standard quarterly capability reporting period.
  - The ordinary reading denies substantive original ideas, rather than merely asserting that models learn from existing material.
  - A novel combination can count as an invention; dependence on learned concepts does not by itself establish regurgitation.
  - A counterexample needs a documented GPT-originated idea with a credible independent novelty assessment. Novel wording alone is insufficient, and patentability is not required.
support_condition: Contemporary evaluations establish that apparent inventions reproduce existing ideas rather than making substantive original contributions across the scope claimed.
contradiction_condition: A contemporary GPT output contains a substantive idea independently established as original rather than a reproduction of an existing idea.
measurement_requirements: Provide the model, prompts and outputs, the human contribution, and a reasoned novelty assessment against relevant prior work.
source_requirements: Primary output records and credible independent assessment. A model's own claim of originality is insufficient.
