explicit_source_elements:
  - 8 of the 10 tasks
  - by the end of 2027
  - as determined by our panel of judges
  - technically feasible
  - 1 million dollars of compute + 10 person-weeks of effort
  - not be performed by 10 completely separate systems
  - excluded those involving physical action in the world
  - readers are advised not to infer Gary’s beliefs from the odds
evaluator_interpretation:
  - "Assess Marcus’s side of the wager: fewer than eight qualifying tasks by the deadline. Do not infer a numerical confidence from the stakes."
  - The conditional donation wording defines the wager’s outcomes, rather than a separate antecedent that must occur before assessing the capability forecast.
  - The agreed panel determines task success, acceptable tailoring and reasonable costs. The stated cost figures are illustrative, not strict caps imposed by this assessment.
  - Technical feasibility by the deadline counts even without an actual attempt. The panel may publish its decision after the deadline.
  - Donation amounts are stakes, not company financial metrics.
support_condition: The mutually agreed panel determines that fewer than eight of the ten specified tasks were technically feasible by December 31, 2027, under the bet’s cost, tailoring and system constraints.
contradiction_condition: The mutually agreed panel determines that at least eight of the ten specified tasks were technically feasible by December 31, 2027, under those constraints.
measurement_requirements: A task-by-task panel ruling covering movie comprehension, novel comprehension, reliable biographies and obituaries, learning new video games, legal briefs, original bug-free code exceeding 10,000 lines, Pulitzer-caliber books, Oscar-caliber screenplays, paradigm-shifting Nobel-caliber discoveries, and formalization of mathematical proofs. Apply the original task qualifications and any mutually agreed clarifications; do not substitute benchmark scores or market probabilities.
source_requirements: A dated public decision from the mutually agreed panel, with enough detail to establish the qualifying task count and compliance with the wager. For early resolution, it must conclusively certify at least eight qualifying tasks. The original post establishes terms only.
metric_scope: null
original_horizon: by the end of 2027
horizon_interval:
  start: 2024-12-30
  end: 2027-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An authoritative, final panel ruling before the deadline certifying at least eight qualifying tasks would contradict Marcus’s side early. An interim count below eight cannot support his side before the deadline. Donations alone do not establish the winner because both parties pledged donations regardless of the outcome.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The quoted sentence specifies wager terms rather than a standalone assertion of certainty.
  - The panel has broad discretion over task quality, reliability, generality and acceptable tailoring.
  - The cost allowance is illustrative.
  - Prize-caliber work does not explicitly require winning an actual prize.
  - The mathematical task’s clarification leaves an additional-reading parameter unspecified.
  - The date of adjudication may follow the capability deadline.
