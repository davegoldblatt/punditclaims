assessment_axis: historical_observation
explicit_source_elements:
  - recent AAAI survey
  - the vast majority of academic AI researchers
  - doubted that scaling would get us all the way to AGI
  - They were right.
evaluator_interpretation:
  - The claim combines a report of researchers' opinions with an assertion that those opinions were correct. Both parts must be assessed.
  - The ordinary reading of 'vast majority' is a clear supermajority. Responses of unlikely or very unlikely count as doubt; no numerical cutoff is imposed.
  - Scaling means scaling the AI approaches discussed in the survey. The survey's scope must not be silently narrowed to LLM pretraining alone.
  - The historical target is the recent survey and the claimed vindication by the August 14, 2025 post. The start is unspecified because 'recent' supplies no definite lower boundary.
  - The plain reading of 'They were right' endorses the doubts about scaling's sufficiency for AGI. It is stronger than saying that one released model was not AGI.
  - Survey agreement and the absence of AGI at a particular date cannot by themselves establish that scaling is insufficient.
support_condition: The survey must report a clear supermajority doubting that scaling current approaches would achieve AGI, with evidence supporting the characterization of academic researchers. The additional endorsement requires evidence establishing the substantive limitation of scaling, beyond respondents' opinions or one model's shortcomings.
contradiction_condition: The survey must materially disagree with the reported finding or show that the claimed academic majority did not hold. Alternatively, a substantiated demonstration of AGI achieved through scaling the relevant approaches would refute the substantive endorsement. Missing subgroup data alone is not a contradiction.
measurement_requirements: Check the reported question, response categories, percentage, respondent affiliations, and any academic-only breakdown. To assess the endorsement, require an operational account of AGI and evidence identifying what scaling contributed.
source_requirements: Prefer the original AAAI report and survey records. Technical evidence must establish capabilities and methods, rather than merely announce AGI or report a benchmark score. Use only material available by October 28, 2026.
