ambiguity_flags:
  - "'Recent' does not specify the survey's fieldwork dates."
  - "'Academic AI researchers' may describe the predominantly academic sample or assert a result specifically for academics."
  - "'Vast majority' has no numerical threshold."
  - Neither AGI nor the permissible changes within 'scaling' are operationally defined.
  - "'They were right' may mean justified skepticism or a demonstrated technical limitation; these require different evidence."
  - The claim combines a checkable survey finding with an unresolved substantive endorsement.
