evaluator_interpretation:
  - The ordinary reading is that GPT-3 made a basic biological error in the reported experiment. This does not require interpreting one continuation as proof that GPT-3 lacked all biological knowledge.
  - The target is the experiment described in the passage attributed to September 2021, not GPT-3's capabilities in February 2024. The supplied context does not establish when those earlier experiments began.
  - The parenthetical complaint about scientific access is outside the screened proposition.
support_condition: An independently sourced record establishes that GPT-3 produced the reported fatal-drinking continuation for the stated ordinary juice-mixing prompt.
contradiction_condition: An independently sourced record establishes that the reported continuation, prompt, or model attribution was materially inaccurate.
measurement_requirements: Preserve the full prompt, continuation, model identification, and available generation settings. Distinguish a local erroneous continuation from a general claim about biological knowledge.
source_requirements: An independent experimental record or independently verified account. Marcus's own publications cannot establish the outcome under the specified source rule.
