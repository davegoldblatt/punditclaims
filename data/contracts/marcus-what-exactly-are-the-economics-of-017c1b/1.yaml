ambiguity_flags:
  - Current-year reporting window selected for an ongoing technical observation.
  - Most and readily have no stated coverage or resource thresholds.
  - Knowledge of engineering methods differs from understanding model behavior.
  - A durable moat may involve compute, data, distribution, or switching costs rather than secret algorithms.
  - It’s not clear expresses uncertainty rather than asserting that no moat exists.
