assessment_axis: historical_observation
explicit_source_elements:
  - Most of the basic technology is well-understood
  - to a large degree readily copyable
  - It’s not clear
  - any commercial company
  - a durable moat to keep competitors out
evaluator_interpretation:
  - Basic technology means published model architectures, training methods, and adaptation techniques. It does not automatically mean identical frontier-model performance.
  - Readily copyable means technically capable competitors can implement those methods and build useful competing models without access to the incumbent's proprietary model.
  - The moat sentence expresses uncertainty about durable exclusion. It is not a prediction that every incumbent advantage will disappear.
  - Use the current year's observable technical state through publication, January 1–August 14, 2023. This reporting window is supplied because Marcus gives no measurement period.
support_condition: Public technical descriptions and working competing implementations establish broad reproducibility of the basic methods; contemporaneous evidence also supports uncertainty about durable exclusion of competitors.
contradiction_condition: Essential basic methods are inaccessible or cannot be reproduced by technically capable competitors, or a demonstrated durable barrier clearly prevents competitive entry.
measurement_requirements: Distinguish access to methods, replication effort, useful product capability, frontier parity, and durable commercial protection. A benchmark lead alone does not establish a durable moat.
source_requirements: Technical papers, released models, independent reproduction studies, and documented commercial or technical barriers available by the evaluation date and describing the target period.
