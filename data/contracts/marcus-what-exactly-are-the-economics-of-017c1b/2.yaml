explicit_source_elements:
  - Most of the basic technology
  - well-understood
  - to a large degree readily copyable
  - It’s not clear
  - any commercial company (eg OpenAI)
  - a durable moat to keep competitors out
evaluator_interpretation:
  - The first sentence contains a separately assessable technical observation. An ordinary reading concerns published methods and practical reproduction, not complete understanding of model behavior or cheap duplication of frontier performance.
  - The second sentence expresses uncertainty about competitive protection. It does not assert that no company has a moat.
  - A whole-claim factual score would improperly include that explicitly uncertain assessment. Technical evidence is therefore recorded as context, without scoring the combined claim.
  - Relevant technical context is what existed by August 14, 2023; later competitive developments cannot establish the earlier state.
support_condition: For the technical sentence separately, published methods and practical reproductions would support the ordinary reading. They cannot establish a whole-claim outcome that includes the uncertain moat assessment.
contradiction_condition: For the technical sentence separately, evidence that basic methods were predominantly inaccessible or impractical to reproduce would weigh against it. A performance gap alone does not contradict copyability of basic methods, and a moat cannot contradict a statement merely expressing uncertainty.
measurement_requirements: A separate technical assessment should distinguish reproducing basic methods, reusing released models, matching frontier capabilities and establishing commercial competitive protection.
source_requirements: Contemporaneous technical papers, released methods, reproduction reports and documented limitations. Later market outcomes are not substitutes.
