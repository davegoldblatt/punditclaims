assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI (and, for that matter, Anthropic)
  - the last two years
  - increasingly obfuscating the truth
  - through leak after leak to the media
evaluator_interpretation:
  - The described period is the two years preceding the March 3, 2026 post.
  - The plain reading is that both companies repeatedly supplied materially misleading financial information through leaks, with the practice becoming more pronounced over time.
  - "Obfuscation requires more than changed forecasts: evidence must establish misleading presentation or material omission relative to what was known when information was supplied."
  - This is a claim about disclosure conduct, not a particular monetary amount, so contract metric_scope is null.
support_condition: A dated record for both companies establishes repeated company-originated financial leaks that materially concealed known facts, with increasing frequency or severity over the two-year period.
contradiction_condition: A sufficiently comprehensive comparable record shows that the alleged misleading leaks were accurate and adequately qualified when issued, or that the asserted increasing pattern did not occur.
measurement_requirements: Match each alleged leak to its date, company provenance, metric definition, forecast vintage, contemporaneous knowledge and later established facts. Compare earlier and later portions of the period.
source_requirements: Original reporting and underlying documents, independent financial records, and evidence connecting the disclosures to company actions. Anonymous sourcing alone does not establish authorized company leakage or intent.
