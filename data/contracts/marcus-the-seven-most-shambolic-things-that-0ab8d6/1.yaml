assessment_axis: causal_assessment
explicit_source_elements:
  - OpenAI
  - driven by competition
  - drop its prices by 80%
evaluator_interpretation:
  - The embedded announcement identifies GPT-5.6 Luna as the model receiving the 80% cut; the claim is not read as an 80% reduction across all OpenAI products.
  - Driven by competition means competitive pressure materially influenced the decision, without having to be its sole cause.
  - The decision being assessed is the July 30, 2026 price change.
support_condition: Verify the 80% Luna price reduction and obtain direct statements, decision records or well-sourced reporting establishing competition as a material driver.
contradiction_condition: Matching price records refute the 80% cut, or reliable evidence establishes that competition did not materially influence the decision.
measurement_requirements: Compare the same model and pricing category before and after the change. Separate evidence of a price cut from evidence of its cause.
source_requirements: Use the company announcement for prices and direct or well-sourced evidence for motivation. Rival prices or temporal coincidence alone do not establish causation.
