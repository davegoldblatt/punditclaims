evaluator_interpretation:
  - Financial strain means material difficulty funding contractual payments, evidenced by a liquidity shortfall, distressed financing, forced spending cuts or payment default attributable to these commitments.
  - Ordinary fundraising or the existence of large commitments alone does not establish financial strain.
  - The latest stated horizon is ten years after publication. The dollar amount is an outstanding commitment stock; payments would occur over the forecast horizon.
  - The amount is treated as a press-reported estimate, rather than an audited liability balance.
support_condition: Evidence establishes the stated commitments and shows material financial strain caused by meeting them during the forecast horizon.
contradiction_condition: Anthropic meets or extinguishes the relevant commitments without material financial strain through their final maturity.
measurement_requirements: Contract-level payment schedules, cancellation provisions, available liquidity, realized cash flows and financing terms. Distinguish commitments from recognized debt and ordinary financing from financial distress.
source_requirements: Prefer contracts, filings and financial statements. Reporting based on reviewed documents may establish context but cannot make future strain certain.
