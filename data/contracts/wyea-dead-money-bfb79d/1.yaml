  - Break-even means the model's zero-return case, distinct from its 10% return-on-invested-capital case.
  - The required annual revenue has no specified realization year.
support_condition: The original model or a reproducible calculation using its assumptions requires approximately $425 billion of application-layer annual revenue at a 10% operating margin, including the stated training costs, for hyperscaler break-even.
contradiction_condition: The same model and assumptions yield a materially different requirement, or $425 billion belongs to a different margin, return, cost treatment, or capex scenario.
measurement_requirements: Obtain the application-layer sensitivity table and its capex, depreciation, operating-cost, training-cost, margin, and return assumptions.
source_requirements: Prefer the original Goldman Sachs report. A complete, independently published reproduction identifying the relevant table and assumptions could also establish the model's result.
