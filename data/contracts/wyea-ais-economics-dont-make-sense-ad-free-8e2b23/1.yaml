assessment_axis: historical_observation
explicit_source_elements:
  - Oracle is insufficiently-capitalized
  - to finish Stargate Abilene
  - at least another $150 billion
  - assuming that other partners pick up about $30 billion in costs
evaluator_interpretation:
  - Assess the present estimate of a remaining capital requirement, rather than treating the sentence as an undated forecast about eventual fundraising.
  - The named scope is the Abilene campus. The surrounding discussion of the wider Stargate program creates ambiguity but does not authorize silently replacing Abilene with that program.
  - Use Oracle's latest reported fiscal quarter before the post, December 2025 through February 2026, as the financial observation period.
  - Treat the $30 billion partner contribution as an assumption in the calculation, not as a forecast antecedent that must already have occurred.
  - Additional capital means the remaining completion requirement after existing committed resources and the assumed partner contribution.
support_condition: A reconciled Abilene completion budget, Oracle's committed resources and approximately $30 billion of assumed partner contributions leave Oracle needing at least $150 billion more.
contradiction_condition: A comparable full-project budget and capital reconciliation show that Oracle can complete Abilene with existing resources or requires less than $150 billion more under the same partner assumption.
measurement_requirements: Remaining construction, equipment and other completion costs; legal allocation of those costs; committed capital; and avoidance of double counting leases, developer borrowing and Oracle borrowing.
source_requirements: Project budgets, financing agreements and Oracle filings. A construction financing package alone does not establish the campus's complete equipment and funding requirements.
