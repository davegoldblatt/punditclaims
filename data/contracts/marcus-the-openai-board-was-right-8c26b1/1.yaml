assessment_axis: forecast_outcome
explicit_source_elements:
  - the demo was just a demo
  - will never work robustly as advertised
evaluator_interpretation:
  - The target is the voice assistant demonstrated in May 2024, including shipped versions and direct successors.
  - The ordinary reading of robustly is dependable performance in ordinary use, allowing occasional errors. It does not mean perfection.
  - As advertised refers to the demonstrated combination of responsive conversation, interruptions, expressive speech, translation, and interaction with visual inputs.
  - No numerical reliability threshold or deadline was supplied.
support_condition: Evidence establishes that dependable delivery of the advertised capabilities is permanently impossible. Failures or delays over a finite period cannot establish never.
contradiction_condition: Repeatable public testing establishes that a shipped version reliably delivers the material advertised capabilities under ordinary conditions.
measurement_requirements: Testing should identify the version, tasks, conditions, repeated trials, and failures. A launch announcement or selected successful demonstration is insufficient.
source_requirements: Use the original announcement to identify advertised capabilities and independent testing to assess reliability. Company disclosures can establish release dates and acknowledged limitations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, reproducible demonstration of dependable performance across the material advertised capabilities can contradict never. Permanent impossibility could support it; discontinuing one version would not suffice.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Robustly has no specified reliability threshold.
  - As advertised does not enumerate the capabilities that must work together.
  - The inclusion of successors is an evaluator interpretation.
retrospective_or_prospective: retrospective
