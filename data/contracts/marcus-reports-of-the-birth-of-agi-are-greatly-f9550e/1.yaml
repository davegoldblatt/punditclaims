assessment_axis: historical_observation
explicit_source_elements:
  - many different AI tasks
  - robotics, image interpretation, planning, game playing, scientific applications, many forms of reasoning
  - state of the art AI
  - currently makes little to no use
  - the transformer architecture
evaluator_interpretation:
  - Little to no use means transformers are absent or peripheral in leading systems for the named task areas.
  - Transformer architecture includes vision transformers and transformer components inside hybrid systems, not only language models.
  - The named areas are examples to assess separately; the claim does not say every leading system in every area avoids transformers.
  - Current refers to the 2023 state of the art through October 18. This current-year window accommodates the public evaluations available before the post.
support_condition: Architecture descriptions show leading systems in several named areas achieving their results without material transformer components. Such evidence can support individual areas without establishing all of them.
contradiction_condition: Transformer components play central roles in leading systems across the named areas. A central transformer in a leading system contradicts the characterization for that example, without proving universal transformer adoption.
measurement_requirements: Identify a specific task, evidence of leading performance, and the system's actual architecture. Distinguish architecture from training method and from an LLM-based interface.
source_requirements: Primary system papers, architecture documentation and contemporary competition or benchmark results.
