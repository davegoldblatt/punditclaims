evaluator_interpretation:
  - Appears expresses caution about the evidence; it is not a conditional forecast.
  - The ordinary reading is that fresh, credible evidence indicates additional withdrawals from data-center leasing commitments.
  - The recent-days context sets a March 1 through March 27 reporting window. Earlier reports provide the baseline for more.
  - The claim does not say Microsoft is abandoning all expansion or reducing its total infrastructure budget.
support_condition: Credible reporting available by publication describes additional cancellations, deferrals or withdrawals from data-center leasing commitments beyond the earlier reported pullback.
contradiction_condition: Reliable records establish that the additional reported withdrawals did not occur, were retracted, or merely repeated the earlier cases without any additional pullback.
measurement_requirements: Distinguish executed-lease cancellations, deferred commitments and prospective projects. Check whether the new reports describe additional activity rather than duplicate earlier reports.
source_requirements: Prefer Microsoft or counterparty disclosures and the underlying analyst note. Reputable reporting on the note can establish the cautious 'appears' formulation when primary records are unavailable.
