  - robots
  - the best surgeons on earth
  - anytime soon
  - by the end of the decade
evaluator_interpretation:
  - Read 'anytime soon' against the immediately following bet, giving a deadline of December 31, 2029. The sentence alone supplies no precise deadline.
  - The ordinary reading is autonomous surgical competence superior to leading human surgeons across a representative range of procedures, including patient outcomes and handling complications.
  - A successful laboratory task, surgeon-controlled robot, or regulatory approval alone would not establish this superiority.
  - "'Absurd' expresses Marcus's confidence; the assessable proposition is his negative forecast."
support_condition: At the deadline, sufficiently comprehensive clinical and regulatory evidence shows that robots have not attained the specified superiority.
contradiction_condition: By the deadline, credible comparative clinical evidence establishes autonomous robotic superiority to leading human surgeons across a representative range of surgery.
measurement_requirements: Comparative clinical studies with leading surgeons, comparable case difficulty, patient outcomes, complication management, and disclosure of human intervention.
source_requirements: Prefer published clinical studies, trial records, and regulatory assessments. Announcements and laboratory demonstrations alone are insufficient.
metric_scope: null
