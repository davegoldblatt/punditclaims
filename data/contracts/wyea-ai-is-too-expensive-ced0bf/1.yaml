evaluator_interpretation:
  - The ordinary reading concerns commercial AI GPU operations, rather than GPU manufacturing or cryptocurrency mining.
  - The surrounding discussion calls for profitability after equipment, financing, and recurring operating costs.
  - No period is named. I use January through March 2026, the latest completed quarter with public operator results before the May 19 post.
  - A company's consolidated loss does not establish that its deployed GPUs lose money. Positive EBITDA also does not establish profitability after equipment and financing costs.
  - No particular operator, accounting basis, or population-wide threshold is specified.
support_condition: Representative GPU-specific results show that commercial AI GPU operations fail to earn a profit after equipment, financing, and operating costs during the target quarter.
contradiction_condition: Comparable GPU-specific results establish full-cost profitability during the target quarter, with enough scope to address the broad statement.
measurement_requirements: Allocate revenue, utilization, equipment depreciation or economic capital cost, financing, power, facilities, maintenance, and attributable overhead to operating GPU services. Exclude unrelated investment gains.
source_requirements: Operator filings or independently verified GPU-service accounts. Corporate profits, losses, or adjusted EBITDA alone are insufficient.
