explicit_source_elements:
  - over and over
  - better at things that they have encountered before
  - especially poor
  - different in important and subtle ways
evaluator_interpretation:
  - The plain reading is a recurring empirical tendency, not a claim that every model fails on every unfamiliar problem.
  - Encountered before is operationalized through familiar task distributions or established benchmarks compared with controlled unfamiliar variants; exact training exposure must not be assumed.
  - Especially poor means a material performance decline on relevant variants.
  - The target is the research record describing then-current LLM behavior available by the post date. Since the passage invokes an accumulated literature without a starting date, the period has an unspecified start and ends on 2024-07-28.
  - Later models are not used to decide whether the observation was accurate when written.
support_condition: Multiple controlled studies show materially lower accuracy on unfamiliar or subtly changed tasks than on familiar counterparts.
contradiction_condition: Comparable studies show that the alleged tendency is not reproducible or is explained by uncontrolled differences, with broadly comparable performance on unfamiliar and changed tasks.
measurement_requirements: Compare the same models under comparable prompting and task difficulty. Distinguish unfamiliar examples from changed task rules and avoid assuming access to private training data.
source_requirements: Primary empirical studies reporting paired evaluations, methods and relevant limitations.
