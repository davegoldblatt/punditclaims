  precision: day
target_period: null
condition_status: met
early_resolution_rule: A completed qualifying financing closing, together with demonstrated expansion plans, can establish the predicted event before the deadline.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Middle of 2025 has no exact date.
  - Close another round could mean its first executed closing or completion of every committed tranche.
  - The dollar figures are qualified by 'likely'.
  - Will have to can express a financing forecast or a stronger claim of unavoidable financial necessity.
  - The source does not specify pre-money versus post-money valuation.
