assessment_axis: historical_observation
explicit_source_elements:
  - Every single AI startup is unprofitable
  - every AI startup
  - a service powered by AI models provided by AI labs
evaluator_interpretation:
  - Read AI startups primarily as the application businesses described in the surrounding value chain. The later inclusion of OpenAI and Anthropic makes the category boundary uncertain.
  - Use calendar 2025, the latest completed annual financial period before publication, for the ongoing profitability assertion.
  - Profitable ordinarily means company-wide income exceeds expenses, rather than positive gross margin, revenue growth or financing proceeds.
  - The model clause does not explicitly say exclusively third-party models. Developing an internal model alone therefore does not refute the literal claim that a startup also offers a service using externally supplied models.
support_condition: Comprehensive evidence shows that all in-scope startups incurred company-wide losses and all offered services using models supplied by AI labs.
contradiction_condition: One clearly in-scope startup is demonstrably profitable on a comparable accounting basis during the target period, or one has no service using models supplied by AI labs.
measurement_requirements: Identify the startup population, company-wide profit measure and period, and production model sourcing. Distinguish internal model development from absence of external model use.
source_requirements: Prefer financial statements and dated company technical disclosures. Profitability reporting must identify the measure sufficiently to distinguish net income from narrower margins.
