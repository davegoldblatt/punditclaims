assessment_axis: causal_assessment
explicit_source_elements:
  - A billion dollars in revenue is not a billion dollars in profit
  - extremely expensive to train these models
  - fairly expensive just to operate them
evaluator_interpretation:
  - The ordinary reading is that training and serving OpenAI's contemporary models incurred substantial costs that reduced the profit obtainable from revenue.
  - The statement does not assert that these costs consumed most or all revenue, and does not commit to a particular profit margin.
  - Assess the economics of the models available at the September 2023 post. Training expenditure can precede deployment, while operating expenditure recurs during use; Marcus supplies no common accounting period.
  - No accounting basis is stated for the costs. The nearby press-based revenue projection does not establish how training or operating expenses were measured.
support_condition: Comparable evidence establishes economically substantial training and serving costs for the models discussed, and shows that OpenAI bore those costs in earning revenue.
contradiction_condition: Comparable evidence establishes that training or serving costs were economically negligible for OpenAI, or that the costs attributed to OpenAI were not borne by it.
measurement_requirements: Distinguish total model training costs, individual training runs, aggregate serving costs and per-request costs. Identify the accounting treatment before converting spending into an effect on reported profit.
source_requirements: Prefer company cost disclosures or original cost studies. Credible news reporting may supply estimates, but those must remain labelled as estimates.
