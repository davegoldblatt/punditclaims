assessment_axis: forecast_outcome
explicit_source_elements:
  - no avoiding the carnage to come
  - outside of
  - ten to a hundred times the demand for AI compute
  - by 2030
  - that exists today
  - larger than the $779 billion that the software industry earns annually
evaluator_interpretation:
  - The exception states a necessary condition for avoiding collapse. It does not promise that sufficient demand growth would prevent collapse.
  - Today refers to July 7, 2026. By 2030 allows through December 31, 2030.
  - The ordinary reading of carnage is widespread severe business failures and investment losses across the AI sector.
  - Demand below ten times the baseline is the clearest case in which the exception has not occurred. The wording does not identify a single threshold within the ten-to-one-hundred-times range.
  - The 2030 deadline explicitly governs demand growth; the timing of the resulting collapse is less clear.
  - The dollar comparison requires annual compute spending or revenue, but physical compute demand cannot be converted into dollars without prices and a defined market boundary.
support_condition: Comparable measurements establish that demand failed to reach the required scale by the end of 2030, and the relevant AI investment cycle produces widespread severe failures and losses. The dollar implication additionally requires a documented conversion between demand and annual compute spending.
contradiction_condition: A completed relevant investment cycle avoids severe AI-sector collapse despite demand remaining below the necessary scale-up. The monetary implication could separately be contradicted by comparable demand and price measurements showing the claimed growth without exceeding the stated annual dollar benchmark.
measurement_requirements: A consistent July 2026 demand baseline and measurements through 2030; separation of physical compute, purchased services, infrastructure investment and annual revenue; documented failures and investment losses; a source and period for the software-revenue benchmark.
source_requirements: Independent demand measurements and primary financial or insolvency records. Forecasts and announced spending commitments cannot establish realized 2030 demand.
