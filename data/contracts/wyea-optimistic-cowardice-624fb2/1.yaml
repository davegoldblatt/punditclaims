assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI
  - burned $5 billion in 2024
  - currently raising $40 billion
  - the majority of it from SoftBank
  - will have to raise $16 billion or more to fund it
evaluator_interpretation:
  - Read burned as approximately USD 5 billion of net cash consumption during calendar 2024, while flagging the possible alternative meaning of accounting losses.
  - Currently raising describes negotiations underway by March 24, 2025, not a completed financing.
  - Majority means more than half of the proposed USD 40 billion round.
  - Will have to raise describes an asserted financing requirement for that proposed round, not merely a plan to borrow for several AI investments.
  - The target interval encompasses the expressly named 2024 cash-burn period and the financing state at publication. The contract's single metric_scope describes cash burn; the separate financing amounts are assessed explicitly and are not treated as matching cash-burn evidence.
  - The numerical financial claims are treated as reported estimates, consistent with contemporaneous press reporting, rather than audited company figures.
support_condition: Records establish approximately USD 5 billion of 2024 cash burn, an ongoing USD 40 billion round with more than USD 20 billion expected from SoftBank, and a need for SoftBank to raise at least USD 16 billion specifically to finance that participation.
contradiction_condition: Comparable cash-flow records materially contradict the 2024 amount, contemporaneous financing records contradict the round or majority share, or records establish that the asserted minimum external financing requirement was false.
measurement_requirements: Keep net cash consumption separate from net or operating losses. Distinguish proposed round size, SoftBank's retained contribution after syndication, and borrowing for OpenAI versus other investments.
source_requirements: Prefer cash-flow accounts and financing agreements. Contemporaneous reputable reporting can establish private negotiations, with its estimate status preserved.
