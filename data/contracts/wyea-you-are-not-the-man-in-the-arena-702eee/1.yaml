explicit_source_elements:
  - Much like cryptocurrency
  - the AI conversation
  - almost always discusses what might happen rather than what is happening
  - venture invest $15 billion
evaluator_interpretation:
  - The plain reading is that nearly all public discussion of the current AI boom centers on prospective developments, with discussion of existing developments only an occasional exception. A simple majority would not establish 'almost always'.
  - The surrounding discussion of Silicon Valley suggests public technology and investment discourse, including journalism, investor commentary and social media. It does not specify a representative population or how to weight these channels.
  - For the ongoing observation, use August 2023 through the publication date, August 30. This is an evaluator-selected window for the conversation at publication, not a period expressly supplied by Zitron.
  - Treat the cryptocurrency comparison as an analogy about speculative discussion during the late-2020-to-late-2022 boom identified in the context.
  - The investment figure's linked source identifies worldwide generative-AI venture funding in the first half of 2023. Interpret $15 billion as a rounded press estimate for that aggregate, including corporate investment counted by the source.
  - The rhetorical phrase 'something you can’t really describe' is not treated as a separate assertion that AI has no describable applications.
support_condition: A representative analysis of public AI discussion around publication finds that nearly all discussion primarily concerns future possibilities, with existing developments only occasional exceptions. Comparable evidence supports the cryptocurrency analogy, and matching investment records establish approximately $15 billion in the linked funding scope.
contradiction_condition: A representative analysis finds that discussion of existing AI developments forms a substantial, recurring share rather than occasional exceptions, or matching investment records materially contradict the approximately $15 billion figure. Isolated examples cannot establish discussion-wide frequency.
measurement_requirements: Use a documented sampling frame across relevant public channels, distinguish future possibilities from existing developments, specify treatment of mixed discussions, and report coding reliability and uncertainty. Funding must match sector, geography, period and inclusion of corporate investors.
source_requirements: Prefer original content-analysis research and investment-provider records. Reputable reporting may establish the reported funding estimate when primary data cannot be obtained. Speaker commentary and selectively chosen headlines cannot establish prevalence.
