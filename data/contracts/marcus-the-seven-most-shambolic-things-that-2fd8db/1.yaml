contradiction_condition: Reliable records establish that the reported distress or forced sales did not occur, or that the affected portfolio was not heavily leveraged.
measurement_requirements: Distinguish forced portfolio liquidation from dissolution of the fund. Do not treat changes in assets under management as an audited investment return.
