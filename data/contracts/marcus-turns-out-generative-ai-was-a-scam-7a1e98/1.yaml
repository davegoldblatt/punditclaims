explicit_source_elements:
  - the people selling it
  - tried to sell it as if it were tantamount to artificial general intelligence
  - when it’s not
evaluator_interpretation:
  - Read the marketing allegation as referring to prominent vendors' public promotion, including executive statements, without requiring every vendor to use identical language.
  - Distinguish portraying an existing product as AGI-equivalent from predicting that a future product will achieve AGI.
  - Use the ordinary reading of AGI as broad, flexible human-level cognitive competence; do not require perfection or superintelligence.
  - The marketing allegation concerns statements before publication, with no stated starting date. The capability clause concerns systems available by February 23, 2026.
support_condition: Prominent vendors portrayed existing generative-AI products as broadly human-level general intelligence, while independent evidence establishes that the advertised products fell materially short of that capability.
contradiction_condition: The identified marketing only promises future AGI or clearly describes narrower capabilities, or independent evidence establishes that the advertised products meet the claimed broad general capability.
measurement_requirements: Match advertisements to specific products and dates. Assess generality, transfer and reliability across domains; neither a single benchmark nor an AGI label alone settles capability.
source_requirements: Original vendor marketing or executive statements, plus independent evaluations. Preserve qualifications and contrary expert assessments.
