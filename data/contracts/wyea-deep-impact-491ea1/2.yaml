  - and so they didn't
  - (context) methods to make their models more efficient
  - (context) OpenAI tried (and failed) in 2023 to deliver a more efficient model
evaluator_interpretation:
  - In context, 'it' means pursuing efficiency the way DeepSeek did, by working within hard constraints to get strong models at much lower cost. It does not mean any efficiency gain at all.
  - The claim has two parts. They did not pursue that kind of efficiency. The reason was that endless funding and GPU access removed the pressure. The second part is a claim about motive and the counterfactual.
support_condition: Evidence that OpenAI and Anthropic had made no comparable efficiency effort by January 2025, plus evidence that this was because they lacked pressure, such as internal statements.
contradiction_condition: Evidence that they made DeepSeek-like efficiency efforts before the post, or evidence that something other than lack of pressure drove their choices.
