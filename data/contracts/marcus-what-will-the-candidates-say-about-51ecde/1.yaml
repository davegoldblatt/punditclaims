assessment_axis: causal_assessment
explicit_source_elements:
  - AI contributes
  - escalation
  - fraud and disinformation
  - in both
evaluator_interpretation:
  - The ordinary reading is that AI helps perpetrators increase the scale, frequency or effectiveness of fraud and disinformation. It need not be their sole cause.
  - Increased production of deceptive material counts as escalation; increased financial losses, audience reach or persuasion would be stronger but distinct findings.
  - The claim describes an ongoing state. I use the current calendar year through publication, 2024-01-01 to 2024-09-10, as the prepublication observation period.
  - The recommendation about watching the candidates is not itself being graded.
support_condition: Contemporaneous investigations document AI increasing perpetrators' capabilities or output in actual fraud and disinformation operations, with an identified causal mechanism in both.
contradiction_condition: Reliable evidence shows that the alleged increases in both activities were not occurring or were not attributable to AI. Evidence against only one component would warrant a split assessment.
measurement_requirements: Distinguish observed operations from hypothetical risks, and increased content production from increased victim losses, audience reach or persuasion.
source_requirements: Prefer law-enforcement investigations and first-party threat investigations. Aggregate fraud growth without AI attribution is insufficient.
