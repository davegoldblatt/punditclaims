assessment_axis: forecast_outcome
explicit_source_elements:
  - Eventually
  - AI data center debt
  - untenable for those raising it
  - 11%+ rates
  - already-meager margins
evaluator_interpretation:
  - The plain reading predicts financial unsustainability across a meaningful part of the relevant AI data-center borrowing market, rather than one isolated unsuccessful project.
  - "'Untenable' means borrowers cannot sustainably service or refinance their debt, evidenced by defaults, distressed restructurings or financing failures."
  - The causal explanation requires actual financing costs of at least 11% and inadequate operating cash flows. A secondary-market yield is not automatically the borrower's contractual interest rate.
  - The surrounding discussion includes modeled refinancing costs. It supplies no deadline or precise share of borrowers.
support_condition: Representative borrower or project records show widespread debt-service or refinancing failures caused materially by borrowing costs of at least 11% interacting with insufficient operating margins.
contradiction_condition: A clearly defined relevant debt population reaches final repayment or resolution without the predicted unsustainability, despite the stated financing costs. Temporary access to capital cannot refute an unrestricted eventual forecast.
measurement_requirements: Actual coupons and floating-rate costs, refinancing terms, project cash flows, debt-service schedules, defaults and restructuring outcomes. Separate operating margins from cash available for principal and interest.
source_requirements: Credit agreements, borrower filings, court records, lender disclosures and representative financing data. Reputable reporting can establish market prices where original market data are unavailable.
