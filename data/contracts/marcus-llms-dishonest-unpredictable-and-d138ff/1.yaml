explicit_source_elements:
  - Other models (like o3)
  - could actually read web links (at least to some degree)
  - might do better
  - the tendency to confabulation continues to be widespread
evaluator_interpretation:
  - Confabulation means presenting invented, unsupported, or false factual material as an answer.
  - Widespread means a recurring problem across multiple leading model families and evaluation settings. It does not mean that most responses are false.
  - The statement that web-capable models might do better expresses a possibility, not a promised improvement or conditional forecast.
  - For this ongoing observation, use the current calendar quarter through publication, April 1–June 22, 2025, as the latest reporting window for contemporary model evaluations. Marcus supplied no reporting period.
support_condition: Contemporary primary evaluations demonstrate recurring factual fabrication across models from multiple developers, including evidence that o3 remains susceptible despite possessing browsing capabilities.
contradiction_condition: Representative contemporary evaluations show that confabulation is confined to isolated models or exceptional cases, with consistently grounded factual output across leading model families and varied tasks.
measurement_requirements: Identify the task, models, and definition of hallucination. Do not treat benchmark error rates as general usage rates, or browsing capability as proof that browsing was enabled during a test.
source_requirements: Dated primary model evaluations and independent benchmark reports. Model documentation can establish browsing capability.
