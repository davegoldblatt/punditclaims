evaluator_interpretation:
  - The ordinary numerical reading is approximate lifetime totals of $5 billion in revenue and $10 billion in compute expenditure.
  - The earlier passage preserves the source's exceeding and over qualifiers. Those establish lower bounds, which must be distinguished from approximate totals.
  - Compute is interpreted as the model training and inference expenditure identified in the surrounding discussion.
  - The target ends at the March 9 declaration explicitly cited for the figures, rather than extending an unspecified total through March 17.
  - Lifetime is a period description, not a conditional antecedent.
support_condition: Comparable cumulative disclosures establish totals reasonably close to $5 billion in revenue and $10 billion in model training and inference expenditure.
contradiction_condition: Comparable cumulative disclosures establish that either actual total was materially different from the stated approximate amount.
measurement_requirements: Realized cumulative revenue and cumulative training and inference expenditure through the same cutoff. Lower bounds alone cannot establish approximate totals or a two-to-one cost ratio.
source_requirements: Prefer the cited CFO declaration and any later disclosure that explicitly reports the same historical cutoff and accounting basis.
