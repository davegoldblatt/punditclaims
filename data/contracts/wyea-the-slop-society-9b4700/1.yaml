explicit_source_elements:
  - I am 100% sure
  - these chatbots will return
  - Meta intends to fill your feeds
  - entirely generated or summarized by generative AI
  - fake profiles or content itself
evaluator_interpretation:
  - "'These chatbots' refers to Meta's withdrawn character profiles on Facebook or Instagram."
  - A restoration of those profiles or a clear successor offering of Meta-operated character profiles would count; identical names are not required.
  - A general assistant, user-created chatbots or an AI-content feed alone would not establish their return.
  - The statement about Meta's intentions is the forecast's rationale, not an antecedent that must occur before it can be scored.
  - No deadline is supplied.
support_condition: A dated, publicly documented restoration or successor launch makes Meta-operated AI character profiles available on Facebook or Instagram after the post.
contradiction_condition: A decisive event permanently makes such a return impossible. Continued nonappearance or a reversible cancellation does not establish failure of an undated forecast.
measurement_requirements: Evidence must identify the launch date, platform, profile functionality and Meta's operational role.
source_requirements: Prefer Meta announcements and observable product records, supplemented by reliable independent reporting.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when a verified post-publication launch or restoration satisfies the stated profile criteria. Resolve as contradicted only upon a decisive event that permanently prevents their return.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'These chatbots' could mean the identical characters or a successor product."
  - No deadline.
  - Chatbot availability and public social-profile availability are distinct.
