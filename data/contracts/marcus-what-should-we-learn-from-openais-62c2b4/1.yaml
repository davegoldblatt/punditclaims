assessment_axis: historical_observation
explicit_source_elements:
  - called itself open
  - traded on the notion of being open
  - even as early as May 2016
  - knew that the name was misleading
evaluator_interpretation:
  - The ordinary reading is that OpenAI promoted openness while senior leaders knew its name encouraged an expectation of source-code sharing broader than their actual plans.
  - Knowledge by Altman and Brockman counts as leadership knowledge; the claim need not imply that every employee knew.
  - Traded on openness means using that identity in public positioning, not a measurable financial benefit.
  - The assessment covers the founding representations through May 2016. It does not require proof of a secret organization-wide scheme.
support_condition: Public representations promote openness, and contemporaneous records show leaders recognizing by May 2016 that audiences expected more sharing than OpenAI intended.
contradiction_condition: Contemporaneous records establish that the relevant public understanding matched OpenAI’s plans, or refute the alleged leadership awareness by May 2016.
measurement_requirements: Compare public representations with documented leadership statements about intended sharing and known public expectations.
source_requirements: Founding disclosures and contemporaneous correspondence or firsthand reporting. Distinguish reported conversations from internal emails.
