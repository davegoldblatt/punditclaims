assessment_axis: forecast_outcome
explicit_source_elements:
  - We may well move to a regime in which AI writes most code
  - for a long time to come
  - we are going to need humans to fix the mess
evaluator_interpretation:
  - The forecast is that human engineers will stay necessary to repair and maintain AI-written code for many years, whether or not AI ends up writing most code.
  - The 'AI writes most code' clause is a hedge ('may well'), not a condition. The forecast applies either way.
  - "'For a long time to come' sets no deadline, so this is an open-horizon forecast."
support_condition: After many years (well beyond the evaluation date), credible industry or research evidence shows that human engineers are still routinely needed to fix and maintain AI-written code.
contradiction_condition: Credible independent evidence shows that, soon after the post, production software built mostly by AI is routinely maintained and repaired at scale without human engineers.
measurement_requirements: Share of maintenance and repair work done by humans versus AI agents on AI-generated code; incident postmortems; long-run benchmark or field studies.
source_requirements: Peer-reviewed or preprint empirical studies, company disclosures, or postmortems; not the speaker's writing.
metric_scope: null
original_horizon: for a long time to come
horizon_interval:
  start: 2026-03-10
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Contradicted early only if credible independent evidence shows that production software written mostly by AI is routinely maintained and repaired at broad industry scale without human engineers. Support cannot come early, because 'a long time to come' must pass first.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'For a long time to come' has no deadline."
  - "'Fix the mess' is vague about how much human repair counts."
retrospective_or_prospective: retrospective
