assessment_axis: historical_observation
explicit_source_elements:
  - Outside of hyperscalers paying NVIDIA for GPUs out of cashflow
  - none of the AI industry is fueled by revenue
  - Every single part of the industry is fueled by some kind of subsidy
evaluator_interpretation:
  - The surrounding discussion makes this a claim about dependence on outside funding to cover costs, not a claim that AI companies receive no customer revenue.
  - The universal wording includes AI application businesses as well as model developers and compute providers.
  - Use July–September 2025, the latest completed calendar quarter that could have been publicly reported before publication.
  - Receiving investment does not establish that a business needs investment to sustain its existing operations. Profit, operating cash flow and cash remaining after investment are different measures.
  - The speaker supplies no accounting basis for the industry-wide cost-coverage claim.
support_condition: Comparable financial records establish that every non-exempt part of the stated industry depended on outside financial support to cover ongoing costs during the target period.
contradiction_condition: A non-exempt AI business demonstrably sustained its operations from customer receipts during the target period, without outside support covering a funding shortfall.
measurement_requirements: Revenue, operating costs, cash receipts, cash expenditure and financing must be distinguished. Evidence must identify the reporting period and distinguish financing for expansion from financing required to continue operating.
source_requirements: Prefer company financial statements and financing disclosures. General profitability announcements require supporting definitions before being treated as proof of cash self-sufficiency.
