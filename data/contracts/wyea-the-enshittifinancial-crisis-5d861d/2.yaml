assessment_axis: historical_observation
explicit_source_elements:
  - Outside of hyperscalers paying NVIDIA for GPUs out of cashflow
  - none of the AI industry is fueled by revenue
  - Every single part of the industry is fueled by some kind of subsidy
evaluator_interpretation:
  - "Reading, following the reviewers: apart from hyperscaler GPU purchases funded from cash flow, every part of the AI industry depends on outside capital (venture money, debt, investor support) rather than its own revenue to cover ongoing costs."
  - "The claim is universal ('none', 'every single part'). In context the 'parts' are links in his chain: GPU buyers and data centers, model providers, and AI startups."
  - "Target period: an ongoing state with no named period, so calendar 2025 up to the post date (2025-01-01 to 2025-12-29), the latest period public evidence covers."
  - Indirect subsidy through below-cost model pricing is noted, but not treated as making a profitable company 'fueled by subsidy', since that would make the claim true by definition.
support_condition: The main parts of the chain (model providers, neoclouds, AI startups) cover their ongoing costs with outside capital rather than revenue, and no meaningful non-hyperscaler AI business covers its costs from revenue.
contradiction_condition: Meaningful non-hyperscaler AI businesses are shown to cover their ongoing costs from customer revenue (for example, sustained profitability) during the period.
measurement_requirements: Revenue against costs, and reliance on outside funding, for AI model providers, data center operators and AI application companies in 2025.
source_requirements: Company disclosures, financials reported by reputable press, filings.
