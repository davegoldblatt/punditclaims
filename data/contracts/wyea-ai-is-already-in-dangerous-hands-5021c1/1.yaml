assessment_axis: not_applicable
explicit_source_elements:
  - harmful in effectively every way
  - trained on theft
  - expensive and power-intensive infrastructure
  - unprofitable and unsustainable
evaluator_interpretation:
  - The statement combines factual allegations with an overall judgment about harm. The factual components could be assessed separately, but they do not supply a test for the overall judgment.
  - Theft could mean unlawful acquisition, copyright infringement through training, or an ethical objection to using material without consent. Those are different propositions.
  - No company, accounting basis, profitability measure, or meaning of sustainability is specified. I do not substitute OpenAI's or Anthropic's finances for the entire category of LLMs.
support_condition: No determinate condition applies to the statement as a whole without adding a definition of harm, sustainability, and the businesses whose profitability is being assessed.
contradiction_condition: No determinate condition applies to the whole statement. A lawful training practice or beneficial application would not necessarily refute the qualified phrase 'effectively every way'.
measurement_requirements: Separate propositions would require identified training datasets and legal standards, measured resource use, and a defined financial entity, period, and accounting basis.
source_requirements: Court records and provenance records for appropriation; measured energy disclosures for resource use; comparable financial accounts for profitability.
