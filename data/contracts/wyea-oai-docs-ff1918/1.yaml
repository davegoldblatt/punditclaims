evaluator_interpretation:
  - Assess January through June 2025 payments, the revenue floor derived using the contextual 20% share, and the comparison with earlier reporting together.
  - Treat 'at least' as a lower bound, not an estimate of total revenue or a ceiling.
  - The attribution to documents identifies a source rather than a forecast condition.
  - Use estimate for the accounting basis because the figures are journalist-reported from nonpublic records. Gross versus net treatment is unspecified.
support_condition: Independent records establish $454.7 million of revenue share for January–June 2025, with agreement and accounting details supporting the stated revenue floor. Earlier reporting establishes the $4.3 billion comparison.
contradiction_condition: Comparable records establish a materially different payment total or show that the applicable rate, offsets, or timing invalidate the floor. Revenue exceeding the floor is not a contradiction.
measurement_requirements: Match the six-month period, reconcile accruals and cash settlement, establish reciprocal offsets and covered revenue, and distinguish realized revenue from annualized figures.
source_requirements: Underlying records or independently verified reporting are needed for the payment. Reporting that merely repeats Zitron cannot establish it.
