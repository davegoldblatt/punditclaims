assessment_axis: forecast_outcome
explicit_source_elements:
  - burn another $230 billion
  - I think it’ll need far more than that
  - By the end of 2030
evaluator_interpretation:
  - The surrounding passage ties the prediction to attaining the revenue projections through 2030.
  - I read burn as cumulative net cash consumption, not gross compute expenditure, accounting losses, financing raised, or spending commitments.
  - The comparison period is 2026–2030. The word another does not specify an exact starting balance or date.
  - Far more requires a substantial excess over $230 billion; the speaker supplies no numerical margin.
support_condition: If OpenAI attains the cited revenue projections, comparable realized cash-flow records show that doing so required cumulative net cash burn substantially exceeding $230 billion during the forecast period.
contradiction_condition: OpenAI attains the cited revenue projections with comparable cumulative net cash burn at or below $230 billion, or clearly too close to it to constitute far more.
measurement_requirements: Reconcile realized cash receipts and operating and investment cash outflows over the same period. Exclude financing proceeds from revenue and distinguish cash burn from accounting losses and gross spending.
source_requirements: Prefer published financial statements and cash-flow reconciliations. Investor forecasts and anonymous-source estimates provide context but cannot establish realized burn.
metric_scope:
  company: OpenAI
  metric: cumulative net cash burn
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: By the end of 2030
horizon_interval:
  start: 2026-03-03
  end: 2030-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Early resolution requires documented attainment of the cited revenue targets together with realized cumulative cash burn that decisively establishes the comparison. A revised forecast or signed spending commitment does not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Far more has no numerical cutoff.
  - The starting date implied by another is not explicit.
  - Burn is not formally defined.
  - The precise revenue path is incorporated from surrounding reporting rather than fully specified in the sentence.
retrospective_or_prospective: prospective
