explicit_source_elements:
  - unpacking today’s news and the story behind it
  - the litigation afterwards
  - will keep investigative journalists employed
  - literally for years
evaluator_interpretation:
  - The plain reading is that investigating the Nvidia/Huang story and related litigation will provide sustained journalistic work over multiple years. It does not require proof that particular jobs exist solely because of this story.
  - I interpret 'years' as at least two years after the post, with substantive investigative work continuing through at least November 23, 2028. This minimum duration is my operational threshold.
  - The phrase specifies a duration, but no latest completion date. I therefore treat this as an open-horizon forecast.
  - Litigation is part of the predicted sequence, not an explicit condition that must occur before the forecast can be assessed.
support_condition: Dated investigative reporting or documented journalistic assignments establish sustained work on this story and related litigation across at least two years following November 23, 2026. Routine news repetition or anniversary summaries alone do not qualify.
contradiction_condition: Comprehensive evidence establishes that investigative work on the story and related litigation ended before the minimum two-year duration and did not continue across that period. A sparse search result, a lawsuit ending, or a temporary reporting gap alone is insufficient.
measurement_requirements: Track publication dates, original reporting, documented assignments, and connections to the Huang story and related litigation. Distinguish investigative work from commentary and syndicated copies.
source_requirements: Use original published investigations, documented newsroom work, and court records identifying related litigation. The speaker's own prediction cannot establish its fulfillment.
metric_scope: null
original_horizon: literally for years
horizon_interval:
  start: 2026-11-23
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve support only when dated records establish the required multi-year investigative work. Present investigations, litigation, or announced reporting plans cannot establish future duration. No single case closure establishes that all relevant investigative work has ended.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Literally for years' gives no exact duration or final deadline."
  - "'Keep investigative journalists employed' does not specify staffing, hours, or publication frequency."
  - The boundary between investigative reporting, ordinary news coverage, and commentary is unspecified.
