ambiguity_flags:
  - The people and prevalence of fear are unspecified.
  - Grown big supplies no measure of power or starting date.
  - The relative importance of fear among other causes is unspecified.
  - It is unclear whether retaining power during his reinstatement alone satisfies the claimed growth in power.
  - What he may say about them could mean private reputational damage or public criticism.
