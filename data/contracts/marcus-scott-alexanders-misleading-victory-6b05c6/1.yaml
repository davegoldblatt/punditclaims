assessment_axis: historical_observation
explicit_source_elements:
  - succeeds at previously-discussed prompts
  - does less well on ones not previously-discussed
  - suggests that it is far from robust
evaluator_interpretation:
  - The system means the GPT-4o image generator discussed in the post.
  - The ordinary reading is a meaningful performance gap between previously publicized compositional prompts and comparable new prompts.
  - Comparability requires accounting for prompt difficulty, number of requested relationships, retries, and output selection. Otherwise a difference cannot establish the asserted generalization gap.
  - "For the ongoing state without a specified reporting period, use July 1 through July 9, 2025: the latest partial calendar month at publication. This is an evaluator-selected reporting window."
  - The statement about robustness is a qualified inference. It does not establish that memorization or training contamination caused any observed gap.
support_condition: Contemporaneous tests of the same GPT-4o image generator show meaningfully worse compositional accuracy on comparable previously undiscussed prompts, with failures supporting the stated concern about robustness.
contradiction_condition: Adequately comparable contemporaneous tests show no meaningful disadvantage on new prompts, or show that the claimed gap disappears when difficulty and testing procedures are matched.
measurement_requirements: Prompt-publication histories, model identification, matched testing procedures, complete output counts, and consistent scoring of requested objects, attributes, and relationships.
source_requirements: Primary comparative evaluations or independently documented testing. Isolated failures and successes without comparable prompt sets are insufficient.
