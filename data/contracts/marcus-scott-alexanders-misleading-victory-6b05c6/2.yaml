explicit_source_elements:
  - the system succeeds at previously-discussed prompts
  - does less well on ones not previously-discussed
  - tells us something about the internal mechanism
  - suggests that it is far from robust
evaluator_interpretation:
  - The system is GPT-4o image generation, as identified in the surrounding discussion.
  - The plain reading is that success on the publicized prompts does not transfer reliably to comparable fresh compositional prompts. Marcus supplies no numerical performance threshold.
  - "The target is the system's demonstrated performance as of July 9, 2025. The start is unspecified: relevant earlier testing of this system is eligible, including the testing behind Alexander's retrospective. No July-only window is imposed."
  - Comparable means broadly similar compositional demands and generation and grading procedures. It does not require an identical benchmark or proof that a prompt never appeared anywhere online.
  - The statement about internal mechanism is a tentative inference from the asserted performance gap, not a definite claim that training contamination occurred.
support_condition: Independent records show success on the previously discussed prompts and a meaningful, recurring performance drop on comparable fresh compositional prompts using the same image-generation system. The contrast should demonstrate unreliable transfer beyond the publicized examples.
contradiction_condition: Adequate comparative testing shows that the same system performs similarly or better on comparable fresh prompts, with reliable transfer of the relevant compositional abilities.
measurement_requirements: Identify prompts, their prior-publication status, the image-generation system, generated outputs, attempts allowed, and grading criteria. Compare similar compositional demands. A few harder failures alone do not establish a familiarity-related performance gap; no fixed sample size or significance threshold is imposed.
source_requirements: Use independent testing records or primary research available by October 28, 2026 that bears on the system's pre-post performance. Marcus's own reports cannot establish his claim. Later testing of changed systems is context only.
