assessment_axis: historical_observation
explicit_source_elements:
  - has not returned any profits
  - not expecting to do so until at least 2029
  - burn rate in the billions
  - still lacks a clear technical moat
evaluator_interpretation:
  - The ordinary reading is that OpenAI remained unprofitable, expected profitability no earlier than 2029, was consuming billions of dollars in cash annually, and lacked a demonstrably durable technical advantage over competitors.
  - The surrounding retrospective concerns 2024. I use calendar 2024, including financial estimates and expectations reported during that year, as the latest annual reporting period before publication.
  - The statement about 2029 describes an expectation held in 2024. It is not a forecast here to be scored against realized profits in 2029.
  - Returned profits is read as company profitability rather than investor distributions.
  - Annual frequency and US dollars are inferred from the financial context. The sentence does not identify an accounting basis or distinguish cash expenditure from net cash burn, so the contract's accounting basis remains unknown.
  - A technical moat means a durable advantage that competitors cannot readily reproduce. A temporary benchmark lead or evidence of competition alone does not settle it.
support_condition: Matching financial records establish the profitability history, a contemporaneous expectation of no profit before 2029, and annual net cash consumption of multiple billions of US dollars; comparative evidence also establishes the absence of a clear durable technical advantage.
contradiction_condition: Matching records establish profits, an expectation of profitability before 2029, or annual cash burn below the stated magnitude; alternatively, evidence establishes a clear durable technical advantage. Any partial finding must identify the component it addresses.
measurement_requirements: Separate profit and cash-flow measures, with their accounting treatment and reporting period; dated profitability forecasts; and evidence about the durability and reproducibility of technical advantages.
source_requirements: Prefer financial statements and dated company forecasts. If private records are unavailable, identify reporting based on those records and its limitations. Use primary comparative evaluations for technical performance.
