horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Legitimizing could mean apparent endorsement or a measured change in consumer trust.
  - No geography or product category is specified.
  - The causal assessment concerns the product as of the post, not any later implementation.
