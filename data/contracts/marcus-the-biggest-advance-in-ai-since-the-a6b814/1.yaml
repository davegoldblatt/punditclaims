support_condition: Leading AI systems become publicly documented as built around large-scale explicit knowledge, explicit reasoning machinery, and explicit cognitive world models, as the 2020 paper describes.
contradiction_condition: With no deadline, no dated event can show the forecast false. The field abandoning these directions for good would weigh against it, but cannot settle it.
