support_condition: Contemporary research documents substantial deficiencies on rare classes or situations in mainstream deep-learning systems, despite stronger performance where training data are plentiful.
contradiction_condition: Representative contemporary evaluations show that rare-case limitations are generally small or robustly resolved in the relevant methods.
measurement_requirements: Compare performance across frequent and rare classes or matched balanced and long-tailed settings. Distinguish rarity from unrelated distribution changes.
