  - "'Making sounds like it doesn't intend to pay its debts' is a characterization. The notice concerns deferring rent to a landlord, not Oracle's bond debt."
  - "'Beyond abnormal' is an opinion. Oracle says such notices are commonplace."
  - The $340bn figure for Oracle's OpenAI buildout was not defined by the speaker.
