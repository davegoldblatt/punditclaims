  - $340 billion in data centers
  - materially behind schedule
  - making sounds like it doesn’t intend to pay its debts
evaluator_interpretation:
  - Assess the factual inference about construction status and payment intentions; 'beyond abnormal' and 'extremely alarming' are evaluative language.
  - Because the passage describes an ongoing construction state without a reporting period, use September 2026, the latest completed month before publication, as the reportable observation period.
  - Read material delay as a consequential departure from contracted or previously announced delivery milestones across the referenced portfolio.
  - Read the debt language as a signal of unwillingness to meet obligations, not a claim that Oracle had already defaulted.
  - The dollar amounts identify the projects and their asserted scale; they do not supply an accounting basis for project expenditure.
support_condition: Contemporaneous records show substantial portfolio-level delivery delays against established milestones, and Oracle communications indicate an intention to avoid or defer payment obligations.
contradiction_condition: Contemporaneous milestone evidence establishes that the referenced portfolio remains on schedule, and the relevant communications establish routine protection of contractual rights without an indicated intention to avoid payment. Evidence settling only one component would not settle the entire claim.
measurement_requirements: Compare original contractual or announced milestones with actual completion and delivery at the same sites. Examine the notice, lease terms and debt obligations separately; distinguish contingent rent deferral from refusal to repay debt.
source_requirements: Construction records, contractual schedules, the force majeure notice and financing documents. Company statements require corroboration for actual construction progress. Use reputable reporting where private records cannot be obtained.
