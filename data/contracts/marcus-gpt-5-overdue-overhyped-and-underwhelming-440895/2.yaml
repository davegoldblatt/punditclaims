evaluator_interpretation:
  - The ordinary reading is that OpenAI as a whole had not become profitable. Net income is a reasonable measure; Marcus did not specify a loss amount or an accounting standard.
  - Use January–June 2025, the most recent completed half-year before the post, to assess the ongoing financial state. This avoids restricting the claim exclusively to April–June. The period is an evaluator choice, not an explicit commitment by Marcus.
  - Reports published after the post may establish results for this earlier period if available by the evaluation date.
  - The accounting basis remains unknown because the supplied statement neither names one nor cites financial figures. The requested money-claim rule therefore prevents a supported or contradicted classification, even where reporting supports the ordinary reading.
support_condition: Credible financial disclosures or reporting establish that OpenAI had no positive company-wide net income during the target period.
contradiction_condition: Credible financial disclosures or reporting establish positive company-wide net income during the target period.
measurement_requirements: Assess company-wide net profitability. Revenue growth, financing, valuation, cash burn, and individual product margins do not independently establish net profit or loss.
source_requirements: Prefer OpenAI financial disclosures. Credible reporting of those disclosures or reported financial results is acceptable; Marcus need not have supplied accounting terminology.
