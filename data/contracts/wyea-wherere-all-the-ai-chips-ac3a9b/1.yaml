evaluator_interpretation:
  - Assess the September 10, 2026 earnings-call statements identified in the supplied context.
  - Misleading means materially overstating usable AI capacity or obscuring a change in the capacity measure that would alter an ordinary reader's understanding.
  - Do not infer dishonest intent.
  - The target date is the statement date. Earlier load measurements are context unless they establish conditions at the time covered by Oracle's delivery claims.
support_condition: Definitions, commissioning records or customer acceptance records demonstrate that Oracle presented unready or non-AI capacity as delivered AI capacity, or materially switched measurement bases without explanation.
contradiction_condition: Matched records establish that the described AI capacity was delivered and ready for customer workloads, with internally consistent power and comparison bases.
measurement_requirements: Reconcile the 850-MW delivery claim, GPU deliveries, prior-year comparison and Abilene building deliveries. Distinguish IT capacity from facility power and actual electricity consumption.
source_requirements: The earnings-call record plus dated facility, commissioning or customer records. Company repetition of its own delivery assertion is not independent verification.
