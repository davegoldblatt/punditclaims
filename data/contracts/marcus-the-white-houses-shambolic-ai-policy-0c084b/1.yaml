explicit_source_elements:
  - all of these risks
  - were foreseeable
evaluator_interpretation:
  - Foreseeable means that the categories of harm could reasonably have been anticipated before the relevant alleged events. It does not mean that particular victims or incidents were predictable.
  - "The complaint supplies the risk categories: dangerous misinformation, assistance with violence and self-harm, unhealthy dependence, cognitive harm, privacy violations involving minors, and misleading safety claims."
  - The historical interval ends with the complaint's filing on June 1, 2026. Each warning must nevertheless precede its corresponding alleged harm, rather than merely precede the filing.
  - The supplied text and the readable post omit the quoted complaint images, leaving some uncertainty about the exact scope of 'these risks'.
support_condition: Earlier independent research or contemporaneous records establish that every material risk category within the referenced allegations was reasonably anticipated before the relevant alleged events.
contradiction_condition: Reliable evidence establishes that at least one material category depended on a development that could not reasonably have been anticipated at the relevant time. Failure to locate an earlier warning alone is insufficient.
measurement_requirements: Map each material alleged risk to a dated earlier warning and the dates of the corresponding alleged conduct or harm.
source_requirements: The filed complaint and earlier research or contemporaneous records. The complaint establishes allegations, not their truth; Marcus's own assertion cannot establish foreseeability.
