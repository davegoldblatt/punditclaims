evaluator_interpretation:
  - The plain reading excludes meaningful practical benefits to users pursuing non-sales purposes.
  - The sales exception concerns the beneficiary's use, not whether a technology supplier or publication has commercial interests.
  - For this ongoing state, I use April 2024 through the post date as the latest observable monthly period.
  - A documented accessibility benefit in a personal activity counts as help. It need not demonstrate universal reliability or net benefits to society.
support_condition: Evidence establishes that meaningful practical benefits were restricted to people pursuing sales objectives.
contradiction_condition: A documented use available during the target period provides meaningful practical help for a non-sales activity.
measurement_requirements: Identify the generative component, the beneficiary's activity and a concrete benefit beyond a promised capability.
source_requirements: Prefer direct user demonstrations or independent studies. Distinguish generative AI assistance from human volunteers and conventional recognition software.
