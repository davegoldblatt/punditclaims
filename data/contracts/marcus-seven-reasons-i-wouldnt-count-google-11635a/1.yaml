explicit_source_elements:
  - Google/Alphabet
  - hemorrhaging talent
  - morale is poor
  - their latest model is delayed
evaluator_interpretation:
  - The surrounding discussion makes Google's AI research organization the relevant workforce, especially its senior researchers. 'Hemorrhaging' means a substantial succession of important departures, without requiring a particular company-wide attrition rate.
  - "'Poor morale' means substantial reported dissatisfaction within that organization, not dissatisfaction among every employee."
  - "'Latest model' means the next flagship Gemini release, rather than every smaller model Google releases."
  - For these ongoing conditions, use the latest completed month before publication, July 2026, together with developments through August 6. This reporting window is an evaluator choice.
support_condition: Credible reporting establishes substantial senior AI departures and poor morale during the target period, and release records show that the next flagship Gemini model had missed an announced release window.
contradiction_condition: Reliable evidence establishes that one or more components were false during the target period. Evidence supporting some components and contradicting others warrants mixed.
measurement_requirements: Distinguish senior departures from total workforce attrition, employee testimony from representative surveys, and flagship release deadlines from releases of smaller models.
source_requirements: Prefer announcements and dated release records. Reputable reporting based on employees is acceptable for internal conditions when public primary records are unavailable.
