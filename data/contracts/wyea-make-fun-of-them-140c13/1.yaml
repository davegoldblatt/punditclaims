evaluator_interpretation:
  - Read 'create' as generate revenue, following the preceding revenue calculation.
  - The stated numerical threshold is $37.08 billion, calculated as one tenth of $370.8 billion.
  - Assess the comparison presented at publication, using the funding quarters and 2025 spending and revenue estimates named in context.
  - The target period spans the earliest funding quarter through the end of the projected spending year. It does not make those flows economically interchangeable.
  - The word 'requires' also implies necessity, which is not established merely by observing financing or capital expenditure.
support_condition: Comparable evidence establishes revenue below $37.08 billion and validates the $370.8 billion denominator for the stated comparison, including its attribution to generative AI.
contradiction_condition: Comparable evidence establishes revenue of at least $37.08 billion, or establishes that the claimed denominator is materially incorrect under its stated definitions.
measurement_requirements: Verify funding by quarter and distinguish funds raised from funds spent. Reconcile capex periods and AI attribution. Use a consistent revenue measure and do not equate capital expenditure with annual operating expense.
source_requirements: The underlying funding database or equivalent dated records, primary capex disclosures, and a transparent revenue inventory for the same industry boundary.
