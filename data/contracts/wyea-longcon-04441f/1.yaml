explicit_source_elements:
  - OpenAI
  - burned more than $5 billion
  - last year
  - major expenses, such as stock compensation and computing costs
evaluator_interpretation:
  - Last year means calendar 2024.
  - The surrounding passage explicitly includes noncash expenses. I therefore read burn as an economic loss, measured here by reported net loss, rather than cash consumed.
  - The accounting basis is estimate because the passage relies on press reporting rather than specifying an accounting standard.
support_condition: Reliable reporting establishes OpenAI's full-year 2024 net loss above $5 billion, including noncash expenses.
contradiction_condition: Comparable full-year reporting establishes a net loss of $5 billion or less.
measurement_requirements: A full-year net-loss figure. Revenue, gross expenditure, operating loss, and cash burn cannot substitute for net loss.
source_requirements: Financial statements or independently corroborated reporting about them. Zitron's own reporting alone is insufficient.
