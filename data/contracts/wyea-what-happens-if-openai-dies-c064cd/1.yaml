ambiguity_flags:
  - The ongoing statement names no reporting period; the latest normally reportable completed quarter is selected.
  - Compute demand could mean usage, orders, reserved capacity, or expected future requirements.
  - The words do not explicitly distinguish AI compute from all cloud compute.
  - ‘Effectively every’ allows unspecified exceptions.
  - Treatment of indirect OpenAI demand through intermediaries is unspecified.
