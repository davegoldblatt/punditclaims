explicit_source_elements:
  - representing the majority of compute demand
  - across effectively every provider
  - its existence is critical to the entire AI industry
  - everybody will probably try and chuck a few dollars its way
evaluator_interpretation:
  - The checkable observation is that OpenAI accounts for more than half of AI compute demand at all or nearly all major providers relevant to the discussion.
  - The surrounding AI infrastructure discussion makes AI compute the ordinary scope. It does not justify substituting total cloud revenue for compute demand.
  - The provider set includes Microsoft, Google, Amazon, Oracle, CoreWeave, and Cerebras; it cannot be restricted after seeing which providers disclose favorable figures.
  - For the ongoing observation, use April through June 2026, the latest completed quarter ordinarily reportable before the August 18 post.
  - The statements about industry importance and probable future funding are implications, not independent quantitative commitments scored here.
support_condition: Comparable provider-level records show OpenAI responsible for more than 50% of AI compute demand during the target quarter at all or nearly all major relevant providers.
contradiction_condition: Comparable records show OpenAI at or below 50% at several major relevant providers, establishing material exceptions inconsistent with ‘effectively every provider.’
measurement_requirements: Measure OpenAI’s share separately at each provider using a common compute-demand denominator and period. Identify direct and attributable indirect demand without double counting. Revenue, broad commercial backlog, installed capacity, and compute demand are not interchangeable.
source_requirements: Provider disclosures or independently documented customer-level capacity, usage, or orders with matching denominators. Financial concentration figures are context unless their equivalence to compute demand is established.
