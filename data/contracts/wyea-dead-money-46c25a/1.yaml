early_resolution_rule: Resolve only after the customer-loss antecedent is documented and sufficiently complete revenue and cash-flow records establish its consequences. Customer concentration alone is not an early resolving event.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Conditional forecast versus a statement of present customer exposure
  - No deadline
  - Referenced startup customer population is unspecified
  - Enterprise revenue is not defined
  - Separate-company versus combined revenue percentage
  - No period or probability measure for payment capacity
  - Compute-commitment terms and aggregation are unspecified
retrospective_or_prospective: retrospective
