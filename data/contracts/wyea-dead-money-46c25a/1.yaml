assessment_axis: forecast_outcome
explicit_source_elements:
  - Without these companies
  - Anthropic and OpenAI
  - 60% to 80% of their enterprise revenues
  - even less likely
  - $1.3 trillion in compute commitments
evaluator_interpretation:
  - "This is a conditional forecast: the referenced AI startup customers cease contributing business to the two labs."
  - The plain reading applies the approximate revenue-loss range to each lab, rather than allowing one lab's result to offset the other's.
  - The relevant denominator is enterprise revenue, not total company revenue or spending observed in a payments-platform sample.
  - A current customer-revenue breakdown could test the implied exposure, but would not by itself show the conditional outcome occurred.
  - The $1.3 trillion describes combined compute commitments. The reduced ability to pay is a causal rider, not a dated prediction of default.
support_condition: After the referenced startup customers cease contributing business, comparable records show approximately 60–80% of each lab's enterprise revenue is lost because of that departure, with reduced resources available against verified compute commitments.
contradiction_condition: After the antecedent occurs, matched records show attributable enterprise-revenue losses materially outside the stated range, or show that the claimed deterioration in payment capacity did not follow.
measurement_requirements: Company-specific enterprise-revenue denominators, identified startup customers, comparable before-and-after periods, replacement revenue, and a reconciliation of compute commitments by amount, term and cancellation rights.
source_requirements: Company accounts or reliable customer-level revenue records, evidence of the customer departures, and contractual commitment disclosures. Payments-platform samples require coverage and representativeness checks.
metric_scope:
  company: Anthropic and OpenAI
  metric: Enterprise revenue lost upon removal of referenced AI startup customers
  currency: USD
  units: Percent of each company's enterprise revenue
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
