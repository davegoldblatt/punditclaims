support_condition: The contemporaneous comparison shows improvements on several measures, with most changes amounting to only a few points on the displayed 0–100 scales.
contradiction_condition: Most displayed measures show large score changes, or the comparison fails to show improvements across several measures.
measurement_requirements: Compare the same benchmarks and prompting configurations for the two Turbo versions. Preserve accuracy versus F1 distinctions and report changes in score points.
