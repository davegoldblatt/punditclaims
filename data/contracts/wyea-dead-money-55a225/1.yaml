assessment_axis: causal_assessment
explicit_source_elements:
  - much of NVIDIA’s backlog
  - exists because
  - hyperscalers and neoclouds are stockpiling its GPUs
evaluator_interpretation:
  - The claim concerns the backlog existing when the post appeared on 2026-09-29.
  - Stockpiling means ordering GPUs to hold materially ahead of deployment, beyond ordinary installation and commissioning.
  - Much means a substantial share, without necessarily meaning a majority. The speaker supplies no numerical threshold.
  - The causal claim requires linking outstanding orders to buyers' deployment plans. Evidence of idle delivered GPUs alone would not establish the cause of NVIDIA's backlog.
support_condition: Representative order and deployment records show that a substantial share of NVIDIA's outstanding GPU orders arose from hyperscalers and neoclouds buying materially ahead of deployment.
contradiction_condition: Representative records show that stockpiling accounts for only a small share of outstanding GPU orders, with most orders tied to near-term deployment or other documented causes.
measurement_requirements: Identify the customer-order backlog, distinguish it from NVIDIA's supplier commitments and customers' cloud-contract backlogs, and match orders to delivery dates, available infrastructure, deployment schedules, and purchasing motives.
source_requirements: NVIDIA order disclosures, customer inventory and deployment records, or independent research with a disclosed representative sample and method.
