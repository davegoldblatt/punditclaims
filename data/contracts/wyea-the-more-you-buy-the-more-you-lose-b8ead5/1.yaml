  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires an irreversible event that determines applicability or the complete financial comparison. Permanent cessation of either lab would defeat the survival antecedent, not contradict the forecast. Current spending ratios, forecasts and temporary margin changes cannot establish the five-year outcome.
interpretation_determines_result: true
plain_reading: true
