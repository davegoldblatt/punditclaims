evaluator_interpretation:
  - The ordinary reading is that current generative AI systems frequently fail explicit, feasible user instructions.
  - The claim describes systems available on the post date, November 13, 2026. A dated leaderboard snapshot can describe that state; older experiments provide context.
  - Marcus supplies no model set, task distribution, comparison standard, or numerical meaning of poor. Failure on difficult constraint tests alone does not establish poor instruction following across ordinary uses.
support_condition: Independent evaluations representative of current systems and ordinary instruction-following tasks establish substantial recurring failures.
contradiction_condition: Representative independent evaluations establish consistently reliable instruction following across current leading systems.
measurement_requirements: Identify model versions, evaluation dates, task difficulty, scoring rules, and whether scores measure individual instructions or complete prompts.
source_requirements: Prefer independently run evaluations with dated results and reproducible methods. Separate vendor reports from independent measurements.
