  - it appears
  - take years to build an AI data center
  - based on every source I can see
evaluator_interpretation:
  - This is a tentative empirical generalization about typical construction time, not an unconditional assertion that every project takes years.
  - I read years as a duration of at least two years for a typical new large AI data center.
  - The surrounding discussion requires distinguishing construction-to-operation of the stated project scope from opening its first building. Later optional campus expansions should not extend the original completion date.
  - I use August 2026, the latest completed calendar month before publication, for the prevailing construction conditions. Earlier project records are context unless they establish those conditions.
  - The author's personal source access is not independently testable and is not treated as a forecast condition.
support_condition: Representative records for comparable new large AI projects establish that typical construction-to-operational-completion durations under prevailing conditions are at least two years.
contradiction_condition: Representative comparable records establish typical construction-to-operational-completion durations below two years. An isolated rapid conversion or first-phase opening is insufficient.
measurement_requirements: Identify construction start, original project scope, energization and usable compute commissioning. Separate land acquisition and permitting, physical construction, equipment installation, conversions and phased campus expansion.
source_requirements: Prefer permits, construction records, operator commissioning disclosures and independent project-level datasets. Scheduled completion dates must be distinguished from achieved dates.
