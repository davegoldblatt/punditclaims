assessment_axis: historical_observation
explicit_source_elements:
  - There is not enough demand.
  - We are overbuilding data centers.
  - compute demand existed to justify the amount of data center capacity being built
evaluator_interpretation:
  - The ordinary reading is that the AI data-center buildout exceeds commercially supportable compute demand at the time of publication.
  - "Because this describes an ongoing state, I use the latest completed half-year before publication: January through June 2026. This covers the operating market and construction pipeline then in place; it does not turn later demand into evidence about the earlier state."
  - The context includes capacity under construction and demand concentrated in the two labs. Testing only vacancy in completed buildings would therefore be incomplete.
  - Customer concentration or unprofitability alone does not establish excess capacity. Conversely, signed leases alone do not establish eventual utilization or ability to pay.
support_condition: Representative evidence shows installed and under-construction AI capacity materially exceeding credible paying demand, supported by utilization, vacancies, pricing, cancellations or comparable supply-and-demand measurements.
contradiction_condition: Representative AI-specific evidence shows that installed and under-construction capacity is matched or exceeded by credible paying demand, with utilization and pricing consistent with that finding.
measurement_requirements: Match geography, delivery dates, usable power and computing capacity. Separate AI workloads from other data-center uses, contracted space from actual compute utilization, and financed commitments from demonstrated paying demand.
source_requirements: Independent market measurements, operator utilization and leasing records, and corroborated customer commitments. Broad colocation statistics are contextual unless their coverage can be matched to the AI buildout.
