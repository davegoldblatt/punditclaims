ambiguity_flags:
  - No numerical threshold defines 'trusted'.
  - "'A few months' has no exact starting date; January 1 is the evaluator's interpretation."
  - The conclusion concerns current use, but newly published studies can evaluate older models and data.
  - The surrounding text names Nature Medicine twice despite saying 'four journals'.
