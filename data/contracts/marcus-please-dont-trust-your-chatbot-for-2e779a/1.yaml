assessment_axis: historical_observation
explicit_source_elements:
  - Four studies
  - in four journals
  - published in the space of a few months
  - reaching essentially the same conclusion
  - especially when used by amateurs
  - simply cannot be trusted
evaluator_interpretation:
  - Read 'cannot be trusted' as insufficient reliability for unsupervised medical decisions, not as saying every answer is wrong.
  - Read 'four journals' as four distinct journals.
  - Interpret 'a few months' as January 1 through the April 21, 2026 post. The target is the recent publication of converging findings; it is not a claim that the experiments all occurred during those months.
  - Assess the medical conclusion against the tasks, models and users actually studied. Do not extrapolate their error rates to every medical question.
support_condition: Four papers published during the target period in four distinct journals report findings that converge on material reliability problems for unsupervised medical decisions, including evidence involving lay users.
contradiction_condition: Publication records contradict the number of studies, distinct journals or timing, or the studies establish reliable unsupervised medical use contrary to the claimed convergence. If the medical convergence holds but a bibliographic component fails, propose mixed.
measurement_requirements: Check publication dates and journal identities, study populations, tasks, model versions, measured errors and authors' conclusions. Distinguish lay-user experiments from tests using prepared clinical scenarios.
source_requirements: The four papers or their publisher-supplied abstracts and bibliographic records. Include relevant methodological counterevidence available by the evaluation date.
