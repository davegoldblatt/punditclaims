explicit_source_elements:
  - Any further price increases or service degradations
  - from Anthropic and OpenAI
  - a sign that they’re running low on cash
evaluator_interpretation:
  - Assess whether subsequent price increases or service degradations reliably indicate cash pressure at the company concerned.
  - Running low on cash means difficulty funding near-term obligations, rather than merely having losses or seeking additional investment.
  - Treat the statement as a causal diagnostic claim, not a prediction that either company will fail by a particular date.
  - No cash threshold, accounting basis, or financial reporting period is specified.
support_condition: Dated service or pricing changes are linked by financial records or direct disclosures to inadequate cash for near-term obligations.
contradiction_condition: A qualifying change occurs while matched financial and operational records establish adequate liquidity and an explanation independent of cash pressure.
measurement_requirements: Match each change to the same company's contemporaneous available cash, obligations, and explanation. Distinguish cash shortages from capacity shortages and accounting losses.
source_requirements: Primary pricing records, incident reports, financial statements, or direct disclosures; independently sourced reporting where primary records are unavailable.
