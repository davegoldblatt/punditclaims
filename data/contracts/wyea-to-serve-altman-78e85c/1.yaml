  end: "2023"
  precision: year
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Five years refers to the 2019–2023 reporting comparison, not five elapsed years ending on the post date.
  - Massively has no numerical worldwide threshold.
  - Thanks to AI does not specify the attributable fraction.
  - AI and generative AI are not identical categories.
