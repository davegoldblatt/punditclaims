assessment_axis: causal_assessment
explicit_source_elements:
  - artificial intelligence (driven by generative AI)
  - already massively increasing global emissions
  - Google
  - emissions increase by 48% in the last five years
  - thanks to AI
evaluator_interpretation:
  - Assess the reported 2019–2023 emissions comparison, the five annual observations underlying the report available before the post.
  - Read thanks to AI as asserting a substantial causal contribution, without requiring AI to be the only cause.
  - Read massively increasing global emissions as a substantial worldwide emissions effect, not merely higher electricity use or a large percentage change at one company.
  - Treat the numerical increase and its causal attribution as separate components.
support_condition: Evidence confirms Google's approximately 48% increase from 2019 to 2023 and establishes that AI materially caused it, alongside a substantial worldwide emissions increase attributable to AI.
contradiction_condition: Comparable emissions records refute the reported increase, or credible attribution evidence establishes that AI did not materially cause the asserted corporate and worldwide increases.
measurement_requirements: Comparable greenhouse-gas inventories and attribution separating AI from other computing, supply-chain growth and electricity-supply changes.
source_requirements: Google's environmental disclosures for the numerical component; credible causal measurement for the AI-specific and worldwide components.
