explicit_source_elements:
  - OpenAI needs at least $800 billion
  - to meet its commitments
  - in the next three-and-a-half years
  - projected $750 billion in compute spend through 2030
  - an analysis of analyst notes
evaluator_interpretation:
  - This is an assertion about commitments already existing when the post was published, rather than a prediction that OpenAI will sign additional commitments.
  - "The target period is the stated payment window: August 18, 2026 through February 18, 2030. The surrounding heading instead names the end of 2030; both readings must be checked."
  - Needs means gross payments required to satisfy the commitments, before subtracting revenue or existing cash. It does not mean additional fundraising required.
  - The accounting basis is estimate because the author expressly relies on press reporting and analyst estimates.
support_condition: Dated contracts, payment schedules, or a sufficiently complete and documented estimate establish at least USD 800 billion of nonduplicated payments required within the stated window under commitments existing at publication.
contradiction_condition: A sufficiently complete account of those commitments establishes that required payments within the stated window total less than USD 800 billion. A smaller subtotal or spending projection alone does not suffice.
measurement_requirements: Separate binding commitments from planned expenditure. Identify payment dates, cancellation rights, capacity conditions, and overlapping cloud, chip, and infrastructure amounts. Test the literal February 2030 endpoint and the contextual December 2030 endpoint separately.
source_requirements: Prefer contracts, filings, and counterparty disclosures. Analyst estimates require their underlying assumptions and payment schedules; the speaker's own calculation is not independent evidence.
