evaluator_interpretation:
  - "The plain reading concerns general-purpose generative chatbots available when Marcus wrote: factual fabrication remains a possibility, including with retrieval."
  - Always a risk does not mean every answer is wrong or establish an immutable limit on every future chatbot.
  - Because no reporting period is specified, use the current calendar quarter through publication, April 1–June 28, 2025.
support_condition: Contemporary evaluations document factual hallucinations in general-purpose chatbot models, including systems supplied with retrieved information.
contradiction_condition: Broad, credible evaluations establish that contemporary general-purpose chatbots reliably eliminate factual fabrication across their intended uses, including difficult questions and incomplete retrieved information.
measurement_requirements: Distinguish factual fabrication from refusals, stylistic problems and merely incomplete answers. Benchmark rates must not be presented as population-wide conversation rates.
source_requirements: Dated primary model evaluations or reproducible independent tests. Retrieval-enabled systems should be examined explicitly.
