  - '"since the beginning of 2022"'
  - '"around $265 billion in capital expenditures"'
  - '"added around $320 billion in assets to its properties, plants and equipment"'
  - '"to bring around $50 billion of GPUs online"'
  - "\"used broad, vague language to make it seem like it's been far more productive\""
evaluator_interpretation:
  - The whole sentence is framed by "it appears that". The speaker presents an inference from his own analysis, not a firm statement of fact.
  - The central point, that only about $50 billion of GPUs came online and that Microsoft's wording was meant to make it look more productive, is his own estimate about undisclosed amounts and about intent. Microsoft does not report a dollar value of GPUs in service.
  - The capex figure is only an input to his inference. Scoring that figure alone would not test what he actually claimed, which is the gap between spending and GPUs brought online.
  - Under the register's policy, a claim hedged this way, with no firm commitment, is not scored. It is recorded as not adjudicable.
support_condition: Not scored. It could only be supported if a primary source disclosed that Microsoft's GPUs in service were worth about $50 billion against about $265 billion of capex since 2022, and showed that its capacity language was meant to hide this. The hedge means the speaker did not commit to that.
contradiction_condition: Not scored. It could only be contradicted if a primary source showed Microsoft's GPUs in service were worth far more than about $50 billion, or that its capex since 2022 was far from about $265 billion. The hedge means the speaker did not commit to either figure as fact.
measurement_requirements: None, because the claim is not scored. A score would need Microsoft's disclosed dollar value of GPUs in service, which Microsoft does not publish.
source_requirements: Microsoft 10-K and 10-Q filings and earnings materials. Analyst estimates alone would not settle the value of GPUs online.
