  - Every major cloud provider has no exhaustive membership definition.
  - Much revenue has no numerical threshold or explicit denominator.
  - Benefitting can mean revenue, profit, cost savings or operational improvement.
  - Infrastructure suppliers can also integrate and sell AI applications.
  - The statement combines revenue, spending and benefit measures.
