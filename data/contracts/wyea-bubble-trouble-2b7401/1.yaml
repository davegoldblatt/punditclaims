assessment_axis: historical_observation
explicit_source_elements:
  - companies benefitting from AI aren't the ones integrating it or even selling it
  - those powering the means to use it
  - every major cloud provider
  - building out massive data center efforts
  - AI isn't actually contributing much revenue at all
evaluator_interpretation:
  - Assess the conjunction of financial-benefit exclusivity, infrastructure expansion and providers' descriptions of AI revenue.
  - The minimum named comparison set is Amazon, Microsoft and Google. Passing that set would not by itself establish every major provider.
  - The plain reading of little revenue is a small contribution relative to each provider's cloud business, given the surrounding discussion.
  - Use October–December 2023 for reported financial performance, the latest completed calendar quarter normally public before the post. Early-2024 investment announcements supply context.
  - The surrounding passage cites company earnings statements, so the revenue basis is company_reported.
  - The claim also concerns spending and benefits, which require separate measurements; they cannot be inferred from the revenue measure alone.
  - Yet to prove its necessity is an evaluative qualification, not a separate measurable financial threshold.
support_condition: Comparable records establish that financial benefits were confined to infrastructure suppliers, while every major provider was expanding data centers and describing AI revenue as a small contribution.
contradiction_condition: Relevant records establish financial benefit for an AI integrator or seller, or show a major provider explicitly reporting a substantial AI revenue contribution or not undertaking the asserted expansion.
measurement_requirements: Separate recognized revenue, growth contributions, annualized run rates, investment commitments and realized profit. Identify the denominator for any description of revenue as small.
source_requirements: Prefer provider earnings transcripts, financial disclosures and dated investment announcements, with separate evidence for non-infrastructure benefits.
