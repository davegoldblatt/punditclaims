assessment_axis: historical_observation
explicit_source_elements:
  - basically no safeguards
  - actually in place
evaluator_interpretation:
  - The ordinary reading is that deployed contemporary generative-AI systems had essentially no substantive measures intended to reduce harmful behavior or misuse.
  - Safeguards include implemented refusal training, deployment restrictions, monitoring, and controls informed by safety testing. A policy announcement or future research plan alone does not count.
  - A safeguard need not eliminate all failures to exist, but it must be an implemented control addressing an identifiable risk.
  - For this ongoing observation, the evidence window is the current calendar quarter through publication, January 1–March 30, 2023. This approximates the contemporary state, rather than a quarterly average.
support_condition: Contemporary deployment records and testing show essentially no implemented risk-reduction controls, or show that claimed controls were merely planned or nominal.
contradiction_condition: Major deployed systems demonstrably incorporated substantive controls addressing identified risks, even if those controls could fail or be bypassed.
measurement_requirements: Distinguish implemented measures from promises, and distinguish safeguard existence from their reliability across all risks. Identify whether effectiveness claims are developer-reported or independently tested.
source_requirements: Dated deployment documentation and primary testing records, including independent counterevidence where available.
