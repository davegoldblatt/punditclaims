explicit_source_elements:
  - Neither of these companies
  - can actually afford this compute
  - Anthropic and OpenAI
evaluator_interpretation:
  - I assess the normalized affordability proposition. The separate prediction about when the data center will exist is outside this claim.
  - Afford means being able to meet contractual compute payments when due using available funds, committed financing and operating cash flows, while meeting other obligations.
  - It does not require holding the entire nominal value of every multiyear contract in cash immediately, or funding all payments from current revenue alone.
  - Both companies must satisfy the claimed inability for full support. Their resources and obligations must be assessed separately.
  - "For this ongoing financial state, I use the latest completed calendar quarter before the post: April–June 2026. Later publications may describe that period, but later transactions are context only."
  - The sentence specifies no accounting basis or quantified coverage measure. The contract therefore records accounting_basis as unknown.
support_condition: For each company, a matched schedule of available resources and enforceable compute payments demonstrates a funding shortfall, or documented nonpayment due to insufficient funds establishes the claimed inability.
contradiction_condition: For at least one company, matched financial records demonstrate that available resources and committed funding cover the relevant payment schedule and other obligations. A funding announcement alone does not suffice.
measurement_requirements: Reconcile unrestricted cash, accessible financing, operating cash flows, other liabilities and compute-payment schedules. Separate conditional funding, projected revenue, annualized revenue and nominal multiyear commitments.
source_requirements: Prefer financial statements, binding financing agreements and supplier contracts. Estimates must disclose their basis. An unknown accounting basis prevents a supported or contradicted monetary verdict under the specified rules.
