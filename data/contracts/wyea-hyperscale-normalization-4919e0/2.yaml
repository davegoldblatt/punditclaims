evaluator_interpretation:
  - "'This compute' refers to the Lambda/Hut 8 data-center capacity for Anthropic and, more broadly, to the large compute deals Anthropic and OpenAI have signed."
  - The plain reading of 'can't afford' is that, around the post date, neither company could cover these commitments from its own revenue and cash without continued outside financing.
  - A stricter reading is that they will be unable to pay. That is a future question and is not tested here.
  - The period is the state of affairs around the post date (August–September 2026). This is the evaluator's choice, because the sentence gives no period.
support_condition: Evidence from around September 2026 shows each company's committed compute spending far exceeds its revenue plus cash on hand, so that it depends on new financing to pay, and the claim's own sense of 'afford' is accepted.
contradiction_condition: Evidence shows either company could pay its compute commitments from its own cash flow and cash on hand, without needing new outside financing.
measurement_requirements: Compute commitments compared with revenue, cash, cash flow and committed funding for OpenAI and Anthropic.
source_requirements: Company filings (such as Anthropic's IPO prospectus) and reputable reports of company projections.
