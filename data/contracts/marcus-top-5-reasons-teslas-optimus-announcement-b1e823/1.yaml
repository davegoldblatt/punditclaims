evaluator_interpretation:
  - The ordinary reading is that meeting publicly announced technology-project deadlines is exceptional across Musk's projects, not merely that some prominent projects were late.
  - Consider deadlines that had fallen due by September 29, 2022. The statement supplies no starting year.
  - Repeated revisions of one project's deadline must be distinguished from separate projects. A collection selected only for failures cannot establish the claimed frequency.
support_condition: A sufficiently representative record of Musk's public technology-project deadlines and corresponding delivery dates shows that on-time delivery was exceptional.
contradiction_condition: A sufficiently representative record shows that meeting deadlines was reasonably common. An isolated success is insufficient because 'almost never' allows exceptions.
measurement_requirements: Identify the original promise, deadline, promised milestone, actual completion date, and treatment of revised deadlines. Include successes and failures across projects.
source_requirements: Prefer original announcements and dated delivery records. Retrospective reporting must distinguish promises due before publication from later promises.
