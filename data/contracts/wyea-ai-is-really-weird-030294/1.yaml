evaluator_interpretation:
  - Use 2026 Q1, the latest completed quarter before publication, for this ongoing-state observation.
  - Compare the total cost, setup burden, and task reliability of OpenClaw with ordinary chatbot tools attempting comparable work.
  - Read 'private space' as a secured, user-controlled execution environment. The sentence does not claim that every installation requires a Mac Mini.
  - Read 'very poorly' as frequent material failures across the email, calendar, browsing, and document tasks named in context.
  - This concerns users' product operating costs, not a company's financial accounts; metric_scope is null.
support_condition: Contemporaneous deployment documentation and representative comparisons establish the stated requirements, substantially higher cost and complexity, and frequent material task failures.
contradiction_condition: Contemporaneous documentation or representative comparisons refute a material component, such as the asserted deployment alternatives or generally poor task performance. Merely showing that a Mac Mini is optional does not refute the entire deployment disjunction.
measurement_requirements: Match tasks, underlying models, completion standards, retries, human intervention, API charges, and hosting costs. Separate benchmark scores from verified end-to-end success.
source_requirements: Versioned installation documentation and reproducible comparative evaluations from the target period. Marketing demonstrations alone cannot establish general reliability.
