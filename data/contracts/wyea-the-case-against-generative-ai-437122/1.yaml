evaluator_interpretation:
  - The ordinary reading is that there are no other established applications with a clear practical purpose and credible usefulness. It does not require complete job replacement or universal reliability.
  - Because the statement describes a current state without a reporting period, the target is September 2025 through publication. Product availability can be reported contemporaneously.
  - Earlier technical and effectiveness evidence can explain an application, but only evidence of its existence in the target period is treated as outcome evidence.
support_condition: Evidence shows that established, clearly useful LLM applications are effectively confined to coding, with apparent non-coding examples remaining speculative or ineffective.
contradiction_condition: A substantial non-coding LLM application is operating during the target period and has a clear practical function supported by credible evidence of usefulness.
measurement_requirements: Identify an actual LLM application, its deployed function, and evidence of practical usefulness. Adoption alone does not establish effectiveness.
source_requirements: Dated deployment records and technical documentation, supplemented by measured outcomes where available.
