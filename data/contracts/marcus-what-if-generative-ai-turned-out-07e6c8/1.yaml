evaluator_interpretation:
  - Assess the grounds for expecting a solution that existed when Marcus wrote, rather than whether hallucinations subsequently disappeared.
  - The ordinary reading of a solution is dependable factual answers across ordinary search queries. Improvements on selected tasks alone do not establish that.
  - Research has no fixed reporting cycle. Use the latest completed day before publication as the snapshot of publicly available knowledge; earlier experiments are contextual evidence.
  - Neither a numerical error tolerance nor a duration for 'soon' is supplied.
support_condition: Contemporaneous research establishes substantial unresolved barriers and provides a sufficiently comprehensive basis for concluding that no demonstrated approach justified expecting a practical solution in the near term.
contradiction_condition: Research available before publication demonstrates a broadly effective solution, or a validated approach with concrete grounds for expecting near-term deployment that would resolve the practical search problem.
measurement_requirements: Distinguish factual accuracy from citation support. Examine broad search-query coverage, remaining errors, replication, and deployment readiness.
source_requirements: Research and documented evaluations publicly available before the post. Later results cannot establish what grounds existed in August 2023.
