explicit_source_elements:
  - at least ten ways
  - many subtle
  - the image
  - neither matches the prompt nor what we would expect from the world
evaluator_interpretation:
  - Count distinct, defensible discrepancies in the particular image published with the post.
  - A discrepancy may concern either prompt adherence or ordinary physical expectations. Allow the explicitly fictional unicorn premise.
  - Do not automatically count multiple descriptions of the same defect separately. Artistic choices require justification before counting them as errors.
  - The target is the image as published on January 29, 2024; its generation date is unspecified.
support_condition: Inspection of an authenticated image and its complete prompt establishes at least ten distinct discrepancies under the stated counting rules.
contradiction_condition: A sufficiently complete independent audit establishes fewer than ten defensible discrepancies. Merely failing to identify ten is insufficient.
measurement_requirements: The full-resolution image, complete prompt, and an annotated discrepancy list addressing overlap, perspective, lighting, anatomy, and artistic license.
source_requirements: The original generation record or an authenticated reproduction, supplemented by independent inspection. Marcus's answer key cannot establish its own correctness.
