evaluator_interpretation:
  - The ordinary reading concerns dependable completion of publicly promoted tasks, rather than an inability to complete even one task.
  - Use the latest completed calendar quarter before publication, 2026 Q1, for this ongoing technological claim. Earlier tests and later product improvements cannot establish performance in that period.
  - Assess Operator, AI browsers, and the broader agent claim separately. Success by another browser agent does not establish Operator's performance.
  - The source supplies neither a task population nor an acceptable failure rate. Do not invent a numerical reliability threshold.
support_condition: Representative, reproducible tests during the target period show persistent failure to complete the ordinary tasks promoted for the named products, with substantial intervention required.
contradiction_condition: Representative tests during the target period show dependable completion of those tasks across the named products and relevant agent applications.
measurement_requirements: Record product versions, tasks, success criteria, repeated attempts, human interventions, failures, and task-selection methods.
source_requirements: Prefer reproducible independent evaluations. Vendor benchmarks may establish narrower capabilities but require scrutiny of task selection and scoring.
