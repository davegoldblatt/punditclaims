evaluator_interpretation:
  - “They” means OpenAI. The surrounding discussion concerns frontier model capabilities at GPT-5's launch.
  - The plain reading of a clear technical lead is a broad, substantial capability advantage over leading competitors. It does not require winning every benchmark.
  - "The target period is August 7–9, 2025: the launch-era state described in the post and the latest period for which comparative results were publicly reportable."
  - Benchmark first place alone does not establish a substantial overall advantage. Losing one benchmark alone does not establish its absence.
support_condition: Representative contemporaneous comparisons show close or divided performance across major capability areas, without a broad, substantial OpenAI advantage.
contradiction_condition: Representative contemporaneous comparisons show OpenAI consistently and substantially ahead across major capability areas.
measurement_requirements: Compare launch-era model versions and reasoning configurations. Examine margins, uncertainty, coverage and evaluation conditions, rather than ranks alone.
source_requirements: Prefer independent evaluators' dated results. Separate vendor claims and later evaluations from launch-era measurements.
