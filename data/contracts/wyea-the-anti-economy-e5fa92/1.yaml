explicit_source_elements:
  - OpenAI makes $1.6 billion a year in revenue
  - the company is far from sustainable
evaluator_interpretation:
  - Assess the normalized claim about OpenAI's revenue and financial sustainability. The separate explanation of Altman's chip fundraising is not treated as established causation.
  - Financial sustainability ordinarily means that revenue can cover ongoing business costs without repeated outside funding. It does not mean that eventual failure is certain.
  - A year in revenue ordinarily denotes realized annual revenue. The post links to reporting about annualized revenue, making the distinction material rather than interchangeable.
  - Use calendar 2023, the latest completed annual period before publication. The linked press figure makes estimate the relevant accounting basis.
support_condition: Comparable records establish approximately USD 1.6 billion in realized 2023 revenue and a substantial continuing gap between business income and costs.
contradiction_condition: Comparable records establish materially different realized annual revenue or establish that ongoing operations were financially self-supporting.
measurement_requirements: Separate realized revenue from annualized run rate; distinguish net loss, operating loss, cash burn, financing, and infrastructure commitments.
source_requirements: Prefer consolidated company accounts. Where unavailable, use clearly attributed reporting on financial records or company statements and identify its limitations.
