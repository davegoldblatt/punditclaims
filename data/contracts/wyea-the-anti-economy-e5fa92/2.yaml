assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI makes $1.6 billion a year in revenue
  - the company is far from sustainable
evaluator_interpretation:
  - The present-tense revenue figure means an approximately $1.6 billion annualized revenue rate. The post links to reporting explicitly describing annualized revenue.
  - The ordinary financial reading of 'far from sustainable' is that revenue falls substantially short of covering the company's ongoing business and development costs, leaving it dependent on outside funding.
  - This is not a prediction of bankruptcy or a claim that OpenAI could never become profitable.
  - For the ongoing financial state, use October–December 2023, the latest completed calendar quarter before publication. Within that quarter, assess the reported current revenue rate, not realized quarterly or calendar-year revenue.
  - The selected proposition concerns OpenAI's financial sustainability. The surrounding assertions about Altman's motives and industry-wide profitability are outside this assessment.
support_condition: Reliable evidence establishes the reported annualized revenue rate and a substantial contemporaneous shortfall between revenue and the costs of sustaining OpenAI's operations and development.
contradiction_condition: Reliable evidence establishes that OpenAI was covering, or close to covering, those costs from its business revenue. A materially different annualized revenue figure would challenge the numerical component, but would not by itself disprove the sustainability assessment.
measurement_requirements: Keep annualized revenue separate from realized sales. Assess costs, losses and cash needs over comparable periods. Do not equate financing with revenue, or a loss with immediate insolvency. No numerical meaning for 'far' was supplied.
source_requirements: Prefer company financial records. Where unavailable, use attributable financial reporting and identify estimates and missing accounting details. Later publications may establish historical facts, but later-period losses cannot establish the earlier financial state.
