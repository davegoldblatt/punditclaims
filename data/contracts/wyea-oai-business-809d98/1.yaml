explicit_source_elements:
  - at some point
  - will have to work out a way to go public
  - absolutely no reason to invest
  - unless
  - offload your shares in a future secondary sale
evaluator_interpretation:
  - There is no deadline.
  - I distinguish preparing an IPO from completing a public listing.
  - The secondary-sale clause is an exception to the claimed investment rationale, not a separately observable trigger that must occur before assessment.
  - The full proposition includes both a future listing requirement and the assertion that other investment rationales are unavailable. A filing alone cannot establish both.
support_condition: A completed public listing would establish the listing outcome. Supporting the full necessity claim would additionally require evidence that investors outside the secondary-sale exception depended on that route for returns.
contradiction_condition: Documented durable investor returns through another route, without dependence on a future listing or secondary sale, would contradict the asserted necessity.
measurement_requirements: Separate an IPO filing, a completed listing, secondary liquidity, operating partnerships, and realized investment returns.
source_requirements: Company disclosures, securities filings, or reliable reporting establishing listing events and any alternative investor-return mechanism.
metric_scope: null
original_horizon: at some point
horizon_interval:
  start: 2024-10-02
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A completed listing can settle the listing component; a demonstrated durable alternative return route can refute the exclusive necessity claim. Preparatory filings and intentions alone do not settle the full proposition.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Work out a way could mean preparing an IPO rather than completing one.
  - No deadline is supplied.
  - Absolutely no reason could include strategic commercial benefits or refer only to financial exits.
  - A listing's occurrence does not establish its necessity.
retrospective_or_prospective: retrospective
