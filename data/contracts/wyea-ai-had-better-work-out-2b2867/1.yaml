assessment_axis: forecast_outcome
explicit_source_elements:
  - If demand wavers
  - NVIDIA, Broadcom, Micron, AMD
  - any associated silicon or hardware counterparties
  - revenue growth stumble
  - a brutal knock-on effect on their stocks
evaluator_interpretation:
  - Demand means hyperscaler and neocloud purchases of AI chips and associated hardware, as specified by the surrounding paragraph.
  - Wavering means a documented weakening in purchasing demand, rather than a stock-price decline, financing concern, or supply constraint alone.
  - Revenue growth stumbling means a material slowdown in comparable reported revenue growth; revenue need not fall outright.
  - A brutal stock effect means a substantial adverse share-price response attributable to that demand and revenue deterioration.
  - The named companies must be assessed separately. One supplier's experience cannot establish the prediction for all four.
support_condition: After the purchasing-demand condition occurs, all four named suppliers show material revenue-growth deterioration and substantial associated stock declines, with evidence connecting the changes to that demand weakness.
contradiction_condition: A completed, well-documented demand downturn affects the named suppliers, but a named supplier clearly sustains its revenue growth or avoids the predicted substantial stock damage after the downturn's financial effects become observable.
measurement_requirements: Dated order, cancellation, utilization, or customer-purchase evidence; comparable supplier revenue-growth figures; and adjusted share-price performance around the demand news and subsequent financial reporting. Separate demand weakness from supply restrictions and unrelated market movements.
source_requirements: Customer and supplier disclosures for the condition and revenue outcomes, supplemented by market records and reputable reporting on the reasons for price movements.
metric_scope:
  company: NVIDIA; Broadcom; Micron; AMD; associated silicon and hardware suppliers
  metric: Revenue growth, with associated share-price effects assessed separately
  currency: null
  units: percentage change
