explicit_source_elements:
  - driverless cars
  - edge cases
  - it’s still a serious problem
  - As yet there is no generalizable solution
evaluator_interpretation:
  - The claim describes the state of driverless driving at the post. Endlessly is part of the retrospective warning, not a separately scored infinite forecast.
  - A serious problem means unfamiliar scenarios can still cause material safety or operational failures.
  - No generalizable solution means no validated, broadly transferable solution had removed the difficulty across unfamiliar driving situations. It does not require literal zero risk.
  - The current state is assessed using the latest partial calendar year, January 1 through December 11, 2024, because incidents and technical evaluations are reported continuously.
  - The assessment concerns the supplied technical proposition, not whether Marcus first issued the warning in 2016.
support_condition: Contemporaneous safety records and technical evaluations show material failures in unusual driving situations and continuing limits to generalization across such situations.
contradiction_condition: A validated approach demonstrates robust transfer across materially varied unfamiliar driving situations, with evidence that edge cases no longer pose a serious operational or safety problem.
measurement_requirements: Distinguish fixes for particular hazards from broad generalization. Consider actual incidents alongside controlled tests and real-world safety performance.
source_requirements: Primary recall records, driving evaluations and operator safety disclosures. A single incident alone cannot establish the absence of a general solution.
