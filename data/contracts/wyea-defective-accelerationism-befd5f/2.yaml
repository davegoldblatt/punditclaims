assessment_axis: forecast_outcome
explicit_source_elements:
  - AI startups require too much money
  - are all unprofitable
  - make up around 80% of Anthropic and OpenAI’s revenues
  - the bottom will eventually fall out from both of them
  - at some indeterminate time
evaluator_interpretation:
  - This is an unconditional prediction with an asserted explanation. The revenue concentration and unprofitability assertions are premises, not an if-clause that suspends assessment.
  - The ordinary reading of 'the bottom will eventually fall out' is a severe collapse in the companies' revenue base and resulting financial viability, caused materially by their startup customers becoming unable to sustain spending.
  - Read 'around 80%' as approximately four-fifths of each company's total revenue, rather than their combined revenue or enterprise revenue alone. No numerical tolerance is supplied.
  - Support requires the predicted outcome at both companies and evidence connecting it to the stated mechanism. A collapse at only one company would establish only part of the prediction.
  - The speaker supplies neither an accounting basis nor a measurement period for the revenue share. Do not substitute annualized revenue, financing, or valuation changes.
support_condition: Comparable customer-revenue records establish approximately the claimed dependence on unprofitable AI startups, and subsequent records show a severe collapse at both companies materially caused by those customers failing or cutting spending.
contradiction_condition: Decisive evidence establishes that the predicted mechanism cannot produce the claimed outcome at at least one company. Evidence disproving the revenue or profitability premise counts against that premise, but continued growth for a finite period does not refute an eventual forecast without a deadline.
measurement_requirements: Customer-level revenue classifications and profitability evidence, comparable realized revenue series for each company, and evidence linking customer failures or spending reductions to the collapse. Establish the accounting basis before scoring any financial measurement decisively.
source_requirements: Prefer filings, company financial disclosures, customer records, and insolvency records. Use clearly attributed reporting where private-company records are unavailable. Causal attribution needs more than simultaneous declines.
metric_scope:
  company: Anthropic and OpenAI, assessed separately
  metric: Share of total revenue supplied by AI startup customers
  currency: null
  units: percent
  accounting_basis: unknown
  fiscal_or_calendar: unknown
