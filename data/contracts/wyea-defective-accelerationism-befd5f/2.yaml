  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve positively only after a documented severe collapse at both companies with the stated customer-dependence mechanism established. Resolve negatively only on a dated event that definitively forecloses that mechanism at at least one company. Ordinary growth, fundraising, share-price declines, or the passage of time are insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - "'The bottom will fall out' supplies no numerical severity threshold."
  - AI startup population and profitability measure are unspecified.
  - Revenue-share period, accounting basis, and tolerance around 80% are unspecified.
  - The wording does not explicitly distinguish separate-company shares from a combined share.
