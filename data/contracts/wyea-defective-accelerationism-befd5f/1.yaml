  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Support requires the antecedent plus documented customer-driven collapse at both companies. A crisis at only one company is insufficient. Contradiction requires a definitive event ending the stated causal exposure for at least one company without the predicted collapse.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Around 80% has no stated tolerance or measurement period.
  - Both companies versus a combined revenue denominator is not explicit; each is the adopted reading.
  - Startup membership and profitability measures are unspecified.
  - The bottom falling out has no numerical threshold.
  - Because states a causal premise rather than an explicit if-clause.
retrospective_or_prospective: retrospective
