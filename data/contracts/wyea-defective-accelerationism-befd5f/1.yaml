assessment_axis: forecast_outcome
explicit_source_elements:
  - AI startups
  - are all unprofitable
  - around 80% of Anthropic and OpenAI’s revenues
  - the bottom will eventually fall out from both
  - at some indeterminate time
evaluator_interpretation:
  - The antecedent requires approximately 80% of each company's total revenue to come from unprofitable AI startups.
  - Customer concentration, enterprise spending and usage-based revenue are different measures from revenue attributable to unprofitable AI startups.
  - The bottom falling out means a severe, sustained collapse in revenue or business viability caused by those customers failing or cutting purchases.
  - Because the supplied claim is conditional, the forecast is scored only after its revenue-dependence premise is established.
  - No numerical tolerance for around 80%, or collapse threshold, is added.
support_condition: After establishing the stated dependence for both companies, records show a severe and sustained collapse at both attributable to failures or spending cuts among those startup customers.
contradiction_condition: After establishing the antecedent, definitive evidence shows at least one company permanently escaped that dependence and remained viable through the alleged customer-failure mechanism, or completed a solvent wind-down without the predicted collapse.
measurement_requirements: Revenue by customer type for each company, total recognized revenue for the same period, profitability of the relevant customers, and later revenue and customer-loss records.
source_requirements: Prefer company customer-revenue disclosures and financial statements. Payment-platform samples must disclose their coverage and cannot automatically represent total company revenue.
metric_scope:
  company: Anthropic and OpenAI, assessed separately
  metric: Share of total revenue from unprofitable AI startups
  currency: null
  units: percent
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
