evaluator_interpretation:
  - Assess the reported English-input pipeline on the 50 benchmark entries, not a permanent ceiling on future systems.
  - Translation success is a necessary intermediate result, not proof of downstream solving.
  - The target period is the February 2025 experiment report; 2000–2024 identifies the source problems, not the evaluation date.
  - Original competition problems and split benchmark entries must be counted consistently.
support_condition: Matching per-entry results establish that no more than 30 of the 50 benchmark entries could pass the reported English-input pipeline, including correct formalization and solving.
contradiction_condition: Matching results establish more than 30 correctly solved benchmark entries from English statements using the described pipeline.
measurement_requirements: A mapping from original problems to the 50 benchmark entries, successful automatic formalizations, and downstream solving outcomes. A failed derivation of the ceiling alone does not prove the ceiling false.
source_requirements: The original experiment report or author-released item-level results for the same system and benchmark.
