  - aren’t very good at following those instructions
  - Explicit verbal instruction
  - Even now
evaluator_interpretation:
  - This concerns the instruction-following reliability of LLMs available when the post appeared, not later models.
  - Use 2023-01-01 through 2023-09-27 as the observation window for the current generation discussed. Model capability has no standard reporting period; this window is an evaluator choice.
  - Verbal instruction means natural-language directions, including written prompts.
  - The plain reading is that contemporary leading models frequently missed clear instructions, limiting dependable use. It does not require failure on most simple requests.
  - The employee-training comparison supplies context; it is not separately assessed.
support_condition: Reproducible evaluations of contemporary leading LLMs show frequent, material failures to follow clear natural-language directions across multiple tasks.
contradiction_condition: Broad evaluations show consistently reliable compliance with clear natural-language directions across representative tasks, with failures uncommon.
measurement_requirements: Distinguish instruction compliance from factual accuracy and reasoning. Identify models, testing periods, task selection and scoring rules. Do not invent a numerical meaning for 'not very good'.
source_requirements: Use primary evaluations with disclosed tasks and methods. Later publications may supply retrospective evidence only when their results concern models and capabilities within the target period.
