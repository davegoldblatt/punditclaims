explicit_source_elements:
  - AI will “solve physics”
  - make major breakthroughs in medicine, battery technology, etc
  - so far none of that has materialized
evaluator_interpretation:
  - Assess the absence of achieved advances through October 5, 2024, rather than whether future promises eventually succeeded.
  - Read 'none' as a categorical denial across the named examples; one qualifying major advance defeats that denial.
  - The ordinary broad reading of a breakthrough in medicine includes a major, demonstrated advance in basic medical research. It does not require an approved treatment.
  - Require demonstrated scientific achievement and independent recognition of its importance. A proposed application or routine benchmark improvement is insufficient.
  - This reading is contestable because the surrounding discussion concerns delivered societal benefits.
support_condition: Evidence establishes that the named promised advances remained prospective, with no demonstrated major advance qualifying under the stated medical-research reading.
contradiction_condition: At least one demonstrated, independently recognized major advance in a named domain had occurred by publication.
measurement_requirements: Separate scientific achievements from prospective clinical applications, and require substantial evidence that an achievement is major.
source_requirements: Original research establishes the achievement; independent scientific recognition establishes its significance. Later awards must not be treated as prepublication events.
