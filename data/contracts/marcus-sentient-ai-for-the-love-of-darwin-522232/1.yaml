  - control LLMs
evaluator_interpretation:
  - In the surrounding discussion of unintended consequences, the plain reading is that developers could not reliably keep general-purpose LLM behavior within intended constraints, including when users tried to bypass safeguards.
  - The statement does not specify a failure rate. Repeated, documented failures across different constraints would support this reading; an isolated factual error would be insufficient.
  - The statement describes the current situation. I use August 1–21, 2023, the elapsed portion of the publication month. LLM safety evaluations have no standard reporting quarter.
  - This reading concerns reliable behavioral control. A literal claim that humans had no ability whatsoever to influence or restrict LLM outputs would require a different assessment.
support_condition: Evidence about the target period documents repeated failures to enforce intended behavioral constraints in contemporary LLMs, including successful attempts to bypass safeguards.
contradiction_condition: Broad evaluations of contemporary LLMs establish reliable enforcement of intended constraints, including under adversarial prompting, and show that the alleged failures did not apply to those systems.
measurement_requirements: Identify the tested systems or model population, the intended constraints, successful violations, and important limitations of the tests. Do not treat attack success rates as ordinary-use failure rates.
source_requirements: Prefer contemporary research and firsthand observations, or later primary analyses explicitly examining tests conducted during the target period.
