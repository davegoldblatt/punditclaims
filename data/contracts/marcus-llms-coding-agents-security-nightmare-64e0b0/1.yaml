original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Chaos is a metaphor with no measurable scale.
  - High agency and ease of manipulation have no numerical thresholds.
  - The surrounding disaster language could be read more broadly than the specific causal risk assessed here.
retrospective_or_prospective: retrospective
