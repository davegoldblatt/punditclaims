evaluator_interpretation:
  - Assess the model announced in the week preceding publication, against American models available then.
  - The ordinary reading of 'largely on a par' is broadly comparable capability across representative tasks. It does not require winning every benchmark.
  - The download statement describes an announced future release, not a claim that weights were already downloadable on July 20.
  - Free means no charge for the weights or ordinary local use; it does not mean free hardware or unrestricted commercial licensing.
support_condition: Release documentation establishes the promised local-use terms, and representative independent comparisons show broadly comparable capability against the leading American models available at announcement.
contradiction_condition: The promised consumer access is unavailable on those terms, or representative comparisons establish a substantial general capability deficit against the contemporary American frontier.
measurement_requirements: Dated comparisons using the same benchmark versions, comparable reasoning settings and disclosed harnesses. Isolated task wins and later leaderboard ranks are insufficient.
source_requirements: Official release and licensing records, supplemented by independent evaluations tied to the launch model and contemporary competitors.
