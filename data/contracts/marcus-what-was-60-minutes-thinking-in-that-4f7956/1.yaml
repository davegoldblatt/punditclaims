evaluator_interpretation:
  - The ordinary behavioral reading is that substantial apparent competence depends on familiar patterns and breaks down on meaningful variations.
  - A lot means substantial, not necessarily a majority; no numerical threshold is imposed.
  - Mimicry is not treated as a claim that every output is copied or that no reasoning occurs.
  - Use July–September 2023, the latest completed calendar quarter before publication, as the reporting window.
support_condition: Broad controlled comparisons show that a substantial portion of apparent competence depends on familiar patterns and fails on comparable unfamiliar variations.
contradiction_condition: Representative controlled comparisons show dependable transfer across unfamiliar variations, with little dependence on familiar task patterns.
measurement_requirements: Compare familiar tasks with meaningful variations, control difficulty and instructions, and establish how broadly the results apply. Performance degradation alone does not identify the complete internal mechanism.
source_requirements: Primary studies comparing contemporary language models across familiar and unfamiliar task conditions.
