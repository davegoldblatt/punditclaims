explicit_source_elements:
  - Anthropic and OpenAI
  - both burning billions of dollars
  - by my estimates
  - no more than $2 billion and $6.26 billion
  - in 2025 so far
  - projections of $5 billion and $13 billion respectively
evaluator_interpretation:
  - The revenue amounts map respectively to Anthropic and OpenAI.
  - 2025 so far means January 1 through September 29, 2025, the publication date.
  - The main metric scope records realized revenue. Cash burn and the existence of the stated full-year forecasts are separate components requiring their own measures.
  - Burning billions means at least $2 billion of net cash consumption per company during the stated year-to-date period; it does not mean accounting net losses.
  - The description seem a little lethargic is subjective commentary and is not separately graded.
  - The basis is estimate because Zitron expressly labels the figures his estimates. The treatment of reseller revenue is not specified.
support_condition: Comparable records establish revenue through September 29 of no more than $2 billion for Anthropic and $6.26 billion for OpenAI, cash burn of at least $2 billion each, and the stated contemporaneous full-year forecasts.
contradiction_condition: Comparable records establish that either company exceeded its revenue ceiling by September 29, that either cash-burn assertion is false, or that the stated forecast was materially misrepresented. A partial-period figure below a ceiling cannot establish the full-period ceiling.
measurement_requirements: Realized revenue and net cash consumption through the publication cutoff, with reconciled accounting definitions. Full-year forecasts must be distinguished from annualized run rates.
source_requirements: Prefer dated company financial records. Clearly attributed reports may establish estimates when original private-company disclosures are unavailable.
