explicit_source_elements:
  - amateurs using large language models to write code
  - build products that would have previously required teams of engineers
  - complex apps in the real world
  - the code they wrote would be hard to maintain
  - Customers are finally figuring that out.
evaluator_interpretation:
  - Assess the present observation reaffirmed in the post, rather than an indefinite forecast attributed to earlier posts.
  - The scope is code produced by amateurs using LLMs to build substantial products. It does not encompass AI-assisted programming generally.
  - The ordinary reading of 'hard to maintain' is substantial difficulty understanding, fixing, or extending the resulting code while preserving existing functionality.
  - Treat this as a general tendency, not a claim that every such project is unmaintainable. No comparison with well-engineered human code is required.
  - No reporting period is specified. Use the current month through the day before publication, 2025-10-01 through 2025-10-21, as the latest pre-post observation window. Earlier experiences and later observations provide context unless they establish the state during that window.
support_condition: Empirical studies or documented maintenance histories show recurring substantial difficulty fixing or extending substantial amateur-built, vibe-coded products during the target period, with sufficient coverage to support the general tendency asserted.
contradiction_condition: Evidence covering the same population, product scope, and period shows that fixing and extending these codebases is generally manageable without substantial maintenance difficulties. An isolated successful project would not by itself contradict the general tendency.
measurement_requirements: Identify the builders' amateur status, their reliance on LLM-generated code, the applications' scope, and actual maintenance tasks. Relevant observations include repeated unsuccessful fixes, regressions when adding features, extensive restructuring, or abandonment because the code cannot practically be changed. Code-quality measures are useful only when connected to maintenance difficulty in this population.
source_requirements: Prefer empirical research and inspectable project histories. Firsthand accounts may contribute, but their selection and scope must be clear. General AI-coding studies, initial-build demonstrations, and expert opinion alone cannot settle this claim.
