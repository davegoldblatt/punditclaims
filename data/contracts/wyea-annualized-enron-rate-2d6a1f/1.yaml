assessment_axis: causal_assessment
explicit_source_elements:
  - what big businesses are or are not using Claude or ChatGPT
  - the underlying revenues of these companies
  - held up by venture capital by proxy
evaluator_interpretation:
  - The plain reading is substantial dependence by both providers on startup customers whose token purchases require continuing venture financing.
  - Held up means dependence material to maintaining revenue, not merely that some customers have venture investors.
  - The latest completed quarter before publication, July through September 2026, is the evaluation window for the current causal relationship; this is an evaluator choice.
  - The context relies on reported figures and sampled spending estimates, so the accounting basis is estimate.
support_condition: Representative customer revenue and funding records show that both providers materially depend on startup token purchases financed by venture capital rather than the startups' own customer receipts.
contradiction_condition: Comparable records show that venture-financed startup purchases are immaterial to maintaining either provider's revenue, or that the relevant startup purchases are substantially self-funded from customer receipts.
measurement_requirements: Revenue shares by customer type; actual token purchases; startup operating receipts and financing flows; evidence separating venture-funded subsidies from ordinary profitable procurement.
source_requirements: Provider customer ledgers and startup financial records, or a representative independently validated dataset covering the same revenue population.
