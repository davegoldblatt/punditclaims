assessment_axis: historical_observation
explicit_source_elements:
  - a fully-functional, secure, and useful app
  - made entirely by someone who cannot code
  - You won't be able to find this as it isn't possible.
evaluator_interpretation:
  - Read as an impossibility claim about applications existing at publication on 2025-08-25.
  - A qualifying app must perform its intended tasks, have demonstrated practical use, and meet reasonable security requirements for its intended deployment. Secure does not mean mathematically immune to every possible vulnerability.
  - Entirely means that no programmer supplied application-specific implementation or repairs. Using ordinary libraries, hosting, and platform services is allowed.
  - Independent validation is an evidentiary requirement added by the evaluator, not a requirement Zitron explicitly stated.
support_condition: Evidence establishing that the specified development process could not produce a qualifying app with the tools available at publication. Failed examples or an unsuccessful search alone cannot establish impossibility.
contradiction_condition: One documented app meeting all requirements at publication, with credible evidence of its builder's lack of coding ability, complete build history, useful functionality, and independent security validation.
measurement_requirements: Validate the same app version's functionality and security against its intended use. Establish who implemented and repaired it, including any outside programming assistance.
source_requirements: Traceable build records and independent functionality and security assessments. Vendor testimonials can identify candidates but cannot establish every requirement.
