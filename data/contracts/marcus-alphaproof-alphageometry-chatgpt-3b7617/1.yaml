explicit_source_elements:
  - Rather than reasoning through the problem
  - which LLMs literally don't do
  - it retrieves an answer to a slightly different problem
  - that answer is wrong
  - reworked car-accident riddle (Colin Fraser example)
evaluator_interpretation:
  - "The claim has three parts: (a) ChatGPT's answer to Fraser's reworked riddle was wrong; (b) it produced the answer by retrieving the answer to the classic riddle; (c) LLMs in general 'literally don't' reason."
  - Part (a) rests on a screenshot in the post. The speaker's own post cannot be cited as evidence that he was right, and no independent record of that exact output was found.
  - Part (b) is a claim about the internal mechanism of a closed model on one output. Outsiders cannot observe that mechanism.
  - Part (c) depends on what counts as 'reasoning'. The speaker gives no definition, and researchers disagree on this point. So there is no ordinary plain reading that evidence could settle.
  - "Target period: LLMs as of the post, from GPT-2 (2019) to July 2024, following the post's own framing."
support_condition: Would be supported if an accepted, operational definition of reasoning existed and independent tests showed LLMs of that era do none of it and only reproduce memorized answers to familiar problems.
contradiction_condition: Would be contradicted if, under an accepted definition of reasoning, independent tests or mechanistic analyses showed LLMs of that era performing genuine multi-step reasoning on novel variants.
measurement_requirements: An agreed operational definition of 'reasoning' and access to the model's internal computation for the specific output. Neither exists.
source_requirements: Peer-reviewed or preprint studies of LLM behaviour on altered familiar problems; mechanistic interpretability studies.
