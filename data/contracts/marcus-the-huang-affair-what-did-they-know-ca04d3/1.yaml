explicit_source_elements:
  - China undoubtedly wanted Nvidia chips
  - Jensen Huang seems to have supportive of this
evaluator_interpretation:
  - Read China as Chinese customers seeking Nvidia chips, without assuming that every Chinese authority supported their import.
  - Read Huang's apparent support as publicly favoring sales to Chinese customers. This does not imply support for smuggling or espionage.
  - Use the preceding year discussed in the surrounding account of Huang's continuing relationships and lobbying. The exact starting day is an evaluator convention.
support_condition: Evidence establishes Chinese customer demand and public statements or actions by Huang supporting chip sales to those customers during the described period.
contradiction_condition: Reliable evidence establishes that the asserted customer demand was absent or that Huang opposed the sales attributed to him. Restrictions on particular products alone do not contradict support for some sales.
measurement_requirements: Distinguish customer demand from government import policy, and lawful sales advocacy from illicit conduct.
source_requirements: Company statements, recorded interviews, customer records, or reliable reporting of demand and Huang's position.
