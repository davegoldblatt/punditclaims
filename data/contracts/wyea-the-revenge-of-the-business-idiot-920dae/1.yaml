explicit_source_elements:
  - Salesforce
  - spent millions of dollars on advertising and marketing
  - a product that doesn’t exist in the way that it’s being sold
evaluator_interpretation:
  - The product is Agentforce, identified by the surrounding discussion of customer demonstrations.
  - Read 'millions' as at least two million US dollars spent on Agentforce promotion cumulatively by publication.
  - Read the capability allegation as a material mismatch between demonstrated current customer functionality and actual availability. It does not assert that every Agentforce feature is nonexistent.
  - The spending period has no stated beginning. Availability is assessed as of publication.
  - The surrounding Bloomberg attribution supplies a reporting context, but no accounting basis is identified for the spending assertion itself.
support_condition: Reliable records establish the stated Agentforce-specific promotional spending and show that material capabilities represented as deployed or presently available were not available as represented.
contradiction_condition: Comparable records establish spending below the threshold, or establish that the disputed capabilities were available as represented. Clearly disclosed future demonstrations would not establish the alleged mismatch.
measurement_requirements: Separate Agentforce promotion from Salesforce-wide sales and marketing expenses. Compare the exact demonstrations and their disclaimers with customer deployment records at publication.
source_requirements: Product-specific expenditure records or credible attributed estimates, original promotional material and customer deployment evidence. Independent reporting may establish deployment facts unavailable in primary records.
