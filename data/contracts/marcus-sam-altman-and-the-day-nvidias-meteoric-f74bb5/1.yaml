ambiguity_flags:
  - Neither 'increasingly' nor 'rely' has a specified measure or comparison baseline.
  - The observation window is inferred from the surrounding August-to-February discussion.
  - Announced arrangements and completed financing are materially different.
  - The industry could mean leading model developers and their suppliers or the entire AI sector.
  - A stronger reading requiring an increasing share of realized industry financing would remain unresolved.
