assessment_axis: historical_observation
explicit_source_elements:
  - AI data centers
  - requiring billions in upfront funding
  - operating costs so high
  - at best, run at a loss for the first five or six years of service
  - if they ever recover their original costs at all
evaluator_interpretation:
  - This is a general claim about facility economics, not a claim about one named operator's consolidated accounts.
  - The plain reading of run at a loss is negative periodic profit after relevant costs. It is distinct from taking several years to recover the initial investment.
  - At best is an asserted lower bound, not a conditional antecedent. A comparable facility achieving sustained profit before five years would challenge it.
  - I use the first quarter of 2026, the latest completed financial quarter before the post, as the reporting reference for the ongoing claim. Testing the duration also requires each facility's earlier operating history.
  - No accounting basis is identified. I do not silently substitute GAAP net income, adjusted EBITDA or a modeled capital-recovery period.
  - Ruinously expensive is evaluative; the checkable components are upfront funding and the asserted minimum loss duration.
support_condition: Comparable facility accounts establish multibillion upfront funding and losses throughout at least the first five years, with representative coverage sufficient to support the general claim.
contradiction_condition: Reliable accounts for a comparable AI data center establish sustained profit before its fifth service anniversary, on the same identified accounting basis; representative cost records could also contradict the asserted general upfront funding requirement.
measurement_requirements: Facility commissioning dates, construction and equipment costs, revenues, operating expenses, depreciation, financing costs and periodic profit. Keep accounting profit, cash flow and cumulative capital recovery separate.
source_requirements: Facility-level accounts and operating histories with an explicit accounting basis. Consolidated operator accounts and modeled payback estimates are contextual unless reconciled to the facility claim.
