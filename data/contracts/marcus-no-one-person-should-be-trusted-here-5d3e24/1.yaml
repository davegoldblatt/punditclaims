explicit_source_elements:
  - the original arrangement
  - everything that the for-profit did was supposed to be in the service of the non-profit
  - A board with no financial interest
  - look out for humanity
evaluator_interpretation:
  - The original arrangement means the 2019 creation of the capped-profit subsidiary, rather than OpenAI's earlier nonprofit founding.
  - The claim concerns the structure's intended purpose and safeguards, not whether it subsequently achieved its mission.
  - The plain reading of 'a board with no financial interest' is that its members were required to lack financial stakes in the subsidiary. A weaker reading would mean that financially disinterested directors controlled conflicted decisions.
support_condition: The original rules subordinated the subsidiary to the nonprofit's humanity-serving mission and required a financially disinterested board.
contradiction_condition: The original rules gave commercial interests priority, removed nonprofit control, or permitted directors to hold financial stakes. Different findings on these components warrant a mixed assessment.
measurement_requirements: Distinguish an entirely financially disinterested board from a disinterested majority and restrictions on conflicted voting.
source_requirements: OpenAI's original structural explanation and official descriptions of the arrangement.
