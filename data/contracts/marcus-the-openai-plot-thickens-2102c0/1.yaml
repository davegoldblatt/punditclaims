assessment_axis: historical_observation
explicit_source_elements:
  - An awful lot of key players
  - have left the island
  - Most voluntarily
evaluator_interpretation:
  - The island means OpenAI. Context concerns the recent departure cluster during 2024 through August 6.
  - Key players means founders, executives, research leaders, and prominent safety researchers identified in contemporaneous reporting.
  - Many means a substantial group across those roles, without imposing an invented numerical minimum.
  - Most means more than half of the identified departure group.
  - Voluntary means publicly described as resigning, quitting, or choosing another position. It does not establish that the person was happy or faced no pressure.
  - Temporary leave and internal reassignment are excluded from the departure count.
support_condition: Contemporaneous records identify a substantial group of prominent departures, with reported voluntary departures exceeding firings and departures of unknown type combined.
contradiction_condition: The alleged departure group is not substantiated, or reliable records show that at least half of its departures were involuntary.
measurement_requirements: Build a named roster, identify each person's role, classify departure circumstances, and retain unknown cases in the denominator.
source_requirements: Use firsthand announcements and contemporaneous reporting. Do not infer voluntariness merely from a departure.
