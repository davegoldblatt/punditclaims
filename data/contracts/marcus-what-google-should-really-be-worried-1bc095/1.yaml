evaluator_interpretation:
  - Truthiness means presenting plausible-sounding factual answers that can be wrong.
  - Chat-style search includes conversational tools presented as ways to obtain information from the web, including the newly announced Bard.
  - The checkable core is the existence of public factual-reliability problems. The statement of uncertainty does not predict a permanent capability ceiling.
  - Use February 1–12, 2023, the publication month's current launch-and-demonstration period, ending on the post date.
support_condition: Public demonstrations or testing in the target period document clear factual errors in conversational information-retrieval products.
contradiction_condition: The alleged errors are shown to be correct answers or misattributions, and credible contemporary evidence establishes that the claimed factual-reliability problem was absent.
measurement_requirements: Identify a dated product response and a verifiable factual error. Do not infer an overall error rate or permanent limitation from isolated examples.
source_requirements: Prefer original demonstrations and company disclosures; use reputable reporting when the original response is not readable in the primary source.
