assessment_axis: historical_observation
explicit_source_elements:
  - isn’t becoming “better”
  - measurable using anything other than benchmarks invented specifically for generative AI
  - only makes money through massive subsidies, FOMO and executive ignorance
evaluator_interpretation:
  - Becoming better means improvement over time in practical outcomes, such as completion time or output quality, beyond scores on AI-specific benchmarks.
  - Evidence that AI users outperform nonusers at one point in time does not by itself establish improvement across model generations.
  - Only makes money is read as a claim that commercial demand lacks an independently demonstrated economic basis outside the named mechanisms, not as a precise net-income assertion.
  - For the ongoing state without a named period, I use the latest completed calendar quarter before publication, January–March 2026. Earlier measurements serve as comparison context.
  - The exclusive explanation of revenue has a causal component, but the main assessable proposition is the asserted absence of measurable practical improvement.
support_condition: Credible comparisons over time find no practical improvement outside excluded benchmarks, and evidence establishes that the listed mechanisms exhaust the economic explanation for commercial receipts.
contradiction_condition: Reliable comparisons show practical improvement over time outside AI-specific benchmarks, or documented commercial economics establish an independent basis for revenue beyond the named mechanisms.
measurement_requirements: Comparable tasks and quality standards across periods or model generations; account for selection, learning, changing workflows and self-reporting. Economic evidence must distinguish customer returns from provider profitability.
source_requirements: Prefer independent longitudinal measurements and documented commercial results. Vendor testimonials, self-reports and AI-specific benchmark gains are insufficient on their own.
