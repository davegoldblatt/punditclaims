evaluator_interpretation:
  - Read originally as the founding planning and commitments in 2015.
  - The referenced changes concern nonprofit framing, openness and freedom from financial-return requirements.
  - Distinguish an option being contemplated from its adoption, and distinguish contemplating a commercial structure from contemplating abandonment of public benefit.
  - Use the founding year through the post date for this historical comparison.
support_condition: Contemporaneous records establish that the referenced changes fell outside the founders' original plans and contemplated options.
contradiction_condition: Founding records explicitly anticipate the referenced changes. Anticipation of only one component is counterevidence but does not by itself settle the complete claim.
measurement_requirements: Compare contemporaneous planning records with the particular commitments later changed. Silence in a public announcement is insufficient to establish that an option was never envisioned.
source_requirements: Dated founding correspondence, governing documents or reliable testimony about original plans. Later disclosures may establish earlier facts, with their provenance stated.
