explicit_source_elements:
  - pure LLMs
  - under carefully controlled circumstances
  - massive amounts of directly relevant data
  - never really get even the most basic linear functions
  - complete, abstract, reliable representation
  - The LLM never induces such an algorithm.
evaluator_interpretation:
  - Read as a claim about capabilities demonstrated by the post date, not a forecast that learning will remain impossible forever.
  - "The context makes reliable extrapolation central: success on unseen examples within the training range alone does not contradict the claim."
  - Operationally, learning requires consistently correct answers across substantially longer inputs or other meaningful departures from training coverage, with evidence of a reusable rule. A few successful examples are insufficient.
  - Pure LLMs means learned language models producing answers without an external calculator, executed program, or symbolic arithmetic module. Whether specialized arithmetic transformers with an additional attention-calibration procedure qualify remains ambiguous.
  - Assess elementary arithmetic in the context supplied, including multiplication. Do not replace this with an easier test of approximate linear regression merely because the sentence says linear functions.
  - The target is the state of published capabilities through 2023-10-19. No beginning date is supplied, and this research claim has no standard quarterly reporting period.
support_condition: Controlled studies show that relevant pure LLMs still fail reliable extrapolation despite extensive arithmetic training. Supporting the categorical claim additionally requires evidence broad enough to justify its generalization beyond particular tested models; MathGLM failures alone are insufficient.
contradiction_condition: A qualifying pure LLM existing by the post date demonstrably learns a reusable elementary arithmetic rule from data and reliably applies it substantially beyond training coverage. Within-range accuracy alone, an external arithmetic engine, or a different model class does not suffice.
measurement_requirements: Identify model architecture, training procedure, arithmetic-data volume, training input ranges, test ranges, exact-answer accuracy, and any external computation or attention-calibration procedure. Examine performance across increasing lengths rather than a single held-out score. No numerical reliability threshold was supplied by the speaker.
source_requirements: Primary experimental reports with disclosed methods and results. Later publications may establish historical facts, but later-created capabilities are context only.
