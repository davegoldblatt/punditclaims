explicit_source_elements:
  - pure LLMs
  - even under carefully controlled circumstances
  - massive amounts of directly relevant data
  - never really get even the most basic linear functions
evaluator_interpretation:
  - Assess the empirical assertion about learning, excluding the normative recommendation about trust.
  - Read learning ordinarily as reliable performance on unseen examples, not a proof of correctness for every possible input.
  - Basic linear functions include addition and subtraction as functions of their numeric inputs. Multiplication by a fixed constant is also linear; unrestricted two-input multiplication is not jointly linear.
  - Pure LLM means the model produces the answer without executing an external calculator or program. Arithmetic training data do not make the model a hybrid.
  - Use the latest public research snapshot before the post, ending 2023-10-19. This field has no regular reporting interval, so the start is unspecified rather than an invented quarter.
  - The training circumstances describe the claimed scope, not a forecast antecedent.
support_condition: Controlled evidence establishes failure to learn basic linear functions reliably across the claimed class of pure LLMs despite extensive relevant training.
contradiction_condition: At least one contemporaneous pure LLM trained on extensive relevant data reliably evaluates a basic linear function on unseen examples without external computation.
measurement_requirements: Separate held-out generalization from memorization, and distinguish reliable performance over a tested domain from perfect extrapolation to arbitrary input lengths.
source_requirements: Primary experiments available before the post, identifying the model, training data, evaluation split, and absence of external answer computation.
