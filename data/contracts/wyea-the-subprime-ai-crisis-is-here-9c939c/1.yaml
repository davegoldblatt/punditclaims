assessment_axis: forecast_outcome
explicit_source_elements:
  - At some point
  - the cost of doing business with Anthropic and OpenAI will kill AI startups
  - no point at which any of them become sustainable
  - in turn kill the revenue from selling access to their models
evaluator_interpretation:
  - The context identifies AI application startups dependent on these companies' paid models, rather than every company using AI.
  - The ordinary reading predicts broad business failure caused by model costs, followed by collapse of the associated model-access revenue at both labs.
  - Sustainable means an ongoing business able to cover its costs, including model costs, without continual funding of operating losses. Positive gross margin alone is insufficient.
  - The predicted causal sequence is part of the forecast, not a separate conditional antecedent.
  - No financial accounting basis is stated. The contract therefore records it as unknown rather than imposing GAAP or a press-estimate basis.
support_condition: Records establish broad failure of the relevant startups because of model-access costs, followed by collapse of the labs' associated model-access revenue attributable to those failures.
contradiction_condition: Verified durable sustainability of an in-scope model-dependent startup would refute the universal assertion that none can become sustainable. Temporary revenue growth or positive gross margins alone would not settle the forecast.
measurement_requirements: Startup operating results including model expenses, evidence identifying causes of failure, and comparable realized model-access revenue attributable to these customers at each lab.
source_requirements: Prefer financial statements, closure or insolvency records, supplier contracts and customer-level revenue disclosures. Funding announcements and annualized revenue estimates cannot substitute for operating sustainability.
