explicit_source_elements:
  - Sora
  - isn’t so much a tool to make movies
  - a slot machine
  - footage that may or may not be of any use at all
evaluator_interpretation:
  - The ordinary reading is that obtaining usable requested shots was unpredictable and required repeated generation and selection. The metaphor does not mean that Sora never produced useful footage.
  - Assess the early preview workflow discussed in the post, from its February 2024 introduction through publication. This is the relevant reporting window for an unreleased product, rather than a financial quarter.
  - Successful edited films limit the criticism but do not by themselves establish reliable shot generation.
support_condition: First-hand production records show that requested content, camera movement or continuity was unreliable, requiring repeated attempts, selection or corrective work.
contradiction_condition: Representative production records show that the contemporary preview reliably delivered requested usable shots and continuity without substantial unpredictable retries.
measurement_requirements: Production accounts distinguishing generated footage from selected footage and explaining failures, retries and corrections. Ordinary editing alone does not establish unreliability.
source_requirements: Contemporaneous filmmaker accounts or production records; company demonstrations may provide counterevidence but cannot establish typical reliability alone.
