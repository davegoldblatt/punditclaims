evaluator_interpretation:
  - "Assess the concrete observation embedded in the cautious wording: the cited series showed a recent decline in reported AI use among large firms."
  - Use July 1 through September 7, 2025 to encompass the two preceding months and the publication date.
  - The relevant measure is the series used in Apollo's chart, not all measures of enterprise AI adoption.
  - A declining point estimate supports 'hints'; it need not establish a statistically significant or permanent reversal.
  - The claim does not establish that OpenAI's revenue declined or that firms abandoned AI because of disappointment.
support_condition: The contemporary Apollo presentation of Census data shows declining reported AI use among its large-firm category during the stated recent period.
contradiction_condition: The cited series instead rises throughout the period, or the alleged decline results from misidentifying the measure or firm category.
measurement_requirements: Identify the survey question, large-firm category, observation period, and smoothing used in the cited chart. Separate point-estimate direction from statistical significance.
source_requirements: Prefer Census data, with Apollo's original chart and accompanying explanation acceptable for establishing what the cited presentation showed.
