assessment_axis: forecast_outcome
explicit_source_elements:
  - If Anthropic kills Cursor through aggressive rent-seeking
  - directly eats into its own revenues
  - If Anthropic lets Cursor succeed
  - clearly unprofitable revenue
evaluator_interpretation:
  - "There are two conditional branches: Cursor's demise caused by Anthropic's pricing, and Cursor's continued commercial success while using Anthropic."
  - For the success branch, success means continued substantial customer adoption and commercial scale, not necessarily Cursor's own profitability.
  - Lets Cursor succeed is read as continued coexistence, not a claim requiring proof of Anthropic's private intentions.
  - Unprofitable revenue ordinarily means receipts from Cursor fail to cover costs attributable to serving Cursor. Company-wide losses cannot establish this.
  - The success condition is met under this commercial reading. The demise branch has not been established.
  - The claim specifies neither a cost-allocation method nor an accounting basis.
support_condition: For an established demise branch, customer records show lost Anthropic revenue caused by the pricing-induced closure. For an established success branch, matched Cursor receipts and attributable costs show a negative contribution.
contradiction_condition: An established success branch produces a nonnegative contribution from Cursor, or reliable causal records show the claimed revenue effect did not follow an established pricing-induced demise.
measurement_requirements: Customer-level realized revenue, attributable inference and service costs, relevant channel fees, and a stated allocation method for shared costs. The demise branch additionally requires evidence of causation.
source_requirements: Anthropic customer-level accounts, contracts, invoices, or independently verified financial reporting. Cursor's revenue and profitability are not substitutes for Anthropic's customer margin.
metric_scope:
  company: Anthropic
  metric: Profit or loss attributable to revenue from Cursor
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
