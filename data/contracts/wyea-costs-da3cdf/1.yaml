early_resolution_rule: A completed accounting period with reliable customer-level revenue and attributable costs can settle the success branch. A documented pricing-induced closure and its realized revenue effect can settle the demise branch. Neither event settles the other branch automatically.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Success has no stated threshold.
  - Unprofitable could mean negative contribution, gross margin, or fully allocated profit.
  - Two separate conditional branches are combined in one claim.
  - The accounting basis and allocation of training costs are unspecified.
