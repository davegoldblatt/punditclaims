assessment_axis: forecast_outcome
explicit_source_elements:
  - not unreasonable to expect
  - from this year
  - around $250m each quarter
  - $1bn annually
  - service this loan
  - regardless of the balloon payment size
evaluator_interpretation:
  - This year means calendar 2025, the first year expressly covered by the forecast.
  - Servicing DDTL 1.0 means cash principal repayments plus cash interest payments on that facility.
  - The wording expresses an expectation rather than certainty. The reasonableness of the original forecast is distinct from whether its numerical outcome occurred.
  - "For around, use a generous 20% band: $800 million to $1.2 billion annually, with the quarterly figures tested separately if available."
  - The phrase regardless of the balloon payment size does not create an antecedent that must occur.
support_condition: Facility-specific disclosures show approximately $1 billion of principal and interest payments during 2025, with approximately $250 million per quarter where quarterly payments are disclosed.
contradiction_condition: Facility-specific 2025 payments fall materially outside that range. A full-year total below $800 million is sufficient to contradict the annual forecast.
measurement_requirements: Use cash payments, including any capitalized interest actually paid. Subtract pre-2025 cumulative payments from end-2025 cumulative payments; do not use total-company debt service or interest expense.
source_requirements: CoreWeave filings disclosing payments specifically on DDTL 1.0.
