assessment_axis: historical_observation
explicit_source_elements:
  - CoreWeave
  - does not have enough money for its capital expenditures
  - lost over $300m
  - in the last quarter
  - year-over-year growth was 420%
  - It doesn't matter
  - because
evaluator_interpretation:
  - The latest quarter means the quarter ended March 31, 2025.
  - The loss is read as the company's reported net loss; growth is read as reported quarterly revenue growth against the corresponding prior-year quarter.
  - The numerical clauses appear to refer to company-reported results. The source does not explicitly name GAAP or an adjusted accounting basis.
  - The ongoing funding statement is assessed using the latest reported quarter, with subsequent pre-publication financing treated as context.
  - "'Enough money' ordinarily includes usable cash and available financing, subject to their restrictions and payment dates. Cash alone is not an adequate test."
  - "'Doesn't matter because' is read as a claim that investors discount the financial weaknesses because of revenue growth, without treating one stock-price movement as proof of investor motives."
  - The single metric_scope represents a compound financial claim. The individual loss, growth, liquidity, and spending measures must remain separate; no single component establishes the whole.
support_condition: The latest quarterly loss exceeds USD 300 million, quarterly revenue growth rounds to 420%, usable funding is insufficient for the relevant capital payments, and evidence supports the claimed investor disregard attributable to growth.
contradiction_condition: A matched financial record disproves a numerical clause or establishes adequate usable funding for the relevant capital payments; alternatively, strong evidence disproves the stated investor-response mechanism.
measurement_requirements: Compare net loss with net loss and realized quarterly revenue with the same prior-year quarter. Assess cash stocks, operating cash flows, undrawn financing, restrictions, capital-payment schedules, and other obligations separately. Do not equate annual capex guidance with currently due cash expenditure.
source_requirements: Company quarterly disclosures and financing agreements for the financial clauses; independent market evidence for investor response and its causes.
