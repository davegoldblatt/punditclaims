assessment_axis: historical_observation
explicit_source_elements:
  - CoreWeave
  - does not have enough money for its capital expenditures
  - lost over $300m in the last quarter
  - year-over-year growth was 420%
evaluator_interpretation:
  - The financial assertions are assessed separately within this compound claim. 'It doesn't matter' is commentary about market priorities, not a separately measurable financial result.
  - "'Last quarter' means January–March 2025. Growth means revenue growth against January–March 2024."
  - Funding adequacy describes the position at publication, including financing and changes in cash availability disclosed between March 31 and May 21. It is not restricted to quarter-end cash.
  - The ordinary funding reading compares resources actually available, including usable committed borrowing, with capital expenditures when payment is required. It does not require all future expenditure to be held in cash immediately.
  - The target interval encompasses the quarterly observations and the subsequent funding position. The contract metric scope describes funding adequacy; quarterly earnings are separately scoped contextual components.
support_condition: The latest quarter shows net loss above $300 million and approximately 420% revenue growth, and a dated funding reconciliation shows that resources available at publication were insufficient for the relevant capital expenditures when payable.
contradiction_condition: Comparable quarterly results contradict either numerical assertion, or a dated reconciliation establishes sufficient available funding for the capital expenditures covered by the assertion.
measurement_requirements: Distinguish unrestricted cash, restricted cash, drawable facilities, announced financing, future operating receipts, expenditure commitments and payment dates. Do not equate annual expenditure guidance with an immediately payable bill.
source_requirements: Company financial statements, borrowing agreements and financing disclosures available by publication; later records may clarify that historical position.
