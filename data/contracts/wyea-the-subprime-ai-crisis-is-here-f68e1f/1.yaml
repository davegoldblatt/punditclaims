assessment_axis: forecast_outcome
explicit_source_elements:
  - Any reduction in capex from big tech
  - a sign that the AI bubble is bursting
  - NVIDIA’s continued growth only comes from
  - Microsoft, Google, Amazon, Meta, Oracle and other large companies
  - tens of billions of dollars of servers from Taiwanese ODMs like Foxconn and Quanta
evaluator_interpretation:
  - Read the condition as a subsequent reduction in actual capital spending or a like-for-like annual spending forecast at a named company. A pure accounting reclassification is distinguished from a reduction in expected expenditure.
  - A lower annual forecast caused by delayed capacity deliveries qualifies as lower planned spending, even if the company intends to spend the money later.
  - Read 'bubble is bursting' as a broad, sustained contraction in AI investment and valuations, with deterioration in NVIDIA's growth, rather than a single delayed project.
  - Assess the exclusive-growth explanation separately as context; it cannot by itself settle the future conditional.
  - No deadline, response lag, valuation index or contraction threshold is supplied.
support_condition: A qualifying capex reduction occurs and credible subsequent evidence establishes that it signals a broad AI investment and valuation contraction, including deterioration in NVIDIA's growth. Customer and sales-channel records support the stated dependence.
contradiction_condition: A qualifying reduction is demonstrated to reflect an independent cause while sustained subsequent evidence establishes continued broad AI expansion, providing a clear counterexample to the asserted universal signal.
measurement_requirements: Compare the same company's spending or guidance on the same accounting and lease-treatment basis. Separate annual guidance, quarterly spending and AI-specific spending. Test NVIDIA revenue growth and ultimate customer attribution separately from direct distributor or ODM sales.
source_requirements: Company capex disclosures, NVIDIA filings and customer data, and independently measured AI investment and valuation trends. A forecast reduction alone establishes only the condition.
metric_scope:
