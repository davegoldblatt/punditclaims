condition_status: met
early_resolution_rule: Resolve early only upon a documented qualifying cut and conclusive evidence linking it to a broad contraction, or a clear counterexample supported by sustained subsequent expansion. A single quarter or the absence of a collapse by an invented deadline is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Reduction' does not distinguish actual expenditure, guidance revisions or accounting changes."
  - "'Big tech' is an open-ended company group."
  - "'AI bubble is bursting' supplies no measure or response lag."
  - "'Only' could refer to all NVIDIA growth or principally its AI infrastructure growth."
  - No accounting basis or deadline is stated.
  - Counting a delivery-related annual guidance reduction as a trigger is an evaluator reading.
retrospective_or_prospective: retrospective
