  - The ordinary reading of 'any closer' denies measurable progress in reducing hallucinations; it does not merely say that complete elimination remains unavailable.
  - For this ongoing research observation, I use September 2024 through publication as the latest reporting window, comparing then-current models with their predecessors.
  - An improvement on comparable factuality tests establishes limited progress, not a universal solution.
support_condition: Comparable evaluations across the named developers show no credible reduction in hallucinations or improvement from mitigation techniques.
contradiction_condition: At least one named developer demonstrates a credible reduction in hallucinations on comparable evaluations available at publication.
measurement_requirements: Compare hallucination rates on the same tasks and distinguish incorrect answers, correct answers, and abstentions. Do not substitute general reasoning scores for factuality.
source_requirements: Dated evaluations or mitigation research with identifiable models and methods. Developer evaluations are admissible but require explicit limits on generalization.
