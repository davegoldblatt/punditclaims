assessment_axis: forecast_outcome
explicit_source_elements:
  - Automatic tools like these
  - will surely accelerate
  - the enshittification of the internet
evaluator_interpretation:
  - In context, degradation means increased contamination of online information by misleading content.
  - Acceleration means that automated misinformation generation makes this contamination increase faster. More AI-generated content alone does not establish this.
  - The claim concerns the internet broadly and supplies neither a deadline nor a numerical threshold.
support_condition: Longitudinal evidence establishes that automated misinformation generation increases the rate of online misinformation growth across a sufficiently broad sample.
contradiction_condition: Comparable evidence establishes that these tools do not accelerate misinformation growth, or instead reduce it, over the scope being assessed.
measurement_requirements: Repeated measurements of misleading content, reliable identification of automated generation, and a comparison that distinguishes its contribution from changes in platform activity, reporting, and detection.
source_requirements: Public empirical research with disclosed sampling and methods. Demonstrations and individual campaigns cannot alone settle the broad forecast.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated longitudinal finding establishing the predicted acceleration attributable to these tools across a broad online sample can settle the forecast. An isolated deployment or an increase in detected AI content cannot.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Degradation has no specified measure.
  - No baseline, minimum effect, or deadline is stated.
  - The breadth of evidence needed to represent the internet is unspecified.
retrospective_or_prospective: retrospective
