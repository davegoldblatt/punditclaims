explicit_source_elements:
  - GPT-4 is not actually equivalent to a smart high schooler
  - It can do some things better, some worse, very few reliably
evaluator_interpretation:
  - "Plain reading: GPT-4's abilities do not match those of a smart high school student across the board. Its profile is uneven, clearly above such a student on some tasks and clearly below on others, so the two are not equivalent."
  - The claim answers Aschenbrenner's label 'GPT-4 (2023) ~ smart high schooler'. The period is GPT-4's release (March 2023) up to the post date.
  - Benchmark exam results against human test-takers are used as the main measure. Real-world jobs such as lifeguarding are not scored, because no source measures them.
support_condition: Published evaluations show GPT-4 well below typical capable high school test-takers on some high-school-level tasks, and not reliable, even if it is above them on others.
contradiction_condition: Published evaluations show GPT-4 at or above smart-high-schooler level across the range of high-school-level academic and practical tasks, with no clear areas of weakness.
measurement_requirements: Percentile scores of GPT-4 against human test-takers on high-school-level exams and competitions, plus documented reliability limits.
source_requirements: OpenAI's GPT-4 Technical Report or other primary evaluations.
