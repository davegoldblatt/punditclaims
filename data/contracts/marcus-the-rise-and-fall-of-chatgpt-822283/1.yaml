ambiguity_flags:
  - Enterprise scale has no numerical threshold.
  - The surrounding examples concern companies; including large public institutions is an evaluator interpretation.
  - Success is undefined, including whether useful surviving components outweigh failure of the original implementation.
  - No deadline is stated.
