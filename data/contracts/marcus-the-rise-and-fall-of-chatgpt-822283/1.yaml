explicit_source_elements:
  - not every
  - enterprise-scale experiment
  - will be successful
evaluator_interpretation:
  - The surrounding discussion identifies the experiments as generative AI projects.
  - The ordinary reading requires at least one unsuccessful project, without predicting a failure rate.
  - Enterprise scale means substantial operational deployment across a large organization. This includes public institutions.
  - An implementation that shuts down and cannot fulfill its contracted purpose counts as unsuccessful, even if some infrastructure remains useful.
support_condition: After publication, at least one substantially deployed organizational generative AI project is discontinued unsuccessfully or demonstrably fails its intended implementation.
contradiction_condition: Every project within the claim's scope succeeds. With no deadline or closed population, a finite collection of successes cannot establish this.
measurement_requirements: Establish that the project used generative AI, reached substantial operational deployment, and subsequently failed. A small pilot or a supplier failure without a project failure is insufficient.
source_requirements: Prefer deployment records and organizational or court disclosures. Reporting must identify the project, its deployment and its failure.
