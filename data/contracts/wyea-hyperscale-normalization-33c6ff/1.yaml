assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA’s actual customer base
  - is contracting
  - Q2 FY2027
  - 70% of its accounts receivables came from five companies
  - two preceding quarters
evaluator_interpretation:
  - The plain reading of a contracting customer base is fewer distinct customers, not merely a large share of sales or receivables attributable to a few customers.
  - Assess FY2027 Q2 against earlier quarters. Its boundaries are April 27–July 26, 2026; earlier observations serve as comparison context.
  - Check the receivables figures separately from the customer-count inference. Concentration comparisons must hold the number of largest customers constant.
  - The financial scope below covers the receivables-share evidence offered in the surrounding text. It does not turn receivables into a customer count.
  - Company_reported describes the disclosed customer shares; these are not a separately defined GAAP concentration measure.
support_condition: Comparable records show a decline in distinct customers during FY2027 Q2. The accompanying concentration assertion also requires a like-for-like increase in the share held by the same number of largest customers.
contradiction_condition: Comparable customer counts are stable or increase. A decline in like-for-like receivables concentration would contradict that supporting trend, but would not alone settle customer counts.
measurement_requirements: Comparable direct and ultimate-customer counts, with a consistent definition of active customer. Separately compare top-three with top-three or top-five with top-five receivables shares.
source_requirements: NVIDIA filings or customer records that disclose comparable counts and concentration. Revenue growth alone cannot establish customer growth.
