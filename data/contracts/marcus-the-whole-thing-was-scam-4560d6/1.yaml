assessment_axis: historical_observation
explicit_source_elements:
  - they did it in favor of someone else
  - took pretty similar terms
  - happened to have given more campaign contributions
evaluator_interpretation:
  - Someone else means OpenAI and its leadership, with Brockman included because the surrounding passage explicitly names his donation.
  - In favor means the government accepted OpenAI while excluding Anthropic. The sentence alone does not establish that donations caused the decision.
  - Similar terms means substantively comparable safety restrictions in the original agreements or final proposals.
  - The donation comparison concerns Trump-aligned campaign and PAC contributions in the current political cycle before the post, using January 1, 2025 through February 28, 2026.
  - The contract's metric_scope is null because this reading concerns individuals' political contributions, not either company's financial performance or corporate spending. Personal gifts must not be attributed to company accounts.
support_condition: Evidence establishes preferential acceptance of OpenAI under substantively comparable terms and a larger matched total of relevant contributions from its leadership side.
contradiction_condition: Evidence establishes materially different terms or a matched donation comparison showing that OpenAI's leadership side did not contribute more.
measurement_requirements: Compare the original terms and use consistent donor groups, recipients, dates, and completed contributions. Exclude pledges, inaugural donations, and non-electoral advocacy spending unless explicitly distinguished.
source_requirements: Contract records and campaign-finance filings; reliable reporting may establish individual payments but cannot substitute for an incomplete comparative total.
