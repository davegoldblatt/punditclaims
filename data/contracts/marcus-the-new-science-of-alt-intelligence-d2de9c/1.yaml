evaluator_interpretation:
  - Alt Intelligence means the data-driven approaches described in the surrounding passage, rather than all AI research.
  - Predominant means the leading research direction. Prominent examples alone do not establish this comparative claim.
  - "For this ongoing research trend, I use the latest research cycle before publication: 2022 through May 14. Marcus supplied no reporting period or measure of predominance."
support_condition: Representative evidence about research programs, publications or investment establishes scaling as the leading direction within the described approaches.
contradiction_condition: Representative evidence establishes that another direction predominated within those approaches.
measurement_requirements: A defensible definition of the research population and a comparison of scaling with other directions. Individual model sizes or rising compute requirements are insufficient alone.
source_requirements: Contemporaneous research surveys, bibliometric measurements or documented development programs, independent of Marcus.
