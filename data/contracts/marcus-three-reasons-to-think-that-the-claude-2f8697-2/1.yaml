evaluator_interpretation:
  - The testable component is the comparison between the launch demonstrations and contemporaneous portrayals of immediately usable destructive capability.
  - The surrounding example concerns children accidentally damaging the power grid. It does not establish that Marcus denied every cybersecurity risk.
  - The assessment covers April 7–9, 2026, the launch and coverage discussed in the post.
  - The statement that regulation and technical preparation are needed is a policy judgment and is not scored.
  - A simplified Firefox test alone cannot establish that all the launch demonstrations lacked practical threat.
support_condition: Verified contemporaneous coverage portrays readily usable destructive capability, while documented access restrictions and exploit prerequisites establish that the demonstrations fall materially short of that portrayal.
contradiction_condition: Verified coverage accurately describes an immediate practical threat that the launch demonstrations establish under the relevant access and deployment conditions.
measurement_requirements: Identify the actual media proposition, affected systems, attacker access, exploit prerequisites, mitigations, and model availability. Distinguish a demonstration's limits from absence of risk.
source_requirements: Use contemporaneous coverage as primary evidence of what was portrayed and technical disclosures as primary evidence of what was demonstrated.
