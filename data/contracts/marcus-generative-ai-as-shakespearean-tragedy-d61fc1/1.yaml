assessment_axis: historical_observation
explicit_source_elements:
  - GenAI today
  - brittleness (a term for unreliability)
  - greed for data
  - causing the desperation that the Times described
  - opacity (uninterpretability)
  - makes debugging, fairness, and engineering so hard
  - generalizations are never complete
evaluator_interpretation:
  - The ordinary reading is that these were substantial, continuing limitations of contemporary generative AI, not that every system failed every task.
  - I read incomplete generalization as failures to transfer learned capabilities reliably to changed situations. The surrounding word 'today' makes this an observation, not a proof that future systems can never generalize.
  - I use early 2024 through publication as the current reporting period for these continuously evaluated systems. There is no standard quarterly reporting cycle for their technical limitations.
  - Data hunger means large training-data requirements and pressure to acquire additional material. Desperation describes the documented acquisition pressure, not a measurable psychological state.
support_condition: Contemporaneous evaluations and disclosures establish recurring unreliability, substantial data requirements and acquisition pressure, consequential interpretability limitations, and failures to generalize across changed tasks.
contradiction_condition: Representative evidence establishes that one or more of these alleged continuing limitations had been broadly overcome, or that the reported data-acquisition pressure was unrelated to training-data requirements.
measurement_requirements: Use disclosed training corpora, documented failures, controlled generalization tests, and interpretability research. Successful benchmarks alone do not establish reliable generalization across changed conditions.
source_requirements: Prefer original research and company disclosures. Investigative reporting may establish acquisition practices where internal records are not public.
