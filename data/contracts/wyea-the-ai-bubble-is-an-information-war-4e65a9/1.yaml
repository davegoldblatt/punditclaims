evaluator_interpretation:
  - The companies are OpenAI and Anthropic.
  - The ordinary reading is that both voluntarily supply AI for US military purposes and publicly welcome that work. It does not require enthusiasm for every operation or unrestricted military use.
  - "For this ongoing observation, I use the latest completed month and the days through publication: February 1–March 3, 2026. The surrounding passage concerns the current military-contract dispute."
support_condition: Contemporaneous records show voluntary military cooperation and public endorsement of that cooperation by both companies.
contradiction_condition: Records show that at least one company neither voluntarily participated in US military work nor welcomed that participation. Restrictions on particular uses alone do not contradict the ordinary reading.
measurement_requirements: Evidence of actual agreements, deployments or military services, accompanied by affirmative public statements. Do not infer private emotions.
source_requirements: Prefer company announcements and government records. Company statements are direct evidence of their publicly expressed position.
