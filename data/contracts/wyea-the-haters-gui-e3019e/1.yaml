assessment_axis: causal_assessment
explicit_source_elements:
  - growth was a result of an unsustainable business model
  - now had to replace
  - opaque terms of service
  - dramatically restricted access to models
  - at the price point they were used to
evaluator_interpretation:
  - The claim connects Cursor's growth to economically unsustainable service allowances and says those economics forced the June pricing changes.
  - The context describes growth from March through June 2025 and service changes already in effect by July 21.
  - Restricted access means materially less access to users' chosen models at their existing subscription price. It does not require the entire application to become unusable.
  - A pricing change and customer complaints alone cannot establish what caused growth or whether replacement was economically necessary.
support_condition: Evidence establishes that unsustainable service allowances materially drove growth, forced the replacement pricing, and substantially reduced chosen-model access at existing prices through poorly explained limits.
contradiction_condition: Evidence establishes that the old allowances were economically sustainable, that the claimed causal connection was false, or that comparable model access remained available on materially unchanged terms.
measurement_requirements: Contemporaneous customer growth, usage, actual model costs, subscription economics, and before-and-after service terms. Causal evidence must distinguish subsidized pricing from product quality and other growth drivers.
source_requirements: Prefer dated Cursor disclosures, historical terms and financial records. Independent reporting can supplement these; customer complaints establish individual experiences rather than company-wide economics.
