explicit_source_elements:
  - standard version of Claude Opus 4.6
  - premium request multiplier of three
  - even with the promotional pricing
  - Claude Opus 4.7 is around 250% more expensive to use
evaluator_interpretation:
  - The plain reading compares premium-request consumption for equivalent billable requests using standard Opus 4.6 and promotional Opus 4.7.
  - Percent more means the difference divided by the Opus 4.6 baseline, multiplied by 100. It does not mean the new rate as a percentage of the old rate.
  - The main proposition being graded is the claimed percentage increase. The baseline multiplier is checked separately and acknowledged even if the percentage conclusion fails.
  - The target period is the April 2026 promotional pricing described in the post, as publicly documented when it appeared.
  - This compares customer usage units, not corporate financial accounts or API token prices; metric_scope is null.
support_condition: Contemporaneous GitHub multipliers establish a standard Opus 4.6 baseline of 3 and a promotional Opus 4.7 rate producing approximately a 250% increase over that baseline.
contradiction_condition: The contemporaneous multipliers yield a materially different percentage increase. A 7.5 rate against a 3 baseline yields a 150% increase and contradicts the claimed 250% increase.
measurement_requirements: Use standard Opus 4.6, excluding fast mode, and promotional Opus 4.7. Calculate (Opus 4.7 multiplier − Opus 4.6 multiplier) / Opus 4.6 multiplier × 100.
source_requirements: Contemporaneous GitHub multiplier records available by 2026-10-28, with reproducible arithmetic.
