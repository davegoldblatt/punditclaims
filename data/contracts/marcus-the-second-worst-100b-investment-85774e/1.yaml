explicit_source_elements:
  - over $100 billion
  - invested in “driverless” cars
  - thus far
  - there has not been a lot
evaluator_interpretation:
  - The ordinary financial reading is that driverless-car investment had generated little financial payoff relative to its cost by publication. It does not mean there had been no useful technology or passenger service.
  - “Thus far” describes cumulative results through 2024-03-30, rather than a single reporting quarter. The starting date is unspecified.
  - Assess aggregate investment and returns without counting transfers between investors as new industry operating earnings. Examine profitable exits separately.
  - The speaker supplies neither an accounting basis nor a numerical boundary for “a lot”; neither is silently assigned.
support_condition: Comparable industry-wide records show that cumulative financial returns were small relative to the capital invested through 2024-03-30.
contradiction_condition: Comparable industry-wide records show substantial cumulative financial returns relative to invested capital through 2024-03-30.
measurement_requirements: A consistent industry boundary, cumulative invested capital, operating results, distributions and exit proceeds, with double counting removed. Distinguish revenue, profit, investor proceeds and residual asset values.
source_requirements: Primary financial disclosures and a transparent industry aggregation. Selected failures or service statistics alone cannot settle the aggregate claim.
