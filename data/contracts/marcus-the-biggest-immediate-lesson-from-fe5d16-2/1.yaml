evaluator_interpretation:
  - The context identifies OpenAI and its immediately preceding leadership changes. The target period is November 17–18, 2023.
  - The plain reading of governance changing is a change in who leads and oversees the company, including its CEO and board chair.
  - In this context, overnight means within about a day; it does not require the changes to occur during nighttime hours.
  - The advice about judging trustworthiness is outside the factual proposition being assessed. Visibility is descriptive context, not a specified ranking.
support_condition: Dated records establish that OpenAI changed its CEO and board leadership within about a day immediately before the post.
contradiction_condition: Records establish that the described leadership and board changes did not occur, or occurred over substantially longer than about a day.
measurement_requirements: Identify the leadership and board roles affected and the dates the changes took effect.
source_requirements: Prefer contemporaneous OpenAI announcements; use contemporaneous reporting to corroborate timing.
