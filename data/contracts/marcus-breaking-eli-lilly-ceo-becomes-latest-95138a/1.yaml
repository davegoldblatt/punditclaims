  - which are absolutely necessary
  - to the degree that would be required
  - "Context: cancer, Alzheimer's, heart disease and mental illness cured in less than 10 years"
evaluator_interpretation:
  - The plain reading is that necessary human testing imposes a binding obstacle to establishing cures across the named disease groups within the contextual under-a-decade window.
  - This assesses the claimed present constraint, not whether those diseases will actually be cured by a future deadline.
  - Because this is an ongoing capability claim with no periodic reporting cycle, the target is the state of clinical development at publication on 2026-11-12. Earlier research and regulatory announcements provide context.
  - FDA requirements are relevant because the surrounding discussion explicitly mentions FDA approval, but they do not establish worldwide requirements.
  - Approval of an individual treatment, particularly on a surrogate endpoint, does not by itself establish a cure or feasibility across all the named diseases.
support_condition: Evidence establishes necessary clinical observation or testing requirements that cannot feasibly be compressed enough to validate the proposed cures within the contextual window, accounting for available acceleration methods and the development stage of candidate treatments.
contradiction_condition: Validated trial methods, regulatory requirements and disease-specific evidence establish that the necessary human testing for the proposed cures could feasibly fit within the contextual window. Faster approval of an unrelated treatment alone is insufficient.
measurement_requirements: Distinguish trial duration, gaps between phases, regulatory review and discovery time. Identify disease-specific endpoints, necessary follow-up, candidate readiness and whether the evidence establishes a cure rather than symptom improvement or a surrogate response.
source_requirements: Primary regulatory documents, trial records and research available by 2026-11-13. Expert predictions and historical averages alone cannot establish an unavoidable minimum duration.
