assessment_axis: forecast_outcome
explicit_source_elements:
  - we will not see AGI
  - in 2025
  - stands by his prediction
evaluator_interpretation:
  - "Marcus gave no definition of AGI here. The plain reading is that no AI system would be built or shown in 2025 that is generally recognised as AGI: matching human general ability across most cognitive tasks, including new problems, reliably."
  - A loose remark by an industry figure that AGI may already have happened does not count as AGI being achieved. What would count is a system widely accepted as AGI, a formal declaration such as the one under the Microsoft-OpenAI agreement, or clear human-level general performance in independent evaluations.
  - The Musk bet remark is context, not a separate testable claim.
support_condition: Evidence from late 2025 or early 2026 that leading AI systems still fell short of general human-level ability (for example, independent assessments showing uneven, 'jagged' abilities and failures on simple tasks, unsolved general-reasoning benchmarks, and no formal AGI declaration), and no system widely accepted as AGI by 31 December 2025.
contradiction_condition: A system released or shown in 2025 that is widely accepted as AGI by independent experts, or a formal, verified declaration of AGI made during 2025.
measurement_requirements: Independent evaluations of frontier AI capability covering 2025; formal AGI declarations by major labs; status of general-reasoning benchmarks at year end.
source_requirements: Independent expert reports, benchmark organisers, and company filings or announcements dated up to the evaluation date and describing 2025.
