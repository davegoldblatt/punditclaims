ambiguity_flags:
  - Powerful, reckless and difficult have no numerical thresholds.
  - Reckless is figurative language applied to system behavior.
  - No model population is specified.
  - Current-state period inferred as the latest contemporary evaluation window.
  - Remain exactly could otherwise be misread as denying all safety progress.
