assessment_axis: forecast_outcome
explicit_source_elements:
  - AI bubble popping
  - There will be measurable damage to the stock market
evaluator_interpretation:
  - The surrounding discussion makes this conditional on the AI bubble popping.
  - The plain reading is an observable stock-market loss attributable to a collapse of the AI investment boom discussed in the post.
  - The context points to the broader boom centered on major US technology companies. A regional collapse is relevant but does not automatically establish that antecedent.
  - Major US indexes and representative technology or AI stock baskets are reasonable measures. No minimum percentage loss is imposed.
  - No deadline or fixed period after the collapse is supplied.
support_condition: Independent evidence establishes the relevant AI-boom collapse, and market data with credible event analysis show an attributable loss in stock-market value.
contradiction_condition: The relevant collapse occurs and sufficiently complete market evidence establishes that it produced no measurable stock-market loss. Continued investment or the absence of a collapse cannot contradict the forecast.
measurement_requirements: Dated index or representative basket returns around an independently identified collapse, with analysis distinguishing AI-related losses from other market shocks.
source_requirements: Prefer exchange or index-provider records and independent economic analysis. A price decline alone cannot establish both the antecedent and its causal effect.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve as supported once an independently documented qualifying collapse and attributable market loss have occurred. Do not resolve as contradicted merely because no qualifying collapse has occurred.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The AI bubble and its collapse are not defined.
  - Geographic scope is unstated; counting a regional collapse could change whether the condition is met.
  - No index, loss threshold, deadline, or response period is specified.
