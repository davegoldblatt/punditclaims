assessment_axis: forecast_outcome
explicit_source_elements:
  - could as much as double to $1.52 billion a year
  - no consideration of accrued interest
  - in the event that CoreWeave chooses to draw on the remaining $3.8 billion
  - fairly confident will happen
evaluator_interpretation:
  - The main financial projection is conditional on drawing all of the original DDTL 2.0 facility's remaining capacity.
  - The confidence statement also predicts that this antecedent will occur; its factual result is reported separately from the conditional cost scenario.
  - The surrounding heading identifies the projected annual amount as interest, although the calculation and the phrase excluding accrued interest are unclear.
  - The original draw window ends in June 2025, extendable by three months, so September 30, 2025 is the latest deadline supplied by the context.
  - A later separately identified tranche does not count as drawing the original facility's remaining capacity.
support_condition: First establish that the original $7.6 billion facility was fully drawn within its draw window. Then establish that the resulting contractual annual interest burden could reach approximately $1.52 billion under the specified terms.
contradiction_condition: If the full-draw antecedent occurred, contractual terms or complete payment evidence must rule out the stated annual interest scenario. If the antecedent did not occur, do not score the conditional scenario as false.
measurement_requirements: Separate original DDTL 2.0 drawings from DDTL 2.1. Account for repayments before inferring gross drawings from outstanding balances. Separate annual interest from principal amortization.
source_requirements: Facility-specific borrowing disclosures and loan terms, preferably CoreWeave filings.
