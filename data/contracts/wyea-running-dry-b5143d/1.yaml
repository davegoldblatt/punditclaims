explicit_source_elements:
  - Replit was “never subsidized”
  - a deep distaste for the truth
  - gross margins
  - negative 14% in April
evaluator_interpretation:
  - Assess the factual implication that Replit previously supplied services below their delivery cost.
  - The surrounding evidence identifies April 2025 as the relevant counterexample to 'never'.
  - Use negative gross margin as evidence that aggregate revenue did not cover cost of revenue.
  - Do not infer that every subscriber was unprofitable, that subsidy was deliberate marketing policy, or that the CEO knowingly lied.
support_condition: Credible evidence shows negative gross margin or otherwise establishes that Replit absorbed delivery costs exceeding associated revenue during April 2025.
contradiction_condition: Comparable records show that the alleged April loss was erroneous or arose solely from expenses outside service delivery, with delivery costs covered by revenue.
measurement_requirements: Use realized revenue and cost of revenue for April 2025. Distinguish gross margin from operating or net losses.
source_requirements: Prefer financial records or company disclosures; clearly attributed private-company financial estimates may support a qualified finding.
