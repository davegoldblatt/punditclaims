assessment_axis: forecast_outcome
explicit_source_elements:
  - massive valuation drawdowns
  - are a certainty
  - There are losses coming
evaluator_interpretation:
  - Read the passage as predicting substantial losses across the AI startup holdings under discussion, rather than the ordinary failure of an isolated startup.
  - The subsequent reference to holdings retaining at most 50% gives context for the scale intended, but the quoted forecast itself supplies no exact threshold or affected share.
  - Investor losses require evidence about investor positions, including distributions and liquidation preferences; a lower headline company valuation alone can be misleading.
  - There is no deadline. The nearby reference to spending next year does not supply one for valuation losses.
support_condition: Documented substantial valuation declines across the relevant AI startup holdings, together with investor markdowns or realized losses, establish the predicted broad drawdown.
contradiction_condition: A definitive terminal accounting of the relevant holdings establishes that the predicted losses did not occur. Continued funding or rising valuations over a finite interval cannot alone contradict an undated forecast.
measurement_requirements: Comparable equity valuations or per-share marks over time, adjusted for financing and distributions, plus investor carrying values or realized returns.
source_requirements: Prefer fund reports, transaction documents, company financing announcements and court records; use reputable reporting where private terms are unavailable.
metric_scope:
  company: AI startups and associated venture-capital holdings discussed in the passage
  metric: Equity valuation drawdowns and investor losses
