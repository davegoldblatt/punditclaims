explicit_source_elements:
  - we’re yet to prove
  - running these models is profitable (or even sustainable)
  - for any provider
  - nor do we have tangible proof
  - compete at scale
  - Anthropic or OpenAI’s more-complex LLMs
evaluator_interpretation:
  - This concerns the public evidence available by June 15, 2026, rather than whether profitability or competitive deployment appeared later.
  - These models refers to the cheaper open-source or open-weight alternatives discussed immediately before the statement.
  - Profitable running means revenue from hosting the models covers the costs of providing that service. Revenue growth, financing, and hypothetical billing do not establish this.
  - Competing at scale means credible production evidence of useful substitution at meaningful volume, with relevant quality, reliability, and cost comparisons.
  - The context concerns routing some tasks to cheaper models, so the test does not demand superiority on every frontier task.
  - No accounting basis, scale threshold, or duration for sustainability is supplied.
support_condition: A sufficiently broad examination of the public record establishes that neither actual profitable hosting nor meaningful competitive production operation had been demonstrated by publication. Failure to find evidence in a limited search alone is insufficient.
contradiction_condition: A prepublication public record demonstrates actual profitable hosting by a provider, or a credible production comparison demonstrates competitive substitution at meaningful scale. Each limb must be assessed separately.
measurement_requirements: Actual hosting revenue and attributable service costs on a consistent basis; and production volume, task quality, reliability, and cost comparisons against the relevant proprietary alternatives.
source_requirements: Dated provider financial disclosures, customer deployment records, and independent operational measurements. Model benchmarks or vendor marketing alone are insufficient to establish the entire claim.
