explicit_source_elements:
  - Anthropic fucking lied about Claude Mythos being too powerful to release
  - it was actually a capacity issue
  - it's just another fucking Large Language Model Nothingburger
evaluator_interpretation:
  - The claim has two parts. (1) Anthropic's stated safety reason for restricting Mythos was false, and capacity was the real reason. (2) Mythos showed no meaningful capability advance over other LLMs ('nothingburger').
  - "Plain reading of 'nothingburger': no notable step up in capability. Independent evaluations of its capabilities test that part."
  - The period covers the Mythos Preview announcement on 2026-04-07 through the post date, 2026-04-28. Later statements are context only.
support_condition: Credible evidence that Anthropic restricted Mythos mainly for capacity reasons while claiming safety (for example internal documents or credible reporting), and independent evaluations showing Mythos was not meaningfully more capable than existing models.
contradiction_condition: Independent evaluations showing Mythos was a clear capability step up, especially in the cyber skills Anthropic cited. That undercuts both the 'nothingburger' claim and the idea that the safety reason was invented.
measurement_requirements: Independent capability evaluations of Mythos Preview, and credible reporting on the reasons for the restricted release.
source_requirements: Government or independent evaluators (for example UK AISI), Anthropic's statements, and reputable reporting.
