evaluator_interpretation:
  - Broad support means public opposition to the action from several distinct constituencies, including technology businesses and national security or public policy figures. It does not require majority public opinion or unanimity.
  - In the context of the lawsuit, unprecedented refers to applying the supply-chain-risk designation to a domestic American company. It does not mean that government pressure on businesses has no historical precedent.
  - The observation concerns the current dispute culminating in the March 9 lawsuit. I use February 27 through March 9, 2026, covering the publicly announced action and the support available by the post, rather than later support during litigation.
support_condition: Contemporaneous records show opposition spanning several distinct constituencies, and reliable historical reporting identifies the designation as the first known application to an American company.
contradiction_condition: Records establish that the asserted breadth depended on nonexistent or misrepresented endorsements, or identify a prior comparable supply-chain-risk designation against an American company.
measurement_requirements: Identify distinct supporting constituencies and distinguish organizational statements from individual endorsements. Check precedent for the specific designation, rather than government contracting disputes generally.
source_requirements: Prefer original public statements and court records for support. Use independent historical reporting for precedent where no comprehensive primary register is available.
