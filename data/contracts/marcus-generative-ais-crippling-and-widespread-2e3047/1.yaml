explicit_source_elements:
  - not just a problem with ChatGPT
  - The problem has been around for years
  - I first took note of the problem in 2023
evaluator_interpretation:
  - In context, the observable problem is unreliable chess play, including illegal moves and board-tracking failures.
  - Persistence means documented recurrence across years, not failure by every model in every game.
  - Beyond ChatGPT requires another identifiable model or system. Evidence from a different provider is especially clear.
  - The context explicitly anchors the historical comparison in 2023; use January 1, 2023 through June 28, 2025.
  - This assessment does not treat persistent illegal moves as proof that internal world models are absent.
support_condition: Dated primary tests document chess-rule or board-tracking failures in 2023 and again before publication in 2025, including a system beyond ChatGPT.
contradiction_condition: Comparable historical records establish that the alleged failures did not recur across those years or were confined to ChatGPT.
measurement_requirements: Identifiable models, dated experiments, and concrete illegal moves or validated board-tracking errors. Representative prevalence estimates are unnecessary for this persistence claim.
source_requirements: Primary experimental reports or game records covering the historical interval and at least one system beyond ChatGPT.
