explicit_source_elements:
  - robustness
  - dependable generalization beyond curated benchmarks
  - resistance to systematic failure
  - essential criteria for AGI
  - current systems fall short
evaluator_interpretation:
  - The ordinary reading is that contemporary general-purpose AI still has material weaknesses in all three named properties. It does not require error-free performance.
  - Robustness means retaining competence under modest changes in inputs or conditions. Generalization means transferring competence beyond familiar test tasks. Resistance to systematic failure means avoiding recurring classes of failure.
  - Current systems includes the frontier available at publication, not just models evaluated in the cited 2025 paper.
  - "With no reporting quarter for AI capabilities, the target is the publication month through the post date: February 1–17, 2026. Earlier evaluations provide context unless they establish capabilities during that interval."
  - The paper's aggregate cognitive score is not a substitute for measurements of these three properties.
support_condition: Independent evaluations covering contemporary leading systems show material, recurring weaknesses in robustness, transfer beyond curated tests, and resistance to systematic failure. The cited paper also treats these properties as requirements rather than optional improvements.
contradiction_condition: Contemporary systems demonstrably satisfy the three requirements across varied unfamiliar tasks and realistic conditions, or the cited paper explicitly rejects their necessity. Strong scores on unrelated benchmarks alone do not suffice.
measurement_requirements: Evaluate modest perturbations, unfamiliar task settings, and repeated failure patterns separately. Identify model versions, testing dates, human comparisons where available, and coverage of systems released shortly before publication.
source_requirements: Use independent evaluations for capability outcomes. Use Hendrycks et al. only to establish the cited criteria; Marcus is a coauthor, so its conclusions cannot independently validate his claim.
