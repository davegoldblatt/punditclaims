evaluator_interpretation:
  - The central proposition is financial inconsistency, rather than merely the accurate attribution of a statement to Rao.
  - Exceeding $5 billion is a lower bound, not an exact cumulative total or an upper bound.
  - The cumulative period starts when commercial revenue began; the post supplies no exact start date.
  - Annualized revenue observations must retain their dates and definitions. They cannot simply be summed as realized revenue.
support_condition: The affidavit and properly aligned revenue records impose incompatible constraints on cumulative revenue through March 9, 2026.
contradiction_condition: The alleged inconsistency depends on treating the affidavit's lower bound as an exact total, or annualized snapshots as realized revenue, while the actual statements remain compatible.
measurement_requirements: Preserve the affidavit's inequality and cumulative period. Any reconstruction must identify run-rate definitions, observation dates, accounting treatment, and assumptions between observations.
source_requirements: The original declaration controls its meaning. Use company disclosures or well-sourced reporting for run-rate observations, without converting them into realized revenue without a stated method.
