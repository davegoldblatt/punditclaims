explicit_source_elements:
  - The entire industry
  - OpenAI and Anthropic’s theoretical revenues of $13.1 billion and $4.5 billion
  - around $65 billion last year
  - includes the revenues from providing compute
  - neoclouds like CoreWeave and hyperscalers like Microsoft
evaluator_interpretation:
  - "'Last year' means calendar 2025."
  - The surrounding discussion identifies the generative AI industry, including its compute services, rather than every historical use of AI.
  - The dollar figures are US dollars and describe realized annual revenue, not year-end annualized run rates.
  - "'Theoretical revenues' and the surrounding reliance on reporting indicate estimates rather than a stated GAAP or IFRS aggregate."
  - The explicit inclusion of upstream compute requires a transparent aggregation method. No arbitrary percentage tolerance is added to 'around'.
  - The named company figures are components; verifying them alone does not verify the industry total.
support_condition: A transparent, sufficiently comprehensive estimate of calendar-2025 realized revenue for the stated industry scope places the total reasonably near $65 billion and substantiates the named components.
contradiction_condition: A comparable comprehensive estimate or defensible bound places revenue materially outside an ordinary approximation to $65 billion, or establishes a material error in a named component.
measurement_requirements: Calendar-year realized revenue in USD, a defined company and product population, disclosed treatment of reseller and intercompany sales, and separation of annualized rates from actual revenue.
source_requirements: Prefer company filings for components and a transparent independent aggregation. Press estimates may supply private-company components where public accounts are unavailable.
