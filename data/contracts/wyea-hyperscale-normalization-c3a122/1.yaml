assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic is such an unstable customer
  - the lease isn’t even in its name
  - with NVIDIA taking it on
evaluator_interpretation:
  - I read unstable in this financing context as insufficient credit standing to support the project's financing as direct tenant, not as a demonstrated inability to pay any bill.
  - The lease means the underlying Hut 8 data-center facility lease. Anthropic's compute-services agreement with Lambda is a separate contract.
  - Support requires evidence both of NVIDIA's lease role and of customer credit risk motivating the structure.
support_condition: Lease records or credible contemporaneous reporting identify NVIDIA as facility tenant and connect that arrangement to obtaining finance that Anthropic's credit standing could not support directly.
contradiction_condition: The relevant facility lease names Anthropic instead of NVIDIA, or reliable evidence establishes that customer creditworthiness did not motivate the arrangement.
measurement_requirements: Identify the facility, landlord, tenant, service provider and compute customer separately. Distinguish the reason for the financing structure from speculation about future insolvency.
source_requirements: Prefer executed leases, lender requirements and credit assessments. Reputable specialist reporting explicitly describing the financing reason may support a qualified assessment when primary documents are unavailable.
