assessment_axis: forecast_outcome
explicit_source_elements:
  - When the deck of cards collapses
  - Those that will suffer will be the workers
  - the startups trying to raise funding
  - an actual product
evaluator_interpretation:
  - The condition refers to a collapse of the AI investment boom discussed in the post.
  - The plain reading is that the collapse will cause material harm to tech workers and make financing harder for startups developing useful products.
  - The Silicon Valley and Altman context suggests a broad industry reversal. Whether a regional stock-market crash alone satisfies the condition is unclear.
  - Worker harm can include layoffs, reduced hiring or lower earnings. Startup harm can include failed fundraising, worse financing terms or closures.
  - Actual products and active development teams provide observable indicators of the intended startup group. Vision and talent are subjective.
  - No deadline, minimum decline or post-collapse observation window is supplied. None is imposed.
support_condition: A documented collapse of the relevant AI investment boom is followed by material worker harm and financing difficulties among product-building startups, with evidence connecting both effects to the collapse.
contradiction_condition: After a documented collapse and its economic adjustment, sufficiently broad evidence shows that workers or the specified startups did not experience the predicted harm. Continued investment before a collapse does not contradict the forecast.
measurement_requirements: Establish the collapse independently of its alleged effects. Compare employment, earnings, fundraising access and closures before and after it, using consistent populations and distinguishing collapse-related harm from automation, interest rates and unrelated restructuring.
source_requirements: Prefer investment datasets, employment statistics, company disclosures and documented financing outcomes. News reports can establish events where accessible primary evidence is unavailable; predictions of harm alone cannot establish outcomes.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: With no deadline, resolve only when a dated collapse and its observed aftermath decisively establish or refute the predicted harm to both specified groups. A stock decline, isolated failure or forecast of future layoffs is insufficient by itself.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Collapse has no numerical threshold or specified market.
  - Geographic scope is unstated; a regional crash may not satisfy the broader industry condition.
  - Suffer has no stated magnitude or duration.
  - Vision, talent and useful products do not define a reproducible startup population.
  - No deadline or post-collapse observation window is supplied.
retrospective_or_prospective: retrospective
