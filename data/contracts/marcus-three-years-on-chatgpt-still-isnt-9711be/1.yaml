evaluator_interpretation:
  - This is a qualified empirical assessment of contemporary models, rather than a prediction.
  - Latest refers to models available in the posting month. The current reporting window is November 1 through November 29, 2025; older evaluations are context.
  - Reliability means dependable performance across varied relevant tasks. An isolated mistake or a score below perfection is insufficient by itself.
  - The comparison with domain-specific models requires named specialist models and matched tasks. Specialized applications are informative but not automatically equivalent to specialized models.
  - A complete assessment must address the listed components separately.
support_condition: Contemporary evaluations document substantive reasoning, tool-use, hallucination, control, and alignment limitations, together with appropriate comparisons showing the claimed shortfall against specialist models.
contradiction_condition: Contemporary evaluations establish dependable performance in an asserted deficient capability, or show frontier models matching or exceeding relevant specialist models on matched tasks. Contrary results for one component can support a mixed assessment if another component is supported.
measurement_requirements: Named model versions, task-specific reliability criteria, repeated trials where appropriate, and matched specialist comparisons. Distinguish adversarial attack rates from everyday reliability.
source_requirements: Primary evaluations of models available in November 2025. Later publications are admissible only when their results can be tied to the target period.
