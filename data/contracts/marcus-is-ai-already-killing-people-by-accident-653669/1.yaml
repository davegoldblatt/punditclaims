assessment_axis: forecast_outcome
explicit_source_elements:
  - we can certainly expect incidents of this type
  - and more of them
  - no deadline stated
  - "'this type' refers to a military mistargeting that kills civilians and may involve AI"
evaluator_interpretation:
  - Read as a forecast that more military mistargeting incidents will happen after the post, where AI plays a role and civilians die.
  - No deadline was given, so the horizon is open. The forecast can be settled early only by a decisive dated event.
  - Repeated incidents count only if AI is credibly reported as a contributing cause. Ordinary targeting errors do not count, because Marcus himself notes that 'targeting errors aren't new'.
support_condition: Credible reporting names at least one military mistargeting incident after 2026-03-01 that killed civilians and had AI as a contributing cause. This could be an official investigation, or a major news outlet citing officials or documents.
contradiction_condition: With no deadline, nothing short of an implausibly long period without such incidents could contradict it. In practice the forecast cannot be shown false within the evaluation window.
measurement_requirements: The incident must date after 2026-03-01, cause civilian deaths, and be credibly attributed at least in part to an AI system's output or to reliance on it.
source_requirements: Official military or government investigations, or reputable news reports citing officials or documents. Independent monitors such as Airwars also qualify.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Supported early if, by the evaluation date, credible reporting attributes a post-2026-03-01 military mistargeting incident with civilian deaths at least partly to AI.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Incidents of this type' could mean any mistargeting, or only AI-linked mistargeting."
  - "'More of them' could mean further incidents, or a rising rate."
  - No deadline was given.
