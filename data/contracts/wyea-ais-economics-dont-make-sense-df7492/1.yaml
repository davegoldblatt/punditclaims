assessment_axis: forecast_outcome
explicit_source_elements:
  - must have consistent, 100% utilization and tenancy
  - or they end up burning millions of dollars
  - fail to chip away at the years-long wall of depreciation
evaluator_interpretation:
  - "The plain reading is a necessary-condition claim: operating AI data centers below full utilization or tenancy necessarily produces the stated financial failure."
  - I retain the supplied conditional-forecast classification. The claim supplies no deadline.
  - Utilization means commercial use of available computing capacity, not utilization of arithmetic units inside an individual GPU.
  - The financial test separates cash losses from coverage of operating costs and depreciation. Expansion capital expenditure alone is not proof of operating failure.
  - No individual company, currency, accounting basis, or measurement interval is specified.
support_condition: Observed sub-full operation is followed by the claimed losses and failure to recover capital costs, with evidence establishing that full utilization is necessary rather than merely showing one unsuccessful operator.
contradiction_condition: A documented operating AI data center or separately reported AI compute fleet runs below full utilization or tenancy while covering its relevant operating costs and depreciation without the claimed cash losses.
measurement_requirements: Matched utilization, tenancy, operating cash flows, costs, and depreciation for the same operating assets and period. Separate existing operations from construction spending and unrelated businesses.
source_requirements: Operator disclosures or independently verified facility records. Hypothetical financial models and consolidated profits from mixed businesses are context only.
metric_scope:
  company: AI data-center operators, unspecified
  metric: Cash losses and depreciation coverage conditional on sub-full utilization or tenancy
  currency: null
  units: millions of dollars and depreciation coverage
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A dated post-publication counterexample with matched sub-full utilization and satisfactory operating cash flow and depreciation coverage would decisively refute the asserted necessity. An isolated loss-making example cannot conclusively establish a universal requirement.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The statement can also be read as a present economic generalization.
  - Utilization and tenancy are distinct measures.
  - Consistent has no specified duration.
  - Burning millions does not distinguish operating cash burn from expansion expenditure.
  - Chipping away at depreciation does not specify partial or complete capital recovery.
  - The accounting basis is unspecified.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
