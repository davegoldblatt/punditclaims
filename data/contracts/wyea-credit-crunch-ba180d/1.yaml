assessment_axis: historical_observation
explicit_source_elements:
  - They are unprofitable
  - unsustainable
  - raise significant debt
  - only conditions
  - catastrophic failures of regulatory and ratings bodies
evaluator_interpretation:
  - Assess the current financial assertion using the first half of 2026, a completed reporting period whose results could reasonably have been reported before October 6. Do not assume that the quarter ending six days before publication had already been reported.
  - The ordinary meaning of unprofitable is that ordinary expenses exceed income, but the surrounding discussion uses EBITDA and other loss measures without selecting a consistent accounting basis.
  - Read unsustainable as dependence on continued external financing to meet planned operations and obligations, rather than inevitable bankruptcy.
  - Read significant debt against the surrounding discussion of tens of billions in annual funding. A smaller revolving facility alone does not settle that assertion.
  - Evaluate profitability, financing dependence and the alleged necessity of institutional failure separately.
support_condition: Comparable financial records show losses and continuing external-funding dependence for both companies, while transaction terms and applicable credit standards establish that funding at the contemplated scale requires the alleged institutional failures.
contradiction_condition: Comparable records establish profitability or financial self-sufficiency inconsistent with the assertion, or a company completes debt financing at the contemplated scale under demonstrably ordinary regulatory and rating standards.
measurement_requirements: Comparable income statements, cash flows, funding requirements, completed borrowing transactions and applicable rating criteria. Net loss, operating loss, EBITDA and cash burn must remain distinct.
source_requirements: Company financial statements and financing documents, supplemented by independent reporting when the underlying statements are unavailable.
