ambiguity_flags:
  - The ongoing observation supplies no reporting period; the first half of 2026 is an evaluator-selected reporting window.
  - Unprofitable does not specify net income, operating income or EBITDA.
  - Unsustainable and significant debt lack numerical definitions.
  - Catastrophic institutional failure lacks an objective threshold.
  - The compound claim covers distinct financial measures that cannot share one accounting basis.
