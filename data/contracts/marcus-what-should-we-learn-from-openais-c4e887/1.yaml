assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI promised
  - 20% of its efforts
  - to AI safety
  - but never delivered
  - according to a recent report by Jeremy Kahn at Fortune
evaluator_interpretation:
  - Read 'never delivered' as a statement about performance through the post date, May 26, 2024, rather than a forecast.
  - The reference to Fortune identifies the underlying compute commitment. Interpret 'efforts' as compute resources for superintelligence alignment, rather than an independently measurable share of all company activity.
  - The observation covers the period from the commitment's announcement on July 5, 2023, through the post date.
  - Distinguish resources allocated to the Superalignment team from resources allocated across all work covered by the commitment.
  - Failure to complete a multiyear commitment before its deadline does not alone establish that the promise was broken.
support_condition: Evidence establishes that the promised allocation was not provided when required by its terms, or that OpenAI had conclusively abandoned the commitment by May 26, 2024.
contradiction_condition: Comparable allocation records establish that OpenAI had delivered the promised 20% allocation by May 26, 2024.
measurement_requirements: Identify the secured-compute baseline, qualifying alignment work, allocation or usage measure, and required delivery schedule. Team-specific shortages alone cannot establish the company-wide percentage.
source_requirements: Use the original commitment to establish its terms. Prefer allocation records or attributable firsthand testimony for delivery; identify anonymous reporting as such.
