evaluator_interpretation:
  - Assess protections contained in the proposed bill as it stood on August 20, 2024, rather than treating it as an enacted law.
  - The plain factual reading is that the bill contains substantive protections for employees reporting AI risks, and multiple former OpenAI employees publicly argued that such protections were needed.
  - Treat 'important' and 'critical' as attributed judgments about the need for protection, not as claims of measured effectiveness.
  - The target period covers the 2024 legislative debate and preceding employee statements through the post date.
support_condition: The August proposal contains substantive whistleblower protections, and a public record shows multiple former OpenAI employees advocating protection against retaliation for raising AI-risk concerns.
contradiction_condition: The relevant proposal lacks such protections, or the attributed collective advocacy is reliably shown to be false.
measurement_requirements: Identify the proposed protections and establish that multiple signatories were former OpenAI employees. Do not infer that they endorsed every provision of SB-1047.
source_requirements: The relevant bill or official legislative analysis, plus the employees' own public statement or reliable reporting identifying its signatories.
