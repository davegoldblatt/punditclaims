early_resolution_rule: A documented qualifying bust followed by decisive evidence about its consequences could resolve a clearly testable component. Ordinary price fluctuations or an isolated regional crash cannot resolve the entire compound forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No definition or threshold for the bubble bursting.
  - No numerical meaning for dramatic fall from grace.
  - No deadline or defined short-term aftermath.
  - Likely and the worst I could see qualify the commitment.
  - Unforeseen horrendous financial decisions is an undefined exception.
  - Several companies, financial measures and separately conditioned outcomes are combined.
  - No accounting basis is specified for the impairment component.
