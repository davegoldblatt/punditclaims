assessment_axis: forecast_outcome
explicit_source_elements:
  - when the bubble bursts
  - NVIDIA will likely cease being the largest company on the stock market
  - the Magnificent Seven will have a dramatic fall from grace
  - outside of unforeseen horrendous financial decisions
  - the worst I could see would be impairments
  - SEC action against NVIDIA if it did actually sell GPUs to China
evaluator_interpretation:
  - Largest means equity market capitalization among publicly traded companies.
  - The surrounding passage describes a broad AI investment bust. A regional crash or temporary semiconductor selloff does not automatically establish that condition.
  - Dramatic fall from grace means substantial collective loss of market value and standing; the speaker supplies no numerical threshold.
  - The corporate-damage forecast concerns the short-term aftermath, but neither its duration nor the excluded financial decisions are defined.
  - The NVIDIA ranking prediction is qualified by likely. One ranking observation cannot establish or refute a probability.
  - The SEC branch has a separate condition concerning NVIDIA's GPU sales to China. The passage does not specify which transactions or alleged violations qualify.
support_condition: After a documented broad AI investment bust, evidence shows the predicted substantial collective decline and corporate damage consistent with the stated ceiling, with the separately conditioned NVIDIA branches evaluated on their own terms.
contradiction_condition: Following the qualifying bust, clear evidence shows damage materially exceeding the stated ceiling without the excluded extraordinary decisions, or sustained outcomes plainly inconsistent with the collective-decline prediction. A temporary ranking change alone does not settle the compound claim.
measurement_requirements: Dated market-capitalization comparisons, collective valuation changes, company impairment and solvency records, and relevant SEC records. The bust and its aftermath must be identified independently of the desired verdict.
source_requirements: Prefer exchange data, company filings and SEC records. News accounts may document market events but cannot alone establish every forecast component.
metric_scope:
  company: NVIDIA and the Magnificent Seven
  metric: Equity market capitalization and relative market standing
  currency: null
  units: rank and change in market value; no numerical decline threshold stated
