assessment_axis: forecast_outcome
explicit_source_elements:
  - when the bubble bursts
  - NVIDIA will likely cease being the largest company on the stock market
  - the Magnificent Seven will have a dramatic fall from grace
  - outside of unforeseen horrendous financial decisions
  - the worst I could see would be impairments
  - SEC action against NVIDIA if it did actually sell GPUs to China
evaluator_interpretation:
  - The context conditions the prediction on an AI investment bubble bursting.
  - "The definite component assessed is a dramatic fall in the Magnificent Seven's market valuation and standing as a group: Apple, Microsoft, Alphabet, Amazon, NVIDIA, Meta and Tesla."
  - The ordinary market reading requires a substantial, broad decline, not an isolated company's bad trading day.
  - NVIDIA losing first place is explicitly probabilistic and is excluded from definite outcome scoring.
  - The possible damage ceiling, its exception for unforeseen decisions, and possible SEC action are qualified judgments. They are excluded from definite outcome scoring.
  - No fixed deadline or numerical decline threshold is supplied.
support_condition: After a broad AI investment bust is established, the Magnificent Seven collectively experience a substantial loss of market value and market leadership associated with that bust. Only this firm component is scored.
contradiction_condition: A completed AI-bust-and-recovery episode shows that the Magnificent Seven collectively retained their market standing without the predicted substantial decline. An isolated ranking change or impairment does not decide the firm component.
measurement_requirements: Dated evidence identifying the AI investment bust, together with comparable market-capitalization and return histories for all seven companies and broad-market comparisons. Separate group performance from isolated earnings reactions.
source_requirements: Prefer exchange or index-provider market data and company disclosures. Independent financial reporting may document market events; investment commentary alone cannot establish that the bubble burst.
