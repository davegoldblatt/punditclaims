early_resolution_rule: A clearly established AI investment bust followed by the predicted substantial group decline can settle the firm component. A completed bust-and-recovery episode without that decline can contradict it. A temporary selloff, NVIDIA ranking change or qualified damage scenario cannot independently settle it.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No objective threshold identifies when the bubble has burst.
  - "'Dramatic fall from grace' supplies no numerical threshold or duration."
  - No deadline.
  - The sentence combines a firm group prediction with probabilistic and qualified components that are excluded from scoring.
