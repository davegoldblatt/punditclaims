  - Every single model is broader than representative coverage of model families.
  - Some predictions concern unaided models while others concern deployed systems.
  - The eventual architecture of AGI is a future proposition within a retrospective bundle.
  - The incidental trillion-dollar phrase lacks a company, spending perimeter and accounting basis and is outside the normalized proposition assessed here.
