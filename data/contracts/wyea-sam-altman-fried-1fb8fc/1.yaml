explicit_source_elements:
  - "\"This is why\" (refers back to: models 'do not actually know anything')"
  - '"despite shoveling billions of dollars and likely petabytes of data"'
  - '"generative AI models still fail to get the basic details of images right"'
  - '"like fingers or eyes, or tools"'
evaluator_interpretation:
  - "Plain reading of the observation: as of February 2024, leading image and video generators still often rendered hands, eyes or tools wrongly."
  - "Plain reading of the cause: these errors come from the models lacking a real grasp of the structure of what they draw. The claim is supported if contemporary technical sources attribute hand errors to the models not learning the physical structure of hands."
  - "'Still fail' is read as 'still commonly get wrong', not 'never get right'."
  - "Target period: the state of the art in the months just before the post (November 2023 to the post date)."
support_condition: Technical or reporting sources from about November 2023 to February 2024 documenting that generative image models still commonly produce malformed hands, eyes or objects, and tracing this to poor learning of physical structure.
contradiction_condition: Sources from that period showing leading models reliably rendered hands, eyes and tools correctly, or attributing remaining errors to causes unrelated to missing structural knowledge.
measurement_requirements: Documented failure patterns or evaluations of hand, eye or object rendering in contemporary models; stated causes from researchers.
source_requirements: Research papers, model developer documentation, or reputable reporting.
