  - the most generous estimate
  - guaranteed to be a fraction of the real number
  - nearly one-quarter of its revenue
  - the previous twelve months
  - the end of June
evaluator_interpretation:
  - Assess the revenue-concentration conclusion, not merely the separate accounts-receivable statistic.
  - The comparison is with the stated $4.59 billion minimum divided by $19.708 billion of revenue for the twelve months ended June 2026.
  - The relevant customers are the large-customer groups used in the preceding calculation. Overlapping spending thresholds must not be counted as separate groups.
  - Certainly higher requires an observed share or a valid lower bound above the stated estimate. It does not require a particular multiple.
support_condition: Matched customer and revenue disclosures establish that the identified large customers generated more than the stated minimum share during the twelve months ended June 30, 2026.
contradiction_condition: Matched disclosures establish that those customers generated no more than the stated minimum share during that period.
measurement_requirements: Use recognized revenue, a common twelve-month period, and customer groups without double counting. Accounts receivable cannot substitute for revenue.
source_requirements: Anthropic's filing or equivalent customer-level financial disclosures available by October 28, 2026.
