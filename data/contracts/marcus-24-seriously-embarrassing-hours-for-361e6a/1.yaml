assessment_axis: historical_observation
explicit_source_elements:
  - Tesla staged their famous 2016 driverless car demo
  - aspirational, not real
  - not a single, unedited run taken by a single car
  - it seems
evaluator_interpretation:
  - "The claim has two parts. Part one: the 2016 'Paint It Black' video showed what Tesla hoped to build, not what the car could then do. Part two: the published footage was not one unedited run by one car."
  - Sworn testimony from people involved in making the video is the best evidence. News reports of that testimony count too.
  - "'It seems' hedges the claim but does not empty it. Both parts are scored as factual assertions."
support_condition: Testimony or records show the video did not reflect real capability (pre-mapped route, failed attempts, features not available), and that the footage was spliced or edited from more than one run or car.
contradiction_condition: Testimony or records show the video was a real, representative capability demo, or that the published footage was one continuous, unstitched run.
measurement_requirements: null
source_requirements: Deposition transcript or reputable reporting of it; other first-hand accounts of how the video was produced.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: "2016"
  end: "2016"
  precision: year
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Staged' could mean misleading about capability, or physically faked or spliced footage."
  - "'Not a single, unedited run' is a specific factual claim that sources dispute: Elluswamy says the final take was continuous, while other accounts say it was edited."
  - Speeding up parts of a video and cutting between camera angles is editing, but it is not the same as stitching runs together.
retrospective_or_prospective: retrospective
