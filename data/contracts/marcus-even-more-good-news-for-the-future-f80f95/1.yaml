evaluator_interpretation:
  - It refers to Claude Code using the 4.6 model generation.
  - The plain reading of AGI is broad human-level intellectual competence, including learning and transferring to unfamiliar tasks beyond coding.
  - Human-level competence does not require perfect accuracy. Coding mistakes alone cannot establish the absence of AGI.
  - Assess the referenced generation during February 2026 through April 12, 2026, rather than later model releases.
support_condition: Evaluations of the referenced system establish substantial deficits relative to humans across representative unfamiliar tasks that bear directly on general intellectual competence.
contradiction_condition: Evaluations establish broad human-level competence and transfer across representative intellectual domains for the referenced system.
measurement_requirements: Use human comparisons, multiple domains, unfamiliar tasks, and a clearly identified agent configuration. Do not equate an individual benchmark score with AGI status.
source_requirements: Primary capability evaluations of the referenced system, with methods sufficient to judge the breadth and relevance of the tests.
