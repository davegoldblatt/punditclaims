evaluator_interpretation:
  - The surrounding sentence makes the alleged Q3 FY2026 reporting change an essential premise.
  - I test whether NVIDIA newly adopted billing-location attribution and whether that change newly separated reported geography from shipment destinations.
  - The target includes Q3 FY2026 and its November reporting cycle.
  - Basically every is a claim about near-universal omission. One article establishes that coverage existed, but cannot measure how widespread the omission was.
  - The monetary scope concerns the geographic classification policy, not a claimed revenue amount.
support_condition: The filing shows the described switch to billing-location reporting, establishes the claimed new loss of destination information, and a representative contemporaneous coverage review supports near-universal omission.
contradiction_condition: The filing establishes a materially different change or shows that the claimed reporting capability was not new. Substantial contemporaneous coverage would separately contradict the press-omission component.
measurement_requirements: Compare the previous and new geographic attribution policies. Review contemporaneous earnings coverage separately from later commentary.
