explicit_source_elements:
  - it isn’t happening at scale
  - a business
  - replaced workers with generative AI
evaluator_interpretation:
  - At scale means widespread actual employee replacement across businesses, rather than isolated deployments.
  - The claim supplies no country or numerical threshold, so neither a single counterexample nor one country's net employment figure settles it.
  - Use May 2025, the latest completed calendar month before publication, for the ongoing labor-market state.
support_condition: Broad, representative evidence shows that actual employee replacement by generative AI remained uncommon during the target period.
contradiction_condition: Representative evidence or a substantial independently documented body of deployments shows widespread employee replacement during the target period.
measurement_requirements: Measure actual replacement of employees. Separate it from freelancer demand, reduced hiring, attrition, task assistance, forecasts, and net employment changes.
source_requirements: Prefer representative employment records or surveys linked to verified deployments. State geographic coverage and whether AI means generative AI specifically.
