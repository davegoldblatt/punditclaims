evaluator_interpretation:
  - The surrounding discussion concerns designing drugs, so the central reading is newly designed drugs whose molecular design materially involved AI.
  - Proven to work means convincing therapeutic efficacy in people, not merely laboratory activity or successful safety testing.
  - Regulatory approval or a successful confirmatory efficacy trial would clearly qualify; approval is not the only possible evidence of efficacy.
  - I treat as far as I know as an epistemic qualification, not a condition requiring access to Marcus's private knowledge.
  - Still and yet refer to the accumulated record through 2023-10-10.
support_condition: A sufficiently comprehensive account of AI-designed clinical candidates shows that none had established human therapeutic efficacy by 2023-10-10.
contradiction_condition: At least one drug materially designed using AI had established human therapeutic efficacy by 2023-10-10.
measurement_requirements: Establish AI's role in designing each relevant molecule and distinguish efficacy from safety, exploratory subgroup results, preclinical activity and permission to begin trials.
source_requirements: Clinical trial reports, regulatory records and company disclosures, with sufficient coverage to support a claim that no qualifying drug existed.
