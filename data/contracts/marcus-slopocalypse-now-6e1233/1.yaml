  - the problem is both serious and ubiquitous
  - no matter what you call it
  - AI slop is everywhere
  - journalism, law, music ... politics, education
evaluator_interpretation:
  - "Plain reading: by the post date (August 2025), low-quality or erroneous AI-generated content was widespread across many domains, not just one niche, and it was causing documented harm."
  - "'Ubiquitous' is read as 'widespread across many domains', not literally present everywhere."
  - "'Serious' is an evaluative word. It is read as 'causing documented real-world harm', such as sanctions on lawyers for fake AI citations or platforms flooded with AI content."
  - No period is named. The claim describes an ongoing state, so the target period is January 2025 through the post date (2025-08-04).
support_condition: Credible measurements or records from before the post showing large volumes of AI-generated content in several separate domains (for example the web, music, legal filings), plus documented harms.
contradiction_condition: Credible measurements showing AI-generated content was rare or confined to a few domains in mid-2025, or that documented harms were negligible.
measurement_requirements: Measurements of the share or volume of AI-generated content in at least two or three domains, plus records of harms, dated between January 2025 and 2025-08-04.
source_requirements: Platform or company disclosures, independent measurements, court-decision databases, or reputable news reports. Not the speaker's own writing.
