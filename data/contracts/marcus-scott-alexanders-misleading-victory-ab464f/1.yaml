evaluator_interpretation:
  - "'Poor' means low task-solving accuracy substantially below the benchmark's human reference performance, rather than a numerical cutoff Marcus did not provide."
  - "'Section' is read as the benchmark's compositional reasoning tasks and associated analysis, not necessarily a separately scored leaderboard division."
  - "'From what I understand' qualifies confidence; it is not an event that must occur before the claim can be assessed."
  - For the ongoing state, I use the 2025 benchmark reporting cycle through July 9. Results after the post cannot replace the historical assessment.
support_condition: Dated benchmark records show low AI task-solving rates relative to human performance, and direct task analysis documents difficulty combining rules or concepts.
contradiction_condition: Results available at the post date show broadly strong or human-comparable ARC-AGI-2 performance, including compositional reasoning tasks, or show that the alleged compositional component did not exist.
measurement_requirements: Use ARC-AGI-2 task-solving accuracy with identified evaluation sets and attempt rules. Distinguish average human performance from collective human coverage of all tasks.
source_requirements: Benchmark-author reports, dated leaderboard records, or primary evaluation papers. Overall scores must be accompanied by direct evidence about compositional tasks.
