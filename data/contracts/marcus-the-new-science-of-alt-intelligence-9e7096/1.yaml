evaluator_interpretation:
  - Assess the original Gato described immediately before the post, not subsequent models.
  - "Use May 12–14, 2022: the initial public report through the post date is the latest reportable state."
  - Read the brain and child comparisons as comparisons of operating and learning methods, not a denial of every biological inspiration.
  - Read language understanding as dependable comprehension beyond selected demonstrations; fluent output alone does not settle it.
  - Read alignment and mission-critical trust as dependable behavior consistent with intended human goals and adequate reliability where failure has serious consequences.
  - Support for the complete claim requires evidence for all five assertions. An untested capability is not automatically an absent capability.
support_condition: Architecture and learning evidence establish the asserted differences, and suitable language, alignment, and reliability evaluations substantiate the remaining categorical limitations.
contradiction_condition: Direct evidence establishes a capability or correspondence that clearly conflicts with at least one assertion under the stated reading. Selected language examples alone do not establish dependable general comprehension.
measurement_requirements: Separate architecture, training, language comprehension, value alignment, and application-specific reliability. Distinguish demonstrated failures from missing tests.
source_requirements: The original Gato report, documented demonstrations, and evaluations of that version. General evidence about other models is context only.
