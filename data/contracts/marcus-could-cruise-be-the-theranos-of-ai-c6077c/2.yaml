evaluator_interpretation:
  - The conclusion expresses a qualified impression about Cruise at the time of the post, not an unconditional assertion that its vehicles lack autonomy.
  - The surrounding passage expressly reserves judgment pending information about what remote operators do.
  - Scoring the whole statement would require removing its qualification and supplying a definition of autonomy. Neither change is warranted.
  - No operational reporting window is imposed because this statement is not being converted into a measurable historical observation.
support_condition: No factual support condition fairly settles the statement as written. Records could establish Cruise's representations and human assistance requirements, but cannot establish this qualified impression as a defined outcome.
contradiction_condition: No factual contradiction condition fairly settles the statement as written. Evidence of autonomous operation would bear on the concern without disproving that the situation appeared otherwise to Marcus.
measurement_requirements: A separately specified factual claim would need identified public representations, operator duties, and a stated measure of autonomy. These cannot be supplied as though Marcus committed to them here.
source_requirements: Operational records and dated company representations could inform the underlying concern, but cannot remove the qualification in the original statement.
