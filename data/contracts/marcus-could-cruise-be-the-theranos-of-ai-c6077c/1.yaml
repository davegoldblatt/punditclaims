ambiguity_flags:
  - Autonomous may refer to absence of an onboard driver, independence in driving tasks, or absence of all human assistance.
  - Anything but supplies no quantitative threshold.
  - October 2023 is the evaluator's latest-operating-period interpretation of right now.
  - The surrounding passage expressly reserves judgment about what operators do.
