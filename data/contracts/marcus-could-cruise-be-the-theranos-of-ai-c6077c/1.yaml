assessment_axis: historical_observation
explicit_source_elements:
  - Cruise has been presenting its vehicles as autonomous
  - right now
  - it looks like they are anything but
evaluator_interpretation:
  - The ordinary factual reading is a material discrepancy between advertised self-driving capability and actual dependence on humans to perform driving.
  - Autonomous means performing the driving task within the stated operating conditions. The presence of remote advice alone does not settle whether that description is accurate.
  - Use October 2023, the latest operating month before the post, for the ongoing-state observation.
  - Treat looks like as qualified confidence in a factual assessment, while preserving the post's explicit uncertainty about operator duties.
support_condition: Records of October 2023 operations show that humans routinely performed driving tasks which Cruise represented its vehicles as performing autonomously.
contradiction_condition: Records establish that the vehicles performed the represented driving tasks independently within their stated operating conditions, with human involvement confined to accurately disclosed assistance.
measurement_requirements: Representative logs identifying necessary human actions, their frequency, and whether they performed driving tasks; contemporaneous public representations and qualifications.
source_requirements: Company disclosures, operational records, regulator findings, or independently verified investigations. Allegations accepted for purposes of a dismissal motion are not established operational facts.
