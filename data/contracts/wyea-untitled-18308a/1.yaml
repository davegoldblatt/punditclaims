assessment_axis: historical_observation
explicit_source_elements:
  - Google has desperately tried (and failed)
  - to convince Wall Street
  - that it’s building and selling the future
evaluator_interpretation:
  - The plain reading is that Google's AI pitch had failed to win meaningful confidence among Wall Street analysts and investors by the post date.
  - Assess expressed confidence in Google's AI competitive and commercial position. Do not require investors to endorse the literal phrase building and selling the future.
  - The claim retrospectively describes Google's efforts through publication and supplies no start date. Recent reactions carry more weight than earlier setbacks.
  - Share-price changes alone cannot establish what investors believed or isolate AI as their cause.
support_condition: Contemporaneous evidence shows broad rejection or continuing lack of confidence in Google's AI competitive and commercial position through the post date.
contradiction_condition: Contemporaneous evidence shows meaningful acceptance of Google's AI pitch among prominent Wall Street institutions, inconsistent with categorical failure.
measurement_requirements: Use explicit analyst or investor assessments of Google's AI position, with market movements as supporting context rather than a sole measure.
source_requirements: Dated institutional commentary or reputable reporting of it. Prefer original analyst notes when accessible.
