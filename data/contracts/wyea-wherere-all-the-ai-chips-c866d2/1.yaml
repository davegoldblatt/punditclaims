assessment_axis: historical_observation
explicit_source_elements:
  - everybody is struggling
  - If Microsoft is struggling, everybody’s struggling
evaluator_interpretation:
  - In context, 'everybody' means hyperscalers and neoclouds building large-scale AI capacity.
  - The ordinary factual reading is that every operator in that class faces material difficulty bringing planned AI capacity online.
  - Material difficulty includes significant commissioning delays, power or facility bottlenecks, or equipment waiting for deployable infrastructure. Ordinary construction in progress alone does not establish difficulty.
  - Use April 1 through June 30, 2026, the latest completed calendar quarter publicly reportable before the post.
  - The final sentence makes an unconditional observation. The preceding 'if' is an argument for it, not a forecast antecedent.
support_condition: Contemporaneous records establish material AI-capacity deployment difficulties across the full stated class, with adequate operator coverage.
contradiction_condition: Reliable records establish at least one operator in the stated class whose material AI deployment program proceeded without such difficulties during the target period. A single successful project alone is insufficient.
measurement_requirements: Operator-level planned and actual commissioning dates, capacity deliveries and documented bottlenecks, with a defined population of hyperscalers and neoclouds.
source_requirements: Company deployment records, customer acceptance records, utility or permitting records, or credible independent reporting. General risk disclosures and demand exceeding supply alone are insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Everybody' may be rhetorical, but the plain assessment retains the universal scope."
  - "'Struggling' has no supplied measure of severity."
  - No reporting period is named; the latest completed calendar quarter before publication is used.
  - The boundary between hyperscalers, neoclouds and other infrastructure operators is not defined.
retrospective_or_prospective: retrospective
