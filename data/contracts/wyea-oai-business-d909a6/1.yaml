assessment_axis: historical_observation
explicit_source_elements:
  - loses money every single time that somebody uses their product
  - I severely doubt it’s turning a profit on these customers
  - certainly losing money on any and all power users
evaluator_interpretation:
  - The firm assertions concern losses on every use and every power user. The premium-subscriber clause expresses doubt and is not treated as a firm universal prediction.
  - The ordinary reading compares revenue attributable to usage or a subscriber with the costs of serving that usage or subscriber. Company-wide losses alone do not establish this.
  - For the ongoing state, I use August 2024, the latest completed monthly reporting period identified in the supplied context before publication.
  - I interpret power users as unusually heavy users, but do not invent a numerical usage threshold.
support_condition: Reliable service-level and subscriber-level data for the target period establish negative contribution on every relevant use and every heavy-user account, with revenue and service costs allocated consistently.
contradiction_condition: Reliable matching-period data identify a profitable use or heavy-user account, or a positive aggregate contribution that necessarily includes profitable uses under the same revenue and cost definitions.
measurement_requirements: Match product, period, usage, prices, and service costs. Distinguish marginal or contribution profit from company-wide net profit, and distinguish subscriber averages from every individual account.
source_requirements: Actual unit-economics disclosures or independently validated measurements. Unverified cost models and aggregate annual losses are insufficient.
