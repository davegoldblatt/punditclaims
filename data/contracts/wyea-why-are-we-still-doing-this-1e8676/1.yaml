assessment_axis: historical_observation
explicit_source_elements:
  - Every single AI startup without exception
  - None of them are improving their margins.
  - None of them have a solution.
evaluator_interpretation:
  - The relevant population is AI application startups, including the named examples. Established public software companies are outside this passage's scope.
  - The ordinary reading of margins in this discussion of model-serving costs is gross margins. Improving requires comparable measurements over time; a positive margin alone is insufficient.
  - A solution means demonstrated sustainable product economics, rather than merely raising capital or announcing a plan.
  - I use calendar 2025, the latest completed annual reporting period before publication, consistent with the surrounding discussion of these private companies' 2025 economics.
  - No accounting basis is identified for the margin assertion. The surrounding financing and revenue figures do not establish one.
support_condition: Comparable financial evidence must establish that no startup in the relevant population improved its gross margin during the target period, and that none demonstrated sustainable product economics.
contradiction_condition: One qualifying startup with comparable improving gross margins, or demonstrated sustainable product economics, would refute the universal assertion. A definitive financial verdict also requires an identifiable accounting basis.
measurement_requirements: Compare the same company's gross margins using consistent revenue and cost definitions. Separate gross margins from operating margins, net profitability, and selected customer-level margins.
source_requirements: Prefer financial disclosures or attributable management statements with defined reporting periods. Surveys and press estimates require methodological and scope qualifications.
