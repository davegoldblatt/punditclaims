explicit_source_elements:
  - Every single AI startup without exception
  - None of them are improving their margins
  - None of them have a solution
evaluator_interpretation:
  - "Plain reading: no AI application startup (the Cursor, Harvey, Lovable type he discusses, separate from Anthropic and OpenAI) was seeing its margins get better at the time of the March 2026 post. 'Margins' is read as gross margin, the margin usually reported for these startups."
  - The claim is universal ('without exception'), so one credible report of an AI startup's margins improving during the recent period is enough to contradict it.
  - "Period: the claim describes a current trend with no period named. I use 2025-01-01 to the post date (2026-03-17), which covers the 2025 and early-2026 figures he cites. This choice is flagged."
  - "'None of them have a solution' has no testable measure and is not graded on its own. The verdict rests on the margins sentence."
support_condition: Available reporting through the post date shows no AI startup with improving gross margins, or shows margins flat or worsening across the startups for which figures exist.
contradiction_condition: Credible reporting shows at least one AI startup whose gross margins improved during 2025 to March 2026.
measurement_requirements: Gross margin figures or direction for named AI startups, reported by the company or credible press or analysts, covering 2025 to March 2026.
source_requirements: Private companies rarely publish audited margins. Reputable news reports with sourced figures, or analyst estimates, are acceptable and are labelled as estimates.
metric_scope:
  company: AI startups (application layer, e.g. Cursor, Harvey, Lovable)
  metric: margins (read as gross margin), direction of change
