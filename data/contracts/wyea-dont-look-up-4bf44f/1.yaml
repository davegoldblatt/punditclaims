  - Both are unprofitable
  - both lose tens of billions of dollars a year
evaluator_interpretation:
  - Both means Anthropic and OpenAI separately, not their combined losses.
  - The ordinary numerical reading of 'tens of billions' is at least $20 billion per company per year.
  - Use calendar 2025, the latest completed annual period before publication; do not substitute projected full-year 2026 figures.
  - Annual net loss is the initial plain reading, but the words do not identify an accounting basis or distinguish net loss, operating loss and cash burn.
  - The supplied passage does not attribute the loss figures to company accounts or a named estimate. The contract therefore retains an unknown accounting basis.
support_condition: Comparable annual figures show both companies unprofitable and each losing at least $20 billion on the accounting basis intended by the claim.
contradiction_condition: Comparable annual figures show either company profitable or losing less than $20 billion on the intended accounting basis.
measurement_requirements: Separate each company; use realized annual losses. Do not substitute financing, compute spending, cash burn, operating losses or annualized interim results for net losses.
source_requirements: Prefer audited accounts. Independently verified reporting on private accounts is acceptable when public accounts are unavailable. The speaker's reporting alone cannot establish the outcome.
