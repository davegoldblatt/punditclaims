assessment_axis: historical_observation
explicit_source_elements:
  - A decent fraction of the AI community
  - has already recognized
  - the primary forte of large language models is in generating bullshit
  - many also see
  - not making the progress that some expected
evaluator_interpretation:
  - This is a claim about the prevalence of two beliefs, not simply whether LLMs make errors or autonomous-driving projects experienced delays.
  - The plain reading of 'generating bullshit' is producing plausible language without dependable regard for truth; 'primary forte' says this is their main strength.
  - A decent fraction and many mean a sizeable, non-isolated constituency, without requiring a majority.
  - "For this ongoing community assessment, use the latest completed calendar year and the pre-publication portion of January: January 1, 2022 through January 22, 2023. This reporting window is an evaluator choice, not a period Marcus supplied."
  - The population is the AI community broadly. Findings about NLP researchers or vehicle-industry executives alone require scope qualifications.
support_condition: Contemporaneous surveys or sufficiently broad documented statements establish both that a sizeable share of the AI community held the stated primary-strength assessment of LLMs and that many regarded autonomous-driving progress as falling short of expectations.
contradiction_condition: Representative evidence directly measuring either belief shows it was confined to a small fringe. Evidence that some researchers disagreed is insufficient.
measurement_requirements: Identify the surveyed population, sampling method, question wording, and prevalence of each belief. Distinguish acknowledging errors from judging unreliable generation to be LLMs' principal strength.
source_requirements: Prefer original contemporaneous surveys and direct institutional or researcher statements. Do not infer population prevalence from selected critics.
