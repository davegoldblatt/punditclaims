explicit_source_elements:
  - GPT and similar AI systems
  - whether they can count
  - They can’t, reliably
evaluator_interpretation:
  - Assess the counting assertion identified by the screens, separately from the historical assertion about when researchers first tested counting.
  - The plain reading is that contemporary GPT-like models frequently make mistakes when directly counting items or characters. It does not mean they never produce correct counts.
  - Include ordinary and step-by-step prompting. Treat execution of externally generated programs separately from the model answering directly.
  - "For this ongoing research-state observation, use the latest completed research year and the elapsed publication year: 2022 through 17 February 2023. This observation window is evaluator-selected."
support_condition: Repeated evaluations show appreciable counting errors across contemporary GPT-like models or ordinary counting tasks, including errors that remain with reasonable prompting.
contradiction_condition: Representative evaluations show consistently dependable direct counting across varied ordinary tasks and contemporary models, with reported failures confined to unusual or misleading prompts.
measurement_requirements: Identify model versions, counting tasks, prompting methods, accuracy, and whether external computation produced the answer. Isolated failures are insufficient by themselves.
source_requirements: Prefer contemporary primary evaluations with disclosed methods and results. Use informal demonstrations only as supplementary evidence.
