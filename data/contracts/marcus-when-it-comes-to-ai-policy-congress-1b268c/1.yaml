evaluator_interpretation:
  - The claim concerns the preemption campaign underway when the post appeared on May 14, 2025.
  - The ordinary reading is that growing state AI regulation was a specific reason major technology companies sought federal restrictions on state rulemaking.
  - Support requires explicit links in contemporaneous submissions from multiple companies. It does not require proving that this was their sole motive.
  - The claim does not establish that every technology company supported preemption or opposed every form of oversight.
support_condition: Contemporaneous company submissions explicitly connect requests for federal preemption with existing or proliferating state AI rules.
contradiction_condition: Reliable contemporaneous records establish that the alleged preemption campaign or its asserted connection to state regulation was false.
measurement_requirements: Examine the requested policy and its stated rationale together. General lobbying expenditure or mere temporal coincidence is insufficient.
source_requirements: Prefer company submissions published before the post. Public statements establish expressed reasons, with limited access to private motives.
