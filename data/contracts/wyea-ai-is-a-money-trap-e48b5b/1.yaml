assessment_axis: forecast_outcome
explicit_source_elements:
  - I expect a Chumlee-esque deal
  - helps CEO Michael Truell buy a porsche
  - his staff makes nothing
evaluator_interpretation:
  - "The Porsche is figurative: the forecast predicts personal financial benefit for the CEO."
  - Staff means ordinary non-founder employees, and nothing means no meaningful proceeds from the exit rather than no future salary.
  - The surrounding $10 billion sale discussion describes a contrasting successful exit. The exact sentence does not specify an acquisition price or an accounting basis.
  - An eventual exit is the predicted event, not an externally imposed antecedent. There is no deadline.
support_condition: Completed transaction records show a financially beneficial exit for Truell while ordinary non-founder employees receive no meaningful exit proceeds.
contradiction_condition: Reliable transaction and allocation records show meaningful exit consideration reaching ordinary non-founder employees, or otherwise establish a successful sale incompatible with the predicted founder-only outcome.
measurement_requirements: Separate founder holdings, ordinary employee holdings, vested consideration, unvested replacement awards, retention compensation, and realized cash proceeds.
source_requirements: Closing documents and employee-allocation records, or reliable reporting identifying the employee beneficiaries and applicable vesting terms.
metric_scope:
  company: Cursor (Anysphere)
  metric: Exit proceeds allocated to the CEO and ordinary non-founder employees
  currency: null
  units: Unspecified monetary proceeds
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A completed exit with sufficiently documented founder and ordinary-employee consideration can resolve the forecast. An announced price, funding valuation, or promise of future vesting cannot alone establish employee proceeds.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Chumlee-esque and Porsche are rhetorical descriptions.
  - Staff and nothing do not specify beneficiaries or treatment of unvested equity.
  - No currency, accounting basis, or cash-versus-equity measure is supplied.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
