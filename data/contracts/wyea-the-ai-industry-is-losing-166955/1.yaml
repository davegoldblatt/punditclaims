assessment_axis: causal_assessment
explicit_source_elements:
  - the only real outcome
  - appears to be
  - propping up Anthropic and OpenAI
  - two deeply-unprofitable companies
  - receiving a small fraction of it back
  - only made possible through hundreds of billions of dollars of venture capital subsidies
evaluator_interpretation:
  - The claim concerns Microsoft, Amazon, Alphabet and Oracle's AI infrastructure spending and its commercial returns.
  - The plain reading is that substantive commercial benefits are confined to supporting the two labs, with revenue dependent on outside financing. This is stronger than saying investment is risky or returns are inadequate.
  - I use January–March 2026, the latest common calendar quarter reportable before the post, for the ongoing operating claim. Historical capital investment and cumulative financing require separate reconciliation.
  - "'Appears to be' qualifies confidence; it is not a conditional antecedent."
  - The accounting basis is estimate because the argument relies on the author's reporting and estimates. The wording does not establish a uniform accounting basis for its several components.
support_condition: Comparable evidence must establish that substantive AI-capex benefits were confined to the two labs, that attributable realized revenue was a small fraction of comparable spending, and that this revenue depended on the claimed scale of venture financing.
contradiction_condition: Material commercial returns attributable to other customers, or demonstrated revenue independent of the asserted financing dependency, would contradict the exclusivity claim. A reconciled comparison could separately contradict the small-return assertion.
measurement_requirements: Separate AI from general infrastructure spending; distinguish realized revenue from run rates, financing commitments from cash received, and net losses from cash burn. Trace customer payments and financing without double counting.
source_requirements: Company disclosures and financial records, supplemented by independently reported private-company figures where primary records are unavailable. Company statements alone do not establish the financing counterfactual.
