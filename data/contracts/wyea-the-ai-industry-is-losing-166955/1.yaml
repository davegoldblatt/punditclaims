  - Neither 'real outcome' nor 'small fraction' has a numerical definition.
  - The comparison mixes cumulative investment, current revenue and cumulative financing.
  - The population of hyperscalers is implicit.
  - The claim combines financial observations with a financing-dependency counterfactual.
