assessment_axis: historical_observation
explicit_source_elements:
  - effectively the entire generative AI industry
  - its nearest competitor
  - less than five percent
  - 500 million weekly active users
evaluator_interpretation:
  - The concrete test is whether the largest competing general-purpose generative AI assistant had fewer than 25 million weekly active users worldwide.
  - Gemini is an ordinary competitor within the stated industry-wide scope. Establishing that any competitor exceeded the ceiling is sufficient; identifying the largest is unnecessary.
  - Use March 2025, the latest complete calendar month before publication, for this ongoing observation.
  - The industry-dominance wording is assessed through its accompanying user-count assertion, not converted into a separate revenue or market-share claim.
  - A daily active-user count can establish a mathematical lower bound on weekly active users for the same population and corresponding week; it is not treated as an exact weekly count.
support_condition: Comparable worldwide weekly-user measurements show ChatGPT near 500 million and every competing assistant below 25 million during the target period.
contradiction_condition: At least one competing assistant has 25 million or more weekly active users during the target period, established directly or by a valid same-population lower bound.
measurement_requirements: Unique active users, with matching product and geographic scope. Do not substitute visits, downloads, or monthly users for weekly users. Any derived weekly lower bound must state its assumptions.
source_requirements: Company disclosures, court records containing company measurements, or independent audience measurement. Reliable court reporting is acceptable if the underlying exhibit cannot be obtained.
