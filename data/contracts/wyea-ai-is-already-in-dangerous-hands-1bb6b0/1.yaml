assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI and Anthropic make up the vast majority of AI compute demand
  - any contraction of that demand
  - material restatements of revenue
  - the $748 billion in revenue backlogs
  - across every hyperscaler
  - the neoclouds and any other counterparty
evaluator_interpretation:
  - The antecedent is an actual contraction in OpenAI and Anthropic's combined compute demand. A training pause, slower growth or lower token prices alone does not establish it.
  - Every refers to each affected compute counterparty, including hyperscalers and neoclouds. It describes the scope of the predicted consequence, not a separate antecedent.
  - In ordinary financial commentary, restatements may mean downward revisions. Formal corrections of previously issued financial statements are a narrower alternative reading.
  - The $748 billion is a stated backlog baseline, not a predicted loss of that entire amount.
  - The required metric_scope describes the quantified backlog stock. Revenue is a separate flow and would require separate matched evidence.
  - No accounting basis, backlog measurement date or response deadline is supplied.
support_condition: After a verified demand contraction, every affected counterparty reports material downward changes in both revenue and backlog attributable to that contraction, using comparable measures.
contradiction_condition: After a verified contraction and a completed contractual and reporting adjustment cycle, at least one affected counterparty demonstrably has no material downward change in one of the claimed measures.
measurement_requirements: Measure combined demand on a consistent basis; identify affected suppliers; distinguish backlog from realized revenue; establish materiality and causation for each reported change.
source_requirements: Dated demand measurements and counterparty filings or disclosures, including contract terms and explanations of any accounting changes.
metric_scope:
  company: Hyperscalers, neoclouds and other OpenAI/Anthropic compute counterparties
  metric: Aggregate revenue backlog; quantified baseline stated as 748
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A verified demand contraction followed by completed, attributable adjustments across all affected counterparties could establish support. A documented unaffected counterparty could establish contradiction once its relevant adjustment cycle is complete. Passage of time alone cannot settle this undated forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No forecast deadline or adjustment lag is stated.
  - Demand could mean physical compute usage, reserved capacity or spending.
  - It is unclear whether contraction at either lab alone triggers the prediction.
  - Restatement may mean a formal accounting correction or a revision to expectations.
  - The backlog aggregate lacks a source, measurement date and accounting basis.
  - Vast majority and material have no numerical thresholds.
retrospective_or_prospective: retrospective
