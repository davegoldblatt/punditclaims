evaluator_interpretation:
  - The systems are the specific experimental models used for the 2025 IMO results.
  - Substantial information means concrete explanations of system design or training beyond naming broad methods. It does not require source code, weights, or full reproducibility.
  - The target is the cumulative public disclosure record through July 22, 2025; no earlier starting date is specified.
  - Documentation for related models is relevant context unless its applicability to the IMO systems is established.
support_condition: The contemporaneous disclosure record for both IMO systems contains only broad descriptions, without substantive system-specific design or training explanations.
contradiction_condition: At least one company had publicly supplied substantive design or training explanations applicable to its IMO system by July 22, 2025.
