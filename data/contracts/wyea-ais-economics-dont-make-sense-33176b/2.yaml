assessment_axis: forecast_outcome
explicit_source_elements:
  - At some point
  - investors ... will begin to question mounting R&D costs
  - which is where AI token burn is usually hidden
  - when the company's revenue growth fails to follow
  - All it changes is one bad earnings call to change that narrative
evaluator_interpretation:
  - This is a conditional forecast with no deadline. The condition is that a company's R&D costs, inflated by AI token spending, keep rising while its revenue growth does not keep up.
  - The outcome is real skeptical pushback from investors on that spending, such as a sharp sell-off or sustained public criticism tied to AI token costs in R&D. A routine clarifying question from an analyst does not count, and neither does modest revenue growth in a quarter the market called strong.
  - Investor worry about data-center capital spending is a different thing from the token-burn R&D costs he describes, so it does not count.
support_condition: A dated case where a company's R&D costs, publicly linked to AI token spending, grew while its revenue growth clearly lagged, and investors then pushed back on that spending in a skeptical way (for example a sell-off or sharp criticism on an earnings call aimed at those costs).
contradiction_condition: A case where the condition clearly held (R&D costs from AI tokens rising, revenue growth clearly lagging, the link publicly reported) and investors did not question it over a sustained period. With no deadline, only that kind of clear case would count against him.
measurement_requirements: R&D cost growth and revenue growth from company filings, a public link between the R&D growth and AI token or inference spending, and reports of how investors reacted.
source_requirements: Company filings or earnings-call transcripts for the condition. Reputable financial news for how investors reacted.
metric_scope: null
original_horizon: At some point
horizon_interval:
  start: 2026-04-28
  end: null
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: "Settles as supported once one dated case meets the support condition: AI-token-driven R&D growth plus clearly lagging revenue, followed by skeptical investor pushback aimed at those costs."
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No company, threshold or deadline named.
  - "'Revenue growth fails to follow' is not quantified."
  - Token spending is said to be 'hidden' in R&D, so the condition is hard to see in filings.
  - Unclear whether investor worry about capex counts as questioning R&D costs.
