assessment_axis: forecast_outcome
explicit_source_elements:
  - At some point
  - investors
  - will begin to question mounting R&D costs
  - AI token burn
  - when the company’s revenue growth fails to follow
evaluator_interpretation:
  - The plain reading is that investors will start scrutinizing rising R&D spending that includes internal AI token costs when revenue growth does not keep pace with that spending.
  - Questions from investment analysts on earnings calls count as public investor scrutiny, consistent with the surrounding reference to an earnings call.
  - Begin to question requires an identifiable instance of scrutiny, not proof of a market-wide investor revolt.
  - Revenue growth need not be negative; it must lag the relevant cost growth.
  - This grades the forecast of scrutiny, not the separate parenthetical generalization about where token costs are usually recorded.
support_condition: A dated post-publication earnings call or investor communication shows scrutiny of rising R&D costs including AI token costs at a company whose revenue growth lagged that spending.
contradiction_condition: A decisive event rules out such eventual scrutiny. A period without questions, or management defending its spending, cannot falsify this undated forecast.
measurement_requirements: Match the investor questions, R&D spending, token-cost attribution, and revenue performance to the same company and reporting period. General concern about data-center capital spending does not qualify.
source_requirements: An attributable earnings-call transcript or investor communication, with company financial reporting and management explanations for the triggering circumstances.
metric_scope: null
original_horizon: At some point
horizon_interval:
  start: 2026-04-28
  end: null
  precision: day
target_period: null
condition_status: met
early_resolution_rule: Resolve as supported upon a dated investor or investment-analyst question meeting the stated company, spending, and revenue conditions.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Revenue growth fails to follow has no numerical definition.
  - The claim does not specify how widespread investor questioning must become.
  - Investment analysts are treated as a public expression of investor scrutiny.
  - No deadline is stated.
