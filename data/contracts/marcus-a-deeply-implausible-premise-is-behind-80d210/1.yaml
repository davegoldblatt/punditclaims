assessment_axis: forecast_outcome
explicit_source_elements:
  - over the next few years
  - both countries
  - build a lot of generative AI infrastructure
  - quite possibly significantly more than they actually need
evaluator_interpretation:
  - "'Both countries' means the United States and China."
  - The firm part of the forecast is that both countries build a lot of generative AI infrastructure, such as data centres, GPU clusters and power capacity for AI, over the next few years.
  - The excess part ('quite possibly significantly more than they actually need') is hedged. It is a possibility, not a firm prediction. It is not required for support, and its failure would not count as a contradiction.
  - "'Next few years' is read as roughly three to five years from December 2025. The latest plausible end is the end of 2030."
support_condition: By the end of the horizon, public records such as company capex filings, official statistics, or data-centre construction and commissioning trackers show that both the US and China built large amounts of generative AI infrastructure during the few years after December 2025.
contradiction_condition: By the end of the horizon, records show that either the US or China built only modest new generative AI infrastructure during the period, for example after a sharp, sustained collapse in AI data-centre buildout.
measurement_requirements: AI data-centre capex, installed AI compute or GPU counts, and data-centre power capacity added in the US and China across the period, compared with earlier years.
source_requirements: Company filings (hyperscaler capex), official statistics, or independent data-centre capacity trackers covering both countries.
metric_scope: null
original_horizon: over the next few years
horizon_interval:
  start: 2025-12-13
  end: 2030-12-31
  precision: year
target_period: null
condition_status: not_applicable
early_resolution_rule: None is set for support, because the claim covers buildout over several years. It could be contradicted early only by a decisive, documented collapse in AI infrastructure building in either country that clearly cannot recover within the horizon.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Next few years' has no exact end date. It could mean about 2028 or as late as 2030."
  - "'A lot' has no numeric threshold."
  - The 'more than they need' part is hedged with 'quite possibly', so it is not a firm commitment.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
