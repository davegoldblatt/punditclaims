explicit_source_elements:
  - they’re losing more money over time
  - Anthropic’s gross margins were 40% in 2025
  - OpenAI’s gross margins fell from 40% in 2024 to 33% in 2025
evaluator_interpretation:
  - The plain reading is that annual absolute losses increased at both companies. Gross margins are supporting arguments, not interchangeable measures of those losses.
  - Use 2024 versus 2025, the annual comparison supplied by the surrounding text.
  - Operationalize losses as annual net losses, while flagging that the speaker also discusses cash burn and gross margins.
  - The contract uses estimate because the financial argument relies on press reports. Later accounting disclosures are not silently substituted for that basis.
support_condition: Comparable realized annual net-loss estimates show increased losses from 2024 to 2025 at both companies.
contradiction_condition: Comparable annual net-loss estimates show unchanged or smaller losses at either company. A gross-margin improvement alone does not contradict an increase in absolute net losses.
measurement_requirements: Separate company comparisons with consistent loss definitions, consolidation boundaries and accounting treatments. Distinguish actual year-over-year changes from misses against forecasts.
source_requirements: Underlying financial records or independently verified reporting. The speaker's reporting cannot independently corroborate his claim.
metric_scope:
