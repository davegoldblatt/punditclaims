ambiguity_flags:
  - No reporting interval accompanies 'now'; the current-year period through publication is an evaluator choice.
  - "'All' combines observed failures, causal suggestions, potential limits, and threats."
  - "'Echo chamber', 'undoing', and 'ecosphere pollution' have no specified measures."
  - Evidence about generative AI generally does not necessarily identify an LLM mechanism.
  - The outcome could differ if the sentence means only that every subject remained a legitimate concern.
