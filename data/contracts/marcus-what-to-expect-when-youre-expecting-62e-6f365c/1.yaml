  - In retrospectives written in 2043
evaluator_interpretation:
  - Read as a retrospective claim that the seven GPT-4 predictions were substantively accurate. This does not require treating rhetorical descriptions as literal technical claims.
  - The assessment period starts in 2023, the year the original essay explicitly anticipated, and ends on 2025-07-27, when Marcus asserted vindication. Later developments cannot establish what had already happened by that assertion.
  - Persistent unreliability means material failures in relevant tasks, not an absence of improvement or usefulness. Successful integrations alone do not establish dependable interpretation of user intentions.
  - The seventh prediction includes longer-term claims about future architectures, a shift within a decade of December 2022, and historical judgments in 2043. These remain part of the referenced list; an unelapsed prediction is not a failed prediction.
  - A narrower reading referring only to the near-term warnings about errors and safety would receive substantially stronger support.
support_condition: "Contemporaneous evaluations substantiate the material predictions across the referenced list: persistent errors, unreliable reasoning and medical advice, hallucinations and guardrail weaknesses, unreliable downstream use, limited generality, unresolved alignment, and the claimed architectural trajectory. Supporting several warnings alone does not settle the whole list."
contradiction_condition: Comparable evidence demonstrates that material predicted limitations did not persist or that a substantive prediction was false. A mixed finding requires both substantiated and refuted parts. Improvements, successful demonstrations, and unelapsed deadlines do not alone constitute refutation.
measurement_requirements: Evaluate identified GPT-4 versions on tasks relevant to each prediction. Distinguish controlled benchmark results from dependable deployment, structured output from correct intentions, and GPT-4 alone from systems with external aids. No numerical reliability threshold was supplied.
source_requirements: Use primary evaluations and dated company disclosures available by the evaluation date, concerning outcomes through 2025-07-27. Use Marcus's original essay only to establish what he predicted.
