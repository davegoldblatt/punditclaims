assessment_axis: causal_assessment
explicit_source_elements:
  - AI progress isn’t hampered by a lack of access, talent, resources, novel approaches, or industry buy-in
  - but by a single-minded focus on Large Language Models
  - obviously-limited from the very beginning
  - Gary Marcus was able to call it in 2022
evaluator_interpretation:
  - The plain reading attributes the industry's shortfall in useful AI capability chiefly to concentration on LLMs and excludes the listed shortages as material constraints.
  - Progress means improved capability and reliability on meaningful tasks, not investment or publicity.
  - The causal assessment concerns the state of development immediately before publication, using the latest completed quarter as its target period.
  - Older experiments can inform mechanisms but cannot alone establish the binding industry-wide constraint in early 2026.
  - The reference to Marcus is not independent evidence of the claimed mechanism.
support_condition: Comparative evidence shows that concentrating effort on LLMs materially limits useful progress relative to feasible alternatives, while establishing that the listed shortages are not material constraints.
contradiction_condition: Credible causal evidence establishes a listed shortage as a material constraint in the target setting, or shows that the alleged concentration on LLMs does not explain the claimed shortfall.
measurement_requirements: Compare useful capabilities and reliability while accounting for compute, data, researcher effort, deployment conditions, and task coverage. Separate narrow benchmark advantages from general progress.
source_requirements: Prefer controlled comparisons, reproducible research, and documented development constraints. Funding totals, isolated failures, and predictions alone cannot establish the causal attribution.
