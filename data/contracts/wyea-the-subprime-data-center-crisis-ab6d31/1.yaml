assessment_axis: historical_observation
explicit_source_elements:
  - hyperscalers take on effectively no risk
  - investors are left holding the bag
  - Those Meta and Microsoft neocloud deals
  - terminated in the event that delivery milestones are not met
evaluator_interpretation:
  - This tests contractual risk allocation, not a numerical loss estimate.
  - The ordinary reading is that hyperscalers retain no material financial downside while neocloud investors bear it. Effectively no risk need not mean literally no conceivable risk.
  - Holding the bag describes exposure to losses, not evidence that losses have already occurred.
  - For the ongoing observation, use January through March 2026, the latest completed quarter ordinarily reportable before the post. Later disclosures can establish terms agreed during that period.
  - Construction failure and weak demand after delivery are distinct risks; termination protection against the former does not necessarily remove the latter.
support_condition: The identified contracts leave hyperscalers without material payment or loss exposure while assigning failed-project losses to neocloud investors.
contradiction_condition: A material arrangement within the stated scope leaves a hyperscaler exposed through binding capacity purchases, payments independent of utilization or comparable financial obligations.
measurement_requirements: Read purchase obligations together with delivery conditions, termination rights, refunds, guarantees and recourse. Do not treat all customer payments as losses.
source_requirements: Prefer filed contracts and company disclosures of their operative terms.
