assessment_axis: historical_observation
explicit_source_elements:
  - Most or all
  - major big tech companies
  - joined a lobbying organization
  - fought SB-1047, tooth and nail
  - despite broad public support
evaluator_interpretation:
  - Major big tech ordinarily includes Alphabet/Google, Amazon, Apple, Meta, and Microsoft. Most means a majority of that group; all is not required.
  - Joined means affiliation or financial partnership by the campaign period, not necessarily joining specifically to oppose this bill.
  - Tooth and nail means sustained, forceful public lobbying rather than a measurable spending threshold.
  - Broad public support means a clear majority in contemporary California voter polling describing the bill, with question wording and contrary surveys considered.
  - The target period is the bill's campaign through the post date. Membership and polling are assessed from dated records available for that campaign.
support_condition: A majority of the ordinary Big Tech group is linked to an organization conducting forceful opposition, while contemporary polling establishes broad support for the described bill.
contradiction_condition: The alleged affiliation or opposition is disproved, or comparable polling consistently shows no broad support. A contrary survey must be assessed for wording and population before treating it as equivalent.
measurement_requirements: Identify companies and the organization, document its opposition, and inspect survey population, field dates, results, and framing.
source_requirements: Dated membership disclosures or reliable contemporary reporting, the organization's own lobbying documents, and primary polling releases where accessible.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2024-02-07
  end: 2024-08-20
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Major big tech has no enumerated denominator.
  - Joined does not specify when or why affiliation began.
  - Tooth and nail has no numerical intensity threshold.
  - Broad support depends partly on how the proposed bill is described.
  - The ongoing campaign has no explicit start date; the bill's introduction anchors the period.
retrospective_or_prospective: retrospective
