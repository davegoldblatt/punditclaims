explicit_source_elements:
  - effectively cutting its data center expansion
  - over a gigawatt of capacity
  - impossible to reconcile these cuts
  - generative AI will be a massive, transformative technological phenomenon
evaluator_interpretation:
  - The claim contains a measurable observation and a broader inference; both must be retained.
  - The capacity observation includes abandoned proposed agreements, consistent with the surrounding discussion.
  - The ordinary reading of the inference is that these withdrawals cannot reasonably coexist with expectations of major generative-AI growth.
  - The February reporting through March 3 anchors the observed cuts. The speaker supplies no numerical definition or deadline for transformative growth.
support_condition: Evidence establishes more than 1 GW of abandoned prospective capacity and establishes that these decisions are incompatible with a reasonable expectation of major generative-AI growth.
contradiction_condition: Comparable records establish no more than 1 GW was abandoned, or evidence establishes a concrete explanation under which the withdrawals coexist with continued expectations of major generative-AI growth.
measurement_requirements: Separate abandoned proposed capacity from net company-wide expansion. Evaluate changes in suppliers, customer allocation, location and timing before drawing conclusions about industry demand.
source_requirements: Use contemporaneous analyst reporting for the capacity observation and company or customer records for explanations. Public optimism alone does not prove management's private expectations.
