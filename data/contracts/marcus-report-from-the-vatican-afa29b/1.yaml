evaluator_interpretation:
  - The surrounding discussion identifies the target as general-purpose LLMs.
  - The plain reading is that these systems have substantial, recurring difficulty reliably obeying clear, feasible instructions. It does not mean they fail every instruction.
  - I use October 2026, through the post date, as the latest reporting month for this ongoing capability claim.
  - The tentative ranking of this weakness as perhaps the most dangerous is not separately scored.
support_condition: Contemporaneous evaluations across multiple models and realistic tasks show substantial recurring violations of explicit instructions.
contradiction_condition: Representative contemporaneous evaluations show consistently reliable adherence across realistic instruction types, with failures confined to exceptional cases.
measurement_requirements: Identify models, instructions, scoring rules, and evaluation setting. Distinguish compliance with individual constraints from compliance with every constraint in a prompt.
source_requirements: Primary benchmark results or reproducible interaction records. Isolated anecdotes cannot establish general prevalence.
