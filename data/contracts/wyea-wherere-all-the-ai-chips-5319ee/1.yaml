assessment_axis: forecast_outcome
explicit_source_elements:
  - Capacity will, eventually, come online
  - at a scale that the market for AI compute cannot support
  - it won’t be obvious until it’s way, way too late
evaluator_interpretation:
  - The plain reading is a substantial, widespread surplus of operating AI compute capacity relative to economically sustainable demand.
  - The second clause means that the surplus becomes broadly recognized after substantial investment commitments can no longer be avoided.
  - Eventually supplies no deadline.
  - A failed project, temporary idle capacity, or low chip utilization caused by technical inefficiency does not alone establish a market-wide surplus.
support_condition: Sustained evidence across a representative share of operating AI compute capacity shows insufficient economic demand, corroborated by distressed pricing or stranded investment, with recognition following substantial irreversible commitments.
contradiction_condition: Finite evidence of healthy demand cannot conclusively disprove an unrestricted eventual forecast. Evidence that an identified surplus was recognized before avoidable commitments were made would count against the late-recognition component.
measurement_requirements: Track commissioned capacity, paid utilization, comparable compute prices, costs, stranded assets, and the timing of investor recognition and commitments.
source_requirements: Representative operator records and independent market measurements, supplemented by filings documenting stranded assets and dated investment decisions.
metric_scope: null
original_horizon: eventually
horizon_interval:
  start: 2026-09-22
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, well-documented market-wide overcapacity episode can support the forecast once both sustained economic excess capacity and recognition after irreversible commitments are established. Isolated failures, earlier inefficiency, or a price movement alone do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - The scale and duration of an unsustainable surplus are unspecified.
  - Too late does not identify whose recognition matters or what losses must already be unavoidable.
retrospective_or_prospective: retrospective
