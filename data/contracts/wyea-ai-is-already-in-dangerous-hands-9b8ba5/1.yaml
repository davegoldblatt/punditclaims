evaluator_interpretation:
  - The ordinary reading covers frontier labs making concrete restrictions on development, including scoped pauses with operational safeguards. It does not require a permanent shutdown or an enforceable industry treaty.
  - A commitment need not be legally binding; the speaker did not impose that requirement.
  - The latest pre-publication policy reporting period is September 2026 through September 14. Earlier operational events are not independently treated as September outcomes.
  - The claim contains both a universal denial of concrete slowdown commitments and a characterization of Anthropic's proposal.
support_condition: The contemporaneous record shows only evaluation proposals or vague scheduling intentions, without concrete development restrictions or substantive operational changes.
contradiction_condition: A frontier lab's contemporaneous disclosure establishes concrete development restrictions already implemented or maintained, beyond a suggestion to appoint evaluators.
measurement_requirements: Identify the restricted activity, whether the restriction was implemented, and the safeguards or conditions governing resumption. Distinguish a scoped pause from an industry-wide reduction.
source_requirements: Contemporaneous lab disclosures and the full text of Amodei's proposal; independent corroboration where available.
