evaluator_interpretation:
  - The subject is congressional investigation of Nvidia or Huang concerning the security and export-policy matters discussed in the post.
  - Continuation means at least one substantive further investigative step; it does not require a completed hearing, criminal charge or adverse finding.
  - Further work by another congressional committee on the same matters counts as continuation of congressional investigation.
  - For same-day ordering, I read the statement that Marcus was writing at the opening bell as placing the forecast before that evening. The supplied record does not give an exact publication timestamp.
support_condition: A dated subsequent congressional request for testimony or documents, subpoena, investigative hearing or report advances investigation of these matters.
contradiction_condition: A definitive record establishes that the relevant investigations ended without any subsequent investigative activity. Mere inactivity cannot settle this forecast without a deadline.
measurement_requirements: Establish an investigative step after the forecast, separating the action date from the publication date and a testimony request from completed testimony.
