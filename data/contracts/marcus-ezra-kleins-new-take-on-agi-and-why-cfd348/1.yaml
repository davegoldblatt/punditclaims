evaluator_interpretation:
  - The post defines AGI as a system capable of doing almost any cognitive task a human can do.
  - The statement about logical solvability is his reason for the forecast, rather than a future conditional antecedent.
  - Someday supplies no deadline. Passing a particular benchmark is insufficient to establish the full claim.
support_condition: A publicly demonstrated system shows human-level competence across a sufficiently broad range of cognitive tasks to meet the post's AGI definition, with credible independent evaluation.
contradiction_condition: A decisive impossibility result establishes that systems meeting this definition cannot be achieved. Continued delay alone cannot contradict an unlimited forecast.
measurement_requirements: Broad evaluations of cognitive competence, generalization and reliability, with documented testing conditions and meaningful human comparisons.
source_requirements: Public demonstrations and independent evaluations. A developer's declaration of AGI alone is insufficient.
