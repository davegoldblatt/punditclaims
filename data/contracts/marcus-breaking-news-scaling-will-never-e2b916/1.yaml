assessment_axis: forecast_outcome
explicit_source_elements:
  - There will never be enough data
  - there will always be outliers
  - configurations that have been dominant over the last three decades
evaluator_interpretation:
  - In context, enough means enough for reliable reasoning and planning across unfamiliar cases, not merely enough to finish training or improve a benchmark score.
  - The ordinary reading is that increasing training data alone will not eliminate consequential failures on unfamiliar cases in the configurations under discussion.
  - Always and never provide no deadline.
  - Outliers means unusual inputs or combinations, not large internal activation values.
support_condition: A general result applicable to the specified learning configurations establishes that increasing data alone necessarily leaves consequential generalization failures across the relevant open-ended task scope.
contradiction_condition: An independently reproduced demonstration establishes broadly reliable generalization to unfamiliar reasoning and planning cases through increased training data alone within the specified configurations.
measurement_requirements: Document training-data changes, hold other relevant methods fixed, test genuinely unfamiliar cases, and distinguish broad reliability from success on a finite narrow benchmark.
source_requirements: Primary controlled studies, independently validated demonstrations, or applicable mathematical results.
