evaluator_interpretation:
  - The speaker gives this as his own belief ("I don't think") about whether a goal he himself calls a hypothesis has "worked". He names no measure of success, no market share level, no date, and no test of the causal link.
  - Because it is hedged, the causal part rests on an unstated idea of what "worked" means, and the goal itself is admitted to be a hypothesis, there is no plain reading that a reviewer could grade without supplying criteria he did not give. The financial premise ("loses so much more money than it makes") is graded separately as claim wyea-monopoly-money-7932cb-2.
support_condition: Not adjudicable. There is no stated measure that would show the oligopoly 'did not work', or show that losses caused that.
contradiction_condition: Not adjudicable. There is no stated measure that would show the oligopoly 'worked'.
