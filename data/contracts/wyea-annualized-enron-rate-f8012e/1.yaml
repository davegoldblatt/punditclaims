assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic and OpenAI’s growth depends on
  - the AI startup ecosystem
  - spend increasing amounts on tokens
  - every single month, without fail
  - for what appears to be the rest of time
evaluator_interpretation:
  - In the surrounding discussion of revenues, the ordinary reading of growth is revenue growth at each company, assessed separately.
  - "The claim describes a present dependence: continued growth requires aggregate AI startup token spending to increase each month. It does not require every individual startup to increase spending."
  - Spending means money paid, rather than token volume. Testing the relationship requires consistent revenue recognition and allowance for billing lags.
  - The final phrase emphasizes indefinite dependence. It supplies neither a deadline nor a separate conditional antecedent.
  - The assessment concerns the business relationship asserted as of October 13, 2026. No historical observation window or forecast deadline is imposed.
support_condition: Customer-level financial records and credible causal evidence show that continued revenue growth at both companies requires monthly increases in AI startup token spending, with other revenue sources unable to sustain growth when that spending stops increasing. Mere simultaneous growth would not establish necessity.
contradiction_condition: Comparable records show either company continuing to grow revenue during a period when aggregate AI startup token spending on that company's services is flat or falling, after accounting for billing and recognition timing; or other direct evidence establishes that growth can continue independently of increasing startup spending.
measurement_requirements: Monthly revenue for each company, separated into AI startup token purchases and other customer and product categories; consistent startup definitions; direct and reseller purchases; refunds, credits, billing timing, and revenue recognition reconciled. Token volume, spending per employee, adoption rates, and annualized revenue cannot substitute for these measurements.
source_requirements: Prefer company financial disclosures and customer billing records, supplemented by independent transaction data with documented coverage. Partial business panels cannot establish ecosystem-wide spending or companywide revenue.
