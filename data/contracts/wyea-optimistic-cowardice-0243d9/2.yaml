assessment_axis: historical_observation
explicit_source_elements:
  - just another benchmark
  - susceptible to the same kind of exploitation as any other benchmark
  - If you know the answers ahead of time
  - you can optimize the model to answer these questions correctly
  - There’s no accusation that OpenAI — or any other vendor — has done this
evaluator_interpretation:
  - The ordinary reading is that evaluation on known IMO problems can reward prior exposure to their answers, rather than independently measuring mathematical ability.
  - The claim concerns susceptibility. It does not assert that OpenAI cheated, that contamination explains its improvements, or that every benchmark has equal exposure.
  - The target covers the previously published evaluations discussed by the post, through 2025-03-24. The passage supplies no starting date; none is imposed.
  - The assessment distinguishes reuse of published problems from testing on fresh problems created after training. The supported reading concerns the former.
  - The passage does not identify a particular IMO problem set or evaluation protocol. Evidence about AIME is treated as context, without substituting it for IMO.
support_condition: Evidence establishes that published IMO problems used for model evaluation can be encountered during training or targeted preparation, allowing answer-specific familiarity to influence scores. Documentation establishing this vulnerability is sufficient; actual misconduct need not be demonstrated.
contradiction_condition: Evidence establishes that the referenced evaluation used protected, previously unseen problems under a protocol that excluded prior answer exposure and answer-specific optimization. Failure to detect memorization in one model would not alone establish immunity.
measurement_requirements: Distinguish possible contamination from demonstrated score inflation, and historical published problems from fresh competition problems. Do not infer contamination merely from high scores.
source_requirements: Use primary research or evaluation documentation addressing IMO problems and contamination. Studies of other benchmarks provide context only.
