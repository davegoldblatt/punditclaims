explicit_source_elements:
  - $100M+ training runs
  - Anyone who can afford that
  - can easily fill out some paperwork and run a few tests
evaluator_interpretation:
  - The plain reading is that developers able to finance training runs costing over $100 million could afford the proposed paperwork and testing duties without material financial strain.
  - Assess the proposal and developers' financial capacity as they stood on June 7, 2024. This is a present-tense affordability claim, not a prediction that the bill would become law.
  - The driver’s-license comparison conveys a modest burden relative to resources; it does not literally price compliance at a few dollars.
  - Marcus supplies neither a numerical affordability threshold nor an accounting basis.
support_condition: Credible estimates covering the June 2024 proposal's paperwork and testing duties, compared with qualifying developers' available financial resources, establish that those duties would be readily affordable across the stated class.
contradiction_condition: Credible estimates identify a developer able to finance a $100 million-plus training run for whom the same duties would impose material financial strain.
measurement_requirements: Estimate the incremental paperwork and testing costs, including staff and compute, with stated assumptions and uncertainty. Compare them with available resources and existing commitments. Training expenditure or valuation alone does not establish spare financial capacity.
source_requirements: Prefer contemporaneous legislative analyses, documented developer budgets, and independent compliance-cost estimates. Distinguish the June proposal from later amendments and private compliance costs from government administration costs.
