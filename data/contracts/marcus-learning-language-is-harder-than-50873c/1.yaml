explicit_source_elements:
  - words like no and not
  - a major sore spot
  - current neural networks
evaluator_interpretation:
  - The language-acquisition context makes neural language models the relevant class of networks.
  - A major sore spot means substantial, recurring difficulty interpreting negation. It does not mean every model fails whenever negation appears.
  - "Because the statement describes an ongoing research state without a reporting interval, the target period is the current research year through publication: January 1 to July 20, 2022."
  - Comparisons must concern understanding negation, rather than merely detecting the presence of a negative word.
support_condition: Contemporary evaluations show substantial, recurring errors when negation matters to the answer, with materially worse results than relevant affirmative or nonessential-negation comparisons.
contradiction_condition: Representative contemporary models handle meaning-changing negation reliably across varied tasks, with little meaningful disadvantage against comparable cases without negation.
measurement_requirements: Identify the models, tasks, comparison groups and reported performance. Distinguish matched sentence contrasts from comparisons between different dataset subsets.
source_requirements: Primary empirical studies of models available by July 20, 2022. Later publications qualify only if they establish behavior during the target period.
