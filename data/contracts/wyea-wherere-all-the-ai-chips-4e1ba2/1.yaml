assessment_axis: causal_assessment
explicit_source_elements:
  - for the most part
  - projects get announced and funded all the time
  - the press willingly or otherwise
  - laundering the scale and completion
  - everybody on the outside is deceived
  - faster and more effective than it really is
evaluator_interpretation:
  - Laundering means presenting project scale or completion in a materially misleading way; proving journalists' intent is unnecessary.
  - Everybody is rhetorical emphasis on a widespread audience effect, not a literal assertion about every individual.
  - The causal proposition requires evidence that coverage leads outsiders to overestimate actual buildout progress.
  - The contextual examples anchor the assessment to coverage from September 23, 2025 through the post date.
  - Effective is read as delivering usable operational capacity, rather than profitability or model capability.
support_condition: A representative comparison of coverage with project records shows systematic overstatement, and credible audience research links that coverage to mistaken beliefs about delivered capacity or completion speed.
contradiction_condition: Representative matched coverage and audience evidence shows generally accurate reporting and perceptions, or establishes that the alleged coverage does not cause the claimed overestimation.
measurement_requirements: Compare headlines and complete articles with the project scope operational on their publication dates. Measure audience beliefs and exposure, and distinguish effects of press coverage from company announcements and other information.
source_requirements: Use original coverage, contemporaneous operator or commissioning records, and audience studies capable of testing the causal link. Isolated misleading or accurate articles cannot establish the general effect.
