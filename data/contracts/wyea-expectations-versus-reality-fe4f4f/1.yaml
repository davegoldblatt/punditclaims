assessment_axis: forecast_outcome
explicit_source_elements:
  - Large Language Models
  - are — and always will be
  - incapable of reasoning or consciousness
evaluator_interpretation:
  - Reasoning means using supplied facts or constraints to reach correct conclusions on new problems, rather than merely retrieving an answer.
  - The categorical wording denies both reasoning and consciousness. Demonstrating either capability contradicts that combined denial.
  - Successful reasoning need not be infallible or human-like.
  - Always supplies no finite deadline. Consciousness is not inferred from benchmark performance.
support_condition: Evidence would have to establish permanent incapacity for both reasoning and consciousness across LLMs. Failures of existing models alone cannot establish this.
contradiction_condition: A reproducible evaluation demonstrates that an LLM solves newly generated inference problems substantially above chance without an external solver supplying its answers, with checks on the reasoning or solutions; alternatively, compelling evidence establishes consciousness.
measurement_requirements: Use generated or otherwise novel problems, objective answer checks, a chance baseline and scrutiny of solution validity. Distinguish model reasoning from external solver performance.
source_requirements: Prefer research reporting methods and results sufficient for replication, including limitations and contrary findings.
metric_scope: null
original_horizon: always
horizon_interval:
  start: 2024-05-13
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated public evaluation meeting the contradiction condition settles the categorical permanent-incapacity claim through a counterexample, without waiting for a deadline.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Reasoning is undefined; the assessment uses observable inference on new problems.
  - Consciousness is undefined and is a separate capability.
  - The sentence combines a present assertion with an unlimited forecast.
  - A philosophical definition requiring subjective understanding could produce a different assessment.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
