assessment_axis: forecast_outcome
explicit_source_elements:
  - the AI industry is losing
  - Their plans are not working
  - their products are not doing the things that they’ve promised
  - they aren’t going to have enough money to do this forever
evaluator_interpretation:
  - The forecast's substantive endpoint is that the industry's prevailing development and deployment strategy becomes unable to continue because financing and internally generated funds are insufficient.
  - The present-tense statements about plans and products are supporting premises, not a deadline.
  - Forever supplies no finite deadline. No evaluation-date deadline is imposed.
  - Failure by one firm would not establish failure of the industry.
  - Continued fundraising would not prove indefinite sustainability, and a financing proposal is not completed financing.
  - The claim supplies no company perimeter, financial measure, currency, or accounting basis.
support_condition: A decisive industry-wide financing failure forces cessation or abandonment of the prevailing strategy because available external and internally generated funds cannot sustain it.
contradiction_condition: Broad, durable self-financing operations demonstrate that the claimed dependence on exhaustible outside capital has ended. A finite period of continued operation alone cannot disprove the literal indefinite forecast.
measurement_requirements: Define the relevant firms and strategy; distinguish realized revenue, cash flow, accounting losses, financing commitments, completed financing, and recurring investment needs.
source_requirements: Filings, completed financing records, insolvency or shutdown records, and sustained operating and cash-flow disclosures across the relevant industry.
metric_scope:
  company: AI industry; membership unspecified
  metric: Capital available to sustain continued AI development and deployment
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only on documented, industry-wide capital exhaustion that forces the strategy to cease, or a comparably decisive transition to durable self-financing across the defined industry. Individual failures, warnings, funding rounds, and short profitable periods are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No fixed industry membership or strategy definition.
  - Losing and plans not working have no stated measures.
  - No accounting basis or capital threshold.
  - Literal indefinite survival cannot be established from a finite observation period.
retrospective_or_prospective: retrospective
