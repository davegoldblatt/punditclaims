explicit_source_elements:
  - A lot of people
  - have come around to that view
  - As bad as Sam Altman is, Dario Amodei isn’t all that different.
evaluator_interpretation:
  - The ordinary reading is that numerous people have adopted a similarly unfavorable view of the two leaders. It does not require a majority of the public.
  - Evidence must establish the comparison or a loss of the perceived distinction between them. Criticism of Anthropic alone is insufficient.
  - Because this describes current sentiment without specifying a measurement period, use July 2026 through the July 29 publication date as the contemporaneous reporting window.
  - Coming around implies a change in opinion, although contemporaneous reporting describing a broader shift could establish this without tracking each person's earlier views.
support_condition: Independent contemporaneous reporting, surveys, or numerous distinct public statements establish that many people had adopted the view that Amodei was little different from Altman in conduct or trustworthiness.
contradiction_condition: Evidence directly addressing the alleged shift establishes that it did not occur. Continued preference for Amodei among some people would not alone contradict a claim about many others.
measurement_requirements: Assess the comparison and change of opinion, not merely negative sentiment toward Anthropic. No numerical threshold or population majority is imposed.
source_requirements: Independent reporting or independently accessible public statements and surveys. Marcus's own assertions and summaries derived solely from them cannot establish the outcome.
