assessment_axis: historical_observation
explicit_source_elements:
  - GPUs
  - used for basically one thing
  - lacks meaningful demand
  - outside of subsidized services and circular financing
evaluator_interpretation:
  - In context, read GPUs as the data-center GPUs being purchased for the AI buildout, and the principal use as generative AI. Do not resolve this merely by pointing to consumer gaming cards.
  - Read 'basically one thing' as economic concentration in one use, rather than a literal claim that no other computation is possible.
  - Read 'meaningful demand' as substantial recurring customer purchases that do not depend on below-cost services or reciprocal investment and purchasing arrangements.
  - Use January–March 2026 as the latest commonly reported quarter before the post for assessing current commercial demand and documented workloads.
  - The exclusion of subsidies and circular financing defines the observation's scope; it is not a future triggering condition.
support_condition: Representative workload and customer-payment evidence shows overwhelming concentration in generative AI and little substantial recurring demand after excluding below-cost services and reciprocal financing.
contradiction_condition: Evidence demonstrates substantial economically relevant alternative workloads for the relevant data-center GPUs, or substantial recurring generative-AI purchases with demonstrated cost-covering prices and independent customer funding.
measurement_requirements: Measure workloads or economically relevant usage shares, actual customer payments, service costs, discounts, and financing relationships. Technical capability and paid subscriptions alone do not establish unsubsidized demand.
source_requirements: Prefer operational workload data, direct payment measurements, customer procurement records, and service-level cost disclosures. Vendor demonstrations can establish capability but not market size.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-01-01
  end: 2026-03-31
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - GPUs may mean all GPUs or the data-center GPUs discussed immediately beforehand.
  - "'Basically' specifies no workload-share threshold."
  - "'Meaningful' specifies no demand threshold."
  - Subsidy may mean below-cost pricing, investor-funded losses, or public assistance.
  - Circular financing has no stated boundary.
  - January–March 2026 is an evaluator-selected latest commonly reported quarter.
