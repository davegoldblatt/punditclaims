explicit_source_elements:
  - not valuable enough for people to cover their business expenses
  - even if you remove the cost of training
  - drowns out every dollar of revenue on its own
  - cannot raise prices
  - without their users flipping out
evaluator_interpretation:
  - Assess OpenAI and Anthropic separately, not as a combined business.
  - Compare realized revenue with all business expenses except training. Also retain the embedded assertion that training alone exceeds revenue.
  - Use January–March 2026, the latest completed quarter before publication.
  - Read user backlash as material adverse customer reaction to an actual price increase; dissatisfaction with outages or unrelated policies is insufficient.
  - The passage supplies no accounting basis. Preserve unknown rather than assuming GAAP, operating profit, adjusted profit, or cash flow.
  - USD is the ordinary currency reading for these US companies and the surrounding dollar-denominated discussion.
support_condition: Comparable records show that each company's revenue is below its non-training expenses, training expense alone exceeds revenue, and cost-covering price increases produce material customer backlash.
contradiction_condition: Comparable records show a company covering its non-training expenses or training expense not exceeding revenue, or a documented cost-covering price increase without material backlash. No definitive financial verdict is permitted while the claimed accounting basis remains unknown.
measurement_requirements: A reconciliation of realized revenue, training expense, other expenses, and the applicable accounting basis for each company; customer reactions tied to specific price changes.
source_requirements: Filings or company financial disclosures where available; clearly identified press estimates otherwise. Run rates and cash burn cannot substitute for revenue and expenses.
