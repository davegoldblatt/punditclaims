explicit_source_elements:
  - 77% of CoreWeave’s 2025 revenue
  - from Microsoft and NVIDIA
  - largest independent AI compute provider
  - $26 billion in the next five years
  - suggests that little organic demand exists
evaluator_interpretation:
  - The central numerical premise concerns the combined share of CoreWeave's realized 2025 revenue attributable to Microsoft and NVIDIA.
  - I allow ordinary rounding to a whole percentage point.
  - I treat the revenue figure as company-reported customer concentration.
  - Organic demand ordinarily means purchases responding to actual customer workloads, rather than purchases primarily intended to support suppliers or shift financing.
  - The market-wide inference is explicitly tentative. Customer concentration alone does not measure customers' motives or their downstream demand.
  - The NVIDIA spending plan and provider-size description are ancillary assertions; they cannot substitute for the claimed 2025 revenue share.
support_condition: Matching revenue disclosures establish approximately 77% from the two named customers, and evidence about their purchases and other customers substantiates the inference of little independent workload demand.
contradiction_condition: Matching disclosures establish a materially different combined share, or direct evidence establishes substantial organic demand under the stated ordinary reading.
measurement_requirements: The two customers' combined realized revenue divided by total realized revenue for the same year. Whole-percentage rounding must be allowed. Demand quality requires evidence beyond concentration.
source_requirements: CoreWeave's annual disclosures and customer-level records; NVIDIA's filings for the ancillary spending plan.
