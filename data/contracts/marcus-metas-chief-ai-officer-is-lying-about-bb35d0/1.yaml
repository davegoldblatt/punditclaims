assessment_axis: historical_observation
explicit_source_elements:
  - One of the people pushing hardest to undermine the EU AI Act
  - Yann LeCun
  - who just posted
  - a flagrant lie
  - Added late in the text
evaluator_interpretation:
  - The claim combines a leading role in opposition with an allegation that a particular public statement was plainly false.
  - I read 'pushing hardest' as being among the most prominent and active opponents of the relevant provisions. Marcus supplies no numerical ranking or comparison group.
  - I read 'flagrant lie' as an obviously material falsehood presented knowingly. Even under the weaker reading of an obvious misrepresentation without proven intent, the full statement and its reference point must be established.
  - "For the ongoing advocacy claim, I use December 1–12, 2023: the current month through publication, covering the recent negotiations and immediate reaction described in the context. Earlier legislative documents are historical context."
  - "'Added late' does not necessarily mean added during the final December negotiations. Its meaning depends on the original statement and which provisions it describes."
support_condition: Contemporaneous records establish that LeCun was among the leading active opponents of the relevant AI Act provisions, and his complete statement makes a materially false assertion about their legislative history. Evidence of awareness of the true chronology would also support the allegation of lying.
contradiction_condition: The complete statement and dated legislative record establish that the disputed chronological assertion was accurate, or sufficiently comprehensive comparative advocacy records clearly disprove the claimed leading role. Other opponents' activity alone does not disprove LeCun's prominence.
measurement_requirements: Recover the complete dated post, identify the provisions and legislative milestone it refers to, compare successive drafts, and compare LeCun's public advocacy with other prominent opponents during the target period.
source_requirements: Prefer LeCun's original posts, official legislative drafts, and documented advocacy records. Independent reporting may establish otherwise undocumented lobbying. Marcus's own accusation cannot establish its truth.
