ambiguity_flags:
  - The ongoing advocacy claim supplies no reporting period; December month-to-date is an evaluator choice.
  - "'Pushing hardest' supplies no comparison group or measure of effort."
  - "'Undermine' may refer to opposing particular provisions rather than opposing the entire Act."
  - "'Late' supplies no explicit chronological reference point in the supplied text."
  - Earlier general-purpose AI provisions need not be identical to the foundation-model obligations negotiated later.
  - "'Lie' can allege knowing deception or be used rhetorically for a serious misrepresentation."
