assessment_axis: causal_assessment
explicit_source_elements:
  - lack of a robust labor movement within tech
  - contributes to this anxiety
  - no unions to protect against layoffs
  - a company’s focus on generative AI
evaluator_interpretation:
  - The central claim is that lacking union protections contributes to tech workers' anxiety about generative-AI-related layoffs.
  - The surrounding discussion suggests primarily the US technology industry, although no geographic boundary is stated.
  - I assess the ongoing situation in the first quarter of 2023, the latest completed quarter before publication.
  - I distinguish the causal claim from the stronger literal assertion that tech unions do not exist. Finding a tech union would qualify that assertion without settling the causal claim.
support_condition: Credible evidence about the described period shows that lacking relevant union protections increases tech workers' anxiety about generative-AI-related layoffs, accounting for other differences between workplaces and workers.
contradiction_condition: Credible evidence about comparable tech workers rules out the proposed contribution or establishes an opposite effect. The existence of some unions alone does not contradict the central causal claim.
measurement_requirements: Measure anxiety about generative-AI-related job loss and actual union protections. A credible comparison must address differences in AI exposure, employment security, occupation and workplace conditions.
source_requirements: Prefer primary worker surveys or research with a credible causal design. Union announcements can establish representation but cannot establish its effect on anxiety.
