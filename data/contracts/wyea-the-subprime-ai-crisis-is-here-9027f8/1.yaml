explicit_source_elements:
  - CoreWeave or any major data center player having trouble or failing to raise debt
  - We’ve already seen the beginnings of this
  - CoreWeave’s issues raising for its Lancaster PA data center
evaluator_interpretation:
  - The checkable historical assertion is that the Lancaster project had encountered material difficulty obtaining debt before March 31, 2026.
  - Calling such difficulty a warning sign is an interpretation, not a separate measurable prediction.
  - Trouble includes material lender refusals or inability to obtain planned financing. It does not require default or cancellation.
  - The project's financing partners may be the borrowers even though CoreWeave is the tenant. I therefore distinguish project financing from CoreWeave's general corporate borrowing.
  - Already supplies an upper date but no beginning date. The target period is left open at the start rather than invented from the reporting.
  - No debt amount or accounting basis is committed to in the quoted claim.
support_condition: Reliable project-specific records or sufficiently corroborated reporting establish material lender reluctance, financing delays, or failure to obtain planned debt before publication.
contradiction_condition: Affirmative project-specific evidence establishes that the alleged financing difficulty did not occur. Later successful financing or the existence of bridge funding alone would not refute earlier difficulty.
measurement_requirements: Identify the borrower, project, financing stage, intended financing, lender response, and event dates. Separate bridge commitments from the debt allegedly sought.
source_requirements: Prefer lender records, financing agreements, and attributable company statements. If relying on news reports, retain direct denials and disclose anonymous sourcing.
