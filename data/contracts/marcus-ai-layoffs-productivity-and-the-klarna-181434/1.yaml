explicit_source_elements:
  - Klarna
  - among the first to announce major AI layoffs
  - hyping them proudly for quite some time
  - among the first to realize they had screwed up
evaluator_interpretation:
  - "'Announce major AI layoffs' is read as publicly touting large AI-driven cuts to its workforce. Klarna's cuts came mostly through a hiring freeze and attrition, not mass firings. That still fits an ordinary reading of AI-driven workforce reduction."
  - "'Among the first' is read as earlier than the broad wave of AI-attributed cuts, and as a prominent early case."
  - "'Realize they had screwed up' is read as Klarna's leadership publicly admitting that its AI-driven cost cutting had hurt quality and needed reversing in part."
support_condition: Klarna touted AI-driven staff reductions in 2023–2024, before AI-attributed cuts were common. Its CEO later publicly said the AI cost push had gone too far or lowered quality, and the company started hiring humans again.
contradiction_condition: Klarna's AI workforce claims came only after many other firms had made similar ones, or Klarna never admitted any error.
measurement_requirements: Dated Klarna statements and CEO interviews, 2023–2025, plus timing of AI-attributed cuts at other firms.
source_requirements: Company releases and reputable news reports of CEO interviews.
