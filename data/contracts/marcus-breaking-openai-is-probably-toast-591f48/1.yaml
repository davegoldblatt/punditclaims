explicit_source_elements:
  - last week
  - Nvidia pulled back
  - a pledge of $100 billion
  - a terrible signal to other potential investors
evaluator_interpretation:
  - "'Last week' primarily means the preceding calendar week, February 2–8, 2026. A rolling February 6–12 reading is also plausible."
  - "'Pledge' is read as the announced intention to invest up to $100 billion, not necessarily an enforceable contract."
  - "'Pulled back' requires a material retreat from that overall intention. A smaller investment in one funding round does not establish a reduction in a multi-stage investment plan."
  - "'A terrible signal' is Marcus's evaluation. The graded factual core is whether the pullback occurred; no separate investor-behavior forecast is inferred."
  - The amount refers to Nvidia's own announced investment intention, so the accounting basis is company_reported. No deployment or accounting period for the total amount is specified.
support_condition: A dated company statement, document, or well-corroborated report establishes that Nvidia materially reduced, suspended, or abandoned the overall announced investment intention during the target week.
contradiction_condition: Reliable records establish that the overall intention remained materially unchanged during the target week, or that the alleged retreat occurred outside that period.
measurement_requirements: Compare the same prospective investment plan in USD billions. Preserve 'up to' and staged deployment. Do not compare a single-round contribution with the full multi-stage intention as though they were identical.
source_requirements: Prefer Nvidia's original announcement and subsequent statements or filings. Anonymous-source reports require corroboration; a corporate denial alone does not settle disputed private negotiations.
