explicit_source_elements:
  - Cursor
  - negative 23% gross margins as of January
  - negative 31% if you include the cost of non-paying users
evaluator_interpretation:
  - January means January 2026.
  - The claim asserts two reported gross margins, distinguished by whether serving free users is included in cost of revenue.
  - The target is the financial position described as of January. The wording does not establish whether the underlying calculation covers January alone or a reporting period ending in January.
  - The accounting basis is estimate because the surrounding passage discusses reported financial figures without specifying an accounting standard.
support_condition: Reliable financial records or reporting establish both approximately -23% excluding free-user service costs and approximately -31% including them, with a consistent revenue denominator and a reporting period ending in January 2026.
contradiction_condition: Comparable records establish materially different margins for either calculation. Later profitability does not contradict January losses.
measurement_requirements: Identify the reporting period, revenue denominator, cost-of-revenue definition, and free-user costs. Do not substitute net losses, operating margins, or annualized revenue.
source_requirements: Prefer Cursor financial records. Otherwise require readable, credible reporting that identifies the financial documents or sources behind both figures.
