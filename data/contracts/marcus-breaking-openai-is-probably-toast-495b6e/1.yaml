evaluator_interpretation:
  - "Lead slipping: in the months before the post, OpenAI's share of usage or of the market was falling as rivals gained."
  - "Financing slipping: around the post date, OpenAI's ability to line up new money was weakening, for example backers withdrawing or rounds stalling."
  - The two parts are judged separately.
support_condition: Data showing OpenAI losing share to rivals in late 2025 or early 2026, plus reports from the same period of investors withdrawing or a stalled round.
contradiction_condition: Data showing OpenAI holding its share, or reports from the same period that major investors were lining up new money for a large round.
measurement_requirements: Market-share data (enterprise API share, chatbot web traffic) and contemporaneous reports on OpenAI's fundraising.
source_requirements: Independent market measurements and reputable news reports from before 2026-02-13.
