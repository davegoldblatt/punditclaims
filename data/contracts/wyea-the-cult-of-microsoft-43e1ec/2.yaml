explicit_source_elements:
  - as I learned from an internal document I've reviewed
  - instructing managers to use it [Copilot]
  - to summarize their direct report's Connects, Perspectives and other feedback
  - collected throughout the fiscal year
  - as a basis to draft Rewards/promotion justifications in the Manage Rewards Tool
evaluator_interpretation:
  - "The claim is about what Microsoft's internal guidance said: managers were told (or encouraged in official guidance) to use Copilot to summarize a report's Connects, Perspectives and other feedback, and to use that summary as a starting point for drafting reward or promotion justifications."
  - This tests the speaker's narrow factual claim about drafting help. It does not test his separate argument that this will end with AI deciding rewards.
  - He gives no date for the document. My reading is that it was current guidance when the post went out, covering the 2024 review cycles. This is flagged as an ambiguity.
support_condition: A Microsoft document, Microsoft statement, or independent report that has seen the guidance confirms that Microsoft told managers to use Copilot to summarize direct reports' Connects/Perspectives/feedback as a basis for drafting reward or promotion justifications.
contradiction_condition: Microsoft guidance or credible reporting from the period shows managers were barred from using Copilot this way, or shows that no such instruction existed.
