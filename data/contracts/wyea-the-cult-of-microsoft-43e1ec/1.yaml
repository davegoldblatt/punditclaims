explicit_source_elements:
  - instructing managers
  - their direct report's Connects, Perspectives and other feedback collected throughout the fiscal year
  - as a basis to draft Rewards/promotion justifications
  - in the Manage Rewards Tool (MRI)
evaluator_interpretation:
  - The claim concerns Microsoft’s internal managerial guidance, rather than Copilot’s technical capabilities or actual adoption by managers.
  - Instructing includes providing endorsed instructions for this use. It does not necessarily mean making Copilot use compulsory.
  - For this undated ongoing practice, I use July–September 2024, the latest completed fiscal quarter before publication. The post does not identify the guidance’s issue date.
  - Restrictions on letting AI determine rewards would not contradict permission to use it when drafting justifications.
support_condition: Authenticated guidance in force during the target period, or independent reporting based on that guidance, tells managers to summarize direct reports’ Connects and other feedback with Copilot when drafting reward or promotion justifications.
contradiction_condition: Authoritative records establish that the alleged guidance was inauthentic, or that applicable guidance specifically prohibited this summarization and drafting use during the target period.
measurement_requirements: Establish the document’s authenticity, effective dates, intended managerial audience, and exact permitted or instructed use.
source_requirements: Microsoft’s guidance or confirmation, an authenticated disclosed copy, or independent reporting that inspected it. Repetition of Zitron’s account is insufficient.
