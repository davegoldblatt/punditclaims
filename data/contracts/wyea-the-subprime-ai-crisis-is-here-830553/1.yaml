explicit_source_elements:
  - based on my premium data center model
  - many data center projects
  - unprofitable even with a paying customer
  - assuming they even get built
evaluator_interpretation:
  - This describes the economics of projects contemplated at the time of the post, including projects not yet completed. It is not a dated forecast of future corporate earnings.
  - I read many as a substantial, non-isolated set of projects, without inventing a majority threshold.
  - Unprofitable means customer receipts fail to cover the relevant project costs, including hardware consumption or depreciation, construction, operations and financing.
  - The target is the March 2026 project-economics snapshot. The model's investment lifetime is unspecified and is not replaced with a one-month profit calculation.
  - Having a paying customer restricts the projects being assessed; it is not an antecedent of a conditional forecast.
support_condition: Independent project-level records or a reproducible model grounded in actual contracts identify a substantial set of projects whose customer payments fail to cover full costs.
contradiction_condition: A sufficiently comprehensive, comparable project sample shows that losses under paying contracts are isolated rather than common, after including full project costs.
measurement_requirements: Match each project's contracted receipts, utilization, capital costs, hardware life, operating costs and financing schedule. Distinguish project returns from developer-wide earnings.
source_requirements: Project accounts, executed customer and financing contracts, or an independently reproducible model with disclosed inputs and sensitivity analysis.
