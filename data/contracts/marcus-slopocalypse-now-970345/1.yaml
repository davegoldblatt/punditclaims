evaluator_interpretation:
  - The ordinary reading is that problematic AI-generated content has spread across the named sectors, not that every institution or output contains it.
  - Count demonstrably false, deceptive, defective or spam-like AI-generated material; AI authorship alone is insufficient.
  - Because the post describes an ongoing state without a reporting period, use calendar 2025 to the post date as the latest year-to-date observation window.
  - Documented instances in all five named sectors establish the stated breadth. They do not establish a high prevalence within every sector.
support_condition: Reliable records document problematic AI-generated material in journalism, law, music, politics and education during the observation window.
contradiction_condition: Reliable evidence shows that the asserted spread did not occur, with purported examples in one or more named sectors disproved or misattributed and adequate coverage establishing absence.
measurement_requirements: Verify both AI involvement and an identifiable defect, deception or spam mechanism. Do not infer sector-wide prevalence from individual incidents.
source_requirements: Prefer admissions, judicial records, official notices and platform measurements. Use attributed news reporting where primary records are unavailable.
