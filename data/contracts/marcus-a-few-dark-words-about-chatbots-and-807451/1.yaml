assessment_axis: historical_observation
explicit_source_elements:
  - By now
  - several reports
  - chatbot-associated deaths
  - both suicide and murder
  - wikipedia has started keeping track
evaluator_interpretation:
  - Read 'several' as at least three distinct reported deaths, with suicide and homicide both represented.
  - Reported association means a publicly alleged connection with chatbot interactions. It does not require proof that a chatbot caused a death.
  - Read 'by now' cumulatively through January 15, 2026. The surrounding account begins with deaths reported in 2023, so the target period starts in that year.
  - Wikipedia tracking means an identifiable article collecting such cases existed by the post date. 'Enough that' does not require evidence of editors' motives.
support_condition: By January 15, 2026, public records described at least three distinct chatbot-associated deaths, including suicide and homicide, and a dated Wikipedia revision collected such cases.
contradiction_condition: Reliable historical records establish that the reported cases did not meet the threshold or include both categories, or that Wikipedia began collecting these cases only after January 15, 2026.
measurement_requirements: Count distinct deaths rather than repeated stories about one person. Verify that the reports and Wikipedia coverage were public by the post date.
source_requirements: Use contemporary public records or reporting for the reported associations and a dated Wikipedia revision for Wikipedia's coverage. Allegations establish that a report existed, not that causation was proved.
