assessment_axis: causal_assessment
explicit_source_elements:
  - ruinous debt behind AI data centers
  - makes them all remarkably unprofitable
  - customers are AI startups that lose hundreds of millions or billions of dollars a year
  - NVIDIA is the largest company on the stock market
  - said valuation is a result of a data center construction boom
  - appears to be decelerating
  - operating at a glacial pace compared to NVIDIA’s sales
evaluator_interpretation:
  - The ordinary reading is that debt makes AI data centers substantially loss-making across the sector, with financially weak customers adding risk.
  - Profitability means profit after financing costs, rather than EBITDA. The claim supplies no accounting basis or project-level profit measure.
  - For annual financial comparisons, use 2025, the latest completed annual period before publication. Market-cap rank concerns the publication date.
  - A declining amount of capacity under construction is distinguishable from declining completions, construction starts, or spending.
  - The valuation clause requires evidence connecting construction demand to NVIDIA's valuation. Its market-cap rank alone cannot establish that relationship.
  - The schema's single metric scope represents the profitability clause. Customer losses and NVIDIA's valuation are separate components that cannot be collapsed into that measure.
support_condition: Comparable project accounts must establish widespread substantial losses caused by financing costs, with sufficiently comprehensive coverage to justify 'all'. Customer accounts must establish the stated annual losses. Dated market data and construction-demand analysis must establish NVIDIA's rank and the asserted valuation and construction relationships.
contradiction_condition: Comparable profitable AI data centers would rebut the universal profitability claim. Representative customer evidence could rebut the characterization of customers. Consistent construction and equipment-deployment measurements could rebut the asserted slowdown or mismatch. Contrary market-cap records would rebut the ranking clause.
measurement_requirements: Separate project profits from consolidated company profits; identify financing costs, depreciation and other expenses. Compare construction and GPU deployment using compatible geography, periods and capacity measures. Do not equate dollars of GPU sales with gigawatts of completed facilities.
source_requirements: Operator and customer financial statements, project accounts, dated market-cap records, construction measurements and evidence identifying the proposed causal relationships.
metric_scope:
  company: AI data center operators collectively; no single company specified
  metric: Profitability after financing costs
