explicit_source_elements:
  - the fundamental mistake that the field has made
  - capturing one component of intelligence, prediction extraordinarily well
  - enough to capture all of intelligence
evaluator_interpretation:
  - "The plain reading attributes a broadly accepted assumption to the AI field: sufficiently good prediction is sufficient for general intelligence."
  - "The claim has two empirical components: broad acceptance of that assumption and its inadequacy. Calling it the fundamental mistake adds a judgment about importance."
  - Use October 2026 for the alleged ongoing field-wide assumption. Earlier research is historical context.
  - Using a prediction objective does not by itself establish a researcher's belief that prediction alone captures every aspect of intelligence.
support_condition: Representative research or statements establish broad acceptance of prediction's sufficiency, and suitable evidence establishes a substantive intelligence limitation that remains despite the required predictive competence.
contradiction_condition: Representative evidence shows that the attributed assumption is not broadly held, or sufficiently comprehensive evidence demonstrates the claimed sufficiency under a clearly stated meaning of intelligence.
measurement_requirements: Separate researchers' stated beliefs from training methods. Distinguish imperfect contemporary predictors from a claim about sufficiently accurate prediction in principle.
source_requirements: Representative surveys or systematic research reviews for the field-wide attribution, plus original theoretical or empirical work for the sufficiency question.
