assessment_axis: historical_observation
explicit_source_elements:
  - AI startups are annihilating cash
  - up until recently
  - Anthropic allowing you to burn
  - upwards of $8 in compute for every dollar of your subscription
evaluator_interpretation:
  - The numerical commitment concerns permitted subscription usage, not the average subscriber's consumption.
  - In the surrounding discussion of what providers pay for GPUs, the plain reading of compute cost is Anthropic's actual serving expense.
  - API-equivalent retail value is a plausible alternative reading, but it measures something different.
  - The linked calculation is an independent estimate, so the accounting basis is estimate.
  - The claim describes allowances before recent changes and before the post. No defensible starting date or exact change date is supplied; the period therefore has an unspecified start and ends the day before publication.
  - The cash-burn clause is a separate general assertion without a company list or numerical threshold.
support_condition: Historical permitted usage and corresponding actual serving expenses establish at least approximately eight dollars of compute expense per subscription dollar. Separate financial evidence must establish the accompanying cash-burn assertion.
contradiction_condition: Reliable historical allowance and actual-cost evidence establishes that the relevant subscription plans could not reach the claimed ratio. A lower average alone would not contradict a claim about permitted maximum usage.
measurement_requirements: Match historical plan fees, usage limits, models, token types, caching, and actual serving expenses. Do not equate retail API charges with Anthropic's costs.
source_requirements: Historical company terms or reproducible usage measurements, plus actual cost disclosures or a documented cost estimate. Retail API comparisons can establish only API-equivalent value.
