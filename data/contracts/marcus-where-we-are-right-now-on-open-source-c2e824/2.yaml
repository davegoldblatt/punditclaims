assessment_axis: historical_observation
explicit_source_elements:
  - A giant company
  - behind in the AI sweepstakes (at least with respect to public profile)
  - aggressively pushing open source AI
  - apparently as a way to raise its profile
evaluator_interpretation:
  - The company is understood to be Meta, as identified in the supplied claim record.
  - The firm assertions concern Meta's relative public AI profile and its substantial promotion of open models. The purpose introduced by 'apparently' is tentative and is not scored.
  - The plain reading of 'behind' is that Meta had less public prominence in the generative-AI race than its leading competitors. It does not mean Meta lacked important AI research or trailed every competitor.
  - "'Aggressively pushing' means a substantial, sustained public effort involving releases, distribution partnerships and advocacy. It does not establish recklessness."
  - "'Open source AI' is read in the contemporary broad sense that includes downloadable model weights. This does not require a finding that Llama's licence satisfies a formal open-source definition."
  - For the unspecified ongoing period, use July–September 2023, the latest completed calendar quarter before the November 3 post.
support_condition: Evidence from the target period shows a substantial Meta campaign to release and promote open models, alongside credible contemporary comparisons describing Meta as trailing leading competitors in public generative-AI prominence.
contradiction_condition: Evidence from the target period establishes that Meta was not substantially promoting open models, or establishes that its public generative-AI profile matched or led the competitors it was allegedly trailing. Strong research performance or developer adoption alone does not contradict the public-profile qualification.
measurement_requirements: Use dated releases, distribution arrangements and public advocacy to assess promotion. Assess public profile through comparative recognition evidence or explicit contemporary reporting about visibility; technical benchmarks alone are insufficient. No numerical threshold was stated.
source_requirements: Prefer Meta's original announcements for its actions and independent evidence for relative public profile. Contemporary reputable reporting can establish the qualitative comparison where no directly comparable recognition survey is available.
