explicit_source_elements:
  - Stargate was a lie
  - The whole time
  - $500 billion infrastructure project
  - They never formed the entity
evaluator_interpretation:
  - The concrete factual assertion is that the announced joint-venture legal entity had not been formed by publication.
  - The period runs from the January 2025 announcement through the post date because never and the whole time describe that history.
  - Formation, capitalization, and construction under the Stargate name are different facts.
  - The $500 billion figure identifies the announced venture; this assessment does not treat it as a claim that this amount had already been spent.
  - Calling the announcement a lie additionally alleges knowing misrepresentation. Delay or nonformation alone cannot establish that intent.
support_condition: Corporate records or authoritative participant documentation establish nonformation through April 8, 2026. Supporting the allegation of a lie additionally requires evidence that the relevant announcement was knowingly false.
contradiction_condition: Authenticated records establish formation of the announced venture by April 8, 2026. Evidence of real construction alone does not contradict the narrower legal-entity assertion.
measurement_requirements: Identify the legal name, jurisdiction, formation date, ownership, and relationship to the announced venture; distinguish legal formation from operational readiness.
source_requirements: Prefer registry records, executed organizational documents, filings, and dated participant statements. Press descriptions of a joint venture are not substitutes for formation records.
