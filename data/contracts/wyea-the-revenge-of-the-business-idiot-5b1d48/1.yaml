ambiguity_flags:
  - Latest completed calendar quarter selected for an ongoing state with no named reporting period.
  - Experimenting can coexist with production deployment.
  - The period over which millions of dollars are spent is unspecified.
  - It is unclear whether the spending threshold qualifies every clause.
  - Measuring incurred token charges differs from forecasting the cost of completing useful work.
  - The degree of accuracy required for knowing ROI or costs is unspecified.
