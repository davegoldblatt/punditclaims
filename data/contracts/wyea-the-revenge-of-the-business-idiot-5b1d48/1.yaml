assessment_axis: historical_observation
explicit_source_elements:
  - Everybody spending millions of dollars on AI tokens is experimenting
  - nobody really knows how to measure the ROI of AI
  - the naturally-chaotic nature of LLMs
  - impossible to measure how much it might even cost
evaluator_interpretation:
  - Read the claim in its enterprise LLM context. Spending millions refers to dollars spent on tokens, not millions of tokens consumed.
  - For the ongoing enterprise state, use Q1 2026, the latest completed calendar quarter before publication.
  - Experimenting is read as lacking an established, financially evaluated deployment, rather than merely continuing to improve a production system.
  - The phrase might even cost concerns prospective deployment or task costs. Counting previously billed tokens is relevant but does not by itself establish reliable total-cost forecasting.
  - Measuring ROI requires attributable financial benefits and relevant costs; it does not require perfect certainty or a positive return.
  - The spending threshold defines the population of an observation. It is not a conditional forecast.
support_condition: Representative and sufficiently comprehensive evidence establishes that qualifying enterprises lacked established financially evaluated deployments and that useful ROI and prospective cost measurement were infeasible.
contradiction_condition: A qualifying enterprise documents an established deployment with measured token spending and attributable financial returns, or demonstrates a reliable method for estimating relevant deployment costs despite variable LLM behavior.
measurement_requirements: Verify multimillion-dollar token expenditure, deployment status, the period measured, attributable benefits, and total relevant costs. Distinguish token metering, budget caps, prospective task costs, and realized ROI.
source_requirements: Prefer deployment records, company disclosures, and demonstrated measurement methods. Pricing schedules and generic calculators alone do not establish enterprise financial outcomes.
