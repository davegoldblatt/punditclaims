assessment_axis: historical_observation
explicit_source_elements:
  - outside of OpenAI and Anthropic
  - these three companies [Microsoft, Google, Amazon]
  - do not appear to be significantly increasing their revenues
  - the only way to get that revenue is to feed money to one or both of these companies
evaluator_interpretation:
  - In context the first part rests on remaining performance obligations (RPO, contracted future revenue) for calendar Q4 2025 to Q1 2026. It says growth outside OpenAI and Anthropic does not appear significant. It is hedged ('do not appear') and gives no threshold for 'significantly', so I treat it as an impression, not a firm figure.
  - The second part is firmer. The plain reading is that the three hyperscalers win OpenAI and Anthropic revenue only by investing in or funding those companies themselves.
  - "Period: calendar Q4 2025 through Q1 2026, the quarters he discusses."
support_condition: Company disclosures showing little or no growth in revenue or backlog once OpenAI and Anthropic are removed, and records showing that each large OpenAI or Anthropic compute deal with these firms depended on the hyperscaler's own investment in that lab.
contradiction_condition: Company disclosures showing clearly strong growth in revenue or backlog outside OpenAI and Anthropic at all three firms, together with large OpenAI or Anthropic compute deals these firms won without investing in the lab.
measurement_requirements: Revenue or RPO growth excluding OpenAI and Anthropic for Microsoft, Alphabet and Amazon, plus a mapping of compute deals to investments.
source_requirements: Company earnings releases, calls and filings; company or reputable news reports on deals and investments.
metric_scope:
  company: Microsoft, Alphabet (Google), Amazon
  metric: Revenue and remaining performance obligations excluding OpenAI and Anthropic
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2025-10-01
  period_end: 2026-03-31
  stock_or_flow: flow
