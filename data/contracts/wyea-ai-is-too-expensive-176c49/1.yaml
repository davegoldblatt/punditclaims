assessment_axis: historical_observation
explicit_source_elements:
  - outside of OpenAI and Anthropic
  - these three companies
  - do not appear to be significantly increasing their revenues
  - the only way to get that revenue
  - feed money to one or both of these companies
evaluator_interpretation:
  - The three companies are Microsoft, Alphabet/Google, and Amazon.
  - Read the statement in its cloud and AI context, rather than as a claim that unrelated retail or advertising revenue is stagnant.
  - Assess realized cloud revenue growth excluding both named customers. Examine backlog separately because the preceding argument uses remaining performance obligations; backlog is not realized revenue.
  - Use January–March 2026, the latest reported quarter before publication. The surrounding argument emphasizes sequential backlog changes; comparable prior-quarter revenue is therefore the principal growth comparison, with year-over-year figures supplementary.
  - Significant means commercially substantial growth, without imposing an invented numerical cutoff.
  - The funding clause asserts necessity. Investments alongside commercial agreements alone do not prove that necessity.
support_condition: Comparable customer-level records show little cloud revenue growth outside both labs, and financing records establish that the relevant lab spending depended on funding from these cloud providers.
contradiction_condition: Comparable records establish substantial cloud revenue growth outside both labs, or establish that the relevant revenue was obtained without the asserted necessary funding.
measurement_requirements: Realized cloud revenue for matching periods excluding both customers, separately reconciled backlog changes, and evidence tracing the claimed funding dependence.
source_requirements: Company disclosures or credible customer-level financial records. Aggregate cloud growth and investment announcements alone are insufficient.
