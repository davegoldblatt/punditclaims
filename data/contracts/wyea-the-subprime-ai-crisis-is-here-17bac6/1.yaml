explicit_source_elements:
  - AI labs
  - often
  - massive amounts of up-front capital
  - on top of their incredibly high ongoing costs
evaluator_interpretation:
  - The plain reading is that material cash payments before compute delivery are a recurring practice among AI labs, alongside substantial continuing operating expenses.
  - Use calendar 2025, the latest completed annual financial period before publication. The post gives no reporting period for this ongoing industry-wide assertion.
  - A commitment to future payments is not itself an upfront cash payment. Prepayments may subsequently offset service bills; the claim concerns financing demands, not necessarily additional lifetime expense.
  - No accounting basis or numerical threshold for materiality is specified.
support_condition: Representative contracts and payment records show that AI labs repeatedly paid material sums before receiving compute, alongside substantial ongoing expenses during the target period.
contradiction_condition: Representative records show that material advance payments were exceptional rather than recurring, or that the asserted substantial ongoing expenses did not exist.
measurement_requirements: Identify the paying labs, payment dates, delivery dates, amounts, continuing expenses, and whether prepayments offset later bills. Establish frequency across labs rather than across all cloud customers.
source_requirements: Prefer executed contracts, filings and lab financial statements. Separate actual payments from announced commitments and financing.
