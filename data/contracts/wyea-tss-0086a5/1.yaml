explicit_source_elements:
  - Behind the scenes
  - generative AI isn’t moving the needle
evaluator_interpretation:
  - In context, this is a broad assertion that enterprise adoption is failing to deliver meaningful realized operational benefits.
  - Meaningful value includes materially faster work, fewer errors or reduced repeat work; it need not mean audited company-wide profit.
  - Use January–June 2024 as the latest enterprise adoption reporting window before publication. There is no common quarterly reporting cycle for these deployments.
  - Enterprise adoption identifies the population being assessed; it is not an antecedent to a conditional forecast.
  - Mixed means documented deployment difficulties coexist with material reported benefits. It does not estimate how common either experience was.
support_condition: Contemporary deployment evidence shows companies failing to obtain useful operational results or encountering material implementation barriers.
contradiction_condition: Contemporary deployed systems demonstrably deliver material operational improvements to adopting companies.
measurement_requirements: Use realized deployment results and distinguish them from projected savings, vendor promises and adoption counts. Record whether results are self-reported or independently measured.
source_requirements: Prefer adopter disclosures and independent studies. Named-company reporting may establish deployment problems when underlying internal records are unavailable.
