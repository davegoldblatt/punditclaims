assessment_axis: historical_observation
explicit_source_elements:
  - They do not sanity check
  - their own work
evaluator_interpretation:
  - The ordinary reading is a categorical denial that LLMs examine their own reasoning or responses for mistakes.
  - A counterexample must show actual checking or correction, rather than merely a claim by the model that it checked.
  - Checking need not be infallible. An external verifier supplying the correction does not qualify by itself.
  - Assess capabilities demonstrated by 2025-08-12. Earlier demonstrations remain relevant to this categorical capability claim; no lower time bound is asserted.
support_condition: Representative evaluations of contemporary LLMs, including reasoning models, show no genuine inspection or correction of their own work without externally supplied error judgments.
contradiction_condition: A documented pre-post LLM examines and corrects its own reasoning or response without an external error judgment at inference time.
measurement_requirements: Distinguish training feedback from inference-time feedback, prompted revision from spontaneous checking, and successful correction from merely generating checking language.
source_requirements: Primary evaluations with examples or measured correction results and a description of the feedback available to the model.
