assessment_axis: forecast_outcome
explicit_source_elements:
  - most AI startups
  - will die
  - once the venture capital subsidies dry up
evaluator_interpretation:
  - Treat this as conditional on a broad withdrawal of venture financing from AI startups, rather than one company's unsuccessful fundraising.
  - Interpret 'most' as more than half by company count.
  - Interpret 'die' as business closure or insolvency ending the operating business. An acquisition, IPO or valuation decline alone does not count.
  - Use the AI-startup population operating at publication, with survival after the funding withdrawal assessed consistently.
  - No deadline is supplied for either the funding withdrawal or subsequent failures.
support_condition: After a documented sector-wide withdrawal of venture financing, more than half of the defined startup cohort permanently cease operating.
contradiction_condition: After that withdrawal, a definitive follow-up establishes that at least half of the cohort survived the funding transition as continuing businesses. Continuing funding before the antecedent is not a contradiction of the conditional forecast.
measurement_requirements: Sector-wide financing availability, a fixed startup cohort and verified closure or continuing-operation records. Separate failure from acquisition and public listing.
source_requirements: Comprehensive venture-financing datasets plus corporate, insolvency and closure records. Individual funding rounds or isolated failures are insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_met
early_resolution_rule: Support can resolve early only after the funding-withdrawal condition is verified and more than half of the fixed cohort has permanently closed. Survival for an arbitrary short interval cannot conclusively contradict a forecast without a deadline.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No definition of how far or how long venture financing must fall to 'dry up'.
  - No explicit startup cohort or geographic scope.
  - No deadline after the condition occurs.
  - Acquisitions and other exits are not explicitly addressed.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
