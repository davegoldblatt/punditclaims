  - does not exist at scale outside of Anthropic and OpenAI
  - it is not emerging anywhere that I can see
evaluator_interpretation:
  - The plain reading is that commercially substantial AI compute demand is absent outside the two named companies. Large, identified customer commitments can demonstrate emerging demand, although they do not establish realized consumption.
  - Use April–June 2026, the latest completed reporting quarter before publication, for the ongoing state described.
  - The surrounding argument also concerns demand sufficient to absorb the entire construction pipeline. That stronger sufficiency test is distinct from whether substantial outside demand exists.
support_condition: Comprehensive customer-level evidence shows that substantial AI compute purchases and credible commitments are confined to OpenAI and Anthropic.
contradiction_condition: An identified customer outside those companies demonstrates commercially substantial AI compute demand through actual purchases or a concrete large commitment during the target period.
measurement_requirements: Identify the customer, AI workload, commercial commitment and date. Separate compute purchases from equity investments, and commitments from realized revenue.
source_requirements: Prefer customer or supplier disclosures and contractual filings. Supplier descriptions alone do not establish industry-wide demand adequacy.
