assessment_axis: causal_assessment
explicit_source_elements:
  - continued ability to pay its bills
  - contingent upon
  - absorbed by its revenue from OpenAI
evaluator_interpretation:
  - The ordinary reading is that OpenAI cash receipts were necessary to meet obligations and would be fully consumed by those obligations.
  - Revenue must be translated into dated cash collections; recognized revenue alone cannot establish ability to pay.
  - The surrounding October discussion anchors the initial test to October–December 2025. The claim also implies continued dependence beyond that period without an endpoint.
  - The causal test must consider other customers, available cash, usable financing and any financing dependence on the OpenAI contract.
support_condition: A matched cash schedule shows a payment shortfall without OpenAI receipts, after allowing for realistically available alternative liquidity, and shows those receipts being fully absorbed by obligations.
contradiction_condition: Comparable records show sufficient usable liquidity without OpenAI receipts and without financing dependent on its contract, or show a material surplus of those receipts after the relevant obligations.
measurement_requirements: Dated cash receipts, debt service, operating payments, capital commitments, restricted cash, borrowing availability and covenants. Gross revenue, cash collections and borrowing proceeds must remain distinct.
source_requirements: Contract payment schedules, debt agreements and cash-flow disclosures sufficient to evaluate the counterfactual without OpenAI receipts.
