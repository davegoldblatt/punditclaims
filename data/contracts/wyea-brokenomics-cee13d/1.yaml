assessment_axis: historical_observation
explicit_source_elements:
  - it’s not profitable to run these companies
  - their costs are too high
  - their customers are price-sensitive
  - TPUs, Trainium, Inferentia, and custom silicon
evaluator_interpretation:
  - The companies are OpenAI and Anthropic, assessed separately.
  - The ordinary reading is that revenue does not cover the expenses of running each business, including ongoing model development and training.
  - Because this describes an ongoing state, I use January–March 2026, the latest completed calendar quarter that could have been reported before the June 15 post. This is an evaluator choice, not a period Zitron supplied.
  - Price sensitivity means customers reduce purchases, leave, or seek alternatives when effective prices rise.
  - The chip references assert that available hardware choices do not remove the current economic problem. They do not specify a controlled comparison across platforms.
  - Neither the quoted claim nor its supplied context identifies an accounting basis. I therefore cannot silently substitute GAAP operating income, net income, or cash burn.
support_condition: Comparable results show both companies failing to cover operating expenses, including training, during the target quarter, alongside documented customer resistance to cost-covering prices. Evidence must also address the claimed limits of available hardware savings.
contradiction_condition: Comparable results establish that either company covered the relevant full operating costs during the target quarter, or representative pricing evidence directly refutes the asserted customer constraint.
measurement_requirements: Separate company results on a specified accounting basis; consistent inclusion of training and compensation; customer responses to actual price changes; and comparable infrastructure cost evidence. Financing, revenue run rates, and cash burn cannot substitute for operating profit.
source_requirements: Prefer financial statements and documented customer behavior. Identify reporting based on private investor documents as secondary evidence.
