  end: 2024-12-16
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Reliable has no stated accuracy threshold.
  - Provenance may mean AI-versus-human classification or a verified origin and editing history.
  - Considered scrutiny may include external verification rather than inspection alone.
  - A literal denial of any reliable method differs from a claim about arbitrary online content.
  - Impossible to avoid has no specified activities, population, or exposure threshold.
