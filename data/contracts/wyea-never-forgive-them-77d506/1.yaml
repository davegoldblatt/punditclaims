assessment_axis: causal_assessment
explicit_source_elements:
  - AI-generated images and machine-generated text is everywhere
  - impossible to avoid
  - no reliable way to determine the provenance
  - with one exception
  - the considered scrutiny of a human
evaluator_interpretation:
  - Everywhere means pervasive across ordinary online activity, rather than literally present on every page.
  - The plain reading concerns reliably assessing arbitrary content encountered online, not only material produced with a particular watermark.
  - The human exception concerns careful scrutiny, potentially including source investigation; it is not restricted to a quick visual guess.
  - The causal claim is assessed using capabilities and exposure existing by publication. Later improvements cannot disprove the historical assertion.
  - The human exception is part of the assertion, not a conditional forecast.
support_condition: Evidence establishes pervasive unavoidable exposure, the absence of reliable general provenance methods, and reliable identification through considered human scrutiny.
contradiction_condition: Evidence establishes practical reliable provenance and avoidance for ordinary encountered content, or directly refutes the claimed reliability of considered human scrutiny under comparable conditions.
measurement_requirements: Separate exposure and avoidance studies from detection benchmarks. Distinguish probabilistic classification, watermark identification, and verified provenance; evaluate false positives, transformations, coverage, and human investigation.
source_requirements: Contemporaneous primary evaluations and technical standards, with methods and scope disclosed.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
