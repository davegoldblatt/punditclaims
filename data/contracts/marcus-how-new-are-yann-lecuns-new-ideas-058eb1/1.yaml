assessment_axis: causal_assessment
explicit_source_elements:
  - the problem with large language models
  - a lack of cognitive models
  - robust representations of *how events unfold over time*
  - systems like GPT-2
evaluator_interpretation:
  - Read in context, cognitive models means representations of entities, their relationships, and changes in their states that support reliable reasoning about unfolding events.
  - The claim identifies an important underlying cause of language-model failures. It does not explicitly say this is their only cause.
  - The relevant systems are language models available when the post appeared. Later experiments on different systems provide context, not direct evidence about those systems.
  - A limited internal representation does not by itself refute the contextual claim about robustness. Conversely, improving a few tasks with an external model does not establish the general causal diagnosis.
support_condition: Controlled experiments on relevant language models show that missing or defective representations of unfolding events explain substantial reasoning failures, and that supplying or repairing those representations reliably remedies the failures across varied tasks.
contradiction_condition: Experiments show that the relevant models already possess and use robust representations of unfolding events, while their alleged failures persist for independently established reasons; or controlled interventions undermine the proposed causal explanation.
measurement_requirements: Measure representations and their causal influence on outputs, not just benchmark accuracy. Compare interventions against controls for additional computation, information, training, and search. Test generalization beyond a narrow synthetic setting.
source_requirements: Primary experimental papers with methods, model identities, interventions, and limitations. Commentary or demonstrations of mistakes alone cannot establish the cause.
