assessment_axis: forecast_outcome
explicit_source_elements:
  - at its current pace
  - Raise either multiple rounds
  - or the largest funding round ever raised by any company
  - keep doing so in perpetuity
evaluator_interpretation:
  - Current pace means continuing heavily cash-consuming operations, rather than holding every revenue and expense figure exactly constant.
  - Multiple rounds means distinct primary financing rounds. Employee share sales and separate installments of one round are not automatically additional rounds.
  - The record-sized alternative requires a defined historical comparison. The wording does not limit that comparison to US venture rounds.
  - The adjacent six-month prediction does not supply a deadline for the separate perpetuity clause.
  - Observed fundraising can corroborate a near-term pattern without proving that fundraising was necessary or will remain necessary forever.
support_condition: Evidence establishes recurring financing necessity at the stated operating pace and the specified multiple-round or record-round pattern. A finite series can support the observed pattern but cannot establish the perpetual requirement.
contradiction_condition: A decisive transition to durable self-financing establishes that the stated operating pace can continue without recurring external rounds.
measurement_requirements: Separate committed capital from cash received, primary funding from secondary sales, and distinct rounds from installments. Establish financing need using cash flows rather than round size alone.
source_requirements: Issuer or investor financing disclosures, comparable historical financing records, and financial evidence of continued cash-consuming operations.
metric_scope:
