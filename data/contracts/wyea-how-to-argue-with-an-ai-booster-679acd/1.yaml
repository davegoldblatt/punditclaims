assessment_axis: forecast_outcome
explicit_source_elements:
  - re-evaluate things and learn
  - LLMs cannot do
  - will never do
evaluator_interpretation:
  - Learning means using new experience to revise behavior and retain useful changes beyond the immediate response.
  - I include LLM-based systems with persistent memory or model updates. Zitron does not specify whether supporting software is excluded.
  - Ordinary initial training and merely repeating a correction supplied in a prompt do not suffice.
  - The claim does not require human-equivalent learning, consciousness, or AGI.
support_condition: A justified impossibility result covering the stated class would support the indefinite denial. Repeated failures alone cannot establish that learning will never occur.
contradiction_condition: A publicly documented, reproducible LLM-based system learns from experience, revises unsuccessful behavior, and retains useful adaptations during subsequent interactions.
measurement_requirements: Compare performance with and without retained experience. Identify the feedback, retained state, and mechanism for revising behavior.
source_requirements: Primary experimental reports with methods and reproduction materials. Distinguish reproducibility from an independently completed replication.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated public demonstration satisfying the contradiction condition can falsify the categorical 'never' claim without a deadline.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - LLM itself versus an LLM-based system with supporting software.
  - Learning is not defined.
  - The comparison with humans could imply a stronger standard than ordinary retained adaptation.
  - No forecast deadline.
retrospective_or_prospective: retrospective
