assessment_axis: forecast_outcome
explicit_source_elements:
  - human beings have the ability to re-evaluate things and learn
  - a thing that LLMs cannot do
  - and will never do
evaluator_interpretation:
  - The subject is LLMs themselves, the models. It is not wider systems that bolt on external memory, retrieval stores or prompt notes around a frozen model. Earlier reviewers said counting those would stretch the claim against him.
  - "'Learn' means human-like learning after deployment: the model itself takes in new experience during use, keeps it, and revises earlier conclusions. Offline pre-training or periodic retraining by developers is not what he means."
  - "'Will never' has no deadline. It cannot be confirmed within any finite period. It can only be refuted early by a decisive event."
support_condition: A forecast of 'never' cannot be confirmed on any finite record. At most, the evidence keeps showing that deployed LLMs do not learn from experience in their own weights.
contradiction_condition: A publicly documented, independently reproduced LLM that, in ordinary deployment, updates its own parameters from new experience, keeps what it learned, and revises earlier conclusions, without depending on external memory stores.
measurement_requirements: Documentation of persistent, self-directed weight-level learning in deployed LLMs, independently reproduced.
source_requirements: Peer-reviewed papers, reproducible preprints with code, or official model documentation. Independent replication is required for a decisive event.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Contradicted early if an LLM, not an external-memory wrapper, is publicly shown in deployment, and independently reproduced, to learn continually from new experience in its own parameters and retain it. A lab-only research prototype that its authors describe as preliminary does not count as decisive.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'learn' is undefined: training-time learning, in-context learning and deployment-time weight updates are all candidates"
  - "'re-evaluate things' could cover in-context self-correction by reasoning models"
  - "'never' has no horizon"
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
