assessment_axis: causal_assessment
explicit_source_elements:
  - software engineers are having trouble finding work
  - because their jobs are being replaced by AI
  - lie
evaluator_interpretation:
  - Assess the normalized causal proposition about hiring difficulties existing by the post date. No beginning date is supplied.
  - Lie is read as a false causal explanation, without adding a claim about journalists' private knowledge or intent.
  - The ordinary question is whether AI substitution materially contributed to hiring difficulties, not whether it explains every missing job.
  - The separate rhetorical assertion about the entire media is not treated as the normalized claim being graded.
support_condition: Credible evidence establishes that AI substitution was not a material cause of the described software-engineering hiring difficulties.
contradiction_condition: Credible causal research or corroborated employer records establish a material contribution from AI substitution to those difficulties.
measurement_requirements: Separate actual AI adoption and substitution from occupational exposure, general hiring weakness, productivity gains, and employer expectations. Account for competing economic explanations.
source_requirements: Prefer labor-market research and documented staffing decisions. Correlations or executive assertions alone do not settle causation.
