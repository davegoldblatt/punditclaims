assessment_axis: historical_observation
explicit_source_elements:
  - a fair amount of resistance
  - to any substantive regulation
  - in the US
  - particularly in the (powerful) libertarian strands of the tech community
evaluator_interpretation:
  - In context, regulation means AI regulation.
  - The ordinary reading is a substantial, visible current of opposition to meaningful binding AI rules, especially among influential libertarian technology actors.
  - The claim does not require unanimous opposition or a majority of the industry. However, objections to one proposal alone do not establish opposition to any substantive regulation.
  - The geographic and ideological phrases delimit the observation; they are not antecedents of a conditional forecast.
  - Use public positions during early 2023 through the post date as the observation window.
support_condition: Multiple independent, contemporaneous records establish substantial organized opposition to meaningful AI regulation, with evidence connecting a notable part of that opposition to influential libertarian technology actors.
contradiction_condition: Representative evidence shows that the described substantial current of broad opposition did not exist, or that the purported opposition generally accepted the substantive rules at issue.
measurement_requirements: Distinguish opposition to general binding rules from opposition to particular designs, premature regulation, or regulation beyond existing law. Assess breadth and influence separately from the existence of individual statements.
source_requirements: Dated public positions, testimony, lobbying records, or representative surveys. Advocacy documents are primary evidence of their authors' positions, not proof of industry-wide prevalence.
