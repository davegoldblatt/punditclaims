  end: 2023-04-25
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Fair amount' supplies no quantitative threshold."
  - "'Any substantive regulation' may mean broad opposition to new mandates or literal opposition to every meaningful safeguard."
  - "'Particularly' and 'powerful' require comparative evidence not specified in the post."
  - The early-2023 observation window is evaluator-selected because advocacy has no common reporting period.
