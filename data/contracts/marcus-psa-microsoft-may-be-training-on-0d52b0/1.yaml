explicit_source_elements:
  - it’s going to happen a lot
  - the same sly opt-out playbook
  - hiding what is going in obscure settings and Terms of Service
evaluator_interpretation:
  - It refers to the preceding prediction of concealed default inclusion of user data in AI training.
  - A lot means a recurrent, widespread practice across companies and services, rather than an isolated case.
  - No numerical count, market share, frequency, or deadline is supplied. I do not invent one.
  - Be on your guard is advice and is not itself graded.
support_condition: Dated evidence establishes a broad, repeated post-publication pattern of companies using default inclusion for AI training while leaving material disclosure and opt-outs obscure.
contradiction_condition: A decisive development rules out the predicted widespread recurrence. A limited number of examples or a period without examples cannot refute an undated forecast.
measurement_requirements: Document distinct companies, adoption dates, defaults, training uses, and disclosure practices. Explain why the pattern is widespread rather than counting repeated reports of the same event.
source_requirements: A documented cross-company investigation or a substantial collection of dated primary records, with reliable reporting where original interfaces or notices are unavailable.
