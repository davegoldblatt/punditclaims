horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only if a documented broad pattern unambiguously establishes recurrent concealed opt-out training practices. Individual policy changes do not suffice.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - A lot has no count, denominator, or frequency threshold.
  - The referent of it is supplied by the preceding paragraph.
  - Concealed disclosure is qualitative and distinct from default inclusion.
