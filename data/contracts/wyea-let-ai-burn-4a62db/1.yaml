assessment_axis: historical_observation
explicit_source_elements:
  - A lack of data center capacity isn’t holding back people from using generative AI
  - nor is it stopping anybody from launching a product
evaluator_interpretation:
  - The graded proposition concerns usage and product launches. The accompanying rhetorical assertion about whether anyone can explain infrastructure's purpose is not treated as a separate measurable claim.
  - Holding back usage includes limiting access or included usage because available compute capacity is insufficient; it does not require making every generative AI service unavailable.
  - Service availability has no quarterly reporting cycle. I use July 1–7, the latest publication-month reporting window ending on the post date, to test the ongoing state.
  - Earlier announcements are context unless evidence establishes that the relevant restriction continued into this window.
support_condition: Contemporaneous evidence establishes that available capacity accommodated requested usage and launches across the claimed scope, and that apparent restrictions arose for other reasons.
contradiction_condition: A documented restriction on generative AI usage or product availability during the target period is explicitly connected to insufficient compute capacity.
measurement_requirements: Distinguish physical or allocated compute capacity from safety restrictions, export controls, ordinary pricing choices, and unrelated outages. Identify the affected service and dates.
source_requirements: Prefer provider announcements and dated statements explaining restrictions; corroborating reporting may establish which restrictions were in force.
