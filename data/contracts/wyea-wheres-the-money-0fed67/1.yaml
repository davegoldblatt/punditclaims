explicit_source_elements:
  - a billion dollars more than the entirety of its revenue
  - before any other costs
  - $3 billion
  - $2 billion
  - "2024"
evaluator_interpretation:
  - The surrounding passage explicitly adds model-training and model-running compute costs. Assess that combined amount, rather than inference alone.
  - Compare those costs with total calendar-2024 revenue, not subscription revenue or annualized revenue.
  - Read the $1 billion difference as approximate.
  - Separately identified research compute must be reconciled with training compute before adding it; it must not be silently omitted or double-counted.
  - Require completed-year estimates or results, rather than treating forecasts as realized spending.
support_condition: Comparable completed-year figures show that 2024 training and inference compute costs exceeded total revenue by approximately $1 billion.
contradiction_condition: Comparable completed-year figures show no excess, or an excess materially different from approximately $1 billion.
measurement_requirements: Training and inference compute expense and realized total revenue for the same company and calendar year, with research amortization and cloud credits treated consistently.
source_requirements: Prefer financial disclosures or records. Independent reporting and transparent estimates are acceptable if their definitions and status as forecasts or results are clear.
