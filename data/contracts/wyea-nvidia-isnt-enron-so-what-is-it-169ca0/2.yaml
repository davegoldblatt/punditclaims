  - only around $61 billion
  - total generative AI revenue
  - includes every hyperscaler and neocloud
evaluator_interpretation:
  - "Plain reading: the speaker gives his own estimate that all generative AI revenue earned across the industry, including hyperscalers and neoclouds and presumably model companies, adds up to about $61 billion."
  - He gives no period. The closest reading is recent annual revenue as of the post, so roughly calendar 2025 up to the post date. That choice is flagged.
  - He does not say whether this means realized revenue or annualized run rate. The claim can only be checked against a credible industry-wide total on a stated basis, and none exists.
support_condition: A credible, sourced industry-wide total of generative AI revenue for the period around the post, covering hyperscalers, neoclouds and model companies, that comes to roughly $61 billion (within about 25%).
contradiction_condition: A credible industry-wide total for the same period and basis that is far from $61 billion (for example, under about $45 billion or over about $80 billion).
measurement_requirements: An aggregate of AI-specific revenue across hyperscalers, neoclouds and AI labs for one comparable period, with revenue and run rate kept separate and no double counting (for example, OpenAI's payments to Microsoft counted at both companies).
source_requirements: Company disclosures of AI revenue, or a reputable analyst or press aggregate that states its method and period.
