evaluator_interpretation:
  - Assess the proposed causal connection between future-capability marketing, preferential evaluation, and favorable descriptions.
  - Read 'rigged' as deliberate selection or design that inflates the impression of capability. Ordinary benchmark limitations alone do not establish rigging.
  - Treat 'always' and 'all because' as a broad account of industry promotion, not a requirement to disprove it with one contrary adjective.
  - Use early 2023 through publication, following the surrounding historical discussion.
support_condition: Evidence links deliberate future-capability selling and preferential evaluation to the favorable descriptions across a representative set of labs, hyperscalers, and coverage.
contradiction_condition: Evidence directly undermines the asserted dominant causal explanation, showing that the relevant descriptions were substantially grounded in demonstrated outcomes rather than the alleged promotional mechanism.
measurement_requirements: Identify specific marketing claims, evaluations, and resulting descriptions. Establish the direction of influence and distinguish benchmark bias from deliberate manipulation.
source_requirements: Dated marketing materials, benchmark methods and independent audits, and reporting or editorial records that reveal the basis for capability descriptions.
