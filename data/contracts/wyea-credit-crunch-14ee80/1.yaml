ambiguity_flags:
  - No period supplied; latest normally reportable pre-post calendar quarter selected.
  - All AI revenues could mean the entire market or a narrower set of hyperscaler AI businesses.
  - Compute sales could mean hardware sales, cloud compute revenue or newly contracted capacity.
  - Direct purchases and indirect purchases through intermediaries are not distinguished.
  - Revenue accounting basis is unspecified; the compute share alone is explicitly an estimate.
  - The illusion-of-demand conclusion adds a causal judgment to the concentration figures.
