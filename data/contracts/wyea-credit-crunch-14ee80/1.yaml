assessment_axis: historical_observation
explicit_source_elements:
  - more than 70% of all AI revenues
  - I estimate more than 80% of all compute sales
  - from Anthropic and OpenAI
  - taking up whatever capacity comes online
  - creating the illusion of massive demand
evaluator_interpretation:
  - "The surrounding supplier discussion makes these customer-attribution claims: revenue earned by suppliers from OpenAI and Anthropic, rather than the laboratories' own sales."
  - All ordinarily means the relevant market, not one supplier or a selected customer sample.
  - Use the quarter ended June 30, 2026 as the latest normally reportable completed calendar quarter before the October 6 post. The just-ended September quarter is not substituted using later results.
  - The 80% figure is explicitly an estimate. The revenue figure supplies no accounting basis, and neither denominator is defined.
  - Concentration does not by itself establish that the underlying demand is fictitious or lacks downstream customers.
support_condition: Comparable market-wide data for the target period attributes more than 70% of realized AI supplier revenue and more than 80% of AI compute sales to the two laboratories, with a documented method that avoids double counting.
contradiction_condition: Comparable market-wide data establishes either share at or below its stated threshold. A smaller share at one supplier alone does not contradict the market-wide claim.
measurement_requirements: Define AI revenue, compute sales, geography, supplier coverage, customer attribution and treatment of resellers. Use the same period and distinguish realized sales from run rates, backlog and future commitments.
source_requirements: Supplier customer-revenue disclosures or transparent market estimates with both numerators and denominators. Repetitions of Zitron's calculation are not independent verification.
