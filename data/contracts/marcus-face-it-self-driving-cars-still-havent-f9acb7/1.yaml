evaluator_interpretation:
  - The plain reading is that unusual road situations remained a recurring practical difficulty for driverless systems, rather than that most trips failed.
  - Because this describes an ongoing state and discusses incidents that month, use August 1–19, 2023, the publication month through the post date.
  - Assess observable driving-system difficulties. Incident reports alone cannot identify which machine-learning component caused a failure.
support_condition: Contemporaneous incident records and operational assessments show recurring difficulty handling unusual road situations.
contradiction_condition: Representative evaluations show that unusual road situations no longer presented a recurring difficulty for operating driverless systems.
measurement_requirements: Identify the unusual circumstances and the resulting difficulty. Distinguish recurring problems from a quantified failure rate, which Marcus did not specify.
source_requirements: Prefer contemporaneous regulatory submissions and incident records. Do not infer an algorithmic cause merely from a collision.
