assessment_axis: historical_observation
explicit_source_elements:
  - Right now
  - not a single generative AI software company is profitable
  - none of them
  - the kind of hypergrowth that previous "big" software companies had
evaluator_interpretation:
  - The ordinary population is independent software companies whose core offering uses generative AI. Profitable diversified suppliers are not automatically qualifying counterexamples.
  - Profitability ordinarily means company-wide revenue exceeds full expenses; gross margin or positive cash flow alone is insufficient.
  - Use April–June 2025, the latest completed calendar quarter before publication, for the ongoing financial state.
  - Hypergrowth means rapid revenue expansion comparable with earlier major software businesses at a similar development stage. The speaker gives no numerical threshold or matched comparison period.
  - The context mixes reported revenue figures with an uncited universal profit assertion. It does not establish a common accounting basis for profitability.
  - Cursor's pricing criticism is retained as a qualification concerning sustainability; it does not automatically erase measured revenue growth.
support_condition: Matching financial records establish that all qualifying companies were unprofitable and that none displayed revenue growth comparable with appropriate earlier software-company benchmarks.
contradiction_condition: One qualifying company establishes company-wide profitability on the applicable basis, or one establishes a comparable hypergrowth trajectory. The two clauses must be assessed separately.
measurement_requirements: Define the company population, profit basis, revenue measure, growth interval and historical comparator. Do not substitute ARR for realized revenue or gross profit for company-wide profit.
source_requirements: Prefer company disclosures or filings with explicit financial definitions and dates. Retrospective reports must establish facts within the target period.
