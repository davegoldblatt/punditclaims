assessment_axis: historical_observation
explicit_source_elements:
  - the sense that generative AI will create new jobs
  - it hasn't in 18 months
evaluator_interpretation:
  - "Plain reading: in the roughly 18 months from the generative AI boom (ChatGPT, late 2022) to the post, generative AI has not created a meaningful number of new jobs across the economy. He is rebutting hype about job creation in the labour market, so a handful of hires at AI startups would not count against him."
  - "Target period: January 2023 to the post date, about 18 months back from July 2024."
  - "'Meaningful' has no threshold in his words. Gross job postings that mention generative AI are not the same as net new jobs caused by it."
support_condition: Labour-market data for 2023 to mid-2024 showing no material net job creation that can be traced to generative AI, for example GenAI-linked roles too few to register in employment totals and no new occupations at scale.
contradiction_condition: Labour-market data for 2023 to mid-2024 showing a material number of new jobs created because of generative AI, beyond relabelled existing roles, at a scale an informed reader would call meaningful.
measurement_requirements: Economy-wide job-posting or employment data that isolates new roles caused by generative AI in 2023 to mid-2024.
source_requirements: Official statistics or established labour-market data providers such as Indeed Hiring Lab or Lightcast.
