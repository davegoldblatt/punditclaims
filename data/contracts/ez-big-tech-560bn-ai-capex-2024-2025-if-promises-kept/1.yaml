assessment_axis: forecast_outcome
explicit_source_elements:
  - If they keep their promises
  - by the end of 2025
  - Meta, Amazon, Microsoft, Google and Tesla
  - will have spent over $560 billion
  - in capital expenditures on AI
  - in the last two years
  - post dated 2025-07-21
evaluator_interpretation:
  - We read 'the last two years' as calendar 2024 and 2025.
  - We read 'their promises' as the capital spending plans the companies had announced for 2025.
  - None of the five companies reports AI capital expenditures separately. Total capital expenditures are not AI capital expenditures.
support_condition: The companies kept their 2025 spending plans, and their AI capital expenditures for 2024 and 2025 together exceeded $560 billion.
contradiction_condition: The companies kept their 2025 spending plans, and their AI capital expenditures for 2024 and 2025 together did not exceed $560 billion.
measurement_requirements: Company-reported AI capital expenditures for each company and year, summed with inputs and rounding shown. If only total capital expenditures are reported, the claim is not scored.
source_requirements: null
metric_scope: null
original_horizon: by the end of 2025
horizon_interval:
  start: 2025-07-21
  end: 2025-12
  precision: month
target_period: null
condition_status: unknown
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - "'Capital expenditures on AI' is not reported separately by any of the five companies."
  - "'Keep their promises' does not say which promises or how closely they must be kept."
  - "'All to make around $35 billion' is a separate revenue estimate and is not tested here."
retrospective_or_prospective: retrospective
