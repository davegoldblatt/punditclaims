  - Claude’s constitution
  - a set of built-in guardrails
  - OpenAI has those, too!
  - Just constructed differently
evaluator_interpretation:
  - "Read guardrails in its ordinary broad sense: behavioral guidance and safety limits incorporated into model training or operation."
  - Built-in does not require an infallible software filter or identical implementations at the two companies.
  - Read amounts to as a functional summary. An exhaustive claim that the constitution contains only restrictions would be materially stronger.
  - Use the current calendar quarter through publication, January 1–March 12, 2026, as the reporting window for the ongoing design state.
support_condition: Anthropic documents that its constitution shapes trained behavior and safety limits, and OpenAI documents implemented behavioral safeguards in its models.
contradiction_condition: The constitution is merely an unused statement without a role in model behavior, or OpenAI's relevant models lack implemented behavioral safeguards.
measurement_requirements: Establish both the intended behavioral constraints and their incorporation into training or deployment. Do not equate their existence with perfect effectiveness.
source_requirements: Anthropic's constitution and training disclosures, alongside OpenAI's training documentation or system cards available by the evaluation date.
