evaluator_interpretation:
  - At the open means the November 20, 2026 regular-session opening trade.
  - The percentage comparison is against the previous regular-session close.
  - Premarket trading is the stated basis for the forecast, not an antecedent that makes it conditional.
  - The speaker supplies no numerical tolerance for either approximation. A borderline result should remain unresolved if choosing a tolerance determines the verdict.
  - The assessment concerns the realized opening price, not whether the premarket inference was reasonable.
  - Secondary-market share prices are not corporate accounting amounts; metric_scope is null.
support_condition: The actual opening trade shows a decline reasonably described as about 9%, to approximately $88, relative to the previous close.
contradiction_condition: The actual opening trade clearly falls outside an ordinary reading of both approximate targets. A rise or no meaningful decline would also contradict the forecast.
measurement_requirements: Actual regular-session opening price on November 20 and the November 19 regular-session close; distinguish the opening trade from premarket, intraday and closing prices.
source_requirements: Exchange records or identifiable historical market-data records available by the evaluation date.
