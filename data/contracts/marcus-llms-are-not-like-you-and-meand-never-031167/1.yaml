original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - "'proper model' is undefined"
  - "'reliably' and 'superficially' have no threshold"
  - whether LLMs hold implicit world models is itself disputed, so no system can be agreed to fall on either side
