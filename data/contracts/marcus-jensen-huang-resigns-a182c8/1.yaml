explicit_source_elements:
  - enabled and even lobbied for Chinese AI
  - subverted US policy
  - carelessly left himself vulnerable
  - both blackmail and espionage
evaluator_interpretation:
  - This is a retrospective claim about Huang's conduct during his Nvidia leadership through the post; no starting date is supplied.
  - Enabling Chinese AI includes helping Chinese organizations obtain or use AI technology. Lobbying means advocating government decisions facilitating that access.
  - Subverting policy means materially undermining operative US restrictions or their enforcement; advocating a lawful policy change alone does not establish it.
  - Vulnerability requires an identifiable route to coercion or intelligence access. Actual blackmail or successful espionage need not have occurred.
  - Carelessly describes allegedly avoidable exposure. It is not a conditional antecedent.
  - The bundled claim requires evidence for each material component; support for advocacy alone does not settle the security allegations.
support_condition: Reliable records substantiate assistance and lobbying for Chinese AI, conduct undermining operative US policy, and avoidable, concrete exposure to both blackmail and espionage.
contradiction_condition: Reliable records affirmatively refute material alleged conduct or exposure. Lack of public proof alone is insufficient for contradiction.
measurement_requirements: Separate advocacy, lawful sales, alleged evasion, identified security risks and established misconduct. Do not equate a suspected intelligence connection with a completed finding.
source_requirements: Prefer company records, lobbying disclosures, congressional records and investigative findings. Attribute unresolved allegations and use reporting when underlying records are unavailable.
