explicit_source_elements:
  - GPT
  - latest systems
  - regularly maks illegal moves
  - doesn’t really model the rules of chess well enough to stick to them
evaluator_interpretation:
  - The ordinary behavioral reading is that contemporary GPT systems make recurring illegal chess moves despite sometimes playing competently.
  - Regularly means a recurring reliability problem across games, not that most individual moves are illegal.
  - GPT includes contemporary chat and completion variants because the passage does not distinguish them.
  - Behavioral failures can test adherence to chess rules but cannot establish the absence of an internal rule representation.
  - With no formal reporting cycle, the observation is assessed against 2023 evaluations available by October 5.
support_condition: Contemporary evaluations document recurring illegal moves by GPT systems in ordinary chess play.
contradiction_condition: Contemporary evaluations show consistently legal play with absent or exceptionally rare illegal moves for systems included in the claim's broad GPT scope.
measurement_requirements: Identify the model version, prompting, sample size, illegal-move definition, retries and any external correction. Distinguish move-level and game-level failure rates.
source_requirements: Original experiments or recorded games concerning contemporary GPT systems, with results available by the post date.
