explicit_source_elements:
  - we will all have our own AI agents
  - companies will have armies of them
  - this time I think the hype is right — at least in the long term
evaluator_interpretation:
  - "Read as a long-term forecast with no deadline: most people will use a personal AI agent, and companies will deploy agents in large numbers."
  - He set no date. 'In the long term' means this cannot fail before some distant, unstated point.
support_condition: Credible adoption data show that personal AI agents are used by most people, and that companies commonly run large fleets of agents.
contradiction_condition: With no deadline, this cannot be contradicted on a fixed date. Only a decisive event, such as agents being abandoned or banned at scale, would count against it.
measurement_requirements: Population-level data on personal agent use, plus enterprise data on how many agents companies deploy.
source_requirements: Official statistics, large representative surveys, or company disclosures.
