condition_status: not_applicable
early_resolution_rule: Supported early if representative data show that most people in major economies use a personal AI agent and that large companies routinely deploy many agents. No early contradiction except a decisive, lasting collapse of agent use.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'long term' has no date"
  - "'all' is likely loose, not literal"
  - "'armies' has no number"
