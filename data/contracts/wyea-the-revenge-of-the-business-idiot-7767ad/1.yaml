ambiguity_flags:
  - Endless and desperate are rhetorical descriptions without numerical thresholds.
  - Nobody may be categorical or an exaggeration meaning insufficient preparation.
  - Risky does not identify a credit-rating or expected-loss threshold.
  - The reporting quarter is supplied by the evaluator.
