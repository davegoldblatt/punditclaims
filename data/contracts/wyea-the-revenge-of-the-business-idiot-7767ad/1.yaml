assessment_axis: causal_assessment
explicit_source_elements:
  - AI data centers are so capital-intensive
  - require endless amounts of risky debt
  - private credit
  - insurance and pension funds desperate for yield
  - nobody has actually thought about what happens if these things don’t work out
evaluator_interpretation:
  - Endless means very large and continuing financing needs, not literally infinite debt.
  - The testable financing claim is that capital requirements drive borrowing, including private credit connected to insurers and pension funds seeking returns.
  - The final factual clause asserts an absence of substantive consideration of project failure. The insult itself is not assessed.
  - The assessment uses the latest completed quarter before the post, January–March 2026, for the ongoing financing state.
  - This is a sector-level financing mechanism, not a quantified claim about one company's accounts; metric_scope is therefore null.
support_condition: Financing records establish the capital-needs-to-debt mechanism and institutional funding links. Supporting the entire statement additionally requires evidence of a widespread absence of substantive downside consideration.
contradiction_condition: Records undermine the asserted financing mechanism, or contemporaneous work by financing participants explicitly examines failure channels and protections, contradicting the categorical absence of downside consideration.
measurement_requirements: Distinguish financing instruments, capital providers, and investor motives. Distinguish considering downside from adequately protecting against it.
source_requirements: Financing disclosures, original financial-system research, and substantive risk assessments by lenders, investors, advisers, or rating agencies.
metric_scope: null
original_horizon: null
horizon_interval: null
