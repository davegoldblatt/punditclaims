  - endless delays
  - hundreds of billions of dollars of chips sitting in storage
  - AI data centers
  - fixed-income nightmare fuel
evaluator_interpretation:
  - Read 'nightmare fuel' as a substantial deterioration in bond prices or credit risk across multiple AI data-center borrowers, not universal default.
  - Read 'endless delays' as recurrent material construction or power delays.
  - Read 'hundreds of billions' ordinarily as at least approximately $200 billion of chips actually held in storage, not annual chip sales or total infrastructure spending.
  - Use October 13–20, 2026 for the ongoing market state, based on the surrounding last-week discussion. Earlier observations can establish a comparison baseline but cannot establish current inventories.
support_condition: Evidence establishes broad material credit deterioration, recurrent delivery delays, and stored chip inventories at the stated order of magnitude during the relevant period.
contradiction_condition: Comparable evidence establishes broadly stable or improving credit conditions, or a sufficiently comprehensive inventory measurement materially below the claimed amount.
measurement_requirements: Comparable bond prices or spreads; documented delays; and a dated, nonduplicative valuation of chips physically in storage.
source_requirements: Prefer market records, project disclosures, and inventory records. Independent reporting can document private inventory information, with its coverage limits stated.
