assessment_axis: historical_observation
explicit_source_elements:
  - the number of radiologists keeps growing
  - in some communities there is a shortage
  - set against Hinton's 2016 call to stop training radiologists
evaluator_interpretation:
  - "Plain reading: in the decade since Hinton's 2016 remark, the radiologist workforce has grown, not shrunk, and shortages of radiologists exist in at least some places."
  - Marcus names no country. Most coverage of Hinton's remark uses US data, so US workforce figures are the main test.
  - Target period is 2016 (Hinton's remark, 'a decade ago') through 2026 (the post date), at year precision, because the claim describes an ongoing trend since that remark.
  - "'Some communities' is a low bar. Evidence of a national or regional shortage is enough."
support_condition: Credible data or expert reports showing the number of radiologists rose over roughly 2016-2026, plus reports of radiologist shortages in at least some areas.
contradiction_condition: Data showing the radiologist workforce flat or shrinking over the period, or no shortage anywhere.
measurement_requirements: A count or growth rate of active radiologists over recent years; reports of shortages, vacancies or unfilled jobs.
source_requirements: Workforce studies (Neiman Institute, ACR, AAMC, RCR), or reputable news reports quoting labour-market researchers.
