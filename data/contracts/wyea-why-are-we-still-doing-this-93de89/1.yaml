assessment_axis: causal_assessment
explicit_source_elements:
  - Amazon Web Services
  - multiple recent outages
  - caused by use of its Kiro AI coding tool
evaluator_interpretation:
  - Multiple means at least two distinct outages.
  - Kiro must have materially contributed to each outage. Human error and a contribution from Kiro can coexist.
  - An interruption to an individual AWS service counts; a platform-wide outage is not required.
  - The normalized proposition concerns the outages. The meeting and approval-policy assertions are supporting context, not substitutes for evidence of two Kiro-caused AWS outages.
  - Recent refers to incidents preceding the post. The text supplies no defensible exact starting date.
support_condition: Incident records or sufficiently corroborated reporting identify at least two distinct pre-post AWS outages materially caused by actions taken using Kiro.
contradiction_condition: Reliable incident records establish that the incidents invoked do not include two Kiro-caused AWS outages, for example because another tool or non-AWS infrastructure was involved.
measurement_requirements: Identify each incident, affected service, date, tool and causal chain. Distinguish AWS from Amazon retail systems and Kiro from Amazon Q Developer.
source_requirements: Prefer incident reports and operational records. Where unavailable, use attributed reporting and include Amazon's response without treating either anonymous allegations or corporate denials as conclusive.
