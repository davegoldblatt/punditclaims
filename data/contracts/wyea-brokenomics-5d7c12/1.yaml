evaluator_interpretation:
  - Read as a universal claim about substantive research responses, not merely a warning that hallucinations are possible.
  - A hallucination is a fabricated or false factual assertion, including a falsely attributed citation.
  - Use January–March 2026, the latest completed quarter before the post, for the ongoing description of AI research tools.
  - A correct isolated answer or citation is insufficient unless the entire substantive research response was checked.
support_condition: Evidence establishes that every substantive AI research response within the relevant scope contains at least one hallucination. A high average error rate alone is insufficient.
contradiction_condition: At least one substantive research response generated in the target period is independently checked in full and contains no hallucinations.
measurement_requirements: Response-level checking of factual assertions and citation attribution, with the generation date, model, prompt, output, and checking method available.
source_requirements: Independent research evaluations with inspectable outputs or explicit whole-response accuracy criteria.
