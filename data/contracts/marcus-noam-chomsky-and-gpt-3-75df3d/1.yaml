explicit_source_elements:
  - systems like GPT-3
  - provide remarkably little in the way of explanation
  - don't tell us why the world is as it is
  - merely mimic statistical patterns of how language has been used
evaluator_interpretation:
  - The claim is about the scientific explanatory value of GPT-3 as a theory of human language. 'Remarkably little explanation' is a judgment about what counts as a good scientific explanation, with no measure attached.
  - "'Merely mimic statistical patterns' is a contested description of what the model has learned. Researchers did not agree on it in 2022, and no single test was accepted as settling it."
  - Because the claim mixes a normative standard (what a good theory must explain) with a contested description, it has no plain reading that evidence could settle.
support_condition: None that is decisive. Evidence would need an agreed test showing GPT-3 explains nothing about language or the world beyond surface statistics.
contradiction_condition: None that is decisive. Evidence would need an agreed test showing GPT-3 gives real scientific explanations of why human language has the character it does.
measurement_requirements: null
source_requirements: Peer-reviewed or preprint studies of GPT-3-era model mechanisms; none provides an agreed test of 'explanation'.
