  - 16 cents for every dollar
  - $60-a-month plan
  - $1 for every dollar
  - $200-a-month plan
  - before “generous usage” of other models
evaluator_interpretation:
  - The surrounding discussion of included tokens makes the ordinary reading excess included API-priced usage value relative to the subscription fee.
  - This does not measure Cursor's actual expenditure or operating loss.
  - Use March 2026, the current monthly plan terms described at publication; plan terms can be reported contemporaneously without waiting for financial results.
  - Treat 16 cents as a rough, downward-truncated description of 16⅔ cents. This is an explicit approximation, not conventional nearest-cent rounding.
support_condition: Contemporaneous company terms provide approximately $70 of included API-priced usage for $60 and $400 for $200, excluding additional bonus or separately included usage.
contradiction_condition: Contemporaneous company terms provide materially different included allowances, so the excess-value ratios do not approximately equal 16 cents and $1 per subscription dollar.
measurement_requirements: Subtract each monthly subscription price from its guaranteed included API-priced allowance, then divide by the subscription price. Exclude variable bonus usage.
