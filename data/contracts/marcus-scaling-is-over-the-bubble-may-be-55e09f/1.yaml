assessment_axis: causal_assessment
explicit_source_elements:
  - Trump’s crew
  - devastated the global economy
  - based in part on what they got from an LLM
  - didn’t even do their math right
evaluator_interpretation:
  - The context identifies the tariff plan announced on April 2, 2025 and its effects through April 6.
  - "The claim contains three assertions: actual reliance on LLM output, a material mathematical or formula error, and severe global economic harm caused by the plan."
  - LLM involvement requires evidence of actual use in developing the policy. Similar chatbot answers alone do not establish provenance.
  - A material mismatch between a formula and its parameters can count as getting the math wrong; disagreement with a policy objective alone cannot.
  - Devastation ordinarily means severe economic damage. Financial-market losses are relevant, but do not by themselves establish a collapse in global production, employment, or trade.
  - Based in part is an asserted causal link, not a conditional forecast.
support_condition: Documented policy-development records establish LLM reliance, reproducible analysis establishes a material formula error, and contemporaneous economic evidence establishes severe attributable global harm.
contradiction_condition: Reliable evidence refutes the asserted LLM involvement, establishes that the alleged mathematical error is absent, or shows that the claimed severe global economic damage did not occur.
measurement_requirements: Separate policy provenance, formula validity, financial-market effects, and realized economic effects. Do not substitute recession forecasts for observed recession.
source_requirements: Policy-development records or corroborated firsthand accounts; the published formula and expert analysis; official economic data or reputable contemporaneous market reporting.
