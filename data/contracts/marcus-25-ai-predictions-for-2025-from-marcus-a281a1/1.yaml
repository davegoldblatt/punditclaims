explicit_source_elements:
  - Most companies involved have thus far lost money
  - At least three have been quasi-acquired
  - with relatively little profit for their investors
evaluator_interpretation:
  - "'Companies involved' read as the AI model makers (LLM startups such as OpenAI, Inflection, Adept, Character.AI), excluding chip makers like Nvidia, which the post sets apart."
  - "'Quasi-acquired' read as the 2024 license-and-hire deals, where a Big Tech firm hired the founders and staff and paid a license fee without buying the company."
  - "'Relatively little profit for their investors' read as investors getting back roughly their money or a modest multiple, well below the valuations once hoped for."
  - "Period: calendar 2024, up to the post date."
support_condition: Reports show the leading AI model companies were losing money in 2024, and at least three 2024 quasi-acquisitions returned investors roughly their money or a modest gain.
contradiction_condition: Reports show most AI model companies were profitable, or fewer than three such deals happened, or the deals gave investors large returns.
measurement_requirements: Reported or estimated 2024 losses of AI model companies; reported investor payouts in the license-and-hire deals.
source_requirements: Company figures where they exist; otherwise reputable news reports citing deal terms or company documents.
