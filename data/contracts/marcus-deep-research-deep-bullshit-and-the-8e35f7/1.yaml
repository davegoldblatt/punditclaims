explicit_source_elements:
  - once they are there
  - they won’t go away
evaluator_interpretation:
  - They refers to errors introduced into scientific literature through OpenAI Deep Research use.
  - The antecedent requires an error incorporated as scientific content, rather than an erroneous output reproduced and labelled in an evaluation.
  - The ordinary reading is persistent contamination of the scientific record. It does not require treating one successful correction as disproving the entire warning.
  - Persistence should be assessed through corrections, retractions and downstream reuse. No duration or proportion is supplied.
support_condition: After the antecedent is established, longitudinal records show that identified errors remain in use or continue to propagate despite opportunities for correction.
contradiction_condition: After the antecedent is established, comprehensive records show effective correction or withdrawal of the established errors and correction of their downstream uses, undermining the claimed persistence.
measurement_requirements: Identify the originating errors and follow dated versions, correction notices, retractions and downstream citations. Distinguish archival preservation of a corrected paper from continued acceptance of its error.
source_requirements: Product-attributable publication cases, publisher records and longitudinal citation or replication audits.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A documented correction campaign that eliminates an exhaustively traced error set and corrects downstream uses could contradict practical persistence. An isolated correction or an error remaining at one observation date is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or persistence duration.
  - They may refer collectively to contamination or individually to every error.
  - Go away could mean correction, retraction, removal or cessation of downstream use.
retrospective_or_prospective: retrospective
