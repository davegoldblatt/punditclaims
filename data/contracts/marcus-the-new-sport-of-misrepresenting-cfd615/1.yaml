assessment_axis: historical_observation
explicit_source_elements:
  - state-of-the-art models learn to exploit spurious statistical patterns in datasets
  - instead of learning meaning in the flexible and generalizable way that humans do
  - what the Facebook researchers said in 2019 is still the case
evaluator_interpretation:
  - The checkable assertion is that reliance on misleading statistical cues remained a problem for high-performing NLP systems in 2022. The advice to be cautious is not separately scored.
  - The plain reading concerns incomplete, unreliable generalization despite benchmark success. It does not require models to have learned no meaningful linguistic information whatsoever.
  - The ongoing state has no named reporting period. I use research reported during 2022 through September 23, the current research year up to publication; this field has no standard quarterly reporting cycle.
  - "'State-of-the-art' is read as strong task-performing NLP models discussed in contemporary research, rather than every model or only the largest model released immediately before the post."
support_condition: Contemporary research finds that strong NLP models still rely on task-irrelevant cues or improve on controlled generalization tests when those cues are reduced, despite doing well on established tasks.
contradiction_condition: Contemporary controlled studies establish that the relevant strong models have overcome the alleged shortcut dependence and reliably track task meaning when incidental statistical cues change.
measurement_requirements: Use controlled cue manipulation, dataset debiasing, or independent tests that distinguish semantic task performance from incidental correlations. General accuracy improvements alone do not establish that shortcut dependence has disappeared.
source_requirements: Primary empirical studies from the target period, with contemporary research discussion used only within its stated limits.
