explicit_source_elements:
  - ChatGPT and related systems
  - some of what they say is true, and some is not
  - very difficult for the end user to anticipate
evaluator_interpretation:
  - The ordinary reading is that contemporaneous general-purpose chatbots produce both accurate and inaccurate answers, with presentation or self-confidence insufficient for users to reliably identify errors.
  - This is not read as saying every answer is equally unreliable or that knowledgeable users can never identify mistakes.
  - "Use the latest publicly reportable evaluation cycle before the post: the 2023 systems and studies through January 27, 2024. The context expressly invokes earlier incidents and the January legal study."
support_condition: Contemporaneous evaluations demonstrate a mixture of correct and incorrect answers, together with user-study evidence of missed errors or evidence that model confidence does not reliably disclose them.
contradiction_condition: Representative contemporaneous evaluations establish consistently accurate answers or reliable user identification of errors across the relevant tasks.
measurement_requirements: Identify model versions and tasks. Keep answer error rates, user detection and model self-assessment distinct; do not generalize a domain-specific rate to all usage.
source_requirements: Original evaluations of contemporaneous systems, preferably including a user study. Use dated original versions rather than silently importing later revisions.
