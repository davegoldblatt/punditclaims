assessment_axis: historical_observation
explicit_source_elements:
  - GPT’s
  - on their own
  - don’t do scientific discovery
evaluator_interpretation:
  - This is an observation about GPT models existing by April 8, 2023, not a forecast about subsequent models.
  - The target is the state of demonstrated capability through the publication date, including April 1–8. No reporting quarter applies, and no lower date boundary is supplied.
  - In context, GPT refers to OpenAI’s GPT family, including its ChatGPT implementations.
  - The plain reading of scientific discovery is producing a substantively new scientific finding that withstands independent checking. A proposed hypothesis or scientific-looking text alone does not establish discovery.
  - On their own permits a person to pose a research question and independently check the result. It excludes a person supplying the essential discovery or a larger research system supplying essential reasoning or experimental work.
support_condition: Credible assessments covering contemporary GPT capabilities establish that standalone models had not demonstrated independently validated scientific discovery, with relevant purported discoveries examined. Isolated failures or an unsuccessful search alone are insufficient.
contradiction_condition: A documented finding generated by a GPT model by April 8, 2023 is independently established as scientifically novel and correct, with records showing that the model supplied the essential discovery under the stated autonomy criterion.
measurement_requirements: Identify the model, generation date, prompts, outputs, human contributions, external tools, novelty checks, and independent validation. Mathematical findings can qualify; laboratory experimentation is not mandatory.
source_requirements: Prefer original research records and independent expert validation. Later publications may document earlier events, but later model achievements cannot settle this observation.
