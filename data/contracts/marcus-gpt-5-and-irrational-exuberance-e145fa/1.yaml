assessment_axis: historical_observation
explicit_source_elements:
  - GPT’s
  - on their own
  - don’t do scientific discovery
evaluator_interpretation:
  - This describes GPT capabilities at publication, not all future models.
  - "For the ongoing observation, use the latest completed calendar quarter before publication: January–March 2023. Scientific capability has no standard quarterly reporting period; this is an evaluator convention."
  - Scientific discovery means new scientific knowledge whose validity and novelty have been independently established. Generating an interesting hypothesis alone is insufficient.
  - On their own permits ordinary prompting but excludes a discovery workflow dependent on external search, computation or laboratory automation. Subsequent human validation of a model-originated finding would not itself disqualify the finding.
support_condition: A sufficiently comprehensive contemporary assessment establishes that standalone GPT models had not demonstrated validated scientific discoveries, distinguishing candidate hypotheses from established findings.
contradiction_condition: A documented finding originating from a contemporary standalone GPT model is independently established as scientifically novel and valid within the target period.
measurement_requirements: Identify the model, prompts, external assistance, original contribution, novelty assessment and validation. Distinguish discovery from hypothesis generation.
source_requirements: Primary research records and independent scientific validation. Neither a model's self-description nor an unsuccessful search proves inability.
