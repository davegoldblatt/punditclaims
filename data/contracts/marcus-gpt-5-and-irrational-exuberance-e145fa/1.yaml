ambiguity_flags:
  - No observation period is stated; the latest completed quarter is an evaluator convention.
  - On their own leaves the permitted degree of human prompting unspecified.
  - Scientific discovery could mean generating a hypothesis or establishing new knowledge.
  - A statement about demonstrated capabilities is weaker than a claim of inherent impossibility.
