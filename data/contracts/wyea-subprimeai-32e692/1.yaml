explicit_source_elements:
  - generative AI boom
  - unsustainable
  - will ultimately collapse
evaluator_interpretation:
  - Collapse means a broad, sustained contraction in the generative AI sector, visible across financing, investment and business activity.
  - An isolated company failure or a regional stock-market decline does not by itself establish collapse of the boom described.
  - No numerical threshold, geographic boundary or deadline was supplied.
support_condition: Dated evidence establishes a broad, sustained collapse of generative AI financing, investment and business activity.
contradiction_condition: Continued growth for a finite period cannot contradict an eventual collapse with no deadline. Contradiction would require evidence that decisively rules out the claimed necessity of collapse.
measurement_requirements: Comparable sector-level observations over time, distinguishing generative AI from broader technology and distinguishing stock prices from financing and operating activity.
source_requirements: Prefer independently compiled industry data and company disclosures. Corroborate any claimed collapse across multiple indicators.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve supported upon documented sector-wide collapse meeting the support condition. Regional corrections, isolated failures and continued growth do not settle the open-ended forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Collapse has no stated magnitude or duration.
  - Geographic scope is unspecified.
  - Ultimately supplies no deadline.
  - Unsustainable has no stated financial test.
