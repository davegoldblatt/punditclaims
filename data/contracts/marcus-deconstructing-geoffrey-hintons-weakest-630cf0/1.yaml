assessment_axis: historical_observation
explicit_source_elements:
  - Humans rarely make things up wholesale
  - LLMs do
  - except in hallucinations associated with disorders like schizophrenia
  - Wholesale unintentional fabrication
evaluator_interpretation:
  - Read as a comparison between healthy humans and contemporary LLMs making factual assertions. Exclude deliberate lies, jokes and requested fiction.
  - Wholesale fabrication means inventing a purported fact, event or source, rather than merely misstating a detail.
  - Use 2023, the latest complete calendar year before the post, as the reporting period. This research has no standard reporting cycle, so that boundary is provisional.
  - Do not assign a numerical threshold to 'rarely'. Comparable evidence must establish the ordinary distinction between exceptional human behavior and a recurring LLM error.
support_condition: Comparable evidence shows that unintentional wholesale fabrication is uncommon among healthy humans but a recurring error among contemporary LLMs.
contradiction_condition: Comparable evidence shows that healthy humans commonly fabricate entire factual accounts under ordinary conditions, or otherwise establishes that the claimed contrast does not hold.
measurement_requirements: Comparable tasks, opportunities to abstain, definitions of fabrication and denominators. Separate spontaneous invention from responses induced by misinformation.
source_requirements: Primary empirical research on both populations. Examples of LLM fabrication alone cannot establish the human comparison.
