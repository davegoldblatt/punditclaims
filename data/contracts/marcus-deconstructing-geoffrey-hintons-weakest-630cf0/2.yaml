explicit_source_elements:
  - Humans rarely make things up wholesale, LLMs do.
  - except in hallucinations associated with disorders like schizophrenia
  - Wholesale unintentional fabrication
  - not the same thing as making a flawed argument, or lying, or spinning facts for political gain
evaluator_interpretation:
  - The plain reading is that substantial, unintended invention of purported facts is unusual in humans outside the stated clinical exception, but is a recurring failure of contemporary LLMs.
  - Wholesale fabrication means inventing an event, entity, source, or substantial factual account. Ordinary inaccuracies, mistaken arguments, deliberate lies, jokes, and requested fiction do not establish it.
  - Rarely is qualitative. I do not impose a numerical threshold or read the claim as saying that healthy humans never fabricate.
  - The target is the state of knowledge and the LLMs existing as of the post. This subject has no quarterly or annual reporting cycle. The period therefore ends on the post date and has no invented start date; it is not restricted to calendar 2023.
  - A fair comparison requires sufficiently comparable opportunities and definitions, whether supplied by a direct experiment or by compatible bodies of research.
support_condition: Evidence establishes both that contemporary LLMs recurrently invent substantial purported facts and that comparable unintended invention is unusual among humans outside the stated clinical exception.
contradiction_condition: Representative evidence shows that comparable wholesale invention is common among those humans, or that the asserted qualitative contrast with contemporary LLMs does not hold. Isolated human examples do not contradict rarely.
measurement_requirements: Separate substantial invention from minor errors and intentional invention. Identify the human population, model versions, tasks, prompting, access to information, and opportunities to abstain. Laboratory induction rates must not be treated as everyday prevalence.
source_requirements: Prefer original experiments and systematic research syntheses. Anecdotes can establish possibility, but cannot establish comparative frequency.
