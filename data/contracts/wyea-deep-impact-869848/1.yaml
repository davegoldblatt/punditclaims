early_resolution_rule: An event can settle the forecast only if it directly establishes material market resistance or ready acceptance of the relevant additional GPU spending after explicit consideration of DeepSeek's economics. Isolated share-price moves and aggregate capital expenditure do not suffice.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - "'Hard sell' has no threshold for the severity or duration of resistance."
  - "'Any hyperscaler' leaves unclear whether the claim is universal or describes the sector generally."
  - GPU spending is not separated from other capital expenditure.
  - The asserted cost and capability comparisons lack a common accounting and evaluation basis.
retrospective_or_prospective: retrospective
