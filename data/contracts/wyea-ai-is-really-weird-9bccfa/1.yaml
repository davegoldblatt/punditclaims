explicit_source_elements:
  - OpenAI’s CFO does not believe that it’s ready to go public in 2026
  - Sam Altman’s reaction
  - have her report to somebody else other than him
  - Both OpenAI and Anthropic’s margins are worse than they projected
evaluator_interpretation:
  - The CFO statement concerns her reported assessment before the post, not whether an IPO subsequently happened.
  - The exact quotation includes a causal allegation about her reporting line even though the normalized proposition omits it. I retain that allegation.
  - The surrounding margin discussion points to press-reported gross margins and company-specific adjustments, not net profitability or a common GAAP measure.
  - I use 2025, the latest completed annual period before the post, for the comparison with earlier projections. A revised forecast is distinguished from a realized result.
  - The target interval bounds the 2025 financial period and executive circumstances through April 8, 2026. Evidence must still match the particular component it addresses.
support_condition: Reliable reporting establishes the CFO's doubts and reporting-line change, evidence connects that change to those doubts, and matched actual-versus-prior-projection comparisons show lower margins for each company.
contradiction_condition: Reliable contemporaneous evidence disproves the reported stance or causal explanation, or a matched comparison shows that either company's relevant margin met or exceeded its earlier projection.
measurement_requirements: Match each company's margin definition, customer scope, accounting adjustments, and reporting period to its earlier forecast. Establish the chronology and reason for the reporting-line change separately.
source_requirements: Prefer executive statements, organizational records, and original financial documents. Where unavailable, identify reliance on reporting about private statements and financial estimates.
