support_condition: The original paper reports zero pass@1 for every evaluated model on its Hard tier under its contamination-reduction protocol.
contradiction_condition: At least one evaluated model has a positive reported pass@1 on that same Hard tier under the same protocol.
measurement_requirements: Check the original table's Hard column, model roster, pass@1 definition, tool restrictions, and contamination controls.
