evaluator_interpretation:
  - Because the sentence explicitly starts from annualized revenue, read $8.3 million as its monthly run-rate equivalent, not verified receipts for a completed month.
  - Assess the reported pilot scale and its arithmetic comparison with the reported annual target. Do not interpret this as an established failure to meet the 2026 target.
  - Treat two months as a rough description of the February–March pilot. The exact reported milestone was reached within six weeks.
  - Use February–March 2026 as the observation period described by the sentence. The January announcement of the annual target is contextual evidence.
  - Use estimate for the press-reported financial figure; the separate company disclosure is corroborating context.
support_condition: Contemporaneous reporting places the pilot near a $100 million annualized revenue scale, equivalent to approximately $8.3 million per month, and reports an annual 2026 advertising ambition in the low billions.
contradiction_condition: Comparable reporting establishes a materially different pilot run rate or shows that the alleged annual target was misreported. Actual monthly receipts cannot be inferred solely from an annualized figure.
measurement_requirements: Keep annualized pilot revenue separate from realized monthly receipts and the full-year revenue target. Preserve the geographic and daily-exposure qualifications on the user percentage.
source_requirements: Contemporaneous company disclosures and reputable reporting. Use secondary attribution for the FT target only if the original cannot be read.
