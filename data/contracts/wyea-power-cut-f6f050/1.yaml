explicit_source_elements:
  - onsite diesel generators
  - likely there as an emergency backup
  - rather than something that would be used while conventional power sources are obtained
  - running a hyperscale — or, gigascale — data center with diesel would be insanely expensive
  - a step too far for them
evaluator_interpretation:
  - Read as a forecast that the Abilene Stargate site would not run on diesel generators as its main power source, including during the gap before conventional power arrived.
  - No deadline was given. The claim can be settled early once the site is running and its actual power supply is publicly described.
support_condition: Once the Abilene site is running, credible reports describe its power as coming mainly from the grid and/or on-site natural gas, with diesel used only as backup or not at all.
contradiction_condition: Credible reports show the Abilene site ran its compute mainly on diesel generators for any real stretch of operation.
measurement_requirements: A description of the operating site's actual power sources, from the developer or an independent tracker.
source_requirements: Developer or partner announcements (Crusoe, Lancium, Oracle, OpenAI), permit records, or independent analyses such as Epoch AI.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled once the Abilene site is operating and a credible source describes its actual power supply. Grid and/or gas as the main supply supports the claim. Diesel as the main supply contradicts it.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The claim is partly a guess about why the diesel permit existed, and partly a forecast about how the site would be powered.
