assessment_axis: historical_observation
explicit_source_elements:
  - “I have no equity in OpenAI” was only half the truth
  - holds no direct equity in OpenAI
  - he does have an indirect stake in OpenAI
  - that fact should have been disclosed
evaluator_interpretation:
  - The factual test concerns Altman's ownership when he testified on May 16, 2023, because that exchange supplies the context for the alleged omission.
  - The ordinary reading of 'indirect stake' includes an economic interest through an investment fund holding OpenAI equity.
  - "'Only half the truth' means that the answer omitted an indirect economic interest; it does not mean that exactly half of a numerical statement was false."
  - "'Should have been disclosed' is treated as Marcus's judgment about completeness. This assessment does not determine a legal disclosure duty, intent to deceive, or perjury."
  - This is a qualitative claim about an individual's ownership. No company financial amount or valuation is being assessed, so metric_scope is null.
support_condition: The hearing record shows the unqualified no-equity answer without mention of an indirect holding, and reliable evidence establishes that Altman then had an economic interest through a fund invested in OpenAI.
contradiction_condition: Reliable ownership evidence establishes that Altman had no indirect economic interest at the hearing, or the cited exchange actually disclosed that interest.
measurement_requirements: Distinguish direct equity from indirect economic exposure, and establish the holding at the hearing rather than only at a later date.
source_requirements: The hearing record and company disclosures or ownership records; reputable retrospective reporting may corroborate historical ownership where underlying records are unavailable.
