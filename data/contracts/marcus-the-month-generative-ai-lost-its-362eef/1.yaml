evaluator_interpretation:
  - The ordinary reading is share-price performance over the month preceding June 26, 2026, rather than company revenue or valuation changes.
  - Use May 26 to June 26 closing prices as a reproducible comparison, while allowing that Marcus may have used an intraday or chart-provider snapshot.
  - Use the main US listings for Nvidia, Oracle, CoreWeave, Microsoft and Cerebras, and SoftBank Group's Tokyo listing in yen.
  - Over 8% is a lower bound. About and whole-number figures allow ordinary rounding; a bit over 4% does not encompass a decline near 9%.
  - The sentence structure suggests a monthly SoftBank comparison, but its standalone wording also permits a daily reading.
  - Market-price returns are not company accounting metrics; metric_scope is null.
support_condition: Comparable price records reproduce all six stated declines within their expressed precision and reasonable snapshot variation.
contradiction_condition: Comparable records materially disagree with the stated magnitudes. If some components hold and others fail under the stated comparison, the compound claim is mixed.
measurement_requirements: Calculate price return as 100 × (ending price / starting price − 1), using consistent listing, currency and split treatment. Keep dividends and exchange-rate changes separate.
source_requirements: Established historical market-data records with identifiable dates and price columns.
