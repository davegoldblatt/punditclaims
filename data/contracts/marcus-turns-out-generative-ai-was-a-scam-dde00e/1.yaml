explicit_source_elements:
  - The Remote Labor Index
  - only do 2.5% of human tasks
  - a massive overestimate
  - everything that requires physical labor was excluded
evaluator_interpretation:
  - Assess the original study Marcus references, rather than later leaderboard updates.
  - The referenced report was released in October 2025; that is the target period.
  - Read 2.5% as the highest measured autonomous completion rate, not the proportion of tasks on which AI could provide assistance.
  - Read the final clause as claiming that including physical work would substantially reduce the estimated share of all human tasks AI could complete. No numerical meaning of 'massive' is supplied.
support_condition: The original study reports approximately 2.5% maximum completion and excludes physical work, and representative evidence establishes that its result substantially overstates completion across human tasks overall.
contradiction_condition: The original study reports a materially different maximum or includes physical work, or representative evidence shows that the claimed downward adjustment for all human tasks is wrong.
measurement_requirements: Distinguish complete projects from constituent tasks, autonomous completion from assistance, and sampled remote freelance work from all human work. A population-wide inference requires task weights and comparable completion measurements.
source_requirements: Original benchmark results and selection criteria; representative labor-task evidence for the extrapolation.
