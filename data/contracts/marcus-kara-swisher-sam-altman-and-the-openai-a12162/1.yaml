assessment_axis: causal_assessment
explicit_source_elements:
  - Small wonder
  - a lot of the safety team left
  - over the last couple months
evaluator_interpretation:
  - Read 'a lot' as several safety-related employees, including significant team members, rather than a specified percentage.
  - Read the approximate period as March through May 29, 2024.
  - The surrounding passage implies that problems with candor, trust, and safety oversight contributed to these departures. It does not say that every departure had the same cause.
  - Distinguish leaving the company from moving between internal teams, and distinguish resignations from dismissals.
support_condition: Records establish several relevant departures during the period, and credible departing-employee accounts or contemporaneous records connect multiple departures to the described trust or oversight problems.
contradiction_condition: Records show that the claimed departures did not occur at meaningful scale, or credible accounts establish that the suggested explanation did not contribute to the departures in question.
measurement_requirements: Identify departing employees, their safety-related roles, departure dates, and their stated reasons. Do not infer motives from departure alone.
source_requirements: Prefer resignation statements and firsthand explanations; use reputable reporting for the broader departure record.
