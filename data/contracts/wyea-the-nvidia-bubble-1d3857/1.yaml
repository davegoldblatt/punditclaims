explicit_source_elements:
  - media ecosystem
  - market
  - credited AI
  - basically any related revenue growth
  - anybody who bought NVIDIA GPUs
evaluator_interpretation:
  - The plain reading alleges a pervasive pattern of attributing relevant growth at NVIDIA GPU buyers to AI, with few meaningful distinctions between AI and other causes.
  - Basically allows exceptions. A single counterexample cannot disprove the asserted broad pattern.
  - Use 2023 through 2025, the years covered by the surrounding retrospective examples, including the reference to fiscal 2025 results.
  - Captured and brainless are evaluative descriptions. This assessment tests the stated attribution pattern, not those descriptions independently.
  - This is a claim about reporting and market interpretation, not a numerical claim about any company's revenue.
support_condition: A representative set of contemporaneous coverage and investor commentary shows that AI routinely received credit for essentially all relevant revenue growth across NVIDIA GPU buyers.
contradiction_condition: Representative coverage and market commentary regularly distinguish AI-driven growth from other sources, showing that the alleged near-universal attribution was not the prevailing pattern.
measurement_requirements: Define a defensible sample of GPU buyers, earnings events, outlets and investor commentary. Separate reporters' assertions from attributed management statements, and price movements from evidence of investors' reasons.
source_requirements: Contemporaneous articles, analyst commentary and direct investor evidence. Original reporting is primary evidence of what the media said; company accounts alone cannot establish that pattern.
