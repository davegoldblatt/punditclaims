explicit_source_elements:
  - GPU smuggling stories have been around for years
  - left totally-unmentioned in any coverage
  - NVIDIA’s parabolic growth
  - a not-insignificant part of that growth
  - illegal sales to China
evaluator_interpretation:
  - The ordinary financial reading is NVIDIA's multiyear revenue growth, rather than one quarter's year-over-year increase.
  - The target includes the multiyear growth coverage discussed through publication. Its starting date is unspecified; earlier relevant earnings coverage is not excluded.
  - "'Not-insignificant' means a meaningful contribution, without an invented percentage threshold."
  - "'Totally-unmentioned in any coverage' is a blanket omission assertion. The later Times examples do not restrict it to that newspaper."
  - The combined assertion can be contradicted by a clear counterexample to the blanket omission, without concluding that the financial contribution was negligible.
support_condition: Evidence establishes a meaningful contribution of illegal China sales to multiyear NVIDIA revenue growth and supports the claimed absence from relevant growth coverage.
contradiction_condition: A dated example of relevant growth or earnings coverage explicitly mentioning chip smuggling contradicts the blanket omission. Independently, a sufficiently complete revenue analysis showing only a negligible contribution would contradict the financial clause.
measurement_requirements: Measure illegal-sale contributions against comparable multiyear NVIDIA revenue growth, excluding lawful Chinese sales and unrelated server revenue. Test media omission against actual article text.
source_requirements: Use transaction evidence and comparable financial records for the financial clause; use original published coverage for the omission clause.
