assessment_axis: forecast_outcome
explicit_source_elements:
  - If and when the whole generative AI edifice comes crashing down
  - in no small part
  - investors read too many graphs
  - assuming that things had been going up for a while would continue to go up at the same pace, indefinitely
evaluator_interpretation:
  - This forecasts a cause conditional on an industry-wide collapse; it does not unconditionally predict that a collapse will happen.
  - The ordinary reading of collapse requires broad failure of the generative-AI business and investment structure. Individual product closures or a stock-market correction are insufficient.
  - In no small part means a substantial causal contribution, rather than the sole cause.
  - A causal assessment would require evidence connecting investors' extrapolations to consequential investment decisions and the subsequent collapse.
support_condition: An industry-wide collapse occurs, and financial records, contemporaneous investor assumptions and credible subsequent investigations establish naive extrapolation of scaling or usage trends as a substantial cause.
contradiction_condition: An industry-wide collapse occurs, and sufficiently comprehensive causal evidence shows that such extrapolation made no substantial contribution.
measurement_requirements: Document the breadth and persistence of the collapse, then distinguish investor expectations, resulting decisions and causal contribution from coincident losses or falling share prices.
source_requirements: Primary financial records, contemporaneous investment documents and credible investigations. Commentary about bubble risk alone cannot establish either the antecedent or causation.
