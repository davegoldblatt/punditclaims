original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a documented industry-wide collapse and sufficiently comprehensive evidence establishing or excluding a substantial causal role for investor extrapolation.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Industry-wide collapse has no numerical threshold or defined coverage.
  - No deadline is stated.
  - In no small part has no specified causal share.
  - Naively and indefinitely describe investor beliefs that require documentary evidence.
