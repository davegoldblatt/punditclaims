ambiguity_flags:
  - "'AI' could refer to commercial growth, adoption, productivity or technical progress."
  - Commercial revenue is the evaluator's contextual reading.
  - No growth interval, industry boundary or accounting basis is specified.
  - Latest complete calendar month is an evaluator-selected observation period.
  - "'Signs' does not specify how strong or representative the indicators must be."
