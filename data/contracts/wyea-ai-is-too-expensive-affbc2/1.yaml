explicit_source_elements:
  - around $7.5 billion from OpenAI’s inference spend
  - $761 million from its revenue share
  - Fiscal Year 2025
  - either spent or allocated
  - around $88.2 billion in capital expenditures
evaluator_interpretation:
  - Microsoft FY2025 means July 1, 2024 through June 30, 2025.
  - The claim contains three separate amounts. Support requires verification of all three; corroborating capex alone does not establish the whole claim.
  - The revenue amounts are reporting-based estimates. The capex wording permits Microsoft's measure including finance leases, rather than cash purchases alone.
  - The wording does not establish whether revenue sharing is gross or net of reciprocal payments. I do not assume either.
  - The single metric_scope records the compound claim; it does not make its three measures interchangeable.
support_condition: Independent records establish approximately $7.5 billion of inference receipts, $761 million of revenue-sharing receipts, and $88.2 billion of capital expenditures on the stated FY2025 bases.
contradiction_condition: Comparable independent records materially contradict at least one amount after reconciling fiscal dates, inference versus other compute, reciprocal revenue sharing, and finance leases.
measurement_requirements: Separate inference revenue, revenue-sharing receipts, and capital expenditure. Reconcile cash versus recognized revenue and gross versus net revenue sharing. Do not substitute calendar-year figures.
source_requirements: Microsoft or OpenAI records, or independent reporting that verifies the underlying documents. Repetition of Zitron's reporting is not independent confirmation.
