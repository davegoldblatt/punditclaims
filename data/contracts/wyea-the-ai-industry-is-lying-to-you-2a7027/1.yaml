evaluator_interpretation:
  - The ordinary reading concerns cumulative realized revenue and incurred salary-plus-compute costs, not annualized revenue, financing or future commitments.
  - "I provisionally use the four most recent completed calendar years before the post: 2022 through 2025. The speaker does not identify the four years."
  - I read $5 billion as a rounded cumulative figure; 'literally' does not supply an accounting precision.
  - The company is identified as the source of annualized figures, but the post does not establish the accounting basis of the two reconstructed historical totals. The combined metric's basis remains unknown.
  - The schema has one metric_scope, so it records both components of this compound claim.
support_condition: Comparable records for the same four years establish approximately $5 billion in realized revenue and at least $25 billion in incurred salaries and compute costs.
contradiction_condition: Comparable records for the same four years establish a materially different revenue total or salary-plus-compute costs below $25 billion.
measurement_requirements: Identify the four years and accounting basis; sum realized revenue separately from salaries and compute. Reconcile personnel expenses with salaries and infrastructure expenses with compute. Exclude financing proceeds, valuation changes and unperformed future commitments.
source_requirements: Historical company accounts or documented financial reporting covering all four years, with identifiable cost categories.
