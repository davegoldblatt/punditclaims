evaluator_interpretation:
  - "'It' refers to the AI harms in the preceding paragraph, including nonconsensual deepfake imagery."
  - The ordinary broad reading of 'anything' includes a concrete federal action addressing one of those harms, even without Marcus's preferred independent-review regime.
  - Assess willingness through public statements and actions, not inferred private motives.
  - Because the statement concerns the current administration's policy record, use its term through publication as the latest reportable period. There is no regular reporting interval.
  - The parenthetical about industry ties is contextual; it is not treated as proof that those ties caused the policy stance.
support_condition: The administration's public record shows refusal to address the specified AI harms, without concrete counterexamples within the defined period.
contradiction_condition: The administration takes or affirmatively supports a concrete measure addressing one of the specified AI harms. This contradicts the broad 'anything' claim, while leaving the adequacy of its overall response open.
measurement_requirements: Distinguish enacted or implemented measures from promises, general industry support and opposition to a particular regulatory model.
source_requirements: Official records of executive or legislative action, supplemented by reliable reporting on current statements and relationships.
