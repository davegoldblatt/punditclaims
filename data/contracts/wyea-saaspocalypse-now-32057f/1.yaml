assessment_axis: historical_observation
explicit_source_elements:
  - These "agents"
  - branded to sound like intelligent lifeforms
  - can make intelligent decisions
  - really just trumped-up automations
  - require enterprise customers to invest time programming them
evaluator_interpretation:
  - Intelligent lifeforms is rhetorical language. The checkable core concerns advertised decision-making and the customer work required to make the agents function.
  - The plain reading of programming includes specifying instructions, actions, and workflows through code or visual and natural-language tools.
  - Optional customization does not prove that programming is required for ordinary use.
  - Customer setup does not by itself show that all runtime decisions are predetermined.
  - For this ongoing observation, I use the September 2024 announcement cycle through publication.
support_condition: Contemporaneous deployment evidence shows that ordinary use required customers to construct the decision workflows, and that the agents followed those workflows without the advertised ability to select task steps dynamically.
contradiction_condition: An in-scope agent demonstrably selected and completed task steps without customer-authored decision workflows, or ordinary deployment did not require the programming asserted.
measurement_requirements: Separate mandatory setup, optional customization, and task-by-task programming. Examine runtime decisions as well as deployment instructions.
source_requirements: Versioned setup documentation and deployment demonstrations, including default behavior before customization.
