assessment_axis: historical_observation
explicit_source_elements:
  - generative AI is deeply unprofitable to run
evaluator_interpretation:
  - The ordinary reading is that supplying generative AI services generally produced substantial operating losses relative to revenue. This is broader than a claim about OpenAI alone.
  - Use July–September 2024, the latest completed quarter before the post, for the ongoing observation. Full-year forecasts are context, not realized quarterly outcomes.
  - The surrounding discussion relies on press estimates, so estimate is the applicable accounting basis.
  - Company-wide losses and the margin on serving an additional customer are different measures. Neither automatically establishes the other.
support_condition: Comparable results for a representative set of leading generative AI service providers show substantial operating losses relative to revenue during the target period.
contradiction_condition: Comparable results show that providing generative AI services was generally profitable or approximately breaking even during the target period.
measurement_requirements: Revenue and operating costs for generative AI services, with inference, training, free usage and other operating expenses distinguished. Evidence must cover more than one company's total losses.
source_requirements: Prefer financial disclosures and documented cost studies. Press estimates must identify their period and cost coverage.
