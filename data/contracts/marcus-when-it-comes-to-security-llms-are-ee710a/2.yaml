ambiguity_flags:
  - Companies like could emphasize a general industry trend; this assessment also checks the three named examples.
  - Now supplies an as-of date but no reporting interval; the post date is used.
  - Stuffing into robots does not specify development stage, model location or degree of autonomy.
  - No integrated model versions or jailbreak tests are named.
