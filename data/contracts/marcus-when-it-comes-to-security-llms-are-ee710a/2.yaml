assessment_axis: historical_observation
explicit_source_elements:
  - companies like Google, Tesla, and Figure.AI
  - are now stuffing
  - jailbreak-vulnerable LLMs
  - into robots
evaluator_interpretation:
  - The ordinary reading is that the named companies were integrating language models susceptible to bypassing safety instructions into robots when the post appeared.
  - Each named example is checked. Research prototypes and integrations under development count; commercial deployment and fully autonomous operation are not required.
  - LLMs includes multimodal language models used for robot conversation, reasoning or planning. Integration can use a remote model rather than onboard computation.
  - The vulnerability assertion concerns the integrated language models. It does not require proof that these companies' robots had already caused physical harm.
  - Now refers to the state on October 17, 2024. Robotics integrations have no standard reporting period, so the target is that date, including October developments. Earlier demonstrations are retained as context rather than assigned an invented October event date.
  - A jailbreak in an unrelated model or robot does not establish vulnerability in a named company's integrated model.
support_condition: Evidence establishes that Google, Tesla and Figure.AI were each integrating an identifiable language model into robots as of October 17, 2024, together with security findings applicable to those model versions showing that adversarial prompts could bypass their safety instructions.
contradiction_condition: Affirmative evidence establishes that a named company was not integrating language models into robots at that time, or that the alleged vulnerability did not apply to its integrated model. Missing disclosures, unsuccessful individual attacks and human assistance alone do not establish contradiction.
measurement_requirements: Identify the company, robot, integration status and language model or version. Match jailbreak findings to that model, explaining any uncertainty about customization or version differences.
source_requirements: Prefer dated company documentation, demonstrations and original security research. Later publications are admissible only when they establish the October 17, 2024 state. All evidence must have been available by October 28, 2026.
