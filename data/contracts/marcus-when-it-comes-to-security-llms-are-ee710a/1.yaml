assessment_axis: historical_observation
explicit_source_elements:
  - companies like Google, Tesla, and Figure.AI
  - are now stuffing
  - jailbreak-vulnerable LLMs
  - into robots
evaluator_interpretation:
  - The three named companies are factual examples and each requires verification.
  - Integration includes an LLM accessed remotely as part of a robot system; physical installation of model weights inside the robot is unnecessary.
  - Research prototypes count because the wording does not require commercial deployment.
  - Evidence must connect the integrated model to jailbreak vulnerability. Tests of unrelated robots cannot establish that connection.
  - For this ongoing observation without a reporting period, use the latest completed calendar quarter before the post, July through September 2024. October events are contextual updates.
support_condition: Records establish that all three named companies were integrating LLMs into robots in the target period, with relevant evidence that the integrated models were susceptible to jailbreaks.
contradiction_condition: Affirmative records establish that a named company's supposed LLM integration did not exist, used a materially different technology, or was misidentified. Missing documentation alone is not contradiction.
measurement_requirements: Identify each robot, integrated model, integration date, and relevant security test. Distinguish language models from other neural networks and human teleoperation.
source_requirements: Dated company documentation or original technical papers, plus model-specific or system-specific security evidence.
