assessment_axis: historical_observation
explicit_source_elements:
  - constantly spew misinformation
  - even about themselves
  - cannot be trusted
  - answering questions about real-world events and phenomena
  - sound advice about mental health or marriage counseling
evaluator_interpretation:
  - The claim concerns general-purpose conversational language models available when the post appeared, not later systems or purpose-built clinical tools.
  - The ordinary reading is that material falsehoods recur and answers require independent checking, especially for consequential advice. It does not mean every answer is false.
  - Because the ongoing observation names no reporting period, I use January–March 2023, the latest completed calendar quarter before publication.
  - The full claim includes factual reliability, mental-health advice, and marriage counseling. Evidence for one component does not automatically establish the others.
support_condition: Period-matched evaluations show recurring material factual errors in ordinary question answering, together with expert assessments showing that mental-health and marriage advice cannot reliably be followed without independent checks.
contradiction_condition: Broad, representative evaluations of the same systems show dependable factual answers and sound advice in the named settings, with errors sufficiently rare and well signaled to undermine the claim of recurring unreliability. Selected correct answers alone would not suffice.
measurement_requirements: Identify model versions and testing dates. Distinguish ordinary questions from prompts requesting false content. Assess factual correctness separately from fluency, empathy, perceived helpfulness, and clinical safety.
source_requirements: Primary evaluations with disclosed methods, company technical reports, and expert assessments of contemporaneous outputs. Later publications qualify only when their observations concern the target period.
