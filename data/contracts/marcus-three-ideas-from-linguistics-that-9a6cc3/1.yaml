evaluator_interpretation:
  - "Use the functional definition supplied by the surrounding discussion: maintain and update representations of entities, events or relationships, and use them for inference or choices."
  - The ordinary reading does not require proof of subjective feelings or a complete reproduction of human cognition.
  - The stated target is AI systems generally, although the post's main subject is large language models.
  - The target is the stock of capabilities available as of 22 June 2022. No beginning or reporting interval is supplied; earlier existing systems count, while later-created systems do not.
support_condition: Evidence establishes that relevant existing systems lack functional, persistent situation representations used for inference or decisions; failure to match all human abilities alone is insufficient.
contradiction_condition: An existing AI system demonstrably maintains and updates a representation of a story or environment and uses that representation for inference or action.
measurement_requirements: Show the represented state, how new information updates it, and how it contributes to answers or decisions. Distinguish limited functional models from human-level comprehension.
source_requirements: Primary architectural descriptions and evaluations of systems existing before the post.
