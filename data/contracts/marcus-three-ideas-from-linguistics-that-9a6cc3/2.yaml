evaluator_interpretation:
  - "Read 'any of that' in its narrative and cognitive context: shared meaning, intentions, inference, emotional response, and internal models that inform choices."
  - Preserve 'really'; do not substitute the narrower claim that no AI system can track any entities or states.
  - The passage does not specify which combination of these capacities, or what depth of performance, would count as genuinely participating in the described human processes.
  - Neither a toy state tracker nor the lack of human emotional experience supplies a fair test of the entire statement.
support_condition: No unique support condition follows from the passage without adding a threshold for the human cognitive capacities grouped under 'any of that'.
contradiction_condition: No unique contradiction condition follows from the passage. A bounded narrative or state-tracking demonstration is insufficient by itself.
measurement_requirements: Specify the relevant cognitive functions, the required breadth and reliability, and whether observable narrative understanding is sufficient.
source_requirements: Any narrower assessment should use descriptions and evaluations of systems available by 2022-06-22.
