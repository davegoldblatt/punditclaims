assessment_axis: historical_observation
explicit_source_elements:
  - even half
  - three million Blackwell GPUs
  - got shipped
  - actually been installed
evaluator_interpretation:
  - "Treat 'refuse to believe' as a substantive numerical assertion: fewer than 1.5 million of the referenced three-million shipment cohort were installed."
  - Installed means physically integrated into customer computing systems, without requiring full utilization or profitability.
  - Count complete GPU packages, not their constituent dies, and match the installed population to the referenced shipment cohort.
  - The wording names no reporting period. Use Q1 2026, the latest completed calendar quarter before publication, as the reporting window for the ongoing observation. Evidence about later installations is context only.
support_condition: A reliable cohort-matched inventory or upper bound establishes fewer than 1.5 million installations in the target reporting period.
contradiction_condition: A reliable cohort-matched inventory or lower bound establishes at least 1.5 million installations in the target reporting period.
measurement_requirements: Global installed GPU-package counts, shipment-cohort reconciliation, installation dates and safeguards against double counting customer and supplier disclosures.
source_requirements: Customer inventories, commissioning records or an independently documented deployment census. Shipment estimates, announced orders and assumed installation lags are insufficient alone.
