ambiguity_flags:
  - Q1 2026 is an evaluator-selected reporting window because the speaker names no period.
  - The three-million shipment cohort has no explicit cutoff date.
  - GPU dies and complete packages may be counted differently.
  - Physical installation and commissioned operation are distinct.
