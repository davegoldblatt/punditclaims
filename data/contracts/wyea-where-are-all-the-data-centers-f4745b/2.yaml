ambiguity_flags:
  - "'Installed' is not defined. It could mean racked, powered, or serving workloads. The plain reading used here is physically racked in a data center."
  - The reference set is 'the three million that got shipped' (through October 2025). Later shipments are not part of the claim.
  - He gave no date, so the claim is read as of publication, 2026-05-12.
