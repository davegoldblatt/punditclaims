assessment_axis: historical_observation
explicit_source_elements:
  - '"even half of the three million Blackwell GPUs that got shipped"'
  - '"have actually been installed"'
  - present tense, as of the post date (2026-05-12)
  - "threshold: half of three million, i.e. 1.5 million"
evaluator_interpretation:
  - The 'three million' is the package count behind Jensen Huang's October 2025 'six million Blackwell GPUs' figure, which counted two dies per package. The post itself says so.
  - "'Installed' means physically racked and placed in a data center. Plain reading: not sitting in a warehouse, at a supplier, or in transit. It does not require the GPU to be in a large cluster or fully commissioned."
  - Installation adds up over time. A credible count of 1.5 million or more of these GPUs installed at any date from late October 2025 to the post date contradicts the claim. A credible count below 1.5 million at or near the post date supports it.
  - "This is a claim about a stock at a point in time: cumulative installations as of publication. The target period runs from the date the 'three million shipped' figure was given (2025-10-28) to the post date. No quarter-end cutoff is imposed."
support_condition: A credible count or estimate, ideally independent and based on measurement, showing that fewer than about 1.5 million of the roughly 3 million Blackwell packages shipped through October 2025 had been installed in data centers by 2026-05-12.
contradiction_condition: A credible count or estimate showing that 1.5 million or more of those Blackwell packages had been installed in data centers at any point between 2025-10-28 and 2026-05-12.
measurement_requirements: Physical installation counts of Blackwell GPU packages (B200/B300/GB200/GB300), not dies. Compare against 1.5 million.
source_requirements: Prefer company disclosures of installed or deployed unit counts, or independent measurements and censuses. Analyst models that assume deployment lags are weaker evidence and need corroboration.
