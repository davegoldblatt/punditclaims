explicit_source_elements:
  - everybody who invests in these things ultimately loses
  - embarrassment and terrible earnings
  - genuine destruction
  - more and more money
  - making the eventual collapse all the more gruesome
evaluator_interpretation:
  - The speaker expressly includes embarrassment within losing. It would change the claim to substitute a universal negative financial return.
  - The statement combines reputational harm, earnings deterioration, investor destruction, continued spending and a causal claim about collapse severity.
  - No single ordinary measurement preserves all those meanings. A narrower financial forecast would require choosing investor groups, return measures and a comparison the speaker did not supply.
  - The conversational phrase I think is not itself the reason for declining adjudication.
support_condition: No fair binary support condition can be specified for the complete wording without adding a definition of losing and a measurable comparison for collapse severity.
contradiction_condition: "No fair binary contradiction condition can be specified: a profitable investor could still suffer embarrassment under the stated definition, while temporary losses do not establish ultimate destruction."
measurement_requirements: Would require a defined investor population, a common outcome measure, a completion point and a counterfactual for the effect of additional spending.
source_requirements: After clarification, investment cash flows and recoveries, company earnings records, and evidence identifying the causal effect of additional capacity spending.
