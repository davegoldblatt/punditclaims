assessment_axis: forecast_outcome
explicit_source_elements:
  - will leave the rest of the world rushing towards
  - “sovereign AI”
  - European or Canadian companies
  - and even Chinese AI
  - rather than deal with the uncertainty in the US
evaluator_interpretation:
  - The plain reading is a broad international shift in AI procurement or adoption caused by the June White House decision and the shutdown uncertainty it created.
  - The claim requires movement toward sovereign and Chinese alternatives. Expressions of concern, investment proposals and isolated purchases do not establish the whole prediction.
  - The rest of the world describes the forecast's scope, not a conditional antecedent.
  - No deadline or numerical threshold is supplied.
support_condition: Dated procurement or adoption evidence shows a broad international shift toward sovereign and Chinese AI after the decision, with credible buyer statements or analysis linking that shift to US shutdown uncertainty.
contradiction_condition: Evidence covering the claimed international shift establishes that it did not occur or that its attributed cause was wrong. A short period without a shift cannot contradict this forecast without a deadline.
measurement_requirements: Comparable procurement or usage evidence before and after the decision across multiple countries, together with evidence of buyers' reasons. Distinguish actual adoption from investment announcements and existing sovereignty policies.
source_requirements: Prefer procurement records, government disclosures, customer announcements and independent adoption measurements. Policy speeches can establish concern but cannot alone establish adoption.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated body of cross-country procurement or adoption evidence establishes the broad shift toward both sovereign and Chinese alternatives and credibly attributes it to the identified shutdown risk.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No size or speed threshold for rushing.
  - The rest of the world has no defined geographic coverage.
  - Rushing towards could mean policy interest, investment or actual adoption; this assessment uses procurement or adoption.
  - Sovereign AI can describe domestic models or domestic control of infrastructure.
retrospective_or_prospective: retrospective
