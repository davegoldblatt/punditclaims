assessment_axis: forecast_outcome
explicit_source_elements:
  - humans scientists are still choosing the research goals
  - That is not going to magically change next year
  - conceive of and execute Nobel-caliber work on their own
evaluator_interpretation:
  - Next year means calendar year 2026, ending December 31.
  - The assessed proposition concerns AI taking over the choice of scientific research goals from human scientists. The river-crossing remark is supporting rhetoric, not a condition.
  - The ordinary contextual reading concerns substantive research direction, rather than merely generating hypotheses or selecting experiments within an assigned objective.
  - Repeated, documented independent goal selection would establish the change. Marcus supplies no numerical threshold or adoption requirement; these criteria do not require replacement of all scientists or an actual Nobel Prize.
support_condition: Evidence covering 2026 shows that leading AI-for-science systems continue to depend on human scientists to choose substantive research objectives, despite automating hypotheses, experiments, or other research steps.
contradiction_condition: Documented research records show AI repeatedly choosing and pursuing substantive scientific objectives in place of human scientists, with enough detail to distinguish independent research direction from work within a human-assigned objective.
measurement_requirements: Inspect initial instructions, topic-selection procedures, human interventions, research logs, and resulting work. Distinguish selecting research objectives from selecting methods or subsidiary questions.
source_requirements: Use dated primary research records and demonstrations available by the evaluation date, preferably with independent scrutiny. Capability claims without documented workflows are insufficient.
metric_scope: null
original_horizon: next year
horizon_interval:
  start: 2025-03-09
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as contradicted only if a dated demonstration establishes repeated independent selection and pursuit of substantive research goals during 2026 under the contradiction condition. Continued human involvement before year-end cannot establish early support.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Research goals could mean broad scientific objectives or narrower project topics.
  - The source specifies neither a frequency threshold nor how widely independent goal selection must occur.
  - The surrounding discussion concerns Nobel-caliber autonomous science, but the immediate sentence concerns choosing research goals.
