evaluator_interpretation:
  - "The seven predictions are those in Marcus's March 2024 list for 'by end of 2024': 7-10 GPT-4 level models; no massive advance (no GPT-5, or disappointing GPT-5); price wars; very little moat for anyone; no robust solution to hallucinations; modest lasting corporate adoption; modest profits, split 7-10 ways."
  - The claim is checked as of the post date, December 11, 2024.
  - "Plain reading of 'modest profits, split 7-10 ways': the leading model makers would earn some, but modest, profits. Large losses do not literally match this, though they fit his wider point that the economics were problematic."
  - The contract carries no single money metric because the claim bundles seven mostly non-financial predictions. The profit item is checked against reported OpenAI results.
support_condition: Evidence that each of the seven predictions matched the state of the field by December 11, 2024.
contradiction_condition: Credible evidence that one or more of the seven did not hold, for example no profits for the leading developer, or a clearly massive advance.
measurement_requirements: "Evidence on each prediction: model count, frontier advances, pricing, moats, hallucination rates, corporate adoption, and profits."
source_requirements: Company announcements, benchmarks, financial reporting, and major news reporting.
