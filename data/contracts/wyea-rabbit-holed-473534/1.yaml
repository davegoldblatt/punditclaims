explicit_source_elements:
  - the CEO of GAMA was and is Jesse Lyu
  - the co-founder of Rabbit
  - the company that makes the purportedly AI-powered R1 device
  - Cyber Manufacture Co. is the same company as Rabbit Inc.
evaluator_interpretation:
  - "GAMA was a project of Cyber Manufacture Co., not a separate company. So 'CEO of GAMA ... is' is read as: Lyu headed the company that ran GAMA, and he still heads that same company, now named Rabbit Inc."
  - "'Co-founder' is satisfied if reliable sources name Lyu as a founder of Rabbit, whether alone or with others."
  - "'Same company' means one corporate entity that was renamed, not merely a shared team."
support_condition: Reliable sources show that Cyber Manufacture Co. was renamed Rabbit Inc., that Lyu led Cyber Manufacture (GAMA's parent company), that Lyu founded or co-founded Rabbit, and that Rabbit makes the R1.
contradiction_condition: Reliable sources show that Rabbit Inc. and Cyber Manufacture Co. are separate legal entities, or that someone other than Lyu led GAMA's company, or that Lyu did not found Rabbit.
