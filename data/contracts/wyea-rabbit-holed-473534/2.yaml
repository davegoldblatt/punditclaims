assessment_axis: historical_observation
explicit_source_elements:
  - the CEO of GAMA was and is Jesse Lyu
  - the co-founder of Rabbit
  - the company that makes the purportedly AI-powered R1 device
  - Cyber Manufacture Co. is the same company as Rabbit Inc.
evaluator_interpretation:
  - The claim requires both a past GAMA CEO role and continued service as GAMA's CEO on May 6, 2024. Leading the company that previously operated GAMA does not by itself establish continued leadership of GAMA.
  - The historical portion has no specified starting date. The present-tense portion concerns the latest publicly reportable leadership and corporate identity as of publication, rather than a quarterly reporting period.
  - Same company means continuity of the legal entity through a name change, rather than merely shared founders, staff or investors.
  - Purportedly AI-powered describes how the R1 was presented. It is not a conditional antecedent or a claim that its advertised capabilities worked.
  - Support requires evidence for every material component. Confirmation of some components with an unresolved remainder does not establish the whole claim.
support_condition: Records establish that Jesse Lyu previously served as GAMA's CEO and still held that role on May 6, 2024; that he co-founded Rabbit, which made and marketed the R1 as an AI device; and that Cyber Manufacture Co. and Rabbit Inc. were the same legal entity.
contradiction_condition: Reliable records establish that a material component is false, including that Lyu's GAMA CEO role had ended before May 6, 2024. A corporate pivot, inactivity or missing leadership records alone does not establish that his role ended.
measurement_requirements: Distinguish GAMA leadership from leadership of its corporate operator. Establish the timing of any appointment, departure or project closure. Match the corporate names through entity identifiers or name-change records.
source_requirements: Prefer corporate filings, contemporaneous GAMA leadership statements and Rabbit announcements. Reporting of company responses may provide counterevidence, but an unsupported retrospective denial is not conclusive. Do not use Zitron's own reporting as corroboration.
