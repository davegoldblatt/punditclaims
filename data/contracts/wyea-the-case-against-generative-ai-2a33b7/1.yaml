  end: 2026-10-28
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Profit lever' is a metaphor. It is read here as reaching operating profit through scale."
  - "'AI' could mean model developers, AI software resellers like Replit and Cursor, or both."
  - "'Raw costs ... only increasing' could mean absolute spending (which did rise) or cost per unit of revenue (which fell for Anthropic)."
  - The claim describes structural economics with no named period. The test window is from the post date to the evaluation date, because a lever can only be shown by later results.
