assessment_axis: causal_assessment
explicit_source_elements:
  - AI does not have a 'profit lever'
  - raw costs of providing access to AI models are so high
  - they're only increasing
  - basic economics of how the tech industry sells software don't make sense
evaluator_interpretation:
  - "A 'profit lever' is the Silicon Valley pattern he describes: grow fast and burn money, then turn profitable as revenue outgrows costs."
  - "Plain reading: AI model and software businesses cannot reach operating profit as they scale, because serving costs stay too high relative to revenue."
  - A lever can only be tested by whether it later works. So the test window runs from the post date to the evaluation date.
  - The universal claim ('AI does not have') is contradicted if a leading AI model business reaches operating profit through scale, with revenue outgrowing costs.
  - Absolute compute spending rising does not by itself support the claim, if costs fall as a share of revenue.
support_condition: Leading AI businesses stay at operating losses as they scale, and serving costs stay at or above revenue, or keep rising as a share of it.
contradiction_condition: A leading AI model provider reaches GAAP operating profit because revenue growth outpaced cost growth, with compute costs falling as a share of revenue.
measurement_requirements: Company-reported operating income or loss, and compute cost as a share of revenue, over time.
source_requirements: Company filings or disclosures from major AI model or software businesses.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
