explicit_source_elements:
  - Trump himself hasn't entirely bolted — yet
  - changed course sharply
  - moving from full anti AI regulation
  - to strongly encouraging the voluntary preflight testing of frontier AI models
evaluator_interpretation:
  - "Plain reading: by the 2026-08-20 post, Trump and his administration had shifted from a hands-off, deregulatory stance on AI to actively promoting voluntary government testing of frontier models before release. Official acts count, such as an executive order setting up such a framework and White House meetings to roll it out with labs."
  - "'Full anti AI regulation' is read as a description of the earlier stance: minimal federal regulation and efforts to curb state rules. It is not read as a literal claim of zero safety measures."
  - "'Strongly encouraging' is read as active promotion through official presidential action. It does not require a mandate, which the claim itself says is voluntary."
  - "'Hasn't entirely bolted' is a hedge. The claim does not say Trump backed mandatory regulation."
support_condition: Records from before 2026-08-20 show that Trump issued or pushed a voluntary pre-release testing framework for frontier AI models, and that this was a clear change from his earlier hands-off approach.
contradiction_condition: Before 2026-08-20 there was no presidential action promoting voluntary pre-release testing, or such testing had been rejected or dropped, or the administration's stance was unchanged from its earlier hands-off approach.
