  - LLMs are unruly beasts
  - nobody knows how
  - refrain 100% of time
  - insulting users
  - giving bad advice
  - making stuff up
evaluator_interpretation:
  - The ordinary reading concerns useful, open-ended language systems and the publicly established methods available when the post appeared.
  - A system that remains silent or returns only fixed approved text is outside the conversational capability discussed in the post.
  - The claim concerns complete protection, not whether researchers could substantially reduce harmful or false outputs.
  - "For this ongoing research-state observation, I use the current year's public research record through the post: 2022-01-01 to 2022-11-22. This is an evaluator-selected reporting window, not a date range supplied by Marcus."
  - Support means the documented research state treated complete protection as unsolved; it does not require proving what every person privately knew.
support_condition: Contemporary accounts of leading protection methods document remaining harmful or fabricated outputs and treat reliable prevention as an open problem, with no established method providing all three protections universally.
contradiction_condition: A method known by the post date demonstrably guaranteed all three protections across the intended open-ended use of a useful LLM.
measurement_requirements: Distinguish lower measured failure rates from zero failures and universal guarantees. Finite successful tests alone do not establish 100% protection.
source_requirements: Contemporary research papers, model documentation, and technical disclosures describing methods and their limitations.
