explicit_source_elements:
  - Neural networks do effectively memorize
  - some of what they are trained on
  - a whole subfield now about the topic
evaluator_interpretation:
  - Effective memorization means retaining training-specific information that can be recovered in model outputs; it does not require literal storage of documents.
  - Some is an existence claim, not a claim that every network memorizes everything.
  - Subfield means an established research line with multiple studies, methods, and follow-up questions, not formal institutional recognition.
  - For this ongoing research claim, use the latest complete calendar year and current year-to-date, 2023 through the post date. Research has no standard quarterly reporting period; earlier studies supply historical context.
support_condition: Experiments demonstrate recovery of training text from neural models, and multiple research studies investigate memorization or extraction.
contradiction_condition: The purported recoveries do not demonstrate retained training information, or the alleged research line is unsupported by identifiable studies.
measurement_requirements: Compare generated passages with known training data, or clearly describe the verification limits when the training corpus is private.
source_requirements: Original research papers and their methods or results, with versions dated before the post preferred.
