assessment_axis: causal_assessment
explicit_source_elements:
  - isn’t a result of any actual return on investment
  - revenue or profitability
  - productivity gains
  - anything tangible or measurable
evaluator_interpretation:
  - Read 'AI bubble' as the AI investment boom discussed in the surrounding text, through July 15, 2026.
  - Read 'any' as denying that demonstrated business benefits contributed to that investment. This is stronger than saying that returns do not justify the total investment.
  - A productivity gain alone does not establish what caused investment. Evidence must also connect demonstrated benefits to investment decisions.
support_condition: Credible evidence establishes that demonstrated business benefits made no contribution to the investment boom.
contradiction_condition: Documented investment decisions identify demonstrated AI benefits as a reason for continued substantial investment.
measurement_requirements: Distinguish demonstrated benefits from expected future benefits, and contributions to investment from proof that all investment is justified.
source_requirements: Prefer contemporaneous investment disclosures and measured business results. Treat management explanations as company testimony, not independent causal identification.
