ambiguity_flags:
  - "'Bubble' could mean the broader investment boom or only its speculative excess."
  - The claim does not distinguish generative AI from other AI applications.
  - "'Return on investment' includes revenue and measurable benefits in his wording, rather than requiring positive net investment returns."
