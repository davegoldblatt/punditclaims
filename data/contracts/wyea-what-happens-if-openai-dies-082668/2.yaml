assessment_axis: forecast_outcome
explicit_source_elements:
  - will almost-certainly have to raise another round of funding
  - by March 2027
  - likely at a similar scale to its $122 billion round
  - IPO likely delayed — if it ever happens — until 2027
evaluator_interpretation:
  - The firm commitment is that OpenAI raises another funding round (closes or announces a completed round) by 2027-03-31.
  - "'Likely at a similar scale' and 'IPO likely delayed' are hedged ('likely'). They are reported as context and not scored as pass/fail tests, so a smaller round does not by itself refute the core forecast."
  - "Early resolution rule: if OpenAI announces a closed new funding round before the evaluation date, the core forecast is settled as supported."
support_condition: OpenAI closes or announces a completed new funding round between 2026-08-18 and 2027-03-31.
contradiction_condition: By 2027-03-31 OpenAI has raised no new round (for example, it funds itself through an IPO or operations instead).
measurement_requirements: Dated announcement or reputable report that a new OpenAI round closed, with its size.
source_requirements: OpenAI announcement or reputable news reports (CNBC, WSJ, FT, Bloomberg).
metric_scope:
  company: OpenAI
  metric: new funding round raised
  currency: USD
  units: billions of USD
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-08-18
  period_end: 2027-03-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: by March 2027
horizon_interval:
  start: 2026-08-18
  end: 2027-03-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A reputable dated report, on or before 2026-10-28, that OpenAI closed a new funding round would settle the core forecast early as supported.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Have to raise' could mean need versus actually raise; I test whether a round is raised."
  - The size ('likely at a similar scale') is hedged and not scored.
  - Whether a small 'bridge' round counts as 'another round of funding'; on the plain reading it does.
retrospective_or_prospective: prospective
