  end: 2026-06-30
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The country is unspecified; the United States is an evaluator interpretation.
  - The latest reportable completed quarter is used because no period is named.
  - Any payoff could mean a small positive contribution or a clearly visible aggregate improvement.
  - Does not appear describes the evidential picture rather than confidently asserting zero effect.
