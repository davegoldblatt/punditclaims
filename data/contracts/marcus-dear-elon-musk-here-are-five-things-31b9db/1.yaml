assessment_axis: forecast_outcome
explicit_source_elements:
  - In 2029
  - read a novel
  - reliably answer questions about plot, character, conflicts, motivations, etc.
  - going beyond the literal text
evaluator_interpretation:
  - The ordinary reading is dependable comprehension of whole novels, including reasonable inferences about motives, relationships and conflicts.
  - Going beyond the literal text defines the task. It is not an external antecedent whose occurrence must be established separately.
  - Test varied novels and questions with controls for memorized summaries. Reliability does not require agreement on every debatable literary interpretation.
  - Use 2029-12-31 as the latest deadline, allowing an earlier reproducible demonstration of the complete capability to refute the forecast.
  - Assess this individual forecast independently of the surrounding multi-challenge wager.
support_condition: Evidence covering the end of 2029 shows that leading available systems still fail to answer questions dependably about whole novels, including questions requiring inference about plot, characters, conflicts and motivations.
contradiction_condition: At least one AI system reliably answers questions across varied whole novels, including nonliteral questions, under a credible evaluation with human-validated answers.
measurement_requirements: Supply the novels themselves; include open-ended questions about explicit and inferred narrative content; disclose outputs and grading; accept text-supported alternative interpretations; control for prior familiarity and answer leakage.
source_requirements: Primary, dated evaluations with independent assessment and enough information to reproduce the finding. Selected answers and aggregate scores without task details are insufficient for early resolution.
metric_scope: null
original_horizon: In 2029
horizon_interval:
  start: 2022-05-31
  end: 2029-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as contradicted only when a dated, independently assessed and reproducible evaluation establishes reliable whole-novel comprehension, including nonliteral questions, across varied novels. Earlier failures cannot establish the negative forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Reliably' has no numerical threshold."
  - The breadth and difficulty of novels and questions are unspecified.
  - Literary questions can have multiple defensible answers.
  - Treating earlier durable capability as refuting 'In 2029' is an evaluator interpretation.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
