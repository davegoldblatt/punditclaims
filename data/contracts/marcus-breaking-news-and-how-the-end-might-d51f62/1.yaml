assessment_axis: historical_observation
explicit_source_elements:
  - right now
  - burning money the fastest
evaluator_interpretation:
  - The plain reading is the largest absolute net cash outflow from running and funding the business, rather than the fastest percentage increase in spending.
  - "The comparison covers the rivals named nearby: Anthropic, Google and, provisionally, Amazon."
  - I use January–March 2026, the latest completed calendar quarter that could have been reported before the post. Full-year 2026 forecasts cannot establish realized cash burn during that quarter.
  - Marcus identifies no accounting basis. I therefore retain unknown rather than assign the basis of a subsequently found source.
  - The statement that OpenAI has a problem adds no separately measurable threshold.
support_condition: Comparable realized cash-flow figures show that OpenAI consumed more cash than each named rival during the target quarter.
contradiction_condition: Comparable realized cash-flow figures show that a named rival consumed at least as much cash as OpenAI during the target quarter.
measurement_requirements: Use the same definition of net cash consumption, period and organizational perimeter. Separate financing proceeds, investment-security transactions, noncash losses and future commitments from operating and capital cash consumption.
source_requirements: Prefer financial statements. Credible reporting on financial documents is usable only with enough detail to establish comparable definitions.
