assessment_axis: historical_observation
explicit_source_elements:
  - LLM
  - giant, opaque black boxes
  - no explicit models of the world at all
evaluator_interpretation:
  - The surrounding text defines explicit models through databases, identifiable entity records, and defined update procedures. The assessment uses that classical meaning.
  - The target is standard LLM internals, not external tools or a complete hybrid application.
  - Opaque means that the learned computations are not comprehensively understood. It does not mean that no internal feature can ever be interpreted.
  - The target is the latest publicly documented architectural state of models available by 2025-06-28. There is no recurring reporting period; the interval has an open beginning because existing model architectures were documented earlier.
  - The absence of an explicit classical store is an inference from the documented architecture, not a claim that the network contains no world knowledge.
support_condition: Representative architecture documentation shows learned neural computation without a designed entity-state store and domain update procedures, while interpretability research confirms that the computations remain incompletely understood.
contradiction_condition: Representative standard LLM internals contain the classical entity-state structures and update procedures described in the post, or their learned computation is comprehensively understood. Decodable learned features alone do not meet the classical-structure criterion.
measurement_requirements: Inspect architectural components and distinguish explicitly designed state structures from learned representations, token caches, generated text, and external databases.
source_requirements: Primary model architecture documentation and primary interpretability research.
