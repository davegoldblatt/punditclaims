explicit_source_elements:
  - The products don't do what they're meant to do
  - people are realizing it
  - tools that don't adapt
  - systems can't remember
evaluator_interpretation:
  - "Read this as an observation about enterprise generative AI tools discussed in the cited NANDA report: difficulty delivering intended workflow functions, together with users recognizing those limitations."
  - Do not equate a lack of measured profit impact with complete technical nonfunctionality.
  - Use January–June 2025, the research period of the report directly discussed in the surrounding passage.
  - Read 'people are realizing it' as documented user recognition. A claim that recognition increased over time would additionally require longitudinal evidence.
support_condition: Enterprise evaluations document failures to meet intended workflow requirements, and users explicitly recognize those failures.
contradiction_condition: Evaluations document useful delivery of intended functions and satisfied users within the same enterprise-use scope. Substantial evidence of both failures and useful delivery warrants a mixed assessment.
measurement_requirements: Distinguish task-specific enterprise systems from general-purpose assistants used at work, and distinguish workflow functionality, user satisfaction and financial return.
source_requirements: Primary enterprise evaluations or user research covering the referenced period; report sampling and measurement limits.
