assessment_axis: causal_assessment
explicit_source_elements:
  - current AI hard to debug
  - nobody knows for example how to ground them in facts
  - difficult predict
  - unlike calculators or spreadsheets
evaluator_interpretation:
  - Current AI means the contemporary language-model chatbots discussed in the surrounding passage, not every kind of AI.
  - The causal claim is that limited understanding of internal mechanisms obstructs diagnosing failures and predicting responses.
  - Grounding ordinarily means connecting generated answers to checked factual sources. Marcus does not explicitly require perfect factual accuracy in this sentence.
  - The assessment covers the 2023 technical reporting window through publication. These systems have no standard quarterly reporting period.
  - Difficulty predicting responses does not mean that no behavior or aggregate performance can be predicted.
support_condition: Contemporary research connects limited mechanistic understanding to difficulties diagnosing and controlling model behavior, documents unreliable response behavior, and establishes that factual grounding was unavailable.
contradiction_condition: Demonstrated factual-grounding methods contradict the categorical parenthetical. Evidence of dependable general prediction or easy diagnosis despite opacity would contradict the broader engineering claim.
measurement_requirements: Distinguish factual grounding from guaranteed truth, and observed behavioral instability from evidence identifying its cause.
source_requirements: Research or developer accounts describing models available by 2023-10-10.
