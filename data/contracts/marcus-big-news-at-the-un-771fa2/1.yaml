assessment_axis: forecast_outcome
explicit_source_elements:
  - '"What we are facing near-term"'
  - '"not extinction"'
  - '"not superintelligence"'
  - '"wholesale deepfaked disinformation"'
  - '"unreliable but persistent AI systems stealing credentials and launching cyberattacks, at scale"'
evaluator_interpretation:
  - Read as a forecast about the main AI harms of the near term, starting from the post date of 2026-09-21.
  - No deadline is given. 'Near-term' is read as roughly the next year or two, but no end date is fixed.
  - "Plain reading: in the near term, widely reported deepfake disinformation and AI-agent credential theft and cyberattacks happen at large scale, and no extinction-level event or superintelligent system appears."
  - "The claim has two parts: harms that happen, and harms that do not. The negative part (no extinction, no superintelligence) can only be judged once the near-term window has clearly passed."
support_condition: Over a reasonable near-term window after September 2026, credible reports document large-scale AI deepfake disinformation and AI systems stealing credentials and launching cyberattacks at scale. No extinction-level event happens, and no system widely accepted as superintelligent emerges.
contradiction_condition: In the near term, a superintelligent system emerges or an extinction-level AI event occurs. Or, despite the forecast, AI deepfake disinformation and AI-driven credential theft and cyberattacks stay marginal and are not seen at scale.
measurement_requirements: Incident reports from threat-intelligence groups, government or intelligence statements, and reputable news on AI deepfake campaigns and AI-agent cyberattacks. For the negative part, the absence of any superintelligence or extinction-level event across the near-term window.
source_requirements: Primary threat-intelligence reports (for example Google GTIG, Anthropic, Microsoft) or reputable news reports of them; government statements on influence operations.
metric_scope: null
original_horizon: near-term
horizon_interval:
  start: 2026-09-21
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Can be settled as contradicted early if, within the near term, a superintelligent system emerges or an extinction-level AI event happens. Can be settled as supported only once the near-term window has clearly passed with no such event, and with large-scale deepfake disinformation and AI-driven credential theft and cyberattacks documented.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Near-term' has no defined end date."
  - "'Wholesale' and 'at scale' have no threshold."
  - Partly present tense ('what we are facing'), so it could be read as a description of current risk rather than a forecast.
  - The negative parts (no extinction, no superintelligence) cannot be confirmed before the window ends.
retrospective_or_prospective: retrospective
