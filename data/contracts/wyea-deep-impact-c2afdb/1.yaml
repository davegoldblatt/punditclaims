explicit_source_elements:
  - Large Language Models (and reasoning models)
  - are niche
evaluator_interpretation:
  - The ordinary reading of niche is a product category confined to a narrow specialist market. It does not require majority adoption or smartphone-level importance to cease being niche.
  - I use the fourth quarter of 2024, the latest completed quarter before publication, to assess the ongoing state described.
  - I assess the product category collectively. ChatGPT adoption does not separately establish widespread use of reasoning models.
support_condition: Representative evidence shows that LLM use was confined principally to a small specialist population or narrow set of uses.
contradiction_condition: Population surveys and active-use figures show substantial participation by the general public across ordinary uses, inconsistent with confinement to a narrow specialist market.
measurement_requirements: Distinguish ever-use, weekly use, intensity, geography, and individual products. Do not treat registrations or website visits as active users.
source_requirements: Prefer representative independent surveys, corroborated by dated product usage disclosures. Identify self-reported company figures.
