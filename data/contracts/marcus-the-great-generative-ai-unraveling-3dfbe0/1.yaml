  - a bunch of neocloud companies
  - are in trouble
evaluator_interpretation:
  - The antecedent means a material withdrawal of Nvidia financing or financial guarantees from dependent neocloud companies.
  - A bunch means several distinct companies; no exact count is supplied.
  - Trouble means material financial distress, such as defaults, emergency funding shortfalls or restructuring, linked to that withdrawal.
  - The claim supplies no deadline.
support_condition: Verified withdrawal of Nvidia financing is followed by documented financial distress at several dependent neocloud companies, with evidence connecting the distress to the withdrawal.
contradiction_condition: After verified withdrawal, comprehensive evidence establishes that the affected companies have replaced the financing and discharged the exposed obligations without material distress. Mere survival for an arbitrary interval is insufficient.
measurement_requirements: Identify affected companies, financing withdrawn, withdrawal dates, subsequent distress events and alternative explanations.
source_requirements: Company disclosures, financing agreements, filings or reliable reporting must establish both the antecedent and subsequent outcomes.
