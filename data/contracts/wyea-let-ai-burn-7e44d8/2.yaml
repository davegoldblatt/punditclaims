  - when you remove OpenAI and Anthropic
  - the AI industry
  - at best
  - $20 billion in annual revenue
evaluator_interpretation:
  - The linked 89% figure refers to a tally of 34 leading private AI startups. Assess that percentage on the tally's annualised basis, not as realised revenue for an invented fiscal year.
  - The latest cited snapshot is from May 2026 and is used in a July 7 present-tense claim. The target interval covers that referenced snapshot through the post date.
  - The ordinary contextual reading of the $20 billion ceiling concerns the remaining generative-AI businesses. Whether that includes public-company AI businesses and infrastructure providers is materially ambiguous.
  - Do not assume that a sample of leading startups measures the entire remaining industry.
  - Excluding two companies defines the population; it is not a conditional forecast.
support_condition: The referenced tally establishes approximately 89% on its own annualised basis, and adequately comprehensive revenue evidence establishes no more than $20 billion for the remaining industry on a consistent basis.
contradiction_condition: A comparable reconstruction disproves the 89% tally, or comparable revenues for the relevant remaining industry exceed $20 billion. A broader or narrower company universe cannot be substituted without identifying the interpretation.
measurement_requirements: Identify the tally's membership and snapshot dates, annualisation method, reseller accounting and the population covered by the $20 billion ceiling. Keep realised revenue and annualised revenue separate.
source_requirements: The underlying revenue tally and company disclosures, with reliable reporting where private-company figures are not public. A comprehensive ceiling requires evidence beyond a selected startup sample.
