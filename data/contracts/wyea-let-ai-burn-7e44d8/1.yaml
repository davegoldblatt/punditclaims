explicit_source_elements:
  - OpenAI and Anthropic
  - 89% of the revenues of the largest AI companies
  - when you remove OpenAI and Anthropic
  - the AI industry
  - at best
  - $20 billion in annual revenue
evaluator_interpretation:
  - The contextual industry is suppliers of generative AI models and applications. The speaker does not supply a company roster or clearly exclude public companies and infrastructure providers.
  - Annual revenue ordinarily means realized revenue over twelve months, rather than annualising a recent month.
  - "For the ongoing annual revenue assertion, I use the trailing twelve months ending March 31, 2026: the latest routinely reported quarter-end available before the July 7 post. This reporting-window choice is mine."
  - The 89% assertion requires a defined largest-company cohort. The $20 billion ceiling applies to the remainder of the industry, not merely the remainder of that cohort.
  - Excluding the two companies is a calculation rule, not a conditional forecast.
  - The supplied words do not identify an accounting basis. Finding a similar press statistic does not establish that the entire assertion uses that statistic's basis.
support_condition: A consistent company roster and comparable realized annual revenues establish an approximately 89% share for OpenAI and Anthropic among the largest companies, and comprehensive industry coverage establishes no more than $20 billion for everyone else.
contradiction_condition: Comparable realized annual revenue evidence shows that the two companies' share is materially different from 89%, or establishes more than $20 billion in revenue for the remaining industry. A sample, run rate, or different accounting basis is insufficient.
measurement_requirements: Use a common twelve-month period, USD, a defined company universe, and consistent treatment of revenue sharing. Avoid double counting model sales resold through applications or clouds.
source_requirements: Company financial disclosures where available and transparent estimates for private companies. A sample-based press estimate must retain its sample and annualisation limits.
metric_scope:
