assessment_axis: historical_observation
explicit_source_elements:
  - Based on what I have been party to
  - the more successful Anthropic becomes
  - the more its services cost
evaluator_interpretation:
  - Read in context, this concerns Anthropic's aggregate spending as its business grows, rather than its customers' prices or cost per token.
  - The post identifies its underlying records as AWS cash payments, after discounts and credits, covering 2024 through September 2025. That fixes the observation period.
  - Revenue growth is the ordinary measure of commercial success here. The claim describes an association; it does not establish that growth caused higher unit costs.
  - The accounting basis is estimate because the assessment rests on third-party billing information and reported revenue estimates, rather than published company accounts.
support_condition: Independent records show that comparable realized AWS cash spending generally increased alongside realized revenue during the stated period.
contradiction_condition: Independent comparable records show that AWS cash spending generally stayed flat or declined while realized revenue grew during the stated period.
measurement_requirements: Comparable monthly or matched-period revenue and AWS cash-payment records, with consistent treatment of credits, discounts and prepayments. Annualized revenue, accrued expenses and total company cash burn cannot substitute for these measures.
source_requirements: Company or vendor records, or independently sourced reporting. Repetition of Zitron's billing figures does not independently verify them.
