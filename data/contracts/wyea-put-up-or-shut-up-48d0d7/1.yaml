assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT already
  - spreads election misinformation
  - telling people how to build bombs
  - giving people dangerous medical information
  - generating buggy, vulnerable code
evaluator_interpretation:
  - Already refers to documented outputs during ChatGPT's existence through the post date, rather than only a particular model release.
  - The ordinary reading is that these outputs occurred, not that all or most answers fall into these categories.
  - Dangerous medical information means advice that creates a clinically meaningful risk if followed; actual injury is not required.
  - Buggy, vulnerable code includes code containing security defects.
  - Research on the GPT-3.5 ChatGPT model through its API is relevant to the code-generation behavior, with the interface distinction disclosed.
support_condition: Dated records establish ChatGPT outputs in all four categories by 2024-07-16.
contradiction_condition: Reliable examination disproves a listed category, such as showing that purported examples were fabricated, concerned a different system, or did not contain the alleged harmful information. Successful refusals alone do not disprove occurrence.
measurement_requirements: Identify the system and output category. Distinguish factual misinformation from political disagreement, clinically risky advice from merely incomplete answers, and code defects from style preferences.
source_requirements: Prefer original evaluations and documented demonstrations. Use firsthand reporting for a product demonstration when an equivalent research record is unavailable.
