explicit_source_elements:
  - If ARM drops below $80
  - things are going to get hairy for Masayoshi Son
  - a $15 billion margin loan based on its stock
evaluator_interpretation:
  - The condition means a post-publication trade in Nasdaq-listed ARM below US$80 per depositary share, including an intraday trade.
  - In the surrounding financing discussion, 'get hairy' means material pressure on SoftBank's ARM-backed financing, such as a margin call, compulsory repayment, additional collateral demand, or forced asset sale attributable to the price fall.
  - No deadline is stated. A lower share valuation alone is not sufficient evidence of the predicted financing pressure.
support_condition: After ARM trades below $80 following publication, dated records establish material financing pressure attributable to the fall under SoftBank's ARM-backed borrowing arrangements.
contradiction_condition: After the condition occurs, applicable loan terms and completed collateral tests establish that the below-$80 episode did not cause material financing pressure. Mere silence or the passage of time is insufficient.
measurement_requirements: Use unadjusted USD trading prices with any share-ratio changes reconciled. Match collateral requirements, outstanding debt, and pledged shares to the date of the price event.
source_requirements: Historical market-price records for the antecedent and lender notices, financing agreements, or company disclosures for the consequence.
