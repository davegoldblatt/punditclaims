assessment_axis: forecast_outcome
explicit_source_elements:
  - In 2029
  - AI will not be able to take arbitrary proofs
  - from the mathematical literature
  - written in natural language
  - convert them into a symbolic form suitable for symbolic verification
evaluator_interpretation:
  - The deadline is December 31, 2029, allowing the whole named year.
  - Arbitrary means broad applicability to independently selected proofs across mathematical literature, rather than selected showcases or one narrow class. It does not require successfully verifying false arguments.
  - Converting proofs means preserving their mathematical content and substantive reasoning while supplying formal details. Producing a different proof of the same theorem alone does not demonstrate faithful conversion.
  - Successful checking by a proof assistant is the practical test of suitability for symbolic verification. Statements alone, unchecked proof holes and unsupported assumptions do not establish success.
  - Marcus specifies neither a representative sampling method nor an acceptable failure rate; those must be disclosed rather than silently invented.
  - The literature restriction defines the task, rather than a conditional forecast requiring a separate antecedent.
  - This assessment concerns the individual formalization prediction, not winning the broader three-of-five AGI bet.
support_condition: Broad evaluations during 2029 find that leading systems still cannot faithfully formalize independently selected natural-language proofs from diverse mathematical literature, with recurring substantive failures rather than merely occasional errors. Absence of a demonstration alone is insufficient.
contradiction_condition: Reproducible evaluations establish broad successful conversion of independently selected literature proofs into checked symbolic proofs, preserving the original mathematical content and reasoning without substantial expert completion.
measurement_requirements: Disclose source proofs, selection procedures, mathematical coverage, complete outputs, human interventions, checker versions, assumptions and proof holes. Assess both machine verification and fidelity to the source arguments; theorem-proving scores alone are insufficient.
source_requirements: Prefer independent evaluations with public source-to-formal mappings and reproducible checking. Primary research demonstrations are relevant but must establish breadth and fidelity before resolving the forecast.
metric_scope: null
original_horizon: In 2029
horizon_interval:
  start: 2022-05-31
  end: 2029-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An independently reproducible demonstration of broad, faithful conversion across an independently selected and diverse literature sample may contradict the forecast early if it establishes a continuing general capability. A selected theorem, restricted corpus or narrow benchmark alone is insufficient; present failures cannot settle the forecast in its favor.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Arbitrary has no specified sampling frame or mathematical breadth.
  - The acceptable failure rate is unspecified.
  - The required fidelity to the original proof and permitted human assistance are unspecified.
  - Suitable for symbolic verification does not explicitly state whether completed machine checking is required.
