assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA’s GPUs are so god damn expensive
  - nobody
  - including the largest and richest companies
  - minus Microsoft
  - keep buying them and building data centers
  - near-infinite amounts of debt
  - reducing the pool of potential customers dramatically
evaluator_interpretation:
  - Read 'near-infinite' as rhetorical language for very large, continuing borrowing requirements, not literally infinite debt.
  - The ordinary factual claim is that every relevant buyer except Microsoft needs substantial additional debt to sustain NVIDIA purchases and data-center construction.
  - Borrowing actually undertaken does not alone establish that borrowing was necessary.
  - Use April–June 2026 as the latest completed calendar quarter reportable before the post for the major buyers named in context.
  - The claim does not identify an accounting basis for buyers' debt or spending; retain unknown rather than importing one from the evidence.
  - Microsoft's exclusion is a scope exception, not a conditional forecast.
support_condition: Comparable financing records show that every relevant buyer other than Microsoft requires substantial continuing borrowing to sustain the purchases, and evidence connects that requirement and a large reduction in viable buyers specifically to GPU prices.
contradiction_condition: A substantial buyer other than Microsoft can sustain the relevant purchases and construction from internal resources without substantial additional borrowing, or evidence disproves the asserted price-driven reduction in viable buyers.
measurement_requirements: Compare operating cash generation, available liquidity, infrastructure cash expenditure, lease obligations and new borrowing over sustained periods. Separate GPU costs from land, power, buildings and other equipment.
source_requirements: Buyer financial statements and financing disclosures, procurement or cost records, and evidence about buyers excluded by price.
