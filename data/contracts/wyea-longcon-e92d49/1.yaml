evaluator_interpretation:
  - The plain reading is a comparison of the amount of news coverage, not audience size or product adoption.
  - The surrounding discussion makes ChatGPT's public launch the starting point. The observation covers launch through the post date.
  - Comparable stages mean comparable elapsed time after a startup's principal product launch. This is an interpretation; company age would give a different comparison.
  - Facebook is excluded from potential counterexamples.
support_condition: A sufficiently comprehensive historical comparison finds that no other startup matched ChatGPT/OpenAI's coverage at a comparable early stage.
contradiction_condition: At least one startup other than Facebook matched or exceeded that coverage under a consistent measurement and comparable stage.
measurement_requirements: Comparable news archives, outlet coverage, languages, elapsed time, search terms and duplicate handling. Technology-category coverage cannot substitute for startup coverage.
source_requirements: Reproducible archive counts or independent research explaining its comparative method.
