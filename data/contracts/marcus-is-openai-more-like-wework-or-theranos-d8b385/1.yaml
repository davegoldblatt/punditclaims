explicit_source_elements:
  - The difference between GPT-3 and GPT-4
  - by all accounts massive
  - the difference between GPT-4 and o1
  - by all accounts modest
evaluator_interpretation:
  - The ordinary reading asserts broad agreement that the earlier transition was transformative while the later transition offered only limited improvement.
  - By all accounts is treated as a claim of broad agreement, not a requirement to inspect every informal opinion.
  - For the later transition, assess o1-preview available at publication. GPT-4o comparisons inform the GPT-4 family comparison, with that substitution disclosed.
  - Substantial documented gains across important reasoning domains can contradict the asserted agreement without proving that o1's overall improvement exceeded GPT-3 to GPT-4.
  - The period covers the model generations discussed through publication; later o1 releases are excluded.
support_condition: Broad contemporary evaluations agree on a large earlier improvement and only modest later improvement across meaningful capabilities.
contradiction_condition: Credible contemporary evaluations show substantial later gains across important capability domains, undermining the asserted agreement that the later improvement was merely modest.
measurement_requirements: Distinguish model versions, task domains, evaluation settings, and general usefulness. Do not infer a single capability-distance ratio from unrelated benchmarks.
source_requirements: Contemporary technical reports and independent evaluations, with company results identified as such.
