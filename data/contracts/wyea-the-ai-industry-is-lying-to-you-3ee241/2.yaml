assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI not taking the supposedly-planned extensions to Abilene
  - it never existed
  - was never going to happen
evaluator_interpretation:
  - "'Supposedly-planned' concedes that an expansion was announced or reported. The testable claim is that the OpenAI expansion at Abilene was never a real, committed plan: no signed lease, financing or construction for OpenAI."
  - "'Was never going to happen' is a counterfactual about intent and is not scored on its own. It is treated as consistent with the claim if the expansion was never committed and was dropped."
  - An expansion later built on adjacent land for a different tenant (Microsoft) does not bear on whether an OpenAI expansion ever existed.
  - The target period runs from the September 2025 announcement of a 'potential' expansion to the post date.
support_condition: Records show the OpenAI Abilene expansion was only ever described as potential or tentative, never reached a signed lease or committed financing, and was dropped.
contradiction_condition: Records show a signed lease, committed financing, or construction under way specifically for an OpenAI expansion at Abilene before it was dropped.
measurement_requirements: Company announcements and reliable reports on the status of the Abilene expansion lease.
source_requirements: OpenAI, Oracle or Crusoe statements, or reputable reporting on the negotiations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-09
  end: 2026-03
  precision: month
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Never existed' could mean no plan was ever discussed (false, since it was announced and negotiated) or no committed plan existed (the reading used here)."
  - "'Was never going to happen' is about intent and cannot be checked directly."
  - "'It' may refer to the OpenAI expansion or to any expansion of the site; another tenant later took adjacent land."
retrospective_or_prospective: retrospective
