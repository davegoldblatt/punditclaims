assessment_axis: historical_observation
explicit_source_elements:
  - supposedly-planned extensions to Abilene
  - it never existed
  - was never going to happen
evaluator_interpretation:
  - The target is the proposed OpenAI extension beyond the original eight-building Abilene campus, not the six buildings completing that original campus.
  - The plain reading of never existed is that there was no genuine documented expansion proposal. A publicly identified potential project counts as a proposal, but not as a binding construction commitment.
  - The historical period covers the proposal's existence before the post; no beginning is imposed on the word never.
  - Abandonment does not establish that the project was impossible or insincere from its inception.
support_condition: Contemporaneous records establish that the alleged extension was fictitious or had never been a genuine proposal, with evidence that it had no prospect of proceeding.
contradiction_condition: A contemporaneous agreement, planning record or attributable company announcement documents a genuine proposed OpenAI extension beyond the original campus.
measurement_requirements: Distinguish a potential proposal, a signed lease, financed construction and completed capacity. Keep the original eight-building campus separate.
source_requirements: Prefer dated statements from OpenAI, Oracle or the developer, contracts and planning records. Reporting about cancellation must not be treated as proof that no proposal existed.
