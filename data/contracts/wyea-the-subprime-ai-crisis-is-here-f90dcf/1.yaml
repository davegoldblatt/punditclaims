evaluator_interpretation:
  - The plain reading compares construction underway across the global announced pipeline, without restricting projects to a particular scheduled opening year.
  - The numbers are treated as rounded capacity estimates, using a consistent power-capacity definition and project population.
  - Currently and last week locate the observation in March 2026.
  - The loan clause requires evidence about the repayment schedules of loans associated with that pipeline. Construction status alone does not establish whether loans were drawn or require principal payments.
  - This is a compound current-state observation, including an asserted implication, rather than a conditional forecast.
support_condition: A March 2026 global tracker shows approximately 5 GW under construction within more than 200 GW announced on consistent definitions, and associated loan records establish that interest-only payments are common.
contradiction_condition: A comparable March 2026 global inventory materially conflicts with the capacity assertion, or representative associated loan schedules contradict the claimed prevalence of interest-only payments.
measurement_requirements: Separate all announced projects from projects scheduled to open in 2026; count actual construction phases rather than ultimate campus capacity; match financing records to the same projects.
source_requirements: Dated global project-tracker data with methodology, together with executed loan terms or audited debt disclosures.
