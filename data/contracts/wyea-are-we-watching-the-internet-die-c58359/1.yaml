ambiguity_flags:
  - Perfect is rhetorical and does not specify an accuracy threshold.
  - Human could refer to classifier judgments or human perceptions.
  - The ongoing capability claim names no period; the latest completed calendar year is an evaluator-selected reporting window.
  - Detector evasion and manipulation of recommendation rankings are distinct capabilities.
