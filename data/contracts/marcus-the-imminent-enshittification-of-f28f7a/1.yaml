explicit_source_elements:
  - Amazon is starting to be a receptacle
  - inaccurate and exploitative
  - quickie histories of recent events
evaluator_interpretation:
  - The factual core is that Amazon was carrying hastily published accounts of recent events containing material inaccuracies.
  - Exploitative is read as commercially taking advantage of attention surrounding a recent event while offering a misleading or substantially defective account. It does not require proving the author's private motives.
  - Starting indicates an emerging practice, with no specified market-share threshold.
  - The surrounding account describes examples collected since February 12. The target period is February 12 through August 16, 2023.
  - This sentence does not independently require proof that GPT wrote the books.
support_condition: Dated listings and inspected contents establish that Amazon offered rapidly produced accounts of recent events with demonstrable factual errors and misleading commercial presentation during the target period.
contradiction_condition: Reliable inspection establishes that the alleged accounts were unavailable during the target period, were not rapid accounts of recent events, or lacked the alleged inaccuracies and misleading presentation.
measurement_requirements: Compare publication and event dates, identify specific book passages, and check them against reliable event records. Distinguish subsequently outdated casualty counts from errors when published.
source_requirements: Prefer preserved listings and book contents, checked against official event records. Use reputable firsthand reporting when listings or books are unavailable.
