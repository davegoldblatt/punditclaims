evaluator_interpretation:
  - Compare the worldwide number of deepfake-video human-impersonation financial scam incidents in calendar 2026 with their cumulative number through December 31, 2025.
  - "'Like this' refers to the described kind of impersonation scam, without requiring Mark Carney, Canadian victims or the same loss amount."
