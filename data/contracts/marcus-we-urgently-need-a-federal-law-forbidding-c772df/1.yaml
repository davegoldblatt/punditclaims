  - The asserted improvement in tools is an explanation, not a future conditional antecedent.
  - "'Almost certainly' expresses confidence; one outcome cannot independently establish probability calibration."
support_condition: Comparable counts or defensible estimates show that qualifying incidents during 2026 exceed the cumulative total before 2026.
contradiction_condition: Comparable completed-year counts or defensible estimates show that qualifying incidents during 2026 are no greater than the cumulative pre-2026 total.
measurement_requirements: Consistent worldwide incident definitions, deduplication, historical coverage and treatment of underreporting. Loss amounts and annualized projections cannot substitute for incident counts.
