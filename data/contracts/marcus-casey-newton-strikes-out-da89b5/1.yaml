explicit_source_elements:
  - neurosymbolic AI
  - at last coming into vogue
  - as noted in Fortune earlier this week
evaluator_interpretation:
  - Coming into vogue means gaining visible research and industry attention, rather than becoming the dominant AI approach.
  - The current observation is assessed over 2024 through the post, the latest partial calendar year available for research and industry developments.
  - At last expresses renewed or increasing attention; it does not assert that the field had no previous following.
  - The assessment concerns the supplied proposition about popularity, not Marcus's separate claim to decades of advocacy.
support_condition: Research surveys and contemporaneous industry activity show growing attention to neurosymbolic AI, accompanied by visible coverage near the post.
contradiction_condition: Comparable evidence shows declining or stagnant attention, with the cited coverage representing an isolated example rather than a broader trend.
measurement_requirements: Use research trends and concrete activity by multiple organizations. Distinguish interest and experimentation from widespread deployment or demonstrated superiority.
source_requirements: Prefer research surveys and primary descriptions of industry work. The cited Fortune article can establish contemporary coverage and attributed company activity.
