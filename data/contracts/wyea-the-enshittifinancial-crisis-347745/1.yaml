  - Anthropic
  - cannot afford to pay Broadcom
  - $10 billion
  - right now
evaluator_interpretation:
  - The observation concerns December 29, 2025, the publication date.
  - The plain reading is that Anthropic lacked sufficient accessible funds to make an immediate $10 billion payment while meeting unavoidable obligations.
  - Accessible funds include unrestricted cash, readily saleable investments and financing actually available to draw. Cumulative fundraising is not cash remaining.
  - The surrounding financial figures are presented as reported estimates, so the contract uses an estimate basis.
  - The statement does not establish that Broadcom required an immediate lump-sum payment.
support_condition: Dated records establish that accessible liquidity, after unavoidable contemporaneous obligations, was insufficient for a $10 billion payment on December 29, 2025.
contradiction_condition: Dated records establish that Anthropic could make that payment on December 29, 2025 without failing to meet unavoidable contemporaneous obligations.
measurement_requirements: A publication-date liquidity reconciliation, including cash restrictions, accessible credit, intervening financing and payment obligations. Do not substitute revenue, valuation or cumulative fundraising for liquidity.
source_requirements: Company financial records, financing agreements and payment schedules; credible reporting may establish estimates where primary records are unavailable.
