ambiguity_flags:
  - The membership of 'all the major AI companies' is unspecified.
  - "'Almost exactly' supplies no numerical tolerance or task weighting."
  - "'Results' could mean benchmark performance, practical usefulness, or individual outputs."
  - "'Same data' could mean overlapping source categories or nearly identical training corpora."
  - Billion-scale spending could refer to each company or the companies collectively.
  - Spending currency, period, expenditure boundary, and accounting basis are unspecified.
  - April 1–20, 2024 is an evaluator-selected reporting window for the ongoing state, based on the post's contemporary April context.
