assessment_axis: causal_assessment
explicit_source_elements:
  - hyperscalers have borrowed a bunch of money to fund AI
  - pushing them into cash-flow negative territory
  - every time they raise more money, bondholders become more worried about them paying it back
  - both Amazon and Google have now gone cash-flow negative
  - as of their latest quarters
evaluator_interpretation:
  - "In this capital-spending context, the ordinary reading of cash-flow negative is negative free cash flow: operating cash flow less cash capital expenditures."
  - "Latest quarters means the latest quarterly results public before July 28: Amazon's quarter ended March 31 and Alphabet's quarter ended June 30. It does not mean trailing-twelve-month figures."
  - Google is assessed through Alphabet's consolidated financial statements, with that entity choice made explicit.
  - The causal reading is that debt-financed AI investment burdens cash flow and increases repayment concerns. Borrowing proceeds themselves are not treated as an operating cash outflow.
  - The statement about every raise requires evidence across successive issuance events, not one episode of spread widening.
support_condition: Both named companies have negative quarterly free cash flow in their latest reported quarters, disclosures connect the deterioration to debt-financed AI investment, and comparable issuance-event evidence establishes increased repayment concern across successive raises.
contradiction_condition: A named company's latest-quarter free cash flow is nonnegative under the stated reading, or credible causal evidence refutes the proposed mechanism or identifies qualifying debt raises without the claimed increase in repayment concern.
measurement_requirements: Keep each company's quarter and free-cash-flow definition separate. Match bond observations before and after issuance and account for market-wide movements, liquidity, maturity and issue concessions.
source_requirements: Company cash-flow statements and financing disclosures, supplemented by dated bond records and credit analysis that can distinguish repayment concerns from supply effects.
