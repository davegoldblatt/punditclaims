explicit_source_elements:
  - these users aren’t all paying $30 a month
  - as of August 2025
  - active licensed users of Microsoft 365 Copilot
evaluator_interpretation:
  - The claim concerns effective subscription prices paid by customers or their employers, not whether employees personally pay.
  - The target period is August 2025 because 'these users' refers to the licensed-user population dated August in the preceding paragraph.
  - Support requires evidence that some customers actually received below-list pricing. An advertised discount establishes availability but does not alone establish uptake.
  - The accounting basis is estimate because the assertion about actual customer prices relies on reporting and inference rather than disclosed sales records.
support_condition: Reliable customer, vendor, contractual, or reported transaction evidence establishes that at least some Microsoft 365 Copilot users in August 2025 had effective subscription prices below USD 30 per seat per month.
contradiction_condition: Comprehensive, reliable sales records establish that every user in the specified population was billed at the full USD 30 monthly equivalent, without discounts or credits.
measurement_requirements: Compare effective per-seat subscription prices on an annual-commitment basis. Exclude free Copilot Chat, consumer subscriptions, taxes, unrelated services, and discounts retained solely by resellers.
source_requirements: Customer contracts, invoices, vendor disclosures of actual discounted sales, or credible reporting identifying discounted customer purchases.
