assessment_axis: forecast_outcome
explicit_source_elements:
  - tens of thousands of people fired
  - long-term environmental and infrastructural chaos
  - a profound depression in Silicon Valley
  - will dwarf the dot-com bust
evaluator_interpretation:
  - This predicts consequences of the generative AI boom and its expected collapse. It supplies no deadline.
  - "The plain reading requires all three harms: substantial attributable layoffs, lasting environmental and infrastructure disruption, and a Silicon Valley downturn substantially worse than the dot-com bust."
  - I interpret tens of thousands as at least 20,000 involuntary job losses, without treating a larger number as a failure.
  - The comparison should use consistent regional boundaries and comparable employment, investment, and business-activity measures. The speaker supplies neither a preferred measure nor a numerical meaning for dwarf.
  - I believe expresses confidence, not an external condition that must occur before scoring.
support_condition: Evidence establishes at least 20,000 actual job losses attributable to the generative AI boom or its collapse, persistent environmental and infrastructure disruption attributable to it, and a Silicon Valley downturn substantially exceeding the dot-com bust on comparable regional measures.
contradiction_condition: A completed, clearly bounded collapse and its aftermath establish that the predicted combined damage did not occur. Continued investment or a smaller downturn at an interim date cannot alone contradict this undated forecast.
measurement_requirements: Distinguish announced cuts from completed dismissals and employer attribution from demonstrated causation. Separate generative AI from other computing demand. Compare the depth and duration of regional downturns using consistent geography and measures; distinguish observed lasting damage from projected resource needs.
source_requirements: Employer disclosures and labor records for layoffs; environmental and utility records or research for persistent damage; official regional economic series and documented historical comparisons for the downturn. Evidence must have been available by 2026-10-28.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Support can resolve early only when dated evidence establishes all three attributable harms, including sufficient follow-up to demonstrate persistence and a regional downturn substantially worse than the dot-com bust. Isolated layoffs, environmental pressures, or funding setbacks are insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No duration defines long-term.
  - Chaos has no specified severity measure.
  - Silicon Valley has no specified geographic boundary.
  - Dwarf has no specified measure or multiplier.
  - The text does not precisely distinguish damage during the boom from damage caused by its collapse.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
