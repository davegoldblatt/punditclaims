evaluator_interpretation:
  - The ordinary reading is that AI will become commonplace across everyday and professional activities while continuing to make errors.
  - Ubiquitous does not require every person to use AI, but availability or adoption of one product alone cannot establish it.
  - About to implies a near-term transition but supplies no calendar deadline. No numerical adoption threshold is added.
support_condition: Broad evidence establishes commonplace AI use across everyday and professional settings, alongside documented errors, in the transition following January 2023.
contradiction_condition: Evidence establishes a settled contrary outcome within the intended transition. Nonoccurrence by an evaluator-selected deadline cannot contradict this undated forecast.
measurement_requirements: Distinguish actual use from availability, occasional experimentation from routine use, and one product or country from AI generally.
source_requirements: Representative adoption studies and documented errors from independent measurements or primary disclosures.
