evaluator_interpretation:
  - The surrounding discussion makes this annual debt issuance, not the outstanding debt stock.
  - Treat the two totals as separate conditional scenarios, not as an unconditional range.
  - "Other AI debt means issuance outside the five named hyperscalers: Meta, Alphabet, Amazon, Microsoft, and Oracle."
  - Both scenarios also rely on the surrounding $419 billion hyperscaler issuance estimate.
  - "The stated inputs do not exactly reproduce the upper total: 419 + (570 - 250) × 1.676 = 955.32, in billions. Preserve the published $939 billion target and flag the discrepancy rather than silently correcting it."
support_condition: For each branch whose antecedent is documented, calendar-2027 gross issuance is approximately the stated branch total, using the same issuer and financing coverage as the 2026 baseline.
contradiction_condition: A documented branch antecedent holds, but complete, comparable calendar-2027 issuance differs materially from that branch's stated total.
measurement_requirements: Separate hyperscaler and other AI issuance for both years. Include the same debt instruments and SPVs throughout, avoid double counting securitized loans, and distinguish gross issuance from net borrowing and outstanding debt. Evaluate each condition separately.
source_requirements: Completed-year issuance records or a transparent market dataset, with issuer filings and a documented classification of AI-related financing.
