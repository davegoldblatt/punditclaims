early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No quality threshold defines a successful fake.
  - "'Almost nothing' gives neither a price threshold nor a cost boundary."
  - "'Anybody' could mean broad applicability or a strict universal guarantee."
  - The ongoing-state observation is assigned to the current month through publication.
  - "'Sufficient data' does not specify its quantity or acquisition cost."
