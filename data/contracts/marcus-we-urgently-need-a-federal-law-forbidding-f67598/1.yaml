assessment_axis: historical_observation
explicit_source_elements:
  - Anybody’s appearance
  - given sufficient data
  - now, at any time
  - for almost nothing
evaluator_interpretation:
  - The ordinary reading is that available tools can produce convincing short videos depicting arbitrary people, given adequate source imagery, on demand and at negligible production cost.
  - This does not require flawless impersonation in every scene or fooling every viewer.
  - Because 'now' describes an ongoing capability without a reporting period, the target is February 2026 through the post date.
  - Free software alone does not establish negligible production cost; hardware, processing, preparation and retries also matter.
support_condition: Dated demonstrations or evaluations establish broad identity coverage, convincing video likenesses and negligible production costs using tools available by February 14, 2026.
contradiction_condition: Reliable evaluations establish substantial identity, availability or cost barriers that defeat this ordinary reading even with sufficient source data.
measurement_requirements: Representative identities, stated source-data requirements, video-quality assessment and production costs, including preparation and unsuccessful attempts.
source_requirements: Dated tool documentation, reproducible demonstrations or independent evaluations establishing capabilities available during the target period.
