explicit_source_elements:
  - minor changes
  - a noticeable difference
  - rearrange “leaderboard” rankings
  - rearranging the order of answers in multiple choice
  - the insertion of special characters
  - changes to the answer format
evaluator_interpretation:
  - The statement concerns controlled benchmark results available before publication, not every model or every possible perturbation.
  - A noticeable ranking effect means at least one reversal in the relative ordering of tested models.
  - The examples identify a class of changes; the claim does not require every listed change to affect every ranking.
  - The target is the pre-publication study record; the post gives no experiment start date.
support_condition: A contemporary controlled study finds that minor changes preserving the underlying questions alter performance enough to change model rankings.
contradiction_condition: The relevant study reports no ranking changes, or the reported changes depend entirely on changing the questions' substantive meaning.
measurement_requirements: Compare the same models and questions under baseline and perturbed evaluation conditions; inspect accuracy and relative rankings.
source_requirements: The primary study's version available before February 8, 2024, including its methods and results.
