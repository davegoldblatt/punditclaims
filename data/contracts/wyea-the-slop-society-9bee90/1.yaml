assessment_axis: forecast_outcome
explicit_source_elements:
  - Meta will push
  - as much AI slop as it wants
  - both created by its generative models and their users
  - Facebook and Instagram
evaluator_interpretation:
  - Assess the supplied normalized proposition about AI-content promotion, excluding the separate prediction about inflammatory content.
  - The ordinary testable reading is a substantial expansion of promoted AI-generated content on both Facebook and Instagram, including content generated with Meta's models and content supplied by users.
  - Content made by users with Meta's models can satisfy both origin descriptions; they need not be separate categories.
  - As much as it wants supplies no measurable quantity. Do not substitute an invented numerical target or assume knowledge of Meta's private preferences.
  - Tools that permit creation or cross-posting are relevant but do not alone demonstrate substantial promotion in both platforms' feeds.
support_condition: Dated evidence establishes a substantial expansion after publication of AI-generated content actively promoted on both Facebook and Instagram, covering Meta-model and user-created content.
contradiction_condition: A decisive event permanently prevents the specified promotion on either named platform. Temporary restrictions or a lack of expansion by an arbitrary date are insufficient.
measurement_requirements: Document actual rollout, platforms, content origins, and promotion or exposure. Separate a standalone Meta AI feed from Facebook and Instagram feeds.
source_requirements: Dated product disclosures supported where possible by independent observations or exposure measurements.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a documented live rollout or measured expansion that meets the support condition on both named platforms. Resolve as contradicted only upon an irreversible event that makes that outcome impossible.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - As much as it wants provides no quantity.
  - Push could mean enabling sharing, advertising creation tools, or increasing feed exposure.
  - Slop is an evaluative description without a quality threshold.
retrospective_or_prospective: retrospective
