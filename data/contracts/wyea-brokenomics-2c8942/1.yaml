evaluator_interpretation:
  - In the surrounding discussion of subsidies and costs, the ordinary reading is that both companies' existing commercial models fail to cover the costs needed to provide and sustain their services.
  - Q1 2026 is the latest completed calendar quarter that public evidence could have described before the June 15 post. Later publications may supply evidence about that quarter.
  - Current losses are relevant but do not alone establish that a business model cannot work.
  - The statement supplies no accounting basis or particular profit measure. Those omissions are preserved rather than replaced with a chosen measure.
support_condition: Comparable evidence for both companies shows that their prevailing pricing and customer demand fail to cover the costs required to sustain the services, with a clear distinction between service costs and investment in future expansion.
contradiction_condition: Comparable evidence shows that at least one of the two companies' existing commercial models sustainably covers the relevant costs. Revenue growth, financing, or a profitable product alone would not suffice.
measurement_requirements: Separate realized revenue, service-delivery costs, research spending, operating results, net income, and cash burn. Evaluate each company separately.
source_requirements: Company financial statements and documented cost allocations are preferred. Press reports must identify their underlying records and verification limits.
