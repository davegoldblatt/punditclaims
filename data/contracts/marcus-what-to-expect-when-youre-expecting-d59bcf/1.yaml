assessment_axis: forecast_outcome
explicit_source_elements:
  - When queried on medicine
  - either resist answering
  - if there are aggressive guardrails
  - occasionally spout plausible-sounding but dangerous nonsense
evaluator_interpretation:
  - The target is the released GPT-4 model, rather than every subsequent model bearing a similar name.
  - The alternatives concern recurring behavior across medical queries, not a prediction that every answer will be refused or dangerous.
  - Plausible-sounding but dangerous nonsense means fluent medical recommendations that qualified clinicians identify as incorrect and potentially harmful.
  - Demonstrating the dangerous-answer alternative does not require establishing that aggressive guardrails were present.
support_condition: Medical evaluations document fluent GPT-4 answers containing clinically harmful errors, or systematic medical refusals under aggressive safeguards.
contradiction_condition: Representative medical evaluations establish that GPT-4 neither systematically refuses under aggressive safeguards nor produces clinically dangerous misinformation. A finite test finding no errors would only bound their frequency.
measurement_requirements: Identify GPT-4 explicitly, document medical queries and responses, and obtain qualified clinical judgments of potential harm.
source_requirements: Primary clinical evaluations or reproducible evaluations with expert review.
