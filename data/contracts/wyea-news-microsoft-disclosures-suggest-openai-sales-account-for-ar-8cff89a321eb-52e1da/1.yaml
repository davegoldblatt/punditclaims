evaluator_interpretation:
  - Read 'beginning of 2022' as January 1, 2022, rather than the start of Microsoft's fiscal 2022.
  - "Use June 30, 2026 as the endpoint: the latest completed reporting period available before the post, consistent with its FY2026 context."
  - The ordinary reading is cumulative capital spending, rounded to the nearest USD 0.1 billion.
  - The statement does not identify its accounting basis or distinguish cash purchases from capital additions including finance leases. Do not silently assign a basis.
support_condition: A documented, consistently defined capital-expenditure series for January 1, 2022 through June 30, 2026 sums to USD 261.3 billion after rounding, and its basis matches the claim.
contradiction_condition: A documented series on the claim's established basis and dates produces a total that does not round to USD 261.3 billion.
measurement_requirements: Reconcile fiscal-year and partial-year amounts without including July–December 2021 or double-counting lease additions and lease payments.
