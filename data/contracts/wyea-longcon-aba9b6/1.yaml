explicit_source_elements:
  - There is no "artificial intelligence" part of Microsoft's revenue or earnings
  - taking anything with "AI" on it
  - saying "we made money!"
evaluator_interpretation:
  - The context acknowledges an AI revenue run rate. The fair reading of the first sentence is that AI is not a distinct financial reporting segment, rather than that Microsoft disclosed no AI-related figure.
  - The second sentence asserts that the run rate is assembled indiscriminately from AI-labelled business. This requires separate evidence about its calculation.
  - The target is Microsoft's fiscal quarter ended December 31, 2024, identified by the surrounding quarterly figures.
  - The contract's monetary scope describes the company-reported AI revenue run rate under discussion. Segment financial statements are a different measure and are retained as context.
support_condition: Financial disclosures show no distinct AI segment, and evidence of the run-rate methodology establishes the asserted indiscriminate aggregation.
contradiction_condition: Disclosures identify a distinct AI financial reporting segment, or a documented calculation contradicts the asserted indiscriminate aggregation.
measurement_requirements: Distinguish reportable segments from supplemental operating metrics. Establish which revenue streams enter the AI run rate and how they are annualized; do not treat run rate as realized annual revenue or earnings.
source_requirements: Microsoft's quarterly disclosures and a documented methodology or reconciliation for its AI revenue run rate.
