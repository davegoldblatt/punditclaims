assessment_axis: historical_observation
explicit_source_elements:
  - can’t play chess as well as conventional algorithms
  - can’t fold proteins like special-purpose neurosymbolic hybrids
  - can’t run databases as well as conventional databases
evaluator_interpretation:
  - The ordinary reading compares general-purpose LLMs performing these tasks themselves with competent specialist systems. Calling a chess engine or database does not establish the LLM's own performance.
  - Assess chess playing strength, protein-structure prediction accuracy, and database-operation correctness and performance separately. Supporting the entire statement requires evidence for all three.
  - The present-tense statement describes capabilities available before the post. With no standard capability-reporting period, use calendar 2025 through June 7 as the contemporary observation window; older results are context.
  - The claim does not establish that the specialist protein systems are correctly classified as neurosymbolic.
support_condition: Comparable evaluations of contemporary general-purpose LLMs show materially inferior performance to competent specialist systems in all three named domains.
contradiction_condition: Comparable evaluations establish that contemporary general-purpose LLMs match or exceed competent specialist systems in one or more named domains. Report which component is contradicted; do not infer the other components.
measurement_requirements: Specify model versions, specialist baselines, tool access, task sets, and resource limits. Use full-game chess results, experimentally grounded protein-structure accuracy, and database execution tests. SQL generation alone is insufficient.
source_requirements: Primary evaluations with reproducible methods and results applicable to models available by June 7, 2025.
