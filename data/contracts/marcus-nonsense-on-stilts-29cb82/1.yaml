evaluator_interpretation:
  - Read 'pretty much all' as an overwhelming field-wide consensus, allowing rare dissent, rather than literal unanimity.
  - The claim concerns researchers' attitudes toward LaMDA's possible sentience, not whether LaMDA actually was sentient.
  - Use June 1 through June 12, 2022, for the ongoing state during the controversy immediately surrounding publication.
  - A selection of prominent skeptics can support widespread skepticism without establishing the prevalence or strength of that attitude throughout the field.
support_condition: Representative evidence from the period establishes that an overwhelming share of the AI community dismissed LaMDA's possible sentience, rather than merely finding the available evidence insufficient.
contradiction_condition: Representative evidence establishes substantial uncertainty or dissent in the AI community during the period. A few individual dissenters would not suffice.
measurement_requirements: Define the population and distinguish dismissing possible sentience from rejecting Lemoine's particular evidence. Do not substitute general views about future AI consciousness.
source_requirements: A representative contemporaneous survey or sufficiently broad, independently documented assessment of community opinion.
