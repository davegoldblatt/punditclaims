explicit_source_elements:
  - appears to have misled people
  - including US Senators
  - no direct equity
  - ownership in the OpenAI Startup fund
  - indirect holdings in OpenAI via his holdings in YCombinator
evaluator_interpretation:
  - Assess the completeness of Altman's statements about his interests, especially his May 16, 2023 Senate testimony, through publication of Marcus's post.
  - The ordinary reading concerns omitted economic interests. Distinguish legal ownership or management authority from a right to financial returns.
  - The word 'appears' does not require proof of deliberate deception. An omission can support the claim without establishing intent.
  - This is a claim about disclosure of personal interests, not a measurement of company finances; metric_scope is null.
support_condition: The testimony omitted the specified interests while records establish that Altman held them. Support for the financial implication requires economic exposure, rather than management authority alone.
contradiction_condition: Records show that the interests were disclosed, did not exist, or were presented as personal financial holdings despite lacking an economic interest.
measurement_requirements: Compare the actual testimony with ownership, beneficial-interest and fund-management records. Keep the Startup Fund separate from equity in OpenAI.
source_requirements: Official testimony and ownership records are preferred. Clearly attributed reporting may establish otherwise private interests, with company denials identified as such.
