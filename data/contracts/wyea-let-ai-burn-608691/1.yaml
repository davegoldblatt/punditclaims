  - Meaningful revenue and hypergrowth are undefined.
  - Actual revenue could mean recognized revenue or any disclosed AI sales measure.
  - Capex accounting basis and lease treatment are unspecified.
  - The two annual spending amounts must not be treated as one cumulative threshold.
