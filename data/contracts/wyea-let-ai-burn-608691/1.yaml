assessment_axis: causal_assessment
explicit_source_elements:
  - the only reason
  - Microsoft, Google, Meta, and Amazon
  - more than $765 billion in capital expenditures in 2026
  - a trillion more in 2027
  - because they have no other hypergrowth ideas
  - none of these companies break out their actual AI revenues
evaluator_interpretation:
  - The claim combines a sole-cause explanation, an assertion about corporate motives, spending intentions, and a revenue-disclosure premise. Verifying spending alone cannot establish the causal explanation.
  - The spending amounts describe plans known at publication, not a forecast of realized expenditure that should be graded after 2027.
  - The ordinary reading of actual revenues is realized revenue. An annualised revenue run rate is relevant context but is not interchangeable with realized annual revenue.
  - Meaningful revenues and hypergrowth have no stated thresholds. I do not supply numerical thresholds.
  - The financial scope below records the combined capex assertion. The text does not identify its accounting basis or explain how leases are treated.
support_condition: Evidence must establish the stated spending intentions on a comparable basis and show that those intentions, motivated by the absence of other growth opportunities, exclusively explain AI's economic presence. The revenue-disclosure premise also requires a review of disclosures available by publication.
contradiction_condition: Evidence must establish an independent material cause of AI's economic presence, directly refute the asserted motives, or refute a factual premise using the same financial measure and period. A run-rate disclosure alone does not refute the narrower assertion about actual revenue.
measurement_requirements: Separate 2026 and 2027 plans; reconcile cash expenditure, finance leases, fiscal years and calendar years. Assess economic causation independently of expenditure totals. Do not treat cloud revenue as AI revenue.
source_requirements: Company guidance and disclosures available by July 7, 2026; credible evidence about investment decisions and alternative causes. Later guidance cannot establish earlier intentions.
metric_scope:
  company: Microsoft, Alphabet, Meta Platforms, and Amazon combined
  metric: Planned capital expenditures, separately for 2026 and 2027
  currency: USD
  units: billions
