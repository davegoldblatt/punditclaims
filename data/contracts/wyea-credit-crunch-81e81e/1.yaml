  - losing $20.92 billion and $8 billion respectively
  - in 2025
  - astonishingly bad businesses
evaluator_interpretation:
  - Assess the financial amounts separately from the subjective judgment about business quality.
  - Unqualified annual loss ordinarily means net loss, but operating loss is a material alternative reading that must be checked rather than silently substituted.
  - Use calendar 2025 and US dollars. Treat $8 billion as rounded to the nearest billion and $20.92 billion as rounded to the nearest hundredth of a billion.
  - The quoted assertion does not specify an accounting basis. Finding numbers that resemble operating losses does not authorize assigning that metric to an unqualified claim.
support_condition: Independent financial records establish the respective 2025 losses at the stated precision on a specified, matching metric and accounting basis.
contradiction_condition: Independent records establish different losses beyond the stated rounding tolerances on the same specified metric and accounting basis. Differences between operating and net loss alone cannot settle an unspecified metric.
measurement_requirements: Identify operating versus net loss, consolidated versus attributable net loss, accounting adjustments, currency, annual period and rounding.
source_requirements: Company financial statements or independent reporting based on those records. Do not use Zitron's own report as verification.
