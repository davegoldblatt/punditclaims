explicit_source_elements:
  - convolutional neural networks
  - his critique of large language models
  - his critique of the scaling hypothesis
  - his advocacy of commonsense and physical reasoning
  - his advocacy of world models
  - originated exactly none
  - rarely if ever credits
evaluator_interpretation:
  - The claim concerns the historical record through the post date, not just publications released near that date.
  - Originating a broad idea is distinct from developing an important implementation or making an original contribution within it.
  - Rarely means attribution is uncommon across a representative collection of relevant papers, talks and public statements. Finding a few acknowledgements would not by itself disprove rarely.
  - General acknowledgement of predecessors is weaker than naming the people responsible.
support_condition: Establish predecessors for all five specified ideas and show, across a representative record, that LeCun seldom credits the relevant predecessors.
contradiction_condition: Establish LeCun's priority for at least one of the five broad ideas, or show that attribution to relevant predecessors is a regular feature of his relevant public work.
measurement_requirements: A topic-by-topic priority comparison and a representative attribution audit with an explicit denominator. Do not infer attribution frequency from selected examples.
source_requirements: Original dated publications and LeCun's papers, recordings or authenticated public statements. Interested parties' priority allegations require independent checking.
