assessment_axis: causal_assessment
explicit_source_elements:
  - can’t reliably stick to the rules of chess
  - despite having them – and millions of games – in their database
  - a manifestation of the related problem
  - extracting statistical tendencies
  - without every fully deriving and apprehending the correct abstractions
evaluator_interpretation:
  - Read database here as training data, given the surrounding discussion, rather than an explicit inference-time record store.
  - The behavioral claim concerns unaided language models repeatedly violating chess rules during play. Puzzle accuracy and playing strength are different measurements.
  - The causal claim attributes these violations to failure to acquire usable rule abstractions; errors alone cannot establish that explanation.
  - Reliable does not mean perfect. Complete-game legality and unfiltered move attempts are the relevant ordinary measures.
  - Use the current year's pre-publication reporting window, 2025-01-01 through 2025-05-05; older controlled experiments provide context.
support_condition: Representative full-game evaluations show recurring illegal moves, training records establish extensive chess exposure, and controlled interventions connect those failures to missing rule abstractions.
contradiction_condition: Representative unaided models consistently complete legal games, or controlled tests demonstrate usable rule abstractions and show that another mechanism explains the alleged failures.
measurement_requirements: Measure illegal attempts and completed legal games separately; disclose prompts, retries, legal-move filtering, external engines, training exposure, and causal interventions.
source_requirements: Primary game logs or reproducible evaluations, training documentation, and controlled model studies.
