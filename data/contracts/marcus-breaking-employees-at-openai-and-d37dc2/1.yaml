explicit_source_elements:
  - Generative AI has gotten harder to monitor
  - harder to control
  - more reckless
evaluator_interpretation:
  - The surrounding retrospective discussion supplies late 2022 as the comparison baseline and the post date as the endpoint.
  - The ordinary reading is that successive systems have become less amenable to effective monitoring and behavioral control, and more prone to harmful behavior under comparable conditions.
  - Increased capability to cause harm, increased deployment, and increased harmful-behavior frequency are distinct measurements.
  - The assessment concerns the supplied normalized proposition, not the separately hedged observation about employees' feelings.
support_condition: Comparable longitudinal evaluations establish worsening monitoring, behavioral control, and harmful behavior across a sufficiently representative set of generative AI systems.
contradiction_condition: Comparable, sufficiently broad evaluations establish stable or improving performance on the claimed dimensions. Opposing results on different dimensions would warrant a mixed assessment only where those dimensions are actually measured.
measurement_requirements: Matched tasks, attack effort, safeguards, permissions, and measures of harmful behavior across model generations. Incident counts require adjustment for deployment and reporting changes.
source_requirements: Prefer longitudinal primary evaluations. Employee concerns and isolated incidents can supply context but cannot establish the overall trend.
