condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No reliability threshold or task distribution is supplied.
  - Fundamental impossibility and serious limitations of current systems are different readings.
  - The cited Salesforce comparison concerns multiple conversational turns, which is not equivalent to comparing single-step and multistep execution.
