assessment_axis: causal_assessment
explicit_source_elements:
  - agents as a concept are fucked
  - large language models are inherently unreliable
  - agents began to break down when given multi-step tasks
evaluator_interpretation:
  - The ordinary reading is that LLM unreliability prevents agents from dependably completing useful multistep workflows.
  - The assessment concerns the normalized claim about agents. The separate assertion about Apple's reasoning paper is outside its scope.
  - Failures in particular tests support a reliability concern but do not alone establish that agents are fundamentally unworkable.
  - Ordinary safeguards, verification and error recovery count as parts of an agent system.
support_condition: Representative evaluations establish that LLM unreliability prevents useful, dependable multistep automation, including when ordinary safeguards and error recovery are used.
contradiction_condition: Reproducible evaluations establish useful multistep agent workflows that meet practical reliability requirements, showing that underlying model errors need not make the system unworkable.
measurement_requirements: Measure completed workflows, repeated-run reliability, human intervention, errors and recovery. Distinguish conversational turns from execution steps and benchmark success from deployment reliability.
source_requirements: Primary evaluations with disclosed tasks, methods and results. Prefer independent replication over vendor demonstrations.
