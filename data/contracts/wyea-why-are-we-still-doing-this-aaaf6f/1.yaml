  - I bet Stargate Abilene never gets built
  - 1.2GW
evaluator_interpretation:
  - The surrounding discussion makes this a prediction about completing and energizing the full original 1.2 GW campus, rather than beginning construction or operating its first buildings.
  - Exclude separately proposed expansions and the adjacent Microsoft campus.
  - “I bet” expresses a forecast, not an external condition.
support_condition: Documented permanent abandonment of the full original campus, with irreversible disposition of its unfinished facilities, would support the forecast.
contradiction_condition: Documented completion and energization of the full original 1.2 GW campus would contradict it.
measurement_requirements: Establish completion and energization across the entire original campus. Building shells, partial deliveries and planned capacity do not suffice.
source_requirements: Dated developer, operator, utility or commissioning records. Distinguish management statements from independently verified completion.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve upon verified full completion and energization, or irreversible abandonment of the original project. Delays, revised schedules and partial operation are not decisive.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - “Built” could refer to structural completion or operational readiness; the surrounding discussion of energization favors operational readiness.
  - “Never” has no finite deadline.
