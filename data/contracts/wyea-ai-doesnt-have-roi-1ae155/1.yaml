explicit_source_elements:
  - Anthropic
  - $8 to $13.50 in tokens for every dollar of subscription cost
  - profitable on inference
  - nobody actually has proof outside of theoretical scenarios
evaluator_interpretation:
  - The ratio concerns the API list-price equivalent of available subscription usage, not Anthropic's production costs or every subscriber's actual consumption.
  - The linked independent analysis makes the ratio an estimate, rather than a company-reported financial measure.
  - For the ongoing subscription claim, use May 2026, the last complete monthly subscription period before publication.
  - Read the profitability clause as a claim about evidence publicly available by June 2, 2026. Later disclosures cannot retroactively establish what was public then.
  - Proof means substantiated evidence of realized inference revenue exceeding attributable serving costs. An audit is sufficient but is not required by his words.
  - The metric scope describes the numerical subscription ratio. The separate profitability clause concerns the availability of evidence and supplies no accounting basis.
support_condition: Contemporaneous allowances and token prices substantiate the approximate ratio, and a sufficiently thorough review finds no substantiated public evidence of positive realized inference margins beyond hypothetical scenarios.
contradiction_condition: Comparable subscription measurements materially contradict the stated ratio, or a substantiated public disclosure available by publication establishes positive realized inference margins.
measurement_requirements: Match subscription tier, billing interval, model, input/output mix, caching treatment, and usage limits. For profitability, distinguish realized inference margins from projections, overall profits, and API list prices.
source_requirements: Dated company terms or reproducible independent subscription measurements; financial disclosures or independently substantiated reporting for inference profitability.
