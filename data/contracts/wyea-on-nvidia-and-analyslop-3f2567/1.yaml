evaluator_interpretation:
  - The plain reading is a continuing sharp decline in revenue dollars from the stated customer group, rather than merely a declining share of total revenue.
  - The surrounding discussion concerns Q4 FY2026. I use that latest reported quarter as the target period and require comparable earlier periods to establish a continuing decline.
  - Revenue outside the Magnificent 7 is not automatically interchangeable with revenue outside NVIDIA’s largest hyperscalers. Direct buyers and ultimate customers also need to be distinguished.
support_condition: Comparable revenue figures for customers outside the Magnificent 7 show a substantial continuing decline through Q4 FY2026.
contradiction_condition: Comparable figures for that same customer group show revenue growing or remaining broadly stable through Q4 FY2026.
measurement_requirements: Revenue dollars for a consistently defined customer group, with comparable prior-quarter or prior-year figures and a clear treatment of intermediaries.
