  - there isn’t enough power for the ones that are
evaluator_interpretation:
  - The ordinary reading concerns existing, compatible, powered capacity available to accommodate the identified shipment cohort.
  - Total electricity generation, announced projects and occupied conventional data-center capacity cannot automatically be treated as available Blackwell capacity.
  - For this ongoing state, November 2025 is used as the latest completed calendar month before publication. No common capacity-reporting calendar is specified.
  - The approximately 15.6 GW calculation in context is the author's estimate, not an independently established requirement.
  - Shipment counting units and the actual hardware mix must be reconciled before estimating power requirements.
support_condition: A matched assessment of the shipment cohort's requirements and existing compatible facilities establishes insufficient deployable capacity or electrical supply in the target period.
contradiction_condition: Records establish enough commissioned, compatible and electrically supplied capacity to accommodate the identified shipment cohort in the target period.
measurement_requirements: Separate IT load from facility load, commissioned from planned capacity, and available from occupied capacity. Account for rack configuration, cooling, location, power delivery and die-versus-package counts.
source_requirements: Operator and utility commissioning records, engineering specifications and a sufficiently complete capacity inventory. Regional shortages alone cannot establish a cohort-wide shortfall.
