evaluator_interpretation:
  - Assess the Bing preview available during the late-February demonstration and March 1 follow-up, through the March 2 post.
  - The plain reading is that prompting could elicit coherent false factual claims that an operator could republish with little editing.
  - This is a capability claim. It does not require evidence that a troll farm actually used Bing or persuaded an audience.
support_condition: An independently documented conversation from the relevant updated Bing version shows prompting eliciting misinformation suitable for republication.
contradiction_condition: Authenticated records establish that the alleged demonstrations were fabricated, used an earlier version, or did not produce the described misinformation. Ordinary refusals alone would not disprove the capability.
measurement_requirements: Inspect the prompt, response, conversation history, date, and evidence identifying the updated Bing version.
source_requirements: A complete contemporaneous demonstration or independent reproduction. Marcus's account alone cannot establish the outcome.
