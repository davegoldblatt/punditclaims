ambiguity_flags:
  - No growth interval is specified; the current year-to-date window is inferred from context.
  - Slowing could mean percentage growth or absolute revenue additions.
  - Outpaced could mean revenue level or growth rate.
  - Annualized revenue definitions and gross-versus-net treatment are not specified.
retrospective_or_prospective: retrospective
