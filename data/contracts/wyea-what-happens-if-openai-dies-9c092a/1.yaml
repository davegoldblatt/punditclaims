assessment_axis: historical_observation
explicit_source_elements:
  - Its revenues are slowing
  - its competitor ... has outpaced it
  - all while slowing itself
evaluator_interpretation:
  - Assess the financial proposition supplied for grading; the remark about the CEO is an opinion outside that proposition.
  - Read slowing as a declining revenue growth rate, not falling revenue.
  - Identify the competitor as Anthropic from the surrounding text.
  - Use the latest year-to-date reporting window through August 18, 2026, because the surrounding discussion compares revenue developments during 2026.
  - The surrounding discussion uses annualized revenue. Test that measure separately from realized quarterly or annual revenue.
  - Read outpaced primarily as Anthropic overtaking OpenAI in revenue run rate. Faster percentage growth is an alternative reading.
support_condition: Comparable observations show declining growth rates for both companies during the relevant recent intervals, and Anthropic exceeds OpenAI on a consistently measured revenue run rate.
contradiction_condition: Comparable observations establish accelerating recent growth for either company, or show that Anthropic has not overtaken OpenAI on the specified measure. Merely showing that revenue rose does not contradict slowing growth.
measurement_requirements: At least three dated, consistently measured observations per company to compare growth across intervals; equalize interval lengths and reconcile gross versus net partner revenue.
source_requirements: Prefer company financial disclosures. Reported private figures require consistent definitions and dates; later publications may describe the target period but later operating results are context only.
metric_scope:
  company: OpenAI
  metric: Revenue run-rate growth and relative position against Anthropic
  currency: USD
  units: billions per year and percentage growth over comparable intervals
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-08-18
  stock_or_flow: flow
  annualized_or_realized: annualized
  gross_or_net: not_applicable
