assessment_axis: forecast_outcome
explicit_source_elements:
  - The products aren't coming
  - models that would at some point become useful
  - something revolutionary
evaluator_interpretation:
  - The ordinary contextual reading concerns substantial useful applications beyond those already available at publication.
  - A qualifying application must be publicly available, sustain substantial adoption, and have documented practical use. A model announcement alone is insufficient.
  - The claim does not require every new application to succeed or prove industry-wide profitability.
  - No deadline is supplied.
support_condition: Definitive abandonment of the relevant product-development effort occurs before substantial useful new applications emerge.
contradiction_condition: A new generative AI application becomes available after the post, sustains substantial adoption, and demonstrates practical value in actual use.
measurement_requirements: A release date, evidence of continued adoption beyond launch, and documented customer use or measured practical outcomes.
source_requirements: Dated release and adoption records, plus customer or independent evidence of practical use. Vendor-hosted customer reports must be identified as such.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: The categorical negative is contradicted once a post-publication application has both sustained substantial adoption and documented practical value. The resolution date is when the evidence establishes those conditions together.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Products is qualified by context rather than an explicit usefulness or adoption threshold.
  - A stricter requirement of economy-wide transformation would produce a different test.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
