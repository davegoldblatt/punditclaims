explicit_source_elements:
  - the failure is of the lords of deep learning
  - to resolve what ails their AI
  - 26 months later (since the 'Deep Learning is Hitting a Wall' essay)
  - reliability is still a dream
  - toxicity and hallucinations are still with us
evaluator_interpretation:
  - "'What ails their AI' is read from the post's own list: unreliability, hallucinations and toxicity in leading deep-learning systems such as large language models."
  - "'Failure to resolve' is read as: by the post date, leading developers had not eliminated these problems, so their flagship systems still made confident factual errors. Progress or partial reductions do not count as resolution."
  - The separate claim that we are 'no closer' on alignment is not graded here. Only the narrower claim that the problems remained unresolved is graded.
  - The target period runs from the March 2022 essay to the post date, 2024-06-01.
support_condition: Developer statements or independent evaluations from the period showing that leading deep-learning systems still hallucinated or were unreliable as of mid-2024.
contradiction_condition: Credible evidence that by June 2024 leading developers had effectively eliminated hallucinations and unreliability in their flagship systems, such as evaluations showing near-zero factual error rates in normal use.
