explicit_source_elements:
  - Microsoft, Meta, Google, Apple, Amazon and Tesla
  - aren't making much money from AI
  - losing billions of dollars on whatever revenues they do make from it
evaluator_interpretation:
  - The plain reading is that the named companies' AI activities generate substantial losses after attributable costs, rather than merely requiring substantial investment.
  - The context concerns generative AI. Profits from older advertising or recommendation systems cannot automatically settle the claim.
  - "Use the latest generally reported quarter before publication: the quarter ending in March 2025. Apple's corresponding fiscal quarter ended March 29."
  - The wording does not establish whether billions refers to each company, their combined losses or an annual pace. Check company-specific results and aggregation without silently annualizing.
  - No accounting basis is stated or identified in the supplied passage.
support_condition: Comparable AI-specific revenues and attributable expenses establish multibillion-dollar losses on the stated scope, with the individual-versus-combined interpretation made explicit.
contradiction_condition: Comparable AI-specific financial results establish material profits or otherwise exclude the claimed multibillion-dollar losses on the same scope and period.
measurement_requirements: Match AI revenues with operating costs, depreciation, research expenses and other allocated costs on a consistent basis. Do not subtract total capital expenditure from revenue or substitute whole-company and cloud-segment profits for AI profits.
source_requirements: AI-specific company disclosures or credible estimates with transparent allocation methods for the six named companies.
