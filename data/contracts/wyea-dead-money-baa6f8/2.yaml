evaluator_interpretation:
  - In context, he lists Cursor ($4 billion annualized), Perplexity, and Cognition ($1 billion annualized) just before this sentence. So he is not denying that other AI companies have revenue.
  - "'Meaningful' is measured against the scale needed to justify hyperscaler capex, which he puts at hundreds of billions a year. Whether a few billion counts as 'meaningful' on that scale is a judgment, not a fact a source can confirm or refute."
  - An absolute reading ('no other AI company has substantial revenue') would ignore the comparison he himself draws. It would be unfair to the speaker.
  - So the statement is treated as an evaluative judgment that cannot be graded.
support_condition: Not applicable. 'Meaningful' is an undefined, scale-relative judgment.
contradiction_condition: Not applicable. Other companies' revenues, which he acknowledges, do not refute a judgment that they are not meaningful against capex scale.
