assessment_axis: historical_observation
explicit_source_elements:
  - basically have zero
  - meaningful revenue-generating AI companies
  - outside of Anthropic and OpenAI
evaluator_interpretation:
  - The plain reading is that other AI-native application and model companies lack substantial commercial sales, rather than merely lacking profits.
  - The context limits the population to AI-native businesses selling applications or models, rather than all established companies using AI or selling infrastructure.
  - Meaningful ordinarily means substantial ongoing customer revenue; it does not require matching the scale of Anthropic, OpenAI, or aggregate hyperscaler capex.
  - "Because no reporting period is named, use the latest completed calendar quarter that could have been publicly reported before September 29: April–June 2026."
  - A screen's suggested multi-billion-dollar annual threshold is not adopted as though the speaker supplied it.
support_condition: Broad, credible revenue evidence for the relevant population shows that other companies had only negligible or incidental commercial sales during the target period.
contradiction_condition: Credible realized-revenue records establish a material business, or several businesses, with substantial ongoing application or model sales outside Anthropic and OpenAI during the target period.
measurement_requirements: Use realized customer revenue for the target period. Do not substitute funding, valuation, bookings, profitability, or an annualized run rate for realized revenue.
source_requirements: Prefer company financial disclosures. Reputable reporting of private-company revenue may be used with its estimated basis identified; support for near-absence requires broad coverage.
