explicit_source_elements:
  - The only thing keeping it from being even more toxic and deceitful
  - Reinforcement Learning by Human Feedback
  - OpenAI has been very closed about exactly how that really works
evaluator_interpretation:
  - ChatGPT means the deployed product, including its content safeguards, rather than only the underlying model weights.
  - RLHF includes the usual demonstration, preference-ranking, and reinforcement-learning pipeline. Supervised fine-tuning is not counted as a separate safeguard merely to manufacture a contradiction.
  - The exclusivity claim requires RLHF to be the sole effective protection against additional harmful behavior.
  - Closed about exactly how is read as withholding ChatGPT-specific implementation details, not as saying no general RLHF explanation existed.
  - The relevant implementation is the publicly deployed system from launch through the post.
support_condition: Evidence establishes that only RLHF restrained the deployed system's harmful behavior and that ChatGPT-specific implementation details were substantially undisclosed.
contradiction_condition: Documentation establishes an additional deployed protective mechanism, or sufficiently complete ChatGPT-specific disclosures contradict the secrecy claim. A contradiction of exclusivity does not by itself disprove limited disclosure.
measurement_requirements: Distinguish model training from deployed filtering. Controlled ablations would establish comparative effects; documentation can establish that additional protections were deployed.
source_requirements: Use contemporaneous implementation documentation, original research, or directly reported company confirmation. Treat InstructGPT results as context rather than ChatGPT ablations.
