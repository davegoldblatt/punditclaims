explicit_source_elements:
  - creating interactive fiction
  - trained to predict the language of actual beings
evaluator_interpretation:
  - In context, 'interactive fiction' means generated conversational characters rather than genuine experiencing interlocutors; it does not mean every factual answer is false.
  - Language-prediction training and conversational simulation are checkable components. They do not alone settle the stronger claim that the interlocutor is merely fictional.
  - The statement concerns systems existing by 2026-05-31. There is no reporting cadence or specified historical starting date, so assess the pre-post record.
support_condition: Evidence establishes language-prediction training and conversational simulation, and independently supports the stronger distinction between a simulated character and an experiencing entity.
contradiction_condition: Reliable evidence establishes genuine experience in a relevant LLM interlocutor, or establishes that the asserted training-and-simulation characterization materially misdescribes the systems covered.
measurement_requirements: Separate training objectives, generated personas, and subjective experience. Neither fluent self-reports nor the prediction objective alone settles subjective experience.
source_requirements: Primary descriptions of training and dialogue behavior, plus independently justified criteria and evidence for any conclusion about experience.
