  - Way longer supplies no delay threshold.
  - Expected does not identify a baseline schedule.
  - Publication-month reporting window is an evaluator interpretation of the ongoing state.
  - Interest piling up could mean ordinary accrual, capitalized interest or incremental financing costs.
  - The financial assertion has no specified accounting basis.
