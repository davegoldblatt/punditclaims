assessment_axis: causal_assessment
explicit_source_elements:
  - These things aren’t getting built
  - taking way, way longer than expected
  - interest on that debt is piling up
evaluator_interpretation:
  - These things refers to the debt-financed AI data center projects discussed in the surrounding passage.
  - The ordinary causal reading is that material construction delays extend the period of interest incurred before facilities begin operating.
  - The current-state assessment uses March 1–24, 2026, the publication-month window for construction and financing updates. Earlier observations are context unless they establish a continuing condition in that window.
  - Longer than expected requires comparison with an original completion or delivery schedule, not simply a long construction period.
  - Interest accruing under normal loan terms does not alone establish additional interest caused by delay.
  - No company-wide accounting basis or quantified incremental interest amount is supplied.
support_condition: Matched records across the referenced projects show material delays against original schedules, debt outstanding during those delays, and additional pre-operation interest attributable to the extended construction period.
contradiction_condition: Matched records show the referenced projects broadly meeting their original schedules, or show that delays did not extend the relevant interest-bearing period or increase pre-operation interest. One successful project would not settle the broad assertion.
measurement_requirements: Compare original and actual milestones, debt draw dates, interest terms, balances and repayment or refinancing schedules. Separate ordinary financing costs from incremental costs caused by delay.
source_requirements: Project schedules and progress records matched to loan agreements and interest disclosures. Aggregate pipeline figures and company-wide interest expense are insufficient by themselves.
