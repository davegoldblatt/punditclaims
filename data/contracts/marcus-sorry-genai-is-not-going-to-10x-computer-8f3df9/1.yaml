explicit_source_elements:
  - The data are coming in
  - improving programmer productivity by a factor of 10
  - and it’s not
evaluator_interpretation:
  - Assess the empirical evidence available by October 1, 2024, including earlier studies expressly invoked in the context. No starting date for that evidence is specified.
  - The ordinary reading concerns measured programmer productivity in studied populations, not whether an individual task or programmer could ever achieve a tenfold gain.
  - Tenfold productivity means ten times the baseline output per unit of time, equivalent to a 900% increase.
  - This is an observation about the evidence then, not a forecast about future tools.
support_condition: Contemporaneous empirical comparisons find productivity effects substantially below tenfold, including studies reporting meaningful benefits.
contradiction_condition: Credible contemporaneous studies establish approximately tenfold gains in overall programmer productivity across ordinary programming work.
measurement_requirements: Compare assisted and unassisted work using completed output or task-completion time. Distinguish narrow-task speed from overall programmer productivity.
source_requirements: Primary empirical studies or their authors' reports available by the post date. Later tools and later experimental results cannot settle this historical observation.
