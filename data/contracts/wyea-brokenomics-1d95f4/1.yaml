assessment_axis: causal_assessment
explicit_source_elements:
  - AI labs were intentionally obfuscating the costs of subscriptions
  - heavily subsidizing users’ compute
  - the moment that that changed
  - everything would begin to fall apart
  - has it finally begun
evaluator_interpretation:
  - The context principally identifies OpenAI and Anthropic, rather than every AI provider.
  - The ordinary reading is that deliberate cost opacity and substantial below-cost usage supported demand, and withdrawing that support caused material customer or commercial deterioration.
  - The recent causal episode runs from the alleged early-Q1 billing changes through June 15. Earlier subsidy practices are background, not a separately dated financial observation.
  - Material deterioration means measurable cancellations, reduced usage, or worsening commercial results. Complaints alone are insufficient.
  - A discount from API list prices is not necessarily a subsidy relative to the provider's actual costs.
support_condition: Evidence establishes deliberate concealment, substantial below-cost service, withdrawal of that support, and ensuing material deterioration attributable to the withdrawal rather than competing explanations.
contradiction_condition: Reliable evidence shows a central asserted link is false, such as no actual subsidy withdrawal, no material deterioration among affected customers, or deterioration caused by another documented factor.
measurement_requirements: Match dated billing changes to actual provider costs and affected customer cohorts. Measure subsequent churn, usage, and commercial results while accounting for capacity limits, product changes, competition, and regulation.
source_requirements: Dated billing records, actual cost data, customer cohort measurements, and direct evidence of intent. Company announcements and customer anecdotes alone cannot establish the complete causal chain.
