explicit_source_elements:
  - AI labs
  - 90%+ inference margins
  - a completely unproven statement
evaluator_interpretation:
  - This concerns whether the margin assertion had been substantiated publicly by publication, not whether such margins are economically possible.
  - The plain reading of inference margin is inference revenue less attributable serving costs, divided by inference revenue, excluding training and unrelated corporate expenses.
  - Allow evidence for the specific lab, product or API business actually covered by the margin assertion; do not require company-wide net profitability.
  - Use July 15, 2026 as a snapshot of the public evidence record. A financial reporting quarter would answer a different question.
  - Audited accounts would be strong evidence, but credible disclosures or independently substantiated measurements could also demonstrate the figure.
support_condition: A sufficiently comprehensive examination of the relevant public claims and their underlying evidence establishes that the 90%+ assertions remained assumptions or unsupported estimates as of July 15, 2026.
contradiction_condition: At least one relevant 90%+ inference-margin assertion had already been demonstrated through disclosed or independently substantiated revenue and serving-cost figures on a matching basis.
measurement_requirements: Identify the lab, product coverage, period, actual revenue, attributable inference costs and margin denominator. Distinguish realized margins from list-price scenarios, markups and forecasts.
source_requirements: Use original financial disclosures or reproducible independent analysis with substantiated inputs. Repetition by investors is not independent confirmation.
