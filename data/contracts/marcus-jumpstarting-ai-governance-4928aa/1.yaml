explicit_source_elements:
  - In just a few short months
  - the race to regulate AI
  - possibly at an international level
  - from barely on the table to heated
evaluator_interpretation:
  - "I read this as two commitments: AI regulation had recently been marginal, and it had become a high-priority political issue by publication."
  - I use January 1 through July 8, 2023, to represent the unspecified few months preceding the post.
  - Heated means sustained, high-level government activity and international discussions. It does not require enacted legislation.
  - The claim concerns AI regulation generally, rather than only newly proposed international supervision of frontier models.
support_condition: Contemporaneous records show both a marginal early-2023 baseline and a substantial escalation into high-level regulatory activity by July 8.
contradiction_condition: Records show substantial regulatory negotiations already underway early in the period, or show no meaningful escalation by publication.
measurement_requirements: Compare dated legislative, diplomatic and executive activity across the period. Distinguish political prominence from the existence of regulatory work.
source_requirements: Prefer contemporaneous government announcements and legislative or negotiating records.
