assessment_axis: historical_observation
explicit_source_elements:
  - the draft EU AI Act
  - is in serious jeopardy
  - Breaking news
evaluator_interpretation:
  - Assess the negotiating situation on 10 November 2023, the post date. This is an immediate observation, not a prediction that the Act would ultimately fail.
  - The ordinary reading of serious jeopardy is a substantial threat to securing agreement, evidenced by a breakdown in negotiations or unresolved opposition over essential provisions.
  - The separate, qualified suggestion of regulatory capture is outside this claim's normalized proposition.
support_condition: Negotiating records or credible reporting establish that substantive opposition had disrupted negotiations and materially threatened agreement as of 10 November 2023.
contradiction_condition: Records establish that the alleged breakdown or substantive opposition did not occur, or that agreement was secure and the remaining disagreements were routine.
measurement_requirements: Identify the disputed provisions, the negotiating parties' positions, and their effect on reaching agreement. Eventual passage alone cannot establish whether an earlier threat was serious.
source_requirements: Prefer public negotiating records and attributable participant accounts. Use reputable reporting when records of the closed negotiations are unavailable.
