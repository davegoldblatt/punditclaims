ambiguity_flags:
  - As sold identifies no fixed set of advertisements or promises.
  - Fundamentally broken has no stated performance threshold.
  - Every and for the most part express different strengths within the same passage.
  - The population and weighting of marketed agents are unspecified.
  - The observation period is unspecified; the latest completed quarter is an evaluator choice.
  - The asserted causal link between failures and public visibility is separate from product performance.
