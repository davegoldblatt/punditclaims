assessment_axis: historical_observation
explicit_source_elements:
  - AI agents do not, as sold, actually exist.
  - Every “AI agent”
  - a chatbot talking to another chatbot connected to an API and a system of record
  - for the most part
  - fundamentally broken
evaluator_interpretation:
  - The plain reading is that most marketed agents materially fail to deliver their advertised autonomous capabilities.
  - As sold requires matching actual product promises to tested behavior, including any stated limits or need for supervision.
  - For the most part concerns prevalence among marketed systems. It is not interchangeable with the percentage of difficult benchmark tasks that fail.
  - The chatbot description is treated as an architectural assertion, not proof that the resulting system cannot work.
  - Use January through March 2026, the latest completed quarter before the post, because the ongoing observation names no reporting period.
  - The passage also offers a causal explanation for a supposed lack of public achievements. Neither that absence nor its cause is established by a capability benchmark.
support_condition: A reasonably representative comparison of marketed products and their contemporaneous promises shows that most materially fail to deliver their advertised autonomous functions under the stated operating conditions.
contradiction_condition: A reasonably representative comparison shows that most deliver their advertised functions under the stated conditions. Individual successes challenge an absolute nonexistence reading but cannot establish the market-wide majority.
measurement_requirements: Identify the product population, preserve advertisements and product versions, test promised tasks repeatedly, and distinguish task failures, deployment failures, and misleading marketing.
source_requirements: Contemporaneous marketing paired with reproducible product tests or independently verified deployment records. A causal verdict would additionally require evidence explaining the visibility of achievements.
