contradiction_condition: An equivalent record for the same observation time and rolling window shows materially different percentages. Different snapshots or isolated incidents do not suffice.
measurement_requirements: Match all four components, the rolling window, partial-outage treatment, and rounding. Do not substitute request success rates or incident counts for displayed uptime.
source_requirements: Prefer an archived official status page or official historical component records. Independent preservation must establish the snapshot date and provenance.
