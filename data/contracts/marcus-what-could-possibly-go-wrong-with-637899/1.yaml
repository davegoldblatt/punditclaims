evaluator_interpretation:
  - The passage describes the initial February 2023 demonstration and the vulnerability's persistence through the February 9, 2024 post.
  - The ordinary reading of unresolved is that indirect prompt injection remained a viable general attack class, not that no useful mitigation existed.
  - The relevant systems are LLM applications that ingest external content; the claim need not hold for every model in every configuration.
support_condition: A February 2023 research demonstration establishes indirect prompt injection, and research available before the post shows continuing vulnerability despite incomplete or limited defenses.
contradiction_condition: The cited discovery did not occur as described, or evidence establishes that reliable defenses had generally eliminated the vulnerability by February 9, 2024.
measurement_requirements: Demonstrated manipulation through attacker-controlled external content, with defenses assessed under stated models, tasks and attack conditions.
source_requirements: Original research and reproducible demonstrations. Use versions published before the post when establishing the historical state.
