ambiguity_flags:
  - Ready to go could refer to energization, commissioning, or operation.
  - Delivered does not specify installation or availability for workloads.
  - The normalized proposition adds an explicit behind-schedule conclusion.
  - Mid-2026 is not an exact date.
  - Current operational status is assessed using the latest pre-publication update.
