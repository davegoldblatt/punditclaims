assessment_axis: historical_observation
explicit_source_elements:
  - Only the first two-buildings’ worth of 96,000 GPUs
  - “delivered” by the middle of December 2025
  - the entire project was meant to be energized by mid-2026
  - only two buildings are actually ready to go
evaluator_interpretation:
  - The claim concerns the original eight-building Abilene campus, excluding subsequent adjacent expansion projects.
  - Ready to go means operational for customer computing workloads.
  - The target covers the 2025 milestones discussed in context and the latest operational status before publication on March 17, 2026.
  - Mid-2026 is a previously announced project milestone, not a forecast made by this claim.
  - The normalized assertion of being behind schedule requires a missed milestone or evidence that the then-current schedule had slipped. Two operating buildings before the remaining buildings' deadline is insufficient by itself.
support_condition: Records substantiate the December equipment-delivery description, only two operational buildings near publication, and the original mid-2026 energization target. Supporting the broader delay characterization additionally requires demonstrated schedule slippage by publication.
contradiction_condition: Records establish materially more operational buildings near publication, an incompatible December delivery count, no such original target, or timely achievement of the milestone alleged to have been missed.
measurement_requirements: Distinguish GPU delivery, installation, energization, commissioning, and operational workloads. A reported minimum chip count is not an upper bound or a building-completion certificate.
source_requirements: Dated operator or customer disclosures and construction records. Reputable reporting may relay statements when a readable primary copy is unavailable.
