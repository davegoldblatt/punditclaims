assessment_axis: historical_observation
explicit_source_elements:
  - Perplexity
  - had three years and a billion dollars
  - doesn't seem to be close to profitable
evaluator_interpretation:
  - "'Doesn't seem' is a hedge, so the claim is about how Perplexity's finances looked on the public record at the post date, not an audited test."
  - "'Close to profitable' has no threshold. It is read as near break-even: losses small relative to revenue, or a credible report of imminent profitability. A company whose spending far exceeds its revenue does not seem close."
  - No period is named. The test uses the most recent financials public reporting covered before the post, which was full-year 2024 (reported July 2025), plus any reporting up to the post date. This is an evaluator choice.
support_condition: Public reporting available by the post shows Perplexity losing or burning money at a level large relative to its revenue, with no credible report that it was near break-even.
contradiction_condition: Credible reporting available by the post shows Perplexity at or near break-even, or close to profitability, in its most recent reported period.
measurement_requirements: Reported revenue against reported losses or cash burn for the most recent period public reporting covered before 2025-08-06.
source_requirements: Credible news reports of Perplexity's financials published on or before 2025-08-06. Perplexity is private and does not publish its accounts.
