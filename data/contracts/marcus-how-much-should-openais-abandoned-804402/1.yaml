ambiguity_flags:
  - "'Now' supplies no precise observation period; September 2024 is the evaluator's contemporaneous window."
  - "'OpenAI' can refer to the nonprofit parent, its operating business, or the whole organization."
  - "'Renege' combines a factual structural change with a judgment about promises."
  - The sentence does not distinguish removing nonprofit control from eliminating the nonprofit altogether.
