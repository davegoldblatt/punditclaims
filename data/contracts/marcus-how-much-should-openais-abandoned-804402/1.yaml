assessment_axis: historical_observation
explicit_source_elements:
  - Now
  - OpenAI wants to
  - renege on its promises
  - become a for-profit
  - promised to be a non-profit, pledged to public benefit
evaluator_interpretation:
  - The ordinary factual reading is that OpenAI was pursuing a restructuring that would move its core business outside nonprofit control. The claim concerns intent, not a completed conversion.
  - I interpret 'renege' as a proposed departure from the announced nonprofit structure. Whether that departure constitutes a legal breach or moral betrayal is not independently scored.
  - Because 'now' describes an ongoing organizational decision rather than a reporting-period metric, I use September 2024, the current month through the September 30 post.
  - Becoming a for-profit does not necessarily mean dissolving every nonprofit entity associated with OpenAI.
support_condition: Reliable contemporaneous evidence shows that OpenAI was pursuing a restructuring of its core business into a for-profit company outside nonprofit control, departing from its previously announced governance structure.
contradiction_condition: Reliable contemporaneous evidence establishes that OpenAI was not pursuing that change, or that the reported proposal expressly preserved nonprofit control throughout.
measurement_requirements: Distinguish consideration or pursuit from approval or completion, and distinguish nonprofit ownership from nonprofit control.
source_requirements: Prefer dated company statements or governance documents. Contemporaneous reputable reporting with sources familiar with the discussions can establish plans that were not publicly documented.
