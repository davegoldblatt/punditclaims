assessment_axis: causal_assessment
explicit_source_elements:
  - The only reason
  - every app has an AI feature
  - every AI company can still sell
  - $20, $100, or $200-a-month subscription
  - venture capital has yet to walk away
  - eternal subsidies
evaluator_interpretation:
  - The plain reading is that commercial generative-AI features and subscriptions universally require continuing venture-capital subsidies.
  - The listed prices illustrate consumer subscription tiers; they are not an exhaustive restriction to products charging exactly those amounts.
  - A provider operating a paid generative-AI business without outside investors is a counterexample to universal dependence on venture capital. Historical receipt of investment alone does not establish continuing dependence.
  - Use January through March 2026, the latest completed quarter before the post, to assess the ongoing commercial state.
  - Treat eternal subsidies as an assertion of continuing necessity, not a separately dated forecast.
support_condition: Evidence establishes that commercial generative-AI features and subscriptions across the claimed population cannot continue without venture-capital funding, including relevant upstream subsidies.
contradiction_condition: A documented commercial generative-AI provider sustains its paid product without venture-capital subsidies, providing a counterexample to the universal causal claim.
measurement_requirements: Provider funding history, operating sustainability, paid-product availability, and evidence distinguishing self-funded model provision from an application merely buying subsidized third-party APIs.
source_requirements: Prefer company financial disclosures and funding records. Clearly identified reporting may establish a private company's funding status when primary financial records are unavailable.
