assessment_axis: historical_observation
explicit_source_elements:
  - “the only AI model”
  - “appears to be available”
  - “for classified military operations”
evaluator_interpretation:
  - Anthropic refers to its Claude model family.
  - The context concerns publicly known general-purpose frontier models in U.S. military classified systems, not every specialized military AI system worldwide.
  - Available ordinarily means operationally accessible in those systems. An agreement to deploy a model does not necessarily establish operational availability.
  - This is an ongoing state without a reporting period. Use March 2, 2026, the last completed calendar day before the post, as the historical snapshot.
  - Appears limits the claim to what the public record reasonably indicated.
support_condition: Reliable evidence establishes that Claude was operationally available in U.S. classified military systems during the target period and was the only publicly known frontier model available there.
contradiction_condition: Reliable evidence identifies another frontier model operationally available in the same classified military setting during the target period.
measurement_requirements: Distinguish operational deployment from a signed agreement, approval, planned deployment and availability on unclassified systems.
source_requirements: Deployment or authorization records with implementation dates; reputable reporting may substitute where classified deployment records are unavailable.
