assessment_axis: historical_observation
explicit_source_elements:
  - I am seeing
  - little evidence
  - actual adoption
evaluator_interpretation:
  - Assess the implied claim about publicly available evidence, not the speaker's private reading history.
  - Actual adoption means deployed business use rather than announcements, experiments or downloads alone.
  - Use January–March 2024, the latest completed reporting quarter before publication, for this ongoing observation.
  - The surrounding examples include both generative AI and broader AI. Broader-AI surveys are relevant but cannot directly measure generative-AI penetration.
  - Limited adoption and little evidence of adoption are different propositions; low penetration does not imply an absence of documented deployments.
support_condition: Representative evidence shows limited deployed business use, with little documented sustained deployment beyond experiments.
contradiction_condition: Representative evidence or sufficiently broad documented production use establishes substantial actual business adoption by the post date.
measurement_requirements: Identify the population, survey period and meaning of use. Separate business prevalence, depth of deployment and evidence quality.
source_requirements: Representative surveys and dated deployment records available before publication; company adoption claims must be identified as self-reported.
