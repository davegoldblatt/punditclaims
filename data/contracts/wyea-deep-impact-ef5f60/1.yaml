explicit_source_elements:
  - The hyperscalers hold all the cards
  - the GPUs and the infrastructure
  - Microsoft, non-revocable licenses
  - unfettered use and access to OpenAI’s tech
  - little stopping them building their own models and dumping GPT and Claude
evaluator_interpretation:
  - Hyperscalers means Microsoft, Amazon and Google, as identified in the preceding sentence.
  - The ordinary reading concerns practical capacity and contractual freedom to replace model suppliers, not literal ownership of every bargaining advantage.
  - Unfettered and non-revocable are separate licensing assertions; substantial access alone does not establish either.
  - Little stopping them describes the asserted current absence of barriers. It is not a conditional forecast that they will actually terminate partnerships.
  - Use January 2025 through the post date for the ongoing technical and contractual state.
support_condition: Evidence establishes substantial infrastructure and model-development capacity, Microsoft licensing rights of the stated breadth, and no material technical or contractual obstacles to replacing GPT and Claude.
contradiction_condition: Evidence establishes material restrictions on the stated Microsoft rights or significant technical or contractual obstacles to replacing the suppliers during the target period.
measurement_requirements: Separate infrastructure ownership, demonstrated model capability, license scope, revocability and the practical cost of replacing production deployments.
source_requirements: Contemporaneous agreements or authoritative descriptions of their terms, infrastructure disclosures and model evaluations. Later renegotiated terms must not be substituted for January terms.
