evaluator_interpretation:
  - The ordinary profitability reading is company-level net income after expenses, not EBITDA or gross margin.
  - Use July–September 2026, the latest quarterly period ordinarily reportable before the November 17 post.
  - Woefully indicates substantial losses, but supplies no numerical cutoff.
  - Every neocloud is a universal assertion, not merely a statement about the three named companies.
  - The sarcastic discussion of possible future margins is not a dated forecast.
support_condition: Comparable net-income records show substantial losses for the named companies and the defined neocloud population in the target quarter.
contradiction_condition: A qualifying neocloud reports positive net income on the same accounting basis for the target quarter. Positive EBITDA or adjusted profit alone does not refute a net-income reading.
measurement_requirements: Define the neocloud population and accounting basis; compare quarterly net income and loss margins without substituting operating profit or adjusted EBITDA.
