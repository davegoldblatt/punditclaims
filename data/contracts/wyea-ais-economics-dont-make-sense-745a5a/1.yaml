assessment_axis: forecast_outcome
explicit_source_elements:
  - If OpenAI can’t raise $852 billion in revenue and funding
  - by the end of 2030
  - it won’t be able to pay for Stargate
  - kill the value of Oracle’s stock
  - a series of margin calls
  - Ellison having to sell shares
  - further margin calls
evaluator_interpretation:
  - The antecedent is cumulative revenue plus funding below $852 billion by December 31, 2030.
  - The provided passage does not specify the accumulation start date or the accounting basis. These are left unresolved rather than silently chosen.
  - The ordinary reading counts realized revenue and funding actually obtained, not annualized revenue, company valuation, or unfulfilled financing commitments.
  - The forecast requires the stated causal sequence. An Oracle price decline or an unrelated Ellison share sale would not suffice.
  - The end-2030 deadline explicitly governs the financial threshold. No separate deadline is supplied for the subsequent consequences.
  - The specific rule for an unknown conditional antecedent prevents scoring the forecast while that condition remains unknown.
support_condition: Comparable records establish a cumulative total below $852 billion at the stated deadline, followed by inability to meet Stargate payments causing a severe Oracle stock-value collapse, margin calls, forced Ellison share sales, and further margin calls.
contradiction_condition: After the antecedent is established, reliable records demonstrate that OpenAI can meet the relevant Stargate obligations despite the shortfall, or conclusively disprove a necessary link in the predicted causal sequence. Reaching the threshold makes the conditional forecast inapplicable rather than false.
measurement_requirements: Define the accumulation start and accounting basis; reconcile realized revenue and actual financing without counting valuation or undrawn commitments. Obtain payment obligations, payment records, stock-price evidence, collateral terms, margin-call records, and forced-sale evidence.
source_requirements: Prefer company financial records, financing and payment agreements, filings, lender records, and authenticated transaction disclosures. Price movements alone cannot establish the causal chain.
