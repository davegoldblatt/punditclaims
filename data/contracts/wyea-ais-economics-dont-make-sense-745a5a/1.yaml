  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires an irreversible event that fixes the final cumulative shortfall and conclusively establishes or precludes the required consequences. Interim fundraising, stock declines, pledges, or share sales do not meet this rule.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The accumulation start date is unspecified; the surrounding phrase four years does not supply an exact boundary.
  - The accounting basis and treatment of debt, committed financing, and existing resources are unspecified.
  - Kill the value supplies no numerical stock-price threshold.
  - Stargate payment obligations are not identified individually.
  - No deadline or allowed lag is supplied for consequences after the end-2030 condition.
