evaluator_interpretation:
  - Today means November 16, 2026; last week means the trading sessions of November 9–13.
  - Tech stocks means a broad set of technology shares, checked against a technology-heavy index and named sector constituents.
  - The plain reading requires substantial selling today following a substantial selloff during the preceding week. It does not necessarily assert a negative return for that entire week.
  - Sharp and rout describe substantial, broad selling rather than a small routine fluctuation; no numerical threshold is supplied.
support_condition: Dated market reports show substantial technology-stock selling on November 16 and a broad technology selloff during November 9–13.
contradiction_condition: Technology shares were broadly stable or rising on November 16, or no substantial technology selloff occurred during the preceding trading week.
measurement_requirements: Keep intraday moves, daily returns, and full-week returns separate. Check breadth rather than relying solely on Nvidia.
