  - Authoritative-sounding has no defined measure.
  - Truthfulness can be measured through generated answers or multiple-choice recognition, which are not interchangeable.
  - The historical starting date is unspecified.
  - Increasing parameter count also changes training compute; available experiments do not isolate every possible causal factor.
