evaluator_interpretation:
  - The statement evaluates the TED 2023 talks retrospectively as of April 15, 2024. 'So far' is not a deadline supplied by the original speakers.
  - The surrounding post points to Brockman, Khan and Chaudhri, but combines broad aspirations, demonstrations and product performance.
  - There is no stable aggregate test for which pronouncements count, what degree of realization counts, or how successful demonstrations and unmet ambitions should be combined.
  - Individual propositions can be assessed separately; selecting and weighting them would create a new claim rather than faithfully score this summary.
support_condition: No non-arbitrary aggregate support condition can be fixed from this wording. A checkable version would need identified commitments and their own success criteria, evaluated as of the post date.
contradiction_condition: No non-arbitrary aggregate contradiction condition can be fixed. Demonstrating one capability would not necessarily realize the aspirations, while one product failure would not disprove all the pronouncements.
measurement_requirements: An explicit set of propositions, success criteria and a rule for combining their outcomes.
source_requirements: Original talks or reliable transcripts to establish commitments, followed by period-matched capability and educational-outcome evidence.
