explicit_source_elements:
  - "\"It's a routine occurrence\""
  - lawyers using tools like ChatGPT ... shocked when it makes up cases
  - "\"some sort of anomaly. It's not.\""
  - '"All those examples are just this month" (May 2025)'
  - Charlotin's database lists 112 cases
evaluator_interpretation:
  - "Plain reading: in spring 2025, courts were finding AI-made-up citations in legal filings again and again, across many unrelated cases and courts. They were not a rare, one-off anomaly."
  - He named no period. The context ('just this month') points to May 2025, the month of the post. I use May 2025 as the target period.
  - He named no number. I treat 'routine' as met if public records show many separate court findings within that month, on the order of several per week, across different courts and filers.
  - The claim is about whether such incidents happen often. It is not a claim about what share of all filings contain them.
support_condition: Dated court records or compilations show many independent court findings of AI-hallucinated citations in May 2025 (for example, dozens in the month, across different courts and filers, including lawyers).
contradiction_condition: Records show only isolated or very rare court findings of AI-fabricated citations in May 2025 (for example, a handful at most), consistent with an anomaly rather than a regular pattern.
measurement_requirements: Count of court decisions in May 2025 that found AI-hallucinated legal content, from Charlotin's database or reporting on it, plus dated individual court rulings.
source_requirements: Charlotin's AI Hallucination Cases database, court orders, or reputable legal or news reporting on those records.
