explicit_source_elements:
  - content creators, content owners, need to benefit
  - ever since
  - pushing for free training materials
  - exemption from copyright laws
evaluator_interpretation:
  - The period begins with the May 16, 2023 testimony and ends with the May 16, 2025 post.
  - Read 'free training materials' as advocating training access without a general requirement to obtain permission or pay copyright royalties.
  - In the training context, read 'exemption' as seeking protection from copyright liability for training, including through fair use. Do not read it as immunity for every output or every business activity.
  - "'Ever since' means a sustained position during the intervening period, not documented advocacy on every day."
  - The contrast with creator benefits does not itself establish dishonesty or a promise to pay for every training use.
support_condition: Altman expressed support for creator benefits, and subsequent OpenAI positions advocated training on copyrighted works without generally required licensing or royalties.
contradiction_condition: OpenAI's subsequent position required permission and payment for copyrighted training generally, rather than advocating fair-use protection or a training exception.
measurement_requirements: Separate advocacy about training from output infringement, voluntary licensing, and whether courts ultimately accepted the legal arguments.
source_requirements: Testimony plus OpenAI's copyright submissions or public policy statements; include licensing and creator-benefit counterevidence.
