assessment_axis: historical_observation
explicit_source_elements:
  - Every organization I’ve talked to
  - has exceeded or is nearing the edge
  - their annual token budget
  - barely five months into the year
evaluator_interpretation:
  - The population is the author's interview sample, not all organizations using AI.
  - The observation covers spending from January 1 through the May 19, 2026 publication date against each organization's full-year 2026 budget.
  - The ordinary reading of 'nearing the edge' is that little of the annual allocation remains. No precise percentage is supplied, so borderline cases require clarification.
  - The budget's accounting basis and whether it covers all AI tokens or particular vendors are unspecified.
support_condition: Identify the complete interview sample and obtain comparable budget and spending records showing that every organization had exceeded or nearly exhausted its relevant annual allocation by May 19, 2026.
contradiction_condition: Establish that at least one organization in that interview sample still had a substantial portion of its relevant annual allocation remaining on the applicable interview date.
measurement_requirements: For each organization, obtain its original annual allocation, any revisions, actual cumulative spending, measurement date, and included vendors and services. Compare like-for-like spending with the corresponding budget.
source_requirements: An authenticated interview roster and independently verifiable company records or attributable confirmations. Other companies' experiences cannot establish membership in the author's sample.
