explicit_source_elements:
  - if the demand does not exist at this remarkable scale
  - the vast majority
  - AI data centers and their associated SPVs
  - will collapse
  - 190GW of data center capacity in planning
evaluator_interpretation:
  - Assess the conditional forecast, not the parenthetical assertion about current profitability.
  - The condition is a sustained shortfall in paying AI compute demand relative to the buildout described in the post.
  - Collapse means insolvency, financial default or permanent closure for financial reasons. A delay or an unbuilt proposal alone does not qualify.
  - Vast majority means an overwhelming majority of the relevant projects and associated financing vehicles, not merely several prominent failures.
  - No deadline is supplied. The screens' suggested annual demand figure is not substituted for a threshold explicitly stated in the supplied passage.
  - "The conditional-forecast rule takes precedence: an unknown antecedent makes the forecast not adjudicable at this freeze."
support_condition: The demand-shortfall condition is established and a representative record shows an overwhelming majority of the relevant AI data centers and associated SPVs subsequently collapse.
contradiction_condition: The demand-shortfall condition is established and the relevant project cohort completes its economic and financing life without the predicted widespread collapse.
measurement_requirements: Define the project cohort and its financing vehicles, measure paying demand against economically required demand over a meaningful period, and track defaults, insolvencies and permanent closures without double counting.
source_requirements: Independent demand and project data, together with court records, lender notices and company disclosures of failures or completed repayment.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a dated cohort-wide record establishes the demand shortfall and overwhelming failures, or establishes successful completion of the cohort's economic and financing life despite that shortfall. Isolated failures or survival to an arbitrary date are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - The necessary scale and duration of the demand shortfall are unspecified.
  - The project and SPV denominator is unspecified.
  - Vast majority has no exact numerical cutoff.
  - Collapse could refer to financial failure or physical closure.
retrospective_or_prospective: retrospective
