ambiguity_flags:
  - Current AI has no specified reporting period; an April month-to-date snapshot is supplied.
  - Seem expresses uncertainty rather than categorical impossibility.
  - Success frequency is unspecified for most tasks.
  - Engaging, cogent, persuasive, and award-caliber lack supplied evaluation standards.
  - Without maps could exclude only prior maps or also maps constructed during navigation.
  - The permitted extent of prompting, source provision, and human assistance varies across the list.
