evaluator_interpretation:
  - “Current AI” refers to AI capabilities as of April 12, 2024.
  - “Seem” expresses a tentative assessment of the listed capabilities. It does not commit Marcus to the categorical assertion that no existing system could perform any listed task.
  - The statement supplies no confidence threshold or standard for deciding when a capability reasonably appears beyond AI. Replacing that uncertainty with a categorical capability test would change the claim.
support_condition: No objective pass condition can be specified without adding a standard for the speaker’s tentative assessment. Demonstrated limitations could inform that assessment but would not establish that every listed task was beyond AI.
contradiction_condition: No objective fail condition can be specified without strengthening the wording. A contemporary demonstration could challenge the assessment, but would not automatically contradict the qualified statement as written.
measurement_requirements: A categorical capability assessment would require task-specific success criteria and a commitment stronger than “seem”; neither may be supplied silently.
source_requirements: The original post establishes wording and context only. It is not evidence that the capability assessment was correct.
