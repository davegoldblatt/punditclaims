explicit_source_elements:
  - Virtually everyone, even at OpenAI
  - acknowledged that there are serious risks
  - thus far few tangible steps
  - either by government or industry
evaluator_interpretation:
  - The claim describes the cumulative position through March 30, 2023; it supplies no starting date.
  - Virtually everyone means broad agreement among relevant researchers, companies and policymakers, rather than literally all people.
  - Tangible steps include implemented technical safeguards, operational controls and government measures. They are not limited to binding legislation.
  - Few describes a sparse overall response, but Marcus supplies neither a numerical threshold nor a population against which to count measures.
support_condition: Representative evidence establishes near-universal recognition of serious AI risks and a broad inventory shows that implemented mitigation remained sparse across government and industry.
contradiction_condition: Representative evidence shows substantial disagreement about serious risks, or a broad inventory establishes substantial implemented mitigation across government and industry.
measurement_requirements: Separate acknowledgment, proposed action, implemented safeguards and demonstrated effectiveness. Assess coverage across institutions rather than treating isolated examples as a census.
source_requirements: Dated statements, official government records and documented industry measures describing the position by March 30, 2023.
