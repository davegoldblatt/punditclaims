explicit_source_elements:
  - the AI industry
  - has burned
  - over a trillion dollars
evaluator_interpretation:
  - The ordinary reading is cumulative money actually spent developing, building and operating AI through publication. Financing raised, valuations and future commitments do not count as spending.
  - The context concerns the recent generative AI buildout, but supplies no starting date or list of companies.
  - Burned could instead mean net cash losses. I do not silently equate gross spending with losses.
  - The cumulative period ends on June 8, 2026. Its start remains unspecified.
  - The quotation identifies no accounting basis or underlying financial source.
support_condition: A sufficiently documented, nonduplicative total of comparable realized AI expenditures through June 8, 2026 exceeds USD 1 trillion, with the intended accounting basis established.
contradiction_condition: A sufficiently complete total on the same scope and accounting basis establishes cumulative expenditure of no more than USD 1 trillion through June 8, 2026.
measurement_requirements: Separate AI expenditure from other company spending, realized expenditure from commitments, and gross expenditure from net losses. Avoid counting both infrastructure investment and payments financing that same investment as separate industry resource costs.
source_requirements: Company disclosures or a transparent aggregation identifying companies, periods, AI attribution and treatment of transfers and leases.
