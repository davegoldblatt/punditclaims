evaluator_interpretation:
  - The claim concerns LeCun's public presentation of his position, not his private intentions.
  - Anti-scaling means the view that increasing the scale of LLMs alone cannot produce human-level AI.
  - Repeatedly requires at least two identifiable public statements or presentations asserting priority and solitary advocacy. Merely expressing disagreement with scaling advocates does not establish either assertion.
  - The surrounding passage begins with a dispute in 2022. I assess the alleged pattern from 2022 through the post date.
support_condition: Dated statements establish repeated claims of original and solitary advocacy, while earlier or contemporary records establish that those claims were false.
contradiction_condition: The identifiable statements underlying the allegation explicitly acknowledge predecessors or fellow advocates, or a sufficiently complete record shows that Marcus mischaracterized them. An unsuccessful search alone does not contradict the claim.
measurement_requirements: Examine complete statements in context and distinguish LeCun's words from interviewers' descriptions and headlines.
source_requirements: Public recordings, reliable transcripts, archived posts, and dated publications by other researchers. Marcus's characterization is not outcome evidence.
