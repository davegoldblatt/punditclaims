explicit_source_elements:
  - entry-level software engineers
  - there’s yet to be proof
  - AI’s taking these jobs
  - not, say, outsourcing
evaluator_interpretation:
  - This is a claim about what had been established publicly by June 16, 2025, not a claim that later research could never find displacement.
  - Proof means credible causal evidence or a verified company case specific to entry-level software engineering.
  - Lost opportunities can include reduced hiring, but this must be distinguished from layoffs and from reduced demand for individual freelance tasks.
  - The target is the accumulated evidence record through publication, so no starting date is supplied.
  - Studies published after the post cannot retroactively become proof available when it was written.
support_condition: A sufficiently comprehensive review of the contemporaneous record establishes that entry-level engineering displacement had not been credibly attributed to AI after considering alternative explanations.
contradiction_condition: At least one study or verified case public by the post credibly attributes lost entry-level engineering jobs or hiring opportunities to AI, addressing plausible competing explanations.
measurement_requirements: Identify entry-level software engineering separately; distinguish job postings, hiring, employment and layoffs; assess causation rather than coincidence.
source_requirements: Original employment research and documented company cases available by publication. Later evidence may explain the issue but cannot establish earlier public knowledge.
