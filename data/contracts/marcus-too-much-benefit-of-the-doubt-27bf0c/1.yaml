explicit_source_elements:
  - Every truck I know
  - still driven by a person
  - except in some limited-use test pilots
  - no radiologists have yet been replaced
evaluator_interpretation:
  - The truck assertion retains both the author's knowledge qualification and the exception for limited pilots.
  - A commercial delivery can also be a limited pilot. Revenue generation alone does not remove it from the exception.
  - Radiologists replaced means human radiologist positions eliminated because AI assumed their work. Approval of software or automation of individual readings is insufficient.
  - The cumulative target interval follows the surrounding comparison with 2011 and ends on the post date.
support_condition: Records establish that relevant driverless trucking remained within the stated pilot exception and that AI had not eliminated radiologist positions by the post.
contradiction_condition: A documented driverless truck operation outside the pilot exception was known to Marcus by the post, or a documented human radiologist position had been eliminated because AI replaced that work.
measurement_requirements: For trucks, establish actual operation, human driving or intervention, deployment scope, pilot status, and evidence of the author's knowledge. For radiology, establish an employment replacement rather than task automation.
source_requirements: Operator disclosures, deployment records, and employer or workforce records. Publicity about a deployment cannot by itself establish Marcus's knowledge.
