explicit_source_elements:
  - expensive for Facebook to run
  - so
  - about 10,000 users
  - never scaled it to the general public
  - Part of the problem
evaluator_interpretation:
  - Operating expense must have contributed materially to limiting the original concierge service; it need not have been the sole cause.
  - About 10,000 refers to people given access, rather than monthly active users or users of M Suggestions.
  - Expensive means sufficiently costly to constrain expansion. No spending amount or accounting basis is supplied.
  - The target period covers the stated launch year through the stated cancellation month.
support_condition: Evidence establishes roughly 10,000 recipients of access, no general release of the original service, and operating expense as a material reason for limiting expansion.
contradiction_condition: Reliable records establish a materially different access count, a general release of the original service, or that expense did not materially constrain expansion.
measurement_requirements: Reconcile invited users, active users, employees and external testers. Separate operating expense from research spending and distinguish causal evidence from inference based only on human staffing.
source_requirements: Prefer company access records, operating-cost disclosures and decision-maker explanations. Contemporary reporting may establish qualitative constraints but must be identified as reporting.
