assessment_axis: forecast_outcome
explicit_source_elements:
  - My strong intuition
  - Mythos will be under 20%
  - perhaps under 10%
  - Remote Labor Index
  - no meaningful improvement on doing physical jobs
  - actual full human jobs that can be entirely replaced will remain small
  - at least for now
evaluator_interpretation:
  - Treat under 20% as the main directional forecast despite its expressed uncertainty. Under 10% is a tentative stronger possibility, not a second firm threshold.
  - Mythos means the Mythos Preview version discussed on May 10. Scores for Fable, Opus, or later Mythos versions are not interchangeable.
  - Use RLI's automation rate for completed projects, not a general benchmark score or an estimate of jobs replaced.
  - The physical-jobs clause concerns practical occupational capability. Improvements on isolated robotics tasks are relevant but do not automatically demonstrate improved completion of whole jobs.
  - For now supplies no definite deadline. The full-jobs conclusion remains part of the assessment, although small has no numerical definition.
support_condition: An authenticated comparable RLI evaluation places the relevant Mythos Preview version below 20%, with evidence also supporting the stated lack of meaningful physical-job improvement and limited complete-job replacement.
contradiction_condition: A valid comparable RLI result is at least 20%, or direct practical evidence demonstrates meaningful physical-job improvement contrary to the forecast. Isolated task gains alone do not settle the complete-job claim.
measurement_requirements: Identify the model version, benchmark version, agent setup, and automation-rate denominator. Physical-work comparisons require specified predecessor systems and comparable practical tasks.
source_requirements: Prefer Scale AI or CAIS RLI results and documented practical physical-work evaluations. Do not transfer another model's score to Mythos.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated authenticated Mythos Preview RLI result resolves the numerical component; a result at least 20% provides a decisive counterexample to it. Supporting the entire compound claim also requires evidence for the physical-work and complete-job clauses.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Mythos version and agent setup are not explicitly specified.
  - Perhaps under 10% is tentative.
  - Meaningful improvement and small have no stated thresholds.
  - For now supplies no fixed deadline.
  - RLI projects and complete human jobs are different units of analysis.
