ambiguity_flags:
  - The statement gives no reporting period; Q1 2026 is selected from the surrounding financial discussion.
  - No numerical threshold defines horribly unprofitable.
  - Stable business could refer to liquidity, customer demand or long-term profitability.
  - Gross-margin changes do not isolate economies of scale from pricing, product mix or technical improvements.
