assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI has no economies of scale
  - it’s horribly-unprofitable
  - does not have a stable business
evaluator_interpretation:
  - The ordinary reading is that expansion is not improving unit economics, losses are substantial relative to revenue, and continued operations depend on uncertain external financing.
  - Use Q1 2026, the latest completed financial reporting period identified in the post's discussion of actual revenue, costs and cash. Earlier periods provide comparison baselines.
  - Improving gross margins are relevant to scale economics but do not by themselves establish that greater scale caused the improvement.
  - Treat the financial basis as estimate because the surrounding argument relies on press reports of private financial records.
support_condition: Comparable operating records show no improvement in unit costs or margins as activity expands, substantial operating losses relative to revenue, and material uncertainty about financing ordinary operations.
contradiction_condition: Comparable records establish meaningful scale-related cost improvements, an absence of substantial operating losses, or secure funding and durable operating cash generation. Evidence resolving only one component does not settle the entire statement.
measurement_requirements: Comparable unit costs, revenue and operating losses; explanations of margin changes; unrestricted liquidity, financing commitments and payment schedules. Keep operating loss, net loss and cash burn separate.
source_requirements: Prefer financial statements and company disclosures. Independently reported private financial records may establish individual components, with their limitations stated.
metric_scope:
  company: OpenAI
  metric: "Operating economics: profitability, unit costs and dependence on external financing"
  currency: USD
  units: billions of dollars; percentages; costs per comparable unit
