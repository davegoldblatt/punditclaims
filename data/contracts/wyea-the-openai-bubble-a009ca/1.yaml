assessment_axis: causal_assessment
explicit_source_elements:
  - For SoftBank to survive in its current form
  - OpenAI must go public
  - become a thriving and profitable business
  - have its stock price stay elevated
  - for the foreseeable future
evaluator_interpretation:
  - The plain reading asserts necessary conditions for SoftBank Group to continue as substantially the same investment holding group, not merely factors that would benefit it.
  - All three named OpenAI conditions are asserted to be necessary. Establishing a durable alternative to any one could challenge the necessity claim.
  - Ordinary portfolio turnover is not automatically a change in corporate form; forced dismantling or fundamental restructuring would be.
  - Short-term survival before an IPO cannot settle a claim about an unspecified future period.
  - This assessment concerns causal dependence, not a particular reported profit, valuation, or stock-price figure.
support_condition: Financial and contractual evidence shows that failure of any named OpenAI condition would prevent SoftBank from maintaining its existing business structure, with no feasible financing or asset-management alternative.
contradiction_condition: A documented durable financing and operating arrangement preserves SoftBank's existing business structure despite failure of at least one allegedly necessary OpenAI condition.
measurement_requirements: Assess liquidity, debt maturities, covenants, refinancing options, asset disposals, and corporate structure alongside OpenAI's listing and business performance. Define the relevant survival period before treating temporary continuity as decisive.
source_requirements: SoftBank financing documents and filings, relevant creditor records, and reliable OpenAI listing and financial records.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Current form' does not define permissible portfolio or financing changes."
  - "'Thriving' and 'elevated' have no stated thresholds."
  - "'Profitable' does not specify an accounting measure."
  - "'Foreseeable future' supplies no fixed period."
  - The causal claim does not specify when the purported necessities become binding.
