assessment_axis: forecast_outcome
explicit_source_elements:
  - If Nvidia is the first to tumble
  - I expect far worse things
  - the cloud giants
  - bet tens (or hundreds) of billions of dollars
evaluator_interpretation:
  - The surrounding passage identifies Microsoft, Amazon and Google as the relevant cloud giants.
  - The demand-and-profit context suggests a substantial AI-related business downturn beginning at Nvidia and subsequently harming the cloud giants more severely.
  - A stock-market reading is also plausible. A single trading-day decline cannot establish the whole predicted sequence.
  - No particular financial measure, comparison period or deadline is supplied.
support_condition: A dated AI-related downturn begins at Nvidia, followed by substantially worse deterioration at the named cloud giants on a consistent, defensible measure.
contradiction_condition: After an established Nvidia-first downturn and a sufficiently complete subsequent adjustment, the named cloud giants demonstrably fare better or no worse on the same measure. The claim does not specify how long that adjustment may take.
measurement_requirements: A consistent comparison of the onset and severity of deterioration. Stock returns, revenue declines, profit losses and write-downs cannot be interchanged.
source_requirements: Company filings and disclosures for business deterioration; reliable market records for a stock-price interpretation; evidence connecting the deterioration to generative-AI exposure.
