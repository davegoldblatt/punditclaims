explicit_source_elements:
  - 200 million of them a week, allegedly
  - losing the company money with every prompt
  - little to suggest
  - widespread adoption of actual generative AI software
evaluator_interpretation:
  - "I assess the two substantive assertions identified in the normalized proposition: per-prompt losses and limited evidence of adoption."
  - For this ongoing state, I use July–September 2024, the latest completed calendar quarter before the post. The speaker supplies no reporting period.
  - Every prompt is read as a claim about ChatGPT unit economics across its usage, rather than merely OpenAI's total company loss.
  - The surrounding financial discussion relies on press estimates, so the financial scope uses estimate rather than an asserted accounting standard.
  - The adoption statement contrasts ChatGPT's audience with actual software adoption. General surveys that include ChatGPT cannot by themselves settle that narrower distinction.
support_condition: ChatGPT-specific revenues and attributable costs establish losses across prompt categories under a stated allocation method, while representative evidence shows limited adoption of the software population meant by the speaker.
contradiction_condition: Matched ChatGPT unit-economics evidence establishes profitable prompt categories, or representative evidence establishes broad adoption within the intended software population.
measurement_requirements: Separate free and paid use, subscription allocation, inference costs and allocated training or overhead. For adoption, distinguish people from firms, trial use from sustained use, and ChatGPT from other software.
source_requirements: Prefer ChatGPT-specific financial disclosures or documented estimates and representative adoption surveys. Company-wide losses, API margins and all-AI surveys are context only when their scopes differ.
