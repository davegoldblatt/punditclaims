ambiguity_flags:
  - The latest completed quarter is an evaluator-selected reporting period for an undated ongoing observation.
  - Every prompt could be literal or shorthand for an average loss.
  - Marginal costs versus fully allocated costs are unspecified.
  - USD follows the surrounding dollar-denominated discussion.
  - Actual generative AI software and widespread adoption have no defined population or threshold.
  - The contrast with ChatGPT leaves its inclusion in the adoption claim unclear.
