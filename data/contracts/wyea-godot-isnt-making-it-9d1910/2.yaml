assessment_axis: historical_observation
explicit_source_elements:
  - people that use ChatGPT, 200 million of them a week, allegedly
  - losing the company money with every prompt
  - little to suggest that there's widespread adoption
  - actual generative AI software
evaluator_interpretation:
  - He describes an ongoing state as of the post (December 2024) and names no period. I use calendar 2024 up to the post date, the most recent period public evidence could cover before he wrote.
  - "I read 'losing the company money with every prompt' in its plain sense: serving ChatGPT cost OpenAI more than it brought in. I do not read it as a measured per-prompt figure."
  - "I read 'actual generative AI software' as he sets it up: generative AI products that businesses adopt and pay for (his example is Microsoft Copilot), as distinct from consumer ChatGPT use, which he concedes."
  - I read 'widespread' as broad uptake across businesses, shown by surveys or vendor disclosures from 2024.
support_condition: Evidence from 2024 shows that ChatGPT's serving costs exceeded its revenue, and that business adoption of generative AI software was low, for example a single-digit share of firms.
contradiction_condition: Evidence from 2024 shows that ChatGPT served users profitably, or that business adoption of generative AI software was broad, for example most large firms deploying it.
measurement_requirements: Reported or estimated 2024 figures on OpenAI's inference costs against its revenue. Survey or vendor data from 2024 on business adoption of generative AI.
source_requirements: Official statistics (Census BTOS), company disclosures (earnings calls), large industry surveys, and reputable reports on OpenAI's finances.
metric_scope:
  company: OpenAI
  metric: ChatGPT serving cost versus revenue (loss on usage)
  currency: USD
  units: null
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
