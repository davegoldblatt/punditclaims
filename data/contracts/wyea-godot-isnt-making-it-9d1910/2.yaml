  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No period is named. I use 2024 up to the post date because he describes a current state.
  - "'Every prompt' is hyperbole. No public per-prompt cost data exists."
  - "'Widespread' has no threshold, and surveys measure different things: share of all firms versus share of large firms or survey respondents."
  - Census BTOS measures any AI use in producing goods or services, not generative AI software alone.
retrospective_or_prospective: retrospective
