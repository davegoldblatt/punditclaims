assessment_axis: causal_assessment
explicit_source_elements:
  - unclear what the actual economic or productivity effects are
  - other than an abundance of new code
  - making running companies harder
evaluator_interpretation:
  - Use 2026 Q1, the latest completed quarter before publication, to assess the contemporaneous evidence and company conditions.
  - Read the first component as uncertainty about general net economic and productivity effects, rather than a claim that no individual task benefit has been measured.
  - Read the second component as a broader causal assertion that increased generated-code volume imposes operational burdens on companies.
  - One company's experience can establish an example, but cannot alone establish the broader characterization.
  - Faster deployment, added review work, and net company productivity are distinct outcomes.
support_condition: Credible evidence shows that general net effects remained unsettled and that increased generated-code volume caused material review, maintenance, security, or coordination burdens across relevant companies.
contradiction_condition: Robust, broadly applicable evidence settles the general net effects, or representative causal evidence refutes the claimed operational burden from increased code volume.
measurement_requirements: Measure code volume and downstream work separately, account for adoption selection and other workflow changes, and distinguish association from causation. Include benefits as well as burdens.
source_requirements: Contemporaneous productivity research and company-level evidence with credible causal identification or documented before-and-after mechanisms. Vendor surveys require explicit limitations.
