assessment_axis: historical_observation
explicit_source_elements:
  - no actual metric or tracking of any return on investment
  - involved in token burn at Meta
  - TokenMaxxing’s only purpose
  - go higher on a leaderboard
evaluator_interpretation:
  - The plain reading is that Meta lacks measures connecting employee token use to useful work or its cost, and that leaderboard position is the sole purpose of the practice.
  - ROI need not mean a formal accounting ratio. A meaningful measure connecting token use with useful output and resource cost would count.
  - This is an ongoing internal practice, not a quarterly financial result. I use April 7, 2026, the latest complete day before the post, as the current-state snapshot.
  - General AI productivity statistics are relevant context but do not by themselves prove that token burn or leaderboard-driven use is evaluated.
support_condition: Contemporaneous internal records or corroborated reporting show no measures of returns from employee token use and establish leaderboard ranking as the practice's sole purpose.
contradiction_condition: Contemporaneous records show a meaningful measure connecting employee token use to useful results or resource costs, or establish an operational purpose beyond leaderboard ranking.
measurement_requirements: Dashboard definitions, performance-review criteria, token-cost records and output or quality measures in use at the time. Absence from public reporting is insufficient to establish absence internally.
source_requirements: Meta documentation or statements, or corroborated reporting based on internal records and identified access to the relevant systems.
