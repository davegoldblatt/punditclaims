assessment_axis: historical_observation
explicit_source_elements:
  - Every single user
  - every single AI subscription service
  - their tokens subsidized
  - the actual cost of AI obfuscated
evaluator_interpretation:
  - The plain reading is that each subscriber pays less than the provider's actual cost of serving that subscriber's tokens, and cannot see that actual cost.
  - The latest completed monthly usage period before the post is May 2026. This is the assessment period because the surrounding discussion concerns monthly subscriptions.
  - API list-price value, maximum allowances and actual provider costs are different measures.
  - No accounting or cost-allocation basis is supplied, so the monetary scope is unknown and cannot receive a supported or contradicted score under the specified rules.
support_condition: Matched subscriber payments, realized token costs and disclosure records establish both subsidy and hidden actual costs for every subscriber across all covered services.
contradiction_condition: A documented subscriber's payments cover actual token-serving costs on a matching basis, or a covered service discloses actual costs to its subscribers.
measurement_requirements: Match individual payments and realized usage over the same subscription period. Identify provider costs, allocation assumptions and any rebates. Do not substitute maximum API-equivalent allowances for actual costs.
source_requirements: Dated subscription records and provider cost accounts, preferably independently verified. Pricing announcements alone are insufficient.
