assessment_axis: historical_observation
explicit_source_elements:
  - Every single user
  - of every single AI subscription service
  - is having their tokens subsidized
  - and the actual cost of AI obfuscated
evaluator_interpretation:
  - "'Subsidized' is read plainly: the provider spends more serving a subscriber's tokens than the subscriber pays. The sentence ties the subsidy to tokens and contrasts it with 'the actual cost of AI', so the actual serving cost is the yardstick, not API list prices."
  - The claim is universal ('every single user of every single'). If one major service's subscribers as a group pay more than the cost of serving them, at least some subscribers are not subsidized, and the universal claim fails.
  - "Target period: the claim describes an ongoing state around the June 2026 post. I use the first half of 2026 (January–June). That covers the run-up to the post and the June GitHub Copilot billing change he discusses, and it is the nearest period with later-reported cost data."
support_condition: Would be supported if, for the period, every AI subscription service served its subscribers at a cost above what they paid, so that no subscriber covered their token cost, and the actual costs were hidden.
contradiction_condition: Would be contradicted if any major AI subscription service's subscribers, as a group, paid more than the cost of serving them in the period. Then at least some subscribers were not subsidized.
measurement_requirements: Compare subscription revenue with the provider's cost of serving subscribers (inference compute) for the same period.
source_requirements: Company filings or company-reported financials, or reputable reporting on them.
metric_scope:
  company: All AI subscription service providers
  metric: Subscriber payments versus cost of serving subscribers' tokens
  currency: USD
  units: USD
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-06-30
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
