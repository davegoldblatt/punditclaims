  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'subsidized' could be read against API list prices or against full costs including training, rather than serving cost"
  - the claim names no period; I chose the first half of 2026
  - "'obfuscated' is a separate part of the claim and is not tested on its own"
retrospective_or_prospective: retrospective
