ambiguity_flags:
  - No deadline.
  - Needs debt could mean actual borrowing, a financing shortfall or expected future borrowing.
  - Handle does not specify borrowing costs, access to credit or operating consequences.
  - The comparison implied by even harder is unspecified.
  - Direct corporate borrowing and financing through infrastructure partners are not distinguished.
  - No accounting basis is supplied.
