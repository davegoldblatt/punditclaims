assessment_axis: historical_observation
explicit_source_elements:
  - any debt associated with AI data centers
  - now skyrocketing
  - price of the goods that debt is buying are skyrocketing
  - underlying construction needed to pay back that debt is taking forever
evaluator_interpretation:
  - The plain reading is a sharp, broadly shared increase in borrowing and equipment costs, alongside substantial construction delays.
  - Price of debt means the borrower's financing cost, not the market price of an outstanding bond.
  - I use September 1–29, 2026 as the current observation period, anchored by 'now' and the September 18 financing cited immediately afterward. Earlier observations can supply comparison baselines.
  - Skyrocketing requires a substantial increase in comparable prices, rather than merely high price levels. Taking forever means material delays, not literal noncompletion.
  - The monetary scope is sector-wide rather than a named company's accounts. Estimate reflects the surrounding reliance on reported financing prices.
support_condition: Comparable financing and equipment observations establish sharp, broadly shared increases during the target period, while representative project records establish material construction delays.
contradiction_condition: Representative comparable evidence establishes stable or falling borrowing or equipment costs, or substantially on-schedule construction, contrary to a material part of the claim.
measurement_requirements: Compare financing costs after accounting for benchmark rates, maturity, security, credit quality, fees and issue discounts. Compare equivalent equipment configurations. Measure delays against previously announced schedules.
source_requirements: Dated financing documents, market measurements, supplier prices and project schedules. Isolated transactions or reports about other hardware markets cannot establish the sector-wide claim.
