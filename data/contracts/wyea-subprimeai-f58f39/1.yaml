assessment_axis: forecast_outcome
explicit_source_elements:
  - Generative AI is being sold on multiple lies
  - That it's "going to get better."
evaluator_interpretation:
  - Calling future improvement a lie is read as denying substantive improvement after September 16, 2024. This does not assess anyone's intent to deceive.
  - The ordinary reading of 'better' includes completing more demanding useful tasks and gaining practical functionality. It does not require AGI or improvement in every setting.
  - Given the surrounding objections to accuracy and speed alone, isolated benchmark gains are insufficient. Longer completed workflows and demonstrated additional functionality are relevant.
support_condition: Evidence establishes a durable inability to improve substantive useful task capabilities. A temporary lack of progress cannot establish an unlimited negative forecast.
contradiction_condition: Post-publication models demonstrate substantial improvement in useful task completion or practical functionality relative to earlier models, with independent evaluation corroborating the improvement.
measurement_requirements: Compare successive systems on comparable tasks. Separate autonomous task capability from human productivity, and disclose reliability and evaluation limits.
source_requirements: Independent comparative evaluations, supported where useful by dated primary model documentation.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated post-publication demonstration of substantial useful capability improvement, corroborated by independent comparative evaluation, contradicts the unrestricted denial without waiting for a deadline.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Better' has no named measure or threshold."
  - The surrounding discussion could imply revolutionary usefulness rather than ordinary substantive improvement.
  - No deadline is stated.
retrospective_or_prospective: retrospective
