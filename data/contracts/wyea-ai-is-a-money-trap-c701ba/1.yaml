assessment_axis: historical_observation
explicit_source_elements:
  - Stargate isn’t saving it
  - Stargate doesn’t actually exist beyond the media hype it generated
evaluator_interpretation:
  - The ordinary reading of the firm existence claim is that Stargate has no substantive infrastructure activity beyond publicity.
  - Construction, operational capacity or binding infrastructure agreements count as substantive existence; full delivery of every announced ambition is not required.
  - This is an ongoing operational-state claim. The reporting window is the latest completed calendar month before publication, July 2025, through the August 6 publication date.
  - "'Isn’t saving it' supplies no measurable financial-rescue threshold or deadline and is not independently resolved by evidence that infrastructure exists."
  - The name can refer either to the original SoftBank joint venture or to OpenAI's broader infrastructure program. The proposed outcome uses the latter ordinary project-level reading and records contrary evidence about the narrower venture.
support_condition: Contemporaneous evidence establishes that the project remained publicity and plans, with no substantive construction, operation or binding infrastructure activity.
contradiction_condition: Contemporaneous evidence establishes physical infrastructure construction or operation, or executed infrastructure agreements, identified with Stargate.
measurement_requirements: Separate project existence from full financing, completion of announced capacity, formation of a particular joint venture and OpenAI's financial survival.
source_requirements: Prefer project-owner, operator or contractor disclosures. Include independent reporting about the original venture's progress and the use of the Stargate name.
