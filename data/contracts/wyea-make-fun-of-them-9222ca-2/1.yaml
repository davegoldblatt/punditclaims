evaluator_interpretation:
  - This concerns the financial plan in force when the post appeared, not whether future losses eventually exceeded the threshold.
  - The ordinary financial reading is cumulative net losses exceeding US$100 billion before the first profitable period.
  - Cash burn, total spending and financing requirements are distinct measures.
  - June 2025 is used for the observed planning state because no period is named. The projected accumulation period itself is unspecified.
  - The statement does not identify its accounting basis or a specific underlying projection; accounting_basis therefore remains unknown.
support_condition: A plan demonstrably in force in June 2025 projects cumulative net losses above US$100 billion before profitability, on an identified and consistent accounting basis.
contradiction_condition: A complete comparable plan in force in June 2025 projects cumulative net losses of no more than US$100 billion before profitability.
measurement_requirements: Identify the projection vintage, accumulation start, first profitable period, accounting basis and treatment of stock compensation. Do not substitute cash burn or expenditure for net losses.
source_requirements: Company financial projections or credible reporting that identifies their contents and dates. A later revised forecast cannot establish an earlier plan.
