evaluator_interpretation:
  - I assess the technical account of models developed and available before 2024-04-15, including their preceding training and documented behavior.
  - Learning means fitting statistical structure from data that can support responses beyond verbatim reproduction; it does not require consciousness or human-like understanding.
  - The categorical contrast is read as claiming that copying others' answers describes the operating mechanism instead of statistical learning.
  - The ethical characterization of training as plagiarism is not independently scored as a technical fact.
  - There is no periodic reporting interval for this mechanism; the historical interval covers the pre-post models and their training, without an invented start date.
support_condition: Technical documentation and controlled tests show that the relevant models operate through the described answer-copying mechanism and do not learn structure that supports generalization.
contradiction_condition: Technical records establish parameter training for predictive learning rather than selection of an existing answer by its probability of correctness, with empirical evidence of capabilities beyond verbatim reproduction.
measurement_requirements: Distinguish next-token likelihood from factual correctness, training from inference, and memorization from the claim that copying exhaustively explains model behavior.
source_requirements: Original technical reports and controlled research, including material evidence of memorization and limits to generalization.
