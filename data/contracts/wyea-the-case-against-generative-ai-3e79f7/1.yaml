explicit_source_elements:
  - there really isn’t any demand for AI in general
  - let alone at the scale
  - hundreds of billions of dollars being sunk into
evaluator_interpretation:
  - The ordinary reading is an absence of meaningful AI demand, rather than a literal claim that no individual uses AI.
  - Use August 2025, the latest completed calendar month before publication, for the ongoing demand observation.
  - Substantial actual use and paid adoption can refute the general absence claim without proving that infrastructure investment is economically justified.
  - The GDP-growth clause is outside the supplied normalized proposition and is not graded here.
  - This is an industry demand claim, not a specific company revenue figure; metric_scope is null.
support_condition: Representative evidence shows negligible actual use and paid adoption, together with demand insufficient to sustain the infrastructure scale described.
contradiction_condition: Dated evidence shows substantial actual AI adoption and paid demand, contradicting the asserted general absence. This does not by itself contradict the narrower concern about investment adequacy.
measurement_requirements: Use observed users, purchases or paid adoption. Distinguish free usage from paid demand, and distinguish both from profitability or investment returns.
source_requirements: Primary usage disclosures and independent transaction or adoption measurements with explicit dates and populations.
