evaluator_interpretation:
  - This concerns knowledge at publication, not a conditional prediction requiring superintelligence to exist first.
  - The ordinary reading is that researchers could not reliably determine whether future superintelligent machines would dominate humans. It need not mean that no relevant reasoning existed.
  - For this ongoing research question, the target period is 2023 through publication, the latest partial calendar year publicly reportable before the post. Research has no standard quarterly reporting period.
support_condition: A sufficiently comprehensive assessment of research available at publication establishes that neither domination nor continued human control could be reliably determined.
contradiction_condition: Research available at publication reliably establishes either outcome for future superintelligent machines, with assumptions shown to apply beyond a restricted mathematical model.
measurement_requirements: Distinguish a reliable determination about future machines from conditional theoretical results, forecasts, and expert opinions.
source_requirements: Contemporaneous research and assessments of its applicability; later research cannot establish what was known at publication.
