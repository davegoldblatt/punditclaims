  - the latest models have more utility
  - LLMs have certainly come a long way
evaluator_interpretation:
  - The ordinary reading is substantial improvement in demonstrated capabilities and usefulness for practical tasks, rather than an aesthetic judgment.
  - The comparison spans the original ChatGPT generation and models available by publication.
  - Greater utility does not require improvement on every task or proof of greater economy-wide profits.
  - GPT-3.5 benchmark baselines are useful proxies, but are not necessarily the exact November 2022 ChatGPT snapshot.
support_condition: Comparable evaluations show substantial capability gains over the GPT-3.5 generation, including gains on practical tasks relevant to users.
contradiction_condition: Broad comparable evaluations show no meaningful capability or practical-task improvement, or show an overall regression.
measurement_requirements: Identify model versions and comparable task protocols. Distinguish benchmark usefulness from measured workplace productivity.
source_requirements: Primary comparative evaluations, preferably including independent measurements alongside developer results.
