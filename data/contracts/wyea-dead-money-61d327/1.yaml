assessment_axis: forecast_outcome
explicit_source_elements:
  - since 2023
  - global venture capital investment in AI companies
  - at least $300 billion of that equity
  - dead money
  - wrappers or layers built on top of Anthropic and OpenAI’s models
evaluator_interpretation:
  - The investment cohort runs from January 2023 through the post date, September 29, 2026.
  - The ordinary reading of dead money is invested capital that ultimately produces no positive nominal return. This is not necessarily a forecast of $300 billion in outright losses.
  - Count invested principal, not headline company valuations. Temporary valuation reductions do not establish final investment returns.
  - The explanation about dependence on the labs requires separate evidence linking that dependence to poor returns.
support_condition: Final investment proceeds establish that at least $300 billion of principal in the specified cohort returned no more than its original investment. Evidence also links the predicted failure to the stated dependence on the labs.
contradiction_condition: Complete final returns for the defined cohort establish that less than $300 billion of invested principal failed to earn a positive return. Successful individual investments alone cannot establish this.
measurement_requirements: Investment-level cost basis, distributions, liquidation proceeds and final residual values, with safeguards against double counting across funds and financing rounds.
source_requirements: Fund reports, liquidation records and reliable investment-level return data. Funding totals and provisional write-downs are insufficient.
metric_scope:
  company: Global AI companies receiving venture equity
  metric: Invested principal ultimately earning no positive nominal return
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
