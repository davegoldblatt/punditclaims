early_resolution_rule: Resolve support when irreversible investment outcomes cross the $300 billion principal threshold. Resolve contradiction only when final cohort outcomes make that threshold impossible. Neither continued fundraising nor temporary marks resolve the forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Dead money could mean no nominal gain, an inadequate risk-adjusted return, or an outright loss.
  - No deadline is supplied.
  - The constituent investments and definition of an AI company are unspecified.
  - The scope may include the labs themselves, although the explanation emphasizes application startups.
retrospective_or_prospective: retrospective
