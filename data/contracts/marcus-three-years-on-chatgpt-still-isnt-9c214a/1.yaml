explicit_source_elements:
  - Hundreds of models
  - always the same failure modes
  - every single model since
  - Three years
evaluator_interpretation:
  - The claim concerns recurring categories of failure across model releases, not identical error rates or failure on every response.
  - The surrounding text identifies reasoning, hallucination, tool use, controllability, and alignment as relevant categories.
  - The three-year retrospective supplies the observation period, ending on the post date.
  - The numerical breadth and universal language remain part of the claim. Evidence from a small sample cannot establish them.
support_condition: Documented evaluations covering hundreds of distinct models across the named families establish persistence of the listed failure categories throughout the period.
contradiction_condition: Credible evaluations establish that a model within the claimed population has resolved the relevant core failure categories across varied tasks. Lower error rates alone do not contradict persistence.
measurement_requirements: A defined model inventory, version-specific results, consistent definitions of failure categories, and sufficient testing across tasks. Repeated runs or benchmark submissions must not be counted as distinct models.
source_requirements: Primary evaluations with methods and identifiable model versions. Provider disclosures can supplement independent evaluations.
