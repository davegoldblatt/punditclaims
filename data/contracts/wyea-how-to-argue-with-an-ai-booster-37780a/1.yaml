assessment_axis: historical_observation
explicit_source_elements:
  - young people are having trouble finding jobs
  - there is no proof that AI is the reason
evaluator_interpretation:
  - This concerns the state of public evidence at publication, rather than a claim that AI had no employment effects.
  - Proof means credible evidence establishing a causal contribution. It does not require mathematical certainty, but an employment decline correlated with AI exposure is insufficient by itself.
  - The target is the accumulated public research record through 2025-08-25, so it has no fixed starting date. Later research cannot establish what was already proved at publication.
  - The surrounding discussion primarily concerns recent graduates and generative AI.
support_condition: Contemporaneous research supports the conclusion that AI's causal contribution to young people's job-finding difficulties had not been established.
contradiction_condition: Research publicly available by publication credibly identifies AI adoption as causing young people's deteriorating employment or hiring outcomes.
measurement_requirements: Distinguish causal identification from exposure correlations, employer predictions and anecdotes. Check age coverage, alternative explanations and publication dates.
source_requirements: Prefer original labor-market research. Use reporting on inaccessible research only with that limitation disclosed.
