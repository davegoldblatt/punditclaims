explicit_source_elements:
  - On rock-paper-scissors
  - they have less data
  - at the level of a small child
  - hasn’t quite even gotten the point of the game
evaluator_interpretation:
  - They refers to contemporary general-purpose generative AI systems, with GPT-4 and ChatGPT as the central examples.
  - The ordinary testable reading is recurring failure to grasp or apply basic winning rules and simultaneous commitment in ordinary play.
  - Small child is a qualitative comparison, not a specified developmental age or numerical performance threshold.
  - Weak opponent prediction or imperfect randomization alone does not establish failure to understand the game's rules or objective.
  - The target is the capability snapshot at publication, the latest state pre-publication evidence could describe. Earlier experiments remain context unless their applicability to that snapshot is established.
  - The training-data parenthesis is an additional unquantified assertion, not a conditional forecast.
support_condition: Representative, version-identified contemporary tests show recurring basic rule, scoring, or commitment misunderstandings across the systems described. The training-data assertion additionally requires evidence of lower rock-paper-scissors exposure than chess exposure.
contradiction_condition: Representative contemporary gameplay establishes reliable application of the basic rules and objective across the relevant systems, including a workable simultaneous-choice protocol.
measurement_requirements: Full prompts and transcripts, model versions, repeated trials, correct scoring, and a protocol preventing either player from choosing after seeing the other's move. Distinguish rule errors from strategic weakness and interface limitations.
source_requirements: Prefer controlled primary studies and independently inspectable original transcripts. An isolated selected exchange cannot establish typical performance across generative AI systems.
