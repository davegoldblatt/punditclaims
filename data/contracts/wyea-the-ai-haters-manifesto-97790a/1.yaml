assessment_axis: causal_assessment
explicit_source_elements:
  - Its software lies
  - because it doesn’t actually know anything
  - generates answers probabilistically
evaluator_interpretation:
  - Read software as LLM-based software in this context.
  - Read lies colloquially as confidently producing false factual statements, without assuming conscious intent to deceive.
  - Test the proposed connection between statistical generation, factual information available to a model, and false answers.
  - "Use an operational meaning of knowledge: factual information a model can retrieve or correctly recognize. The claim supplies no test for conscious or human-like knowledge."
  - Do not weaken does not know anything into the narrower assertion that models sometimes lack relevant information.
support_condition: Mechanistic analysis or controlled experiments show that statistical generation under inadequate factual information produces false assertions. Full support also requires evidence for the asserted absence of factual knowledge.
contradiction_condition: Controlled evidence shows models can access relevant factual information, including recognizing claims as false that they nevertheless generated. This contradicts absence of knowledge as a general explanation, even if statistical generation contributes to errors.
measurement_requirements: Separate false-output frequency from its causes. Distinguish unavailable information, training incentives, generation effects, and conscious intent. A hallucination example alone does not establish the claimed mechanism.
source_requirements: Primary research with explicit theoretical assumptions or controlled tests, available by the evaluation cutoff.
