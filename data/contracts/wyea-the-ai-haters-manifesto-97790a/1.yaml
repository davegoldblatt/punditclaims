early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Lies may mean false outputs or intentional deception.
  - Knows may refer to accessible factual information or philosophical understanding.
  - The wording gives a general causal explanation without specifying models, tasks, or generation settings.
