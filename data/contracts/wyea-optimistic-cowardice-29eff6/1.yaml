  end: 2026-03-24
  precision: day
target_period: null
condition_status: met
early_resolution_rule: Early support would require documented unavoidable funding requirements of at least $20 billion within the forecast interval. A large fundraising announcement alone would not settle the necessity claim.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The companies are not named in the sentence itself.
  - The threshold could be misread as applying separately to each company.
  - Status quo does not specify whether already-planned expansion is included.
  - The sentence asserts a funding requirement, not merely an amount that will be raised.
