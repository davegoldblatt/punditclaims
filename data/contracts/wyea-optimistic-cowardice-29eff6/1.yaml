assessment_axis: forecast_outcome
explicit_source_elements:
  - For this situation to work
  - the next year
  - these companies
  - will have to raise tens of billions of dollars
  - just to maintain the status quo
evaluator_interpretation:
  - These companies refers collectively to CoreWeave, OpenAI, and SoftBank.
  - The next year runs from publication on March 24, 2025 through March 24, 2026.
  - Tens of billions means at least $20 billion collectively, not necessarily that amount for each company.
  - Raise means new debt or equity financing actually obtained. Exclude unfulfilled commitments and secondary share sales that do not fund the companies.
  - Do not count the same funds twice merely because SoftBank raises money and then invests it in OpenAI.
  - Will have to and just to maintain the status quo assert necessity. Actual fundraising alone does not establish the minimum funding needed.
  - The condition is continued operation of the described financing and compute arrangement, rather than achievement of profitability.
support_condition: The arrangement continues through March 24, 2026, and financing and cash-flow records establish that at least $20 billion of new, non-duplicated funding was necessary to sustain the existing arrangement during that interval.
contradiction_condition: The arrangement continues through the deadline while matched cash-flow and financing records establish that its necessary new funding was below $20 billion.
measurement_requirements: Reconcile actual financing receipts, opening liquidity, debt repayments, operating cash flows, and spending. Separate maintenance obligations from discretionary expansion, acquisitions, and funding retained for later periods.
source_requirements: Prefer completed financing disclosures and cash-flow statements. Announcements of commitments are insufficient to establish cash receipt, and fundraising totals alone are insufficient to establish necessity.
metric_scope:
  company: CoreWeave, OpenAI, and SoftBank collectively
  metric: Minimum non-duplicated new debt and equity funding required to maintain the existing arrangement
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-03-24
  period_end: 2026-03-24
  stock_or_flow: flow
  annualized_or_realized: realized
