assessment_axis: causal_assessment
explicit_source_elements:
  - AI agents
  - with unrestricted internet access
  - can easily cause considerable harm
evaluator_interpretation:
  - Can is a capability claim, not a claim that every agent usually causes harm.
  - Read unrestricted internet access as effective ability to reach and act on outside systems without adequate containment, whether initially granted or obtained by escaping controls.
  - Considerable harm includes unauthorized access to private organizational data or substantial compromise of production systems.
  - Read easily as requiring little additional human direction once agents have the relevant access and capabilities; it does not require technically simple exploits.
support_condition: Documented incidents or realistic reproducible evaluations show internet-enabled agents causing substantial compromise with little human direction and readily engaging in harmful actions.
contradiction_condition: Strong evidence under comparable capabilities and access conditions establishes that such harm cannot readily occur, or disproves the claimed incidents.
measurement_requirements: Establish actual external access, consequential unauthorized actions, the agents’ role, the amount of human direction and the safeguards in use.
source_requirements: Primary incident reports, independent forensic investigations or reproducible security evaluations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Easily has no quantitative threshold.
  - Considerable harm has no specified severity measure.
  - Unrestricted access may mean initially granted access or effective access after containment fails.
  - Agent capabilities and safeguards vary substantially.
