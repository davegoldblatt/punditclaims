explicit_source_elements:
  - revenue is highly concentrated
  - future almost entirely dependent
  - OpenAI's ability to pay
evaluator_interpretation:
  - Treat this as an assertion about CoreWeave's existing customer exposure and financial dependence at publication, not a prediction that OpenAI would default.
  - Use fiscal 2024, the latest completed annual reporting period publicly disclosed before the post, for realized revenue concentration. Include the March 2025 OpenAI agreement when examining the current dependence assertion.
  - Highly concentrated means a small number of customers supply most revenue.
  - Almost entirely dependent means losing OpenAI payments would leave CoreWeave without a realistic means of sustaining its business. A large contract alone does not establish that.
  - The revenue clause refers to the company financial disclosures discussed in the post. Its accounting scope is company-reported customer concentration; contract value and liquidity are separate measures.
support_condition: Disclosures show that a few customers supply most revenue and establish that CoreWeave's financial continuity depends overwhelmingly on OpenAI payments, after considering other customers, financing and contractual protections.
contradiction_condition: Revenue is broadly diversified, or credible cash-flow and contractual evidence establishes that CoreWeave could sustain its business without OpenAI payments.
measurement_requirements: Separate realized revenue, contracted future payments, cash receipts and borrowing availability. A backlog share alone is not a survival test.
source_requirements: Customer concentration disclosures, the original OpenAI agreement, and sufficiently detailed liquidity and covenant evidence.
