explicit_source_elements:
  - 200MW
  - only enough power for two buildings
  - Oracle is most decidedly not “on schedule.”
  - April 22, 2026
evaluator_interpretation:
  - Assess the late-April operating state and schedule assertion discussed in the post, from Oracle's April 22 statement through publication on April 28.
  - Compare the same eight-building campus and distinguish its original publicly announced timetable from any revised timetable.
  - Interpret power for two buildings as operational capacity corresponding approximately to the initial two-building phase, not proof that only that much grid connection capacity exists.
  - A completion deadline still in the future is not missed merely because the campus was unfinished in April.
  - A documented schedule revision or a missed due milestone can establish delay; a third-party forecast alone has uncertainty.
support_condition: Comparable late-April capacity records support the two-building description, and dated milestone records establish that delivery had slipped against the applicable announced schedule.
contradiction_condition: Comparable records establish materially more operational building capacity, or establish that the applicable delivery milestones were being met without the claimed slippage.
measurement_requirements: Separate critical IT power, total facility power, grid capacity, construction completion, commissioning, and delivery to the customer. Compare like-for-like milestones.
source_requirements: Use dated Oracle and Crusoe announcements, original and revised schedules, commissioning records, and independent construction analysis. Do not use later events as April outcomes.
