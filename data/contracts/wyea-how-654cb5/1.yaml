assessment_axis: historical_observation
explicit_source_elements:
  - popular home pages
  - full of
  - AI-spun misinformation
evaluator_interpretation:
  - Assess only the homepage claim, not the other online harms listed in the sentence.
  - Read popular home pages as widely used landing pages and home feeds, rather than obscure sites.
  - Read full of as recurring, prominent prevalence across such pages, rather than requiring every item to be false.
  - AI-spun misinformation requires both AI involvement in generating the content and factual falsity. Automated selection of human-written misinformation is a different phenomenon.
  - Use January 1–30, 2024 for the ongoing state described at posting. Earlier examples are context unless persistence into that period is documented.
support_condition: Representative contemporaneous homepage observations show that prominent AI-generated false content was widespread and recurring.
contradiction_condition: A sufficiently broad contemporaneous audit finds that such content was rare or absent, with reliable provenance and factual checks.
measurement_requirements: Define a defensible set of popular pages, sample repeated visits and personalized variants, record prominence and prevalence, and verify both factual falsity and AI provenance.
source_requirements: Prefer archived page observations and transparent independent audits. News reports can document incidents but cannot alone establish prevalence across popular homepages.
