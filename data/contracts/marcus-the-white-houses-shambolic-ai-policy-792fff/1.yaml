ambiguity_flags:
  - The acceptable level of reliability implied by 'count on' is unspecified.
  - Self-regulation could mean keeping voluntary promises, preventing harms, or providing adequate public accountability.
  - The statement combines an assessment of institutional trust with a recommendation for government oversight.
