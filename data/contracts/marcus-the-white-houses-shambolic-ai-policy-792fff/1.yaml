explicit_source_elements:
  - we cannot count on the AI industry to self-regulate
  - government must look
  - considering the full range of known risks
  - before they are released
evaluator_interpretation:
  - The ordinary reading is that voluntary industry safeguards are insufficient grounds for public confidence and that government should review widely deployed models before release.
  - This is a judgment about acceptable reliance on industry and the need for oversight. It does not identify a particular voluntary commitment, failure, or measurable level of reliability.
  - Audits and compliance records can inform that judgment, but assigning a binary outcome would require the evaluator to choose the acceptable risks, industry coverage, and standard of reliability.
support_condition: No determinate factual support condition applies to the statement as written. Documented failures of voluntary safeguards would strengthen its rationale without establishing the policy judgment.
contradiction_condition: No determinate factual contradiction condition applies to the statement as written. Successful voluntary safeguards would qualify its rationale without establishing that reliance on industry alone is acceptable.
measurement_requirements: A factual assessment would require a specified set of voluntary obligations, covered companies and risks, observation period, and criterion for adequate performance.
source_requirements: Independent audits, incident investigations, and compliance records would inform a narrower empirical claim. Company policy announcements alone cannot establish effectiveness.
