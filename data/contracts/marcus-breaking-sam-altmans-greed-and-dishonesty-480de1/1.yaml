evaluator_interpretation:
  - "Plain reading: at least two million people were angry at Altman or OpenAI over the Pentagon deal around the post date, and a substantial number felt betrayed."
  - Acceptable evidence is a reliable count of people taking protest actions (cancellations, uninstalls, pledges) or representative polling showing anger at OpenAI at that scale.
  - "Target period: February 27 to March 7, 2026, from the deal announcement to the post date."
support_condition: Reliable, preferably independent, figures show millions of people protesting or reporting anger at OpenAI/Altman over the deal.
contradiction_condition: Reliable figures show the backlash was limited to thousands or hundreds of thousands of people.
measurement_requirements: Absolute counts of protest actions or representative polling of anger toward OpenAI/Altman.
source_requirements: Independent analytics or polling preferred. Self-reported campaign counts are weaker.
