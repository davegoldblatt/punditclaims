assessment_axis: historical_observation
explicit_source_elements:
  - '"I can find little proof"'
  - '"Core Scientific"'
  - '"any meaningful compute capacity at all"'
  - "context: CoreWeave's S-1 cites a deal for \"more than 500 MW of capacity\""
  - "context: he cites $24.3 million of 2024 HPC hosting revenue from the 10-K"
evaluator_interpretation:
  - "The claim is about what the public record showed when he wrote, not about his private search. Plain reading: as of mid-March 2025, public evidence showed little or no meaningful operating AI or HPC capacity at Core Scientific, compared with the 500+ MW it was said to offer CoreWeave."
  - "'Meaningful' is judged against the post's own framing, the 500+ MW contract. It is not judged by whether any capacity existed. The words 'at all' still mean that clear proof of a real, operating HPC site cuts against the strongest part of the sentence."
  - Core Scientific hosts CoreWeave's GPUs in its data centers; it does not own the GPUs. 'Compute capacity' is read as operating HPC data-center capacity, the sense the post uses.
  - "Target period: FY2024, the period covered by the 10-K he cites, through the post date."
support_condition: Disclosures available by 2025-03-17 show Core Scientific's operating HPC capacity was small next to the 500+ MW contract, with most capacity still to be built or converted.
contradiction_condition: Disclosures available by 2025-03-17 show substantial operating HPC capacity, such as a large share of the 500 MW already energized and billing, or a clear, documented operating HPC site that makes 'little proof... at all' untenable.
measurement_requirements: "Core Scientific's FY2024 results and Q4 2024 earnings call: HPC hosting revenue, megawatts of critical IT load in service, and the schedule for the rest."
source_requirements: Core Scientific press releases, SEC filings, and earnings call transcripts published on or before 2025-03-17.
