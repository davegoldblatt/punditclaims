evaluator_interpretation:
  - Assess the public evidence available to the author, rather than his private search effort.
  - In context, compute means operational AI or HPC hosting infrastructure; Bitcoin hashing capacity alone does not count.
  - Meaningful means a commercial operating deployment, rather than an announcement or demonstration. It does not require completion of the entire planned expansion.
  - Use fiscal 2024, the latest complete annual reporting period before publication, to assess documented operational capacity.
support_condition: Contemporaneous disclosures provide only proposed capacity, Bitcoin mining capacity, or small demonstrations, without documenting a commercial operating HPC deployment.
contradiction_condition: Public disclosures before the post document a commercial operating HPC deployment at Core Scientific.
measurement_requirements: Distinguish operational hosting capacity from contracted power and future construction; establish that the deployment supports HPC rather than Bitcoin mining.
source_requirements: Dated company operating disclosures or independently documented deployments. Company statements establish that public evidence existed, even without an independent capacity audit.
