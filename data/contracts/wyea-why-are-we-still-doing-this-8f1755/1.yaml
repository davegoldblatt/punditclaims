explicit_source_elements:
  - Who is actually getting a profit out of this?
  - it doesn’t seem to be the companies who are buying the GPUs
  - It doesn’t seem to be the AI companies
evaluator_interpretation:
  - Profit means profit attributable to AI activities after relevant costs, rather than total corporate profit or increasing AI revenue.
  - The context includes hyperscalers buying GPUs and AI model developers. Neither category is exhaustively defined.
  - I use October through December 2025, the latest completed quarter available for reporting before the post.
  - The speaker does not specify an accounting basis, so the contract records unknown. It cannot receive a supported or contradicted money verdict without resolving that omission.
support_condition: Matched AI revenue and relevant costs show no AI-attributable profit across the companies covered by the claim.
contradiction_condition: A material company within the stated categories reports positive AI-attributable profit on a defined basis that includes the relevant costs.
measurement_requirements: Separate AI from other business activity and distinguish gross profit, operating profit, net income and cash flow. Include an explicit allocation of shared infrastructure and development costs.
source_requirements: Prefer company financial statements and reconciled disclosures identifying AI-specific revenue and costs.
