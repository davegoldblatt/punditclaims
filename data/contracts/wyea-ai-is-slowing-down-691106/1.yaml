plain_reading: true
ambiguity_flags:
  - Q1 could mean entry into the quarter or its end; the latest permissible deadline is used.
  - Monthly revenue could mean an individual month's recognized revenue or an annualized run rate.
  - Support their compute commitments has no stated financing assumptions or payment period.
  - Revenue accounting basis and gross-versus-net presentation are unspecified.
