assessment_axis: forecast_outcome
explicit_source_elements:
  - Both Anthropic and OpenAI
  - $10 billion or more in monthly revenue
  - by Q1 2028
  - or their growth rates aren’t going to support their compute commitments
evaluator_interpretation:
  - Each company must meet the threshold separately; combined revenue does not qualify.
  - Read monthly revenue as recognized revenue for a calendar month, with the latest possible deadline March 31, 2028.
  - The conditional antecedent is failure to reach the threshold by that deadline.
  - Support their compute commitments means being able to meet the associated payment obligations, considering cash, financing, costs, and contractual terms.
  - Reaching the revenue threshold would not itself prove that the threshold was necessary.
  - No accounting basis is supplied for the threshold.
support_condition: After a company misses the revenue threshold, dated financial and contractual evidence shows that insufficient growth leaves it unable to fund its compute obligations.
contradiction_condition: A company misses the threshold but demonstrably retains and funds the relevant compute obligations through a credible payment and financing plan.
measurement_requirements: Separate monthly recognized revenue for each company, comparable accounting treatment, payment schedules, liquidity, financing availability, and evidence of performance on the relevant obligations. Annualized revenue alone is insufficient.
source_requirements: Company financial statements and contract disclosures, supplemented by reliable reporting where private terms are unavailable.
metric_scope:
  company: Anthropic and OpenAI, assessed separately
  metric: monthly revenue
  currency: USD
  units: billions per month
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2028-01-01
  period_end: 2028-03-31
  stock_or_flow: flow
  annualized_or_realized: realized
