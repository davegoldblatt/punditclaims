assessment_axis: forecast_outcome
explicit_source_elements:
  - The new administration
  - will do everything in its power to protect businesses
  - nothing to protect individuals
evaluator_interpretation:
  - The surrounding passage limits the forecast to the new Trump administration's AI-related policy.
  - The ordinary reading of 'nothing' excludes any substantive administration action protecting individuals from AI harms.
  - Signing enforceable legislation addressing AI-generated abuse counts as an action, even if Congress also deserves credit.
  - No deadline is supplied. Do not manufacture one from the presidential term.
  - The universal wording is stronger than a prediction that business interests will usually receive priority.
support_condition: A completed, relevant policy record shows exclusive protection of businesses and no substantive action protecting individuals; no finite absence before an unstated deadline establishes support.
contradiction_condition: The administration takes at least one substantive AI-related action protecting individuals, such as signing a law establishing protections against AI-generated abuse.
measurement_requirements: Identify a completed action, its date, and the concrete protections it creates. A speech promising protection alone is insufficient.
source_requirements: Official enactment, regulatory, or enforcement records.
