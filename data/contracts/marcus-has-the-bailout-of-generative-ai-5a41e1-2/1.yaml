assessment_axis: historical_observation
explicit_source_elements:
  - the government buying a lot of chips
  - from a lot of AI companies
  - many of which are losing money
  - Genesis, announced by Executive Order on Monday
evaluator_interpretation:
  - The relevant companies are prospective sellers of chips or chip-containing systems to the government under Genesis, rather than every organization collaborating on the program.
  - The ordinary reading of losing money is a company-wide net loss. Marcus supplies no accounting basis or financial source, so accounting_basis remains unknown.
  - Many means a substantial number of the relevant suppliers. It does not necessarily mean a majority, and no numerical threshold is imposed.
  - For the ongoing financial observation, use July–September 2025, the most recent completed calendar quarter before the post. Fiscal quarters that differ from this period are context only.
  - The supplier population must reflect the program as described at its November 2025 launch. Later partnership announcements cannot by themselves establish that population.
  - This assesses the statement about suppliers' losses, not whether Genesis constituted a bailout.
support_condition: Identify the relevant prospective government chip suppliers at launch and establish that a substantial number incurred company-wide net losses in the target period, using a financial basis consistent with the claim.
contradiction_condition: Establish a sufficiently complete supplier population and comparable financial results showing that none, or only isolated members, incurred company-wide net losses. Profits at one or two suppliers alone do not contradict many.
measurement_requirements: A supplier roster linked to government purchases or documented purchase plans, followed by comparable company-wide net income or loss figures. Do not substitute operating losses, cash burn, or losses at an AI division.
source_requirements: Prefer procurement records and official program announcements for supplier identity, and company filings or disclosures for financial results. Private-company estimates require an identified source and matching accounting basis.
