assessment_axis: forecast_outcome
explicit_source_elements:
  - more complex future models
  - hundreds of millions or even a billion dollars
  - to train
evaluator_interpretation:
  - Assess the normalized forecast about subsequent OpenAI models; the GPT-4 historical figure supplies context and is not separately graded.
  - Read future models as larger successors released after the post, including models whose training began earlier.
  - Hundreds of millions means approximately $200 million or more per model. Even a billion is an optional higher scale, not a separate required threshold.
  - A qualifying larger successor establishes that the forecast cost scale was reached. The wording does not require every later model to become more expensive.
  - Use estimated model-specific training compute costs; do not substitute total corporate research spending or infrastructure investment.
support_condition: A larger OpenAI successor released after the post has a credible model-specific training-cost estimate in the hundreds of millions of dollars or higher.
contradiction_condition: A definitive end to the relevant model-development program establishes that no qualifying successor reached the stated cost scale. A cheaper individual release alone cannot falsify this undated forecast.
measurement_requirements: Model-specific training costs, with training separated from inference and total research spending. Establish the model's release date and larger scale.
source_requirements: A company disclosure or a transparent independent estimate of the relevant model's training cost.
metric_scope:
  company: OpenAI
  metric: Training compute cost per larger successor model
  currency: USD
  units: dollars per model
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: The release of a qualifying larger successor settles the forecast once a credible model-specific estimate establishes the stated cost scale. Release and cost evidence may be published separately; both must be available by the freeze.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Future models can mean models released later or training performed later.
  - More complex does not specify parameters, compute or another measure; larger training scale is used.
  - The wording does not explicitly say whether one qualifying successor suffices.
  - Training cost can include the final run alone or a broader development program.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
