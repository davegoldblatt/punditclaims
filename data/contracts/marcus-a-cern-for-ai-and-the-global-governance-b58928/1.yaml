ambiguity_flags:
  - Current AI could include specialized predictive systems as well as general-purpose LLMs.
  - Reliably has no specified accuracy or acceptable missed-harm rate.
  - Consequences and harms have no stated domain or time horizon.
  - General-purpose, real-world recommendations are inferred from the surrounding discussion.
  - The current-month reporting window is an evaluator choice for an ongoing observation.
