  - Compositionality remains a problem.
  - So does negation.
  - large language models
evaluator_interpretation:
  - The ordinary reading is that contemporary LLMs still showed systematic failures, not that they invariably failed either capability.
  - Compositionality means correctly combining component operations or instructions. Negation includes following negatively phrased instructions.
  - For this ongoing observation, use the latest completed calendar year and the publication-year period through the post as the reporting window. These capabilities have no standard quarterly reporting cycle.
  - The surrounding examples concern generated images, but this assessment follows the supplied proposition about LLM capabilities. It does not independently establish image-generation failure rates.
support_condition: Contemporary model evaluations document repeatable, material failures in both compositional tasks and negation.
contradiction_condition: Broad, reproducible evaluations show that both capabilities were dependable across varied tasks and ordinary prompts, with the alleged failures explained by defective tests or obsolete models.
measurement_requirements: Repeated tests with explicit correctness criteria; distinguish negative-instruction failures from inability to follow the equivalent positive instruction.
source_requirements: Original evaluations or researchers' reports concerning contemporary models. The speaker's examples alone are insufficient.
