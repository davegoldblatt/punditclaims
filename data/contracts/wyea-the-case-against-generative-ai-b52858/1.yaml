assessment_axis: causal_assessment
explicit_source_elements:
  - by continuing to perpetuate the myth of AI
  - the media guarantees
  - retail investors and regular people’s 401Ks will suffer
evaluator_interpretation:
  - The ordinary reading is financial harm caused partly by continued favorable AI coverage, through its influence on investment exposure.
  - The reference to 401Ks gives the claim a US retirement-account component. Losses elsewhere cannot establish that component.
  - Continued coverage promoting transformative AI benefits is the observable antecedent. Calling that coverage a myth is part of the disputed claim, not an assumed fact.
  - The claim concerns future consequences and specifies no deadline, loss threshold, or reporting period.
support_condition: Evidence connects continued favorable AI coverage to investment decisions or exposure and subsequent AI-related losses among both retail investors and 401(k) participants. It must establish a causal contribution, rather than merely show that coverage and losses occurred.
contradiction_condition: Credible causal evidence shows that the alleged coverage did not increase financial harm, or reduced it, in the relevant investor populations. Temporary gains alone cannot contradict an undated claim of future harm.
measurement_requirements: Identify the coverage, exposure to it, resulting investment behavior, and account-level investment returns separated from contributions and withdrawals. Account for alternative causes of losses.
source_requirements: Prefer account records and credible causal research. Reporting of individual losses can establish those losses but cannot alone establish media causation or effects on 401(k)s.
