assessment_axis: historical_observation
explicit_source_elements:
  - big tech — primarily Google, Amazon and Microsoft
  - bankrolling the generative AI boom
  - through investment
  - heavily subsidizing the rates that OpenAI (and likely Anthropic) pay to run their services
  - pouring billions of dollars of venture capital into AI companies
evaluator_interpretation:
  - "Plain reading: by September 2024, Google, Amazon and Microsoft had put billions of dollars into leading generative AI companies, and OpenAI got its compute from Microsoft at preferential (below-market) rates."
  - Preferential or discounted pricing counts as 'subsidizing'. It does not have to be below Microsoft's own cost.
  - The Anthropic subsidy is hedged ('likely'), so it is not required for support. Big Tech investment in Anthropic still counts toward 'bankrolling' and 'venture capital'.
  - The claim describes an ongoing state as of the post. The target period covers the investments and pricing in place from early 2023 up to the post date. It is not narrowed to a single quarter.
support_condition: Credible reports or filings show multibillion-dollar investments by Microsoft, Amazon and/or Google in OpenAI or Anthropic during 2023–2024, plus reporting that OpenAI paid Microsoft discounted or below-market compute rates.
contradiction_condition: Evidence shows the named firms had not made large investments in AI labs, or that OpenAI paid standard or above-market rates for its Microsoft compute.
measurement_requirements: No numeric threshold. Investments must be in the billions of dollars, and the compute pricing must be reported as below normal rates.
source_requirements: Company announcements, filings, or reputable news reports. The compute rates are private, so press reports are acceptable for them.
