explicit_source_elements:
  - primarily Google, Amazon and Microsoft
  - bankrolling the generative AI boom
  - heavily subsidizing the rates that OpenAI (and likely Anthropic) pay
  - billions of dollars of venture capital
evaluator_interpretation:
  - The named companies collectively provide financing and preferential compute terms; the sentence does not say that every company subsidizes both laboratories.
  - The ordinary reading of subsidizing rates includes substantial preferential discounts. It does not necessarily mean charging below operating cost.
  - Anthropic's subsidy is expressly tentative and is not treated as a firm commitment.
  - For the ongoing financial state, the target is April–June 2024, the latest completed calendar quarter ordinarily reportable before publication. Earlier financing announcements and reports without a matching measurement period are context.
  - The financial metric below represents the compute-pricing component. Investment commitments are separate contextual measurements.
  - The supplied words identify no accounting or estimation basis for the claimed subsidy; that basis remains unknown.
support_condition: Matching-period records establish substantial financing by the named companies and materially preferential compute rates for OpenAI relative to comparable customers.
contradiction_condition: Matching-period records establish that the asserted substantial financing or preferential OpenAI compute rates did not exist. Missing public pricing information alone does not contradict the claim.
measurement_requirements: Separate invested capital, investment commitments, compute credits, contractual discounts and below-cost service. Compare equivalent hardware, service terms, volumes and commitments.
source_requirements: Prefer financing disclosures and contracts. Reporting on private pricing may be used with its sourcing and uncertainty disclosed.
