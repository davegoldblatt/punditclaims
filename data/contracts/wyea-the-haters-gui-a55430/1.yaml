explicit_source_elements:
  - GPUs that, on installation, immediately start losing the company in question money
  - Large Language Models burn cash for negative returns
  - products that all kind of work the same way
evaluator_interpretation:
  - The ordinary reading concerns losses attributable to operating AI GPUs and supplying LLM products, rather than the initial purchase payment alone.
  - Use January–March 2025, the latest commonly reported financial quarter available before the post, for the ongoing financial assertion.
  - The wording does not identify particular owners, an accounting basis, or whether returns means operating profit, net income, cash flow, or lifetime investment returns.
  - Product similarity refers broadly to overlapping functions. No similarity threshold is supplied.
support_condition: Comparable deployment-level records show negative attributable returns from the start of operation across the claimed population, alongside negative LLM cash returns. Company-wide losses alone cannot establish this.
contradiction_condition: Reliable, comparable records establish positive attributable returns from installed AI GPUs or LLM operations within the target period, contradicting the categorical financial assertion.
measurement_requirements: Deployment revenues and benefits, operating costs, depreciation, financing costs, investment dates and cash flows, with a consistent definition of return. Product similarity requires a separately specified comparison.
source_requirements: Prefer financial filings and deployment-level operating records. Separate company totals, cloud segments, individual deployments and LLM businesses.
