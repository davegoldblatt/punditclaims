evaluator_interpretation:
  - Read the claim as an existing overall surplus of usable Azure AI capacity relative to customer demand.
  - In context, consumer demand refers to customers consuming Microsoft's services, including business customers; it is not limited to household purchases.
  - Use Microsoft's fiscal second quarter, October through December 2024, as the latest completed publicly reported quarter before the post.
  - Distinguish existing usable capacity from prospective leases and future construction.
support_condition: Evidence for the target quarter shows that usable Azure AI capacity exceeded customer demand overall, leaving a material surplus.
contradiction_condition: Evidence for the target quarter shows that customer demand remained constrained by available Azure AI capacity.
measurement_requirements: Assess demand against usable capacity for the same service and period. Planned capacity cancellations alone do not establish an existing surplus.
source_requirements: Prefer contemporaneous operating disclosures or independent utilization measurements; identify management statements as such.
