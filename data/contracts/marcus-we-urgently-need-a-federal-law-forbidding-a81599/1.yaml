explicit_source_elements:
  - Scammers
  - among the first to adopt these tools
  - indeed they already have
evaluator_interpretation:
  - The second sentence makes this an assertion about adoption already occurring before the post.
  - "'These tools' refers broadly to AI video, voice and human-impersonation tools, rather than specifically to OpenClaw."
  - "'Among the first' means adoption during the tools' early availability, not necessarily the first individual users."
  - Because 'already have' concerns adoption history, the target includes prior adoption through February 14, 2026; the source supplies no starting date.
  - Both actual use and comparatively early adoption must be established to support the whole claim.
support_condition: Documented scam use before the post, together with a reliable timeline placing scammers among early adopters of the relevant tools.
contradiction_condition: Reliable adoption histories establish that scammers adopted the relevant tools only substantially later, or show that the alleged prior uses did not occur.
measurement_requirements: Dated scam cases and a comparison with tool availability and other users' adoption; allegations must be distinguished from verified uses.
source_requirements: Law-enforcement findings, direct threat research, tool release histories or well-sourced contemporaneous reporting.
