explicit_source_elements:
  - They are all
  - losing tons of money
  - have no path to profitability
evaluator_interpretation:
  - The immediate antecedent is Cognition, Perplexity, Cursor, Lovable, Cohere, Replit and Glean.
  - The ordinary reading is substantial whole-company losses and no financially credible route to whole-company profitability for each company. Positive gross margins alone do not establish profitability.
  - Use July–September 2025, the latest completed calendar quarter before publication, as the reporting window for the ongoing loss claim. The companies do not necessarily share reporting calendars.
  - Assess the profitability-path statement using business economics and plans applicable to that period. Later profitability cannot automatically establish what was knowable then.
  - The passage supplies no accounting basis or numerical definition of substantial losses.
support_condition: Comparable financial records establish substantial whole-company losses for all seven companies in the target period, and evidence on costs, pricing and feasible growth supports the absence of a credible profitability route for each.
contradiction_condition: Comparable records establish that at least one named company was profitable or did not have substantial losses during the target period, or establish a credible, financially grounded profitability route then.
measurement_requirements: Company-level income statements, identifiable accounting bases and reporting periods, plus unit economics and operating plans. Keep net income, operating income, gross profit and cash burn separate.
source_requirements: Prefer financial statements or company disclosures. Credibly sourced financial reporting may supplement them; revenue milestones and funding announcements cannot establish profit.
