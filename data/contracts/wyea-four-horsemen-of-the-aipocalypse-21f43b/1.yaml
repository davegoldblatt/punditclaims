assessment_axis: forecast_outcome
explicit_source_elements:
  - by the end of 2026
  - a majority of AI services
  - move some or all of their customers
  - to token-based billing
evaluator_interpretation:
  - A majority means more than half of services, counted equally rather than weighted by revenue or customers.
  - Move means an actual billing transition for existing customers after the post. An already available token-priced API does not establish a transition.
  - Credits qualify when their consumption is tied to tokens. Generic usage limits or request allowances do not automatically qualify.
  - The population is commercial generative AI services. Restricting it to a selected list of major providers would add a qualification the speaker did not supply.
  - The cost explanation is a proposed motivation, not an antecedent that must occur before the forecast applies.
support_condition: Dated billing records establish that more than half of a defensibly defined service population transitioned at least some existing customers to token-based billing between the post and December 31, 2026.
contradiction_condition: At the deadline, a sufficiently complete population count establishes that half or fewer made a qualifying transition.
measurement_requirements: A documented service population, consistent counting rules, baseline billing policies, and effective dates of qualifying transitions.
source_requirements: Prefer dated provider announcements and billing documentation. A representative survey must disclose its population and treatment of missing policies.
metric_scope: null
original_horizon: by the end of 2026
horizon_interval:
  start: 2026-04-21
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Early support requires documented, implemented transitions exceeding half of an established population. Announcements concerning a few providers cannot settle the claim. Non-occurrence before the deadline cannot establish failure.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No service population or geographic boundary is specified.
  - It is unclear whether products, providers, or individual subscription offerings are the counting unit.
  - The treatment of newly launched services is unspecified.
retrospective_or_prospective: prospective
