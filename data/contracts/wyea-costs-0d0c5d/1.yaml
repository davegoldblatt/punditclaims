ambiguity_flags:
  - The sentence has no standalone period; January–September 2025 is inherited from the surrounding comparison.
  - In the hole does not specify accounting loss, cash burn or cumulative deficit.
  - Likely is an explicit hedge without a probability threshold.
  - Billions is an approximate magnitude.
  - The firm premise is assessable, while the tentative extension is not a standalone binary probability claim.
