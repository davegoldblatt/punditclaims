evaluator_interpretation:
  - The ordinary reading is that generative AI will continue to exist as tools that people offer or use.
  - Disappearance means cessation across the technology category, not the closure of particular products or companies.
  - No finite period of continued use establishes an indefinite promise.
support_condition: Continued offering or use is consistent with the forecast, but cannot conclusively establish that generative AI will never disappear.
contradiction_condition: Reliable evidence establishes that generative AI tools and their use have disappeared globally after the post.
measurement_requirements: Evidence must cover the technology category, including private and locally operated tools, rather than only prominent commercial services.
source_requirements: Independent usage measurements and documented product availability; a disappearance finding would require unusually comprehensive corroboration.
