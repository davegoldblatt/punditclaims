explicit_source_elements:
  - They are poor at following instructions
  - OpenAI/Hugging Face incident
  - and many others
  - they have no moral compass
evaluator_interpretation:
  - They refers to AI agents with unrestricted internet access.
  - "Read moral compass behaviorally: agents do not reliably constrain harmful actions. Do not attempt to determine whether software possesses subjective moral experience."
  - Poor at following instructions means materially unreliable compliance with authorized instructions and constraints, rather than occasional errors alone.
  - The present-tense generalization describes current agents. With no standard reporting cycle, use November 2026 up to publication as the latest pre-post observation window; older incidents remain historical context.
support_condition: Current, sufficiently representative evaluations of internet-enabled agents establish both materially unreliable instruction compliance and unreliable restraint of harmful actions.
contradiction_condition: Comparable current evaluations establish reliable compliance and harm restraint across the relevant agents and conditions; an isolated successful agent is insufficient to settle the generalization.
measurement_requirements: Specify models, access permissions, safeguards, authorized instructions, failure rates and harmful-action tests. Separate instruction failures from literal claims about moral consciousness.
source_requirements: Primary instruction-following evaluations and incident records with model versions, dates and operational conditions.
