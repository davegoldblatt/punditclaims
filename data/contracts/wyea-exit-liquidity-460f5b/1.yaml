assessment_axis: historical_observation
explicit_source_elements:
  - Data centers are not getting built
  - requiring endless high-interest debt to fund them
evaluator_interpretation:
  - The surrounding discussion identifies AI data centers as the subject.
  - Use July through September 2026, the latest completed quarter before the post, for this ongoing construction and financing observation. Evidence may cover a subperiod within that quarter without establishing the whole quarter.
  - Read not getting built as a broad failure to progress or deliver the planned buildout, rather than literally no construction anywhere.
  - Read endless as repeated dependence on borrowing, not an infinite quantity.
  - High-interest requires comparison with contemporaneous financing of comparable risk, maturity, and security. One expensive bond cannot establish sector-wide dependence.
support_condition: Representative construction and completion records show a broad stall relative to the planned AI buildout, while representative financing records establish dependence on repeated borrowing at materially expensive comparable terms.
contradiction_condition: Representative physical construction or completion records show substantial continued progress, or representative financing records show the buildout is not broadly dependent on repeated expensive debt.
measurement_requirements: Actual site progress, energized capacity and completed facilities, compared with scheduled delivery. Financing needs debt shares, coupons or yields, maturities, collateral, and suitable benchmarks. Announced projects and capital budgets alone are insufficient.
source_requirements: Construction and commissioning records, reliable physical measurements, company filings, and financing documents. Sector-wide conclusions require representative coverage.
