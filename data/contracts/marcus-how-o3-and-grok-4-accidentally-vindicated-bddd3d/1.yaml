assessment_axis: historical_observation
explicit_source_elements:
  - pure LLMs can’t reliably apply algorithms
  - if you enhance them with symbolic processes
  - they often give better results
  - So here’s where we are
evaluator_interpretation:
  - This describes contemporary capabilities, not a mathematical impossibility or a prediction about all future LLMs.
  - Pure LLMs means models producing answers without an external interpreter, calculator, or symbolic solver. Text-only reasoning models remain within this category.
  - Reliably means consistently executing valid procedures across changes in inputs and task complexity. The surrounding text expressly allows success on easy, familiar problems.
  - Symbolic processes includes executing generated code and using computer algebra systems. Better results means higher correctness on comparable tasks.
  - Often means recurring improvements across tested models or task groups, without implying that every model benefits or specifying a numerical majority.
  - "Research has no fixed reporting quarter. I use the current year through the post date as the contemporary observation period: January 1–July 13, 2025."
  - The parenthetical claim of historical vindication is not treated as a separate assertion about intellectual priority.
support_condition: Contemporary controlled tests show substantial failures in unaided algorithm execution across valid inputs or increasing complexity, and same-model comparisons show recurring correctness improvements when external symbolic execution is enabled.
contradiction_condition: Broad controlled tests show consistently reliable unaided execution across varied algorithmic tasks and complexities, or comparable symbolic enhancements generally fail to improve correctness. Isolated successes or isolated tool failures do not alone contradict the contextual claim.
measurement_requirements: Use verified correctness on solvable tasks. Separate generating an algorithm from executing it, account for output limits, and prefer comparisons holding the model and task set constant.
source_requirements: Primary experimental reports with identifiable models, methods, and results. Later reports may clarify the historical experiments, but tests of later model generations cannot decide this observation.
