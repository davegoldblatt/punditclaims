explicit_source_elements:
  - massive amounts of data
  - as a substitute for intelligence
  - has led us all the way into
  - the apparent AI bubble
evaluator_interpretation:
  - The firm claim is that belief in data-driven scaling contributed materially to the AI investment boom visible by the post date.
  - The surrounding discussion concerns scaling language models, including the computing resources needed to train and run them.
  - The word 'apparent' qualifies the description of a bubble. Support does not require proving that valuations were unsustainable or that a crash occurred.
  - Causal contribution does not mean the sole or principal cause. Documented investment decisions explicitly motivated by scaling expectations can establish a contribution.
  - This is a claim about investment motivation, not a specified company's financial metric.
support_condition: Contemporaneous records connect expectations that scaling data-driven models would produce greater intelligence with substantial investment decisions contributing to the boom.
contradiction_condition: Credible records establish that the attributed scaling belief did not materially contribute to the investment boom. Evidence of additional motives alone does not contradict the claim.
measurement_requirements: Identify actual investment decisions and their stated rationale. Distinguish announced commitments from completed investment and distinguish causal evidence from coincident enthusiasm.
source_requirements: Prefer contemporaneous investor disclosures and company strategy statements. Marcus's own account cannot establish the causal connection.
