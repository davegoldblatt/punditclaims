evaluator_interpretation:
  - "Reading: the belief that scaling data and compute would yield general intelligence was a main driver of the AI investment boom, and that boom is a bubble."
  - "Two parts must hold: (a) the scaling belief drove the investment surge, and (b) the surge is a bubble. Marcus hedges (b) with 'apparent'."
support_condition: Documented investment rationales tie massive AI spending mainly to the scaling belief, and credible evidence shows the spending is a bubble (for example a valuation collapse or a broad write-down tied to failed scaling expectations).
contradiction_condition: Evidence shows the investment surge was driven mainly by other factors (for example realized revenue or demand for current products) and not by the scaling belief, or that AI valuations were justified by later results.
measurement_requirements: null
source_requirements: Company statements of investment rationale, financial data on AI valuations and spending, and independent economic analysis of whether a bubble exists.
