evaluator_interpretation:
  - The White House and recession context points to a US economic downturn.
  - Goes down means a broad recession or comparable economy-wide contraction, not simply a fall in AI stock prices.
  - At the center means a major causal contribution from the ChatGPT-centered generative-AI boom or its reversal, rather than mere involvement.
  - No deadline is supplied.
support_condition: After a qualifying downturn occurs, credible economic evidence identifies the ChatGPT-related generative-AI boom or bust as a central contributor.
contradiction_condition: After a qualifying downturn occurs, credible economic evidence establishes that ChatGPT-related activity was peripheral and other causes explain the downturn.
measurement_requirements: Establish the downturn separately from causal attribution. Examine investment, employment, credit, and spending channels rather than relying on contemporaneous headlines.
source_requirements: Official economic records for the condition and credible causal analyses for the consequent, available by the evaluation date.
