ambiguity_flags:
  - "'Built for no-one' is hyperbole: the same sentence names the labs paying for the compute."
  - "'Afford' is in scare quotes, which implies the speaker doubts even the labs can truly pay."
  - The speaker allows 'a few billion dollars' of other demand, which blurs where an exception becomes material.
  - He named no period; I used the first half of 2026 as the latest period public evidence covers.
