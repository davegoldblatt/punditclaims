assessment_axis: historical_observation
explicit_source_elements:
  - those hundreds of billions of dollars of data centers
  - are being built for no-one
  - the only companies that can 'afford' to pay for even a fraction of the compute
  - are unprofitable AI companies propped up by hyperscalers
evaluator_interpretation:
  - Read with the passage, which says the only companies that can afford compute are 'either hyperscalers or the companies that hyperscalers subsidize'. Hyperscalers (Microsoft, Google, Amazon, Meta) and their subsidized labs (OpenAI, Anthropic) are therefore not counterexamples.
  - "Plain reading: outside hyperscalers and the loss-making AI labs they prop up, nobody is paying for meaningful AI data-center capacity. The speaker allows that outside demand may come to 'a few billion dollars'."
  - "Period: an ongoing state at the post date. I use the first half of 2026 (2026-01-01 to 2026-06-30), the latest period public deals and backlog reports cover."
  - The claim has two parts. The concentration part (contracted capacity mostly goes to OpenAI and Anthropic) and the exclusivity part ('only' such companies can pay for 'even a fraction') are tested separately.
support_condition: Evidence that contracted AI compute is overwhelmingly owed by hyperscalers and the hyperscaler-backed labs, with no meaningful outside buyer able to pay.
contradiction_condition: Evidence that a company that is neither a hyperscaler nor a hyperscaler-subsidized AI lab, and is able to pay, has committed billions of dollars to AI data-center compute.
measurement_requirements: Customer mix of contracted AI compute at hyperscalers and neoclouds in the first half of 2026, and identities and sizes of large commitments from customers outside the hyperscalers and their subsidized labs.
source_requirements: Company announcements, filings and reputable news reports of compute contracts and backlog composition.
