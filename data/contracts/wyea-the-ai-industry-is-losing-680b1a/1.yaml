assessment_axis: historical_observation
explicit_source_elements:
  - hundreds of billions of dollars of data centers
  - being built for no-one
  - the only companies
  - unprofitable AI companies propped up by hyperscalers
evaluator_interpretation:
  - "Read 'for no-one' together with the stated exception: no credible substantial customers beyond subsidized, unprofitable AI companies."
  - The assessment concerns customer existence and classification, not an unspecified total capital-expenditure figure.
  - A substantial dedicated-capacity customer outside that class contradicts the exclusivity claim. Its own AI investment need not already be profitable.
  - Use January through March 2026, the latest completed calendar quarter with public reporting available before the post.
  - The context separately acknowledges hyperscalers' ability to spend. That qualifies the rhetoric but conflicts with the categorical sentence being assessed.
support_condition: Customer and financing records establish that all credible substantial customers for the relevant AI buildout are unprofitable AI companies dependent on hyperscaler support.
contradiction_condition: A substantial identified customer outside that class has contracted for the capacity, with evidence of independent resources to pay.
measurement_requirements: Distinguish customer identity, ability to pay, contract commitments and realized payments. Do not infer profitability of AI investment from corporate profitability.
source_requirements: Provider or customer contracts plus financial disclosures establishing the customer's resources and business status.
