assessment_axis: causal_assessment
explicit_source_elements:
  - why OpenAI has struggled to make a profit
  - there are three reasons
  - it is expensive to operate
evaluator_interpretation:
  - The ordinary reading is that serving OpenAI's products consumes enough resources to materially impede profitability.
  - The claim does not require inference costs alone to exceed revenue, or every paying customer to be unprofitable.
  - Distinguish operating existing products from training future models and financing infrastructure.
  - Use calendar 2025, the latest completed annual financial period before the post.
  - Marcus specifies neither an accounting basis nor a profit measure. Financial estimates can inform the assessment but cannot silently supply the missing basis.
support_condition: Comparable revenue and expense records show that running existing products consumes a substantial share of revenue and materially contributes to OpenAI's inability to earn profit on a specified basis.
contradiction_condition: Comparable records show that product operation is inexpensive relative to revenue and does not materially contribute to the profitability difficulties, which arise elsewhere.
measurement_requirements: Separate inference and hosting from training, capital expenditure and financing. Reconcile gross profit, operating profit, net income and cash burn.
source_requirements: Prefer financial statements or company disclosures with expense definitions. Clearly identified press-based estimates may provide context when primary accounts are unavailable.
