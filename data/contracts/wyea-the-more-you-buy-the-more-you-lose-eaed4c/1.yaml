explicit_source_elements:
  - it’s going to be tough
  - SoftBank and its various tendrils
  - $30 billion or more for Vera Rubin chips
  - $14 billion for construction
  - a “deal” is signed
  - some sort of debt financing takes place
evaluator_interpretation:
  - The ordinary reading predicts material difficulty securing the specified project funding, not that no agreement or financing will occur.
  - Material difficulty would mean documented failed funding attempts, financing-driven delays, or unusually burdensome concessions. These indicators are evaluator interpretations; the speaker supplies no numerical measure.
  - The amounts are estimates of funding needs for chips and construction, not reported spending or revenue.
  - A guarantee, lease or general corporate investment is not automatically money raised for either specified use.
  - No deadline is stated.
support_condition: Project-specific records establish substantial financing difficulty in securing at least USD30 billion for the chips and USD14 billion for construction, or permanent abandonment expressly caused by inability to obtain that funding.
contradiction_condition: Binding funding for both specified uses is secured through ordinary commercial channels, with sufficient evidence that the process involved no material financing difficulty. Merely announcing or closing a deal does not contradict the wording.
measurement_requirements: Binding financing amounts, recipients, permitted uses, draw conditions, funding dates and commercial terms; distinguish guarantees, equity commitments, debt facilities and actual proceeds.
source_requirements: Borrower and lender disclosures, financing agreements, securities filings or independently verified reporting on financing negotiations.
metric_scope:
