early_resolution_rule: A completed financing process covering both specified uses, with disclosed terms and evidence of the difficulty encountered, could settle the forecast. Permanent project abandonment explicitly caused by inability to finance could also settle it. Partial financing or a contingent guarantee cannot.
interpretation_determines_result: true
