assessment_axis: causal_assessment
explicit_source_elements:
  - configurations that have been dominant over the last three decades
  - trouble generalizing beyond the multidimensional space that surrounds their training examples
  - limits their ability to reason and plan reliably
evaluator_interpretation:
  - The ordinary reading is that weak generalization to unfamiliar cases contributes to reasoning and planning errors in commonly used neural networks.
  - I interpret the spatial language as unfamiliar distributions or combinations, not a precise geometric boundary.
  - This assesses configurations common by the post date. It does not assert that every neural network fails or that improvements are impossible.
  - The preceding three decades describe the scope of configurations, not a requirement that the limitation be demonstrated in every year.
support_condition: Controlled studies show that unfamiliar combinations or equivalent task variants substantially reduce reasoning and planning accuracy in common configurations, linking the failures to poor generalization.
contradiction_condition: Representative controlled studies show reliable transfer to unfamiliar reasoning and planning cases, and establish that the alleged generalization limitation does not explain the failures.
measurement_requirements: Compare familiar and unfamiliar cases while controlling task rules, scoring, prompting and relevant difficulty. Distinguish ordinary configurations from specially trained alternatives.
source_requirements: Primary experimental studies with documented tasks, training or evaluation procedures, and results.
