evaluator_interpretation:
  - The problem refers to misinformation on Twitter.
  - The plain reading is a substantial near-term increase in misinformation's prevalence, volume, or reach.
  - About to indicates urgency but supplies no latest calendar date. I do not invent a deadline.
  - This claim concerns deterioration itself; the proposed explanation involving cheaper language models is assessed separately.
support_condition: Comparable, broadly representative measurements show a substantial deterioration in misinformation on Twitter shortly after the post.
contradiction_condition: Comparable measurements covering the near-term period establish stable or improving misinformation levels across the relevant measures. A narrow sample or one unchanged proxy is insufficient.
measurement_requirements: Consistent sampling, misinformation definitions, and denominators before and after November 9, 2022. Distinguish misinformation from hate speech and source unreliability.
source_requirements: Primary platform measurements or transparent independent research with methods and dated observations.
