assessment_axis: causal_assessment
explicit_source_elements:
  - Hyperscalers have invested over $800 billion in the last three years
  - plans to add another $700 billion or so in 2026
  - another $1 trillion in 2027
  - at least three trillion dollars in AI specific revenue just to break even
  - $6 trillion or more for AI to be anything other than a wash
evaluator_interpretation:
  - Assess the asserted financial implication of historical investment and announced plans, rather than a forecast that the revenue will be earned.
  - Read the historical three years as 2023–2025 and the future figures as plans existing on May 19, 2026.
  - The following paragraph names Microsoft, Meta, Amazon and Google; provisionally use those four, while flagging that other definitions of hyperscalers include additional firms.
  - Read the revenue thresholds as cumulative because the passage compares them with cumulative investment and supplies no annual revenue period.
  - No numerical return target defines “anything other than a wash”.
  - The passage does not specify a common accounting basis for investment or the revenue calculation. Retain unknown.
support_condition: Comparable historical spending and contemporaneous plans establish the stated inputs, and a reproducible financial model shows that at least $3 trillion of cumulative AI-specific revenue is necessary to break even and at least $6 trillion is necessary for the defined worthwhile return.
contradiction_condition: Comparable records disprove a material spending premise, or a complete model using the same company scope, period, accounting treatment and return definition demonstrates that the asserted minimum revenue is not necessary.
measurement_requirements: Reconcile cash capital expenditures, finance leases and other investments; identify the AI share; specify operating costs, asset lives, utilization, financing costs, residual values, revenue timing and the required return. Do not substitute annual revenue for cumulative revenue.
source_requirements: Prefer company filings and guidance existing at the post date. Analyst projections must be identified as estimates rather than company commitments. A break-even model must disclose its assumptions.
metric_scope:
  company: Hyperscalers; provisionally Microsoft, Meta, Amazon and Alphabet
  metric: Cumulative AI-specific revenue required to recover historical and planned capital investment and earn a worthwhile return
  currency: USD
  units: trillions of dollars
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Hyperscaler membership is unspecified.
  - “Last three years” could mean calendar years, fiscal years or a rolling interval.
  - No common definition of investment or treatment of leases.
  - No AI-specific share of total spending.
  - No revenue recovery period.
  - No defined return threshold for “more than a wash”.
  - Company plans and analyst forecasts may be conflated.
