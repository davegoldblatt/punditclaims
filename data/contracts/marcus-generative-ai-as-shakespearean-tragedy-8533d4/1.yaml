ambiguity_flags:
  - Calendar 2023 is the evaluator's choice of the latest completed annual funding period.
  - Annual funding flows versus accumulated funding are unspecified.
  - The boundary between alternative and hybrid approaches is unspecified.
  - "'Nearly' has no numerical threshold."
  - Geography and coverage of private investment, internal corporate spending, and public grants are unspecified.
  - "'Intellectual monoculture' is a qualitative characterization."
