assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI will need more than it last asked for
  - without fail
  - every single year
evaluator_interpretation:
  - The plain reading is a claim about increasing annual external financing requirements, not merely larger company valuations.
  - The preceding $122 billion round supplies context for the initial comparison, but a completed round is not necessarily identical to the amount originally requested.
  - Calendar years are an evaluator convention; the speaker did not specify calendar versus fiscal years.
  - Need must be established from cash requirements. A smaller individual round does not establish a smaller full-year requirement.
  - No final year is stated, so this has an open horizon.
support_condition: Comparable records establish that each completed subsequent year's financing requirement exceeds the relevant preceding funding request. A finite sequence can support only those years, not the unrestricted every-year claim.
contradiction_condition: One completed subsequent year has a verified external financing requirement no greater than the preceding funding request.
measurement_requirements: Annual cash requirements, beginning cash, operating cash flows, obligations and financing requests. Distinguish requests, commitments, receipts and secondary share sales.
source_requirements: Financial records or reliable reporting sufficient to reconcile full-year financing needs. Individual round announcements alone are insufficient.
metric_scope:
  company: OpenAI
  metric: Annual external financing required
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: unknown
