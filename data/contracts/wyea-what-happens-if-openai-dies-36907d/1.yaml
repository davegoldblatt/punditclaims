condition_status: not_applicable
early_resolution_rule: A verified completed-year counterexample can contradict the universal forecast. A smaller proposed round or an incomplete year cannot. Finite annual increases cannot conclusively establish every future year.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No terminal year.
  - Calendar versus fiscal years unspecified.
  - The last request may differ from the last completed round.
  - Annual need differs from individual fundraising rounds.
