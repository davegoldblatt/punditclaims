evaluator_interpretation:
  - Assess the empirical criticism of media portrayal. The preceding statement about what vulnerable patients should do is normative.
  - The ordinary reading is that misleading portrayals of chatbot intelligence and friendliness were a recurring feature of contemporary coverage.
  - Use January through March 2023, the latest complete quarter before publication, for the ongoing state of media discussion.
  - Neither a majority-of-coverage requirement nor a numerical acceptable level of exaggeration is supplied by Marcus.
support_condition: A defensible sample of contemporary coverage demonstrates recurring overstatement of both chatbot capabilities and interpersonal qualities when compared with documented behavior.
contradiction_condition: A defensible sample and capability comparison show that the alleged recurring overstatement of intelligence and friendliness was absent.
measurement_requirements: Define the sampled media, distinguish reporters' assertions from attributed quotations, and compare the portrayals with the capabilities of the particular chatbots discussed.
source_requirements: Contemporary articles and a transparent content analysis, paired with capability evidence for the relevant systems.
