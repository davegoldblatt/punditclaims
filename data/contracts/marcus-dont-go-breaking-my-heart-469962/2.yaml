explicit_source_elements:
  - essentially zero regulation
  - what these chatbots can say or do
  - how they can change over time
  - how they might treat their users
evaluator_interpretation:
  - The ordinary contextual reading concerns enforceable rules addressing consumer chatbots’ conversational behavior, changes to their relationship with users, and treatment of emotionally vulnerable users.
  - The reference to Congress makes the United States the principal jurisdiction. Marcus did not expressly exclude other countries, so overseas restrictions remain material qualifications.
  - “Essentially zero” allows limited exceptions. It does not mean that chatbot companies are exempt from every generally applicable law.
  - General prohibitions on deceptive business practices do not alone contradict this claim. Relevant counterevidence must establish concrete duties addressing the chatbot behavior described, or enforcement directly constraining that behavior.
  - The observation concerns the legal position on February 22, 2023. Laws have ascertainable effective dates, so no quarterly reporting-period substitution is needed.
support_condition: Evidence establishes that, on February 22, 2023, US consumer chatbots faced negligible enforceable requirements addressing their conversational behavior, emotionally consequential changes, and treatment of vulnerable users. Narrow disclosure provisions would not alone defeat this reading.
contradiction_condition: "Evidence establishes substantial enforceable US requirements directly governing one or more of those behaviors. A comprehensive chatbot statute is not necessary: specific applicable duties or enforcement addressing the described conduct can suffice."
measurement_requirements: Identify each relevant rule’s jurisdiction, effective date, covered services, required or prohibited behavior, and enforcement mechanism. Distinguish enacted and operative requirements from proposals, voluntary guidance, and general legal authority.
source_requirements: Prefer legislation, regulations, regulator decisions, and official legal histories. Later publications may establish the February 2023 position retrospectively, but later enactments cannot themselves settle it.
