explicit_source_elements:
  - If there happens not to be a lot
  - black doctors with white patients
  - in the dataset
  - the system is SOL
evaluator_interpretation:
  - Interpret the system as the contemporaneous DALL-E 3 discussed immediately before this sentence.
  - The ordinary reading of 'SOL' is inability to produce the requested pairing reliably, rather than a mathematical assertion that no successful image is possible.
  - This is a hypothetical causal claim, not a claim that the specified training-data scarcity has been measured.
  - Use October 1–14, 2023 for the contemporaneous system state; the month boundary is inferred from the post date.
support_condition: Evidence establishes scarcity of this pairing in the relevant training data and shows, through controlled tests or interventions, that this scarcity prevents reliable generation of the requested pairing.
contradiction_condition: The relevant model reliably generates the pairing despite independently established scarcity, or controlled interventions demonstrate that scarcity does not produce the asserted limitation.
measurement_requirements: Training-data prevalence for the joint doctor-patient pairing; repeated generation across prompt paraphrases; human scoring of roles and perceived race; controls for refusals, prompt rewriting and other deployment effects.
source_requirements: A training-data audit or credible controlled training experiment, together with reproducible tests of the relevant DALL-E version. Tests of another image generator cannot settle this claim.
