assessment_axis: causal_assessment
explicit_source_elements:
  - From ELIZA to Goostman to ChatGPT 4.5
  - prompted to sound like a young, slangy introvert
  - all prey on the human tendency
  - over-attribute intelligence
  - mimic human mannerisms
evaluator_interpretation:
  - "'Prey on' describes a causal mechanism, without requiring conscious intent by the systems."
  - Humanlike mannerisms must increase attributed intelligence beyond what demonstrated competence warrants.
  - The claim covers each named system. Evidence about other chatbots is relevant context but cannot establish the universal statement.
  - Mistaking a system for a human is not itself a measurement of overestimated intelligence.
support_condition: Controlled studies or comparably strong causal evidence establish that humanlike mannerisms inflate intelligence judgments beyond demonstrated competence for each named system.
contradiction_condition: Adequately powered evidence shows that the proposed mechanism does not account for judgments about at least one named system, or that the attributed intelligence is warranted by independently measured competence.
measurement_requirements: Measure intelligence judgments and actual competence separately; vary humanlike presentation while holding substantive performance sufficiently constant.
source_requirements: Public experimental studies or detailed causal investigations, available by the evaluation date, relevant to the systems described by April 2, 2025.
