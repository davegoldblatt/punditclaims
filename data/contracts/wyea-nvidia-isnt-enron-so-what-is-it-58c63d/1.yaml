explicit_source_elements:
  - Any kind of depreciation schedule
  - at best, assumptions
  - at worst, hope
evaluator_interpretation:
  - The surrounding discussion limits the claim to data center GPUs.
  - The ordinary reading is that useful-life schedules depend on uncertain projections of durability, obsolescence and demand. The context also questions how well those projections have been validated.
  - Merely showing that accounting uses estimates would establish the narrow reading, but would not establish that the estimates lack adequate empirical support.
  - Use July–September 2025, the latest completed calendar quarter reportable before publication, for the ongoing accounting practice.
  - Treat 'hope' as rhetorical emphasis, not a separately measurable assertion about management's beliefs.
support_condition: Accounting policies and supporting studies show that GPU useful-life schedules depend on projections whose full physical and economic lifespans remain unvalidated. Supporting the stronger contextual reading also requires evidence that the available empirical support is inadequate.
contradiction_condition: Representative engineering, retirement and commercial-use records establish the scheduled economic lives sufficiently well to contradict the suggestion that the schedules rest only on unvalidated projections.
measurement_requirements: Distinguish physical survival, continued utilization and profitable economic use. Evidence that an older GPU remains rented does not establish its complete useful life.
source_requirements: Company accounting policies, engineering or fleet studies, retirement records and commercial-use evidence. Management assurances alone cannot validate a full useful life.
