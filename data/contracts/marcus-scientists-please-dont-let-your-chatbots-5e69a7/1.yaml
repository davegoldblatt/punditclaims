assessment_axis: historical_observation
explicit_source_elements:
  - Statistical word prediction is no substitute for real math
evaluator_interpretation:
  - In the surrounding discussion of a pace calculation, the ordinary reading is that contemporary unaided ChatGPT was not a dependable replacement for mathematical computation requiring correct numerical answers.
  - This is not interpreted as a theorem that all future language models must fail at mathematics, or that contemporary models could solve no mathematical problems.
  - For this ongoing observation, use the publicly observable period from ChatGPT’s launch through the post, November 30, 2022 to January 14, 2023.
  - The supplied normalized proposition concerns mathematical substitutability; the accompanying assertion about how many people believed otherwise is not separately quantified.
support_condition: Contemporary demonstrations show plausible but wrong mathematical results from unaided ChatGPT on tasks handled correctly by direct computation.
contradiction_condition: Contemporary evaluations establish dependable replacement of direct computation across the relevant numerical tasks, and the alleged failures are shown to be misreported or outside that scope.
measurement_requirements: Compare actual contemporary outputs with independently computed answers. Distinguish unaided text generation from systems using calculators or other computational tools.
source_requirements: Use dated primary demonstrations or evaluations. Later tests require evidence that they describe the system and period at issue.
