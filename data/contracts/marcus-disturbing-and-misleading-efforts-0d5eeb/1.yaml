assessment_axis: causal_assessment
explicit_source_elements:
  - actions by Sam Altman
  - did play at least some role
  - that breakdown of trust
evaluator_interpretation:
  - Some role means a contributing cause, not the sole cause or conduct sufficient to justify dismissal.
  - The claim concerns the relationship breakdown culminating in the November 17, 2023 firing.
  - A company's failure to deny misconduct is not affirmative evidence. Participant accounts and documented conduct must carry the causal assessment.
support_condition: Investigation findings or corroborating participant records connect identifiable Altman conduct to the board's loss of trust.
contradiction_condition: Reliable records establish that Altman's conduct contributed nothing and that the breakdown arose entirely independently of his actions.
measurement_requirements: Evidence linking conduct to board members' assessments, rather than merely establishing that distrust existed.
source_requirements: Prefer sworn testimony, contemporaneous correspondence, investigation findings, and firsthand participant accounts; distinguish allegations from adjudicated findings.
