explicit_source_elements:
  - Based on my own reporting
  - OpenAI made $4.33bn through the end of September
  - spent $8.67bn on inference in that period
evaluator_interpretation:
  - The surrounding discussion identifies the year as 2025. The period is January through September, inclusive.
  - Made means realized company revenue. Inference spending excludes training and other operating expenses.
  - These are reporting-based estimates, not explicitly GAAP figures. Each amount must be verified separately.
  - Based on my own reporting describes the source of the assertion; it is not a conditional antecedent.
support_condition: Independent records establish January–September 2025 revenue of $4.33 billion and inference expenditure of $8.67 billion, allowing rounding to the stated precision.
contradiction_condition: Comparable records establish a materially different amount for either component. A different reporting period, annualized revenue, or a different expense category cannot supply the contradiction.
measurement_requirements: Cumulative realized revenue and separately identified inference expenditure for January–September 2025; disclose revenue-sharing treatment and cash versus accrued expenditure.
source_requirements: Public financial records or independently corroborated reporting. Repetition of Zitron's figures alone is insufficient.
