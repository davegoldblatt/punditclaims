explicit_source_elements:
  - coding products and search products that people like and pay for
  - none of these companies are profitable
  - until one of them is profitable
  - not real businesses
evaluator_interpretation:
  - Assess the factual profitability assertion. ‘Not real businesses’ is a value judgment and has no independent financial test.
  - The ordinary financial reading concerns company-level profit after expenses, not revenue growth or positive gross margin alone.
  - Use the second calendar quarter of 2025, the latest completed quarter before publication, for the ongoing observation.
  - The wording may cover the paid coding and search category generally or only firms discussed earlier. Do not silently restrict it to Cursor and Perplexity.
  - No sufficiently definite accounting basis is supplied for the category-wide assertion.
support_condition: Comparable financial records establish that every company within the intended coding and search group was unprofitable in the target period.
contradiction_condition: At least one company within the intended group has positive company-level profit during the target period on a comparable, established accounting basis.
measurement_requirements: Identify the company universe and reporting basis. Separate gross margin, operating profit, net profit, cash flow, and founder-defined profit.
source_requirements: Company financial disclosures or credible reporting that defines the profit measure and period. Founder statements must be identified as such.
