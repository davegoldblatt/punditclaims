assessment_axis: forecast_outcome
explicit_source_elements:
  - growth rate is predominantly based on
  - $2 to $10 in tokens per dollar of subscription
  - dependent on venture capitalists’ continued
  - at some point that venture money will run out
  - much like it did during the Dot Com Bubble
evaluator_interpretation:
  - The claim combines a present causal explanation with an undated forecast. Support for the whole claim requires evidence for both.
  - I read 'predominantly' as the main source of the labs' revenue growth, rather than merely one contributing source.
  - I read 'run out' as a broad withdrawal of venture financing that prevents the relevant startups from continuing their subsidies. It need not mean that every AI investment stops.
  - Advertised token allowances valued at retail API prices do not establish startups' actual token expenditure.
  - No companies, accounting basis, measurement period, or aggregate subsidy calculation are specified.
support_condition: Representative financial records show that VC-financed startups actually spend $2–$10 on tokens per subscription dollar and principally drive lab revenue growth, followed by a broad financing withdrawal that prevents those subsidies from continuing.
contradiction_condition: Representative customer and financial records establish that the asserted subsidy mechanism does not principally drive lab growth. Continued funding alone cannot contradict an undated prediction that funding will eventually disappear.
measurement_requirements: Match actual token expenditure, subscription revenue, venture financing, and lab customer revenue over comparable periods. Separate retail token value from actual procurement cost, and financing from revenue.
source_requirements: Company financial records or independently verified customer-level data, supplemented by consistent venture-funding series. Individual user reports and advertised allowances are insufficient.
metric_scope:
  company: Unspecified AI startups purchasing tokens from AI labs
  metric: Actual token expenditure per dollar of subscription revenue
  currency: USD
  units: USD of token expenditure per USD of subscription revenue
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
