target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, sector-wide financing withdrawal can resolve the forecast early only if records also show that it stops the specified subsidies and substantiate their predominant contribution to lab growth. A funding decline or isolated startup failure is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
