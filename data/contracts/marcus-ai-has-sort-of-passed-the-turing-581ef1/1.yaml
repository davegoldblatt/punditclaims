  - Target period runs from 2014 to the post date.
support_condition: Evidence of strong human-mimicry gains, such as passing a controlled Turing test, plus evaluations from around early 2025 showing large gaps versus humans on reasoning, planning or common-sense tasks.
contradiction_condition: Evidence that mimicry did not improve much, or that systems around April 2025 matched humans broadly on reasoning, planning and common-sense evaluations.
measurement_requirements: Controlled Turing-test results and benchmark results with human baselines from up to April 2025.
