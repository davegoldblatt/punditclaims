explicit_source_elements:
  - Our economy is held up by NVIDIA
  - makes most of its money selling GPUs to other companies
  - primarily so that they can start losing the money selling software
  - that might eventually make them money, just not today
evaluator_interpretation:
  - "Element 1: more than half of NVIDIA's revenue comes from selling data center GPUs and systems to other companies. Checkable from company results."
  - "Element 2: the main purpose of those buyers' GPU purchases is to sell AI software that currently loses money. This needs evidence on what the main buyers use GPUs for and whether those uses lose money."
  - "'Our economy is held up by NVIDIA' is treated as rhetorical framing and not scored."
  - "Ongoing state with no named period: use NVIDIA's latest full fiscal year reported before the post, fiscal 2025 (ended 2025-01-26, reported 2025-02-26)."
support_condition: NVIDIA data shows most revenue comes from data center sales, and evidence shows its main buyers mostly use the GPUs to run loss-making AI software businesses.
contradiction_condition: Data center sales are not most of NVIDIA's revenue. Or the main buyers mostly use the GPUs for profitable purposes, such as profitable cloud rental or internal workloads like ad ranking, rather than loss-making software.
measurement_requirements: NVIDIA segment revenue for fiscal 2025. Customer mix. Profitability of the main buyers' AI software or GPU-based businesses.
source_requirements: NVIDIA filings or results releases. Buyer company filings with AI-specific profit data.
