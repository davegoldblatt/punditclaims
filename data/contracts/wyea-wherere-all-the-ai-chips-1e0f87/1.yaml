explicit_source_elements:
  - five to ten gigawatts
  - operational AI data center capacity
  - actually exists
evaluator_interpretation:
  - The scope is worldwide operational AI capacity, including accelerators other than NVIDIA GPUs.
  - The surrounding distinction between facility power and critical IT load makes energized AI IT capacity the appropriate measure.
  - I read five to ten gigawatts as an uncertain upper ceiling whose outer bound is 10 GW, not as a claim that at least 5 GW exists.
  - For this ongoing observation, I use August 2026, the latest completed calendar month before publication. This reporting-period choice is mine.
support_condition: A credible global inventory or estimate with adequate coverage and uncertainty bounds places operational AI critical IT capacity at or below 10 GW during the target period.
contradiction_condition: A comparable global estimate, or a verified non-overlapping subtotal of operating facilities, establishes more than 10 GW during the target period.
measurement_requirements: Measure energized, usable AI IT capacity in GW. Separate facility power, reserved utility connections, planned capacity, shipped equipment and operating accelerators. Remove overlap between operators, landlords and customers.
source_requirements: Prefer dated operator disclosures, commissioning records and independent inventories with transparent definitions and coverage. A forecast or an unexplained dashboard total cannot settle the claim.
