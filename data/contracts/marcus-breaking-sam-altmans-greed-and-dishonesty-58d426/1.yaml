assessment_axis: historical_observation
explicit_source_elements:
  - The public anger on social media
  - is growing fast
  - A major boycott is afoot
evaluator_interpretation:
  - The target is OpenAI and its ChatGPT service.
  - The observation concerns the immediate week leading up to the March 7 post. I use February 28 through March 7, 2026, with earlier activity serving as a comparison baseline.
  - The plain reading of 'growing fast' is a conspicuous increase in angry social-media activity over days.
  - The plain reading of 'major boycott' is an organized refusal-to-use campaign with substantial public participation and corroborating withdrawal behavior. It does not require participation by most users or lasting financial damage.
  - Campaign supporters, social shares, pledges, app deletions and subscription cancellations are distinct measures.
support_condition: Contemporaneous reporting or measurements establish rapidly spreading social-media opposition, an organized boycott with substantial participation, and corroborating behavior such as increased app deletions.
contradiction_condition: Comparable evidence shows that angry social-media activity was stable or declining, or that the purported boycott had negligible participation. Continued overall usage alone would not contradict the existence of a substantial boycott.
measurement_requirements: Assess social-media growth and boycott participation separately. Distinguish independently measured behavior from organizers' claims, and distinguish relative changes from absolute participant counts.
source_requirements: Prefer dated platform measurements and campaign records, corroborated by independent reporting. News observations can establish qualitative growth but cannot establish a precise growth rate.
