explicit_source_elements:
  - if OpenAI can’t pay for that compute
  - Oracle dies
  - around $115 billion in debt
  - just to build Stargate’s data centers
  - needs another $150 billion to finish them
evaluator_interpretation:
  - The plain reading of 'dies' is insolvency or cessation as a going concern, caused by OpenAI's inability to pay for Stargate compute.
  - A falling share price, layoffs, reduced investment, or ordinary refinancing would not alone satisfy that outcome.
  - The antecedent requires evidence of inability to meet a Stargate payment obligation. A revenue miss or financing concern is insufficient.
  - The financing figures are supporting premises as of the post. They must distinguish Oracle borrowing, equity issuance, developer debt, and remaining funding needs.
  - The speaker supplies no deadline after a payment failure.
support_condition: A documented OpenAI inability to pay Stargate obligations is followed by Oracle insolvency or cessation as a going concern, with evidence connecting the two.
contradiction_condition: After a documented OpenAI payment failure, a completed resolution permanently removes the relevant exposure while Oracle remains a viable going concern.
measurement_requirements: Payment obligations and default records, Oracle solvency records, and causal evidence. For the premises, reconcile legal borrowers, instruments, use of proceeds, and remaining project costs.
source_requirements: Prefer contracts, default notices, court records, audited filings, and project financing documents. Continued operation without a documented trigger cannot contradict this conditional forecast.
