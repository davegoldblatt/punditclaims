assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA has been a big part
  - creating this fake demand story
  - investments in — and backstop contracts with
  - CoreWeave, Lambda, IREN, and Nebius
evaluator_interpretation:
  - The ordinary reading is that NVIDIA's financial support materially inflated the appearance of independent demand for AI compute.
  - The company list is read collectively; it does not necessarily assert that every company received both equity investment and an identical backstop.
  - Supplier investment and capacity purchases establish a possible mechanism. They do not by themselves establish artificial demand or NVIDIA's causal importance.
  - The assessment concerns arrangements and their effects through the post date. No investment amount, accounting basis, or numerical causal threshold is supplied.
support_condition: Evidence connects NVIDIA's arrangements with a substantial overstatement of independent compute demand, distinguishing supplier-funded purchases and unused capacity guarantees from actual customer consumption.
contradiction_condition: Comparable customer, utilization, payment, and financing records establish that the demand attributed to these arrangements was independently sustained and that NVIDIA's support did not materially inflate its appearance.
measurement_requirements: Separate equity funding, contractual commitments, realized payments, actual compute use, and independently funded customer demand. Establish a causal contribution rather than merely overlapping commercial relationships.
source_requirements: Contracts, filings, customer payment and utilization records, and independent analysis of the financing mechanism. Company promotional statements alone cannot establish genuine demand.
