explicit_source_elements:
  - GPT-5 was going to be tantamount to AGI
  - a company thought (or claimed)
  - "spoiler alert: it wasn’t"
evaluator_interpretation:
  - "The claim contains two assertions: OpenAI expected or represented GPT-5 as effectively AGI, and the released product did not meet that description."
  - The ordinary reading of AGI is broadly human-level general cognitive capability, rather than excellence on selected benchmarks. Marcus supplies no formal definition.
  - The capability assessment concerns the August 2025 release through the post date. Earlier statements are relevant to the separate assertion about OpenAI's expectations.
  - General predictions that OpenAI would eventually develop AGI do not establish a prediction specifically about GPT-5.
support_condition: Evidence establishes both a GPT-5-specific expectation or representation by OpenAI and substantial shortcomings inconsistent with the ordinary reading of AGI at release.
contradiction_condition: Reliable evidence establishes that released GPT-5 met the stated ordinary reading of AGI, or directly refutes the particular prior expectation or representation attributed to OpenAI. Failure to find an earlier statement is not itself a contradiction.
measurement_requirements: Assess released capabilities across domains and distinguish measured limitations, executive descriptions, and prior expectations. No single benchmark is treated as a definitive AGI test.
source_requirements: Prefer dated OpenAI statements and independent evaluations of the original release. Claims about internal expectations require attributable reporting or records.
