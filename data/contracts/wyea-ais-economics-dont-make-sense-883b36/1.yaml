evaluator_interpretation:
  - This describes construction status at publication. End-2028 defines the announced project cohort, not a forecast deadline.
  - "I use the latest prepublication monthly snapshot: April 2026 through April 28. The post does not identify a measurement date."
  - The surrounding discussion implies capacity measured in total facility power, including early site construction, rather than installed IT capacity.
  - Geography and tracker coverage are unspecified. Both totals must describe the same project population.
support_condition: An independent, dated April snapshot identifies approximately 114 GW scheduled for completion through 2028 and 15.2 GW already under construction within that same population.
contradiction_condition: A comparable April snapshot establishes materially different totals, or shows that the two figures refer to different project populations or power measures.
measurement_requirements: Project-level capacity, scheduled completion date, construction status, snapshot date, geographic coverage, and treatment of partially operational campuses. Do not count an entire planned campus as under construction merely because one phase has started.
source_requirements: The underlying tracker or a reproducible independent project inventory. Repetition of Zitron's figures is insufficient.
