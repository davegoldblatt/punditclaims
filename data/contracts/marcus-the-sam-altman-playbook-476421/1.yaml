assessment_axis: historical_observation
explicit_source_elements:
  - So far
  - no net profits
  - if there are any
  - for a long time
  - roughly half
  - shared with Microsoft
  - by contractual agreement
evaluator_interpretation:
  - So far covers OpenAI's operating history through May 5, 2024; the source does not provide an inception date.
  - The ordinary reading is that OpenAI had not achieved positive net income, rather than merely having accumulated historical losses.
  - The Microsoft clause concerns obligations under the agreement then in force. It is not a prediction that profits necessarily would occur.
  - Roughly half permits a reported 49% share during a substantial distribution stage; it does not require the same percentage at every stage.
  - No accounting basis is identified in the supplied text. Press estimates cannot silently become company-reported or audited net income.
  - Future changes to the agreement would not establish what its terms were on the post date.
support_condition: Comparable financial records establish no positive net income through the post date, and the operative agreement establishes an approximately half share for Microsoft over a substantial future profit-distribution stage.
contradiction_condition: Comparable records establish positive net income before the post, or the operative agreement is materially incompatible with the asserted substantial approximately half share.
measurement_requirements: Distinguish net income from operating losses, cash burn and projections. Identify the entity, reporting periods, accounting basis, distribution stages and profit caps.
source_requirements: Financial statements or reliable reporting explicitly identifying realized net income, plus the operative agreement or reliable documentary reporting of its terms. Reports about proposed terms are insufficient by themselves.
