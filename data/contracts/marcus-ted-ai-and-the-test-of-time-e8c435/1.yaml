assessment_axis: historical_observation
explicit_source_elements:
  - I am just not seeing that as OpenAI’s mission, anymore
  - continued to fail to compensate most of the creators
  - whose work they are drawing on
  - largely without consent
evaluator_interpretation:
  - The mission statement is Marcus's expressed judgment. The checkable core concerns compensation and permission.
  - "'Most creators' means more than half of the distinct creators represented in the material used, rather than most documents, tokens or publishers."
  - "'Largely without consent' means affirmative authorization was predominantly absent. A claimed legal exception is not affirmative consent."
  - Use January 1 through April 15, 2024, covering the latest completed quarter and the subsequent prepublication period for the ongoing practice.
  - This assesses coverage of creators by payment and permission arrangements, not a financial amount; metric_scope is therefore null.
support_condition: Training-data and rights records establish that a majority of represented creators were uncompensated and that use predominantly lacked affirmative authorization.
contradiction_condition: Comparable records establish that a majority of represented creators were compensated, or that affirmative authorization predominantly covered the use.
measurement_requirements: A defensible creator-level denominator, identified uses, payment coverage and permission records. Distinguish creator authorization from publisher or other rights-holder authorization.
source_requirements: Prefer corpus disclosures, licensing agreements and adjudicated or documented rights records. Lawsuit allegations and a few licensing deals cannot establish population-wide proportions.
