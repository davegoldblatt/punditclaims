evaluator_interpretation:
  - The antecedent requires approximately $7 trillion of built AI infrastructure operating at full capacity. Announced investment or financing does not establish it.
  - The ordinary reading of the energy phrase is exceptionally large electricity demand with national-scale significance. The nearby Germany comparison supplies context, not an explicit numerical minimum.
  - The dollar figure defines the hypothetical infrastructure, rather than reporting a company's financial metric.
support_condition: The antecedent is established, and operating measurements or defensible engineering estimates show exceptionally large electricity consumption at full capacity.
contradiction_condition: The antecedent is established, and equivalent measurements show modest electricity consumption inconsistent with the ordinary reading.
measurement_requirements: Identify the infrastructure, its valuation or construction cost, equipment composition, utilization, and full-capacity electricity demand. Distinguish power capacity from energy consumed over time.
source_requirements: Dated construction and operating records, supported by engineering measurements or transparent estimates. Financing announcements alone are insufficient.
