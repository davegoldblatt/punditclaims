evaluator_interpretation:
  - The claim is framed as "I think it's reasonable to believe", a hedged judgment about what is plausible, not a firm statement of fact.
  - "\"Millions of Blackwell GPUs waiting to be installed\" is derived from the speaker's own sales estimates and assumptions. No public dataset tracks installed versus uninstalled Blackwell units across the industry."
  - Under the register's policy, a hedged belief is not scored. It is recorded as not adjudicable.
support_condition: Not scored. It could only be supported if industry or company data showed most Hopper GPUs installed and millions of shipped Blackwell GPUs not yet installed around September 2026.
contradiction_condition: Not scored. It could only be contradicted if such data showed far fewer than a million Blackwell GPUs awaiting installation, or most Hopper GPUs not installed.
measurement_requirements: None, because the claim is not scored. A score would need shipped-versus-installed counts for Blackwell and Hopper.
