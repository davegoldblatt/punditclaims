assessment_axis: historical_observation
explicit_source_elements:
  - I think it’s reasonable to believe
  - the majority — if not the entirety — of Hopper GPUs are installed
  - millions of Blackwell GPUs waiting to be installed
evaluator_interpretation:
  - Assess the factual inference, while retaining the author's expressed uncertainty. This is not a conditional forecast.
  - Majority means more than half of shipped Hopper GPUs. Entirety is an optional stronger possibility, not the minimum commitment.
  - Millions means at least two million physical Blackwell GPU packages, excluding consumer graphics cards. Installed means installed in a powered data center and ready for use.
  - "For this ongoing observation, use the latest calendar reporting window before publication: July 1 through September 22, 2026. Counts must refer to a common snapshot within that window."
support_condition: Comparable shipment and deployment records establish both that more than half of shipped Hopper GPUs were installed and that at least two million shipped Blackwell packages remained uninstalled.
contradiction_condition: Comparable records establish that at most half of shipped Hopper GPUs were installed, or that fewer than two million shipped Blackwell packages remained uninstalled.
measurement_requirements: Count physical packages consistently. Reconcile shipments, transit, staging, installation, commissioning, returns and retirements. Do not infer GPU counts from hardware revenue or construction spending alone.
source_requirements: Manufacturer and operator records, or a transparent industry census with sufficient coverage and uncertainty bounds to establish the thresholds.
