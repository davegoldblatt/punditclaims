evaluator_interpretation:
  - A trustworthy solution means dependable performance across varied, unfamiliar instances of a domain, rather than success on one benchmark. It does not require perfect performance.
  - The comparison covers approximately 2017 through May 2022. Calendar 2017 is the approximate baseline; the endpoint is the post date.
  - In context, 'scarcely changed' concerns the availability of dependable general solutions. It does not necessarily deny substantial improvements in benchmark scores.
support_condition: Contemporary evaluations show persistent, substantial reliability limitations across the four domains, and comparable longitudinal evidence shows little change in the availability of dependable general solutions.
contradiction_condition: A dependable general solution existed in a named domain by May 2022, or comparable evaluations demonstrate substantial improvement in broad reliability since approximately 2017.
measurement_requirements: Tests must distinguish familiar benchmark performance from reliability on unfamiliar cases. The five-year comparison requires reasonably comparable tasks and evaluation conditions.
source_requirements: Contemporary research evaluations, preferably independently reproduced. Later research may describe historical systems but cannot substitute newer systems for those available by May 2022.
