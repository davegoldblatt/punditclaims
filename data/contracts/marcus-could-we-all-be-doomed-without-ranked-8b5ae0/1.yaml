assessment_axis: forecast_outcome
explicit_source_elements:
  - The default right now is regulatory capture
  - the companies will make the rules
  - The government will go along
evaluator_interpretation:
  - The surrounding discussion makes US AI regulation the principal scope, although the wording also refers to governments generally.
  - The ordinary reading predicts a prevailing pattern of company control over substantive regulatory choices. It does not assert that governments will never oppose any company.
  - By default describes the predicted tendency, rather than a separate conditional antecedent.
  - No deadline, company roster, or measure of regulatory control is supplied.
support_condition: A completed regulatory settlement, supported by records of company proposals and government decisions, establishes that major AI companies determined the substantive rules and governments accepted their limits.
contradiction_condition: A completed regulatory settlement establishes substantive government control over the principal rules despite documented opposition from major AI companies. An isolated disagreement is insufficient to refute a prediction about the default pattern.
measurement_requirements: Compare adopted requirements with contemporaneous company proposals, objections, and the government's reasons for its decisions. Agreement alone does not establish regulatory capture.
source_requirements: Official adopted rules and legislative or administrative records, paired with attributable industry submissions or correspondence.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon an identifiable completed regulatory settlement that decisively establishes company control, or substantive government independence, across the principal regulatory choices. Individual announcements, investigations, or industry victories do not suffice.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - US focus versus governments generally
  - No deadline
  - No defined threshold for the default pattern
  - Company influence versus company control
  - Major companies may hold conflicting regulatory positions
retrospective_or_prospective: retrospective
