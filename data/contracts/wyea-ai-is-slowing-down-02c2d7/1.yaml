target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires conclusive evidence of the deadline-specific revenue antecedent as well as the relevant payment and viability outcomes. Current revenue below the threshold, or a default before 2030, does not alone establish the antecedent.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The industry revenue boundary and treatment of supply-chain transactions are unspecified.
  - Financial justification has no stated return threshold.
  - The exact projects and contractual obligations are not enumerated.
  - Some commitments may have payment dates beyond 2030.
  - Cannot pay is distinct from losses, refinancing, or voluntary contract renegotiation.
