assessment_axis: forecast_outcome
explicit_source_elements:
  - it absolutely has to do that
  - otherwise none of the data center capex makes sense
  - neither Anthropic nor OpenAI can pay their commitments
  - over $2 trillion in annual revenue by 2030, from the preceding sentence
evaluator_interpretation:
  - The antecedent is failure of annual generative AI and AI compute revenue to exceed USD 2 trillion by December 31, 2030. Equality with USD 2 trillion does not satisfy 'over'.
  - "The consequence has two parts: the referenced data-center investment is financially unjustified, and each named company is unable to pay its commitments."
  - I read 'none' and 'neither' literally. A demonstrably viable covered investment or either company's demonstrated ability to pay would challenge the corresponding part.
  - Ability to pay includes available cash, operating receipts, and financing. Losses alone do not establish inability to pay.
  - Only payments contractually due through the deadline are tested as due payments; multiyear commitment totals are not assumed immediately payable.
  - The commitment amounts in the surrounding discussion are estimates. The revenue antecedent is an industry-wide measure separate from the companies' payment obligations.
support_condition: Evidence establishes the revenue antecedent and shows that the referenced data-center investment is financially unjustified and that both Anthropic and OpenAI cannot meet the relevant payments when due.
contradiction_condition: With the revenue antecedent established, evidence shows that a covered data-center investment is financially viable or that either Anthropic or OpenAI can meet its relevant commitments. Assess the two consequences separately if evidence differs.
measurement_requirements: First establish realized industry annual revenue through 2030. Then reconcile each company's contractual due dates, actual payments, available resources, and any defaults or restructurings. Test investment viability using operating costs, financing costs, and capital recovery.
source_requirements: Industry revenue measurements plus company financial statements, contractual schedules, creditor records, or court records. Risk disclosures alone cannot establish default or inability to pay.
metric_scope:
  company: Anthropic and OpenAI, assessed separately
  metric: Payments due under the compute commitments referenced at the post date
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-06-08
  period_end: 2030-12-31
  stock_or_flow: flow
