assessment_axis: historical_observation
explicit_source_elements:
  - multiple other companies
  - doing exactly what GPT-3 did
  - months before ChatGPT launched
evaluator_interpretation:
  - Multiple means at least two companies other than OpenAI.
  - The plain functional reading is general-purpose language generation and related text tasks through a language model, rather than identical outputs or identical scores on every benchmark.
  - The comparison is explicitly with GPT-3, not with every feature of ChatGPT.
  - I use June 2020 through September 2022 as the historical comparison window, ending at least two months before ChatGPT's November 2022 launch.
  - The temporal comparison is not a conditional forecast.
support_condition: Dated primary records establish that at least two other companies offered comparable general-purpose language-model functionality within the target period.
contradiction_condition: Historical product records establish that fewer than two other companies offered comparable functionality before the cutoff.
measurement_requirements: Identify the companies, dated availability, and supported language tasks. Do not equate shared functionality with identical model quality or a ChatGPT-equivalent consumer interface.
source_requirements: Contemporaneous product announcements, technical papers, documentation, or demonstrations.
