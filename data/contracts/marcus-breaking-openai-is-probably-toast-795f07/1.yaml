assessment_axis: historical_observation
explicit_source_elements:
  - losing money every quarter
  - even by their own (optimistic) calculations
  - won’t make a profit for years
evaluator_interpretation:
  - The claim combines recurring realized losses with a description of OpenAI’s projections at publication. It does not require waiting to see whether those projections come true.
  - The plain reading of losing money is company-wide net losses after expenses. Cash burn, operating losses, and investors’ investment returns are distinct measures.
  - For the ongoing observation, use the latest completed calendar quarter before publication, October–December 2025. The target interval extends through February 13, 2026 to encompass the contemporaneous projection claim. Earlier quarterly results can establish recurrence but cannot substitute for the latest quarter.
  - For years means profitability was projected to remain at least several years away; the wording supplies no exact first profitable year.
  - The realized-loss clause supplies no accounting basis. The projection clause explicitly refers to company calculations. The single metric_scope records the unresolved basis of the realized-loss claim.
support_condition: Comparable quarterly net results establish recurring losses through the latest completed quarter, and OpenAI’s projections current at publication place company-wide profitability several years away.
contradiction_condition: Comparable results show profitability during the claimed continuing sequence, or OpenAI’s contemporaneous projections show profitability arriving substantially sooner than several years. Evidence contradicting only one clause must be identified as such.
measurement_requirements: Quarterly company-wide net results on a consistent accounting basis, plus dated company projections with a defined profitability measure. Annual losses do not establish losses in every quarter.
source_requirements: Prefer OpenAI financial statements and investor materials. Reporting based on those documents is acceptable with its limitations identified. Investor accounting results cannot substitute for OpenAI’s results.
