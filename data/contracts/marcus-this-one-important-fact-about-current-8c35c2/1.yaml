explicit_source_elements:
  - current approaches to machine learning
  - lousy at outliers
  - when they encounter unusual circumstances
  - subtly altered word problems
  - often say and do things that are absurd
evaluator_interpretation:
  - The plain reading is a recurring reliability weakness on unusual inputs, including plainly incorrect answers to simple altered problems. It does not require every model to fail on every unfamiliar input.
  - No reporting period is specified. I use 2024 through the post date as the current research period, because model evaluations have no regular quarterly reporting cycle.
  - Controlled input variations are evidence of robustness problems, but do not by themselves prove that an example was absent from proprietary training data.
  - Often is assessed as repeated failure across trials and models on relevant challenge sets, not as a measured share of all real-world AI use.
support_condition: Contemporaneous evaluations show repeated, substantial failures across multiple models on unusual or modestly altered inputs, including plainly incorrect reasoning on otherwise simple tasks.
contradiction_condition: Broad, well-controlled evaluations show that contemporary approaches reliably handle the relevant unusual inputs, with alleged failures confined to isolated or invalid examples.
measurement_requirements: Repeated trials, identifiable model versions, valid answers, and comparisons across input variations. Distinguish challenge-set error rates from deployment-wide frequencies.
source_requirements: Independent empirical evaluations with documented methods; primary research preferred.
