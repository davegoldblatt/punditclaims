assessment_axis: forecast_outcome
explicit_source_elements:
  - contingent on Google, Microsoft, Amazon and Oracle building enough capacity
  - if we assume that happens
  - more than $147 billion
  - expected compute commitments
  - through the end of 2027
evaluator_interpretation:
  - The threshold concerns cumulative payments required for compute from the four named providers, not OpenAI's total operating spending.
  - The surrounding year-and-a-half calculation is read as July 2026 through December 2027. The forecast horizon itself begins on the post date.
  - Payments for separately excluded providers and activities are not added to the threshold.
  - The capacity condition requires delivery sufficient to trigger the assumed payment obligations; announced construction plans do not establish it.
support_condition: The capacity condition is established and qualifying contractual payments required for the assessment period exceed USD 147 billion.
contradiction_condition: The capacity condition is established and a complete, consistently dated accounting of qualifying payment obligations totals USD 147 billion or less.
measurement_requirements: Provider-specific payment schedules, capacity delivery records and actual payments, reconciled to calendar dates without double counting fiscal years or including spending beyond December 2027.
source_requirements: Executed contracts, company disclosures or independently verified reporting establishing both delivered capacity and the payment obligations attributable to the specified period.
