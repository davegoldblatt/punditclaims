evaluator_interpretation:
  - Assess the state of publicly available evidence at publication, rather than scoring a forecast against an invented deadline.
  - A radiologist in an app ordinarily means a clinically usable replacement for the substantive radiologist role.
  - The relevant evidence concerns whether existing scan-reading techniques offered a demonstrated basis for near-term whole-role replacement. Isolated task improvements are relevant but do not automatically establish that conclusion.
  - The target is the accumulated public evidence through October 16, 2022, so no arbitrary starting date is imposed.
support_condition: A sufficiently comprehensive contemporary evidence assessment finds no demonstrated basis for near-term whole-role replacement using the scan-reading techniques under discussion.
contradiction_condition: Evidence public by the post provides a credible demonstrated path to near-term whole-role replacement using those techniques, rather than only isolated task automation.
measurement_requirements: Examine functional coverage, clinical validation, autonomy and deployment readiness. Distinguish evidence of progress from evidence supporting imminent complete replacement.
source_requirements: Research, technical documentation and demonstrations public by October 16, 2022. Later developments cannot retrospectively establish what evidence existed then.
