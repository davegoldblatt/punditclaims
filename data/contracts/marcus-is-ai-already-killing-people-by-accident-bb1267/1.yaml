explicit_source_elements:
  - Generative AI continues to have serious problems
  - with reasoning
  - and with visual cognition
  - as a series of studies by Anh Totti Nguyen has shown
evaluator_interpretation:
  - "Plain reading: as of the post, leading generative AI models, including vision-language models, still showed substantial and reproducible failures on reasoning and visual tasks that are easy for humans."
  - Progress on some benchmarks does not falsify the claim. Absence of documented serious failures would.
  - "Target period: from 2025-09-01 to the post date (2026-03-01). This is the recent period that public evaluations of then-current models could report on."
support_condition: Published evaluations from the period show current frontier models failing badly on simple reasoning or visual tasks, such as counting or obvious one-step inferences.
contradiction_condition: Evaluations from the period show frontier models reliably solving such tasks, with the failures Marcus cites gone in then-current models.
measurement_requirements: Accuracy of then-current frontier models on visual-cognition and reasoning tests, with failures on simple tasks.
source_requirements: Peer-reviewed papers, preprints, or benchmark results published in the target period.
