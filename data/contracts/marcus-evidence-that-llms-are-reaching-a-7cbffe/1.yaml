evaluator_interpretation:
  - The ordinary reading is that factual mistakes and plainly unsuccessful responses persisted, including in the newly released GPT-4 Turbo. It does not claim that accuracy had never improved.
  - Interpret GPT-Turbo as gpt-4-turbo-2024-04-09 and assess its release through the April 13 post.
  - The claim supplies no error-rate threshold. Documented failures can establish persistence without establishing their prevalence.
support_condition: Dated tests or reproducible reports identify continuing factual mistakes and task failures in the April GPT-4 Turbo release.
contradiction_condition: Credible evidence establishes that the alleged failures were misattributed or erroneous and that the named release had eliminated the relevant problems across its intended uses. Isolated successful answers are insufficient.
measurement_requirements: Identify the model snapshot, test or prompt, date and failure. Separate a demonstrated failure from claims about general error rates.
source_requirements: Prefer independent tests and primary reports with reproduction details. Do not rely on Marcus's screenshot as independent corroboration.
