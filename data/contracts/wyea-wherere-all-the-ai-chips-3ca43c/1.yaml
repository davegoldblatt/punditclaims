assessment_axis: causal_assessment
explicit_source_elements:
  - the “demand” cycle
  - really any AI chip
  - entirely manufactured
  - four or five large customers buying so many
  - Huang making statements about revenue generation that do not reflect reality
evaluator_interpretation:
  - Read 'manufactured' as demand sustained by speculative accumulation and misleading revenue claims, rather than ordinary purchases supported by downstream use.
  - "'Entirely' commits to exclusive causation; concentration by itself does not establish artificial demand."
  - Use calendar Q2 2026, the latest completed common customer reporting quarter before the post, to assess the ongoing demand mechanism.
  - Do not recast the claim as saying that no AI service has any paying customers.
support_condition: Evidence links the demand cycle exclusively to speculative purchases by four or five customers and materially false revenue statements, while excluding a material independent role for genuine downstream demand.
contradiction_condition: Evidence traces a material part of AI-chip purchasing to genuine downstream demand independently of the alleged mechanism, or disproves another necessary part of the exclusive causal account.
measurement_requirements: Trace chip purchases to deployment, downstream customer use and payments. Identify the allegedly false statements, their factual referents and their influence on purchases. Distinguish concentrated purchasing from fabricated demand.
source_requirements: Purchaser and downstream-customer records, deployment evidence, the relevant statements and corroborated causal analysis. Chipmaker sales and customer growth alone are insufficient.
