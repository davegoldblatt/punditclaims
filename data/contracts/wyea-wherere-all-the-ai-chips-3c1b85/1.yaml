assessment_axis: historical_observation
explicit_source_elements:
  - For the most part
  - given credit for their capital expenditures because overall revenues have grown
  - everyone saying that their “AI bets have paid off”
  - barely started to come online
evaluator_interpretation:
  - "'Everyone' is ordinary rhetorical emphasis, not a claim about every commentator."
  - "'For the most part' describes a predominant pattern of investor and press interpretation; it is not a conditional forecast antecedent."
  - "'Barely started' means only a small fraction of the AI infrastructure investment cohort discussed since 2022 had become operational."
  - Hyperscalers means Amazon, Alphabet, Microsoft and Meta.
  - For the ongoing deployment state, I use April through June 2026, the latest completed quarterly period publicly reportable before publication. Subsequent pre-post coverage of those results is context for the claimed narrative.
  - The core test concerns deployment and how it was represented, not a separately specified revenue or capex amount.
support_condition: Representative coverage predominantly credits revenue growth to the AI investment program, while comparable commissioning records establish that only a small fraction of that investment cohort was operational in the target period.
contradiction_condition: Representative coverage does not show the claimed predominant attribution, or comparable deployment records establish that a substantial share of the relevant AI investment cohort was already operational.
measurement_requirements: A defined, representative set of investor and press coverage, plus a consistent denominator for AI investments and a matched measure of the portion placed into service. Total capex and total revenue cannot substitute for those measures.
source_requirements: Contemporaneous coverage and investor commentary, paired with company asset and commissioning disclosures or independently verified deployment records.
