ambiguity_flags:
  - No defined population of commentators or investors.
  - No numerical threshold for barely started.
  - AI bets could include hardware, buildings, research or products.
  - Latest pre-post reporting quarter chosen for an ongoing deployment state with no explicit reporting period.
  - The investment cohort is inferred from the surrounding discussion beginning in 2022.
