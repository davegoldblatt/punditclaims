assessment_axis: forecast_outcome
explicit_source_elements:
  - at least $200 billion worth of data centers
  - will never make even a quarter of their costs back
  - before collapsing
  - assuming that they ever turn on
evaluator_interpretation:
  - The surrounding discussion identifies AI data-center projects, including unfinished projects, as the subject.
  - The ordinary reading is permanent commercial failure before recovering 25% of project costs. A temporary delay, financing default, or change of ownership does not alone establish that outcome.
  - The projects must already exist or be identifiable as planned projects at the post date. Costs must not be counted twice across owners, lenders, and equipment suppliers.
  - The speaker supplies neither an accounting basis nor a definition of cost recovery. Both must be resolved before a monetary threshold can receive a decisive score.
support_condition: Identified eligible projects permanently fail with verified aggregate project costs of at least USD 200 billion, each recovering less than 25% of its costs before failure.
contradiction_condition: A complete accounting of the eligible project population establishes that projects failing below the recovery threshold total less than USD 200 billion, with every remaining project already recovering at least 25% or otherwise having a final outcome that excludes qualification.
measurement_requirements: Project-level costs, operating receipts, operating expenses, asset-sale proceeds, permanent closure dates, and a consistent treatment of recovery and project transfers. Announced investment values and creditor recovery percentages cannot substitute for project costs and project recovery.
source_requirements: Prefer project accounts, insolvency records, asset-sale documents, and operator disclosures. News reports can identify candidates but must establish both thresholds to be decisive.
