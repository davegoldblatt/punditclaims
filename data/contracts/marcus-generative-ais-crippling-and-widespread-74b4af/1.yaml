assessment_axis: causal_assessment
explicit_source_elements:
  - LLMs
  - to their peril
  - without classical world models
evaluator_interpretation:
  - Classical world models means explicit entity-and-state representations with defined update procedures, following the post's examples.
  - The target is standard LLMs discussed at publication, rather than complete applications equipped with external databases, simulators, or planners.
  - To their peril asserts that the absence causes performance failures; it does not specify that every failure has this cause.
  - Learned internal representations are not automatically classical world models.
support_condition: Architectural evidence establishes the relevant absence, and controlled comparisons show that adding an explicit world model reduces failures while holding other material capabilities constant.
contradiction_condition: The relevant models already contain classical world models, or well-controlled tests reject the proposed causal mechanism across the claimed scope.
measurement_requirements: Separate the effects of state representation from search, validation, additional computation, training, and feedback.
source_requirements: Primary architecture documentation and controlled intervention or ablation studies on models relevant to the post.
