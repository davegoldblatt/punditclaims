explicit_source_elements:
  - mobilize incredible amounts of capital
  - multiple companies with multi-trillion dollar market capitalisations
  - build entire infrastructure dedicated to one thing
  - generative AI
  - hundreds of billions
evaluator_interpretation:
  - The ordinary reading is a large, collective infrastructure effort focused on generative AI. It does not mean that these companies have stopped investing in everything else.
  - Use January–March 2025, the latest completed calendar quarter before publication, to assess the ongoing investment state. Announcements during that quarter establish plans then in existence; they do not establish completed expenditure.
  - Read 'hundreds of billions' as at least $200 billion collectively, and 'multiple multi-trillion-dollar companies' as at least two participating companies each worth at least $2 trillion.
  - Mobilizing capital can include announced investment programs, but announcing an aspiration does not establish that its financing has been secured.
  - The supplied words identify neither an accounting basis nor a spending period. Do not assign company_reported merely because company disclosures are available.
support_condition: Comparable records establish at least $200 billion of capital mobilized for purpose-built generative-AI infrastructure, with industrial participation by at least two companies each worth at least $2 trillion. The spending basis must be identifiable and consistent.
contradiction_condition: Comparable records establish that the claimed investment scale, qualifying company participation, or generative-AI infrastructure focus was false during the target period. Missing disclosures alone do not establish contradiction.
measurement_requirements: Distinguish announced investment, secured financing and realized expenditure. Separate generative-AI infrastructure from general cloud and other capital expenditure. Avoid double-counting partners' contributions and overlapping projects.
source_requirements: Prefer contemporaneous company disclosures for investment and infrastructure participation. Use dated market records or reputable financial reporting for market capitalization. All evidence must have been available by 2026-10-28.
