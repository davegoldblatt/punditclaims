assessment_axis: historical_observation
explicit_source_elements:
  - able to mobilize incredible amounts of capital
  - the industrial might of multiple companies with multi-trillion dollar market capitalisations
  - to build entire infrastructure dedicated to one thing
  - the one thing they are choosing is generative AI
evaluator_interpretation:
  - "Plain reading: at the time of the post, several big tech firms worth over a trillion dollars were each spending very large sums (tens of billions of dollars or more) to build data-center infrastructure, and the stated purpose was mainly AI."
  - "'Dedicated to one thing' is read as AI being the declared main purpose of the build-out, not as every dollar being AI-only."
  - No dollar threshold is applied; the 'hundreds of billions' wording belongs to the neighbouring sentence.
  - "Period: the 2025 spending plans and market values reported in the months before the post (2025-01-01 to 2025-06-09)."
support_condition: Company disclosures or reliable reports from the period show multiple trillion-dollar tech firms committing very large capital budgets to AI data centers or infrastructure, with AI named as the main purpose, and show that several of these firms had multi-trillion-dollar market values.
contradiction_condition: Reports from the period show that big tech capital spending was modest, or was mainly for purposes other than AI, or that no such firms were worth multiple trillions.
measurement_requirements: Capital expenditure guidance or announcements for 2025 (or fiscal 2025), with stated AI purpose; market capitalization figures near the post date.
source_requirements: Company announcements, earnings releases, or reputable news reports of them; market-data reports.
metric_scope:
  company: Big tech (Microsoft, Alphabet, Amazon, Meta)
  metric: Capital spending on AI infrastructure (planned)
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: unknown
