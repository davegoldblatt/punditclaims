assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI
  - still hasn’t remotely made a net profit
  - is all still speculative
evaluator_interpretation:
  - Assess the parenthetical observation about profitability, not the surrounding forecast about national competitive advantages.
  - The ordinary reading is that generative AI as a commercial field had not achieved overall net profitability by May 14, 2025. This does not necessarily assert that every individual provider was unprofitable.
  - The words 'hasn’t ... made' encompass profitability achieved up to the statement, including cumulative results. The target period therefore ends on the post date and has no invented starting date; it is not restricted to calendar 2024 or the latest quarter.
  - Read 'remotely' as emphasis on the claimed absence of profitability, without inventing a numerical distance from break-even.
  - Read 'speculative' as describing the uncertain prospect of sustained commercial profits. It supplies no separate measurable threshold.
  - The speaker supplies no accounting basis, currency, industry boundary, or method for allocating shared costs. These cannot be supplied silently.
support_condition: Comparable financial records or a transparent industry estimate establish that generative AI businesses collectively had not achieved net profitability by May 14, 2025, including cumulative results through that date. Losses at selected leading companies alone are insufficient.
contradiction_condition: Comparable financial records or a transparent industry estimate establish that generative AI businesses collectively had achieved net profitability by May 14, 2025. An individual profitable provider is relevant counterevidence but does not by itself establish aggregate profitability.
measurement_requirements: Measure realized net income after all attributable expenses. Establish industry coverage, accounting treatment, shared-cost allocation and treatment of transactions between providers. Examine cumulative results and any claimed prior achievement of aggregate profitability. Revenue, cash burn, operating profit and financing cannot substitute for net income.
source_requirements: Prefer financial statements and company disclosures. Independently verified reporting may fill private-company gaps, but an industry conclusion requires adequate coverage and comparable measures. Later publications may establish historical results only if available by October 28, 2026.
