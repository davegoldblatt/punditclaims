explicit_source_elements:
  - Generative AI
  - still hasn’t remotely made a net profit
  - all still speculative
evaluator_interpretation:
  - The ordinary financial reading concerns generative AI in aggregate, rather than only OpenAI or Anthropic.
  - Use calendar 2024 as the latest completed annual reporting period before the post. The source names no reporting period or accounting convention.
  - Net profit means earnings after all applicable expenses, rather than gross margin, operating income, cash flow, funding, or valuation.
  - Read speculative as uncertainty about sustainable profitability. It does not supply a separate measurable threshold.
  - The speaker cites no financial source or accounting basis, so accounting_basis remains unknown and a supported or contradicted score is unavailable under the money rules.
support_condition: Comparable financial records covering the defined generative-AI industry establish an aggregate net loss materially below break-even for the target period.
contradiction_condition: Comparable financial records establish positive aggregate net income for the same industry scope and period. An individual profitable company alone does not contradict the aggregate reading.
measurement_requirements: A defined industry boundary, comparable net-income accounts, allocation of generative-AI revenues and expenses within diversified companies, and elimination of double counting.
source_requirements: Prefer audited company accounts and financial disclosures. Reports about private-company financial statements may provide context but cannot replace an industry total.
