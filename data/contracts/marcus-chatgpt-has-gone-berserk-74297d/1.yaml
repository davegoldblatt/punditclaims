evaluator_interpretation:
  - In context, these systems means generative AI systems, especially conversational language models.
  - The ordinary reading of stable is reliably coherent and dependable in ordinary operation. It does not require identical answers or flawless performance.
  - Never makes this a claim about the systems' history through publication. No starting date is supplied, so the historical start remains unspecified.
  - Individual incidents can establish failures but cannot alone establish that the whole class never achieved stable operation.
support_condition: Broad historical evidence establishes persistent operational unreliability across the relevant systems, sufficient to support the claim that stable operation had never been achieved.
contradiction_condition: Credible longitudinal evidence demonstrates sustained, reliably coherent operation by relevant systems under representative ordinary use before publication.
measurement_requirements: Evidence must distinguish sustained reliability from isolated successes or failures. The claim supplies no failure-rate threshold, test duration, or representative workload.
source_requirements: Primary incident records and reliability evaluations covering operation before February 21, 2024.
