assessment_axis: historical_observation
explicit_source_elements:
  - AI data centers are literally only good for AI
  - AI GPUs do not have other mass-market use cases
  - There is no post-Dot Com story
evaluator_interpretation:
  - The plain reading combines a claim about useful alternative workloads with a stronger claim about commercial demand for those workloads.
  - Mass-market means an established, substantial commercial market, not necessarily a consumer product. Technical compatibility alone does not establish that market.
  - The dot-com comparison concerns potential reuse of infrastructure. It does not specify a separate forecast deadline.
  - For the ongoing state, use August 2026 through the publication date, the latest observable portion of the month. Older announcements are context unless the evidence establishes continuing conditions.
support_condition: Evidence establishes that AI facilities lack useful non-AI applications and that AI GPUs lack substantial commercial non-AI demand.
contradiction_condition: Documented non-AI operation establishes useful alternative applications for AI facilities, or documented substantial commercial deployments establish a non-AI market for AI GPUs.
measurement_requirements: Identify the facilities and GPU models, distinguish AI from conventional simulation or rendering, and document actual deployment and demand. Assess conversion costs separately from technical capability.
source_requirements: Dated operator records, technical documentation and commercial deployments. Product marketing alone cannot establish market size or profitable reuse.
