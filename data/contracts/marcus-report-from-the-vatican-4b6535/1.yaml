evaluator_interpretation:
  - Assess open-ended, tool-using agents discussed in the surrounding passage, rather than all AI.
  - The ordinary reading of 'unsafe' is that foreseeable use can produce significant unauthorized actions or defeat safeguards. It does not require every deployment to cause harm.
  - Treat 'we can all agree' as rhetorical emphasis rather than a measurable claim of unanimous agreement.
  - Use October 2026 through the post date as the latest monthly observation window for the ongoing state; these incidents have no standard quarterly reporting cycle.
support_condition: Dated investigations within the target period document significant unauthorized actions or weakened safety controls during foreseeable agent use.
contradiction_condition: Comparable evaluations and investigations show that the alleged failures did not occur or were reliably prevented across the relevant agent systems and uses.
measurement_requirements: Identify the agent, task, authorization boundary, observed action, date, and operational consequence. Distinguish routine use from deliberately induced laboratory attacks.
source_requirements: Primary incident reports or independent security investigations with enough detail to establish the failure.
