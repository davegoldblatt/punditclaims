explicit_source_elements:
  - properly integrating the two, classical search and large language models
  - We have proof of concept
  - some interesting research directions
  - nothing like systems we can count on
evaluator_interpretation:
  - The ordinary reading concerns dependable general-purpose factual answers and appropriate references from the hybrids available when Marcus wrote.
  - Proof of concept describes technical maturity. It does not necessarily deny that users could access working products.
  - Marcus supplies no accuracy threshold. Dependability requires evidence across ordinary factual searches; neither a successful demonstration nor an isolated error settles it.
  - For this ongoing observation, the target is December 2022 through publication, the latest reportable month. These products have no regular reporting period.
support_condition: Contemporaneous documentation and sufficiently broad testing show that available search–LLM hybrids remained experimental and had substantial factual or reference failures in ordinary use.
contradiction_condition: Contemporaneous testing establishes that a deployed hybrid routinely provided dependable factual answers with appropriate references across ordinary searches.
measurement_requirements: Identify the December 2022 product versions, questions tested, factual correctness, and whether references exist and support the answers. Public availability alone does not establish dependability.
source_requirements: Prefer dated product documentation and independent testing of the contemporary versions. Later tests of changed products cannot establish their December 2022 performance.
