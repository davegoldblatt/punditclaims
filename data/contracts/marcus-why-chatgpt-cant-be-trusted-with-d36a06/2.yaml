explicit_source_elements:
  - Everything else
  - glommed on top
  - with more or less reliabilty
  - pure LLMs correlate words in their training
evaluator_interpretation:
  - The plain reading is that practical capabilities beyond the underlying language-prediction process depend on additional engineering whose reliability varies.
  - Additional engineering includes training-time corrections, fine-tuning, reinforcement learning, prompts, retrieval, tools, and other system components. Learning inside model weights does not by itself contradict the claim.
  - The claim describes systems at publication, not a specified calendar year. The target is their state on 2026-01-03. Earlier experiments and disclosures provide context; they are not automatically evidence of that day's system state.
  - A finding that systems use additional engineering establishes only part of the claim. Assessing 'everything else' also requires distinguishing capabilities acquired during initial training from capabilities supplied by subsequent interventions.
support_condition: Architectural records and controlled evaluations of representative LLM systems show that their practical capabilities beyond language prediction depend on additional training or system components, with reliability varying across tasks or conditions.
contradiction_condition: Controlled evaluations establish that capabilities central to the claim arise reliably from initial language-model training without the additional corrective training or system components described here. Merely locating a capability inside model weights is insufficient.
measurement_requirements: Compare initial pretrained models with successive training stages and system components on the same tasks. Include unfamiliar situations and report failures as well as successes. Distinguish narrow task representations from reliable handling of changing real-world information.
source_requirements: Public architecture and training records, accompanied by reproducible evaluations or independent studies. Company descriptions alone cannot establish the origin of all capabilities.
