evaluator_interpretation:
  - In context, the ordinary broad reading is that capabilities beyond word correlation, including reasoning and world representation, come from components added around the language model.
  - External search and application instructions qualify as added components. Computations learned within the model do not.
  - For this ongoing architectural claim, I use 2025, the latest completed calendar year before the post. Architecture research has no standardized quarterly reporting period.
  - A demonstrated internal capability can contradict the universal architectural assertion without establishing general intelligence or dependable performance.
support_condition: Architecture descriptions and controlled evaluations show that capabilities beyond word correlation depend on external additions, with differing reliability.
contradiction_condition: Mechanistic or controlled evidence establishes a meaningful reasoning, planning, or world-representation capability within the language model itself, rather than supplied by an external component.
measurement_requirements: Separate model-internal computations from retrieval, tools, prompts, and orchestration. Prefer causal interventions or component ablations over output scores alone.
source_requirements: Public architecture descriptions and research available by the evaluation date, describing capabilities present during the target period.
