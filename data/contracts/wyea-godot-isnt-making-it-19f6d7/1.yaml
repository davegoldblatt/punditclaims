evaluator_interpretation:
  - These companies includes the major AI companies named nearby, including Microsoft and Amazon.
  - A plan means a concrete strategy for generative AI products, deployment or customer use beyond accumulating computing hardware.
  - Having a plan does not require that it succeed, become profitable or achieve artificial general intelligence.
  - Ever makes the target period the companies' relevant history through December 3, 2024, rather than the latest reporting quarter.
support_condition: Credible historical evidence establishes that all companies in scope lacked concrete generative AI product, deployment or commercial plans beyond hardware scaling.
contradiction_condition: At least one company in scope had a documented concrete generative AI plan before the post, involving identifiable products, customers or deployment methods beyond buying GPUs.
measurement_requirements: Dated plans with specific applications or deployment steps. Generic aspirations or spending totals alone do not qualify.
source_requirements: Contemporaneous strategy documents, product announcements, roadmaps or deployment records from companies in scope.
