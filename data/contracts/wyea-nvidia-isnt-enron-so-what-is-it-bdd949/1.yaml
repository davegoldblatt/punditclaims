explicit_source_elements:
  - dodgy and weird and unsustainable
  - it isn’t illegal
  - circular deals
  - CoreWeave, Lambda and Nebius
evaluator_interpretation:
  - Dodgy and weird are evaluative language and receive no separate factual score.
  - Read unsustainable as saying the financing arrangements then in place could not support their obligations on commercially viable terms, rather than merely carrying substantial risk.
  - Read not illegal as a claim about the described arrangements' legality, not merely the absence of an announced prosecution.
  - Use calendar Q3 2025, the latest completed reporting quarter available before the post for assessing the counterparties' ongoing financial condition.
  - No particular monetary amount or accounting measure is asserted; this contract concerns qualitative viability and legality.
support_condition: Deal-specific financial evidence establishes that the arrangements were commercially unsustainable, while applicable law and the actual terms establish that the described conduct was lawful.
contradiction_condition: Deal-specific evidence establishes sustainable economics under the existing arrangements, or an authoritative legal determination establishes that the described arrangements violated applicable law.
measurement_requirements: Examine contractual obligations, customer receipts, financing needs, collateral and repayment terms. Distinguish dependence on financing from demonstrated inability to meet obligations.
source_requirements: Published agreements and financial records, plus applicable legal authority or a reasoned legal determination. Absence of enforcement is not affirmative proof of legality.
