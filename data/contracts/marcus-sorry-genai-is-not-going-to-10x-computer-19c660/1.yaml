explicit_source_elements:
  - Two recent studies
  - nothing like “10x” improvement
  - One result with 800 programmers
  - Another somewhat more positive study
evaluator_interpretation:
  - The descriptions identify Uplevel's September 2024 study and the September 2024 Cui and colleagues paper on three workplace experiments.
  - Assess what those studies reported by October 1, 2024. Their underlying experiments may predate publication, and no lower date bound is imposed.
  - Tenfold means ten times baseline productivity. The claim being graded is the comparison with tenfold, not the accuracy of every adjacent description of the studies.
  - The reference to two studies identifies the evidence; it is not a conditional forecast.
support_condition: Both identified studies report productivity effects far below tenfold.
contradiction_condition: At least one identified study reports a credible productivity effect approaching or exceeding tenfold on its stated productivity measure.
measurement_requirements: Use each study's reported productivity measure and original contemporaneous results. Distinguish pooled estimates from junior-developer subgroup estimates.
source_requirements: The two original studies or primary reports of their findings, using versions available by the post date.
