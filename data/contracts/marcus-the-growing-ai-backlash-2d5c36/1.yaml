explicit_source_elements:
  - already
  - splitting both parties
evaluator_interpretation:
  - Both parties means the US Democratic and Republican parties.
  - Splitting ordinarily means visible internal disagreement over AI policy, including its infrastructure, rather than formal party breakups.
  - The current observation window is April 2026, the latest complete month before publication, plus elapsed days through May 4.
  - Disputes must involve identifiable opposing positions within each party and concerns about AI or its infrastructure.
support_condition: Dated records show substantive disagreements within both major parties over AI regulation or AI-related infrastructure during the observation window.
contradiction_condition: Reliable records establish that the alleged opposing positions were misattributed or that one party had no substantive internal disagreement in the identified disputes.
measurement_requirements: Identify the participants, their party affiliations, their opposing positions, and the connection to AI concerns. Bipartisan agreement alone is insufficient.
source_requirements: Prefer statements and legislative records; independent reporting may establish the participants, motives, and context of a dispute.
