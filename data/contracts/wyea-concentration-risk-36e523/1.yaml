explicit_source_elements:
  - OpenAI and Anthropic
  - financially dependent on these customers
  - to survive
  - AI startups that can literally not afford to pay for tokens without venture capital funding
evaluator_interpretation:
  - The plain reading is that both labs require payments from VC-dependent AI startup customers to sustain operations. Having important customers or concentrated revenue is insufficient by itself.
  - Use April–June 2026, the latest completed calendar reporting quarter before the post, for the ongoing financial condition.
  - The surrounding argument relies on third-party estimates of customer spending; it does not specify a survival horizon or a minimum revenue share.
support_condition: Comparable customer revenue, cash, expense and financing records show that removing payments from VC-dependent AI startups would prevent both labs from sustaining operations.
contradiction_condition: Comparable records establish that either lab could sustain operations without those payments, accounting for existing obligations and available financing.
measurement_requirements: Separate VC-dependent AI startups from other customers. Reconcile their payments with each lab's total receipts, costs, liquidity and financing obligations. Revenue concentration alone cannot establish survival dependence.
source_requirements: Financial statements and customer-level records, or credible reporting with sufficiently complete underlying figures, for both labs.
