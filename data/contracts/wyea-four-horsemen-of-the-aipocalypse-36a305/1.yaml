ambiguity_flags:
  - Q4 is omitted immediately before the $16.3 billion balance.
  - Dollar currency and exchange-rate convention are unstated.
  - "'Gross profit' is expressed as a percentage and is interpreted as gross margin."
  - The normalized proposition adds a GPU-accumulation inference from the surrounding context.
  - The claim combines inventory balances, margin comparisons and an inventory-composition inference.
