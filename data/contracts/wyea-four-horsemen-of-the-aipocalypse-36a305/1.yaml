assessment_axis: historical_observation
explicit_source_elements:
  - Per Quanta Computing’s fourth quarter financial results
  - $10.54 billion in Q3 2025
  - $16.3 billion 2025
  - nearly doubled year-over-year ($8.33 billion)
  - gross profit dropped from 7.9% in Q4 2024 to 7% Q4 2025
evaluator_interpretation:
  - The company is Quanta Computer Inc. and its consolidated subsidiaries.
  - Read '$16.3 billion 2025' as the Q4 2025 closing inventory balance, given the surrounding comparisons.
  - Read the dollar amounts as US-dollar translations of company-reported inventory. The speaker gives no exchange rates or conversion dates.
  - Because the profit figures are percentages, read 'gross profit' as gross margin. Retain the expressly stated fourth-quarter periods.
  - The normalized proposition also treats rising inventory as evidence of GPU accumulation. That inference requires inventory composition or shipment-delay evidence; total inventory alone is insufficient.
  - The structured money scope covers the inventory assertion. Gross-margin evidence is separately identified and is not treated as matching evidence for that inventory metric.
support_condition: Quanta's consolidated statements, with a documented currency translation, reproduce the three approximate inventory balances and near doubling. The stated quarterly margins must match, and inventory composition must substantiate the inference of accumulating GPUs.
contradiction_condition: Comparable records materially disagree with the inventory balances or growth, show different quarterly margins, or directly establish that the inventory increase did not represent GPU accumulation. Missing GPU detail alone is not contradiction.
measurement_requirements: Compare inventory at September 30, 2025, December 31, 2025 and December 31, 2024 on the same consolidated basis. Document USD translation. Distinguish raw materials, work in progress, finished goods and goods in transit, and distinguish quarterly margins from annual margins.
source_requirements: Quanta's original quarterly presentation and consolidated statements, supplemented by dated exchange-rate records and GPU-specific inventory disclosures.
