assessment_axis: forecast_outcome
explicit_source_elements:
  - We will eventually get to something better
  - continuing to put all our eggs in the Henrietta’s LLM basket
evaluator_interpretation:
  - In context, 'better' means materially better factual reliability and checking of answers against records or sources.
  - A qualifying approach moves beyond reliance on an LLM alone. A hybrid using language models alongside databases or symbolic verification can qualify.
  - I require reproducible comparative evidence across varied factual tasks, with independent corroboration, to establish a successor's reliable advantage. These evidence requirements are mine, not thresholds Marcus supplied.
  - Neither widespread adoption nor complete elimination of hallucinations is required by his words.
  - The criticism of investment choices is evaluative rhetoric and is not part of the forecast being scored.
support_condition: A post-publication non-LLM or hybrid approach demonstrates a reproducible, independently corroborated improvement in factual accuracy and source verification over the LLM approach discussed, across varied factual tasks and without obtaining its advantage merely by declining more questions.
contradiction_condition: Decisive evidence rules out the predicted improvement. Failure to produce a qualifying successor by any finite evaluation date does not contradict 'eventually'.
measurement_requirements: Compare factual errors, correct answers, abstentions and source verification on matched tasks. Establish that gains come from the alternative approach and extend beyond one narrow demonstration.
source_requirements: Dated primary descriptions and comparative evaluations, with independent corroboration for decisive support. Vendor announcements alone establish availability, not general superiority.
metric_scope: null
original_horizon: eventually
horizon_interval:
  start: 2025-05-05
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a dated demonstration satisfying the support condition, with corroborating evidence available by the evaluation date. An announcement or isolated benchmark improvement alone is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Eventually' supplies no deadline."
  - "'Something better' supplies no metric, magnitude or breadth of improvement."
  - The boundary between an improved LLM system and a successor hybrid approach is unspecified.
  - Requiring corroborated improvement across varied tasks is an evaluator interpretation; a narrower reading could count individual hybrid demonstrations.
