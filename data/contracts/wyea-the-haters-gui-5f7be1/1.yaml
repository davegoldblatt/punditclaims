assessment_axis: forecast_outcome
explicit_source_elements:
  - white collar workers will be fired
  - in the next few years
  - agents
  - will never exist
evaluator_interpretation:
  - Assess the prediction about agents, excluding the speculation about reporters' private feelings.
  - The contextual target is autonomous systems capable of replacing white-collar workers on the broad scale attributed to Amodei, not every tool marketed as an agent.
  - Amodei's warning provides scope, but its numerical employment projection is not silently imposed as a precise threshold Zitron supplied.
  - "'In the next few years' describes the warning being rejected. Zitron's own 'never' prediction has no deadline."
  - A narrower claim that no agent could ever replace any white-collar work would face substantially stronger counterevidence.
support_condition: A finite observation period cannot establish that such agents will never exist. Support would require a decisive demonstration that the specified capability is impossible.
contradiction_condition: Credible evidence establishes autonomous agents performing complete white-collar roles reliably at broadly deployable scale, with substantial realized worker substitution rather than task assistance alone.
measurement_requirements: Measure complete workflows, reliability, human supervision, deployment scale and attributable changes in employment. Separate job replacement, avoided hiring, redeployment and task automation.
source_requirements: Prefer independent deployment evaluations and employer employment records; company claims require scrutiny and cannot establish economy-wide effects by themselves.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve contradicted upon a dated, credible demonstration of broadly deployable autonomous agents replacing white-collar roles at the contextual scale. Product launches, benchmarks and isolated task automation do not alone meet the rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Agent autonomy and reliability are undefined.
  - The scale of worker replacement is supplied through contextual reference, not a numerical commitment by Zitron.
  - Existence of capability and realized mass displacement are different tests.
  - The word 'never' supplies no deadline.
retrospective_or_prospective: retrospective
