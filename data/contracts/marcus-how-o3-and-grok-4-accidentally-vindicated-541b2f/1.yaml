evaluator_interpretation:
  - In the supplied context, tool-driven neurosymbolic systems include neural models coupled to executable computer programs or symbolic tools.
  - Better results means demonstrated gains on specified tasks against corresponding neural-only baselines, not superiority on every task.
  - Finally expresses the speaker's view of the field's direction; it is not treated as a precise claim of historical priority.
  - Use current-year evaluations through the post date, since this technical field has no common quarterly reporting cycle.
support_condition: Implemented systems combining neural models with executable tools outperform relevant neural-only baselines in matched task evaluations.
contradiction_condition: Matched evaluations of the approaches at issue show no performance gains, or their claimed gains disappear when the relevant comparison is corrected.
measurement_requirements: Identify the tools, baseline, tasks, and evaluation procedure. Separate changes in training, prompting, and inference resources from the mere presence of tools.
source_requirements: Primary research with comparative evaluations or developer disclosures that identify tool-enabled and tool-free settings.
