evaluator_interpretation:
  - The ordinary reading is recurring difficulty with unusual compositions among image generators available before publication, not that every attempt necessarily fails.
  - The causal explanation is that learned preferences for familiar relationships interfere with following an unfamiliar relationship specified in the prompt.
  - Historical difficulty and its proposed cause must both be assessed. Documenting errors alone does not settle the causal explanation.
  - The historical scope ends on February 13, 2024; the source supplies no beginning date.
support_condition: Representative historical evaluations show recurring difficulty with rare compositions, and controlled comparisons establish that learned frequency preferences materially cause those errors.
contradiction_condition: Representative historical evaluations show reliable performance on the relevant rare compositions, or controlled causal tests show that the proposed frequency mechanism does not explain the observed difficulty.
measurement_requirements: Compare familiar and reversed relationships using identified model versions, repeated generations, and human assessment of the requested roles. Separate frequency effects from caption quality, ambiguity, and other model limitations.
source_requirements: Primary evaluations or controlled studies of systems available by publication, including any material successful results.
