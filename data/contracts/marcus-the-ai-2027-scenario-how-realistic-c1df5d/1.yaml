assessment_axis: forecast_outcome
explicit_source_elements:
  - making plans around export controls
  - China will inevitably catch up
evaluator_interpretation:
  - The assessed proposition is the parenthetical forecast about China, rather than the surrounding causal claim about short-term policy choices.
  - The plain reading is that Chinese frontier AI models eventually become broadly comparable in capability to contemporaneous leading US models despite restrictions on advanced computing exports.
  - Broad comparability does not require identical scores on every task. A single benchmark lead, however, does not by itself establish general frontier parity.
  - Despite export controls means progress under meaningful restrictions; it does not require proving that controls had no delaying effect.
  - No deadline is supplied. Inevitably expresses confidence, not a hidden date.
support_condition: A dated, independently corroborated event establishes broad frontier-model parity after the post while meaningful export restrictions apply.
contradiction_condition: A decisive event establishes that catching up has become impossible under the stated conditions. A remaining gap at any finite date is insufficient.
measurement_requirements: Compare contemporaneous models using independent evaluations across multiple relevant capabilities, with consistent methods and attention to uncertainty, benchmark saturation, and model availability.
source_requirements: Independent benchmark measurements and official export-control records. Developer-selected benchmark claims alone are insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon independently corroborated broad capability parity under export restrictions. Resolve as contradicted only upon a decisive event making eventual parity impossible. Otherwise retain an open horizon.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Catch up has no specified benchmark, margin, or capability coverage.
  - China could mean its frontier models or its broader AI industry; this assessment uses frontier-model capability.
  - No deadline is given.
  - The export-control regime may change over time.
  - An Arena-only reading could yield a different assessment from broad capability parity.
retrospective_or_prospective: retrospective
