assessment_axis: historical_observation
explicit_source_elements:
  - benchmarks that don’t really compare to real world success
  - over the last few months
  - nobody can actually explain what the result of it being better is
  - nor does it appear to extend to any domain outside of coding
evaluator_interpretation:
  - Read the last few months as December 2025 through April 14, 2026; the starting month is an evaluator choice.
  - The ordinary reading challenges whether recent benchmark gains have concrete practical meaning and whether meaningful gains extend beyond coding.
  - A higher score alone does not settle practical usefulness. Human evaluation of realistic deliverables and verified task results are stronger evidence.
  - Treat the benchmark-validity criticism and the claim about non-coding gains as distinct components. Do not interpret the wording as denying every possible use of an older model.
support_condition: Contemporaneous validation shows a material gap between benchmark success and practical acceptance. Supporting the broader claim also requires evidence that recent improvements lack identifiable practical or non-coding benefits.
contradiction_condition: Dated comparisons show improved performance on realistic non-coding tasks with substantive human evaluation, or documented practical results explain what the improvements enable.
measurement_requirements: Compare earlier and later models on comparable tasks; distinguish automated benchmark scores, expert judgments of deliverables, and deployed productivity.
source_requirements: Primary evaluation reports and inspectable practical results, with dates and limitations sufficient to establish relevance to the prepublication period.
