assessment_axis: historical_observation
explicit_source_elements:
  - It gets "better" as measured by benchmarks
  - benchmarks that don't really compare to real world success
  - supposedly meteoric improvements over the last few months
  - nobody can actually explain what the result of it being better is
  - nor does it appear to extend to any domain outside of coding
evaluator_interpretation:
  - "'It' is LLM capability, mainly AI coding, following 'AI can write code'."
  - "Part A (firm): coding benchmark gains overstate real-world success. Plain reading: benchmark scores are a poor guide to how useful the output is in real work. Tested with studies that compare benchmark results with real-world acceptance."
  - Part B ('nobody can actually explain') is hyperbole about how well gains are explained. It cannot be measured and is not scored.
  - "Part C ('nor does it appear to extend to any domain outside of coding'): 'appear' hedges it, so it is read modestly. It fails only if, before the post, there was clear and widely reported evidence of real-world gains outside coding, not just higher benchmark scores. Clear results on open problems in mathematics, a domain Karpathy named and Zitron discussed, would count."
  - "Target period: the 'last few months' before the post, taken as December 2025 to the post date of 2026-04-14."
support_condition: Part A is supported if rigorous studies show coding benchmark scores substantially overstate real-world success. Part C holds if no clear real-world gains outside coding were documented in the period.
contradiction_condition: Part A is contradicted if studies show benchmark scores track real-world acceptance closely. Part C is contradicted if, in the period, documented and verified real-world results outside coding appeared (for example, open math problems solved by recent models and confirmed by experts).
measurement_requirements: "Part A: a study comparing automated benchmark passes with real-world acceptance (for example, maintainer merge decisions). Part C: dated, expert-verified non-coding results from recent models."
source_requirements: Independent research (METR) for Part A. Institutional or expert confirmation for Part C.
