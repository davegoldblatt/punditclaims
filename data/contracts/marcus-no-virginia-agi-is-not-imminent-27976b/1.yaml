  - ingest massive amounts of data
  - both public and commercial sources
  - quite possibly including eg sample law school and medical exams
evaluator_interpretation:
  - The claim concerns a deterioration between 2019 and August 20, 2023, caused by expanded training-data exposure.
  - I interpret benchmark informativeness as how well scores predict performance on genuinely unseen tasks. This is an operational measure, not a definition of intelligence.
  - Possible exam exposure is a proposed mechanism, not a firm assertion that particular exams were included.
support_condition: Comparable evaluations of 2019 and pre-post 2023 systems show that expanded training exposure caused benchmark scores to become less predictive of unseen-task performance.
contradiction_condition: Comparable evaluations show that expanded exposure did not reduce benchmark predictive validity, or that validity improved after controlling for other changes.
measurement_requirements: Matched benchmarks and unseen tasks, comparable scoring, training-exposure measurements or interventions, and controls for model capability and evaluation changes.
source_requirements: Primary contamination experiments and longitudinal evaluations. Demonstrating contamination alone does not establish the claimed deterioration.
