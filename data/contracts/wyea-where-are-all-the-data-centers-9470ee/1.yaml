early_resolution_rule: Resolve only after definitive failure of the relevant planned build-out is documented and consistent loss and funding records settle the amount and financing clauses. Isolated cancellations, construction delays, or exposure estimates do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The relevant set of planned data centers is not enumerated.
  - The extent of nonconstruction required to trigger the condition is unspecified.
  - The contextual phrase 'next few years' does not supply a definite deadline.
  - "'Wasted' has no stated accounting definition."
  - "'Large swaths' has no numerical threshold."
  - Currency, accounting basis, and loss-measurement period are not expressly specified.
