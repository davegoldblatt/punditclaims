assessment_axis: forecast_outcome
explicit_source_elements:
  - if they don’t get built
  - hundreds of billions of dollars have been wasted
  - large swaths of those billions funded by private credit
  - funded by pensions, retirements and insurance funds
evaluator_interpretation:
  - The antecedent concerns failure to deliver the planned AI data-center build-out discussed in the post. A temporary delay or an isolated cancellation does not by itself establish that broad condition.
  - The ordinary reading of 'wasted' is unrecovered investment attributable to failed construction, after recoveries and redeployment, rather than announced project value or financing commitments.
  - I read 'hundreds of billions' as at least US$200 billion in aggregate losses. This numerical floor and the currency identification are evaluator interpretations.
  - The financing clause requires a substantial share of those same losses to involve private credit traceable to pension, retirement, and insurance capital. The speaker supplies no numerical share.
  - The surrounding phrase 'the next few years' provides a rough time frame but no unambiguous final date. I therefore assign no fixed deadline.
  - No accounting basis or cited financial estimate is supplied for the loss amount. The contract records that basis as unknown.
support_condition: The broad construction-failure condition is established, and consistent financial records demonstrate at least US$200 billion of unrecovered investment caused by that failure, with a substantial portion financed through private credit linked to pension, retirement, and insurance capital.
contradiction_condition: After the construction-failure condition is established and recoveries are sufficiently settled, comprehensive records establish aggregate losses below US$200 billion or show that the claimed substantial private-credit funding connection does not hold.
measurement_requirements: A defined project cohort; definitive abandonment or failure records; capital actually deployed; recoveries, resale, and redeployment; and financing ownership traced through funds. Avoid counting the same economic loss at project, lender, and investor levels.
source_requirements: Project termination records, filings, impairment and recovery disclosures, and lender or fund reports linking losses to the relevant capital providers. Risk estimates and investment commitments alone cannot establish realized losses.
