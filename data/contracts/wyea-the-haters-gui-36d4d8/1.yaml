explicit_source_elements:
  - so many people have lost their jobs
  - because companies are spending
  - the equivalent of the entire GDP of some European countries
  - on data centers and GPUs
  - won’t actually deliver any value
evaluator_interpretation:
  - The claim combines already-incurred job losses, a causal explanation, an unspecified spending comparison, and a forecast about value.
  - The historical component covers losses incurred by July 21, 2025. No beginning is stated, so the target period has an unspecified start.
  - The plain causal reading is that infrastructure spending displaced employment spending; simultaneous layoffs and investment are insufficient by themselves.
  - Any value ordinarily includes productive or financial benefits. It does not require every investment to earn an adequate net return.
  - No companies, European countries, accounting basis, or spending period are specified for the GDP comparison.
support_condition: Evidence connects substantial pre-publication job losses to funding the identified infrastructure investments, establishes the spending comparison on consistent terms, and shows those investments ultimately delivered no productive or financial value.
contradiction_condition: Evidence disproves the asserted funding link for the relevant losses, or demonstrates productive or financial value from the same identified investments. General AI benefits or aggregate company profits do not by themselves settle returns from those investments.
measurement_requirements: Identify the companies, affected workers, budget decisions, infrastructure projects, spending periods, and subsequent benefits. Compare spending with GDP using the same currency and a stated period.
source_requirements: Prefer budget records, management statements, filings, and project-level return evidence. Direct interviews reported by reputable news outlets can establish management's explanation when primary records are unavailable.
