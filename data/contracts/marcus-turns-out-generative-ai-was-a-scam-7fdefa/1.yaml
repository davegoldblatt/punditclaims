assessment_axis: causal_assessment
explicit_source_elements:
  - most business have struggled to find return on their investment
  - given the massive reliability issues
  - continue to plaguage it
evaluator_interpretation:
  - Read 'most' as more than half of businesses investing in generative AI, including pilots.
  - Read 'struggled' as difficulty realizing or demonstrating benefits sufficient to justify investment, not necessarily permanent losses.
  - Read reliability failures as a material cause of that difficulty, rather than necessarily its sole cause.
  - Use calendar 2025, the latest completed annual reporting period before publication, for the ongoing business experience described.
  - This is a population-level causal claim, not a financial figure for an identified company; metric_scope is null.
support_condition: Representative evidence shows that more than half of generative-AI investors struggled to realize or demonstrate returns, and links reliability failures materially to that difficulty.
contradiction_condition: Comparable representative evidence shows that most investors obtained returns without such difficulty, or credible causal evidence rules out reliability failures as a material explanation.
measurement_requirements: Separate businesses from projects, pilots from deployed applications, realized financial returns from productivity perceptions, and generative AI from AI generally. Establish causation beyond co-occurring complaints.
source_requirements: Transparent enterprise studies covering successful and unsuccessful adopters, with investment-return definitions, sampling information, and evidence about causes.
