explicit_source_elements:
  - 44% of its first half FY2027 revenues
  - three customers
  - in Q2 FY2027, 70% of its accounts receivables
  - three customers
  - 16% of its revenues coming from one
evaluator_interpretation:
  - The 16% figure refers to second-quarter FY2027 revenue, consistent with the sentence's immediate context.
  - Customers means NVIDIA's disclosed direct customers, not necessarily the ultimate users of its chips.
  - Accounts receivable is measured at the second-quarter closing date; revenue is measured over the specified half-year or quarter.
  - Revenue concentration problem is treated as a description of the numerical concentration, not a separately measurable claim about an unacceptable level of risk.
  - This compound claim combines revenue flows and a receivable stock. The contract's stock_or_flow field describes the main revenue component; the receivable component is identified separately in the measurement requirements and evidence scope.
support_condition: The FY2027 second-quarter filing reports three direct customers totaling 44% of first-half revenue, three customers totaling 70% of quarter-end receivables, and one customer supplying 16% of second-quarter revenue.
contradiction_condition: The same-period disclosure reports a materially different percentage or customer count for any component. Correct revenue figures alongside an incorrect receivables figure warrant a mixed outcome.
measurement_requirements: First-half FY2027 revenue covers January 26 through July 26, 2026. Second-quarter revenue covers April 27 through July 26, 2026. Receivables are a stock at July 26, 2026. Add disclosed customer percentages within each measure without combining periods or treating revenue shares as receivable shares.
source_requirements: NVIDIA's FY2027 second-quarter Form 10-Q controls. Secondary summaries must be checked against that filing.
