assessment_axis: not_applicable
explicit_source_elements:
  - GenAI businesses
  - don’t have the same economics
  - nor do they have the same total addressable markets
evaluator_interpretation:
  - The context compares generative AI businesses with earlier businesses that financed substantial losses, including Uber.
  - Literal numerical equality would be a trivial reading. The substantive reading concerns whether those earlier businesses provide a useful economic analogy.
  - The statement does not specify which businesses, economic measures, market boundaries, or degree of similarity would establish that analogy. It also does not explicitly say that generative AI markets are smaller.
support_condition: A specified comparison could be supported by materially different cost structures and addressable markets. The statement supplies insufficient boundaries to apply that test consistently.
contradiction_condition: A specified comparison could be contradicted by sufficiently similar economics and addressable markets. Neither the comparison group nor sufficient similarity is defined.
measurement_requirements: Defined business cohorts, comparable stages of development, specified economic measures, and consistent addressable-market definitions.
source_requirements: Comparable financial disclosures and market research with disclosed methods.
