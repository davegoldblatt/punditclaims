target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - The earlier-business comparison group is open-ended.
  - Economics could mean margins, capital intensity, acquisition costs, or eventual profitability.
  - Same total addressable markets could refer to market size, customers, or applications.
  - No materiality threshold distinguishes meaningful similarity from ordinary differences between businesses.
