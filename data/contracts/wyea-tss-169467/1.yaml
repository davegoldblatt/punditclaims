ambiguity_flags:
  - Routinely has no numerical threshold.
  - Unquestioningly could mean lack of warnings or lack of internal checking.
  - Doesn’t know anything is broader than an operational claim about security understanding.
  - No Copilot version or programming-language scope is specified.
