assessment_axis: causal_assessment
explicit_source_elements:
  - Microsoft’s Github Copilot tool
  - routinely — and unquestioningly — outputs insecure code
  - because
  - it doesn’t know anything
  - As pointed out by cybersecurity firm Snyk
evaluator_interpretation:
  - Routinely means a recurring, material problem, not necessarily a majority of suggestions.
  - "I interpret the causal language functionally: inadequate security understanding causes insecure suggestions."
  - A literal claim about possessing no knowledge has no agreed measurement. The functional interpretation is necessary to test the causal proposition.
  - The assessment concerns the system described before publication; older code samples provide background rather than a precise current failure rate.
support_condition: Security evaluations establish recurring insecure suggestions, and controlled evidence identifies deficient security understanding as their cause.
contradiction_condition: Representative evaluations undermine the alleged recurring problem, or causal evidence shows that the proposed mechanism does not explain the failures.
measurement_requirements: Separate vulnerability frequency from causal explanation. Control model version, prompts, surrounding code, and security safeguards.
source_requirements: Reproducible security evaluations and controlled interventions. Vendor demonstrations may establish a failure mode but not general prevalence or a universal cognitive explanation.
