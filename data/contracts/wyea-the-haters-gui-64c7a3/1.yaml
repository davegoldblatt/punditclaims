explicit_source_elements:
  - Generative AI does not do the things that it's being sold as doing
  - the things it can actually do aren't the kind of things that create business returns
  - automate labor
  - really do much more than one extension of a cloud software platform
evaluator_interpretation:
  - Read as a present-tense claim about deployed generative AI capabilities, rather than a forecast.
  - With no reporting period specified, use April–June 2025, the latest completed calendar quarter before publication.
  - The plain reading denies meaningful business returns and labor automation. A documented deployment performing a substantial share of work previously requiring people can contradict the automation clause.
  - Task automation does not require eliminating whole jobs. Handling inquiries does not establish that every inquiry was resolved satisfactorily.
  - Business returns require benefits exceeding relevant costs. Usage, productivity, revenue growth and gross savings alone do not establish net returns.
  - The marketing clause requires matching an identifiable advertised capability to evidence about its delivery. The cloud-platform comparison supplies no separate measurable threshold.
  - The claim concerns general capabilities, not a named company's financial metric; metric_scope is null.
support_condition: Representative deployment evidence shows that advertised capabilities were not delivered and that actual capabilities produced neither positive business returns nor substantial automation of human tasks.
contradiction_condition: Credible evidence within the target period documents substantial task automation or positive realized business returns from deployed generative AI. This contradicts the broad denial without establishing that all marketing promises were fulfilled.
measurement_requirements: Identify generative AI specifically, actual deployment, the tasks performed, and the observation period. Distinguish handling from successful resolution, task automation from job replacement, and financial returns from productivity or gross savings.
source_requirements: Prefer independent evaluations and primary deployment records. Attribute company-reported results explicitly. Reporting based on a named company spokesperson is admissible with its verification limits disclosed.
