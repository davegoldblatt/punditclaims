assessment_axis: historical_observation
explicit_source_elements:
  - Agents do not exist as a product
  - can be sold at that scale
  - $3 billion in 2025
  - Agents as a mass market product
evaluator_interpretation:
  - Read that scale as the approximately $3 billion of calendar-2025 agent sales discussed immediately beforehand.
  - Assess the commercial capacity of products existing when the post appeared, not an unconditional forecast that no later product could reach that scale.
  - OpenAI is the immediate subject; other vendors can provide industry context but cannot establish OpenAI’s revenue.
  - Use April 1–28, 2025 as the latest current-month observation window for the ongoing product-readiness claim.
  - A product launch, pilot, or broad purchasing commitment alone does not establish capacity for $3 billion of agent sales.
support_condition: Contemporaneous commercial and operational evidence establishes that the existing products could not support the discussed $3 billion sales scale.
contradiction_condition: Contemporaneous evidence establishes deliverable agent-specific sales, contracts, or deployments sufficient to support approximately $3 billion of 2025 sales from an existing product.
measurement_requirements: Separate agent revenue from total model, API, and subscription revenue; separate realized sales from annualized revenue, commitments, and investment.
source_requirements: Dated commercial records and deployment evidence, ideally with agent-specific revenue or enforceable delivery terms.
