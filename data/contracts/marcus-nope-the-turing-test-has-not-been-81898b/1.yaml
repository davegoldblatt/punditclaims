  - a Comprehension Challenge
  - even now
  - no software would be able to meet that challenge
evaluator_interpretation:
  - This describes capability at the post date, rather than a forecast.
  - The referenced 2014 proposal asks software to watch arbitrary television programs or YouTube videos and answer questions about their content, including explanations of motives and humor.
  - The ordinary reading requires reliable comprehension across varied unfamiliar material, comparable to a competent human viewer; it does not require literal perfection on every imaginable question.
  - For this ongoing capability claim, use December 2023 through December 9 as the latest reporting window. Earlier evaluations are context unless they establish capability in that window.
  - Marcus's 2014 article defines the task but cannot establish that his 2023 capability assessment was correct.
support_condition: A sufficiently broad evaluation of leading software existing by December 9, 2023 shows that none can reliably answer open-ended questions across the challenge's range of video content and reasoning requirements.
contradiction_condition: At least one system existing by December 9, 2023 demonstrably performs the full challenge reliably on varied unfamiliar videos, including explanatory questions, under a credible evaluation.
measurement_requirements: Video-grounded, open-ended questions across varied programs, with human assessment, disclosed failures, and checks against answers drawn only from prior knowledge. Narrow captioning, multiple-choice tasks, or selected demonstrations alone do not settle the claim.
source_requirements: Primary evaluations or reproducible demonstrations of contemporaneous systems. Later publications may inform the historical assessment only if they identify the earlier system and evaluation period.
