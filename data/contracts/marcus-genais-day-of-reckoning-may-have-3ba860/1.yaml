assessment_axis: forecast_outcome
explicit_source_elements:
  - For most GenAI model building companies
  - profits will be meager
  - Or nil
evaluator_interpretation:
  - The plain reading is that a majority by company count will earn little or no bottom-line profit as the industry develops.
  - Most companies is a population threshold, not a conditional antecedent.
  - No numerical profit threshold, accounting basis, currency, reporting period or deadline is specified.
  - The surrounding discussion concerns model-building economics, but it does not clearly distinguish standalone companies from model-building businesses inside diversified groups.
support_condition: Comparable financial results for a defined, representative population show that a majority earn no profit or profits that are clearly small relative to their businesses, under a defensible specified accounting basis.
contradiction_condition: Comparable results establish substantial bottom-line profits for a majority of the relevant model builders.
measurement_requirements: A company-count denominator, comparable bottom-line financial results, treatment of diversified parents, a definition of meager and an assessment period. Cash burn, operating income and revenue cannot substitute for net profit.
source_requirements: Company financial statements or credible financial reporting with disclosed scope and accounting treatment. Forecasts must be distinguished from realized results.
