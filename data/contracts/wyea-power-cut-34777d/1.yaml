condition_status: not_applicable
early_resolution_rule: Contradicted early if OpenAI reports a full year of profit in reliable financial statements. Supported early if OpenAI ceases operating, or is sold or restructured because it cannot fund its losses.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'No path to profitability' has no deadline and is partly a judgment."
  - The 'will need more cash' part happened (a new round in February 2026), but a fundraise does not show there is no path to profit.
