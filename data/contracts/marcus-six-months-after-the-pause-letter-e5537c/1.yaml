assessment_axis: historical_observation
explicit_source_elements:
  - The big companies
  - have all pledged fealty to transparency
  - none of them
  - what’s in their data sets
evaluator_interpretation:
  - The transparency-pledge reference is read in the context of the White House commitments discussed in the post.
  - The ordinary reading of disclosing what is in a dataset includes substantive information about named sources and composition. A generic description such as publicly available material provides much less information.
  - The wording does not explicitly restrict the claim to each company's newest frontier model, or require publication of every training document.
  - Source-level disclosure and a complete, independently inspectable training corpus are assessed separately.
  - No measurement period is specified. I use the six-month retrospective named in the title, ending on publication, as the reporting window.
support_condition: The relevant major companies made transparency pledges, while their disclosures provided no substantive identification of training-data constituents.
contradiction_condition: A relevant major company published substantive source or composition information for an AI training dataset, or the claimed transparency pledges were absent.
measurement_requirements: Identify the company and model. Distinguish named datasets, source proportions, filtering descriptions, and complete document-level disclosure.
source_requirements: Use original pledge records and model documentation available before the post. Do not infer disclosure of one model's dataset from another model's documentation.
