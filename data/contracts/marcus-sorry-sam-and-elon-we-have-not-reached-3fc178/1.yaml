assessment_axis: causal_assessment
explicit_source_elements:
  - many more
  - part of why
  - a bunch of companies
  - quietly rehiring
evaluator_interpretation:
  - The ordinary reading is that AI's inability to perform expected work contributed to renewed human recruitment at multiple companies.
  - Rehiring includes refilling eliminated human roles with new employees; it does not require every recruit to be the same person previously dismissed.
  - Part of why requires a contributing cause, not the sole cause or the main cause across the economy.
  - Quietly describes limited publicity, not literal secrecy or a measurable publicity threshold.
  - Assess decisions made by the post date. No fixed retrospective period is supplied, and no financial reporting quarter is imposed on this causal claim.
support_condition: Documented company cases or multi-company research show actual restoration of human roles, with AI capability shortfalls contributing to those decisions.
contradiction_condition: Reliable evidence establishes that the reported restorations did not occur or that the attributed capability shortfalls did not contribute. An isolated disputed case would not refute the claim about multiple companies.
measurement_requirements: Separate completed recruitment from hiring intentions, cancelled redundancies and expansion unrelated to AI limitations. Seek direct explanations of the decisions rather than infer causation from headcount changes alone.
source_requirements: Prefer company records and original employer research. Named executive reporting may establish motives when company documentation is unavailable.
