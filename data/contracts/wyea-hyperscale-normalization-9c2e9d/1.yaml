assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI and Anthropic
  - lose tens of billions of dollars a year
  - can only “reach profitability” through financial engineering
evaluator_interpretation:
  - The opening prediction about becoming the largest companies is presented sarcastically. It is not scored as Zitron's forecast.
  - The ordinary reading of the loss assertion is annual net losses of at least $20 billion for each company. A combined total is another possible reading.
  - For the annual-loss comparison, use calendar 2025, the latest completed calendar year before the post. Do not annualize a partial year's losses.
  - Financial engineering means accounting or financing changes that create reported profitability without profitable underlying operations. Showing such adjustments exist does not establish that they are the only possible route to profitability.
  - The supplied passage does not identify an accounting basis or attribute the loss figures to a particular financial report. The contract therefore records an unknown basis.
support_condition: Comparable annual net-loss figures meet the threshold for both companies, and financial records establish that the profitability being asserted depends on accounting or financing adjustments rather than underlying earnings.
contradiction_condition: Comparable annual net-loss figures fall below the threshold under the specified reading, or either company achieves the relevant profitability through underlying earnings without the alleged engineering.
measurement_requirements: Separate net loss, operating loss, cash burn, and adjusted earnings. Identify consolidation boundaries, treatment of financing instruments, and reconciliation of any profitability measure.
source_requirements: Company financial statements or independently verified financial reporting. Zitron's own assertions cannot independently establish the result.
metric_scope:
