  - The threshold may apply separately or collectively.
  - Loss could mean net loss, operating loss, or cash burn.
  - Accounting basis and consolidation boundaries are unspecified.
  - Financial engineering and profitability are undefined.
  - The word only extends beyond what historical financial statements can establish.
