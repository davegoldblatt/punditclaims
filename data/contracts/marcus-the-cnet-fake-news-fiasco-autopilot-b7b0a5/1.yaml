evaluator_interpretation:
  - The ordinary reading concerns reliable, uninterrupted vigilance during prolonged repetitive monitoring. It does not assert that every person fails every short task.
  - The context explicitly invokes accumulated findings from Mackworth's 1948 work through the post. The target period therefore covers that historical research span, with the post date limiting eligible findings.
  - Detection performance and sustained-attention measurements are practical indicators of vigilance, not direct measurements of every instant of conscious attention.
support_condition: Published experiments document lapses or declining vigilance during prolonged monitoring, showing that flawless continuous oversight cannot generally be assumed.
contradiction_condition: Replicated evidence establishes reliably flawless, uninterrupted human monitoring over prolonged periods under the relevant conditions.
measurement_requirements: Use attention lapses, target-detection sensitivity, or performance over time. Distinguish prevention of a performance decline from perfect attention.
