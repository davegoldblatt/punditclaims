explicit_source_elements:
  - These companies cost too much to run
  - their functionality doesn't make enough money to make them make sense
  - OpenAI and Anthropic's costs
  - Perplexity's $50 million+ bill
  - $34 million in revenue
evaluator_interpretation:
  - The nearest referents for 'these companies' are OpenAI, Anthropic and Perplexity. A claim about every generative AI business would be broader.
  - The ordinary measurable core is that realized revenue does not cover company-wide operating expenses, including research and development.
  - Use calendar 2024, the annual period described by the surrounding financial examples and the latest completed annual reporting period before the post.
  - The financial basis is estimate because the context relies on reported private-company financial figures.
  - Current operating losses do not by themselves establish that an investment is irrational or that a business can never become sustainable.
support_condition: Comparable 2024 figures show realized revenue below operating expenses for each of OpenAI, Anthropic and Perplexity.
contradiction_condition: Comparable 2024 figures show that one or more of the named companies covered its operating expenses, defeating the assertion for that company.
measurement_requirements: Compare realized annual revenue with operating expenses for the same company and year. Do not substitute annualized revenue, financing, cash burn or net loss for this comparison.
source_requirements: Financial statements or credible financial reporting that identifies revenue, operating expenses, accounting basis and reporting period.
metric_scope:
  company: OpenAI, Anthropic and Perplexity
  metric: "operating profit or loss: realized revenue less operating expenses"
  currency: USD
  units: millions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
