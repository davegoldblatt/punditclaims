explicit_source_elements:
  - Last week, Bloomberg reported
  - OpenAI was no longer part of the planned expansion
  - (past the initial two (of eight) buildings)
  - already massively delayed from its supposed 'full energization' by mid-2026
evaluator_interpretation:
  - "Part 1: Bloomberg reported in early March 2026 that OpenAI (with Oracle) dropped the planned Abilene expansion."
  - "Part 2: the parenthetical places the dropped expansion beyond the first two of the eight campus buildings, implying OpenAI would not use buildings three to eight."
  - "Part 3: the project was far behind its target of full energization (all eight buildings, 1.2 GW) by mid-2026. I judge this against the campus status from March to the end of June 2026, the date the target refers to."
support_condition: Reporting confirms Bloomberg said OpenAI dropped the expansion, the expansion was the part past the first two buildings, and the campus was well short of full energization by mid-2026.
contradiction_condition: Bloomberg did not report this, or the dropped expansion was something other than what he describes, or the campus was on track for full energization by mid-2026.
measurement_requirements: Reporting on Bloomberg's story; Oracle and Crusoe statements on buildings and megawatts operating in March to June 2026; the original mid-2026 target.
source_requirements: Company statements (Oracle, Crusoe), Epoch AI tracking, reputable news reports of the Bloomberg story.
