assessment_axis: causal_assessment
explicit_source_elements:
  - This master plan only falls apart when
  - doesn’t actually provide the business returns
  - they need to justify its existence
evaluator_interpretation:
  - The surrounding text identifies the plan as durable control over access to AI models through infrastructure and model ownership.
  - "'Only when' makes inadequate business returns a necessary condition for failure. It does not assert that every episode of inadequate returns causes failure."
  - This is a general causal assertion, not a forecast that failure will occur by a particular date.
  - Adequate returns means returns sufficient to sustain the model business, without imposing an unstated profit margin or accounting measure.
support_condition: Observed strategy outcomes and credible causal evidence establish that inadequate model-business returns are necessary for failure, including examination of competing explanations.
contradiction_condition: A documented failure of the described control strategy occurs while its models deliver adequate business returns, with evidence establishing both facts.
measurement_requirements: Define the control strategy and a failure event; identify whose returns matter and measure their sufficiency; distinguish an actual alternative cause from a merely possible one.
source_requirements: Company strategy records, financial evidence, competition decisions, and market outcomes connecting a dated failure to its causes.
