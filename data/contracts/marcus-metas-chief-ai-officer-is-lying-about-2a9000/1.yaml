  - aren’t happy
  - after the fact
  - undermine a hard-won compromise
evaluator_interpretation:
  - The ordinary reading is that multiple executives at large technology companies were publicly opposing or seeking to weaken the newly negotiated agreement.
  - "The target period is December 9–12, 2023: the immediate aftermath of the agreement through the post date."
  - Industry associations can provide context, but their statements do not by themselves establish actions or instructions by individual company executives.
  - Doing their best is treated as emphasis on active effort, not a measurable claim about maximum possible effort.
support_condition: Dated statements, lobbying records or proposed revisions show multiple affected big-tech executives seeking to weaken or overturn the agreement during the target period.
contradiction_condition: Records directly rebut the alleged actions or show that the conduct attributed to the identified executives did not occur. Mere failure to locate opposition is insufficient.
measurement_requirements: Identify the executives, their companies, the dates and the changes or rejection they sought.
source_requirements: Prefer original statements and lobbying records. Distinguish company executives from trade-association staff and opposition before the agreement from opposition afterward.
