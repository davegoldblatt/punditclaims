evaluator_interpretation:
  - "Plain reading: the LLMs of early 2023 (ChatGPT and its peers) did not consistently get world facts and reasoning right. They made frequent factual and reasoning errors, so no one could count on them to be correct about the world."
  - This reading tests the word 'reliably' through behaviour. It does not try to settle the philosophical question of whether LLMs 'understand' anything at all.
  - "Target period: January to March 2023, the state of LLMs when the post appeared. The claim describes an ongoing state, and this is the most recent period the evidence covers."
support_condition: Credible evaluations or developer disclosures from early 2023 show that leading LLMs still hallucinated facts or made reasoning errors often enough that they could not be relied on.
contradiction_condition: Credible evidence from early 2023 shows that leading LLMs were consistently accurate on factual, commonsense and causal reasoning about the world, at a level that could be relied on.
measurement_requirements: Developer disclosures or systematic evaluations of factual and reasoning reliability in early 2023 LLMs.
source_requirements: Primary sources, such as model developers' technical reports or peer-reviewed or preprint evaluations.
