assessment_axis: causal_assessment
explicit_source_elements:
  - vast, vast majority
  - world’s compute revenue
  - I’d wager anywhere from 70% to 90%
  - contingent on venture capital propping the AI labs up
evaluator_interpretation:
  - The surrounding discussion makes AI compute rental revenue the intended denominator, although the sentence itself says all compute revenue.
  - The percentage is an approximate estimate. The firm commitment is that a very large majority depends on continued outside financing of AI labs.
  - Customer revenue share alone does not establish financing dependence. The assessment requires evidence about what spending could continue without additional financing.
  - For the ongoing state at publication, use the second quarter of 2026 as the latest completed reporting quarter. Annual projections are context, not realized quarterly revenue.
  - Venture capital may include strategic private equity investments in the surrounding discussion; debt, customer receipts and existing cash must be identified separately.
support_condition: Comparable worldwide AI compute revenue data and lab financing records establish that roughly 70–90% of revenue depends on continued outside equity financing, after accounting for customer receipts, existing liquidity and replacement demand.
contradiction_condition: Comparable evidence establishes that the dependence is substantially below the claimed range and that a very large majority of revenue can continue without further outside equity financing of the labs.
measurement_requirements: A consistent global denominator; lab-attributed compute revenue without double counting intermediary resales; matching periods; and a defensible estimate of spending lost without further financing.
source_requirements: Provider disclosures, lab financial records and independently attributable analyst models available by 2026-10-28. Repetitions of Zitron's estimates are not independent confirmation.
