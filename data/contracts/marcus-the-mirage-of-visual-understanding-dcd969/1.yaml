evaluator_interpretation:
  - Read 'this stuff' as the model versions evaluated in the cited study, rather than every AI system.
  - The ordinary reading of AGI is general, human-level competence across a broad range of intellectual tasks, including visual understanding. It does not require flawless performance.
  - "Use March 1–29, 2026 as the reporting window for this ongoing-state observation: the post discusses current models through a newly released March study."
  - A visual failure can inform the assessment, but treating any such failure as automatically disqualifying would add a threshold Marcus did not state.
support_condition: Evaluations of the studied model versions establish substantial shortfalls from broad human-level competence, with a defensible connection between the measured limitations and the ordinary AGI criterion.
contradiction_condition: Evaluations establish that the studied model versions possess broad human-level competence under the same criterion, despite occasional errors.
measurement_requirements: Identify the model versions and evaluation conditions; use human comparisons across sufficiently broad tasks or demonstrate a clearly necessary capability deficit. Benchmark names and isolated failures are insufficient by themselves.
source_requirements: Primary evaluations with disclosed methods and results available by 2026-10-28. Definitions and evaluations of other model versions are context only.
