assessment_axis: forecast_outcome
explicit_source_elements:
  - large language models would not get us to AGI
  - we needed a new paradigm
evaluator_interpretation:
  - The plain reading is that extending the LLM approach cannot deliver broadly human-level general intelligence; a fundamental change in approach is necessary.
  - AGI means broadly human-level ability to learn and perform across diverse intellectual tasks, including unfamiliar tasks. Marcus supplies no specific test or numerical threshold.
  - The relevant LLM approach is the approach discussed in the 2022 argument and reaffirmed in this 2023 post. Scaling, prompting, or fine-tuning alone would not constitute a new paradigm. Whether added reasoning mechanisms, memory, tools, or architectural changes constitute a new paradigm requires explicit technical assessment.
  - An LLM-based system is a potential counterexample only if its general capabilities do not depend on a fundamental change beyond that approach. Merely containing an LLM is insufficient.
  - This is an indefinite forecast, not an observation that AGI had not yet arrived. Success through another paradigm would not establish that the change was necessary.
support_condition: Compelling, independently scrutinized evidence establishes an inherent limitation of the relevant LLM approach that prevents a capability necessary for AGI, and establishes why overcoming it requires a fundamental change of paradigm. Failure of existing models, or AGI achieved through another approach, is insufficient by itself.
contradiction_condition: A publicly demonstrated system achieves broadly human-level general intelligence, with credible independent evaluations across diverse and unfamiliar tasks, and sufficient technical evidence establishes that it achieves this within the relevant LLM paradigm without a necessary fundamental change of approach.
measurement_requirements: Evaluate breadth, learning, transfer to unfamiliar tasks, and dependable performance against human baselines. Individual benchmark scores and declarations of AGI are insufficient. Evaluate the architecture and contribution of added components separately.
source_requirements: Primary technical disclosures and independent evaluations with inspectable methods. A claimed inherent limitation must apply to the relevant class of systems, not merely particular models or restrictive assumptions. Broad expert acceptance would strengthen an assessment but cannot replace demonstrated capabilities and architectural evidence.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve upon a dated, independently substantiated AGI demonstration meeting the contradiction condition, or a dated, independently scrutinized finding establishing the necessity described in the support condition. Neither elapsed time nor another paradigm's success alone qualifies.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AGI has no definition or performance threshold in the quoted claim.
  - The boundary between an extension of LLMs and a new paradigm is unspecified.
  - Would not get us to could refer to LLMs alone or to systems whose principal mechanism remains an LLM.
  - The forecast has no deadline.
  - The claim recounts a 2022 argument and reaffirms it in November 2023.
retrospective_or_prospective: retrospective
