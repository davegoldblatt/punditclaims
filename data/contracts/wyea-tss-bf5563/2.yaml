assessment_axis: historical_observation
explicit_source_elements:
  - An AI tool
  - merely guesses
  - what code looks right
  - given the prompt it was provided
evaluator_interpretation:
  - In context, this concerns the code-generating model in assistants such as GitHub Copilot, contrasted with a programmer examining what code does.
  - The plain reading is that the generator produces plausible code without substantively understanding or checking whether it solves the problem securely. It does not mean random guessing or that generated code can never work.
  - "A bundled scanner does not contradict this claim. Nor does probabilistic generation alone establish the word 'merely': prediction and useful analysis of program behavior are not necessarily incompatible."
  - For this undated ongoing observation, use April–June 2024, the latest completed calendar quarter immediately before publication. Earlier research is background unless it establishes the behavior of tools during that period.
support_condition: Evidence about the relevant generators establishes that their behavior is limited to surface plausibility, without substantive analysis of program behavior or correctness. Documentation of prediction and examples of errors alone establish only narrower parts of the claim.
contradiction_condition: Reproducible evaluations of the relevant generators demonstrate substantive analysis of program behavior, such as tracing execution or identifying and explaining defects on unfamiliar examples. The capability must come from the model itself; a separate scanner or occasional correct completion is insufficient.
measurement_requirements: Identify model versions, evaluation dates, prompts, contamination controls and access to external tools. Distinguish generating plausible code, producing working code, analyzing behavior and independently verifying correctness.
source_requirements: Primary technical descriptions and reproducible evaluations of tools available during the target period. Later publications may describe that period, but later model capabilities cannot settle it.
