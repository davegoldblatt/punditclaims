assessment_axis: historical_observation
explicit_source_elements:
  - its enterprise customers are profitable, but I call bullshit
  - multiple enterprise customers
  - they can burn $2 or $3 for every $1 of subscription
evaluator_interpretation:
  - The ordinary reading challenges the profitability of Cursor's enterprise customer business and offers some heavy users as evidence.
  - Profitability is read as subscription receipts less attributable service costs, consistent with the token-cost argument, rather than company-wide net income.
  - The ratio is read as actual cost to Cursor per subscription dollar. Retail API-equivalent usage is a different measure.
  - Because the statement describes ongoing economics without a reporting period, the latest completed calendar quarter before publication, October–December 2025, is used as a reporting proxy. This is an evaluator choice, not a period supplied by Zitron.
  - The accounting basis is estimate because the claimed ratios rely on customer reports rather than Cursor's financial statements.
  - Losses on selected users do not by themselves establish losses for their enterprise contracts or the enterprise cohort.
support_condition: Matching enterprise records show negative aggregate service contribution and document some enterprise customers whose actual attributable service costs reach two to three dollars per subscription dollar.
contradiction_condition: Matching-period enterprise accounts establish positive aggregate service contribution, contradicting the cohort claim; documented customer-level costs can separately test the stated ratios. Evidence about only one component does not automatically settle both.
measurement_requirements: Enterprise-only subscription receipts, overage revenue, negotiated supplier charges and attributable serving costs for the same period. Distinguish individual seats, pooled contracts and the enterprise cohort.
source_requirements: Prefer enterprise financial disclosures or documented customer usage reconciled to Cursor's actual supplier costs. Anonymous usage reports require corroboration.
