  - Burn may mean retail API-equivalent usage rather than actual supplier cost.
  - Enterprise customers may mean individual seats, contracts or the whole customer cohort.
  - Profitable does not specify cost allocation.
  - Can burn describes possible usage, not necessarily realized usage.
