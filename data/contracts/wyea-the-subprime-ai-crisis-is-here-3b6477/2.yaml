explicit_source_elements:
  - Cursor also claims in the same article that its enterprise customers are profitable
  - I call bullshit
  - multiple enterprise customers
  - can burn $2 or $3 for every $1 of subscription
evaluator_interpretation:
  - "Plain reading: he denies Cursor's claim that its enterprise customers are profitable for Cursor. That means serving them costs Cursor more than they pay."
  - His evidence describes what some customers 'can' burn. Showing that some customers can exceed what they pay would not alone prove the enterprise book is unprofitable. Showing the book is profitable overall would rebut his denial.
  - He names no period. The claim describes the state at the post date, so the target period is Q1 2026 (January to March 2026), the latest quarter public reporting could describe at the post date.
support_condition: A credible disclosure or report that Cursor's enterprise accounts, taken together, ran at negative gross margin in early 2026, or that usage costs exceeded subscription revenue across them.
contradiction_condition: A credible disclosure or report that Cursor's enterprise accounts ran at positive gross margin in Q1 2026.
measurement_requirements: Gross margin or cost-versus-revenue for Cursor's enterprise customers as a group, for Q1 2026.
source_requirements: Cursor or acquirer filings, or reputable reporting with named or multiple sources.
metric_scope:
  company: Cursor (Anysphere)
  metric: Profitability (gross margin) of enterprise customer accounts
  currency: USD
  units: ratio of usage cost to subscription revenue
