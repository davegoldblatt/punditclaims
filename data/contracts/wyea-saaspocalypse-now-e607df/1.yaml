evaluator_interpretation:
  - The proposition being assessed is the absence of observable cloud-provider revenue growth from customer AI integrations, beyond the stated exceptions.
  - OpenAI's revenue and loss figures are embedded exceptions, not separate claims being graded here. No annualized figure is treated as realized annual revenue.
  - The ordinary reading includes revenue from cloud AI services through which organizations build applications and integrate models.
  - The OpenAI exception concerns OpenAI's own stated revenue; it does not exclude Microsoft's Azure AI services simply because some use OpenAI models.
  - The target is April–June 2024, the latest completed quarter publicly reportable before the post.
  - Microsoft Azure is an in-scope test of the general negative assertion. The metric scope records that counterexample and the company's reported attribution, without imposing a dollar threshold.
support_condition: Adequately comprehensive disclosures show no realized AI-services contribution to cloud revenue growth outside the stated exceptions during the target period.
contradiction_condition: An in-scope cloud provider publicly reports a positive realized revenue-growth contribution from AI services used for customer applications or integrations during the target period.
measurement_requirements: Use realized quarterly revenue growth or its attributable contribution. Do not substitute bookings, financing, annualized run rates or profitability.
source_requirements: Prefer the provider's earnings disclosures and supporting descriptions of customer use.
