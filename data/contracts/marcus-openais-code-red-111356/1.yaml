explicit_source_elements:
  - they are burning
  - billions of dollars
  - of month
evaluator_interpretation:
  - Read 'of month' as the evident typo 'a month'.
  - In the surrounding discussion of a war chest and runway, burning means net cash consumption, not gross spending or accounting losses.
  - Read plural billions as at least $2 billion per month on average.
  - Use July through September 2025, the latest completed calendar quarter that could ordinarily have been reported before the post. This period is selected from the ongoing-state wording, not from the availability of a favorable number.
  - The claim cites no financial source or accounting basis, so the contract basis is unknown.
support_condition: Comparable cash-flow records show at least $6 billion of net cash burn during July–September 2025, equivalent to at least $2 billion per month.
contradiction_condition: Comparable cash-flow records show less than $6 billion of net cash burn during that quarter. A different period's average or an accounting loss is insufficient.
measurement_requirements: Net cash burn before financing, with a clear definition and quarter coverage. Exclude noncash charges and do not treat financing receipts as revenue.
source_requirements: Prefer company cash-flow records; otherwise use reputable reporting of those records and label its basis. An unknown contract basis prevents supported or contradicted scoring.
