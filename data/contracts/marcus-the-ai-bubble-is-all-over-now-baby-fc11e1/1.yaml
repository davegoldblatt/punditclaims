assessment_axis: historical_observation
explicit_source_elements:
  - have at last become widely recognized
  - not just as the transitory “bugs”
  - inherent limitations
  - flow from the very design of LLMs
evaluator_interpretation:
  - The ordinary reading is broad recognition among informed researchers and industry participants that important reliability problems arise from how LLMs work, rather than being isolated implementation defects.
  - Widely recognized does not require unanimity, but a few selected statements cannot establish it.
  - The claim also implies a recent change in recognition. That requires comparison with earlier views.
  - Use the 2025 prepublication research and industry-discussion period because no narrower period or regular reporting cadence is named.
  - The surrounding rhetoric does not by itself establish that inherent means impossible to mitigate under every possible system design.
support_condition: Representative surveys or a broad, systematically assembled record show widespread acceptance of design-based limitations by publication, with evidence that such recognition had recently expanded.
contradiction_condition: Comparable evidence shows that design-based explanations remained a minority view, or that the claimed broad recognition was already established well before the period described as new.
measurement_requirements: Measure agreement about inherent limitations separately from awareness of errors, distrust of AI, and beliefs about intelligence. Include a historical comparison.
source_requirements: Representative research or industry surveys, supplemented by primary technical work and dated industry statements.
