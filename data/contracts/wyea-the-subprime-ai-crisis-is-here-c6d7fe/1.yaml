assessment_axis: forecast_outcome
explicit_source_elements:
  - Any further price increases or service degradations
  - Anthropic and OpenAI
  - a sign that they’re running low on cash
evaluator_interpretation:
  - A subsequent price increase or material reduction in included service at either company triggers examination of that company's liquidity.
  - Read 'running low on cash' as insufficient or substantially strained available liquidity relative to near-term obligations and cash consumption.
  - Losses, fundraising and compute shortages alone do not establish a cash shortage.
  - The speaker supplies neither a liquidity threshold nor an accounting basis. No numerical runway cutoff is added.
  - The claim has no deadline and concerns the diagnostic meaning of future changes.
support_condition: After a qualifying change, contemporaneous financial records establish strained liquidity and credible evidence connects the change to that shortage. Supporting one instance does not establish that every future change has this meaning.
contradiction_condition: A qualifying change occurs while contemporaneous records establish adequate liquidity, and reliable evidence shows an independent explanation inconsistent with the asserted cash-shortage signal.
measurement_requirements: Compare dated prices or service entitlements before and after the change. Match unrestricted cash, liquid investments, cash consumption, committed funding and near-term obligations to the affected company and event date.
source_requirements: Official change notices and contemporaneous financial statements or documented internal records. Distinguish completed funding from commitments and cash consumption from accounting losses.
metric_scope:
  company: Anthropic or OpenAI, assessed separately
  metric: Available cash and liquidity relative to near-term obligations
  currency: null
