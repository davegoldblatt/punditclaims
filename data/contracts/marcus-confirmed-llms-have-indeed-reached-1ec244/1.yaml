evaluator_interpretation:
  - The plain contextual reading is that alternative AI approaches received a small share of investment compared with LLM approaches, especially in the United States.
  - The adjacent references to trustworthy AI and US policy suggest alternatives to relying on LLM scaling, rather than every application outside language generation.
  - For the ongoing, unperiodized investment comparison, use calendar 2023 as the latest complete annual investment reporting period available before the post. This does not establish the position during all of 2024.
  - No numerical meaning of 'precious little' is supplied, so no arbitrary percentage cutoff is imposed.
support_condition: Comparable investment records show that alternative approaches received only a small share relative to LLM approaches under a consistent classification.
contradiction_condition: Comparable records show a substantial share directed to alternative approaches, under the same geographic and investment coverage.
measurement_requirements: Classify funding by technical approach, geography, and period; distinguish investment commitments, actual spending, private financing, and public research funding. Do not equate non-generative AI automatically with non-LLM research.
source_requirements: Primary investment datasets and public funding records with transparent categories and comparable coverage.
