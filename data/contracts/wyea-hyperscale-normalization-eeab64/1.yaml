explicit_source_elements:
  - When this ends
  - so many people will ask how it happened
  - why nobody stopped it
  - They’ll crave a bailout, even if they hate the companies
evaluator_interpretation:
  - The antecedent is the collapse of the AI investment boom discussed in the post, centered on hyperscalers and NVIDIA.
  - Many people means broad public sentiment, rather than isolated comments by investors or executives.
  - Wanting a bailout does not require a bailout actually to occur.
  - A decline confined to one country's stocks does not by itself establish that the boom described in the post has ended.
support_condition: After a documented collapse of the relevant AI boom, representative polling or broad, independently documented public responses show both widespread questions about its causes and substantial demand to rescue affected AI companies.
contradiction_condition: After that collapse, representative evidence covering the public response shows broad rejection of rescuing affected companies, including among people concerned about the collapse. Silence alone is insufficient.
measurement_requirements: Establish the collapse separately from the subsequent response. Distinguish public bailout preferences from corporate lobbying, existing subsidies, and commentary predicting a future bailout.
source_requirements: Dated market and business records for the antecedent; representative polling and independently documented public responses for the outcome.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a documented collapse of the boom described in the post and decisive evidence of the ensuing public response. Neither an isolated market decline nor pre-collapse bailout discussion qualifies.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No definition of when the bubble has ended.
  - No geographical population or numerical threshold for many people.
  - No deadline or duration for the ensuing response.
  - Private desires are observable only through imperfect proxies.
