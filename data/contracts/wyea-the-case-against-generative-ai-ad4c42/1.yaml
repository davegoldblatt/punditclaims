assessment_axis: historical_observation
explicit_source_elements:
  - Outside of these two
  - AI startups are floundering
  - struggling to stay alive
  - raising money in several-hundred million dollar bursts
  - negative-gross-margin businesses
evaluator_interpretation:
  - The population is generative AI software startups other than OpenAI and Anthropic, following the surrounding software discussion.
  - This is a broad characterization of the population, not a claim established by selecting a few distressed companies.
  - Use April through June 2025, the latest completed calendar quarter ordinarily reportable before publication, for the ongoing margin and financial condition.
  - Negative gross margin means delivery costs exceed revenue. Following the surrounding discussion, delivery costs include serving free users.
  - Floundering and struggling to stay alive require evidence of financial distress or inadequate runway. A large financing round alone does not establish distress.
  - The contextual margin examples cite press reporting, so the accounting basis is treated as estimate rather than GAAP.
support_condition: Representative, consistently measured accounts show negative gross margins and financial distress across the stated startup population, with funding disclosures corroborating the described financing pattern.
contradiction_condition: Representative evidence shows the population generally has positive gross margins and adequate financial health. Isolated positive or negative examples alone do not settle this broad characterization.
measurement_requirements: Revenue, delivery costs including free-user costs, gross margins, cash runway, and funding terms for a representative startup sample. Keep gross margins separate from net losses.
source_requirements: Prefer company accounts and financing disclosures. Press estimates require disclosed periods and cost definitions; founder statements alone cannot establish population-wide results.
