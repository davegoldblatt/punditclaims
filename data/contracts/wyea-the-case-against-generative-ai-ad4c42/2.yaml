assessment_axis: historical_observation
explicit_source_elements:
  - Outside of these two [OpenAI and Anthropic]
  - AI startups are floundering, struggling to stay alive
  - raising money in several-hundred million dollar bursts
  - negative-gross-margin businesses
evaluator_interpretation:
  - This is a generalisation about AI startups as a group, other than OpenAI and Anthropic. It is not a claim that every startup has negative margins.
  - "The claim has three parts: (a) the startups raise money in rounds of several hundred million dollars; (b) their businesses have negative gross margins; (c) they are floundering and struggling to stay alive."
  - "Target period: July 1 to September 29, 2025. His examples in the surrounding text refer to July and September 2025."
  - Margins that include the cost of free users fit his framing.
support_condition: Reports from the period show typical AI startups raising rounds of several hundred million dollars, with negative gross margins and signs of distress such as forced sales, shutdowns or emergency raises.
contradiction_condition: Reports from the period show leading AI startups with positive margins or profits, rising valuations and fast revenue growth rather than struggles to survive.
measurement_requirements: Funding rounds, reported gross margins and profitability of AI startups other than OpenAI and Anthropic, July to September 2025.
source_requirements: Company announcements or reputable news reports. Private-company margins are mostly leaked or self-reported.
metric_scope:
  company: AI startups excluding OpenAI and Anthropic
  metric: gross margin
  currency: USD
  units: percent
  accounting_basis: estimate
