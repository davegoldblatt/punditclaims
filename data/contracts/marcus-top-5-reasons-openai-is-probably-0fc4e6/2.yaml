  - A billion dollars in revenue is not a billion dollars in profit
evaluator_interpretation:
  - The ordinary reading is that OpenAI was not generating company-wide profits around the publication date. This does not predict that it would never become profitable.
  - The surrounding discussion identifies the current year, 2023. Use 2023 through the September 27 publication date as the observation window, giving greatest weight to evidence describing profitability near publication. Do not make April–June results alone determinative or require every month to show a loss.
  - Profit means the company's overall financial result after costs, rather than revenue, product gross margin, financing proceeds, or valuation.
  - The press attribution in the supplied context concerns valuation and revenue. Marcus supplies no accounting basis for the separate profitability assertion, so its accounting_basis is unknown. Assigning a particular basis from subsequently found evidence would add a commitment he did not make.
support_condition: Reliable evidence establishes that OpenAI was not generating company-wide profits around September 2023. Under the required money-claim rules, a supported score additionally requires a specified accounting basis matching the decisive evidence.
contradiction_condition: Reliable evidence establishes positive company-wide profit around September 2023 on the same accounting basis. Revenue growth, financing, or a profitable product alone would not contradict the claim.
measurement_requirements: An explicit statement about company-wide profitability or financial results covering the relevant state. Numerical results must identify the accounting basis and reporting period; operating income, net income, and cash flow cannot be substituted for one another.
source_requirements: Prefer company financial records or statements. Reputable reporting of an identified executive's statement is relevant when directly accessible company records are unavailable.
