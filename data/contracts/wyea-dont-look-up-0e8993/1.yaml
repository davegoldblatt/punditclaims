early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - ‘Able to pay’ may describe financial ability or the delivery of services that generates contractual payments.
  - ‘All this money’ does not identify a precise set of contracts or delivery schedule.
  - The claim does not distinguish unfinished capacity already funded from capacity requiring additional investment.
