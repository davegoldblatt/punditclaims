explicit_source_elements:
  - for them to even be able to pay hyperscalers
  - capex investment must continue
  - the capacity necessary to make all this money doesn’t currently exist
evaluator_interpretation:
  - The claim concerns the infrastructure and contractual position at publication on 2026-08-11.
  - In context, the plain reading is that delivering the compute behind the contemplated contract payments requires additional capacity and further capital investment. It does not mean that neither lab can make any payment today.
  - "Showing planned expansion alone is insufficient to establish necessity: the evidence must connect further spending to capacity required for the relevant commitments."
  - This assessment concerns physical capacity and its causal dependence on investment, rather than a specified financial amount. Metric scope is therefore null.
support_condition: Evidence connects OpenAI and Anthropic's contracted compute requirements to capacity unavailable at publication and shows that fulfilling those requirements depends on further capital spending.
contradiction_condition: Evidence establishes that existing operational capacity, or capacity already fully funded without further investment, can fulfill the relevant compute commitments.
measurement_requirements: Compare contracted compute requirements and delivery schedules with usable capacity, capacity already funded, and remaining construction or equipment expenditure. Distinguish payments for delivered services from prepayments and other contractual obligations.
source_requirements: Prefer contract disclosures, filings, capacity inventories, and company descriptions of construction and deployment requirements. General demand or spending forecasts provide only partial support.
