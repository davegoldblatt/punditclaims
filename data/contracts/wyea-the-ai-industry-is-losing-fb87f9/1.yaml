assessment_axis: forecast_outcome
explicit_source_elements:
  - Microsoft, Google, Amazon and Meta
  - stop spending $30 billion or more a quarter
  - GPUs, RAM, storage, and data center construction
  - tear a hole
  - permanent supercycle
evaluator_interpretation:
  - The ordinary reading is a deliberate retreat by the four named companies from quarterly infrastructure spending of at least $30 billion each.
  - The collective-spending reading is also possible and must be retained as an ambiguity.
  - The consequence means a substantial, sustained contraction in semiconductor and related supplier demand and sales caused by the spending retreat.
  - A delivery delay, accounting reclassification, or isolated stock-market decline does not by itself establish either the condition or the consequence.
support_condition: The specified spending retreat occurs, followed by a substantial contraction in relevant supplier demand and sales attributable to it.
contradiction_condition: The spending retreat occurs and its completed effects are absorbed without substantial contraction in relevant supplier demand and sales.
measurement_requirements: Consistent quarterly spending data for the specified infrastructure categories, evidence of deliberate cuts, and subsequent supplier orders, shipments and realized revenues. Distinguish cash purchases from lease commencements and total corporate capex from the named categories.
source_requirements: Company filings and management announcements for the condition; supplier filings and independent industry measurements for the consequence.
