explicit_source_elements:
  - after just over a year of hype
  - generative AI is yet to prove
  - anything substantially different
  - other than helping tech company CEOs raise money and create headlines
evaluator_interpretation:
  - The ordinary practical reading is that generative AI had demonstrated no materially useful capability beyond fundraising and publicity.
  - I treat independently measured improvements in producing useful work as materially different practical capabilities; I do not require invention of an activity humans had never performed.
  - This is a cumulative claim about what had been demonstrated by publication. The target period therefore has an open beginning and ends on 2024-04-04.
  - The historical statements that AI and these model families were not new are background, not claims that the cited studies could refute.
support_condition: Evidence available by the post establishes that purported practical capabilities had not produced material, demonstrated benefits beyond promotion and fundraising.
contradiction_condition: At least one credible demonstration public by 2024-04-04 establishes a materially useful generative-AI capability beyond promotion or fundraising.
measurement_requirements: Use demonstrated task performance or real deployment outcomes, not promises, fundraising, or benchmarks detached from the claimed practical capability.
source_requirements: Pre-post primary research or documented deployments with measured results. Later demonstrations cannot contradict this historical claim.
