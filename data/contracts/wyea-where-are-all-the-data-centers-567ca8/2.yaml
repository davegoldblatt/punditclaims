  - its so-called 2GW of capacity
  - in the last six months
  - a little under six times that capacity
evaluator_interpretation:
  - This is an arithmetic implication using Microsoft's reported approximately 2GW as a hypothetical numerator and Zitron's preceding 342MW estimate as the denominator.
  - "The six months refer to the two earnings quarters discussed in context: October 2025 through March 2026."
  - Neither actual delivery of 2GW nor independent validation of 342MW is a prerequisite for checking the stated conditional ratio.
  - The surrounding rejection of Microsoft's credibility is not itself a measurable numerical commitment in this sentence.
support_condition: Microsoft's two cited quarterly disclosures supply an approximately 2GW premise, and 2,000MW divided by the stated 342MW benchmark is slightly below six.
contradiction_condition: The cited disclosures materially misstate the hypothetical numerator, or the ratio of the stated premises is not slightly below six.
measurement_requirements: Verify the reported premise, convert gigawatts to megawatts, and divide by 342. Treat 342MW as a stipulated input, not an independently established operating total.
source_requirements: Microsoft's earnings transcripts establish what Microsoft reported. The ratio is a transparent calculation using those disclosures and the benchmark supplied in the claim.
