assessment_axis: historical_observation
explicit_source_elements:
  - Every AI startup
  - loses millions or billions of dollars a year
  - nobody appears to have worked out a way to stop hemorrhaging cash
evaluator_interpretation:
  - Read “every” literally, including AI application startups as well as foundation-model developers.
  - Read annual losses as company-wide annual net losses; assess cash consumption separately because it is not the same measure.
  - Use calendar 2025, the latest completed calendar year before the post, as the common annual comparison period. Differing fiscal years require explicit reconciliation.
  - Treat “millions” as losses of at least $2 million for a numerical test; a profitable or break-even startup is a counterexample under any ordinary reading of that threshold.
  - No cited accounting convention accompanies this assertion. Its accounting basis remains unknown.
support_condition: Comparable annual accounts establish losses of at least millions of dollars for every qualifying startup in the target population, with separate evidence for continuing cash consumption.
contradiction_condition: One qualifying startup has a profitable or break-even target year, or an annual loss demonstrably below the claimed magnitude, on a compatible accounting basis.
measurement_requirements: Full-year net income or loss, reporting dates, accounting basis and startup classification. Cash-flow evidence must identify operating cash flow or free cash flow rather than substitute for net income.
source_requirements: Prefer financial statements and company financial disclosures. General profitability announcements are relevant counterevidence but require clarification of period and measure.
