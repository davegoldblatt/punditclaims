  - it wasn’t about common sense at all
  - All good guesses, all wrong
evaluator_interpretation:
  - The claim concerns the cause of original Imagen’s May 2022 failures on the horse-riding-astronaut prompt.
  - In context, “common sense” means a plausibility judgment or learned expectation that makes the model favor ordinary riding arrangements.
  - Successful rewording can rule out an absolute inability or unconditional refusal. It does not by itself rule out a contributing plausibility preference.
  - The categorical phrase “at all” requires stronger evidence than showing that wording affects the result.
support_condition: Controlled comparisons or model interventions show that plausibility-based judgment did not cause the original failure, while identifying a sufficient alternative mechanism.
contradiction_condition: Controlled evidence shows that a plausibility-based judgment or expectation causally contributed to the role reversal.
measurement_requirements: Compare equivalent prompt variants and plausible versus implausible scenes over repeated samples. Separate effects of wording, scene familiarity and plausibility; use model interventions where feasible.
source_requirements: Primary original-model experiments or causal analyses. A successful demonstration is relevant but insufficient to identify the complete cause.
