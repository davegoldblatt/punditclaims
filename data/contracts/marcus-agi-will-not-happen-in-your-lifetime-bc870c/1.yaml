explicit_source_elements:
  - Already we have seen minor abuses
  - plagiarism, for example
  - will never be the same
evaluator_interpretation:
  - The historical assertion is that actual ChatGPT misuse, including submitting generated writing as one's own, had occurred by publication.
  - I use the period from ChatGPT's late-2022 introduction through the post, rather than a later academic term.
  - In this context, 'plagiarism' includes academic misrepresentation using generated work.
  - "'Will never be the same' expresses a qualitative change in how cheating is performed and addressed. A literal claim about all future time is not separately measurable."
support_condition: A credible, dated account documents actual ChatGPT misuse before the post, including academic misrepresentation; contemporaneous evidence shows a practical change in cheating or its handling.
contradiction_condition: Credible records establish that the alleged pre-publication examples were mistaken or occurred later, and adequately comprehensive evidence refutes the claimed occurrence.
measurement_requirements: Distinguish actual incidents from demonstrations or fears. An admission or other corroboration should support an academic-misuse finding rather than relying only on a detector score.
source_requirements: Institutional records, firsthand testimony, or reputable reporting with identified participants and dates.
