assessment_axis: forecast_outcome
explicit_source_elements:
  - neither OpenAI nor Anthropic have a future
  - their revenues are only made possible through venture subsidies for startups using their models
  - the experimental revenue of Business Idiots
evaluator_interpretation:
  - The ordinary reading is that both companies lack viable businesses and will ultimately fail. A successful acquisition alone would not establish business failure.
  - The revenue clause asserts an exclusive dependency on subsidized startup customers and experimental enterprise spending. Customer concentration alone cannot establish that dependency.
  - The survival forecast has no deadline. I do not import the preceding sentence's condition about venture capital drying up.
  - For the present-tense revenue component, I use January–March 2026, the latest completed calendar quarter before publication. The wording supplies no revenue accounting basis.
support_condition: Both companies permanently cease viable operations through business failure, and customer-level evidence establishes the asserted revenue dependency. Failure alone would not prove why customers previously bought their products.
contradiction_condition: Documented revenue independent of both asserted funding categories would refute the exclusive dependency component. Continued operation for a finite period cannot conclusively refute the undated survival forecast.
measurement_requirements: Distinguish business failure from restructuring or acquisition. Trace realized customer payments, customer funding sources, and production versus experimental use. Do not substitute financing, annualized revenue, or customer concentration for those measurements.
source_requirements: Court records, closure announcements, filings, and customer financial or procurement records. Customer-use announcements alone cannot establish the absence of subsidies.
