assessment_axis: forecast_outcome
explicit_source_elements:
  - startups
  - burning 10% or more of their headcount in AI tokens
  - will have a tough time convincing investors
  - in six months
  - that doing so is necessary
evaluator_interpretation:
  - Headcount is read as spending on employees, rather than a literal number of people. The threshold is AI token spending of at least 10% of payroll-equivalent costs over the same period.
  - I also think introduces the forecast; it is not a separate condition.
  - A tough time means documented investor objections, demands for justification, spending restrictions, or funding decisions specifically connected to the token budget.
  - The claim predicts a pattern among qualifying startups, not that every startup must lose funding.
  - Six months after April 28 is October 28, 2026. Evidence must address circumstances at that horizon, rather than only an earlier temporary dispute.
support_condition: Evidence identifies qualifying startups and shows a meaningful pattern of investor resistance to the necessity of their token spending around October 28, 2026.
contradiction_condition: Evidence from a reasonably representative set of qualifying startups shows investors readily accepting the necessity of that spending around the deadline, without material resistance.
measurement_requirements: Token spending and payroll-equivalent costs must cover the same startup and period. Separate internal employee tools from customer-serving inference and identify whether compensation includes benefits, equity, and contractors.
source_requirements: Startup spending disclosures or reliable reporting paired with attributable investor statements, board restrictions, or documented fundraising discussions.
