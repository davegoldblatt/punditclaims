assessment_axis: forecast_outcome
explicit_source_elements:
  - Hyperscalers
  - by the end of the year
  - have sunk over $1.5 trillion
  - in capital expenditures and equity investments
  - into Large Language Models
  - that have yet to provide good enough revenues to actually disclose
evaluator_interpretation:
  - "'The end of the year' means December 31, 2026."
  - "The forecast is the spending threshold: cumulative hyperscaler capex plus equity investments in AI labs exceeding $1.5 trillion by year-end. Read plainly, this counts AI-era capex (about 2023 onward) by the large cloud and platform companies (Microsoft, Alphabet, Amazon, Meta, and plausibly Oracle), plus their stakes in OpenAI, Anthropic and similar labs."
  - "The revenue clause describes the state when he wrote. It is checked as of the post date: had hyperscalers disclosed separate LLM revenue in their financial reports? It is not treated as a forecast that disclosure would never come before year-end."
  - Capex is counted as reported, not split into LLM and non-LLM shares, since the companies do not report such a split.
support_condition: Reported figures through December 31, 2026 show cumulative hyperscaler capex plus AI-lab equity investments above $1.5 trillion, and the companies had not separately disclosed realized LLM revenue as of the post.
contradiction_condition: Cumulative capex plus AI equity investments through 2026 fall short of $1.5 trillion, or hyperscalers were already disclosing realized LLM revenue in their reports when he wrote.
measurement_requirements: Sum of reported capital expenditures (calendar 2023–2026) and disclosed equity investments in AI labs for the main hyperscalers, from 10-K/10-Q filings.
source_requirements: Company filings and earnings releases. Q4 2026 results are only published in early 2027.
metric_scope:
  company: Hyperscalers (Microsoft, Alphabet, Amazon, Meta; plausibly Oracle)
  metric: Cumulative capital expenditures plus equity investments in AI/LLM companies
  currency: USD
  units: trillions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: null
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: by the end of the year
horizon_interval:
  start: 2026-07-28
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Supported early if filings published before year-end already show cumulative capex plus AI equity investments above $1.5 trillion on a defensible start date. Not contradicted early, because the spending can still accumulate until December 31.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Start date of the cumulative total is not stated.
  - Which companies count as hyperscalers.
  - How much capex counts as 'into Large Language Models'.
  - Whether the revenue clause is a forecast or a description of the present.
retrospective_or_prospective: prospective
