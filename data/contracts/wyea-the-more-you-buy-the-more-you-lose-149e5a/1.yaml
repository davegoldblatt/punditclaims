  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An early investment total can establish only the spending component. The complete claim can be contradicted early by an unambiguous, matching realized AI revenue disclosure, provided its scope and accounting basis are established.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No accumulation start date
  - Hyperscaler roster unspecified
  - LLM share of general infrastructure spending unspecified
  - Accounting basis and lease treatment unspecified
  - Revenue clause could concern own AI products, infrastructure sales, or both
  - "'Good enough' supplies no financial threshold"
  - Disclosure clause may describe the post date rather than the forecast deadline
retrospective_or_prospective: prospective
