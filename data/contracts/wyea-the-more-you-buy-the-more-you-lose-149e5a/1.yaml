assessment_axis: forecast_outcome
explicit_source_elements:
  - Hyperscalers
  - by the end of the year
  - over $1.5 trillion
  - capital expenditures and equity investments
  - into Large Language Models
  - have yet to provide good enough revenues to actually disclose
evaluator_interpretation:
  - The deadline is December 31, 2026. 'Have sunk' means cumulative investment actually made, rather than announced future commitments.
  - The surrounding discussion identifies Microsoft, Alphabet, Amazon and Meta. Inclusion of other hyperscalers is unspecified.
  - Only spending attributable to LLMs counts. Total corporate capital expenditure cannot automatically be treated as LLM investment.
  - The surrounding discussion makes separately disclosed realized AI revenue the ordinary test of the disclosure clause. An annualized run rate is a different measure.
  - The words do not establish that nondisclosure is caused by inadequate revenue. That explanation requires evidence beyond the absence of a disclosure.
support_condition: By December 31, 2026, a reconciled, nonduplicative total of realized LLM capital expenditure and equity investment exceeds $1.5 trillion for the relevant companies, and the claimed absence of separately disclosed realized AI revenue holds.
contradiction_condition: A complete, comparable year-end accounting establishes cumulative investment of $1.5 trillion or less, or a clearly matching realized AI revenue disclosure falsifies the nondisclosure clause. Neither ordinary cloud revenue nor an annualized run rate alone settles the latter.
measurement_requirements: Specify the company roster, accumulation start, accounting basis, treatment of leases and equity investments, and allocation of shared infrastructure to LLMs. Exclude unspent commitments and avoid double counting.
source_requirements: Company filings and investment disclosures, with a documented reconciliation of LLM-attributable spending and separately reported AI revenue.
metric_scope:
  company: Hyperscalers; Microsoft, Alphabet, Amazon and Meta identified in context
  metric: Cumulative capital expenditures plus equity investments attributable to LLMs
  currency: USD
  units: trillions
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: null
  period_end: 2026-12-31
  stock_or_flow: flow
