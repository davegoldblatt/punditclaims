assessment_axis: historical_observation
explicit_source_elements:
  - the crash (no longer a mere fizzle)
  - is happening faster than the dot com debacle
  - AI stocks have lost over 50% in 5 months
evaluator_interpretation:
  - The plain reading is that AI stocks have suffered comparable percentage declines in less time than technology stocks during the dot-com crash.
  - The title supplies an approximate five-month observation window ending on the post date. June 20 is a window boundary, not an asserted market peak.
  - A fair test requires a representative AI basket with disclosed constituents and weights, compared with the Nasdaq Composite after its March 2000 peak over matched elapsed periods.
  - Individual stocks' losses from different peaks cannot establish the speed of a common basket's decline.
support_condition: Comparable price histories show that a representative AI basket reached comparable drawdowns in less elapsed time than the dot-com benchmark, with the conclusion robust to reasonable basket choices.
contradiction_condition: Comparable price histories show that the AI basket declined no faster than the dot-com benchmark over matched elapsed periods, with the conclusion robust to reasonable basket choices.
measurement_requirements: Split-adjusted daily prices, dated peaks, basket constituents and weights, consistent closing-price conventions, and matched elapsed-time comparisons. Separate the size of losses from their speed.
source_requirements: Prefer exchange or index-provider histories. Independently reproducible research may supplement them. The speaker's post and repetitions of it cannot establish the outcome.
