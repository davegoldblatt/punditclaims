explicit_source_elements:
  - slower growth, lower revenue, higher costs
  - hundreds of millions of free users
  - about a billion dollars in “annualized” ad revenue
  - billions of dollars it costs to serve their compute
evaluator_interpretation:
  - The ordinary reading is a comparison of financial performance on comparable definitions, rather than a comparison of differently defined headline figures.
  - Use July–September 2026, the latest completed quarter before publication. Compare revenue growth over the same interval and costs covering the same activities.
  - The advertising figure is explicitly annualized. It must be compared with an annualized serving-cost estimate for the same free-user population, not with an unrelated quarterly expense or total company spending.
  - The financial comparison draws on press estimates in the surrounding text. The advertising announcement separately uses company-reported figures.
  - The single metric_scope summarizes several components; their realized and annualized measures must remain separate.
support_condition: Comparable records establish lower OpenAI revenue and revenue growth, higher comparable costs, hundreds of millions of free users, and roughly $1 billion or less in annualized free-user advertising revenue against several billion dollars in comparable annual serving costs.
contradiction_condition: Comparable records establish the reverse of a stated financial comparison or show that free-user advertising revenue was materially above the stated ceiling or covered comparable serving costs. Conflicting components would warrant mixed rather than a blanket verdict.
measurement_requirements: Match reporting periods, growth intervals, revenue recognition, partner revenue shares, expense categories, and user populations. Keep annualized revenue separate from realized revenue.
source_requirements: Company disclosures or credible reporting of financial records for both companies, plus a separately identified free-user cost allocation.
