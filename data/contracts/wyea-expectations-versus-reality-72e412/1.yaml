ambiguity_flags:
  - The ongoing claim names no observation period; April 2024 is the evaluator's latest-complete-month convention.
  - "'Dwindling' could describe total stock, accessible stock, unused material or supply relative to demand."
  - The claim does not distinguish human-generated data from synthetic data.
  - The scope extends beyond the web-text corpora most directly measured.
