assessment_axis: historical_observation
explicit_source_elements:
  - Even if this were cheaper, or more efficient, or required less power
  - generates answers
  - ingesting an increasingly dwindling amount of training data
evaluator_interpretation:
  - Read the claim as an ongoing shortage of remaining usable training material, rather than a claim that training destroys data.
  - Use April 2024, the latest complete calendar month before publication, as the observation endpoint. Trend evidence must compare that endpoint with earlier availability.
  - The context emphasizes language models and then video; evidence about a subset of web text cannot by itself settle the claim about generative AI generally.
  - The efficiency phrase is a concessive hypothetical, not an antecedent that must occur before the observation can be assessed.
  - Distinguish shrinking accessible supply, shrinking unused supply and demand growing faster than a still-growing stock.
support_condition: Inventories or representative measurements ending in April 2024 show that the remaining usable supply of relevant training data was declining, with adequate coverage of new production, access restrictions, reuse and alternative sources.
contradiction_condition: Comparable measurements establish that the remaining usable supply was stable or increasing across the relevant scope, despite rising demand.
measurement_requirements: Measure usable or unused data consistently over time. A rising restriction rate in a fixed corpus or a forecast of future exhaustion is insufficient alone to establish a decline in total remaining supply.
source_requirements: Primary dataset inventories, longitudinal access studies and transparent data-stock estimates. Later publications may be used when they measure the pre-post period.
