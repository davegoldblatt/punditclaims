assessment_axis: historical_observation
explicit_source_elements:
  - a shit ton of undeployed silicon
  - a very, very, very different picture
  - both NVIDIA and the hyperscalers
  - telling investors
evaluator_interpretation:
  - The ordinary factual reading is that a materially large stock of undeployed AI hardware conflicts with investor-facing representations about operational deployment.
  - This does not automatically allege a specific legal violation or require proving deliberate deception.
  - Hyperscalers means Amazon, Alphabet, Microsoft and Meta.
  - For the ongoing deployment state, I use April through June 2026, the latest completed quarterly period publicly reportable before the post. Investor statements published afterward are contextual evidence of how that state was represented.
  - The surrounding dollar estimate motivates the statement but is not treated as a separately committed numerical threshold here.
support_condition: Comparable records establish substantial undeployed hardware in the target period and identify investor representations that materially overstate deployment of that same hardware or investment cohort.
contradiction_condition: Comparable records establish that investor representations accurately distinguished deployed hardware from future capacity, or establish that the alleged material stock of undeployed hardware did not exist.
measurement_requirements: Match hardware cohorts, reporting dates and meanings of installed, powered, available and utilized. High utilization of operating equipment does not measure the share of purchased equipment installed.
source_requirements: Investor communications paired with commissioning, asset or independently verified deployment records for the same companies and period.
