  - OpenAI and Anthropic
  - horrifyingly unprofitable
  - deeply unstable
  - 80% of their revenues
  - companies that literally can’t afford to pay them
evaluator_interpretation:
  - Read as applying to each company separately, rather than an unspecified combined revenue pool.
  - Use July–September 2026, the latest completed calendar quarter before the post, for the ongoing financial observation. The speaker supplies no reporting period.
  - The ordinary reading requires substantial losses, serious financial fragility, and approximately 80% of realized revenue coming from customers unable to meet their payment obligations.
  - Being unprofitable, venture-funded, or a large customer does not by itself establish inability to pay.
  - The metric scope records the numerical revenue-share assertion. Profitability and financial stability require separate financial measures.
  - The supplied passage identifies no accounting basis or specific financial source. Do not infer one from subsequently found evidence.
support_condition: Comparable evidence for both companies establishes substantial losses and financial fragility during the target period, and customer-level revenue and liquidity records establish the approximately 80% share.
contradiction_condition: Comparable evidence establishes profitability or financial resilience inconsistent with the claim, or establishes that materially less than 80% of either company's realized revenue came from customers unable to pay. A missing disclosure alone is not contradiction.
measurement_requirements: Separate company revenue denominators, customer-level realized revenue, and evidence of customers' available cash, financing access, obligations and payment performance. Distinguish net losses, operating losses and cash burn.
source_requirements: Company financial statements and customer payment or liquidity records, or credible reporting grounded in those records. Spending samples require documented coverage and cannot automatically represent total company revenue.
