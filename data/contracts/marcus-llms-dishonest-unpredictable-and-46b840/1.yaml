plain_reading: true
ambiguity_flags:
  - Society has no defined geographic or institutional scope.
  - Some applications could mean a narrow application or a substantial deployment category.
  - The required duration of waiting is unspecified.
  - Development pauses and deployment shutdowns are not explicitly distinguished.
  - No deadline or numerical probability threshold.
