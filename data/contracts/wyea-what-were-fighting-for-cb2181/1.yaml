assessment_axis: causal_assessment
explicit_source_elements:
  - what people want to hear about
  - largely driven
  - the narratives the media agrees upon
  - people want to hear about AI
evaluator_interpretation:
  - The plain reading is that shared media narratives are a principal cause of audience demand for coverage, including AI coverage. Showing any influence would not establish the stronger word 'largely'.
  - Audience demand means people's interest in receiving information about a topic. Discussion volume, perceived importance and attitudes toward AI are related measures, but are not interchangeable with that demand.
  - The claim concerns the media environment at publication. It supplies no bounded measurement period, population or numerical causal threshold.
  - "'Agrees upon' is read as convergence in coverage, without requiring deliberate coordination."
support_condition: Credible causal research shows that convergent media coverage is a principal driver of audience demand, including demand for AI coverage, after separating its effects from prior interest, product developments and other common causes.
contradiction_condition: Credible causal research in the relevant setting shows that shared media narratives have little effect on audience demand, or that demand predominantly arises independently and drives coverage instead.
measurement_requirements: Measure audience demand before and after exposure, establish causal direction, and compare the contribution of media narratives with other important drivers. Correlation between coverage and interest alone is insufficient.
source_requirements: Prefer experiments, credible natural experiments or longitudinal studies that address reverse causation. Content analyses can establish features of coverage but cannot alone establish its effects on audience demand.
