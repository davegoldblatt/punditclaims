ambiguity_flags:
  - "'Largely' has no numerical threshold."
  - The population and media outlets are unspecified.
  - Wanting coverage, discussing a topic and considering it important are distinct outcomes.
  - The claim moves between audience interests generally and AI specifically.
  - No measurement period is supplied.
