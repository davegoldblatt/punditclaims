  - Token value could mean API retail value or provider serving cost.
  - Allowing usage and actual consumption are different quantities.
  - The population could include all LLM users, subscribers, or particular plans.
  - Free users have no finite token-value-to-payment ratio.
  - Accounting basis is not stated or attributable.
