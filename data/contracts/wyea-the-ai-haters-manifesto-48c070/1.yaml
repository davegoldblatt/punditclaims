assessment_axis: historical_observation
explicit_source_elements:
  - most of those users
  - using subsidized software
  - Anthropic or OpenAI
  - allowing them to burn
  - $20 to $40 in tokens for every dollar of software spend
evaluator_interpretation:
  - Most means more than half of the relevant user population.
  - Allowing refers primarily to permitted usage, rather than requiring every user to consume their full allowance.
  - The ordinary testable reading values permitted tokens at contemporaneous API prices. That valuation is not the provider's serving cost.
  - Use July 2026, the latest complete monthly subscription period before the post.
  - The passage names neither a source for the figures nor an accounting basis, so accounting_basis remains unknown.
support_condition: Representative user-weighted records show that more than half of the relevant users had permitted token value of $20–$40 per dollar of software payment during the target period, using a consistent valuation basis.
contradiction_condition: Comparable representative records establish that the required majority did not receive allowances within the stated ratio.
measurement_requirements: Match subscription payments, allowances, models and token categories to the same month. Weight by users, distinguish allowance from consumption, and handle free users separately because their payment denominator is zero.
source_requirements: Representative usage or allowance distributions, subscription receipts and dated token prices. Provider-cost claims additionally require serving-cost evidence.
