explicit_source_elements:
  - The systems both rely
  - trained human coders translate
  - all the Olympiad's input sentences
  - into mathematical form
evaluator_interpretation:
  - The claim concerns AlphaProof and AlphaGeometry 2 in the July 2024 IMO demonstration described in the post.
  - Human coders means people with the expertise to prepare the formal problem representations; no particular credential is required.
  - Input sentences means the competition problem statements supplied to the systems. It does not mean every training example or proof step.
  - "'Cheat' and 'serious shortcoming' are evaluations of the workflow, not separate claims that competition rules were violated."
  - The observation does not assert that later versions could never automate formalization.
support_condition: Records of the July 2024 demonstration establish that humans converted the competition problem statements into the formal representations used by both systems before automated solving.
contradiction_condition: Records establish that either system autonomously translated its actual IMO evaluation inputs from the original natural-language statements without human formalization.
measurement_requirements: Distinguish evaluation-input preparation from training-data generation, automated proof search and later auto-formalization experiments.
source_requirements: Primary workflow records for the 2024 demonstration; reputable contemporaneous reporting may supplement them where the primary announcement cannot be read.
