ambiguity_flags:
  - "'Went nowhere' supplies no adoption or commercial-success threshold."
  - "'Better' does not specify quality, usability, price, or availability."
  - The current-state observation is assigned Sora's initial public-release period.
  - The comparative clause is explicitly qualified by 'probably'.
