assessment_axis: historical_observation
explicit_source_elements:
  - The central thesis
  - progress on AI has always come from scaling
  - never from hand engineering
  - overstated
evaluator_interpretation:
  - Assess the factual characterization of Sutton's 2019 essay separately from Marcus's expressed opinion about it.
  - The ordinary reading of 'always' and 'never' excludes even short-term progress from incorporating human knowledge.
  - A thesis about which methods ultimately dominate is weaker than a claim about the source of all progress.
support_condition: The essay advances the categorical scaling-only thesis Marcus describes, and historical evidence establishes that this thesis overlooks progress from hand engineering.
contradiction_condition: The essay expressly allows progress from incorporating human knowledge and confines its central comparison to eventual or long-run effectiveness.
measurement_requirements: Read the complete essay, including its qualifications and account of short-term improvements.
source_requirements: Sutton's original essay or a faithful institutional reproduction. Marcus's characterization cannot establish the essay's contents.
