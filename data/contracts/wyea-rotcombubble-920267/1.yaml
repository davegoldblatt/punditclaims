  - ordinary computer usage
  - genuinely sensitive information
  - passwords, health information, or trade secrets
evaluator_interpretation:
  - It refers to the original Recall preview announced shortly before the post.
  - The ordinary reading is that Recall did not automatically recognize sensitive screen content and exclude or redact it because of its sensitivity.
  - User-selected app or website exclusions, private-browsing exclusions, and password masking performed by another application do not establish automatic sensitive-content recognition.
  - The target period is the announcement-era preview from May 20 through June 3, 2024. Later implementations are outside scope.
support_condition: Publication-era documentation or testing establishes that Recall captured visible sensitive information without automatic content-sensitive filtering or redaction.
contradiction_condition: Documentation or reproducible tests establish that the original preview automatically recognized and protected sensitive content of the kinds described.
measurement_requirements: Identify the original preview and distinguish automatic content recognition from user exclusions, application masking, and storage encryption.
source_requirements: Prefer archived Microsoft documentation and direct testing. Contemporary reproductions of Microsoft's original documentation may establish the historical design when the live documentation has changed.
