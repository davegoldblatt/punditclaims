ambiguity_flags:
  - The ongoing observation period is supplied by the evaluator.
  - Seemingly every supplies no market-share threshold.
  - Software products supplies no sampling population.
  - Explaining improvement could mean stating an intended benefit or demonstrating realized value; the contract uses the former.
