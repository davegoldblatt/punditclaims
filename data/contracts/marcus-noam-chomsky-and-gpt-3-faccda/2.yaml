assessment_axis: historical_observation
explicit_source_elements:
  - In GPT-3’s case
  - the mechanism of the prediction is essentially regurgitation
  - trained on literally billions of words of digital text
  - finding patterns that match what they have been trained on
  - not one that means, for example, that the system knows what the words that it uses as predictive tools mean
evaluator_interpretation:
  - "Read 'regurgitation' figuratively: prediction chiefly reuses learned textual patterns. Do not require verbatim copying or assume Marcus denied every instance of generalization."
  - "Read the final sentence as an evidential limitation: predictive success alone does not establish word knowledge. Supporting it does not require proving that GPT-3 lacks all word knowledge."
  - The target is GPT-3 as discussed when the post appeared, not later model generations.
  - Because this describes an ongoing state without a reporting cycle, use the current month through publication, May 1–21, 2022. Earlier experiments are historical context unless their findings are established for that target period.
  - Separate the claim about the prediction mechanism from the weaker claim about what predictive success establishes.
support_condition: Controlled evidence shows that reuse of learned textual patterns adequately explains GPT-3's prediction behavior, while tests or analysis establish that predictive success alone does not warrant attributing word knowledge. Merely documenting statistical training does not establish the stronger mechanism characterization.
contradiction_condition: Controlled evidence shows that the ordinary characterization of prediction as chiefly replaying learned patterns is inadequate, or establishes that predictive success alone warrants the claimed word knowledge. Novel wording alone does not contradict figurative 'regurgitation'; evidence of semantic competence does not contradict the weaker evidential caution.
measurement_requirements: Compare GPT-3 predictions with training examples and controlled novel combinations. Test semantic consistency independently of surface fluency, controlling for contamination, prompt wording, and task-specific supervision.
source_requirements: Primary GPT-3 documentation and controlled studies identifying the tested model. Philosophical arguments may clarify the inference about knowledge but cannot establish GPT-3's empirical mechanism by themselves.
