explicit_source_elements:
  - GPT-3's mechanism of the prediction is essentially regurgitation
  - finding patterns that match what they have been trained on
  - not one that means ... that the system knows what the words ... mean
evaluator_interpretation:
  - "'Essentially regurgitation' is figurative. Marcus glosses it right away as 'finding patterns that match what they have been trained on', not as literal copying of training text."
  - "'Knows what the words mean' is a question about understanding and meaning. The field had no agreed operational test for it in 2022."
  - Read literally, 'regurgitation' would be partly contradicted by studies of novel output. Read as Marcus glosses it, it is hard to test. The result turns on a reading he did not pin down.
support_condition: An agreed test showing GPT-3's outputs are reproductions of training patterns, and that it has no grasp of word meaning.
contradiction_condition: An agreed test showing GPT-3's predictions rest on generalized abstractions, plus an accepted demonstration that it represents word meaning.
