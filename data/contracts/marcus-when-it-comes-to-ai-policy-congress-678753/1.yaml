explicit_source_elements:
  - essentially zero enduring federal AI law
  - only executive orders that seem to come and go
  - Washington has failed
  - a comprehensive privacy or AI law with teeth
evaluator_interpretation:
  - The surrounding comparison concerns broad, durable AI regulation providing protections comparable to state regulatory efforts.
  - The phrase only executive orders also makes a broader factual assertion about the absence of enduring federal AI statutes. That assertion must be checked rather than silently discarded.
  - Washington has failed is treated as political judgment; only its factual premise about legislation is assessed.
  - The target is the legal position at publication. For this ongoing legal state, the latest available statutory position is relevant rather than a financial reporting quarter.
support_condition: The federal government lacks broad statutory regulation of AI development and use comparable to the state protections under discussion.
contradiction_condition: Broad federal AI regulatory legislation exists, or substantive enduring AI statutes contradict the additional assertion that federal action consists only of executive orders. Evidence for the first condition and against the second yields mixed.
measurement_requirements: Distinguish enacted statutes from bills and executive orders, and distinguish broad private-sector regulation from research, procurement, and government-use laws.
source_requirements: Statutory records and authoritative government reviews identifying the relevant laws and their dates.
