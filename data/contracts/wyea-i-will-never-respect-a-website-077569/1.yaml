evaluator_interpretation:
  - The observation concerns the April 2026 launch and its immediate aftermath through the April 14 post.
  - The surrounding discussion of promotional usage allowances makes Codex usage included with ChatGPT Plus the relevant service.
  - Appears expresses a tentative association between the launch and reduced available usage. It does not establish that introducing the new tier independently caused the reduction.
  - Ending a temporary allowance increase counts as a reduction in usage available to subscribers, even if the underlying standard allowance is unchanged.
  - The subscription prices identify customer tiers; this is not a claim about company revenue or spending.
support_condition: Contemporaneous company records show that available Plus Codex usage was reduced or shifted away from longer sessions alongside the $100 tier launch.
contradiction_condition: Comparable records show that Plus Codex allowances remained unchanged or increased through the launch, with no contemporaneous reduction in available session usage.
measurement_requirements: Distinguish Codex from ordinary ChatGPT messaging, session allowances from weekly allowances, and promotional allowances from standard limits.
source_requirements: Dated launch announcements and usage-policy records. Controlled before-and-after measurements would be required to establish a numerical reduction.
