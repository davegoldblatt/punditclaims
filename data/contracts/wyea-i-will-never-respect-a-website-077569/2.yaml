  start: 2026-04-09
  end: 2026-04-14
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The speaker hedges ('appears to have'). Only the factual appearance is tested, not causation.
  - OpenAI called the change a 'rebalancing'. Weekly Plus totals may have stayed the same or risen while per-session and single-day use fell.
  - "'Rate limits' does not name a time window."
