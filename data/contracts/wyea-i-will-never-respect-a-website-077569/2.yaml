explicit_source_elements:
  - OpenAI's new $100-a-month subscription
  - appears to have
  - immediately reduced rate limits
  - for $20-a-month subscribers
evaluator_interpretation:
  - "The speaker hedges with 'appears to have'. He does not firmly claim that the new tier caused a cut. The checkable core is narrower: when the $100 tier launched, OpenAI changed ChatGPT Plus ($20) limits in a way that cut how much a Plus user could use, in at least one usage window. That is the 'appearance' he describes."
  - Causation is not tested. Only the timing link (the change came with the launch) is checked.
  - "'Rate limits' is read as the Codex usage limits, which the launch announcement changed. That includes the short-window, per-session limits a user hits during a working session."
  - "Target period: the launch on 2026-04-09 through the post date, 2026-04-14."
support_condition: Holds if OpenAI announced or documented a change at the $100 launch that reduced Plus users' Codex usage in at least one window, for example shorter sessions or less use in a single day.
contradiction_condition: Fails if Plus limits stayed the same or rose in every window at the launch, or if OpenAI made no Plus change at that time.
measurement_requirements: OpenAI's launch announcement or documentation, or reputable reports quoting it, describing Plus Codex limits at the April 9, 2026 launch.
source_requirements: OpenAI statements, directly or as quoted by reputable tech press.
metric_scope: null
original_horizon: null
horizon_interval: null
