assessment_axis: historical_observation
explicit_source_elements:
  - Altman has clearly sidelined Friar
  - as of August last year
  - the CFO of OpenAI doesn't report to the CEO
evaluator_interpretation:
  - The period runs from August 2025 through publication on April 6, 2026. August 1 is a month boundary, not an asserted date of the organizational change.
  - Reporting means direct reporting; Friar could still report indirectly to Altman.
  - The ordinary reading of sidelined is materially reduced access to important financial discussions or influence over them. Exclusion from key financial meetings can establish this without showing that she lost all authority.
  - Since August 2025 describes timing, not a conditional antecedent.
support_condition: Credible reporting establishes that Friar stopped reporting directly to Altman in August 2025 and remained under another executive at publication, and that Altman excluded her from important financial discussions.
contradiction_condition: Credible records establish that Friar continued reporting directly to Altman, or specifically rebut the alleged exclusion from important financial discussions.
measurement_requirements: Distinguish formal reporting lines from actual access and authority. A reporting-line change alone does not establish sidelining.
source_requirements: Prefer OpenAI organizational records and statements. Otherwise use credible reporting, identify indirect sourcing, and include substantive responses.
