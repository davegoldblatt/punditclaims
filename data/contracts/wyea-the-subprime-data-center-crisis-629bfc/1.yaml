assessment_axis: forecast_outcome
explicit_source_elements:
  - neither banks nor private credit funds nor asset managers
  - forced to keep any level of reserves
  - a few billion of data center deals
  - a cataclysmic unwinding of the AI trade
evaluator_interpretation:
  - The ordinary reading is that several billion dollars of failed data-center financing would cause a severe, broad unwinding of AI investments.
  - Failed deal principal and lenders' realized losses must be recorded separately; the statement does not specify which amount its threshold measures.
  - The surrounding US financing discussion suggests US institutions, although jurisdiction is not explicit.
  - Cash reserve requirements must be distinguished from capital requirements. Evidence about one does not establish the absence of the other.
  - This is a systemic forecast, not a financial metric for a specified company.
support_condition: A documented post-publication episode involving several billion dollars of failed data-center deals, with the stated institutional premise established, causes a severe and broad unwinding of AI-linked investments.
contradiction_condition: A clearly qualifying failure episode occurs under the stated conditions, its market consequences become observable, and AI investments absorb it without the predicted broad unwinding.
measurement_requirements: Identify failed deals, principal, realized losses, lenders and applicable safeguards. Measure market-wide equity, credit and financing reactions, separating the failures' effects from unrelated shocks.
source_requirements: Regulatory records for the reserve premise; filings, court records or rating-agency default reports for failures; dated market data and independent reporting for the resulting transmission.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A verified qualifying failure episode and sufficiently completed market response can settle the forecast without a calendar deadline. Financial stress or falling securities prices alone cannot.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Few billion could describe deal principal or actual losses.
  - Reserves could mean cash reserves or broader loss-absorbing safeguards.
  - Jurisdiction and the size of a cataclysmic unwinding are unspecified.
retrospective_or_prospective: retrospective
