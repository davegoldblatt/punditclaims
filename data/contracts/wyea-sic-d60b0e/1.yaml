assessment_axis: historical_observation
explicit_source_elements:
  - there is no proof
  - this is actually happening
  - other than that which the media drums up
  - turning to AI too early
  - underinvest in job training, mentorship and other programs
evaluator_interpretation:
  - The nearest referents of 'this' are premature substitution of AI for entry-level workloads and reduced investment in entry-level development because employers expect AI displacement.
  - Proof means credible empirical documentation, not mathematical certainty. Reporting based on verifiable records remains eligible evidence.
  - This is a claim about the evidence publicly available by publication. The target period therefore includes the preceding evidence record through 2025-06-16, with no asserted starting date.
  - A broader reading includes any independent evidence of deteriorating entry-level employment. That reading is materially different.
support_condition: A sufficiently comprehensive review of the contemporaneous evidence establishes that the two specified employer practices lacked credible documentation beyond unsupported assertions.
contradiction_condition: At least one credible source available by publication documents premature AI substitution for entry-level work or cuts to entry-level development attributable to anticipated AI displacement.
measurement_requirements: Identify entry-level work, the employer's action, its connection to AI expectations, and either demonstrated inadequacy of the replacement or an actual reduction in training or mentorship.
source_requirements: Research, employer records, surveys with disclosed methods, or reporting with verifiable underlying evidence available by 2025-06-16.
