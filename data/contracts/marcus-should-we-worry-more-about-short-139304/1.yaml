assessment_axis: historical_observation
explicit_source_elements:
  - Large language models are here to stay
  - their recipe well understood
  - not hard for people skilled in the art to replicate
  - large pretrained models
  - for the taking on the dark web
evaluator_interpretation:
  - In this observation, here to stay summarizes the difficulty of reversing existing diffusion of models and technical knowledge; it is not assigned an invented forecast deadline.
  - Well understood refers to practical construction recipes, not complete scientific understanding of model internals.
  - Replication could mean training a comparable base model, adapting existing weights, or running a downloaded model. These are assessed separately.
  - Dark web ordinarily means hidden services requiring specialized access. Public torrents and ordinary websites establish unofficial access but do not alone establish that specific location.
  - The ongoing accessibility claim is assessed during the publication month through March 14, 2023.
support_condition: Contemporaneous records establish practical recipes, replication without substantial difficulty by skilled practitioners, and freely obtainable large pretrained weights on the dark web.
contradiction_condition: Direct evidence establishes that a material asserted component was false in the target period. Public-web availability alone does not disprove parallel dark-web availability.
measurement_requirements: Distinguish pretraining from fine-tuning and inference, and hidden-service availability from ordinary torrents. Specify the computing resources and expertise required.
source_requirements: Primary technical documentation and replication records, plus authenticated distribution records. Reputable reporting may establish a leak where direct archival evidence is unavailable.
