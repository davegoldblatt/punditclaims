ambiguity_flags:
  - Dark web may have been used loosely for unofficial online distribution.
  - Replicate does not distinguish pretraining, fine-tuning and running existing weights.
  - Not hard specifies no resource or effort threshold.
  - Here to stay is an unbounded durability phrase within an accessibility observation.
  - The ongoing state is assessed during the publication month through the post date.
