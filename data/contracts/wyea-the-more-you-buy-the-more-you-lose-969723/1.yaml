evaluator_interpretation:
  - The surrounding discussion identifies Microsoft, Amazon, Alphabet and Meta as the hyperscalers.
  - The references to their last quarters suggest quarterly spending, but the statement does not specify whether $15 billion applies individually or collectively.
  - I read 'bubble pops' as a broad, substantial collapse in AI-linked valuations and financing, rather than an isolated stock decline.
  - The forecast has no deadline. 'The moment' requires a close temporal connection after the spending reduction, but supplies no precise response window.
support_condition: A verified post-publication reduction below the specified spending threshold, followed promptly by a broad collapse in AI-linked valuations and financing.
contradiction_condition: A verified qualifying reduction followed by sustained AI valuations and financing through a defensible interpretation of the immediate response window. Without an established antecedent, the forecast cannot be scored.
measurement_requirements: Comparable quarterly capex records, including treatment of leases; identification of which companies must cross the threshold; dated measures of public valuations, private valuations and financing.
source_requirements: Company disclosures for the spending condition and independent market and financing records for the subsequent outcome.
