assessment_axis: causal_assessment
explicit_source_elements:
  - current machine learning techniques suck at outliers
  - and therefore struggle
  - driverless cars
  - high-level reasoning in unusual circumstances
evaluator_interpretation:
  - The assessable proposition is the causal explanation identified in the supplied normalization. The rhetorical division of the AI community is not treated as a separate population claim.
  - The plain reading is that poor handling of unusual inputs contributes to failures in both automated driving and reasoning. It need not be the sole cause.
  - "A failure in an unusual situation is insufficient by itself: evidence must connect that failure to the system's handling of the unusual input."
  - I use 2024 through publication for the contemporary systems described. Earlier crashes can provide context but cannot establish a defect still present in that period.
support_condition: Controlled reasoning evaluations and driving investigations connect unusual-input handling to failures in both domains, rather than merely documenting errors or crashes.
contradiction_condition: Controlled evidence shows that the relevant failures persist independently of unusual inputs and are explained by other mechanisms, while the systems reliably handle the alleged outliers.
measurement_requirements: Reasoning comparisons should address changes in difficulty. Driving analyses should distinguish perception, prediction, mapping, planning, hardware, and human-supervision failures.
source_requirements: Primary controlled experiments and official incident or recall records that describe mechanisms. General claims about crash occurrence are insufficient.
