  - It took me less than an hour
  - half a dozen clear counterexamples
  - ChatGPT 4o failed
  - with respect to compositionality
  - evident even to a teenager
evaluator_interpretation:
  - Half a dozen means six qualifying counterexamples found within less than 60 minutes.
  - A counterexample is a prompt-output pair with a clear failure to satisfy a compositional instruction; multiple errors in one image do not automatically count as multiple examples.
  - Evident even to a teenager ordinarily means recognizable without specialist knowledge, not that an actual teenage panel participated.
  - The claim concerns Marcus's particular discovery session before publication. Its starting date is unspecified and is left unknown.
support_condition: Independently verifiable records establish that Marcus found six distinct qualifying prompt-output failures within a discovery interval shorter than 60 minutes, with errors clear to non-specialist readers.
contradiction_condition: Complete records establish that the referenced discovery interval lasted at least 60 minutes, contained fewer than six qualifying examples, or relied on outputs that did not clearly violate their prompts.
measurement_requirements: A timestamped session or equivalent authenticated record covering discovery, model identity, original prompts, all relevant outputs, and the six claimed examples.
source_requirements: Authenticated records or independent documentation of the referenced session. Replications by other people can corroborate failure modes but cannot verify who found them or how long discovery took.
