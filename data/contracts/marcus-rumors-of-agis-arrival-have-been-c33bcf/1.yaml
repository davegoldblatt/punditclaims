explicit_source_elements:
  - humanity has already achieved artificial general intelligence
  - have been greatly exaggerated
evaluator_interpretation:
  - Read the statement as denying that AGI had been achieved by publication, rather than predicting future failure.
  - "Use the surrounding definition: robust, flexible competence across broad tasks and environments, including adaptation to novelty."
  - Do not require perfection, consciousness, embodiment, or superhuman performance.
  - Use a post-date snapshot of systems available on 2026-02-17. Earlier evaluations are context unless they establish the state of those systems at that date.
support_condition: Adequate evaluations of the plausible AGI candidates available at publication establish substantial failures of the specified broad competence and adaptation requirements.
contradiction_condition: A system available by publication demonstrably satisfies those requirements across credible, sufficiently broad evaluations.
measurement_requirements: Specify task breadth, novelty, reliability, human comparison, and permitted assistance. Isolated failures or isolated successes cannot settle the claim.
source_requirements: Independent evaluations with dated model identities and transparent methods; capability announcements alone are insufficient.
