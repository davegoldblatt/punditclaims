evaluator_interpretation:
  - The context identifies the excluded customer as OpenAI. Test approximately $10 billion from other customers out of $33.33 billion in realized FY2026 AI revenue.
  - Treat 'around' as ordinary rounding, not permission to substitute another period or annualized run rate.
  - The accounting basis is estimate because the claim expressly attributes the figures to Bloomberg.
  - "'Per Bloomberg' is attribution, not a forecast condition."
  - The description of demand as 'very little' is commentary; the checkable component is the financial breakdown.
support_condition: Accessible Bloomberg reporting or a matching documented estimate establishes approximately $33.33 billion of realized FY2026 AI revenue, including approximately $10 billion from customers other than OpenAI, on consistent definitions.
contradiction_condition: A comparable FY2026 breakdown materially differs from either amount, or the cited report explicitly establishes that the claimed figures concern a different period or metric.
measurement_requirements: Use the fiscal year July 1, 2025 through June 30, 2026. Reconcile total AI revenue with OpenAI-related revenue and other-customer revenue; do not subtract annual revenue from an annualized run rate.
source_requirements: The complete Bloomberg report and its underlying disclosures, or equivalent accessible evidence with matching financial scope.
