  - possibility of an uncontrollable superintelligence
  - a lot of it does not
evaluator_interpretation:
  - The ordinary reading is that substantial AI harms and risk pathways do not require uncontrollable superintelligence.
  - A lot is qualitative. The surrounding examples concern consequential misuse and failures in ordinary applications; the claim does not specify a majority of aggregate expected harm.
  - The reference to uncontrollable superintelligence identifies a possible risk pathway, not a measured probability.
  - For the ongoing state of AI risk, the target period is 2023 through publication, the latest partial calendar year publicly reportable before the post.
support_condition: Contemporaneous research documents consequential harms or credible substantial risk pathways from ordinary AI failures, human misuse, or deployment decisions without requiring uncontrollable superintelligence.
contradiction_condition: Evidence establishes that purported risks outside uncontrollable superintelligence are negligible, unsupported, or actually depend on such a system.
measurement_requirements: Identify the mechanisms and consequences. Do not infer a numerical share of all AI risk from the number of examples.
source_requirements: Primary empirical research and technical analyses available by publication.
