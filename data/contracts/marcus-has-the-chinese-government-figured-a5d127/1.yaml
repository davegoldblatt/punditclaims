evaluator_interpretation:
  - Either party means Republicans and Democrats in U.S. politics.
  - The ordinary reading requires substantial opposition within both parties, beyond merely finding an individual critic in each. It does not require unanimity.
  - The observation concerns the initial reception on December 8–9, 2025. Earlier opposition to prospective sales provides background but is not automatically a reaction to the announcement.
support_condition: Contemporaneous statements, collective actions or representative measurements establish substantial opposition within both parties.
contradiction_condition: Representative evidence establishes broad acceptance within at least one party, inconsistent with the claimed unpopularity.
measurement_requirements: Establish the breadth of opposition within each party. Individual statements establish those speakers' positions, not the distribution of opinion across their party.
source_requirements: Original party or officeholder statements, legislative records, representative polling, or reliable reporting about those records.
