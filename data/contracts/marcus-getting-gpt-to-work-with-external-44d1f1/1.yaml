evaluator_interpretation:
  - The claim concerns recurrent failures in the authors' observations of tool-assisted mathematics and fact-checking through publication.
  - Consistently unreliable means recurring errors, not that every answer was wrong; the surrounding text explicitly acknowledges successes.
  - The observation period ends on publication. Its beginning is unspecified, so no lower bound is imposed.
  - Independent tests on different questions can corroborate or qualify the general pattern but cannot establish what the authors themselves observed.
support_condition: Independent records or replication of the observations underlying the post verify recurring errors in both tool-assisted mathematics and fact-checking.
contradiction_condition: Independent examination of those observations shows that the alleged recurring errors were absent, incorrectly scored, or attributed to the wrong systems.
measurement_requirements: Original prompts, model and tool versions, dates, outputs, correctness judgments, and repeated trials or a documented set of examples in both domains.
source_requirements: Independent examination or replication of the underlying records. The speaker's own account cannot establish its own accuracy.
