ambiguity_flags:
  - Moat has no specified measure and can include capabilities, distribution, switching costs or financial resources.
  - Keeps diminishing supplies neither a baseline date nor a required magnitude.
  - The ongoing-state period is interpreted as the latest public capability snapshot at the Grok 3 launch.
