assessment_axis: historical_observation
explicit_source_elements:
  - today’s large language models
  - lack persistent goals
  - struggle with long-horizon reasoning
  - depend extensively on human scaffolding
  - task formulation, evaluation, and correction
evaluator_interpretation:
  - "This is a conjunction: supporting the whole claim requires evidence for all three limitations."
  - The plain reading concerns contemporary LLMs' general capabilities, including their use in agent systems. It does not assert that they never complete extended tasks.
  - Persistent goals means maintaining and pursuing an objective across an extended sequence of decisions without repeated human redirection. A goal may initially be assigned by a person; the claim does not explicitly require self-originated desires.
  - Struggling means frequent substantive failures in tasks requiring linked reasoning and decisions over many steps. It does not mean complete inability.
  - "Extensive human scaffolding means substantial necessary human work in each named function: formulating tasks, evaluating results, and correcting errors. Merely supplying tools, an initial request, or a benchmark scoring function does not establish this dependence."
  - "For the ongoing state described by 'today’s', use the current reporting month through publication: February 1–17, 2026. Earlier evaluations provide context; later evidence is relevant only if it establishes capabilities during this period."
  - No numerical threshold is supplied. Assess repeated behavior across models and tasks, with isolated demonstrations carrying limited weight.
support_condition: "Evidence about contemporary LLMs must establish all three parts: repeated inability to maintain objectives without human redirection; frequent substantive failures on extended reasoning tasks; and substantial necessary human assistance separately documented for task formulation, evaluation, and correction. Harness improvements alone cannot establish the third part."
contradiction_condition: "Representative evaluations must establish that at least one asserted general limitation does not hold: sustained autonomous goal pursuit, consistently reliable extended reasoning, or successful operation with little necessary human assistance in the named functions. An isolated success challenges the claim but does not automatically overturn a general observation."
measurement_requirements: Identify model versions, task length and dependencies, success and failure rates, goal deviations, and human interventions. Separate assistance in formulation, evaluation, and correction. Distinguish model behavior from automated memory or orchestration, and task duration for humans from elapsed agent runtime.
source_requirements: Use primary evaluations, benchmark reports, or documented deployments available by October 28, 2026. Evidence must describe systems and capabilities in the target period. Developer demonstrations require explicit limits on generalization.
