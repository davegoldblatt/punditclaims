ambiguity_flags:
  - "'Today's' LLMs read as models current at the 2026-02-17 post; evaluations from Feb-Mar 2026 used."
  - "'Struggle' has no threshold: a 50% success rate on 12-hour tasks can be read either as strong or as struggling."
  - "'Lack persistent goals' has no agreed measure."
  - Agentic evaluations themselves use scaffolds built by people, which blurs 'human scaffolding'.
