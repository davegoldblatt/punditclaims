explicit_source_elements:
  - today’s large language models
  - lack persistent goals
  - struggle with long-horizon reasoning
  - depend extensively on human scaffolding for task formulation, evaluation, and correction
evaluator_interpretation:
  - Three sub-claims about frontier LLMs at the post date (February 2026).
  - "'Struggle with long-horizon reasoning': plain reading is that frontier LLMs fail often on tasks needing extended multi-step planning and execution. METR time horizons and ARC-AGI-3 (which tests long-horizon planning with sparse feedback) are the relevant public measures."
  - "'Depend extensively on human scaffolding': plain reading is that performance relies heavily on human-built harnesses, human task setup and human checking."
  - "'Lack persistent goals' has no standard public measure."
  - "Target period: February-March 2026, covering the first independent evaluations of models current at the post (e.g., Claude Opus 4.6). This choice is flagged."
support_condition: Evaluations from the period show frontier LLMs failing often on long multi-step tasks and scoring far higher only with human-built harnesses or task framing.
contradiction_condition: Evaluations from the period show frontier LLMs completing long, multi-step tasks reliably and autonomously, without custom human scaffolding.
measurement_requirements: METR time-horizon results for models current at the post. ARC-AGI-3 results and reports on harness effects.
source_requirements: Benchmark organizers or reputable reports of their published results.
