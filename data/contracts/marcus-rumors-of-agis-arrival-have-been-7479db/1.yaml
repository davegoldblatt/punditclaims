evaluator_interpretation:
  - The ordinary reading is that contemporary systems had not consistently demonstrated these capacities across practical settings. It does not say that they never generalize or provide useful assistance.
  - Flexibility means adapting to changed inputs or circumstances; generality means transferring competence across tasks; reliability means consistently producing acceptable results.
  - The surrounding discussion expressly relies on 2025 studies. I use that recent evidence period through the post date, rather than treating later systems as the subject.
  - Because no numerical threshold is supplied, support concerns the qualified statement that practical evidence suggests substantial remaining limitations.
support_condition: Evaluations across practical settings show substantial failures under changed inputs, across task types, or in sustained dependable performance, despite strong conventional benchmark results.
contradiction_condition: Representative evaluations of systems available by the post consistently demonstrate robust adaptation, transfer, and dependable performance across practical settings, making the asserted gap untenable.
measurement_requirements: Distinguish deployment studies from realistic benchmarks. Examine task success and robustness directly; productivity is supplementary evidence, not a direct measure of general intelligence.
source_requirements: Primary evaluations with identifiable systems, tasks, methods, and dates. Results must concern systems and performance within the historical period.
