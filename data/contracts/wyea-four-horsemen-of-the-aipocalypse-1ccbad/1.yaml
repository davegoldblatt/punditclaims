assessment_axis: causal_assessment
explicit_source_elements:
  - Neither company
  - financial shortfall as a result of being unable to provide their services
  - financial shortfalls because they’re providing their services to customers
  - the only ones paying that price
  - are the customers
evaluator_interpretation:
  - Neither company refers to Anthropic and OpenAI.
  - The plain reading attributes their financial shortfalls to uneconomic service delivery and denies material financial harm to either company from capacity constraints.
  - Paying the price includes lost business, service credits, refunds, and other material financial costs, not only direct cash payments.
  - "Assess the ongoing causal claim over the latest completed quarter and the pre-publication April period: January 1 through April 21, 2026."
  - Aggregate losses do not identify the effects of inference, research, training, financing adjustments, or foregone business.
  - The text specifies no financial measure or accounting basis.
support_condition: For each company, matched evidence shows service delivery causes the financial shortfall while capacity constraints impose no material company financial harm, alongside documented customer harm.
contradiction_condition: Matched evidence shows that capacity constraints materially harm either company's finances, or that profitable service delivery is being incorrectly identified as the cause of a shortfall arising elsewhere.
measurement_requirements: Separate service receipts and delivery costs from training, research, overhead, and financing effects. Measure constrained sales, credits, refunds, and other company costs against a credible comparison without the capacity constraint.
source_requirements: Company financial disclosures, customer and outage records, and evidence identifying the causal contribution of capacity limits. Management beliefs and aggregate losses alone are insufficient.
