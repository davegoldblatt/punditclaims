ambiguity_flags:
  - "'Sudden' supplies no explicit interval; early 2026 through publication is the evaluator's recent reporting window."
  - "'Profusion' supplies no numerical threshold."
  - Agent-attributed commits can contain both human and agent work.
  - Weak defenses may concern deployment as well as code.
  - "'May' does not assert that most agent-written code is vulnerable."
