explicit_source_elements:
  - Anthropic's largest customers
  - explicitly building competitors
  - and/or actively discussing dropping their services
  - SpaceX (which owns Cursor) has Grok
  - Meta has Muse
  - Meta and Microsoft have explicitly discussed dropping their Anthropic use
evaluator_interpretation:
  - This describes an ongoing state at the post date (2026-10-28). I use the period from June 2026 through the post date. That covers the latest customer-concentration data (first half of 2026) and the October 2026 reports on Meta and Microsoft. October news is not excluded.
  - "'Largest customers' means companies that credible reporting names as among Anthropic's biggest revenue sources. Here those are SpaceX/Cursor, Microsoft and Meta."
  - The claim is a disjunction ('and/or'). It holds if the largest customers are building rival models or products, or are publicly reported to be cutting or moving away from Claude. Each customer does not need to do both.
  - "'Discussing dropping' is read as credible reporting that a customer is steering staff off Claude or cutting Claude use and spending. A full contract cancellation is not required."
support_condition: Credible reports that Anthropic's top customers (such as SpaceX/Cursor and Microsoft, and Meta) own or build rival AI models or tools, or are cutting or winding down their use of Claude.
contradiction_condition: Evidence that these companies are not among Anthropic's largest customers, or that none of them builds competing models or tools and none is reported to be cutting or dropping Claude.
measurement_requirements: null
source_requirements: News reporting on customer identities and on the companies' own models and Claude usage. Company statements where they exist. The S-1 does not name customers.
