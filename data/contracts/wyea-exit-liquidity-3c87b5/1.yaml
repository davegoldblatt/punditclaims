explicit_source_elements:
  - Anthropic’s largest customers
  - explicitly building competitors
  - and/or
  - actively discussing dropping their services
evaluator_interpretation:
  - The context identifies SpaceX through Cursor, Meta and Microsoft as the relevant customer groups.
  - Largest means among Anthropic's leading customers by spending, not simply large technology companies.
  - The disjunction permits competing-product development to satisfy the action component without proving plans to terminate purchases.
  - Use the latest completed pre-post quarter, July through September 2026, for the ongoing customer and development state. Later reporting is usable as outcome evidence only when it dates the underlying facts to that quarter.
  - Reducing internal use is narrower than ending all use of Anthropic.
support_condition: Reliable records establish that the named groups were leading Anthropic customers during the target period and were developing competing AI offerings or actively considering discontinuing Anthropic services.
contradiction_condition: Reliable records show that the named groups were not leading customers, or establish that the alleged competing development and discontinuation discussions did not occur.
measurement_requirements: Verify customer standing separately from rival-product development. Distinguish internal employee use from customer-facing distribution and purchases.
source_requirements: Customer concentration or spending records, company product announcements, and attributable reporting or records of discontinuation discussions.
