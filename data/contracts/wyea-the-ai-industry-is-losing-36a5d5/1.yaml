condition_status: unknown
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - Enough demand has no specified economic or physical threshold.
  - The relevant planned capacity is not identified.
  - Very soon supplies no usable deadline.
  - Very different and in a very big way do not define the exception.
  - Getting cheaper is hedged rather than required.
