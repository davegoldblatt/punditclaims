explicit_source_elements:
  - not actually enough demand
  - unless it becomes something very different
  - very soon
  - in a very big way
  - likely also involves it getting cheaper
evaluator_interpretation:
  - The surrounding discussion makes planned AI compute capacity the natural reference for demand.
  - Enough could mean physical utilization, customer revenue sufficient to pay compute bills, or returns sufficient to justify investment. These tests can produce different answers.
  - The statement provides no stable boundary for the technological exception or for very soon.
  - Cheaper is described as likely, so it cannot fairly be imposed as a necessary condition.
support_condition: No sufficiently definite support condition can be set without adding the relevant capacity, economic threshold, observation window and definition of a qualifying technological change.
contradiction_condition: Sustained paying demand covering a specified compute buildout without a qualifying transformation could contradict a clarified version. The original wording does not define those boundaries.
measurement_requirements: A specified capacity cohort, utilization or financial threshold, observation period, and measurable technological exception are needed.
source_requirements: After clarification, use realized customer payments, operating costs and capacity utilization. Investment announcements and other analysts' forecasts cannot settle the outcome.
