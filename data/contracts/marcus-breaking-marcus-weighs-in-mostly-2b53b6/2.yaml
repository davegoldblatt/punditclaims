explicit_source_elements:
  - I too have huge doubts about LLMs
  - At this point
  - literally hundreds of other researchers
  - even prominent machine learning insiders like Sutskever and Sutton
evaluator_interpretation:
  - The plain reading is substantial skepticism about LLM intelligence, reliable generalization, or whether LLMs and further scaling suffice for general intelligence. It does not require believing LLMs are useless.
  - Hundreds means at least 200 researchers other than Marcus. The exact wording includes researchers in relevant fields, rather than requiring everyone to identify their primary field as AI.
  - Public disagreement that current LLM systems are intelligent counts as substantive doubt under this reading. Equating that survey response with 'huge doubts' is an evaluator interpretation.
  - This is an observation as of January 6, 2026. I use the accumulated public record through that date, with no invented starting date. Earlier statements establish expressed positions, but cannot guarantee that every person retained them unchanged.
support_condition: Dated statements establish substantial doubts by Sutskever, Sutton and Marcus, and statements or survey responses establish at least 200 other relevant researchers expressing substantive skepticism about LLM intelligence or capabilities before publication.
contradiction_condition: Affirmative evidence establishes that a named researcher’s position was materially misrepresented, or reliable evidence directly establishes that the claimed number was false. Failure to locate enough statements is a gap, not disproof.
measurement_requirements: Use actual respondents to the relevant survey question, distinguish disagreement from missing responses, and avoid double-counting people across sources. Explain any inference from survey wording to serious doubt.
source_requirements: Original interviews, researcher statements and primary survey reports available by the evaluation date. Marcus’s own writing cannot independently corroborate the claim.
