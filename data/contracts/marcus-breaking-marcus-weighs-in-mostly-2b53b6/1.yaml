  - I too have huge doubts about LLMs
  - at this point
  - literally hundreds of other researchers
  - even prominent machine learning insiders like Sutskever and Sutton
evaluator_interpretation:
  - "Plain reading: by early January 2026, Sutskever and Sutton had each publicly voiced serious doubts about LLMs, or about scaling the current LLM approach, and at least a few hundred other AI researchers had done the same."
  - Marcus's own doubts are taken as given. His own writing is not used as evidence.
  - A survey in which hundreds of researchers say scaling current approaches is unlikely to reach AGI counts as 'hundreds of researchers' with serious doubts about LLMs.
support_condition: Public statements from Sutskever and Sutton that voice basic limits of LLMs, plus evidence that hundreds of researchers share such doubts, all made in roughly the year before the post.
contradiction_condition: Sutskever or Sutton publicly holding that current LLMs face no basic limits, or no evidence that more than a handful of researchers share such doubts.
measurement_requirements: Statements by Sutskever and Sutton, plus a survey or count of researchers expressing doubts.
source_requirements: Primary interview transcripts. A survey report or a reputable report on it.
