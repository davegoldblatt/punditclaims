assessment_axis: historical_observation
explicit_source_elements:
  - They’re not autonomous
  - have shown no proof that they can be
  - consistency, reliability and replicability
  - more things that LLMs cannot do
evaluator_interpretation:
  - In context, the practical concern is dependable completion of substantive work without continuing human correction.
  - Treat 'no proof' as denying demonstrated autonomous task completion, including bounded demonstrations. Do not require proof of unlimited autonomy.
  - Include LLM-based agents with tools because autonomy concerns acting in an environment. A bare model and an agent system are not identical.
  - Treat 'kind of feel antithetical' as commentary, not a separate empirical commitment.
  - Use the current calendar year through publication, 2025-01-01 to 2025-06-09, as the reporting window; no fixed reporting cycle exists.
support_condition: Repeated evaluations show that agents cannot generally be left to complete substantive work dependably and exhibit consequential failures of execution or recovery.
contradiction_condition: Public evaluations demonstrate autonomous completion of bounded tasks, contradicting 'no proof'; broad, repeated dependable completion would additionally contradict the general reliability concern.
measurement_requirements: Report task scope, success probability, human intervention, tools, and repeated attempts. Distinguish occasional success, reliable bounded operation, and broad autonomous work.
source_requirements: Prefer independent agent evaluations with disclosed tasks, methods, and failure analysis. Marketing demonstrations alone cannot establish general reliability.
