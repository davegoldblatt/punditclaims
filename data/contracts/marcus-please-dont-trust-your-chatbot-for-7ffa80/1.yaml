assessment_axis: historical_observation
explicit_source_elements:
  - hallucinations, mistakes, and overconfidence
  - entirely typical of LLMs
  - entirely problematic in medicine
evaluator_interpretation:
  - Typical means characteristic, recurring failure modes across models, not behavior present in every answer or a claim that most answers are false.
  - Problematic in medicine means capable of undermining reliable medical information or decisions; it does not require demonstrated patient injury.
  - The contextual reference to approximately year-old testing identifies a 2025-to-publication evidence period. Generalization to all current versions remains qualified.
support_condition: Independent evaluations across multiple LLMs document recurring fabricated content, factual errors and unjustified certainty in medically relevant tasks.
contradiction_condition: Broad comparable evaluations show these failures are exceptional, confined to isolated systems, or immaterial to medical information and decisions.
measurement_requirements: Separate hallucination, correctness and uncertainty findings. Identify tested models and distinguish recurring failure modes from their prevalence in ordinary use.
source_requirements: Primary multi-model evaluations, preferably corroborated across tasks and research groups.
