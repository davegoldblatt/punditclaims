explicit_source_elements:
  - the study doesn't tell us much
  - without a test that goes significantly beyond what is so well-represented in the training regime
  - it doesn't prove that the system has abstracted a generalized version of theory of mind
evaluator_interpretation:
  - "'The study' is Kosinski's February 2023 preprint, 'Theory of Mind May Have Spontaneously Emerged in Large Language Models'."
  - "The checkable core: did that study's evidence establish a general theory of mind in GPT-3? Robust failures on small, theory-of-mind-preserving changes to the same tasks would show it did not."
  - "'Doesn't tell us much' is evaluative and is not scored on its own."
support_condition: Evidence available by early 2023 that the models' success on Kosinski's tasks did not hold under minor changes that should not matter to an entity with theory of mind.
contradiction_condition: Evidence that the study's tasks were novel and that performance held up robustly under perturbations, so that it did show general theory of mind.
measurement_requirements: Perturbation or contamination tests on the same models and tasks.
source_requirements: Peer-reviewed or preprint research papers.
