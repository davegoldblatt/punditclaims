explicit_source_elements:
  - current systems
  - some applications
  - reliable enough to be practically useful
  - not nearly as many as is often claimed
evaluator_interpretation:
  - The existence of some useful applications is independently testable.
  - The comparative clause supplies neither a set of advertised applications nor a source for what is often claimed.
  - There is no ordinary, reproducible way to count applications across differently scoped tasks, products, and human-supervised workflows without choosing the comparison for the speaker.
support_condition: The complete proposition would require demonstrated useful applications and a defensible comparison showing substantially fewer useful applications than the identified advertised set.
contradiction_condition: The complete proposition would require evidence that the identified advertised set is largely reliable in practice, or that no applications are useful.
measurement_requirements: A defined application taxonomy, a contemporaneous corpus of claims, and task-specific standards for practical reliability would be required.
source_requirements: Deployment studies could test particular applications, but cannot supply the missing comparison on the speaker's behalf.
