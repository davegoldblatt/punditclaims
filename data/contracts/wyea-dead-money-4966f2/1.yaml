explicit_source_elements:
  - Anthropic was a worse business than OpenAI in 2025
  - $34 billion
  - $13.07 billion
  - $2.60 to make $1
evaluator_interpretation:
  - In this immediate context, worse means a higher total operating-expense burden per revenue dollar.
  - This does not test every dimension of business quality, future prospects or valuation.
  - Compare all operating costs, including cost of revenue, rather than comparing differently defined expense subtotals.
  - The compound metric covers both named companies. Individual source records supply components of the comparison.
  - Use estimate for the independently reported financial figures; do not infer GAAP solely from the word audited.
support_condition: Independently corroborated 2025 figures place OpenAI near $34 billion of operating costs and $13.07 billion of revenue, or $2.60 per dollar, below Anthropic’s approximately $2.75.
contradiction_condition: Comparable 2025 figures materially refute the stated OpenAI amounts or place Anthropic’s expense-to-revenue ratio at or below OpenAI’s.
measurement_requirements: Both companies’ realized calendar-year revenue and complete operating costs, using reported unadjusted expenses rather than net losses or cash spending.
source_requirements: Financial statements or independent reporting that corroborates their contents. Repetition of Zitron’s claim alone is insufficient.
