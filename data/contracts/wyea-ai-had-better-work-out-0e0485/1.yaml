assessment_axis: historical_observation
explicit_source_elements:
  - As Torsten said
  - tech analysts are expecting a parabolic surge of revenues
  - across the entire tech stack
  - the analysts covering them are saying the cash won’t be there
  - adding $1.2 trillion in operating cash flows
  - by 2028
evaluator_interpretation:
  - This concerns what analysts were projecting before the post, not whether the projected 2028 results eventually occur.
  - The plain reading is that strong projected tech revenue growth lacks sufficient funding in analysts' forecasts for tech customers.
  - I use the latest completed calendar quarter before the post, July through September 2026, to anchor the contemporaneous forecast snapshot. This is not a claim about realized cash flow during that quarter.
  - Revenue and operating cash flow remain separate measures. The contextual cash flow figure cannot silently replace the sentence's revenue claim.
  - Smaller growth in customer operating cash flow does not itself establish that customers lack funds to pay suppliers.
support_condition: Comparable contemporaneous forecasts establish both unusually strong tech revenue growth and a customer funding shortfall after accounting for their projected expenditures and available funding sources.
contradiction_condition: Comparable contemporaneous forecasts show no claimed revenue surge, or explicitly provide sufficient customer funding for the projected purchases.
measurement_requirements: Match forecast vintage, company coverage, target years, revenue, operating cash flow, and customer spending. Explain any funding bridge rather than comparing changes in cash flow alone.
source_requirements: Apollo's underlying chart and definitions, the associated consensus data, and comparable customer-sector spending and funding forecasts.
