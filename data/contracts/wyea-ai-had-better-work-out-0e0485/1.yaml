  - The sentence says revenue while its numerical context concerns operating cash flow.
  - Parabolic has no numerical threshold.
  - The entire tech stack and its customer universe are not precisely defined.
  - An attribution of Slok's concern is weaker than a demonstrated funding shortfall.
