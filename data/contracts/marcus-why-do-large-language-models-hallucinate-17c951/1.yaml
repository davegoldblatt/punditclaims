evaluator_interpretation:
  - Read 'almost of' as 'almost all of'.
  - The relevant information is the corrections and omissions listed immediately before the claim.
  - Treat 'two second search' as an ordinary expression for an easy lookup, rather than an exact stopwatch threshold.
  - Treat 'most' as more than half of the listed factual points. 'First screenful' means initially visible content, not automatically the entire introduction.
  - The target is the page available when the post appeared, on 2025-05-05.
support_condition: A contemporaneous Wikipedia revision contains nearly all the listed information, and an ordinary initial page view displays more than half of it.
contradiction_condition: The contemporaneous page lacks a substantial share of the listed information, or a documented ordinary initial view displays no more than half.
measurement_requirements: Compare nationality, birthplace and upbringing, Derek Smalls, Spinal Tap writing credit, SNL writing and performance, the named films, Katrina documentary, spouse, radio work, Emmy and Grammy recognition, and the Jaws correction. Record placement and viewport dimensions. Absence from a filmography does not establish no involvement.
source_requirements: A dated Wikipedia revision and contemporaneous rendering or a defensible reconstruction of its initial display.
