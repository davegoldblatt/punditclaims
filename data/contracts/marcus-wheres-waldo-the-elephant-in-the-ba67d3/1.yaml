assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI seems to be opening the door
  - military applications of their systems
  - at least one well-funded startup
  - is busy hooking up AI to military drones
evaluator_interpretation:
  - Opening the door means relaxing restrictions sufficiently to permit some military applications. It does not require permission to develop weapons.
  - Hooking up AI includes active development of autonomous military-drone software; operational combat deployment is not required.
  - At least one is an existential claim. A qualifying startup need not be the White Stork venture identified by the post's link.
  - Well-funded is a qualitative description of substantial financial backing, not a numerical claim about revenue, valuation, or cash remaining. Disclosed financing provides context for that description.
  - The ongoing observation is assessed during January 2024 through the publication date, the latest contemporaneously reportable period.
support_condition: Contemporaneous records establish that OpenAI permitted some military applications and that at least one substantially financed startup was actively integrating AI into military drones.
contradiction_condition: Records establish that OpenAI continued to prohibit every military application, or establish that the asserted startup activity did not exist. Failure to find a startup would not alone establish contradiction.
measurement_requirements: Distinguish military applications from weapons development, active engineering from proposed work, and financing from revenue or valuation.
source_requirements: Contemporaneous policy records or attributed company statements, plus startup development and financing records. News reporting may substitute where a historical primary record is unavailable.
