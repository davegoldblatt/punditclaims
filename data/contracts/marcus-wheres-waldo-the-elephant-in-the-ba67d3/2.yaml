explicit_source_elements:
  - OpenAI seems to be opening the door
  - military applications of their systems
  - at least one well-funded startup
  - is busy hooking up AI to military drones
evaluator_interpretation:
  - "Preserve 'seems': the OpenAI clause asserts a reasonable appearance of an opening to some military applications, not certain intentions or permission for every military use."
  - The startup clause asserts active AI integration with military drones, not merely a proposed business or completed combat deployment.
  - Read 'at least one' as an existential statement. The linked article concerns White Stork, but the wording does not restrict the statement to that company; Shield AI can independently establish the stated existence claim.
  - Read 'well-funded' as substantial documented financial backing for development. No particular funding amount, valuation, or accounting result is asserted.
  - The target is the latest publicly observable policy and development state at publication. No reporting cycle or lower time boundary is supplied; earlier funding and development records can establish that state.
support_condition: Contemporary policy changes or cooperation reasonably support the tentative OpenAI clause, and records establish at least one substantially funded startup actively integrating AI with military drones.
contradiction_condition: Contemporary records undermine the apparent opening to military applications, or sufficiently comprehensive evidence establishes that no startup met the funding and active-development description.
measurement_requirements: Keep non-weapon military applications distinct from weapons development. For the startup, verify actual financial backing and active technical work; do not infer funding from an associated individual's wealth.
source_requirements: Contemporaneous policy records, attributed company statements, and startup development and funding disclosures. Use reporting where an accessible primary policy record is unavailable.
