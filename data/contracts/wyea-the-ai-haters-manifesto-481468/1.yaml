assessment_axis: forecast_outcome
explicit_source_elements:
  - any data center
  - GPUs delivered in 2027 and beyond
  - billions of dollars’ worth of extra costs
evaluator_interpretation:
  - Read 'any data center' as a facility-level assertion about each qualifying data center, rather than an industry-wide aggregate.
  - Read 'billions' as at least two billion US dollars in incremental costs attributable to the described price increases.
  - Compare like-for-like procurement costs before and after the increase, holding quantities and configurations constant.
  - "'2027 and beyond' gives an earliest delivery year but no final deadline."
  - Treat delivery in 2027 or later as the stated qualifying condition. That condition cannot yet have occurred at the evaluation date.
support_condition: For qualifying deliveries, facility-level procurement records establish at least USD 2 billion in additional costs attributable to the described price increases. A few large projects alone cannot establish the universal wording.
contradiction_condition: One qualifying facility's complete procurement records establish incremental costs below USD 2 billion on the same scope and comparison basis.
measurement_requirements: Facility-level delivery dates, quantities, configurations, original prices, revised prices and contractual pass-through terms. Aggregate industry spending cannot establish costs at each facility.
source_requirements: Executed procurement contracts, invoices or company disclosures with enough detail to isolate the price increase. Reports of percentage increases alone are insufficient.
metric_scope:
  company: Unspecified individual AI data center operators
  metric: Incremental facility-level GPU system procurement costs attributable to price increases
  currency: USD
  units: billions per data center
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2027-01-01
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: in 2027 and beyond
horizon_interval:
  start: 2026-08-25
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An irrevocable facility-specific procurement obligation could settle the cost threshold early only if the qualifying delivery condition and full incremental cost were also conclusively established. General price announcements or planned deliveries do not meet this rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Any data center' could be intended rhetorically rather than universally."
  - No final deadline follows 'and beyond'.
  - "'Billions' has no exact numerical threshold."
  - GPU chips and complete server systems are not distinguished.
  - No facility size, procurement quantity or cost baseline is specified.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
