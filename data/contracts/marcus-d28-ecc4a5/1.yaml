evaluator_interpretation:
  - The firm assertion concerns the absence of a defensible argument establishing zero or negligible AI extinction risk at publication.
  - Solid means reasoning with justified premises and conclusions that cover AI extinction risk broadly. It does not require unanimity or a mathematical proof.
  - The concession that particular arguments may be weak is hedged and is not separately scored.
  - The target period is 2023 through publication, the latest partial calendar year publicly reportable for this ongoing debate.
support_condition: A sufficiently comprehensive examination of relevant arguments shows that none establishes zero or negligible overall AI extinction risk on justified premises.
contradiction_condition: At least one publicly available argument establishes zero or negligible overall AI extinction risk on justified premises, rather than merely challenging one proposed mechanism.
measurement_requirements: Separate critiques of individual takeover scenarios from conclusions about total extinction risk. Do not equate disagreement with invalidity or uncertainty with a positive lower bound.
source_requirements: Original arguments and substantive evaluations available by 2023-08-27.
