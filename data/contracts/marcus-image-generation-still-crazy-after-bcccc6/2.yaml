explicit_source_elements:
  - Google’s Veo doesn’t get it right either
  - having the relevant text there from the start
  - a person handwriting the phrase "meeting to decide AI strategy" in the 9am slot of a daily planner
evaluator_interpretation:
  - This concerns the particular Veo and Sora clips presented in the post, not every possible output from either model.
  - The specific Veo allegation is that the requested text is already present when the clip begins, instead of being produced by the depicted handwriting.
  - Either also asserts that the presented Sora clip failed the handwriting request, without specifying that it failed in the same way.
  - Cheating describes the visible shortcut; it is not treated as an allegation of intentional deception.
  - The target is the clips reported by June 25, 2025. Their generation dates are unspecified, so the start is left unknown.
support_condition: Independent inspection of the actual reported clips confirms that Veo starts with the relevant phrase already present rather than showing it being written into the 9am slot, and that the presented Sora clip also fails the requested handwriting action.
contradiction_condition: Independent inspection of those same clips shows that the alleged Veo shortcut did not occur and that the phrase is correctly handwritten into the requested slot, or shows that the presented Sora clip fulfills the request. A different successful generation cannot contradict the reported failures.
measurement_requirements: Inspect the opening frames and full sequence of each original clip, tracking the phrase, pen movement, appearance of new lettering, and placement in the planner. Verify the prompts and model attribution.
source_requirements: Independently preserved original clips with provenance, provider records, or independent frame-by-frame inspection of the actual clips. Descriptions repeating Marcus’s account and separate reproductions are insufficient.
