assessment_axis: historical_observation
explicit_source_elements:
  - foundational work was done by Kunihiko Fukushima in 1979-1980
  - Wei Zhang et al (1988) beat LeCun
  - adding the back-propagation to convolutional neural networks
  - published in Japanese
  - with an English abstract
evaluator_interpretation:
  - Foundational work means an earlier architecture containing central CNN features, not every feature of later CNNs.
  - Zhang's network must actually use backpropagation for its shared spatial connections.
  - The comparison must consider LeCun's earliest qualifying work, not assume that his better-known 1989 publication marks the first experiment.
  - The original publication's language and English abstract are separate factual commitments; a later English translation does not establish an original English abstract.
support_condition: The records establish Fukushima's foundational 1979–1980 work, Zhang's qualifying 1988 publication in Japanese with an English abstract, and priority over LeCun's corresponding work.
contradiction_condition: Reliable records contradict a stated date, technical contribution, publication-language detail, or the asserted priority over LeCun.
measurement_requirements: Compare original technical descriptions and dated publication or experiment records. Inspect the original Zhang proceedings entry for its language and abstract.
source_requirements: Original papers and proceedings metadata; translations must be identified and not treated as original English abstracts.
