assessment_axis: forecast_outcome
explicit_source_elements:
  - AI agents
  - will not work well
  - until major progress is made in common sense
  - may require wholesale revisions in how AI is approached
evaluator_interpretation:
  - "The claim links two things: agents working well, and major progress in common sense. To test it, you would need to establish both whether agents work well and whether major commonsense progress has occurred. Neither has an agreed measure."
  - No deadline is given, and 'may require wholesale revisions' is hedged.
support_condition: Agents keep failing on realistic tasks while there is no agreed major advance in machine common sense. Or agents come to work well only after a recognised commonsense breakthrough.
contradiction_condition: Agents are widely shown to work well on realistic tasks while experts agree no major commonsense progress has occurred.
measurement_requirements: An agreed measure of 'working well' for agents and an agreed marker of 'major progress in common sense'.
source_requirements: Independent agent benchmarks and deployment studies, plus expert assessments of commonsense reasoning progress.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Contradicted only if agents are shown to reliably complete realistic multi-step tasks (for example, a large majority of TheAgentCompany-style tasks) while it is documented that no major commonsense advance occurred. Supported only if a recognised commonsense breakthrough is documented as what made agents work well.
interpretation_determines_result: true
ambiguity_flags:
  - "'Work well' has no threshold."
  - "'Major progress in common sense' has no agreed marker."
  - There is no deadline.
  - "'May require wholesale revisions' is hedged."
retrospective_or_prospective: retrospective
