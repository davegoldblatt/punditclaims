explicit_source_elements:
  - Claude Code does not actually build unique software
  - nor will it be differentiated at all
evaluator_interpretation:
  - The ordinary reading is that Claude Code cannot implement substantively distinct, task-specific software beyond reproducing existing products or templates.
  - Unique does not require inventing a new programming paradigm or working without human specifications. A new program-specific capability can qualify even when it uses established techniques.
  - "Because this is an ongoing capability claim with no stated reporting period, assess the publication month through the post date: February 1–26, 2026."
  - Machine-checkable verification code is software, although it is a narrower artifact than a complete commercial application.
support_condition: Artifact comparisons and capability tests establish that relevant outputs merely reproduce existing implementations and cannot add substantively distinct task-specific functionality.
contradiction_condition: A documented working code artifact produced with Claude Code implements a substantive capability absent from its source template or prior implementation, even with human requirements and review.
measurement_requirements: Compare the generated artifact with its prior implementation or template. Establish what new behavior or verification capability it supplies, whether it works, and Claude Code's reported contribution.
source_requirements: Prefer research reports or developer records identifying the artifact, prior work, validation method and human contribution. Lines of code or marketing assertions alone are insufficient.
