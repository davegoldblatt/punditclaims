  - Being smarter than the smartest individual does not specify performance across tasks or allowable weaknesses.
  - The original forecast includes tentative language and a possible 2026 timeframe.
  - Marcus calls the forecast a promise.
  - The retrospective outcome remains unsettled under the unspecified capability threshold.
