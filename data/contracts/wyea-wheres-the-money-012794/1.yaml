explicit_source_elements:
  - a free user of ChatGPT is a cost burden on OpenAI
  - every free customer
  - Google's Gemini, Anthropic's Claude, Perplexity
  - any other generative AI company
evaluator_interpretation:
  - "The ordinary reading concerns active free users: their attributable serving costs exceed contemporaneous revenue attributable to serving them."
  - Free means no subscription payment, not necessarily no advertising or other revenue.
  - Exclude speculative future conversion and unpriced data benefits from the direct financial comparison.
  - Use Q4 2024, the latest completed calendar quarter before publication, because the ongoing observation specifies no reporting period.
  - The claim specifies no accounting basis.
support_condition: Matched serving-cost and monetization records show a net direct cost for every active free-user category at the named providers and the broader claimed set.
contradiction_condition: A documented active free-user category covers its attributable serving costs through advertising or other contemporaneous revenue during the target period, on a matching specified basis.
measurement_requirements: Measure free-user serving costs and attributable revenue, including advertising and associated revenue-sharing costs. Distinguish gross resource consumption from net financial burden.
source_requirements: Provider disclosures or credible records separating free-tier usage, serving costs and monetization. The existence of a free tier or ads alone does not settle net profitability.
