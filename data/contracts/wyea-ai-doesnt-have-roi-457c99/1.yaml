assessment_axis: causal_assessment
explicit_source_elements:
  - every AI startup
  - inherently unprofitable
  - literally sending every penny of their venture capital money
  - directly to Anthropic and OpenAI
evaluator_interpretation:
  - The plain reading asserts universal company losses and universal allocation of venture funding to the two named vendors, with token purchases causing those losses.
  - Every penny is read literally because the speaker explicitly emphasizes it; a looser rhetorical reading remains possible.
  - AI startup is not restricted to companies reselling those two vendors' models.
  - No accounting basis is stated. Profitability reports with unspecified definitions cannot be silently converted into net-income evidence.
  - The listed conditions describe the claimed population and spending share, not antecedents of a conditional forecast.
support_condition: Comprehensive comparable financial and expenditure records establish losses across AI startups, show all venture funds going to the two named vendors, and establish the proposed causal connection.
contradiction_condition: A qualifying startup demonstrates profitability on a matching basis, or traced venture-funded expenditure goes elsewhere. A demonstrated alternative operating model can also undermine the claimed universal causal mechanism.
measurement_requirements: Separate net profit, operating profit, gross margin and cash flow. Trace realized expenditure rather than intended uses of funding. Establish the relevant startup population.
source_requirements: Financial statements and realized expenditure records. Company statements and interviews may supply leads, but require clear definitions and periods to be decisive.
