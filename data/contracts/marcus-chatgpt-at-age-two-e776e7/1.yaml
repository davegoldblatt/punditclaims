evaluator_interpretation:
  - "The checkable part is 'They didn't': between early 2023 (Labenz's thread) and the post date, ChatGPT's hallucinations did not recede."
  - Two readings are possible. On a literal reading, 'recede' means 'measurably decline'. On a looser reading, it means 'fade into a minor problem'. In the same post Marcus writes 'They may have declined, but they certainly haven't vanished', which points to the second reading.
  - The claim about what Labenz and investors projected is framing and is not scored.
support_condition: Evidence that by late 2024 ChatGPT models still hallucinated often on standard factuality tests or in real use, and that rates did not fall over 2023–2024.
contradiction_condition: Evidence that ChatGPT's hallucination rates fell sharply between 2023 and late 2024, to the point where they were rare or minor.
measurement_requirements: Published hallucination or factuality evaluations of ChatGPT models (GPT-3.5, GPT-4, GPT-4o, o1) from 2023–2024, or systematic audits of ChatGPT output.
source_requirements: Model developer documentation, peer-reviewed or preprint evaluations, or reputable independent audits.
