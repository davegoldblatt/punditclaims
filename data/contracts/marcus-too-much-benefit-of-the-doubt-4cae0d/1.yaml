assessment_axis: historical_observation
explicit_source_elements:
  - Human children are constantly learning new things
  - often from tiny amounts of data
  - literally nothing like that in the AI world
evaluator_interpretation:
  - The surrounding examples make the ordinary reading broad, continuing acquisition of unfamiliar skills from little new experience, comparable to a child.
  - This is not automatically a claim that no narrow one-shot or few-shot learning method exists. The literal wording nevertheless makes such results material counterevidence.
  - Prior learning is allowed for both children and AI. A large pretraining history alone does not disqualify a demonstration of learning from a few new examples.
  - For this ongoing capability observation, I use the current reporting month through the post, October 1–16, 2022. Earlier experiments are contextual unless a source establishes the relevant October state.
support_condition: Broad evaluations of systems existing in the target period establish a substantial gap from children's continuing, data-efficient learning across diverse unfamiliar tasks.
contradiction_condition: A system existing in the target period demonstrates continuing learning across diverse unfamiliar language, reasoning, and practical tasks from comparably small amounts of new experience.
measurement_requirements: Measure new-task examples or interactions separately from prior training. Compare task novelty, transfer, retention, breadth, and child performance; do not equate a few prompted answers with demonstrated continuing learning.
source_requirements: Primary experiments or reproducible demonstrations with disclosed training and evaluation procedures. Narrow few-shot results must be reported even when they do not settle the contextual reading.
