  - the API and subscriptions
  - nearly a quarter
  - Anthropic’s 2025 revenue
  - two customers
evaluator_interpretation:
  - Treat API access and subscriptions as broad commercial categories, not a literal count of models, plans or applications.
  - An established offering sold to a separate customer market can constitute another commercial category. This reading makes advertising relevant, although effectively leaves its required importance unclear.
  - Nearly a quarter means a combined share close to, and ordinarily below, 25%; no artificial numerical tolerance is imposed.
  - "The target interval contains two distinct observations: calendar-2025 customer concentration and the product position before the October 6 post. Revenue from other years is not substituted."
  - The monetary scope applies only to the Anthropic customer-concentration clause. Product-category evidence has no monetary metric scope.
support_condition: Company revenue records show that two customers supplied nearly 25% of Anthropic's 2025 revenue, and the companies' commercial offerings are adequately described by API access and subscriptions.
contradiction_condition: Comparable 2025 records show a materially different two-customer share, or pre-publication evidence establishes an additional commercial offering outside API access and subscriptions.
measurement_requirements: Use recognized full-year revenue and direct customer concentration, not cloud distribution shares, annualized revenue or later-year concentration. Distinguish product categories from individual plans.
source_requirements: Prefer company financial statements and dated product disclosures. Reporting must identify the company and revenue year.
