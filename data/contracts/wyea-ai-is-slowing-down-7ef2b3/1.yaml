assessment_axis: historical_observation
explicit_source_elements:
  - generative AI
  - inherently limited
  - impossibly expensive
  - economically unviable
  - Its services cost too much to run
  - its progenitors have no path to profitability
evaluator_interpretation:
  - The ordinary economic reading is that generative AI providers cannot sustain their services from customer receipts because costs make the business structurally unviable.
  - Limited and impossibly expensive are assessed through that economic proposition; having technical limitations alone does not demonstrate economic unviability.
  - The claim concerns generative AI generally, not only OpenAI and Anthropic.
  - For the ongoing observation, use January through March 2026, the latest completed calendar quarter that could have been reported before the June 8 post.
  - This is a technology-wide viability claim without a named company financial metric. Company-specific profit reports are relevant context but do not automatically measure the whole claim.
support_condition: Representative evidence of revenues and full operating, development and capital costs establishes structural economic unviability across generative AI services in the target period, rather than losses caused solely by expansion.
contradiction_condition: Credible evidence establishes sustained economically viable generative AI service provision in the target period, with the relevant full costs accounted for.
measurement_requirements: Distinguish revenue from profit, gross margins from full-cost profitability, and present losses from absence of any viable business model. Identify the profit measure and period for proposed counterexamples.
source_requirements: Financial disclosures or credible reporting of full revenues and costs. Company statements about profitability should identify their basis and coverage; anecdotes and funding totals are insufficient.
