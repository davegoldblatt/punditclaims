ambiguity_flags:
  - The observation names no reporting period; the latest completed calendar quarter before publication is used.
  - Economic viability has no specified profit measure or cost-allocation rule.
  - The language shifts between present economics and an inherent lack of a future path.
  - Generative AI may mean all services or primarily large frontier-model providers.
  - Inherently limited has no separate capability threshold.
