evaluator_interpretation:
  - The sentence makes three sweeping judgments about the nature of generative AI ('inherently'). None comes with a measure, a scope (which services or firms), or a time period.
  - "'Economically unviable' and 'impossibly expensive' have no ordinary test that would settle them for the whole technology at a single date. A single firm's quarterly profit or loss would not settle a claim about what is inherent, and choosing that test would be the evaluator's framing, not his."
  - The narrower parts of this paragraph (cost and ROI measurability, and whether costs ever fell) are graded as separate claims.
support_condition: "Not adjudicable: no ordinary reading turns 'inherently limited, impossibly expensive and economically unviable' into a test that dated evidence could pass."
contradiction_condition: Not adjudicable for the same reason. Firm-level profits or price cuts would bear on it, but they cannot settle a claim about what is inherent to the technology.
