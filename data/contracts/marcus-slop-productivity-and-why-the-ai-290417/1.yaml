assessment_axis: historical_observation
explicit_source_elements:
  - slop inundating Wikipedia, libraries and so on
evaluator_interpretation:
  - The ordinary reading is a substantial, recurring influx of low-quality AI-generated material that burdens Wikipedia and libraries.
  - Submissions and moderation workload count; the claim need not mean that most published articles or library holdings are AI-generated.
  - With no reporting calendar shared by these institutions, assess the ongoing situation during 2026 through the post date. Earlier incidents are background only.
  - Evidence about a library supplier's screening process does not automatically establish the amount reaching libraries.
support_condition: Contemporaneous records establish substantial influxes of low-quality AI-generated material and resulting review burdens at both Wikipedia and libraries.
contradiction_condition: Representative records establish that such material was only an isolated or negligible problem at the named institutions.
measurement_requirements: Distinguish AI-generated material from other low-quality content, submissions from accepted holdings, and individual examples from substantial institutional workloads.
source_requirements: Prefer dated moderation records, library reports and supplier disclosures. Reporting must identify its institutional sources.
