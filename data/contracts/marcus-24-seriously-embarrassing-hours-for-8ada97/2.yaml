  - highways miles are the easy part
  - nobody even pretends anymore
  - to be close
  - doing that off the Interstate
  - an intervention-free drive, without human assistance, from LA to NYC
evaluator_interpretation:
  - "'Doing that' retains the preceding sentence's entire task: an intervention-free LA-to-NYC drive without human assistance, using a route off the Interstate."
  - "'The easy part' ordinarily means highway driving presents less autonomous-driving difficulty than the off-Interstate portions of that task; it does not mean highway driving is risk-free."
  - "'Nobody even pretends' concerns public claims of being near that capability, rather than whether the capability was actually achieved."
  - The target is the public state of claims and technical capability as of the post on 2023-01-18. This subject has no fixed reporting quarter; the latest reportable state is the information publicly current at posting.
  - No numerical definition of 'close' is added. Clear claims of imminent readiness would qualify; generic ambitions or local driverless services would not.
support_condition: Evidence must establish both that highway driving was the comparatively easier part of this cross-country task and that a sufficiently comprehensive contemporaneous record contained no public claim of nearing an intervention-free LA-to-NYC drive off the Interstate.
contradiction_condition: A contemporaneously current public statement clearly claiming near readiness for that specific off-Interstate cross-country task would contradict the second part. Comparable technical evidence showing highway driving was not the easier part would contradict the first. Local autonomy alone would not do either.
measurement_requirements: Preserve the cross-country distance, off-Interstate route and absence of human assistance. Compare technical difficulty under comparable conditions, rather than treating deployment order or local trip counts as a direct measure.
source_requirements: Dated developer statements and technical records current at posting. Supporting the universal absence claim requires broad coverage; a counterexample requires an identifiable public statement.
