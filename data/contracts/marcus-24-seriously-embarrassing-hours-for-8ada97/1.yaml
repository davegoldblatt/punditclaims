  - nobody even pretends anymore
  - to be close to doing that
  - off the Interstate
  - "'that' = an intervention-free drive, without human assistance, from LA to NYC"
evaluator_interpretation:
  - "Plain reading: as of the post, no prominent self-driving developer was publicly claiming to be close to fully hands-off, intervention-free driving on ordinary non-highway roads, of the kind a cross-country drive off the Interstate would need."
  - He named no period. 'Anymore' points to the recent state at the time of the post, so I use roughly the year before the post (2022-01-01 to 2023-01-18).
  - Public claims by Tesla's CEO about full self-driving on all roads count as someone 'pretending to be close', because the paragraph is about Musk's promises.
  - The side remark that highway miles are 'the easy part' is treated as framing. It is widely accepted and not the testable core.
support_condition: In the year before the post, no major developer or its leadership publicly claimed to be near general, intervention-free autonomous driving on non-highway roads.
contradiction_condition: In that period, a major developer's leadership publicly claimed to be close to full self-driving with few or no interventions on general roads, including city streets.
measurement_requirements: Dated public statements by autonomous-driving company leaders in the year before the post.
source_requirements: Company earnings-call statements, as reported by reputable news outlets or in transcripts.
