evaluator_interpretation:
  - The ordinary reading is that representative GPU utilization for the infrastructure serving enterprise Microsoft 365 Copilot was approximately 60%, at or just below that level.
  - Use August 2025, the latest completed calendar month before the post, because no measurement period is supplied.
  - GPU utilization is a hardware measurement. Paid seats, active users, token counts and utilization of other Copilot products cannot establish this percentage.
support_condition: A credible, product-specific measurement shows representative GPU utilization approximately 60% during the target period.
contradiction_condition: A comparable, product-specific measurement shows utilization materially different from approximately 60% during the target period.
measurement_requirements: Identify the GPU population, utilization definition, sampling interval, aggregation method and measurement dates. Distinguish allocated capacity, processor activity and achieved computational throughput.
source_requirements: Microsoft telemetry, an independently documented measurement, or reporting based on identifiable measurement records. Repetition of Zitron’s assertion is insufficient.
