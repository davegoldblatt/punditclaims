assessment_axis: historical_observation
explicit_source_elements:
  - '"That same month" (June 2025)'
  - "\"Cursor's AWS costs\""
  - '"exploded by 104% (or by $6.48 million)"'
  - '"never returned to their previous levels"'
evaluator_interpretation:
  - The baseline for the June increase is May 2025, the month the post lists just before June ($6.19M to $12.67M).
  - "'104%' allows for rounding: $6.48M on a $6.19M base is about 104.7%, so any June increase of about 100–105%, or about $6.3–6.6M, counts as matching."
  - "'Never returned to their previous levels' is read as: every monthly AWS bill from July to September 2025 (the last month of his data) stayed above the May 2025 level."
  - The hedged aside that AWS is 'the minority' of Cursor's compute costs ('I believe') is not scored.
support_condition: Independent records of Cursor's (Anysphere's) monthly AWS charges show June 2025 about double May 2025 (up roughly $6.5M, about 104%), and every month from July to September 2025 above the May level.
contradiction_condition: Independent records show the May-to-June 2025 rise was materially different from about 104% / $6.48M, or show that any month from July to September 2025 fell back to or below the May 2025 level.
measurement_requirements: Monthly AWS charges for Cursor/Anysphere, May through September 2025, in USD.
source_requirements: AWS invoices or billing records, Anysphere or Amazon disclosures, a filing, or an independent news report that saw the billing data. The speaker's own post cannot count.
