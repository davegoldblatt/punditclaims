assessment_axis: historical_observation
explicit_source_elements:
  - That same month
  - Cursor’s AWS costs
  - which I believe are the minority of its cloud compute costs
  - exploded by 104% (or by $6.48 million)
  - never returned to their previous levels
evaluator_interpretation:
  - That same month means June 2025, compared with May 2025.
  - Never returned is bounded by the post's records through September 2025; it is not an indefinite forecast.
  - Previous levels means the May monthly AWS bill. Each July–September bill must remain above that baseline.
  - The 104% figure is treated as an approximate description of roughly doubling, not a claim of precision finer than the displayed rounded dollar figures.
  - The parenthetical minority assertion is a separate, hedged component requiring total cloud-compute costs.
  - The accounting basis is estimate because these are externally reported private-company bills, not identified company financial statements.
support_condition: Independent May and June invoices establish an increase of approximately 104% and $6.48 million, and each July–September invoice exceeds May's level. The minority component additionally requires AWS to account for less than half of comparable total cloud-compute costs.
contradiction_condition: Independent invoices show a materially different June increase, or at least one July–September bill returns to May's level or below. Comparable total-cost records showing AWS at least half of cloud-compute spending would contradict the parenthetical component only.
measurement_requirements: Monthly AWS invoices for May–September 2025 on a consistent basis, including credits and discounts. Total comparable cloud-compute expenses are needed only for the minority component.
source_requirements: Cursor or AWS disclosures, authenticated invoices, or independent reporting based on those records. Customer pricing announcements do not establish Cursor's AWS bills.
