explicit_source_elements:
  - vast majority
  - AI revenues and revenue growth
  - Microsoft, Google and Amazon
  - from Anthropic and OpenAI
  - misleading investors by not disclosing
evaluator_interpretation:
  - Assess each cloud platform separately, for both AI revenue and the increase in AI revenue over the corresponding prior-year period.
  - Read 'vast majority' as approximately 70% or more, following the percentages in the surrounding text.
  - Because the assertion describes a current state without a consistent reporting period, use April–June 2026, the latest completed reporting quarter before the post. The surrounding annual estimates and FY2027 forecasts do not establish quarterly realized shares.
  - The allegation of misleading investors requires evidence that omitted concentration information materially distorted the companies' public accounts. Deliberate deception requires additional evidence of knowledge or intent.
  - Revenue earned from enterprises buying model access must be distinguished from compute purchases made by the two labs themselves.
support_condition: Comparable evidence shows that the two labs supplied approximately 70% or more of both AI revenue and AI revenue growth at each platform during the target quarter, and disclosure records establish materially misleading omissions. Evidence of deliberate conduct is needed for the accusation of intentional deception.
contradiction_condition: Comparable customer-level evidence shows that a material part of the asserted concentration is false, or contemporaneous disclosures clearly reveal the concentration alleged to have been concealed. Partial findings must be identified separately.
measurement_requirements: For each platform, obtain AI revenue, revenue attributable to each lab, corresponding prior-year amounts, and consistent recognition and gross-versus-net treatment. Calculate growth contributions from changes in revenue, not from revenue shares or spending commitments.
source_requirements: Original analyst reports with definitions and periods, customer-level company disclosures, and contemporaneous investor communications. Repetitions of Zitron's estimates are not independent corroboration.
