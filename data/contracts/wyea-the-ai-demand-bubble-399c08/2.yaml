ambiguity_flags:
  - "'Misleading investors' is a normative and legal charge, not a measurable fact."
  - "'Revenue growth in their representative cloud platforms' could mean AI revenue growth or total cloud growth."
  - "The periods are mixed: Microsoft's fiscal year versus calendar 2026, and estimates for FY2027 and 2027 appear in the context."
  - Microsoft's disclosure covers OpenAI revenue but not its share of AI revenue, so whether it 'disclosed that this is the case' depends on reading.
