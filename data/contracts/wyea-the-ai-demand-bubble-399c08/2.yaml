assessment_axis: historical_observation
explicit_source_elements:
  - vast majority
  - Microsoft, Google and Amazon's AI revenues and revenue growth in their representative cloud platforms
  - are from Anthropic and OpenAI
  - misleading investors by not disclosing that this is the case
  - 73% of AWS' AI revenues, 74% of Microsoft's, and likely 70%+ of Google Cloud's
evaluator_interpretation:
  - "The claim has two testable parts. (a) Concentration: for each of the three companies, Anthropic and OpenAI supply well over half of the company's AI revenue (and of the AI-driven growth in its cloud platform), in the period his figures describe, FY2026 for Microsoft and 2026 for the others. Because he relies on analyst estimates, credible estimates count, not only company figures."
  - "(b) Non-disclosure: as of the post date, the companies had not disclosed this concentration to investors."
  - "'Misleading investors' is a normative and legal judgment that cannot be scored. Only the factual non-disclosure part is tested."
  - "'Revenue growth in their representative cloud platforms' is read alongside AI revenue, as in his own figures. His context says the labs drove about 40% of total Azure growth, so 'vast majority' is not applied to total cloud growth."
support_condition: Credible company figures or estimates show Anthropic and OpenAI supply the clear majority of AI revenue at all three companies, and none of the companies had disclosed this before 2026-08-04.
contradiction_condition: Credible figures show the two labs supply well under half of a company's AI revenue, or a company had disclosed its revenue from these labs to investors before the post.
measurement_requirements: Share of each company's AI revenue that comes from Anthropic and OpenAI, for FY2026 or calendar 2026, plus evidence of what each company disclosed before 2026-08-04.
source_requirements: Company filings or earnings releases where they exist. Otherwise reputable reports of analyst estimates. The speaker's own writing does not count.
metric_scope:
  company: Microsoft, Alphabet (Google Cloud), Amazon (AWS)
  metric: Share of AI revenue coming from Anthropic and OpenAI
  currency: USD
  units: percent of AI revenue
  accounting_basis: estimate
