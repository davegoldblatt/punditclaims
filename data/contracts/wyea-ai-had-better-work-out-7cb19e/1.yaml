explicit_source_elements:
  - 80% of Anthropic and OpenAI’s enterprise revenues
  - come from loss-making AI startups
  - revenue growth is contingent on venture capital’s continued ability to fund their customers
evaluator_interpretation:
  - The claim combines a numerical customer-revenue assertion with a causal assertion about continued growth.
  - The ordinary reading concerns enterprise revenue actually earned, rather than customer counts, token volumes, or annualized revenue.
  - For the ongoing revenue assertion, use Q3 2026, the latest completed calendar quarter before the post. The speaker supplies no reporting period.
  - Test each lab separately where possible; a combined result could conceal substantial differences.
  - Venture funding must sustain the relevant customers' spending sufficiently to make continued lab revenue growth dependent on it. Customer concentration alone does not establish that dependence.
  - The supplied passage does not identify an accounting basis or directly attribute the 80% figure to a company or analyst.
support_condition: Representative revenue records show approximately 80% of enterprise revenue coming from loss-making AI startups, with customer financial and funding records establishing the claimed dependence of revenue growth on continued venture funding.
contradiction_condition: Comparable revenue records show a materially different customer share, or evidence establishes that the claimed growth dependence does not hold. Concentration among large customers alone neither supports nor contradicts the startup-loss assertion.
measurement_requirements: Enterprise revenue by customer, matched to customer business type, ownership, profitability, funding, and model spending. Keep realized revenue separate from payment samples and annualized run rates.
source_requirements: Company disclosures or a documented representative dataset, supplemented by customer financial records. Identify coverage, reporting period, and accounting treatment.
