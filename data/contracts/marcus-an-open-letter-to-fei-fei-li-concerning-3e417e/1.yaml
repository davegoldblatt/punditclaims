explicit_source_elements:
  - required only to implement
  - reasonable safeguards
  - against these severe risks
  - not to fully mitigate them
evaluator_interpretation:
  - Read 'not to fully mitigate' as not requiring elimination of every possibility of critical harm.
  - In context, 'only' contrasts reasonable risk reduction with complete prevention; it does not deny separate testing, reporting, certification or other procedural duties.
  - Use the July 3 amendment, the latest published version before the August 10 post.
support_condition: The applicable safeguards and release standards require reasonable precautions against critical harms and unreasonable risks, without guaranteeing zero residual risk.
contradiction_condition: The applicable provisions require complete elimination of critical-harm risk despite reasonable precautions, or impose an unqualified guarantee that such harm cannot occur.
measurement_requirements: Examine safeguards alongside release restrictions and assurance requirements. Do not substitute later reasonable-care amendments for the earlier wording.
source_requirements: Contemporaneous legislative provisions or reliable legal analysis identifying the applicable version.
