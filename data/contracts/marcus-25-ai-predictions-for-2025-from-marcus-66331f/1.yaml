assessment_axis: forecast_outcome
explicit_source_elements:
  - The US will continue
  - very little regulation
  - protecting its consumers
  - from the risks of generative AI
  - where we will be at the end of this year
evaluator_interpretation:
  - "Plain reading: through the end of 2025, the US would have no broad, binding rules that protect consumers from generative-AI risks. Any protections would stay narrow, partial, or not yet in force."
  - Federal law and state law both count. A few narrow statutes do not by themselves make the forecast false. A comprehensive federal or widely applicable consumer-protection regime for generative AI in force during 2025 would.
support_condition: By end-2025 there is no comprehensive federal law on generative-AI consumer risks. Federal policy stays light-touch or deregulatory. State rules are narrow, piecemeal, or not yet in force.
contradiction_condition: During 2025 the US enacts and brings into force broad, binding consumer protections against generative-AI risks, such as a federal AI consumer-protection statute or widely applicable state regimes in effect.
measurement_requirements: Status of US federal AI legislation and executive policy in 2025, and the scope and effective dates of major state generative-AI laws.
source_requirements: Official White House, legislative, or state government releases; law-firm or policy analyses as secondary support.
