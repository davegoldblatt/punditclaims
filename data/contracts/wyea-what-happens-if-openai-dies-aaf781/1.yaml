assessment_axis: forecast_outcome
explicit_source_elements:
  - For any of these things to happen
  - OpenAI will have to
  - per The Information’s reported projections
  - 10x its revenue
  - between now and the end of 2030
evaluator_interpretation:
  - Assess the main assertion as a conditional requirement for survival, fulfillment of obligations, or an IPO, rather than merely checking the arithmetic of reported projections.
  - Use realized calendar-year 2030 revenue against realized calendar-year 2026 revenue. The surrounding annual projections make this a reasonable reading, but 'now' could instead mean a current run rate.
  - "'Effectively 10x' means approximately tenfold, without inventing a precise tolerance."
  - Survival means continued operation through the horizon. Paying some current bills is not fulfillment of all the obligations invoked.
  - The attribution to The Information is a separate historical component. Correctly describing projections would not establish the necessity of achieving them.
support_condition: At least one specified business outcome occurs within the relevant period, revenue grows approximately tenfold on a consistent basis, and evidence establishes that this growth was necessary rather than merely coincident.
contradiction_condition: A specified business outcome is achieved and the completed 2030 comparison shows revenue materially below tenfold growth. Earlier revenue below the threshold alone cannot refute an end-2030 requirement.
measurement_requirements: Comparable realized annual revenue for 2026 and 2030, with consistent treatment of partner revenue, plus documented survival, fulfillment of the relevant obligations, or an IPO.
source_requirements: Financial statements and records establishing the qualifying business outcome. The original dated projection report is needed to settle the separate attribution.
metric_scope:
  company: OpenAI
  metric: Annual revenue growth, 2030 relative to 2026
  currency: USD
  units: multiple
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: between now and the end of 2030
horizon_interval:
  start: 2026-08-18
  end: 2030-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires evidence fixing both a qualifying business outcome and the full revenue comparison. An interim IPO, revenue run rate, or revised projection alone cannot settle the end-2030 requirement.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Conditional forecast versus historical description of projections.
  - "'Now' could mean 2026 annual revenue or the publication-time run rate."
  - No precise tolerance for 'effectively 10x'.
  - The referenced business outcomes have different completion dates.
  - Gross versus net partner-revenue presentation is unspecified.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
