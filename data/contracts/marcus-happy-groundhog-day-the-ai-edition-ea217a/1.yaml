assessment_axis: historical_observation
explicit_source_elements:
  - Not sure how much has changed
  - hacks that were once written by graduate students
  - now farmed out to sweatshops
  - a new form of handcrafting
evaluator_interpretation:
  - The uncertainty concerns how much AI has changed. The outsourcing assertion is affirmative, not a conditional forecast.
  - The plain reading is that AI companies increasingly use outsourced workers under poor conditions to supply corrective human input formerly supplied by academic programmers. It does not require every contractor to work under such conditions.
  - Handcrafting includes human-written training examples and corrective labels; this is an analogy, not an assertion that labeling and programming are technically identical.
  - For the ongoing state described as now, use January 2023, the latest complete month before publication. Earlier employment and academic work provide historical context.
support_condition: Evidence establishes contemporary outsourcing of corrective AI work under poor working conditions and documents the asserted shift from academic programming to this workforce.
contradiction_condition: Comparable historical and contemporary evidence shows that the asserted shift did not occur, or that the supposedly exploitative corrective outsourcing was materially misdescribed.
measurement_requirements: Identify workers' tasks, employment arrangements and working conditions. Low nominal dollar wages alone do not establish exploitative conditions. Establish a historical comparison without requiring literal replacement of individual graduate students.
source_requirements: Prefer contracts, research methods and worker records. Investigative reporting is acceptable where underlying employment records are not public; include relevant employer responses.
