evaluator_interpretation:
  - The surrounding argument explicitly discusses 2024 revenue after excluding the two largest customers. Preserve that narrower scope rather than treating this as a claim of zero company-wide revenue.
  - The ordinary contextual reading is that those remaining sales are insufficiently substantial for the scale of the business being discussed.
  - Revenue and demand are distinct. Recognized sales establish commercial activity, but do not establish utilization, customer diversity, profitability, or adequate demand at the company's scale.
  - Use fiscal 2024, the reporting year expressly discussed in the surrounding text.
  - Use company_reported accounting basis because the surrounding argument cites company filing figures.
support_condition: Reported sales outside the two largest customers, together with utilization and customer evidence, show commercially insubstantial demand relative to the business's operating scale.
contradiction_condition: Comparable sales and customer evidence establish substantial service demand outside the two largest customers at that operating scale.
measurement_requirements: Realized annual revenue excluding the two largest customers, customer concentration, utilization, and a defensible comparison with the business's scale. Keep commitments separate from revenue.
source_requirements: Company financial statements and customer disclosures, supplemented by independent customer or utilization evidence.
