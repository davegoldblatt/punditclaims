support_condition: Not scorable. Under a strict reading, evidence that LLM deployments in summer 2025 all relied on human oversight, escalation or correction would fit.
contradiction_condition: Not scorable. Under a loose reading, evidence of LLMs completing tasks end-to-end with no human step, such as customer-service bots resolving most chats on their own, would cut against it.
