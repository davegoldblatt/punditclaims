assessment_axis: forecast_outcome
explicit_source_elements:
  - Stargate currently only has around 200MW of power
  - The Information reports that power won't be available for a year or more
evaluator_interpretation:
  - "Part 1 (current state): in March 2026 Stargate Abilene had only about 200MW operating."
  - "Part 2 (forecast): plain reading is that more power at Abilene, beyond about 200MW, would not be available for at least a year after the post, i.e., not before about March 10, 2027."
  - The Information's report, as summarized elsewhere, was about power for six additional expansion buildings. A reader of his sentence would take it to mean the Stargate site as a whole, so I use that plain reading and flag the difference.
support_condition: About 200MW operating around March 2026, and no meaningful added power at Abilene before about March 2027.
contradiction_condition: Abilene had much more than 200MW in March 2026, or substantially more power came online there before March 2027.
measurement_requirements: Oracle and Crusoe statements on megawatts operating or delivered at Abilene, March 2026 to October 2026.
source_requirements: Oracle statements and earnings calls, reported by Epoch AI and trackers; The Information's report via secondary coverage.
metric_scope: null
original_horizon: for a year or more
horizon_interval:
  start: 2026-03-10
  end: 2027-03-10
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: If, before March 10, 2027, Oracle or Crusoe report that substantially more than about 200MW is operating or delivered at Abilene, the forecast that more power would not arrive for a year is contradicted.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'That power' could mean power for the whole site or, as The Information reportedly meant, power for six extra expansion buildings."
  - "'Delivered' buildings (Oracle's term) may not mean every megawatt is energized, though delivered buildings have GPUs installed."
retrospective_or_prospective: retrospective
