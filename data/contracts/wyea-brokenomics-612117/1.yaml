  precision: day
target_period: null
condition_status: met
early_resolution_rule: Early support requires definitive failures following documented slowdowns and evidence validating the numerical requirement. Early contradiction requires an irreversible settlement or discharge of the relevant commitments demonstrating that the stated revenue minimum was unnecessary. Continued operation alone does not settle the claim early.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The growth measure and comparison interval are unspecified.
  - It is unclear whether the slowdown must affect both companies.
  - The 2029 deadline explicitly qualifies revenue; applying it to the fatality prediction is an evaluator interpretation.
  - The commitment payment schedule and accounting basis are unspecified.
  - The relationship between projected revenue and necessary revenue is not established.
