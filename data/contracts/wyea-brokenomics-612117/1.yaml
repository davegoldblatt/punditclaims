assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI and Anthropic
  - combined $358 billion in annual revenue by 2029
  - $1.1 trillion in compute commitments
  - Any slowdown in their growth
  - would be fatal
evaluator_interpretation:
  - Annual revenue means revenue earned over a year, not an annualized monthly run rate.
  - Read 'by 2029' as no later than December 31, 2029.
  - Read 'fatal' as insolvency or cessation of the affected company's business, rather than losses, a lower valuation, or slower expansion.
  - Read 'any slowdown' as including a decline in either company's revenue growth rate. The source does not specify a growth measure or comparison interval.
  - The numerical requirement is a claim of financial necessity. Merely reaching the stated revenue would not establish that it was necessary.
  - The supplied passage does not establish an accounting basis for the financial requirement.
support_condition: Comparable commitment schedules and financial records establish the $1.1 trillion obligation and the necessity of $358 billion in combined annual revenue by 2029, and documented revenue slowdowns cause the predicted business failures within the adopted horizon.
contradiction_condition: Comparable records establish that the companies can discharge the relevant commitments with less annual revenue, or the affected companies remain financially viable through the deadline after a documented slowdown. Temporary survival before the deadline is insufficient.
measurement_requirements: Actual annual revenue, comparable quarterly or annual growth rates, binding compute payment schedules, financing and cash resources, and dated insolvency or cessation records. Separate revenue projections from required cash payments and annualized run rates.
source_requirements: Prefer filings, contractual disclosures, and company financial records. Reporting about private financial records may establish a slowdown but cannot by itself validate the claimed revenue requirement.
metric_scope:
  company: OpenAI and Anthropic (combined)
  metric: Annual revenue required to meet compute commitments
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: calendar
