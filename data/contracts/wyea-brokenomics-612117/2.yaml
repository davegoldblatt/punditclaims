assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI and Anthropic
  - need to make a combined $358 billion in annual revenue by 2029
  - to keep up with their $1.1 trillion in compute commitments
  - Any slowdown in their growth
  - would be fatal to two companies
evaluator_interpretation:
  - "The passage makes two commitments. (1) A necessity claim: unless the two companies together reach about $358B in annual revenue by 2029, they cannot keep up with their compute commitments. (2) A conditional forecast: if either company's revenue growth slows, that company will fail."
  - "'By 2029' is read as annual revenue for calendar 2029. 'Keep up with' is read as paying compute obligations as they fall due without default, forced renegotiation, or rescue."
  - "'Slowdown in their growth' is read as a real, sustained slowdown that takes a company off the path to the 2029 need. A lower percentage growth rate on a much larger base, with growth still very fast, does not clearly qualify."
  - "'Fatal' is read as insolvency, bankruptcy, a distressed sale, or default on compute commitments. He gave no date for the failure, so a company surviving for a while after a slowdown does not contradict the forecast."
support_condition: After a documented, sustained slowdown in revenue growth, OpenAI or Anthropic becomes insolvent, files for bankruptcy, is sold in distress, or defaults on its compute commitments. Or the two companies' combined 2029 revenue falls well short of about $358B and they fail to meet their compute commitments.
contradiction_condition: Combined calendar-2029 revenue falls well short of about $358B, yet both companies meet their compute commitments without default, forced renegotiation, or rescue. The undated 'fatal' part cannot be firmly contradicted by survival alone. At most it is weakened if both companies stay solvent through end-2029 after a clear, sustained slowdown.
measurement_requirements: Audited or company-reported annual revenue for OpenAI and Anthropic for calendar 2029. Disclosures of compute obligations and whether they were paid, renegotiated, or defaulted on. Documented revenue growth series showing whether and when a sustained slowdown happened. Solvency events (bankruptcy, insolvency, distressed sale).
source_requirements: Company filings (S-1, 10-K) or company disclosures. Reputable financial press only where no filing exists.
metric_scope:
  company: OpenAI and Anthropic (combined)
  metric: annual revenue needed to cover compute commitments
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2029-01-01
  period_end: 2029-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: by 2029
horizon_interval:
  start: 2026-06-15
  end: 2029-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: "Before 2029-12-31: if, after a documented sustained slowdown in revenue growth, OpenAI or Anthropic files for bankruptcy, is declared insolvent, is sold in distress, or defaults on its compute commitments, the forecast is supported early."
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Slowdown in their growth' is undefined: a lower percentage growth rate versus falling below the path needed for 2029."
  - "'Fatal' has no date."
  - $358B is the speaker's own calculation; it is unclear whether 'keep up with' means paying obligations or breaking even.
  - "'By 2029' could mean revenue in calendar 2029 or a run rate reached by then."
retrospective_or_prospective: prospective
