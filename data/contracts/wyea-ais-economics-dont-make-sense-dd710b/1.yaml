assessment_axis: historical_observation
explicit_source_elements:
  - Cursor
  - negative 23% gross margins as of January
  - negative 31% if you include the cost of non-paying users
evaluator_interpretation:
  - January means January 2026.
  - As of January identifies the reporting endpoint; it does not unambiguously specify a January-only monthly calculation.
  - Both figures must use the same revenue denominator, with the second adding the costs of serving non-paying users.
  - The linked press reporting makes estimate the appropriate accounting basis.
  - The percentages are read as rounded whole-percentage figures.
support_condition: Reliable reporting or financial records establish both approximately -23% gross margin and approximately -31% after including free-user service costs for the reporting period ending in January 2026.
contradiction_condition: Comparable records establish materially different margins for that period or show that the two figures use incompatible periods or cost definitions.
measurement_requirements: Revenue, paid-user service costs, free-user service costs, and the reporting period. The gross-margin formula must be consistent between the two figures.
source_requirements: Prefer Cursor financial records; document-based reporting is acceptable. Search snippets and inaccessible articles cannot serve as cited evidence.
