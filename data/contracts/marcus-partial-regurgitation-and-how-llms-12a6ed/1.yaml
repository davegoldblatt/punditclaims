explicit_source_elements:
  - This particular LLM
  - doesn’t know what Elmer’s glue is
  - nor why one would find it offputting to find it in a pizza
evaluator_interpretation:
  - The target is the Google AI Overviews model implicated in the pizza response, as it existed when the post appeared on May 23, 2024.
  - "The plain reading is a claim about the model's basic knowledge: it cannot reliably identify Elmer’s glue as an adhesive or explain why people would object to it as a pizza ingredient."
  - The surrounding discussion also attributes the response to a failure to recognize joking advice. That supplies context for the knowledge claim, rather than a separate claim to grade.
  - I use the post date as a snapshot of the ongoing capability being described. A single erroneous answer establishes a failure on that occasion, but does not by itself establish an absence of the underlying knowledge.
support_condition: Tests of the implicated historical model consistently show that it cannot identify Elmer’s glue or explain ordinary objections to putting it in pizza, across straightforward questions and relevant variations. The evidence must distinguish missing knowledge from a failure to apply knowledge while summarizing retrieved material.
contradiction_condition: Reproducible tests of the same historical model show that it reliably identifies Elmer’s glue and explains why it is an objectionable pizza ingredient, including when evaluating the joking recipe.
measurement_requirements: Identify the model version and relevant system configuration. Preserve prompts, retrieved material and complete responses. Test direct questions and paraphrases without supplying the answers, and distinguish the model's abilities from the behavior of the complete search system.
source_requirements: Public test records or evaluations of the implicated May 2024 system, available by October 28, 2026. Later reporting may document historical behavior, but tests of later models cannot settle this observation.
