assessment_axis: historical_observation
explicit_source_elements:
  - nothing thus far in existing US law
  - companies should not be able to make decisions of potentially enormous magnitude on their own
  - external advisory bodies should have a strong say in weighing risks versus benefits
evaluator_interpretation:
  - The ordinary contextual reading concerns external oversight of consequential frontier AI development and release decisions.
  - A qualifying law must give an external body meaningful influence over those company decisions. Merely advising the government or regulating particular downstream uses does not necessarily qualify.
  - US law includes federal and state law; the speaker did not expressly restrict the claim to federal statutes.
  - Because this describes existing law without a reporting period, the target is the legal position on the publication date, August 23, 2024.
support_condition: A sufficiently comprehensive review of applicable federal and state law establishes that no law then provided the described external oversight.
contradiction_condition: An applicable law in force on August 23, 2024 gave an external body meaningful authority over consequential frontier AI company decisions and their risks and benefits.
measurement_requirements: Distinguish enacted law from proposals, legal authority from voluntary commitments, and advisory influence from binding decision authority.
source_requirements: Applicable statutory or regulatory text and authoritative legal analysis addressing its scope and effective date.
