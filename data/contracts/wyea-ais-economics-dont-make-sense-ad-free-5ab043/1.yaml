explicit_source_elements:
  - OpenAI and Anthropic
  - demand accounts for 50%
  - AI data centers under construction
  - a massive systemic weakness if either of them lacks the money to pay
evaluator_interpretation:
  - The surrounding discussion uses gigawatts, so the primary reading is share of capacity under construction, rather than share of buildings.
  - The observation concerns the construction inventory current in April 2026 through publication. Projects merely announced and capacity already operating are excluded.
  - No geography is specified; I read the claim as global rather than silently restricting it to the United States.
  - The payment-risk clause asserts exposure to customer concentration. It does not predict that either company will actually default.
  - The hedged statement about whether other customers exist is not converted into a categorical claim that there are no other customers.
support_condition: A matched April construction inventory shows approximately half of relevant AI capacity attributable to OpenAI and Anthropic demand, with contractual or financing evidence of material exposure if either cannot pay.
contradiction_condition: A comparable and sufficiently complete April inventory places their combined share materially away from half, or evidence establishes that the asserted payment exposure is materially insulated.
measurement_requirements: Use a common snapshot, geography, capacity definition, and construction-status definition. Attribute ultimate demand without double-counting cloud providers and their customers. Distinguish contracted demand from inferred tenancy.
source_requirements: Project-level construction inventories, permits or physical-progress records, tenant commitments, and financing or guarantee disclosures. The speaker's own tally cannot independently verify the claim.
