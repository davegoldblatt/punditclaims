assessment_axis: causal_assessment
explicit_source_elements:
  - Rosie the Robot is not doing our housework
  - in part because
  - physical reasoning a household robot would need
  - can’t be done purely by running simulations
evaluator_interpretation:
  - Rosie means a general-purpose robot reliably performing varied household chores autonomously. Specialized appliances do not settle this claim.
  - Purely running simulations means using physical simulation as the complete reasoning method. Training a policy partly on simulated data is a different proposition.
  - The claim requires a causal connection between simulation's reasoning limitations and the absence of reliable general-purpose household robots.
  - "For the ongoing state, use the latest completed research-reporting year before publication, through the post date: January 2024 to January 5, 2025."
support_condition: Evidence establishes a material limitation of simulation-only physical reasoning and connects that limitation to the lack of reliable general-purpose household robots.
contradiction_condition: A general-purpose household robot reliably supplies the required physical reasoning through simulation alone, or persuasive causal evidence rules out the asserted limitation as a contributing obstacle.
measurement_requirements: Separate physical reasoning from perception, control, hardware, training-data shortages, and deployment economics. Distinguish simulation-only reasoning from training that combines real and simulated experience.
source_requirements: Primary robotics studies or documented deployments with enough methodological detail to identify the role of simulation and the causes of failures.
