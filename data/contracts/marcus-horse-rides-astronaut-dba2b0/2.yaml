evaluator_interpretation:
  - In context, the ordinary reading concerns general, reliable compositional language understanding of the kind needed by systems such as Imagen. It does not deny that restricted semantic parsers can compose meanings.
  - Relevant abilities include understanding unfamiliar combinations, distinguishing reversed participant roles, and preserving meaning across sensible paraphrases. These are contextual illustrations, not an added numerical benchmark.
  - The observation describes the field's state on May 28, 2022. I use that date as the reporting snapshot; earlier experiments provide background rather than independently establishing the entire field's state that day.
  - I assess the factual assertion about what researchers knew how to build. The phrase about what is needed supplies its practical context, rather than a separate claim that one particular architecture is necessary.
support_condition: A sufficiently comprehensive assessment of methods available by the post establishes that general, reliable composition of sentence meanings from parts and syntax remained unsolved. Failures in selected systems alone do not establish that nobody knew how to build such a system.
contradiction_condition: A documented method available by May 28, 2022 demonstrates reliable, syntax-sensitive composition across varied ordinary language, including unfamiliar combinations and sensible paraphrases. Success confined to a restricted grammar or benchmark is insufficient by itself.
measurement_requirements: Examine semantic interpretation and generalization across constructions and domains. Distinguish limited benchmark success from broad reliability, and image-generation errors from demonstrated failures of language interpretation. Do not impose perfect accuracy or an arbitrary numerical threshold.
source_requirements: Primary research or documented systems establishing capabilities available by the post, or later historical assessments explicitly addressing that period. All evidence must have been available by October 28, 2026.
