assessment_axis: forecast_outcome
explicit_source_elements:
  - AGI by 2029
  - I offered to bet him a $100,000 he was wrong
  - quintupled my bet, to $500,000
evaluator_interpretation:
  - Assess the forecast that AGI would not arrive by the end of 2029. The personal stakes are background, not a company financial claim.
  - "Use the original published offer's operational test: success on at least three of five tasks involving movie comprehension, novel comprehension, cooking in an arbitrary kitchen, reliably producing more than 10,000 lines of bug-free code, and formalizing arbitrary mathematical proofs."
  - The original offer left detailed ground rules open. Its explicit single-system requirement was added in June 2024 and is not treated as an original 2022 stipulation.
  - I think expresses uncertainty; it is not an antecedent that must occur.
  - An eventual outcome can assess the forecast's direction, but cannot establish whether its original probability judgment was well calibrated.
support_condition: At the end of 2029, credible evaluations establish that fewer than three of the five original task requirements have been met.
contradiction_condition: By the end of 2029, reproducible evaluations establish success on at least three original task requirements at their stated breadth and reliability.
measurement_requirements: Tests must assess full task requirements, including reliability, unfamiliar cases, arbitrary kitchens or proofs where specified, and the coding restriction against merely assembling existing libraries.
source_requirements: Independent evaluations or reproducible demonstrations with disclosed protocols. An assertion that AGI has arrived or a score on an unrelated benchmark is insufficient.
metric_scope: null
original_horizon: by 2029
horizon_interval:
  start: 2022-09-14
  end: 2029-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An independently verified demonstration satisfying at least three original task requirements before the deadline can contradict the forecast early. Lack of such a demonstration cannot support it early.
interpretation_determines_result: false
ambiguity_flags:
  - AGI has no agreed definition.
  - The original offer did not finalize task protocols or reliability thresholds.
  - The linked offer contains a single-system clarification added in June 2024.
  - A probabilistic judgment is not conclusively validated or invalidated by one realized outcome.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
