explicit_source_elements:
  - no
  - profitable
  - generative AI companies
evaluator_interpretation:
  - Read companies as businesses principally developing generative models or selling products built on them, including application companies.
  - The ordinary reading of profitable is positive company-wide net income after expenses, rather than revenue growth, gross profit, or positive cash flow.
  - Use July–September 2025, the latest completed calendar quarter that could ordinarily have been financially reported before the December 31 post.
  - The sentence supplies no accounting basis. Do not silently substitute company-defined profitability or an adjusted measure.
  - Treat the retrospective as repeating a current claim; the linked July essay creates some uncertainty about whether only the earlier period was intended.
support_condition: Comparable financial records show no positive company-wide net income among the defined companies during the target period, with sufficient coverage to substantiate the universal claim.
contradiction_condition: At least one qualifying company has documented positive company-wide net income in the target period on an accounting basis matching the claim.
measurement_requirements: Identify the reporting period, accounting basis, and whether profit includes all company expenses. Revenue, ARR, gross margins, and cash balances do not settle net profitability.
source_requirements: Financial statements or sufficiently specific company financial disclosures. General assertions of profitability are leads unless their period and measure can be established.
