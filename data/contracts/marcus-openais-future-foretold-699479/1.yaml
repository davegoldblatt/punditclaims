explicit_source_elements:
  - schoolchildren using ChatGPT to do their homework
  - aren’t enough to cover that
  - They are burning money, billions a month
evaluator_interpretation:
  - The ordinary reading is that revenue attributable to schoolchildren's homework use cannot cover OpenAI's contemporaneous costs or cash shortfall.
  - Use April–June 2025, the latest completed calendar quarter before the post, as the reporting window for this ongoing observation.
  - Treat schoolchildren as school-age students, rather than all consumers or all university students.
  - The surrounding financial figures come from press reporting, so the accounting basis is estimate.
  - Costs and net cash burn are separate comparisons. Revenue below total costs does not establish revenue below net cash burn.
support_condition: Comparable evidence shows homework-attributable revenue below OpenAI's costs and net cash burn in the target period. A documented upper bound on homework revenue can suffice.
contradiction_condition: Comparable evidence shows homework-attributable revenue sufficient to cover both quantities in the target period.
measurement_requirements: Realized homework-attributable revenue, total costs, and net cash burn for the same quarter. Do not substitute annualized revenue, financing, or projected multiyear spending.
source_requirements: Company financial disclosures or reputable reporting with identifiable financial sources and a defensible allocation to schoolchildren's homework use.
