explicit_source_elements:
  - the leading chess AI, Stockfish
  - for the last several years
  - a neurosymbolic hybrid model
  - using a neural network to evaluate moves
  - a symbolic infrastructure to search moves
evaluator_interpretation:
  - "Neurosymbolic hybrid is read in the concrete sense Marcus immediately supplies: neural evaluation combined with explicit chess-state search."
  - Evaluating moves includes evaluating the resulting board positions during search.
  - Leading means a top competitive chess engine, supported by major championship performance; it does not require winning every game or every event.
  - Several years is read as a multiyear period before June 2025. The target window begins in 2020 to encompass that recent history; this is not a claim that the architecture existed throughout every day of 2020.
support_condition: Dated releases and source code establish neural evaluation combined with explicit chess search over several years before the post, and competitive results establish leading status.
contradiction_condition: Dated records show that the neural-plus-symbolic architecture was absent or only recently adopted, or competitive evidence makes the description of Stockfish as a leading engine untenable.
measurement_requirements: Check release dates, default evaluation behavior, version-pinned search code, and major competition results available before the post.
source_requirements: Prefer official release announcements and version-pinned source code. Use competition records or clearly identified independent reporting for playing strength.
