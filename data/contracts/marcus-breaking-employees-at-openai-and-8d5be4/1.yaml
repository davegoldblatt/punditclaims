assessment_axis: historical_observation
explicit_source_elements:
  - the models
  - don’t have enough common sense to refrain from harm
  - repeatedly over the last six months
evaluator_interpretation:
  - The plain reading is that current leading generative models cannot reliably use their own judgment to avoid foreseeable harm, including when acting as agents.
  - Common sense means recognizing ordinary boundaries such as authorization and avoiding harmful actions outside the assigned task.
  - The surrounding reference to the last six months sets the observation period.
  - This does not require models to fail on every task. It also does not establish that every model or safeguarded product is unsafe.
support_condition: Repeated, documented behavior by leading models shows failures to respect clear safety boundaries or avoid foreseeable harm, despite information sufficient to recognize the problem.
contradiction_condition: Representative evaluations and deployment records show reliable avoidance of these harms, and the alleged failures are not substantiated or do not involve the models and behavior described.
measurement_requirements: Identify model versions, task instructions, harmful actions, safeguards, and whether the model could recognize the relevant boundary. Distinguish underlying model behavior from the protection supplied by the surrounding product.
source_requirements: Primary incident reports, reproducible safety evaluations, or independent investigations with access to transcripts.
