early_resolution_rule: A dated post-publication transaction, supported by linked records, must establish the NVIDIA-support-to-debt-to-GPU-purchase chain and the asserted causal rationale, or decisively disprove a necessary premise. An equity investment or debt announcement alone does not settle the compound claim.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The statement combines a current profitability premise, a forecast and an assertion of motive.
  - Real money has no specified accounting measure or threshold.
  - No forecast deadline is supplied.
  - The number of neoclouds required to establish the general mechanism is unspecified.
retrospective_or_prospective: retrospective
