assessment_axis: causal_assessment
explicit_source_elements:
  - On the national front
  - regulation that might protect consumers
  - is being slowed
  - pressure to make sure that US generative AI develops as quickly as possible
evaluator_interpretation:
  - Read 'national' as US federal policymaking before publication.
  - The claim requires development-speed concerns to have contributed to a delay. They need not have been its only cause.
  - Statements favoring innovation, consultation, or voluntary safeguards do not by themselves demonstrate that a consumer-protection measure was delayed.
support_condition: Identify a consumer-protection proposal or regulatory action delayed before the post, with records linking that delay to pressure to accelerate or preserve US generative-AI development.
contradiction_condition: A sufficiently comprehensive record shows that the alleged delays did not occur, or that development-speed pressure did not contribute to them.
measurement_requirements: Identify the affected measure, its expected and actual progress, the relevant decision, and evidence connecting that decision to development-speed pressure.
source_requirements: Prefer legislative records, agency documents, correspondence, and contemporaneous statements by participants. Reporting must distinguish documented causation from commentary.
