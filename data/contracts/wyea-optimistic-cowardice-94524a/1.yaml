explicit_source_elements:
  - the end of hyper-growth
  - a massive reckoning for the valuations of tech companies
  - tens of thousands of layoffs
  - a prolonged depression in Silicon Valley
  - the likes of which we've never seen
evaluator_interpretation:
  - This is a conditional prediction of a causal sequence, with no deadline.
  - The ordinary reading requires a broad end to exceptional tech-industry growth, followed by a substantial valuation decline that causes at least 20,000 layoffs and an exceptionally severe, sustained regional downturn.
  - A slowdown at selected companies or layoffs alone would not establish the antecedent or the complete prediction.
  - The speaker supplies no growth measure, valuation threshold, regional boundary, duration or historical comparison method. I do not invent numerical thresholds for those terms.
support_condition: "Evidence establishes the end of industry-wide hyper-growth and the subsequent causal sequence: a major valuation correction, tens of thousands of resulting layoffs, and a sustained Silicon Valley contraction exceeding previous regional downturns in severity and duration."
contradiction_condition: After the antecedent is established, a completed economic episode would need to decisively rule out the predicted sequence. Continued growth or the absence of a depression by an evaluator-selected date does not falsify this undated forecast.
measurement_requirements: Consistent industry growth and valuation series, dated layoff records, regional employment and output measures, historical comparisons, and evidence connecting the proposed causes and effects.
source_requirements: Prefer official employment and output data and independently maintained valuation series. Distinguish gross layoffs from net employment changes.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve in support only if a dated, completed episode establishes the antecedent and every material consequence, including the unprecedented prolonged regional downturn and causal connection. Layoffs alone cannot resolve it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Hyper-growth has no specified measure or threshold.
  - Massive, prolonged and unprecedented have no specified comparison rules.
  - Silicon Valley's geographic boundary is unspecified.
  - No forecast deadline is stated.
