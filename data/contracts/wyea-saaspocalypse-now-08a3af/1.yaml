explicit_source_elements:
  - most of these companies
  - have to effectively double prices to offer AI
  - hard to imagine
  - already problematically-expensive to maintain
evaluator_interpretation:
  - Most means more than half of the relevant SaaS providers, not merely the examples selected in the post.
  - Effectively double means approximately twice the total subscription price for comparable access, seats and billing terms after adding AI.
  - The maintenance-cost inference requires direct evidence of material economic pressure; a high selling price alone cannot establish high maintenance costs.
  - For operating costs, use each provider's latest reported quarter available before publication. Because the claim supplies no provider list or fiscal calendar, the target period encompasses the recent reporting periods and contemporaneous tariffs through publication; individual source periods remain separately identified.
support_condition: A representative contemporaneous provider comparison establishes approximately doubled total prices for a majority, and matched cost disclosures establish material maintenance-cost pressure.
contradiction_condition: A representative comparison establishes that a majority did not approximately double comparable prices, or matched operating evidence directly rejects the claimed maintenance-cost pressure.
measurement_requirements: A defined provider denominator, archived base and AI-inclusive prices under identical billing terms, and separate measurements of inference, hosting and maintenance costs relative to associated revenue.
source_requirements: Dated company price schedules and financial disclosures. List-price premiums must not be used as substitutes for costs or margins.
