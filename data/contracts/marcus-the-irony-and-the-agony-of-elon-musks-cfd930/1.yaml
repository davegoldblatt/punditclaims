assessment_axis: historical_observation
explicit_source_elements:
  - The entity strayed from that mission
  - its original mission
  - in the early days
evaluator_interpretation:
  - In context, the ordinary reading is that OpenAI departed materially from its founding commitments concerning public benefit, nonprofit operation, financial independence and openness.
  - The comparison covers the December 2015 founding commitments and subsequent conduct through March 3, 2024, rather than one recent reporting period.
  - Strayed is assessed as a documented departure in commitments or practice, not as a moral judgment or a finding that Musk's lawsuit should succeed.
  - Qualified commitments to openness are not treated as an unconditional promise to release every model.
support_condition: Documented operations by March 3, 2024 materially depart from the founding commitments identified in context, including commercialization or restrictions on access to research and models.
contradiction_condition: Records show that the relevant founding commitments remained operative or that the allegedly inconsistent conduct fell within their stated qualifications. Continued nonprofit control and public-benefit obligations contradict departure in those components.
measurement_requirements: Compare original language, including qualifications, with actual release policies and governance arrangements. Distinguish commercial activity from abandonment of charitable purpose.
source_requirements: Primary founding documents, product announcements and governance disclosures. Allegations in litigation do not establish the alleged breach.
