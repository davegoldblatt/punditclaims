explicit_source_elements:
  - still don’t convey genuine comprehension
  - and so
  - very easy
  - anyone else who cares to try
  - to break
evaluator_interpretation:
  - The ordinary behavioral reading is that interested users could readily elicit clear factual or commonsense errors from the contemporary models.
  - The words 'and so' additionally attribute those failures to missing comprehension. Demonstrating errors alone does not establish that explanation.
  - The historical scope is the continuation of the problems identified on August 22, 2020 through the post date, including the successors discussed in the post.
  - No numerical failure rate, testing budget, or independent measure of comprehension is supplied.
support_condition: Independent tests show readily reproducible failures in contemporary models, and evidence distinguishes absent comprehension as their cause from alternative explanations.
contradiction_condition: Representative tests show robust performance against ordinary attempts to elicit these failures, or controlled evidence undermines the proposed explanation that missing comprehension causes them.
measurement_requirements: Identify model versions, prompts, sampling settings, attempts and failures. Testing the causal component additionally requires an independently defined measure of comprehension and controls for competing explanations.
source_requirements: Independent evaluations and primary experimental reports. Marcus's own examples cannot independently establish the claim.
