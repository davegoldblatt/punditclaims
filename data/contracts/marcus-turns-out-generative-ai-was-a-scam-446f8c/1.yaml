evaluator_interpretation:
  - Read reliability as dependable factual and reasoning performance across ordinary intended uses, rather than perfect performance on every possible input.
  - Read properly solved as a durable general solution to a problem class, rather than an improvement on selected examples.
  - Use 2021-02-23 through publication for the explicit five-year retrospective. The earlier starting point implied by from the start is unspecified.
  - "Retain the universal commitment: evidence that some problems persist does not establish that none has been solved."
support_condition: Identify the substantive problems Marcus warned about during the stated period and show independently that every identified problem remained unresolved at publication, with historical evidence for persistent unreliability.
contradiction_condition: Show that at least one identified problem had a durable general solution by publication, or establish reliable performance that directly contradicts the claimed inherent limitation.
measurement_requirements: A documented inventory of warnings, problem-specific definitions of resolution, and independent evaluations. Distinguish improvements, narrow task solutions and general solutions.
source_requirements: Marcus's earlier statements may establish what he warned about, but independent research must establish whether those warnings remained applicable.
