assessment_axis: historical_observation
explicit_source_elements:
  - Every company is investing in AI
  - so far
  - most aren’t getting huge returns
evaluator_interpretation:
  - Assess the universal investment statement separately from the majority-returns statement.
  - Every is read literally, while acknowledging that it may be conversational exaggeration. Most means more than half.
  - Investing includes actual spending on AI tools, services or development, rather than merely considering or using AI.
  - Huge returns means substantial realized financial benefits relative to investment costs. No numerical threshold is invented.
  - Use 2025, the latest completed calendar year that could be broadly reported before the post, for the ongoing observation.
  - These are cross-business prevalence claims, not amounts in a named company's accounts; metric_scope is null.
support_condition: Evidence establishes universal AI investment and shows that more than half of companies have not realized substantial financial returns. Support for only the majority clause is identified separately.
contradiction_condition: Evidence of companies making no AI investment contradicts the universal clause. Evidence that most companies have realized substantial returns contradicts the majority clause. Opposite findings for the two clauses warrant mixed.
measurement_requirements: Measure actual investment separately from adoption or plans. For returns, distinguish realized material financial benefits from expectations, minor improvements and isolated successful projects.
source_requirements: Primary business surveys covering actual spending and realized benefits, with disclosed populations and limitations. A noninvesting subset can disprove universality without being globally representative.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01-01
  end: 2025-12-31
  precision: year
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Every company may be rhetorical rather than literal.
  - Huge returns has no numerical threshold.
  - Most could refer to all companies or only AI investors.
  - No geography or company-size restriction is supplied.
  - The evaluator selects the latest broadly reportable calendar year for the undated ongoing observation.
retrospective_or_prospective: retrospective
