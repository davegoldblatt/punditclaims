explicit_source_elements:
  - CoreWeave
  - requires a few billion dollars every two months or so
  - hand billions to IREN, Firmus, Nscale, Lambda
  - agree to rent said chips back
  - backstop Nscale’s lease with Anthropic
evaluator_interpretation:
  - The ordinary financial reading is that CoreWeave repeatedly needs several billion dollars of external funding to meet cash requirements. Announcing financing capacity alone does not establish that need.
  - The pronoun referring to funding neoclouds is read as NVIDIA, following the surrounding paragraph.
  - For the ongoing CoreWeave financial condition, use April–June 2026, the latest quarter with results published before the post's calendar date. Third-quarter results appeared on the post date; their availability before the post cannot be established without publication times.
  - The named NVIDIA arrangements are separate components. Investments, investment rights, rental commitments and guarantees must be distinguished.
  - The phrase timebomb expresses financial risk without specifying an insolvency test or deadline.
  - Dollars is read as USD. The speaker supplies no accounting basis or precise definition of required financing.
support_condition: Cash-flow and financing records establish recurring external funding requirements of several billion dollars approximately every two months, and transaction documents establish the named NVIDIA funding, rental and guarantee arrangements.
contradiction_condition: Comparable cash-flow and liquidity records show no such recurring funding requirement, or reliable transaction records establish that material named arrangements were absent or materially different from the asserted commitments.
measurement_requirements: Distinguish financing commitments from cash drawn, gross proceeds from refinancing, and funding for expansion from cash needed to meet existing obligations. Establish dates, counterparties and whether each NVIDIA arrangement was signed, contingent or completed.
source_requirements: Company cash-flow statements, financing agreements and counterparty disclosures; reputable reporting where agreements are private.
