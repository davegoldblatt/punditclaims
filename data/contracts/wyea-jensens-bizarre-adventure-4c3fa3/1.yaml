  - Same-day third-quarter results create a publication-time ambiguity.
  - Required financing could mean cash shortfalls, expansion funding or announced borrowing capacity.
  - A few billion and every two months or so are approximate.
  - Multiple companies and financial instruments cannot be represented by one comparable monetary measure.
