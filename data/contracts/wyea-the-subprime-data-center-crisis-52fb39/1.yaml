assessment_axis: forecast_outcome
explicit_source_elements:
  - Microsoft, Google, Meta and Amazon
  - building more capacity will cost them tens of billions of dollars
  - stopping building capacity
  - an immediate signal that they’ve overbuilt capacity
  - killing data center debt issuance
evaluator_interpretation:
  - The ordinary reading requires a material halt to capacity expansion by a named hyperscaler, rather than cancellation or delay of one project.
  - It is unclear whether one company's halt or a collective halt is required; both readings must be checked before scoring.
  - Killing issuance means a shutdown or near-shutdown of new data-center borrowing, not merely wider spreads.
  - Immediate requires a prompt, identifiable market response; no numerical time window is supplied.
  - The spending clause gives no accounting basis, period or allocation among the four companies. Dollars are read as US dollars from context.
support_condition: A qualifying halt occurs, investors promptly interpret it as evidence of overbuilding, and data-center debt issuance stops or nearly stops because of that signal. The spending clause requires separate comparable financial evidence.
contradiction_condition: A qualifying halt occurs, yet substantial new data-center debt issuance continues through the ensuing market response without the predicted shutdown.
measurement_requirements: Establish company-wide expansion decisions, dates, stated reasons, immediate market reactions and completed debt issuance before and after the halt. Distinguish announcements from completed financing and cancellations from company-wide cessation.
source_requirements: Company disclosures for the trigger; securities filings and comprehensive issuance data for financing outcomes; independent evidence connecting the market response to the halt.
metric_scope:
  company: Microsoft, Alphabet (Google), Meta Platforms and Amazon
  metric: Additional spending to build capacity; allocation among companies unspecified
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
