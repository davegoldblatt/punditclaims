  - costing the companies more to serve the tokens than you're paying them
evaluator_interpretation:
  - "'Here' refers to companies serving AI tokens through flat-price, all-you-can-eat subscriptions and agent use, including model providers and AI coding products."
  - "Plain reading: in the months before the post, many such companies, or many of their plans and customer segments, had very slim or negative gross margins on serving usage."
  - "'In many cases' is a hedge. Negative margins in some significant segments count toward support. A strong positive aggregate gross margin at a leading provider counts against the broad picture."
support_condition: Credible reporting or filings show gross margins near zero or negative for token-serving AI companies, or for major plans or customer segments, during roughly March to June 2026.
contradiction_condition: Credible filings show that the main providers had healthy gross margins on serving usage in that period, leaving few slim or negative cases.
measurement_requirements: Gross margin, meaning revenue minus the compute cost of serving. Not operating or net margin, which include training and other costs.
source_requirements: Company filings, or reputable reporting based on company financials.
