explicit_source_elements:
  - current AI tools
  - don’t replace an understanding of debugging
  - nor an understanding of system architecture
  - nor an understanding of what clients want
evaluator_interpretation:
  - The plain reading is that ordinary professional software development still requires human expertise in these three areas. Individual successful AI-generated fixes would not contradict it.
  - "I use the early-2025 reporting window through publication to assess 'current': January 1 through March 12, 2025."
  - Debugging benchmarks and implementation-proposal selection are relevant measures, but neither directly measures the whole process of designing architecture and discovering client requirements.
support_condition: Evaluations of tools available in the target period establish continuing material dependence on human expertise in debugging, architecture, and client requirements.
contradiction_condition: Representative deployments or evaluations show reliable performance without human expertise in one or more of the three expressly named areas.
measurement_requirements: Identify tool versions, task coverage, human assistance, and independently checked results. Distinguish implementing written requirements from discovering what clients want.
source_requirements: Prefer contemporary evaluations and deployment records. Later publications qualify only when their observations concern the target period.
