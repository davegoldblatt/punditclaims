explicit_source_elements:
  - training costs are increasing dramatically
  - training new models to bug fixes on existing ones
  - an ongoing cost
  - an essential and unavoidable cost of doing business
evaluator_interpretation:
  - Read this as a claim about frontier LLM developers continuing to develop and maintain competitive products, particularly OpenAI and Anthropic in the surrounding passage.
  - Use calendar 2025, the latest completed annual spending period before the post, with 2024 as the comparison baseline.
  - Read 'dramatically' as a large increase on a comparable basis; do not invent a precise percentage threshold.
  - Recurring expenditure can still be research and development. The quoted claim does not itself establish a GAAP cost-of-goods-sold classification.
  - Separate training and post-training from inference, total compute, and broader experimental R&D.
support_condition: Comparable expenditure histories show a large increase in training costs, and operational evidence establishes repeated training for new models and maintenance as a continuing requirement of these developers' businesses.
contradiction_condition: Comparable histories show training expenditure was stable or falling, or operational evidence establishes that the alleged continuing training requirement is materially absent.
measurement_requirements: Separate pretraining, post-training, maintenance, experimental research, and inference. Compare consistent annual cost categories and document actual model-update practices.
source_requirements: Company expenditure disclosures or transparent estimates, plus primary technical documentation of training and maintenance.
