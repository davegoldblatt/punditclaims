explicit_source_elements:
  - Reliability remain a problem.
  - whether the systems reliably deliver what they are asked for
evaluator_interpretation:
  - Reliability means consistently producing correct responses that satisfy explicit requests.
  - A material, recurring error rate supports this statement; occasional errors alone would not establish that every application is unreliable.
  - Use the latest completed calendar year and the publication-year period through the post as the reporting window for contemporary evaluations, since there is no standard reporting cycle.
support_condition: Repeated evaluations of contemporary LLMs show material failures to meet clear instructions or give correct answers.
contradiction_condition: Representative evaluations establish dependable instruction following and correctness across ordinary requests, with reported failures confined to defective tests or exceptional circumstances.
measurement_requirements: Explicit success criteria and reported results across multiple prompts; benchmark error rates must not be represented as universal real-world error rates.
source_requirements: Original benchmark results or documented evaluations available by the evaluation date and concerning the target period.
