assessment_axis: historical_observation
explicit_source_elements:
  - As of April 27 2026
  - only two buildings are operational and generating revenue
  - the third barely has any IT gear
  - I estimate the total cost
  - around $52.8 billion
evaluator_interpretation:
  - The observation concerns the original eight-building Stargate Abilene campus on April 27, excluding adjacent expansion projects.
  - Operational and generating revenue requires customer service and billing, not merely completed shells, energized equipment, or delivered GPUs.
  - Barely any IT gear means only a small fraction of the third building's intended equipment; the speaker supplies no numerical threshold.
  - The cost figure is an April estimate of the completed campus, including IT equipment in the surrounding discussion, rather than spending already incurred.
  - I do not treat the fact that the author made an estimate as proof that the estimate is accurate.
support_condition: Records applicable to April 27 establish that exactly two buildings were serving paying customers, that the third had little installed IT equipment, and that a comparable full-campus cost estimate was approximately $52.8 billion.
contradiction_condition: Comparable records establish a different operating-and-billing count, substantial installed equipment in the third building, or a materially different all-in project cost on the same basis.
measurement_requirements: Building-specific commissioning, customer-acceptance, equipment-inventory, and billing records for April 27. A cost breakdown must distinguish buildings, power infrastructure, IT equipment, financing, and future replacements.
source_requirements: Oracle or developer records, independent site reporting, or dated project-cost analysis. Satellite images alone cannot establish internal equipment inventories or revenue generation.
