ambiguity_flags:
  - Latest reportable quarter is an evaluator-selected period for the ongoing state.
  - True cost has no stated allocation method.
  - Most has no specified user population or geography.
  - Unaffordable could mean inability to pay or unwillingness to pay.
  - Mirage does not state how much demand must disappear.
  - The enterprise cost-pressure component does not identify particular customers.
