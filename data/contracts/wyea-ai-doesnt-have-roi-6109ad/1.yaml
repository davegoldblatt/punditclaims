assessment_axis: causal_assessment
explicit_source_elements:
  - LLMs run at their true cost
  - unaffordable for most
  - the demand for AI services is a mirage built on subsidized subscriptions
  - companies paying the actual costs are already screaming for mercy
evaluator_interpretation:
  - "The core assertion is causal: subsidies sustain demand that would largely disappear at prices covering the costs of providing comparable services."
  - True cost includes infrastructure, inference, personnel, and a defensible allocation of model development and other shared costs.
  - Most means more than half of the relevant existing users, not merely a few unusually intensive users.
  - Unaffordable concerns users' ability to sustain payment; unwillingness to buy is related but not identical.
  - Screaming for mercy is read as material customer cost pressure, such as curtailed deployments or documented budget overruns.
  - The current-state component is anchored to January through March 2026, the latest completed calendar quarter ordinarily reportable before the post. The price counterfactual concerns those users and services.
support_condition: Credible cost accounting and representative pricing or retention evidence show that subsidies explain most observed demand, that more than half of relevant users cannot afford comparable full-cost service, and that customers paying such prices experience material cost pressure.
contradiction_condition: Representative evidence shows substantial durable demand at verified full-cost prices and that most relevant users can afford comparable service. A profitable niche or a few satisfied customers alone would not settle the population-wide assertion.
measurement_requirements: Match service quality, usage limits, full costs, charged prices, customer incomes or budgets, and retention. Separate willingness to accept compensation from willingness or ability to pay.
source_requirements: Provider cost records combined with representative customer data or credible pricing experiments. Revenue growth, usage growth, and complaints alone cannot establish subsidy dependence.
metric_scope: null
original_horizon: null
horizon_interval: null
