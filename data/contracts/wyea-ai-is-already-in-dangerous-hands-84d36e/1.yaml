assessment_axis: historical_observation
explicit_source_elements:
  - Retweets of his post were clearly coordinated
  - with various AI safety organizations
  - look incredibly contrived
  - total lack of any direct critiques or “blown whistles”
  - other than that they “can do more safety” and “should coordinate a global slowdown”
evaluator_interpretation:
  - The central testable allegation is an arrangement to amplify the resignation post involving multiple AI safety organizations or representatives acting for them.
  - Coordination need not involve payment or occur before publication. Requests to organize retweets after publication could qualify.
  - Rapid sharing, shared donors and overlapping friendships do not alone establish an arrangement.
  - Looks contrived is an impression, not a separately scored factual allegation.
  - The subsidiary lack-of-criticism allegation requires distinguishing general safety warnings, which Zitron expressly excludes, from specific criticisms or disclosures.
  - The target is the September resignation-post episode through the September 14 publication date; the supplied passage does not specify its exact starting day.
support_condition: Authenticated messages, organizational disclosures or reliable firsthand reporting establish coordinated retweets involving multiple safety organizations. The subsidiary claim requires a sufficiently complete record of Coxon's statements through publication.
contradiction_condition: Reliable records establish independent amplification without the alleged arrangements, or contemporaneous statements identify specific criticisms outside the stated exceptions. A denial alone does not settle coordination.
measurement_requirements: Identify the post, participants, requests, timing and whether participants acted personally or for organizations.
source_requirements: Prefer communications and organizational records; use attributable interviews with their evidentiary limits stated.
