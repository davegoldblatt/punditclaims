ambiguity_flags:
  - Before announcement may mean before release; these are different periods.
  - The outlets and articles are not named in the supplied claim.
  - Credulously, done deal, and being given the truth do not specify which representations or omissions matter.
  - Let does not specify the strength of the causal contribution.
  - Ten thousand people may refer loosely to the initial preorder batch, but units and unique purchasers are different measures.
