evaluator_interpretation:
  - The surrounding discussion makes this a claim about the total cost of constructing and equipping a 1 GW AI facility for OpenAI.
  - It does not say that $10 billion cannot begin construction or serve as equity supporting additional debt and partner financing.
  - Assess contemporaneous cost estimates in September 2025 through September 28, the day before publication. The context explicitly discusses estimates reported the preceding week.
  - The accounting basis is estimate because the argument relies on press reports and analyst estimates, rather than audited project expenditure.
  - The construction schedule is unspecified. Metric period dates remain null because the amount is a whole-project budget, not expenditure during the September observation window.
support_condition: Credible contemporaneous estimates put the total cost of a comparable fully equipped 1 GW OpenAI AI facility substantially above $10 billion.
contradiction_condition: A credible comparable budget shows that $10 billion or less covers construction, power infrastructure and the required computing equipment for a fully equipped 1 GW facility.
measurement_requirements: Measure total project capital cost in US dollars, including accelerator systems and supporting infrastructure. Exclude comparisons based only on the building shell, initial equity, lease deposits or a smaller completed phase.
source_requirements: Prefer project budgets and company disclosures. Where no public itemized budget is available, use reputable reporting of clearly identified cost estimates and disclose that limitation.
