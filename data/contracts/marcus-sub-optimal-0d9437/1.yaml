assessment_axis: causal_assessment
explicit_source_elements:
  - We in AI have a long long way to go
  - Data and compute alone won’t be enough
evaluator_interpretation:
  - Enough refers to the surrounding goal of general intelligence and reliable common sense, especially in real-world robotics.
  - Data and compute alone means increasing those resources while holding the underlying learning and inference methods substantially fixed.
  - Long long way to go supplies no measurable distance or deadline and is treated as emphasis.
  - The claim concerns sufficiency, not whether additional data and compute are useful.
support_condition: Causal or theoretical evidence establishes that increasing data and compute within the existing approach is insufficient for the contextual capability target and that another essential ingredient is required.
contradiction_condition: A reproducibly evaluated system reaches the contextual goal through increases in data and compute alone, with adequate disclosure and controls excluding essential method changes.
measurement_requirements: Evaluate broad generalization and common sense, and separate resource scaling from changes to architecture, objectives, data construction, tools, memory and inference procedures.
source_requirements: Primary scaling experiments and technical disclosures, accompanied by independent capability evaluations.
