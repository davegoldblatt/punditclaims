evaluator_interpretation:
  - The firm deadline is December 31, 2029. The reference to the next decade is hedged and is not a separate firm prediction or condition.
  - The ordinary reading is a privately owned personal car earning fares through an operating driverless taxi service when its owner is not using it.
  - A qualifying service must operate without an onboard driver or remote human driver. Company-owned fleets, announcements and staged demonstrations do not establish personal-car moonlighting.
  - No minimum fleet size or geographic restriction is stated. I do not add a numerical scale threshold or require Level 5 capability for this claim.
support_condition: After December 31, 2029, sufficiently comprehensive operational evidence establishes that no qualifying personal-car taxi service operated during the forecast interval.
contradiction_condition: Dated records establish that privately owned personal cars actually earned passenger fares through a driverless taxi service before January 1, 2030.
measurement_requirements: Verify vehicle ownership, personal use, paid passenger service, operating dates, and whether onboard or remote humans performed the driving.
source_requirements: Prefer operator records and regulatory documents, corroborated by independent reporting or observation. Product announcements and planned launches cannot establish operation.
