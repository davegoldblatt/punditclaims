assessment_axis: forecast_outcome
explicit_source_elements:
  - the fact they haven’t worked out their business models
  - whatever you’re paying today
  - is guaranteed to change
evaluator_interpretation:
  - "Plain reading: the price people pay today for AI services (subscriptions and API) will change, because vendors have not settled their business models."
  - The context also treats lower value at the same price as a change. I note that reading but take the plain reading to be about what is paid, meaning price or plan terms.
  - No deadline is stated. Because the claim covers 'whatever you're paying', one vendor's change does not settle it. Settling it requires broad changes across the major services.
support_condition: After the post, the major AI services (for example ChatGPT, Claude, Gemini, Copilot, Cursor) change their prices or the plans users pay for, with the changes tied to business-model or cost pressure.
contradiction_condition: Over a long period, the main AI service prices and plan terms stay the same.
measurement_requirements: Dated list prices and plan terms for the major AI services, before and after the post.
source_requirements: Official pricing pages, vendor announcements, or price indexes built from them.
metric_scope:
  company: AI service vendors (multiple)
  metric: Price paid by users for AI subscriptions and API access
  currency: USD
  units: USD per month or per million tokens
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2026-08-25
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: not_applicable
