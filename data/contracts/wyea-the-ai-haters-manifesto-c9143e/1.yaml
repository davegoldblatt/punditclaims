early_resolution_rule: Settled early only if, after the post, several of the leading AI services (at least three of OpenAI, Anthropic, Google, Microsoft/GitHub, Cursor) change the list prices of their main paid plans, with cost or business-model reasons reported.
interpretation_determines_result: true
