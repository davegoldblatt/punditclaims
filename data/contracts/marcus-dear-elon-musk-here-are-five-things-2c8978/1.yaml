evaluator_interpretation:
  - The ordinary reading is that safe, general domestic assistance requires substantially broader adaptable cognitive capabilities than autonomous road driving.
  - This compares required capabilities, not market adoption, commercial success or release dates.
  - The claim describes the state of knowledge at publication. With no reporting cycle for this research field, the current observation window is calendar 2022 through May 31; earlier studies are context.
  - The driving comparator is autonomous road driving as described, not merely one fixed route or a specially restricted demonstration.
support_condition: Comparative task analyses and capability evaluations establish substantially broader cognitive requirements for safe general domestic work than for autonomous road driving.
contradiction_condition: Comparable analyses or demonstrations show that general domestic work needs no substantially broader cognitive capabilities, or that driving requires greater generality under comparable assumptions.
measurement_requirements: Compare task breadth, adaptation to unfamiliar environments, planning, interaction and safety requirements. Account separately for hardware, dexterity, training resources and deployment restrictions.
source_requirements: Primary robotics and driving evaluations or explicit comparative requirements analyses. Deployment differences alone are insufficient.
