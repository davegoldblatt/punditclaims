assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft is asking its employees
  - draft their performance reviews
  - based on the outputs of generative AI models
  - the same ones underpinning ChatGPT
  - prone to hallucination
evaluator_interpretation:
  - "The claim has three components: employee drafting instructions, shared underlying model families with ChatGPT, and susceptibility to factual fabrication."
  - Asking includes official encouragement or instructional guidance; it does not require mandatory use or submission without human review.
  - Same models means shared underlying model families, not identical application behavior, prompts, retrieval systems, or every deployed model version.
  - Prone to hallucination means capable of producing unsupported factual statements in ordinary use, without a specified error-rate threshold.
  - Use October 2024, the latest complete month before publication, for the ongoing practice.
support_condition: Evidence establishes Microsoft employee performance-review drafting instructions during the target period, use of a model family also available in ChatGPT, and that model or Copilot's susceptibility to unsupported factual output.
contradiction_condition: Reliable evidence disproves a material component, such as showing that the alleged drafting instructions were misrepresented or that the relevant models did not share the stated lineage. Human-review requirements alone do not contradict the claim.
measurement_requirements: Verify the instructions and their effective dates, distinguish foundation models from application features, and document factual fabrication rather than stylistic variation.
source_requirements: Microsoft guidance and model announcements, provider documentation, and inspectable tests or verified reporting. The speaker's own article is not independent evidence.
