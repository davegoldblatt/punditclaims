explicit_source_elements:
  - they don’t operate like people
  - They don’t, for example, ever fact check
  - They mimic the kinds of things of people say in various contexts
  - that’s essentially all they do
evaluator_interpretation:
  - The testable categorical commitment is that LLMs never fact-check.
  - Fact-checking means comparing factual assertions with evidence and using the comparison to accept, reject or revise them. It need not be infallible or conscious.
  - Include LLM-based systems with retrieval and prompting because the surrounding discussion concerns Google AI Overviews and checking against Wikipedia.
  - The word 'ever' includes demonstrations before publication. The target therefore has no specified beginning and ends on 2025-05-05.
  - A counterexample to never fact-checking does not establish that LLMs share human mental mechanisms.
support_condition: Evidence establishes that the systems in scope never perform factual verification, including when prompted or given external evidence.
contradiction_condition: At least one documented pre-publication LLM system compares assertions with evidence and uses the comparison to revise or validate its output.
measurement_requirements: Inspect the verification procedure and evaluated behavior. Retrieval or citation generation alone is insufficient.
source_requirements: Primary research or technical documentation showing an implemented and evaluated verification process before the post.
