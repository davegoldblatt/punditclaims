evaluator_interpretation:
  - The plain reading is that fabricated factual assertions remained frequent in search-connected Bing Chat, rather than merely possible.
  - No numerical threshold is supplied. Representative interaction records or a systematic evaluation could establish frequency without imposing an arbitrary percentage.
  - I use March 1–15, 2023 as the recent operating period described by the present-tense statement and its reference to last week. Later versions are outside scope.
support_condition: Dated evaluations or sufficiently broad interaction records show frequent fabricated factual assertions in search-connected, GPT-4-powered Bing during the target period.
contradiction_condition: Representative testing of that deployment during the target period shows that fabricated factual assertions were rare, with enough coverage to address the general claim.
measurement_requirements: Identify the deployment, interaction dates, prompts, conversation settings, factual checking method, and sampling procedure. Separate hallucinations from refusals, creative writing, and other errors.
source_requirements: Prefer contemporaneous Microsoft disclosures and independently recorded tests. Individual examples establish occurrence but cannot alone establish prevalence.
