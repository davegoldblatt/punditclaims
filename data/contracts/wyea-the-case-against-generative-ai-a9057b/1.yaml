evaluator_interpretation:
  - The plain reading is that existing LLMs, including reasoning-enhanced systems, do not guarantee correct, repeatable performance across user tasks.
  - This does not mean every task fails, every repeated answer differs, or no bounded application can be reliable.
  - "For this ongoing technical observation, use the latest quarter-to-date before publication: July 1 through September 29, 2025. Model evaluations have no uniform financial-style reporting cycle."
  - The observation concerns available reasoning methods, not a proof about every possible future architecture.
support_condition: Evaluations in the target period show nonzero task failures in reasoning-capable systems and variation across repeated runs despite reasoning prompts or other enhancements.
contradiction_condition: Evidence establishes general correct and repeatable performance across the relevant tasks with added reasoning; a perfect score on one finite, narrow benchmark is insufficient.
measurement_requirements: Use scored tasks and repeated runs. Distinguish correct answers, semantic consistency and identical wording.
source_requirements: Primary evaluations identifying the tested systems and methods, including independent research where available.
