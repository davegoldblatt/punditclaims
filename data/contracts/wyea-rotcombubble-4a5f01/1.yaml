evaluator_interpretation:
  - Read overhypes as materially overstating demonstrated capabilities, not merely expressing enthusiasm or making clearly identified forecasts.
  - Read almost every day as a near-daily pattern across calendar days, not several statements on one launch day.
  - For the ongoing Altman allegation, use May 2024, the latest complete calendar month before publication. This reporting window is an evaluator choice because the claim supplies none.
  - Use the same month to examine the R1's reported current capabilities; earlier sales representations are context.
  - Misled means that representations created a materially inaccurate impression. The wording alone does not establish knowing deception.
  - Shamelessly is an evaluative modifier and is not separately scored.
support_condition: Dated records establish a near-daily pattern of materially exaggerated Altman capability statements during the target month, with matched capability evidence. The Rabbit portion requires a material mismatch between representations and product performance, and evidence concerning the unspecified previous operations.
contradiction_condition: A sufficiently complete statement record rules out the alleged near-daily pattern or shows the supposed exaggerations were accurate or clearly qualified. A complete examination of the identified Rabbit representations establishes no material misleading impression.
measurement_requirements: Compile dated Altman statements across channels, identify concrete capability assertions, compare them with contemporaneous evidence, and count distinct days. Evaluate Rabbit representations and performance separately.
source_requirements: Original statements and sales material, independent capability tests, and records identifying the alleged misrepresentation of Rabbit's previous operations.
