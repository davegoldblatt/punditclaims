evaluator_interpretation:
  - The testable commitment is the named investor relationship and advertised capabilities. It does not require proof of political persuasion or election effects.
  - ‘Industrialize astroturfing’ means commercial provision of centrally controlled accounts presented as independent human activity.
  - ‘Already’ describes developments established by publication. The target period therefore has no supplied lower bound and ends on the post date. For ongoing advertising, contemporaneous reporting takes precedence over subsequently changed webpages.
  - Investor identity is assessed qualitatively; the claim supplies no financial amount or accounting metric.
support_condition: Records available by the post establish Andreessen Horowitz backing and advertising of thousand-account orchestration using physical devices and human-like behavior.
contradiction_condition: Reliable contemporaneous records disprove the investor relationship or show that the advertising materially differed in scale, physical-device operation, or human mimicry.
measurement_requirements: Distinguish advertised capabilities from independently demonstrated performance.
source_requirements: Prefer dated investor and company records. Accessible contemporaneous reporting can document earlier advertising when primary pages have changed.
