evaluator_interpretation:
  - "Plain reading: since January 2024, OpenAI's share of the chatbot market has been eroding as rivals with similar products (mainly Gemini, also Claude) gained, and market-share data show it."
  - The 'numbers' are the market-share figures cited in the post (ChatGPT below 50%).
  - The causal link (no differentiation leads to share loss) is judged by whether share fell as similar rival products grew and users switched easily.
support_condition: Published share data show ChatGPT's share falling substantially between early 2024 and mid-2026 while similar rivals gained.
contradiction_condition: Share data show ChatGPT's share stable or rising over the period, or the decline is clearly driven by something other than rival substitutes.
measurement_requirements: Chatbot market-share series from Similarweb or Sensor Tower covering January 2024 to June 2026.
