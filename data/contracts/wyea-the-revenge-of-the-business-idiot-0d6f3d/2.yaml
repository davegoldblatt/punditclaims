explicit_source_elements:
  - LLMs can do work-shaped stuff, sometimes
  - mediocre and often-broken stuff
  - you have to keep a vigilant eye on
  - a subsided product that loses Anthropic money
  - as an enterprise to Anthropic and it still loses money
evaluator_interpretation:
  - The ordinary reading is that useful LLM work commonly requires checking and correction, while Anthropic remains loss-making overall despite substantial enterprise payments. This does not assert that enterprise customers are individually unprofitable.
  - The subscription clause additionally describes subsidised provision. A discount against API retail prices alone does not establish a subsidy against delivery costs.
  - Use January–March 2026, the latest completed calendar quarter before publication, for the ongoing financial and technical observations. This reporting-period choice is mine; the speaker gives no period.
  - Read the quality language as a general claim about practical work, not a claim that every output is defective. Test it through representative task quality and required human intervention, without inventing a numerical definition of mediocre or often.
  - The passage does not identify an accounting basis or distinguish net loss, operating loss, and cash consumption. The financial contract therefore retains an unknown basis.
support_condition: Representative evaluations for the target period show recurring material defects and substantial checking requirements across practical work. Comparable financial evidence establishes company-wide losses despite enterprise revenue, and delivery-cost evidence establishes the asserted subscription subsidy. Separate enterprise-channel losses are not required.
contradiction_condition: Representative evaluations show dependable practical work without the asserted recurring defects or substantial oversight, or comparable financial evidence establishes company-wide profitability. Subscription cost evidence could separately contradict the subsidy clause. Individual successes, positive gross margins, or profitable enterprise transactions alone do not refute the general statement.
measurement_requirements: Task evaluations must identify models, tasks, quality standards, failures, and human review or correction. Financial comparisons must distinguish company-wide results from customer margins, cash flow, and API-equivalent retail value. A financial verdict requires a known, matched accounting basis.
source_requirements: Prefer independent task evaluations and Anthropic financial disclosures. Subscription subsidies require actual cost evidence or a documented cost model, not retail-price comparisons.
