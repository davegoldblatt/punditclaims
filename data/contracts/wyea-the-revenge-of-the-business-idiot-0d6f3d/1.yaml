explicit_source_elements:
  - sometimes
  - mediocre and often-broken stuff
  - keep a vigilant eye on
  - a subsided product that loses Anthropic money
  - as an enterprise to Anthropic and it still loses money
evaluator_interpretation:
  - Assess the factual reliability allegation as frequent material errors requiring human checking, rather than judging the speaker's descriptions of users.
  - The surrounding alternatives imply losses on both subsidized subscription use and enterprise use. Company-wide losses alone do not establish that stronger assertion.
  - An alternative ordinary reading is simply that Anthropic remains unprofitable overall despite enterprise payments; preserve this ambiguity rather than silently substituting that easier proposition.
  - For the ongoing financial state, use calendar Q1 2026, the latest completed quarter before publication. Technical evaluations must describe capabilities relevant to that period.
  - "'Sometimes' and 'as long as' qualify observed usefulness; they are not antecedents of a conditional forecast."
  - No accounting basis or allocation of shared costs is supplied.
support_condition: Representative task evaluations establish frequent consequential errors and a continuing need for oversight, while comparable subscription and enterprise revenue-and-cost records establish losses in both channels under an identified accounting basis.
contradiction_condition: Comparable financial records establish profitability in either claimed loss-making channel, or representative evaluations contradict the asserted general reliability limitation. Gross margin alone does not settle fully allocated net profitability.
measurement_requirements: Specify task population, failure severity and oversight burden. For finances, separate subscription and enterprise revenue and costs, distinguish gross from net results, and disclose treatment of training, inference, distribution and shared expenses.
source_requirements: Primary task evaluations and channel-level financial disclosures or credible attributed estimates. Consolidated financial statements may provide context but cannot substitute for channel-level results.
