assessment_axis: historical_observation
explicit_source_elements:
  - The market for AI compute is not actually growing.
  - In the last two years
  - no new major consumers of AI compute have emerged
evaluator_interpretation:
  - The two-year window runs from 2023-12-29 through publication on 2025-12-29.
  - A major consumer includes a standalone model developer operating an industrial-scale training cluster. Owning the equipment counts as consuming compute.
  - New means becoming a major consumer during the window, rather than necessarily being incorporated during it.
  - Market growth concerns consumption or spending, not merely the number of customers. A new major consumer can refute the second assertion without establishing marketwide spending growth.
support_condition: Comparable market evidence shows no growth, and evidence covering major consumers shows no entrant beyond the established labs and hyperscalers during the two-year window.
contradiction_condition: Evidence establishes a new major standalone compute consumer during the window, or comparable marketwide evidence establishes growth.
measurement_requirements: Distinguish operational consumption from announced capacity, and marketwide growth from growth at one supplier. Do not equate token counts with dollars or uniform quantities of computation.
source_requirements: Dated operational disclosures, research documenting deployed clusters, or comparable market measurements.
