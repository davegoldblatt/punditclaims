evaluator_interpretation:
  - That refers to the Comprehension Challenge, not the Turing Test.
  - The ordinary reading of close is reliable performance across most of the challenge's breadth, with limited remaining gaps relative to a competent human viewer.
  - No numerical proximity threshold is supplied, so none is invented.
  - The Gemini qualification discounts promotional demonstrations; it does not exclude Gemini from the capability claim or make the claim conditional.
  - For this ongoing capability claim, use December 2023 through December 9 as the latest reporting window.
support_condition: Broad, relevant evaluations show substantial remaining gaps across the challenge's central requirements for all leading contemporary systems, including Gemini.
contradiction_condition: A system existing by December 9, 2023 shows reliable, broadly human-comparable open-ended video comprehension across most challenge requirements, with only limited remaining gaps.
measurement_requirements: Assess breadth, reliability, explanatory reasoning, and performance against human viewers. Being best on a narrower benchmark does not itself establish proximity to passing.
source_requirements: Primary evaluations of contemporaneous systems, with disclosed methods and failures. Promotional demonstrations may provide context but cannot alone establish proximity.
