ambiguity_flags:
  - Ongoing-state observation assigned to the latest reported quarter.
  - Meaningful revenue has no numerical threshold.
  - AI-related revenue could mean direct product revenue, associated advertising revenue or incremental revenue caused by AI.
  - AI strategy could express criticism of a plan's quality rather than its literal absence.
  - The compound claim contains spending, strategy, revenue and advertising assertions that require different measures.
