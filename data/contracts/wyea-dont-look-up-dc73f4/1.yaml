assessment_axis: historical_observation
explicit_source_elements:
  - spending more than a few hundred million a year
  - does not have an AI strategy or meaningful revenues
  - AI is not “helping ads.”
evaluator_interpretation:
  - Read revenues as AI-related revenues, not Meta's total revenues.
  - Use Q2 2026, the latest reported quarter before the post, for the ongoing business assertions.
  - An AI strategy means an articulated plan connecting AI development, deployment and business objectives; it need not be successful.
  - Helping ads means improving advertising performance, including conversions. The categorical denial does not require a minimum financial return to contradict it.
  - The reference to what Meta has said makes company-reported disclosures the relevant basis for the revenue assertion.
  - Revenue associated with an AI-powered product does not establish incremental revenue caused by AI.
  - Contradicting the categorical strategy or advertising assertion defeats the combined proposition, without establishing the remaining financial assertions.
support_condition: Evidence establishes no articulated AI plan, no material AI-related revenue and no positive advertising effects during the target period. The spending premise separately requires AI-specific expenditure data.
contradiction_condition: A documented AI plan or measured positive advertising effects during the target period contradicts the corresponding categorical assertion. Material AI-attributed revenue on a matching basis would separately contradict the revenue assertion.
measurement_requirements: Separate advertising conversions from engagement, incremental revenue from product-associated revenue, and AI compute spending from total capital expenditure. Do not substitute annualized revenue for realized quarterly revenue.
source_requirements: Primary Meta disclosures for its plans and reported results; independent measurement would strengthen the advertising assessment.
