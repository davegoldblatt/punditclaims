evaluator_interpretation:
  - The firm commitments are a substantial recurring theme beginning in fall 2019 and a principal focus among four in the named 2020 article.
  - Central means a major substantive theme, not necessarily the subject of every critique.
  - I use September 2019 as the month-level beginning of fall and the post date as the end of the claimed continuing history.
  - Perhaps first is expressly tentative. It is not scored as a firm claim to priority.
  - Independent descriptions are required because the task prohibits citing Marcus's own writing as evidence that he was right.
support_condition: Independent records establish the LLM-specific theme beginning in fall 2019, its continuing prominence, and cognitive models as one of four principal foci in the 2020 article.
contradiction_condition: Reliable records show that the claimed LLM-specific discussion began materially later, or that the named 2020 article lacked the asserted principal focus.
measurement_requirements: Distinguish criticism of AI or deep learning generally from criticism of LLMs, and an article's major themes from passing mentions.
source_requirements: Independent contemporary reviews or scholarly descriptions of the relevant writings. Reproduced abstracts and the speaker's later self-descriptions are insufficient.
