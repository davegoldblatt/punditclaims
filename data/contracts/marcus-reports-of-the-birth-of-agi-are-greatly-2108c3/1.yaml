evaluator_interpretation:
  - Current systems means the next-token-prediction systems discussed in the surrounding paragraph.
  - I assess October 1–18, 2023, the current calendar month through publication.
  - The ordinary reading combines an existence claim about useful applications with a substantial overstatement claim about common contemporary descriptions of their usefulness.
  - Testing the second part requires an identifiable, reasonably representative collection of contemporary application claims. I do not invent a count or treat every proposed application as a claim of proven reliability.
support_condition: Evidence establishes useful applications and shows that a representative set of contemporary claims substantially exceeds the applications reliably usable in practice.
contradiction_condition: A representative comparison shows that contemporary claims generally matched demonstrated practical reliability, or evidence disproves the existence of any practically useful applications.
measurement_requirements: Define applications consistently, specify what reliability each application requires, and distinguish supervised assistance from autonomous performance. Compare measured usefulness against actual contemporary claims.
source_requirements: Deployment results or controlled evaluations, plus primary records of the claims being compared. Assertions by the speaker cannot establish overstatement.
