explicit_source_elements:
  - the overactive guardrail problem
  - would have been solved by now
  - You’d be wrong
  - billions more invested and ever-bigger models
evaluator_interpretation:
  - The plain reading is that major deployed AI assistants still sometimes rejected benign requests unnecessarily. It does not require every assistant or every request to fail.
  - I interpret 'now' as the current February 2024 deployment period through February 21, the post date. These products have no quarterly reporting period for refusals.
  - Investment and model growth are background to the persistence claim, not a separately quantified financial claim or a claim that investment caused refusals.
support_condition: Credible records establish unnecessary refusals of ordinary, benign requests by a major deployed AI assistant during the target period.
contradiction_condition: Reliable contemporary evidence establishes that the cited refusals were misrepresented or justified, and that excessive refusals had been eliminated across the relevant major systems.
measurement_requirements: Identify the system, benign request, refusal, and observation date. A measured industry-wide refusal rate is unnecessary to establish persistence.
source_requirements: Prefer provider disclosures and independently reproduced requests. Unverified screenshots alone are insufficient.
