  - the made-up facts that were used in Experiment 1
evaluator_interpretation:
  - The forward-looking component predicts difficulty for the Bing system discussed in September 2023 on Experiment 1's synthetic learned-fact reversal task.
  - Trouble means materially worse reverse recall than forward recall after learning the synthetic facts, not merely an occasional wrong answer.
  - The architecture and known-fact benefit are background observations. They cannot by themselves settle the synthetic-fact prediction.
  - Experiment 1 identifies the evaluation protocol. It is a task restriction, not a separate future antecedent; the other listed conditions describe scope and uncertainty.
  - Supplying the complete fact in the question or retrieving it into the context is a different test from learning it during training.
support_condition: A controlled evaluation of the relevant Bing system shows a substantial and reproducible reverse-recall deficit on Experiment 1's synthetic facts despite successful forward learning. The claimed known-fact benefit additionally requires a comparison isolating Bing's supplementary mechanism.
contradiction_condition: A comparable evaluation shows reliable reverse recall close to forward recall on the learned synthetic facts. A matched known-fact comparison could separately contradict the claimed benefit.
measurement_requirements: Identify the Bing version, prompts, training or ingestion procedure, retrieval access, synthetic dataset, forward and reverse accuracy, and uncertainty. Isolating the supplementation's benefit requires an appropriate baseline or ablation.
source_requirements: Microsoft system documentation for architecture and controlled, reproducible Bing evaluations for task performance. Other models and in-context tests are context only.
