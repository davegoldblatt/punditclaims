assessment_axis: forecast_outcome
explicit_source_elements:
  - For now
  - until the US government takes a more comprehensive approach
  - states will have little choice
  - file lawsuits like these
  - only be filed after harms have been caused
evaluator_interpretation:
  - The ordinary reading is that, while effective federal consumer-risk safeguards remain materially incomplete, states will remain practically dependent on lawsuits responding to completed harms.
  - A legislative proposal alone does not satisfy the condition's endpoint; implementation of broader safeguards would.
  - The categorical statement about when lawsuits may be filed is a separate legal premise within the forecast.
  - Evidence establishes the condition during the opening portion of the forecast, not necessarily throughout the entire period to the evaluation date.
support_condition: During the qualifying period, enforcement records show continuing practical dependence on post-harm lawsuits and no effective preventive alternatives addressing the relevant consumer harms.
contradiction_condition: During the qualifying period, states demonstrably protect consumers through effective preventive alternatives, undermining the claimed practical necessity. Legal authority to sue before completed harm separately contradicts the categorical legal premise.
measurement_requirements: Track federal safeguards, state enforcement, preventive laws and remedies, their implementation, and their effectiveness. Lawsuit counts alone do not establish necessity.
source_requirements: Dated federal policy records, state statutes and enforcement records; reliable reporting may establish the broader federal-policy situation when no single primary record does so.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A demonstrated preventive state intervention during the qualifying period that materially disproves practical dependence on post-harm litigation can settle the forecast early. Mere enactment or the existence of legal authority does not establish practical effectiveness.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - "'More comprehensive' does not identify a particular federal policy threshold."
  - "'Little choice' concerns practical effectiveness, while 'only' states an absolute legal limitation."
  - "'States' does not specify whether the claim concerns all states or a general pattern."
retrospective_or_prospective: retrospective
