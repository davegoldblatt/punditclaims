assessment_axis: forecast_outcome
explicit_source_elements:
  - Generative AI
  - eventually
  - will come for your livelihood
evaluator_interpretation:
  - I assess the normalized livelihood forecast, not the preceding personification about what AI wants.
  - The ordinary reading is that generative AI will threaten some people's paid work, rather than eliminate every reader's employment.
  - Documented removal or nonreplacement of paid roles because generative AI performs their work establishes a threat. Economy-wide net job losses are not required.
  - The decisive event must occur after publication.
support_condition: Documented post-publication displacement of paid human work, removal of paid roles, or material earnings losses attributable to generative AI.
contradiction_condition: Decisive evidence ruling out the predicted threat to paid work generally. Employment growth or successful redeployment in particular settings cannot alone contradict an indefinite forecast about a threat to some workers.
measurement_requirements: Distinguish transferred tasks and removed roles from proven layoffs, individual earnings losses and economy-wide net employment effects.
source_requirements: Employer records, credible causal research, or reputable reporting documenting actual changes and their connection to generative AI.
metric_scope: null
original_horizon: eventually
horizon_interval:
  start: 2024-07-01
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated post-publication case establishes that generative AI displaced paid work or caused paid roles to be removed or no longer filled.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Your livelihood does not specify a population or occupation.
  - Threatening paid roles is different from causing lasting unemployment or lower individual earnings.
  - Eventually supplies no deadline.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
