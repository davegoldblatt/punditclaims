explicit_source_elements:
  - "2025"
  - converted from a non-profit to a for-profit entity
  - leading to a $41.55 billion loss
  - changes in fair value of convertible interests and warrant liability
evaluator_interpretation:
  - Read the conversion reference as the 2025 restructuring of OpenAI's business. Separately check the accuracy of the nonprofit description.
  - The claim requires evidence that the restructuring caused the specified charge. A charge occurring in the same year is insufficient.
  - The surrounding discussion attributes these figures to OpenAI's financial statements, so the claimed basis is company_reported.
support_condition: Financial statements or independently verified reporting establish a 2025 loss rounding to $41.55 billion on the specified instruments and explain how the restructuring caused that loss.
contradiction_condition: Comparable records establish a materially different charge or show that the specified loss arose from a different cause, rather than the restructuring.
measurement_requirements: Separate valuation changes before restructuring, any charge triggered by restructuring, and amounts allocated to noncontrolling interests. Do not substitute a company-attributable charge for the consolidated charge.
source_requirements: Prefer the 2025 financial statements and instrument notes. Independent reporting must establish both the amount and the causal mechanism.
