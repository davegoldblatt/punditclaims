assessment_axis: causal_assessment
explicit_source_elements:
  - why so much money has gone into data centers
  - venture capitalists invested a lot of money
  - everybody saw how much money hyperscalers were investing
  - everybody assumed that both were doing so for a good reason
evaluator_interpretation:
  - Read 'everybody' as a broad description of investor and market behavior, not a literal claim about every person.
  - The proposed mechanism is that prominent spending served as evidence of commercial credibility and materially encouraged further investment.
  - The claim concerns the buildout leading up to the post. Its starting date is unspecified.
  - Do not assume that describing the market as a bubble independently proves overvaluation.
support_condition: Investment records, contemporaneous decision-maker accounts, or credible causal research show that VC and hyperscaler commitments broadly encouraged further investment by serving as proof of viability, with material importance relative to competing explanations.
contradiction_condition: Broad evidence shows that the asserted social-proof mechanism was absent or unimportant, or that investment decisions generally depended on independent commercial evidence rather than confidence inferred from others' spending.
measurement_requirements: Establish the sequence from observed commitments to changed beliefs and subsequent investment. Separate social proof from competitive defense, supply constraints, customer demand, and technological progress.
source_requirements: Prefer investor decision records, firsthand investor statements, company disclosures, and research that tests competing explanations. Commentary alone cannot establish a market-wide cause.
