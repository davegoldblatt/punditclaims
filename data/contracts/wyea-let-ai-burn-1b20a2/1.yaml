evaluator_interpretation:
  - In the surrounding comparison with 2008, the ordinary reading is that failure of these firms or the generative AI sector would not materially threaten financial-system functioning through credit losses, funding disruption, or contagion.
  - Stock-market losses alone do not establish systemic importance.
  - Use January through March 2026, the latest ordinary quarterly reporting period available before the July 7 post. This is a reporting-period convention, not a period explicitly supplied by Zitron.
  - The claim includes the wider generative AI sector, but does not automatically include every activity of diversified technology companies.
support_condition: Exposure data and a credible failure or stress assessment show that losses and service disruption from the named firms and sector would be absorbable without material disruption to financial intermediation.
contradiction_condition: Exposure data and a credible stress assessment identify a material threat to financial-system functioning from failure of the named firms or the generative AI sector during the target period.
measurement_requirements: Measure direct and indirect credit exposures, guarantees, funding concentration, collateral dependencies, and substitutability. Distinguish potential transmission channels from demonstrated systemic importance.
source_requirements: Prefer regulatory financial-stability assessments, lender disclosures, and stress tests that identify the relevant firms or sector and describe exposure dates.
