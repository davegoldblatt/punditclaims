evaluator_interpretation:
  - In the surrounding comparison with the financial crisis, the ordinary reading is that failure of these firms or the sector would not materially impair financial-system functioning.
  - Assess the position on July 7, 2026. Earlier exposure disclosures can inform that position without replacing it with a first-quarter observation.
  - Systemic importance concerns credit, liquidity, payments and financial intermediation. Stock-market losses or losses to particular investors alone do not establish systemic importance.
  - The claim does not require literally zero economic effects, and absence of a regulatory designation does not establish systemic irrelevance.
  - Do not expand the claim to every risk caused by the use or misuse of AI technology.
support_condition: Credible exposure analysis and stress assessments show that failure of the named labs and generative-AI sector would leave essential financial services functioning, with losses absorbable without material system-wide disruption.
contradiction_condition: Exposure analysis, supervisory findings or demonstrated dependencies establish that failure of these firms or the sector could materially disrupt financial intermediation, liquidity or essential financial services under conditions existing at the post date.
measurement_requirements: Assess direct and indirect lending, guarantees, collateral, investor leverage, funding dependencies and substitutability. Distinguish economy-wide financial disruption from ordinary investment losses.
source_requirements: Regulatory financial-stability assessments, bank and investor exposure disclosures, contractual guarantees and credible stress analysis tied to the July 2026 position.
