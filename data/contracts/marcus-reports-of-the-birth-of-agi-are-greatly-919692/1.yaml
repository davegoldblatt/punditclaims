evaluator_interpretation:
  - The plain reading is that substantial problems in general visual understanding remained, rather than that computer vision had made little progress.
  - The target is 2023 through the post date. Later improvements do not change this historical assessment.
  - Substantial gaps on ordinary visual relationships across multiple leading models count as unresolved problems. Occasional errors alone do not.
support_condition: Contemporary evaluations show substantial, recurring weaknesses in important visual-understanding capabilities, including tasks people can readily perform.
contradiction_condition: Contemporary evaluations demonstrate broadly robust visual understanding, with the remaining weaknesses confined to minor or exceptional cases.
measurement_requirements: Use evaluations spanning multiple models and visual tasks, with human comparisons where available. Distinguish image understanding from success on a narrower task such as segmentation.
source_requirements: Primary evaluations of systems available during the target period, published by the evaluation date.
