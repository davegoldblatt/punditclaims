assessment_axis: forecast_outcome
explicit_source_elements:
  - Large language models
  - almost certain to cause harm
  - as well
evaluator_interpretation:
  - The ordinary reading predicts actual harm from LLM outputs or misuse, without specifying its severity, prevalence, or deadline.
  - At least one verified instance of harm after publication can establish the predicted outcome. It cannot establish the numerical probability implied by 'almost certain'.
  - Human misuse may contribute to the harm; the model need not be its sole cause.
support_condition: A documented event after 2023-03-10 establishes actual harm caused or materially enabled by an LLM output or misuse.
contradiction_condition: A finite period without documented harm cannot disprove this forecast without a deadline. Failure of a particular alleged example would not contradict the general claim.
measurement_requirements: Evidence must establish realized harm and its connection to LLM use, rather than a hypothetical risk or an unproven allegation.
source_requirements: Prefer judicial findings, official investigations, or independently documented incidents.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated authoritative finding establishing actual post-publication harm materially enabled by an LLM settles the existence-of-harm forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No severity or prevalence threshold.
  - The probability expressed by 'almost certain' cannot be calibrated from one outcome.
retrospective_or_prospective: retrospective
