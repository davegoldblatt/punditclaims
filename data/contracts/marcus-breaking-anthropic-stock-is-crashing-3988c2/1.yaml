early_resolution_rule: "A completed IPO with final pricing can settle the operational forecast while the stated market condition persists: at least US$1 trillion contradicts it; below that threshold supports it. The valuation basis must first be reconciled. Announced plans, postponements, private financing, and the mere passage of time are not conclusive events."
