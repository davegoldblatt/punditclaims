explicit_source_elements:
  - Jailbreaks aren’t new
  - even after years of them
  - the tech industry has nothing like a robust response
evaluator_interpretation:
  - The ordinary reading is that available defenses did not reliably withstand varied, realistic jailbreak attacks.
  - Robust does not mean perfect resistance to every conceivable attack.
  - The statement does not deny the existence of mitigations, successful defenses against particular attacks, or ongoing research.
  - For the ongoing state without a specified period, use the latest completed calendar quarter before the post, July through September 2024. Earlier work supplies historical context.
support_condition: Contemporary evaluations show substantial failures of credible defenses under realistic attack variations, supporting the absence of an established broadly reliable response.
contradiction_condition: Contemporary evaluations establish an available, practical defense that reliably resists varied adaptive jailbreaks while preserving useful operation. Success against one fixed attack alone is insufficient.
measurement_requirements: Check attack diversity, adaptive or multi-turn testing, success rates, tested defenses, and restrictions on useful operation. Avoid inferring robustness from a narrow benchmark alone.
source_requirements: Original security evaluations and primary descriptions of defenses available in the target period, including successful mitigations as counterevidence.
