evaluator_interpretation:
  - "Plain reading: in December 2025 the US lead over China in generative AI model capability was modest, measured in months or small benchmark margins rather than years or large gaps."
  - The surrounding text is about models ("genAI models", "China is at most a few months behind"), so model capability is the main measure. Investment and compute are treated as relevant but secondary.
support_condition: Independent evaluations or credible expert assessments from around December 2025 show the best Chinese models trailing the best US models by months or by small benchmark margins.
contradiction_condition: Independent evaluations from around December 2025 show a large US capability lead, such as a gap of a year or more, or Chinese models far below the US frontier on broad benchmarks.
measurement_requirements: Time-lag or benchmark-gap estimates between the top US and top Chinese models, dated close to December 2025.
source_requirements: Independent benchmarkers (Epoch AI, Artificial Analysis, Stanford AI Index), government evaluators (NIST CAISI), or reputable reporting of expert statements.
