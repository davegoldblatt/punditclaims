explicit_source_elements:
  - Even with a lot of data
  - GPT-4
  - playing chess
  - around the level where (top) chess programs were in 1976
  - not even close to current state of the art
evaluator_interpretation:
  - The ordinary reading concerns GPT-4 playing complete chess games without an external chess engine.
  - "Both comparisons matter: approximate equivalence to leading 1976 programs and a substantial deficit against leading contemporary engines."
  - The target is the capability snapshot at publication, the latest state that pre-publication evidence could describe. There is no standard reporting period for this capability. Earlier experiments are historical context unless their applicability to this snapshot is established.
  - Around permits ordinary measurement uncertainty; it does not supply a numerical Elo tolerance.
  - Even with a lot of data describes existing training exposure, not a conditional forecast or an instruction to supply unlimited assistance.
support_condition: Comparable, representative measurements establish that the relevant GPT-4 version played roughly as strongly as leading 1976 programs and substantially below leading engines at publication.
contradiction_condition: Comparable measurements establish materially different strength from leading 1976 programs, or competitive strength against leading engines at publication.
measurement_requirements: Complete-game results, identified model versions, prompting, opponent settings, time controls, and treatment of illegal moves. Cross-era ratings require a defensible common calibration. Puzzle ratings and training-game ratings cannot substitute for playing strength.
source_requirements: Prefer reproducible independent evaluations and original tournament records. Separate measured results from informal rating estimates.
