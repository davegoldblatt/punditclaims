assessment_axis: forecast_outcome
explicit_source_elements:
  - The AI Bubble Will Not Leave Behind Useful Infrastructure
  - Does Not Have A Dot Com Bubble-esque “Redemption Arc”
  - useful infrastructure existed and could be adapted and used to make things cheaper and more efficient
evaluator_interpretation:
  - The surrounding discussion makes this conditional on an AI investment bust, although the headline does not state that condition separately.
  - A bust means a substantial collapse in AI investment and demand that leaves surplus infrastructure. A stock-market decline alone does not establish this.
  - Useful infrastructure means economically productive continued operation or reuse of the inherited assets, including useful AI applications.
  - The dot-com comparison concerns a meaningful infrastructure legacy, not whether any isolated GPU remains usable. No numerical threshold or deadline is supplied.
support_condition: After an established AI investment bust, comprehensive evidence shows that the inherited infrastructure has no meaningful economically productive use or feasible reuse.
contradiction_condition: After an established AI investment bust, documented operation or reuse shows a meaningful economically productive legacy from the inherited AI infrastructure.
measurement_requirements: Identify the bust, affected assets, subsequent workloads, utilization, adaptation costs and operating economics. Separate productive reuse from announcements or liquidation prices.
source_requirements: Dated industry investment records and operator, purchaser or insolvency records establishing both the bust and subsequent use.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented post-bust infrastructure legacy providing substantial economically useful services can conclusively contradict the forecast. Mere survival before a bust cannot. Support requires comprehensive evidence that the relevant assets cannot provide such a legacy.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No definition or threshold for the AI bubble popping.
  - No deadline for the predicted aftermath.
  - Useful infrastructure and redemption arc have no numerical scale threshold.
retrospective_or_prospective: retrospective
