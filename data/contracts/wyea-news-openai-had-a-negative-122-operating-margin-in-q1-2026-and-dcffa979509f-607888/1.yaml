explicit_source_elements:
  - an information war
  - two companies that burn billions of dollars
evaluator_interpretation:
  - The two companies are OpenAI and Anthropic.
  - Information war means competing communications intended to influence perceptions of their financial strength. It does not inherently mean lying or coordinated manipulation.
  - Burn means net cash consumption, rather than gross spending, operating losses, or noncash accounting charges.
  - For the ongoing financial state, use Q1 2026, the latest completed quarter discussed in the post. The communications characterization concerns the situation at publication.
  - The separate allegation about possible IPO filing timing is outside the supplied normalized proposition.
support_condition: Comparable Q1 evidence establishes billion-dollar net cash consumption at both companies, and contemporaneous records establish competing financial communications aimed at investors or the public.
contradiction_condition: Comparable Q1 records establish that at least one company was not consuming billions in cash, or reliable records directly rebut the claimed contest over financial perceptions.
measurement_requirements: Separate net operating cash consumption and capital expenditure from financing proceeds, purchases of marketable securities, gross expenditure, operating loss, and net loss. Do not substitute annual or half-year totals for Q1.
source_requirements: Cash-flow disclosures or attributable financial reporting for each company, together with dated company communications or independently documented investor communications.
