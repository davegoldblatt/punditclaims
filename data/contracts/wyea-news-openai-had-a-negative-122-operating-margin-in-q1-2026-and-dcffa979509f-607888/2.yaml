explicit_source_elements:
  - '"two companies that burn billions of dollars"'
  - '"information war" between OpenAI and Anthropic'
  - '"OpenAI ... allegedly planning to file for an IPO as soon as today" (reported, hedged)'
evaluator_interpretation:
  - The checkable core is that both OpenAI and Anthropic burn billions of dollars. 'Information war' is a metaphor for the competing financial leaks he describes. I treat it as framing and do not score it on its own.
  - "'Burn billions' (plain reading): each company used up at least about $1 billion of cash, net, on the yearly scale people usually mean by that phrase. He named no period. I use the latest full year before the post (2025) plus the latest quarter reported before the post (Q1 2026)."
  - Net loss is not cash burn. Large non-cash fair-value charges in either company's net loss do not count as burn.
  - The hedged IPO aside ('allegedly ... as soon as today') is not scored.
support_condition: Credible reports or filings show each company had a net cash outflow of about $1 billion or more within 2025 to Q1 2026.
contradiction_condition: Either company is shown to have had no net cash outflow of about $1 billion or more within 2025 to Q1 2026, for example by being cash-flow positive across that span.
measurement_requirements: Operating cash flow or free cash flow, or reported 'cash burn' figures, for each company within 2025 to Q1 2026.
source_requirements: Company filings (such as an S-1), or reputable news reports of internal financials.
