assessment_axis: historical_observation
explicit_source_elements:
  - not what a healthy industry looks like
  - evenly-distributed and sustainable
  - NVIDIA’s revenue wouldn’t depend mostly on three customers
  - 54% of its Q1 FY27 revenue
evaluator_interpretation:
  - Mostly means more than half of NVIDIA’s total quarterly revenue.
  - The context explicitly identifies Q1 FY27, so that quarter is the target period.
  - The ordinary factual reading concerns customer concentration and the sustainability of demand. Confirming concentration alone does not establish that the industry is economically unsustainable.
  - Direct purchasers must be distinguished from the ultimate users of equipment purchased through intermediaries.
support_condition: NVIDIA’s disclosures establish that three customers supplied more than half of Q1 FY27 revenue, and evidence connects that concentration to the claimed lack of sustainable demand.
contradiction_condition: Comparable disclosures show that three customers did not account for most revenue, or evidence establishes that the alleged concentration does not describe ultimate demand and that the claimed dependence is economically sustainable.
measurement_requirements: Use total NVIDIA revenue and direct-customer revenue shares for Q1 FY27. Assess ultimate demand and sustainability separately.
source_requirements: NVIDIA’s quarterly filing for concentration; independent financial or customer evidence for the broader sustainability inference.
