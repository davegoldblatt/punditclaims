assessment_axis: forecast_outcome
explicit_source_elements:
  - inevitable
  - the majority of AI subscriptions
  - move to token-based billing
evaluator_interpretation:
  - Majority means more than half. I read subscriptions as subscription products, rather than weighting products by subscribers or revenue.
  - Token-based billing includes credits whose consumption depends on token use. A request limit or generic usage quota alone does not establish token-based billing.
  - The claim requires a market-wide transition. Examples from several prominent providers cannot establish the denominator.
support_condition: Dated, sufficiently representative evidence establishes that more than half of AI subscription products have moved to billing tied to token consumption.
contradiction_condition: A decisive event makes the claimed eventual majority transition impossible. Continued availability of flat-rate plans at an interim date does not contradict an undated forecast.
measurement_requirements: Define the product population, count products consistently, distinguish token billing from other usage limits, and establish that qualifying products changed their billing model.
source_requirements: Published billing terms and a documented market census or representative study available by the evaluation date.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when dated representative evidence establishes the majority transition. Individual announcements cannot settle the claim.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Subscriptions could mean products, plans, or subscriber accounts.
  - The population of AI subscriptions is unspecified.
  - Treatment of hybrid subscriptions with included token allowances is unspecified.
  - No deadline is stated.
retrospective_or_prospective: retrospective
