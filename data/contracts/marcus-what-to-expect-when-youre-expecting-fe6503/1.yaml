explicit_source_elements:
  - GPT-4 will still
  - like its predecessors
  - reckless and hard to control
evaluator_interpretation:
  - The plain reading predicts recurring harmful or unwanted outputs despite efforts to constrain the model.
  - The surrounding sentences connect the metaphor to unreliable behavior and imperfect control.
  - Like its predecessors means retaining these problems, not necessarily having an equal or higher failure rate.
  - Repeated failures across a systematic adversarial evaluation qualify; an isolated anecdote would not.
support_condition: A systematic evaluation of released original-generation GPT-4 demonstrates recurring harmful responses or safety-control failures despite its safeguards.
contradiction_condition: Broad, credible evaluations demonstrate dependable control across relevant ordinary and adversarial requests, incompatible with recurring substantial failures.
measurement_requirements: Identify the tested model, attack conditions, harmful-response criteria, and baseline behavior. Do not treat adversarial success rates as ordinary-use failure rates.
source_requirements: Primary reproducible safety evaluations, preferably independent of the developer.
