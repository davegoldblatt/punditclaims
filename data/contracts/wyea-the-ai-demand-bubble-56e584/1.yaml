assessment_axis: forecast_outcome
explicit_source_elements:
  - if either or both of them die
  - the majority of capital expenditures and debt
  - as part of the AI bubble
  - have been a waste
  - capex has likely accounted for very little revenue growth
evaluator_interpretation:
  - Treat the main proposition as a conditional forecast. Its historical revenue-growth premise requires separate causal evidence and does not establish the forecast.
  - Read a lab 'dying' as permanent cessation of its business or terminal financial failure that prevents continued compute purchases. An acquisition, temporary outage or ordinary loss does not suffice.
  - Read 'majority' as more than half of the relevant investment by value.
  - Read 'waste' as investment failing to produce recoverable economic value, accounting for prior returns, resale and alternative uses.
  - Do not count debt proceeds and the assets financed with those proceeds twice.
support_condition: After the defined failure of either lab, evidence shows that more than half of the relevant AI investment has permanently failed to generate recoverable economic value, including after reuse or sale.
contradiction_condition: After the defined failure, sufficiently complete evidence shows that at least half of the relevant investment retains or realizes economic value through other customers, internal uses, sale or prior returns.
measurement_requirements: Define the investment population and vintages; identify debt-funded assets without double counting; measure impairment, abandonment, utilization, disposal proceeds and economic returns after the triggering event.
source_requirements: Dated evidence of terminal lab failure, followed by asset-level company disclosures, filings or independently verified economic measurements. A contemporaneous capex-to-revenue ratio is insufficient.
metric_scope:
  company: Amazon, Alphabet and Microsoft; wider AI investment scope is unspecified
  metric: Share of AI capital investment and associated debt-funded investment rendered economically wasted after lab failure
  currency: USD
  units: percent of investment value
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_met
early_resolution_rule: Resolve only after a verified triggering failure and decisive evidence establishing the economic fate of more than half of the defined investment population. Continued operation before an unstated deadline cannot contradict the forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline or post-failure assessment interval is stated.
  - Die does not specify a legal or financial event.
  - Waste does not specify economic loss, accounting impairment or idle capacity.
  - The scope and starting date of AI-bubble investment are unspecified.
  - Capital expenditure and debt may overlap.
  - The historical causal premise is hedged with 'likely'.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
