explicit_source_elements:
  - Every “AI agent” story
  - code generation
  - summarizing some sort of information source
  - generating something based on an information source
evaluator_interpretation:
  - I read 'story' as a published account of an AI-agent application, including a research case study.
  - The ordinary application-level reading distinguishes generating content from using tools to execute transactions or operate a business.
  - Interpreting 'generating something' to include every internal command would make the assertion effectively unfalsifiable; that broader reading remains a material ambiguity.
  - The target is the body of published stories available by 2026-04-14. The speaker supplies no lower date.
support_condition: A sufficiently comprehensive account of the relevant published stories showing that their applications fall entirely within the three named categories.
contradiction_condition: At least one pre-publication AI-agent story describing an application outside those categories, such as executing sales or changing an external system's state.
measurement_requirements: Classify the application being described, rather than merely the text or commands produced internally. Distinguish demonstrated activity from proposed future capabilities.
source_requirements: Dated primary case studies or credible reporting available by 2026-04-14.
