assessment_axis: forecast_outcome
explicit_source_elements:
  - The failure of both parties
  - will lead to a market correction
  - likely dwarfs the Dot Com Bubble
evaluator_interpretation:
  - In context, both parties means the technology industry and the media, not political parties.
  - The ordinary reading is a future AI-related market downturn substantially more severe than the dot-com bust. It does not mean merely a larger nominal dollar loss in a larger market.
  - For comparison, use peak-to-trough percentage losses in a consistent US technology-market index, with a broad-market index as a cross-check. These are evaluator-selected measures, not measures named by Zitron.
  - Dwarfs means substantially exceeds; the speaker gives no numerical margin. A borderline comparison would remain unresolved.
  - Likely qualifies the predicted severity. A single eventual event can test the forecasted outcome but cannot establish whether its unstated probability was well calibrated.
  - The causal attribution requires separate evidence connecting identifiable industry and media conduct to the correction.
  - The insults are rhetorical judgments and are not included in the testable market forecast.
support_condition: A dated AI-related market correction produces percentage losses substantially greater than the dot-com comparison on consistent measures, with credible evidence that the identified industry and media failures materially contributed.
contradiction_condition: A completed, clearly identified AI bust has losses materially below the dot-com comparison, or credible causal evidence refutes the asserted mechanism for that episode. Mere passage of time without a correction cannot contradict this undated forecast.
measurement_requirements: Use consistent indexes, price or total-return conventions, and peak-to-trough windows for both episodes. Do not compare nominal dollar losses with percentage declines. Establish a completed episode before treating a smaller decline as contradictory, and distinguish causal evidence from commentary.
source_requirements: Index-provider data or reproducible market measurements for severity; filings, contemporaneous records, and credible causal research for the proposed mechanism. News may supply event context when a readable primary record is unavailable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: An observed AI-related decline that already substantially exceeds the dot-com benchmark, together with credible evidence for the claimed causal contribution, can establish support before a trough is known. A smaller ongoing decline or absence of a crash cannot settle the forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No forecast deadline.
  - No specified market index or geographical scope.
  - No numerical definition of dwarfs.
  - No specified severity measure or peak-to-trough window.
  - Industry and media failures are not operationally defined.
  - Likely supplies no numerical probability.
retrospective_or_prospective: retrospective
