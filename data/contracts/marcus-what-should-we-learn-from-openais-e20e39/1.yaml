assessment_axis: historical_observation
explicit_source_elements:
  - a Scarlett Johansson-like voice
  - for GPT-4o
  - even after she specifically told them not to
  - angered many
  - dismissive attitude towards artist consent
evaluator_interpretation:
  - The factual core is recognizable resemblance plus creation of the voice after Johansson’s refusal.
  - Making a voice is distinguished from subsequently demonstrating or releasing an existing voice.
  - Declining to provide her voice is distinguished from expressly forbidding use of another actor’s similar voice.
  - Entitlement and an overall attitude toward artists are judgments; they are not independently established by resemblance.
  - The target period includes development, solicitation, refusal, and the May 2024 demonstration. The claim supplies no starting date.
support_condition: Records establish recognizable resemblance and show that OpenAI created the relevant voice after Johansson expressly refused or objected to that use.
contradiction_condition: Reliable production records show that the voice was created before her refusal, or reliable evidence refutes the alleged resemblance. A mixed finding is appropriate if resemblance holds but the creation sequence fails.
measurement_requirements: Compare the voice’s casting and recording dates with the dates and scope of Johansson’s refusal. Separate perceived resemblance from proof of intentional imitation.
source_requirements: Johansson’s statement, OpenAI’s production account, and corroborating reporting or production records.
