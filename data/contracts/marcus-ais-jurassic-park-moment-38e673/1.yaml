assessment_axis: forecast_outcome
explicit_source_elements:
  - your own custom-trained large language model, for keeps
  - for less than $500,000
  - Soon the price will drop further
evaluator_interpretation:
  - "The $500,000 baseline matches MosaicML's September 2022 estimate of about $450K to train a GPT-3-quality model. I read the forecast as: soon after December 2022, a person could get their own trained LLM of similar quality, with weights they keep, for clearly less than that."
  - "'Soon' has no fixed date. I treat it as roughly within two years of the post, and settle it early only through a dated, documented price."
  - I count both training from scratch and fine-tuning an open model on your own data as 'custom-trained', since in both cases you own the resulting weights.
support_condition: A dated, documented price or cost, published soon after December 2022, under which a comparable custom LLM with owned weights could be obtained for clearly less than about $450-500K.
contradiction_condition: Documented costs for a comparable owned custom LLM stayed at or above about $450-500K for the two years after the post.
measurement_requirements: Published training or fine-tuning cost figures from providers or researchers, with model quality stated so it can be compared with the GPT-3-class baseline.
source_requirements: Provider announcements or technical reports giving costs; reputable news only as backup.
