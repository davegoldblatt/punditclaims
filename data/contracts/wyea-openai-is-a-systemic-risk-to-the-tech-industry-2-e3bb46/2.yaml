evaluator_interpretation:
  - This is stated as a belief about the situation at the time of the post. It is graded as a claim that, around April 2025, no provider other than Microsoft had existing (already built) capacity OpenAI could practically use to add compute.
  - Future builds (Stargate, CoreWeave's contracted 1.3 GW not yet built) do not count as existing. Contracts for capacity that is already built and supplied soon after the post do count.
  - Target period is Q2 2025, the quarter of the post. Arrangements closed within weeks of the post show which existing options were available then. This is flagged as a choice.
support_condition: Evidence that around April-June 2025 OpenAI could not get meaningful additional existing capacity from any provider other than Microsoft.
contradiction_condition: Evidence that around April-June 2025 OpenAI arranged or used existing cloud capacity from a provider other than Microsoft to meet its growing compute needs.
measurement_requirements: Reports or disclosures of OpenAI compute suppliers and arrangements in Q2 2025.
