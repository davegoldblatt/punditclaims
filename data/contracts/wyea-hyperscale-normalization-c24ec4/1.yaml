evaluator_interpretation:
  - Assess the central claim about publicly established profitability, not the literal beliefs of everybody.
  - The ordinary reading concerns whether operating an AI service or GPU-rental business can yield profit after relevant costs. Positive revenue or a margin excluding major costs is insufficient on its own.
  - Do not restrict 'any kind' to frontier model developers or require every AI business to be profitable. A well-established profitable example would challenge the broad claim.
  - Use April through June 2026 as the latest completed quarterly reporting period before the post for ongoing financial observations. Earlier examples remain context.
  - Because the claim concerns what was publicly understood on September 1, later disclosures cannot retroactively establish public understanding on that date.
  - The asserted causal link between prior investment and universal confidence is rhetorical and is not independently resolved by financial statements.
support_condition: A sufficiently broad contemporaneous review establishes that public evidence did not clearly demonstrate full-cost profitability for AI services or GPU rental. Losses at selected firms alone are insufficient.
contradiction_condition: Public evidence available by September 1 clearly establishes at least one qualifying AI-service or GPU-rental operation earning profit after relevant costs during the target period. Revenue growth, hardware-vendor profits and unrelated business profits do not qualify.
measurement_requirements: Distinguish gross margin, adjusted EBITDA, operating income, net income and cash flow. Identify depreciation, financing, research costs, shared-cost allocations and non-operating gains where relevant. Establish when the information became public.
source_requirements: Prefer financial statements and transparent cost analyses. Attributed claims of private-company profitability are relevant counterevidence but require scrutiny of period and cost coverage.
