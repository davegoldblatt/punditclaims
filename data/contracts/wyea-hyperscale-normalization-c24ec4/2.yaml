original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - "'Real clear understanding' has no stated standard."
  - "'Any kind of AI service' is unbounded."
  - Which profit measure counts (GAAP net, GAAP operating, or adjusted operating) decides the answer and is not stated.
  - The claim is about what is known, not about profit itself.
