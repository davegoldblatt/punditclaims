  - what people like Yann LeCun or Judea Pearl or I would call a world model
evaluator_interpretation:
  - Read LLMs as the models themselves, without separately attached databases or retrieval systems.
  - A database of records means an explicit, addressable record store. Information encoded in model weights does not by itself qualify.
  - "The world-model qualification matters: finding any internal representation does not automatically establish that it meets the named researchers’ requirements."
  - The claim describes an ongoing state at publication. Use the current year's reporting window, 2025-01-01 through 2025-05-05; earlier studies provide context. This reporting convention is an evaluator choice because scientific model evaluations have no standard reporting quarter.
support_condition: Architecture documentation establishes the absence of an explicit record store across representative contemporary LLMs, and suitable tests establish that their internal representations do not meet the named world-model requirements.
contradiction_condition: A model within the stated scope demonstrably contains an explicit record store or a world model meeting the named requirements. External components and narrower definitions of world model do not suffice.
measurement_requirements: Specify model versions, distinguish model internals from attached tools, and assess predictive or causal representations against explicit criteria.
source_requirements: Primary architecture documentation, the named researchers’ definitions, and controlled studies of model representations.
