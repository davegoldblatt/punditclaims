assessment_axis: causal_assessment
explicit_source_elements:
  - Token spend has plateaued for months
  - token prices are collapsing
  - AI labs cut prices to compete
  - closed and open source competitors
evaluator_interpretation:
  - Token spend means money paid for model inference, rather than token volume, subscriptions generally, or annualized laboratory revenue.
  - Use August through October 2026, the latest three completed months before publication, as an ordinary reading of 'for months'. Two months is also plausible.
  - A plateau means no material sustained spending growth; collapsing prices means a large, sustained decline in comparable per-token prices.
  - Separate posted price cuts from average prices falling because customers choose cheaper models or use different token types.
  - The causal assertion requires evidence that competitive pressure contributed to providers’ cuts, beyond simultaneous changes in prices and usage.
  - No company list, currency, accounting basis, or numeric threshold is supplied.
support_condition: Representative monthly expenditure data show a sustained plateau, comparable API prices decline sharply, and provider statements or credible analysis link the cuts to competition from closed and open models.
contradiction_condition: Comparable expenditure data show material sustained growth, comparable prices do not decline sharply, or credible causal evidence refutes competition as a contributor to the asserted cuts.
measurement_requirements: Monthly monetary expenditure for a stable population; prices adjusted for model and token-type mix; dated provider price schedules and evidence about reasons for cuts.
source_requirements: Provider billing data, transparent independent spending measurements, historical API pricing, and dated accounts of pricing decisions.
metric_scope:
  company: AI labs collectively; firms unspecified
  metric: Token expenditure and per-token pricing trend
  currency: null
  units: Money spent and price per token; denomination unspecified
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-08-01
  period_end: 2026-10-31
  stock_or_flow: flow
