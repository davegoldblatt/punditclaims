interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Three completed months selected; the speaker does not specify their number or endpoints.
  - No geographic or customer population is identified.
  - Spend is distinct from token volume.
  - Average realized prices, published list prices, and fixed-capability prices are different.
  - No accounting basis or numerical plateau/collapse threshold is supplied.
  - Competition and inference efficiency can both affect prices.
