  end: 2026-03-31
  precision: day
condition_status: not_applicable
early_resolution_rule: A forecast component can be contradicted early by documented sustained full-cost profitability or sustained cost-covering customer payments causally attributable to the intervention it rules out. Require at least two comparable quarters for persistence. Price reductions alone do not resolve the composite forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Composite observation and forecast.
  - No forecast deadline.
  - Cheaper could mean customer prices, provider unit costs, or total spending.
  - Observation quarter is evaluator-selected.
  - Real businesses is rhetorical; economic self-sufficiency is the contextual reading.
  - Profit measure, accounting basis, actual-cost boundary, and persistence threshold are unspecified.
  - Causal effects cannot be inferred solely from events occurring after expansion.
