assessment_axis: forecast_outcome
explicit_source_elements:
  - it’ll magically get cheaper
  - That is not something that’s happening
  - More data centers will not make OpenAI or Anthropic profitable
  - will not make customers more willing to pay the actual cost of AI
  - More venture capital funding will not make Anthropic or OpenAI real businesses
evaluator_interpretation:
  - This combines a present observation with several forecasts. The forecast outcome is the principal assessment axis.
  - The ordinary reading of cheaper concerns the cost of comparable useful AI service. Customer prices, provider production costs, and total company spending must be distinguished.
  - For the present-tense component, I use January–March 2026, the latest completed reportable calendar quarter before the post, with comparison to earlier periods.
  - In context, real businesses means businesses able to cover their continuing costs from customers, rather than merely legally incorporated companies.
  - The data-center and funding statements predict causal effects. Profitability following expansion alone would not establish that expansion caused it.
  - A sustained profitability test means at least two consecutive comparable quarters including training and compensation. This persistence threshold is an evaluator choice.
  - No deadline or accounting basis is specified.
support_condition: Period-matched evidence supports the present cost observation, and credible causal evidence supports the proposed limits of expansion and funding. A finite period of losses cannot establish the unlimited future negatives.
contradiction_condition: A sustained, documented transition to full-cost profitability attributable to added capacity or funding refutes the relevant forecast. Evidence that customers sustain purchases covering actual costs because of the expansion refutes the willingness-to-pay forecast. Comparable cost declines can refute the narrower present observation without settling the forecasts.
measurement_requirements: Separate comparable-task prices from provider costs and aggregate spending. Require reconciled operating results, customer payment evidence, dated capacity or funding changes, and evidence identifying their contribution to the result.
source_requirements: Prefer financial statements, dated product-price announcements, independent task-cost measurements, and documented capacity deployment. Company efficiency claims require attribution.
metric_scope:
  company: OpenAI and Anthropic, separately
  metric: Full-cost business profitability following data-center expansion or additional funding
  currency: null
  units: null
  accounting_basis: unknown
