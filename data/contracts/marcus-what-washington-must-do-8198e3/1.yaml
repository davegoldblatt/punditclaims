evaluator_interpretation:
  - "The surrounding sentences supply the plain reading: the White House’s June 12 action was incompatible with a categorical position that no AI model should ever face government restrictions."
  - This assesses the administration’s position during June 12–14, not the permanent disappearance of an ideology or agreement across all political actors.
  - Rightly is a value judgment. The aside about Andreessen does not define the central policy proposition being assessed.
  - Regulation includes compulsory restrictions on model access through export controls; it does not require a general licensing statute.
support_condition: The administration imposed or defended compulsory restrictions on access to particular AI models, thereby accepting model regulation in at least some circumstances.
contradiction_condition: The cited action did not restrict models and the administration maintained a categorical position against any such restrictions.
measurement_requirements: Distinguish compulsory model restrictions from voluntary testing, and limited acceptance of regulation from a comprehensive regulatory policy.
source_requirements: The directive, official explanations, or reliable reporting establishing its terms and implementation.
