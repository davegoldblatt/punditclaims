evaluator_interpretation:
  - The speaker states a personal estimate ("I think") and leaves it out of his own total on purpose. It is a hedged guess, not a firm claim of fact.
  - Many of the listed entities are private, sovereign, or off-balance-sheet, and publish no construction-in-progress figures. Microsoft does not break out CIP, as the post itself notes. Even a firm version of the claim could not be summed from public sources.
  - Under the register's policy, a hedged estimate is not scored. It is recorded as not adjudicable.
support_condition: Not scored. It could only be supported if the disclosed or reported CIP of the listed excluded entities added up to at least about $50 billion around September 2026.
contradiction_condition: Not scored. It could only be contradicted if the complete CIP of all listed entities were shown to add up to clearly less than $50 billion.
measurement_requirements: None, because the claim is not scored. A score would need CIP figures for every listed entity at about the same date.
