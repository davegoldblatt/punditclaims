assessment_axis: historical_observation
explicit_source_elements:
  - beating benchmarks doesn’t tell you as much as you might think
  - Often when you do, it’s a statistical artifact
evaluator_interpretation:
  - Statistical artifact means that apparent success materially depends on dataset-specific correlations or labeling conventions instead of the capability being inferred.
  - In context, beating benchmarks includes strong or leading benchmark performance, not only formally exceeding a human score.
  - Often means recurring documented cases across benchmarks. It does not mean that most gains are entirely illusory.
  - The context expressly compares the 2019 literature with its continuing relevance in 2023, so the target is that cumulative period.
  - The claim about what readers think is assessed as a warning against overinterpreting scores, not as a measured claim about public beliefs.
support_condition: Controlled evaluations repeatedly connect strong benchmark performance to shortcuts or dataset artifacts, with weaker performance when those artifacts are removed or challenged.
contradiction_condition: Broad controlled evaluations show that apparent successes generally survive removal of suspected artifacts and that artifact-driven success is exceptional.
measurement_requirements: Tests that alter misleading correlations or labels while preserving the intended task, distinguishing score inflation from genuine transferable gains.
source_requirements: Primary benchmark audits or controlled experiments concerning systems and results within the target period.
