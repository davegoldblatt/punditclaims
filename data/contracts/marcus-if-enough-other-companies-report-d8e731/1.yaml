assessment_axis: historical_observation
explicit_source_elements:
  - study after study after study
  - most companies
  - significant return
  - AI investment
evaluator_interpretation:
  - The assessed proposition concerns published study findings, not the separate autobiographical statement about when Marcus began discussing errors.
  - Most means more than half. Significant means material realized business or financial benefit, not statistical significance.
  - The retrospective phrase 'has shown' covers studies available by May 26, 2026. No starting date for those studies is supplied.
  - Multiple independent studies can support the claim even if narrower studies find better results. Survey findings do not establish an audited return for every company.
support_condition: At least two studies available by the post date find that more than half of surveyed companies lack material realized benefits from AI investment.
contradiction_condition: The purported supporting studies do not find a majority lacking material returns, or their relevant findings instead show a majority achieving such returns.
measurement_requirements: Check the survey population, denominator, realized benefits, and distinction between companies, projects, expected returns, and achieved returns.
source_requirements: Original study publications or announcements from the organizations conducting them.
