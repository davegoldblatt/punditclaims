assessment_axis: historical_observation
explicit_source_elements:
  - across the board
  - anything above 50MW
  - 18 to 36 months to complete
  - nobody has actually built a gigawatt data center
evaluator_interpretation:
  - Read 'across the board' as a general assertion covering completed data-center construction above 50 MW, rather than an average build time.
  - Count a delivered, energized construction phase exceeding 50 MW as completed data-center capacity even when further campus phases remain planned. This is an explicit interpretation of the unspecified unit of completion.
  - Measure construction through delivery and energization, rather than announcement of a future project. Do not require full customer utilization.
  - For the gigawatt clause, require at least 1 GW of completed, operational capacity at one site or campus; planned ultimate capacity and capacity spread across separate sites do not qualify.
  - Respect the surrounding text's explicit exception for the Colossus-1 conversion.
  - The observation concerns the historical record through publication. No starting date is supplied.
support_condition: A sufficiently comprehensive record supports the 18–36 month range for qualifying completed projects and establishes that no single site or campus had reached 1 GW of completed operational capacity by publication.
contradiction_condition: A documented qualifying completion outside 18–36 months contradicts the construction-time assertion. Alternatively, a verified site with at least 1 GW completed and operational by publication contradicts the gigawatt assertion.
measurement_requirements: Identify construction scope, power capacity, construction start, and delivery or commissioning. Distinguish a completed phase from the ultimate campus, and energized capacity from announcements.
source_requirements: Developer completion disclosures, commissioning records, permits, or independently verified construction records available by the evaluation date.
