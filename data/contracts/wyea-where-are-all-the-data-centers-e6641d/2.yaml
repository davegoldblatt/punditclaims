assessment_axis: historical_observation
explicit_source_elements:
  - across the board
  - a data center of anything above 50MW
  - or lower, in some cases
  - 18 to 36 months to complete
  - nobody has actually built a gigawatt data center
evaluator_interpretation:
  - Read the construction range as a claim about ordinary full-project delivery times. The surrounding discussion acknowledges exceptional conversions, so one unusually fast project does not by itself disprove the range.
  - Completion means completion of the facility or campus whose capacity is being quoted. Delivery of an initial phase does not establish completion of the larger project.
  - Measure construction from the start of physical site construction through completion and commissioning of that same project. Report separately any earlier planning, permitting or power procurement.
  - The gigawatt assertion concerns a completed facility or campus with at least 1,000 MW of usable capacity by publication. Announced ultimate capacity, power reservations and equipment orders do not establish this.
  - The speaker does not specify IT power versus total facility power. Preserve each source's definition and do not convert between them without evidence.
  - The observation describes construction experience and completed facilities up to May 12, 2026. No historical starting date is supplied, so the target period has no lower bound. Use the latest documented status before publication; there is no common quarterly reporting period for this worldwide claim.
support_condition: Representative records of completed projects above 50 MW establish 18–36 months as the ordinary construction-to-completion range, and sufficiently broad records of the largest facilities establish that no completed gigawatt facility or campus existed by May 12, 2026.
contradiction_condition: Representative completed-project records show that the ordinary delivery range is materially outside 18–36 months, or reliable commissioning and capacity records identify a completed gigawatt facility or campus by May 12, 2026. An exceptional conversion or an early campus phase alone does not disprove the ordinary build-time claim.
measurement_requirements: Match construction start, completion, commissioning and MW capacity to the same project boundary. Distinguish whole campuses, individual facilities and phases. Record whether MW measures IT capacity or total facility capacity, and whether it is operational or planned.
source_requirements: Prefer developer completion disclosures, contractor records, commissioning documents and dated independent measurements. General benchmarks can inform typical duration but cannot establish worldwide absence. Forecast dates and promotional capacity labels require corroboration.
