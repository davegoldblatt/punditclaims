assessment_axis: historical_observation
explicit_source_elements:
  - Rabbit’s R1 device
  - has launched without several key features
  - “Teach Mode”
  - a stable, reliable version of its alleged “Large Action Model.”
evaluator_interpretation:
  - Launch means the initial consumer release in April 2024, assessed through the May 6 post. The target period begins at the month boundary because the claim supplies no launch day.
  - Teach Mode being absent means ordinary buyers could not use it. A demonstration or restricted test does not establish general availability.
  - Stable and reliable means advertised service actions worked dependably in ordinary use. Repeated failures to complete basic supported tasks count against reliability; occasional successes do not establish it.
  - The LAM wording concerns the delivered action-taking experience. It does not require proving that no underlying model existed or identifying which component caused each failure.
  - The two named features define the checkable scope. No additional numerical requirement is inferred from 'several'.
support_condition: Launch documentation and contemporary testing establish that Teach Mode was unavailable to ordinary buyers and that advertised LAM service actions repeatedly failed in ordinary use.
contradiction_condition: Evidence establishes that Teach Mode was available to ordinary buyers at launch and that advertised LAM actions worked consistently in ordinary use. If only one named component is established and the other is refuted, the result is mixed.
measurement_requirements: Use launch-period feature documentation and firsthand tests of supported service actions. Distinguish completed transactions from demonstrations, intermediate screens and general chatbot answers. No numerical reliability threshold was stated.
source_requirements: Prefer Rabbit's own feature documentation and contemporaneous independent firsthand testing. Later improvements cannot refute a launch-period observation.
