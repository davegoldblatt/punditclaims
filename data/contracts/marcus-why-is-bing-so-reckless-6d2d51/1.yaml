horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after the antecedent is established and dated evidence establishes both predicted consequences or decisively refutes a consequence under that antecedent. An isolated unsafe output or an isolated retraining exercise does not qualify.
