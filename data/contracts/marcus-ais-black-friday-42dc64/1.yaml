evaluator_interpretation:
  - "'Friday' means the US trading session of Friday, June 5, 2026; 'overnight' means that single session."
  - "'On the order of half a trillion' is a rough size estimate. The plain reading is that tech-sector market value losses that day were at least roughly $500 billion, not a few tens of billions. A loss that turns out larger than his figure does not make the statement false."
support_condition: Reliable market reporting shows tech-sector market value losses on June 5, 2026 of roughly $500 billion or more.
contradiction_condition: Reliable reporting shows tech losses that day well below roughly $500 billion (for example under $250 billion), or no large selloff on that day.
measurement_requirements: Total market capitalization lost by tech or semiconductor stocks in the June 5, 2026 session.
