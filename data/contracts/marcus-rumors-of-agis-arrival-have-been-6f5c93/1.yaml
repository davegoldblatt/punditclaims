explicit_source_elements:
  - As a result
  - optimized for benchmark success
  - degrade in real-world settings that differ only modestly
  - remain accurate despite missing key inputs
  - unstable under minor distribution shifts
  - fluent but flawed reasoning
evaluator_interpretation:
  - The claim attributes a generalization gap to benchmark-focused training and data curation.
  - The medical examples are testable manifestations of fragility, but observing them alone does not identify their training cause.
  - Degrade means performance falls when relevant task conditions change modestly. It need not mean benchmark optimization makes the model worse than its own untrained baseline.
  - Real-world settings require evidence beyond altered benchmark questions, or a justified connection between those alterations and deployed use.
support_condition: Controlled comparisons or other credible causal evidence show that benchmark-focused optimization creates or materially contributes to the claimed generalization gap, with medical studies corroborating the stated failure modes.
contradiction_condition: Relevant causal comparisons show that benchmark-focused optimization does not produce the claimed gap, and adequately powered robustness evaluations fail to reproduce the described degradation.
measurement_requirements: Compare training or curation choices while controlling model capability, training resources and evaluation difficulty. Separate benchmark stress tests from observed clinical deployment.
source_requirements: Primary experimental papers, including Gu et al. (2025), with disclosed methods and suitable comparison conditions.
