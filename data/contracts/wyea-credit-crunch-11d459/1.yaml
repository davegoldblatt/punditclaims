explicit_source_elements:
  - any “virgin” projects
  - aren’t directly backstopped or co-signed by hyperscalers
  - guaranteed
  - 9% to 14% rates
  - near-impossible
  - economics of running a data center
evaluator_interpretation:
  - The qualifying condition is a new AI data center project financing without a direct hyperscaler backstop or co-signature.
  - A hyperscaler customer alone does not establish a financing guarantee. Silence about guarantees does not prove their absence.
  - I read rates as all-in annual borrowing costs, including material discounts and fees, rather than the loan margin alone.
  - I assess financings after publication. The claim states no deadline.
  - Near-impossible economics means debt service makes commercially viable operation exceptionally difficult, not merely that financing is costly.
support_condition: Verified qualifying financings carry all-in annual rates of 9–14%, and representative project cash-flow evidence shows that these costs make viable operation nearly unattainable. A few conforming transactions cannot establish the universal guarantee.
contradiction_condition: A completed qualifying financing outside 9–14% supplies a counterexample to the guaranteed range. Demonstrated sustainable project economics can separately challenge the economic consequence.
measurement_requirements: Establish project purpose, closing date, all guarantors and backstops, benchmark rate, margin, issue discount and fees. Assess project cash flows after operating costs, maintenance investment and debt service.
source_requirements: Executed financing documents or sufficiently complete issuer and lender disclosures; independently checkable project economics.
