assessment_axis: historical_observation
explicit_source_elements:
  - real, diverse demand does not exist for AI compute
  - the same four or five companies
  - the only ones interested in renting it at scale
evaluator_interpretation:
  - The plain reading concerns substantial commercial rentals of AI compute, not the existence of small customers or users of AI applications.
  - The nearby reference to $50 million a year helps explain scale but does not establish a strict threshold for this sentence.
  - I use January through March 2026, the latest regular reporting quarter available before the July 22 post. Subsequent announcements are context unless they establish facts about that quarter.
  - Customer diversity requires distinct economic buyers. Resellers and their underlying customers must not be counted twice.
support_condition: Comparable market-wide evidence shows that substantial AI compute rental demand was effectively confined to four or five economic buyers.
contradiction_condition: Comparable evidence establishes substantial AI compute rentals by materially more than five independent buyers, with a meaningful commercial presence outside the dominant group.
measurement_requirements: Customer-level rental spending, contracted capacity or comparable utilization, with consistent coverage and identification of intermediaries. Customer counts alone do not establish scale.
source_requirements: Provider filings, customer contracts or independently verified market measurements. Management descriptions of demand require corroboration.
