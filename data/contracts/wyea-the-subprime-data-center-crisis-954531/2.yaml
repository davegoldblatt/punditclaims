ambiguity_flags:
  - At scale has no explicit numerical threshold.
  - The four or five companies are not exhaustively identified.
  - Real and diverse have no specified independence or concentration measure.
  - The ongoing observation has no explicit reporting period; the assessment includes the latest reporting cycle and developments through publication.
  - The wording does not distinguish direct rental counterparties from ultimate users.
