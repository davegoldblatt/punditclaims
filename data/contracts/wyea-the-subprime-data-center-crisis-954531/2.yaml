assessment_axis: historical_observation
explicit_source_elements:
  - real, diverse demand does not exist for AI compute
  - the same four or five companies
  - the only ones interested in renting it at scale
evaluator_interpretation:
  - The plain reading is that commercially substantial rental demand is confined to a small, recurring group of buyers. This is stronger than saying that the market is highly concentrated.
  - At scale means substantial commercial training or production capacity, demonstrated by actual purchases or signed rental commitments. Customer logos, trials and general expressions of interest are insufficient.
  - The surrounding reference to $50 million a year helps indicate the scale intended, but does not establish an explicit numerical cutoff for this sentence.
  - Count independent buying companies, consolidating affiliates and avoiding double-counting intermediaries and their disclosed ultimate customers. An investment relationship alone does not establish that a customer's demand is fictitious.
  - "Use January 1 through July 22, 2026: the latest reported quarterly cycle available before the post, extended through publication to capture its ongoing July observation and intervening contracts. Later disclosures may establish facts within that period."
  - This concerns market participation, rather than a specified company's financial metric; metric_scope is therefore null.
support_condition: Broad, buyer-level evidence across major rental providers shows that substantial commercial AI compute demand is confined to the same four or five independent companies, with other customers contributing only small or experimental demand.
contradiction_condition: Dated purchases or signed commitments establish substantial commercial rental demand from more than five independent buyers, including meaningful demand outside the recurring hyperscaler and frontier-lab group described in context. High concentration can coexist with this contradiction.
measurement_requirements: Identify buyers, their corporate relationships, AI-specific rented capacity or spending, contract dates and durations, and any ultimate customers behind intermediaries. Distinguish individual contract values from portfolio totals, commitments from realized revenue, and rental demand from hardware purchases or financing.
source_requirements: Prefer filings and dated customer or provider disclosures. Company customer lists and aggregate growth claims need buyer-level scale evidence. Sources must have been available by October 28, 2026.
