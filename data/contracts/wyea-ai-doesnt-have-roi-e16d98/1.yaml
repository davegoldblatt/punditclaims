ambiguity_flags:
  - AI does not specify products, providers, or a representative workload.
  - More expensive could mean customer charges, provider costs, frontier-model costs, or total organizational bills.
  - No interval is supplied for the ongoing trend immediately before the post.
  - Three years ago is an approximate comparison date.
