assessment_axis: historical_observation
explicit_source_elements:
  - AI is more expensive today
  - than it was three years ago
  - it is not getting cheaper
evaluator_interpretation:
  - Today means June 2, 2026; three years ago means approximately June 2023.
  - In the surrounding discussion of inference and customer bills, the plain reading is the cost of obtaining comparable useful work from generative AI.
  - The comparison must account for total token consumption and repeated calls, not just token prices.
  - Not getting cheaper is read as an ongoing trend at the post date, not an unlimited forecast about all future prices.
  - The claim concerns service costs broadly, not a specified company's financial metric.
support_condition: Comparable task-cost measurements show higher costs around June 2026 than around June 2023, with no meaningful decline in the period immediately preceding the post.
contradiction_condition: Comparable measurements show lower task costs around June 2026 than around June 2023, or a clear decline in comparable task costs immediately before the post.
measurement_requirements: Use unchanged task definitions and completion standards; count input, output, reasoning, caching, retries, and agent calls. Distinguish customer charges from provider production costs and fixed-quality comparisons from maximum-performance comparisons.
source_requirements: Independent, reproducible historical comparisons with identifiable prices and model availability. Later publications are acceptable only when their relevant observations describe the claimed period.
