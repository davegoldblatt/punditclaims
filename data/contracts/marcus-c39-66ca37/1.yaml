explicit_source_elements:
  - Critical things like factuality, compositionality, and common sense
  - aren't even addressed
  - by the ARC-AGI test
evaluator_interpretation:
  - The test is ARC-AGI-1, whose design dates from 2019 and stood unchanged in December 2024.
  - "Plain reading: the claim holds for each item if ARC's design does not test it at all. It fails for an item if ARC's design documents show the tasks deliberately draw on it."
  - Factuality means knowledge of facts about the world. Compositionality means combining known rules or concepts. Common sense means everyday intuitive knowledge about the world, including basic physical intuitions.
support_condition: ARC design documents show the tasks exclude factual knowledge, do not test combining concepts, and do not draw on commonsense knowledge.
contradiction_condition: ARC design documents show the tasks deliberately test combining concepts or rely on commonsense priors such as objectness and elementary physics.
measurement_requirements: null
source_requirements: Chollet's 2019 paper, ARC Prize documentation, and the ARC-AGI-2 paper describing ARC-AGI-1.
