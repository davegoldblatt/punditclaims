assessment_axis: historical_observation
explicit_source_elements:
  - In 2016 Geoff Hinton promised that we no longer need to train radiologists
  - Almost a decade later
  - not one (to my knowledge) has been replaced
evaluator_interpretation:
  - "The claim has two parts: that Hinton said in 2016 we should stop training radiologists, and that by 2025 AI had not displaced radiologists."
  - Given the hedge 'to my knowledge', the plain reading is that there was no documented displacement of radiologists by AI. Rising demand, rising headcount and no reported AI-driven radiologist job cuts would support it.
support_condition: A record shows Hinton's 2016 statement, and 2025 evidence shows radiologist demand, headcount or training positions rising, with no documented AI-driven replacement of radiologists.
contradiction_condition: Documented cases of radiologist positions eliminated because AI took over the reading, or a falling radiologist workforce due to AI, before August 2025.
measurement_requirements: Residency positions, workforce counts, vacancy rates and salaries, 2016–2025, and any documented AI-driven radiologist job cuts.
source_requirements: Workforce data, institutional reports, or well-sourced analyses and news.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: "2016"
  end: 2025-08-23
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Not one' is an absolute, softened by 'to my knowledge'. It is assessed as 'no documented AI replacement', not a literal census."
  - Marcus paraphrases Hinton ('no longer need to train'). Hinton's recorded words were 'people should stop training radiologists now'.
