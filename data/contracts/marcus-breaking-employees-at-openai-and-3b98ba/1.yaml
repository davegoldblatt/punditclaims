assessment_axis: causal_assessment
explicit_source_elements:
  - Turning them into agents
  - with internet access
  - has made them fundamentally more dangerous
evaluator_interpretation:
  - The ordinary reading is that adding autonomous action through internet-connected tools materially increases potential harm compared with otherwise comparable text-only use.
  - Fundamentally is read as a meaningful change in the ability to cause harm, not as a specified numerical increase or a claim that harm is inevitable.
  - The causal treatment combines agency and internet access. Evidence must distinguish its effect from differences in model capability or attack instructions.
  - The surrounding retrospective discussion supplies late 2022 through publication as the relevant period.
support_condition: Controlled comparisons or causal demonstrations establish additional harmful actions or consequences attributable to granting autonomous internet-connected access to otherwise comparable models.
contradiction_condition: Representative controlled comparisons show no material additional danger from granting that access under the relevant conditions.
measurement_requirements: Compare the same model and tasks with and without autonomous internet-connected access, accounting for permissions, safeguards, human execution, and attacker behavior. Measure completed harmful actions or consequences, not only harmful text or task capability.
source_requirements: Primary experiments with clear interventions and outcome measurements. Demonstrations involving only enabled agents establish possible harm but may not identify the comparative effect of granting access.
