assessment_axis: historical_observation
explicit_source_elements:
  - Nobody has made a profit from AI
  - those making revenue aren’t really making much
evaluator_interpretation:
  - The surrounding discussion concerns generative-AI service providers buying compute. I therefore read this as covering those providers, including image-generation businesses, rather than only OpenAI and Anthropic.
  - The ordinary reading of profit is revenue exceeding the business's costs, rather than positive gross margin on selected products.
  - "'Has made' reaches back before the post and is not limited to one quarter. For the ongoing revenue comparison, the latest completed calendar quarter before publication is July–September 2025."
  - "'Aren’t really making much' appears to compare revenue with the costs and investment described nearby. It supplies no numerical threshold."
  - No accounting basis is supplied for the universal profitability assertion. I retain unknown rather than importing a basis from a possible counterexample.
support_condition: Comparable financial evidence would need to establish that no generative-AI service provider had earned a business profit by publication. The revenue clause would additionally require an identifiable comparison showing revenues were small relative to the relevant costs.
contradiction_condition: One verified instance of a generative-AI service provider earning a business profit before publication would contradict the universal profitability clause. The revenue clause needs a defined comparison before it can be separately contradicted.
measurement_requirements: Distinguish business profit from gross margin, cash flow, investment gains and the profitability of a diversified parent. Revenue comparisons must use realized revenue and corresponding costs.
source_requirements: Financial disclosures or independently corroborated reporting. A founder's assertion is relevant counterevidence but does not establish an unspecified accounting measure.
