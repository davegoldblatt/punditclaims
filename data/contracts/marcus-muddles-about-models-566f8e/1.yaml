explicit_source_elements:
  - correlations are fragile
  - you can’t count on them
  - doesn’t really model the rules of chess well enough to stick to them
evaluator_interpretation:
  - The claim concerns the cause of rule violations by GPT systems contemporary with the October 2023 post.
  - The plain reading is that reliance on learned correlations explains recurring illegal moves. Demonstrating illegal moves alone does not establish this explanation.
  - Controlled changes to board-state information, training, or internal representations could distinguish this explanation from other causes.
support_condition: Contemporary GPT chess evaluations establish recurring rule violations, and controlled experiments identify reliance on correlations without adequate board-and-rule representations as a cause.
contradiction_condition: Controlled experiments on the relevant systems establish usable board-and-rule representations and show that the attributed absence of those representations does not explain the violations.
measurement_requirements: Record model versions, prompts, sampling settings, complete games, legal-move checks, and controlled interventions. Distinguish playing strength from move legality.
source_requirements: Reproducible evaluations and technical investigations of the relevant GPT systems. Other models and later systems provide context only.
