measurement_requirements: The original question, preceding conversation, model identification, and search trace are needed to distinguish an unsolicited lookup from a user-requested search.
source_requirements: Prefer preserved interactions and firsthand demonstrations. Marcus's assertion alone cannot verify the pizza example.
