assessment_axis: forecast_outcome
explicit_source_elements:
  - AGI is imminent
  - almost certainly wrong
evaluator_interpretation:
  - This sentence restates the earlier forecast in the same post. Read imminent as the explicitly stated next two to three years, ending March 5, 2028.
  - "Use the same post's definition: a system capable of doing almost any cognitive task a human can do."
  - This contextual deadline is an evaluator interpretation; the isolated sentence supplies none.
  - Assess occurrence of the forecast event, not the calibration of almost certainly from a single outcome.
support_condition: After March 5, 2028, sufficiently comprehensive evidence establishes that no qualifying system arrived during the contextual two-to-three-year forecast interval.
contradiction_condition: A system meeting the post's definition is demonstrated to have existed by March 5, 2028, with credible independent evaluation of its breadth.
measurement_requirements: Broad human-comparison evaluations covering varied and unfamiliar cognitive tasks, with disclosed reliability, assistance and system configuration. A narrow benchmark or an AGI label is insufficient.
source_requirements: Public technical documentation and credible independent evaluations available by the evaluation date.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted early only upon a dated, independently substantiated demonstration meeting the post's AGI definition. No early support follows merely from the absence of such a demonstration.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The deadline and AGI definition are inherited from the earlier passage.
  - Read alone, imminent supplies no fixed horizon.
  - Almost any lacks a specified coverage or reliability threshold.
  - Almost certainly is probabilistic rather than absolute.
