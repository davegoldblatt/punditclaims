explicit_source_elements:
  - “costs will just come down”
  - “the costs never come down”
  - Context names OpenAI and Anthropic and discusses the last two years.
evaluator_interpretation:
  - The contextual reading concerns the labs' aggregate financial costs, rather than customer prices or cost per token.
  - The surrounding figures are press estimates, so estimate is the implied accounting basis.
  - I read the retrospective period as the two years ending on the post date.
  - Expenses, cash burn, losses and revisions to projected spending require separate comparisons. None automatically substitutes for another.
  - No reporting frequency is specified. Annual increases alone cannot establish that costs never declined in any comparable reporting period.
support_condition: Comparable records for both labs show no decline in aggregate costs across the reporting periods covered by the claim, using consistent definitions and accounting treatment.
contradiction_condition: A comparable decline in either lab's aggregate costs during the target period. A decline in cash burn alone settles only an interpretation that explicitly equates costs with cash burn.
measurement_requirements: Compare equal-length periods, consistent expense definitions and the same accounting basis. Separate realized expenses from forecasts, net cash outflows and unit prices.
source_requirements: Financial disclosures or independently corroborated financial reporting. The speaker's own reporting cannot establish the outcome.
