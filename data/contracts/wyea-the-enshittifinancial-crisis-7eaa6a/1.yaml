assessment_axis: historical_observation
explicit_source_elements:
  - remove the contracts signed by hyperscalers and OpenAI
  - based on my analysis
  - less than a billion dollars of AI compute revenue in 2025
  - 0.5831% of the money spent on data centers
evaluator_interpretation:
  - The assessed threshold is realized AI-compute rental revenue below USD 1 billion during calendar 2025.
  - I read the exclusion as removing transactions in which hyperscalers or OpenAI purchase compute, rather than removing every sale by a supplier that also serves those customers.
  - Hyperscalers includes large-scale operators such as Microsoft, Amazon, Alphabet, Meta and Oracle; borderline classifications must be disclosed and tested for sensitivity.
  - The customer exclusion is a market-definition rule, not a conditional forecast.
  - The full calendar year follows the explicit wording in 2025, although the post appeared two days before year-end.
  - The accompanying percentage requires a separately defined data-center-spending denominator. It cannot be verified from the revenue threshold alone.
support_condition: A sufficiently complete, consistently defined estimate places eligible realized 2025 AI-compute rental revenue below USD 1 billion. Verification of the accompanying percentage additionally requires a matching spending denominator.
contradiction_condition: A same-scope market estimate, or a documented non-overlapping lower bound, establishes eligible realized 2025 revenue of at least USD 1 billion.
measurement_requirements: Calendar-year realized rental revenue by supplier and customer category, with hyperscaler and OpenAI purchases removed. Exclude financing, contract backlog, hardware sales and annualized run rates; reconcile gross-versus-net presentation and overlapping transactions.
source_requirements: Supplier filings and customer-level disclosures, or a documented market estimate reconciled to those records. Private-company estimates must disclose periods, customer exclusions and methods.
