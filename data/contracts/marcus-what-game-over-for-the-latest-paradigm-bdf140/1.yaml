evaluator_interpretation:
  - Scaling maximalism means the contextual hypothesis that scaling existing approaches could produce AGI without fundamental new innovation.
  - The ordinary reading is widespread enthusiasm in the AI research and industry community, substantially encouraged by demonstrated capability gains. Prominent endorsements alone do not establish its prevalence.
  - The context concerns the period from the May 2022 endorsement through publication. No numerical popularity threshold or causal share is supplied.
support_condition: Contemporaneous evidence establishes widespread acceptance of the hypothesis and shows that demonstrated gains from larger models substantially motivated that acceptance.
contradiction_condition: Evidence covering the relevant community establishes that the hypothesis had little acceptance, or that capability gains did not substantially motivate its acceptance.
measurement_requirements: Distinguish belief that scaling helps from belief that scaling existing approaches can suffice for AGI. Assess prevalence and adherents' stated reasons separately.
source_requirements: Prefer contemporary surveys with disclosed sampling and questions, together with direct statements from researchers and industry participants.
