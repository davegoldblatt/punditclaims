assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic and OpenAI’s largest customers cannot afford to pay them
  - need them to keep paying them more every quarter
  - every single AI startup
  - will need to raise more and more money to do so
evaluator_interpretation:
  - In context, cannot afford means model payments cannot be sustained from operating receipts without external funding; it does not mean customers have already defaulted.
  - The claim links present customer economics and the labs' growth requirements to a universal need for increasing outside funding.
  - Read AI startups as the model-buying startups under discussion, while preserving the explicit universal scope.
  - Assess the asserted causal necessity. The sentence supplies no separate forecast deadline.
support_condition: Records identify the largest customers, establish their inability to sustain payments internally, show the labs require quarterly payment increases, and demonstrate why every relevant startup must consequently obtain increasing external funding.
contradiction_condition: A verified qualifying startup sustainably funds the relevant rising payments internally, or comparable records disprove the asserted inability of the largest customers or the necessity of quarterly payment increases.
measurement_requirements: Identify customer rankings, model bills, operating receipts, expenses, cash flows and financing over successive periods. Distinguish voluntary fundraising, gross profitability and annualized sales from a need for external cash.
source_requirements: Customer financial statements and lab billing records, supplemented by reliable reporting where primary financial records are unavailable.
metric_scope:
  company: OpenAI and Anthropic's largest customers and the AI startup customers discussed
  metric: External financing required to sustain increasing model payments
  currency: null
