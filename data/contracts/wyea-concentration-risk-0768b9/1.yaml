ambiguity_flags:
  - Largest customers are not defined by a ranking or period.
  - Cannot afford could refer to operating sustainability or available liquidity.
  - Every single AI startup is broader than the named examples.
  - More and more could mean larger rounds, more frequent rounds or greater cumulative funding.
  - No accounting basis is supplied for the financing-necessity assertion.
