assessment_axis: forecast_outcome
explicit_source_elements:
  - almost zero chance
  - a system capable of doing almost any cognitive task a human can do
  - in the next two to three years
evaluator_interpretation:
  - The latest deadline is March 5, 2028, three years after publication.
  - Arrival means the existence of a working system meeting the stated breadth of cognitive capability. A company calling its system AGI is insufficient.
  - Human comparisons must cover varied cognitive activities, including unfamiliar tasks. Marcus supplies no numerical meaning for almost any.
  - This assessment concerns whether the forecast event occurs. One outcome cannot establish whether an almost-zero probability was well calibrated.
support_condition: After March 5, 2028, sufficiently comprehensive evidence establishes that no system meeting the stated definition arrived within the forecast interval.
contradiction_condition: A working system meeting the stated definition is demonstrated to have existed by March 5, 2028, with credible independent evaluation of its breadth.
measurement_requirements: Broad evaluations against human performance, with disclosed tasks, system configuration, assistance, reliability and testing conditions. Selected benchmark scores alone do not establish almost any cognitive task.
source_requirements: Public technical documentation and credible independent evaluation available by the evaluation date. Developer announcements may identify candidates but cannot alone establish the threshold.
metric_scope: null
original_horizon: in the next two to three years
horizon_interval:
  start: 2025-03-05
  end: 2028-03-05
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted before the deadline only upon a dated, independently substantiated demonstration of a system meeting the quoted definition. Lack of such a demonstration cannot establish early support.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Almost any does not specify task coverage or reliability.
  - The human comparator and permissible assistance are unspecified.
  - Almost zero chance is probabilistic, not an absolute impossibility claim.
retrospective_or_prospective: prospective
