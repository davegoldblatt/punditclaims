explicit_source_elements:
  - According to the documents
  - Microsoft received $493.8 million
  - in CY2024 from OpenAI
  - at least $2.469 billion
  - around $1.23 billion less than the $3.7 billion
evaluator_interpretation:
  - Assess the reported payment, the revenue floor derived using the contextual 20% share, and the numerical comparison together.
  - "Preserve 'at least': a floor below a reported revenue figure does not establish that actual revenue was below that figure."
  - "'According to the documents' identifies the claimed source; it is not a conditional forecast."
  - Use calendar 2024. The wording does not establish whether payments mean cash receipts, accrued revenue share, or amounts after reciprocal offsets.
  - Accounting basis is estimate because these are figures reported by a journalist from nonpublic documents. The contract's gross_or_net value is not_applicable because the wording does not specify either treatment.
support_condition: Independent records or independently verified reporting establish $493.8 million of revenue share attributable to calendar 2024, and the applicable agreement and accounting treatment justify the stated revenue floor. Earlier reporting establishes the $3.7 billion comparison figure.
contradiction_condition: Comparable records establish a materially different payment total, or agreement and accounting details invalidate the stated floor. Actual revenue above the floor would not contradict 'at least.'
measurement_requirements: Reconcile cash versus accrual timing, reciprocal royalties, covered revenue, and the applicable percentage. Distinguish realized revenue from forecasts and annualized revenue.
source_requirements: Prefer the underlying ledger and agreement. Independent reporting must verify the records rather than repeat Zitron. Earlier news reporting can establish what was previously reported.
