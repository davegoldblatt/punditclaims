assessment_axis: historical_observation
explicit_source_elements:
  - a load-bearing company for the tech industry
  - both as a narrative
  - as a financial entity
  - the only Large Language Model company with any meaningful userbase
evaluator_interpretation:
  - ChatGPT is a product rather than a company; the ordinary reading compares OpenAI's assistant with competing LLM assistants.
  - Meaningful userbase means substantial recurring active use. It does not require matching ChatGPT's usage, revenue, or engagement.
  - The ongoing observation is assessed over January–March 2025, the latest completed calendar quarter before the post.
  - The exclusivity statement is separately falsifiable. Load-bearing expresses a broader dependence claim without a specified threshold or failure test.
  - A contradiction of exclusivity does not establish that OpenAI lacked financial or narrative importance.
support_condition: Comparable evidence establishes that ChatGPT alone had substantial recurring active use, while evidence of industry dependence supports the broader load-bearing characterization.
contradiction_condition: At least one competing LLM assistant demonstrably had substantial recurring active users during the target period, contradicting the explicit exclusivity statement.
measurement_requirements: Active use of the assistant itself, distinguished from host-platform users, downloads, registrations, and monthly-versus-weekly comparisons.
source_requirements: Dated company usage disclosures, court records, or independent audience measurements.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01-01
  end: 2025-03-31
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Meaningful has no stated numerical threshold.
  - Company and product are conflated.
  - The source does not exclude assistants distributed inside existing platforms.
  - Load-bearing has no specified financial exposure or systemic-failure threshold.
  - Latest completed quarter selected for an ongoing observation without a stated period.
retrospective_or_prospective: retrospective
