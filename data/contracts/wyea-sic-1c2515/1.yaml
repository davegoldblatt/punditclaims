explicit_source_elements:
  - You cannot just “replace a coder”
  - “coder” isn’t really the job
  - entry-level software engineers
  - there’s yet to be proof
  - AI’s taking these jobs
  - not, say, outsourcing
evaluator_interpretation:
  - This concerns the public evidence available by publication, rather than a prediction that displacement can never occur.
  - Cannot just replace a coder is read as a claim about replacing an engineering role through coding automation alone, not a literal denial that coding occupations exist.
  - Proof means credible evidence connecting lost engineering work or positions to AI while addressing plausible alternative causes.
  - The target is the accumulated public record through June 16, 2025. Its start is unspecified because yet imposes a cutoff rather than a particular reporting year.
  - The possibility of future effects is a qualification, not a conditional forecast to score separately.
support_condition: A sufficiently comprehensive contemporaneous record supports the distinction between code generation and full engineering-role replacement, and establishes that claimed entry-level displacement had not been credibly attributed to AI rather than alternative causes.
contradiction_condition: Evidence public by the post verifies replacement of complete engineering roles by AI, or credibly attributes entry-level engineering job losses or reduced hiring to AI while addressing relevant alternatives.
measurement_requirements: Distinguish task automation, freelance project demand, avoided hiring, layoffs, and complete role replacement. Identify experience level and address outsourcing and other labor-market changes.
source_requirements: Contemporaneous causal research or documented staffing cases. Company assertions are relevant but must be distinguished from independently verified substitution.
