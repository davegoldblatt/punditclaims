assessment_axis: forecast_outcome
explicit_source_elements:
  - The collapse of the largest company in the ecosystem
  - seize up any and all AI data center debt
  - if any exists at that point
evaluator_interpretation:
  - The company is OpenAI. Collapse means business failure ending its ordinary independent operations, potentially through a distressed absorption into another company.
  - The plain reading of 'seize up' is a market-wide halt to new AI data center lending and debt issuance, rather than merely higher interest rates or falling bond prices.
  - The forecast applies only after OpenAI collapses and only if an AI data center debt market then exists.
  - No deadline or duration of the predicted freeze is supplied.
support_condition: After a documented OpenAI collapse, comprehensive issuance and lending records establish a market-wide halt attributable to that collapse, with an AI data center debt market existing immediately beforehand.
contradiction_condition: After a documented OpenAI collapse, completed new AI data center lending or debt issuance establishes that the claimed universal freeze did not occur.
measurement_requirements: Dated collapse records, evidence that the debt market existed, and records of completed lending and issuance. Separate new financing from secondary-market trading, refinancing announcements, and changes in borrowing costs.
source_requirements: Court or company records for the collapse; lender disclosures, offering documents, and comprehensive issuance records for the market response.
