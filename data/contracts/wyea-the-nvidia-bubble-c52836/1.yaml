ambiguity_flags:
  - Vast majority has no numerical threshold.
  - People has no geographic or age boundary.
  - AI compute customers could include individuals, enterprises, cloud providers and model developers.
  - Affordability has no stated time horizon or treatment of financing.
  - The latest completed calendar quarter is an evaluator-selected reporting period for an ongoing claim.
