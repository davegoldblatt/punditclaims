assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority of people
  - do not want to pay for AI
  - the vast majority of those who pay for AI compute
  - can’t afford to do so
evaluator_interpretation:
  - "The two clauses concern different populations: people generally and paying AI-compute customers."
  - Vast majority means an overwhelming majority, not merely more than half; no exact percentage is imposed.
  - Willingness to pay concerns preferences at stated prices. Nonpayment alone does not establish unwillingness.
  - Cannot afford means inability to meet compute costs from available resources and sustainable funding; losses or use of outside capital alone are insufficient.
  - Use July through September 2026, the latest completed calendar quarter before publication, as the reporting period for this ongoing consumer and financial assessment.
  - No geography is specified, so evidence confined to US consumers cannot by itself settle the worldwide wording.
support_condition: Representative evidence establishes both an overwhelming majority unwilling to pay for AI and an overwhelming majority of paying compute customers unable to afford their purchases.
contradiction_condition: Representative evidence establishes that either asserted overwhelming majority does not exist in the relevant population and period.
measurement_requirements: Separate willingness from current purchases; disclose prices, sample coverage and survey dates. Measure affordability across customers by count, with payment obligations, available funds and financing sustainability.
source_requirements: Representative preference surveys and customer-level financial or payment records with a defined sampling frame. Selected struggling companies cannot establish a population share.
