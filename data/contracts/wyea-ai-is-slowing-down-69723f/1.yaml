assessment_axis: historical_observation
explicit_source_elements:
  - Right now
  - AI revenues are either chaotically experimental or so thoroughly-subsidized
  - hundreds of dollars a user
evaluator_interpretation:
  - The ordinary reading is that revenue depends on unsettled experiments or on substantial service subsidies, rather than established unsubsidized use.
  - I read hundreds as at least $200, while recognizing that the post supplies neither a user cohort nor a subsidy duration.
  - Dollars are interpreted as US dollars in the context of OpenAI and Anthropic.
  - For the ongoing state, I use January–March 2026, the latest completed calendar quarter before publication. This does not convert the unspecified subsidy duration into a quarterly threshold.
  - Subsidy means actual service cost exceeding payment. The retail API value of subscription usage is not itself the provider's cost.
  - No accounting basis is indicated, preventing a supported or contradicted monetary score under the supplied rules.
support_condition: Target-period records would need to establish the claimed experimental revenue dependence or actual service costs exceeding payments by hundreds of dollars for an identified user population and duration. Evidence must support the breadth of the either-or assertion.
contradiction_condition: Established production revenue with matching costs and payments showing no qualifying subsidy would counter the categorical either-or assertion. A monetary finding requires a defined cohort, duration and accounting basis.
measurement_requirements: Matched user-level service costs and payments, usage distribution, cost allocation, subsidy duration and distinction between pilot and established production revenue.
source_requirements: Provider cohort disclosures or independently documented cost-to-serve records. Aggregate company losses and retail API-equivalent usage are insufficient.
