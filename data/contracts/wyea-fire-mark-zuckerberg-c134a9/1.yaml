assessment_axis: historical_observation
explicit_source_elements:
  - drop his metaverse idea
  - at the first sign of something more perceptually interesting to Wall Street
  - proven track record of chasing other people’s ideas and failing to compete
evaluator_interpretation:
  - "Assess two factual components: abandonment of the metaverse by the post and repeated unsuccessful products modeled on competitors."
  - "'Track record' means repeated documented instances, not that every competing product failed."
  - Use failure to attract sustained use followed by withdrawal as ordinary evidence of competitive failure; no market-share threshold was supplied.
  - The historical scope is the company history invoked in the surrounding twenty-year comparison, ending at the post.
  - "'While it may seem strange' is rhetorical framing, not a forecast condition. Wall Street's supposed appeal is an asserted motive that requires separate evidence."
support_condition: Records establish both abandonment of the metaverse and repeated unsuccessful products modeled on rivals. Evidence for only the repeated failures supports only that component.
contradiction_condition: Continuing metaverse activity contradicts abandonment. Competitive successes limit any broader suggestion of general inability to compete, although they do not erase repeated failures.
measurement_requirements: Identify specific products, their relationship to competitors, evidence of poor uptake or withdrawal, and contemporaneous metaverse activity.
source_requirements: Primary product records where available; reputable reporting for discontinued products and their competitive performance.
