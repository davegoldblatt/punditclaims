assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI
  - is incredibly unprofitable
evaluator_interpretation:
  - The ordinary reading is that businesses developing and supplying generative AI were sustaining substantial losses. It does not require every application or infrastructure supplier to lose money.
  - The surrounding examples identify OpenAI and Anthropic as important evidence, but do not define them as the entire sector.
  - For this ongoing financial observation, I use January–September 2024, the latest completed year-to-date financial reporting period before publication. The surrounding full-year forecasts are relevant context, not realized results for this period.
  - I interpret 'incredibly' as losses substantial relative to revenue, without inventing a numerical cutoff.
support_condition: Comparable financial evidence establishes substantial losses relative to revenue across the principal generative AI developers and providers during the target period.
contradiction_condition: Comparable evidence establishes that the principal generative AI developers and providers were broadly profitable or incurred only modest losses during the target period.
measurement_requirements: Separate realized losses from forecasts, cash burn, infrastructure investment, and financing. Establish the coverage of the businesses measured.
source_requirements: Company financial disclosures or independently sourced financial reporting. The speaker's own reporting cannot establish the outcome.
metric_scope:
  company: Generative AI developers and providers collectively
  metric: Business losses relative to revenue
  currency: USD
  units: billions
