explicit_source_elements:
  - these systems are inherently unreliable
  - frequently making errors of both reasoning and fact
  - prone to hallucination
evaluator_interpretation:
  - The ordinary reading is that contemporary generative systems, particularly the language models discussed in the examples, could not be trusted to produce consistently correct answers without checking.
  - I read 'inherently' as describing a recurring limitation of those systems, not as proving that every future model must remain unreliable.
  - No reporting cycle applies. I use November 2022 through the post date as the contemporary release period identified by the discussion of Galactica and ChatGPT.
  - The claim supplies no error-rate threshold. 'Frequently' means recurring failures in systematic testing, rather than a single exceptional mistake.
support_condition: Contemporary evaluations and disclosures establish recurring factual fabrication and substantial reasoning failures in representative language models discussed in the post.
contradiction_condition: Representative contemporary evaluations establish consistently reliable factual and reasoning performance, with purported hallucinations confined to exceptional or invalid tests.
measurement_requirements: Identify model versions, tasks and test conditions. Distinguish benchmark failure rates from ordinary-use error rates.
source_requirements: Prefer contemporary model evaluations and developer disclosures. Isolated anecdotes alone are insufficient.
