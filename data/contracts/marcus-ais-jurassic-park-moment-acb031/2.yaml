assessment_axis: historical_observation
explicit_source_elements:
  - systems like chatGPT (OpenAI), Dall-E 2, and Lensa
  - inherently unreliable
  - frequently making errors of both reasoning and fact
  - prone to hallucination
  - right now
evaluator_interpretation:
  - I read 'inherently unreliable' as a recurring limitation of the systems then available, not a prediction that improvement is impossible.
  - The scope includes both language and image generators. ChatGPT evidence alone cannot establish the whole claim.
  - For text, relevant errors include false factual assertions, invalid reasoning, and invented information presented as true. For images, relevant errors include failures to preserve requested quantities, relationships, identities, or other factual constraints. Deliberately requested fantasy is not an error.
  - I read 'frequently' as recurring across multiple ordinary tasks or outputs, rather than an isolated failure. Marcus supplies no numerical threshold.
  - "For this ongoing observation, I use November 2022 through the publication date: the immediately preceding month and current partial month surrounding the releases discussed in the context. This reporting window is an evaluator choice."
  - Support requires evidence covering the named systems and both modalities, with factual and reasoning failures demonstrated through appropriate tasks. An unwanted image is not automatically evidence of either a reasoning error or a factual hallucination.
support_condition: Contemporaneous evaluations or documented repeated tests establish recurring unreliability across ChatGPT, DALL-E 2, and Lensa, including factual and reasoning failures and unsupported generated content. Image-generator evidence must independently substantiate the image portion of the claim.
contradiction_condition: Broad, relevant evaluations of the contemporary systems establish that the alleged failures were exceptional rather than recurring, or directly refute a material component of the claim within its stated scope. Selected successes alone are insufficient.
measurement_requirements: Identify the tested system and version, prompts or inputs, expected results, observed failures, and sampling limits. Use denominators where available. Distinguish rating scores from percentages of correct outputs and unwanted artistic choices from failures of factual or relational constraints.
source_requirements: Prefer contemporary company disclosures and independent evaluations. Firsthand reports can document failures but cannot alone establish a population error rate. Exclude Marcus's own work as corroboration. Later publications must identify results from the relevant historical systems and period.
