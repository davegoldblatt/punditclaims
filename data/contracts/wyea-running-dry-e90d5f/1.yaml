assessment_axis: causal_assessment
explicit_source_elements:
  - current obligations
  - requiring the company
  - by this time next year
  - roughly twice its size
  - continuing at a similar (or better) growth rate
  - perpetual growth and improved margins
evaluator_interpretation:
  - This is a claim about what existing obligations require, rather than an unconditional prediction that revenue will double.
  - Size ordinarily means revenue in this financial context, not valuation or employee count.
  - The comparison is between the latest reported quarterly revenue before the post and a comparable quarterly revenue measure around November 2027.
  - By this time next year means by November 3, 2027.
  - The current-state assessment covers the September 30 financial position and subsequent obligations disclosed before the November 3 post.
  - The test must include available cash and financing, because obligations need not be paid solely from contemporaneous revenue.
support_condition: A complete cash-flow analysis of existing obligations shows that meeting them through November 3, 2027 requires approximately doubled comparable revenue, maintained growth, and improved margins, after including available liquidity and financing.
contradiction_condition: A documented feasible cash-flow scenario meets those obligations through the stated date without approximately doubling revenue or without maintaining growth and improving margins.
measurement_requirements: Payment schedules, cancellation rights, prepayments, cash and restricted cash, financing availability, revenue collection, operating expenses, capital spending, and comparable revenue and margin measures.
source_requirements: Company filings and executed financing or compute agreements, supported by a transparent cash-flow model with explicit assumptions.
metric_scope:
  company: Anthropic
  metric: Revenue growth and margin improvement required to meet existing obligations
  currency: USD
  units: revenue multiple and margin percentages
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2026-09-30
  period_end: 2027-11-03
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: by this time next year
horizon_interval: null
target_period:
  start: 2026-09-30
  end: 2026-11-03
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Size has no explicit measure.
  - Roughly has no numerical tolerance.
  - Growth rate has no comparison interval.
  - Margins could mean gross, operating, or adjusted margins.
  - The ongoing-state period is interpreted as the latest reported balance-sheet date through the post.
  - Perpetual growth has no finite verification period.
retrospective_or_prospective: retrospective
