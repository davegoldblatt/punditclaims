assessment_axis: historical_observation
explicit_source_elements:
  - China has NVIDIA GPUs
  - They’ve had them for years
  - It already happened
evaluator_interpretation:
  - China means Chinese institutions and companies, rather than requiring possession by the central government itself.
  - In context, NVIDIA GPUs means advanced data-center accelerators usable for AI, rather than ordinary consumer graphics cards.
  - Years means documented access across multiple years. It does not require every generation, unrestricted supply or a particular national inventory.
  - The target period covers the export-control era from October 2022 through the post date. Access during controls does not establish that every acquisition violated those controls.
  - The comments about the dangers of access are opinion and are not separately scored.
support_condition: Dated procurement records, installations or training disclosures establish Chinese entities' access to advanced NVIDIA AI GPUs across multiple years during the export-control era.
contradiction_condition: Reliable evidence establishes that the cited access did not occur, concerned only ordinary consumer hardware, or began too recently to support years of access.
measurement_requirements: Identify the GPU generation, Chinese user, actual acquisition or use, and dates. Distinguish orders from deliveries and access from proof of illegal importation.
source_requirements: Primary technical or procurement records where available; reputable reporting of inspected procurement records where originals cannot be obtained.
