explicit_source_elements:
  - 61GW of IT load
  - I don’t think many of these are actually being built right now
  - based on the fact there were only $178.5 billion in data center debt deals last year
evaluator_interpretation:
  - The plain reading is that only a small share of the cited active-development cohort had reached physical construction.
  - The surrounding discussion measures projects in GW, so capacity share is the main measure. Project counts should also be reported because 'many' could refer to counts.
  - For this ongoing observation, use Q4 2025, the latest completed quarter before publication and the period described by the cited pipeline report. This is a reporting baseline, not proof of unchanged conditions through March 24.
  - The financing and hypothetical GPU costs are supporting reasoning. The proposition being graded concerns construction status, not a company's financial metric.
support_condition: A construction-status breakdown of the cited active-development cohort shows that only a small share of its capacity, with consistent project-count evidence, had entered physical construction.
contradiction_condition: A comparable breakdown shows that a substantial share, clearly inconsistent with 'not many,' had entered physical construction.
measurement_requirements: Identify the same projects and phases behind the roughly 79.5 GW facility-load estimate. Separate physical construction from permitting, land acquisition and development. Do not count an entire campus as under construction merely because its first phase has started.
source_requirements: A dated project-level tracker or comparable construction records with definitions and coverage sufficient to match the cited cohort.
