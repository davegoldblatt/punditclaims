explicit_source_elements:
  - 300MW of New Jersey-based compute
  - only started building ... in March 2025
  - based on its letter to shareholders
  - things aren’t going very well at all
evaluator_interpretation:
  - The plain reading is that the New Jersey build-out was experiencing substantial delivery delays or construction problems relative to its announced plan.
  - Assess the project’s condition, rather than whether management described it positively.
  - Use Q4 2025, the latest completed reporting quarter covered by the February 12, 2026 shareholder letter cited in the post. Earlier announcements establish the baseline; later evidence counts only when it establishes conditions during that quarter.
  - Treat 300MW as the identified project’s eventual capacity, not an assertion that all 300MW was already due.
  - The March 2025 construction-start statement supplies background to the normalized proposition; it does not independently establish poor progress.
support_condition: Dated evidence establishes substantial missed construction or delivery milestones, or serious operational obstacles, affecting the New Jersey project during the target period.
contradiction_condition: Comparable planned and achieved milestones establish that the New Jersey build-out was substantially on schedule during the target period, with evidence sufficient to address the alleged construction problems.
measurement_requirements: Compare the same project phases and distinguish building completion, power availability, installed equipment and customer delivery. An on-time customer tranche alone does not establish completion of the entire campus.
source_requirements: Prefer dated company disclosures, construction and permitting records, and customer acceptance records. Independent reporting must identify its underlying evidence.
