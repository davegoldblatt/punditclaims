evaluator_interpretation:
  - Assess the estimate using the supplied 15.2GW capacity, 1.35 PUE, 90% GPU allocation, 140kW per rack and $4 million per rack.
  - Treat 'around' as allowing ordinary rounding. A small arithmetic discrepancy does not by itself contradict this estimate.
  - Distinguish the calculated purchase value of complete racks from revenue attributable to NVIDIA.
  - The target is the April 2026 construction snapshot described in the post. Completion through 2028 defines the pipeline, not a forecast deadline.
support_condition: The stated assumptions approximately reproduce the rack count and dollar estimate, and the evidence establishes that the dollar value represents NVIDIA revenue for the specified capacity.
contradiction_condition: The calculation materially fails under the stated assumptions, or comparable evidence establishes a materially different NVIDIA revenue amount for that capacity.
measurement_requirements: Reproduce the calculation without intermediate rounding; identify whether capacity measures facility power or IT load; distinguish complete-rack purchase prices from NVIDIA's attributable revenue.
source_requirements: Sightline's contemporaneous capacity record and independently documented revenue attribution. The speaker's account of his private correspondence is not independent confirmation.
