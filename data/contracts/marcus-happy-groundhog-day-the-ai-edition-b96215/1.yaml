assessment_axis: historical_observation
explicit_source_elements:
  - 2020s
  - AI companies
  - spend vast amounts of $
  - hiring humans
  - patch brittle neural systems
evaluator_interpretation:
  - The explicit 2020s period means the decade to the publication date, not spending after the post.
  - The plain reading is substantial industry expenditure on human feedback and corrective training work, rather than merely the existence of paid contractors.
  - The accompanying industry commentary supplies an estimate-based framing, not a stated financial-reporting standard.
  - The dollar symbol is read as US dollars in this US-company context.
  - The comparison with symbolic AI is an analogy. The exact claim does not commit to equal spending across the two eras.
  - The quoted prediction of future hundreds of millions or billions is not evidence of spending already incurred.
support_condition: Credible expenditure records or well-founded estimates show substantial spending across AI companies on human corrective work during the stated period, with enough budget context to justify the ordinary description vast.
contradiction_condition: Comprehensive, comparable expenditure evidence shows that such spending was minor in scale, or that the expenditure attributed to human corrective work was actually for other purposes.
measurement_requirements: Separate expenditure from headcount, hourly rates, contract ceilings, financing and compute costs. Identify the companies and work covered, realized amounts, reporting periods and the basis for aggregation.
source_requirements: Prefer company expenditure disclosures or contracts with payment records. Use original investigative reporting when primary financial records are unavailable.
