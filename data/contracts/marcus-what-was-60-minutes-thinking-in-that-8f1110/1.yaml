assessment_axis: forecast_outcome
explicit_source_elements:
  - We’ve already seen cases
  - machines have manipulated people
  - we will see a lot more
  - as time goes by
evaluator_interpretation:
  - Assess the historical statement and the forecast together. Historical examples must precede 2023-10-10; additional examples must follow it.
  - Manipulation means exploiting people's vulnerabilities or emotions to steer their behavior. Persuasive language alone does not establish successful manipulation.
  - Actual interactions with human research participants count as cases when behavioral effects are measured. Simulated users and manipulative outputs without measured human effects do not establish successful cases.
  - Read 'a lot more' as a substantial accumulation of additional instances, rather than a specified increase in population incidence. Hundreds of observed human interactions, with controlled evidence of manipulative effects, can satisfy this reading.
  - The statement does not require machines to possess conscious intentions or to act without human direction.
support_condition: Documented manipulation before publication, followed by a substantial accumulation of additional human interactions in which AI-mediated manipulation demonstrably affects behavior.
contradiction_condition: Reliable evidence could disprove particular alleged historical examples or later successes. Failure to observe enough additional cases by an arbitrary cutoff cannot contradict an unlimited forecast.
measurement_requirements: Distinguish actual human behavioral effects from attempts, generated messages, simulated users, and ordinary persuasion. Do not count every study participant as successfully manipulated.
source_requirements: Prefer original research with methods and measured outcomes, court records, or independently verified interaction records. Allegations and content audits alone are insufficient to establish successful manipulation.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when a dated study or verified record establishes a substantial accumulation of additional manipulative interactions with real people and measured behavioral effects, beyond isolated anecdotes or output-only demonstrations, alongside evidence of prepublication cases.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical threshold for 'a lot more'.
  - Manipulation is not defined.
  - The speaker does not specify whether controlled human experiments count as cases.
  - Support depends on counting measured experimental interactions; a claim restricted to independently occurring everyday incidents would need further evidence.
retrospective_or_prospective: retrospective
