assessment_axis: historical_observation
explicit_source_elements:
  - we have built (and continue to build)
  - our entire national policy (such as it is)
  - around an idea
  - never grounded in a sound analysis of AI
evaluator_interpretation:
  - National policy means national AI policy in this passage, not every federal policy.
  - The idea is imminent AGI, associated with AI 2027 and arrival during Trump's second term.
  - The ordinary claim is that imminent AGI serves as the governing premise of national AI policy and lacks adequate analytical support. Entire need not mean every minor provision.
  - The target interval covers the current administration through the post date, because built and continue to build describe both its policy development and the ongoing position.
  - Sound analysis requires explicit reasoning grounded in capability evidence and uncertainty; disagreement with a forecast alone does not establish unsoundness.
support_condition: Policy-development records and technical rationales show that national AI policy rests throughout on imminent AGI, with material analytical defects in the evidence supporting that premise.
contradiction_condition: Records establish that substantial national AI policies rest on present capabilities or independently justified goals and that imminent AGI is not their governing premise, or directly establish sound analysis for the allegedly unsupported premise.
measurement_requirements: Examine policy texts, stated rationales, supporting technical work, and development records. Distinguish a policy's announced goals from the assumptions that caused its adoption.
source_requirements: Official policy documents and supporting analyses, supplemented by documented decision-making records. Neither optimistic rhetoric nor the absence of an AGI deadline in a document is sufficient alone.
