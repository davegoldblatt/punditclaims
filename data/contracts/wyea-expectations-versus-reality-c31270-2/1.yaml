explicit_source_elements:
  - how incredibly expensive it is to run a significantly more complex model than ChatGPT
  - ChatGPT, which is already unprofitable for OpenAI to run
evaluator_interpretation:
  - "Main test: whether running ChatGPT cost OpenAI more than it earned around the post date. Credible reporting that running costs exceeded revenue, or that OpenAI lost money mainly from running costs, counts."
  - The claim describes an ongoing state with no named period. I use calendar 2024, the year the post was written and the most recent period that public reporting covered.
  - "Secondary test: whether Sora was a more compute-hungry, costlier model than ChatGPT's models, per contemporaneous estimates."
  - The forecast that wait times 'are likely to increase' is outside the normalized proposition and is not scored.
support_condition: Credible financial reporting for 2024 shows OpenAI's costs to run ChatGPT were at or above its revenue, or that it lost money largely because of running costs. Estimates also show Sora needs much more compute than GPT-class models.
contradiction_condition: Credible reporting shows ChatGPT ran at an operating profit for OpenAI in 2024, or that Sora was cheap to run relative to ChatGPT.
measurement_requirements: OpenAI 2024 revenue, inference/server costs, and losses as reported or estimated; third-party compute estimates for Sora.
source_requirements: OpenAI is private, so reputable press reports of internal financials (The Information, New York Times, CNBC) are acceptable as estimates.
