explicit_source_elements:
  - OpenAI needs Stargate
  - to get built
  - to grow much further
evaluator_interpretation:
  - "This is a necessity claim: substantial further growth of OpenAI (users, revenue, compute) depends on the Stargate data centers being built."
  - It would be contradicted if OpenAI grew much further while Stargate stalled or was not built, using other compute. It would fit if growth stalled because Stargate was delayed.
support_condition: Stargate stalls or is not built, and OpenAI's growth stalls for lack of the capacity.
contradiction_condition: Stargate is not built or is materially delayed, yet OpenAI grows much further on non-Stargate capacity.
measurement_requirements: Dated records of Stargate capacity coming online, OpenAI's other compute sources, and OpenAI's user and revenue growth.
source_requirements: OpenAI, Oracle, SoftBank or CoreWeave announcements and filings, and reputable news reports.
