explicit_source_elements:
  - I think
  - still very poor reasoning
evaluator_interpretation:
  - Read the grammatical shorthand as saying current LLMs are generally very poor at reasoning.
  - The ordinary test is performance on substantive reasoning tasks, including unfamiliar mathematical and abstract problems, rather than the mere existence of some failures.
  - A broad description of current technology must account for leading available LLMs. It is not interpreted as a claim solely about small models, older generations, or models without reasoning settings.
  - Use October 2026, the month of the post, for current capabilities. No benchmark or numerical threshold is supplied.
  - Model-plus-harness results are distinguished from direct model tests.
support_condition: Contemporary independent evaluations show broadly poor performance by leading LLMs across varied substantive reasoning tasks, with substantial failures relative to appropriate task baselines.
contradiction_condition: Contemporary independent evaluations demonstrate substantial reasoning competence across multiple demanding task families and leading models, making very poor an inaccurate general description.
measurement_requirements: Report task type, model generation, reasoning settings, tool or harness use, and meaningful success rates. Avoid treating knowledge errors as a direct measure of reasoning.
source_requirements: Prefer independent benchmark operators and expert-reviewed evaluations using unpublished, private, or held-out tasks. Include material failure evidence and its model scope.
