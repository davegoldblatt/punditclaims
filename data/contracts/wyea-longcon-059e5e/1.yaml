assessment_axis: historical_observation
explicit_source_elements:
  - most of the coverage you read
  - led by companies
  - benefit financially
  - by default all of this coverage
  - mentions OpenAI or ChatGPT
evaluator_interpretation:
  - The surrounding discussion concerns the generative-AI boom since ChatGPT's launch. I use the launch-to-post interval rather than older AI reporting.
  - "'Most' means more than half. 'Led by companies' means companies substantially set the story's agenda or supply its principal framing; merely quoting a company is insufficient."
  - "'By default all' is read as a routine, effectively universal reference to OpenAI or ChatGPT. A literal universal reading is also considered."
  - The ordinary scope is general news coverage encountered by readers, not only articles selected because they mention ChatGPT.
support_condition: A representative analysis of the relevant coverage finds a company-led majority and effectively universal mentions of OpenAI or ChatGPT. A literal reading additionally requires no exceptions in the defined population.
contradiction_condition: A representative analysis finds that company-led coverage is not a majority, or that a substantial share of the relevant coverage mentions neither OpenAI nor ChatGPT. Under the literal reading, a verified in-scope exception defeats the universal component.
measurement_requirements: A defined news population; reproducible coding of story leadership and financial interests; and separate counts for ChatGPT, OpenAI, and their union. Articles must not be selected using those names alone.
source_requirements: Prefer representative content analyses with accessible methods and article-level records. Older studies and analyses of all AI rather than generative AI are context only.
