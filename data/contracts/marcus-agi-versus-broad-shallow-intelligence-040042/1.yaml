explicit_source_elements:
  - LLMs don't meet that
  - flexible and general, with resourcefulness and reliability comparable to (or beyond) human intelligence
  - reliability is not their strong suit
  - LLMs lack the ability to reliably generalize to novel circumstances
evaluator_interpretation:
  - "Plain reading: as of the post, the best LLMs did not reach human-level reliability and generalization. In particular, their performance on new or slightly changed tasks was not dependable."
  - He named no period. I use the latest evaluations public before the post, October 2024 to the post date (2025-01-13), covering the o1/o3, GPT-4o and Claude 3.5 generation.
  - "'Reliably' matters. Some success on new tasks does not contradict the claim. Robust, human-comparable generalization would."
support_condition: Evaluations from the period show frontier LLMs failing tasks that are easy for humans on novel benchmarks, or losing much accuracy when problems are lightly changed. Expert evaluators judge them short of human-level general intelligence.
contradiction_condition: Evaluations from the period show frontier LLMs matching humans on novel, out-of-distribution tasks and holding steady under such changes.
measurement_requirements: Novel-task benchmarks with human baselines (for example ARC-AGI), and perturbation studies of reasoning robustness.
source_requirements: Benchmark operators or peer-reviewed or preprint studies published before or around January 2025.
