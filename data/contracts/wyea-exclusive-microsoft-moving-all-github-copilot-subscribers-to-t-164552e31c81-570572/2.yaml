explicit_source_elements:
  - initial promotional period from June through August 2026
  - Copilot Business Customers will pay $19 per-user-per-month and receive $30 of pooled AI credits
  - Copilot Enterprise customers will pay $39 per-user-per-month and receive $70 of pooled AI credits
  - Sources say that these amounts may change before the launch
evaluator_interpretation:
  - He is reporting planned terms from internal documents and flags that the amounts may change. The test is whether GitHub announced and ran the terms he described.
  - Because he warned the amounts might change, different launch amounts would not count against him. They would leave the claim not adjudicable rather than contradicted. The hedge only protects him if the terms differ.
  - "'$30 of pooled AI credits' is read as the total monthly included allowance per Business seat (3,000 credits at $0.01 each), not $30 on top of the base $19. The same applies to $70 for Enterprise."
  - The promotion applying only to existing Business and Enterprise customers is treated as consistent with his wording.
support_condition: "GitHub's announced and live terms for June through August 2026: Business stays at $19 per user per month with about $30 (3,000 credits) of pooled monthly credits, and Enterprise stays at $39 with about $70 (7,000 credits)."
contradiction_condition: None, given his stated caveat. If GitHub had launched with different amounts, the caveat he gave means the claim would be not adjudicable rather than contradicted. Only a launch with no promotion and no pooled credits, i.e. a different structure entirely, would weigh against the core report.
measurement_requirements: Seat price and included pooled AI credits per user per month for Copilot Business and Enterprise from June 1 to August 31, 2026.
source_requirements: GitHub announcement, docs or FAQ preferred; reputable news or dated secondary summaries of GitHub's terms where the GitHub blog text cannot be read.
