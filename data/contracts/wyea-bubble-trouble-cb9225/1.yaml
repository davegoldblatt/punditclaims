assessment_axis: forecast_outcome
explicit_source_elements:
  - Generative video models like OpenAI's Sora
  - dead on arrival
  - massive amounts of compute
  - significantly more training data
  - complex and scarce
  - massive legal implications
evaluator_interpretation:
  - I read 'dead on arrival' as predicting commercial failure, given the surrounding discussion of costs and business viability.
  - The claim covers generative video as a category, with Sora as its example. Sora's fate alone does not settle the category-wide claim.
  - A launch or a large generation count alone does not establish sustainable commercial viability.
  - The next-year language in the following sentence concerns measurable technical improvement; it does not supply this claim's deadline.
support_condition: Generative-video products fail commercially or are broadly abandoned, with credible evidence connecting that failure to the asserted compute, training-data, and legal barriers.
contradiction_condition: Comparable generative-video products achieve sustained, meaningful commercial deployment with credible evidence that their economics and access to training data permit continued operation despite those barriers.
measurement_requirements: Distinguish product availability, generated-video counts, paying customers, retention, and commercial viability. Establish the reasons for abandonment rather than inferring them from a shutdown.
source_requirements: Dated product disclosures and adoption records, supplemented by credible reporting or disclosures about economics and reasons for withdrawal.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only upon evidence of sustained commercially viable deployment that defeats the category-wide failure prediction, or broad commercial abandonment attributable to the asserted barriers. One launch or one shutdown is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Dead on arrival' has no specified adoption or commercial threshold."
  - The breadth of 'models like' is unspecified.
  - The relative importance of compute, data scarcity, and legal barriers is unspecified.
  - No deadline is stated.
retrospective_or_prospective: retrospective
