evaluator_interpretation:
  - The claim concerns the displayed and expressly linked examples, including the companion record that names Andrew Sundstrom as the submitter of particular prompts.
  - Pitch perfect means recognizable scientific or mathematical presentation, not flawless prose.
  - Utterly bogus means the purported scientific or mathematical account is substantively invalid; it does not mean every individual statement or calculation is false.
  - Presented as the real thing refers to the generated passages' factual and expository voice. It does not imply that Meta provided no general warnings.
  - The target period is the launch-period examples shared on November 15–16, 2022.
support_condition: A preserved example attributable to Sundstrom in the displayed or linked record presents materially fabricated or invalid scientific or mathematical exposition as factual explanation.
contradiction_condition: The relevant preserved examples are substantively sound, or the supposedly factual passages explicitly identify themselves as fiction or deliberate illustrations of errors.
measurement_requirements: Inspect the original prompts and outputs, verify attribution and dates, and check substantive assertions or calculations. Distinguish selected failures from overall model performance.
source_requirements: The original experiment record or preserved outputs, with reproducible calculations or authoritative references for factual checks. Marcus's characterization alone is insufficient.
