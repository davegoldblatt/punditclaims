evaluator_interpretation:
  - Support staff means personnel supporting fleet operations, not Cruise's entire workforce and not necessarily remote-assistance operators alone.
  - The ordinary financial reading is that Cruise was consuming funds or operating at a loss. The words do not identify cash flow, net income, adjusted earnings or a cost-per-ride comparison.
  - For the financial component, use July–September 2023, the latest completed reporting quarter before the post. For staffing, use the latest pre-post operational snapshot. The combined target interval accommodates those distinct components.
  - The supplied passage does not identify a financial reporting basis or expressly attribute a financial figure to a company or analyst. The contract therefore retains an unknown accounting basis.
support_condition: Comparable staffing and fleet counts show more than one support worker per vehicle, and financial evidence on the claim's identified basis establishes a loss or cash consumption for the relevant period.
contradiction_condition: Comparable counts show support staff did not outnumber vehicles, or financial evidence on the same identified basis establishes the opposite financial condition.
measurement_requirements: Match staff and vehicles by geography, date, fleet status and headcount definition. Keep company-wide earnings, cash burn and remote-assistance unit costs separate.
source_requirements: Primary financial disclosures and dated operational staffing records; reputable reporting may substitute for unavailable staffing records, with attribution and limitations.
