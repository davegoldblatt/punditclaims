evaluator_interpretation:
  - "Plain reading: at some point, enthusiasm for LLMs would visibly collapse. That means a sharp, sustained fall in generative AI investment, AI chip and data center spending, and AI-linked valuations, not a short dip."
  - He gave no deadline ('eventually'), so this is an open-horizon forecast. The lack of a collapse before the evaluation date does not count against him.
support_condition: "A dated, decisive collapse of the LLM boom: for example, AI data center or chip spending falling steeply year over year for several quarters, major AI valuations or funding rounds collapsing, and widespread reporting that the boom has ended."
contradiction_condition: With no deadline, the forecast cannot be shown false at a fixed date. Continued strong growth only shows the break has not happened yet.
measurement_requirements: Dated measures of AI investment and enthusiasm, such as AI chip maker data center revenue, hyperscaler AI capital spending, AI startup funding and valuations, and AI-linked stock indices.
source_requirements: Company filings and earnings releases, official statistics, or reputable financial news.
