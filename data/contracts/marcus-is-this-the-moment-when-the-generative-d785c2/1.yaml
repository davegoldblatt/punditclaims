early_resolution_rule: "Settled as supported early if, before the evaluation date, there is a sustained collapse: for example, Nvidia data center revenue or combined hyperscaler AI capital spending falling more than 30% year over year for two or more quarters in a row, together with broad reporting that generative AI investment has collapsed. There is no early rule for contradiction because no deadline was given."
