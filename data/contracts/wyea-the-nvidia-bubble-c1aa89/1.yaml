  end: 2026-09-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Said demand could mean all AI-accelerator demand or only demand from NVIDIA-supported customers.
  - Dealmaking does not distinguish ordinary sales activity from financial support.
  - The latest completed calendar quarter is an evaluator-selected reporting period for an ongoing state.
  - The factual exclusive-origin assertion is separated from the opinion and hypothetical competitor argument.
