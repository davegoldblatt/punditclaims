  - around $37bn
  - about…$20bn in cash
  - at the end of the year
evaluator_interpretation:
  - The principal balance-sheet claim is approximately $20 billion of cash at December 31, 2025, derived from estimated second-half spending of approximately $37 billion.
  - Cash is read consistently with the passage's starting cash-and-cash-equivalents balance, rather than total assets or all financing commitments.
  - The qualification identifies an estimate, but the surrounding argument presents it as informative about OpenAI's actual finances.
  - The arithmetic and the empirical accuracy of its assumptions require separate checks.
support_condition: Comparable records establish approximately $37 billion of gross second-half cash expenditure and approximately $20 billion of year-end cash and equivalents, with a reconciled opening balance, financing receipts, and customer cash receipts.
contradiction_condition: Comparable records establish materially different second-half cash expenditure or year-end cash and equivalents, beyond reasonable approximation.
measurement_requirements: Reconcile opening cash, actual financing receipts, customer cash receipts, expenditure, and other cash movements. Do not automatically treat booked revenue as cash received or accounting expenses as cash paid.
source_requirements: Prefer a year-end balance sheet and a second-half cash-flow reconciliation. Independent reporting must identify the cash definition and distinguish cash expenditure from accounting expenses.
