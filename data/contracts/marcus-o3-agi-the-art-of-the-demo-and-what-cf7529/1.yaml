  - Passing ARC
  - may be necessary
  - certainly not sufficient for AGI
evaluator_interpretation:
  - "Assess the ordinary evidential claim: passing the ARC benchmark alone does not establish broad artificial general intelligence."
  - ARC means the benchmark discussed in the December 2024 o3 announcement.
  - May be necessary expresses a possibility, not a firm claim that every AGI must pass ARC.
  - Use the benchmark's stated scope and latest public interpretation on 20 December 2024.
support_condition: The benchmark's design and interpretation explicitly limit what passing establishes, with evidence that a passing result can coexist with important remaining capability gaps.
contradiction_condition: Passing the specified benchmark is demonstrated to establish broad general intelligence, rather than merely being associated with progress toward it.
measurement_requirements: Distinguish a benchmark threshold from an operational definition of general intelligence, and distinguish necessary from sufficient conditions.
source_requirements: Original benchmark documentation and statements by its designers, supplemented where available by evaluations demonstrating limits.
