assessment_axis: historical_observation
explicit_source_elements:
  - I see around $22 billion
  - non-OpenAI/Anthropic compute spend globally
  - an indeterminate amount of that coming from AI startups
evaluator_interpretation:
  - Assess the accuracy of the spending estimate, not merely whether Zitron expressed it.
  - The surrounding GPU-rental discussion suggests external AI compute purchases, excluding purchases by OpenAI and Anthropic, rather than all hardware investment or internally owned compute.
  - I use July through September 2026, the latest completed calendar quarter before the post, as the observation window for the current spending estimate.
  - An annual spending scale is the ordinary contextual reading, but the sentence does not distinguish annualized run rate from realized annual spending. The annualized classification is provisional and cannot support a decisive comparison without clarification.
  - No numerical tolerance is imposed on 'around' before the period and spending definition are established.
  - The unspecified startup share does not commit to a measurable percentage.
support_condition: A reproducible global estimate on the same spending definition and time basis places purchases excluding OpenAI and Anthropic approximately at $22 billion, with uncertainty compatible with that figure.
contradiction_condition: A comprehensive, comparable estimate or a non-overlapping lower bound places the same spending measure materially outside approximately $22 billion.
measurement_requirements: Specify realized versus annualized spending, coverage of providers and customers, rental versus owned infrastructure, treatment of model API purchases, and elimination of double counting.
source_requirements: Customer expenditure disclosures or a transparent independent reconstruction of provider revenue attributable to customers other than OpenAI and Anthropic.
