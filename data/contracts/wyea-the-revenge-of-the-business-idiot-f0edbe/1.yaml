ambiguity_flags:
  - The latest-quarter period is an evaluator choice for an ongoing observation.
  - Construction has no geographic scope, completion threshold, or named projects.
  - Compute capacity has no unit or definition and may be confused with rented capacity or future commitments.
  - The backlog percentage could refer to the providers collectively or separately.
  - The profitability measure, accounting basis, and substantial-loss threshold are unspecified.
  - The compound claim contains incompatible stock and flow measures that cannot share one financial metric scope.
