assessment_axis: historical_observation
explicit_source_elements:
  - data centers aren’t getting finished
  - OpenAI and Anthropic
  - 75%+ of all AI compute capacity
  - more than 50% of Amazon, Google and Microsoft’s revenue backlog
  - both of them are horrendously unprofitable
  - outside of brazen accounting tricks
evaluator_interpretation:
  - The construction clause means material delivery problems, not that no data center anywhere is completed.
  - All AI compute capacity means worldwide operational AI computing capacity, including capacity used internally by other developers; announced future capacity is excluded.
  - The backlog clause is read as the two customers' combined share of the three named providers' combined backlog. A separate-provider reading remains possible.
  - The target period is January–March 2026, the latest completed quarterly reporting period before the post; backlog and capacity are stocks at that period's end.
  - Unprofitable ordinarily concerns company-wide losses, but the speaker does not specify net income, operating income, cash burn, or an accounting basis.
  - Accounting tricks requires evidence of materially misleading accounting treatment; the existence of disclosed adjustments alone is insufficient.
  - The single metric_scope object records the backlog-share assertion. The separate profitability assertion concerns a flow with an unspecified measure and basis and cannot be combined with that stock measure for a definitive score.
support_condition: Matching-period construction records show material delivery failures; a worldwide capacity inventory establishes at least 75%; comparable customer-level backlog records establish more than 50% for the named providers; and comparable accounts establish substantial losses and materially misleading accounting treatment.
contradiction_condition: Matching-scope evidence establishes that one or more specified thresholds or factual components are false. A different provider set, future capacity commitments, or a different profit measure cannot establish contradiction.
measurement_requirements: Use a consistent operational-compute unit and worldwide denominator. Reconcile customer commitments to recognized backlog without double counting. Separate net losses, operating losses, cash burn, and adjusted results.
source_requirements: Construction tracking, an independently documented compute inventory, provider filings with customer attribution, and company accounts with accounting reconciliations.
