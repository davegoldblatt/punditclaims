explicit_source_elements:
  - While I can’t verify this information
  - if that’s the case
  - billions of tokens per minute from Meta
  - might now be as big as a quarter
  - Meta is a load-bearing pillar
  - revenue truly hinges on Google selling its models
  - without cutting out Google’s 20%+ revenue share
evaluator_interpretation:
  - The conclusion is conditional on the reported Meta usage and its material share of Anthropic's business being true.
  - The plain reading is material customer and sales-channel dependence, with reported revenue including amounts subsequently paid to Google.
  - The report is described as having appeared yesterday. I use April 7, 2026, the latest complete day before publication, as the snapshot for the current customer and channel position. No quarterly revenue period is supplied.
  - The accounting basis is estimate because the premise comes from an unverified outside report. The claim does not expressly specify an annualized measure.
  - Gross recognition is tested separately from the evaluative description 'heavily-inflated'; gross reporting alone does not establish improper accounting.
support_condition: Confirm the antecedent, then establish that Meta supplied a material share of Anthropic's revenue through Google, that this channel was materially necessary to that revenue, and that Anthropic included Google's applicable share of at least 20% in reported revenue.
contradiction_condition: With the antecedent established, matched customer and channel records show immaterial dependence, net recognition, or an applicable Google share below 20%. Failure to verify the antecedent is not contradiction.
measurement_requirements: Contemporaneous customer invoices and revenue allocations, token pricing and discounts, Google-specific channel revenue, the contractual fee denominator, and revenue-recognition treatment. Token volume cannot substitute for revenue.
source_requirements: Customer or company records, applicable Google contracts, audited disclosures where available, or independently corroborated reporting identifying the same period and measures.
