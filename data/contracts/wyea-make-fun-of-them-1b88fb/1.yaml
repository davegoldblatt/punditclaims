evaluator_interpretation:
  - Assess the contemporaneous tally of 2025 projections and run rates, rather than replacing it with revenue reached later.
  - The 2025 target period comes from the surrounding calculations. The estimates being assessed are those available at publication.
  - The ordinary substantive reading is an industry-wide annual revenue ceiling. A sum for selected companies does not establish that ceiling.
  - The tally's mixture of realized revenue, projections, and annualized rates is recorded as a hybrid measure, not silently converted into realized revenue.
  - The tallying method is not a conditional antecedent.
support_condition: A sufficiently complete contemporaneous industry inventory, with reconciled annual revenue measures, establishes a total below $39 billion.
contradiction_condition: Comparable contemporaneous evidence establishes an industry total, or a defensible lower bound, of at least $39 billion.
measurement_requirements: Separate annualized rates from realized revenue and forecasts; identify the industry boundary, omissions, and treatment of transactions between suppliers and customers.
source_requirements: Dated company disclosures and reputable reporting for private companies, or a transparent industry estimate covering the same businesses and revenue definition.
