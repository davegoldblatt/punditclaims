assessment_axis: causal_assessment
explicit_source_elements:
  - dysfunction in Washington
  - an insistence on neutered measures like self-policing
  - has left decisions about what gets released to CEOs
  - enormous financial conflicts of interest
evaluator_interpretation:
  - Assess the US frontier-model release regime as it stood on the post date.
  - The plain reading is that federal reliance on company discretion leaves materially financially interested executives with effective release authority.
  - The claim does not necessarily mean that CEOs act without boards or safety committees.
  - Financial conflicts require documented personal interests that could conflict with safety duties; company revenue incentives alone are insufficient.
  - The description of Washington as dysfunctional is evaluative, but the claimed institutional cause and resulting allocation of authority can be investigated.
support_condition: Current legal and company records establish that federal reliance on self-policing leaves effective release authority with CEOs who have substantial relevant personal financial conflicts, with evidence connecting that policy choice to the allocation of authority.
contradiction_condition: Binding independent approval requirements or effective governance arrangements displace the claimed executive authority, or reliable records negate the claimed financial conflicts or causal account.
measurement_requirements: Separate mandatory approval from voluntary testing, executive authority from board oversight, and documented financial conflicts from allegations or general commercial incentives.
source_requirements: Federal legal records, current company governance and release policies, financial-interest disclosures, and evidence bearing on the claimed policy mechanism.
