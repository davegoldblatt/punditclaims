explicit_source_elements:
  - if it does
  - I’d be shocked if it’s done before the middle of 2027
evaluator_interpretation:
  - Read this as an expectation that, conditional on eventual completion, the full original 1.2 GW campus will not be operational before mid-2027.
  - “I’d be shocked” expresses low likelihood, not a numerical probability or an absolute guarantee.
  - Treat June–July 2027 as the ordinary midyear window and July 31 as its latest boundary. Completion before June clearly precedes that window; completion within it requires review.
support_condition: The full original campus is eventually completed and energized after July 2027.
contradiction_condition: The full original campus is completed and energized before June 2027, satisfying the antecedent and clearly preceding midyear.
measurement_requirements: Determine the date of full-campus completion and energization. Partial operation and scheduled completion dates do not establish it.
source_requirements: Dated operator, developer, utility or commissioning records covering the original campus.
metric_scope: null
original_horizon: before the middle of 2027
horizon_interval:
  start: 2026-03-17
  end: 2027-07-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Verified full completion and energization before June 2027 would satisfy the condition and resolve the timing forecast against the speaker before its horizon ends.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
