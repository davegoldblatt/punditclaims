explicit_source_elements:
  - we aren’t there yet
  - given our primitive early 21st-century knowledge of AI
  - there is a lot of confusion on that point
evaluator_interpretation:
  - "There refers to the preceding combined capability: broad, reliable reasoning and synthesis, assistance against human bias, and factual output without confabulation."
  - The claim concerns the state of publicly demonstrated AI at the post date, not whether any useful reasoning assistance existed.
  - For this ongoing capability observation, use the latest public evaluation month, November 2023, ending on the November 25 post date.
  - Primitive is an evaluative description, and a lot of confusion has no defined population or measure. The assessment tests the central capability shortfall; it does not establish those descriptions or a causal explanation.
support_condition: Contemporaneous evaluations show material deficits in the preceding combined capability, including human advantages on varied tasks and continuing factual errors, without a demonstrated system meeting the full capability.
contradiction_condition: A system available by the post date independently demonstrates the broad combined capability. Narrow successes or useful assistance alone do not contradict the claim.
measurement_requirements: Contemporaneous human comparisons on varied reasoning and information-use tasks, together with evidence about factual reliability. Distinguish broad capability from isolated strengths.
source_requirements: Primary evaluations and dated technical disclosures available by November 25, 2023. Later achievements cannot establish the earlier state.
