original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: The occurrence is established once verified post-publication investigations document repeated campaigns distributing generated deceptive content across major social platforms and websites.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Polluted has no numerical threshold.
  - Much the same way could refer to mechanism or comparable magnitude.
  - No deadline is stated.
  - The degree of automation is unspecified.
