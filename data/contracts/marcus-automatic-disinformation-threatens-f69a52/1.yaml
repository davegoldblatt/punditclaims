assessment_axis: forecast_outcome
explicit_source_elements:
  - Social media companies
  - they will be polluted
  - in much the same way as the internet as a whole
evaluator_interpretation:
  - Pollution means repeated distribution of automatically generated deceptive material through coordinated influence campaigns on major social platforms.
  - "Much the same way refers to the mechanism shared with websites: generated material, fabricated identities, and coordinated publication."
  - The statement supplies no numerical prevalence threshold, requirement of persuasive success, or deadline.
  - Human-directed campaigns using generated content qualify; fully autonomous operation is not required by this sentence.
support_condition: Verified post-publication investigations document repeated campaigns distributing generated deceptive material across major social platforms and websites.
contradiction_condition: The documented cases are shown not to involve generated deceptive material or actual distribution. A finite period without detected campaigns cannot by itself falsify this undated forecast.
measurement_requirements: Verify generation, deceptive campaign behavior, actual publication, and the platforms involved. Separate distribution from audience reach or persuasion.
source_requirements: Firsthand platform or model-provider investigations, independently corroborated where possible, with dated campaign activity.
