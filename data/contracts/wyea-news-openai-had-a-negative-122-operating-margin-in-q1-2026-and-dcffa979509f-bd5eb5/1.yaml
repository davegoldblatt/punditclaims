assessment_axis: historical_observation
explicit_source_elements:
  - Assuming a userbase of 905m users
  - a conversion rate of roughly 6%
  - It's likely worse
  - monthly active users should, at least in theory, be a higher number
evaluator_interpretation:
  - The period is Q1 2026, identified in the surrounding discussion.
  - Conversion rate means the reported paying-subscriber count divided by the stipulated user base, rather than a measured rate of users purchasing subscriptions over time.
  - The monthly-user qualification expresses an expected denominator effect, not a claim to know an exact monthly conversion rate.
  - For comparable populations and nested observation windows, including less frequent users increases the denominator and lowers the paid share.
support_condition: The reported Q1 paying-subscriber count divided by the assumed 905 million users rounds to about 6%. The qualified monthly-user argument must be consistent with how broader activity windows affect the denominator.
contradiction_condition: Reliable Q1 subscriber figures make the stipulated calculation materially different from 6%, or comparable activity measurements undermine the proposed denominator effect.
measurement_requirements: Distinguish paying subscribers from active paying users, quarter-end counts from quarterly averages, and a subscriber share from a measured conversion rate. An exact monthly share requires matching subscriber and monthly-user populations and dates.
source_requirements: Company disclosures or attributable reporting for subscribers; documented audience measurements for any empirical monthly-user comparison.
