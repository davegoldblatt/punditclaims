evaluator_interpretation:
  - This is a conditional extrapolation for July–December 2025, not an unqualified disclosure of actual expenditure.
  - The calculation treats burn as gross training plus inference spending. It does not subtract revenue and therefore is not a net-cash-burn calculation.
  - "Two incompatible revenue denominators appear in the passage: $4.3 billion in the first-half setup and $2.5 billion in the training calculation."
  - Both readings must be retained because choosing one determines whether the training estimate follows.
support_condition: A consistent set of the stated first-half cost-to-revenue assumptions, applied to the assumed $8.8 billion of second-half revenue, yields approximately $23.58 billion of training spending and $28.6 billion of combined training and inference spending.
contradiction_condition: The unambiguously applicable first-half ratios yield materially different estimates, or comparable records establish that the asserted spending occurred on a materially different basis while the claimed ratio condition held.
measurement_requirements: Identify the intended revenue denominator and distinguish training compute from broader R&D expense. Calculate gross training and inference expenditure separately from net cash burn.
source_requirements: Use the post only to identify assumptions. Independent financial records are needed to validate the cost categories and any assertion about actual second-half spending.
