ambiguity_flags:
  - Very large has no numerical threshold.
  - Economy could colloquially refer to GDP, GDP growth, investment, or financial-market exposure.
  - Investment could mean financing, capital expenditure, or announced future commitments.
  - Basically and the boundary of LLM scaling are unspecified.
  - Second-quarter 2025 reporting interval supplied for an ongoing observation.
