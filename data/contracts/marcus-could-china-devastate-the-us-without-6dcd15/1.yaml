assessment_axis: historical_observation
explicit_source_elements:
  - a very large fraction of our economy
  - massive, massive investments
  - all basically following the same strategy
  - scaling ever larger language models
evaluator_interpretation:
  - Our economy means the United States economy.
  - The ordinary denominator is the level of economic activity, represented by GDP, rather than the year's increase in GDP or venture funding alone.
  - Very large means a substantial economy-wide allocation; the speaker provides no numerical cutoff, so none is invented.
  - Use the second quarter of 2025, the latest GDP reporting quarter publicly available before the post.
  - The strategy claim concerns the principal use of investment, not simply whether recipients develop any LLMs.
  - The reference to something magical is rhetorical and is not treated as a claim about investors' private mental states.
support_condition: Matched investment and GDP measurements establish a clearly substantial economy-wide share, and recipient-level evidence shows that the relevant investment principally finances scaling larger language models.
contradiction_condition: Matched measurements establish only a clearly small economy-wide share, or comprehensive recipient evidence shows that the relevant investment principally finances materially different strategies.
measurement_requirements: A domestic investment numerator attributable to larger-language-model development and a same-period GDP denominator. Avoid double counting financing and the expenditure it funds. GDP growth contributions are a separate measure.
source_requirements: National accounts plus transparent investment classification and primary descriptions of recipients' development strategies.
