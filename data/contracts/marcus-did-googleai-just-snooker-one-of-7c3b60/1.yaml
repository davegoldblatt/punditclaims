  - four digit times four digits
  - no abstract idea what multiplication is
evaluator_interpretation:
  - The claim describes the original 2022 Minerva model and its then-public evaluation cycle, through September 14.
  - The ordinary behavioral reading of fails altogether is essentially no useful accuracy on unseen four-digit-by-four-digit multiplication, rather than the impossibility of any isolated correct answer.
  - An abstract idea is provisionally interpreted as a transferable multiplication capability. Failure under one prompt cannot establish the absence of every internal multiplication representation.
  - Unseen is a required property of the evaluated problems, not an antecedent of a future conditional forecast.
  - For the ongoing capability statement, the reporting window is the current 2022 model cycle through the post date.
support_condition: Controlled tests of the original model show competent shorter multiplication and essentially absent accuracy on unseen four-digit-by-four-digit problems, with broader transfer evidence supporting the claimed lack of a general multiplication capability.
contradiction_condition: The original model reliably solves controlled unseen four-digit-by-four-digit multiplication problems, or systematic tests demonstrate transferable multiplication capability inconsistent with the categorical conceptual claim.
measurement_requirements: Exact operand lengths, model version and size, prompt, decoding method, sample size, accuracy, and evidence concerning training-set overlap. Output digit counts must not be confused with operand lengths.
source_requirements: The original Minerva evaluation, underlying results, or reproducible evaluations of the original model. Other arithmetic tasks provide context only.
