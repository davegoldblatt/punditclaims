assessment_axis: forecast_outcome
explicit_source_elements:
  - hyperscaler capex doesn’t have to stop
  - slow down meaningfully enough
  - 60%+ year-over-year revenue bumps
  - NVIDIA to stumble
  - the AI bubble is built on vibes
evaluator_interpretation:
  - The antecedent requires a hyperscaler spending slowdown that causes NVIDIA's reported revenue growth to fall below 60% year over year. Sub-60% growth for another reason would not establish it.
  - I read the revenue comparison as quarterly company-reported revenue against the corresponding prior-year quarter.
  - The ordinary reading of 'stumble' is a material setback in NVIDIA's business or investor valuation attributable to the specified slowdown. The speaker supplies no size or duration threshold.
  - The sentiment explanation requires separate causal evidence; a stock decline alone would not establish it.
support_condition: A documented spending slowdown causes the specified revenue-growth threshold to be crossed, followed by a material NVIDIA setback attributable to that episode, with evidence supporting the asserted sentiment mechanism.
contradiction_condition: A completed episode satisfies the full antecedent but NVIDIA demonstrably avoids a material setback through the episode and its investor response. Continued growth before the antecedent occurs does not contradict the forecast.
measurement_requirements: Comparable quarterly NVIDIA revenue, consistent hyperscaler capex series, and dated operating or market outcomes. Establish the link between spending and revenue growth rather than assuming it.
source_requirements: Company filings and earnings disclosures for financial measures; independently documented market outcomes and credible causal evidence for the proposed mechanism.
metric_scope:
  company: NVIDIA
  metric: year-over-year revenue growth
  currency: null
  units: percent
  accounting_basis: company_reported
  fiscal_or_calendar: fiscal
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only on a documented completed episode satisfying the spending-to-revenue antecedent and establishing the resulting setback or its absence. A revenue print or ordinary stock fluctuation alone is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline or response lag.
  - No numerical definition of 'meaningfully' or 'stumble'.
  - Quarterly rather than annual revenue comparison is an evaluator interpretation.
  - The hyperscaler population and spending measure are unspecified.
  - The sentiment mechanism is not operationally defined.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
