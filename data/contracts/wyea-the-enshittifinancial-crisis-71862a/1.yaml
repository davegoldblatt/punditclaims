condition_status: not_applicable
early_resolution_rule: A completed acquisition or IPO of an AI-focused startup after 2025-12-29 conclusively contradicts the categorical exit forecast, independently of its financial premises.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The claim combines present financial premises with a forecast.
  - AI company is not formally defined.
  - Profitability accounting basis, margin measure and scaling interval are unspecified.
  - No forecast deadline is stated.
  - The proposed verdict isolates the independently testable exit forecast; the financial premises remain ungraded.
retrospective_or_prospective: retrospective
