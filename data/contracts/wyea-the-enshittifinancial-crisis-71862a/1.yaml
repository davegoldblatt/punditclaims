assessment_axis: forecast_outcome
explicit_source_elements:
  - every AI company is unprofitable
  - margins that are getting increasingly worse as they scale
  - none of them will be able to either get acquired or go public
evaluator_interpretation:
  - The relevant companies are AI-focused startups, including AI application companies discussed in the post. Diversified technology companies and chip suppliers are excluded.
  - The forecast makes a categorical claim about completed acquisitions and IPOs. One completed acquisition or IPO after publication disproves that component.
  - The profitability and margin statements are financial premises. Their accounting basis and margin measure are unspecified; they cannot receive a separate financial verdict.
  - The proposed verdict concerns the categorical exit forecast, not whether the financial premises were true.
support_condition: Evidence establishes the asserted financial conditions and the permanent impossibility of acquisitions or IPOs throughout the relevant population. A period without exits is insufficient.
contradiction_condition: At least one relevant AI startup completes an acquisition or IPO after the post and by the evaluation date.
measurement_requirements: Distinguish completed transactions from announcements, negotiations, licensing agreements and staff recruitment. Financial premises require comparable company-level earnings and margin measurements and a specified accounting basis.
source_requirements: Prefer a company closing announcement, exchange record or regulatory filing establishing completion.
metric_scope:
  company: AI-focused startups
  metric: Company profitability and change in margins as scale increases; financial premises only
  currency: null
  units: null
