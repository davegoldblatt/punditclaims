assessment_axis: causal_assessment
explicit_source_elements:
  - leading some people
  - serious mental health issues
evaluator_interpretation:
  - The ordinary reading includes causing or materially aggravating serious psychiatric symptoms; generative AI need not be the sole cause.
  - Some people is an existence claim, not a population-prevalence estimate or a conditional forecast.
  - Clinically documented psychosis requiring hospitalization meets the seriousness threshold.
  - The relevant episodes must have occurred by February 23, 2026. Mere chatbot use during an episode is insufficient without evidence of a contributing mechanism.
support_condition: Clinical documentation and interaction records support a material causal contribution to serious psychiatric symptoms in at least some users.
contradiction_condition: Evidence refutes the claimed contributing mechanisms in documented cases and supports coincidence or reverse causation instead. Benefits for other users do not refute this existence claim.
measurement_requirements: Assess temporal order, actual chatbot interactions, clinical severity, prior illness, medication, substance use, and sleep disruption. Distinguish aggravation from independent induction of illness.
source_requirements: Clinical case reports, patient records reviewed by clinicians, or stronger clinical studies. Lawsuit allegations and chatbot safety tests alone are insufficient.
