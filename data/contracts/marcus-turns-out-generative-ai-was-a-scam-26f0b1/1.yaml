early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Leading could mean contributing to aggravation or independently causing a new disorder.
  - Serious mental health issues is not a specified clinical diagnosis.
  - The wording supplies no prevalence threshold beyond some people.
