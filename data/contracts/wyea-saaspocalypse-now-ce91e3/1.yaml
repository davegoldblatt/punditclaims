evaluator_interpretation:
  - The ordinary reading is that prevailing prices did not cover the costs of sustainably providing generative AI services.
  - For the ongoing financial condition, use April–June 2024, the latest completed calendar quarter before publication. September prices would also need to be matched to the relevant services.
  - Sustainable provision includes operating costs and an appropriate allocation of model development costs. Corporate losses alone do not establish that service prices were inadequate.
  - The claim names neither individual providers nor an accounting basis. Evidence about one provider cannot establish an industry-wide conclusion.
support_condition: Representative, comparable provider records show that revenues at the relevant prices failed to cover sustainable service-provision costs.
contradiction_condition: Representative, comparable provider records show that revenues at those prices covered sustainable service-provision costs.
measurement_requirements: Match service revenue, usage, prices, inference costs and allocated development costs. Separate realized results from forecasts, and gross margins from company-wide losses.
