assessment_axis: historical_observation
explicit_source_elements:
  - Losses also appear to be mounting
  - year-over-year
  - at a dramatic rate
evaluator_interpretation:
  - The post's comparison of 2024 and 2025 supplies the target period.
  - Losses means annual net loss attributable to OpenAI, the measure identified immediately before this sentence.
  - The ordinary reading of dramatic is a large increase in absolute annual losses, rather than a minor fluctuation. No exact percentage threshold is imposed.
  - The statement about uncertainty over future sustainability expresses doubt; it is not treated as a separate prediction that profitability is impossible.
  - The accounting basis is company_reported because the context cites company financial statements.
support_condition: Comparable reported annual net losses attributable to OpenAI show a clearly large increase from 2024 to 2025.
contradiction_condition: Comparable annual attributable net losses are flat, lower, or show only a modest increase.
measurement_requirements: Compare annual attributable net losses on the same reporting basis. Keep operating losses, cash burn, adjusted losses and losses as a percentage of revenue separate.
source_requirements: Comparable company financial statements or reputable independent reporting verifying their annual loss figures. Identify material accounting changes affecting interpretation.
metric_scope:
  company: OpenAI
  metric: Annual net loss attributable to OpenAI, comparing 2024 with 2025
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: null
horizon_interval: null
