plain_reading: true
ambiguity_flags:
  - '"Appear to be" is a hedge. It is graded as a claim about what the reported figures show, not as a firm forecast.'
  - '"Losses" could mean headline net loss or underlying (non-GAAP) loss. Most of the 2025 rise in headline net loss came from a one-time non-cash charge.'
  - '"Mounting year-over-year" could suggest a multi-year trend. Only 2024 and 2025 audited figures were reported.'
