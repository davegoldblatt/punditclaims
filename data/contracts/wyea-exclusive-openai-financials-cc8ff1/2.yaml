assessment_axis: historical_observation
explicit_source_elements:
  - '"Losses also appear to be mounting"'
  - '"year-over-year"'
  - '"at a dramatic rate"'
  - 'context: "$38.53 billion in losses" for 2025, from audited documents'
  - "\"I'm not sure how this company finds a way toward any kind of sustainability or profitability\" (opinion, not graded)"
evaluator_interpretation:
  - The speaker hedges with "appear to be". That hedge rests on the 2024 and 2025 figures he had just reported. So the fair test is narrow. Do the reported annual figures show OpenAI's losses rising sharply from 2024 to 2025? I do not treat the hedge as a firmer claim than he made.
  - The measure is OpenAI's net loss attributable to the company, the figure he cites, for calendar 2025 compared with calendar 2024.
  - '"Dramatic" has its plain meaning: a large multiple, far beyond ordinary growth. A rise of several times would meet it. A small or flat change would not.'
  - The second clause, about sustainability and profitability, states uncertainty and opinion. It is not graded.
support_condition: Credible reporting of OpenAI's audited or company figures shows its 2025 net loss was several times its 2024 net loss.
contradiction_condition: Credible figures show OpenAI's 2025 net loss was flat, lower, or only modestly higher than in 2024.
measurement_requirements: Compare OpenAI's net loss attributable to the company for calendar 2024 and calendar 2025 on the same basis.
source_requirements: An OpenAI filing or disclosure if one exists. Otherwise reputable news reports of audited figures that an outlet other than the speaker verified independently. The speaker's own post cannot be used as evidence.
metric_scope:
  company: OpenAI
  metric: net loss attributable to OpenAI
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
