  - Last year
  - claimed it had shipped six million Blackwell chips
  - comparison with its actual revenues
  - wasn’t possible
evaluator_interpretation:
  - Last year means calendar 2025.
  - "The claim has two factual components: what NVIDIA said about shipments, and whether its revenues made that shipment count impossible."
  - The ordinary reading of chips is complete GPU packages, while the context explicitly raises a competing die-count definition.
  - Financial impossibility requires a reconciliation using matching shipment dates, product mix, realized selling prices and revenue recognition. Multiplying a package count by an assumed retail price is insufficient.
  - No revenue amount, currency, accounting basis or precise revenue period is supplied.
support_condition: The presentation represents six million complete Blackwell packages as already shipped, and a reliable price-and-revenue reconciliation rules out that volume for the matching period.
contradiction_condition: The presentation clearly counts dies rather than six million packages, or comparable shipment and recognized-revenue records establish that the claimed volume was financially possible.
measurement_requirements: Inspect the spoken statement and slide labels together. Reconcile dies, packages, systems, shipment timing and recognized NVIDIA revenue using actual or defensible realized prices.
source_requirements: Original presentation materials and company financial disclosures, supplemented by independent analysis with explicit inputs.
