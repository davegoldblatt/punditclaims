assessment_axis: historical_observation
explicit_source_elements:
  - the job of a radiologist includes not just reading images
  - in some cases
  - reasoning about a patient’s history
  - reading unstructured text
  - convnets are less suited
evaluator_interpretation:
  - "The claim has two components: radiologists sometimes integrate clinical histories and free text, and conventional convolutional networks are relatively less suited to those functions than to image interpretation."
  - Less suited means a practical disadvantage for the specified work; it does not mean incapable of every text-processing task.
  - In some cases limits the asserted professional duties. It is not a conditional forecast.
  - I use the current-year reporting window through the post date for the ongoing professional and technical state.
support_condition: Professional evidence establishes the stated duties, and contemporary technical evidence establishes the relative suitability of convolutional networks for image interpretation versus clinical-history reasoning and free-text understanding.
contradiction_condition: Professional evidence rules out the stated duties, or relevant comparative technical evidence shows convolutional networks equally or better suited to the history and text functions under comparable practical requirements.
measurement_requirements: Distinguish text classification and information extraction from clinical reasoning. Do not compare raw accuracy numbers across unrelated tasks as a measure of architectural suitability.
source_requirements: Professional practice descriptions and primary technical evaluations, with architectural analysis or appropriately controlled comparisons for relative suitability.
