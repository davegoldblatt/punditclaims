early_resolution_rule: "Settled early only by a decisive dated event: for example, a filing that shows a lab's compute payments stepping up sharply, together with an emergency or outsized financing tied to them (supports); or a filing showing the labs funding the commitment ramp from operating cash flow (contradicts)."
