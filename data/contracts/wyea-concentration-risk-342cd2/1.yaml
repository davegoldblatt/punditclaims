assessment_axis: forecast_outcome
explicit_source_elements:
  - As these commitments begin
  - their needs for capital will dramatically accelerate in ugly chunks
  - both with hyperscalers and neocloud partners
  - on top of any debt deals they sign with Broadcom to fund their own silicon
evaluator_interpretation:
  - "'As these commitments begin' is read as timing: the period when the labs' contracted compute capacity comes online and payments start, which runs through about 2030. It is not read as a condition that may or may not happen."
  - "Plain reading: as contracted capacity starts, OpenAI's and Anthropic's cash needs will jump sharply in large, lumpy amounts, forcing big new fundraises or debt."
  - He set no deadline, so the forecast is open-ended.
support_condition: Dated evidence that, as contracted capacity comes online, the labs face sharply rising compute payments and respond with large, lumpy capital raises or debt that are clearly driven by those obligations.
contradiction_condition: Evidence that, through the main ramp of their commitments, the labs' capital needs grow smoothly or are met largely from operating cash flow, without sharp lumpy jumps.
measurement_requirements: Compute payment schedules, cash burn, and the size and timing of financings for both labs as capacity comes online.
source_requirements: Company filings (for example, IPO prospectuses), company announcements, or reputable financial reporting.
