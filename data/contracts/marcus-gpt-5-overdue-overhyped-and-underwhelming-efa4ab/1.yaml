explicit_source_elements:
  - other systems
  - not ... faring much better
  - the field of generative AI as a whole
  - Grok gets literally everything wrong
evaluator_interpretation:
  - The adjacent discussion of inaccurate scientific summaries makes factual accuracy and reliability the plain reading of 'faring', rather than revenue or popularity.
  - The comparison concerns GPT-5 and competing systems available at its launch, through the post date.
  - A materially better competitor would show a substantial, consistent reliability advantage across representative comparable tasks. I do not invent a numerical margin for 'much'.
support_condition: Comparable evaluations of launch-period systems show that leading competitors generally have similar or worse factual reliability than GPT-5, without a consistent substantial advantage.
contradiction_condition: Comparable evaluations show leading competitors consistently and substantially outperforming GPT-5 on representative factual-reliability tasks.
measurement_requirements: Match model versions, prompts, tools, reasoning settings and scoring methods. Report uncertainty, abstention and task coverage; isolated errors are insufficient.
source_requirements: Prefer original benchmark records and independent evaluations with dates and reproducible methods.
