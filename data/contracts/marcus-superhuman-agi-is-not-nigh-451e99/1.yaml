assessment_axis: forecast_outcome
explicit_source_elements:
  - seriously doubt
  - by the end of 2025
  - Write engaging biographies and obituaries
  - without obvious hallucinations
  - grounded in reliable sources
evaluator_interpretation:
  - Read this as a directional forecast against an ordinary usable capability covering both biographies and obituaries.
  - Allow supplied source material, retrieval, and automated checking because Marcus did not exclude them.
  - Engaging means readable and interesting to the intended audience, assessed by readers or editors.
  - Require repeatable performance on representative outputs, not an isolated lucky success or perfection on every possible prompt.
  - Grounding and absence of obvious hallucinations are success criteria, not external antecedents.
support_condition: Representative tests of suitable systems available by the deadline show that they cannot routinely produce engaging biographies and obituaries without conspicuous unsupported factual inventions, despite access to reliable information.
contradiction_condition: A system available by the deadline repeatedly produces engaging examples of both genres whose factual assertions pass independent checking against reliable sources.
measurement_requirements: Audit factual assertions in complete outputs and obtain human judgments of engagement. Record source access, prompting, subject selection, and human edits. General factuality scores alone are insufficient.
source_requirements: Prefer direct evaluations with outputs and source records. Product announcements and isolated anecdotes are contextual unless their factual accuracy and writing quality are independently checked.
