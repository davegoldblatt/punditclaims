assessment_axis: historical_observation
explicit_source_elements:
  - nobody’s margins appear to be improving
  - None of them are improving their margins
evaluator_interpretation:
  - Read this as a factual claim about observable margin trends at AI startups. The repeated unqualified wording in the context makes it stronger than a statement of personal uncertainty.
  - Gross margin is the ordinary reading in this discussion of model-serving costs. It is distinct from operating margin, net margin and profitability.
  - Use the latest completed calendar year, 2025, compared with the preceding year, plus pre-post reporting about that period. This is an evaluator-selected period for the ongoing observation.
  - The context relies on private-company financial reporting, so the intended basis is estimated margins rather than an explicitly stated GAAP or IFRS measure.
support_condition: Comparable reported gross-margin trends establish no improvement across the relevant AI-startup population.
contradiction_condition: At least one identifiable AI startup has a credible, comparable gross-margin increase in the target period. Becoming profitable is not required.
measurement_requirements: Compare the same company's gross margin over successive periods using the same revenue perimeter and cost definition. Product margins, whole-company margins and projections must be distinguished.
source_requirements: Prefer company financial disclosures or transparent measurements. Credible reporting on private financial records can establish estimated margins; anonymous aggregate surveys require evidence that the relevant startup population is isolated.
