assessment_axis: historical_observation
explicit_source_elements:
  - Practically every day
  - new signs
  - the backlash against AI is growing
evaluator_interpretation:
  - The testable claim concerns increasing public opposition, not verification of Marcus's personal reading habits.
  - The current observation window is April 2026, the latest complete month before publication, plus the elapsed days through May 4. Earlier surveys provide comparison context.
  - Practically every day ordinarily means a frequent stream of new examples. It does not require an example on every calendar day.
  - The surrounding examples and election discussion make the United States the main geographic focus, although the sentence does not expressly limit its scope.
support_condition: Comparable sentiment measurements and repeated, independently documented opposition during the observation window establish growing backlash and a frequent stream of new examples.
contradiction_condition: Comparable measurements and sufficiently broad event records establish that backlash was declining rather than growing. Failure to find an example for every day is not sufficient.
measurement_requirements: Distinguish concern from active opposition, survey populations from the general public, and separate events from repeated coverage of one event.
source_requirements: Prefer original polling and dated records of opposition; use independent reporting for events without accessible primary records.
