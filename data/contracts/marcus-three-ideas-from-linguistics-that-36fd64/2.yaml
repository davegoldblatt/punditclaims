assessment_axis: historical_observation
explicit_source_elements:
  - Large language models
  - such cognitive models
  - a persisting but dynamic sense of the world
  - at least not in a way that anybody has been able to make reliable use of
evaluator_interpretation:
  - Assess whether reliable use had been demonstrated by publication, including earlier demonstrations without an arbitrary starting year.
  - A cognitive model here maintains and updates representations of entities, their properties, and their relationships as a discourse unfolds.
  - Reliable use means repeatable use of those representations for understanding, inference, or action. Decoding information from hidden states alone is insufficient.
  - A bounded research demonstration can qualify; commercial deployment, human equivalence, and memory across separate sessions are not required.
  - The target period is the accumulated demonstration record through 2022-06-22. Research capabilities have no quarterly reporting period.
support_condition: A sufficiently comprehensive contemporary assessment establishes that available demonstrations had not achieved reliable functional use of LLM-produced, dynamically updated world representations.
contradiction_condition: At least one demonstration available by publication reliably uses a natural-language LLM's own updating representations of entities and relationships for understanding, inference, or action.
measurement_requirements: Identify the model, represented entities and relationships, state updates, downstream use, evaluation conditions, and observed reliability. Distinguish the LLM's representations from a separately supplied symbolic world model.
source_requirements: Primary research or documented demonstrations available by 2022-06-22, including earlier work. Later publications may establish historical facts but cannot make a later capability a prepublication achievement.
