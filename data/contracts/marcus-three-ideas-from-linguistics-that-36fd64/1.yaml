assessment_axis: historical_observation
explicit_source_elements:
  - a persisting but dynamic sense of the world
  - Large language models don’t produce such cognitive models
  - at least not in a way that anybody has been able to make reliable use of
evaluator_interpretation:
  - A cognitive model means a representation of entities and their relationships that updates as the described situation changes.
  - Reliable use means repeatable use of those representations for state tracking, prediction or decisions, with measured errors. It need not be conscious, human-like or commercially deployed.
  - The reliability qualification is part of the observation, not an antecedent of a conditional forecast.
  - For the ongoing state, use the current calendar year through publication as the latest reporting window. Earlier experiments are relevant context, but are not relabeled as 2022 measurements.
support_condition: Contemporary evaluations and a sufficiently broad review establish that available language models did not provide usable, persistent and updating entity-state representations with dependable task performance.
contradiction_condition: A model within the contemporaneous scope demonstrably produces updating entity-state representations that researchers or users exploit repeatedly and reliably on a defined task.
measurement_requirements: Measure state accuracy, update consistency and practical use of the representation. Distinguish a probe's ability to recover information from demonstrated use by the model or another system.
source_requirements: Primary experiments and documented applications involving models available by June 22, 2022, with explicit attention to scope and reliability.
