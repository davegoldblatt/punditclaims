explicit_source_elements:
  - Every company
  - subject to the stronger set of regulations
  - valued in the billions
  - $100M+ training runs
evaluator_interpretation:
  - Treat this as an observation about companies that would fall under the proposed rules as understood at the post date, not a forecast about every future developer.
  - The plain reading of valuation is the company's equity value, rather than funding raised, spending capacity, or training expenditure.
  - Read 'in the billions' as billion-dollar scale, provisionally at least US$1 billion; the result does not turn on that boundary.
  - For this ongoing stock-value claim, use the latest publicly documented valuation applicable as of June 7, 2024. There is no common quarterly reporting period for private-company valuations.
  - The speaker supplies no valuation source or basis, so accounting_basis remains unknown.
support_condition: Identify the complete contemporaneous set of companies subject to the stronger rules and establish that every member had a qualifying valuation on a consistent, disclosed basis.
contradiction_condition: Identify at least one company subject to those rules whose contemporaneous valuation was demonstrably below billion-dollar scale on the applicable basis.
measurement_requirements: Establish legal coverage separately from valuation. Training budgets, funding proceeds, and compute ownership cannot substitute for equity valuation. The unspecified valuation basis must be resolved before a decisive money verdict.
source_requirements: The relevant bill version, documented model-training characteristics, and dated company disclosures, transaction records, filings, or reputable valuation reporting for each covered company.
