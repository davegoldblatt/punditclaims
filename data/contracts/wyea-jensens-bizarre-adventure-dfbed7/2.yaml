explicit_source_elements:
  - compelling evidence
  - NVIDIA has been inflating its revenues using Chinese smuggling operations
  - have done so for years
  - likely known at the highest levels of the company
evaluator_interpretation:
  - The ordinary reading of 'inflating its revenues' here is increasing actual sales through channels that illegally divert chips to China. It does not require fictitious sales, accounting fraud, or a financial restatement.
  - The scored assertion is that compelling evidence links NVIDIA revenue to such operations over multiple years. No particular dollar amount or percentage is required.
  - The statement about leadership knowledge is expressly probabilistic. It is recorded but excluded from the support and contradiction conditions.
  - The claim describes a multiyear history extending to the post date. Its starting date is unspecified and is left open; selecting only the latest reported quarter would erase 'for years'.
  - The surrounding references to reporting and short-seller research imply an estimate-based claim rather than a specified accounting measure.
support_condition: Credible, corroborated records or reporting establish that purchases supplying illegal chip-diversion operations generated NVIDIA sales repeatedly over multiple years before the post. Evidence may establish the commercial chain without quantifying NVIDIA's exact receipts.
contradiction_condition: Credible evidence establishes that the alleged multiyear revenue channels did not involve illegal diversion, did not generate NVIDIA sales, or did not operate over multiple years. Denials, incomplete investigations, or missing public records alone do not establish contradiction.
measurement_requirements: Connect NVIDIA's sales to purchases supplying illegal diversion and establish recurrence over multiple years. Distinguish NVIDIA revenue from server manufacturers' revenue, intermediary import values, financing, attempted transactions, and lawful offshore chip rental.
source_requirements: Prefer court records, admissions, transaction records, and official findings. Corroborated investigative reporting can establish the claim without a conviction. An allegation or investigation alone does not establish the complete proposition.
