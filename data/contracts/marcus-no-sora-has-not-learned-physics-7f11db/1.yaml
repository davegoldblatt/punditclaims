assessment_axis: historical_observation
explicit_source_elements:
  - absolutely fails at object permanence 101
  - People, animals, limbs, etc
  - routinely wink in and out of existence
  - as a function of predictions about pixels
  - rather than as the computations of the states of physical entities
evaluator_interpretation:
  - Object-permanence failure means an entity appears or disappears without a scene-consistent explanation, rather than ordinary occlusion, camera movement or an intentional edit.
  - Routinely means recurring in ordinary generation, not merely possible in a selected failure example.
  - The claim includes a proposed mechanism. A visual prediction objective alone does not establish that the network contains no learned object-state representation.
  - Use February 2024, the most recent complete month before publication, for the ongoing observation of the original preview model.
support_condition: Representative contemporaneous outputs show recurring unexplained entity appearances and disappearances, and technical or controlled evidence establishes the claimed explanation in terms of visual prediction rather than physical-state computation.
contradiction_condition: Representative tests show dependable object persistence with only rare failures, or direct technical evidence disproves the asserted exclusion of physical-state computation.
measurement_requirements: Track entity identity across frames, distinguish disappearance from occlusion or cuts, and report a denominator for frequency. Evaluate the mechanism separately from visible errors.
source_requirements: Original-model documentation, contemporaneous output studies, or later analyses explicitly tied to that same model and period.
