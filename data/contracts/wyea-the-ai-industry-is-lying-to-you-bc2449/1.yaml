explicit_source_elements:
  - AI makes very little revenue
  - lacks tangible productivity benefits
  - seems to
  - at scale
  - workers that are being forced to use it
evaluator_interpretation:
  - In context, AI means commercial generative AI.
  - For this ongoing observation, use October through December 2025, the latest completed calendar quarter before the post. This reporting interval is an evaluator choice.
  - "'Lacks tangible productivity benefits' means no meaningful measured improvement in useful work, rather than merely no proven economy-wide transformation."
  - "'Very little revenue' supplies no company perimeter, accounting basis or comparison baseline."
  - The harm component is tentative and specifically concerns large-scale compelled use; it should not be strengthened into a universal claim.
support_condition: Comparable revenue evidence establishes a small amount against a defensible stated baseline, while representative workplace measurements show no material productivity benefits and evidence of harm under large-scale compelled use.
contradiction_condition: Matched-period evidence of meaningful workplace gains contradicts the no-benefits component. Revenue requires a specified perimeter and comparison baseline; evidence of voluntary use alone does not settle the compelled-use component.
measurement_requirements: Distinguish realized revenue from annualized run rate and financing. Measure useful output, quality and time, and identify whether workers were required to use AI.
source_requirements: Use comparable financial disclosures and controlled or credible workplace studies. Different periods and simulated workplace tasks are context only.
