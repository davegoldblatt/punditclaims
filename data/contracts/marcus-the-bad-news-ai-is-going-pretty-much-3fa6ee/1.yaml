explicit_source_elements:
  - the Jurassic Park moment
  - mass-produced AI-generated misinformation
  - projected in December 2022
  - has arrived
evaluator_interpretation:
  - Assess whether mass production had occurred by publication, rather than grading the accuracy or originality of the December 2022 prediction.
  - Mass-produced means systematic, repeated production and distribution of many false or misleading factual communications.
  - AI-generated misinformation includes fabricated narratives distributed through AI-generated narration; the claim does not require fully autonomous scriptwriting.
  - Has arrived describes cumulative occurrence since the cited December 2022 prediction, so the target period runs from that month through publication.
support_condition: A documented network or campaign systematically produced and distributed substantial quantities of false or misleading material using generative AI.
contradiction_condition: Reliable investigations establish that the apparent large-scale examples lacked either generative-AI involvement or misinformation, with no qualifying production established during the target period.
measurement_requirements: Establish AI involvement, examples of false or misleading claims, repeated production, and distribution. Counts of generic AI websites alone are insufficient.
source_requirements: Prefer primary investigations with examples, a stated methodology, and dated production or distribution measurements.
