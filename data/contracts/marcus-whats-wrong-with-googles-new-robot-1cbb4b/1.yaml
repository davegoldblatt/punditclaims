assessment_axis: causal_assessment
explicit_source_elements:
  - Building a robot on top of language system
  - such little comprehension of the world
  - can’t be a recipe for success
evaluator_interpretation:
  - Read success in context as dependable, safe performance of varied household requests, rather than completion of a selected demonstration.
  - "Read the claim as a causal objection: inadequate world understanding prevents dependable robot performance."
  - The speaker supplies neither a measurement of world comprehension nor a success threshold. Those omissions limit how strongly experiments can settle the claim.
  - Later research may inform the causal assessment, but success with a materially different architecture does not automatically refute a criticism of the 2022 approach.
support_condition: Controlled, representative evaluations establish that limited world understanding in the relevant language system prevents dependable household performance, after separating that limitation from perception, control, and hardware failures.
contradiction_condition: Robots using the criticized kind of language system demonstrate sustained, independently verified, safe performance across varied household requests without overcoming the limitation alleged to prevent success.
measurement_requirements: Repeated task completion and safety evaluation across varied environments, plus comparisons that distinguish language understanding from perception, control, and added feedback mechanisms.
source_requirements: Primary robot evaluations or controlled studies available by 2026-10-28. Demonstrations and simulated benchmarks must be identified as such.
