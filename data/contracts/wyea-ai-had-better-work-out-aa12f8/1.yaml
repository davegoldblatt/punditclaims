assessment_axis: forecast_outcome
explicit_source_elements:
  - any further souring of the debt markets
  - neoclouds and would-be data center operators
  - paying 12% to 15% in interest
  - data centers sometime three years in the future
  - pretty much entirely made up of Anthropic and OpenAI
evaluator_interpretation:
  - Further souring means an observable deterioration in AI infrastructure credit conditions after October 20, 2026.
  - Paying interest means the annual borrowing cost on new financing, rather than the secondary-market yield on previously issued fixed-coupon bonds.
  - Three years describes the approximate lead time to the financed data centers becoming operational. It does not clearly impose a deadline for obtaining financing.
  - The customer description is part of the predicted project characteristics, not a separate antecedent.
  - A sector-wide prediction requires representative financing evidence rather than one unusually risky borrower.
support_condition: Following further credit deterioration, representative new financings carry annual interest costs of 12%–15% for data centers approximately three years from operation whose committed demand comes overwhelmingly from Anthropic and OpenAI.
contradiction_condition: Comparable financing after the trigger systematically falls outside the stated range, or representative projects materially fail the stated construction timing or customer-concentration description.
measurement_requirements: Executed financing terms, issue prices, fees and floating-rate benchmarks; project completion schedules; and customer commitments for the same projects. Distinguish coupon, effective borrowing cost and secondary-market yield.
source_requirements: Executed credit agreements, issuer filings and project disclosures, supplemented by independent credit-market measurements.
