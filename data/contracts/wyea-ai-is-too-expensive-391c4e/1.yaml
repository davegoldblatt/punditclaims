evaluator_interpretation:
  - Read this as an approximate three-to-one ratio of cumulative training and inference expenditure to cumulative realized revenue.
  - Use the cumulative period covered by the identified March declaration, not calendar 2025 alone.
  - The located declaration was executed and filed on March 9, 2026; the surrounding post's March 6 reference appears to misdate it.
  - Treat before other costs as the numerator's scope, not as a conditional antecedent.
  - The word appears permits an approximation but does not turn disclosed lower bounds into exact amounts.
support_condition: The declaration supplies comparable cumulative compute expenditure and realized revenue figures whose ratio is approximately three to one.
contradiction_condition: The declaration supplies comparable figures or bounds that exclude a ratio approximately three to one.
measurement_requirements: Match cumulative periods and retain the declaration's lower-bound wording. Exclude other expenses, future commitments, financing proceeds, and annualized revenue.
