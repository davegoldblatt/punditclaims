assessment_axis: historical_observation
explicit_source_elements:
  - based on its own affidavit from March
  - appears to have spent $3 to make $1 of revenue
  - on a compute basis
  - before you include any and all other costs like staff or electricity
evaluator_interpretation:
  - "The claim is an inference drawn from a named document: CFO Krishna Rao's March 2026 declaration. The test is whether that document's compute and revenue figures, read as an informed reader would, point to roughly $3 of compute spending per $1 of revenue."
  - "'Appears' marks the figure as an inference rather than a disclosed number. It is not treated as a strict threshold. But the inference still has to match the figures he cites. If the document's own numbers point clearly to a different ratio, the inference does not hold."
  - Anthropic's later S-1 annual figures, which add up to the affidavit's totals, are used to check what the true cumulative ratio was for the same period.
  - "'Compute basis' is read as training plus inference spending (the affidavit's category), or the S-1 line 'compute and infrastructure'."
support_condition: The affidavit's figures, or audited figures for the same cumulative period, show roughly $3 (say $2.5 or more) of compute spending per $1 of revenue.
contradiction_condition: The affidavit's figures and the company's audited cumulative figures for the same period point to a clearly different ratio, such as about $2 per $1.
measurement_requirements: Cumulative compute (training and inference) spending divided by cumulative revenue, from inception to the March 2026 declaration.
source_requirements: The court declaration itself, and Anthropic's SEC filing for the cumulative annual figures.
