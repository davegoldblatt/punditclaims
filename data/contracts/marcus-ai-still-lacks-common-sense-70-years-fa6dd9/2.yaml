ambiguity_flags:
  - The demonstrations are unnamed.
  - “Recent” has no explicit starting date; the target window is provisional.
  - “Commonsense required” has no specified measure or task breakdown.
  - “All or most” concerns commonsense, not necessarily all demonstrated functions.
  - “Apparently” expressly qualifies the attribution.
