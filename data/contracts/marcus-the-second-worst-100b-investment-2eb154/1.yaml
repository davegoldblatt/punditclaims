explicit_source_elements:
  - Most of those who invested in driverless cars
  - lost money
  - unless they invested early and cashed out
  - before patience began to run out
evaluator_interpretation:
  - “Most” means more than half of distinct investors, rather than most companies or most invested dollars.
  - The statement concerns cumulative investor results by 2024-03-30. It does not name a starting date.
  - Apply the stated exception to early investors who exited profitably. Do not assume every early exit was profitable.
  - An operating loss or impairment at one company does not by itself establish the total return of all its investors.
  - The speaker does not specify whether unrealized valuation losses count. Examine realized and total-return measures separately rather than choosing whichever produces a majority.
support_condition: Investor-level records establish that more than half of the relevant investors outside the early profitable-exit exception had negative cumulative returns by 2024-03-30.
contradiction_condition: Investor-level records establish that half or fewer of those investors had negative cumulative returns by 2024-03-30.
measurement_requirements: A defined investor population, entry costs, subsequent contributions, distributions, exit proceeds and defensible remaining values. Count investors consistently and document the exception.
source_requirements: Investment and exit disclosures or a transparent, representative investor-level dataset. Company losses and share-price declines without investor entry prices are insufficient.
