ambiguity_flags:
  - Returns has no named capability measure or denominator.
  - Absolute compute increments and proportional compute increases imply different notions of diminishing returns.
  - Each could mean every release literally or a general trend.
  - The sentence combines pretraining scaling, broader capability progress, and persistent task failures.
  - Training cost and compute are not interchangeable when hardware prices or efficiency change.
