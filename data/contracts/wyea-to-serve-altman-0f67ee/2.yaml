assessment_axis: historical_observation
explicit_source_elements:
  - generative AI is deeply unprofitable
  - based on the Information's estimates
  - the cost of goods sold is unsustainable
evaluator_interpretation:
  - The speaker ties the claim to The Information's July 2024 estimates of OpenAI's 2024 finances. So the period tested is calendar 2024, the year those estimates cover, not a single quarter.
  - "'Deeply unprofitable' plainly means large losses relative to revenue at the leading generative AI firms, with OpenAI the main case."
  - "'Cost of goods sold is unsustainable' is read plainly as: the cost of training and running the models is at or above the revenue they bring in, so the business cannot cover its costs without outside money. This is a reading; he gave no gross-margin threshold."
support_condition: Reliable reports show OpenAI (and other leading generative AI firms) losing large sums in 2024, with model training and inference costs at or above revenue.
contradiction_condition: Reliable reports show OpenAI or the leading generative AI firms near breakeven or profitable in 2024, or with model running costs well below revenue.
measurement_requirements: OpenAI's 2024 revenue, net loss, and compute (training plus inference) costs, from company documents as reported, or from The Information's estimates as relayed by reputable outlets.
source_requirements: Reputable news reports of OpenAI's internal figures or company documents; no primary filing exists because OpenAI is private.
metric_scope:
