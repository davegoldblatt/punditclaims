assessment_axis: historical_observation
explicit_source_elements:
  - generative AI is deeply unprofitable
  - based on the Information's estimates
  - the cost of goods sold is unsustainable
evaluator_interpretation:
  - Read deeply unprofitable as substantial losses relative to revenue among generative AI providers, not a claim that every AI-related business loses money.
  - The surrounding discussion identifies OpenAI as the company whose cost of goods sold is being assessed.
  - Read unsustainable cost of goods sold as direct service costs that cannot be covered at then-current prices and usage, rather than a prediction of inevitable corporate failure.
  - Because this describes an ongoing state without a specified reporting period, use April through June 2024, the latest completed calendar quarter before publication. Full-year projections are context rather than realized quarterly results.
  - The metric scope records the OpenAI component. The broader sector claim also requires representative provider evidence and cannot be established from OpenAI alone.
support_condition: Comparable results for the target quarter show large losses relative to revenue across representative generative AI providers, and OpenAI service revenue fails to cover its properly defined cost of goods sold.
contradiction_condition: Comparable results show representative generative AI providers were profitable and OpenAI service revenue covered its direct service costs on a sustainable basis. Evidence addressing only one component cannot settle the whole statement.
measurement_requirements: Quarterly realized revenue, losses and direct service costs on consistent accounting bases. Separate inference, training, research, stock compensation and other operating costs; do not substitute revenue run rate for realized revenue.
source_requirements: Prefer financial statements or contemporaneous company disclosures. Where unavailable, use independently reported financial documents and identify estimates and exclusions.
metric_scope:
  company: OpenAI
  metric: Cost of goods sold relative to service revenue
  currency: USD
  units: USD; costs compared with revenue
  accounting_basis: estimate
