ambiguity_flags:
  - The ongoing observation has no named reporting period; the latest completed quarter is used.
  - Deeply has no numerical threshold.
  - Generative AI could mean model developers or a wider set of application providers.
  - Unsustainable could refer to gross margins, continued external financing, or long-term business viability.
  - The boundary between cost of goods sold and research or training expense is unspecified.
