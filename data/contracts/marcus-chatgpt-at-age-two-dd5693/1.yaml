evaluator_interpretation:
  - Assess the supplied normalized proposition about corporate experience; the high-school clause is not a separate target here.
  - The plain reading is that a substantial, non-isolated group of Fortune 500 companies using ChatGPT found actual deployment results below their expectations.
  - Underwhelmed means disappointment relative to expectations, not necessarily zero benefit or financial loss.
  - For the ongoing state, use July through September 2024, the latest complete quarter before the post.
  - Surveys of all large businesses or all generative AI products are context unless the relevant Fortune 500 ChatGPT subgroup is identifiable.
support_condition: Representative survey results or sufficiently broad documented company accounts show a substantial group of Fortune 500 ChatGPT users reporting results below expectations during the target period.
contradiction_condition: Comparable evidence shows disappointment among Fortune 500 ChatGPT users was rare or isolated during the target period.
measurement_requirements: Identify Fortune 500 membership, ChatGPT use, actual deployment experience, expected results, and the prevalence of disappointment. Majority satisfaction alone does not rule out a substantial dissatisfied minority.
source_requirements: Company statements or transparent surveys with an identifiable Fortune 500 ChatGPT subgroup. Vendor anecdotes and broader AI surveys cannot establish the claimed prevalence.
