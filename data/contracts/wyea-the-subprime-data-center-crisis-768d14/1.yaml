explicit_source_elements:
  - AI data center debt
  - poorly-underwritten
  - virtually-uncollateralized
  - extremely low likelihoods of repayment
evaluator_interpretation:
  - This is a broad description of the sector, not a claim about every individual loan.
  - Virtually uncollateralized means collateral offers negligible economic protection, including after plausible depreciation; a legal lien alone does not settle that question.
  - Extremely low likelihood of repayment means repayment is very unlikely, rather than merely exposed to substantial risk.
  - Because no reporting period is named, the target is January through March 2026, the latest ordinary completed quarterly reporting window publicly available before the July 22 post.
  - This is a qualitative sector credit-quality claim, not a specified company's debt amount or accounting measure.
support_condition: Representative loan records show weak assessment of repayment capacity, negligible recoverable collateral relative to exposure, and repayment that was very unlikely during the target period.
contradiction_condition: Representative records show meaningful collateral protection and underwriting supported by credible cash flows, with repayment generally likely. An isolated secured loan does not refute the sector-wide characterization.
measurement_requirements: A representative debt sample, underwriting assumptions, enforceable security and guarantees, realistic collateral recoveries, and repayment-risk estimates. Later defaults may inform earlier risk but must be tied to conditions in the target period.
source_requirements: Loan agreements, security documents, borrower filings, lender assessments, and independent collateral or credit analysis.
