assessment_axis: historical_observation
explicit_source_elements:
  - '"Much like a subprime mortgage"'
  - AI data center debt
  - '"poorly-underwritten"'
  - '"virtually-uncollateralized"'
  - '"issued to projects that have extremely low likelihoods of repayment"'
  - '"based on flimsy information and hype-driven mania"'
evaluator_interpretation:
  - "The claim is about AI data center debt as a class, at the time of the post. Target period: 2026-01-01 to 2026-07-22."
  - '"Extremely low likelihoods of repayment" is a probability judgement about future repayment. It is not scored as a present fact. Lack of defaults so far would not refute it.'
  - '"Virtually-uncollateralized" may be read in an economic sense: the debt is formally secured, but by GPUs that lose value and by contracts that depend on unprofitable customers. That reading is as reasonable as the literal one (no security package), so formal security alone does not refute the claim.'
  - '"Poorly-underwritten" has no agreed measure. Possible proxies are credit ratings, security packages, lending terms, lender statements, and early default or distress records.'
support_condition: Evidence from the period that typical AI data center loans and bonds have weak or no security, or security widely judged close to worthless. Or evidence that lenders relaxed standards, together with widespread low ratings or early distress tied to weak terms.
contradiction_condition: Evidence that most AI data center debt is secured by hard assets and contracted cash flows from creditworthy offtakers, is rated investment grade, and shows no signs of distress. That would contradict the claim under both the literal and economic readings.
measurement_requirements: Security packages, ratings and terms across a representative set of AI data center debt deals, plus default or distress records.
source_requirements: Company financing disclosures and filings, rating agency actions, reputable financial press.
metric_scope: null
original_horizon: null
horizon_interval: null
