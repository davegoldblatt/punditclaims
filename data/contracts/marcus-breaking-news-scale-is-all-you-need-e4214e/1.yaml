evaluator_interpretation:
  - "Plain reading: from about late 2020 to late 2025, scaling up models (more compute, data and parameters) was the main strategy for AI progress. It drove frontier research, large AI investment, and government AI policy."
  - I do not require proof that most researchers believed scaling alone would reach general intelligence. The sentence is about scaling being the dominant view and shaping research, investment and policy, not about any one person's stated belief.
  - Government policy is tested with US federal AI policy documents from the period.
support_condition: Credible sources show that scaling was the main strategy behind frontier AI progress in 2020–2025, that investment followed it, and that government policy centred on compute and infrastructure.
contradiction_condition: Credible sources show that scaling was a minor or contested strategy in that period, or that investment and policy were organised around other approaches.
