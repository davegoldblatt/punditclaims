explicit_source_elements:
  - achieve general intelligence simply by “scaling” large language models
  - scale is all you need
  - the dominant view
  - for the last half decade
  - shaping not only AI research, but investment and even government policy
evaluator_interpretation:
  - The proposition concerns the belief that scaling large language models alone would suffice for general intelligence. Belief that scaling improves performance does not establish this proposition.
  - I read 'dominant view' as the prevailing position shaping the field's direction, without requiring unanimity or imposing an unstated numerical majority threshold.
  - "I interpret 'the last half decade' as approximately the five years preceding publication: December 8, 2020 through December 8, 2025. The context allows an emerging retreat near the end of that period."
  - The claim requires evidence that this specific belief influenced research, investment and government policy. Infrastructure expansion or commercial enthusiasm alone does not establish the asserted influence.
  - Researcher headcounts and the strategies of influential institutions are relevant but different indicators. Neither automatically establishes dominance.
support_condition: Contemporaneous evidence across the five-year period establishes that scaling LLMs alone to general intelligence was the prevailing view shaping AI's direction, with documented influence on research agendas, investment decisions and government policy.
contradiction_condition: Broad contemporaneous evidence establishes that this specific belief was not prevailing over the period, or that a claimed domain of influence was materially mischaracterized. Individual dissent, a late change of opinion or failure to find explicit endorsements is insufficient by itself.
measurement_requirements: Distinguish belief in scaling's sufficiency for general intelligence from belief in its usefulness. Assess the coverage, timing and population of surveys, and distinguish institutional influence from numerical prevalence.
source_requirements: Prefer contemporaneous research surveys, lab strategy statements, investor explanations and government documents. Evidence of influence should identify the underlying belief, rather than infer it solely from expenditure or infrastructure.
