assessment_axis: historical_observation
explicit_source_elements:
  - Large Language Models
  - your most engaged customers are also your most-expensive
  - the more-intensive the work, the more expensive the outputs become
evaluator_interpretation:
  - Engagement means actual use of the service. Expense means the provider's total serving cost per customer, rather than the customer's subscription payment or an equivalent API bill.
  - The ordinary reading is a general relationship between heavier usage and higher serving costs, not an exceptionless ranking of individual customers.
  - Use February 2026, the latest complete monthly usage period before publication. The post supplies no measurement period.
support_condition: Comparable customer-level measurements show that the heaviest users generally incur the highest total serving costs, with more computationally intensive work increasing those costs.
contradiction_condition: Comparable measurements show that heavier users generally do not cost more to serve, or that the claimed relationship reverses across representative services.
measurement_requirements: Customer usage and actual provider serving expenses measured over the same period, accounting for model choice, caching, batching, and task complexity. API list prices alone are insufficient.
source_requirements: Provider cost records or independently reproducible measurements connecting engagement to serving expense.
