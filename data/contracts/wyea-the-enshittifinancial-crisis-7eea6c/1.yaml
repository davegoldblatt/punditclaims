explicit_source_elements:
  - The market for AI compute is very, very small
  - outside of serving these two companies
  - through the first 9 months of this year
evaluator_interpretation:
  - Read in context, the claim concerns third-party AI compute demand outside OpenAI and Anthropic, relative to their demand and the proposed capacity buildout.
  - Use January–September 2025, explicitly identified by the surrounding spending comparison.
  - Distinguish direct compute purchases from applications buying model APIs, internal hyperscaler compute and total cloud revenue.
  - The context acknowledges hyperscalers as buyers; finding one hyperscaler contract alone does not settle the claim about the remaining market's size.
  - Very small is qualitative. Do not invent a numerical threshold or equate a small number of buyers with a small dollar market.
  - Treat the market-size comparison as an estimate because the speaker combines reported spending with his own assumptions.
support_condition: Comparable realized AI-compute spending or supplier revenue shows that demand outside OpenAI and Anthropic was a minor residual relative to their demand and the relevant capacity during January–September 2025.
contradiction_condition: Comparable realized spending establishes substantial independent demand outside the two companies, inconsistent with its being a minor residual.
measurement_requirements: Customer-level AI-compute revenue or spending, with indirect OpenAI and Anthropic purchases identified and double counting removed. Commitments, annualized rates, total cloud revenue and hardware sales cannot substitute for realized compute revenue.
source_requirements: Supplier filings, customer disclosures and independent market measurements that separate AI compute from other services and identify ultimate demand.
