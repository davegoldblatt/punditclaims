explicit_source_elements:
  - Despite all of this hype, all of this media attention, all of this incredible investment
  - the supposed "innovations"
  - don't even seem capable of replacing the jobs that they're meant to
  - "context: Wendy's FreshAI needing human help on 14% of orders, White Castle 10%, McDonald's ending its IBM test"
evaluator_interpretation:
  - "The key verb is hedged: 'don't even seem capable'. This is his impression of how things look, not a firm statement of fact."
  - The examples he gives (intervention rates, McDonald's ending its test) are his support for that impression. They are separate factual points that this claim does not commit to as a measurable threshold.
  - He names no measure of 'replacing jobs' (whole roles, headcount, or share of tasks). Picking one would put words in his mouth. So no plain-reading exception applies and the claim is not scored.
support_condition: Not scored. If it were firm, evidence that the named restaurant ordering systems still needed regular human help and had not removed order-taking staff by mid-2024 would fit his view.
contradiction_condition: Not scored. If it were firm, evidence that these systems ran without staff and removed order-taking roles by mid-2024 would cut against it.
