explicit_source_elements:
  - don't even seem capable
  - replacing the jobs that they're meant to
  - Wendy's still requires human beings
evaluator_interpretation:
  - Read this as a tentative empirical assessment of the restaurant ordering systems discussed immediately before it.
  - Replacing a job means taking over an intended worker's complete role sufficiently to substitute for that worker. It does not require replacing every restaurant occupation.
  - Continuing human intervention establishes incomplete task automation but does not by itself establish that no positions can be eliminated.
  - Use April–June 2024, the latest completed quarter before publication; the context specifically discusses June developments.
support_condition: Deployment and staffing records show that the discussed systems remained dependent on workers and could not substitute for the complete roles they were intended to replace.
contradiction_condition: Deployment and staffing records show reliable substitution for those complete roles, with human escalation and reassigned duties accounted for.
measurement_requirements: Identify the intended roles, intervention rates, duties remaining with workers, and staffing changes. Distinguish order completion from job replacement.
source_requirements: Prefer restaurant or vendor deployment records and staffing evidence. Use reputable reporting for company statements unavailable in a readable primary disclosure.
