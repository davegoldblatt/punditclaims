assessment_axis: historical_observation
explicit_source_elements:
  - Cherry-picked studies
  - benchmark-gaming
  - now even vibe-coded graphs
  - zero transparency about how systems work or how they have been trained
  - public science is in the rear view mirror
evaluator_interpretation:
  - The surrounding reference to the last several years covers recent industry practices through publication. I operationalize that imprecise period as January 2023 through August 9, 2025.
  - Selective reporting and benchmark gaming mean practices that inflate apparent performance through selection or benchmark-specific optimization.
  - Vibe-coded graphs means graphs produced using AI-assisted coding; incorrect graphs alone do not establish their provenance.
  - Zero transparency is read as an absence of substantive public information about system design or training, not merely an inability to reproduce a complete commercial model.
  - Public science being in the rear view mirror is rhetorical emphasis, without a separate measurable threshold.
  - The components are assessed separately; evidence for one does not establish all of them.
support_condition: Documented selective reporting or benchmark manipulation, verified AI-assisted graph production, and a demonstrated absence of substantive design or training disclosures support the respective components.
contradiction_condition: Substantive public architecture or training disclosures contradict the zero-transparency component. Verified non-AI graph production or evidence disproving a specified manipulation allegation would contradict those components.
measurement_requirements: Separate observed practices from inferred intent, erroneous graphics from AI-generated graphics, and incomplete disclosure from no substantive disclosure.
source_requirements: Original benchmark research and operator responses, dated model disclosures, and records identifying how the launch graphs were produced.
