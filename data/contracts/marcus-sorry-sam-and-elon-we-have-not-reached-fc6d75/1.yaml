explicit_source_elements:
  - a step beyond AGI
  - anything a person, even an expert, can do, and much more
  - The idea that we have reached that point is laughable
evaluator_interpretation:
  - Assess the factual assertion that current AI had not surpassed expert humans across intellectual activities. Laughable is rhetorical emphasis, not a separate measurable claim.
  - The contextual definition supplies the capability standard, not a conditional forecast.
  - The plain reading requires reliable breadth of capability. Strong performance in selected domains alone is insufficient.
  - Use July 1–28, 2026, for current capabilities. There is no regular reporting period for frontier capability.
  - The claim does not require independently grading the separate assertion about how many Marcus–Brundage tasks AI could perform.
support_condition: Credible July evaluations show that leading AI systems still have substantial deficits on intellectual tasks humans can perform.
contradiction_condition: Broad, independently validated evaluations establish an AI system that reliably matches or surpasses expert humans across intellectual activities, including unfamiliar tasks.
measurement_requirements: Use evaluations with relevant human comparisons and clear test conditions. Distinguish benchmark scores from percentages of all human abilities.
source_requirements: Dated benchmark evaluations or independent capability studies relevant to systems available during the target period.
