assessment_axis: historical_observation
explicit_source_elements:
  - Apple didn’t give OpenAI any money to integrate ChatGPT
  - paying instead in “distribution”
  - loses OpenAI money on literally every transaction
evaluator_interpretation:
  - The claim combines the initial integration's cash terms with a universal assertion about ChatGPT transaction economics.
  - The plain reading of every transaction includes paid and unpaid ChatGPT use; the sentence does not expressly limit that phrase to anonymous free requests through Apple.
  - A transaction means an individual ChatGPT request and response. Subscription receipts would require a stated allocation method before comparing revenue with costs per transaction.
  - The contract's metric_scope records the unresolved transaction-profit assertion. The separate cash-payment assertion is scoped in its evidence item and cannot substitute for transaction-profit evidence.
  - The target is the June 10 integration announcement and the arrangement and service economics described through June 17. No quarterly financial reporting period is asserted.
support_condition: Reliable deal records establish no cash consideration from Apple, and transaction-level records establish negative profit for every relevant ChatGPT transaction on a defined accounting basis.
contradiction_condition: Reliable records establish an Apple cash payment for the initial integration, or establish at least one non-loss-making ChatGPT transaction on the same defined basis.
measurement_requirements: Separate cash consideration, subscription revenue, inference costs, allocated overhead, and total company losses. Define revenue and cost allocation per request. The unspecified accounting basis prevents a supported or contradicted judgment on the universal loss assertion.
source_requirements: Public deal documents or reputable reporting on private terms, plus records of ChatGPT transaction revenue and costs for the target period.
