evaluator_interpretation:
  - Read 'not going away' as persistence at the time of the post, rather than a separate prediction that hallucinations can never be reduced.
  - Read 'more' as a higher measured hallucination rate on comparable factual-question evaluations against at least one earlier OpenAI model.
  - Use the April 2025 release reporting period through the post date for the ongoing observation about 'recent o3'.
support_condition: Comparable evaluations available for the release show o3 with a higher hallucination rate than an earlier OpenAI model.
contradiction_condition: Comparable release evaluations show no higher hallucination rate against the relevant predecessors, or corrected results invalidate the reported increases.
measurement_requirements: Compare the same tasks and hallucination metric. Distinguish hallucination rate from overall accuracy and from errors per individual factual assertion.
source_requirements: Original release evaluations or independently reproducible comparisons of the named models.
