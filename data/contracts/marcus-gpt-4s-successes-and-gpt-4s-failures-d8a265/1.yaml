  - still wouldn’t be able to use it reliably
  - guide robots or scientific discovery
evaluator_interpretation:
  - Still describes the original model at publication, rather than forecasting that later systems will never work.
  - Shaky alignment means meaningful failures to follow intended behavioral constraints.
  - Reliable guidance means repeatable, dependable performance on relevant robotic or scientific workflows. A successful demonstration alone does not establish reliability.
  - The wording does not specify whether GPT-4 acts alone, with tools, or under human supervision; no single configuration is silently assumed.
  - The launch-to-post interval is the latest publicly documented snapshot of this ongoing state.
support_condition: Launch-model evidence establishes remaining alignment failures and inadequate reliability on relevant robot-control and scientific-discovery workflows.
contradiction_condition: Representative evaluations establish dependable guidance of the relevant workflows by the original GPT-4, or establish that the alleged alignment failures were resolved.
measurement_requirements: Identify the model version, workflow, tools, supervision, success and failure rates, and consequences of errors. General chatbot mistakes alone cannot establish failure in both application domains.
source_requirements: Original alignment tests and direct robotics or scientific-workflow evaluations attributable to the launch-period model.
