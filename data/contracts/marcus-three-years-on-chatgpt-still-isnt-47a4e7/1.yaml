evaluator_interpretation:
  - Read 'overtaken' as an apparent lead in measured model capabilities, not commercial success or superiority on every task.
  - Read 'many benchmarks' as several established evaluations spanning different capabilities.
  - Use November 1–29, 2025, following the surrounding discussion of November.
  - Read GPT-5 as the model generation, including the contemporaneous GPT-5.1 comparator. The evidence does not establish every possible comparison with the original GPT-5 configurations.
support_condition: November results show Gemini 3 leading the contemporaneous GPT-5 generation across several established benchmarks and a broad capability comparison.
contradiction_condition: Comparable November results show no broad Gemini 3 lead and advantages confined to isolated benchmarks.
measurement_requirements: Identify model versions, evaluation dates, benchmark coverage, and material differences in reasoning or tool settings. Distinguish independent testing from vendor claims.
source_requirements: Dated November benchmark results, preferably from independent evaluators, with company reports used as corroboration.
