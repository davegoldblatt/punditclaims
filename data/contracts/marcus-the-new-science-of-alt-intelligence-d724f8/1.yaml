  - Uncomprehending describes the observable mismatch between request and output; it does not establish an internal mental state.
  - Pretty prone supplies no numerical failure threshold and is assessed as a recurring failure mode.
  - For this ongoing observation, I use the latest public evaluation cycle, April 1 through May 14, 2022, surrounding the original model's introduction.
support_condition: Original-model evaluations document recurring compositional or attribute-binding failures, including the cube example or an equivalent test.
contradiction_condition: Representative original-model tests establish that these failures are rare and show that the cited example was misidentified or did not reflect the model's behavior.
measurement_requirements: Evidence must concern the original DALL-E 2 and distinguish a recurring class of errors from a single unexplained sample. No numerical failure rate is inferred.
