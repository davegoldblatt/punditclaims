explicit_source_elements:
  - more than 75%
  - its capacity is taken up by Anthropic
  - As of the end of Q4 2025
  - 1.67GW of capacity
evaluator_interpretation:
  - Read capacity as Amazon's operational AI accelerator capacity, including Trainium, because the supporting example is Project Rainier.
  - Use year-end 2025, the explicit date attached to the capacity denominator. The present-tense wording could alternatively refer to publication.
  - Treat the statement as an estimate of an actual allocation share. Confidence in an assumption is not itself evidence of that share.
support_condition: Comparable records establish that Anthropic occupied more than 75% of Amazon's operational AI accelerator capacity at the stated date.
contradiction_condition: Comparable records establish that Anthropic occupied 75% or less of that capacity.
measurement_requirements: A dated numerator and denominator using the same capacity measure, hardware coverage and treatment of operational, reserved and future capacity. Chip counts cannot be divided by gigawatts without a justified conversion.
source_requirements: Amazon allocation records, customer disclosures or independently substantiated estimates covering both Anthropic's allocation and Amazon's total AI capacity.
