explicit_source_elements:
  - OpenAI spent $8.67 billion on inference
  - the first nine months of 2025
  - verified by the Financial Times
  - inference being profitable
evaluator_interpretation:
  - The spending period is January 1 through September 30, 2025, in calendar years.
  - The accounting basis is estimate because the claim relies on press reporting of private records rather than an identified accounting standard.
  - The central numerical assertion requires the reported $8.67 billion amount and matching inference scope, not a rounded total-compute figure.
  - The profitability implication requires comparable revenue and costs for the same period and customer scope. Nine-month inference spending cannot simply be compared with annual revenue or annual cost of revenue.
  - The claim that the Financial Times verified the reporting is separate from other publications repeating Zitron's figure.
support_condition: Independent records or genuinely corroborating reporting establish $8.67 billion of OpenAI inference expenditure during January–September 2025. The profitability implication additionally requires matching revenue and a reconciliation of inference expenditure with accounting cost categories.
contradiction_condition: Comparable records establish a materially different nine-month inference amount or show that the reported figure includes other costs. Comparable positive inference economics would contradict the profitability implication without necessarily contradicting the spending figure.
measurement_requirements: Match calendar period, provider coverage, cash versus credits, and paid versus free usage. Separate inference from training and other compute costs, and reconcile expenditure with recognized expenses.
source_requirements: Prefer invoices, financial statements or corroborated internal records. Reporting that merely repeats the speaker is context, not independent verification.
