ambiguity_flags:
  - The ongoing observation names no reporting period; the latest completed quarter is used.
  - Commodity names neither a use-case boundary nor a degree of substitutability.
  - Hard to find gives no numerical prevalence threshold or complete supplier population.
  - The loss figure has no stated source or accounting basis.
  - Every month is read as a monthly run rate, permitting a representative quarterly average.
