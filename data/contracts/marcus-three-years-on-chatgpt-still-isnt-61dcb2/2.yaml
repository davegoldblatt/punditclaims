assessment_axis: historical_observation
explicit_source_elements:
  - large language models have become a commodity
  - LLM profits outside of Nvidia are hard to find
  - OpenAI itself is losing billions every month
evaluator_interpretation:
  - Commodity means that competing LLMs offer sufficiently similar capabilities for ordinary uses that substitution and price competition substantially limit differentiation. It does not require identical models.
  - Profits are hard to find means that demonstrated profits from supplying LLMs are uncommon outside Nvidia. It does not mean that every other supplier loses money. Profits from unrelated businesses do not establish LLM profitability.
  - Losing billions every month describes an ongoing monthly loss rate of at least US$2 billion. A representative quarterly loss divided by three is acceptable; separate verified losses for every month are unnecessary.
  - Use July–September 2025, the latest completed calendar quarter before publication, as the reporting window for the ongoing financial state and contemporaneous market conditions.
  - Read losses as overall company losses. Examine reported net losses and estimates of them, while keeping operating losses and cash burn separate. Marcus specifies neither an accounting standard nor the source of his financial figure; unknown records that omission without imposing a requirement that he name GAAP.
support_condition: Evidence should establish substantial substitution and price competition among LLM suppliers, show that demonstrated LLM profits outside Nvidia were uncommon across a representative set of suppliers, and establish an OpenAI monthly loss rate of at least US$2 billion. A credible quarterly estimate exceeding US$6 billion can support the financial component.
contradiction_condition: Evidence would contradict the relevant component if LLM suppliers generally retained substantial commercially consequential differentiation despite price competition, if LLM profits were widespread outside Nvidia, or if reliable comparable OpenAI results established a monthly loss rate below US$2 billion. One profitable rival or one differentiated model is insufficient to refute the broader market statements.
measurement_requirements: Compare capability and actual substitution alongside prices. Assess profits after relevant expenses rather than revenue, gross margin, financing or valuation. For OpenAI, identify the period and loss measure and disclose any assumptions used to infer its losses from an investor's accounts.
source_requirements: Prefer dated provider disclosures, independent evaluations and financial filings. Clearly identify press estimates where direct OpenAI financial statements are unavailable. Evidence published after the post may establish the historical period if available by 2026-10-28.
