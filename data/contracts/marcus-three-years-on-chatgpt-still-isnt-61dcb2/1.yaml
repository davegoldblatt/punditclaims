early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The observation period is unstated; the latest completed reporting quarter is used.
  - Commodity and scarce profits have no numerical definitions.
  - The provider universe and allocation of shared LLM costs are unspecified.
  - OpenAI's accounting basis is unknown.
  - Every month could colloquially mean an average monthly pace, but the wording does not say that.
