assessment_axis: historical_observation
explicit_source_elements:
  - large language models have become a commodity
  - LLM profits outside of Nvidia are hard to find
  - OpenAI itself is losing billions every month
evaluator_interpretation:
  - Commodity means broadly substitutable models facing strong price competition, not literally identical products.
  - Profits means profits attributable to LLM activities after their associated costs; unrelated corporate profits and inference-only margins are insufficient.
  - For OpenAI, the ordinary reading is company-wide net losses of multiple billions of US dollars per month.
  - Every month is stronger than a quarterly monthly average. I do not silently substitute the average.
  - For the ongoing financial observation, I use July–September 2025, the latest completed quarter available for reporting before the post.
  - The supplied words identify no accounting basis or financial source. The contract therefore retains unknown rather than importing a basis from later evidence.
support_condition: Evidence establishes broad model substitutability and price competition, scarce provider-level LLM profits outside Nvidia, and OpenAI net losses of at least two billion US dollars in each month of the target quarter on an identified basis matching the claim.
contradiction_condition: "Comparable evidence materially defeats a component: persistent differentiation inconsistent with broad substitutability, widespread attributable LLM profits, or an OpenAI monthly net loss below the stated magnitude. A monetary verdict also requires resolution of the unknown accounting basis."
measurement_requirements: Model substitution and pricing data; provider-level LLM profits including relevant costs; and OpenAI monthly net-loss figures. Keep equity-investment losses, cash burn, operating losses, and net losses distinct.
source_requirements: Prefer company financial disclosures and direct market measurements. Press reconstructions must retain their assumptions and cannot be promoted to company-reported figures.
metric_scope:
  company: OpenAI
  metric: Company-wide net loss in each calendar month
  currency: USD
  units: billions per month
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2025-07-01
  period_end: 2025-09-30
  stock_or_flow: flow
