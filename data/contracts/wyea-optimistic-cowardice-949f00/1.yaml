assessment_axis: forecast_outcome
explicit_source_elements:
  - SoftBank's ability to raise debt
  - is going to be dictated
  - investor sentiment about the future of AI
evaluator_interpretation:
  - Treat this as a forward-looking causal forecast with no deadline.
  - SoftBank means SoftBank Group, the investment holding company discussed in the surrounding passage.
  - The plain reading is that AI investor sentiment will be a determining constraint on borrowing access, rather than merely one influence on borrowing costs.
  - The claim supplies no debt amount, currency, accounting basis, or numerical sentiment measure.
  - Successful borrowing during favorable AI sentiment would be consistent with the claim but would not establish the asserted causal dependency.
support_condition: A material financing decision and lender evidence establish that AI sentiment determined SoftBank Group's borrowing access after accounting for collateral, liquidity, leverage, and general credit conditions.
contradiction_condition: A material financing episode establishes that borrowing access remained independent of a substantial adverse change in AI sentiment, with lender evidence identifying other sufficient determinants.
measurement_requirements: Dated financing outcomes, contemporaneous evidence of AI sentiment, and lender explanations that distinguish sentiment from collateral values, creditworthiness, interest rates, and wider market conditions.
source_requirements: Lender disclosures, financing agreements, offering results, and independent credit analysis. Management's explanation alone cannot establish the causal relationship.
