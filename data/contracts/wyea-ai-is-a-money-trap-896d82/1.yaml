explicit_source_elements:
  - No company
  - stakes their entire product on generative AI
  - appears to be able to make money
evaluator_interpretation:
  - The ordinary reading is company-wide profitability, rather than merely earning revenue or a positive gross margin.
  - The relevant population consists of businesses whose core product depends on generative AI. Diversified technology companies and infrastructure suppliers do not qualify.
  - For this ongoing observation, use April–June 2025, the latest completed calendar quarter that could have been reported before publication.
  - The claim supplies no accounting basis. Its nearby examples do not establish a common basis for the industry-wide assertion.
support_condition: Comparable financial evidence establishes that the qualifying companies were unprofitable during the target period, with sufficiently comprehensive coverage to support the universal claim.
contradiction_condition: At least one qualifying company demonstrably earned company-wide profit during the target period on a financial basis matching the claim.
measurement_requirements: Distinguish company-wide profit from revenue, gross profit, adjusted operating profit, and cash flow. An unspecified accounting basis prevents a supported or contradicted money-claim verdict under the supplied rules.
source_requirements: Prefer company financial disclosures. Clearly attributed financial reporting is acceptable, with its basis and limitations recorded.
