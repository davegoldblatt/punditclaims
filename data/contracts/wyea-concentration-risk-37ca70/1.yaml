evaluator_interpretation:
  - Read this as the outstanding value of compute agreements as of September 8, 2026, representing potential future supplier revenue, rather than revenue already earned.
  - The counterparty list is illustrative, not exhaustive.
  - Count direct obligations once. Do not add suppliers' downstream purchases or count projected spending again alongside contracts already included in that projection.
  - The surrounding attribution to press reporting implies an estimated contract-value basis.
  - Use the post date as the target snapshot. Earlier spending projections and later contract totals are context unless explicitly reconciled to that snapshot.
support_condition: A dated, nonduplicative reconciliation establishes more than USD 1.3 trillion in combined compute commitments outstanding on September 8, 2026.
contradiction_condition: A sufficiently complete reconciliation establishes combined commitments of USD 1.3 trillion or less on that date. An incomplete subtotal below the threshold is insufficient.
measurement_requirements: Separate signed obligations, optional capacity, projected expenditure, financing, and recognized revenue. Establish contract dates, cancellation terms, remaining amounts, and overlap.
source_requirements: Prefer contracts and filings. Document-based reporting may establish undisclosed values, with its uncertainty retained.
