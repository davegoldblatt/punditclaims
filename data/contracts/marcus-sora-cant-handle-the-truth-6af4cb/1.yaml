  - 3 kings
  - a 7x7 rather than nearly universal 8x8 chess board
evaluator_interpretation:
  - In context, the plain reading concerns basic correctness in visual depictions of standard chess, rather than playing strength or an assertion that every chess output fails.
  - A verified failure to depict elementary board structure supports this limited reading. It cannot establish a numerical failure rate or total absence of chess knowledge.
  - The target is the original model's publicly demonstrated behavior during February 15–17, 2024, not later Sora versions.
support_condition: Authenticated launch-era output, or credible independent examination of it, shows a basic violation of standard chess structure in response to an ordinary chess prompt.
contradiction_condition: Independent examination finds the cited depiction structurally valid, and representative tests of the same model show dependable adherence to elementary chess structure.
measurement_requirements: Check board dimensions and identifiable pieces in the original output. Separate rendering correctness from strategic chess ability.
source_requirements: Prefer the original output and an independent inspection. A named expert's reported inspection can corroborate the example, with the reporting limitation disclosed.
