evaluator_interpretation:
  - Then refers to the 1990s, as the immediately preceding sentence states.
  - The plain reading is that extrapolation difficulties were documented in the 1990s and remained present in contemporary systems. It does not assert that performance never improved.
  - For the current endpoint, I use 2024 through publication, the latest research period before the post.
  - The target interval encompasses the two comparison periods; evidence is required at both endpoints, not in every intervening year.
support_condition: Independent research documents failures beyond training examples in the 1990s and recurring generalization or robustness failures in models evaluated during 2024 before the post.
contradiction_condition: The historical examples do not actually show extrapolation difficulties, or comprehensive contemporary evidence establishes that the relevant weakness had been eliminated by the post.
measurement_requirements: Identify the models, tasks, and departure from training conditions in each era. Comparable numerical failure rates across eras are unnecessary for this persistence claim.
source_requirements: Primary research from both periods, excluding Marcus's own papers as independent confirmation of his claim.
