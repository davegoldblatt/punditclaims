explicit_source_elements:
  - about 19 hours of extra work per engineer
  - looking at extra code written by LLMs
  - reviewer load increased by 29,000 hours each month
  - 1,500 or so engineers
evaluator_interpretation:
  - The claim describes an average across the relevant engineers, not an identical increase for every engineer.
  - Extra work means additional active human review time attributable to LLM-generated code, rather than elapsed pull-request time.
  - Use April 2026, the latest complete month before publication and the latest completed month named in the surrounding operational discussion. The deck's measurement month is not supplied.
  - About 19 means an average reasonably rounding to 19 hours per engineer per month.
support_condition: Authenticated workload measurements and matching engineering headcount establish approximately 19 additional monthly human review hours per engineer attributable to LLM-generated code.
contradiction_condition: Authenticated measurements show a materially different average, or establish that the numerator measures elapsed time, total review time or work not attributable to extra LLM-generated code.
measurement_requirements: The deck's dates, baseline, definition of reviewer hours, measurement method, LLM attribution and same-population headcount.
source_requirements: The authenticated underlying deck or workload data, company confirmation, or independent reporting that verifies those records.
