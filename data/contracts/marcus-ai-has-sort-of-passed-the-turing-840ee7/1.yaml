  - follow 4 seasons of Succession
  - explain who is lying to whom and to what end in real time
evaluator_interpretation:
  - Read as a tentative but testable assessment of capabilities available when the post appeared, not a forecast or conditional claim.
  - The plain reading of 'take in' in this comprehension-challenge context is understanding a complete episode sufficiently to answer substantive questions, rather than merely accepting its video file.
  - Use April 2, 2025 as the capability snapshot because 'as yet' refers to the post date. There is no natural quarterly reporting period for this observation.
  - Read 'often hallucinate heavily' as recurring, substantial invented details that impair comprehension. The speaker supplies no numerical frequency or accuracy threshold.
  - Read 'in real time' as tracking deception and motives as the story unfolds, without using later plot information.
  - The surrounding discussion calls for evaluating understanding from viewing, with safeguards against answers reproduced from prior exposure or online reviews.
support_condition: Reproducible evaluations of the systems available at the post date show limited correct comprehension, recurring substantial fabrications on complete Simpsons episodes, and failure to track deception and motives across all four Succession seasons as viewing proceeds.
contradiction_condition: Reproducible evaluations show that a system available at the post date reliably comprehends complete Simpsons episodes without recurring substantial fabrications, or successfully tracks who deceives whom and why across all four Succession seasons as viewing proceeds. Success on only one component would contradict that component, not automatically settle the others.
measurement_requirements: Identify exact model versions, input modalities, prompts, sampling settings and any external memory or tools. Use complete audiovisual episodes, independently scored questions about events and motives, repeated trials, and separately measured fabricated details. The Succession test also needs timestamps and response latency. Control for prior knowledge and access to reviews; do not equate multiple-choice errors with spontaneous hallucination rates.
source_requirements: Prefer independent evaluations with accessible methods, questions and outputs. Company demonstrations can establish particular capabilities but cannot alone establish reliable performance on the full challenge. Later publications qualify only if they document the relevant historical model versions.
