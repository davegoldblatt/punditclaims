explicit_source_elements:
  - currently lacks the liquidity
  - further loans will be contingent on its contracts
  - contracts, which are contingent on CoreWeave's ability to aggressively expand
evaluator_interpretation:
  - The plain reading is that existing available funding cannot cover the expansion needed to serve the OpenAI agreement without additional financing.
  - Liquidity includes unrestricted cash and available committed borrowing facilities, subject to draw conditions. Restricted cash is not automatically available.
  - Use fiscal 2024, the latest completed reporting period publicly reportable before the post, for the liquidity benchmark. Subsequent contract announcements provide context but cannot establish that year-end funding position.
  - The surrounding discussion relies on press-reported liquidity and spending estimates. It does not specify a GAAP liquidity measure.
  - Contract-backed borrowing need not mean expansion must be completed before lenders can advance construction funding.
support_condition: A dated funding schedule shows that available liquidity falls short of the required expansion spending, and applicable lending and customer agreements establish both claimed dependencies.
contradiction_condition: Comparable records show sufficient available funding for the required expansion, or show that the relevant borrowing or customer obligations do not have the claimed dependencies.
measurement_requirements: Compare unrestricted liquidity and drawable commitments with the timing of required expansion payments, other cash obligations, and customer prepayments. Distinguish a facility's total size from its undrawn availability.
source_requirements: Financial statements, borrowing agreements, customer agreements, and contemporaneous expansion budgets; independently reported estimates where the underlying documents are unavailable.
