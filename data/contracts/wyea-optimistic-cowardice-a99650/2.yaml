assessment_axis: historical_observation
explicit_source_elements:
  - To service the revenue that OpenAI will bring, CoreWeave is required to aggressively expand
  - It currently lacks the liquidity to do so
  - further loans will be contingent on its contracts
  - which are contingent on CoreWeave's ability to aggressively expand
evaluator_interpretation:
  - "'Lacks the liquidity to do so': CoreWeave did not have the cash or committed financing on hand to fund the expansion needed for the OpenAI contract, so that expansion depended on new borrowing. It does not mean CoreWeave could not pay its existing bills."
  - "'Further loans will be contingent on its contracts': new loans to fund the build were tied to, or secured by, specific customer contracts such as OpenAI's."
  - "'Contracts contingent on ability to expand': customer payments depend on CoreWeave delivering the promised capacity, and customers can cut commitments if it fails."
  - "Target period: March 2025 ('currently', the post date) through 24 March 2026. The claim speaks of further loans to come, and his context frames the situation over 'the next year'. Evidence about the March 2025 OpenAI agreement and the loans that followed falls in this window."
support_condition: CoreWeave disclosures show that the OpenAI expansion was to be funded by new debt not yet in place in March 2025, that such debt was tied to the OpenAI contract, and that OpenAI's payments depend on CoreWeave delivering capacity.
contradiction_condition: CoreWeave already had cash or committed financing to fund the OpenAI expansion in March 2025; or its new loans were not tied to customer contracts; or its customer commitments did not depend on delivery.
measurement_requirements: CoreWeave's disclosed terms of the March 2025 OpenAI agreement, how the related build was financed, its liquidity statement, and how its delayed-draw loans relate to customer contracts.
source_requirements: CoreWeave SEC filings and company press releases.
