explicit_source_elements:
  - We know how to build machines that do math
  - we don’t know how to build machines that can read tax codes
  - replacement
evaluator_interpretation:
  - In context, read tax codes means interpret and apply tax law reliably enough to perform an accountant's tax-judgment work, including deductibility decisions.
  - It does not mean displaying text, recognizing characters, finding passages or executing rules already translated by people.
  - The reference to replacement does not require automation of unrelated accounting duties.
  - I use the current-year reporting window through publication for this ongoing capability claim, rather than a later model's capabilities.
support_condition: Evidence covering the contemporary state of the field establishes that available systems lacked reliable autonomous interpretation and application of tax law at the stated replacement standard.
contradiction_condition: A system available by the post date demonstrates reliable autonomous tax-law interpretation and application across representative accountant judgment tasks, without case-by-case human translation of the governing rules.
measurement_requirements: Evaluate unfamiliar cases, interacting provisions, exceptions and error rates. Distinguish arithmetic, narrow benchmark success and human-authored rule execution from autonomous legal interpretation.
source_requirements: Primary evaluations, documented deployments or a sufficiently comprehensive contemporary capability assessment.
