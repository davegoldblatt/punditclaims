assessment_axis: historical_observation
explicit_source_elements:
  - Some people shift their goalposts
  - others try to duck specifying goalposts altogether
  - Altman’s most recent blog post
evaluator_interpretation:
  - Read in context, the claim concerns the named AGI discussions, rather than every statement Altman or every AI researcher has made.
  - Shifting goalposts requires evidence that the same actor materially changed an earlier criterion. Disagreement between different authors is insufficient.
  - The observable part of ducking goalposts is discussing AGI without stating criteria in the referenced essay. Omission alone does not establish deliberate evasion.
  - The target period covers the February 2023 definition explicitly discussed in the post through its January 2025 publication.
support_condition: The referenced essay discusses AGI without specifying criteria, and dated statements establish a material change in a named actor's previously stated criteria.
contradiction_condition: The referenced essay supplies an applicable definition, and the alleged changes are shown to preserve the same criteria or concern distinct purposes rather than a changed standard.
measurement_requirements: Read the complete referenced essays and compare dated statements by the same actors. Separate public definitions, contractual triggers, and motives.
source_requirements: Original essays and dated institutional documents; reporting on private contracts can provide qualified context when the contract itself is unavailable.
