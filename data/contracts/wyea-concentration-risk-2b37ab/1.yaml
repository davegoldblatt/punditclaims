explicit_source_elements:
  - OpenAI, in 2025
  - $34 billion in operating expenses
  - $13.07 billion in revenue
  - In Q2 2026
  - operating margin worsened to negative 183%
evaluator_interpretation:
  - "The claim contains three financial observations: 2025 operating expenses, 2025 realized revenue and Q2 2026 operating margin."
  - The target-period envelope covers 2025 and Q2 2026; each component must be checked only against its own stated period.
  - Operating margin means operating income divided by realized revenue, not net income or cash burn.
  - "'Worsened' can be tested against the preceding quarter and the stated 2025 baseline."
  - The figures are treated as press-reported estimates, without assuming GAAP or another unstated accounting standard.
  - "'Operating expenses' may mean all operating costs, including cost of revenue, or the narrower expense category excluding it. I do not silently equate these."
  - Rounded financial inputs can substantiate an approximate margin but may not establish the exact stated whole-percentage figure.
support_condition: Matching financial records establish the stated 2025 revenue and operating-expense figures and a Q2 2026 operating margin consistent with negative 183% at the reported precision, with deterioration on a consistent basis.
contradiction_condition: Comparable records establish materially different annual figures or a Q2 margin inconsistent with the stated value and deterioration. A different expense classification or insufficient input precision alone is not a contradiction.
measurement_requirements: 2025 realized revenue and operating-expense breakdown, including treatment of cost of revenue; Q2 2026 operating income and revenue; comparable baseline margins; stated rounding and accounting basis.
source_requirements: Prefer financial statements. Otherwise use independently corroborated financial reporting, identifying reliance on leaked documents and distinguishing it from repetition of Zitron's own claims.
