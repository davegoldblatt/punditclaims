assessment_axis: historical_observation
explicit_source_elements:
  - generative AI doesn't really automate many tasks
evaluator_interpretation:
  - Assess the task-automation proposition, not the surrounding allegation about advocates' intentions.
  - The plain reading is that generative AI completes only a limited range of work tasks without people performing or repairing substantial parts of them.
  - Task automation is distinct from assistance, adoption, and replacement of whole jobs. High volume on one task does not establish a broad range of automated tasks.
  - Use April–June 2024, the latest completed quarter before publication, for this ongoing-state observation.
support_condition: Representative deployment evidence for the target period shows that reliable, end-to-end automation remained confined to a limited range of work tasks.
contradiction_condition: Representative evidence for the target period establishes reliable, end-to-end automation across a broad range of work tasks.
measurement_requirements: Measure task variety, successful completion, human intervention, and deployment coverage. Adoption and productivity gains alone are insufficient.
source_requirements: Prefer deployment records and independent evaluations with disclosed methods. Separate company claims from independently verified results.
