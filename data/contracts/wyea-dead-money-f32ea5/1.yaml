explicit_source_elements:
  - outside of those two companies
  - I estimate
  - roughly $22 billion
  - demand for AI compute
evaluator_interpretation:
  - The two excluded companies are Anthropic and OpenAI. The broader post describes the estimate as global.
  - The plain reading is current dollar demand for AI computing services from other buyers.
  - For the ongoing observation, use April–June 2026, the latest completed calendar quarter before the September 29 post that public reporting could cover.
  - Provisionally read the dollar amount as an annual spending pace observed during that quarter, not $22 billion spent within the quarter. The speaker does not specify annualization.
  - Demand must be separated from infrastructure investment, financing, capacity announcements and supplier revenue that includes sales ultimately serving the excluded labs.
  - "'Roughly' allows estimation uncertainty, but supplies no exact tolerance."
support_condition: An independently documented estimate for the same market and observation period places annual demand excluding Anthropic and OpenAI near $22 billion, with a transparent definition and uncertainty range.
contradiction_condition: A comparable estimate or defensible bound places that demand materially outside any ordinary reading of roughly $22 billion, after removing the excluded labs and avoiding double counting.
measurement_requirements: Define compute services, annualization, geography, treatment of self-operated compute and intermediary purchases. Reconcile buyer spending with provider receipts and remove Anthropic and OpenAI consistently.
source_requirements: A documented market estimate or reconciled company spending records covering the relevant buyers and period. Broad capital-expenditure totals alone are insufficient.
