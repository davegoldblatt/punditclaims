assessment_axis: forecast_outcome
explicit_source_elements:
  - In the coming months
  - (if not days)
  - Nvidia and the Neoclouds
  - will get hit hard
evaluator_interpretation:
  - In this stock-market context, the plain reading is substantial further share-price declines for Nvidia and publicly traded neocloud companies broadly.
  - CoreWeave and Nebius are examples for examining the sector, not an exhaustive basket supplied by the speaker.
  - Losses must occur after publication; earlier peak-to-date losses cannot satisfy the forecast.
  - Hit hard means a clearly large decline beyond ordinary daily fluctuation. The speaker supplied no numerical threshold, so borderline results remain unresolved.
  - Coming months supplies a near-term horizon but no defensible final calendar day. The horizon end is left null rather than inventing a deadline.
support_condition: After publication and within the coming months, dated prices show clearly substantial further declines in Nvidia and broadly across a representative set of publicly traded neocloud companies.
contradiction_condition: After a justified interpretation of the coming-months horizon has elapsed, complete price records show that Nvidia or the neocloud sector broadly did not suffer the predicted substantial decline.
measurement_requirements: Timestamped publication and baseline prices, split-adjusted subsequent price histories, and a disclosed representative neocloud basket. Distinguish post-publication returns from pre-existing drawdowns.
source_requirements: Prefer exchange price histories or reliable independently reported prices. Contemporaneous news can provide context but must establish timing before settling the forecast.
metric_scope: null
original_horizon: In the coming months (if not days)
horizon_interval:
  start: 2026-11-20
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A clearly substantial post-publication decline in both Nvidia and the neocloud sector broadly can establish support before the coming months elapse. It requires a verified publication-time baseline and dated subsequent prices; earlier losses and a single company's fall are insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Hit hard has no numerical threshold.
  - Neocloud constituents and weighting are unspecified.
  - Coming months has no exact final date.
  - The publication time within November 20 is not established.
retrospective_or_prospective: retrospective
