assessment_axis: historical_observation
explicit_source_elements:
  - "[Software company] is still growing"
  - AI is not actually driving much revenue at all!
evaluator_interpretation:
  - The context concerns established software vendors. The ordinary reading is that AI contributes little to their revenue and growth, rather than literally generating no revenue.
  - Use the latest completed fiscal quarters publicly reportable before March 17, 2026. The target window accommodates different fiscal calendars; it is not one combined reporting period.
  - Recognized revenue attributable to AI is the relevant measure. ARR, annual contract value, bookings and usage are distinct measures.
  - Neither a numerical meaning of 'much' nor an accounting basis is supplied.
support_condition: Comparable disclosures across a representative set of established software companies show that AI contributes only a small share of recognized revenue and revenue growth.
contradiction_condition: Comparable disclosures show that AI already contributes a substantial share of recognized revenue or growth across that population.
measurement_requirements: Identify AI revenue separately, match it to total revenue for the same company and period, and distinguish incremental revenue from revenue merely associated with AI-enabled products.
source_requirements: Prefer company filings and earnings disclosures. Marketing statements, usage figures and ARR alone cannot establish the claimed contribution to recognized revenue.
metric_scope:
  company: Established software companies
  metric: Revenue attributable to AI relative to total revenue and revenue growth
  currency: null
  units: share of revenue
  accounting_basis: unknown
  fiscal_or_calendar: fiscal
