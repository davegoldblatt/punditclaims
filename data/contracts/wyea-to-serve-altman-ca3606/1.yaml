explicit_source_elements:
  - OpenAI, in its current form
  - cannot survive
  - longer than a few more years
  - without a stunning confluence of technological breakthroughs and financial wizardry
evaluator_interpretation:
  - The forecast concerns continued operation of the business, not preservation of every legal entity or contract.
  - Provisionally read 'a few more years' as three to five years and use the latest endpoint, July 29, 2029. This bound is an evaluator interpretation, not an explicit deadline.
  - The nearby two-year statement is a separate formulation of necessary changes; it does not unambiguously replace this claim's 'few more years'.
  - The antecedent is continued operation in materially the same form without the exceptional combination described. Both its technical and financial components require assessment.
  - Because the antecedent is not established, apply the conditional-forecast rule and withhold scoring, even though the provisional horizon is also not due.
support_condition: The antecedent is established and OpenAI permanently ceases operating by the interpreted deadline, with the relevant absence of exceptional changes documented.
contradiction_condition: The antecedent is established and OpenAI continues operating beyond the interpreted deadline without the asserted combination of exceptional technical and financial changes.
measurement_requirements: Track business continuity, changes in corporate and financing arrangements, financing actually committed or received, and measured technical advances. Do not equate lower customer prices with lower production costs or financing commitments with cash receipts.
source_requirements: Dated corporate records and financing disclosures, corroborated operating-status evidence, and independently assessable technical measurements.
