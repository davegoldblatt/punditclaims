assessment_axis: causal_assessment
explicit_source_elements:
  - If you know the answers ahead of time
  - a pre-written “correct” answer
  - you absolutely have to
  - you can optimize the model to answer these questions correctly
  - There’s no accusation that OpenAI — or any other vendor — has done this
evaluator_interpretation:
  - "Although supplied as an observation, the sentence asserts a causal possibility: access to fixed test answers enables optimization that improves performance on those questions."
  - The plain reading is about answer-key-aware evaluation and development, not a claim that every model trainer must receive the key before training.
  - The evaluator needs reference answers for this scoring procedure; the evaluated model need not have seen them.
  - This is a methodological claim already applicable when posted, not a conditional forecast or an allegation of vendor misconduct.
support_condition: Benchmark documentation establishes fixed reference answers, and a controlled experiment or transparent construction shows that training on known test questions and answers can raise correctness on those tests.
contradiction_condition: The relevant scoring procedure does not use fixed reference answers, or evidence establishes that the proposed access and optimization cannot improve correctness on the fixed questions.
measurement_requirements: Identify what information is exposed, the training or tuning intervention, and before-and-after performance on the same benchmark. Do not equate higher test scores with broader capability gains.
source_requirements: Primary benchmark documentation and experimental research. Evidence of actual vendor cheating is neither required nor inferred.
