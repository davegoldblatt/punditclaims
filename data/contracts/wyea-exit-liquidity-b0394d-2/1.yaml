assessment_axis: historical_observation
explicit_source_elements:
  - Meta’s $97.5 billion at-the-market stock dump
  - little or no AI strategy
  - dilutes its shareholders
  - cons retail
  - brief yet collapsing growth of its Muse assistant
evaluator_interpretation:
  - Assess the current financing announcement and usage updates during October 2026 through the post date. This is a current transaction and product-adoption claim, rather than a quarterly earnings claim.
  - The wider post attributes the financing plans to Meta's announcement, so company_reported is the appropriate basis.
  - Read collapsing growth as a sharp slowdown in additions to active users, not necessarily a decline in the number of users.
  - Distinguish planned fundraising, completed issuance, and subsequent dilution. Calling the whole financing package an at-the-market offering is a checkable characterization.
  - Read cons retail as alleging materially misleading financing disclosures. Disagreement with an investment strategy alone does not establish deception.
support_condition: Offering records establish a $97.5 billion ATM program and the claimed dilution; comparable usage measurements establish sharply slowing Muse growth; disclosures and corroborating records establish materially misleading representations about a substantively undeveloped AI strategy.
contradiction_condition: Authoritative offering records establish a materially different ATM amount or transaction status. Comparable usage measurements showing sustained growth acceleration would contradict the usage component. Substantive strategy and disclosure records can rebut specific factual allegations, without proving future commercial success.
measurement_requirements: Separate gross offering capacity from proceeds received and shares issued. Compare the same active-user measure over successive intervals; downloads and cumulative registrations are not substitutes for active-user growth.
source_requirements: Meta offering documents and announcements; comparable usage measurements with methodology; specific disclosures and corroboration for any allegation of deception.
