explicit_source_elements:
  - And it’s on
  - LLM-driven enshittification of the internet
  - Since then I’ve been collecting examples
evaluator_interpretation:
  - The ordinary reading is that LLM-generated junk and misinformation were already degrading parts of the internet. It does not require every website, or the internet on average, to have deteriorated.
  - The surrounding account explicitly looks back to February 12 and describes examples collected since then. The target period therefore runs from February 12 through the post date, August 16, 2023.
  - Degradation means publicly available material with substantive falsehoods, unedited generation artifacts, or substantial quality defects. AI authorship alone does not count.
support_condition: Dated investigations document an emerging pattern of publicly available LLM-generated material with substantive falsehoods or substantial quality defects during the target period.
contradiction_condition: Reliable investigations establish that the alleged pattern rested on material that was not LLM-generated or did not have the claimed defects.
measurement_requirements: Identify actual published material and the basis for attributing it to language models. Distinguish discovered sites from measured growth in total production.
source_requirements: Prefer original investigations with examples and stated methods. The speaker's own examples and assertions are not independent confirmation.
