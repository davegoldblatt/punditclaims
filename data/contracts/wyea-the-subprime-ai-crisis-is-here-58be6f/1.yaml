explicit_source_elements:
  - Both companies lose billions of dollars
  - both companies have no path to profitability
  - both to consumers and businesses
  - do not work when users are forced to pay something approaching a sustainable cost
evaluator_interpretation:
  - The companies are Anthropic and OpenAI. Each must satisfy the financial assertion separately.
  - For ongoing annual losses, I use calendar 2025, the latest completed year before publication. The commercial-viability assertions describe the position on March 31, 2026. The target interval accommodates these two components.
  - I read billions as at least $2 billion per company, and losses as company-wide net losses. The speaker does not identify an accounting basis, so the contract records it as unknown.
  - The ordinary reading of sustainable cost is pricing that covers delivering the service and maintaining the business, including recurring development and overhead.
  - Products do not work at that price means customers cannot obtain commercially useful service at a price sufficient to sustain the supplier. It does not mean that every individual output is technically defective.
  - No path to profitability means no credible commercial route existed at publication. Current losses alone cannot establish that stronger assertion.
support_condition: Comparable annual results establish multibillion-dollar losses at each company, and credible cost, pricing, retention, and operating evidence establishes the asserted lack of a viable business model for both.
contradiction_condition: Comparable results refute the loss assertion for either company, or evidence applicable at publication establishes a credible profitable business model or commercially useful service with retained demand at fully cost-covering prices.
measurement_requirements: Separate net losses from operating losses and cash burn. For viability, connect actual prices and customer behavior to fully allocated recurring costs. An accounting basis must be identified before a definitive monetary verdict.
source_requirements: Prefer financial statements and documented customer economics. Independently verified reporting may substitute where company statements are unavailable. Company forecasts alone do not establish viability.
