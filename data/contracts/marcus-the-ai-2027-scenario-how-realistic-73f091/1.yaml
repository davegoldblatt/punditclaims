  - having outside groups with science fiction chops writing stuff like this distracts away from those flaws
  - gives more power to the very companies trying hardest to race towards AGI
evaluator_interpretation:
  - "The plain reading combines a criticism of the companies' AGI arguments with a causal assertion: outside scenarios reduce scrutiny of substantive weaknesses and increase the companies' influence."
  - Greatly flawed is evaluative; its factual component requires identifying specific unsupported premises or invalid inferences.
  - More power means increased influence over investors, public opinion, or policy. No particular monetary amount is asserted.
  - The effect is assessed as an ongoing state on the post date.
support_condition: Evidence identifies substantial weaknesses in the relevant company narratives and shows that outside scenarios caused less scrutiny of those weaknesses and greater company influence.
contradiction_condition: Evidence directly undermines the alleged substantive weaknesses or shows that outside scenarios increased scrutiny and reduced, rather than increased, company influence.
measurement_requirements: Specify the company statements and alleged flaws, then measure audience attention and company influence with a credible comparison or documented causal chain.
source_requirements: Independent technical analyses, audience studies, and investor or policy decision records. The scenario authors' stated intentions cannot establish actual audience effects.
