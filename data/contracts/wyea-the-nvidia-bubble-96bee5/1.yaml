explicit_source_elements:
  - was and is
  - a flagrant, well-documented campaign of export control violations
  - NVIDIA is absolutely involved in illegal smuggling of GPUs to China
evaluator_interpretation:
  - The factual assertion concerns NVIDIA's own knowing participation or assistance in prohibited exports. Diversion of NVIDIA products by other parties alone does not establish it.
  - The claim is retrospective and ongoing through November 17, 2026. It gives no beginning date for the alleged conduct; the dates of cited reports are not treated as the dates the conduct began.
  - The superlatives and criticism of press coverage are not separately graded.
  - "A conviction is not essential: authenticated communications, shipment records or other reliable findings could establish participation."
support_condition: Reliable records establish that NVIDIA personnel acting for the company knowingly participated in or enabled prohibited GPU exports to China.
contradiction_condition: Comprehensive investigative findings establish that the alleged NVIDIA participation did not occur and that the relevant diversion schemes operated without it.
measurement_requirements: Identify the prohibited shipments, applicable restrictions, participants, knowledge and corporate connection. Separate allegations, admissions and established findings.
source_requirements: Prefer court records, enforcement findings, authenticated communications and admissions. Investigative reporting must distinguish direct evidence from suspicion or inference.
