explicit_source_elements:
  - every single AI data center SPV
  - is funded by customer payments
  - will only arrive if the data center actually gets completed
evaluator_interpretation:
  - The claim concerns contractual dependence of customer payments on completion, not whether third-party debt and equity initially finance construction.
  - A qualifying counterexample is an AI data-center SPV whose customer owes rent or construction-related payments despite delayed completion or power delivery.
  - Contractual payment obligations are assessed; actual future payment receipt or customer default is not forecast.
  - Use April 1 through June 30, 2026, the latest completed calendar quarter publicly reportable before the post, for this undated ongoing observation.
  - This is a claim about payment conditions, without a monetary amount or accounting measure; metric_scope is therefore null.
support_condition: Comprehensive financing and customer-contract evidence establishes that every in-scope SPV's customer payments require completion.
contradiction_condition: At least one in-scope SPV has enforceable customer-payment obligations that can commence despite incomplete delivery, including prepayments, fixed-date rent or qualifying delay payments.
measurement_requirements: Identify the SPV, its AI facility and customer, and the payment-trigger, completion, power-delay and termination provisions. Do not confuse customer payments with sponsor equity or lender advances.
source_requirements: Executed contracts or detailed primary credit analyses describing the relevant contractual provisions. Identify reliance on rating-agency summaries where contracts are unavailable.
