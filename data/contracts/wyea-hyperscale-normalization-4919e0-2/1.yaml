  end: 2028-09-01
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Verified delivery of the contracted compute service at the identified facility before the two-year anniversary conclusively contradicts the minimum-duration prediction. Announced schedules, construction and energization alone do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
