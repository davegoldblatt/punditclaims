assessment_axis: forecast_outcome
explicit_source_elements:
  - this data center
  - won’t actually exist for years
  - if it ever does
evaluator_interpretation:
  - Assess the normalized facility forecast, not the separate assertion about affordability.
  - Read 'exist' as beginning to deliver the contracted compute service, rather than merely having a building or construction site.
  - Use two years as the minimum ordinary meaning of 'for years'. The September 2028 boundary tests that minimum duration; the speaker supplied no exact completion deadline.
  - "'If it ever does' expresses doubt, not a categorical prediction of permanent cancellation."
  - The facility's identity must be established independently from reporting about the Anthropic–Lambda agreement.
support_condition: Reliable records establish that the identified facility did not begin delivering the contracted compute service before the two-year anniversary of publication.
contradiction_condition: Reliable commissioning and customer-service records establish delivery of the contracted compute service before the two-year anniversary.
measurement_requirements: Distinguish construction, energization, data-hall handover, GPU installation and actual compute delivery. Identify the relevant phase and capacity.
source_requirements: Prefer operator disclosures, commissioning records and customer confirmation. Reporting may establish the deal's identity where its parties have not disclosed it.
metric_scope: null
original_horizon: for years
horizon_interval:
