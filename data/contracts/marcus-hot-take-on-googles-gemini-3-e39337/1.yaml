evaluator_interpretation:
  - The plain reading is that Gemini 3 remains substantially unreliable at visual and physical reasoning, despite its benchmark leadership.
  - The subject is the launch version of Gemini 3 Pro. The target period is its November 18 announcement through the November 19 post.
  - A few selected mistakes would establish fallibility, but would not alone establish generally poor performance. Leadership over other models would not alone establish dependable performance.
support_condition: Representative, reproducible evaluations of the launch model show frequent substantive failures in both visual and physical reasoning, particularly on tasks people ordinarily solve reliably.
contradiction_condition: Representative evaluations show consistently dependable performance in both areas, including unfamiliar tasks and appropriate human comparisons.
measurement_requirements: Identify the model version, prompts, tools, sampling settings, task selection, success criteria and human baseline. Separate visual understanding, spatial reasoning and physical reasoning.
source_requirements: Prefer independent evaluations with reproducible tasks and results. Company benchmarks can establish measured capabilities but need appropriate coverage.
