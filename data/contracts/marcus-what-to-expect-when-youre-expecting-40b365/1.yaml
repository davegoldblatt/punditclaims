evaluator_interpretation:
  - This is a compound claim; evidence of hallucination alone cannot establish all its components.
  - The practical reading of understanding is dependable reasoning about physical situations and people's beliefs, intentions, or behavior, rather than consciousness.
  - The target period is the initial public release through the post date, reflecting the contemporary system discussed in the post.
support_condition: Contemporary evidence establishes factual unreliability and fabrication, together with substantial failures of practical physical and psychological reasoning.
contradiction_condition: Contemporary evaluations establish dependable factual accuracy and robust physical and psychological reasoning. Strong contrary evidence on individual components would warrant a component-specific assessment.
measurement_requirements: Separate factuality, physical reasoning, and psychological reasoning tests. Neither isolated failures nor moral disagreement alone establishes absence of understanding.
source_requirements: Primary disclosures and independent evaluations tied to the original ChatGPT and target period. Exclude the speaker's own demonstrations as independent confirmation.
