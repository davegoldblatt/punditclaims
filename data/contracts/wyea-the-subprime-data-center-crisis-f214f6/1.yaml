assessment_axis: forecast_outcome
explicit_source_elements:
  - I think we’ll see a few rescue missions
  - Hyperscalers
  - scooping up capacity anywhere they see it
  - to avoid the perception that AI data centers will go unused
evaluator_interpretation:
  - The ordinary reading predicts multiple hyperscaler deals that rescue otherwise unused or distressed third-party AI capacity.
  - The stated perception-management purpose is part of the claim; an ordinary capacity purchase does not establish it.
  - I think expresses confidence rather than an external condition.
  - Doing everything they can is rhetorical emphasis, not a requirement to purchase every available facility.
  - The allegation of a con is not separately treated as an established fact.
support_condition: Multiple post-publication hyperscaler transactions absorb capacity that otherwise faced non-use or distress, with credible evidence that preventing the appearance of unused AI infrastructure materially motivated the transactions.
contradiction_condition: Conclusive evidence covering the relevant buildout and rescue opportunities establishes conduct incompatible with the predicted rescue pattern. Individual rejected deals alone cannot falsify an indefinite forecast of a few rescues.
measurement_requirements: Identify transactions, prior vacancy or distress, alternative customers and contemporaneous evidence of decision-makers' purpose.
source_requirements: Transaction documents and operator disclosures for the deals; internal records, direct statements or well-sourced independent reporting for distress and motive.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Multiple dated qualifying rescue transactions with credible evidence of the stated motive can settle the forecast early. Ordinary purchases, proposals and isolated cancellations cannot.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Few and rescue missions have no numerical or financial definition.
  - The asserted motive may be difficult to establish publicly.
retrospective_or_prospective: retrospective
