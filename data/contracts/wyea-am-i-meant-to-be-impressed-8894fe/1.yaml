assessment_axis: historical_observation
explicit_source_elements:
  - both of them
  - doing weird things with their annualized revenues
  - no path to profitability
evaluator_interpretation:
  - Both refers to OpenAI and Anthropic.
  - Weird things has no independently measurable definition. The narrow factual reading tested is that reported annualized revenue materially misrepresents the underlying business.
  - No path to profitability is read as an assertion about the financial viability of the businesses and plans existing at publication, not a forecast with an invented deadline.
  - Profitability ordinarily requires revenue to cover the business's costs, including research and development. Positive inference margins alone do not establish it.
  - Use January–March 2026, the latest completed reporting quarter before publication. Later reporting about other periods is context only.
  - No accounting basis is specified for either alleged distortion or profitability.
support_condition: Evidence identifies materially misleading annualization practices at both labs and establishes that neither had a financially viable route to covering its full costs under its then-current business plans.
contradiction_condition: Comparable records rebut the alleged distortions, or a substantiated, financially viable plan demonstrates a route to full-business profitability for at least one lab.
measurement_requirements: Reconcile run rates with underlying monthly revenue, gross-versus-net treatment, credits and revenue shares. Examine costed business plans with training, inference, staffing, depreciation and financing costs.
source_requirements: Revenue policies, underlying financial records and costed plans; attributable reporting may provide context when primary records are unavailable.
