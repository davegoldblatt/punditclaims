  precision: month
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Burns' could mean compute spending or net operating cash burn. These moved in opposite directions from 2024 to 2025."
  - His data is AWS-only. The public data covers all cloud providers.
  - "'Just under two years' is taken as about January 2024 to September 2025; he gives no exact dates."
  - He hedges with 'that I can see' and 'seems capable'.
