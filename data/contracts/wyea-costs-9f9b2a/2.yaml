assessment_axis: historical_observation
explicit_source_elements:
  - '"no period of time that I can see"'
  - "\"just under two years of data I've been party to\""
  - '"any means of — or any success doing — cost-cutting"'
  - '"the only thing this company seems capable of doing is increasing the amount of money it burns on a monthly basis"'
evaluator_interpretation:
  - "Plain reading: during the roughly two years his data covers (about January 2024 to September 2025), Anthropic's compute and infrastructure spending never fell. It kept rising, with no period of cost reduction."
  - His data was Anthropic's AWS bills, which are not public. The closest public measure is the 'compute and infrastructure' cost line in Anthropic's S-1 filing. It covers all cloud providers, not just AWS, and is used as a stand-in.
  - "'Burns' is read as spending, mainly on compute, because that is the data his statement rests on. It is not read as net operating cash flow, which also moves with prepayments and payment timing. Cash-flow evidence is reported as counterevidence."
  - The S-1 gives quarterly figures only from Q1 2025. Data for 2024 is annual only.
  - A falling share of costs to revenue is not cost-cutting under this reading; the test is whether costs themselves fell.
support_condition: Public financial data for about January 2024 to September 2025 shows Anthropic's compute and infrastructure spending rising period after period, with no period of absolute reduction.
contradiction_condition: Public data shows Anthropic's compute and infrastructure spending fell in absolute terms in some period between January 2024 and September 2025, or shows the company reporting deliberate cost reductions that lowered spending in that window.
measurement_requirements: Quarterly or monthly compute and infrastructure spending (or AWS spending) for Anthropic, January 2024 to September 2025.
source_requirements: Anthropic filings (S-1) or company disclosures. Independent reporting only if no filing exists.
metric_scope:
  company: Anthropic
  metric: Compute and infrastructure spending (AWS spending in his data), described as monthly burn
  currency: USD
  units: per month / per period
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2025-09-30
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
