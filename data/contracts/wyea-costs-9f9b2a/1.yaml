evaluator_interpretation:
  - The article identifies its historical dataset as January 2024 through September 2025. That is the target period.
  - The checkable content is the claimed absence of demonstrated cost reductions and the direction of monthly burn, not the speaker's private mental state.
  - The ordinary financial meaning of burn is net cash consumption. Monthly AWS payments are only one component and cannot be substituted for total burn.
  - A documented cost reduction or decline in monthly net cash burn would challenge the categorical wording. A single AWS billing decline does not establish either company-wide result.
  - The source does not specify an accounting basis for monthly burn.
support_condition: Complete, comparable records for the target period show rising monthly net cash burn and no demonstrated cost reductions supporting the claimed absence of cost-cutting success.
contradiction_condition: Matched records show a decline in monthly net cash burn or a demonstrated cost reduction within the target period. A literal claim that AWS spending never fell can separately be tested against the AWS series.
measurement_requirements: Monthly cash receipts and payments on a consistent basis, with prepayments and credits identified, plus records of any asserted cost reductions. Keep AWS payments, total expenses, unit costs, and net cash burn separate.
source_requirements: Authenticated invoices, cash-flow records, or independently verified monthly financial reporting covering January 2024 through September 2025.
