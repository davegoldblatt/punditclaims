evaluator_interpretation:
  - Assess the historical pattern through March 8, 2026. The repeated-behavior wording refers to prior public conduct, not just the latest reporting quarter.
  - "The plain factual reading has two parts: both men repeatedly warn of catastrophic AI risk, and their communications use that risk to justify obtaining resources for faster development."
  - The quoted fundraising speech is Marcus's paraphrase, not an attributed verbatim statement.
  - Hype is an evaluative characterization. The assessment concerns the observable communication pattern without presuming dishonesty or private motives.
  - The historical interval has no specified starting date; leave its start open rather than selecting one to fit the evidence.
  - No monetary amount or financial metric is claimed, so metric_scope is null.
support_condition: Dated records establish repeated catastrophic-risk warnings by both men and a clear connection in their communications between those warnings and obtaining resources to accelerate development.
contradiction_condition: Reliable records directly refute the claimed communication pattern or establish that the cited episodes have been materially misrepresented. Safety advocacy or commercial fundraising alone cannot settle the whole claim.
measurement_requirements: Multiple dated statements for each person, read in context, plus communications linking the risk argument to financing or accelerated development. Co-occurrence alone is insufficient to establish that link.
source_requirements: Original statements, transcripts, company announcements, or reliably documented fundraising communications available by the evaluation date and describing conduct no later than March 8, 2026.
