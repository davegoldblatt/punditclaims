assessment_axis: historical_observation
explicit_source_elements:
  - Neither appears to be unable to serve customers
  - other than the lousy uptime of Claude
  - nor do they appear to improve their products
  - based on the availability of compute
evaluator_interpretation:
  - I read 'appears' as a statement about publicly observable evidence, rather than an uncheckable personal impression.
  - Because this describes a current operational state, I use Q2 2026 through the post date, the latest reporting period for which dated operational announcements could be public.
  - Serving customers includes satisfying usage demand; a company need not be completely offline to face capacity constraints.
  - Product improvements ordinarily include higher usable service limits, as well as better model capabilities. Claude outages alone do not count against the claim.
  - A documented counterexample at either company defeats the statement that neither company benefits in these ways.
support_condition: Contemporaneous operational evidence establishes adequate capacity to meet customer demand apart from the excluded Claude outages, and supports the asserted absence of product improvements attributable to available compute at both companies.
contradiction_condition: Dated evidence within the target period documents a capacity-driven service restriction or an actual product improvement attributable to additional compute at either company, beyond Claude uptime alone.
measurement_requirements: Identify a concrete service limit, unavailable service or product change and an explicit connection to compute capacity. General infrastructure announcements alone are insufficient.
source_requirements: Dated company operational disclosures, independently documented service restrictions, or measurements tying a product change to available compute.
