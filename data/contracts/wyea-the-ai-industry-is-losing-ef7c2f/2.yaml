explicit_source_elements:
  - Neither appears to be unable to serve customers
  - other than the lousy uptime of Claude
  - nor do they appear to improve their products based on the availability of compute
evaluator_interpretation:
  - Both parts are hedged with 'appears' and sit inside a rhetorical question ('why do we need these fucking things?'). They give the speaker's impression, not a firm factual assertion.
  - The speaker sets no measure for 'unable to serve customers' or 'improve their products based on the availability of compute', and he exempts Claude's uptime problems. Any test, such as treating usage limits as a failure to serve or limit increases as compute-driven improvement, would be the evaluator's own reading.
  - Under these rules, plain readings apply only to firm claims, so this one is not scored.
support_condition: Not scored. A firm version would be supported by evidence that neither lab turned away customers or delayed or limited products because of compute shortages, and that new compute did not lead to product changes.
contradiction_condition: Not scored. A firm version would be contradicted by statements from OpenAI or Anthropic tying service limits or product improvements to compute availability, beyond Claude's uptime.
