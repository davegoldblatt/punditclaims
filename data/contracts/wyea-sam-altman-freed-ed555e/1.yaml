explicit_source_elements:
  - doesn’t have much of an AI background
  - has never faced the regulatory and legal challenges
  - OpenAI and the wider AI sector
evaluator_interpretation:
  - Assess Shear’s career before his appointment, through the post date. The retrospective word 'never' makes his prior career the relevant period.
  - The ordinary reading is limited professional AI experience and no prior responsibility for substantially comparable legal or regulatory challenges.
  - General technology management experience does not establish substantial AI experience. Conversely, comparable challenges need not have arisen at an AI company.
  - No numerical threshold for 'much' or definition of comparable challenges is supplied.
support_condition: A sufficiently complete career record establishes limited professional AI experience and no prior responsibility for legal or regulatory challenges substantially comparable to those facing AI companies.
contradiction_condition: Records establish substantial professional AI experience or personal responsibility for substantially comparable legal or regulatory challenges before the post.
measurement_requirements: Distinguish professional AI work from general software experience, investment exposure, and public commentary. Establish Shear’s responsibilities rather than attributing every company action to him.
source_requirements: Career records, attributable accounts of his responsibilities, and regulatory or litigation records. A short biography’s omissions cannot establish 'never'.
