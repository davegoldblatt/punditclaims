  - the longer this tech takes to make people money
  - the more money it's going to need to make
evaluator_interpretation:
  - "Read this as a claim about investment payback: delaying returns while investment continues increases the eventual earnings needed to justify that investment."
  - Hold the required return and other business assumptions constant. Continuing expenditure and a positive opportunity cost are implicit in the surrounding investment discussion.
  - This assesses the financial relationship, not whether almost everybody agreed or Goldman Sachs felt anxious.
  - No individual company's financial metric or amount is claimed, so metric_scope is null.
support_condition: Investment analysis and ordinary cash-flow arithmetic show that additional unrecovered spending or a longer wait at a positive required return increases the eventual payoff needed.
contradiction_condition: Under the same spending and required-return assumptions, delaying payback does not increase the eventual payoff required.
measurement_requirements: Distinguish cumulative investment recovery from annual revenue, profit margins and valuation. State assumptions about continued spending and required returns.
source_requirements: Primary investment analysis and established financial methods explaining the mechanism.
