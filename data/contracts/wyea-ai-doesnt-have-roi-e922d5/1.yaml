assessment_axis: forecast_outcome
explicit_source_elements:
  - Once the bubble bursts
  - AI startups won’t get funded
  - AI token budgets won’t get greenlit
  - AI data centers won’t be able to raise debt
evaluator_interpretation:
  - The antecedent is a recognizable broad AI investment bust, not merely one failed company, a regional setback, or a short selloff.
  - No numerical crash threshold is invented because the speaker supplied none.
  - The three predictions are categorical statements about new funding, new budget approvals, and new debt after that bust.
  - Closing a financing committed before the bust would not by itself establish renewed post-bust funding availability.
  - This is a qualitative claim about market access, not a stated financial amount for an identified company.
support_condition: After an independently established AI investment bust, sufficiently comprehensive evidence shows new AI startup financing, token-budget approvals, and AI data-center debt all cease. A finite interruption alone cannot establish an indefinite categorical ban.
contradiction_condition: After the bust is independently established and dated, a verified new AI startup financing, approved token budget, or AI data-center debt commitment contradicts the corresponding categorical prediction.
measurement_requirements: Date the market bust independently, then establish approval or commitment dates and AI purpose for subsequent transactions; distinguish commitments from later disbursements.
source_requirements: Independent market evidence for the antecedent, followed by company disclosures, financing records, or documented customer budget approvals.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A verified new qualifying financing or budget approval after a clearly established bust decisively contradicts the corresponding categorical clause. Pre-bust deals and temporary funding interruptions do not settle the forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Bubble bursts has no stated market, magnitude, duration, or recognition test.
  - No deadline or duration for the predicted funding shutdown is supplied.
  - The wording may be rhetorical generalization, but its ordinary categorical reading is testable.
  - It is unclear whether diversified companies' AI data-center financing is included.
retrospective_or_prospective: retrospective
