evaluator_interpretation:
  - The plain reading is substantially growing negative sentiment and organized opposition, rather than universal rejection of AI.
  - The surrounding US-focused discussion makes American public opinion and opposition central, while evidence from elsewhere tests the breadth of that reading.
  - Because no reporting period is named, use the first half of 2026 through the post date, with earlier observations as trend baselines.
  - "Intensity requires evidence beyond isolated critical comments: worsening comparable polling or organized opposition with observable consequences."
  - For many reasons refers to multiple reported concerns, not a quantified causal claim.
support_condition: Evidence from the target period shows a substantial increase in negative sentiment and organized opposition across more than one concern or constituency.
contradiction_condition: Comparable evidence shows that negative sentiment and organized opposition were broadly stable or diminishing, with only isolated criticism.
measurement_requirements: Use comparable survey questions and identify fieldwork dates, geography and population. Separate concern about AI from opposition to particular data-center projects.
source_requirements: Prefer original pollsters and systematic records of opposition, with contemporaneous reporting for concrete examples.
