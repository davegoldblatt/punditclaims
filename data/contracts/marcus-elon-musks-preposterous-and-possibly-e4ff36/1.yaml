explicit_source_elements:
  - Elon’s timeline predictions
  - notoriously
  - to my mind
  - obviously, bad
  - all too often reported as gospel
evaluator_interpretation:
  - Read the factual core as repeated material failures to meet public deadlines, alongside recurring media treatment of those predictions as dependable facts.
  - The claim describes a cumulative historical record through the post date, not one current reporting quarter. No starting year is supplied.
  - "'To my mind' qualifies Marcus's judgment; it is not a condition that must occur."
  - Do not replace 'often' with a claim that all coverage is credulous, or require every Musk prediction to fail.
  - The two components must be assessed separately; evidence for missed deadlines alone cannot establish the media component.
support_condition: A documented record establishes repeated deadline misses, and a suitably broad analysis of contemporaneous coverage establishes recurring uncritical treatment of those predictions.
contradiction_condition: A sufficiently broad record shows that the alleged pattern of missed deadlines or recurring uncritical coverage is materially inaccurate. Isolated successes or skeptical articles alone do not suffice.
measurement_requirements: A transparent sample of dated predictions with outcomes, plus a defined sample of original reporting distinguishing attribution of a prediction from endorsement of it.
source_requirements: Prefer original predictions and outcome records, independent prediction audits, and original contemporaneous reporting. Commentary about media behavior is supplementary.
