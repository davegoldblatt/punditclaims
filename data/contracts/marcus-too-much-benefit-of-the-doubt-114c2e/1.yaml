explicit_source_elements:
  - humanoid domestic robots
  - without general intelligence
  - we don’t yet have any serious candidates
  - safe and useful domestic humanoid robot
  - at present we have no viable option
evaluator_interpretation:
  - Read in context, the claim concerns an autonomous humanoid that can safely perform varied, useful household work in ordinary homes.
  - A serious candidate means an existing intelligence system credibly capable of serving as that robot’s controller. It need not be a finished consumer product, but a research ambition alone does not qualify.
  - General intelligence means broad learning, reasoning and adaptation beyond a fixed collection of trained tasks; Marcus supplies no precise test.
  - The ongoing observation is assessed as of 2022-10-16. Robotics research has no standard reporting quarter, so the target is the post-date snapshot. Earlier demonstrations are background, not direct measurements of that snapshot.
  - The necessity clause requires separate evidence. Failure to find an adequate robot does not establish that general intelligence is necessary.
support_condition: Evidence establishes that safe, broadly useful autonomous domestic humanoids require general intelligence, and a sufficiently comprehensive assessment of systems available on the post date finds no credible candidate controller.
contradiction_condition: A documented safe, broadly useful autonomous domestic humanoid operating without general intelligence disproves the necessity clause; credible evaluation of an existing general-intelligence candidate suitable for that role disproves the no-candidates clause.
measurement_requirements: Document autonomy, household task breadth, adaptation to unfamiliar situations, reliability, safety and human intervention. Distinguish a credible candidate from both a finished product and a narrow demonstration.
source_requirements: Primary technical evaluations or documented deployments tied to capabilities available by 2022-10-16. Company demonstrations can establish reported capabilities but cannot alone establish broad safety or a field-wide absence.
