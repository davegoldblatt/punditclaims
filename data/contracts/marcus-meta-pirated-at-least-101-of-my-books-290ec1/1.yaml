assessment_axis: historical_observation
explicit_source_elements:
  - in this one database alone
  - Meta pirated
  - over 100 of my books and scientific articles
evaluator_interpretation:
  - The database is LibGen. The threshold is at least 101 works authored or coauthored by Gary Marcus.
  - The ordinary factual reading is that Meta acquired unauthorized copies of these works from LibGen. A catalog listing alone does not establish Meta's acquisition.
  - Repeated records for the same work do not automatically count as additional works. Editions and translations require identification.
  - The observation concerns acquisition completed by the post date. No starting date is specified, so the target period has an unspecified start.
  - The word 'pirated' also suggests illegality. The factual acquisition assessment does not substitute for a copyright ruling.
support_condition: Dated catalog records and Meta acquisition records identify at least 101 Marcus works copied from LibGen by March 20, 2025, without authorization for those copies.
contradiction_condition: A sufficiently complete acquisition and rights record establishes that no more than 100 Marcus works meet those conditions.
measurement_requirements: Identify works by title, authorship, and stable identifiers; reconcile author-name variants and duplicates; match the works to the LibGen material Meta actually acquired.
source_requirements: Reproducible catalog results plus acquisition records, admissions, or judicial findings covering Marcus's works. Independent rights evidence is needed for unauthorized copying. Marcus's own assertion cannot establish the outcome.
