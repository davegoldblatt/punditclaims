explicit_source_elements:
  - They
  - often
  - produce workslop
evaluator_interpretation:
  - They refers to large language models.
  - Workslop means superficially useful workplace output that lacks accuracy, substance or necessary context and creates correction work.
  - Read often as a recurring practical problem encountered by many users, rather than a claim that most generated outputs are poor.
  - "Use the latest clearly dated relevant fieldwork verified in readable sources available before the post: the November 13–14, 2025 enterprise-user survey. Older studies provide context."
  - Worker surveys can establish recurring experiences but cannot directly measure the fraction of all LLM outputs that are workslop.
support_condition: Credible workplace evidence shows that low-quality AI output and consequential correction work recur for a substantial share of users.
contradiction_condition: Broad, methodologically credible workplace evidence shows that such output and consequential correction work are rare under ordinary use.
measurement_requirements: Record survey population, field dates, screening and self-report limitations. Do not confuse the share of workers reporting a problem with the share of outputs that are poor.
source_requirements: Original survey findings or direct evaluations of workplace outputs, with enough methodology to assess their scope.
