explicit_source_elements:
  - Huang’s craven beat-and-raise machine
  - when it eventually falls apart
  - the damage will be horrendous
evaluator_interpretation:
  - The assessed forecast concerns the NVIDIA-linked financing model described in the context, rather than an ordinary missed earnings estimate.
  - The plain reading is a breakdown that causes severe financial harm across dependent businesses, investors or lenders.
  - The source supplies neither a deadline nor a numerical definition of severe damage. I do not add a loss threshold.
support_condition: Documented failure of the identified financing model, accompanied by severe losses or failures among dependent businesses, investors or lenders, with evidence connecting the damage to that breakdown.
contradiction_condition: A definitive, orderly termination of the identified financing model without the predicted severe damage. Continued operation or an isolated earnings beat cannot contradict an eventual forecast.
measurement_requirements: Distinguish temporary market losses, missed guidance and financing retrenchment from an actual breakdown. Establish realized consequences and their connection to the financing model.
source_requirements: Company filings, financing agreements, creditor or insolvency records, and independent reporting that establishes the consequences. Risk warnings alone are insufficient.
