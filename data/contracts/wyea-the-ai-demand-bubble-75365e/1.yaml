assessment_axis: historical_observation
explicit_source_elements:
  - all compute will be used
  - endless, insatiable demand
  - the fact there isn’t
evaluator_interpretation:
  - Read this as a practical claim that demand is insufficient to absorb the AI compute capacity being supplied, not the trivial observation that demand cannot literally be infinite.
  - Use April–June 2026, the latest completed reporting quarter before the post, for the ongoing state.
  - Distinguish unsold capacity caused by weak demand from idle execution time on capacity customers have already purchased.
  - The wording supplies no utilization threshold or duration. Do not invent one or require every processor to run continuously.
support_condition: Broad, representative evidence shows persistent excess AI compute capacity attributable to insufficient demand, supported by utilization, availability, cancellations or comparable rental-price evidence.
contradiction_condition: Representative evidence shows that demand absorbs available AI compute capacity across the relevant market, with persistent shortages or waiting lists and no material demand-related surplus.
measurement_requirements: Measure economically available AI capacity and demand over time, separating hardware generations, regions, contracted capacity, execution utilization and operational bottlenecks. Price changes alone require an explanation of their cause.
source_requirements: Independent market measurements or transparent utilization datasets, checked against provider disclosures. Isolated clusters and general cloud statements are insufficient to settle the whole market.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No period is stated; latest pre-post quarter selected.
  - Endless demand is rhetorical rather than a measurable quantity.
  - The scope of 'all compute' is unspecified.
  - Actual processor use and commercial demand for reserved capacity are different measures.
  - No threshold distinguishes ordinary spare capacity from a demand shortfall.
