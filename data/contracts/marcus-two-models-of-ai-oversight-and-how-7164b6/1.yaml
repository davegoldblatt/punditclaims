explicit_source_elements:
  - Bing relies on GPT-4
  - we (eg, in the scientific community) don’t have access to how GPT-4 works
  - we don’t have access to what data its trained on
  - about as far away from transparency as we could be
evaluator_interpretation:
  - The checkable core concerns public scientific access to GPT-4's detailed architecture, training process, and training dataset.
  - Knowing the general model family or being able to submit prompts does not constitute access to those details.
  - The transparency superlative is read as rhetorical emphasis on substantial opacity, not a measurable ranking of every possible disclosure policy.
  - The parenthetical discussion of political and hiring bias explains why transparency matters; it is not treated as a separate claim that GPT-4 caused a particular discriminatory decision.
  - There is no regular disclosure reporting period. I use the current GPT-4 release and documentation cycle, beginning in March 2023 and ending at the post. March 1 denotes the beginning of that month, not an asserted release day.
support_condition: The contemporaneous disclosure record withholds detailed architecture and training-dataset information from the general scientific community, despite allowing use or high-level study of the model.
contradiction_condition: Contemporaneous records establish that the scientific community could inspect detailed architecture and the training dataset, rather than only model outputs or broad descriptions.
measurement_requirements: Distinguish public access to underlying model and dataset information from API access, selected external testing, broad methodological descriptions, and promised future disclosures.
source_requirements: Use the contemporaneous technical report and documented research-access arrangements. Advocacy filings may corroborate the disclosure record but are not regulatory findings.
