explicit_source_elements:
  - AI labs
  - this entire time
  - massively subsidizing their own products
evaluator_interpretation:
  - The surrounding discussion identifies OpenAI and Anthropic and focuses on their own subscriptions.
  - The ordinary reading is that subscription receipts have persistently fallen materially below attributable delivery costs, rather than merely below the retail API value of maximum usage.
  - Corporate losses, research spending and losses on selected heavy users do not by themselves establish subscription-wide subsidies.
  - This entire time describes a historical period ending with the post. Its beginning is unspecified and is left open rather than assigned an invented date.
  - "The contextual financial basis is an estimate: Zitron relies on reported analyses of usage and compute spending."
support_condition: Comparable historical subscription revenue and attributable delivery-cost records show substantial, persistent shortfalls across the labs and products covered.
contradiction_condition: Comparable subscription-level records show sustained positive delivery margins inconsistent with the asserted broad and persistent subsidy.
measurement_requirements: Measure actual delivery costs and subscription receipts for matching products, users and periods. Distinguish average costs from maximum usage and retail API prices from internal serving costs.
source_requirements: Prefer product-level financial disclosures or documented cost studies. News reports of executive statements can establish narrower episodes but cannot establish the entire history.
