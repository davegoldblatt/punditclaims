assessment_axis: forecast_outcome
explicit_source_elements:
  - one day
  - Cognition
  - runs out of money and dies
  - or becomes a much, much smaller company
evaluator_interpretation:
  - The named target is Cognition, the AI software company.
  - The alternatives are shutdown caused by exhausted funding or a substantial, lasting contraction in operating scale relative to the post date.
  - Operating scale should be assessed through revenue, workforce and business footprint together. A lower financing valuation alone is insufficient.
  - Much, much smaller supplies no numeric threshold; no arbitrary percentage is imposed.
  - The surrounding valuation and loss figures are not independently graded as part of this forecast.
support_condition: Dated records establish Cognition's shutdown because funds were exhausted, or an unmistakably substantial and durable contraction in its operating business after publication.
contradiction_condition: A final event must make both alternatives impossible for the defined business. Continued growth, profitability, fundraising or an ordinary acquisition does not by itself refute an eventual forecast.
measurement_requirements: Cash-exhaustion and closure records, or comparable pre-post and subsequent operating-scale measures. Distinguish company-wide contraction from isolated restructuring.
source_requirements: Company announcements, insolvency or liquidation records, and reliable financial or workforce reporting.
