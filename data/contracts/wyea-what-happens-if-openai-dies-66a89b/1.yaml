evaluator_interpretation:
  - Q1 means January through March 2026.
  - Non-GAAP operating margin means adjusted operating income divided by realized revenue for that quarter.
  - Treat -122% as a figure rounded to the nearest whole percentage point.
support_condition: A reliable disclosure or report identifies OpenAI's Q1 2026 adjusted operating margin as -122%, or matching inputs yield that rounded result.
contradiction_condition: Reliable results on the same non-GAAP basis and for the same quarter establish a margin that does not round to -122%.
measurement_requirements: Use quarterly realized revenue and adjusted operating income. Do not substitute net loss, cash burn or annualized revenue.
source_requirements: Prefer an OpenAI disclosure or underlying investor documents. If unavailable, use a readable financial report that explicitly identifies the quarter and adjusted operating measure.
