assessment_axis: historical_observation
explicit_source_elements:
  - AI GPUs
  - outside of rentals to Anthropic and OpenAI
  - generating very little economic value
  - few signs that they will do so in the future
evaluator_interpretation:
  - Read economic value as demonstrated commercial benefits, cost savings or productivity gains from GPU-based AI uses outside the excluded rentals.
  - Assess the ongoing state using April–June 2026, the latest completed calendar quarter ordinarily reportable before September 1. The speaker supplied no reporting period.
  - Read the future clause as an observation about evidence of prospective value available at publication, not a forecast with an invented deadline.
  - The rental exclusion defines scope; it is not a conditional forecast antecedent.
  - "'Very little' concerns the broad economic contribution. One useful application does not by itself disprove it, and GPU sales alone do not establish benefits for end users."
support_condition: Representative evidence for the target period shows small economic benefits across the included GPU uses, with little credible evidence of scalable prospective benefits available at publication.
contradiction_condition: Broad, material and measured commercial or productivity benefits from included GPU uses, together with documented scalable applications, establish substantially more than very little economic value.
measurement_requirements: Attribute benefits to GPU-based AI, exclude the named rentals, report relevant costs and deployment scale, and distinguish usage, advertising conversions and revenue from incremental economic benefits.
source_requirements: Representative independent measurements and disclosed commercial results, supplemented by technical documentation linking the measured applications to GPUs.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The observation has no stated reporting period; the latest reportable calendar quarter is an evaluator choice.
  - "'Very little' has no numerical threshold or denominator."
  - "'Economic value' could refer to gross benefits, private returns or broader net benefits."
  - The scope of AI GPUs could include conventional recommendation systems or only newer generative applications.
  - The prospective clause has no deadline.
