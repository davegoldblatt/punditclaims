  - Grok, Claude, Gemini
  - invariably faced the same problems
  - Distribution shift has never been solved
evaluator_interpretation:
  - The ordinary reading is that repeated model-development attempts, including the named families, retained recurring qualitative failures and had not achieved broadly reliable generalization under distribution shift.
  - This does not assert that every answer is wrong or that no model ever succeeds outside its training distribution.
  - The words have invariably and never describe a historical record through the post date. No starting date is supplied.
  - Dozens of shots on goal is a claimed historical quantity, not a conditional antecedent.
support_condition: Broad evaluations substantiate recurring failures across the named families and multiple tens of attempts, while controlled tests establish that robust generalization under distribution shift remained unsolved.
contradiction_condition: An independently validated broadly reliable solution to distribution shift existed by the post date, or sufficiently comprehensive evaluations establish a counterexample to the asserted universal persistence of the relevant failure categories.
measurement_requirements: Identify models and versions, evaluation dates, failure categories, and controlled distribution shifts. Distinguish unfamiliar tasks from demonstrated differences between training and test distributions.
source_requirements: Independent evaluations across the named families and the claimed breadth of attempts. Small controlled models cannot alone establish frontier-model behavior.
