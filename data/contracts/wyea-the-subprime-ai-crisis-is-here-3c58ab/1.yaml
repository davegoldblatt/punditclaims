explicit_source_elements:
  - no liquidity mechanism
  - billions of dollars sunk into
  - most AI companies
evaluator_interpretation:
  - The ordinary reading is that a majority of venture-backed AI companies lack a feasible route for investors to sell their stakes.
  - Most is read by company count; weighting by invested capital is another possible reading.
  - Liquidity routes include public offerings, acquisitions, and secondary share sales. An unfinished exit is not automatically an unavailable route.
  - I assess the publicly observable market from January 1 through March 30, 2026, the current quarter before the post. Transaction records can report this ongoing state without waiting for quarterly accounts.
support_condition: Representative evidence shows that a majority of the relevant companies lack feasible investor liquidity routes during the target period.
contradiction_condition: Representative evidence shows that a majority have feasible routes. Individual completed exits refute an absolute no-exits claim but do not alone refute this claim about most companies.
measurement_requirements: Identify the population and denominator, distinguish completed exits from credible prospects, and distinguish company fundraising from sales by existing investors.
source_requirements: Exchange filings, acquisition records, secondary transaction disclosures, and representative venture-market data.
