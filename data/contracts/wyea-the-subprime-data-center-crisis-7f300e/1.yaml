assessment_axis: forecast_outcome
explicit_source_elements:
  - For me to be wrong
  - AI compute demand
  - hundreds of billions’ worth
  - within the next 3 years
  - little more than $120 billion
  - 80% or more of that coming from two companies
evaluator_interpretation:
  - The deadline is July 22, 2029, three years after publication.
  - This states a necessary demand condition for his crisis thesis to be wrong. It does not separately predict that demand will reach the threshold.
  - The ordinary reading of demand is annual purchases of AI compute services. Annual measurement is an evaluator interpretation; the sentence does not specify it.
  - Hundreds of billions means multiple hundreds of billions of U.S. dollars annually. No sharper threshold is imposed.
  - The two companies are OpenAI and Anthropic, identified by the surrounding discussion.
  - The unless wording supplied by the screens restates the disputed demand condition; it is not a separate external event that activates the forecast.
  - The $120 billion baseline, concentration share and dependence on venture financing remain parts of the claim requiring separate verification. Their accounting basis and measurement period are unspecified.
support_condition: By the deadline, matched demand and financing evidence establishes that avoiding the predicted revenue-driven crisis required annual AI compute purchases in the hundreds of billions. Crossing a demand threshold alone does not establish necessity. The stated contemporary baseline and concentration also require matching evidence.
contradiction_condition: The relevant financed buildout demonstrably meets its obligations without the predicted crisis despite annual paid AI compute demand remaining below hundreds of billions through the deadline, or matching evidence disproves the stated contemporary baseline or concentration.
measurement_requirements: Measure annual realized AI compute purchases without counting the same transactions twice. Separate spending from model-company revenue, annualized revenue, hardware investment and multiyear commitments. Match the baseline and two-company share to the same period and accounting basis.
source_requirements: Company expense disclosures and independently reconciled industry estimates, together with project cash flows and debt-service records.
metric_scope:
  company: AI compute purchasers globally, including OpenAI and Anthropic
  metric: Annual paid AI compute demand and the share attributable to OpenAI and Anthropic
  currency: USD
  units: billions of dollars per year; percentage share
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: within the next 3 years
horizon_interval:
  start: 2026-07-22
  end: 2029-07-22
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires completed, decisive financing and operating evidence establishing or refuting the claimed necessity. A spending forecast, multiyear commitment or isolated demand milestone cannot settle the full claim.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Annual rather than cumulative demand is inferred.
  - Hundreds of billions has no exact threshold.
  - The crisis thesis and the test for it being wrong are not precisely defined.
  - The contemporary $120 billion baseline has no stated measurement period or accounting basis.
  - The denominator for the 80% share is unspecified.
  - Near-infinite venture capital is rhetorical; the testable reading is material dependence on external financing.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
