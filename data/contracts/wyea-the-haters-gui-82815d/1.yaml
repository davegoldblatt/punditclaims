assessment_axis: forecast_outcome
explicit_source_elements:
  - Sam Altman, Dario Amodei, Satya Nadella, Sundar Pichai, Tim Cook, Elon Musk, Mark Zuckerberg and Andy Jassy
  - have overseen
  - will harm our markets
  - our economy
  - the tech industry writ large
evaluator_interpretation:
  - The testable forecast is that the AI boom overseen by the named leaders will cause material damage across markets, the wider economy, and the technology industry.
  - The plain reading requires broad effects across all three named areas, rather than an isolated company's losses.
  - The surrounding collapse narrative supplies the proposed mechanism, not an explicit conditional antecedent.
  - Needless, wasteful, and the demand for accountability are value judgments excluded from the outcome test.
  - The statement concerns collective oversight; it does not specify each executive's individual causal contribution.
support_condition: Dated evidence establishes material market losses, wider economic damage, and broad technology-sector harm attributable to the AI boom or its reversal.
contradiction_condition: Comprehensive evidence from a completed, identifiable episode could contradict the proposed harmful causal sequence. Continued growth or the absence of collapse by the evaluation date cannot disprove an unlimited forecast.
measurement_requirements: Market losses plus real-economy measures such as output, investment, employment, or insolvencies, with credible attribution to AI-related investment or repricing rather than unrelated shocks.
source_requirements: Prefer official economic and financial-stability analysis and sector data. Market reporting can establish selloffs but cannot alone establish economy-wide consequences.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: "Resolve early only when a dated episode establishes material AI-attributable damage in all three domains: markets, the wider economy, and the technology industry."
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is supplied.
  - Harm has no specified size or duration.
  - Our markets and economy have no explicit geographic boundary.
  - The statement combines a forecast with moral judgments and collective attribution.
