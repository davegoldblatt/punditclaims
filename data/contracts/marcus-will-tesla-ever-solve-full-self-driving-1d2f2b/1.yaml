  - Because it shows
evaluator_interpretation:
  - The referenced graph makes this a claim about repeated reported crash involvement among ADS developers in NHTSA's initial June 2022 release.
  - "'Problems' is read as repeated crash involvement requiring attention, without assuming that the ADS caused each crash or was less safe than human driving."
  - The target period is July 2021 through May 15, 2022, the reporting window underlying the graph discussed in the post.
  - ADS reporting covers Levels 3–5; it does not establish that the reported vehicles were operating at Level 5.
support_condition: The initial release documents repeated crash involvement across ADS developers, including developers such as Waymo and Cruise.
contradiction_condition: The initial release shows no repeated crash involvement among those developers, or the apparent pattern results from a misreading of the data.
measurement_requirements: Use ADS crash involvement, keeping it separate from Level 2 reports, fault determinations, and exposure-adjusted safety rates. Do not add reporting-entity totals without checking duplicate reports.
source_requirements: Prefer the original NHTSA release and report. If inaccessible, use identifiable reproductions and contemporary reputable reporting, explaining that limitation.
