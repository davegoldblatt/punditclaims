explicit_source_elements:
  - The underlying economics suggest
  - no subscription-based AI service
  - let alone a free one
  - makes any kind of financial sense
evaluator_interpretation:
  - "The ordinary reading is a claim about provider economics: no subscription AI service has an economically viable model."
  - A credible example of an AI subscription service covering its recurring costs would count against the universal assertion.
  - Suggest qualifies the strength of the assertion; it is not an external condition that must occur.
  - Use Q1 2026, the latest completed calendar quarter before the post that public reporting could describe.
  - No accounting basis or particular margin measure is supplied. Do not silently replace financial viability with either gross margin or net income.
support_condition: Broad, comparable financial evidence establishes that the covered subscription services cannot cover the costs required to sustain their services.
contradiction_condition: At least one service within the claimed scope credibly demonstrates financially viable subscription economics in the target period under a defined accounting basis.
measurement_requirements: Identify the service, subscription revenue, attributable recurring costs, and treatment of training, research, overhead, and other revenue.
source_requirements: Service-level accounts or credible reporting that identifies the period and meaning of profitability; company-wide results require an adequate link to the subscription service.
