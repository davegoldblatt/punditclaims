ambiguity_flags:
  - Too many, erratic, and reliably have no operational thresholds.
  - Erratic could mean sensitivity to wording, randomness across identical prompts, or differences across models.
  - The period for current systems is an evaluator choice.
  - The claim combines an observation of failures with an explanation of their causes.
