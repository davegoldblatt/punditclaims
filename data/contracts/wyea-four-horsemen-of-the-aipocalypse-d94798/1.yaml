assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic cannot afford
  - a stable and reliable service
  - to its customers
evaluator_interpretation:
  - The plain reading is financial inability to fund dependable service, rather than the mere existence of outages.
  - "The ongoing state is assessed over the latest completed quarter and the pre-publication April service period: January 1 through April 21, 2026."
  - Dependable service means consistently usable service with limited disruptions, not perfect uptime.
  - Available financing counts toward ability to pay, but raising money alone does not establish that reliability requirements are affordable.
  - No financial measure or accounting basis is stated.
support_condition: Evidence shows that resources available to Anthropic were insufficient to fund the capacity and operations needed for dependable service, and connects that shortfall to service failures.
contradiction_condition: Evidence shows sufficient available resources to fund the required dependable service, with a credible cost assessment or demonstrated funded operation.
measurement_requirements: Contemporaneous liquidity and financing availability, committed obligations, the cost of required capacity and reliability work, and service incident records with causes.
source_requirements: Financial disclosures and operational records that connect affordability to reliability. Outage reports alone are insufficient.
