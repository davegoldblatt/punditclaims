assessment_axis: historical_observation
explicit_source_elements:
  - large language models
  - remotely close to artificial general intelligence
  - "what’s missing: semantics, reasoning, common sense, theory of mind"
evaluator_interpretation:
  - Assess the technical assertion, rather than whether Marcus accurately describes his and Booch's beliefs.
  - The ordinary contextual reading is that LLMs lack reliable, general competence in the listed abilities. It need not mean that they cannot solve any reasoning or social-understanding task.
  - Use January 2023 through the publication date as the current research snapshot. The post specifies no reporting period.
  - Do not substitute later models for models available when the statement was made.
support_condition: Evaluations of contemporary LLMs establish substantial, general deficiencies across the named abilities and connect those deficiencies to a defensible measure of distance from human-level general intelligence.
contradiction_condition: Contemporary LLMs demonstrate reliable, transferable competence across the named abilities and broad human-level generality. Isolated benchmark successes challenge a literal absence reading but do not alone contradict the contextual claim.
measurement_requirements: Identify model versions, prompting methods, human comparisons, task coverage and robustness to unfamiliar examples. Distinguish benchmark performance from general competence.
source_requirements: Primary evaluations of models available by 2023-01-22. Later publications may document earlier experiments, but later model capabilities cannot decide this observation.
