evaluator_interpretation:
  - "Plain reading: in the months before January 2026, newly reported deaths linked to chatbots, and lawsuits over them, kept appearing at a higher pace than in earlier years (2023–2024)."
  - "'Worse' is read as more reported cases and lawsuits. It is not read as a measured per-user death rate, which no one publishes."
support_condition: Dated reporting or case records showing that reported chatbot-linked deaths and related wrongful-death suits rose in 2025 through early January 2026, compared with the handful of cases reported in 2023–2024.
contradiction_condition: Evidence that newly reported chatbot-linked deaths or related lawsuits were flat or falling in late 2025 and early 2026 compared with earlier periods.
measurement_requirements: Count of publicly reported chatbot-linked deaths and wrongful-death lawsuits by date. No official statistics exist.
