evaluator_interpretation:
  - The ordinary reading is that contemporary language systems repeatedly produce competent-looking language while making basic commonsense mistakes or accepting false premises.
  - This does not require proving that models possess no understanding whatsoever, or that every response fails.
  - With no reporting cycle or exact period specified, use the current calendar year through publication, January 1 through October 2, 2022, for the ongoing observation.
  - Systematic evaluations and documented recurring failure modes can establish repetition without reproducing the exact flying-pig responses.
support_condition: Contemporary primary reports or reproducible evaluations document recurring commonsense or false-premise failures alongside competent language performance.
contradiction_condition: Reliable contemporary evaluations establish that the alleged recurring pattern is an artifact or misdescription and that the relevant systems reliably handle the ordinary commonsense and false-premise cases at issue.
measurement_requirements: Identify the tested model and task. Distinguish errors in expressed answers from claims about an inaccessible internal mental state. Individual correct answers do not disprove recurring failures.
source_requirements: Use independent evaluations or model developers' documented tests available for the target period. Do not use Marcus's own examples as independent confirmation.
