explicit_source_elements:
  - 80% of OpenAI and Anthropic’s enterprise revenues
  - the vast majority of their total revenues
  - likely hundreds of customers
  - an indeterminately-large chunk
  - AI startups that can only do so as long as venture capital supports them
evaluator_interpretation:
  - This is a compound claim about customer concentration, enterprise revenue share, approximate customer count, and financing dependency.
  - The ordinary reading of vast majority is clear dominance of enterprise revenue over other revenue, rather than merely crossing one half.
  - Read the enterprise-share assertion as applying to both named companies; the wording could alternatively refer to their combined revenue.
  - Treat hundreds as an approximate scale claim, not an exact count.
  - The startup fraction is explicitly unspecified, so no numerical threshold is invented.
  - Use August 2026, the last complete month before publication and the month of the located current revenue-mix disclosure.
  - Ramp provides an estimated concentration measure; the accounting basis for the broader revenue mix and dependency assertions is not supplied.
support_condition: Comparable evidence establishes the concentration figure, enterprise revenue clearly dominating total revenue at both labs, an approximately hundreds-sized customer group, and a material startup component unable to sustain payments without venture support.
contradiction_condition: Comparable evidence clearly refutes a firm component, such as showing that enterprise revenue does not dominate total revenue, or that the asserted concentration or financing dependency is materially wrong. Mixed requires affirmative evidence for both supported and contradicted components.
measurement_requirements: Provider-specific revenue segmentation and concentration on a consistent accounting basis, customer counts, identification of startup customers, and their financing-dependent cash flows.
source_requirements: Prefer company financial disclosures and underlying customer records. Use reputable reporting for private disclosures when the primary records are unavailable.
