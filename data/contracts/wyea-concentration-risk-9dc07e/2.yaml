assessment_axis: historical_observation
explicit_source_elements:
  - 80% of OpenAI and Anthropic's enterprise revenues
  - which make up the vast majority of their total revenues
  - dependent on what are likely hundreds of customers spending outsized amounts of money on AI tokens
  - an indeterminately-large chunk of them being AI startups that can only do so as long as venture capital supports them
evaluator_interpretation:
  - "The firm parts are two: (a) about 80% of each lab's enterprise revenue comes from a small set of top customers, and (b) enterprise revenue is the vast majority of each lab's total revenue."
  - The 'likely hundreds' customer count and the 'indeterminately-large chunk' of VC-backed startups are hedged by the speaker. They are not scored as thresholds.
  - The post builds on Ramp's data on business spending, so the 80% figure is read as a statement about the labs' real enterprise revenue, which the Ramp sample estimates.
  - "He describes an ongoing state with no named period. The target period is the most recent window public evidence could cover before the post: July 2026 to the post date."
support_condition: Reliable evidence that about 80% of each lab's actual enterprise revenue comes from a few hundred top customers, and that enterprise revenue is the vast majority of total revenue at both labs.
contradiction_condition: Reliable evidence that enterprise revenue is spread much more widely than this at either lab, or that enterprise revenue is not the vast majority of total revenue (for example, roughly half or less at OpenAI).
measurement_requirements: Customer-level revenue concentration from company disclosures or filings, or a credible outside measure, plus each lab's enterprise share of total revenue for mid-2026.
source_requirements: Company filings or disclosures preferred. Ramp card and bill-pay data and press reports count as estimates.
