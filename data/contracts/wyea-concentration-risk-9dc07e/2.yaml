  - Ramp's 80% figure covers spending by Ramp's own business customers, not each lab's total enterprise revenue.
  - Unclear whether 'vast majority' applies to each lab separately or to the two combined.
  - "'Likely hundreds' and 'indeterminately-large chunk' are hedged and not scored."
