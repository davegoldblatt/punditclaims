explicit_source_elements:
  - intended to invest $100 billion in OpenAI last year
  - misleading everybody
  - the deal never existed
  - now effectively dead
  - allegedly “close” to investing $30 billion
evaluator_interpretation:
  - Assess the proposal’s existence and status through February 26, 2026, including its announcement in the preceding calendar year.
  - In context, deal never existed is read primarily as saying that a definitive $100 billion investment agreement was never completed. A preliminary proposal is a different proposition.
  - Effectively dead means the original investment structure had been abandoned or superseded by publication, rather than merely remaining unsigned.
  - Misleading is tested against what the announcement represented about certainty. Intentional dishonesty is not inferred from a deal’s failure to close.
  - The original amount must retain any up-to qualification and deployment conditions.
support_condition: Records establish that no definitive $100 billion agreement was completed, that the original structure had been abandoned or superseded by the post date, and that its public presentation materially overstated its settled status.
contradiction_condition: Records establish a definitive agreement or continued operation of the original structure at publication; clear disclosure of its preliminary, conditional status also weighs against the misleading characterization.
measurement_requirements: Distinguish a letter of intent, intended maximum investment, definitive commitment, and money actually invested. Establish status as of publication.
source_requirements: Original company announcements and agreement disclosures; attributed reporting may supplement unavailable private negotiations.
