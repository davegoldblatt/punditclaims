assessment_axis: forecast_outcome
explicit_source_elements:
  - In the long run
  - they will save lives
  - many people
  - the blind, elderly, and disabled
  - far more autonomy over their own lives
evaluator_interpretation:
  - In the long run supplies no calendar deadline.
  - Driverless cars includes services that transport passengers without a human driver; this benefits claim does not explicitly require Level 5.
  - Save lives means fewer deaths than would otherwise occur for comparable travel, including effects on other road users.
  - Far more autonomy means substantial, sustained gains in independent travel and access to activities for many people in the named groups.
  - Both the safety and independence components must be established to support the combined forecast.
support_condition: Credible real-world evidence establishes reduced fatalities attributable to driverless deployment and substantial, sustained independent-mobility gains for many blind, older, and disabled people.
contradiction_condition: Decisive evidence establishes that the promised long-run benefits cannot occur. Present shortcomings or a limited deployment's failure do not alone contradict an undated forecast.
measurement_requirements: Use exposure-adjusted fatality comparisons with appropriate human-driving baselines, plus measured changes in independent travel, access, affordability, and practical usability. Injury reductions and adoption preferences are informative but do not by themselves settle the claim.
source_requirements: Independent safety studies and mobility-access studies, with company-authored research identified and operational restrictions disclosed.
metric_scope: null
original_horizon: in the long run
horizon_interval:
  start: 2022-06-15
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when dated evidence establishes both a credible fatality benefit and sustained substantial independence gains at meaningful scale in the named populations. Otherwise keep the undated forecast open.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No calendar deadline.
  - Many people and far more autonomy have no numerical thresholds.
  - The geographic extent and deployment scale are unspecified.
retrospective_or_prospective: retrospective
