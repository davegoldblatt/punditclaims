assessment_axis: historical_observation
explicit_source_elements:
  - The valuations anticipate trillion dollar markets
  - actual current revenues from generative AI
  - rumored to be in the hundreds of millions
evaluator_interpretation:
  - The ordinary reading concerns industry revenue, not OpenAI alone, and expectations underlying valuations at publication.
  - Dollars means US dollars. 'Rumored' calls for contemporaneous reporting, rather than audited confirmation; it is not a conditional antecedent.
  - "For the ongoing revenue observation, the target period is the latest completed calendar quarter before publication: April–June 2023. This is an evaluator convention because Marcus supplied no reporting period."
  - Actual revenue is treated as realized revenue. Annualized revenue and forecasts are separate measures. The unspecified reporting interval prevents confidently applying the hundreds-of-millions threshold.
support_condition: Comparable reporting must place aggregate generative-AI revenue in the hundreds of millions for the relevant reporting period, and contemporaneous investor evidence must connect the valuations to trillion-dollar market expectations.
contradiction_condition: Comparable industry reporting must put revenue clearly outside that scale, or investor evidence must establish materially different market assumptions. A different company's revenue, a run rate, or a differently defined market cannot suffice.
measurement_requirements: Define the industry boundary, reporting interval, treatment of infrastructure and intermediate sales, and whether revenue is realized or annualized. Establish valuation assumptions separately from market forecasts.
source_requirements: Prefer company disclosures and investor materials. Reputable reporting of private-company estimates is admissible because the claim explicitly concerns rumors.
