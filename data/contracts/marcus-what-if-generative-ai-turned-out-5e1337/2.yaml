assessment_axis: historical_observation
explicit_source_elements:
  - The valuations anticipate trillion dollar markets
  - actual current revenues from generative AI
  - rumored
  - in the hundreds of millions
evaluator_interpretation:
  - The ordinary reading compares anticipated markets with the industry's current annual revenue scale, not revenue collected in one quarter.
  - The revenue statement concerns reported estimates. It does not claim that audited industry accounts exist.
  - For the ongoing state, July 2023 is the latest completed month before publication. This dates the current annual revenue scale; it does not turn the claim into a monthly revenue total.
  - The metric below provisionally represents current annual scale as an annualized run rate. Marcus did not distinguish that measure from trailing annual realized revenue, so evidence on one basis cannot settle the other.
  - The valuation component requires evidence connecting investment expectations to trillion-dollar markets. A market forecast alone establishes that such expectations circulated, not that particular valuations required them.
  - The boundaries of the industry, including whether infrastructure revenue belongs in the total, are unspecified.
support_condition: Comparable reporting establishes aggregate generative AI revenue on an annual scale of hundreds of millions of US dollars around the post, and contemporaneous valuation evidence connects the valuations being discussed to trillion-dollar market expectations.
contradiction_condition: Comparable reporting establishes that the industry's current annual revenue scale was clearly outside hundreds of millions, or direct valuation evidence contradicts the claimed market assumptions. Later growth, a single company's forecast, or a broader infrastructure market estimate is insufficient.
measurement_requirements: Use a consistent industry boundary and annual revenue measure. Distinguish realized annual revenue, annualized run rates, and forecasts. Avoid double-counting sales between model providers, applications, and infrastructure suppliers.
source_requirements: Contemporaneous financial reporting or retrospective records explicitly describing the pre-post state, plus investor materials or other direct evidence of valuation assumptions.
