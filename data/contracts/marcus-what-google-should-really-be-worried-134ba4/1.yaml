  - now supports writing stuff like this
  - at scale
  - far more fluently than before
evaluator_interpretation:
  - The ordinary reading is that language models available by the post date could repeatedly generate readable fabricated articles with little human writing effort.
  - The surrounding discussion identifies GPT-2 as the earlier comparison. It does not identify a particular GPT-2 size or configuration.
  - Fluency means grammatical, readable, coherent prose. It does not mean factual accuracy.
  - "For the ongoing capability described as 'now', the target is the current month through the post date: February 1–12, 2023. There is no regular reporting quarter for this capability."
  - The claim concerns production capability. It does not require proving that models produced the particular Bialek hoax or successfully manipulated search rankings.
support_condition: Demonstrations or evaluations establish that models available in the target period could repeatedly produce plausible fabricated articles with little writing labor, with a substantial improvement in fluency over GPT-2.
contradiction_condition: Comparable demonstrations or evaluations show that the available models could not repeatedly produce such material with little writing labor, or that their fluency did not substantially improve over GPT-2.
measurement_requirements: Evidence of repeated generation and comparative assessments of readability and coherence on similar article-writing tasks. A numerical fluency threshold is not required, but isolated attractive examples cannot establish the size of an improvement.
source_requirements: Prefer original demonstrations and comparative research. Earlier evaluations provide background; later evidence must specifically establish capabilities during the target period.
