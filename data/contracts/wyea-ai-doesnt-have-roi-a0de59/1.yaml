  - unreliable, inconsistent and expensive at its core
  - never, ever seems to get cheaper
evaluator_interpretation:
  - Assess the supplied normalized proposition about AI's reliability and costs, rather than the surrounding accusation about every favorable writer.
  - The phrase seems to get cheaper is hedged, and the passage supplies no task population, reliability threshold, cost perspective, or comparison interval.
  - The surrounding text expressly acknowledges falling per-token prices. Treating this sentence as a denial of all token-price reductions would misrepresent its context.
  - A benchmark-specific or constant-quality cost claim would be a new proposition supplied by the evaluator.
support_condition: No stable support condition can be assigned to the whole statement without adding decisive definitions of reliability, expense, task scope, and comparison period.
contradiction_condition: No stable contradiction condition can be assigned to the whole statement. A cheaper model or successful benchmark would not by itself refute this broad, hedged characterization.
measurement_requirements: A separately specified claim would need repeated evaluations on fixed tasks, a reliability threshold, and comparable costs per successful task including retries and human review.
source_requirements: For a more specific claim, use dated independent evaluations and reproducible task-cost histories.
