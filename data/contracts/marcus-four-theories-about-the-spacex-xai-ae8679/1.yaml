ambiguity_flags:
  - The latest disclosed cumulative reporting period is an evaluator-selected period for an ongoing observation.
  - Fast and little have no numerical thresholds.
  - Business model could mean an identifiable monetization route or a proven profitable one.
  - Market niche could mean a target customer segment or a defensible competitive advantage.
  - The reporting does not supply a standardized cash-burn reconciliation.
