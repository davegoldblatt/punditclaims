assessment_axis: causal_assessment
explicit_source_elements:
  - capacity is coming on very slowly
  - an illusory signal
  - insatiable demand
  - barely any compute is coming online
  - the largest and best-capitalized companies
evaluator_interpretation:
  - Read barely any compute as negligible additions to usable AI computing capacity, not literally zero additions.
  - Use April–June 2026, the latest completed reporting quarter before the post, to test the ongoing capacity assertion.
  - Compare additions with the operating fleet and announced delivery schedules without inventing a numerical cutoff.
  - Read the causal assertion as saying that slow supply materially exaggerates the appearance of broad, sustainable demand.
  - Keep energized power, installed accelerators, customer-ready compute, and actual utilization separate.
support_condition: Comparable operational records show negligible usable AI capacity additions across major providers, and customer, utilization, and order evidence shows that slow supply materially explains the apparent strength of demand.
contradiction_condition: Comparable records show substantial usable AI capacity additions across major providers, or show that strong unmet demand persists across diverse customers despite substantial additions. A single provider's power expansion challenges the claim but does not by itself settle the market-wide causal assertion.
measurement_requirements: Measure commissioned and customer-ready AI capacity during the target quarter, with consistent hardware or effective-compute units. Power capacity is only a proxy. Compare delivery schedules, utilization, customer concentration, and unmet orders.
source_requirements: Commissioning records, company operational disclosures, or independent capacity measurements, supplemented by customer-level demand evidence.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Ongoing state assigned to the latest completed reporting quarter.
  - Barely any and very slowly have no numerical thresholds.
  - Compute could mean energized infrastructure, installed accelerators, or usable processing capacity.
  - The comparison with announced capacity is implicit rather than specified.
  - Illusory demand has no stated measure.
