assessment_axis: historical_observation
explicit_source_elements:
  - Special-purpose AI
  - has been great
  - static, easily-simulated games
  - rules that have been stable for centuries
  - Chess, Go, and even Diplomacy
  - never been great
  - dynamic environments in which the environment itself is unpredictable
evaluator_interpretation:
  - Great means strong demonstrated performance against capable humans or an established operational baseline.
  - The positive game-performance assertion and the negative assertion about unpredictable environments are assessed separately.
  - Unpredictability must involve material uncertainty in the environment itself. Hidden opponent actions in an otherwise fixed simulator are not sufficient by themselves.
  - Special-purpose includes systems trained for a particular task even when their underlying learning algorithm is general.
  - Has been and never refer to the historical record through publication, with no stated lower date.
support_condition: Strong performance in the named games is established, while a sufficiently broad historical record supports the absence of strong performance in dynamic environments with material external uncertainty.
contradiction_condition: A pre-publication system demonstrates strong performance in a materially unpredictable dynamic environment. Evidence against the rule-history wording would separately contradict that component.
measurement_requirements: Specify the task, benchmark, environmental uncertainty, real-world versus simulated deployment, and restrictions on operation.
source_requirements: Primary performance reports, preferably peer-reviewed field experiments, and reliable historical records for claims about rule histories.
