ambiguity_flags:
  - Great has no specified threshold.
  - Unpredictable could mean ordinary environmental uncertainty or unrestricted changes in the nature of a task.
  - The military context suggests broader adaptability than the sentence's literal universal negative.
  - The centuries-long rule-history wording is a separate factual component.
