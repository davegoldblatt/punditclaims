evaluator_interpretation:
  - The approximate two-week period is November 9 through November 23, 2026.
  - The ordinary reading includes substantial declines in investors' holdings as well as realized trading losses. It does not require every investor to lose money.
  - No numerical threshold is supplied. Substantial losses must be evident without inventing a cutoff.
  - This is about investors' money, not Nvidia's corporate revenue, expenses, or accounting losses; metric_scope is therefore null.
support_condition: Market records and evidence of investor holdings establish substantial losses in investment value during the stated period, or credible records document substantial realized investor losses.
contradiction_condition: Reliable records directly rebut the asserted losses during this episode. A rebound or positive return for some investors alone cannot disprove losses for others.
measurement_requirements: Separate investment-value declines from realized losses, and losses during the period from losses accumulated before it.
source_requirements: Prefer dated market data and documented holdings or transactions. Treat litigation allegations as allegations.
