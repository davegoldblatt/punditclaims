explicit_source_elements:
  - Neurosymbolic AI
  - has long been an underdog
  - in the end
  - come from behind
  - be essential
evaluator_interpretation:
  - Assess the eventual-necessity forecast; the underdog description supplies its starting context.
  - In the surrounding discussion, the destination is advanced general AI with high-level metacognition, rather than success on any isolated task.
  - Neurosymbolic methods combine neural learning with explicit symbolic representations and operations.
  - Essential means required, not merely useful, successful or widely adopted.
  - In the end supplies no calendar deadline.
support_condition: Advanced general AI comes to depend on neurosymbolic methods, with credible architectural and causal evidence that their symbolic components are required for the relevant general capabilities.
contradiction_condition: A broadly validated advanced general AI system achieves the contextual capabilities without neurosymbolic methods, with sufficient architectural disclosure to establish their absence.
measurement_requirements: Broad capability evaluation, architectural documentation and ablations or equivalent causal evidence distinguishing necessity from helpfulness.
source_requirements: Primary technical disclosures and independent evaluations. Adoption, investment and isolated benchmark success cannot establish necessity.
metric_scope: null
original_horizon: in the end
