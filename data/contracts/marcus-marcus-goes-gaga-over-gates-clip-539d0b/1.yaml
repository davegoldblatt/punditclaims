  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon a dated, broadly validated general-AI achievement accompanied by evidence establishing either necessary dependence on neurosymbolic methods or successful operation without them. A specialized hybrid success is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
