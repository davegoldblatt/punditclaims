explicit_source_elements:
  - Technical advances on so-called “capabilities”
  - have NOT been accompanied by technical advances
  - interpret and control models
evaluator_interpretation:
  - The ordinary reading of the emphatic statement is that there have been no demonstrated technical advances in interpretation and behavioral control during the period of capability advances.
  - An advance can be partial and imperfect. It need not provide complete understanding, guaranteed safety, or progress equal to the pace of capabilities.
  - The surrounding discussion supplies late 2022 through publication as the retrospective period.
  - Control includes technical methods that reliably reduce prohibited model outputs, including system safeguards.
support_condition: The research record establishes an absence of substantive demonstrated progress in interpreting models and controlling their behavior during the stated period.
contradiction_condition: Published work demonstrates substantive technical improvements in interpreting models and controlling their behavior during the period.
measurement_requirements: Interpretability results must identify meaningful internal structure or causal mechanisms. Control results must demonstrate a behavioral improvement against a comparison condition, rather than merely announce a proposed method.
source_requirements: Primary research with described methods and demonstrated results. Developer research is admissible with its scope and limitations stated.
