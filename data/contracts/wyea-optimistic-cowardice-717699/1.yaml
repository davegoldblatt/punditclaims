assessment_axis: causal_assessment
explicit_source_elements:
  - To service its future revenue
  - must also build more data centers
  - will mean it needs more debt
  - any debt it raises must be used to repay it
evaluator_interpretation:
  - Assess the financing constraint asserted to exist on March 24, 2025, rather than an undated prediction of failure.
  - The ordinary reading of 'any debt' includes permitted new borrowing, not merely borrowing that violates the agreement.
  - Building capacity includes equipping leased facilities. It does not necessarily mean owning or constructing every building.
  - The monetary scope concerns the contractual use of borrowing proceeds. The post explicitly attributes that restriction to the company's loan terms.
support_condition: Contemporaneous disclosures establish the need for additional capacity and borrowing, and DDTL 2.0 requires all new borrowing proceeds to repay that facility.
contradiction_condition: The governing repayment requirement excludes permitted borrowing, or otherwise allows new borrowing proceeds to finance expansion. That would defeat the claimed financing trap even if expansion requires substantial capital.
measurement_requirements: Distinguish permitted from prohibited indebtedness, borrowing commitments from drawings, and construction funding from repayment of existing loans.
source_requirements: Contemporaneous loan agreements or the issuer's filed description of their terms.
