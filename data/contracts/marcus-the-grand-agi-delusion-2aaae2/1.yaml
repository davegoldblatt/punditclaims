assessment_axis: historical_observation
explicit_source_elements:
  - We aren’t close to AGI
evaluator_interpretation:
  - The ordinary reading is that AI remains substantially short of broadly human-level general cognitive competence.
  - Marcus does not define AGI, specify a capability threshold, or say how many years would count as close.
  - I use 2025 through the post date as the reporting period for this ongoing field-wide assessment. This is an evaluator-selected year-to-date window, not a deadline supplied by Marcus.
  - Failure to demonstrate AGI does not by itself establish that AGI is distant. Individual benchmark successes do not establish proximity either.
support_condition: Broad, contemporary capability evidence establishes a substantial remaining gap to general human-level competence, with a defensible connection between that gap and the ordinary meaning of not close.
contradiction_condition: A system available during the target period demonstrably achieves general human-level competence, or broad evidence establishes proximity using a defensible measure of the remaining gap.
measurement_requirements: Comparable human and AI evaluations across diverse cognitive tasks, including learning unfamiliar tasks, with an independently justified interpretation of proximity.
source_requirements: Primary evaluation reports and transparent benchmark methods. Forecasts and company assertions alone cannot establish capability proximity.
