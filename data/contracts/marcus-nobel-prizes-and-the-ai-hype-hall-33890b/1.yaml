  - 2019 prediction
  - next year for sure
  - over a million robotaxis on the road
  - not in all jurisdictions
evaluator_interpretation:
  - The ordinary reading is that the quoted promise remained substantially unfulfilled, rather than a precise comparison with radiologist replacement.
  - Next year in the quoted 2019 promise means 2020.
  - The target period covers the promised delivery year through Marcus’s publication date.
  - Robotaxis must operate autonomously; vehicles requiring an engaged driver do not satisfy the promise.
  - The jurisdiction caveat permits deployment in selected locations. It does not remove the numerical commitment.
support_condition: Authoritative records establish that Tesla had not delivered the promised million-plus autonomous robotaxis by 2020 and that the promise remained substantially unfulfilled before March 9, 2025.
contradiction_condition: Reliable deployment records establish delivery of over one million autonomous Tesla robotaxis by the promised 2020 deadline.
measurement_requirements: Count deployed autonomous robotaxis, not vehicles sold with hardware or supervised driver-assistance software.
source_requirements: Tesla disclosures, regulatory deployment records, or credible reporting establishing operational status and timing.
