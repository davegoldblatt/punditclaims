assessment_axis: historical_observation
explicit_source_elements:
  - If we assume 3GW of IT load capacity was brought online in America
  - should (theoretically) mean tens of billions of dollars of revenue
  - nobody appears to be showing massive amounts of revenue from these data centers
evaluator_interpretation:
  - The surrounding discussion identifies 2025 as the period for newly operating capacity and reported revenue.
  - The plain reading concerns realized revenue attributable to the newly opened US capacity, rather than all revenue of companies owning data centers.
  - "'Tens of billions' means at least approximately $20 billion in aggregate. This is an evaluator translation, not a precise threshold supplied by the speaker."
  - The text does not establish whether the theoretical revenue means revenue earned during 2025 or revenue from a full subsequent year of operation. These cannot be substituted for one another.
  - The 3GW premise is a hypothetical assumption in an observation, not a conditional forecast.
support_condition: Identify the roughly 3GW US commissioning cohort and establish plausible revenue using commissioning dates, utilization, hardware and realized prices. Comprehensive disclosures must then establish the claimed shortfall in reported revenue for that same cohort and period.
contradiction_condition: Comparable disclosures showing approximately $20 billion or more of realized 2025 revenue from the identified newly opened US capacity would contradict the reported shortfall. A validated capacity-to-revenue calculation could separately refute the theoretical expectation.
measurement_requirements: Track IT load rather than facility power, and distinguish colocation rent from GPU compute revenue. Account for commissioning dates, utilization and prices. Exclude older facilities, non-US facilities, financing, backlog and annualized run rates.
source_requirements: Facility commissioning records and operator disclosures allocating realized revenue to the same facilities and period, supplemented by documented utilization and pricing.
metric_scope:
  company: Operators of the assumed 3GW of newly commissioned US AI data center IT capacity
  metric: Revenue attributable to the newly commissioned US capacity
  currency: USD
  units: billions
  accounting_basis: company_reported
