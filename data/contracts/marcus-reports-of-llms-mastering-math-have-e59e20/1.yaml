assessment_axis: historical_observation
explicit_source_elements:
  - By now
  - naïve users expect
  - when they ask a question
  - a reliable answer
  - Reality is otherwise
evaluator_interpretation:
  - Naïve users means people without specialist prompting expertise, as specified by the surrounding paragraph.
  - Reliable means sufficiently accurate for ordinary users to depend on without expert correction; it does not mean every answer must be perfect.
  - The claim includes both an expectation among non-specialist users and a mismatch between that expectation and actual answer reliability.
  - For this ongoing state, I use January–March 2025, the latest completed calendar quarter before the post. Marcus supplies no reporting period.
  - Results from a narrow task can establish a reliability problem in that task, but cannot by themselves measure reliability across ordinary questions.
support_condition: Contemporaneous evaluations of ordinary prompts show substantial substantive errors across relevant tasks, and evidence about non-specialist users shows that they nevertheless expect dependable answers.
contradiction_condition: Matched evidence shows dependable performance across the relevant ordinary tasks, or shows that non-specialist users generally recognize the limits rather than holding the claimed expectation.
measurement_requirements: Identify model versions, question selection, prompting, substantive error criteria and user expertise. Keep trust, usage and measured answer accuracy separate.
source_requirements: Primary evaluations with disclosed methods and contemporaneous user research that identifies the relevant non-specialist population.
