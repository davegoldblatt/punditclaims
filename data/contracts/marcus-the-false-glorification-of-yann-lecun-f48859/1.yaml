evaluator_interpretation:
  - CNN refers to the broad architecture family, including shared-weight temporal networks as well as image networks.
  - Foundational architecture, backpropagation training, and later practical improvements are distinct contributions.
  - The historical comparison covers the early development described in the context, through 1989.
support_condition: Dated records establish a convolutional architecture before LeCun's work and backpropagation training of a qualifying convolutional network before his first such work.
contradiction_condition: The alleged predecessors lack the relevant architecture or training method, and reliable chronology establishes LeCun's priority for either asserted first.
measurement_requirements: Inspect local connectivity, shared weights, and the learning procedure; distinguish temporal from spatial convolution and experimental dates from publication dates.
source_requirements: Original technical records, supplemented by clearly identified first-person historical accounts.
