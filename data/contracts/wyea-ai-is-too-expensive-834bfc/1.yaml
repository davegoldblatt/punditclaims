assessment_axis: historical_observation
explicit_source_elements:
  - Said capacity is mostly taken up by OpenAI and Anthropic
  - burn billions of dollars
  - do not appear to have an answer for how they might stop
evaluator_interpretation:
  - Read 'said capacity' as operational AI computing capacity associated with the Microsoft, Google and Amazon investments discussed immediately before this sentence.
  - Read 'mostly' as more than half of that capacity, measured consistently across providers.
  - Use January–March 2026, the latest completed reporting quarter before publication, for the ongoing capacity and financial observations. This reporting convention does not establish that 'billions' means billions per quarter.
  - Read 'no apparent answer' as no publicly substantiated route to ending the losses. A commercial strategy is relevant, but its existence does not establish that it will succeed.
  - The financial language does not identify whether 'burn' means cash consumption, operating losses or net losses. No accounting basis can safely be assigned to that component.
support_condition: Comparable allocation records show that the two labs together used more than half of the specified operational capacity, financial records establish ongoing multibillion-dollar cash consumption on a clearly defined period and basis, and contemporary public plans provide no substantiated route to ending it.
contradiction_condition: Comparable allocation records show a combined share of half or less, or matching financial records disprove the claimed cash consumption. A substantiated contemporary route to ending losses would challenge the final component; an unsupported profitability target would not suffice.
measurement_requirements: Identify the providers, operational-capacity denominator, treatment of hosted inference and consistent capacity units. Separate cash burn from accounting losses and financing proceeds.
source_requirements: Provider allocation records or transparent independent estimates, financial disclosures for both labs, and their contemporary public business plans.
