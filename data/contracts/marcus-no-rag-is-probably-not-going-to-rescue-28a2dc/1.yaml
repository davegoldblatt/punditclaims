explicit_source_elements:
  - Investors put in over $100 billion
  - the driverless car industry
  - so far have little to show
evaluator_interpretation:
  - The investment assertion concerns cumulative capital invested through the post date. No starting date is supplied.
  - The ordinary reading of 'little to show' is limited commercial deployment and financial results relative to the investment, not literally no achievements.
  - The claim supplies neither an accounting basis nor a source for its investment figure. The contract therefore records the basis as unknown.
  - The target period covers the industry's history through February 23, 2024, because 'put in' and 'so far' describe cumulative investment and results.
support_condition: A comparably scoped investment total exceeds USD 100 billion, and industry-wide deployment and financial records show limited commercial results relative to that investment. The investment basis must first be established.
contradiction_condition: A comprehensive, comparably scoped total establishes investment of USD 100 billion or less, or industry-wide records establish substantial commercial results inconsistent with the ordinary reading of 'little to show'.
measurement_requirements: Separate investor financing from acquisitions, corporate development spending, announced commitments, and valuations. Distinguish fully driverless operations from driver assistance. Assess deployment, revenue, and investor returns separately.
source_requirements: Prefer investment datasets with disclosed coverage and methods, company filings, and official deployment records. Individual company results cannot establish the industry's aggregate return.
