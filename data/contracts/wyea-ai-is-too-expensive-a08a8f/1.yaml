ambiguity_flags:
  - No observation period is specified; the latest reported quarter is used.
  - The statement does not explicitly distinguish annualized revenue from realized annual revenue.
  - Twenty million may be a rounded milestone rather than an exact count.
  - Absolute maximum may describe only the stated hypothetical or may assert a ceiling on the actual business.
  - Discount availability does not identify uptake or the weighted average realized price.
