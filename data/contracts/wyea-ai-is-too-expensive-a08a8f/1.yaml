assessment_axis: historical_observation
explicit_source_elements:
  - 20 million Microsoft 365 Copilot subscribers
  - an absolute maximum revenue of $7.2 billion
  - if every single one were paying $30 a month
  - Microsoft has been offering discounts on it for years
evaluator_interpretation:
  - Read subscribers as paid Microsoft 365 Copilot seats, not unique active users.
  - Read $7.2 billion as an annualized subscription revenue calculation for a fixed current seat base, rather than revenue already earned in a fiscal year.
  - The arithmetic assumes exactly 20 million seats at $30 per month for twelve months.
  - The stronger assertion that actual annualized revenue is below that amount requires the exact seat count and effective prices after discounts and billing differences.
  - Use January–March 2026, the latest reported quarter before publication, as the observation period for the seat and pricing snapshot.
  - The if-clause is an arithmetic assumption, not a conditional forecast.
support_condition: The disclosed seat base and effective subscription prices establish an annualized revenue ceiling of $7.2 billion, with actual annualized revenue below it because discounts are used.
contradiction_condition: Comparable seat and effective-price data establish annualized subscription revenue above $7.2 billion, or establish that the asserted ceiling does not apply to the actual seat base and pricing.
measurement_requirements: Use paid seats, their actual billing terms, discount uptake, and subscription revenue allocation. Do not treat a rounded seat milestone as an upper bound or annualized arithmetic as realized annual revenue.
source_requirements: Microsoft seat disclosures and contemporaneous pricing, supplemented by effective-price or revenue data sufficient to establish the actual ceiling.
metric_scope:
  company: Microsoft
  metric: Annualized Microsoft 365 Copilot seat-subscription revenue
  currency: USD
  units: billions of dollars per year
