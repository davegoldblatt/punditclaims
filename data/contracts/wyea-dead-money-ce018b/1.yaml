early_resolution_rule: Resolve as supported when documented payments or binding financing terms establish at least $2 billion of additional rate-driven payments over specified contractual periods. Hypothetical refinancing, plans to borrow, and higher market yields alone do not meet the rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
