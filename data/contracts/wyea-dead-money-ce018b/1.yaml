assessment_axis: forecast_outcome
explicit_source_elements:
  - wars in Iran and Ukraine, inflation, and spiralling government debt
  - pushed interest rates up aggressively over the last few months
  - set to add billions of dollars in interest payments
  - across the tech and AI industry
evaluator_interpretation:
  - Assess the forward claim that higher rates add billions to interest payments, while retaining rate attribution as an essential part of the test.
  - The plain reading of 'billions' is at least $2 billion in aggregate additional interest payments.
  - No annual period is stated. The surrounding bond examples permit a cumulative comparison over the affected debt's contractual life; do not silently impose an annual threshold.
  - Compare payments on the same financing at higher rates with payments under the earlier-rate counterfactual. Increased principal alone does not establish the claim.
  - Existing fixed-rate debt does not acquire higher contractual payments merely because its secondary-market yield rises.
support_condition: A documented calculation or company disclosures establish at least $2 billion in aggregate additional interest payments caused by higher rates on issued, refinanced, or repriced tech and AI debt, using a defensible earlier-rate comparison.
contradiction_condition: A completed and sufficiently comprehensive accounting of the identifiable affected financing establishes that rate-driven additional payments remain below $2 billion over its contractual life. Failure to reach the threshold by an arbitrary interim date is insufficient.
measurement_requirements: Identify principal, repricing dates, rates, maturities, amortization, fees, and hedges. Separate rate effects from greater borrowing, accounting reclassifications, and interest income. Do not substitute annualized expense or secondary-market yield changes for cumulative incremental payments.
source_requirements: Issuer filings and financing contracts, or a transparent independent estimate grounded in those records. Broader causal attribution to wars, inflation, and government debt requires separate economic evidence.
metric_scope:
  company: Tech and AI industry borrowers
  metric: Aggregate additional interest payments attributable to higher borrowing rates
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: unknown
