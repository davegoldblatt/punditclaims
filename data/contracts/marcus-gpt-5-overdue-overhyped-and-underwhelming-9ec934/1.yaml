ambiguity_flags:
  - “GPT-5 level” has no stated capability threshold.
  - The dozens of development efforts and their targets are not identified.
  - “Adequately” supplies no required level of generalization.
  - “Principled” could mean a systematic current limitation or a stronger inherent limit; the assessment uses the former.
