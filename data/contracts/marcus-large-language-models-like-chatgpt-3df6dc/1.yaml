evaluator_interpretation:
  - The plain reading concerns outside researchers' access to OpenAI's collected ChatGPT error records, rather than access to the chatbot or independently collected examples.
  - The possible existence of internal tracking is hedged; the asserted absence of research access is the factual proposition being assessed.
  - For this ongoing access state, use the January 9, 2023 snapshot immediately before publication.
  - The statement about leaving science in the lurch is evaluative and is not separately scored.
support_condition: Dated access policies, company statements, or well-documented research-access records establish that OpenAI's collected ChatGPT error data were unavailable to outside researchers at the post date.
contradiction_condition: A documented release or research-access arrangement provided outside scientists access to that ChatGPT error collection, or a substantive part of it, by the post date.
measurement_requirements: Distinguish raw error or feedback records from aggregate descriptions, model access, earlier-model datasets, and third-party collections.
source_requirements: Contemporary release records, access policies, or documented researcher access or denial. Search silence alone cannot prove universal non-access.
