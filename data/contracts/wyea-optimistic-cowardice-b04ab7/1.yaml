evaluator_interpretation:
  - The ordinary commercial reading is that supplying generative AI does not cover its full costs and relies on continuing financial support.
  - I assess the financial assertion for October through December 2024, the latest completed calendar quarter before the post. The speaker does not identify a reporting period.
  - The claim concerns generative-AI businesses or activities, not the consolidated profitability of every company selling related infrastructure.
  - Questionably-useful expresses doubt about usefulness; it is not a categorical assertion that no user benefits.
  - Unsustainable is read as a claim about the existing commercial model, not a dated prediction of bankruptcy.
support_condition: Representative, comparable records show that generative-AI provision was loss-making after full costs and dependent on continued subsidy during the target period, with documented growth strategies explaining its promotion.
contradiction_condition: Representative, comparable records establish profitable, self-financing generative-AI provision during the target period. Revenue growth or one useful application alone does not contradict the financial assertion.
measurement_requirements: Matched generative-AI revenue and full costs, including training, inference and attributable overhead, together with financing dependence and documented corporate strategies.
source_requirements: Prefer separate business accounts and company strategy disclosures. Use independent studies to assess usefulness without treating productivity benefits as supplier profits.
