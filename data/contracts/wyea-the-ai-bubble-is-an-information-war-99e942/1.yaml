assessment_axis: historical_observation
explicit_source_elements:
  - "Q3 2025: $1.36bn revenue on 590MW, about $2.3m per megawatt"
  - "Q4 2025: $1.57bn revenue on 850MW, about $1.847m per megawatt"
  - "\"somewhat-inexact calculation\": we don't know how much compute was producing revenue or when it came online"
  - '"underlying business appears to be weakening as it adds capacity"'
evaluator_interpretation:
  - "The claim has two parts. (1) Factual: quarterly revenue divided by active power fell from Q3 to Q4 2025. (2) Inferential: the fall means the underlying business was weakening, not just a timing effect."
  - I check part 1 with company-reported figures, using quarter-end capacity as he did and also average or start-of-quarter capacity as robustness checks.
  - For part 2, I take the company's account of when capacity came online and how fast revenue ramped as the main evidence for or against reading the ratio as a sign of weakness.
support_condition: Revenue per MW of active power fell from Q3 to Q4 2025, and nothing credible shows the fall was mainly a timing artifact of capacity coming online late in the quarter.
contradiction_condition: Revenue per MW did not fall, or credible evidence shows the fall mainly reflects new capacity coming online near quarter-end before revenue ramped, not weaker pricing or demand.
measurement_requirements: Quarterly revenue (Q3 and Q4 2025) and active power at the start and end of each quarter; company statements on deployment timing.
source_requirements: CoreWeave earnings releases and earnings call transcripts; reputable news summaries of them.
metric_scope:
  company: CoreWeave
  metric: Quarterly revenue per megawatt of quarter-end active power
  currency: USD
  units: millions of USD per MW
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2025-07-01
  period_end: 2025-12-31
