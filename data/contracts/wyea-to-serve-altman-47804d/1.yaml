evaluator_interpretation:
  - The checkable commitment is that investment funding and cloud-credit support will eventually cease or become materially unavailable.
  - Questions about survival do not amount to an explicit prediction of bankruptcy.
  - Medium-to-long term does not supply a calendar deadline. The separate two-year hypothesis is not imported into this forecast.
  - A reduction in funding, a change of investor or paid access to cloud services does not establish the cessation of both forms of support.
  - No financial reporting basis, currency or amount is specified.
support_condition: Dated evidence establishes sustained cessation or unavailability of both investment funding and cloud-credit support.
contradiction_condition: A decisive event establishes that the forecast can no longer occur under its stated scope. Continued financing at a finite date alone cannot disprove an undated eventual prediction.
measurement_requirements: Track investment receipts and credit support separately; distinguish commitments, received funds, cloud purchases and cloud credits.
source_requirements: Prefer investor disclosures, company announcements and documented cloud-contract terms.
