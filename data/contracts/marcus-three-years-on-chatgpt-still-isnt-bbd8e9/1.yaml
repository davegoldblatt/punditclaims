assessment_axis: historical_observation
explicit_source_elements:
  - Amateurs can ... now build prototypes
  - auto-generated code tends to be shaky
  - few amateurs can make those prototypes robust
evaluator_interpretation:
  - Amateurs means people without substantial software-development expertise.
  - Shaky means recurring functional, security, or maintenance defects beyond a successful demonstration.
  - Robust means reliable operation under realistic use, including testing, error handling, security, and maintenance.
  - Few means a small minority; Marcus supplies no numerical cutoff.
  - For this ongoing observation, I use July–September 2025, the latest completed calendar quarter before publication. The quarter is an evaluator convention, not a period stated by Marcus.
support_condition: Relevant studies show that amateurs can create working prototypes, that defects commonly remain, and that only a small minority can independently bring comparable prototypes to robust operation.
contradiction_condition: Representative evidence shows that amateurs commonly produce and independently harden comparable applications to robust operation, or that the claimed recurring defects are uncommon.
measurement_requirements: Identify participants' prior expertise, tools and task difficulty. Test resulting applications independently and follow attempts at hardening them. Measure the proportion succeeding rather than relying only on anecdotes or self-reports.
source_requirements: Direct studies of amateur developers and their applications, with methods and observation dates. Professional-developer benchmarks and general code-security studies are context only.
