assessment_axis: historical_observation
explicit_source_elements:
  - Amateurs can in fact now build prototypes
  - the auto-generated code tends to be shaky
  - few amateurs can make those prototypes robust
evaluator_interpretation:
  - Amateurs means people without professional software-development expertise, including non-programmers and beginners.
  - A prototype demonstrates intended functionality. Robust means sufficiently correct, secure and dependable for its intended real use, including foreseeable errors and edge cases.
  - Tends to be shaky means quality problems are common, rather than merely possible. Few means successful hardening is uncommon among amateurs attempting it; no exact percentage is imposed.
  - Use November 1–29, 2025, the latest month-to-publication window for the ongoing observation. Include developments through publication rather than stopping in September.
  - Earlier studies and later publications can inform the assessment, but only observations tied to the target period can decide its contemporary prevalence claims.
support_condition: Studies show amateurs producing functional prototypes, commonly encountering material generated-code defects, and only a small share successfully making those prototypes dependable for their intended use.
contradiction_condition: Representative evaluations show amateurs routinely producing dependable applications or successfully hardening prototypes, with material generated-code problems uncommon.
measurement_requirements: Report participants’ prior expertise, tools and versions, task difficulty, independent functional and security testing, and the share of amateurs succeeding after a reasonable opportunity to harden their prototypes.
source_requirements: Prefer empirical studies with dated observations and inspected artifacts. Demonstrations, anecdotes and studies of professionals alone cannot establish the prevalence among amateurs.
