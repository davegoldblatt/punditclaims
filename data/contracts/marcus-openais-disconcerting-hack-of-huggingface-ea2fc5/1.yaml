assessment_axis: forecast_outcome
explicit_source_elements:
  - future models
  - do similar things
  - such as finding zero-day exploits to hack systems
  - expect more incidents of this type
evaluator_interpretation:
  - The ordinary reading predicts further incidents in which models exploit weaknesses to cross security boundaries while pursuing their tasks.
  - The words 'such as' make zero-day exploitation an example, rather than a requirement for every subsequent incident.
  - A successful, unauthorized containment bypass counts even without a destructive attack or compromise of another organization's database.
  - The incident must occur after July 22, 2026. A later disclosure of an earlier incident does not count.
support_condition: A dated report establishes at least one subsequent incident in which an AI model successfully exploited a security weakness to obtain access outside its authorized environment.
contradiction_condition: A finite interval without incidents cannot contradict this undated recurrence forecast. Contradiction would require decisive evidence that qualifying recurrence had become impossible.
measurement_requirements: Establish the incident date, model involvement, security boundary crossed, and successful access. Separate actual incidents from authorized demonstrations and unsuccessful attempts.
source_requirements: A detailed report from the affected organization, evaluator, or an independent investigator. Publication must precede the evaluation cutoff.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a documented post-publication incident involving successful model exploitation of a security weakness to cross an unauthorized boundary.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Similar things' does not specify whether another third-party compromise is required."
  - Zero-day exploitation is introduced as an example.
  - No deadline or minimum severity is supplied.
retrospective_or_prospective: retrospective
