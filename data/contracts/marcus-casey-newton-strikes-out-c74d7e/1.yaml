explicit_source_elements:
  - neural networks would have trouble
  - abstract reasoning and outlier cases
  - held steady for the last 26 years
  - including the recent Apple study
evaluator_interpretation:
  - The ordinary reading is that difficulties learning abstract rules and applying them outside familiar training examples persisted from 1998 through the post.
  - Held steady means the difficulty remained, rather than that performance never improved or every neural network failed every reasoning task.
  - Outlier cases are evaluated through unfamiliar inputs and distribution shifts, not just ordinary test-set accuracy.
  - The supplied proposition concerns the technical record. Establishing Marcus's authorship of a 1998 warning would be a separate attribution check.
support_condition: Independent research spanning the period documents recurring failures to generalize rules to unfamiliar cases, with relevant failures still present in 2024.
contradiction_condition: Evidence establishes that the stated generalization difficulty had been broadly overcome by the post. Success on individual tasks alone does not contradict persistent difficulty.
measurement_requirements: Inspect task design, training exposure and performance on unfamiliar examples. Separate demonstrated failures from speculation that neural networks cannot reason at all.
source_requirements: Independent primary research, including the original 2024 Apple evaluation, with successful neural-network results considered as counterevidence.
