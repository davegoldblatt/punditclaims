evaluator_interpretation:
  - Read AI in the surrounding context as the recent generative AI boom.
  - The first clause concerns substantial actual worker displacement, not exposure estimates or equivalent workloads.
  - The second clause concerns poor operational results where AI took over displaced workers' work.
  - Use January through February 2024, the latest completed monthly reporting window available before publication.
support_condition: Evidence shows limited actual displacement and generally poor operational outcomes in documented replacement deployments.
contradiction_condition: Evidence establishes substantial actual displacement, or a sufficiently broad record of successful replacement deployments contradicts the characterization of their results.
measurement_requirements: Separate announced cuts from completed layoffs, AI from other automation, and task assistance from worker replacement. Evaluate operational outcomes against the prior human service.
source_requirements: Prefer labor-market measurements and documented staffing changes linked to operational evaluations. Disclose geographic limits and company self-reporting.
