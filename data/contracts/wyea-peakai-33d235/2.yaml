assessment_axis: historical_observation
explicit_source_elements:
  - Despite fears to the contrary
  - AI does not appear to be replacing a large number of workers
  - when it has, the results have been pretty terrible
evaluator_interpretation:
  - The claim has two parts. Part 1 is hedged ('does not appear to be'). It holds if the best public data at the time showed AI being cited for only a small share of job cuts. It does not require proof that no displacement was happening.
  - Part 2 is firm. It holds if the known cases where firms replaced workers with AI before the post went badly. It fails if a prominent known case was reported, at the time, as going well.
  - "Target period: from the start of 2023, the first full year of the generative AI boom he is discussing, to the post date. This is my reading of a present-tense claim made without a named period."
support_condition: "Part 1: labour data from 2023 to early 2024 show AI cited for only a small share of announced job cuts. Part 2: the documented replacements of workers with AI in that period had poor results."
contradiction_condition: "Part 1: data show AI was cited for a large share of job cuts by early 2024. Part 2: a prominent documented replacement in the period was reported as working as well as or better than humans."
measurement_requirements: Announced job cuts attributed to AI against total announced cuts. Reported outcomes of named cases where AI replaced workers.
source_requirements: Labour-market trackers such as Challenger, Gray & Christmas. Company disclosures and reputable news reports on specific replacement cases.
