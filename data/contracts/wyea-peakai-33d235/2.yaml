original_horizon: null
horizon_interval: null
target_period:
  start: 2023-01-01
  end: 2024-03-18
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'does not appear to be' hedges the first clause, so it is judged on the evidence visible at the time, not on hidden displacement"
  - "'a large number' has no threshold"
  - "'pretty terrible' has no measure, and it is unclear which cases he counts as replacements"
  - Target period was chosen by the evaluator, because the claim names no period
