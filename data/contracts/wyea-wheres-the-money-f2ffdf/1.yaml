explicit_source_elements:
  - Microsoft and Google
  - Copilot and Gemini
  - consumers
  - categorically, unquestionably failed
  - burning billions of dollars to do so
evaluator_interpretation:
  - The ordinary reading is that both consumer products failed to achieve meaningful sustained adoption despite billions spent on their consumer pushes.
  - Enterprise Copilot sales, GitHub Copilot, and general cloud demand do not directly settle this consumer claim.
  - Use January 2025 for consumer adoption, as specified by the surrounding figures, and October–December 2024 as the latest reported quarter for ongoing spending. The combined target interval covers both.
  - Read burning billions as spending, consistent with the surrounding capital-expenditure discussion, rather than as a separately quantified net loss.
  - The surrounding discussion cites company financial figures, so the spending basis is company_reported. Allocation of that spending to consumer adoption remains unproved.
  - No numerical adoption threshold is added.
support_condition: Comparable evidence establishes failed sustained consumer uptake for both products and billions in spending attributable to those consumer efforts.
contradiction_condition: Comparable evidence establishes substantial sustained consumer adoption for either product, defeating the assertion that both categorically failed, or complete attributable spending records disprove the billions claim.
measurement_requirements: Consumer-only, deduplicated active users and retention across relevant surfaces, plus spending specifically allocated to the consumer products. Do not allocate all corporate or cloud capital expenditures to consumer adoption.
source_requirements: Primary usage measurements and product-attributable financial records, or credible estimates explaining their allocation method.
