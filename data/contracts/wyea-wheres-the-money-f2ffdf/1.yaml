  - Consumer product boundaries are unclear where assistants are bundled into other software.
  - Burning may mean expenditure or net losses; the surrounding capex discussion favors expenditure.
  - No allocation of shared infrastructure spending to the consumer products is supplied.
  - The latest reported spending quarter is an evaluator choice; January is the explicit adoption month.
