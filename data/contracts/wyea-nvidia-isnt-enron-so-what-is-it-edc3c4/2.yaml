explicit_source_elements:
  - Meta, Amazon, Google and Microsoft
  - already years and hundreds of billions of dollars in
  - yet to see a dollar of profit
  - a $1.21 trillion hole just to justify the expenses
  - around $605 billion in capex all told
  - at the time I calculated it
  - I estimate that big tech needs to make $2 for every $1 of capex
evaluator_interpretation:
  - Profit means profit attributable to the AI activities discussed, after their attributable costs. Consolidated company profit does not settle this assertion.
  - The passage also concerns recovery of cumulative AI investment. Positive profit in a reporting period and recovery of all historical investment are separate tests.
  - The $1.21 trillion figure is an estimated revenue requirement derived from the speaker's capex estimate and multiplier. 'Hole' could mean either that gross requirement or the remaining shortfall after revenue already earned; neither meaning is imposed exclusively.
  - The cumulative observation extends through an unspecified calculation date no later than the post. Its starting date is unknown. December 8 is an outer boundary, not an asserted calculation date.
  - For the ongoing profitability component, the latest reported quarter before publication is the quarter ended September 30, 2025. That quarter is not substituted for the unspecified cumulative capex period.
  - The metric scope records the estimated revenue requirement. The accompanying profit assertion has no stated accounting basis.
support_condition: Records establish the relevant cumulative AI capex at approximately $605 billion, substantiate the two-to-one revenue requirement, and show no positive AI-attributable profit for the four companies over the period asserted. If 'hole' means a remaining shortfall, the calculation must also account for revenue already earned.
contradiction_condition: Comparable records establish positive AI-attributable profit for a named company during the asserted period, or materially disprove the cumulative capex or revenue-requirement calculation. Company-wide profits, broad cloud profits, and positive revenue alone are insufficient. Evidence about a residual shortfall cannot by itself disprove a gross revenue requirement.
measurement_requirements: AI-specific revenue, attributable operating costs, depreciation, financing costs, and cumulative capital investment, with consistent treatment of leases and shared infrastructure. The spending window, recovery period, multiplier assumptions, and treatment of revenue already earned must be identified.
source_requirements: Company disclosures or reliable underlying financial records covering all four companies. Estimates must disclose their inputs and allocation methods. Missing AI profit disclosure is not evidence of zero profit.
