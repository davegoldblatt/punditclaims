  - around $605 billion in capex
  - at the time I calculated it
evaluator_interpretation:
  - In context, profit refers to profit attributable to AI investment, not the companies' total profits.
  - The ordinary reading asserts both an absence of positive AI-attributable profit and a remaining revenue requirement associated with the stated cumulative capex.
  - The monetary gap is the speaker's estimate, linked to the preceding revenue multiplier; it is not presented as a reported balance-sheet liability.
  - Treat the assertion as cumulative through September 30, 2025, the latest pre-post reporting endpoint. Leave the starting date unspecified because years and the calculation date do not identify it.
  - Accounting profit and recovery of the original cash investment must be tested separately.
support_condition: Matched AI revenue and attributable costs substantiate the absence of positive profit for each named company, while a reproducible cumulative AI-capex and revenue-recovery calculation substantiates the stated remaining gap.
contradiction_condition: Matching evidence establishes positive AI-attributable profit at a named company, or comparable cumulative investment and recovery data materially refute the stated gap. Broad company or cloud profits alone do not qualify.
measurement_requirements: Identify the cumulative investment interval, AI scope, profit definition, accounting basis, and attributable expenses. Establish a remaining gap after applicable revenues and benefits, rather than only a gross revenue target.
source_requirements: The four companies' AI-specific disclosures or independently reproducible reconciliations of their filings. Management descriptions of returns are relevant but insufficient without matching amounts and definitions.
