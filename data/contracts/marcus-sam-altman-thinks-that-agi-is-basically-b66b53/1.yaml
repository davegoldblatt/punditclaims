  - No fixed reporting interval is imposed on this causal claim.
support_condition: Contemporary evaluations and verified incidents establish recurring failures across the listed categories, identify relevant public assurances, and connect those failures to inadequate factual records or access rather than merely documenting erroneous outputs.
contradiction_condition: Reliable contemporary evidence shows that the alleged recurring failure pattern does not hold, or comparative investigations reject the proposed contributing mechanism. Accurate outputs, improvements, or unsuccessful individual lawsuits alone do not contradict the ordinary reading.
measurement_requirements: Record model versions, task types, dates, independently checked errors and evaluation denominators. Distinguish fabricated facts from misread sources, outdated information and repeated unreliable source material. Separate alleged defamatory output from proven legal liability.
source_requirements: Contemporary primary evaluations, documented outputs, court records and company disclosures. Firsthand reporting may establish incidents, but cannot alone establish their architectural cause or population frequency.
