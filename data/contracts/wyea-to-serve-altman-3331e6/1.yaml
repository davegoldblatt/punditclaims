explicit_source_elements:
  - OpenAI
  - in its current form
  - is untenable
evaluator_interpretation:
  - The plain reading is that OpenAI's existing business model could not sustain operations without substantial changes. Merely making a loss does not establish this.
  - Use April–June 2024, the latest completed quarter before publication, for the ongoing financial state. This is an evaluator-selected reporting period, not a period Zitron specified.
  - The surrounding financial argument relies on press estimates, so the financial accounting basis is estimate.
  - Do not import the separate survival forecast's deadline into this observation.
support_condition: Contemporaneous financial and contractual evidence establishes that the existing business model lacked a feasible way to cover operating cash needs, including reasonably available financing, without substantial changes.
contradiction_condition: Comparable evidence establishes a feasible, adequately financed continuation of the existing business model without the substantial changes asserted to be necessary.
measurement_requirements: Reconcile operating losses, cash burn, available cash, financing commitments, cloud credits and realized revenue. Revenue growth or a funding announcement alone cannot establish sustainability.
source_requirements: Prefer financial statements and financing agreements. Clearly identified press estimates may provide context, but must not be treated as audited accounts.
