assessment_axis: causal_assessment
explicit_source_elements:
  - everybody is losing money on generative AI
  - in part because the cost of running AI models is increasing
  - the software itself doesn’t do enough to warrant the costs
  - subsidized and unprofitable for the model providers
evaluator_interpretation:
  - Everybody means commercial providers of generative AI models and applications in the surrounding software discussion.
  - Losing money means that attributable generative AI revenues fail to cover attributable business costs. Parent-company profits and gross margins alone do not establish this.
  - Use April through June 2025, the latest completed calendar quarter ordinarily reportable before publication, for the ongoing financial state.
  - The cost statement concerns actual delivery expenditure, allowing for workload and usage changes. API prices at fixed capability are a different measure.
  - "Does not warrant the costs is read economically: realized monetization does not cover delivery costs. The claim supplies no separate test of subjective usefulness."
  - No accounting basis for the universal loss assertion is identified.
support_condition: Comparable financial evidence establishes losses across the stated provider population and shows that rising delivery expenditure and inadequate monetization materially contribute to those losses.
contradiction_condition: Comparable evidence establishes a profitable provider within the stated population and period, or directly refutes the claimed cost mechanism. Falling API prices alone do not refute rising total expenditure.
measurement_requirements: Generative AI revenue and attributable costs, consistent treatment of free users and research spending, and a decomposition separating price, usage, workload complexity, and other causes of losses.
source_requirements: Company or segment accounts and documented operating-cost changes. Benchmark prices and company statements without accounts are context.
