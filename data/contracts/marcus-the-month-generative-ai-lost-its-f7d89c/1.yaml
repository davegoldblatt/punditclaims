ambiguity_flags:
  - “Not as kind” specifies neither a measure nor a threshold.
  - “With” implies contributing causes but does not specify their relative importance.
  - June was incomplete at publication; this assessment uses June through June 26.
  - Tokenmaxxing has no specified baseline or quantitative definition.
