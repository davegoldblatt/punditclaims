assessment_axis: forecast_outcome
explicit_source_elements:
  - if NVIDIA misses on earnings estimates
  - the markets will crap their pants
evaluator_interpretation:
  - Read an earnings miss as quarterly earnings per share below the contemporaneous analyst consensus, comparing figures on the same accounting basis. A revenue or guidance miss alone does not qualify.
  - Read the predicted reaction as a sharp, broad stock-market selloff accompanied by heightened volatility. NVIDIA shares alone would not establish market-wide panic.
  - Examine the announcement and the first two full trading sessions afterward. This reaction window is an evaluator choice.
  - The claim predicts a market response, rather than a particular company financial amount; metric_scope is therefore null.
  - The specific rule for conditional forecasts governs the outcome if the antecedent has not happened. An unmet condition makes this not adjudicable at the freeze, while its undated horizon remains open.
support_condition: A verified NVIDIA earnings miss after publication, followed immediately by a sharp broad-market selloff and heightened volatility credibly linked to the miss.
contradiction_condition: A verified NVIDIA earnings miss after publication, followed by calm or rising broad markets and no substantial volatility increase through the immediate reaction window.
measurement_requirements: Compare reported EPS with the pre-release consensus on a matching accounting basis. Following a qualifying miss, examine NVIDIA shares, the S&P 500, the Nasdaq Composite and market volatility from the pre-release close through the next two full trading sessions. Consider competing news. Borderline reactions remain unresolved because no numerical panic threshold was supplied.
source_requirements: Prefer NVIDIA disclosures for reported earnings, a dated consensus provider or reputable contemporaneous reporting for estimates, and exchange or index-provider records for market reactions. News reports may establish the earnings comparison when primary records are unavailable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_met
early_resolution_rule: A post-publication earnings miss followed by a completed immediate reaction window can settle the forecast if the broad-market response unambiguously meets the support or contradiction condition. Market moves without an earnings miss cannot settle it.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No consensus provider or earnings accounting basis specified.
  - Markets does not identify particular indexes or countries.
  - Panic has no numerical threshold.
  - No reaction window specified.
retrospective_or_prospective: retrospective
