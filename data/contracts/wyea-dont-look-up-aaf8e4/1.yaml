assessment_axis: causal_assessment
explicit_source_elements:
  - future growth trajectories of Amazon, Google and Microsoft
  - Oracle, CoreWeave, and every other neocloud
  - contingent on the continued ability for Anthropic and OpenAI to raise
  - have the demand necessary to spend that money
evaluator_interpretation:
  - The ordinary reading is that expected corporate growth materially depends on financing and spending by the two labs, not that every business line requires their payments.
  - Assess the claimed dependency in growth expectations at publication. This is a causal claim about projections, rather than a forecast of a particular financing failure.
  - The reference to every neocloud is broad and must not be established from CoreWeave alone.
  - No numerical definition of growth trajectory or material dependence is supplied. Do not invent a percentage cutoff.
support_condition: Customer-level forecasts and financing sensitivity analyses show that losing the labs' funding or demand would prevent the expected growth trajectories across the named companies and the broader neocloud class.
contradiction_condition: Credible customer-level forecasts or observed substitutions establish that expected growth can be maintained independently of the labs' continued funding and spending for a material part of the asserted scope.
measurement_requirements: Company-specific projected revenue growth attributable to each lab; financing and demand assumptions; direct and indirect exposure; replacement demand; and effects on consolidated growth.
source_requirements: Contemporaneous company forecasts, customer contracts, independently attributable analyst models and lab financial records. Contracts alone do not establish realized revenue or the causal effect of a financing interruption.
