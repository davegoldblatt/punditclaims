assessment_axis: historical_observation
explicit_source_elements:
  - I think
  - the AI startups
  - are misleading their investors and the general public
  - about their revenues
evaluator_interpretation:
  - This is a factual allegation of materially misleading revenue communications, qualified by 'I think'. It does not require proof of criminal fraud.
  - The context identifies OpenAI, Anthropic, and Cursor as examples, while alleging a wider startup practice.
  - For the ongoing observation, use January–March 2026, the latest completed quarter before the post. Earlier financial results may help reconcile representations made during that quarter.
  - A disclosed annualized run rate exceeding past realized revenue is not, by itself, misleading. The representation must be compared with what its stated metric measures.
  - Evidence concerning isolated unnamed startups cannot establish the allegation against the named companies or the sector generally.
support_condition: Contemporaneous investor or public representations, matched to underlying records and metric definitions, demonstrate material overstatement or material omissions at named startups or across a defensibly representative group.
contradiction_condition: A sufficiently complete reconciliation demonstrates that the alleged discrepancies are explained by accurately disclosed metrics, periods, and accounting treatments across the relevant companies and communications.
measurement_requirements: Match company, communication date, reporting period, realized versus annualized revenue, booked versus active contracts, and gross versus net treatment.
source_requirements: Prefer original public statements, investor materials, contracts, financial disclosures, or findings grounded in those records. Anonymous or unnamed allegations alone are insufficient.
