assessment_axis: historical_observation
explicit_source_elements:
  - neurosymbolic AI is out of fashion
  - neither well-developed
  - nor strongly supported by the VC world
evaluator_interpretation:
  - Assess the three firm observations, not the separate suggestion that neurosymbolic AI might offer a better solution.
  - The ordinary reading is that neurosymbolic AI occupied a marginal position relative to mainstream neural AI, lacked mature broadly usable systems, and attracted comparatively weak venture backing.
  - The claim concerns the field, not the finances of a named company, so metric_scope is null.
  - Use the current public state during early 2023 through the post date. Earlier research and investments can provide background but cannot alone establish that state.
support_condition: Comparable evidence establishes low prominence, limited system maturity, and weak venture support for neurosymbolic AI during the target period.
contradiction_condition: Comparable evidence establishes substantial mainstream prominence, mature broadly deployed systems, or strong field-wide venture backing, contradicting the corresponding component.
measurement_requirements: Define the field consistently. Compare research prominence, demonstrated maturity, and venture investment separately against an explicit mainstream-AI comparator. Individual papers or funding rounds are insufficient to establish field-wide strength.
source_requirements: Research surveys and evaluations, publication or adoption data, and investment records with consistent category definitions and historical coverage.
