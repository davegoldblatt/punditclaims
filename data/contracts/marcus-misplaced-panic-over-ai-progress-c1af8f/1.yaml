evaluator_interpretation:
  - The target is the METR-style task-completion horizon discussed in the post, measured in human task-completion time.
  - The astronomical quantity is a capability threshold, not a calendar deadline.
  - Absolutely sure expresses confidence, not an antecedent condition.
  - The prediction is that the doubling process breaks before reaching the stated threshold. A temporary noisy estimate or exhausted benchmark does not establish that break.
support_condition: A decisive capability ceiling or lasting structural break prevents the comparable task-horizon doubling process from reaching 580 times the age of the universe.
contradiction_condition: Validated, comparable successive task-horizon doublings reach at least 580 times the age of the universe without the predicted break.
measurement_requirements: Maintain the same success-probability interpretation and human-time units. Astronomical extrapolations or repeated independent short tasks cannot substitute for validated coherent task horizons.
source_requirements: Primary evaluation records with documented measurement validity, plus an authoritative age-of-universe estimate if numerical threshold conversion becomes necessary.
