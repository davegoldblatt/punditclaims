assessment_axis: causal_assessment
explicit_source_elements:
  - humans update their views partly based on social evidence
  - looking to peers to see what is 'normal'
  - fabricated swarms can make fringe views look like majority opinions
evaluator_interpretation:
  - This is a 'can' claim about a mechanism. It holds if credible studies show that fabricated or coordinated fake voices can shift people's sense of what most others think, or can tip the perceived opinion climate toward a minority view.
  - Lab experiments with fabricated comment streams and peer-reviewed simulations of bot participation count as evidence of the mechanism. A field study of AI swarms is not required for a 'can' claim.
  - The target period spans the research base on this standing mechanism, up to the post date.
support_condition: Peer-reviewed or credible studies show that fabricated voices (such as manipulated comment streams or bots) shift perceived consensus or tip the opinion climate toward a minority view.
contradiction_condition: Rigorous studies find that fabricated or bot-generated consensus does not change people's sense of majority opinion, or that people reliably discount it.
measurement_requirements: Perceived consensus or perceived majority opinion, measured after exposure to fabricated voices, or simulated shifts in opinion climate driven by bots.
source_requirements: Peer-reviewed studies or reputable reports of them.
