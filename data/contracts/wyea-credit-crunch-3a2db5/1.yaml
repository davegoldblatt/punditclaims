explicit_source_elements:
  - US data center debt issuance
  - it’s had some effect
  - isn’t the big reason
  - the ten-year is selling off
evaluator_interpretation:
  - The claim concerns the Treasury sell-off underway when the post appeared on October 6, 2026. Its starting date is unspecified.
  - The plain reading is that data-center borrowing contributed positively to rising ten-year Treasury yields, but other causes were more important.
  - Evidence against issuance being the principal cause does not, by itself, establish the separate assertion that issuance had some effect.
support_condition: Credible attribution evidence for the sell-off identifies a positive contribution from data-center debt issuance and shows that other drivers were more important.
contradiction_condition: Credible attribution evidence identifies data-center debt issuance as the principal driver, or establishes that it made no positive contribution.
measurement_requirements: Separate issuance effects from policy-rate expectations, inflation, Treasury supply and other macroeconomic changes. Distinguish direct portfolio competition from effects of AI investment on economic demand.
source_requirements: Prefer documented market studies with dated data and methods. Issuance totals and coincident yield increases alone do not establish causation.
