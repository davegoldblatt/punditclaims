evaluator_interpretation:
  - The subject is the original M concierge service during its pilot, through its January 2018 shutdown.
  - Requests served by AI means requests handled automatically without a human completing them. It does not include every request on which software assisted a human.
  - The percentage concerns overall request handling, not a selected task category or the separate M Suggestions feature.
support_condition: Operational records or credible contemporaneous reporting establish that M's overall autonomous request-handling rate did not exceed 30% during the pilot.
contradiction_condition: Comparable operational records or credible reporting establish an overall autonomous request-handling rate above 30% during the pilot.
measurement_requirements: The denominator must concern requests to the original M service. Partial automation of individual steps and performance on selected tasks cannot establish the overall rate.
source_requirements: Prefer Facebook operational disclosures. Contemporaneous original reporting is acceptable, with estimates and anonymous sourcing identified.
