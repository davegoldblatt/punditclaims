assessment_axis: historical_observation
explicit_source_elements:
  - most LLM developers
  - losing money
evaluator_interpretation:
  - Most means more than half of developers by company count, not by revenue or funding.
  - The ordinary reading is that developers are unprofitable after expenses. Cash consumption alone does not establish this.
  - Use the first half of 2025 as the latest comparable financial reporting interval available before publication for the private developers discussed in context.
  - The population must include a defensible set of LLM developers rather than a selection of prominent loss-making startups. The wording does not specify an accounting basis.
support_condition: Comparable profit-and-loss results establish that more than half of a defensibly defined developer population lost money during the target period.
contradiction_condition: Comparable results establish that half or fewer of that population lost money during the target period.
measurement_requirements: A defined denominator, company-level results covering the same period, and a consistent profitability measure. Do not substitute cash burn, financing needs, or product gross margins for company profit.
source_requirements: Prefer financial statements. Where these are unavailable, financial reporting must identify its underlying documents and distinguish estimates from reported results.
