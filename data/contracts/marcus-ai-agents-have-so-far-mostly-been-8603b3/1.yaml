  precision: month
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Explicitly hedged as a guess ('if I had to guess').
  - "'Alternative approaches like neurosymbolic AI' is an undefined category; it could include world models or other non-LLM work."
  - "'Total investments' is undefined: venture funding only, or all AI spending including big-tech capex."
  - No period stated; the time of the post is assumed.
  - Neurosymbolic work inside big labs (for example DeepMind) cannot be separated from their overall spending.
