assessment_axis: historical_observation
explicit_source_elements:
  - alternative approaches like neurosymbolic AI
  - continue to be wildly underfunded
  - if I had to guess
  - maybe 1%, probably less
  - of total investments
evaluator_interpretation:
  - "Plain reading: at the time of the post, money going to neurosymbolic AI (and similar non-LLM approaches) was about 1% or less of total AI investment."
  - "'Total investments' is read as total AI investment. That could mean venture funding into AI or AI spending more broadly, including big-tech capex. Venture funding is the narrowest denominator, so it is the one most favourable to testing the 1% ceiling."
  - No period is named. It describes the state at the time of the post, so the target period is calendar 2025 up to the post date (2025-01 to 2025-08). That is the latest period funding data could report on.
  - "'Wildly underfunded' is a value judgement and is not scored. Only the roughly-1%-or-less share is checkable."
support_condition: A credible tally of 2025 funding for neurosymbolic or other non-LLM alternative approaches shows it at about 1% or less of total AI investment for the same period.
contradiction_condition: A credible tally shows neurosymbolic or alternative-approach funding clearly above about 1% of total AI investment in 2025, for example well over 2%.
measurement_requirements: Funding dollars for neurosymbolic AI or non-LLM alternatives, divided by total AI investment, for the same 2025 period, from a dataset that defines the category.
source_requirements: A venture database (PitchBook, Crunchbase, CB Insights, Dealroom) or an independent study that tags neurosymbolic or non-LLM AI as a category. Reports from commercial market-research firms with unclear methods are not decisive.
metric_scope:
  company: Neurosymbolic / non-LLM alternative AI approaches (sector-wide)
  metric: Share of total AI investment
  currency: USD
  units: percent
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01
  period_end: 2025-08
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
