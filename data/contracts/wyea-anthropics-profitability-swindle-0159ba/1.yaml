  - The particular chart entries alleged to conflict are not identified in the quoted sentence.
  - Run-rate revenue and realized revenue require different metric scopes; the contract scope records the run-rate side of the comparison.
  - The passage assumes measurement windows that the quoted announcements do not specify.
