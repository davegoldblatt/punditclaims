assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic has grown significantly
  - previous ARR figures are inconsistent with the leaked charts
  - raises questions about the credibility of any numbers
evaluator_interpretation:
  - The checkable assertion is that the previously published revenue run rates cannot be reconciled with the revenue figures in the leaked charts after accounting for their measurement methods and dates.
  - The target period covers the 2025 figures and early-2026 disclosures discussed in the passage, through the April 6 announcement. It does not extend to later business performance.
  - Calling growth hard to believe and questioning credibility are judgments. They do not independently establish that a financial figure is false.
  - Run-rate snapshots cannot automatically be assigned to preceding calendar months and added as realized revenue.
support_condition: Comparable underlying records demonstrate an arithmetic inconsistency that remains after aligning measurement dates, revenue recognition, and annualization methods.
contradiction_condition: A documented reconciliation shows that the earlier run rates and the leaked revenue figures describe compatible underlying revenue activity.
measurement_requirements: The dated run-rate observations, their underlying measurement windows and calculation methods, and the original chart's realized-revenue series and accounting basis.
source_requirements: Company disclosures or authenticated financial records. Reporting may establish what was disclosed, but repeating either party's conclusion does not establish consistency.
