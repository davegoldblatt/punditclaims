ambiguity_flags:
  - No numerical definition of 'many' or 'much'.
  - ROI could mean a formal financial ratio or, colloquially, meaningful financial payoff.
  - AI technologies, company populations and investment maturity are unspecified.
  - No observation period is stated; the latest annual window ending at publication is an evaluator choice.
  - Output volume is unspecified and is treated as context for the financial-return proposition.
