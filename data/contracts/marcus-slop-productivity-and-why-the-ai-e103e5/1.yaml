assessment_axis: historical_observation
explicit_source_elements:
  - AI generates a lot of output
  - hasn’t yielded much in the way of RoI
  - for many companies
  - per studies from MIT, McKinsey, Bain, and many others
evaluator_interpretation:
  - Assess the supplied normalized proposition about enterprise returns. The GDP assertion is outside this claim.
  - Read 'many companies' as a substantial group of companies, without requiring all companies or a particular majority threshold.
  - Read 'much in the way of RoI' as meaningful realized financial benefit from AI investment. Marcus does not specify a formal return ratio or hurdle rate.
  - Treat the output language as a qualitative contrast between producing work and realizing financial benefits, without inventing a volume threshold.
  - "For this ongoing observation, use the latest annual observation window ending at publication: June 8, 2025 through June 7, 2026. Survey results describe conditions when respondents were surveyed, not when reports were published."
  - This is a qualitative claim about the prevalence of limited returns across companies, not a financial amount or accounting metric for a particular company; metric_scope is null.
support_condition: Credible enterprise studies within the target period identify a substantial group of AI users reporting little or no meaningful realized financial benefit, despite practical use of AI.
contradiction_condition: Comparable studies establish that limited realized financial benefits are confined to an exceptional or negligible group of AI-using companies. Evidence that some companies succeed does not alone contradict 'many companies'.
measurement_requirements: Separate realized benefits from forecasts, individual productivity from company financial results, and cost savings from formal investment returns. Examine survey populations and collection dates. Do not equate failure to measure returns with proof that returns are absent.
source_requirements: Prefer original survey reports and disclosures with methods. Use reputable reporting where the original study is unavailable. Sources must have been available by October 28, 2026.
metric_scope: null
