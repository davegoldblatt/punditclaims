explicit_source_elements:
  - Anthropic’s S-1
  - will look and smell like the inside of a tauntaun
evaluator_interpretation:
  - In the surrounding discussion of losses and compute spending, the ordinary financial reading is that the S-1 will disclose substantial losses and a heavy compute burden.
  - Assess the financial condition disclosed in the filing, rather than inventing a forecast of a particular loss amount, reporting year or valuation.
  - The named source is Anthropic's own future filing, so the disclosure-level accounting basis is company_reported. Individual accounting figures must retain their own meanings.
  - The claim supplies no deadline. It can be resolved by a public S-1 if its financial disclosures clearly satisfy or reject this ordinary reading.
support_condition: A public Anthropic S-1 discloses substantial losses and heavy compute expenses or commitments, after distinguishing operating costs from noncash accounting charges.
contradiction_condition: A public S-1 instead shows sustained overall profitability and no substantial compute-related financial burden under the ordinary reading.
measurement_requirements: Read the financial statements and financial-risk discussion together. Distinguish net losses, operating losses, cash balances and future commitments; none is interchangeable with cash burn.
source_requirements: The public S-1 itself is required for a decisive outcome. Leaked drafts and press descriptions provide context only.
