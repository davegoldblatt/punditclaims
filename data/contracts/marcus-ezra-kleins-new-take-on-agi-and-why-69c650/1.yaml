evaluator_interpretation:
  - Assess the stated dependence of the discussed policies on imminent AGI through LLMs, not whether those policies are desirable.
  - "Read 'almost entirely' as near-exclusive substantive dependence: materially important independent justifications would count against it."
  - Use the March 4, 2025 episode to define the policies and discussion. Earlier official policy documents provide context, not substitute evidence for what was said in the episode.
  - The environmental-cost phrase is background to this supplied proposition; it is not treated as a separate quantified environmental claim.
support_condition: The episode and policy record establish that imminent AGI through LLMs supplies nearly all substantive justification for the identified policies, with other reasons merely incidental.
contradiction_condition: The record establishes materially important policy justifications that remain operative without imminent AGI or without LLMs being the route to it.
measurement_requirements: Distinguish the prominence of AGI rhetoric from actual policy dependence. Assess both the timing assumption and the claimed dependence on LLMs.
source_requirements: A reliable complete episode record and contemporaneous official rationales for the particular policies discussed.
