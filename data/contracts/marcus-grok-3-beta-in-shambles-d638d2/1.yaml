explicit_source_elements:
  - the same as in the early ChatGPT days
  - caveat emptor
  - No matter how good-looking the output
  - there are often subtle errors
  - that most people wouldn't catch
evaluator_interpretation:
  - "Reading: from ChatGPT's launch through early 2025, polished output from general LLM chatbots often (a meaningful share of answers, not rare) contained factual errors. Ordinary users would often fail to notice those errors because the answers look fluent and confident."
  - Target period runs from ChatGPT's launch (2022-11) to the post date, since he says the lesson is the same then and now.
  - "'Most people wouldn't catch' is not quantified anywhere. Evidence that fluent, confident answers lead users to miss a substantial share of errors counts in favour."
support_condition: Independent studies from 2022-11 to 2025-02 show a substantial share of polished LLM answers contain factual errors, and that users frequently fail to detect them.
contradiction_condition: Independent studies from that period show LLM answers rarely contained errors, or that users reliably caught the errors that did occur.
measurement_requirements: Error rates in expert-reviewed LLM answers; rates at which users miss errors in LLM answers.
source_requirements: Peer-reviewed studies or systematic evaluations by independent organisations.
