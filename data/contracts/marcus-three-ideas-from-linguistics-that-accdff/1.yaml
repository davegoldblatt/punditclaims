assessment_axis: causal_assessment
explicit_source_elements:
  - Current systems
  - do not postulate such cognitive models
  - they technically can’t prove themselves wrong
  - they do not even have a representation of what being “right” would look like
evaluator_interpretation:
  - Current systems means language-model systems existing by June 22, 2022, including fine-tuned systems.
  - The ordinary functional reading of prove themselves wrong is identifying a substantive error in their own output using relevant facts or task constraints, with the criticism independently checkable.
  - This does not require a formal mathematical proof or spontaneous correction without prompting.
  - The claim links the alleged absence of cognitive representations to an absolute inability to establish errors in the system's own answers.
support_condition: Architecture and controlled evaluations establish both the asserted absence of relevant representations and the resulting inability to identify and substantiate errors in the system's own outputs.
contradiction_condition: A system available before the post produces independently assessable critiques of its own errors and uses them to improve its answers. That contradicts the claimed absolute inability without proving a particular cognitive architecture.
measurement_requirements: Distinguish self-critique from correcting only human-written answers, generic apologies, stylistic changes or merely accepting a supplied correction.
source_requirements: Original experiments or reproducible demonstrations dated before the post, with the generation, critique and evaluation procedures described.
