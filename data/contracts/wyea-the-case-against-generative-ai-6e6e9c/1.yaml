assessment_axis: forecast_outcome
explicit_source_elements:
  - this industry
  - no future for it beyond a fiery apocalypse
  - where I see this industry today
evaluator_interpretation:
  - Read the metaphor as a prediction of industry-wide financial collapse in generative AI.
  - A correction in valuations, individual business failures, or continuing losses would not alone constitute that collapse.
  - "'I see' expresses the speaker's judgment; it is not an external condition that must occur."
  - The claim provides no deadline, so continued operation for a finite period cannot disprove it.
support_condition: A decisive industry-wide collapse involves widespread failure or lasting cessation of leading generative AI businesses together with a collapse in financing for the sector.
contradiction_condition: No finite period of growth or survival conclusively contradicts an unlimited eventual-collapse forecast. A bounded deadline or more specific proposition would be needed for that test.
measurement_requirements: Dated business-failure records and broad sector financing evidence. Distinguish an industry collapse from isolated failures or a market correction.
source_requirements: Company and court records, independently measured financing data, and reliable reporting establishing the breadth and persistence of any collapse.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only upon documented widespread failure or lasting cessation of leading generative AI businesses accompanied by an industry-wide financing collapse. Ordinary distress or isolated failures do not meet this rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Fiery apocalypse supplies no numerical threshold or precise definition.
  - The boundaries of the generative AI industry are unspecified.
  - There is no deadline.
  - The operational collapse criterion is an evaluator interpretation.
retrospective_or_prospective: retrospective
