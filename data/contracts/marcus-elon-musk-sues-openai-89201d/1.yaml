explicit_source_elements:
  - The lawsuit
  - providing further evidence
  - the Board’s view, expressed in November
  - Altman has not always been consistently candid
evaluator_interpretation:
  - Assess the evidentiary contribution of the complaint filed on February 29, 2024, which Marcus discussed on March 1.
  - The ordinary reading is that the complaint supplies specific factual grounds for questioning Altman's candor. It does not assert that dishonesty has been judicially established.
  - Specific allegations and documented assurances can contribute evidence, but the existence of an allegation alone does not establish its truth. A subsequent change of policy does not necessarily establish that an earlier assurance was misleading.
  - The November board statement concerns communications with the board. Marcus extends that concern to Altman's dealings with Musk.
support_condition: The complaint identifies specific statements or omissions attributable to Altman, with corroborating records that reasonably support an inference of misleading communication beyond merely repeating the November board statement.
contradiction_condition: Reliable records refute the material representations or discrepancies on which the complaint's additional candor inference rests, or establish that the complaint supplies no additional factual basis for that inference.
measurement_requirements: Compare the complaint's specific assertions with the underlying communications and their context. Distinguish documented words, disputed allegations, changed plans, and misleading representations.
source_requirements: Read the original complaint and relevant contemporaneous records. Treat both litigants' accounts as interested sources. Later publications may illuminate earlier events but cannot substitute unrelated later conduct.
