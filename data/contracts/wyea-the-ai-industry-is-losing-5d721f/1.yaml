  - "'Unable to raise' could describe stalled negotiations or a final rejection."
  - The date the unsuccessful attempt began is unspecified.
  - "'Entire OpenAI stake' requires confirmation; backing a loan solely with OpenAI shares does not establish that every share was pledged."
