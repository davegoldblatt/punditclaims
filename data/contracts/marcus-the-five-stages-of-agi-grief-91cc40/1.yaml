evaluator_interpretation:
  - Assess the factual comparison between the economic-work-only criterion Marcus describes and earlier cognitive criteria.
  - A retreat means dropping an explicit requirement for general adaptation; it does not mean that automating work would be easy.
  - The historical comparison has no stated beginning and ends at publication.
  - The uncertain attribution to OpenAI is kept separate from the conceptual comparison.
  - Economic and social importance is an evaluative qualification, not a separately measured outcome.
support_condition: Earlier field definitions explicitly concern achieving goals or adapting across varied environments, while the economic-work criterion as stated does not independently require that breadth or adaptability.
contradiction_condition: The economic criterion as stated necessarily retains the same cognitive requirements, or the claimed historical cognitive framing is absent from relevant earlier definitions.
measurement_requirements: Compare the requirements expressed by the definitions. Do not infer that economic performance proves or disproves a particular internal architecture.
source_requirements: Historical writings by relevant researchers; direct documentation would be required to verify OpenAI's alleged adoption of the exact 80% threshold.
