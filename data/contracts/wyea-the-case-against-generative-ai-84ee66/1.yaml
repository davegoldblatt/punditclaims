explicit_source_elements:
  - nobody seems to make any money
  - other than NVIDIA
  - resellers like Dell and Supermicro
evaluator_interpretation:
  - In context, make money means earn profits from generative AI operations after their costs, rather than receive revenue or financing.
  - The exception covers GPU manufacturers and server resellers of the described kind.
  - I use April–June 2025, the latest completed calendar quarter with financial reporting available before publication.
  - Seems qualifies the assertion's confidence but does not remove its checkable claim about apparent industry profitability.
  - The passage does not specify an accounting basis. I retain unknown rather than selecting GAAP or adjusted earnings.
support_condition: Sufficiently comprehensive, comparable evidence shows no profitable generative AI business outside the stated exceptions during the target period.
contradiction_condition: At least one qualifying business demonstrably earns a net profit from generative AI operations during the target period on an established, applicable accounting basis.
measurement_requirements: Separate generative AI profits from unrelated company profits, revenue, gross margins, operating income, adjusted EBITDA and financing.
source_requirements: Period-specific company accounts or credible reporting identifying the profit measure. General descriptions of profitability in other years are context only.
