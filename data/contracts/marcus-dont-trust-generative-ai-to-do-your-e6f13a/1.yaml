ambiguity_flags:
  - The observation supplies no exact start date; the target period uses its explicit reference to 2026 through publication.
  - The system is not named in the supplied text.
  - Using AI to blow people up could encompass targeting support or suggest direct weapon control; the assessment uses targeting support.
  - Trust with taxes supplies no numerical reliability threshold.
  - The consumer chatbot and military deployment need not use identical models, tools, or safeguards.
