assessment_axis: historical_observation
explicit_source_elements:
  - Using a system
  - you shouldn’t trust with your taxes
  - to blow people up
  - 2026 in a nutshell
  - in certain parts of Washington
evaluator_interpretation:
  - Washington means U.S. government or military bodies.
  - Using generative AI to support targeting or operational planning for lethal strikes satisfies the ordinary reading. The words do not expressly allege autonomous weapon release.
  - The tax premise means general-purpose chatbots cannot safely be relied upon to prepare accurate returns without verification. It does not mean they always fail.
  - The present-tense observation and explicit reference to 2026 are assessed over 2026 through March 5, the publication date. This is a year-to-date observation, not an accounting reporting period.
  - The comparison does not itself establish that tax errors cause targeting errors or that the two deployments have identical safeguards.
support_condition: Credible evidence establishes U.S. operational use of generative AI in lethal strike planning or targeting during the target period, alongside contemporaneous evidence of material errors when general-purpose chatbots prepare tax returns.
contradiction_condition: Reliable evidence establishes that the alleged operational deployment did not occur, involved only non-generative technology, or was confined to activities unrelated to lethal operations. The tax premise would be contradicted by convincing evidence of dependable return preparation without independent verification under the described conditions.
measurement_requirements: Identify the generative model, the U.S. actor, and its operational connection to actual strikes. For the tax premise, distinguish complete return preparation from answering individual questions.
source_requirements: Prefer official operational records and original testing. Where those are unavailable, use reputable reporting with identified sourcing and accessible accounts of the tests. General military procurement alone is insufficient.
