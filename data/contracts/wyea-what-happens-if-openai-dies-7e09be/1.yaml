assessment_axis: forecast_outcome
explicit_source_elements:
  - 70% of Microsoft’s AI revenues
  - a material drop in hyperscaler revenues
  - OpenAI could simply be allowed to run out of money
evaluator_interpretation:
  - The forecast applies if OpenAI ceases operating and stops paying for compute. Financial distress or a restructuring that preserves payments does not alone satisfy that condition.
  - A material drop means a financially significant loss of realized hyperscaler revenue attributable to OpenAI's failure, allowing for replacement customers and transferred workloads.
  - The 70% statement is a separate historical premise. It requires a consistent Microsoft AI revenue denominator and reporting period.
  - No accounting basis, numerical materiality threshold or post-failure observation window is supplied.
support_condition: After the condition occurs, supplier disclosures establish a financially significant revenue loss caused by OpenAI's failure. The 70% premise requires separate verification using matched revenue figures.
contradiction_condition: After the condition occurs, sufficiently complete supplier disclosures show that replacement business or continued payments prevent a material revenue loss. Continued OpenAI operations do not contradict the conditional forecast.
measurement_requirements: Separate realized revenue from contracts, bookings and annualized run rates. Measure the loss against revenue otherwise expected, accounting for replacement demand.
source_requirements: Dated evidence of OpenAI's cessation and subsequent supplier filings or equivalent disclosures. Verify customer concentration independently of the speaker.
metric_scope:
