assessment_axis: causal_assessment
explicit_source_elements:
  - Foundation Models
  - deeply unstable
  - thus difficult to engineer into reliable products
  - answers can even change from one month to the next
evaluator_interpretation:
  - The surrounding discussion concerns large language models. I assess foundation models used for language applications, rather than every kind of foundation model.
  - The plain reading is that substantial errors, sensitivity to inputs, and changes between model versions create material obstacles to reliable product engineering. It does not require every answer to vary or reliable products to be impossible.
  - The claim describes the technology available when the post appeared on 2023-08-14. No measurement window or reporting cycle is specified; the target period therefore has no invented starting date.
  - Engineering difficulty means demonstrated integration failures or a need for additional validation, output handling, monitoring, or version management.
support_condition: Contemporaneous controlled evaluations demonstrate consequential instability across inputs or model versions, and documented integration experiments connect that behavior to failures or additional reliability engineering.
contradiction_condition: Representative contemporaneous evaluations and integration evidence show reliably stable behavior across relevant inputs and versions, or show that the alleged instability does not materially impede reliable product engineering.
measurement_requirements: Identify model versions, tasks, input changes, and evaluation methods. Distinguish changes between releases from variability within a fixed model. Connect measured behavior to an engineering consequence and consider available mitigations.
source_requirements: Primary empirical research and contemporaneous developer disclosures. Benchmark failures alone cannot establish that all commercial products are unreliable.
