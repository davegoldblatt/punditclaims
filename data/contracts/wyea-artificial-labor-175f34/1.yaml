assessment_axis: forecast_outcome
explicit_source_elements:
  - AI will allow the AMPTP to reduce writers’ rooms to one person and one machine
  - reduce the number of people in the Writers Guild of America
  - weaken and eventually destroy
evaluator_interpretation:
  - AMPTP refers here to its member studios and producers.
  - "Assess the complete causal sequence: AI-driven reductions to one-writer rooms, declining union membership and bargaining strength, and eventual destruction."
  - Destruction means dissolution or durable loss of the ability to function as a collective bargaining union.
  - No deadline is supplied.
support_condition: Documented AI-driven one-writer rooms cause membership and bargaining-power losses culminating in the WGA's destruction.
contradiction_condition: A decisive event makes the stated causal sequence impossible, or a completed union demise is demonstrably unrelated to the claimed AI mechanism. Continued survival for a finite period alone is insufficient.
measurement_requirements: Production-level staffing and AI-use records, consistent WGA membership series, bargaining outcomes, and evidence connecting each step.
source_requirements: Production records, union membership reports, collective agreements and authoritative records of any union dissolution or loss of bargaining status.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon a documented terminal event establishing the full causal sequence or making it impossible. Temporary contractual protections or continued union activity do not settle an eventual forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No quantitative definition of weakened bargaining power.
  - The scale of adoption of one-writer rooms is unspecified.
  - Destroy could mean formal dissolution or effective institutional collapse.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
