evaluator_interpretation:
  - The comparison is between Legg's typical-human capability standard and earlier formulations emphasizing flexibility, resourcefulness, and reliability.
  - Far less ambitious evaluates the relative demands of several loosely specified capabilities.
  - Neither formulation supplies a common task distribution, reliability threshold, or ordering that makes one demonstrably much easier to satisfy.
  - A narrower claim that Legg changed a particular requirement could be checked, but would not settle this broader evaluative judgment.
support_condition: No determinate condition can be specified without adding a common capability test and a meaning for far less ambitious.
contradiction_condition: No determinate condition can be specified without choosing how breadth, reliability, learning, and performance should be weighted.
measurement_requirements: A shared operational definition of both standards and a specified measure of the size of their difference would be required.
source_requirements: Primary versions of the compared statements would establish their wording, but wording alone cannot settle the evaluative ranking.
