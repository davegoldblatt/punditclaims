assessment_axis: historical_observation
explicit_source_elements:
  - despite massive data
  - LLMs fail to induce proper, reliable world models
  - machine-internal representation of the current board state
  - updated after every move
  - track the history of board positions
evaluator_interpretation:
  - The plain reading concerns a learned, coherent representation of chess state that updates during play and reliably informs legal actions.
  - The surrounding definition includes relevant game history, not merely piece locations. It does not require perfect play or zero errors.
  - Behavioral illegality bears on reliability but does not by itself prove the absence of an internal representation.
  - Earlier chess studies remain relevant to what had been induced by publication. Specialized chess language models are considered explicitly rather than automatically included as decisive or excluded.
  - Despite massive data is an asserted circumstance, not a conditional forecast; actual chess-training exposure must be checked where possible.
support_condition: Representation and behavioral studies of extensively trained, relevant LLMs show systematic failure to maintain and use coherent chess state across moves and varied positions.
contradiction_condition: An in-scope language model trained without an engineered chess-state mechanism develops a reliably used, dynamically updated representation covering the relevant chess state.
measurement_requirements: Document training exposure, board-state and history tracking, causal use, legal-move rates and unfamiliar-position performance. Distinguish notation failures from impossible moves and engine-assisted play from model-generated play.
source_requirements: Primary chess representation studies and reproducible game evaluations concerning models existing by publication.
