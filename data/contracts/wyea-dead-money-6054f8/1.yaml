evaluator_interpretation:
  - "The ordinary reading is that large AI data centers require very large absolute capital investments: millions of dollars per MW and potentially billions at the 100-MW scale discussed in the post."
  - This does not assert that every facility costs billions, that every project costs exactly $4–5 billion per 100 MW, or that high costs imply unprofitability.
  - Use 2026 year-to-date cost information through September 29, the latest reportable cost-estimate period before publication.
  - This is a qualitative industry-cost claim, not a financial result for a named company.
support_condition: Contemporaneous construction and AI hardware benchmarks establish multimillion-dollar costs per MW and billion-dollar-scale capital requirements for large facilities.
contradiction_condition: Representative contemporary costs are materially below that scale, showing that the large AI facilities discussed do not require unusually large absolute capital investments.
measurement_requirements: Separate construction, land and power infrastructure, and AI hardware fit-out. Normalize by MW and identify facility scale; do not add incompatible cost categories.
source_requirements: Primary construction-cost research, project budgets, procurement disclosures, or company announcements with clearly defined cost scope.
