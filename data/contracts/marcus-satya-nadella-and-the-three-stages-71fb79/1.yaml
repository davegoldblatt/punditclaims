explicit_source_elements:
  - Hundreds of billions of dollars were invested
  - on the assumption that I was wrong
  - largely to the exclusion of investment in other approaches
  - Almost a half decade
evaluator_interpretation:
  - "Plain reading: from about 2020 to November 2024, AI investment in the hundreds of billions of dollars went mainly into scaling LLMs, on the belief that scaling would keep working. Comparatively little went to alternative approaches such as neurosymbolic AI."
  - "'On the assumption that I was wrong' is read as 'on the assumption that scaling would keep delivering gains', since the investors' view of Marcus personally is not observable."
  - "Three parts must hold: the size (hundreds of billions), the rationale (a belief in scaling), and the concentration (largely excluding alternatives)."
support_condition: Reported totals show hundreds of billions of dollars invested in LLM/generative-AI scaling by late 2024. Industry statements tie that investment to belief in scaling laws. Funding data show alternative approaches got a small share.
contradiction_condition: Investment tied to LLM scaling was well under $100 billion by late 2024, or funding data show substantial investment in non-LLM approaches.
measurement_requirements: Totals for AI-related capital spending and investment, 2020–2024, plus some measure of funding for non-LLM approaches.
source_requirements: Company filings or reputable financial reporting for spending; industry statements for rationale; funding datasets for alternative approaches.
metric_scope:
  company: AI industry (major tech firms and AI labs, aggregate)
  metric: investment in LLM/generative-AI scaling
  currency: USD
