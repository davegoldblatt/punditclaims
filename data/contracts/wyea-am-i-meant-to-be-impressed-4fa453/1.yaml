ambiguity_flags:
  - The ongoing observation has no explicit reporting period; the latest completed quarter is used.
  - Barely any supplies no numerical threshold.
  - Substantiate supplies no investment-return test or recovery period.
  - The capital expenditure benchmark has no stated company perimeter, spending period or accounting basis.
  - The exclusion could refer to purchases by the labs or more broadly to demand involving their models.
  - The treatment of internally consumed AI compute is unspecified.
