assessment_axis: historical_observation
explicit_source_elements:
  - Outside of OpenAI and Anthropic
  - barely any actual demand for AI services or AI compute
  - at the scale necessary to substantiate a trillion or more in capital expenditures
evaluator_interpretation:
  - The plain reading is that paying demand outside the two labs is too small to economically justify the cited infrastructure investment. It is not a claim that no other customers exist.
  - Use January–March 2026, the latest completed reporting quarter before the post, for the ongoing demand observation.
  - Treat the exclusion as removing purchases by OpenAI and Anthropic. Customers buying other providers' products that incorporate those labs' models are not automatically excluded; the wording leaves this boundary uncertain.
  - Compare paid demand and enforceable commitments with investment costs over the assets' useful lives. A quarter's revenue need not equal the capital investment.
  - The cited trillion dollars is an investment benchmark whose companies, spending period and accounting basis are unspecified.
support_condition: Comparable evidence shows that paid AI demand and credible commitments outside OpenAI and Anthropic were negligible relative to the demand required to recover the cited investment and its operating costs over a defensible asset lifetime.
contradiction_condition: Comparable evidence shows substantial paid AI demand outside OpenAI and Anthropic sufficient to justify the cited investment under defensible cost, margin and asset-life assumptions.
measurement_requirements: Separate realized revenue, annualized run rates, contracted purchases and usage. Exclude both labs' purchases, avoid counting the same spending at multiple supply-chain stages, and identify the investment period, operating costs, asset lives and required returns.
source_requirements: Prefer company disclosures and filings with customer and AI-specific breakdowns, supplemented by transparent independent estimates. Aggregate cloud revenue or backlog alone cannot establish the claim.
metric_scope:
  company: AI infrastructure providers collectively; company perimeter unspecified
  metric: Capital expenditures against which AI demand excluding OpenAI and Anthropic is judged; benchmark of at least $1 trillion
  currency: USD
