explicit_source_elements:
  - project beyond past data
  - into new situations
  - Generative AI has never been very good at that
evaluator_interpretation:
  - The plain reading is a broad historical weakness in reliable transfer to unfamiliar situations, not a claim that models have never solved any new problem.
  - The period extends through April 1, 2026; never supplies no specific starting date.
  - Novel static problems and novel interactive environments both bear on the claim, but success on one does not establish success on the other.
  - No numerical threshold for very good is supplied; substantial verified successes and substantial failures must both be reported.
support_condition: Evaluations on genuinely unfamiliar situations show substantial, persistent weaknesses in adaptation beyond familiar task patterns.
contradiction_condition: Verified evaluations show substantial success on genuinely new tasks, materially qualifying the assertion that generative AI has never been good at such transfer.
measurement_requirements: Distinguish unseen test instances from unfamiliar task families; consider training exposure, task-specific preparation, tools, scaffolding and the benchmark's actual scoring method.
source_requirements: Primary benchmark reports and documented model evaluations available by the evaluation cutoff, measuring performance no later than publication.
