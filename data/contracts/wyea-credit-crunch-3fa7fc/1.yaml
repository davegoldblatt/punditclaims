ambiguity_flags:
  - The conditional scenario is inherited from the preceding sentence.
  - The next few years has no exact endpoint; the five-year outer deadline is provisional.
  - Every other neocloud has no fixed company list.
  - Running out of money could refer to cash exhaustion, financing failure, or insolvency.
  - The extent of investor losses and the size of the GPU glut are unspecified.
  - No accounting basis for liquidity is supplied.
