assessment_axis: forecast_outcome
explicit_source_elements:
  - It involves
  - CoreWeave, IREN, Nebius, and every other neocloud
  - running out of money
  - investors in both their stock and debt
  - some time in the next few years
  - otherwise-useless data center construction
  - GPUs ... in a supply glut
evaluator_interpretation:
  - "It involves carries forward the preceding collapse scenario: most data-center debt unpaid, both labs failing their obligations, and AI GPU sales halting."
  - Running out of money means inability to meet obligations because usable cash and obtainable financing are exhausted, evidenced by insolvency, payment default, or equivalent records.
  - Investor harm means losses to both equity and debt investors associated with that failure; a temporary share-price decline is insufficient.
  - The universal scope includes the three named firms and other businesses principally supplying third-party AI compute, rather than all diversified cloud providers.
  - For a provisional outer deadline, read the next few years as three to five years and use the five-year anniversary, October 6, 2031. This is an evaluator convention, not an explicit date.
  - The collateral language predicts severely impaired recoveries and excess GPU supply, not literally zero technical usefulness or a measurable comparison with buried Atari cartridges.
support_condition: The stated collapse occurs within the horizon, and records establish cash exhaustion or insolvency across the claimed neocloud population, losses to both investor classes, and severely impaired collateral amid a broad GPU glut.
contradiction_condition: After the antecedent and by the interpreted deadline, at least one company within the universal scope remains able to meet its obligations without the predicted failure, or decisive recovery and inventory records contradict the claimed collateral collapse.
measurement_requirements: Track usable cash, financing availability, due obligations, defaults, equity and creditor recoveries, and GPU resale prices and inventories. Define the neocloud population before assessing every company.
source_requirements: Financial statements, lender and court records, restructuring documents, and independent collateral-market measurements.
