assessment_axis: forecast_outcome
explicit_source_elements:
  - The secret to making AGI
  - almost certainly rests on
  - getting disparate algorithms
  - those that work well with symbolic knowledge
  - those that can induce regularities from massive amounts of unstructured data
  - to work together well
evaluator_interpretation:
  - "I read this as a forecast about how AGI will eventually be built: the first system widely accepted as AGI will rely on combining different kinds of algorithms, such as symbolic methods and learning from large amounts of data, working together."
  - No deadline is stated, so this is an open-horizon forecast. It can only be settled once a system widely recognised as AGI exists and its design is publicly known.
  - "'Almost certainly' is a strong hedge but still a firm directional claim. It is not a claim that hybrids will arrive soon."
support_condition: A system widely recognised as AGI (by independent experts, not only by its maker) exists, and its documented design depends in an essential way on several distinct algorithm types working together, such as symbolic reasoning or tools plus learned neural components.
contradiction_condition: A system widely recognised as AGI exists and is documented as one uniform learned method (for example a single end-to-end neural network) with no essential symbolic or other separate algorithmic parts.
measurement_requirements: There must be broad expert agreement that some system is AGI, plus public technical documentation of how that system is built.
source_requirements: Primary technical reports or papers from the system's builder, plus independent expert or benchmark assessments that it counts as AGI. Marcus's own writing does not count.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled early only if a system is widely recognised as AGI and its architecture is publicly documented. Supported if that architecture essentially combines disparate algorithm types (symbolic plus learned components); contradicted if it is one uniform learned method.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No agreed definition or test for AGI exists, so it is disputed when AGI has been 'made'.
  - "'Disparate algorithms ... working together' is loose. Current LLM systems that call tools such as code interpreters or calculators could be read as hybrids, which makes the line between support and c…"
  - No deadline is given.
retrospective_or_prospective: retrospective
