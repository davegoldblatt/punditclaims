assessment_axis: forecast_outcome
explicit_source_elements:
  - whenever AGI comes
  - explicit cognitive models
  - will be crucial
  - tied not to time but to architecture
evaluator_interpretation:
  - Treat arrival as a demonstrated system with broadly accepted human-level general cognitive capability. Broad acceptance is an evaluator safeguard.
  - Read explicit cognitive models as identifiable representations of entities, relations, and states that the system uses to understand situations and reason about them.
  - A researcher's model of the system's cognition does not itself qualify; the representations must operate within the system.
  - Read crucial as central dependence demonstrated through component tests or equivalent evidence.
  - Test the architecture of the first broadly accepted AGI; support for that case would not prove necessity for every possible AGI.
support_condition: The AGI condition is established, and public architectural and component evidence shows that explicit cognitive models are central to the arriving system's general capability.
contradiction_condition: The AGI condition is established, and complete architectural evidence or controlled tests show that the system attains and retains general capability without explicit cognitive models.
measurement_requirements: Broad capability evaluations, identification of the internal models and their use, and tests distinguishing central dependence from incidental presence.
source_requirements: Public technical documentation and independent capability assessments available by 2026-10-28. An AGI label or behavioral resemblance to human cognition is insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a dated AGI demonstration establishes the condition and architectural evidence establishes dependence on, or successful operation without, explicit cognitive models.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
