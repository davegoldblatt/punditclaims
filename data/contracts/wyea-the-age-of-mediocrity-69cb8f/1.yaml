assessment_axis: historical_observation
explicit_source_elements:
  - hallucinates regularly
  - is somehow getting worse
  - adopting AI
  - as fast as possible
  - regardless of whether it actually makes sense
evaluator_interpretation:
  - In context, AI means the generative systems executives were considering or adopting.
  - Regular hallucination means recurring invented or false factual material, not that every answer is wrong.
  - Getting worse ordinarily alleges a general deterioration in usefulness or reliability. An isolated regression does not establish that general trend.
  - The executive claim concerns a broad pattern of rapid adoption with inadequate regard for suitability, not literally every executive.
  - The target covers the 2023 rollout through publication, including the earlier comparisons necessarily implied by getting worse. No comparison baseline is supplied.
support_condition: Relevant evaluations establish recurring hallucinations and a broad deterioration, while representative adoption evidence or documented decisions establish rapid deployment despite known unsuitability.
contradiction_condition: Comparable evaluations establish broad improvement or stable performance, or representative decision records show that suitability materially governs deployment. Counterexamples must address the broad pattern rather than merely show isolated exceptions.
measurement_requirements: Separate hallucination frequency from general performance. Compare consistent tasks and model versions. Distinguish adoption intentions from deployment, and concern about risks from actual decisions.
source_requirements: Primary evaluations, original executive surveys and documented corporate adoption decisions. Survey respondents and benchmark scope must be identified.
