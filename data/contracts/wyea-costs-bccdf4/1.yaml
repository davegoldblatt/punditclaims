ambiguity_flags:
  - The start of the asserted pricing trend is not stated; 2025 is taken from the surrounding discussion.
  - Customers could mean all customers, typical customers or affected heavy users.
  - Cost could mean token tariffs, total bills or subscription value after allowance changes.
  - High has no specified threshold.
  - The provider-cost statement is hedged and explicitly lacks a training/inference split.
