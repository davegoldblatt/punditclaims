assessment_axis: historical_observation
explicit_source_elements:
  - The cost of inference is clearly increasing for customers
  - the cost of inference appears to be high for Anthropic too
  - it’s impossible to tell how much of its compute is based on training versus running inference
evaluator_interpretation:
  - The firm assertion concerns a general increase in what customers pay for comparable inference service, including reduced subscription allowances.
  - The surrounding discussion describes changes during 2025 up to publication. Use January 1 through October 20, 2025, rather than later pricing changes.
  - A new premium model or service tier does not alone establish that comparable inference became more expensive.
  - The provider-cost statement is explicitly tentative and admits that inference costs cannot be separated from training. No numerical definition of high is supplied.
  - The metric scope below describes customer charges. The separate provider-cost suggestion would require inference-specific spending estimates.
support_condition: Comparable prices, allowances and customer bills show a broad increase in effective inference charges during the observation period. Separate inference-cost evidence would be needed to substantiate the provider-cost suggestion.
contradiction_condition: Representative comparable-service evidence shows customer inference charges generally flat or declining. Evidence that Anthropic's inference burden was modest relative to related revenue would challenge the provider-cost suggestion.
measurement_requirements: Hold workload, model capability, input/output mix, caching, service level and subscription allowances reasonably constant. Distinguish list prices from effective customer bills and total compute spending from inference costs.
source_requirements: Dated company tariffs and allowance changes, supplemented by representative billing measurements. Provider costs require financial disclosures or independently sourced reporting separating inference from training.
metric_scope:
  company: Anthropic
  metric: Customer inference charges for API and subscription access
  currency: USD
  units: dollars per comparable inference workload
  accounting_basis: company_reported
