evaluator_interpretation:
  - Read as a factual report of a directive issued just before the post (around 2026-06-12). It holds if a directive from the US Commerce Department, framed as an export control, ordered Anthropic to suspend access to Fable 5 and Mythos 5 for foreign nationals, including Anthropic's own foreign-national staff.
  - The post's headline says the Commerce Department 'effectively shuts down' the models. That headline is not part of this claim and is not graded here.
support_condition: An Anthropic statement or a reputable report shows that a US Commerce Department export control directive, issued around 2026-06-12, required suspending all access to Fable 5 and Mythos 5 by foreign nationals, including Anthropic employees.
contradiction_condition: Evidence shows no such directive was issued, that it came from a different agency, that it did not cover these models, or that it excluded Anthropic's foreign-national employees.
