  id: wyea-ai-is-too-expensive-f38aa0
  version: 1
  content_hash: dc9b298c2916ad20f2528a2c7700e9d169c7f0e42304b2759a39bfe05d11d33a
assessment_axis: forecast_outcome
explicit_source_elements:
  - Zillow
  - on course to spend at least $7 million
  - on AI in 2026
  - at its current pace might hit as much as $10 million
  - a little less than 50% of its 2025 net income ($23 million)
evaluator_interpretation:
  - The scored forecast is the projected minimum of $7 million in realized spending during calendar 2026.
  - The context indicates spending on AI services and tokens, including Cursor, Anthropic and AWS Bedrock, rather than all staff or infrastructure costs associated with AI.
  - Might hit $10 million is a possible higher outcome, not a firm ceiling or a second required threshold.
  - At its current pace qualifies the tentative $10 million scenario. It is a projection assumption, not a separately observable antecedent to the $7 million minimum.
  - The profit comparison concerns the possible $10 million amount and is historical context rather than evidence that the spending forecast occurred.
  - The spending basis is estimate because the projection comes from reported internal spending figures rather than a stated accounting-standard expense measure.
support_condition: Comparable records establish at least $7 million of realized Zillow AI-service and token spending during calendar 2026.
contradiction_condition: Complete comparable calendar-2026 records establish realized spending below $7 million. Spending below $10 million alone does not contradict the forecast.
measurement_requirements: Reconcile vendor coverage and cash-paid versus incurred spending, avoid double-counting intermediary and underlying model charges, and exclude annualized rates, unused budgets and unrelated AI costs.
source_requirements: Prefer Zillow's spending ledger or explicit company disclosures. Independently corroborated invoice-based reporting using the same spending definition is acceptable.
metric_scope:
  company: Zillow Group
  metric: AI-service and token spending
  currency: USD
  units: millions of dollars
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: in 2026
horizon_interval:
  start: 2026-05-19
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Support may be established early by verified, non-reversible cumulative calendar-2026 spending of at least $7 million on the same basis. Budget authorizations, annualized rates and commitments do not qualify. No early failure follows merely from spending remaining below the threshold.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - AI spending has no formal accounting definition or exhaustive vendor list.
  - The source does not distinguish payments from incurred charges.
  - On course describes a trajectory rather than an unconditional guarantee.
  - The $10 million amount is hedged and conditional on pace, not a firm upper bound.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
