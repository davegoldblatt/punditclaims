assessment_axis: historical_observation
explicit_source_elements:
  - executive order is broad
  - both current and long-term risks
  - some—though probably not enough—teeth
evaluator_interpretation:
  - Assess the order issued on the post date, not its subsequent implementation.
  - Broad coverage means addressing several kinds of existing harm alongside prospective risks from advanced AI, including loss of human control.
  - Some teeth means mandatory directions grounded in legal authority, including directions to require company reporting. It does not require a product approval system.
  - Probably not enough is a judgment about adequacy without a stated standard. The proposed outcome covers the factual claims about breadth and mandatory provisions.
support_condition: The order addresses existing harms and prospective advanced-AI risks, and contains mandatory requirements or directions to impose them under legal authority.
contradiction_condition: The order lacks substantive coverage of either existing harms or prospective advanced-AI risks, or contains only voluntary recommendations.
measurement_requirements: Inspect the order's substantive provisions, distinguishing mandatory directions from recommendations and policy aspirations.
source_requirements: The signed order and contemporaneous official explanations. Subsequent implementation cannot establish what the order contained when issued.
