explicit_source_elements:
  - By many accounts
  - AI-fueled scams have exploded
  - no coherent federal response
evaluator_interpretation:
  - The post's two-year comparison supplies the lookback from May 16, 2023 through May 16, 2025; the response clause concerns the position at the endpoint.
  - By many accounts is an attribution qualifier, not a forecast condition.
  - Exploded ordinarily means a sharp increase documented in multiple credible accounts. General fraud growth alone does not establish AI-enabled scam growth.
  - The scam clause does not explicitly restrict geography; the federal-response clause concerns the United States.
  - A coherent response means connected prevention, reporting and enforcement efforts. Neither isolated activity nor the absence of a comprehensive new law settles that question.
support_condition: Multiple credible accounts document sharp growth in AI-enabled scams, and an adequate review establishes the absence of a coordinated US federal response at publication.
contradiction_condition: Comparable evidence refutes the claimed sharp growth, or operating records establish a coordinated federal response covering the problem. Established opposing results across the two components warrant mixed.
measurement_requirements: Separate AI-enabled scams from total fraud, attempted attacks from completed scams, and vendor samples from population-wide estimates. Assess coordination and coverage separately from whether any action occurred.
source_requirements: Use dated fraud measurements and federal operating or coordination records describing the target period. Do not substitute later full-year 2025 totals.
