explicit_source_elements:
  - the closer they get to perfect
  - the easier it is for mere mortals to space out
  - wouldn’t need to pay attention to truly reliable systems
evaluator_interpretation:
  - The testable claim is that increasing the reliability of imperfect automation tends to reduce attentive human oversight.
  - Space out includes reduced monitoring and increased task-unrelated mind wandering; these are related but distinct outcomes.
  - The statement is read as a general tendency, not an assertion that every reliability increase affects every operator.
  - The imperfect-system qualification defines the causal comparison; it is not an antecedent to a conditional forecast.
support_condition: Controlled comparisons of otherwise similar systems show poorer monitoring, reduced attention, or increased mind wandering with higher imperfect reliability.
contradiction_condition: Controlled comparisons show unchanged or improved attention as reliability rises. Differences across tasks or attention measures can warrant a mixed assessment rather than a universal conclusion.
measurement_requirements: Manipulate reliability separately from automation level, workload, and time on task. Distinguish monitoring performance, trust, and mind wandering.
source_requirements: Primary controlled human-factors studies comparing different reliability levels, including material null or opposing findings.
