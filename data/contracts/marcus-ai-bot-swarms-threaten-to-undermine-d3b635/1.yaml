assessment_axis: causal_assessment
explicit_source_elements:
  - If swarms flood the web
  - duplicative, crawler-targeted content
  - can execute “LLM grooming”
  - poisoning the training data
  - future AI models
evaluator_interpretation:
  - This is a conditional capability claim, not a forecast that a particular campaign will succeed.
  - The ordinary reading is that coordinated publication of repeated malicious narratives can contaminate subsequently collected training data and affect model behavior.
  - ‘Duplicative’ permits repeated narratives with wording variations; it does not require every document to be byte-identical.
  - The parenthetical reference to citizens describes downstream reliance on information. It does not specify a measurable human persuasion effect.
support_condition: Experiments or traced campaigns establish a feasible route from crawler-targeted web publication through training-data collection and filtering to changed trained-model behavior.
contradiction_condition: Evidence establishes that the proposed publication route cannot produce training contamination or behavioral effects under representative conditions. Failure of one campaign alone does not disprove a capability claim.
measurement_requirements: Separate training contamination from live search or retrieval contamination. Examine ingestion, filtering, repeated content, and downstream model behavior.
source_requirements: Primary experimental papers or documented campaigns with an identifiable training pathway; output repetition alone is insufficient.
