assessment_axis: historical_observation
explicit_source_elements:
  - There has never been a time
  - the entire market crystallised around a few specific companies
  - not even the dot com bubble
  - built an entire infrastructural layer
  - mostly in service of two of them
  - close to the $1tn mark
evaluator_interpretation:
  - The two companies are OpenAI and Anthropic, identified by the surrounding discussion.
  - The ordinary reading concerns an AI infrastructure buildout concentrated on these companies, not literally every traded security.
  - Mostly means a majority of the relevant infrastructure, measured consistently by cost or capacity.
  - The claim concerns the accumulated position as of March 10, 2026. Dated project announcements are relevant records, rather than a single company's latest reporting quarter.
  - Completed construction, announced capital budgets, and multiyear compute purchases must be tested separately because built and price tag do not identify one accounting measure.
  - No numerical tolerance is imposed on close to $1 trillion. A result dependent on an invented tolerance would remain unresolved.
support_condition: A consistently measured, nonduplicated infrastructure inventory near $1 trillion shows a majority serving OpenAI and Anthropic, and a defined historical comparison supports the claimed absence of precedent.
contradiction_condition: A comparable inventory establishes materially different scale or a minority serving those companies, or a documented historical episode satisfies the same combined concentration-and-infrastructure criteria.
measurement_requirements: Specify geography, project universe, completed versus committed spending, valuation date, tenant shares, and treatment of overlapping supplier and customer commitments.
source_requirements: Project disclosures, contracts, spending and tenant records, and historical market-concentration research. Individual announcements alone cannot establish an industry total or majority share.
