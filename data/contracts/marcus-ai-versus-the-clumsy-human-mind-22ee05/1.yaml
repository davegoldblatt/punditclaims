assessment_axis: historical_observation
explicit_source_elements:
  - Humans are very good at a bunch of things
  - AI is (as of today) still pretty poor at
  - maintaining cognitive models of the world
  - inferring semantics from language
  - comprehending scenes
  - navigating 3D world
  - being cognitively flexible
evaluator_interpretation:
  - Read as a claim about the best publicly evaluated AI systems in 2023 (for example GPT-4 and GPT-4V), compared with ordinary human performance.
  - "'Pretty poor' is read as performance clearly and substantially below typical humans on tests built for that ability, not merely short of perfect."
  - The claim is a bundle of five abilities. It is fully supported only if all five show a clear gap. It is contradicted if several of them show AI at or near human level.
  - "'As of today' names no period. I use 2023-01 to the post date of 2023-11-25, the period covered by evaluations of GPT-4-era systems published before the post."
support_condition: "Evaluations from 2023 show the leading AI systems well below humans on each of the five named abilities: world models, language semantics, scene comprehension, 3D navigation, and cognitive flexibility."
contradiction_condition: Evaluations from 2023 show the leading AI systems at or near human level on most of the named abilities.
measurement_requirements: Human-versus-AI comparisons on tests aimed at each named ability, using systems available in 2023.
source_requirements: Peer-reviewed papers, preprints, benchmark reports, or developer technical reports. Not the speaker's own writing.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2023-01
  end: 2023-11-25
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Pretty poor' has no threshold."
  - Five separate abilities are bundled into one claim, and there is no agreed benchmark for 'maintaining cognitive models of the world' or 'inferring semantics'.
  - "'AI' is unscoped (LLMs, vision models, robots)."
  - No period is named. 2023 up to the post date was chosen as the most recent period that evaluations could cover.
retrospective_or_prospective: retrospective
