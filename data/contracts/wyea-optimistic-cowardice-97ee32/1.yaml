explicit_source_elements:
  - set to lose $15 billion
  - this year
  - projected revenue
  - according to The Information
  - $4.6 billion
evaluator_interpretation:
  - This year means calendar 2025.
  - The preceding discussion explicitly calls the $15 billion figure cash burn and mentions capital expenditures. The ordinary contextual reading is net cash consumption including capital investment, not necessarily accounting net loss.
  - Operating cash flow less cash capital expenditure is the initial comparison measure, subject to verifying the cited forecast's treatment of financing, working capital and capital investment.
  - The $4.6 billion sentence reports a contemporaneous revenue projection. A different realized revenue figure would not, by itself, disprove that attribution.
  - The cash-burn forecast is treated as approximate to the nearest billion.
support_condition: 2025 results reconciled to the cited forecast's cash-burn definition show approximately $15 billion of net cash consumption; a contemporaneous source establishes the attributed $4.6 billion revenue projection.
contradiction_condition: 2025 results on the same cash-burn definition fall materially outside approximately $14.5–15.5 billion, or the attributed contemporaneous projection is reliably shown to differ.
measurement_requirements: Reconcile the forecast definition to realized cash flows, including cash capital expenditure, operating cash flow, financing repayments and any noncash additions. Keep accounting losses and gross capital expenditure separate.
source_requirements: The contemporaneous forecast or a reliable description of its method, plus 2025 annual cash-flow statements and any necessary reconciliation.
