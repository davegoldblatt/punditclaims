  - A lifetime lower bound is not an exact total or an upper bound. Annualized revenue is distinct from revenue already earned.
  - The contract's metric_scope identifies the disputed lifetime-revenue premise. The comparison also includes a February run rate and a 2025 annual revenue estimate; those are separate measures, not interchangeable evidence.
  - The introductory 'If that’s the case' refers to the preceding revenue-mix estimate. The asserted incompatibility of the three reported figures can be tested without assuming that mix is correct.
support_condition: The authentic statements, on compatible definitions and with their original qualifications, impose mutually inconsistent arithmetic constraints.
contradiction_condition: The original statements permit a consistent revenue history, including because the lifetime figure is a lower bound rather than an exact total.
measurement_requirements: Preserve exact versus lower-bound language, distinguish cumulative and annual revenue from run rate, and keep each figure attached to its own date.
