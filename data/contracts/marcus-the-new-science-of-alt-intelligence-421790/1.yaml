  - no current AI
  - remotely close
  - read an arbitrary text
  - what a speaker is saying and intends to accomplish
  - reason about an arbitrary problem
  - produce a cohesive responsive
evaluator_interpretation:
  - Current refers to systems existing when the post was published, not systems developed later.
  - Arbitrary means diverse ordinary unseen texts and problems, rather than every logically possible input or an impossible requirement of perfection.
  - The apparent typo cohesive responsive is read as coherent, relevant response.
  - The ordinary capability target is broadly reliable comprehension, including communicative intent, and coherent reasoning across unfamiliar problems.
  - Not remotely close is stronger than not fully solved. No numerical distance or readiness threshold is supplied.
  - The target is May 2022 up to publication. Earlier evaluations are contextual evidence for this latest partial-month snapshot.
support_condition: Representative evaluations of leading contemporary systems show substantial, persistent gaps across text comprehension, speaker-intent inference and general reasoning, sufficient to establish distance from broad reliable competence.
contradiction_condition: A contemporary system demonstrates broadly reliable performance sufficiently near the described competence across diverse unseen texts and problems, including communicative intent.
measurement_requirements: Broad tests with held-out cases, robustness checks, human comparisons and explicit treatment of speaker intent. Selected demonstrations or benchmark averages alone cannot determine proximity.
source_requirements: Primary evaluations of systems available by the post, with methods and failure cases disclosed.
