assessment_axis: causal_assessment
explicit_source_elements:
  - Near-plagiarism comes from
  - reconstructing those bits in statistically probable ways
  - without having a mechanism like an originality-assessor
  - investigate the novelty
evaluator_interpretation:
  - Near-plagiarism means substantial reproduction of identifiable training material; this is not a legal determination.
  - Read reconstructing bits as statistical generation from learned representations, rather than necessarily assembling literal stored fragments.
  - The complete claim combines a proposed copying mechanism with the absence of originality assessment.
  - Demonstrating memorization or copying supports part of the explanation but does not establish the causal role of missing originality checks.
support_condition: Controlled studies connect statistical generation to substantial training-material reproduction and establish that absent originality assessment materially explains the resulting copying.
contradiction_condition: Controlled studies reject the proposed generation mechanism or its claimed relationship to originality assessment. Evidence that some systems contain checks contradicts only a universal absence-of-checks reading.
measurement_requirements: Compare outputs with identifiable training material using validated similarity measures, distinguish memorization from coincidental similarity, and vary originality checking separately from data duplication and prompting.
source_requirements: Primary extraction studies, controlled memorization experiments, and documented originality-assessment interventions.
