evaluator_interpretation:
  - The forecast concerns the incoming Congress's initial institutional response to Trump's handling of the Huang/Nvidia affair.
  - The ordinary reading is that congressional leaders or relevant committees will favor investigating before pursuing impeachment. It does not require agreement from every member.
  - Willingness to bet expresses confidence, not an antecedent condition.
  - No deadline is stated. Statements by prospective committee leaders can indicate intentions, but existing inquiries alone cannot establish the incoming Congress's eventual response.
support_condition: The incoming Congress adopts an investigation-first response to Trump's handling of the affair, while explicitly withholding an immediate impeachment push.
contradiction_condition: The incoming Congress definitively rejects investigating the affair, or adopts an immediate impeachment-first response instead.
measurement_requirements: Distinguish institutional decisions and authorized leadership statements from individual members' preferences. Establish the sequence of investigation and impeachment decisions.
source_requirements: Congressional records, committee announcements, leadership statements, or reliable reporting identifying the relevant institutional decisions.
