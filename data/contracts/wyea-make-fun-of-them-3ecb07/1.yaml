assessment_axis: historical_observation
explicit_source_elements:
  - Reasoning models don’t even reason
  - as proven by an Apple paper
  - released a few weeks ago
evaluator_interpretation:
  - Assess only the assertion about reasoning models, not the separate assertion about agents.
  - The plain reading is that contemporary reasoning models lack the ability to draw conclusions or solve problems through successive logical steps. It does not merely assert that they sometimes fail.
  - Use successful, independently checked solutions to controlled multistep problems as observable evidence of reasoning ability. This is an operational interpretation, not a claim about consciousness or human-like internal processes.
  - Use June 2025 as the reporting period for this ongoing observation, anchored by the June 30 post and its reference to a paper released a few weeks earlier.
support_condition: Controlled evaluations establish that the tested models lack multistep inference capability, with apparent successes adequately explained by memorized answers or other shortcuts. Failure only above a difficulty threshold does not establish the categorical claim.
contradiction_condition: Controlled evaluations show that contemporary reasoning models successfully perform multistep inference on varied problem instances with checked solutions, even if their accuracy deteriorates on harder instances.
measurement_requirements: Examine task construction, contamination controls, solution verification, complexity levels, and failures alongside successes. Benchmark performance alone cannot establish human-like internal reasoning.
source_requirements: Read the cited Apple paper in its contemporaneous version. Prefer primary controlled evaluations and distinguish measured behavior from interpretations of internal mechanisms.
