explicit_source_elements:
  - OpenAI and Anthropic
  - becoming drains on the system
  - massive redistribution of capital reserved for startups
  - to one of a few public companies
evaluator_interpretation:
  - The ordinary reading is that unusually large startup-financing receipts fund substantial payments to a concentrated group of public infrastructure suppliers.
  - Draining capital reserved for startups additionally implies reduced capital available to other startups. Large financing rounds alone do not establish that displacement.
  - The surrounding discussion concerns 2025 fundraising and current infrastructure agreements. The target is the calendar year through publication; financing transactions and commitments can be disclosed as they occur, without waiting for a quarterly report.
  - The context relies on reported deal amounts, so the claim's financial basis is treated as estimate. Future contractual commitments are tracked separately from realized payments.
support_condition: Comparable records show substantial startup-financing receipts by both companies, material onward payments to a small group of public suppliers, and evidence that this allocation reduced capital available to other startups.
contradiction_condition: Comparable financing and payment records show that the asserted substantial transfer or concentration did not occur, or establish that the alleged displacement of other startup capital is false.
measurement_requirements: Funding actually received, investor types, supplier cash payments, payment timing, supplier concentration and evidence of displaced startup financing. Do not add multiyear commitments to current-year cash payments.
source_requirements: Company and investor disclosures, supplier filings, and venture-capital flow data. Displacement requires evidence beyond the announcement of large deals.
