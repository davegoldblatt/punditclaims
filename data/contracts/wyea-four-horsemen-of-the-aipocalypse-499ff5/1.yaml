explicit_source_elements:
  - some companies
  - as much as 10% of the cost of their employees
  - on generative AI services
  - without appearing to provide any stability, quality or efficiency gains
evaluator_interpretation:
  - "Read 'some companies' existentially: at least one qualifying company would suffice."
  - The immediately preceding Goldman passage concerns engineering headcount costs, so use that denominator rather than all company employees.
  - Read 'without appearing' as absence of demonstrated gains at the qualifying company, not a universal claim that AI never helps.
  - Use April 2026, the contemporaneous reporting month identified by 'last week', as the observation window. The underlying spending accounting period is unspecified.
  - The spending ratio and operational outcomes must concern the same company and period.
support_condition: Evidence identifies a company spending approximately 10% of engineering headcount cost on generative AI and establishes no demonstrated stability, quality or efficiency gains in that setting.
contradiction_condition: Evidence disproves the cited spending ratio or shows demonstrated gains at the same company underlying the anecdote. Gains at unrelated companies do not refute an existential claim.
measurement_requirements: A matched inference-spending numerator, engineering-compensation denominator, accounting period and operational outcome measures.
source_requirements: The Goldman report or company records for the ratio, plus matched operational evidence. Silence about benefits is insufficient evidence that benefits were absent.
