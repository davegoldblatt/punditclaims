explicit_source_elements:
  - the statement called for locking down distillation by competitors
  - it just came out
  - the company has been destroying rare books in bulk
  - in order to distill their contents
evaluator_interpretation:
  - "Assess the two practices identified in the normalized proposition: restrictions on competitors' distillation and Anthropic's bulk destructive scanning of rare books."
  - Locking down means advocating restrictions; it need not mean prohibiting every instance of distillation.
  - Distilling books is read as extracting their contents for model training. It does not assert that scanning books and distilling models are technically identical.
  - Rare means scarce or hard-to-find books. It does not necessarily mean valuable antiquarian collectibles, but ordinary used books alone do not establish rarity.
  - The statement belongs to the days immediately before publication. The book activity is described as prior conduct newly reported by publication, with no stated beginning; the target period therefore has an open start.
support_condition: The contemporaneous statement advocates restrictions on competitors' model distillation, and reliable records establish bulk destructive scanning by Anthropic that included scarce books for model training.
contradiction_condition: The statement directly rejects the alleged restrictions, or reliable records establish that the alleged destructive scanning or inclusion of rare books did not occur. Missing evidence of rarity alone is not contradiction.
measurement_requirements: Verify the scope of the distillation restrictions, actual destructive scanning at bulk scale, and evidence that the books included scarce titles or editions. Keep these components distinct.
source_requirements: Prefer Amodei's original statement and court records. Use independent reporting for facts not available in accessible primary records, and identify company denials as such.
