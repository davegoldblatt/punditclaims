explicit_source_elements:
  - software as a service
  - the only place where generative AI can really make money
  - Companies buying hundreds or thousands of seats
evaluator_interpretation:
  - The ordinary reading in this profitability-focused passage is that commercially substantial, sustainable profits from generative AI require selling software as a service.
  - The discussion emphasizes enterprise seats, but does not clearly exclude consumer software subscriptions from SaaS.
  - A counterexample must earn substantial profits from a generative-AI offering outside software subscriptions. Advertising, licensing or services could qualify if their profits are established.
  - General AI revenue, hardware sales and a diversified company's overall profits do not by themselves establish profits from a generative-AI offering.
  - Use April through June 2025, the latest completed calendar quarter that public reporting could cover before the post, because the sentence describes an ongoing state without naming a period.
support_condition: Broad, credible evidence establishes that commercially substantial generative-AI profits in the target period were confined to software-as-a-service businesses.
contradiction_condition: At least one documented, commercially substantial generative-AI business outside software subscriptions earned sustainable profits in the target period.
measurement_requirements: Identify the generative-AI offering, its business model, attributable revenue and costs, and evidence of meaningful profitability. Revenue alone is insufficient under this reading.
source_requirements: Prefer product-level financial disclosures or reliable reporting based on financial records. Do not infer generative-AI profitability from consolidated company results.
