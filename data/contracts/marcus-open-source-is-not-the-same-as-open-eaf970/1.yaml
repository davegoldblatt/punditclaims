ambiguity_flags:
  - Ongoing state has no explicit reporting period; the post-date public-release snapshot is used.
  - "'Often' has no denominator or threshold."
  - "'A lot of key hypotheses' does not identify a complete set."
  - "'Peer inside the process' could mean partial documentation, direct corpus inspection or privileged regulatory access."
  - Open-weight releases differ in which additional artifacts they disclose.
