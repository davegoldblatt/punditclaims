assessment_axis: historical_observation
explicit_source_elements:
  - developers often can’t really use the open-weight models
  - scientists can’t use them to test a lot of key hypotheses
  - regulators can’t peer inside the process
  - you can’t even see the training data
  - whether the answers to your favorite benchmarks are actually already in the training data
evaluator_interpretation:
  - Read in context, the claim concerns obstacles caused by withholding original training data and training procedures, including controlled changes to the original training corpus and direct inspection of its contents.
  - The ordinary reading is that these restrictions obstruct substantial classes of development, scientific investigation and regulatory inspection. It does not say that every application or scientific experiment is impossible.
  - Because this describes an ongoing technical state rather than a reporting period, use the public-release state on the post date, 2026-08-10.
  - Assess what outsiders can obtain through public releases. Do not assume that regulators lack separate legal powers or confidential access.
  - No numerical threshold is supplied for 'often' or 'a lot'; do not invent a percentage.
support_condition: Evidence covering a meaningful range of contemporary open-weight releases shows that unavailable original data or procedures prevent the specified training interventions and direct audits, with evidence that these are recurring limitations for developers and researchers.
contradiction_condition: Evidence shows that outsiders generally have the artifacts or validated methods needed to perform the specified interventions and inspections. Demonstrating an unrelated application or a single successful experiment is insufficient to contradict the qualified claim.
measurement_requirements: Distinguish direct inspection and controlled retraining from statistical inference about training data, ordinary fine-tuning, and output evaluation. Establish the breadth of the restriction across releases and tasks.
source_requirements: Dated release inventories, training documentation, reproducible research and records of regulatory access. Historical studies outside the target period are context.
