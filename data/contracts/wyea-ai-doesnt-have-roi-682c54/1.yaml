assessment_axis: causal_assessment
explicit_source_elements:
  - Nobody Can Measure
  - AI’s Return On Investment
  - Because It Doesn’t Have One
evaluator_interpretation:
  - In context, AI means deployed generative AI, and ROI means a positive financial return to an adopting organization.
  - The ordinary reading is that no organization has demonstrated benefits exceeding its AI investment and operating costs as of June 2, 2026.
  - A counterexample must account for implementation, integration, training, operation, and human review. Revenue gains or estimated time savings alone do not establish net ROI.
  - This is a general claim about AI adoption, not a claim about a named company's financial metric; metric_scope is therefore null.
support_condition: Evidence establishes that relevant deployments have no positive net return and that this absence explains the alleged inability to measure ROI. A collection of unsuccessful projects alone cannot establish the universal claim.
contradiction_condition: At least one credible deployment record establishes a measured positive financial return, after full implementation and operating costs, for activity occurring by the post date.
measurement_requirements: Benefits and costs must concern the same deployment and period, with a defensible baseline and attribution to AI. Separate realized returns from forecasts, annualized estimates, and unmonetized capacity.
source_requirements: Prefer deployment-level financial records or independent research. Company disclosures and surveys require enough methodological detail to establish what their ROI includes.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AI could denote all AI technologies or the generative AI systems discussed in the post.
  - ROI is not defined, including its cost boundary and measurement period.
  - The wording could refer to individual deployments or economy-wide returns; the universal wording supports testing individual deployments.
