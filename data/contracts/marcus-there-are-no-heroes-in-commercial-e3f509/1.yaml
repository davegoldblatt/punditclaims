assessment_axis: forecast_outcome
explicit_source_elements:
  - zero chance
  - double human life span
  - in the next decade
  - we still need to test them
evaluator_interpretation:
  - Read the next decade as the ten years ending March 8, 2036.
  - The plain reading is a doubling of how long humans can typically live relative to the March 2026 baseline, demonstrated by human demographic or clinical evidence.
  - A change in an aging biomarker, improvement in one disease, or animal lifespan extension does not itself qualify.
  - The source does not distinguish population life expectancy, attainable biological lifespan, and maximum verified lifespan. These measures must not be interchanged.
  - Assess the categorical prediction of non-occurrence; a single outcome cannot establish a literal zero probability.
support_condition: After March 8, 2036, suitable human evidence shows that the specified lifespan measure did not double during the forecast window.
contradiction_condition: Reliable human evidence establishes a doubling of typical lifespan relative to the same March 2026 baseline by March 8, 2036.
measurement_requirements: An explicit lifespan measure and population, a comparable baseline, and validated human survival or demographic evidence. Model projections and unvalidated surrogate endpoints are insufficient.
source_requirements: Official demographic statistics or independently scrutinized human clinical evidence, with methods and observation periods disclosed.
metric_scope: null
original_horizon: in the next decade
horizon_interval:
  start: 2026-03-08
  end: 2036-03-08
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A demonstrated doubling within the window would contradict the prediction immediately. No early absence of doubling can establish support.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Human life span could mean typical lifespan, population life expectancy, or maximum lifespan.
  - No baseline population or numerical baseline is supplied.
  - Developing an effective intervention and observing its full survival effect can occur at different times.
