explicit_source_elements:
  - a significant number
  - real world coders
  - deeply frustrated
  - automated coding tools like Cursor.AI
  - in part powered by Anthropic’s Claude
evaluator_interpretation:
  - Assess the substantive proposition supplied for grading, rather than the separate allegation about what the podcast omitted.
  - Significant number means a substantial, non-isolated group of working programmers; it does not require a majority.
  - Deep frustration means strongly expressed dissatisfaction or serious workflow disruption, rather than merely acknowledging limitations.
  - "For this ongoing observation, use the current calendar quarter through the post: January 1 to March 2, 2025. No formal reporting interval is specified."
support_condition: Contemporaneous survey evidence or a substantial documented body of working-programmer reports establishes strong frustration, and contemporaneous documentation establishes Cursor's use of Claude.
contradiction_condition: Credible contemporaneous evidence establishes that strong frustration was confined to isolated cases, or that Cursor did not use Claude. High satisfaction alone does not disprove the existence of a substantial frustrated minority.
measurement_requirements: Distinguish working programmers from unidentified users, frustration from model distrust, and contemporaneous experiences from later developments.
source_requirements: Prefer dated developer surveys, attributable firsthand reports, and Cursor's own model announcements.
