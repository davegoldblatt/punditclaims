assessment_axis: causal_assessment
explicit_source_elements:
  - as more AI data center debt gets issued
  - said debt becomes more expensive
  - the more competition it faces
  - the more risk an investor carries by holding it
evaluator_interpretation:
  - The ordinary reading is that growing AI-related debt supply puts upward pressure on its financing cost through competition for investors and concentrated exposure.
  - Measure financing cost using spreads over comparable government debt, rather than nominal yields alone.
  - The claim describes a market tendency, not an assertion that every individual issue must price more expensively.
  - The surrounding discussion anchors the current episode to July 28 through September 29, 2026.
  - This is a sector pricing mechanism, not a claim about a particular company's accounting figures.
support_condition: Contemporaneous comparisons show AI-related borrowing spreads widening as supply grows, with credible evidence attributing the repricing to issuance pressure after considering benchmark rates, maturity and credit quality.
contradiction_condition: Comparable evidence shows that the asserted supply pressure was absent or that the relevant repricing was explained by other factors without a material issuance effect.
measurement_requirements: Issuance volumes, comparable-maturity credit spreads, non-AI benchmarks and assessments of credit fundamentals. Distinguish investor concentration risk from issuer default risk.
source_requirements: Primary market analysis or transaction data with identifiable observation dates and methods. Market commentary alone must be identified as attribution rather than experimental proof.
