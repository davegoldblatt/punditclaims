assessment_axis: historical_observation
explicit_source_elements:
  - $37 billion in annualized AI run rate
  - mostly taken up by OpenAI’s voracious demands
  - only ever seems to expand
  - 20 million lost souls paying for Microsoft 365 Copilot
evaluator_interpretation:
  - The measurable assertions concern Microsoft's annualized AI revenue run rate, OpenAI's share of it, and paid Microsoft 365 Copilot seats.
  - The ordinary reading of 'mostly' is more than half attributable to providing compute to OpenAI.
  - Use Microsoft's fiscal quarter ending March 31, 2026, the latest reported quarter before publication. Treat the headline figures as rounded.
  - Paid seats are the ordinary commercial meaning of people paying here; they need not represent individual purchasers or active users.
  - "'Only ever seems to expand' expresses an impression. It supplies neither a firm exclusivity claim nor a measurable predominance test for growth, and receives no separate binary score."
support_condition: Same-period evidence confirms approximately $37 billion in annualized AI revenue, approximately 20 million paid Copilot seats, and an OpenAI compute contribution exceeding half of that run rate.
contradiction_condition: Comparable evidence disproves a headline figure or establishes that OpenAI compute contributes no more than half of the same AI run rate. Evidence of other growth sources alone does not contradict the qualified impression.
measurement_requirements: Match the reporting period and annualization method. Separate OpenAI compute purchases from revenue sharing, sales to other customers using OpenAI models, bookings, and remaining performance obligations.
source_requirements: Microsoft disclosures or reliable records reconciling OpenAI compute revenue to Microsoft's reported AI run rate.
