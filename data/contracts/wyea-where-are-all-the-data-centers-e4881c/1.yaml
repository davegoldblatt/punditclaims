interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The ongoing observation is assigned to the latest reported quarter before publication.
  - "'Mostly' is interpreted as more than half."
  - "'Only ever seems' qualifies the growth attribution and supplies no historical starting date."
  - People and paid seats are not identical measures.
  - OpenAI compute revenue and all revenue from OpenAI are not interchangeable.
