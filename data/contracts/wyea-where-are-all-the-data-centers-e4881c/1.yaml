assessment_axis: historical_observation
explicit_source_elements:
  - $37 billion in annualized AI run rate
  - mostly taken up by OpenAI’s voracious demands for its :compute
  - only ever seems to expand
  - 20 million lost souls paying for Microsoft 365 Copilot
evaluator_interpretation:
  - Read 'mostly' as more than half of the AI revenue run rate attributable to compute purchased by OpenAI.
  - Use Microsoft's fiscal third quarter ended March 31, 2026, the latest reported quarter before the post.
  - Treat the $37 billion and 20 million figures as rounded descriptions of the reported run rate and paid seats.
  - Paid seats do not necessarily represent distinct individuals paying personally.
  - "Preserve the qualification 'seems': assess the asserted concentration of growth without converting it into an absolute claim that no other AI product earns revenue."
  - The run rate is a company-reported measure, not realized annual revenue.
support_condition: Microsoft confirms the headline figures, and a same-period breakdown shows OpenAI compute contributes more than half of the run rate, with growth predominantly attributable to OpenAI compute and Microsoft 365 Copilot.
contradiction_condition: A comparable breakdown shows OpenAI compute contributes half or less, or demonstrates material growth drivers inconsistent with the asserted concentration. A material error in the headline figures would also contradict that component.
measurement_requirements: A consistent definition of Microsoft's AI revenue run rate; customer and product contributions at the March-quarter measurement date; comparable growth contributions; and paid Microsoft 365 Copilot seats. Exclude OpenAI investment gains and distinguish compute purchases from revenue-sharing payments.
source_requirements: Microsoft disclosures or credible reporting with a same-period customer and product breakdown. Do not divide realized fiscal-year revenue by a point-in-time annualized run rate.
metric_scope:
  company: Microsoft
  metric: AI revenue annual run rate
  currency: USD
  units: billions per year
  accounting_basis: company_reported
  fiscal_or_calendar: fiscal
  period_start: 2026-01-01
  period_end: 2026-03-31
