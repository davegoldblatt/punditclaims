assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA’s revenue growth
  - almost entirely
  - speculative purchases
  - hyperscalers and neoclouds
  - take years to install its GPUs
evaluator_interpretation:
  - I read revenue growth as growth in realized consolidated revenue, rather than orders, financing commitments or annualized revenue.
  - Because no period is stated, I use the latest reported fiscal quarter before the post, ending July 26, 2026, with the corresponding prior-year quarter as the growth baseline.
  - Almost entirely means an overwhelming share, not merely a majority. No precise percentage is imposed.
  - Speculative purchases means purchases ahead of substantiated end-use demand. Installation taking years means at least two years from purchase to operational deployment.
  - The claim does not identify an accounting basis. That remains unknown and prevents a decisive financial comparison without clarification.
support_condition: Customer-linked revenue and deployment records show that an overwhelming share of NVIDIA's incremental revenue came from hyperscaler and neocloud purchases made ahead of substantiated demand, with the purchased GPUs taking at least two years to enter operation.
contradiction_condition: Comparable records show that a substantial share of incremental revenue came from other sources or from GPUs deployed promptly against substantiated demand, making the claimed overwhelming attribution untenable.
measurement_requirements: Match recognized incremental revenue to ultimate purchasers, purchase and delivery dates, operational deployment dates and demand commitments. Multi-year construction plans alone do not measure purchased-GPU installation delays.
source_requirements: NVIDIA financial disclosures plus customer-level procurement, deployment and demand records covering a representative share of incremental revenue.
