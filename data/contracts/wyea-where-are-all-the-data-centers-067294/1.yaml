assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority
  - projects I've found
  - either in a mysterious limbo state
  - in most cases
  - under construction years after breaking ground
evaluator_interpretation:
  - Assess the projects discussed in the post, not the worldwide data-center market or only the examples selected as unfinished.
  - The claim describes project status at publication. Use May 12, 2026 as the snapshot date; earlier updates are context unless they explicitly establish status on that date.
  - Read years after groundbreaking as at least approximately two years, and vast majority as a clear large majority without inventing a precise percentage.
  - Distinguish a campus with operating buildings and unfinished expansion from a project with no operational facility.
  - An absent opening announcement or stale directory entry is not affirmative proof of limbo.
support_condition: A sufficiently complete roster, with consistent project boundaries and verified status at publication, shows a clear large majority in documented limbo or still under construction approximately two or more years after groundbreaking, with the latter category predominant as asserted.
contradiction_condition: A sufficiently complete roster shows that a clear majority were outside the asserted categories, or that the claimed predominance of multi-year unfinished construction does not hold.
measurement_requirements: A denominator covering the projects found, verified groundbreaking dates, dated status records, and separate labels for fully operational, partly operational, actively constructing, paused, and genuinely unknown.
source_requirements: Contemporaneous operator updates, permits, commissioning records, or reliable reporting. Later directory status and missing announcements cannot independently establish the May 12 snapshot.
