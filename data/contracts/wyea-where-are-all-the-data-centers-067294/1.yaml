ambiguity_flags:
  - Projects I've found does not identify a complete denominator.
  - Vast majority and mysterious limbo have no specified thresholds.
  - Campus-level and building-level project boundaries can change the count.
  - The publication-date snapshot is inferred for an ongoing-state claim.
  - In most cases could refer to all projects or only the allegedly unfinished group.
