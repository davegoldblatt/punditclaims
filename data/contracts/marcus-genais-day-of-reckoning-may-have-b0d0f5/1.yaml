early_resolution_rule: A documented completed year with at least US$1 trillion in comparable AI-market revenue can permit resolution if dated technical and commercial evidence also establishes whether a new approach beyond GenAI was necessary. Spending forecasts or the passage of time cannot settle it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is supplied.
  - The boundaries and accounting basis of the AI market are unspecified.
  - Different kind of AI does not define how hybrid systems would be classified.
  - Reliable and trustworthy have no operational thresholds.
  - Necessity is stronger than observing that a new technology contributed.
