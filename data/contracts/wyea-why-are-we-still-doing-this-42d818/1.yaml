assessment_axis: historical_observation
explicit_source_elements:
  - for three god damn years
  - LLMs lack
  - obvious, replicable, industrially-necessary outcomes
  - a 3x, 4x or 10x price increase tenable
evaluator_interpretation:
  - The ordinary economic reading is that repeatable business benefits would not justify paying three, four or ten times the contemporary price for equivalent LLM usage.
  - A useful deployment alone does not establish affordability at those multiples. Benefits must be compared with model charges, implementation, supervision, error correction and alternatives.
  - I treat the preceding three years as the approximate observation window, ending on the post date.
  - Industrial necessity means a material operational use with demonstrated business value, not literal impossibility of working without an LLM.
support_condition: Representative deployment evidence shows that repeatable business benefits are insufficient to sustain the named price multiples after relevant costs.
contradiction_condition: Documented, repeatable industrial deployments demonstrate sufficient attributable net benefits to remain economically worthwhile at the named price multiples.
measurement_requirements: Identify the product, baseline price, usage, realized benefits, implementation and oversight costs, quality effects and credible alternatives. Report the threefold, fourfold and tenfold cases separately.
source_requirements: Prefer deployment records and controlled field studies. Vendor or customer testimonials without a cost comparison are context.
