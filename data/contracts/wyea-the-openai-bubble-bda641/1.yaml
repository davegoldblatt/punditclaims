assessment_axis: historical_observation
explicit_source_elements:
  - Stargate
  - is horribly, impossibly delayed
  - Context links construction progress to Oracle's capacity delivery and FY2028 revenue expectations.
evaluator_interpretation:
  - The ordinary reading is that Stargate's buildout was substantially behind its announced construction and operational schedules when the post appeared.
  - The surrounding discussion principally concerns Oracle-linked US campuses. The claim does not require every campus to be delayed.
  - Severe delay means substantial schedule slippage affecting a material share of the buildout, rather than an isolated setback or unfinished work whose deadline has not arrived.
  - Construction status has no standard reporting quarter. I use July-to-date through publication, July 1–15, 2026, for the ongoing observation. Earlier announcements establish baselines but are context rather than July outcome evidence.
  - I treat 'impossibly' as emphasis on severity, not a separate prediction that completion can never occur.
support_condition: Dated records establish that, during the target period, major Stargate delivery milestones affecting a material share of planned capacity had slipped substantially against previously announced schedules.
contradiction_condition: Dated records covering the major campuses establish that delivery was meeting the previously announced schedules, with any slippage limited enough to rule out severe delay across the buildout.
measurement_requirements: Compare original and revised dates for the same campuses, phases and milestones. Distinguish construction completion, energization, tenant handover and operational compute. Do not treat facility power and critical IT capacity as interchangeable.
source_requirements: Prefer dated developer and operator disclosures, permitting records and independent construction measurements. Retrospective reporting must identify when the reported status held. Company assurances alone do not establish timely delivery.
