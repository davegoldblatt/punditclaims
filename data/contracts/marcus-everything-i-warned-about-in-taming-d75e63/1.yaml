ambiguity_flags:
  - Excessive has no stated cost-benefit standard.
  - Almost none has no numerical or coverage threshold and is explicitly hedged.
  - The US could mean federal policy alone or all US jurisdictions.
  - The ongoing regulatory state is assessed as of the post date.
  - Vance's possession of evidence is broader than evidence cited publicly.
