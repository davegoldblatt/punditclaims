explicit_source_elements:
  - What Vance doesn’t have
  - any evidence whatsoever
  - the US has excessive regulation around AI
  - arguably, in fact, it has almost none at all
evaluator_interpretation:
  - The firm assertion concerns whether Vance had evidence supporting excessive US AI regulation as of his February 11, 2025 remarks. It is broader than saying he cited no such evidence in that speech.
  - The ordinary reading of evidence includes credible examples or analysis suggesting unnecessarily burdensome US AI regulation. It need not conclusively prove that regulation is excessive.
  - US regulation includes relevant federal, state, local, and sectoral requirements. European requirements alone cannot establish excessive US regulation.
  - The explicitly hedged phrase 'arguably ... almost none at all' supplies neither a firm scarcity assertion nor a measurable threshold. It cannot independently determine support or contradiction.
  - The target is the state of affairs on the day of the speech and post, rather than a reporting quarter.
support_condition: A sufficiently complete record of the basis for Vance's position establishes that he had no evidence supporting excessive US AI regulation. Failure to cite evidence in one speech is insufficient by itself.
contradiction_condition: An identifiable, credible example or analysis supports excessive US AI regulation, and the record establishes that Vance possessed or relied on it by February 11, 2025. Merely identifying an existing law or a compliance cost is insufficient.
measurement_requirements: Distinguish evidence of an unnecessary or disproportionate regulatory burden from the existence of regulation, ordinary compliance costs, and unsupported political assertions. Do not invent a numerical threshold for 'excessive' or 'almost none'.
source_requirements: Use the complete speech and contemporaneous records of Vance's evidentiary basis, checked against underlying regulatory or empirical sources. Later publications may document earlier facts but cannot substitute later conditions for those on the post date.
