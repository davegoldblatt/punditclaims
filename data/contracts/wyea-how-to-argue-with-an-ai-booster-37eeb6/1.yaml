assessment_axis: forecast_outcome
explicit_source_elements:
  - the companies buying these GPUs
  - for the most part
  - not going to go bust
  - once the AI bubble bursts
evaluator_interpretation:
  - Assess the supplied bankruptcy forecast. The adjacent assertion about 42% of NVIDIA revenue is background, not a separate claim being graded.
  - In context, the target is major corporate AI-GPU buyers, particularly large technology companies. The speaker does not supply a complete roster.
  - Read for the most part as a majority of the relevant buyer companies, rather than a majority of their purchase dollars.
  - Read go bust as bankruptcy, insolvent liquidation, or a comparable business failure.
  - Read the antecedent as a broad collapse of the AI investment boom relevant to those buyers. A regional stock-market decline does not automatically establish it.
  - No deadline or duration of the post-collapse observation period is supplied.
support_condition: After the relevant AI investment collapse and its financial aftermath, a majority of the identified pre-collapse buyer cohort remains solvent and operating.
contradiction_condition: Following the qualifying collapse, bankruptcy or comparable insolvency affects enough of the identified buyer cohort that a majority does not survive.
measurement_requirements: Establish the collapse, its date and scope, the pre-collapse buyer cohort, insolvency outcomes, and the observation window. Share-price losses alone do not establish bankruptcy.
source_requirements: Use market and investment evidence to establish the antecedent, then court records, insolvency notices, and company financial reporting for company outcomes.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Only after the antecedent is established can dated insolvencies conclusively contradict majority survival. Current solvency before an established collapse cannot settle the forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AI bubble bursts has no specified market, magnitude, or duration.
  - The buyer cohort is unspecified.
  - For the most part could refer to company count or purchasing share.
  - No post-collapse observation window.
  - Go bust is informal.
retrospective_or_prospective: retrospective
