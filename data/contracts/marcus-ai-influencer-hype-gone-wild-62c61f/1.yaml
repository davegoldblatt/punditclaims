assessment_axis: historical_observation
explicit_source_elements:
  - practically everyone has tried it
  - they are not always satisfied with the results
  - reply to a LinkedIn post claiming AI is being ignored
evaluator_interpretation:
  - "'It' means generative AI."
  - He named no population. Read plainly, 'practically everyone' means a large majority of the relevant group, at least well above half and close to all.
  - "Two readings are possible: the general (US) public, or businesses and tech leaders, the group in the CNBC poll he later cites. Both are assessed."
  - "'Not always satisfied' holds if a large share of users report doubts about value or results."
  - He described a current state without naming a period. The target period is August to October 2024, the latest survey data available before the 2024-10-31 post.
support_condition: Surveys from around late 2024 show that nearly all of the relevant population had tried generative AI, and that many users were unsure of or unhappy with its value.
contradiction_condition: Representative surveys from around late 2024 show that a large share (for example, most) of the relevant population had not tried generative AI, or that users were broadly satisfied.
measurement_requirements: Share who had ever or recently used generative AI; share reporting the tool was worth it or satisfactory.
source_requirements: Nationally representative surveys (Fed, Pew) for the public; CNBC Technology Executive Council survey for businesses.
