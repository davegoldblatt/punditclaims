explicit_source_elements:
  - both Anthropic and OpenAI
  - incinerating money
  - no real path to any kind of sustainability
evaluator_interpretation:
  - Read incinerating money as substantial negative free cash flow, rather than treating financing proceeds or accounting losses as cash expenditure.
  - Read sustainability as the ability to cover ongoing business costs from customers without repeated external funding.
  - Use calendar 2025 for the cash-burn component, following the surrounding annual financial discussion.
  - Assess the asserted absence of a viable path as a present assessment at publication, not as a forecast with an invented deadline.
support_condition: Both companies have substantial cash burn, and evidence establishes that their documented operating plans cannot plausibly produce self-funding businesses.
contradiction_condition: One company is already sustainably self-funding in the relevant period, or documented and sufficiently substantiated economics establish a viable route to that state.
measurement_requirements: Separate free cash flow from net losses, operating losses, financing inflows, and future spending commitments. A projected breakeven date alone does not demonstrate viability.
source_requirements: Financial records or credible financial reporting, together with documented assumptions underlying any claimed route to sustainability.
