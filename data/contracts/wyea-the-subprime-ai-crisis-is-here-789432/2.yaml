  - burn $4 or $5 for every $1 of revenue
evaluator_interpretation:
  - "Plain reading: each named company spends about $4 to $5 in total for each $1 of revenue it earns. Equivalently, losses or cash burn of roughly 3 to 5 times revenue. A ratio well below about 3x total spend to revenue for a company would contradict it for that company."
  - "'These are all' applies the ratio to each of the five companies, not as an average."
  - "Present tense with no period named: I use the latest period public figures could describe before the post, 2025 through Q1 2026."
  - Gross margin alone does not settle total spend per dollar, but it constrains it.
support_condition: Reliable figures for each named company (or most of them) showing total spending or cash burn of about 4 to 5 times revenue in 2025 to early 2026.
contradiction_condition: Reliable figures for one or more named companies showing total spending far below 4 to 5 times revenue, e.g. near break-even or modest losses relative to revenue, in 2025 to early 2026.
measurement_requirements: Revenue and total expenses or cash burn for each of the five companies over the same period.
source_requirements: Company financial statements or disclosures, or reputable press reports of internal figures.
