assessment_axis: historical_observation
explicit_source_elements:
  - These are all
  - burn $4 or $5
  - for every $1 of revenue
  - Cursor, Perplexity, Harvey, Lovable or Replit
evaluator_interpretation:
  - Apply the ratio to each named company individually, rather than their combined finances.
  - Read 'burn' as net cash consumed by the business, excluding financing receipts, divided by realized revenue for the same period.
  - A plausible alternative is gross spending per revenue dollar; retain that ambiguity rather than silently equating spending with net burn.
  - Use calendar 2025 as the latest completed annual reporting period before the post. No period is specified, and the companies may have different fiscal years.
  - Read the dollar notation as USD and the approximate claimed range as four to five dollars per dollar.
  - No cited financial source or accounting convention appears in the supplied words, so accounting_basis remains unknown.
support_condition: Comparable accounts show approximately $4–$5 of net cash consumed for each dollar of realized revenue at every named company during the target period, on a clarified accounting basis.
contradiction_condition: Comparable accounts for at least one named company show a materially different ratio during the target period, on a clarified accounting basis. Gross margins, ARR and financing amounts alone cannot establish this.
measurement_requirements: Obtain company-by-company cash consumption and realized revenue for matching dates. Exclude fundraising from revenue and do not substitute net loss, cost of revenue, ARR or annualized sales pace for the required measures.
source_requirements: Financial statements, company disclosures or reliable reporting based on identifiable financial records. The accounting basis must be established before a supported or contradicted score.
