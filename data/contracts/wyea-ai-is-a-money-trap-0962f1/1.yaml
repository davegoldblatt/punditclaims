assessment_axis: historical_observation
explicit_source_elements:
  - massive buildout of data centers
  - chips, servers, and raw materials
  - a massive, dominant economic force
  - an industry that is yet to prove it can make real revenues
evaluator_interpretation:
  - The surrounding discussion anchors the economic comparison to the United States in the first half of 2025.
  - The ordinary reading of dominant economic force is a leading contributor to economic growth, not a majority of the economy's total output.
  - “Real revenues” means commercially substantial realized sales. It does not mean financing, annualized run rates, or profit.
  - The context acknowledges existing revenue, so interpreting the phrase as literally zero sales would be unfair.
  - This is an industry-level compound claim rather than a specified company's monetary figure; contract metric_scope is null.
support_condition: Period-matched evidence establishes that the specified physical buildout was a leading contributor to economic growth and that the downstream generative-AI industry had not established commercially substantial realized sales.
contradiction_condition: Period-matched evidence establishes that the specified buildout was not a leading economic contributor, or establishes substantial realized generative-AI sales inconsistent with the revenue characterization.
measurement_requirements: Separate physical AI infrastructure from all software, research, non-AI computing, and imported equipment. Compare realized downstream AI revenue with the commercial scale being discussed without substituting profit for revenue.
source_requirements: National accounts and construction statistics for economic contribution; company disclosures or clearly sourced reporting for realized AI revenues.
