ambiguity_flags:
  - Replaced could mean losing a job or being substituted for on a particular task; the training context favors job displacement.
  - The zero-replacement assertion has worldwide scope but names no employment registry.
  - Many parts of the world supplies no geographic threshold.
  - The cumulative replacement assertion and ongoing shortage assertion have different temporal scopes.
  - For ongoing shortages, the contract uses the latest public workforce reporting before the post; reporting dates differ by country.
  - Hundreds of startups has no defined population or counting method.
