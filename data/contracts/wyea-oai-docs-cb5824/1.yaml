explicit_source_elements:
  - Even if revenues were to match those that had been reported
  - inference spend on Azure consumes them
  - appears to scale linearly above revenue
evaluator_interpretation:
  - The context describes calendar 2024 through September 2025. Comparisons must use matching periods, particularly 2024 and H1 2025.
  - The ordinary reading of 'consumes' is that Azure inference expenditure equals or exceeds realized revenue.
  - The qualified scaling statement means that inference spending appears to grow roughly proportionally with revenue while remaining above it. It does not commit to an exact statistical slope.
  - The reported-revenue premise is a comparison scenario, not a conditional forecast.
  - The figures are treated as document-based and press-reported estimates, without an asserted accounting standard.
support_condition: Independently substantiated, comparable figures show Azure inference expenditure at least equal to reported realized revenue, with a matched series supporting the stated growth pattern.
contradiction_condition: Comparable records show Azure inference spending below revenue in the periods described, or a growth pattern inconsistent with the claimed proportional relationship.
measurement_requirements: Separate Azure inference from training, other providers, revenue sharing, and other expenses. Reconcile credits, cash payments, and accrued expenses. Compare identical calendar periods and distinguish realized revenue from annualized run rate.
source_requirements: Company records or independently verified financial reporting with definitions and period breakdowns. Repetition of Zitron's figures does not independently verify them.
