assessment_axis: historical_observation
explicit_source_elements:
  - Even if revenues were to match those that had been reported
  - OpenAI’s inference spend on Azure consumes them
  - appears to scale linearly above revenue
evaluator_interpretation:
  - Only the firm 'consumes them' clause is graded. Its ordinary meaning here is that Azure inference spending equals or exceeds the reported revenue being compared.
  - The expressly hedged linear-scaling clause is excluded from binary grading.
  - "The comparison uses CY2024 and H1 CY2025 separately: the context supplies reported revenue comparators for those periods. September spending cannot be compared with six-month revenue."
  - "'Even if' grants the reported revenue amounts for the comparison; it is not a forecast whose antecedent must occur."
  - The contract concerns reported estimates of realized spending and revenue, not annualized run rates or total compute commitments.
support_condition: Independent, comparable evidence establishes that Azure inference spending was at least $3.7 billion in CY2024 and at least $4.3 billion in H1 CY2025.
contradiction_condition: Independent, comparable evidence establishes Azure inference spending below the corresponding reported revenue benchmark. Opposite findings for the two periods would produce a mixed assessment.
measurement_requirements: Measure Azure inference spending separately from training, research, other providers, and commitments. Reconcile credits, cash payments, expense recognition, and free-user serving costs before comparing each period with its reported revenue benchmark.
source_requirements: Prefer company records or authenticated financial documents. Independent reporting is acceptable if its figures and accounting coverage can be checked. Repetitions of Zitron's figures do not independently establish them.
