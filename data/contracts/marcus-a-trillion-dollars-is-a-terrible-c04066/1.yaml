  - all the big tech companies, from OpenAI to Google to Meta to xAI to Anthropic to several Chinese companies
  - keep doing the same experiment over and over
  - building ever larger LLMs
  - in hopes of reaching AGI
evaluator_interpretation:
  - This describes an ongoing state, so the target period is 2025 up to the post date, the latest period public evidence could cover.
  - "Plain reading: the leading labs keep scaling up LLM training (larger models and compute) and frame it as a path to AGI or superintelligence. 'To a first approximation' allows for differences in method."
support_condition: Several of the named labs publicly pursued larger models or compute build-outs in 2025, framed as steps toward AGI or superintelligence.
contradiction_condition: The named labs had largely stopped scaling LLMs, or did not frame their work as aimed at AGI, or had switched to clearly different paradigms.
