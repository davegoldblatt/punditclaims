evaluator_interpretation:
  - The surrounding discussion identifies fiscal 2024 and the company's reported $863 million loss.
  - Read losing money as consolidated net loss, rather than operating loss, cash burn, or the direct margin on individual compute contracts.
  - Interpret hundreds of millions conventionally as at least $200 million and below $1 billion.
  - Use company_reported accounting basis because the surrounding discussion relies on company filing figures.
  - Doing so identifies the company's business; it does not establish that every component of net loss was a direct cost of delivering compute.
