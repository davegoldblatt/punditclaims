assessment_axis: historical_observation
explicit_source_elements:
  - In recent years
  - some have tried to redefine AGI, weakening the term
  - We see no evidence that the original standards have been met
evaluator_interpretation:
  - "Part 1: in recent years, notable actors proposed AGI definitions looser than the original 'robust, flexible competence across environments' sense. Examples are economic or profit-based definitions."
  - "Part 2: as of the post, no public evaluation showed a system meeting the original robust-generality standard. The clearest public test of a broad human-level standard is used as a proxy (Hendrycks et al. 2025)."
  - "'Weakening' is an evaluative word. It is read as 'less demanding than a cognitive generality standard'."
support_condition: Documented recent cases of AGI being redefined in economic, profit, or benchmark terms, and no public evaluation before the post showing a system meeting a robust general-intelligence standard.
contradiction_condition: No such redefinitions can be found, or a credible public evaluation before the post shows a system meeting the original robust-generality criteria.
measurement_requirements: Records of AGI definitions used by major labs or contracts from about 2023 on, plus public broad-capability evaluations before 2026-02-17.
source_requirements: Reputable news reports of company definitions; preprints or papers on AGI evaluation.
