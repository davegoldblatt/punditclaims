evaluator_interpretation:
  - The plain reading is that meaningful practical adoption remained negligible, particularly workplace adoption, rather than merely falling short of publicity.
  - Use the second calendar quarter of 2025, the latest completed quarter before publication, for the ongoing-state observation.
  - Paid workplace deployment at a scale of millions is significant in the ordinary sense. Adoption need not establish profitability, productivity gains, or majority penetration.
  - ChatGPT is included because the claim concerns generative AI services generally; its casual-user count alone would not settle the contextual workplace objection.
support_condition: Representative measurements and deployment records show negligible practical use, with apparent scale largely confined to casual trials or registrations.
contradiction_condition: Reliable records show substantial paid workplace deployment or substantial recurring practical use during the target period.
measurement_requirements: Separate paid seats, organizations, registered users, active users, and frequency of use. Distinguish generative AI from AI generally.
source_requirements: Representative surveys or identifiable product deployment disclosures, with dates and population definitions.
