explicit_source_elements:
  - at least 50%
  - Oracle’s AI revenues
  - are from OpenAI
evaluator_interpretation:
  - "'I think it’s fair to say' introduces an estimate with a firm numerical threshold, rather than making the proposition uncheckable."
  - Because this describes a current state and invokes Oracle's latest quarter, the target is fiscal Q1 2027, June 1 through August 31, 2026.
  - The surrounding annualization is read as an estimate of the current annual revenue pace based on that quarter, not revenue already earned over a complete year.
  - "'From OpenAI' means Oracle revenue attributable to OpenAI as customer. Contract backlog and customer prepayments are not recognized revenue."
support_condition: Comparable evidence establishes that OpenAI accounts for at least 50% of Oracle's AI revenue in the target quarter, or the consistently annualized equivalent.
contradiction_condition: Comparable evidence establishes that OpenAI accounts for less than 50% of Oracle's AI revenue in the target quarter.
measurement_requirements: Both Oracle's total AI revenue and its AI revenue attributable to OpenAI, using the same period, recognition rules and annualization. CPU revenue cannot automatically be classified as AI revenue.
source_requirements: Oracle customer-level disclosures or credible reporting with a documented basis for both numerator and denominator.
