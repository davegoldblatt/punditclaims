evaluator_interpretation:
  - Assess the January 2025 launch version, from launch through the post date.
  - Read the criticism as alleging severe practical unreliability in advertised browser tasks, not mathematically zero successful actions.
  - Exclude 'was a joke' as an evaluative description.
  - Operator's advertised scope was its own browser. Full desktop control and later ChatGPT agent versions are outside the product assessment.
  - No success-rate threshold is supplied; weigh observed completion, failures and required intervention without inventing one.
support_condition: Independent launch-version tests show serious failures or extensive intervention on ordinary advertised browser tasks.
contradiction_condition: Independent launch-version tests demonstrate useful completed tasks, materially limiting the broad suggestion that the product scarcely functioned.
measurement_requirements: Identify the version, tasks, successes, failures and user intervention. Separate task completion from speed or value. Treat underlying-model benchmarks as context for the deployed product.
source_requirements: Prefer firsthand launch-version testing with described tasks. Company benchmarks may supplement but cannot replace independent product tests.
