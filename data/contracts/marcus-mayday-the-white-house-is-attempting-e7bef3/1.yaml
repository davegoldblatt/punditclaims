explicit_source_elements:
  - per an important scoop from The Information
  - The White House
  - clearly now tight with big tech
  - is preparing to circumvent Congress altogether
evaluator_interpretation:
  - Preparing means developing executive action to challenge or obstruct state AI regulation without first obtaining new legislation.
  - Circumvent Congress describes the proposed route of action; it does not establish that the action would be unlawful or successful.
  - Tight with big tech is read as access and public policy alignment, not proof of corruption or industry authorship.
  - The preparation claim concerns November 19, 2025, consistent with the reference to breaking news in the last hours.
  - The reference to The Information is attribution, not a conditional forecast.
support_condition: A contemporaneous draft or independently corroborated reporting establishes that the White House was developing executive action against state AI laws without waiting for new legislation.
contradiction_condition: Reliable records establish that the reported preparation did not occur or that the proposal depended entirely on obtaining new congressional legislation.
measurement_requirements: Separate preparation from issuance, legal validity, and successful preemption.
source_requirements: A dated draft or official record is preferred; reporting by outlets that independently examined the draft is acceptable if the draft itself cannot be verified.
