assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI doesn’t have
  - $300 billion dollars
evaluator_interpretation:
  - The quotation describes OpenAI around September 11, 2025, rather than its finances when the quotation was republished.
  - The ordinary reading of 'have' is cash and readily available liquid assets already held. Valuation, future revenue and promised investment are separate measures.
  - The statement does not identify an accounting basis. The nearby reference to company profit projections does not establish the basis of this cash assertion.
  - This does not assert that the whole contract price was payable immediately.
support_condition: A reliable September 2025 financial record establishes that OpenAI held less than USD 300 billion in cash and readily available liquid assets, on an identifiable basis.
contradiction_condition: A comparable record establishes that OpenAI already held at least USD 300 billion.
measurement_requirements: A dated balance of cash and readily available liquid assets, with restrictions and accounting basis identified. Do not add revenue, valuation or undisbursed financing to cash.
source_requirements: Prefer OpenAI financial records or authenticated investor disclosures. Financial reporting may provide context where the underlying records are unavailable.
