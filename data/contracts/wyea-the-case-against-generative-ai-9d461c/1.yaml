assessment_axis: causal_assessment
explicit_source_elements:
  - still yet to get any tangible proof
  - AI is replacing software engineers
  - because it can’t
evaluator_interpretation:
  - Assess the public evidence and capabilities existing by September 29, 2025, rather than treating the sentence as an unlimited forecast.
  - In context, replacement means taking over an engineer's substantive responsibilities sufficiently to replace a position. Generating some code does not establish this.
  - Reduced hiring through human productivity gains is relevant counterevidence, but differs from independently performing the full role.
support_condition: Evidence must establish both the absence of documented replacement and that a demonstrated capability limitation explains that absence. Failed searches or isolated benchmark failures alone are insufficient.
contradiction_condition: A documented deployment must show AI taking over substantive engineering responsibilities and replacing positions by the post date, or directly disprove the claimed causal explanation.
measurement_requirements: Identify the responsibilities transferred, human supervision retained, positions displaced, deployment dates, and sustained quality of delivered work.
source_requirements: Prefer deployment records, employer disclosures and independent investigations. Layoffs coinciding with AI investment do not by themselves establish replacement.
