evaluator_interpretation:
  - This is a comparison involving the author's particular child, not an average nine-year-old.
  - Five-digit multiplication ordinarily means multiplying two five-digit integers.
  - Better is read primarily as a higher proportion of correct answers on comparable problems, with time and permitted aids disclosed.
  - The claim concerns the child's ability at the post date. It is not a conditional forecast.
  - An LLM is unspecified; a valid comparison must identify the contemporary model and its configuration.
support_condition: A documented comparison shows the named child answering comparable five-digit multiplication problems more accurately than an identified contemporary LLM under disclosed conditions.
contradiction_condition: A documented comparison under the claimed conditions shows the identified LLM matching or exceeding the child's accuracy.
measurement_requirements: The child's answers and model outputs, problem selection, scoring, sample size, timing, prompts, retries and permitted calculation aids.
source_requirements: An independently inspectable comparison involving this child. Generic arithmetic benchmarks and the author's assertion alone cannot settle the claim.
