assessment_axis: forecast_outcome
explicit_source_elements:
  - whenever AGI comes
  - operations over variables
  - including storing, retrieving and comparing values
  - will be crucial
evaluator_interpretation:
  - Treat arrival as a demonstrated system with broadly accepted human-level general cognitive capability. Broad acceptance is an evaluator safeguard.
  - Read operations over variables as reusable bindings between variables and values, with operations that store, retrieve, and compare those values in the system's reasoning.
  - The claim does not explicitly require a separate symbolic module. A neural implementation can qualify if it demonstrably performs the specified operations.
  - Incidental variables in implementation code do not establish a crucial cognitive mechanism.
  - Read crucial as central dependence. Test the arriving AGI without treating one implementation as proof about every possible AGI.
support_condition: The AGI condition is established, and architectural or mechanistic evidence shows that storing, retrieving, and comparing variable-bound values centrally enables its general capability.
contradiction_condition: The AGI condition is established, and sufficiently complete mechanistic evidence shows that it attains general capability without the specified variable operations, or retains that capability when they are disabled.
measurement_requirements: Broad capability evaluations, tests of reusable variable binding and value operations, and interventions establishing their contribution to general capability.
source_requirements: Public technical documentation, mechanistic studies, and independent capability assessments available by 2026-10-28. Ordinary computer memory use alone is insufficient.
