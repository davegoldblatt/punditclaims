explicit_source_elements:
  - Machines often solve them for the wrong reasons.
  - Building them is an unsolved problem within AI.
evaluator_interpretation:
  - The antecedent of 'them' is AI benchmarks.
  - The ordinary reading is that shortcut solutions recur and designing benchmarks that reliably measure the intended abilities remains an open research problem. This does not mean that no useful benchmarks exist.
  - "'Often' means a recurring, documented problem across tasks, not a specified percentage of all benchmark results."
  - The statement concerns the research state at publication. With no regular reporting period for this subject, the target period is the current calendar year through August 20, 2023.
support_condition: Research describing the target period documents recurring shortcut solutions and continuing difficulty constructing benchmarks that measure their intended abilities.
contradiction_condition: Broad validation shows that shortcut solutions are exceptional and that reliable benchmark construction is generally a resolved problem.
measurement_requirements: Evidence must distinguish intended task performance from success through irrelevant cues or dataset artifacts. The existence of useful benchmarks alone does not contradict the claim.
source_requirements: Original benchmark audits, experiments, or research reviews describing the research state by the post date; available by October 28, 2026.
