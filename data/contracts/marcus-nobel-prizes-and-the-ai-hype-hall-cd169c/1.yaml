assessment_axis: historical_observation
explicit_source_elements:
  - Nobel-calibre science
  - sound logic
  - reliable causal reasoning
  - originality
  - none of those are firmly in the grasp of current AI
evaluator_interpretation:
  - Current AI means systems existing by March 9, 2025, including specialized systems and systems using tools.
  - The plain reading is dependable command of each capability in demanding scientific work. It does not require perfect performance, and occasional successes do not establish dependable command.
  - The wording denies firm command of each capability separately. Establishing that AI lacked one capability would not establish the entire claim.
  - The target is the publicly reportable state of AI at publication. The interval has no stated starting date because existing systems and accumulated demonstrations inform that state; it ends on the publication date.
  - Nobel-calibre supplies scientific context, not a requirement that an AI receive a Nobel Prize.
support_condition: Representative, reproducible evaluations of systems existing at publication show substantial reliability limitations in logic and causal reasoning, while independently assessed scientific results establish comparable limitations in producing original findings. The evidence must cover all three components.
contradiction_condition: Reproducible evaluations or independently validated scientific work establish dependable command of at least one named capability at the demanding scientific level described. An isolated success or an AI-assisted human achievement alone is insufficient.
measurement_requirements: Identify model versions, human assistance, tools, task selection, correctness checks, repeated performance, and independent assessment of novelty. Assess logic, causal reasoning, and originality separately.
source_requirements: Prefer reproducible evaluations and peer-reviewed scientific results. Distinguish developer demonstrations from independent validation and restrict capability conclusions to systems existing at publication.
