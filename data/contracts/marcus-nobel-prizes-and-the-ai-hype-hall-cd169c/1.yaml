ambiguity_flags:
  - Firmly in the grasp has no stated reliability threshold.
  - Nobel-calibre has no operational definition.
  - Current AI could mean leading language models or the wider class of specialized and tool-assisted systems.
  - Originality could mean producing novel results or independently originating and directing a research programme.
  - The ongoing observation supplies no reporting interval; an as-of-publication assessment is used.
