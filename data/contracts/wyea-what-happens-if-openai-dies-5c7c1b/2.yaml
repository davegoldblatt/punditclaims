assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI clearly needs tens of billions of dollars
  - every few months
  - to keep up with its costs
  - will only need more money as it grows
  - pre-pay for compute costs for Amazon, Google, Microsoft, CoreWeave, Oracle, and Cerebras
evaluator_interpretation:
  - "The present-tense core is the testable part: OpenAI's costs, including compute prepayments, use up cash at a pace that needs tens of billions of dollars of new money every few months. Plain reading: net cash outflow (cash burn) of at least roughly $20 billion every three to six months, on the order of $40-80 billion a year or more."
  - Money raised is not the same as money needed. A large raise while holding plenty of cash does not by itself show need.
  - "He names no period, so the target period is the most recent public reporting before the 2026-08-18 post: the first half of 2026 (Q1 and Q2)."
  - The clause 'will only need more money as it grows' is a forecast with no deadline. It is not scored here as a current pattern; it stays open.
support_condition: Reported cash burn or net cash outflow for H1 2026 (including compute prepayments) of roughly $20 billion or more per three-to-six-month span, or reporting that OpenAI had to raise new money to cover near-term costs it could not otherwise meet.
contradiction_condition: Reported cash burn for the period well below tens of billions per few months (for example single-digit billions per quarter), while OpenAI held enough cash to cover costs without new raises.
measurement_requirements: Quarterly cash burn or free cash flow for Q1 and Q2 2026, including compute prepayments; cash balances; funding inflows and their timing.
source_requirements: OpenAI financial statements or prospectus if available; otherwise reputable reporting on documents shared with shareholders.
metric_scope:
  company: OpenAI
  metric: cash needed to cover costs (net cash burn incl. compute prepayments)
  currency: USD
  units: billions
  accounting_basis: estimate
