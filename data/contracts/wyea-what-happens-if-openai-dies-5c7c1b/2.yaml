early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'needs' versus 'raised': funding inflows do not by themselves show need"
  - No period named; target period set to H1 2026, the latest reported quarters before the post
  - "'tens of billions every few months' has no exact threshold or interval"
  - The forward clause about needing more as it grows has no deadline
