assessment_axis: historical_observation
explicit_source_elements:
  - needs tens of billions of dollars every few months
  - to keep up with its costs
  - will only need more money as it “grows”
  - has to pre-pay for compute costs
evaluator_interpretation:
  - Read this as a recurring need for outside cash to cover costs, including compute prepayments, after operating receipts and available liquidity.
  - Use April through June 2026, the latest completed quarter before publication and the quarter explicitly discussed in the surrounding passage.
  - Use roughly one quarter as the ordinary meaning of 'every few months'; 'tens of billions' means multiple tens of billions, rather than a single-digit billion amount.
  - Treat the growth language as part of the asserted current financial pattern. One financing installment does not prove a recurring funding necessity.
  - Use estimate accounting basis because the surrounding argument relies on reported financial estimates.
support_condition: Comparable cash-flow and payment records show a recurring quarterly funding need of multiple tens of billions, including required prepayments, with evidence that growth increases that need.
contradiction_condition: Complete comparable records show materially smaller recurring funding needs after all relevant payment obligations, or show that the alleged growth-linked need does not occur.
measurement_requirements: Opening liquidity, operating receipts, cash expenditure, compute prepayments and financing receipts must be reconciled. Multiple adjacent periods are needed to establish recurrence.
source_requirements: Prefer OpenAI cash-flow statements and supplier payment schedules. Investor announcements can establish receipts but cannot alone establish necessity.
