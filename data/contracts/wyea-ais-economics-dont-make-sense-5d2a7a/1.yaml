explicit_source_elements:
  - this industry
  - only delayed
  - its inevitable fall
evaluator_interpretation:
  - In context, this industry means the commercial generative-AI industry and the infrastructure businesses supporting it.
  - The ordinary reading of fall is a broad commercial collapse, reflected in widespread business failures and sustained contraction in investment and commercial activity.
  - A stock-market decline, one company's failure or continued losses alone would not establish an industry-wide collapse.
  - No deadline is supplied. The nearby 2030 discussion concerns compute expansion and is not imported as a deadline for collapse.
  - Only delayed adds a causal assertion about supporters that would require separate evidence even if a collapse occurred.
support_condition: A broad collapse of the commercial generative-AI industry occurs, with widespread failures and sustained contraction across investment and commercial activity. Full support for the delay assertion additionally requires evidence that supporters prolonged the industry's survival.
contradiction_condition: A decisive change makes the specified industry-collapse outcome impossible. Continued operation or expansion for a finite period cannot disprove an undated claim of eventual collapse.
measurement_requirements: Assess failures, investment and commercial activity across the industry over time. Do not substitute broad stock indices, isolated company losses or a single financing event for industry-wide evidence.
source_requirements: Prefer filings, insolvency records and independent industry datasets. Use reputable reporting for contextual market developments.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only when dated evidence establishes a broad industry collapse accompanied by sustained contraction, or a decisive event makes that outcome impossible. Isolated failures, stock declines and ongoing fundraising are insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Fall has no numerical threshold or specified duration.
  - The boundaries of this industry are implicit.
  - There is no deadline.
  - The counterfactual behind only delayed is unspecified.
