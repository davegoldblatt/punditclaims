assessment_axis: historical_observation
explicit_source_elements:
  - yesterday's free newsletter
  - analyst estimates
  - OpenAI and Anthropic
  - over 70% of all AI revenues
  - across Microsoft, Google and Amazon
evaluator_interpretation:
  - Assess whether the analyst estimates cited at publication substantiate the attributed share, rather than whether subsequent realized revenues meet it.
  - Read 'across' as the revenue-weighted combined share for the three providers, not an unweighted average of percentages.
  - The observation concerns estimates represented as available on August 4–5, 2026. That is the target period for the attribution; the financial periods covered by the estimates must be established separately.
  - Count revenue attributable to the two labs consistently. Do not automatically attribute all third-party purchases of their models to the labs as customers.
support_condition: Accessible original analyst estimates, or independent reporting of them, provide comparable revenue amounts and periods that place OpenAI and Anthropic above 70% of combined AI revenue across the three providers.
contradiction_condition: The cited estimates, on consistent periods and definitions, place the combined share at 70% or less, or demonstrably concern a different denominator.
measurement_requirements: Identify each estimate's date, financial period, AI-revenue definition, lab-attributable numerator, and provider denominator. Aggregate dollar amounts rather than averaging shares.
source_requirements: Original Barclays, UBS, and Wells Fargo research or independent reporting with enough detail to reproduce the calculation. Repetition of Zitron's interpretation is insufficient.
