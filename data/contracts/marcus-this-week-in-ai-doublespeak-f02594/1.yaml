  - their models make for lousy databases
  - for a database a hallucination is an outright fail
evaluator_interpretation:
  - The ordinary reading is that contemporaneous OpenAI language models could not reliably serve as standalone stores from which users retrieve accurate facts.
  - This concerns factual answers generated from model parameters, not applications connected to a separate database and verification system.
  - "The target is the GPT-4 launch period, March 14–18, 2023: the latest public model and evaluation period before the post. This is an ongoing technical observation, not a quarterly reporting claim."
  - The concession about memorization is background; the assessed proposition concerns reliability as a factual database.
support_condition: Contemporaneous documentation or evaluations show that the models generated fabricated factual answers and required verification when factual reliability mattered.
contradiction_condition: Evidence establishes reliable factual retrieval without fabrication across ordinary factual queries for the contemporaneous models.
measurement_requirements: Evidence must concern factual correctness or fabrication in contemporaneous OpenAI models. Improvement over an earlier model does not by itself establish database reliability.
source_requirements: Prefer contemporaneous model documentation and factuality evaluations with identifiable models and methods.
