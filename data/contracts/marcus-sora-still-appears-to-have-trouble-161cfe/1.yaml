evaluator_interpretation:
  - The claim concerns the December launch version and the review cited in the post.
  - Persistence means that physics and object-continuity failures still occur. It does not mean there was no improvement.
  - The attribution to Mashable identifies the evidence being invoked; it is not a conditional forecast antecedent.
  - The target includes December 9–10 to cover the launch report and the supplied post date. The word 'today' is treated as an imprecise reference to that launch.
support_condition: Launch-period documentation and the cited review report continuing unrealistic physics and object-continuity failures in the December version.
contradiction_condition: The cited review does not describe those failures, or reliable examination establishes that the alleged failures concern another version or are mischaracterized.
measurement_requirements: Evidence must identify the December release and describe concrete physics or object-continuity problems.
source_requirements: Prefer release documentation and Brownlee's original review; the specifically cited Mashable report can establish what it reported.
