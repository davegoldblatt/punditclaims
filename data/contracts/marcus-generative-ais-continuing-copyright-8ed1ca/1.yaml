ambiguity_flags:
  - Near plagiaristic has no specified similarity measure.
  - Uncreative is evaluative; only its concrete imitation component is assessed.
  - Prone supplies no frequency beyond at least some of the time.
  - The observation window is inferred from newly-released and the post date.
