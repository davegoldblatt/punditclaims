assessment_axis: historical_observation
explicit_source_elements:
  - Three approaches to commonsense reasoning
  - in the last fifteen years
  - none has proved fully satisfactory
evaluator_interpretation:
  - The three approaches are physical simulation, commonsense emerging in foundation models, and video generation.
  - "'Fully satisfactory' means demonstrated, broadly reliable commonsense reasoning across ordinary situations. It does not require error-free performance."
  - The stated fifteen-year interval ends on the post date.
  - Success on a restricted task is relevant progress but does not by itself settle whether an entire approach has supplied a broad solution.
support_condition: Evidence establishes material unresolved scope or reliability limits for all three approaches as of the post.
contradiction_condition: At least one approach has demonstrated broadly reliable commonsense reasoning by the post date.
measurement_requirements: Assess all three approaches, including task breadth, generalization and practical reliability. Do not substitute failure by selected systems for comprehensive coverage of an approach.
source_requirements: Independent evaluations and documented systems, including successful results and limitations.
