support_condition: Evidence establishes sustained, widespread deployment of neural systems with symbolic components across leading AI systems and important applications.
contradiction_condition: A decisive field-wide abandonment could weigh against the forecast, but non-adoption by an evaluator-chosen date cannot establish failure when the speaker supplied no deadline.
measurement_requirements: Distinguish availability, demonstrations, and announcements from sustained actual use. Explain which components qualify and how deployment spans vendors and applications.
