  - Demand could mean business adoption, spending, usage intensity or compute purchases.
  - The surrounding discussion emphasizes large businesses, but the assessed sentence does not restrict its population.
  - Census's original question measures AI generally, not generative AI alone.
  - No exponential growth rate, comparison window or statistical tolerance is specified.
