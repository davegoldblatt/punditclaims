explicit_source_elements:
  - AGI
  - will eventually come
  - hopefully safe, trustworthy
  - Maybe in the next decade
evaluator_interpretation:
  - The firm prediction is eventual arrival. 'Maybe' does not establish a deadline, and 'hopefully' expresses a wish rather than a condition.
  - I read AGI as broadly human-level cognitive competence across domains, demonstrated independently and widely accepted as general intelligence. Marcus supplies no operational test.
support_condition: A publicly demonstrated system receives independent evaluation and broad acceptance as AGI.
contradiction_condition: Decisive evidence establishes that AGI cannot ever be built. Continued non-arrival over any finite period is insufficient.
measurement_requirements: Evaluation across diverse cognitive tasks, including unfamiliar tasks, with independent replication and scrutiny. A selected benchmark score alone is insufficient.
source_requirements: Public technical documentation and independent evaluations establishing the achievement; company declarations alone cannot settle it.
metric_scope: null
original_horizon: Maybe in the next decade
horizon_interval:
  start: 2025-08-14
  end: 2035-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a dated, independently demonstrated and broadly accepted AGI achievement. Resolve as contradicted only upon decisive evidence of impossibility.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AGI has no definition or test in the claim.
  - The next decade is a tentative possibility, not a firm deadline.
  - Whether a contested system qualifies depends on the definition of AGI.
