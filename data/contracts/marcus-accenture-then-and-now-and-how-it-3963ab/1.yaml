  - is dying
evaluator_interpretation:
  - The ordinary reading is that rewarding or encouraging token consumption for its own sake was losing corporate favor.
  - "'Dying' describes a retreat in the practice, not its complete disappearance or a decline in total AI token demand."
  - No reporting interval is specified. I use the latest completed calendar month before the post, May 2026, together with the elapsed portion of June through publication.
support_condition: Contemporaneous reporting documents withdrawal of token-volume incentives or leaderboards and a broader shift away from maximizing consumption as a success measure.
contradiction_condition: Comparable evidence shows the practice was continuing to expand without a meaningful retreat during the target period.
measurement_requirements: Track changes in incentives, leaderboards, and management policies. Distinguish such changes from token prices, overall token consumption, or continued adoption of useful AI tools.
source_requirements: Prefer company statements or policy records. Where internal policies are not publicly posted, use reputable reporting with identified company confirmation and acknowledge its coverage limits.
