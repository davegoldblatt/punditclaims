assessment_axis: historical_observation
explicit_source_elements:
  - I believe
  - building AI GPU capacity
  - in expectation of $450 billion or more
  - annual data center revenue
  - without two unsustainable venture-backed oafs
  - a few billion dollars’ worth of demand
evaluator_interpretation:
  - The surrounding discussion identifies the two excluded firms as OpenAI and Anthropic.
  - "'I believe' introduces a concrete factual estimate; it does not by itself make the claim uncheckable."
  - Read the first component as an assertion about the annual revenue expected from capacity being built, not capital expenditure or financing raised.
  - Read the second component as current demand for that AI GPU capacity from customers other than OpenAI and Anthropic. Downstream purchases routed through those firms require separate treatment to prevent double counting.
  - Use January–March 2026, the latest commonly reported quarter before the post, to identify contemporaneous demand and disclosed expectations.
  - The comparison suggests an annual demand scale, but no annualization method, accounting basis, or target revenue year is supplied. Do not manufacture one.
support_condition: A documented capacity, utilization, and pricing model supports at least $450 billion in expected annual AI data-center revenue, while comparable customer-demand records show only a few billion dollars annually after removing OpenAI and Anthropic.
contradiction_condition: Comparable records show expected annual revenue materially below $450 billion, or demand excluding both named firms clearly exceeds a few billion dollars on the same annual, accounting, and customer-attribution basis.
measurement_requirements: Identify included capacity, delivery dates, utilization, rental prices, revenue recipients, and forecast year. Separately measure customer purchases excluding OpenAI and Anthropic without conflating capex, commitments, revenue, run rates, or downstream resale.
source_requirements: Prefer developer business plans, contracts, company customer-level revenue disclosures, and documented independent estimates. A complete reconciliation is needed for the exclusions.
