ambiguity_flags:
  - No source or accounting basis accompanies the figures.
  - No target year is given for expected annual revenue.
  - "'A few billion' has no precise upper bound."
  - The demand figure has no explicit period.
  - Industry scope and geographical coverage are unspecified.
  - Excluding the two labs could mean direct customers, their downstream customers, or both.
  - January–March 2026 is an evaluator-selected latest commonly reported quarter.
  - The annualized classification describes an annual scale and does not authorize converting disclosed run rates into realized revenue.
