assessment_axis: historical_observation
explicit_source_elements:
  - I believe
  - we’re building AI GPU capacity
  - in expectation of $450 billion or more in annual data center revenue
  - without two unsustainable venture-backed oafs
  - a few billion dollars’ worth of demand
evaluator_interpretation:
  - The two excluded companies are OpenAI and Anthropic, as established by the surrounding text.
  - The claim describes the buildout and demand position at publication. The target period is an as-of snapshot on July 7, 2026, using the latest publicly reportable information before publication; it is not an assigned calendar quarter.
  - The ordinary reading is that capacity under construction anticipates at least $450 billion in annual revenue from supplying AI compute, while existing demand from other customers amounts to only a small number of billions of dollars.
  - The surrounding post presents a calculation from anticipated GPU sales, power capacity and rental economics. I therefore treat the revenue requirement as an estimate.
  - The speaker explicitly annualizes expected data-center revenue but does not explicitly annualize remaining demand. No annual demand convention or precise upper bound for 'a few' is imposed.
  - Exclude compute purchased for OpenAI and Anthropic through intermediaries where identifiable. Do not automatically exclude other companies merely because they use those companies' models.
  - The description of a bubble is assessed through the stated revenue-demand comparison, not through a separate test of whether valuations are excessive.
support_condition: Evidence describing the position at publication establishes both that the GPU capacity being built anticipates at least $450 billion in annual data-center revenue and that current demand excluding OpenAI and Anthropic is only a few billion dollars. The demand evidence must explain its own time basis, customer exclusions and treatment of internal compute use. Support cannot depend on assigning the speaker an unstated annual demand measure.
contradiction_condition: Comparable evidence establishes that the buildout's expected annual data-center revenue is below $450 billion, or that remaining current demand clearly exceeds a few billion dollars on a basis that does not depend on an unstated reporting interval. GPU purchase costs, total cloud revenue and multiyear commitments alone cannot establish either result.
measurement_requirements: Identify the capacity included, deployment schedule, utilization and rental assumptions behind expected annual revenue. Separately measure demand attributable to customers other than OpenAI and Anthropic, avoiding double counting intermediaries. Distinguish current purchases, future commitments, internal use and application revenue. Test sensitivity to the unspecified demand interval rather than selecting one to determine the verdict.
source_requirements: Prefer dated capacity plans, customer contracts, filings and disclosed rental economics. Independent estimates must disclose their methods and exclusions. The speaker's calculations establish his meaning but cannot independently verify it.
