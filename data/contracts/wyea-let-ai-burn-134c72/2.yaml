ambiguity_flags:
  - No reporting period is specified for the ongoing observation; the target is the publication-date snapshot rather than an invented quarter.
  - The time basis and exact upper bound of 'a few billion dollars’ worth of demand' are unspecified.
  - The treatment of internal compute use and purchases routed through hyperscalers is unspecified.
  - Capacity being built and capacity merely planned are not clearly distinguished.
  - The contract contains two quantities with different time conventions; the single metric_scope object cannot make them directly comparable.
