explicit_source_elements:
  - It sure seems like
  - nobody outside of OpenAI
  - any real revenue on generative AI
  - certainly not making a profit
evaluator_interpretation:
  - The revenue limb means commercially substantial sales, not literally zero revenue. The context itself acknowledges Microsoft and Amazon sales.
  - The firm profitability limb means positive profit from generative AI after attributable costs, rather than positive revenue, gross margin or profit from an entire cloud division.
  - I use October–December 2024 as the latest completed common reporting quarter underlying the company figures discussed in the post. This does not imply every company's latest available disclosure covered that quarter.
  - The single metric_scope describes the categorical profit assertion. Its accounting basis is unknown because neither an accounting standard nor a company-reported generative-AI profit measure is specified.
  - The revenue limb has no supplied materiality threshold. I do not invent one.
support_condition: Comparable evidence establishes that companies outside OpenAI had no positive generative-AI profit in the target period, and that their generative-AI sales were commercially insubstantial under an identifiable materiality measure.
contradiction_condition: A company outside OpenAI demonstrably earned positive generative-AI profit on the same accounting basis in the target period, or comparable realized sales clearly refute an established reading of commercially insubstantial revenue.
measurement_requirements: Identify generative-AI revenue and attributable costs separately. Distinguish annualized run rates from realized revenue and gross margin from profit after operating costs.
source_requirements: Company financial disclosures or independently verified financial records. Reports about private companies must identify the period and profit definition.
