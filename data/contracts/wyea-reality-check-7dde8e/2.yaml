ambiguity_flags:
  - "'Nobody' is categorical, but the passage is about large vendors. Whether small profitable startups count is unclear."
  - Whether hardware suppliers like Nvidia count as 'making a profit on generative AI' is unclear. His wording suggests they do not.
  - Most large companies do not disclose profit on generative AI separately.
  - The target period is the evaluator's choice.
