assessment_axis: historical_observation
explicit_source_elements:
  - It sure seems like
  - nobody outside of OpenAI
  - is making any real revenue on generative AI
  - they're certainly not making a profit
evaluator_interpretation:
  - Only the firm profit clause ('certainly not making a profit') is scored. The revenue clause is hedged ('it sure seems like') and uses an undefined 'real revenue' threshold, so it is not scored.
  - "Scope: the passage covers sellers of generative AI services and products, such as hyperscalers, Salesforce and model developers. His own wording implies chip suppliers like Nvidia are outside this scope, because he says nobody outside OpenAI makes real revenue, and Nvidia obviously does."
  - Profit means earnings on generative AI offerings after the costs attributable to them.
  - "Target period: the claim describes an ongoing state at the post date and names no period. I use the span covered by the latest public reports available at the post, from 2024 through 2025-04-28. This is my choice, not his."
support_condition: Credible reports show that the companies in scope were not making a profit on generative AI during the period, for example disclosed losses on gen-AI units or credible reporting of losses.
contradiction_condition: A credible source shows that a company in scope (outside OpenAI) made a profit specifically on generative AI products or services during the period.
measurement_requirements: Profit attributable to generative AI offerings, whether from segment disclosure or credible reporting.
source_requirements: Company filings or earnings disclosures with AI-specific profitability, or reputable reporting on gen-AI firms' profitability.
metric_scope:
  company: Generative AI vendors other than OpenAI (industry-wide)
  metric: Profit on generative AI products and services
  currency: USD
