assessment_axis: historical_observation
explicit_source_elements:
  - As recently as November 2023
  - filed for non-profit tax exempt status
  - safely benefit humanity, unconstrained by a need to generate financial return
  - almost half their profits
  - if they make any
  - seem to have back-burnered their safety work
evaluator_interpretation:
  - Assess the November 2023 filing and the financial and safety arrangements described as continuing through May 26, 2024.
  - Distinguish an annual return by an already exempt organization from an application for initial recognition of exemption.
  - Read 'if they make any' as describing Microsoft's entitlement to profits, not asserting that a cash distribution had already occurred.
  - Read 'almost half' as approximately 49%, while retaining any repayment stages and caps.
  - The statement supplies no accounting definition of profits or source for that financial figure. The contract's accounting_basis is therefore unknown.
  - Treat the safety clause as a tentative assessment of resource priorities, not a measurable assertion that all safety work stopped.
support_condition: Records establish the stated filing and mission language, a matching entitlement to approximately half of the specified profits, and evidence of reduced safety priority during the described period.
contradiction_condition: Records materially contradict the filing's nature or mission language, establish incompatible profit-sharing terms on the same accounting basis, or show that the alleged safety deprioritization did not occur.
measurement_requirements: Identify the legal entity making the filing, the profit-sharing entity, the contractual definition of distributable profits, applicable repayment stages and caps, and the relevant safety resources.
source_requirements: Use the tax return and executed financial agreements where available. Press accounts of private terms must be marked as estimates and cannot substitute for a matching accounting basis.
