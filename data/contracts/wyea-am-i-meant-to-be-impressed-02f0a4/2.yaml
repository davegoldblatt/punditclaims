assessment_axis: causal_assessment
explicit_source_elements:
  - '"These companies" (Anthropic and OpenAI)'
  - '"have promised $718 billion to Microsoft, Google and Amazon"'
  - '"cannot survive without venture capital funding"'
  - '"because their underlying businesses lose money on every transaction"'
evaluator_interpretation:
  - "The causal core is that the companies depend on venture funding because their underlying business loses money on each sale. Plain reading of 'lose money on every transaction': the cost of serving customers exceeds the revenue from them, so gross margins are negative."
  - The period is the latest full quarter before the post, January to March 2026, since he describes a present state.
  - The $718 billion figure is his own tally of commitments; it is checked if evidence allows, but the outcome turns on the causal premise.
  - Contradicting the premise for either named company is enough to falsify a statement about both.
support_condition: Filings show that the cost of serving customers exceeded revenue (negative gross margin) in the period, so the companies needed outside capital to keep operating.
contradiction_condition: Filings show that revenue exceeded the cost of serving customers in the period, for example revenue greater than all compute spending, so the business does not lose money on each transaction.
measurement_requirements: Quarterly revenue and compute or cost-of-revenue figures for Anthropic or OpenAI for Q1 2026.
source_requirements: Company filings.
metric_scope:
  company: Anthropic and OpenAI
  metric: unit economics (revenue versus cost of serving customers)
  currency: USD
  units: millions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
