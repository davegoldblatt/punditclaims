assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic and OpenAI
  - promised $718 billion
  - to Microsoft, Google and Amazon
  - cannot survive without venture capital funding
  - because their underlying businesses lose money on every transaction
evaluator_interpretation:
  - The commitment figure concerns combined multiyear cloud-compute promises outstanding at publication, not annual spending or recognized debt.
  - The plain reading of losing money on every transaction is that customer transactions fail to cover the costs of supplying them. Company-wide net losses alone do not establish this.
  - Survival dependence requires evidence that available cash, operating receipts, and feasible alternative financing cannot sustain the businesses without further venture funding.
  - Assess commitments as of May 6, 2026 and operating economics over January–March 2026, the latest completed calendar quarter. The combined target interval accommodates the point-in-time commitment claim and the latest-quarter operating claim.
  - No accounting basis or allocation of training, research, and overhead costs to individual transactions is supplied. The contract therefore records an unknown basis.
support_condition: A nonduplicated reconciliation establishes approximately $718 billion of relevant promises, transaction-level records establish negative economics throughout both businesses, and cash-flow and financing records establish that those losses cause dependence on further venture funding.
contradiction_condition: Matching records materially disprove the commitment total, establish profitable transactions under the stated cost definition, or demonstrate sustainable operation without further venture funding.
measurement_requirements: Separate signed minimum purchases, optional capacity, forecasts, equity investments, annual expenditure, gross margin, net income, and cash burn. Establish the causal link rather than infer it from fundraising.
source_requirements: Prefer contracts, company disclosures, audited accounts, and transaction-level cost records. Identify press estimates and unavailable underlying documents.
