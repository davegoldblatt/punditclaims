explicit_source_elements:
  - Trump has not thus far fired Lutnick
  - seemed to be in cahoots
  - Jensen’s plans to work around export controls
  - many people in both parties
  - called on Trump to ask for Lutnick to resign
evaluator_interpretation:
  - Lutnick's employment status is assessed as of publication on November 16, 2026, because this is a contemporaneously observable officeholding claim.
  - The plans, apparent cooperation, and resignation calls concern events preceding publication. The text supplies no lower date boundary, so the target period has an unspecified start.
  - Seemed to be in cahoots requires a documented basis for apparent cooperation, not proof of a criminal conspiracy.
  - Plans to work around controls requires evidence of Huang's or Nvidia's circumvention arrangements; lobbying to change restrictions alone is insufficient.
  - Many people in both parties means multiple identifiable Republicans and Democrats calling for resignation or dismissal. Requests for testimony and criticism alone do not meet that wording.
  - The full quoted claim includes the bipartisan resignation-call assertion even though the normalized proposition omits it.
support_condition: Records establish that Lutnick remained in office at publication, document Huang's or Nvidia's circumvention plans and a reasonable basis for apparent cooperation by Lutnick, and identify multiple resignation or dismissal calls from each party.
contradiction_condition: Reliable records establish that Lutnick had already been fired, or affirmatively disprove another material factual component. Failure to locate corroboration alone is not contradiction.
measurement_requirements: Separate lawful policy lobbying from circumvention plans, apparent cooperation from proved collusion, and calls for resignation from calls for testimony.
source_requirements: Dated employment or presidential records, documentary evidence or reliable investigative reporting on the arrangements and Lutnick's involvement, and attributable resignation calls.
