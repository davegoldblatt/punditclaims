  - I use 2025, the latest complete calendar year before the post, as the reporting period for this ongoing state.
  - I assess systems then available. A claim that no future generative system could become reliable would require different evidence.
support_condition: Evidence of practical uses, including coding, alongside evaluations showing recurrent material errors across commonly used systems.
contradiction_condition: Representative evaluations show dependable performance across ordinary uses without material verification needs, or credible evidence defeats the assertion that any practical coding uses exist.
measurement_requirements: Distinguish measured performance from users' impressions. Examine multiple systems and ordinary tasks; isolated failures or exceptional benchmark questions are insufficient by themselves.
