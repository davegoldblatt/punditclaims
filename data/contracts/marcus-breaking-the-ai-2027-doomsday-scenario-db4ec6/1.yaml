explicit_source_elements:
  - our entire economy
  - being rebuilt
  - at enormous expense
  - around a myth
evaluator_interpretation:
  - The checkable part is that very large sums are going into AI. That much is true, but it is not what the claim turns on.
  - "The point of the claim is 'around a myth': the spending rests on a belief in imminent AGI, and that belief is false. Whether AGI is a myth is the open question the forecast debate is about. Evidence available now cannot settle it."
  - Showing that the spending was driven by belief in imminent AGI, rather than by current cloud and AI demand, would need a causal attribution. He named no measure for it.
  - "'Entire economy ... being rebuilt' is rhetorical overstatement with no plain threshold."
support_condition: Would need evidence of enormous AI-related spending, plus evidence that the spending rests on a belief in imminent AGI, plus a settled finding that imminent AGI is a myth. The last two cannot be established on the evaluation date.
contradiction_condition: Would need evidence that AI spending is small, or not tied to AGI expectations, or that AGI is in fact imminent. None of these can be established on a non-normative basis on the evaluation date.
measurement_requirements: null
source_requirements: Capex disclosures could show the scale of spending. No source could settle whether the premise is a 'myth'.
