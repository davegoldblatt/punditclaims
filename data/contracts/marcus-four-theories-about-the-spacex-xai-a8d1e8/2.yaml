explicit_source_elements:
  - doesn’t have the users that ChatGPT has
  - doesn’t have the prestige that Google’s Gemini seems to be racking up
evaluator_interpretation:
  - The firm audience claim means Grok has fewer active users than ChatGPT. It does not mean the products have different individual users.
  - Use January 2026, the latest complete calendar month before the post, for the ongoing audience comparison.
  - Comparable active-user measurements can test the audience comparison, with their platform and geographic limits disclosed.
  - The prestige comparison is hedged by 'seems to be'. It is not a firm benchmark claim and is excluded from the outcome grade. Support for the audience clause does not establish the prestige clause.
support_condition: Comparable active-user evidence for January 2026 shows ChatGPT ahead of Grok.
contradiction_condition: Comparable active-user evidence for January 2026 shows Grok matching or exceeding ChatGPT.
measurement_requirements: Compare active users using the same reporting period, platform coverage and methodology. Do not equate downloads, visits or the entire X audience with Grok users.
source_requirements: Prefer the original audience measurement provider. Reported estimates must identify their methodology and coverage sufficiently to interpret the comparison.
