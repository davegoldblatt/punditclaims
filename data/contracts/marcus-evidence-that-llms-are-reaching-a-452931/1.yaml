evaluator_interpretation:
  - Compare percentage-point gains on the historical Lech Mazur Connections benchmark for the four plotted model entries.
  - "Read restriction of range narrowly: the reported scores remain well below the benchmark's maximum, so numerical saturation does not force the smaller gains."
  - The post describes the model sequence through April 13, 2024. It does not clearly identify both Turbo snapshots in its prose.
  - Treat diminishing returns as a suggested explanation of the benchmark pattern, not a measured return on compute or investment.
support_condition: A dated, comparable four-model table shows that both GPT-4-to-Turbo gains were substantially smaller than the GPT-3.5-to-GPT-4 gain, with substantial room below the maximum score.
contradiction_condition: Comparable results show either Turbo gain was not substantially smaller, or show that proximity to the maximum materially constrained those gains.
measurement_requirements: Recover exact model snapshots, puzzle set, scoring, prompts, permitted attempts, and all four scores. Compare absolute percentage-point changes.
source_requirements: The benchmark author's dated results or a reproducible historical snapshot, independent of Marcus's graph.
