evaluator_interpretation:
  - The ordinary reading is a claimed general limitation on achieving factual reliability within the specified class of systems.
  - A principled solution means a systematic, theoretically grounded solution across factual tasks, not simply a lower average error rate or universal refusal to answer.
  - The architectural restriction defines the systems covered; it is not a future antecedent.
  - Use calendar 2024 through publication for the asserted current state of knowledge. Earlier theoretical results may provide background.
  - A theorem about all computable tasks or a calibrated generator must be checked for whether its assumptions actually cover the claim.
support_condition: A general impossibility result, with assumptions matching the specified systems and factual task, establishes the claimed limitation.
contradiction_condition: A proved or broadly validated systematic solution achieves factual reliability in a nontrivial language-statistical system without the explicit fact representation and reasoning tools excluded by the claim.
measurement_requirements: Define hallucination, task coverage, permitted abstention and architecture; distinguish reliable prevention from partial detection or error reduction.
source_requirements: Primary theoretical papers or reproducible demonstrations. Persistent errors and failure to find a solution do not themselves prove impossibility.
