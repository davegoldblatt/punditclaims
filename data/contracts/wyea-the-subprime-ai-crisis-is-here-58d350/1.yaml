assessment_axis: historical_observation
explicit_source_elements:
  - Over the next few months
  - just about every AI startup
  - had to institute
  - some form of austerity
evaluator_interpretation:
  - In context, austerity means price increases, tighter included-usage limits, reduced services, or other spending cuts intended to contain costs.
  - The relevant population is AI startups selling applications or model services, rather than all businesses that use AI.
  - The period runs from June 2025 through March 2026 because the surrounding examples extend from June changes to February and current March developments.
  - Just about every means nearly all, not merely several prominent examples. No arbitrary numerical cutoff is added.
  - Had to adds a necessity claim that requires evidence beyond observing a pricing change.
support_condition: A representative record shows cost-containment measures at nearly all relevant AI startups during the target period, with evidence that economic or capacity pressures required them.
contradiction_condition: Representative evidence shows a substantial share of relevant startups did not institute such measures, or that the changes attributed to necessary austerity were predominantly unrelated commercial changes.
measurement_requirements: Define the startup population, track comparable pricing, usage, service, and spending changes, and document their reasons. Account for both restrictions and expansions.
source_requirements: Dated company announcements supplemented by a representative survey or systematic historical dataset. Selected company examples alone cannot establish prevalence.
