explicit_source_elements:
  - As it stands
  - OpenAI and Anthropic
  - heavily dependent
  - companies believing that they have to integrate AI into their products
  - integrate AI that users actually care about
evaluator_interpretation:
  - The ordinary reading is substantial commercial reliance by each provider on companies embedding its models in products.
  - Heavy dependence does not necessarily mean a majority of revenue. No percentage threshold is supplied.
  - Internal workplace use and direct chatbot subscriptions are not automatically third-party product integrations.
  - Use 2023-10-01 through 2023-12-31, the latest completed calendar quarter before publication, as the reporting-period proxy for 'As it stands'. This period is an evaluator choice, not an explicit date in the claim.
  - Revenue composition, retention and customer concentration can test commercial dependence. They cannot directly establish customers' private beliefs.
  - The source supplies no financial accounting basis.
support_condition: Comparable records for the target period show substantial reliance by both OpenAI and Anthropic on third-party product integrations, with customer evidence connecting continued demand to useful integrations.
contradiction_condition: Comparable records establish that at least one provider was not substantially dependent on third-party product integrations. Merely having another revenue channel is insufficient.
measurement_requirements: Separate each provider's integration revenue, direct subscriptions and internal enterprise use; measure customer concentration, retention and the consequences of losing integration customers.
source_requirements: Prefer company records and customer-level disclosures. Clearly identified press estimates may provide context, but total revenue and developer counts cannot establish revenue composition.
