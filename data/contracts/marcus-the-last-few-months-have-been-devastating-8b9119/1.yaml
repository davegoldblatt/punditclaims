explicit_source_elements:
  - June, 2025
  - the Apple reasoning paper confirmed
  - even with “reasoning”
  - LLMs still can’t solve distribution shift
evaluator_interpretation:
  - The plain reading is that reasoning models still lacked reliable generalization beyond their training distribution, and Apple's paper established that limitation.
  - This does not mean that models must fail every unfamiliar example, or that future models can never improve.
  - The target is the June 2025 finding expressly identified in the claim. Later experiments are context unless they directly reassess those June results.
  - Increasing puzzle complexity is relevant to generalization, but identifying failures specifically caused by distribution shift requires information about the training distribution.
support_condition: The June paper and reliable reassessments establish failures of reasoning models under identified distribution shifts, sufficient to substantiate the claimed general limitation.
contradiction_condition: Controlled evidence establishes reliable generalization across the relevant shifts, or shows that the attributed June finding results from experimental constraints rather than the claimed limitation.
measurement_requirements: Identify models, training and test distributions, reasoning settings, task complexity, output limits, scoring rules, and whether tools were available. Distinguish limited robustness from a universal inability.
source_requirements: The original Apple paper, direct experimental reassessments, and controlled distribution-shift studies. Commentary alone cannot establish model capability.
