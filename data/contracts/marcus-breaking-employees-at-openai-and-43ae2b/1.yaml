evaluator_interpretation:
  - The population is LLMs released after the Christmas Day 2022 article and before this post.
  - The ordinary reading is that each model exhibits material unsafe behavior and unreliable behavioral control. Merely making an occasional factual error would not establish both properties.
  - The target period follows the retrospective period explicitly identified in the surrounding text.
support_condition: Evidence covering the claimed population establishes material unsafe behavior and failures of behavioral control in every model.
contradiction_condition: A credible counterexample shows a model with reliably constrained behavior across sufficiently broad ordinary-use and adversarial evaluations. Passing one narrow test would not suffice.
measurement_requirements: A defined inventory of released models, consistent definitions of harmful behavior and control failures, and evaluations covering that inventory.
source_requirements: Public evaluations with disclosed methods and results. Findings about selected frontier models cannot establish a claim about every released LLM.
