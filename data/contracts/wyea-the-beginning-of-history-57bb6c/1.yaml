explicit_source_elements:
  - the AI industry
  - about to
  - enter a world of hurt
evaluator_interpretation:
  - The ordinary reading is substantial financial distress across the AI industry, rather than isolated business failures.
  - The surrounding discussion attributes the expected distress to energy costs and financing pressures. It explicitly says an interest-rate spike is unnecessary, so this is not conditional on that event.
  - ‘About to’ implies proximity but supplies no reproducible deadline. No calendar deadline is imposed.
support_condition: Evidence establishes widespread, substantial financial distress after publication, with credible evidence connecting it to the energy and financing pressures described.
contradiction_condition: A definitive contradiction would require a bounded forecast period or an event that makes the predicted industry-wide distress impossible. Continued financing over a finite period alone cannot conclusively contradict this undated forecast.
measurement_requirements: Assess financing availability, failed raises, insolvencies and financial retrenchment across multiple independent AI businesses. Separate industry-wide effects from individual projects and distinguish causation from coincidence.
source_requirements: Prefer financing disclosures and systematic industry measurements. Use reporting for otherwise unavailable financing developments, preserving company denials and uncertainty.
metric_scope: null
original_horizon: about to
horizon_interval:
  start: 2026-03-10
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only upon a documented, broad financial-disruption event affecting multiple independent parts of the AI industry, credibly linked to the pressures described. Individual financing problems or predictions by other executives are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No measurable definition of ‘world of hurt’.
  - No stated deadline beyond ‘about to’.
  - The breadth of ‘AI industry’ is unspecified.
  - The relative causal roles of energy costs, inflation and credit availability are unspecified.
