explicit_source_elements:
  - the glitches don’t stem from the data
  - a flaw in how the system reconstructs reality
evaluator_interpretation:
  - The claim attributes the original model's demonstrated physics and continuity glitches to its generation mechanism while excluding training data as their cause.
  - Reconstruction is read broadly as the model's learned representation and generation process; Marcus does not identify a particular component.
  - The subject is the February 2024 model and its then-observed glitches. Later experiments can inform the assessment only if they identify causes in that model.
support_condition: Controlled evidence on the original Sora isolates a reconstruction mechanism that causes the glitches while ruling out relevant training-data deficiencies or artifacts as their source.
contradiction_condition: Controlled evidence attributes those glitches to training-data properties, or shows that a data-only intervention removes them while the relevant generation mechanism is held fixed.
measurement_requirements: Vary training-data quality, coverage, and relevant generation components separately; measure comparable physics and continuity failures while controlling other changes.
source_requirements: Original-Sora causal experiments or sufficiently detailed developer investigations. Experiments on other video models are context only.
