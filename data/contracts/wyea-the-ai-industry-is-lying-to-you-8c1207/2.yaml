assessment_axis: historical_observation
explicit_source_elements:
  - Hundreds of billions of dollars of GPU sales
  - are mostly sitting
  - waiting for somewhere to go
evaluator_interpretation:
  - "Plain reading: when the post went up, more than half (by dollar value) of the hundreds of billions of dollars of AI GPUs already sold had been delivered to buyers but were not installed and running in data centers."
  - He names no period. He describes a present state, so the target period is the weeks just before the post date (2026-03-01 to 2026-03-24). It is not swapped for Nvidia's fiscal quarter that ended in January 2026.
  - "'GPU sales' is read mainly as Nvidia data center GPU sales, since Nvidia is most of the market. 'Mostly' is read as a majority by value."
support_condition: Credible evidence, such as company disclosures, hyperscaler statements, or independent deployment counts, showing that in or around March 2026 more than half by value of the AI GPUs sold were still uninstalled or not powered on.
contradiction_condition: Credible evidence showing that in or around March 2026 most AI GPUs sold, by value, were installed and running, with only a minority waiting for space or power.
measurement_requirements: Cumulative dollar value of AI GPUs sold, compared with the dollar value installed and operating, measured near 2026-03-24.
source_requirements: Company filings or statements from Nvidia or large GPU buyers, or independent deployment measurements. The speaker's own estimates do not count.
metric_scope:
  company: NVIDIA (and other AI GPU sellers)
  metric: Share of AI GPU sales value delivered but not installed or operating
  currency: USD
  units: billions of dollars; share of value
  accounting_basis: estimate
  fiscal_or_calendar: calendar
