assessment_axis: historical_observation
explicit_source_elements:
  - Hundreds of billions of dollars of GPU sales
  - mostly sitting waiting for somewhere to go
evaluator_interpretation:
  - The plain reading is that more than half of the GPUs sold, measured by sales value, remain uninstalled because suitable data-center space is unavailable.
  - The surrounding discussion identifies NVIDIA and uses estimates based on sales, power requirements and construction. I therefore treat the dollar-valued installation claim as an estimate.
  - The latest completed NVIDIA reporting quarter before the post is the observation window, ending January 25, 2026. The claim does not specify the starting date of the cumulative sales cohort.
  - The wording supplies no geographic restriction. Evidence limited to North American construction cannot establish the global share.
  - Installed but temporarily idle GPUs do not count as awaiting installation.
support_condition: A matched inventory and deployment accounting shows that a cumulative NVIDIA GPU sales cohort worth hundreds of billions of dollars had more than 50% of its original sales value awaiting installation during the target period.
contradiction_condition: A matched accounting of the same sales cohort shows that 50% or less of its sales value remained uninstalled during the target period.
measurement_requirements: Match sold hardware to installation status and original sales value. Separate GPUs from networking and other equipment, distinguish customer inventory from NVIDIA inventory, and account for deployments in existing facilities and outside North America.
source_requirements: NVIDIA sales disclosures combined with customer deployment records or an independently documented inventory estimate covering the same hardware cohort.
metric_scope:
