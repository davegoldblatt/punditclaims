  - classical, formal, deterministic programming languages
  - allow programs to specify with precision what they want
evaluator_interpretation:
  - The ordinary reading is that formal programming languages can give operations defined execution rules, whereas an English instruction to an LLM does not itself guarantee the corresponding implementation.
  - The comparison with English prompting comes from the surrounding discussion. The quoted words alone assert a capability of formal languages.
  - Precision concerns specified behavior, not whether a program correctly expresses its author's intentions. It does not require every operation in every language to be deterministic.
  - The observation concerns specifications and demonstrated prompting behavior publicly available by 2024-02-15. These are non-periodic technical properties; the target ends at the post date and leaves the unspecified beginning open.
support_condition: Published language specifications define concrete operations and permitted results precisely, while documented LLM programming experiments show that natural-language task descriptions do not guarantee a correct implementation.
contradiction_condition: The relevant formal languages cannot specify concrete operations precisely, or ordinary English prompting provides equivalent guaranteed execution semantics in the systems being compared.
measurement_requirements: Separate formal execution semantics from model-generated implementation choices. Different output wording alone is insufficient; functional correctness or defined operational behavior must be examined.
source_requirements: Versioned language specifications and primary programming experiments available by the post. Include explicit exceptions to determinism where relevant.
