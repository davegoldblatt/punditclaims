early_resolution_rule: Resolve early only if verified, irreversible spending on the agreed scope already makes the stated annual amount impossible, or another decisive event fixes the completed-year result. Guidance revisions and commitments do not qualify; crossing the ten-times threshold alone does not settle the dollar forecast.
interpretation_determines_result: true
plain_reading: true
