assessment_axis: forecast_outcome
explicit_source_elements:
  - $765 billion
  - big tech will spend in 2026
  - more than ten times Amazon’s combined capex
  - during the period where AWS was being built
  - between 2003 and 2017
evaluator_interpretation:
  - Assess actual calendar-year 2026 expenditure, not whether a forecast of that amount existed.
  - The nearby reference to 2003–2017 supplies the Amazon comparison period. Use Amazon's consolidated capital expenditure over those years, not an invented AWS-only allocation.
  - The linked Goldman Sachs analysis indicates an estimated AI-infrastructure basis, but does not supply a named big-tech company cohort matching the sentence.
  - Treat $765 billion as a rounded figure. Any tolerance and company membership must be fixed before grading completed spending.
support_condition: Actual 2026 spending for a consistently defined cohort and expenditure measure is approximately $765 billion and exceeds ten times comparable Amazon capital expenditure over 2003–2017.
contradiction_condition: Comparable completed-year spending materially differs from $765 billion, or the ratio to the verified Amazon baseline is ten or less.
measurement_requirements: Fix company coverage, cash versus lease-inclusive capital expenditure, AI-only versus total spending, calendar-year conversion, and rounding. Reconcile the Amazon historical series on a consistent basis.
source_requirements: Completed-period filings and disclosures, reconciled to the cited estimate's scope. Analyst projections and company guidance are context, not realized spending.
metric_scope:
  company: Big tech; constituent companies unspecified
  metric: Annual capital expenditure compared with Amazon consolidated capital expenditure in 2003–2017
  currency: USD
  units: billions of dollars
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: in 2026
