evaluator_interpretation:
  - "'This' refers to the continued AI investment boom through July 15, 2026."
  - Read 'the only reason' as an exclusive explanation, ruling out other material drivers of continued investment.
  - This assessment does not test the separate counterfactual that an OpenAI collapse would end the boom.
support_condition: Evidence establishes OpenAI's continued survival as the sole material explanation for continued AI investment, with apparent alternative drivers dependent on that survival.
contradiction_condition: Contemporaneous investment records document material drivers of continued investment beyond OpenAI's survival, such as business performance and demand for companies' own AI products.
measurement_requirements: Identify reasons for continued investment rather than merely counting firms that invest. Distinguish a sole cause from a potentially necessary enabling condition.
source_requirements: Prefer primary investment decisions and accompanying explanations. Do not infer independence merely because an investor has a different corporate name.
