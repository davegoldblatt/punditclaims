ambiguity_flags:
  - Geographic scope is unstated; the examples emphasize the United States.
  - The companies could mean major model developers specifically or generative AI service providers generally.
  - Societal damage could include individual copyright injuries or mean only wider collective harms.
  - No observation period is stated; cumulative legal status through publication is used.
  - The wording does not specify whether isolated liability outcomes suffice or whether accountability must be widespread.
