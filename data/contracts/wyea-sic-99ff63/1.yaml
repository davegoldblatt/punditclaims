ambiguity_flags:
  - The products and user population are unspecified.
  - Broken could mean technical failure, inaccuracy, inconvenience or dissatisfaction.
  - No baseline or prevalence threshold is supplied for increasingly.
  - May 2025 is an evaluator-selected reporting window for an undated ongoing observation.
