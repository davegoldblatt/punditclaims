assessment_axis: historical_observation
explicit_source_elements:
  - products they use every day
  - increasingly-broken
  - pumped full of generative AI features
  - literally get in the way of what they’re trying to do
evaluator_interpretation:
  - Assess the supplied normalized proposition about consumer-product usability. The adjoining allegation of intentional monetization through friction is outside that proposition.
  - The plain reading is a broad deterioration in ordinary consumer tasks, with added generative AI features creating obstacles.
  - Increasingly requires a comparison over time; isolated failures or dislike of a feature are insufficient.
  - Use May 2025, the latest complete calendar month before publication, as the current observation period. Earlier examples and later surveys are context.
support_condition: Representative comparisons show that everyday consumer products had become less reliable or harder to use, and that added generative AI features materially obstructed ordinary tasks in the target period.
contradiction_condition: Comparable evidence shows generally stable or improved reliability and task completion after the relevant additions, without the asserted broad obstruction.
measurement_requirements: Compare product versions or matched users on task success, errors, completion time and unwanted interruptions. Include multiple common products and earlier baselines.
source_requirements: Prefer independent usability studies, documented incidents and controlled comparisons. Product announcements establish feature availability, not usability outcomes.
