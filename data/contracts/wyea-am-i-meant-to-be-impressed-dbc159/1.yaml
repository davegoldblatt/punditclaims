explicit_source_elements:
  - Google pays Broadcom to develop TPUs
  - Anthropic pays Google to buy those TPUs
  - Google installs those TPUs in a data center
  - Anthropic pays Google to rent them back
evaluator_interpretation:
  - "Read the core assertion literally: Anthropic buys the equipment from Google and then pays Google rent for the same equipment."
  - Assess the existing contractual arrangements discussed in the post, including agreements for future deliveries. Future delivery does not make the description of an already signed agreement a forecast.
  - This is a qualitative claim about counterparties and transaction structure, not a dollar amount or accounting measure.
  - Later disclosures are admissible only insofar as they establish terms already agreed by May 6, 2026.
support_condition: Contracts or equivalent disclosures establish the claimed sequence, including Anthropic purchasing the TPUs from Google and separately renting those same TPUs from Google.
contradiction_condition: The relevant agreements establish a materially different purchase and rental chain, such as Broadcom purchasing the equipment and leasing it to an Anthropic subsidiary.
measurement_requirements: Identify the purchaser, supplier, lessor, lessee and relevant agreement date. Distinguish equipment rent from cloud services and data-center hosting.
source_requirements: Executed agreements and company filings, supplemented by reporting where an underlying exhibit cannot be read.
