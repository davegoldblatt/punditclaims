explicit_source_elements:
  - both of which will struggle
  - should central bank rates spike
  - venture capitalists
  - private equity and credit firms
evaluator_interpretation:
  - Assess the conditional prediction about funders separately from the startup-profitability premise assessed in claim wyea-the-beginning-of-history-dbdb1e.
  - The ordinary reading of ‘struggle’ is material difficulty raising or supplying capital, or servicing financing obligations.
  - A ‘spike’ means a sharp increase in policy rates, not automatically any positive rate change.
  - The statement does not identify a central bank, an increase threshold, a time window or an unambiguous pair of funder groups.
  - No deadline is imposed.
support_condition: After a demonstrated policy-rate spike relevant to the funders, evidence establishes substantial financing difficulties in both intended funder groups.
contradiction_condition: After the same demonstrated antecedent, sufficiently broad evidence shows that the intended funder groups maintained financing access without the predicted material difficulties over a specified response period.
measurement_requirements: Establish the relevant policy-rate path and the spike criterion first. Then compare fundraising, borrowing access, financing costs and distress in the intended groups before and after the event.
source_requirements: Use central-bank records for the antecedent and fund disclosures or systematic financing measurements for the consequence. Market yields are not interchangeable with central-bank policy rates.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a clearly established qualifying rate spike and a decisive, broadly documented financing consequence for both intended groups. Isolated fund problems do not meet the rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - ‘Both of which’ has multiple plausible referents.
  - No central bank or jurisdiction is specified.
  - ‘Spike’ has no magnitude or duration threshold.
  - ‘Struggle’ has no metric or threshold.
  - No response period or deadline is stated.
