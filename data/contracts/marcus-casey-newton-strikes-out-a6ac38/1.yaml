explicit_source_elements:
  - Diminishing returns doesn’t mean zero improvement
  - the “laws” of scaling no longer hold
  - adding more data and compute
  - no longer are predictive in the way that they used to be
  - the need for new approaches
evaluator_interpretation:
  - The ordinary technical reading is that established relationships between training resources and model performance had lost predictive accuracy.
  - Interpret ROI as capability gains from training resources, because no company financial return is specified.
  - Use the six weeks before publication identified in the immediately preceding sentence as the period of the claimed current breakdown.
  - Smaller marginal gains alone do not establish failed predictions. The claim requires evidence that outcomes departed from the relationships' predictions.
support_condition: Dated frontier training results in the target period show material, repeated departures from previously specified scaling predictions, sufficient to establish the claimed loss of predictive usefulness.
contradiction_condition: Comparable frontier training results in the target period show that established scaling relationships retained their predictive accuracy despite smaller marginal gains.
measurement_requirements: Require the predicted metric, training compute, dataset size, model configuration, forecast, observed result, and uncertainty. Separate next-token loss from downstream capability and financial returns.
source_requirements: Primary training reports or reproducible studies comparing predictions with outcomes. Interviews and reports of disappointing results are insufficient without the underlying comparison.
