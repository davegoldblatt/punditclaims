evaluator_interpretation:
  - The claim concerns the legal proposition, not the speaker's private knowledge.
  - Wholesale means large-scale production or dissemination. The ordinary reading is that falsity and scale alone do not generally make speech unlawful.
  - The stated exception is illustrative and includes other established offenses involving false speech.
  - The target is US law in force at publication. Evidence of continuing legal rules is distinguished from the original dates of decisions.
support_condition: US law does not generally prohibit misinformation solely because it is false and produced or distributed at scale, while allowing liability in specified categories.
contradiction_condition: A generally applicable US prohibition makes large-scale misinformation unlawful as such, outside offenses requiring additional elements.
measurement_requirements: Distinguish a general prohibition from fraud, defamation, election offenses, and other laws with additional elements.
source_requirements: Applicable judicial decisions and authoritative descriptions of US false-speech law.
