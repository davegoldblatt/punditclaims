explicit_source_elements:
  - tens of billions that have been invested since
  - reliability is still a dream
  - toxicity and hallucinations are still with us
  - 26 months later
evaluator_interpretation:
  - The ordinary reading is that broadly dependable operation remained unsolved and that toxic outputs and hallucinations persisted. It does not require every system to fail on every task or deny improvements.
  - The surrounding discussion concerns contemporary generative AI, particularly language models. These systems are the assessment's scope; the claim is not treated as a statement about every application of deep learning.
  - For the ongoing technical state, use the current calendar year through publication, January 1 to June 1, 2024. AI evaluations have no common quarterly reporting period.
  - The investment phrase describes the industry-wide backdrop since approximately April 2022. It is not a conditional forecast or a claim about a named company's accounts, so contract metric_scope is null.
support_condition: Contemporary evaluations document substantive reliability failures, hallucinations, and toxic output in prominent language models, despite documented industry investment in the tens of billions since 2022.
contradiction_condition: Contemporary, sufficiently broad evaluations establish dependable operation across the relevant uses and show that hallucination and toxic-output problems have been resolved. Strong performance on selected tasks alone is insufficient.
measurement_requirements: Identify evaluated models, tasks, failure definitions, and test conditions. Distinguish adversarial tests from ordinary use and persistent failures from a claim of no improvement.
source_requirements: Prefer original evaluations and contemporaneous research. Use investment research for the financial backdrop, without treating investment as spending specifically on reliability.
