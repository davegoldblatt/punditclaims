assessment_axis: causal_assessment
explicit_source_elements:
  - I’ve been concerned for a long time
  - a fixation on Big Data has sucked the oxygen
  - from a lot of other ideas
  - that might be better
evaluator_interpretation:
  - I assess the embedded causal assertion, not whether Marcus sincerely held this concern.
  - The ordinary reading is that prioritizing data-intensive AI materially displaced funding, staffing, or research attention from numerous alternative approaches.
  - "'Might be better' does not assert that those alternatives were demonstrably superior."
  - The claim concerns a developing pattern before publication, with no stated beginning. I retain an unspecified start rather than inventing a fixed historical interval.
support_condition: Research or institutional records establish that prioritizing data-intensive approaches caused material displacement of support for numerous alternative AI approaches.
contradiction_condition: Broad, credible causal evidence shows that the alleged prioritization did not materially displace alternative approaches, or that the apparent displacement was attributable to other causes.
measurement_requirements: Distinguish research concentration from actual displacement; identify affected approaches and an appropriate comparison or documented allocation mechanism.
source_requirements: Causal research, grant and staffing records, or documented institutional decisions. Publication shares alone are insufficient.
