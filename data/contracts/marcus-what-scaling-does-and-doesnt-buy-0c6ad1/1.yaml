assessment_axis: historical_observation
explicit_source_elements:
  - Over the last few years
  - graphics have gotten better and better
  - World models and comprehension less so
evaluator_interpretation:
  - Read the comparison as concerning image generation systems, rather than all AI systems.
  - Graphics means visual fidelity and rendering quality. World models and comprehension mean observable physical coherence, compositional correctness, and understanding of requested content.
  - Interpret the last few years approximately as 2022 through publication.
  - The claim compares improvements over time. A remaining gap in absolute performance does not by itself establish different rates of improvement.
support_condition: Comparable evaluations across the target years show sustained visual-quality gains and materially smaller gains in physical coherence, compositional correctness, or content understanding.
contradiction_condition: Comparable evaluations show that the relevant understanding capabilities improved as much as or more than visual quality, or that the asserted sustained visual-quality improvement did not occur.
measurement_requirements: Use consistent tasks and scoring methods across model generations, separating visual quality from semantic and physical correctness. Explain how gains on different scales are compared.
source_requirements: Primary longitudinal evaluations or reproducible comparisons of models from the relevant years. Contemporary descriptions of limitations alone are insufficient.
