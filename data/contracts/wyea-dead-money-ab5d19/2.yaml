explicit_source_elements:
  - "\"Whenever more capacity comes online, it's immediately sold to OpenAI or Anthropic\""
  - '"who make up anywhere from 70% to 80% of all AI revenues and compute demand"'
  - '"two companies that have been fed over $217 billion in the last nine months"'
  - '"with the vast majority of it coming from Google, Amazon, Microsoft, and NVIDIA themselves"'
evaluator_interpretation:
  - "Tested as three parts: (a) OpenAI and Anthropic make up 70-80% of AI revenues and compute demand; (b) they received over $217B in the nine months before the post (about 2025-12-29 to 2026-09-29); (c) the vast majority of that came from Google, Amazon, Microsoft and NVIDIA."
  - For (b), "fed" is read as announced equity funding (committed capital) in that window.
  - 'For (c), "vast majority" is read in the ordinary sense: well over half, roughly two-thirds or more. A share near or below 55% is not a vast majority under any ordinary reading.'
  - For (a), the present-tense share is read as of the post date. 'All AI revenues' has no named measure.
support_condition: (a) A credible measure puts the two labs at 70-80% of AI revenue or compute demand around September 2026; (b) announced funding to the two labs in the window totals about $217B or more; (c) Google, Amazon, Microsoft and NVIDIA supplied well over half of it.
contradiction_condition: (a) A credible measure puts their share well outside 70-80%; (b) funding in the window was well below $217B; (c) the four firms supplied about half or less.
measurement_requirements: Funding totals and investor amounts for OpenAI and Anthropic rounds closed in the window; a market-wide measure of AI revenue or compute demand by customer.
source_requirements: Company funding announcements and reputable news reports; independent measurements of AI compute or revenue share.
