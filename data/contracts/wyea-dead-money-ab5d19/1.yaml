  - 70% to 80% of all AI revenues and compute demand
  - over $217 billion
  - in the last nine months
  - the vast majority
  - Google, Amazon, Microsoft, and NVIDIA
evaluator_interpretation:
  - The statement combines capacity allocation, revenue share, compute-demand share, financing amount, and financing-source concentration. These require separate tests.
  - For the ongoing revenue and demand shares, use 2026-04-01 through 2026-06-30, the latest completed calendar quarter before publication. This is an evaluator-selected reporting period.
  - For funding, read the last nine months as 2025-12-29 through 2026-09-29. The target-period envelope covers this longer component; it does not make earlier revenue or compute observations comparable.
  - The surrounding discussion suggests revenue earned by AI compute suppliers from the two labs. The literal phrase all AI revenues is broader, so both the numerator and industry boundary remain uncertain.
  - Read fed as financing received or made available, with announced commitments and contingent future tranches separately identified.
  - Read vast majority as substantially more than half, without inventing a numerical cutoff.
support_condition: Comparable records establish both shares between 70% and 80%, widespread immediate allocation of new capacity to these labs, more than $217 billion in qualifying nine-month financing, and a clearly dominant contribution from the four named companies.
contradiction_condition: Comparable records place a claimed share materially outside 70–80%, establish material new capacity allocated elsewhere, or establish that the financing total or named-investor concentration fails the stated threshold. Partial findings must be identified separately.
measurement_requirements: Separate realized supplier revenue, physical compute use or contracted demand, and financing. Use consistent industry boundaries, remove double counting, reconcile financing commitments with receipts, and identify each investor's contribution.
source_requirements: Industry-wide revenue and compute measurements, provider customer allocations, and financing disclosures or filings covering both labs and the named investors.
