assessment_axis: forecast_outcome
explicit_source_elements:
  - Adapting them to other uses
  - would require gutting the data center
  - the vast majority of the capital expenditures were wasted
evaluator_interpretation:
  - Other uses means useful non-AI computing, including conventional hosting or scientific computing.
  - Gutting means removing or replacing most major installed systems, rather than changing software or replacing selected equipment.
  - Wasted capital means original investment rendered economically unusable by conversion, accounting for retained assets and recoverable equipment value.
  - The claim states a general necessity. One expensive conversion would not establish that all practical conversions require it.
  - No particular company, accounting basis, conversion date, or numerical meaning of vast majority is supplied.
support_condition: Completed conversions and applicable engineering constraints establish that practical non-AI reuse requires removing most major systems and losing an overwhelming share of original investment.
contradiction_condition: A documented, relevant conversion achieves useful non-AI operation while retaining major installed systems and a majority of original investment value.
measurement_requirements: Before-and-after engineering inventories and capital accounts, including retained infrastructure, replacement costs, resale proceeds, and losses attributable specifically to conversion.
source_requirements: Operator records, engineering assessments, and conversion accounts. General hardware capabilities or conversions into AI use are insufficient.
metric_scope:
  company: AI data-center owners, unspecified
  metric: Share of original capital expenditure wasted through conversion
  currency: null
  units: share of original capital expenditure
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A completed conversion after publication that retains major systems and most original investment value can disprove the asserted necessity. An isolated costly conversion cannot establish general necessity.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Other uses is unspecified.
  - Gutting and vast majority have no numerical definitions.
  - Capital expenditure may include computing equipment, facility infrastructure, or both.
  - Wasted investment is not distinguished from depreciation, resale losses, or previously productive expenditure.
  - No accounting basis or deadline is supplied.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
