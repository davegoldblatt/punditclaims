assessment_axis: historical_observation
explicit_source_elements:
  - costs are also so severe
  - even paying customers lose these companies money
evaluator_interpretation:
  - These companies refers to the generative AI providers discussed immediately before the sentence.
  - The ordinary reading is that paying customers as a class generate less revenue than the costs of serving them. Unlike the first claim, this sentence does not explicitly say every individual paying customer.
  - Use Q4 2024, the latest completed calendar quarter before publication, as the reporting proxy for this ongoing observation.
  - Serving contribution and profitability after allocating training, research and overhead are different measures. The wording does not specify that allocation or an accounting basis.
support_condition: Matched records show that paying-customer revenue fails to cover serving costs across the referenced providers during the target period, on a specified comparable basis.
contradiction_condition: Matched records establish positive paying-customer contribution at a referenced provider during the target period, using the same specified cost basis.
measurement_requirements: Separate paid customers from free users, API customers from subscriptions, and individual plans from the total paid cohort. Match realized revenue to serving costs and state whether training and overhead are included.
source_requirements: Prefer provider financial disclosures or underlying cost records. A report about one plan cannot establish an industry-wide result, and company-wide losses cannot establish paid-customer losses.
