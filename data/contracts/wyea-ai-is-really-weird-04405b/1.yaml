evaluator_interpretation:
  - The plain reading concerns capacity physically under construction across the announced AI data-center pipeline, regardless of scheduled opening year.
  - Treat 5GW as an approximate reported total, not a precisely measured engineering limit.
  - Use the latest completed quarter before publication, January–March 2026, for the contemporaneous construction snapshot.
  - GW means electrical capacity associated with data centers, not electricity generation or annual energy consumption.
support_condition: Comparable project tracking finds approximately 5GW physically under construction across the relevant announced pipeline, including projects opening after 2026.
contradiction_condition: Comparable tracking or a verified, non-overlapping project inventory establishes materially more or less than 5GW under construction in the same period and scope.
measurement_requirements: Identify geography, project coverage, construction-stage definitions, opening-year coverage, and whether capacity measures total facility power or IT load. Exclude unstarted phases of partially built campuses.
source_requirements: Prefer dated project inventories and primary industry tracking with disclosed coverage. A total for projects scheduled to open in one year cannot establish the entire construction total.
