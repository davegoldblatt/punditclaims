ambiguity_flags:
  - The latest available empirical reporting window is interpreted as 2025 before publication.
  - The sentence combines five assertions with different evidentiary requirements.
  - Work could mean bounded task success or dependable end-to-end autonomous employment.
  - Limited and unreliable have no specified thresholds or application population.
  - Developer population, tool version and task type are unstated.
  - Inference cost could mean unit price, provider production cost, frontier-task cost or total spending.
