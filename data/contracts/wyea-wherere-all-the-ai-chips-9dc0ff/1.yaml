assessment_axis: historical_observation
explicit_source_elements:
  - $290 billion in AI data center debt
  - issued this year
  - outside of hyperscalers
  - the vast majority of these deals are project financing-based
  - funded out of the revenues of a customer who may or may not exist
evaluator_interpretation:
  - This year means January 1 through September 22, 2026, not the completed calendar year.
  - The post links the amount to reporting about an analyst estimate, so the accounting basis is estimate.
  - The plain reading is approximately $290 billion of issued debt for AI data centers, excluding debt issued directly by hyperscalers. Developer borrowing for hyperscaler tenants remains eligible.
  - Vast majority refers primarily to the number of deals. A dollar-weighted share should also be reported because the wording does not distinguish them.
  - Project financing means repayment principally depends on project cash flows. Customer uncertainty concerns future availability or ability to pay; it does not assert that every project currently lacks a tenant.
  - The statement about building capacity supplies a use-of-proceeds claim, not a measurable construction deadline.
support_condition: A reconciled issuance tally establishes approximately $290 billion within the stated period and borrower scope, with construction-related uses and a clearly overwhelming share of deals relying principally on customer-backed project cash flows.
contradiction_condition: A sufficiently complete tally for the same scope establishes a materially different amount, or financing documents show that project-financed transactions are not a vast majority. A differently scoped total alone does not establish contradiction.
measurement_requirements: Identify borrowers, issuance dates, funded amounts, currencies, refinancing, uses of proceeds, repayment sources and guarantees. Separate issued debt from commitments, outstanding balances and equity. Report project-finance shares by deal count and dollars without double counting.
source_requirements: Prefer issuance records, financing agreements and a documented market-wide tally. An analyst estimate must disclose enough coverage to distinguish data-center debt from the broader AI ecosystem.
