ambiguity_flags:
  - Hyperscaler membership and treatment of affiliated financing vehicles are unspecified.
  - Vast majority has no numerical threshold or count-versus-value denominator.
  - AI data-center debt may be narrower than the linked source's AI-related debt.
  - Issued debt versus committed financing is not defined.
  - Customer uncertainty does not distinguish an unsigned lease from future default risk.
