explicit_source_elements:
  - All evidence points to
  - GPU compute
  - a low or negative-margin business
evaluator_interpretation:
  - The surrounding discussion identifies the business as renting GPU compute, excluding hardware sales.
  - The ordinary reading concerns profitability after operating costs, including depreciation. Net profitability also reflects the financing costs discussed in the post.
  - I use calendar 2025 because the adjacent supporting example expressly describes 2025. This is a contextual choice for an otherwise undated sector observation.
  - Low has no numerical threshold. I will not invent one or treat adjusted EBITDA as interchangeable with operating or net profit.
  - Company-wide results from individual providers are informative but cannot alone establish GPU rental margins across the sector.
support_condition: Comparable disclosures covering a representative share of GPU rental activity show consistently low or negative margins after the relevant costs.
contradiction_condition: Comparable disclosures establish substantial GPU rental activity earning clearly strong margins after the same costs, undermining the asserted sector-wide pattern.
measurement_requirements: Separate GPU rental from other activities; distinguish operating profit, net profit, contribution profit and adjusted EBITDA; include depreciation and identify financing costs.
source_requirements: Provider filings or financial disclosures with segment definitions and comparable periods and accounting treatments.
