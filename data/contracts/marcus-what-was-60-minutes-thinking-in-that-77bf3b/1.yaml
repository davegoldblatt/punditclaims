evaluator_interpretation:
  - The plain reading is that contemporary chatbots can supply correct information but repeatedly produce factual gaps, unsupported assertions, or inconsistent access to related facts.
  - "'Often' means a recurring, substantial problem in ordinary factual tasks, not that most answers to every kind of prompt are wrong."
  - Outputs provide an operational test of accessible information; they do not reveal everything encoded internally.
  - I use 2023 through publication as the latest partial calendar year for the current generation of chatbots, which has no regular reporting period.
support_condition: Independent evaluations of contemporary chatbots show useful factual knowledge alongside substantial recurring factual errors or inconsistencies across more than isolated anecdotes.
contradiction_condition: Broad evaluations show reliable factual and relational answers across relevant tasks, with the alleged problems limited to rare or unrepresentative cases.
measurement_requirements: Specify model versions, tasks, and evaluation definitions. Do not equate unsupported statements automatically with proven falsehoods or extrapolate a benchmark error rate to all usage.
source_requirements: Primary factuality and consistency studies of models available by the post date, with reproducible methods where possible.
