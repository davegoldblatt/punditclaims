explicit_source_elements:
  - Stargate Abilene
  - promise to reach 1.2GW
  - nearly two years in
  - two buildings at around 103MW of critical IT load each
  - a third building sitting fully-constructed
  - barely any gear inside it
evaluator_interpretation:
  - The claim combines a planned campus size, two operating buildings of approximately 103 MW critical IT capacity each, and a largely unequipped third building.
  - Critical IT load is read as commissioned rated capacity, not a claim that each building continuously consumes 103 MW.
  - Barely any gear refers principally to installed computing equipment; visible external cooling equipment alone cannot settle that assertion.
  - The publication-time observation is assessed over May 1–12, 2026. Earlier and later operating snapshots are context unless they explicitly establish the intervening state.
support_condition: Dated records corroborate the planned 1.2 GW campus, two operating buildings with roughly 103 MW critical IT capacity each, and a structurally completed but largely unequipped third building at publication.
contradiction_condition: Comparable records establish a materially different operating building count or IT capacity, or show substantial computing equipment already installed in the third building at publication.
measurement_requirements: Separate campus facility power from per-building IT capacity. Establish building identities, commissioning dates and the third building's internal equipment state.
source_requirements: Prefer Oracle or Crusoe commissioning records and equipment inventories. Satellite imagery can establish exterior progress but needs corroboration for internal fit-out.
