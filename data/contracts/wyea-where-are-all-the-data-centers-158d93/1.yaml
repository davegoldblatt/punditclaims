evaluator_interpretation:
  - Read as a factual upper-bound estimate of 1,000,000 physical data center Blackwell GPU packages in service globally.
  - The exact words supply one million; no additional tolerance is imported from the normalized proposition.
  - Include operational Blackwell and Blackwell Ultra systems. Exclude consumer cards, future orders, and hardware still being installed.
  - Use the current May 2026 window through publication, consistent with the surrounding May status checks.
  - Operational availability counts as in service; continuous full utilization is not required.
support_condition: A sufficiently complete operational inventory or defensible global estimate establishes an upper bound of no more than 1,000,000 packages during the target period.
contradiction_condition: A reliable global estimate, or a deduplicated lower bound from verified operational deployments, exceeds 1,000,000 packages during the target period.
measurement_requirements: Dated operational counts in physical GPU packages, reconciled across operators, tenants, sites, and Blackwell variants. Announced or shipped counts cannot substitute for service counts.
source_requirements: Customer operational inventories, commissioning records, or transparent independent estimates with installation evidence and uncertainty bounds.
