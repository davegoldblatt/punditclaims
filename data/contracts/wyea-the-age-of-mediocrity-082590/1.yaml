assessment_axis: causal_assessment
explicit_source_elements:
  - recategorize more and more labor as “unskilled”
  - because a computer could theoretically do it
  - even if the work product sucks
evaluator_interpretation:
  - Recategorization includes explicit managerial treatment of previously skilled work as requiring little skill; a formal HR classification change is not required.
  - The proposed cause is perceived AI substitutability, including cases where output is inadequate.
  - More and more alleges an increasing pattern, not merely one instance of automation.
  - The context concerns the emerging 2023 generative-AI rollout through publication.
  - The because and even-if clauses describe the claimed mechanism, not conditions on a future forecast.
support_condition: Dated corporate statements, classifications or staffing policies show increasing treatment of skilled work as unskilled because of perceived AI substitutability, including documented cases where inadequate output did not prevent that treatment.
contradiction_condition: Representative evidence testing this mechanism shows that perceived substitutability does not produce the alleged reclassification, or that the observed changes have a different demonstrated cause.
measurement_requirements: Measure changes in how work is classified or treated, establish timing and managerial reasoning, document output quality, and distinguish actual reductions in task difficulty from unsupported devaluation.
source_requirements: Corporate records, named managerial statements, longitudinal workplace research or credible causal studies. Layoffs and adoption announcements alone are insufficient.
