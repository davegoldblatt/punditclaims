explicit_source_elements:
  - California’s SB-1047
  - was significantly weakened
  - in last-minute negotiations
evaluator_interpretation:
  - The reference to Thursday identifies the August 15, 2024 amendment agreement, before publication of the post on August 20.
  - The ordinary reading of significantly weakened is a substantial reduction in safety obligations, enforcement powers, or oversight compared with the preceding version.
  - The claim does not require every provision to have weakened or the remaining bill to have become ineffective.
  - Last-minute negotiations describes the amendment process. It is not a conditional forecast.
support_condition: Contemporaneous records establish material reductions in safety obligations, enforcement powers, or oversight in the August 15 amendment agreement.
contradiction_condition: The amendments preserved or strengthened those protections, with no material reductions beyond drafting or administrative changes.
measurement_requirements: Compare the preceding requirements with the agreed amendments. Distinguish removing an institution from transferring its functions, and narrowing enforcement from eliminating it.
source_requirements: Prefer dated legislative texts and the author's amendment explanation. Independent reporting can corroborate changes where the prescribed reader cannot retrieve the legislative texts.
