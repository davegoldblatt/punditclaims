evaluator_interpretation:
  - The ordinary reading is broad use of publicly accessible material without restricting training to public-domain works.
  - “Practically anything” describes breadth of sources, not a measurable assertion that nearly every accessible webpage was ingested or that no filtering occurred.
  - The claim concerns training before the post. Its starting date is unspecified.
  - Use of copyrighted material and unlawful infringement are separate questions.
support_condition: Primary disclosures and empirical evidence establish broad public-internet training that included copyrighted works.
contradiction_condition: Reliable records establish that the relevant training excluded copyrighted public-internet material or was restricted to public-domain content.
measurement_requirements: Evidence of actual training sources or credible training-membership inference; distinguish copyright status, accessibility and licensing.
source_requirements: Company disclosures, court records, dataset documentation or primary empirical research.
