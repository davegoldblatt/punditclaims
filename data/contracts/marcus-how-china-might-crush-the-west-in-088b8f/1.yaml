evaluator_interpretation:
  - Current systems refers to prominent language-model chatbots available when the post appeared, rather than every kind of AI.
  - I read major gap as a material reliability problem that affects practical use, without requiring a particular error percentage or ranking it against every other weakness.
  - "For this ongoing state, I use March 2023 through the post date: the latest public model-release and reporting cycle before the post. Models do not have a standard quarterly reporting period."
  - Defamatory accusations means fabricated, reputation-damaging allegations; it does not require a court judgment establishing legal liability.
support_condition: Contemporaneous disclosures or evaluations document material factual unreliability in leading systems, with credible reports of fabricated damaging allegations.
contradiction_condition: Representative contemporaneous evidence establishes reliable factual performance in ordinary use, and the alleged hallucination or defamatory-output examples are shown to be false reports or outside the claimed systems and period.
measurement_requirements: Separate factual reliability from fluency and benchmark competence. Improvements over earlier models do not by themselves establish adequate truthfulness.
source_requirements: Prefer contemporary model reports and reproducible evaluations. Use reputable incident reporting where primary records are unavailable, distinguishing allegations from judicial findings.
