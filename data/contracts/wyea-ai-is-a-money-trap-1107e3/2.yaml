assessment_axis: historical_observation
explicit_source_elements:
  - big tech
  - has yet to actually turn anything resembling a profit
  - on these data centers
  - isn't making much revenue at all out of generative AI
evaluator_interpretation:
  - "'Big tech' is read as Microsoft, Google (Alphabet), Amazon and Meta, the four companies the surrounding text names."
  - "'Has yet to' is cumulative. It says that from the start of the generative AI buildout (2023) through the latest results before the post (quarter ending June 2025), these companies had shown no profit from their AI data centers."
  - "'These data centers' is read as the AI data centers whose capital spending the passage discusses, not the companies' cloud businesses as a whole."
  - "'Isn't making much revenue at all' is read relative to the hundreds of billions in capital spending the passage discusses. In absolute terms, an informed reader might judge billions of dollars to be a lot."
support_condition: Company disclosures through the quarter ending June 2025 show no profit attributable to AI data centers, and generative AI revenue that is small next to AI capital spending.
contradiction_condition: Company disclosures through the quarter ending June 2025 show a profit attributable to AI data centers or AI services, or generative AI revenue large enough that 'not much at all' is plainly wrong.
measurement_requirements: AI-specific profit, or segment profit clearly attributable to AI infrastructure, plus disclosed generative AI revenue or run rates, compared with AI capital spending.
source_requirements: Company earnings releases, filings and earnings calls through July 2025, or reputable reports of them.
metric_scope:
  company: Microsoft, Alphabet, Amazon, Meta
  metric: Profit on AI data centers; generative AI revenue
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: 2023-01-01
  period_end: 2025-06-30
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: null
horizon_interval: null
target_period:
  start: 2023-01-01
  end: 2025-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - "'These data centers' could mean AI-only capacity, for which no company reports profit, or the cloud businesses those data centers serve, which are highly profitable."
  - "'Not much revenue at all' has no threshold. Whether it is judged in absolute terms or against capital spending changes the answer."
  - The period is cumulative. Its end was set by the evaluator at the latest quarter reported before the post (ending June 2025).
retrospective_or_prospective: retrospective
