assessment_axis: historical_observation
explicit_source_elements:
  - big tech
  - has yet to actually turn anything resembling a profit on these data centers
  - isn’t making much revenue at all out of generative AI
evaluator_interpretation:
  - Big tech means Microsoft, Amazon, Alphabet and Meta.
  - These data centers refers to the generative AI buildout discussed immediately before the claim.
  - The plain reading is that this buildout has not produced positive attributable profits and that generative AI revenue remains small relative to the spending being discussed.
  - Profit requires attributable revenue less relevant costs, including depreciation and operating costs. Whole-company or whole-cloud profits do not establish this result.
  - Use April–June 2025, the latest completed quarter publicly reportable before publication, for the ongoing state. Earlier results could bear on the phrase has yet, but are context outside this target quarter.
  - No accounting basis is supplied for the asserted AI-specific profits or revenue. The contract therefore uses unknown and cannot receive a supported or contradicted money verdict.
support_condition: Comparable AI-specific accounts show no positive attributable profit across the named firms' generative AI data-center operations and revenue small relative to the associated expenditure.
contradiction_condition: Comparable accounts show positive attributable profit from the specified operations or generative AI revenue plainly substantial relative to associated expenditure. Cloud-wide profits or annualized revenue rates alone do not meet this condition.
measurement_requirements: Separate generative AI from conventional cloud computing and other AI. Separate realized revenue from run rates, and operating profit from net profit or cash flow. Identify depreciation, shared costs and revenue attribution. Do not equate advertising using AI tools with incremental revenue caused by those tools.
source_requirements: AI-specific company accounts or transparent independent estimates with a stated accounting basis and cost allocation.
metric_scope:
