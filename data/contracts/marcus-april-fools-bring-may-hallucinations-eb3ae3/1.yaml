support_condition: Controlled tests across contemporary systems find no effective ability to identify errors or inconsistencies and revise answers using their own assessments.
contradiction_condition: A contemporary model demonstrably checks proposed answers and improves them using its own feedback, without being supplied the correct answer or an external error diagnosis.
measurement_requirements: Separate self-generated feedback from external feedback, compare against sampling-only baselines, identify models and prompting, and verify that checking improves correctness.
source_requirements: Primary experiments with documented methods and results. Statements about subjective consciousness are outside this behavioral assessment.
