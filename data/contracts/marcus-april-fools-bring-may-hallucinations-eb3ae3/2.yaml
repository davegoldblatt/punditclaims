ambiguity_flags:
  - The passage moves from one Google search example to current AI generally.
  - Reflecting critically has no stated behavioral measure.
  - Absorb and mimic could describe either observable behavior or an underlying mechanism; this assessment uses the behavioral reading.
  - The speaker does not distinguish spontaneous skepticism from assessment requested by a user.
  - March 2025 is an evaluator-selected reporting window, not a period explicitly named by Marcus.
