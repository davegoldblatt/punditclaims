assessment_axis: historical_observation
explicit_source_elements:
  - an incredibly unprofitable business
  - so much more money than it currently does
  - to pay Oracle on an ongoing basis
evaluator_interpretation:
  - The plain reading combines substantial losses with insufficient recurring revenue to cover the Oracle payments being discussed.
  - I use calendar 2025, the latest completed annual reporting period before the post, for realized revenue and losses. The passage compares annual revenue and annual compute costs.
  - "'Incredibly' has no numerical threshold. Losses large relative to revenue would satisfy its ordinary meaning."
  - The surrounding passage concerns completed Stargate capacity. Its future payment requirements must not be relabeled as bills already payable in 2025.
  - Revenue, cash burn, net loss, financing proceeds, and annualized revenue are separate measures.
  - The claim relies on press-reported financial figures, so its accounting basis is estimate.
support_condition: Comparable financial evidence establishes substantial realized losses and shows that the relevant recurring Oracle payments materially exceed the revenue baseline, with payment timing and scope established.
contradiction_condition: Comparable evidence establishes profitability or shows that the relevant recurring Oracle payments can be covered by the stated revenue baseline without the alleged large increase.
measurement_requirements: Realized annual revenue and net income, plus Oracle-specific contractual payment amounts and commencement dates. Identify noncash charges and distinguish future full-capacity obligations from current bills.
source_requirements: Prefer financial statements and contracts. Independently corroborated financial reporting can support the loss component; reporting that merely repeats Zitron is insufficient.
