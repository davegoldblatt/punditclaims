  - The beginning of the two-year period is approximate.
  - Burn could mean net cash consumption or gross expenditure.
  - The financial period and accounting basis are unspecified.
  - Shared model-development costs require an explicit product-allocation method.
  - The statement about nobody describing ChatGPT is rhetorical.
