assessment_axis: historical_observation
explicit_source_elements:
  - We're two years in
  - no killer apps — no industry-defining products — other than ChatGPT
  - a product that burns billions of dollars
  - nobody can really describe
evaluator_interpretation:
  - The observation concerns the approximately two years ending on the publication date. The target-period start is an approximate anniversary, not a launch date supplied by Zitron.
  - The ordinary reading of an industry-defining product is one with broad adoption and substantial influence on how an industry works. Zitron supplies no numerical threshold; adoption alone cannot decide this classification.
  - The financial statement refers to ChatGPT as a product. It does not equate ChatGPT's finances with OpenAI's consolidated finances.
  - In context, 'burns billions' suggests a multibillion-dollar funding shortfall attributable to ChatGPT. Gross spending is an alternative reading, and neither the accounting basis nor the measurement period is specified.
  - The two-year context does not establish that the financial amount is cumulative over those two years. No annual or quarterly financial threshold is imposed.
  - "'Nobody can really describe' is rhetorical commentary about the product's purpose, rather than a literal claim that no description exists."
support_condition: Evidence would need to establish that ChatGPT was the sole industry-defining generative-AI application by the post date and separately establish billions of dollars of ChatGPT-specific burn on an identified financial basis and period. OpenAI-wide losses or costs cannot establish the product-level financial statement.
contradiction_condition: A demonstrably industry-defining generative-AI application other than ChatGPT would contradict the exclusivity statement. Complete ChatGPT-specific financial records showing burn below the claimed magnitude, on a matching basis and period, would contradict the financial statement. Popularity alone and OpenAI-wide figures are insufficient.
measurement_requirements: Assess adoption alongside evidence of changes to industry practice, without inventing a subscriber cutoff. Financial evidence must distinguish ChatGPT from API services, other products, and shared research; distinguish gross spending from net cash burn; and identify the period and cost-allocation method.
source_requirements: Prefer contemporary product disclosures and independent evidence of industry impact. Financial evidence must explicitly isolate ChatGPT. Later publications may inform the assessment only when they describe the historical period and were available by 2026-10-28.
