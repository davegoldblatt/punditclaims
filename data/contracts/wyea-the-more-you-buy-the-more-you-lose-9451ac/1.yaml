assessment_axis: historical_observation
explicit_source_elements:
  - currently has 5.6%
  - 7.1GW of capacity
  - meant to begin in June 2026
evaluator_interpretation:
  - The assessed proposition concerns operational Oracle capacity available to OpenAI and the stated contract start. The surrounding financial rhetoric and deal valuation are background, not separate scored propositions.
  - Currently means the operational state at publication. I use July 1–28, 2026 as the current reporting window, with evidence required to establish the state by July 28.
  - The numerator and denominator must use the same power definition and cover the same Oracle–OpenAI arrangement.
  - "The stated percentage implies approximately 397.6MW: 7,100MW multiplied by 0.056. This arithmetic is a test threshold, not independent evidence."
  - A contract beginning in June 2026 does not by itself imply that all contracted capacity was required on that date.
support_condition: Reliable records establish approximately 5.6% operational capacity on a consistent 7.1GW basis at publication and establish June 2026 as the intended start of the same contract.
contradiction_condition: Comparable records establish a materially different operational share at publication, a different contracted capacity requirement, or a different intended start date for the same agreement.
measurement_requirements: Customer-allocated operational capacity in MW or GW, consistent treatment of IT load and total facility power, a verified 7.1GW denominator, and the contract's commencement and delivery schedule.
source_requirements: Oracle or OpenAI disclosures, contract records, utility commissioning records or dated independent measurements. Later capacity additions cannot establish the July state.
