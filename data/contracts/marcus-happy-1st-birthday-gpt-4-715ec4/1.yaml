explicit_source_elements:
  - Bad actors
  - appear to be using them
  - cybercrime and disinformation
evaluator_interpretation:
  - ‘Them’ refers to LLMs. The claim concerns actual use supporting malicious activity, not necessarily successful attacks or effective persuasion.
  - Both cybercrime and disinformation require evidence. State-linked malicious hacking falls within the ordinary reading of cybercrime here.
  - "The birthday retrospective supplies a reporting window: the year preceding publication. Later reports may establish activity within that window."
  - The suggestion about lower reliability standards is explanatory speculation, not a separate factual commitment.
support_condition: Documented malicious actors used LLMs to assist cyber operations and to produce or distribute deceptive influence content during the target period.
contradiction_condition: Reliable investigations establish that the apparent uses in one or both categories were misidentified or did not involve LLMs. Failure to find incidents alone would not establish contradiction.
measurement_requirements: Distinguish observed use from demonstrations, hypothetical risks, and image or audio generation without evidence of LLM involvement.
source_requirements: Provider investigations, original threat intelligence, or independently documented incidents with dates connecting the activity to the target period.
