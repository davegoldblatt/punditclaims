assessment_axis: causal_assessment
explicit_source_elements:
  - across almost every major tech company
  - software engineers are being incentivized
  - to stop learning how to write software
  - or solve software architecture issues
evaluator_interpretation:
  - The plain reading concerns incentives that favor substituting AI output for independent coding and architecture learning, whether or not management intends to reduce learning.
  - "'Almost every' requires near-universal coverage of a defensible set of major technology employers, not examples from several prominent companies."
  - AI adoption requirements alone do not establish that independent learning is discouraged.
  - The relevant policies are those operating as of March 24, 2026. Later policy changes cannot establish the earlier state.
  - A short learning experiment can test a possible mechanism, but cannot establish company-policy prevalence or long-term architectural skill development.
support_condition: Policies or credible internal records across a representative set of major technology employers must show rewards for substituting AI for independent coding and architecture learning, with evidence that the incentives discourage that learning.
contradiction_condition: Representative policy and workforce evidence showing that major employers generally preserve or reward independent learning, or that the asserted mandates do not discourage it, would contradict the broad claim.
measurement_requirements: Define major technology employers and measure coverage. Distinguish tool adoption, productivity targets, code-generation mandates and learning incentives. Evaluate coding and architecture learning separately.
source_requirements: Company policies and training or performance criteria, authenticated reporting where policies are private, and workplace studies linking incentives to learning behavior.
