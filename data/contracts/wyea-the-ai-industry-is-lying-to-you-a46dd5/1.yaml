ambiguity_flags:
  - No defined population of 'major tech companies'.
  - No exact coverage threshold for 'almost every'.
  - Direct incentives against learning versus indirect effects of productivity pressure.
  - Reduced practice versus stopping learning.
  - Coding skills and software architecture skills are combined.
