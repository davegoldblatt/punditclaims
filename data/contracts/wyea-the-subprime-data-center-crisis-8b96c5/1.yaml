assessment_axis: causal_assessment
explicit_source_elements:
  - those customers do not exist
  - at a scale that would actually make it worthwhile
  - It’s because
evaluator_interpretation:
  - Those customers means diversified purchasers of Meta's spare AI compute, outside the Anthropic deal discussed immediately before the sentence.
  - The ordinary reading is that insufficient economically viable diversified demand materially explains Meta's negotiations with Anthropic.
  - Worthwhile means commercially attractive given capacity, service costs, prices and contract terms. No numerical profitability hurdle is supplied.
  - The target is the July negotiations described in the context, through the July 22 post.
  - Negotiating with Anthropic does not itself establish that Meta rejected other customers or adopted an exclusive sales strategy.
support_condition: Contemporaneous decision records, customer offers and capacity economics show that insufficient viable diversified demand materially caused Meta to pursue Anthropic.
contradiction_condition: Comparable viable diversified demand existed, and reliable decision evidence shows that the asserted shortage did not explain Meta's choice.
measurement_requirements: Meta's available capacity, prospective customer offers, service requirements, expected margins and contract terms, with evidence connecting those facts to its decision.
source_requirements: Meta disclosures or internal decision records, verified commercial documents, or credible reporting based on participants. Other providers' contracts are context.
