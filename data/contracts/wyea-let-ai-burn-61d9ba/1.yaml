assessment_axis: forecast_outcome
explicit_source_elements:
  - a bubble that will hurt hundreds of millions of regular people globally
  - Sam Altman and Dario Amodei remain billionaires
  - despite their companies’ fates
evaluator_interpretation:
  - Hundreds of millions means at least 200 million distinct people.
  - Hurt means material economic harm, such as employment, savings or pension losses attributable to the AI bubble's unwinding.
  - People must be counted without duplication; a dollar amount of market losses is not a population count.
  - Both individuals must retain personal net worth of at least US$1 billion during the relevant harm episode.
  - The normalized forecast is assessed here. The accompanying claim about journalism causing the bubble would require a separate causal assessment.
support_condition: Credible evidence establishes AI-bubble-related economic harm to at least 200 million distinct people worldwide while both named individuals remain billionaires during that episode.
contradiction_condition: A clearly identified and completed episode establishes an incompatible wealth outcome or a defensible affected-population total below the threshold. An incomplete count or absence of the event by the evaluation date is not contradiction.
measurement_requirements: A documented economic episode, causal attribution, an unduplicated global population estimate and contemporaneous personal net-worth estimates for both individuals.
source_requirements: Prefer official household, pension and employment statistics or transparent independent studies; use credible wealth estimates with dates and methods.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented episode with a credible harm count meeting the threshold and simultaneous billionaire status for both individuals could settle the forecast. Contrary evidence must concern the same identifiable episode rather than a temporary earlier change.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No definition of hurt or regular people.
  - No specified causal attribution method.
  - No duration for remain billionaires.
  - No explicit boundary separating one bubble-collapse episode from another.
retrospective_or_prospective: retrospective
