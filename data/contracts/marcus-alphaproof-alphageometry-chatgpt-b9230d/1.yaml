explicit_source_elements:
  - My strong intuition
  - LLMs are simply never going to work reliably
  - at least not in the general form that so many people last year seemed to be hoping
evaluator_interpretation:
  - "Plain reading: general-purpose LLMs (pure LLMs, not hybrid neurosymbolic systems) will never reach reliable performance across general tasks, meaning free of frequent hallucinations and reasoning errors, as many hoped in 2023."
  - "'Never' has no deadline. The forecast can be contradicted early by a decisive event but cannot be confirmed by any finite date."
  - Whether reasoning models with tools still count as 'LLMs' is an open question in the claim itself.
support_condition: Cannot be finally confirmed at any finite date. Continued hallucination and error in leading LLMs is consistent with the claim but does not settle it.
contradiction_condition: Broad independent evaluations show a general-purpose LLM working reliably across diverse real-world tasks, for example near-zero hallucination and reasoning-error rates comparable to dependable software.
measurement_requirements: Broad, independent evaluations of hallucination and error rates of leading general-purpose LLMs across diverse tasks.
source_requirements: Independent benchmarks, peer-reviewed evaluations, model developers' own system cards.
