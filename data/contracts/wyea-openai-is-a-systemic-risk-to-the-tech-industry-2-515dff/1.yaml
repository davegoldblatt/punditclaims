explicit_source_elements:
  - Any mention of rate limits or performance issues
  - suggests that OpenAI is having significant capacity issues
  - at this point it's unclear what further capacity it can actually expand to
evaluator_interpretation:
  - The checkable core is that OpenAI was facing significant compute capacity problems in the weeks before the post (late February to mid-April 2025), shown by rate limits, delays and degraded service.
  - The second clause ('it's unclear what further capacity it can expand to') states the author's uncertainty. It is not a firm factual claim, so it is treated as context and not scored on its own.
support_condition: Contemporaneous statements or reports show OpenAI was limiting service, delaying releases or suffering slowdowns because it lacked compute capacity during late February to mid-April 2025.
contradiction_condition: Evidence shows OpenAI's rate limits and slowdowns in that period were not caused by capacity shortages (for example, they were purely product or pricing choices with ample spare compute).
measurement_requirements: Statements by OpenAI leadership or reliable reports on capacity-driven rate limits, delays or outages in the target period.
source_requirements: OpenAI statements, as reported by reputable news outlets, or OpenAI's own posts.
