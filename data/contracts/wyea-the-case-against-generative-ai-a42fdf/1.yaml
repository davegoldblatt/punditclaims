assessment_axis: historical_observation
explicit_source_elements:
  - cannot rely on a large language model
  - to do what you want
  - can’t actually be relied upon to do exactly what you want
  - correctly, or even consistently, every time
evaluator_interpretation:
  - The ordinary contextual reading is that contemporary LLMs cannot generally be trusted to complete requested work correctly without checking, particularly complex or multistep work.
  - This does not mean that LLMs never succeed, that every task is unreliable, or that useful systems must be mathematically infallible.
  - Use September 2025 through publication as the latest contemporaneous observation window; there is no standardized reporting quarter for model reliability.
  - Assess models and configurations available then. Later improvements do not settle this historical observation.
support_condition: Contemporaneous evaluations show substantial failures to complete clear, realistic user tasks, including complex work emphasized in the context, sufficient to undermine general reliance without verification.
contradiction_condition: Broad, independently replicated evaluations establish consistently correct completion across representative routine and multistep user tasks without substantial human correction. Isolated successful demonstrations are insufficient.
measurement_requirements: Record model versions, tasks, execution setup, success criteria, and failure rates. Prefer repeated trials; distinguish task completion from relative human preference and usefulness with oversight.
source_requirements: Primary benchmark reports or independent evaluations, with company evaluations identified and their limitations stated.
