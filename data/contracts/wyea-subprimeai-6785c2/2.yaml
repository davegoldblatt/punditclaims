assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s models and products
  - deeply unprofitable to operate
  - an estimated $4 billion in 2024
  - staffing
  - training costs
evaluator_interpretation:
  - The context expressly uses annual 2024 estimates, so the target is calendar 2024 rather than an invented first-half reporting period.
  - The ordinary reading is substantial aggregate operating losses after costs attributable to developing and delivering the products, including compute and staffing.
  - The claim does not require every product or individual inference request to have a negative gross margin.
  - Deeply means losses substantial relative to revenue. The speaker supplies no numerical margin threshold.
  - The accounting basis is estimate because the argument relies on press estimates. Full-year estimates concern annual activity, not an annualized revenue run rate.
support_condition: Comparable 2024 estimates show that revenue from OpenAI's model and product business falls substantially short of its attributable operating costs.
contradiction_condition: Comparable 2024 estimates show aggregate operating profitability, break-even performance, or only a small operating deficit relative to revenue.
measurement_requirements: Compare calendar-year revenue and attributable operating expenses on a consistent basis. Distinguish aggregate operating losses from inference margins, financing, cash burn, and non-operating accounting charges.
source_requirements: Company financial disclosures or credible financial reporting with identifiable sourcing. The speaker's own reporting is not independent outcome evidence.
