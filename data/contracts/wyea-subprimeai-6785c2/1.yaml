assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s models and products
  - deeply unprofitable to operate
evaluator_interpretation:
  - The ordinary reading is that operating the products collectively generated a substantial loss after attributable costs.
  - This does not require every product or every additional query to lose money.
  - Include serving costs and attributable staffing and maintenance costs. Do not automatically allocate all spending on future-model research to current products.
  - Because this is an ongoing observation without a completed period, use the first half of 2024, the latest completed half-year before publication. The surrounding full-year estimates are contextual projections, not realized first-half results.
  - Use estimate as the accounting basis because the surrounding financial argument relies on press estimates.
support_condition: Comparable first-half 2024 product revenue and attributable operating costs show a substantial aggregate operating loss.
contradiction_condition: Comparable first-half 2024 revenue and attributable operating costs show that the product portfolio operated profitably or approximately broke even.
measurement_requirements: Match revenue and costs across the same products and period. Include free-user serving costs and explain allocations of staffing, maintenance and training. Gross inference margins alone do not establish operating profitability.
source_requirements: Prefer product accounts or credible reporting with a transparent cost allocation. Company-wide losses and annualized revenue alone are insufficient.
