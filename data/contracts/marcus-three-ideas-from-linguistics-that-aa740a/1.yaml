evaluator_interpretation:
  - The plain reading concerns whether generated language is tied to identifiable entities and situations outside the text, rather than merely whether it sometimes states correct facts.
  - The full post distinguishes standalone word-prediction models from models incorporated into externally connected workflows. That distinction must be preserved when assessing tool-assisted systems.
  - For this ongoing state, use the current calendar year through publication as the latest reporting window. Research models have no regular quarterly reporting cycle.
support_condition: Documentation and controlled tests establish that the contemporary standalone models lack a mechanism for tying generated references to identifiable external entities or situations.
contradiction_condition: A contemporary model within the stated scope demonstrably links its generated references to identifiable external entities or situations, beyond producing coincidentally correct statements.
measurement_requirements: Distinguish factual accuracy, retrieval of external documents, learned conceptual representations and situated reference. Identify which capability an experiment actually demonstrates.
source_requirements: Primary documentation and controlled experiments concerning models available by publication. The speaker's article may clarify scope but cannot establish the outcome.
