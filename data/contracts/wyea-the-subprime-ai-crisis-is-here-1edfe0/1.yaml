assessment_axis: causal_assessment
explicit_source_elements:
  - every bit of AI demand
  - barely $65 billion of it existed in 2025
  - only exists due to subsidies
  - if these companies were to charge a sustainable rate
  - said demand would evaporate
evaluator_interpretation:
  - In this discussion of model subscriptions and applications, AI demand means paid demand for generative AI services. Including all semiconductor sales or established advertising systems would stretch the context.
  - The monetary component concerns realized 2025 customer spending or provider revenue, with a consistent boundary that avoids counting the same spending repeatedly through suppliers.
  - The causal assertion concerns demand existing at publication. The target interval includes 2025 and the period through March 31, 2026.
  - Subsidies means outside funding or cross-subsidies allowing prices below the full recurring cost of sustaining the service.
  - Evaporate means commercially meaningful demand would disappear at cost-covering prices, not merely grow more slowly.
  - The conditional phrase is assessed as a causal counterfactual. It is not converted into a dated forecast or treated as an observed industry-wide price increase.
  - Barely is approximate; I do not invent a numerical tolerance. The quotation identifies no accounting or aggregation basis.
support_condition: Comparable evidence establishes the approximate 2025 market size and demonstrates that all commercially meaningful demand depends on below-cost pricing and disappears when full recurring costs are charged.
contradiction_condition: A consistently measured 2025 market size clearly conflicts with the stated magnitude, or credible observed demand persists at demonstrably fully cost-covering prices for a meaningful service within the claimed market.
measurement_requirements: Define the market boundary, avoid supplier-chain double counting, use realized rather than annualized revenue, measure fully allocated recurring costs, and identify customer responses to prices independently of product-quality changes.
source_requirements: Prefer transparent market estimates and direct pricing, cost, and retention records or causal studies. Funding totals, customer complaints, and willingness-to-accept surveys alone cannot establish subsidy dependence.
