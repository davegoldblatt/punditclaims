explicit_source_elements:
  - Generative AI
  - as I said back in March
  - is peaking
  - if it hasn't already peaked
evaluator_interpretation:
  - The surrounding sentences make substantive capability the plain referent of peaking, rather than revenue, popularity or investment.
  - I assess the current-state observation over April–June 2024, the latest completed quarter before the post. This reporting window is an evaluator choice because no standard reporting period exists for AI capabilities.
  - Peaking permits some remaining improvement; it is weaker than saying that no model improved during the quarter.
  - Later developments cannot serve as outcome evidence for this historical assessment.
support_condition: Representative evaluations during the target period show that substantive capabilities had broadly levelled off or were approaching a demonstrated ceiling.
contradiction_condition: Comparable evaluations establish substantial, broad and continuing capability gains during the target period, sufficient to reject a plateau or approaching ceiling.
measurement_requirements: Comparable task-success measurements across model generations and substantive domains. Speed, presentation and new input formats alone do not establish capability growth.
source_requirements: Dated evaluations identifying model versions, tasks and methods; independent measurements are preferable to developer claims alone.
