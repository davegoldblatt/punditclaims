  - Repeatedly means multiple independent demonstrations of substantial vulnerability.
  - The ordinary testable reading concerns differing behavior on attacked tasks. It does not establish that humans and networks share no computational principles.
support_condition: Multiple primary studies demonstrate substantial adversarial failures, with evidence that human responses or robustness differ on comparable inputs.
contradiction_condition: The reported vulnerabilities fail to reproduce, or appropriate human comparisons remove the claimed behavioral differences.
measurement_requirements: Compare ordinary and attacked performance, and distinguish direct human testing from demonstrations that only claim perceptual similarity.
source_requirements: Primary adversarial evaluations, including human-comparison research and relevant contrary findings.
