assessment_axis: forecast_outcome
explicit_source_elements:
  - Build a regulatory moat
  - protecting American companies
  - Certainly
  - slow down progress and raise prices
  - helping two US companies
  - at the expense of hundreds of thousands of others
evaluator_interpretation:
  - The condition is an implemented US barrier that materially restricts competing models in the commercial market to protect OpenAI and Anthropic. A proposal alone does not qualify.
  - The two beneficiaries are OpenAI and Anthropic. Progress means improvements in AI capabilities, products, and deployment; prices means prices paid by US AI customers for comparable services.
  - Hundreds of thousands means at least 200,000 other businesses suffering attributable harm. This numerical floor is my interpretation.
  - The claimed effects must result from the barrier, rather than merely follow it.
support_condition: After a qualifying barrier takes effect, credible causal evidence shows slower AI progress, higher comparable-service prices, benefits to both named labs, and harm to at least 200,000 other businesses.
contradiction_condition: A sufficiently complete evaluation of a qualifying policy episode establishes that one or more of the asserted effects did not occur. A short period without an observed effect is insufficient.
measurement_requirements: Identify the policy, implementation dates, affected market, comparable-service prices, innovation measures, and business impacts. Estimate effects against a credible no-policy comparison and distinguish the number of exposed businesses from the number actually harmed.
source_requirements: Official policy records establishing implementation, followed by independent market and business-impact evidence. Advocacy and proposed restrictions do not establish the condition or outcome.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a qualifying implemented barrier and a dated, sufficiently complete causal evaluation establish or refute its asserted effects. Proposals and isolated price changes cannot settle this forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Regulatory moat does not identify a particular policy or legal mechanism.
  - Whether procurement restrictions with indirect commercial effects qualify is unspecified.
  - Progress, prices, business harm, and the magnitude of benefits are not defined.
  - No deadline or observation duration is stated.
retrospective_or_prospective: retrospective
