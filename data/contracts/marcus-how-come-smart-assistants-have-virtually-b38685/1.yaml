explicit_source_elements:
  - Large Language Models like GPT-3
  - they are not
  - great tech for reliably inferring user intent from what users say
  - may never be
evaluator_interpretation:
  - The checkable assertion is about contemporary capability. May never be is a hedged possibility, not a separate forecast of permanent failure.
  - The ordinary reading concerns dependable understanding of intended meaning across ordinary language, including implications and context. It does not deny useful performance on bounded classification tasks.
  - Substantial recurring errors on simple tests of intended meaning count against dependable general understanding; occasional errors alone do not.
  - The present-tense assertion is assessed over the current research year through November 22, 2022. From the outset principally introduces the contrasting statement about prose and benchmarks.
support_condition: Contemporary evaluations of GPT-3-class models show substantial, systematic difficulty recovering intended meaning, including with reasonable prompting or instruction tuning.
contradiction_condition: Contemporary evaluations demonstrate consistently dependable recovery of intended meaning across representative explicit, indirect, and context-dependent requests.
measurement_requirements: Use tests of intended meaning or instruction interpretation. Distinguish these from factual accuracy, prose quality, execution failures, and the usefulness of generated training data.
source_requirements: Primary evaluations of models available before the post, using the contemporary paper versions.
