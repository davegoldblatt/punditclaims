assessment_axis: causal_assessment
explicit_source_elements:
  - allowed Anthropic to juice its revenues
  - upfront nature of these contracts
  - Cursor is locked-in
  - these cost increases
  - less attractive to its customers
  - will thus make it less money
evaluator_interpretation:
  - "Assess the asserted causal chain as a whole: supplier price changes increased Anthropic revenue, constrained Cursor, reduced customer appeal and would reduce Cursor revenue."
  - The surrounding statement that annualized revenue will drop makes revenue, rather than profit, the ordinary reading of less money.
  - The asserted cause concerns May–June 2025 changes; the prospective consequence has no deadline.
  - This is an asserted causal relationship with a future consequence, not an explicitly conditional forecast. The alleged supplier-cost exposure still requires verification.
  - The single metric_scope records the Cursor revenue endpoint. Anthropic's revenue effect and Cursor's contract obligations require separate evidence and cannot be substituted for it.
  - The supplied passage does not identify an accounting basis for Cursor's projected revenue.
support_condition: Contract and pricing evidence establishes Cursor's increased exposure, and revenue and customer evidence credibly attributes higher Anthropic revenue, reduced Cursor appeal and lower Cursor revenue to those changes.
contradiction_condition: Direct evidence disproves a necessary link, or a credible causal analysis finds that the specified changes did not produce the alleged adverse revenue effect.
measurement_requirements: Comparable supplier terms, Cursor usage costs, customer retention and revenue before and after the changes, with competing causes addressed.
source_requirements: Prefer contracts, company disclosures and customer-level measurements. Revenue snapshots and complaints alone cannot identify the cause.
metric_scope:
  company: Cursor
  metric: annualized revenue run rate
  currency: USD
  units: USD per year
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: annualized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: The undated future component cannot be rejected merely because revenue later grows. Resolution requires direct evidence establishing or disproving the alleged causal effect; a later revenue snapshot alone is not decisive.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline for the predicted revenue decline.
  - Less money could mean an absolute decline or revenue below what otherwise would have occurred; surrounding text favors an absolute decline.
  - Cursor's actual supplier contract and price exposure are not specified.
  - Multiple companies and causal links are bundled together.
  - No accounting basis is stated for the projected Cursor revenue.
retrospective_or_prospective: retrospective
