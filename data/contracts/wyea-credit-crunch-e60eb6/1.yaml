assessment_axis: historical_observation
explicit_source_elements:
  - Every one of the “Stargate” data centers
  - heavily behind schedule
  - no more than half of its capacity installed
  - Oracle claims is “75% delivered”
evaluator_interpretation:
  - Read 'every one' as all announced Stargate campuses, not merely Abilene.
  - Read 'heavily behind schedule' as substantial slippage against previously announced construction or service milestones.
  - Read 'capacity installed' as installed computing equipment relative to the planned completed campus, using a consistent capacity measure. Building delivery, electrical capacity and operating compute are not automatically equivalent.
  - Use September 2026, the latest completed monthly construction-reporting period before publication, for the ongoing observation. Evidence must also remain relevant to the October 6 statement.
support_condition: Comparable original schedules and progress records establish substantial delays at every included campus, and equipment records establish that Abilene had at most 50% of its planned computing capacity installed.
contradiction_condition: Reliable records establish that at least one included campus was not substantially delayed, or that more than 50% of Abilene's planned computing capacity was installed.
measurement_requirements: A defined campus list, original milestone dates, actual or revised milestone dates, and an installed-capacity numerator and final-capacity denominator measured on the same basis.
source_requirements: Prefer dated construction records, customer acceptance records, equipment inventories and regulatory filings. Treat developer statements and satellite-based estimates according to what they actually establish.
