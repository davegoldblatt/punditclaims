explicit_source_elements:
  - prices its IPO at $1.5 trillion
  - much less capital raised on listing
  - will have to take on more and more debt
  - high-burn-rate, negative-EBITDA company
  - dangerous for the AI trade
evaluator_interpretation:
  - The condition is a completed Anthropic IPO at a reported equity valuation of $1.5 trillion, not investor discussion of that valuation.
  - Read the testable core as a proceeds shortfall that causes additional borrowing after the IPO.
  - Compare proceeds with a documented earlier offering plan, accounting for the number of newly issued shares and any secondary sales.
  - Assess cash burn and EBITDA separately; neither net loss nor a financing commitment substitutes for those measures.
  - The broader danger to the AI trade lacks a specified market measure and is not independently scored.
support_condition: After the qualifying IPO, offering records show materially lower proceeds than the comparable prior plan, and financing records show additional borrowing caused by that shortfall, alongside the claimed cash burn and negative EBITDA.
contradiction_condition: After the qualifying IPO, completed offering and financing records establish that the predicted funding shortfall and resulting need for additional debt did not occur. A short interval without new borrowing is insufficient.
measurement_requirements: IPO equity valuation, primary shares sold, gross and net proceeds, comparable prior offering plan, debt actually drawn or issued, cash flow and consistently defined EBITDA. Distinguish SPV financing, leases and undrawn commitments from Anthropic debt.
source_requirements: Final prospectus, closing announcement, financial statements and financing agreements, with reliable reporting for any unavailable private offering plan.
