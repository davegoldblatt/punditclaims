explicit_source_elements:
  - As of typing this sentence
  - NVIDIA alone makes up 11.31% of the NASDAQ 100
  - NVIDIA, Google, Amazon, Meta, Microsoft, Broadcom, Micron, AMD and CoreWeave
  - about 46.5% of the index’s value
  - 39.3% of the entire 3000-company NASDAQ composite
evaluator_interpretation:
  - Interpret the percentages as actual constituent weights in the two named indices.
  - Treat Google as Alphabet and include all eligible Alphabet share classes, without counting the company twice.
  - "Use October 19–20, 2026: the last completed trading session before publication and the publication day. The drafting timestamp is unknown."
  - Test all three percentages against one consistent timestamp. Round NVIDIA's weight to two decimal places and the combined weights to one decimal place.
  - Because 'about' allows some latitude, a small rounding discrepancy alone is insufficient for contradiction.
  - Treat '3000-company' as an approximate description of the Composite, not a separate exact constituent-count claim.
support_condition: A reliable contemporaneous snapshot reproduces NVIDIA's 11.31% Nasdaq-100 weight and combined weights approximately equal to 46.5% in the Nasdaq-100 and 39.3% in the Nasdaq Composite for the named companies.
contradiction_condition: Reliable contemporaneous constituent data materially disagree with one or more percentages after accounting for rounding, share classes, and plausible intraday timing. Differences at later dates are insufficient.
measurement_requirements: Use official constituent weights or a reproducible reconstruction using the applicable index shares, prices, and corporate actions. Sum eligible share classes once, distinguish the two indices, and retain the timestamp and unrounded inputs.
source_requirements: Prefer dated Nasdaq weight files. A reputable archived dataset is acceptable if its timestamp and methodology are clear. ETF holdings require reconciliation before they can stand in for index weights.
