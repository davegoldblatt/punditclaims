assessment_axis: historical_observation
explicit_source_elements:
  - Large language models
  - unless hybridized with symbolic systems
  - on their own
  - inherently weak
  - understanding the physical and psychological world
evaluator_interpretation:
  - The ordinary behavioral reading is a systematic weakness in reasoning about physical situations and people's beliefs, intentions and reactions, rather than a claim that models answer every such question incorrectly.
  - Inherently attributes the weakness to the unaided model approach; isolated mistakes are insufficient to establish that stronger component.
  - Symbolic solvers and external reasoning systems are excluded. Natural-language prompting alone does not count as symbolic hybridization.
  - The observation concerns models available by the post. Its contextual reference to continuing general phenomena supplies the August 2020-to-June 2022 historical interval.
  - Later models cannot directly decide this historical observation.
support_condition: Varied evaluations of contemporary unaided LLMs show systematic weaknesses in both physical and psychological reasoning, with evidence that those weaknesses belong to the approach rather than a particular benchmark or configuration.
contradiction_condition: Contemporary unaided LLMs demonstrate robust, generalizable competence across varied physical and psychological reasoning tasks, including novel cases and controlled variations.
measurement_requirements: Separate physical and psychological reasoning; report model versions, prompting, external components, human comparisons, task variation and reproducibility. Benchmark success alone is not an independent measure of understanding.
source_requirements: Primary evaluations of models within the historical scope, with sufficient methodological detail to identify symbolic assistance and task coverage.
