assessment_axis: forecast_outcome
explicit_source_elements:
  - We aren’t going to be able
  - calculate p(doom)
  - to three decimal places
evaluator_interpretation:
  - The ordinary reading concerns justified predictive accuracy, not the ability to print a probability with three digits after the decimal point.
  - For testing, three decimal places means demonstrated accuracy sufficient to justify rounding a probability on the zero-to-one scale to 0.001.
  - The post supplies neither a deadline nor a precise definition and time horizon for doom. A proposed counterexample must state these and address AI-caused extinction or comparably irreversible catastrophe.
support_condition: A decisive, independently scrutinized impossibility result establishes that the claimed accuracy cannot be attained for the relevant probability; continued lack of a method alone does not establish the forecast.
contradiction_condition: A publicly documented method achieves independently validated accuracy sufficient to justify three decimal places for a clearly specified, relevant AI doom probability.
measurement_requirements: Require validation of uncertainty and accuracy, including model assumptions. Numerical formatting, agreement among forecasters, and accuracy on unrelated short-term questions are insufficient.
source_requirements: Public methods and independent validation available by 2026-10-28.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve on the dated public validation of a qualifying method, or a decisive impossibility result covering the claimed task. Neither a subjective estimate nor elapsed time qualifies.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is given.
  - Doom and its probability horizon are not precisely defined.
  - Three decimal places could refer to probabilities or percentages.
  - The sentence may express practical limits rather than permanent mathematical impossibility.
retrospective_or_prospective: retrospective
