explicit_source_elements:
  - Companies
  - will poke for loopholes
  - surely find them
evaluator_interpretation:
  - The companies are AI companies subject or potentially subject to EO 14110.
  - A loophole is an exploitable gap allowing avoidance of an intended obligation under the order.
  - The prediction requires documented company conduct seeking and identifying such a gap. Actual exploitation would be stronger evidence but is not essential to the words used.
  - An analyst identifying a possible weakness, or a company seeking a policy change, does not by itself establish the predicted conduct.
  - No deadline is supplied.
support_condition: Public records document AI companies seeking and identifying usable gaps in EO 14110 obligations while the order applied.
contradiction_condition: A sufficiently comprehensive record of the order's operation establishes that companies did not seek and identify such gaps. Failure to locate public examples alone is insufficient.
measurement_requirements: Identify the company conduct, the relevant provision, the avoidance mechanism and when it occurred.
source_requirements: Company submissions or records, enforcement findings, court records, or well-supported reporting of actual company conduct.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented episode establishing company efforts that identified an exploitable gap under EO 14110 can settle the prediction positively. Rescission alone cannot establish that no such episode occurred.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Loophole is not defined.
  - The number of companies required is unspecified.
  - Finding a loophole and actually exploiting it are different acts.
retrospective_or_prospective: retrospective
