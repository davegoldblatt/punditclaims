assessment_axis: forecast_outcome
explicit_source_elements:
  - In 2029
  - AI will not be able to watch a movie
  - tell you accurately what is going on
  - Who are the characters?
  - What are their conflicts and motivations?
evaluator_interpretation:
  - Read this as a forecast about general movie comprehension, including events, characters, conflicts and inferred motivations.
  - A suitable test uses varied full movies and open-ended explanations, with controls against answering from memorized summaries. A hand-picked clip or isolated correct answer is insufficient.
  - Accuracy means ordinary competent comprehension, allowing reasonable differences in interpretation; it does not require perfect recall of every detail.
  - Use 2029-12-31 as the latest deadline. An earlier reproducible demonstration of the complete capability can refute the forecast under the early-resolution rule.
  - Assess this individual forecast independently of the surrounding wager about passing three challenges.
support_condition: Evidence covering the end of 2029 shows that leading available systems still cannot accurately explain full movies across a representative evaluation of events, characters, conflicts and motivations.
contradiction_condition: At least one AI system demonstrates accurate full-movie comprehension across varied movies under a credible evaluation that tests the stated narrative elements.
measurement_requirements: Provide the full audiovisual movie, allow ordinary subtitles, test both explicit events and narrative inference, and use independent human assessment with disclosed questions, outputs and error criteria.
source_requirements: Public primary evaluations with dated model versions and reproducible methods. Product claims or selected demonstrations alone are insufficient for early resolution.
metric_scope: null
original_horizon: In 2029
horizon_interval:
  start: 2022-05-31
  end: 2029-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as contradicted only upon a dated, independently assessed and reproducible demonstration satisfying the full movie-comprehension criterion across varied movies. Earlier failures cannot establish the negative forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No accuracy threshold, movie sample or evaluation protocol is specified.
  - "'A movie' leaves the required breadth of generalization implicit."
  - Treating an earlier durable capability as refuting 'In 2029' is an evaluator interpretation.
retrospective_or_prospective: prospective
