explicit_source_elements:
  - They fail to “understand” simple concepts
  - design to used with only one hand
  - Noncanonical situations continue to remain difficult
  - Attracted to does not of course mean that no other output is possible
evaluator_interpretation:
  - Read in context, this concerns contemporary image generators repeatedly failing to translate simple requirements into suitable designs. It does not say every output fails.
  - "Treat understanding operationally: whether generated designs satisfy the requested requirement. This cannot establish the presence or absence of an internal mental state."
  - Ordinary prompts may state the functional requirement without specifying the complete solution. Occasional success, especially with detailed instructions, is compatible with the claim.
  - The target is capability as of February 8, 2024. Earlier tests of the contemporary systems are eligible. No common starting date is supplied, so the lower date boundary is left unspecified rather than imposing a one-week window.
support_condition: Documented, reproducible tests of contemporary image generators show recurring failures to satisfy simple functional design requirements, including one-handed operation or closely comparable constraints, with ordinary prompts and disclosed outputs.
contradiction_condition: Comparable tests show that contemporary image generators reliably satisfy those requirements across ordinary prompt variations and repeated outputs. A selected successful image alone is insufficient.
measurement_requirements: Identify model versions, prompts, settings, sampling procedure and all evaluated outputs. Assess whether the depicted design plausibly satisfies the requirement; familiar controller shape alone does not prove two-handed operation. Distinguish ordinary prompts from instructions that supply the design solution.
source_requirements: Prefer original evaluations or reproducible demonstrations. Marcus's account is not independent outcome evidence. General image quality or composition benchmarks provide context unless they test the relevant functional constraints.
