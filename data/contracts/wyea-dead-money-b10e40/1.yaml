assessment_axis: historical_observation
explicit_source_elements:
  - In both of these cases
  - capital expenditures are barely paid off
  - in five years
  - don’t include a single dollar of operating expenses or associated debt
  - assuming that the client in question pays
evaluator_interpretation:
  - This assesses the economics of existing contracts under full payment, not a forecast that actual payments will occur over the next five calendar years.
  - Evaluate SharonAI and Catalyst Compute separately. Compare five-year gross contractual receipts with initial capital costs attributable to the contracted service.
  - The plain reading of 'barely' is a small remaining cushion before operating and financing costs, rather than a claim of exactly zero surplus.
  - Treat the post's hardware price and matching infrastructure allowance as estimates requiring verification.
  - Use July 1–September 29, 2026 as the current quarter before publication for the appraisal of the existing contracts; earlier budgets are context.
  - Excluding operating expenses and debt is a calculation convention, not a forecast antecedent.
support_condition: Comparable project-level budgets and contract schedules show only a small excess of five-year gross receipts over initial capex for each project, under full payment.
contradiction_condition: Comparable evidence shows a substantial excess for either project, or shows that its capex cannot be recovered even before operating and financing costs. Distinguish the two cases.
measurement_requirements: Full contractual receipts, hardware and related project capital costs, lease-versus-owned infrastructure treatment, and any storage or ancillary charges. Avoid counting leased operating costs again as initial capex.
source_requirements: Executed contracts and project-specific procurement or capital budgets. Generic server retail prices cannot establish total project capex.
