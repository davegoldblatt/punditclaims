ambiguity_flags:
  - "'Barely paid off' has no stated margin."
  - The capex is his own estimate (pod price, and an equal amount again for the facility). The real project capex may differ, especially if the GPUs sit in leased data center space.
  - The target period runs from the first contract signing (2026-04-01) to the post date. This is my choice so that disclosures about the contracts, including mid-2026 project budgets, count.
