assessment_axis: historical_observation
explicit_source_elements:
  - '"In both of these cases": the Sharon AI/ESDS contract (8,208 B300s at $3.30 an hour for five years, about $1.264 billion) and the Catalyst Compute/Canopy Wave contract (256 B300s, about $44.6 million)'
  - '"capital expenditures are barely paid off in five years"'
  - "\"only if you don't include a single dollar of operating expenses or associated debt\""
  - "his capex inputs: about $550,000 per 8-GPU B300 pod, with 'the capex' for the facility 'a comparable amount', giving about $1.1 billion and about $35 million"
evaluator_interpretation:
  - This is an appraisal of the two contracts as signed and disclosed before the post. The test compares each contract's full five-year value, assuming full payment, with the project's actual or company-disclosed capital cost. Disclosures from the contract signings onward count, including any mid-2026 project budget.
  - "'Barely paid off' is read as five-year contract revenue only modestly above capex: roughly up to a third more, as with his own figures of $1.264 billion vs $1.1 billion and $44.6 million vs $35 million. Revenue far above capex (for example, 1.5 times or more) would contradict it."
  - The second part ('only if you don't include ... opex or debt') is read as saying that once operating costs and financing costs are added, five-year receipts would not cover total cost. It is tested only if capex, opex, and debt cost data are available.
  - Capex counts only what the contract holder actually spends. If a provider rents space in an existing data center, facility costs are operating expenses, not capex.
support_condition: "Disclosed capital cost for each project sits close to its five-year contract value: the contract exceeds capex only modestly, and adding reasonable opex and financing costs would leave no surplus."
contradiction_condition: Disclosed capital cost for either or both projects sits well below the five-year contract value (for example, contract value 1.5 times capex or more), so capex is clearly more than 'barely' recovered before opex and debt.
measurement_requirements: Each project's five-year contract value and its disclosed or documented capital cost (GPU servers, networking, any owned facility build), plus where possible opex and debt cost.
source_requirements: SharonAI and KIDZ AI SEC filings and press releases; contract documents; credible reporting on project budgets.
