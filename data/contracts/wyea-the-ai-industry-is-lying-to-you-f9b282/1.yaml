assessment_axis: historical_observation
explicit_source_elements:
  - now
  - about 6 months
  - install and operationalize
  - a single quarter’s worth of sales
evaluator_interpretation:
  - "The plain reading is an aggregate deployment-rate comparison: operationalizing the quantity sold in one quarter requires approximately six months at the prevailing installation rate."
  - This does not necessarily mean that each shipment waits six months before installation.
  - The surrounding calculation concerns North America and US-attributed sales, although the sentence itself supplies no geographic limit.
  - For 'now', use NVIDIA's latest completed fiscal quarter before publication, October 27, 2025 through January 25, 2026. The 2025 construction figures are background inputs, not direct measurements of that quarter.
  - The financial scope records the Data Center revenue proxy used in the surrounding argument. Revenue alone cannot establish the physical deployment rate.
support_condition: Matched shipment and operational-deployment records show that approximately six months of contemporaneous North American installation throughput were needed to absorb one quarter's relevant NVIDIA GPU sales.
contradiction_condition: Comparable records establish a materially shorter or longer absorption time, with uncertainty small enough to exclude approximately six months.
measurement_requirements: Match geography, GPU models, shipment periods and operational status. Include deployments in existing facilities and distinguish IT load from total facility power. Any revenue-to-capacity conversion must account for networking, other equipment, prices and product mix.
source_requirements: NVIDIA shipment records and operator commissioning records, or a transparent independent dataset linking equivalent quantities. Leasing statistics and revenue totals alone are insufficient.
metric_scope:
  company: NVIDIA
  metric: Data Center revenue used as the surrounding argument's proxy for GPU sales
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: fiscal
  period_start: 2025-10-27
  period_end: 2026-01-25
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
