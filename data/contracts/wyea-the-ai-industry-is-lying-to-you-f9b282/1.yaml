  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Ongoing 'now' mapped to the latest completed fiscal quarter before the post.
  - North America, US customer headquarters and global sales are different geographic scopes.
  - Aggregate absorption time versus shipment-to-operation waiting time.
  - No tolerance specified for 'about'.
  - GPU sales are approximated through broader Data Center revenue.
