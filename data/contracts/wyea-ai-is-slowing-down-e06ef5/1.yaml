explicit_source_elements:
  - calamitously expensive
  - despite years of promises
  - for both those running AI services and its customers
  - costs have only ever increased
evaluator_interpretation:
  - The ordinary reading of getting cheaper includes the cost of buying a comparable amount of service.
  - "The word only makes the historical assertion categorical: a genuine comparable price reduction would defeat its customer unit-price component."
  - The historical period ends on publication. No starting date is supplied, so none is invented.
  - Total spending, prices per token and providers' production costs are separate measures.
  - No accounting basis is indicated. The supplied money rule therefore prevents a supported or contradicted score for the bundled financial claim.
support_condition: Comparable historical records would need to show that neither customer service costs nor provider operating costs ever declined within the claimed history, using consistently defined measures.
contradiction_condition: A documented reduction in the price of a comparable service would contradict the customer unit-price reading. A documented comparable provider cost reduction would contradict the provider component. Decisive financial scoring additionally requires a matching accounting basis.
measurement_requirements: Compare like-for-like services, token categories, quantities and quality. Keep customer unit prices, customer total bills, provider unit costs and provider total expenditure separate.
source_requirements: Dated provider price announcements and comparable historical operating-cost records; independent price series can corroborate.
