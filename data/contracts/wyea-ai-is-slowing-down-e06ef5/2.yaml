assessment_axis: historical_observation
explicit_source_elements:
  - AI is calamitously expensive
  - despite years of promises of it getting cheaper
  - for both those running AI services and its customers
  - costs have only ever increased
evaluator_interpretation:
  - "'Calamitously expensive' is a judgment and is not scored."
  - "The checkable part is the absolute statement that costs 'have only ever increased', set against promises of AI 'getting cheaper'. Plain reading for customers: the price paid for comparable AI use (per token for the same or equivalent model, or per task) never fell. A documented price cut for the same model or capability tier contradicts 'only ever increased'."
  - "'Years of promises' points to roughly the period since ChatGPT's launch. I use 2023-01-01 to the post date."
  - Total spending, as opposed to unit price, is a possible alternative reading. It is noted in the flags.
support_condition: Evidence that, from 2023 to the post date, the prices customers paid for comparable AI use and providers' unit costs only rose, with no meaningful cuts.
contradiction_condition: A dated, documented decrease in price for the same or comparable model or task within the period.
measurement_requirements: Published per-token prices before and after a change for the same model or tier, or measured per-task costs over time.
source_requirements: Company announcements or pricing pages, benchmark or research reports, reputable reporting.
metric_scope: null
original_horizon: null
horizon_interval: null
