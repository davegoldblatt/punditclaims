evaluator_interpretation:
  - The ordinary reading is a widespread equity-market decline extending beyond Anthropic, not a claim that every security declined.
  - The context spans the November 19 US trading session and overnight Asian trading on November 20 before publication.
  - Broad index declines and a large majority of constituent stocks falling provide a practical test of market breadth.
  - The sentence does not itself commit to a numerical crash threshold or a causal explanation.
support_condition: Broad equity-market evidence shows selling across many companies and sectors, extending beyond Anthropic and a few AI names.
contradiction_condition: Broad indices and market breadth show generally stable or rising equities, with losses substantially confined to Anthropic or a narrow group.
measurement_requirements: Broad stock-index returns and constituent breadth for the latest completed US session, supplemented where available by the Asian session discussed in the post.
source_requirements: Prefer index-provider or exchange statistics; reputable contemporaneous reporting of breadth is acceptable when the underlying records cannot be retrieved.
