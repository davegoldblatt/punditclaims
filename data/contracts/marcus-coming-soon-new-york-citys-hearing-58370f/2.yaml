explicit_source_elements:
  - But the US Senate did nothing.
  - in May 2023 at the US Senate
  - an FDA-like regulatory regime for AI
  - AI developers bring their software to independent review
  - not have market access otherwise
  - demand independent regulatory review
evaluator_interpretation:
  - In context, the ordinary reading is that the Senate failed to approve a requirement for independent regulatory review of AI before market access.
  - The institutional threshold is passage by the Senate, including passage of a relevant amendment or larger bill. Subsequent enactment is not necessary to contradict a claim about the Senate's failure to act.
  - An individual senator's proposal, introduction, referral, hearing or unsuccessful passage request does not establish that the chamber approved the requirement.
  - The relevant review concerns new general-purpose AI products, including advanced models. Voluntary evaluations and rules confined to government procurement do not establish the market-access regime described.
  - The observation runs from the referenced May 2023 testimony through publication on October 5, 2026. The source specifies the starting month but not its day.
support_condition: Legislative records covering the target period establish that the Senate had not passed a measure requiring independent regulatory review of new general-purpose AI before market access.
contradiction_condition: A dated Senate record establishes passage during the target period of a measure requiring such independent review before market access. A member's introduction or proposal alone is insufficient.
measurement_requirements: Check the operative requirements and Senate disposition of relevant standalone bills, amendments and provisions in larger legislation. Distinguish mandatory review from voluntary testing and passage from preliminary proceedings.
source_requirements: Prefer official legislative texts and action histories. Contemporary reporting may corroborate legislative status, but unsuccessful action on selected bills cannot alone establish the absence of all qualifying Senate action.
