explicit_source_elements:
  - even as Altman was telling Congress
  - he supported AI regulation
  - his company was lobbying the EU
  - to water down its AI act
evaluator_interpretation:
  - Read 'even as' as the same May 2023 regulatory episode surrounding the congressional testimony, rather than requiring lobbying on the exact hearing date.
  - Watering down means seeking to reduce proposed legal obligations or exclude OpenAI's models from stricter requirements. It does not require opposition to every regulation.
  - The claim concerns public positions and lobbying, not whether Altman sincerely believed his testimony.
support_condition: Records show Altman publicly supporting regulation in Congress and OpenAI advocating reduced EU AI Act obligations during the same May 2023 episode.
contradiction_condition: Records establish that Altman did not support regulation in that testimony, or that the attributed EU advocacy did not seek reduced obligations.
measurement_requirements: Compare the content and dates of testimony, lobbying records, and contemporary accounts of meetings.
source_requirements: Use primary testimony and lobbying documents where accessible; contemporary reporting can establish meetings and positions.
