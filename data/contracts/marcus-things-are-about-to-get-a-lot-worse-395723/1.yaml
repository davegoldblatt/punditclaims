assessment_axis: forecast_outcome
explicit_source_elements:
  - Unless and until
  - invent a new architecture
  - reliably track provenance
  - generative text and/or generative images
  - infringement
  - often not at the request of the user
  - will continue
evaluator_interpretation:
  - The forecast begins on 2023-12-29 and has no stated deadline.
  - Provenance means tracing generated material to underlying sources, rather than identifying the generating model.
  - The antecedent is the continued absence of an invented architecture meeting that capability. The wording says invention, not merely commercial deployment.
  - “Often” requires evidence of a recurring unintended-output problem; one deliberately elicited example cannot establish its frequency.
  - Copyright infringement requires a legal basis. Recognizable character generation alone is evidence of risk, not an automatic legal finding.
support_condition: While the absence of a qualifying provenance architecture is established, dated evidence shows continuing infringement and recurring outputs that users did not request to copy.
contradiction_condition: While that antecedent remains established, compelling evidence shows infringement has been eliminated across the relevant systems without such an architecture.
measurement_requirements: Record prompts, outputs, dates, applicable copyright grounds, and whether copying was requested. Separately assess the existence and reliability of provenance architectures.
source_requirements: Independent reproducible output studies, court records, and technical evaluations of provenance methods available by 2026-10-28.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A dated post-publication record can establish continuation if it demonstrates legally grounded infringement, recurring unintended copying, and the antecedent at that time. A conclusive elimination result without a qualifying architecture could contradict the dependency. Isolated demonstrations, allegations, or successful filters do not settle the whole claim.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No reliability standard for provenance.
  - No frequency threshold for “often”.
  - Invention and deployment are different possible readings of the condition.
  - No jurisdiction specified for infringement.
retrospective_or_prospective: retrospective
