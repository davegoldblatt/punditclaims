support_condition: A documented example shows that a model can produce a human-like explanation through processing that the explanation does not faithfully describe. This establishes that language alone is insufficient to identify the underlying process.
contradiction_condition: Evidence establishes that the linguistic resemblance described necessarily entails the relevant human-like internal properties, without additional evidence about mechanisms.
measurement_requirements: Compare generated language with independently investigated internal processing. Distinguish an invalid inference from a finding that models lack consciousness.
