contradiction_condition: After the specific patch is verified, direct evidence refutes a necessary part of the claimed sequence or the universal explanation about superficial patches. Mere passage of time without a known discovery is insufficient.
measurement_requirements: Identify the exact original prompt, a before-and-after retest or specific patch record, dates of later distinct discoveries, and evidence about what the patch changed.
