explicit_source_elements:
  - we’re at the end of hypergrowth
  - the decades-long massive returns of venture capital
  - increasingly looking like hundreds of billions of misallocated capital
evaluator_interpretation:
  - The first two components assert a broad turning point, but specify neither the population experiencing hypergrowth nor the return measure.
  - The capital-allocation component is expressly hedged as increasingly looking like misallocation.
  - Investment spending, valuation declines, accounting impairments, and investment returns are different measures and cannot substitute for one another.
  - No particular company's financial metric or accounting basis is identified.
support_condition: No single faithful test settles the compound statement. A narrower test would require a defined sector, growth threshold, return benchmark and horizon, and a stated method for identifying misallocated investment.
contradiction_condition: A strong quarter or successful investment does not alone refute an asserted structural turning point; weak returns do not alone prove one. Contradiction requires the same missing definitions as support.
measurement_requirements: Define hypergrowth, gross versus net and realized versus valuation-based venture returns, the investment population, the period, and the economic criterion for misallocation.
source_requirements: Consistent sector growth series, venture-fund performance records, and project-level investment and cash-flow evidence.
