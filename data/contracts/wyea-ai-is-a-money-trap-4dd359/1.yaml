evaluator_interpretation:
  - The surrounding discussion concerns generative AI product startups during the roughly three years before publication.
  - An exit includes acquisition of an operating product business. A talent hire or model-licensing agreement alone does not qualify.
  - An IPO means a completed initial public offering; plans and filings alone do not qualify.
  - The broader post acknowledges acquisitions, including Leonardo.ai and Cognigy. Assess the categorical sentence with that inconsistency disclosed, and check for an additional product-business acquisition.
  - The statement asserts both zero exits and zero IPOs. A documented acquisition falsifies the combined zero-event assertion without establishing that an IPO occurred.
support_condition: Reliable, sufficiently comprehensive records establish no qualifying completed acquisition and no qualifying completed IPO during the target period.
contradiction_condition: A qualifying completed acquisition or IPO occurred during the target period. An acquisition outside the post's acknowledged examples provides the clearest test.
measurement_requirements: Establish the acquired business's generative AI product and distinguish a business acquisition from licensing or hiring arrangements.
source_requirements: Prefer buyer or seller disclosures and transaction filings. Use credible reporting where the primary page cannot be read.
