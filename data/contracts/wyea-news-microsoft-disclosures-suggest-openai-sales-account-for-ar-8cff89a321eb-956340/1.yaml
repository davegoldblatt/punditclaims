  - 70% or more
  - Microsoft's FY26 AI revenues
  - more than 7%
  - Microsoft's overall FY2026 revenues
evaluator_interpretation:
  - Assess the percentages implied by the cited disclosures and Bloomberg's analysis, rather than treating the estimated AI revenue denominator as an audited figure.
  - Microsoft FY2026 means July 1, 2025 through June 30, 2026.
  - Use revenue recognized from commercial arrangements with OpenAI, including revenue sharing. Do not substitute accounts receivable, investment gains, bookings, or annualized revenue.
  - The contract's estimate basis describes the combined calculation. The total-revenue denominator is company reported; the AI-revenue denominator is estimated.
support_condition: The cited analysis, using comparable FY2026 realized revenue amounts, implies an OpenAI share of at least 70% of AI revenue and more than 7% of total revenue.
contradiction_condition: Comparable figures in the cited disclosures and analysis imply less than 70% of AI revenue or no more than 7% of total revenue.
measurement_requirements: Divide FY2026 revenue from OpenAI, including revenue sharing, by estimated FY2026 AI revenue and reported FY2026 total revenue. Annualized run rates must first be converted into an explicitly estimated fiscal-year revenue amount.
source_requirements: Microsoft disclosures and the underlying Bloomberg analysis or an accessible authorized republication.
