assessment_axis: causal_assessment
explicit_source_elements:
  - AI is not the reason that these companies are growing
  - outside of the compute spend from Anthropic and OpenAI
  - AI is not “boosting other product categories”
evaluator_interpretation:
  - The companies are Google, Microsoft and Amazon.
  - The plain reading denies a material contribution from AI beyond the two labs' compute purchases. It does not merely say AI contributes less than other businesses.
  - Use April–June 2026, the latest completed quarterly reporting period before publication.
  - Sales of AI products to other customers count even when those products incorporate models supplied by the two labs.
  - This is a qualitative causal claim, not a claim about a specified revenue amount.
support_condition: Reliable evidence attributes the companies' growth to other businesses and the excluded compute purchases, while showing no material additional contribution from AI.
contradiction_condition: Product-specific evidence shows AI contributing materially to growth beyond the excluded compute purchases at one or more named companies.
measurement_requirements: Identify the product, its customers and its contribution to growth. Overall corporate revenue growth or AI adoption alone is insufficient.
source_requirements: Prefer company earnings disclosures with specific product attribution. Distinguish management attribution from independently established causation.
