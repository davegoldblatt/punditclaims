  - $50 billion to $100 billion in GPUs
  - barely gotten $50 billion worth installed
  - in the last four years
evaluator_interpretation:
  - "The claim has two components: the current uninstalled GPU stock and the acquisition cost of GPUs installed during the preceding four years."
  - For the current stock, use June 30, 2026, the latest completed reporting period before publication.
  - Read 'the last four years' as September 23, 2022 through September 22, 2026.
  - Read 'barely $50 billion' as approximately $50 billion, without imposing an exact tolerance.
  - The metric_scope describes the primary inventory component. The installation component is a separate realized acquisition-cost flow over the four-year interval.
support_condition: Comparable records establish both $50–100 billion of uninstalled GPUs at June 30, 2026 and approximately $50 billion of GPU installations during the stated four-year interval.
contradiction_condition: Comparable records establish an inventory value outside $50–100 billion or a four-year installation value materially incompatible with approximately $50 billion. If one component is supported and the other contradicted, the combined outcome is mixed.
measurement_requirements: Separate GPU inventory and installation reconciliations at acquisition cost. Installed capacity, current fleet value and cumulative installation spending must not be substituted for one another.
source_requirements: Microsoft records or independently documented estimates linking hardware quantities, actual costs and installation dates.
