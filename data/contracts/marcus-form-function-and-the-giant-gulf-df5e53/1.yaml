evaluator_interpretation:
  - The ordinary reading is that contemporary Stable Diffusion repeatedly mishandles negation in ordinary text prompts. It does not assert that every negated prompt fails.
  - The example concerns negation within the main prompt, rather than a separate negative-prompt control.
  - The post describes ongoing September 2022 behavior without a reporting period. I use September through the publication date as the observation window.
  - Later experiments are context unless their records establish behavior within that observation window.
support_condition: Independent records establish recurring failures by contemporary Stable Diffusion to obey ordinary negated prompts during the target period, including comparable object-exclusion requests.
contradiction_condition: Representative independent tests during the target period establish reliable compliance with ordinary negated prompts, including the bicycle example and comparable exclusions.
measurement_requirements: Identify the model, prompts, generation settings, sample size, and outputs. Distinguish repeated failures from isolated examples and ordinary negation from separate negative-prompt controls.
source_requirements: Independent experimental records, documented demonstrations, or primary evaluations. Marcus's own examples cannot independently establish the outcome.
