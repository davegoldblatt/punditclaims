evaluator_interpretation:
  - "Read 'the same play' in its immediate financing context: Nvidia appeared to be seeking government financial backing using national-competition arguments."
  - The hedge expresses uncertainty about intent; the checkable component is evidence of public pursuit of comparable backing.
  - China-competition rhetoric alone does not establish a request for taxpayer-backed borrowing.
  - The target is the contemporaneous conduct referenced by 'this just in' on November 5.
support_condition: A contemporaneous Nvidia statement or proposal seeks government financial backing comparable to the proposed OpenAI backstop and connects it to strategic competition.
contradiction_condition: Direct contemporaneous records establish that the alleged request concerned something materially different and expressly excluded comparable financial backing.
measurement_requirements: Distinguish financial guarantees or subsidies from export permissions, regulatory relief, and general support for energy production.
source_requirements: Nvidia statements, government submissions, a complete interview, or reliable reporting of an explicit request.
