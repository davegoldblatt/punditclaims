explicit_source_elements:
  - court testimony this week
  - some reasonably high level employees working on driverless cars
  - apparently unaware of human factors engineering
  - an absolute necessity if humans are in the loop
evaluator_interpretation:
  - "Plain reading: deposition testimony made public around mid-January 2023 shows at least one fairly senior Tesla Autopilot employee who seemed unfamiliar with basic human-factors ideas, such as perception-reaction time, driver takeover, and whether the team had human-factors engineers."
  - The Elluswamy deposition in Huang v. Tesla counts. It was the testimony Hikmet's tweets were circulating that week, and Marcus's 'some employees' is not limited to the Shroff deposition named in the embedded tweet.
  - The aside that human factors is 'an absolute necessity' is an expert judgment and is not scored.
support_condition: Testimony from a senior Autopilot employee shows he did not know or could not explain core human-factors concepts, or whether the team had human-factors engineers.
contradiction_condition: The testimony shows the employees understood human-factors engineering, or the senior employees named were not unfamiliar with it.
