evaluator_interpretation:
  - The comparison runs from the March 2024 discussion to the post on August 4, 2025.
  - The plain reading is a substantial increase in unreliable scientific material attributable to generative AI.
  - Fabricated references count as degradation of scientific literature. Increased AI-assisted writing alone does not.
  - Marcus gives no numerical threshold for 'much worse'; I require a clear, substantial increase rather than isolated additional incidents.
support_condition: Comparable measurements or sufficiently broad audits show a substantial increase in AI-caused errors or unreliable scientific material during the comparison period.
contradiction_condition: Comparable, sufficiently broad measurements show that AI-caused scientific errors or unreliable material stayed approximately stable or declined during that period.
measurement_requirements: Separate AI attribution from ordinary fraud, detection changes and publication growth. Distinguish reference errors from incorrect scientific conclusions.
source_requirements: Prefer original audits and studies. Reports about paper mills must establish their connection to generative AI before counting as decisive evidence.
