assessment_axis: historical_observation
explicit_source_elements:
  - no real sign
  - outside of Anthropic and OpenAI’s compute spend
  - any real explosion in AI revenue
evaluator_interpretation:
  - The plain reading is that there was no clear evidence of very rapid AI revenue growth beyond the two laboratories’ compute purchases. It does not require proof that AI investments were profitable.
  - The surrounding discussion concerns hyperscalers. Revenue from their own AI products is within scope.
  - Use January–March 2026, the latest completed reporting quarter publicly reportable before the post. Growth comparisons may use the corresponding earlier quarter.
  - Use company-reported revenue measures, consistent with the surrounding discussion of company disclosures. Do not treat backlog, subscriptions, or annualized run rates as realized revenue.
  - A clear example within the stated industry can contradict the absence-of-signs claim; an industry-wide revenue total is not required.
support_condition: Broad, comparable disclosures show little AI revenue growth outside the excluded compute purchases, with no material contrary example.
contradiction_condition: A credible disclosure available before publication shows very rapid realized AI-product revenue growth outside the excluded compute purchases.
measurement_requirements: Identify the product, reporting period, revenue measure, comparison period, and relationship to the excluded purchases. Keep growth rates separate from absolute revenue and investment returns.
source_requirements: Prefer contemporaneous company disclosures. A company statement can establish a public sign of growth without establishing audited industry-wide revenue.
