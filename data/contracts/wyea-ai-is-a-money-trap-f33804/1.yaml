assessment_axis: historical_observation
explicit_source_elements:
  - the systemic risk is building
  - complexity of these arrangements
  - full economic fallout if the cycle breaks down
  - Context identifies private credit financing of AI infrastructure.
evaluator_interpretation:
  - Read systemic risk as increasing vulnerability to losses spreading beyond individual AI projects through lenders, funds, banks or other financial institutions.
  - Read ‘building’ as an existing upward trend, not a prediction that a crash must occur.
  - Use Q2 2025, the latest completed quarter before publication, as the observation period; earlier evidence supplies a baseline.
  - Higher lending volume alone does not establish higher systemic vulnerability. Leverage, concentration, connections and loss-absorbing protections must also be considered.
  - ‘If the cycle breaks down’ describes a possible stress scenario rather than an antecedent required for the current-risk assertion.
support_condition: Evidence for Q2 2025 shows growing private-credit exposure to AI infrastructure together with increasing leverage, concentration or transmission channels that raise vulnerability beyond individual projects.
contradiction_condition: Comparable evidence shows the relevant systemic vulnerability was stable or declining, including the effects of collateral, equity buffers, funding structure and diversification.
measurement_requirements: AI-infrastructure-specific exposure and trend data, financing terms, lender and investor connections, and evidence on potential loss transmission. Distinguish private credit from private equity and bank project lending.
source_requirements: Regulatory analysis, lender or borrower disclosures, and transparent exposure research describing conditions before the post. Later developments cannot establish the earlier trend by themselves.
