explicit_source_elements:
  - Apple has only used licensed content to train its models
  - that clearly isn’t the case
evaluator_interpretation:
  - Assess the factual assertion about the training of the Apple Intelligence models discussed in the post.
  - Licensed includes applicable open licenses as well as individually negotiated licenses.
  - Public accessibility and collection by a crawler do not, by themselves, establish whether content was licensed.
  - The conditional speculation about particular websites and the moral characterization of pillaging are not separate factual commitments in the normalized claim.
  - The target is training completed by the post date; no training start date is supplied.
support_condition: A reliable disclosure or documented training record establishes inclusion of content used without an applicable license.
contradiction_condition: A sufficiently complete training-data and rights record establishes that all relevant training content was licensed.
measurement_requirements: Distinguish the method of obtaining content from its licensing status. Identify the relevant models and training data.
source_requirements: Apple disclosures, training-data records, licensing records, or established findings about the relevant corpus. Allegations alone do not establish inclusion or licensing status.
