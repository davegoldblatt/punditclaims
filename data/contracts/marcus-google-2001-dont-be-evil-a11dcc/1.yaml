ambiguity_flags:
  - Zillions supplies no numerical threshold.
  - Making money could mean revenue or profit; the investment-recovery context favors returns after costs.
  - Presumably explicitly hedges the baseline premise.
  - Cannot continue indefinitely specifies neither a deadline nor the form of adjustment.
  - Accounting basis, currency, and units are unspecified.
