evaluator_interpretation:
  - The ordinary reading concerns comparative US and Chinese generative-AI capabilities, rather than investment, revenue, or military power.
  - The continuation-of-trends proviso governs this forecast. It includes continued similarity in development approaches and reciprocal capability catch-up.
  - Minimal means a small practical capability advantage; short-lasting means an advantage competitors soon match. Marcus supplies neither a numerical threshold nor a duration.
  - The condition must be assessed independently of the predicted result. A capability gap alone cannot establish that the underlying development trends stopped.
  - No deadline or arbitrary number of months is added.
support_condition: While the stated development trends continue, successive independent evaluations show small practical capability gaps and prompt reciprocal catch-up. Such observations support the forecast over the observed period but cannot conclusively establish its unlimited future scope.
contradiction_condition: Independent evaluations establish a substantial, sustained national capability advantage while separate evidence establishes that the development trends covered by the proviso continued.
measurement_requirements: Repeated, dated comparisons across practical tasks and multiple independent evaluations, with comparable model access and testing conditions. Establish development-method and data trends separately. A percentage difference in leaderboard ratings is not automatically the same percentage difference in capability.
source_requirements: Independent benchmark histories and research on development approaches. Company technical reports may establish methods, but promotional comparisons alone cannot establish a national advantage.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A clearly substantial and sustained national capability lead can conclusively contradict the forecast only if continuation of the specified underlying trends is independently established. A single leaderboard snapshot cannot do so; finite convergence cannot establish the unrestricted future claim.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The relevant current trends and the degree of continuity required are not fully specified.
  - Minimal and short-lasting have no numerical thresholds.
  - National capability and model attribution are not defined.
  - No forecast deadline is stated.
