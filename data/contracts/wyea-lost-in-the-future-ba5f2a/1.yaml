assessment_axis: causal_assessment
explicit_source_elements:
  - Sam Altman is a liar
  - fired from two companies, including OpenAI
  - because he's a billionaire with a buzzy company
  - he's left unscathed
evaluator_interpretation:
  - Assess the career events and consequences through the post date, allowing later reporting available by the evaluation date to illuminate those earlier events.
  - The likely second organization is Y Combinator. The claim itself does not name it.
  - In ordinary usage, 'fired' can include being compelled to leave a leadership position, even without a formal employment termination.
  - "'Left unscathed' means escaping substantial lasting professional or reputational consequences, rather than experiencing literally no criticism."
  - The causal claim requires evidence that wealth and company prominence produced this insulation; reinstatement alone does not identify its cause.
support_condition: Reliable records establish deliberate dishonesty, two involuntary leadership removals, limited lasting consequences through the post date, and evidence connecting that insulation specifically to wealth and company prominence.
contradiction_condition: Reliable records rule out the alleged removals or dishonesty, establish substantial lasting consequences inconsistent with the ordinary reading, or refute the proposed causal explanation.
measurement_requirements: Separate removal, resignation, reinstatement and subsequent consequences. Distinguish evidence of influence from evidence identifying why decision-makers acted.
source_requirements: Board records, firsthand accounts and corroborated investigative reporting. Treat competing accounts and interested-party denials explicitly.
