assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA’s future growth
  - entirely dependent
  - large companies both want to and are able to spend hundreds of billions of dollars
  - their intent to do so is largely based on
  - Anthropic and OpenAI
  - more than $400 billion on compute
  - in the next few years
evaluator_interpretation:
  - Read growth as growth in NVIDIA's business revenue, rather than its share price.
  - "The claim asserts a causal dependence: major-company spending is necessary for NVIDIA's growth, and expectations about the two labs are the principal driver of that spending."
  - Treat $400 billion as combined compute spending by Anthropic and OpenAI.
  - This is not a standalone forecast that the two labs will actually spend that amount.
  - The passage gives no accounting basis for the spending figure. Do not substitute contract face values, financing raised or annualized revenue for realized compute spending.
  - Do not turn 'the next few years' into a specific end date for this causal assessment.
support_condition: Evidence establishes both that NVIDIA's prospective growth requires the stated major-company spending and that expectations of combined lab compute spending above $400 billion principally drive those buyers' plans.
contradiction_condition: Evidence establishes a material independent path to NVIDIA growth without the stated spending, or shows that the buyers' principal spending drivers do not depend on the two labs meeting the stated threshold.
measurement_requirements: Trace ultimate demand through intermediaries, distinguish necessary from important customers, and separate spending commitments from actual payments and financial capacity.
source_requirements: Customer-level revenue attribution, buyer investment decisions, contract payment schedules and financing disclosures. Customer concentration alone cannot establish exclusive causal dependence.
metric_scope:
  company: Anthropic and OpenAI (combined)
  metric: Compute spending underlying the asserted dependence
  currency: USD
  units: billions
