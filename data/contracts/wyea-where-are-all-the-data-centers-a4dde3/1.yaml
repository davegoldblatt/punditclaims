assessment_axis: historical_observation
explicit_source_elements:
  - any more than 500MW of capacity
  - in the last year
  - based on my research
  - think Microsoft is deliberately obfuscating
  - contracted rather than actively in-use
evaluator_interpretation:
  - The externally checkable implication is that Microsoft added no more than 500MW of operational data-center capacity during the year ending on the post date.
  - Count capacity actually placed into service worldwide, including leased facilities. Do not substitute contracted power, planned campus capacity, or instantaneous electricity consumption.
  - His inability to reconstruct the total is a statement about his research, not itself proof of a 500MW ceiling.
  - The suspicion of deliberate concealment requires separate evidence of intent. Ambiguous disclosure alone cannot establish it.
support_condition: A sufficiently complete, consistently measured record establishes additions of no more than 500MW during the specified year. Supporting the deliberate-obfuscation allegation also requires evidence that Microsoft knowingly concealed or misrepresented the distinction between contracted and operational capacity.
contradiction_condition: Dated commissioning and operational records establish more than 500MW of Microsoft capacity entering service during the specified year. That would contradict the implied ceiling, without necessarily resolving the separate allegation about intent.
measurement_requirements: Worldwide additions between 2025-05-12 and 2026-05-12, with commissioning dates, consistent facility-power or IT-power definitions, and no double counting between Microsoft and its suppliers.
source_requirements: Defined operational-capacity disclosures, commissioning records, utility records, or independently verified facility measurements. A repetition of the disputed capacity announcement is insufficient by itself.
