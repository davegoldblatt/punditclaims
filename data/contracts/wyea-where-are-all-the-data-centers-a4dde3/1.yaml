ambiguity_flags:
  - A statement about the limits of personal research is not an unqualified numerical ceiling.
  - Operational capacity, actively utilized capacity, and contracted power are different measures.
  - Facility power versus IT power is unspecified.
  - Deliberate intent is alleged tentatively and requires separate evidence.
