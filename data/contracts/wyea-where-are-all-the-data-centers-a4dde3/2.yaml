  - any more than 500MW
  - in the last year
  - based on my research
  - think Microsoft is deliberately obfuscating
  - contracted rather than actively in-use
evaluator_interpretation:
  - The first clause reports an inability to account for capacity from his research. It does not impose a firm 500MW ceiling on Microsoft's actual additions.
  - The second clause explicitly expresses his suspicion about Microsoft's intent. It does not make an unqualified finding of deliberate deception.
  - The last year refers approximately to May 12, 2025 through May 12, 2026. This identifies the subject of his research, not a numerical outcome to score.
support_condition: Independent contemporaneous records could substantiate his reported inability to reconcile the capacity additions and his expressed suspicion. Capacity totals alone cannot establish either personal state.
contradiction_condition: Independent contemporaneous records could show that he had already reconciled more than 500MW through his research or did not hold the stated suspicion. Evidence of larger actual additions alone would not contradict the qualified wording.
measurement_requirements: A verifiable research record and communications bearing on the reported understanding. Contracted and active capacity must remain distinct.
source_requirements: Independent evidence of his research and understanding. Evidence of Microsoft's intent would bear on the suspicion's merits but would not turn the sentence into a firm allegation.
