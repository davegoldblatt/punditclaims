explicit_source_elements:
  - putting LLMs into production is hard
  - most work to date has been preliminary
evaluator_interpretation:
  - "'To date' and the birthday context describe cumulative deployment work during GPT-4's first year, ending at publication."
  - The plain reading of 'hard' is recurring material engineering or organizational barriers to dependable production use.
  - "'Most' means more than half of LLM deployment efforts; 'preliminary' means experiments, proofs of concept or pilots."
  - The share of companies with any production deployment is not the share of projects in production.
support_condition: Engineering evidence documents recurring production barriers, and reasonably representative evidence shows more than half of LLM deployment efforts remained preliminary.
contradiction_condition: Representative project-level evidence shows that most LLM deployment efforts had reached routine production, or credible broad evidence shows that production deployment generally lacked material barriers.
measurement_requirements: Separate LLMs from all AI, projects from companies, and pilots from routine production. Establish survey field dates and sampling limitations.
source_requirements: Prefer original adoption surveys with methods and engineering studies. Secondary reporting may describe inaccessible surveys but must be identified.
