assessment_axis: historical_observation
explicit_source_elements:
  - go from sentences to meaning
  - go from intents (meanings) to sentences
  - no existing machine does
evaluator_interpretation:
  - The assessed proposition is the machine claim, not the accompanying generalization about children.
  - In context, acquiring language means reliable, general interpretation and expression of meaning comparable in breadth to ordinary human language use.
  - A restricted mapping between text and an engineered semantic representation is relevant evidence, but does not alone establish the general competence described.
  - Existing means existing on July 20, 2022. With no regular reporting cycle, I use current-year evaluations through that date.
support_condition: Evidence sufficiently broad to establish that contemporary machines did not reliably achieve both general interpretation of sentences and expression of intended meanings.
contradiction_condition: At least one contemporary machine reliably demonstrates both abilities across varied, unfamiliar ordinary-language situations.
measurement_requirements: Evaluate both directions, semantic fidelity, and generalization. Do not equate a formal representation benchmark with all human meaning, or treat absence of a demonstration as proof of incapacity.
source_requirements: Primary evaluations or reproducible demonstrations of systems existing by the post date.
