explicit_source_elements:
  - Demand for data centers
  - by extension
  - only as large as these subsidies can sustain
evaluator_interpretation:
  - The surrounding paragraphs concern commercial AI data-center demand arising from model providers and their customers, rather than all conventional computing workloads.
  - These subsidies refers to venture financing and hyperscaler support discussed in the surrounding text.
  - The plain causal reading is that this commercial AI demand cannot be sustained independently of those subsidies. No particular numerical relationship between funding and capacity is supplied.
  - Assess the ongoing state over January through March 2026, the latest completed quarter before the post.
  - Public research infrastructure is relevant to the ambiguity in scope, but does not automatically settle the narrower commercial claim.
support_condition: Customer and operator records establish that the commercial AI demand described depends on continuing venture or hyperscaler subsidies, with no material independently financed demand capable of continuing without them.
contradiction_condition: Records establish material commercial AI data-center demand paid from independently sustainable customer resources, with the relevant model and infrastructure costs covered without the specified subsidies.
measurement_requirements: Actual capacity purchases or use, customer funding sources, payments, full service costs, and evidence of how demand would change if the specified support ended.
source_requirements: Prefer operator contracts and accounts, customer financial records, and documented financing withdrawals. Capacity forecasts, construction announcements, and total company revenue alone are insufficient.
