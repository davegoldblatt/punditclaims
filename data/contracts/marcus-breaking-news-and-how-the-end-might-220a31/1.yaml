  - The latest models
  - though not 5 specifically
  - are costly to run
  - cost is a growing issue
evaluator_interpretation:
  - Read as about OpenAI's latest models, given the paragraph's subject.
  - He names no measure and no period. As the most recent period public evidence could cover before the 2026-06-10 post, I use full-year 2025 (as reported in early 2026) through the post date.
  - "Plain reading: serving OpenAI's newest models is expensive, and inference cost is becoming a bigger burden, for example rising inference spending or margin pressure."
  - OpenAI's inference costs are known only through press reports of internal documents, so the implied accounting basis is press estimates.
support_condition: Reports that OpenAI's inference (running) costs rose sharply or pressured its margins in 2025–mid-2026, or that recent flagship models cost more to serve or use.
contradiction_condition: Reports that OpenAI's inference costs fell or stayed flat relative to revenue, with margins improving and recent models cheaper to serve, in the period.
measurement_requirements: OpenAI inference spending and gross margin trends; serving cost or price of recent models.
source_requirements: Reputable reports of OpenAI financials (e.g., The Information via secondary outlets), usage-based cost measurements.
