explicit_source_elements:
  - we’re in the midst
  - thousands of companies
  - have integrated generative AI
  - prices that are far from stable
  - even further from profitable
evaluator_interpretation:
  - I assess the factual description underlying the crisis metaphor.
  - Thousands means at least 2,000 companies with business integrations.
  - The surrounding discussion makes profitability refer to the model providers' prices, rather than the customers' profitability.
  - The ordinary reading requires materially changing or unsustainable prices and losses attributable to supplying the integrated services. Company-wide losses alone do not establish this.
  - For this ongoing observation, I use April through June 2024, the latest completed calendar quarter before publication.
support_condition: Evidence identifies thousands of business integrations and establishes that their relevant provider prices were materially unstable and loss-making during the target period.
contradiction_condition: Representative evidence establishes that the claimed population was below thousands, or that the relevant prices were stable and profitable on a clearly specified, comparable cost basis.
measurement_requirements: Integration counts, comparable API price histories, and revenue and attributable costs for those services. Distinguish service margins from company-wide losses.
source_requirements: Provider adoption disclosures and pricing records, plus financial records or transparent estimates linking prices to service costs.
