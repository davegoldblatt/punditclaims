assessment_axis: causal_assessment
explicit_source_elements:
  - The GenAI boom
  - hasn’t been sustained by profits
  - has been sustained by hope and circular financing
evaluator_interpretation:
  - The plain reading is that expansion of the generative-AI industry materially depended on expectations-driven external capital and supplier-linked financing, rather than sufficient profits generated by GenAI activity.
  - Hope is read as expectations of future returns, not an independently measurable psychological state.
  - This is a sector-wide causal claim, not an assertion that every participant is unprofitable or that every external investment is circular.
  - The claim concerns expansion through July 27, 2026. Its starting date is unspecified and is left open.
  - No particular company's financial metric or accounting basis is asserted, so the contract's metric_scope is null. Company-specific evidence remains context unless a sector-wide causal connection is established.
support_condition: Evidence covering the sector's major funding flows and generated profits shows that expectations-driven capital and circular arrangements were material to sustaining expansion that GenAI profits could not finance.
contradiction_condition: Comparable sector-wide evidence shows that internally generated GenAI profits principally sustained expansion and that circular financing was not a material source of support.
measurement_requirements: Trace financing into actual expansion, distinguish commitments from cash transfers, avoid double-counting linked transactions, and keep net income, operating income, cash flow and financing proceeds separate.
source_requirements: Company financial statements and financing agreements, supplemented by independent sector analysis that addresses the comparative causal claim.
