evaluator_interpretation:
  - The companies are Anthropic and OpenAI. The claim concerns each company's subscription business overall, not merely its heaviest users or an individual premium plan.
  - The ordinary reading is that subscription revenue falls substantially below attributable costs. No numerical loss threshold or accounting basis is supplied.
  - Use October–December 2025, the latest completed calendar quarter before the post that public reporting could describe. This period is an evaluator choice because the statement describes an ongoing state.
  - The hypothetical concession about inference profitability is not a condition on the subscription-loss assertion.
support_condition: Comparable subscription revenue and attributable cost records show substantial subscription losses at both companies during the target quarter.
contradiction_condition: Comparable records show that at least one company's overall subscription business was profitable, broke even, or incurred only small losses during the target quarter.
measurement_requirements: Separate subscriptions from API revenue and free users. Include the subscriber usage distribution and explain allocation of training and other shared costs. API retail prices cannot substitute for actual serving costs.
source_requirements: Company accounts or credible reporting based on identifiable financial records, with subscription-specific scope and a stated accounting basis.
