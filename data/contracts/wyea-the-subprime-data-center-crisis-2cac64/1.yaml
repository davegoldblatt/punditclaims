assessment_axis: forecast_outcome
explicit_source_elements:
  - subprime loans defaulting
  - ten or fifteen of them
  - send the industry into a panic
evaluator_interpretation:
  - The antecedent is a cluster of ten to fifteen defaults on substantial AI data center loans of the kind discussed in the surrounding text.
  - Count distinct defaulted loan facilities, not lenders, missed installments or repeated reports of the same default.
  - The plain reading of panic is broad, abrupt financial distress across data center financing, visible in debt repricing and curtailed financing availability.
  - The subprime comparison frames the forecast; it does not supply a separately precise historical default-count claim.
  - No deadline, cluster duration or response lag is specified.
support_condition: A documented cluster of ten to fifteen qualifying loan defaults is followed by broad, sharp repricing or a financing freeze, with evidence that those defaults triggered the disruption.
contradiction_condition: A documented qualifying cluster occurs and financing remains broadly orderly through the immediate market response and a meaningful subsequent financing period.
measurement_requirements: A deduplicated loan-default register, facility size and purpose, dated credit prices and spreads, issuance volumes, canceled financings and causal reporting.
source_requirements: Lender notices, court or regulatory records for defaults; market data and transaction records for the response. Warnings and borrower share-price declines alone do not establish the antecedent.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a verified cluster of ten to fifteen qualifying defaults and an observed market response establish or refute the predicted causal link. Stress without that antecedent cannot settle this conditional forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Loan size and the boundary of qualifying data center loans are unspecified.
  - The period over which defaults must cluster is unspecified.
  - "'Panic' has no numerical threshold."
  - The response lag and geographic extent of 'the industry' are unspecified.
