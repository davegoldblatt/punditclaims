assessment_axis: forecast_outcome
explicit_source_elements:
  - I am certain
  - at some point in the near future
  - a major big tech service
  - break in a way that isn’t immediately fixable
  - as a result of thousands of people building software with AI coding tools
  - compounded by the dual brain drain forces of layoffs
  - a culture that actively empowers people to look busy rather than actually produce useful things
evaluator_interpretation:
  - The forecast concerns a failure after publication on March 24, 2026. Earlier incidents provide context but cannot fulfill it.
  - “Near future” expresses an expectation of relatively soon but supplies no reproducible calendar deadline. I do not impose one.
  - A major big-tech service means a widely used service operated by a major technology company. “Break” means material loss or degradation of its normal functions.
  - “Isn’t immediately fixable” means restoration requires sustained diagnosis or repair beyond a straightforward prompt recovery. Duration and the documented recovery process must be considered together; no arbitrary hourly cutoff is imposed.
  - “Thousands of people” describes the scale of the software-building practice implicated in the failure. It does not require thousands of people to have authored the particular faulty change.
  - The full forecast requires evidence that widespread AI-assisted software development caused the failure and that both layoffs reducing relevant expertise and incentives favoring apparent activity over useful work worsened the failure or recovery.
  - A single AI-assisted change, company-wide adoption numbers, or layoffs alone cannot establish that causal chain.
  - “I am certain” states confidence, not a condition that must happen before the forecast can be assessed.
support_condition: A dated failure after publication materially disrupts a major big-tech service and cannot be promptly repaired. Credible incident findings establish that software development using AI coding tools by thousands of people contributed causally, and that both lost expertise from layoffs and a culture rewarding apparent activity over useful work compounded the failure or recovery difficulty. These links may be established by several corroborating records rather than one postmortem.
contradiction_condition: Contradiction would require evidence ruling out the forecast across its intended period and scope. A particular outage having another cause only excludes that candidate. With no fixed deadline, an uneventful interval or failure to find a qualifying incident does not contradict the forecast.
measurement_requirements: Identify the service, incident date, affected functions, recovery timeline and repair obstacles. Establish the scale of the implicated AI-assisted development practice and evidence linking both specified organizational factors to the incident or recovery. Distinguish causal findings from simultaneous adoption, layoffs, or employee dissatisfaction.
source_requirements: Prefer dated provider incident reports and operational records. Corroborated investigative reporting or documented employee accounts may establish internal staffing and incentive effects. General surveys and unsupported attribution cannot establish the complete event.
metric_scope: null
original_horizon: at some point in the near future
horizon_interval:
  start: 2026-03-24
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only upon a documented post-publication incident meeting every element of the support condition, including thousands of AI-tool users in the implicated development practice and both organizational aggravating factors. One AI-related outage without those links is insufficient. No finite interval without such an incident resolves the forecast as contradicted.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - “Near future” has no stated calendar endpoint.
  - “Major big tech service” does not identify a company or service.
  - “Isn’t immediately fixable” specifies neither a duration nor a recovery benchmark.
  - The organizational scope of “thousands of people” is unspecified.
  - The contribution and observable indicators of the claimed busywork culture are unspecified.
retrospective_or_prospective: retrospective
