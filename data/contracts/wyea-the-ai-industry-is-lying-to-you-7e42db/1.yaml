assessment_axis: forecast_outcome
explicit_source_elements:
  - I am certain
  - at some point in the near future
  - a major big tech service is going to break
  - in a way that isn't immediately fixable
  - as a result of thousands of people building software with AI coding tools
  - compounded by ... layoffs and a culture that actively empowers people to look busy
evaluator_interpretation:
  - "'Major big tech service' is read as a widely used service of a large tech company (for example Amazon, Microsoft, Google, Meta, Apple)."
  - "'Isn't immediately fixable' is read as a prolonged outage or failure, many hours or more, not a brief blip."
  - "Cause: the failure must be credibly attributed, by the company's postmortem or well-sourced reporting, to code or changes produced with AI coding tools."
  - "'Near future' has no fixed deadline, so the forecast is open-ended. Only events after the post date count."
support_condition: After 2026-03-24, a major big-tech service suffers a prolonged failure that the company or credible reporting attributes to AI-written or AI-assisted code changes.
contradiction_condition: No firm deadline exists, so the forecast cannot be contradicted by absence alone. It could only be judged failed after a deadline was agreed.
measurement_requirements: Incident postmortems or well-sourced reports naming AI coding tools as the cause of a prolonged outage at a big-tech service.
source_requirements: Company postmortems or status pages, or reputable news reports with named or multiple sources.
metric_scope: null
original_horizon: at some point in the near future
horizon_interval:
  start: 2026-03-24
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled as supported early if, after 2026-03-24 and before the evaluation date, a major big-tech service has a prolonged outage that the company's postmortem or credible reporting attributes to AI-assisted code changes.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Near future' has no deadline."
  - "'Major big tech service' and 'isn't immediately fixable' are undefined."
  - Attribution to AI coding tools is often disputed by the companies involved.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
