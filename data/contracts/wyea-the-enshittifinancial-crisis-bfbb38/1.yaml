assessment_axis: forecast_outcome
explicit_source_elements:
  - Eventually
  - data centers are going to go unbuilt
  - data center debt packages will begin to fall apart
evaluator_interpretation:
  - Eventually supplies no deadline.
  - The forecast concerns planned AI data centers and associated project financing discussed in the post.
  - Both construction abandonment and debt-package failure must occur after publication, though they need not concern the same project.
  - Going unbuilt means an identified planned project is abandoned, not merely delayed or transferred to another tenant.
  - A debt package falling apart means a planned package fails, is withdrawn or unwinds. Discounted debt trading or difficult syndication alone does not establish that event.
  - This is an event forecast, not a numerical claim about any company's debt balance.
support_condition: Dated post-publication records establish an abandoned planned AI data-center project and a failed or unwound data-center debt package.
contradiction_condition: No finite period without such events contradicts this undated forecast. Successful individual projects or financings do not disprove it.
measurement_requirements: Identify the project, construction decision, financing package and event dates. Distinguish debt from equity, tenant changes from abandonment, and financing distress from financing failure.
source_requirements: Developer, lender, court or government records preferred; reputable reporting may establish events when primary records are unavailable.
metric_scope: null
original_horizon: Eventually
horizon_interval:
  start: 2025-12-29
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only when post-2025-12-29 evidence establishes both an abandoned planned AI data center and a definitively failed, withdrawn or unwound data-center debt package. The later qualifying event completes the rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - No minimum number or scale of projects is specified.
  - Begin to fall apart could include financing strain short of definitive failure.
  - It is unclear whether both events must concern the same project.
  - A customer's abandoned expansion plan may still be built for another customer.
retrospective_or_prospective: retrospective
