evaluator_interpretation:
  - The antecedent requires substantial confirmation of at least half the alleged illicit fiscal 2026 revenue described immediately before this sentence.
  - The predicted outcome is loss of the identified illicit China revenue stream, whether already completed or occurring later.
  - No deadline is supplied. The post date is November 10, 2026.
  - Replacement sales to other customers would not by themselves refute the disappearance of this particular stream.
  - The accounting basis is estimate because the stream is defined by the adopted research allegation.
support_condition: After the antecedent is established, reliable evidence shows that the identified illicit revenue stream has ceased, either before publication or subsequently.
contradiction_condition: After the antecedent is established, decisive evidence would need to rule out the claimed cessation. Continued sales for a finite period cannot by themselves refute an eventual outcome with no deadline.
measurement_requirements: First quantify the qualifying illicit fiscal 2026 revenue; then track the same customers and indirect channels separately from legal China sales and replacement business.
source_requirements: Verified transaction and enforcement records for the antecedent, followed by channel-specific financial or shipment records demonstrating cessation.
