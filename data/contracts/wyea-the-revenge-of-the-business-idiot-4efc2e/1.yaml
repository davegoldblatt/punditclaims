assessment_axis: historical_observation
explicit_source_elements:
  - Nobody — not a single company
  - has been able to express
  - based on their actual bottom line
  - I spent this much money and got this in return
evaluator_interpretation:
  - The surrounding discussion concerns enterprise generative AI and LLM adoption, rather than every historical application of machine learning.
  - The ordinary reading requires a public, quantified connection between AI spending and realized financial benefit after relevant costs.
  - The present-perfect wording covers disclosures made by publication, with no stated starting date. This is a cumulative historical claim, not just a claim about the latest quarter.
  - A credible company disclosure can count without a separate audit, but projected savings, hours saved, and gross benefits without corresponding costs are insufficient.
support_condition: Evidence comprehensively establishes that no company had publicly supplied a quantified, attributable spending-to-realized-financial-return account by May 26, 2026.
contradiction_condition: At least one company had publicly quantified relevant generative-AI expenditure and the corresponding realized bottom-line benefit by May 26, 2026.
measurement_requirements: Matched deployment, period, costs, and realized benefits; an explained baseline; and a distinction between cash savings, revenue, productivity valuations, and net financial return.
source_requirements: Prefer company financial disclosures or documented deployment accounts. Anonymous surveys and vendor projections can provide context but need sufficient underlying detail to establish a counterexample.
