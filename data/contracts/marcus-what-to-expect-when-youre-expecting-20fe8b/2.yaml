assessment_axis: forecast_outcome
explicit_source_elements:
  - Bad actors
  - eventually be able to replicate much of GPT-4
  - dispensing with whatever guardrails are in place
  - using knock-off systems to create whatever narratives they wish
evaluator_interpretation:
  - This predicts an available capability. It does not require a documented malicious deployment or successful influence campaign.
  - The ordinary reading of 'replicate much of GPT-4' is to reproduce a substantial portion of its general language abilities in an alternative model. It does not require copying its weights or matching every capability.
  - The surrounding discussion concerns misinformation. 'Whatever narratives they wish' means that users can choose the message, including harmful or false narratives, without effective provider-imposed content restrictions. It does not promise perfect execution of every conceivable request.
  - Publicly accessible model weights and demonstrated, practical methods of removing safeguards establish availability to bad actors without requiring researchers themselves to have malicious intentions.
  - The capability comparison concerns the original GPT-4 generation, not an indefinitely advancing frontier.
support_condition: Public evidence establishes an accessible alternative model with substantial GPT-4-like language capabilities, and demonstrates that its safeguards can be removed or bypassed persistently while retaining useful capabilities and allowing user-directed harmful or false narrative generation. The evidence must connect these elements to the same model or demonstrated modification of it. Actual malicious deployment is not required.
contradiction_condition: Decisive evidence establishes that the predicted combination cannot become available. Failures of particular models, remaining refusals, or the absence of documented malicious deployments cannot by themselves contradict an unlimited 'eventually' forecast.
measurement_requirements: Use comparative language-capability evaluations and tests of the modified model's retained capabilities and harmful-content compliance. Distinguish willingness to answer from output quality. Do not substitute GPT-4 API jailbreaking alone for an alternative model.
source_requirements: Prefer dated primary research and model documentation. Public availability and demonstrated modifications can establish access; anonymous marketing claims about an uncensored model are insufficient.
metric_scope: null
original_horizon: eventually
horizon_interval:
  start: 2022-12-25
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported once a dated public demonstration, together with comparative capability evidence, establishes the accessible combination described in the support condition. No deadline or actual malicious deployment is necessary.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Much of GPT-4' supplies no numerical capability threshold."
  - "'Whatever narratives' leaves the required breadth and reliability unspecified."
  - "'Replicate' could mean functional imitation or literal copying; the surrounding discussion supports functional imitation."
  - "'Eventually' supplies no deadline."
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
