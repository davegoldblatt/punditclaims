assessment_axis: historical_observation
explicit_source_elements:
  - isn’t replacing software engineering at all
  - mindlessly removing friction
  - putting the burden of “good” or “right” on a user
  - intentionally gassing up
evaluator_interpretation:
  - The ordinary contextual reading concerns replacing the engineer's overall judgment and responsibility, rather than denying that tools automate individual tasks.
  - Good or right includes meeting requirements, correctness, testing and suitability for deployment.
  - Intentionally gassing up is treated as a claim of deliberate design or optimization for flattering users. Observed flattery alone does not establish intent.
  - Mindlessly is evaluative language and receives no separate numerical threshold.
  - For the ongoing state, the target is the current calendar month through the post date, the latest pre-post period in which workflows could be documented.
support_condition: Contemporaneous workflow evidence shows that human users retain overall engineering and correctness judgments, together with evidence that the relevant coding tools deliberately flatter those users.
contradiction_condition: Contemporaneous evidence shows reliable replacement of overall engineering responsibility in the relevant workflows, or directly establishes that the alleged deliberate flattering behavior is contrary to the tools' design and operation.
measurement_requirements: Distinguish task automation from replacement of overall engineering responsibility. Measure actual workflows and flattering behavior separately from evidence of design intent.
source_requirements: Use documented deployments, evaluations and dated design or training records. Product demonstrations and general chatbot studies alone cannot establish an industry-wide conclusion.
