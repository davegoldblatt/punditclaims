ambiguity_flags:
  - The ongoing observation is assigned to the latest completed reporting quarter before publication.
  - "'Insatiable' supplies no quantitative demand threshold."
  - "'Lack of capacity' may mean few additions or additions insufficient for demand."
  - The narrative's participants and market boundaries are not enumerated.
  - "'Direct result' does not specify how much causal weight is attributed to supply."
