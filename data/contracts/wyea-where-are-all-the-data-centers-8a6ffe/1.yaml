assessment_axis: causal_assessment
explicit_source_elements:
  - current
  - “AI compute demand is insatiable” narrative
  - utterly false
  - a direct result of a lack of capacity coming online
evaluator_interpretation:
  - Read 'insatiable' in its ordinary commercial sense of exceptionally strong demand absorbing available compute, rather than literally infinite demand.
  - Read the claim as asserting that weak capacity delivery explains the apparent excess demand, rather than unusually strong underlying demand growth.
  - Use January through March 2026, the latest completed reporting quarter before the post, for the ongoing state.
  - Assess usable commissioned compute, orders, paid usage, utilization, prices, and shortages together. Announced projects and capital spending do not by themselves measure delivered capacity.
  - Supply constraints and strong demand can coexist. Evidence of either alone does not establish the claimed causal explanation.
support_condition: Comparable market evidence shows that unusually weak usable capacity additions explain the apparent excess demand, while orders and usage do not substantiate the asserted exceptional demand growth.
contradiction_condition: Comparable evidence shows substantial usable capacity additions being absorbed by exceptional demand growth, with a credible causal analysis inconsistent with the claim that the narrative is simply a product of deficient capacity delivery.
measurement_requirements: Aligned time series of commissioned capacity, orders, paid usage, utilization, waiting times, and prices, with adjustments for hardware efficiency and workload mix. Separate physical shortages from underlying demand growth.
source_requirements: Provider operational disclosures and independent commissioning or utilization measurements. A causal conclusion needs evidence beyond management descriptions of demand.
