assessment_axis: historical_observation
explicit_source_elements:
  - has failed to be transparent
  - customers, the press, and the public writ large
  - must provide their usernames and passwords
  - any service they wish to connect
  - remotely connecting into a virtual machine and typing them
evaluator_interpretation:
  - Assess the complete proposition, including the transparency criticism, rather than silently reducing it to the login procedure.
  - The surrounding discussion makes transparency chiefly about Lyu's founder history and Rabbit's relationship to earlier ventures.
  - The ordinary technical reading is that connecting supported accounts requires entering credentials into a remotely hosted login session. It does not necessarily mean Rabbit permanently stores plaintext passwords.
  - Use the initial customer-launch period through the post, April 23–May 6, 2024, for the ongoing setup requirement. Earlier disclosures are context for what customers could know during that period.
support_condition: Launch-period documentation or direct testing establishes the remote credential-entry requirement, and independent records establish material omissions or conflicting disclosures about the founder and company history identified in the surrounding passage.
contradiction_condition: Launch-period evidence establishes that supported accounts could ordinarily be connected without the described remote login, or sufficiently specific contemporary disclosures rebut the alleged historical omissions. Evidence addressing only one component must not settle the other.
measurement_requirements: Distinguish entering credentials, retaining authenticated sessions, and storing passwords. Identify concrete historical disclosures or omissions instead of treating transparency as a measurable binary property.
source_requirements: Prefer dated company documentation and archived disclosures. Use contemporary firsthand reviews for the observed setup process and independently reported company responses for disputed history.
