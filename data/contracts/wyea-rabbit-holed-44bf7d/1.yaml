  - No standard for sufficient transparency is supplied.
  - The ongoing observation has no explicit reporting period; the surrounding launch context supplies the chosen period.
  - Providing credentials could be mistaken for permanent password storage.
  - Any service is read as any supported connected service, not every internet service.
