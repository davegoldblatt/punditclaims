  - run on the GPUs currently used
  - can even work on more austere hardware
  - nor do they require an endless supply of bigger, faster NVIDIA GPUs every year to progress
evaluator_interpretation:
  - The subject is the V3/R1 generation discussed in the post.
  - "The ordinary present-tense reading concerns technical necessity: these models can be built, run, and improved using existing hardware."
  - Progress includes software and model-efficiency improvements. It does not require replacement by a newer GPU generation.
  - I do not interpret the sentence as guaranteeing unlimited future frontier progress on a permanently fixed hardware budget.
  - The target period covers the December 2024 and January 2025 releases and their contemporary deployment evidence.
support_condition: Technical records establish development on existing GPU hardware and functioning deployment or efficiency improvements that do not require constructing a new massive data center or obtaining the next GPU generation.
contradiction_condition: The relevant models or demonstrated improvements technically require a new massive facility or newer GPU generation, rather than merely benefiting from them.
measurement_requirements: Distinguish training from inference, full models from distilled models, and original precision from quantized deployments. Report practical speed or quality limitations.
source_requirements: Primary technical reports and reproducible deployment demonstrations. Buying additional hardware is not itself evidence that it was technically necessary.
