assessment_axis: historical_observation
explicit_source_elements:
  - These companies
  - predominantly unprofitable
  - perpetually searching for product-market fit
  - even when they find it
  - seem incapable
  - revenue numbers that remotely justify their valuations
evaluator_interpretation:
  - The testable core is that most of the generative AI companies under discussion were losing money around publication. 'Predominantly' ordinarily means more than half, counting companies equally.
  - The surrounding revenue discussion supplies the relevant population. It does not supply an exhaustive company list or a precise boundary between generative AI businesses and their suppliers.
  - I read 'unprofitable' as having negative net income. Cash burn, operating losses and negative gross margins are not interchangeable with net losses.
  - For this ongoing June 2025 observation, use each company's latest reported annual or interim results relevant to its position before publication. The reporting window includes calendar 2024, the latest completed annual period, and available 2025 interim periods through June 30. It is not restricted to the first quarter of 2025.
  - The surrounding reliance on press-reported financial figures implies an estimate basis; the speaker specifies no accounting standard.
  - "'Perpetually searching' describes a continuing difficulty finding durable customer demand. It does not establish a measurable duration or mean that no company has customers: the next clause expressly allows that some find product-market fit."
  - "'Seem incapable' and 'remotely justify' express a qualified valuation judgment. I will not turn them into a firm revenue multiple, a prediction of permanent failure, or an independently scored assertion."
support_condition: Comparable company-level evidence establishes negative net income for more than half of the relevant companies in their latest reporting periods applicable to the June 2025 observation. A few prominent loss-making companies are insufficient.
contradiction_condition: Comparable evidence establishes that at least half of the relevant companies were profitable or breaking even in those periods. Individual profitable exceptions do not contradict 'predominantly'.
measurement_requirements: Identify the population independently of profitability, count each company once, and use comparable net-income results. Keep undisclosed results unknown. Do not infer net losses from fundraising, cash consumption, revenue growth or valuation multiples.
source_requirements: Prefer filings and company financial disclosures. Use reputable reporting where primary financial records are unavailable. Later publications may establish historical results, but evidence must have been available by October 28, 2026.
