assessment_axis: historical_observation
explicit_source_elements:
  - These companies
  - predominantly unprofitable
  - perpetually searching for product-market fit
  - even when they find it
  - seem incapable of generating revenue numbers that remotely justify their valuations
evaluator_interpretation:
  - The ordinary reading of predominantly unprofitable is that most companies in the discussed group lose money overall, counted by company rather than weighted by revenue or valuation.
  - These companies refers to the generative AI businesses discussed in the surrounding passage. The passage does not establish a complete population or sampling rule.
  - For the ongoing profitability observation, use January–March 2025, the latest completed calendar quarter that could have been reported before the June 30 post. This reporting-period choice is supplied by the evaluator.
  - Read unprofitable as negative net income. Cash burn, operating losses and gross margins are different measures.
  - The surrounding financial discussion relies on press estimates, so estimate is the indicated evidence basis; no common accounting standard is specified.
  - Read perpetually searching as continued difficulty establishing sustained customer demand, not a literal prediction covering all future time.
  - The valuation clause expresses doubt about whether sales support the prices investors pay. No revenue multiple, growth assumption or fair-value method is supplied, and none is invented here.
support_condition: Comparable net-income evidence must show that more than half of a defensibly defined population of the companies discussed lost money during the target quarter. The other clauses require evidence of persistent difficulty sustaining customer demand and a stated, defensible standard connecting revenue to valuation; revenue and valuation figures alone cannot establish that valuations are unjustified.
contradiction_condition: Comparable evidence that at least half of the defined population earned nonnegative net income would contradict the majority-loss assertion. Broad evidence of sustained commercial demand would weigh against the product-market-fit assertion. A single profitable company does not contradict predominantly, and a high valuation does not by itself prove or disprove the valuation judgment.
measurement_requirements: Define the company population before counting results. Obtain comparable quarterly net-income figures and distinguish estimates from company disclosures. Keep realized revenue separate from annualized revenue and match valuation dates to revenue measurements. Customer retention or repeat paid usage would inform product-market fit, but the speaker supplies no threshold.
source_requirements: Prefer financial statements and company disclosures. Use reputable reporting where private-company financial statements are unavailable, identifying its accounting and coverage limits. Do not use Zitron's own writing as outcome evidence.
