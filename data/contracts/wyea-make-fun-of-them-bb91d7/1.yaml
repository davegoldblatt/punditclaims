ambiguity_flags:
  - The company population and the meaning of leading companies are unspecified.
  - The latest completed quarter is an evaluator-selected reporting period for an undated ongoing observation.
  - Unprofitable does not specify an accounting standard or distinguish net losses from cash burn.
  - Product-market fit has no stated measure or duration.
  - Remotely justify their valuations supplies no valuation method or threshold.
  - Seem qualifies the valuation clause; even when is a concession, not a conditional forecast.
