original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A broadly validated counterexample can refute never; an applicable impossibility result can support it. Continuing failures in a finite sample cannot settle the universal forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Reliability and solved have no numerical thresholds.
  - The boundary between a generative model and a system using external tools is unspecified.
  - Intrinsic nature is not formally defined.
