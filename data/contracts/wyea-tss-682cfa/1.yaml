explicit_source_elements:
  - Generative AI
  - does not appear to provide
  - easy business returns
  - reminiscent of the cloud computing boom and mobile app store booms
evaluator_interpretation:
  - "The ordinary reading is a tentative comparison: commercial gains from generative AI were less readily obtainable than gains during the cloud and app-store booms."
  - "For the ongoing state, use January through March 2024: the latest completed calendar quarter for which reporting could ordinarily have been public before the July 1 post. The second quarter had ended only the previous day."
  - Returns means commercial benefits after the costs needed to obtain them, not revenue, financing or productivity alone.
  - The claim concerns an industry comparison, not a specified company's financial figure; metric_scope is therefore null.
  - No particular years for the earlier booms, beneficiary population or numerical threshold are supplied. Historical examples are context unless they establish a comparable distribution of returns.
support_condition: Comparable evidence shows that businesses generally obtained materially weaker or harder-to-realize cost-inclusive commercial returns from generative AI in the target period than from cloud and app-store opportunities at comparable stages.
contradiction_condition: Comparable evidence shows similarly accessible or stronger cost-inclusive commercial returns from generative AI in the target period.
measurement_requirements: Compare similar businesses and stages of adoption, including implementation and operating costs, unsuccessful ventures and the time needed to earn returns. Separate technology suppliers from customers.
source_requirements: Representative business studies or comparable financial records. Individual successes, gross revenue totals and investor opinions are insufficient to settle the industry comparison.
