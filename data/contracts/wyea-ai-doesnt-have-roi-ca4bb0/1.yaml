ambiguity_flags:
  - The ongoing claim supplies no reporting period; the latest completed calendar quarter is used.
  - Jobs may mean entire occupations, individual positions, or complete bundles of tasks.
  - Poor quality and failure to scale have no numerical thresholds.
  - Redeployment can remove a role without making its former holder unemployed.
