assessment_axis: historical_observation
explicit_source_elements:
  - AI can’t do jobs
  - some specific contract positions
  - extremely shitty versions that don’t scale
  - it does not replace jobs
  - incapable of human work
evaluator_interpretation:
  - The ordinary reading denies operational replacement of employee roles beyond the expressly conceded contract-position exceptions.
  - Replacement requires evidence that AI performs enough of an employee role's work to remove the need for that role. It does not require AI to reproduce every human characteristic.
  - Task benchmarks, hypothetical exposure, and an announcement of future layoffs do not establish operational replacement.
  - For this ongoing observation, use January through March 2026, the latest completed calendar quarter before the June 2 post. This is an evaluator-selected reporting window.
  - Quality and scalability must be evaluated in actual deployment, rather than inferred from a demonstration.
support_condition: Representative operational evidence establishes that AI cannot replace employee roles outside the contract exceptions, with attempted replacements failing to perform the necessary work reliably or at operational scale.
contradiction_condition: A documented deployment operating during the target period shows AI taking over enough work to eliminate at least one non-contract employee role, with sustained acceptable performance.
measurement_requirements: Identify employment status, staffing changes, the transferred work, residual human work, service quality, deployment duration, and operating scale.
source_requirements: Prefer staffing records linked to deployment records, supported by independent observation or corroborated employee evidence. Do not equate tasks completed or employee-equivalent output with jobs actually replaced.
