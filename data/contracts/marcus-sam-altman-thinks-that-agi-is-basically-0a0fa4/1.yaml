assessment_axis: causal_assessment
explicit_source_elements:
  - As I noted in 2001
  - the lack of distinct, accessible, reliable database-style records
  - leads to hallucinations
evaluator_interpretation:
  - The ordinary reading is that inadequate access to separately represented, dependable facts contributes to hallucinations. Marcus does not say it is their only cause or that adding a database eliminates them.
  - Retrieval from an external factual collection is a practical, imperfect test of what Marcus calls database-style records.
  - The 2001 attribution is a separate factual commitment. It requires an identifiable contemporary passage expressing the relevant causal idea, although it need not use today's terminology.
  - This is a general causal claim, so no observation reporting period or forecast deadline is imposed.
support_condition: Comparable-system experiments show that supplying dependable, accessible factual records reduces hallucinations, and a dated 2001 publication establishes that Marcus articulated the relevant causal argument.
contradiction_condition: Strong comparative evidence rejects the proposed contributing mechanism within the claimed scope, or documentary evidence establishes that the claimed historical attribution is false. Continued hallucinations after adding retrieval alone would not contradict a contributing-cause claim.
measurement_requirements: Measure factual errors against independently checked answers. Describe the records, retrieval success, model, training differences and task distribution. Separate record availability from whether the model retrieves and uses the right information.
source_requirements: Primary experimental research for the mechanism; contemporary documentary evidence for the attribution. Marcus's writing may establish what he said, but cannot establish that his causal account is correct.
