ambiguity_flags:
  - No numerical meaning is supplied for 'very few' or 'very much'.
  - No geographical boundary is stated.
  - The boundary between tech businesses and technology-intensive non-tech businesses is unspecified.
  - July 2026 is an evaluator-selected reporting period for an ongoing observation.
  - A trend in paid adoption need not be a trend in substantial expenditure.
