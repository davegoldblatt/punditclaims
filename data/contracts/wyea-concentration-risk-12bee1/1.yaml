assessment_axis: historical_observation
explicit_source_elements:
  - outside of the tech and AI world
  - very few companies
  - willing to pay very much for AI
  - no clear sign as to how you reverse the trend
evaluator_interpretation:
  - The plain reading is that substantial recurring AI spending is uncommon among non-tech businesses. Buying an inexpensive subscription alone does not contradict this.
  - Substantial means a meaningful business expenditure rather than experimentation or nominal subscription spending. The speaker supplies no monetary cutoff.
  - The reversal clause concerns signs of spending broadening at publication, not a prediction that reversal can never happen.
  - Use July 2026, the latest monthly spending period covered by Ramp reporting demonstrably public before the post. Ramp's August update was published September 9.
  - The claim concerns businesses generally. Ramp's customers are a sample, not the entire business population.
  - The description 'catastrophic' is an evaluative judgment and is not scored.
support_condition: Representative expenditure data show that substantial recurring AI spending was confined to a small minority of non-tech businesses, with contemporaneous evidence showing no clear broadening of substantial spending.
contradiction_condition: Representative expenditure data show substantial recurring AI spending was common across non-tech businesses, or a clear contemporary trend toward such spending was already visible. Adoption counts alone are insufficient.
measurement_requirements: Industry-level distributions of actual AI expenditure, business counts and size, including spending outside direct model subscriptions. Distinguish paid adoption from spending intensity and distinguish customer prevalence from revenue concentration.
source_requirements: Prefer transaction research with disclosed coverage and representative expenditure surveys. Vendor case studies and selected large customers cannot establish prevalence.
metric_scope: null
original_horizon: null
