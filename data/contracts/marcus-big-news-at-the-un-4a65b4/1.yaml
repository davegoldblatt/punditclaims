evaluator_interpretation:
  - "The checkable core: on or about 2026-09-21, a call for action on AI was signed, and more than 20 countries had signed it at that time."
  - "'Countries' is read plainly as sovereign states; the European Union is not a country."
  - "'Apparently written in the last week' is hedged and not tested."
