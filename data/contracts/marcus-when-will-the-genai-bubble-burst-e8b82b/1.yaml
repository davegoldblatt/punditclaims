assessment_axis: historical_observation
explicit_source_elements:
  - software that isn’t making much money
  - isn’t secure
  - keeping a lot of people up at night
evaluator_interpretation:
  - The ordinary reading is that generative AI software earns little relative to its costs, has material security weaknesses, and causes widespread concern.
  - Keeping people up at night is treated as concern, not a literal claim about measured sleep loss.
  - The financial context discusses press estimates of industry revenue and chip investment. It does not identify a company's net income.
  - For this ongoing composite observation, the target covers the latest completed annual reporting period, 2023, and the current state through March 31, 2024. Financial comparisons must use the same underlying period; the broad target interval does not make mismatched financial periods comparable.
support_condition: Comparable industry financial evidence shows limited returns relative to costs, while documented vulnerabilities and representative surveys establish material security weaknesses and broad concern.
contradiction_condition: Comparable financial evidence establishes substantial returns under the contextual comparison, or representative evidence materially refutes the security or concern components. A successful individual company would not by itself refute an industry claim.
measurement_requirements: Separate realized revenue, annualized revenue, investment, operating costs, and profit. For security, identify actual attack conditions. For concern, identify the surveyed population and fieldwork period.
source_requirements: Prefer original financial estimates or disclosures, primary security experiments, and original surveys with methodology.
metric_scope:
  company: Generative AI software industry; no individual company specified
  metric: Financial returns relative to spending; revenue versus profit is unspecified
  currency: USD
  units: billions in the surrounding comparison
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2023-01-01
  period_end: 2023-12-31
  stock_or_flow: flow
