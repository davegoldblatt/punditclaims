ambiguity_flags:
  - No financial threshold or accounting measure is supplied.
  - Revenue and profit are different possible readings of making money.
  - The surrounding investment and revenue figures may have different coverage or periods.
  - The latest completed annual period and current pre-post state are evaluator-selected because the sentence gives no dates.
  - Security is not defined by a threat model.
  - The population meant by a lot of people is unspecified.
