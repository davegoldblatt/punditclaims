explicit_source_elements:
  - Scaling AI
  - investment in power generation
  - equivalent in ambition to the New Deal, or Eisenhower’s Interstate Highway System
  - need to happen quickly
evaluator_interpretation:
  - The surrounding discussion places the power-generation requirement primarily in the United States.
  - The ordinary qualitative reading is that continued AI expansion needs a major, urgent national infrastructure effort.
  - The claim does not specify how much AI expansion, how much investment, a completion date, or a common measure of ambition. Converting this analogy into a numerical threshold would add a commitment the speaker did not make.
support_condition: No reproducible binary test is available as written. A test would require a specified amount of AI scaling and a defined measure of the investment's scale and speed.
contradiction_condition: With those definitions supplied, sustained AI scaling without the asserted generation investment would contradict necessity. They are absent here.
measurement_requirements: Separate generation investment from transmission, data-center buildings and computing equipment; specify the historical comparison and timing.
source_requirements: Public electricity-demand studies, generation investment records and comparable historical infrastructure records.
