assessment_axis: historical_observation
explicit_source_elements:
  - I estimate
  - takes up at least half
  - its 2.95GW of capacity
evaluator_interpretation:
  - Assess the normalized capacity proposition. The investment and cumulative capex figures in the surrounding sentence are contextual, not additional claims graded here.
  - At least half of 2.95 GW means at least 1.475 GW.
  - Takes up means operational capacity allocated to or used by Anthropic, measured on the same power basis as Google's denominator.
  - Use January–March 2026, the latest completed reporting quarter before the post, for the ongoing capacity observation.
  - The phrase author's estimate qualifies confidence; it is not a conditional antecedent.
support_condition: Comparable records establish a 2.95 GW Google capacity base and at least 1.475 GW allocated to or used by Anthropic during the target period.
contradiction_condition: Comparable records establish Anthropic's allocation below 1.475 GW on the stated denominator, or otherwise establish that its share of the intended Google capacity base was below half.
measurement_requirements: Match geography, operational date, accelerator coverage and electrical power basis. Distinguish facility power from IT load, current allocation from future reservations, and Google-operated capacity from third-party deployments of Google-designed chips.
source_requirements: Google or Anthropic allocation disclosures, infrastructure records, or an independently documented capacity estimate with comparable numerator and denominator.
