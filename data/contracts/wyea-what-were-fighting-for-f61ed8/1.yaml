evaluator_interpretation:
  - Aggressively upselling means prominently and repeatedly encouraging existing customers to purchase additional AI services or upgrade for AI features.
  - The claim describes an ongoing practice. I use January 1 through publication on February 11, 2025 as the recent period in which customer communications and interface records could establish that practice.
  - The speaker's disgust is an opinion and is not assessed.
support_condition: Dated interface records or customer communications show prominent, repeated solicitations to pay more for AI services during the target period.
contradiction_condition: Representative records of customer interfaces and communications show that paid AI solicitations were absent or occasional and unobtrusive during the target period.
measurement_requirements: Record the placement, repetition, paid upgrade request, customer subscription status, and dates of prompts or emails. Offering AI features alone does not establish aggressive upselling.
source_requirements: Contemporaneous screenshots, interface recordings, archived customer emails, or independently documented customer experiences.
