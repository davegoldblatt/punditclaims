evaluator_interpretation:
  - The claim combines an approximately trillion-dollar investment total with continuing material reliability problems.
  - Remedied means that the core problems have been fixed sufficiently to provide dependable performance; it does not mean that no improvement occurred.
  - The ordinary monetary reading is cumulative investment already made by publication, rather than future commitments or annualized spending.
  - Dollars is read as US dollars. No companies, accumulation start date, investment categories, or accounting basis are supplied.
  - For the ongoing technical state, use December 2025 through the post date, the latest calendar month that could contain public evaluations. The cumulative financial period has no stated start.
support_condition: A clearly scoped total establishes approximately USD 1 trillion of realized relevant investment by publication, and contemporary evaluations establish that material factuality and reasoning failures persisted.
contradiction_condition: Comparable evidence establishes that the relevant investment total was materially inconsistent with approximately USD 1 trillion, or that the core reliability problems had been remedied by publication.
measurement_requirements: Separate realized spending from financing and future commitments; avoid double counting across investors, model companies, and suppliers. Evaluate reliability on representative tasks, allowing for improvements without treating them as complete remediation.
source_requirements: A reproducible investment reconciliation and contemporary model evaluations. The unspecified accounting basis must be resolved before a decisive monetary comparison.
