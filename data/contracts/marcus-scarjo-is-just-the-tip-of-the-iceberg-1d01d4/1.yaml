  - apparently hasn’t even fulfilled
  - their own promises
  - 20% resources
  - AI safety
evaluator_interpretation:
  - Read as an observation about implementation by the post date, not a forecast about eventual compliance.
  - The ordinary referent of the 20% promise is OpenAI’s published superalignment compute commitment. This does not mean 20% of money, staff, or all corporate resources.
  - Use May 1–23, 2024 as the latest reporting window for the ongoing state. No regular public allocation reporting period is identified.
  - The commitment itself is company-reported. Estimates of actual allocations must be distinguished from its stated baseline, scope, and schedule.
  - Apparently expresses uncertainty; it is not a conditional antecedent.
support_condition: Evidence establishes that OpenAI had not provided an allocation required by its published 20% compute commitment by May 23, 2024, using the commitment’s actual baseline, eligible work, and timing.
contradiction_condition: Comparable allocation records establish that OpenAI had provided the resources required under that commitment by May 23, 2024.
measurement_requirements: Identify the compute secured when the promise was made, qualifying superalignment allocations across contributing teams, and any allocation schedule applicable by May 2024. Difficulty obtaining compute alone does not establish the percentage allocated.
source_requirements: Use the original commitment and allocation records or credible researcher testimony. Identify when reporting substitutes for primary allocation records.
