explicit_source_elements:
  - LLMs aren’t really AGI
  - OpenAI’s latest, GPT o1
  - Fast forward to today
evaluator_interpretation:
  - Read AGI as broadly human-level, general intellectual capability, including reliable adaptation across unfamiliar tasks. This does not require perfection.
  - Assess publicly available contemporary LLMs, including the newly released o1-preview, rather than every possible future LLM.
  - The post explicitly concerns launch day, so the target is the capability state on September 12, 2024. Launch-era evaluations describe that state even where their individual testing dates are undisclosed.
support_condition: Contemporary evaluations show substantial gaps in general task execution and adaptation inconsistent with broadly human-level general capability.
contradiction_condition: Credible broad evaluations establish that a contemporary LLM, including o1-preview, already possessed that general capability.
measurement_requirements: Consider breadth and reliability across tasks. Isolated mistakes do not disprove AGI, and expert performance on selected benchmarks does not establish it.
source_requirements: Launch-era technical evaluations, supplemented by independent evaluations clearly identifying the model tested.
