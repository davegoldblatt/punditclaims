assessment_axis: causal_assessment
explicit_source_elements:
  - Google, Amazon, Microsoft, and most notably not Meta
  - remarkable revenue growth in the AI era
  - selling effectively all of their available compute to either Anthropic or OpenAI
  - more than 70% of their AI revenues
  - the only AI data center companies with any revenue growth
  - connected directly or by proxy to the two AI labs
evaluator_interpretation:
  - The ordinary reading is that purchases by the two labs largely explain the named providers’ growth. 'I believe' expresses confidence in this checkable explanation; it is not a conditional antecedent.
  - In the surrounding discussion, 'available compute' means available AI compute offered to customers. 'Effectively all' means nearly all, allowing a small remainder; the author supplies no exact allocation threshold.
  - The words do not settle whether the greater-than-70% threshold applies collectively or separately to Google, Amazon and Microsoft. Examine both readings where possible. A result that depends on choosing between them must be flagged.
  - The period is the AI era through publication, with no explicit starting date. The nearby Microsoft example concerns its most recent fiscal year. Retain that annual comparison and do not restrict the entire claim to April–June 2026.
  - Read Meta’s exclusion as an exception to the proposed compute-sales explanation, rather than an independent assertion that Meta had no revenue growth.
  - A connection by proxy means an identifiable commercial chain supplying the labs. Mere participation in the same technology industry does not establish such a connection.
  - The supplied passage does not identify the accounting or estimation basis for the cross-company AI revenue share. It is recorded as unknown, rather than assigning the basis of a subsequently found source.
support_condition: Comparable customer revenue and capacity records show that the two labs account for more than 70% of AI revenue under the applicable reading, buy nearly all available AI compute, and largely explain the named providers’ growth. Records also establish the asserted commercial connections among growing AI data center providers. Connections and concentration alone are insufficient to establish the causal explanation.
contradiction_condition: Comparable records materially refute the asserted concentration or near-total compute allocation, show that the proposed mechanism does not largely explain the growth, or identify a growing AI data center provider without the asserted direct or proxy commercial connection. A provider-level share below 70% alone does not refute the collective reading. Other customers’ existence alone does not refute 'effectively all.'
measurement_requirements: Use realized AI revenue and customer revenue for matching periods and definitions. Distinguish annualized run rates, bookings and future contracts from earned revenue. Measure available AI compute and its customer allocation consistently. Examine growth contributions, rather than treating customer concentration as proof of causation.
source_requirements: Prefer filings, company disclosures and documented customer contracts. Clearly label press estimates and their assumptions. Evidence must have been available by 2026-10-28. The speaker’s writing supplies scope, not outcome evidence.
