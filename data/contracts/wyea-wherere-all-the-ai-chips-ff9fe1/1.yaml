assessment_axis: causal_assessment
explicit_source_elements:
  - Google, Amazon, Microsoft
  - most notably not Meta
  - remarkable revenue growth in the AI era
  - selling effectively all of their available compute
  - more than 70% of their AI revenues
  - the only AI data center companies with any revenue growth
  - connected directly or by proxy to the two AI labs
evaluator_interpretation:
  - Read the statement as asserting that OpenAI and Anthropic together exceed 70% of each named provider's AI revenue, rather than only their combined revenue.
  - Read available compute as commercially available AI compute, given the surrounding discussion of GPUs.
  - Use April–June 2026, the latest completed reporting quarter before publication, for the ongoing revenue-share and allocation assertions. The surrounding Microsoft fiscal-year example is a different measurement period.
  - Read the causal assertion as saying that purchases by the two labs materially explain the providers' revenue growth.
  - Read the Meta exception as excluding Meta from this compute-sales mechanism, not necessarily denying that Meta's revenue grew.
  - The phrase I believe qualifies confidence but leaves concrete factual assertions to test.
support_condition: Comparable customer-level records show that the two labs account for more than 70% of each named provider's realized AI revenue and nearly all available AI compute, and that their purchases materially explain growth. Records also establish the asserted lab connections across growing AI data center providers.
contradiction_condition: Comparable records show a combined lab share at or below 70% for a named provider, substantial available AI compute serving other customers, or a growing AI data center provider without the asserted direct or indirect connection. Evidence of other growth drivers must quantify their importance to contradict the causal component.
measurement_requirements: Use matching periods and definitions for lab revenue and total AI revenue. Separate realized revenue from annualized run rates, cloud revenue, investment gains, and bookings. Trace indirect customers rather than assuming every hyperscaler contract ultimately serves a lab.
source_requirements: Customer-level filings, company disclosures, or independently sourced estimates with disclosed methods. Repetition of Zitron's calculation is not independent confirmation.
