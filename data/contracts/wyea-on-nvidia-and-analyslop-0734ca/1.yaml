  - pretty difficult to actually raise $100 billion
evaluator_interpretation:
  - This describes OpenAI's fundraising negotiations as they stood on the post date.
  - The ordinary reading combines complicated financing terms with substantive difficulty securing the targeted capital. Installments alone establish neither investor reluctance nor fundraising failure.
  - A subsequent successful round can provide context but cannot retrospectively establish that negotiations were easy.
support_condition: Contemporaneous records establish complicated terms and material obstacles to securing approximately $100 billion, such as investor withdrawals, funding shortfalls, stalled negotiations, or financing-related delays.
contradiction_condition: Records describing the negotiations establish that the targeted capital was readily secured without the claimed complications or material obstacles.
measurement_requirements: Distinguish proposed investments, binding commitments, conditional commitments, and cash received. Assess difficulty separately from the existence of installments.
source_requirements: Investor disclosures or reliable reporting about the negotiations. Later announcements must describe the earlier negotiations to qualify as outcome evidence.
