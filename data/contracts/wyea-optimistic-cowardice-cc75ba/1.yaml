assessment_axis: historical_observation
explicit_source_elements:
  - an unprofitable company
  - riddled by onerous debt
  - 77% of its $1.9 billion of 2024 revenue
  - coming from Microsoft and NVIDIA
evaluator_interpretation:
  - Unprofitable means reporting a net loss, rather than necessarily an operating loss.
  - The explicit 2024 reference anchors the financial description to the latest completed annual reporting period before publication.
  - Onerous debt means substantial borrowing and debt-service obligations relative to the company's revenue and financial resources; it does not itself assert insolvency.
  - Revenue and percentages are rounded as presented. The single metric_scope object anchors the annual revenue measurement; the accompanying loss and year-end debt measurements are specified separately below.
support_condition: Reported 2024 revenue rounds to $1.9 billion, Microsoft and NVIDIA together account for approximately 77%, the company reports a net loss, and its year-end borrowing and repayment obligations substantiate a substantial debt burden.
contradiction_condition: Comparable records materially contradict the revenue or named-customer share, show net profitability, or show that the debt burden was not substantial.
measurement_requirements: Calendar 2024 realized revenue and customer shares; 2024 net income or loss; gross debt principal outstanding on December 31, 2024 and its repayment terms. Do not substitute operating income for net income or cumulative customer payments for annual revenue.
source_requirements: Company financial statements and concentration disclosures, supplemented by reliable reporting identifying any unnamed customer.
