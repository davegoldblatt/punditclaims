assessment_axis: causal_assessment
explicit_source_elements:
  - The hunger for speculation
  - has vastly outpaced the actual demand for AI compute
  - much like it did in the great financial crisis
  - for many of the same reasons
evaluator_interpretation:
  - The plain reading is that speculative AI infrastructure investment substantially exceeds paying compute demand, with material financial mechanisms shared with the financial crisis.
  - The surrounding discussion identifies capital flows, pursuit of yield and underestimation of credit risk as the proposed shared mechanisms.
  - Use January–March 2026 as the latest broadly reported quarterly observation period before the post. Later pre-post financing commentary is contextual.
  - The phrase about shared reasons is a causal assertion, not a conditional forecast.
  - No numerical meaning is imposed on vastly; support requires a clearly substantial excess robust to reasonable measurement choices.
support_condition: Comparable investment and paying-demand records establish substantial speculative excess, and evidence links that excess to several material mechanisms also documented in the financial crisis.
contradiction_condition: Comparable records establish that planned and financed AI capacity is broadly justified by paying demand, or credible causal evidence shows that the asserted shared mechanisms do not materially explain the investment.
measurement_requirements: Distinguish announcements from financed projects, current demand from future contracted demand, and temporary supply shortages from long-term overinvestment. Causal evidence must go beyond resemblance or warnings about possible risks.
source_requirements: Project and customer records, financing documents, and research or official analysis comparing investment mechanisms across the two episodes.
