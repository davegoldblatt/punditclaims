assessment_axis: forecast_outcome
explicit_source_elements:
  - in the event that these companies start charging what they actually need to
  - I hypothesize
  - multiply the costs of their customers
  - can't afford to run their businesses
  - remove or scale back generative AI functionality
evaluator_interpretation:
  - The antecedent is a move by OpenAI or Anthropic to materially higher prices sufficient to cover the relevant provider costs.
  - A newly introduced premium model, higher token consumption, or a downstream company's own pricing change does not by itself establish that antecedent.
  - The outcome requires financial harm or feature reductions among affected business customers caused by the qualifying provider repricing.
  - The wording does not specify the affected share of customers, a cost multiplier, or a deadline.
support_condition: A documented cost-covering provider price increase multiplies affected customers' API expenditure and causes business failures or material reductions in their generative AI features.
contradiction_condition: After a documented qualifying repricing, representative affected customers absorb the costs and maintain their businesses and AI functionality, with evidence sufficient to reject the claimed customer consequence.
measurement_requirements: Provider prices and costs establishing the antecedent; customer expenditure at comparable usage before and after repricing; and evidence connecting subsequent business or feature changes to that repricing.
source_requirements: Dated provider pricing disclosures and cost records, together with customer financial or product records. Complaints alone do not establish the causal chain.
metric_scope:
  company: Business customers of OpenAI and Anthropic
  metric: API expenditure following cost-covering provider repricing
  currency: null
  units: multiple of baseline expenditure
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
