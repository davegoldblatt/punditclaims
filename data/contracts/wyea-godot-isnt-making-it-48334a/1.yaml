condition_status: unknown
early_resolution_rule: A dated, documented repricing episode can settle the forecast only if it establishes cost coverage and the resulting customer consequences. An isolated downstream price change is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No definition of the costs providers need to cover.
  - No specified multiplier or share of affected customers.
  - It is unclear whether both providers must reprice or whether either provider is sufficient.
