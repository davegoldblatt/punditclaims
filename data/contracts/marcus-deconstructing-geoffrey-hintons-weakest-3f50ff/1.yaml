assessment_axis: causal_assessment
explicit_source_elements:
  - Given vast datasets
  - LLMs approximate well
  - their understanding is at best superficial
  - That's why
  - unreliable, and unstable, hallucinate
  - constitutionally unable to fact check
evaluator_interpretation:
  - Assess the explanation of contemporary LLM behavior, not a forecast about all future architectures.
  - The ordinary reading is that limited reasoning and world knowledge cause the listed failures, rather than merely occurring alongside them.
  - Treat constitutional inability as a claim of an inherent limitation, while distinguishing imperfect fact-checking from inability to perform any factual verification.
  - Understanding needs an independent measure; defining it as whatever prevents errors would make the causal claim circular.
support_condition: Controlled evidence independently measures the claimed limitation and establishes that it causes the listed failures; evidence also supports an inherent barrier to fact-checking within the stated model scope.
contradiction_condition: Controlled evidence rejects the proposed causal explanation, or directly demonstrates the allegedly impossible capability under an unambiguous reading of fact-checking.
measurement_requirements: Specify models, tasks, an independent measure of understanding, and interventions separating that measure from training knowledge, prompts, decoding, retrieval, and external feedback.
source_requirements: Original controlled evaluations or mechanistic studies. Error examples alone cannot establish the proposed cause.
