evaluator_interpretation:
  - The ordinary reading is that contemporary Stable Diffusion has recurring difficulty assigning requested colors separately to an object and its parts.
  - For the named example, successful output should depict a white bicycle body or frame with recognizably green wheels.
  - The claim does not require universal failure, and a single successful image would not refute it.
  - The post describes ongoing September 2022 behavior without a reporting period. I use September through the publication date as the observation window.
  - Difficulty assigning colors to separate objects is relevant background but does not by itself establish difficulty assigning colors to an object and its parts.
support_condition: Independent contemporary outputs show repeated failures on the named bicycle prompt or closely comparable simple object-and-part color prompts during the target period.
contradiction_condition: Representative independent contemporary testing shows reliable assignment of the requested colors to the bicycle and its wheels, together with comparable simple object-and-part prompts.
measurement_requirements: Identify model checkpoint, prompts, settings, sample size, and outputs. Score the object's color and its parts' colors separately; do not substitute general image quality or multiple-object composition scores.
source_requirements: Independent documented outputs or primary evaluations with inspectable examples. Marcus's own images cannot independently establish the outcome.
