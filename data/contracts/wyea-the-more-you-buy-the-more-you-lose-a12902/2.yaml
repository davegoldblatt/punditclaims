explicit_source_elements:
  - Anthropic and OpenAI allow users to burn
  - $8000 to $14,000 a month
  - for $200
  - is not a business model
evaluator_interpretation:
  - "The checkable part is factual: the $200-a-month plans from Anthropic and OpenAI let a user consume about $8,000 (Anthropic) to $14,000 (OpenAI) a month of usage. Read plainly, the value is measured at the companies' published API prices, which matches the experiment the post links to."
  - "'Not a business model' is his opinion and is not graded."
  - "'Burn' is read as consumption valued at API list prices, not the labs' internal compute cost."
  - "The claim is in the present tense, in a post dated July 28, 2026. The target period is June 1 to July 28, 2026: the most recent period public measurements could cover before the post."
support_condition: A measurement covering the target period shows that a maxed-out $200 plan yields roughly $8,000 a month at API prices for Anthropic and roughly $14,000 for OpenAI.
contradiction_condition: Measurements covering the target period show that $200 plans yield far less (for example, a few thousand dollars a month at API prices), or that no such usage was possible.
measurement_requirements: Tests that exhaust the plan's limits and value the tokens used at API list prices, run in or near June–July 2026.
source_requirements: Independent measurement (for example SemiAnalysis) or company disclosures of plan limits.
