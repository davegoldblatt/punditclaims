explicit_source_elements:
  - Anthropic and OpenAI
  - $8000 to $14,000 a month
  - for $200
  - is not a business model
evaluator_interpretation:
  - The numerical assertion is the checkable component. 'Not a business model' supplies no separate profitability threshold or deadline.
  - The post links to Zitron's earlier discussion of a SemiAnalysis subscription experiment. This establishes an analyst-estimate basis, not audited provider costs.
  - "I read the figures as maximum monthly token usage valued at API list prices: approximately $8,000 for Anthropic and $14,000 for OpenAI."
  - For the ongoing monthly assertion, June 2026 is the latest completed calendar month before the July 28 post. Individual subscription billing cycles need not follow calendar months.
  - The figures describe estimated monthly allowances extrapolated from usage limits, not necessarily a full month's observed consumption.
support_condition: Dated testing and contemporaneous pricing establish that the two $200 subscriptions permitted approximately $8,000 and $14,000 of monthly API-equivalent usage, respectively.
contradiction_condition: Comparable testing or binding plan limits establish materially smaller maximum monthly API-equivalent allowances for either provider.
measurement_requirements: Subscription fees, tested usage limits, token quantities, model mix, caching treatment and contemporaneous API prices. Actual provider costs require separate accounting evidence.
source_requirements: Prefer original usage testing and dated company terms. Reporting of the original experiment may establish the quoted estimates, with its limitations disclosed.
