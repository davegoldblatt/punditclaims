assessment_axis: forecast_outcome
explicit_source_elements:
  - the vast majority of customers for AI compute
  - unprofitable AI startups
  - want to compete with OpenAI and Anthropic
  - once the venture spigot turns off
  - nobody will want it
evaluator_interpretation:
  - Read the condition as a broad cessation of venture financing for the relevant AI startup customers, not a slowdown or isolated failed fundraising.
  - Read 'nobody will want it' as the disappearance of meaningful commercial demand for the AI compute capacity discussed. Do not require literally zero experimental use.
  - Read 'majority of customers' as customer count, because no spending-weighted or capacity-weighted measure is supplied.
  - The current customer-composition premise is distinct from the conditional outcome. Use the latest completed calendar quarter before publication, July through September 2026, when seeking evidence for that premise.
  - No deadline or waiting period after the financing cutoff is supplied.
support_condition: After a verified broad financing cutoff for the relevant customers, contracts, utilization and purchasing records establish that meaningful commercial demand for the capacity disappears. A separate customer census must establish the asserted current composition.
contradiction_condition: After that financing cutoff, sustained material paid use or new purchases demonstrate continuing commercial demand for the capacity.
measurement_requirements: Define the customer population, count customers rather than substitute spending shares, establish profitability and competitive status, document the funding cutoff, and measure subsequent paid utilization or purchases.
source_requirements: Funding records and provider or customer contracts and utilization disclosures. A representative customer dataset is required for the current majority assertion.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-07-01
  end: 2026-09-30
  precision: quarter
condition_status: unknown
early_resolution_rule: Once the broad funding cutoff is verified, sustained material commercial purchases or utilization by surviving customers can decisively contradict the prediction. Temporary low utilization cannot establish a permanent absence of demand.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The relevant startup population and geographic scope are unspecified.
  - No numerical threshold for 'vast majority'.
  - Customer count, spending share and capacity share could produce different results.
  - No definition of the venture funding cutoff or post-cutoff observation period.
  - The historical premise names no period; the latest completed calendar quarter is used.
  - "'Nobody' may be rhetorical rather than a literal zero."
retrospective_or_prospective: retrospective
