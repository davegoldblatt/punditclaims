explicit_source_elements:
  - it appears
  - hyperscalers — which make up more than 50% of its revenue
  - willing to do so, quarter after quarter
  - hoarding tens of billions of dollars to 'secure supply'
  - only constrained because of the hyperscalers themselves
evaluator_interpretation:
  - The speaker opens with 'it appears', so the main assertion is an impression he hedges, not a firm statement.
  - "The core of the claim is causal: that supply is constrained 'only' because of hyperscaler buying. No public measure can isolate that cause."
  - The embedded fact that hyperscalers are more than 50% of NVIDIA revenue can be checked, and it is recorded here as context only. It does not decide the hedged claim as a whole.
support_condition: Not scored. A firm version would need evidence that hyperscalers routinely buy tens of billions of dollars of GPUs well ahead of installation, and that this buying alone creates the supply constraint.
contradiction_condition: Not scored. A firm version would be contradicted by evidence that GPUs are installed promptly, or that the supply constraint comes from causes other than hyperscaler buying (foundry, packaging or memory capacity).
