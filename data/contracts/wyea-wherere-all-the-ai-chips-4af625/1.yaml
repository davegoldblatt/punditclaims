assessment_axis: causal_assessment
explicit_source_elements:
  - more than 50% of its revenue
  - quarter after quarter
  - hoarding tens of billions of dollars
  - secure supply
  - only constrained because of the hyperscalers themselves
evaluator_interpretation:
  - "Read as three linked assertions: hyperscalers supply over half of NVIDIA's total revenue; they repeatedly accumulate substantial GPU purchases before deployment; their accumulation alone creates the supply constraint."
  - Read 'hoarding tens of billions of dollars' as holding purchased hardware worth that amount, rather than holding cash.
  - "Use NVIDIA's latest completed fiscal quarter before publication for the revenue share: the quarter ended July 26, 2026. Repeated purchasing requires evidence from preceding quarters as well."
  - "'It appears' expresses uncertainty, rather than an antecedent that must occur."
  - The supplied passage does not identify the accounting basis or source of the revenue percentage. Do not silently assign one.
support_condition: Matching revenue disclosures establish the greater-than-50% share, purchase and deployment records establish repeated accumulation worth tens of billions, and causal evidence establishes that this accumulation alone constrained supply.
contradiction_condition: Matching records disprove a specified component, or causal evidence establishes a material supply constraint that would remain without hyperscaler stockpiling.
measurement_requirements: Separate total NVIDIA revenue from Data Center revenue; distinguish orders, ownership transfers, deliveries and installed hardware. Establish inventory value and duration across multiple quarters. Test alternative production, packaging, memory and infrastructure constraints.
source_requirements: Company revenue disclosures, purchaser inventory and deployment records, and independently corroborated supply-chain evidence. Supplier statements alone cannot establish exclusive causation.
