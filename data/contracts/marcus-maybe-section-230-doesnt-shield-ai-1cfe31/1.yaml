assessment_axis: historical_observation
explicit_source_elements:
  - under-oath lies
  - artists and writers would be compensated for the work, and have control over it
  - he hoped that the government would regulate AI
  - no financial interest in OpenAI beyond his health insurance
  - equity he indirectly held via YCombinator
  - ownership in a venture fund tied to OpenAI
evaluator_interpretation:
  - The relevant event is Altman's May 16, 2023 Senate testimony. Later disclosures can establish facts about that day but do not change the target period.
  - The ordinary reading of lies is knowingly false statements or deliberately misleading omissions. A promise requires evidence that the stated intention was false when expressed; later nonperformance alone is insufficient.
  - The three allegations are assessed separately within this single compound claim. Establishing an omitted financial interest does not establish dishonesty about creators or regulation.
  - Supporting regulation does not imply supporting every proposed regulation. Supporting creator compensation does not necessarily promise payment to every creator under a specified scheme.
  - Metric scope is null because this concerns personal interests and the truthfulness of testimony, rather than a measure of company finances.
support_condition: The testimony and reliable evidence about circumstances on May 16, 2023 establish knowing falsity or deliberate deception concerning creator compensation and control, support for regulation, and financial interests.
contradiction_condition: Reliable evidence affirmatively refutes the attributed statements or establishes that the alleged deception did not occur. Missing proof of dishonesty alone does not contradict the allegation. A mixed result requires established support and contradiction for identifiable components.
measurement_requirements: Compare the exact testimony with dated ownership records and evidence of Altman's knowledge and intentions at the hearing. Distinguish direct equity, indirect economic exposure, fund control, and entitlement to fund profits.
source_requirements: Prefer the hearing record, ownership documents, contemporaneous communications, and court testimony. Courtroom reporting may establish reported admissions when the underlying transcript is unavailable; allegations and lawyers' questions are not findings.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2023-05-16
  end: 2023-05-16
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Marcus paraphrases a statement about equity as a statement about all financial interests.
  - Direct ownership and indirect economic exposure can produce different readings of the financial statement.
  - Creator compensation and control have no specified coverage, mechanism, or deadline.
  - Wanting regulation does not specify which regulatory proposals Altman supported.
  - Ownership or control of a venture fund does not by itself establish personal economic benefit.
