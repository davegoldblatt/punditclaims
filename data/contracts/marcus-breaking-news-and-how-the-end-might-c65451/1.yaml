evaluator_interpretation:
  - "Plain reading: once both Anthropic's and OpenAI's full financials are public (for example, public S-1 prospectuses with audited statements), Anthropic will show better efficiency. That means more revenue per dollar of compute and total cost, or a smaller cash burn relative to revenue."
  - The trigger is that both companies' numbers are fully out. One company's prospectus alone does not allow the comparison.
support_condition: Public, audited financials for both companies show that Anthropic turns compute and operating spending into revenue more efficiently than OpenAI, for example through a higher gross margin and lower losses or burn relative to revenue on a comparable basis.
contradiction_condition: Public, audited financials for both companies show that OpenAI is as efficient as Anthropic or more efficient on those measures.
measurement_requirements: "Comparable audited figures for both companies: revenue on the same gross or net basis, cost of revenue, operating loss and cash burn."
source_requirements: Public SEC filings (S-1 or later reports) from both companies, or reputable reporting on them.
