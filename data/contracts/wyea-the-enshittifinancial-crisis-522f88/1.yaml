explicit_source_elements:
  - burn $2.8 billion this year
  - I believe it burned much, much more
evaluator_interpretation:
  - Assess the supplied proposition about 2025 cash burn, excluding the separate funding figure.
  - Read burn ordinarily as net cash consumed by the business, rather than accounting net loss or gross spending.
  - Read much, much more as a substantial excess over $2.8 billion. Do not invent a precise percentage cutoff.
  - Use calendar 2025, the year identified by this year in the December 29 post.
  - Treat the referenced figure as an estimate because it is presented as an alleged financial figure, not as an identified audited or company-reported measure.
support_condition: Reliable full-year cash-burn evidence, on the same basis as the referenced estimate, establishes a substantial excess over $2.8 billion.
contradiction_condition: Comparable full-year evidence establishes cash burn at or below $2.8 billion, or close enough that a substantial excess is clearly excluded.
measurement_requirements: The definition behind the $2.8 billion estimate and a reconciliation to realized 2025 cash flows, including treatment of capital spending, prepayments, investments, and financing.
source_requirements: Prefer audited cash-flow statements with a reconciliation to the cited estimate; otherwise use credible reporting of the same full-year cash-burn measure.
