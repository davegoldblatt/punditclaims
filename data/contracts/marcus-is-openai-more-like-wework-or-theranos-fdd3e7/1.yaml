assessment_axis: causal_assessment
explicit_source_elements:
  - Theranos’s valuation and press were based on promise
  - to a large extent you could say the same about OpenAI
evaluator_interpretation:
  - Assess whether expectations of future achievements substantially drove OpenAI's current valuation and press coverage.
  - To a large extent does not mean exclusively, and the analogy does not itself assert that OpenAI was fraudulent.
  - Use the latest funding valuation before publication and coverage surrounding it through the post, rather than later business outcomes.
  - The claim supplies no accounting basis or quantified share attributable to promises.
support_condition: Investor explanations and a representative body of contemporary coverage establish that expected future achievements were a substantial basis of both valuation and coverage.
contradiction_condition: Evidence about valuation formation and representative coverage establishes that demonstrated results accounted for those judgments, with future promises playing only a minor role.
measurement_requirements: Separate observed adoption and delivered performance from forecasts, and distinguish valuation determinants from the topics emphasized in press coverage.
source_requirements: Investor explanations, financing records, and a representative contemporary press sample. Individual promotional statements or articles are insufficient to establish the whole claim.
