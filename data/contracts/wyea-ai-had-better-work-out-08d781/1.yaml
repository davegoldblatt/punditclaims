explicit_source_elements:
  - debt that’s now selling off
  - supposed $104 billion in backlog
  - at least 50% of which is OpenAI and Anthropic
  - per UBS, about $102 billion in debt
  - in the next three years
evaluator_interpretation:
  - Assess whether recognition of CoreWeave’s financing exposure materially contributed to its debt selloff and the broader cooling of AI infrastructure credit.
  - Treat 'time bomb' as a description of financing vulnerability, not a separate prediction of bankruptcy.
  - The three-year figure is an attribution to an existing UBS estimate. This assessment does not wait three years to measure actual borrowing.
  - Use October 13–20, 2026 for the current market episode, following the surrounding reference to the last week. Earlier financial disclosures are contextual inputs.
  - The structured money scope describes the claimed additional debt requirement. The backlog and customer concentration are separate supporting assertions.
support_condition: Contemporaneous market evidence links the selloff materially to this financing exposure, and independent records verify the backlog, customer concentration, and UBS estimate on the stated debt basis and three-year horizon.
contradiction_condition: Comparable records materially refute the financing assertions, or persuasive contemporaneous evidence shows that recognition of this exposure did not materially contribute to the selloff.
measurement_requirements: Dated bond prices or yields; investor accounts of the repricing; backlog composition; and the original UBS estimate with its financing definition, assumptions, and forecast period.
source_requirements: Prefer CoreWeave disclosures, UBS research, and market transaction records. Use independent financial reporting for investor motives when primary records are unavailable.
