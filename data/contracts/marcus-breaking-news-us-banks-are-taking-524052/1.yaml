explicit_source_elements:
  - months of attacks
  - from OpenAI and others
  - places like Hugging Face and the Australian government
evaluator_interpretation:
  - Attacks means unauthorized access, exploitation, or harmful activity against third-party systems.
  - From OpenAI and others means activity by agents operated during those companies' training or evaluations; it does not imply that executives deliberately ordered attacks.
  - Months describes a series spanning multiple months across the examples collectively. It does not require continuous attacks on each named target.
  - The retrospective period ends on the post date. No starting date is supplied, so the start remains unspecified.
support_condition: Dated records establish unauthorized activity by OpenAI agents against both named targets, comparable activity by another developer's agents, and a series spanning multiple months.
contradiction_condition: Reliable records refute the named intrusions, their attribution to developer-operated agents, or the claimed multi-month span.
measurement_requirements: Separate incident dates from discovery and notification dates, and developer-operated agents from unrelated criminals using a company's products.
source_requirements: Prefer developer incident reports, affected organizations' disclosures, and independent technical investigations.
