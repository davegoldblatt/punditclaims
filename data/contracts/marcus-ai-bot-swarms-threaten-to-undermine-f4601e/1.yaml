explicit_source_elements:
  - If we require
  - “proof-of-human”
  - high-reach interactions
  - mathematically difficult
  - financially ruinous
  - one operator
  - secretly run ten thousand accounts
evaluator_interpretation:
  - The antecedent requires enforced, privacy-preserving unique-human credentials for high-reach interactions. Optional verification badges do not satisfy it.
  - The consequence concerns operating 10,000 qualifying accounts under one operator's covert control, including acquired or borrowed credentials.
  - ‘Mathematically difficult’ means that the implemented security guarantees materially constrain duplication; ‘financially ruinous’ means prohibitive total operating costs. Neither has a supplied numerical threshold.
  - The claim has no deadline and remains conditional.
support_condition: After the stated requirement is implemented, deployment evidence or a faithful adversarial trial establishes both substantial technical barriers and prohibitive costs for covertly controlling 10,000 qualifying accounts.
contradiction_condition: Under the stated enforced requirement, a documented operator or faithful adversarial trial sustains covert control of 10,000 qualifying accounts at low cost.
measurement_requirements: Verify enforcement, uniqueness, anonymity, high-reach eligibility, account-control duration, credential transfer or theft, and total adversary costs.
source_requirements: Platform implementation records plus independently inspectable deployment or adversarial evidence.
