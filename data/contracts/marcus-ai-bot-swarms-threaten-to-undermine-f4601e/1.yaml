condition_status: unknown
early_resolution_rule: A verified implementation of the antecedent followed by a decisive 10,000-account adversarial result can resolve the claim without a deadline. A cheap successful bypass can contradict it; isolated failed attacks cannot establish prohibitive costs generally.
