evaluator_interpretation:
  - I read technological moat as a durable, difficult-to-reproduce capability advantage, rather than brand, distribution or financing.
  - The surrounding text identifies hallucinations and reasoning errors as the longstanding problems.
  - A solid answer means a demonstrated, broadly reliable solution; ordinary improvements need not constitute a solution, and perfection is not required.
  - I assess the ongoing state in March 2025 through publication. Earlier model evaluations are context rather than observations dated inside that period.
  - The tentative moat clause and firm reliability clause remain distinct; evidence for one does not establish both.
support_condition: Broad contemporary evaluations show continuing material hallucination and reasoning failures across leading providers, while longitudinal evidence shows no durable, hard-to-reproduce capability advantage.
contradiction_condition: A provider demonstrates either a durable technological advantage under the stated reading or a robust, general solution to the identified reliability problems.
measurement_requirements: Use broad, reproducible evaluations across providers and tasks. A leaderboard snapshot cannot measure durability, and isolated errors cannot establish that every proposed solution fails.
source_requirements: Prefer independent evaluations and technical reports with explicit methods, dates and limitations. Company evaluations can establish acknowledged limitations but not an exhaustive market conclusion.
