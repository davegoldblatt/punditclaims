explicit_source_elements:
  - Agents don’t work
  - They don’t work at all
  - a workflow where the LLM can make its own decisions
evaluator_interpretation:
  - Read the categorical statement as denying meaningful successful completion of intended tasks by LLM agents, using the functional definition given immediately afterward.
  - The surrounding discussion also criticizes autonomous replacement of entire jobs. Successful bounded tasks can contradict 'at all' without demonstrating whole-job replacement.
  - Use April–June 2025, the latest completed calendar quarter before the post, for this ongoing observation. The Salesforce benchmark invoked in context supplies contemporary measurements.
support_condition: Credible evaluations show no meaningful successful completion of intended tasks by the relevant agents.
contradiction_condition: A reproducible primary evaluation shows agents successfully completing intended tasks at a material rate, even if their reliability remains inadequate for unattended deployment.
measurement_requirements: Use agent task-success measurements, distinguish single-turn from multi-turn interaction, and do not equate either with the number of operational steps or an entire job.
source_requirements: Primary benchmark research with a defined task set, environment and evaluation method; demonstrations without an assessable success criterion are insufficient.
