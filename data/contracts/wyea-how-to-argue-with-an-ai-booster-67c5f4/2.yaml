assessment_axis: historical_observation
explicit_source_elements:
  - Agents don't work!
  - They don't work at all.
  - said in reply to 'Agents will automate large parts-'
  - "'agent' has now become a mythical creature that means 'totally autonomous AI that can do an entire job'"
  - "cites Salesforce research: ~58% success on single-step tasks, 35% on multi-step"
  - agents are not autonomous, they do not replace jobs
evaluator_interpretation:
  - "Read in context, 'don't work at all' is not a claim that agents never succeed at any task. The speaker himself cites 58% and 35% success rates in the same passage. The plain reading is that AI agents do not work as boosters describe them: they cannot reliably and autonomously complete multi-step work or do an entire job."
  - "Test: did the best available measurements before the post show agents failing to complete realistic multi-step professional tasks reliably and autonomously?"
  - "Target period: January 2025 to the post date (August 2025). This is the most recent state public evidence could report before the post."
support_condition: Independent or credible benchmark evidence from the period shows that leading agents fail a large share of realistic multi-step business or workplace tasks, well short of dependable autonomous job performance.
contradiction_condition: Credible evidence from the period shows that agents reliably and autonomously complete realistic multi-step professional work at high success rates, or do whole jobs.
measurement_requirements: Task-success rates on realistic multi-step or multi-turn agent benchmarks.
source_requirements: Peer-reviewed papers, preprints or benchmark reports from research groups. Vendor marketing does not count.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01
  end: 2025-08
  precision: month
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Taken literally, 'don't work at all' would be a zero-capability claim. The speaker's own cited figures (58%/35%) show he did not mean that.
  - No reliability threshold for 'working' is stated.
  - The target period is evaluator-chosen (the state at the post date).
retrospective_or_prospective: retrospective
