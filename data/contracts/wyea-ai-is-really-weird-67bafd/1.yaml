assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic is cherry-picking
  - four-week windows of API spend
  - pumped by big announcements and new model releases
  - annualizing them
evaluator_interpretation:
  - Cherry-picking means actual selective reporting of favorable measurement windows, rather than merely using a trailing four-week formula.
  - Selection could occur through choosing announcement dates even when the formula always uses the immediately preceding four weeks.
  - The relevant period is the February-to-early-April reporting sequence identified in the supplied context.
  - Overlap between a launch and a measurement window is insufficient by itself to establish selective reporting or a temporary uplift.
support_condition: Reporting-date choices, measurement windows, and revenue histories show that Anthropic selected launch-boosted periods to present unusually favorable annualized figures.
contradiction_condition: Comprehensive records establish a fixed, precommitted reporting schedule or another reporting practice incompatible with the alleged favorable-window selection.
measurement_requirements: Actual measurement dates, candidate alternative windows, API revenue histories, launch dates, and evidence explaining the reporting-date choices.
source_requirements: Company reporting records and financial data, or credible independent reporting establishing both the favorable-window effect and selection practice.
