explicit_source_elements:
  - OpenAI
  - a horrible business
  - burns money
  - a product that lacks any mass-market product market fit
evaluator_interpretation:
  - Horrible business is an evaluative characterization. The checkable components are cash consumption and the asserted absence of mass-market product-market fit.
  - The product is read as ChatGPT, OpenAI's public-facing consumer product.
  - For the ongoing state, use July through September 2024, the latest completed calendar quarter before publication. This period is selected from the post date, not from the results found.
  - Burns money is read as cash outflows exceeding operating cash inflows, rather than merely spending heavily.
  - Product-market fit ordinarily means substantial sustained demand and willingness to use or pay for a product. It does not require company-wide profitability.
  - The passage supplies no accounting basis, currency, or numerical threshold. The financial accounting basis is therefore unknown, which prevents a supported or contradicted financial verdict.
support_condition: Comparable cash-flow evidence establishes cash consumption during the target period, and demand evidence establishes the absence of substantial sustained mass-market demand.
contradiction_condition: Comparable financial evidence establishes that operations did not consume cash, or convincing usage and payment evidence establishes substantial sustained mass-market demand. Any overall verdict must respect the unspecified financial basis and distinguish the components.
measurement_requirements: Cash-flow evidence must distinguish operations from financing, accounting losses, and forecasts. Demand assessment should consider active use over time and paying adoption; retention evidence would strengthen it.
source_requirements: Prefer financial statements and primary usage disclosures. Reputable reporting may describe private figures, but projections and accounting losses cannot substitute for realized quarterly cash flow.
