explicit_source_elements:
  - 80% or more of Microsoft’s GPUs
  - taken up by OpenAI
  - some might now be taken up by Anthropic
  - fair to assume
evaluator_interpretation:
  - This is a numerical estimate of an existing allocation, despite the qualified wording.
  - Use January–March 2026, the latest completed reporting quarter before publication, for the otherwise unspecified current period.
  - Read 'taken up' as capacity allocated to OpenAI. Microsoft running OpenAI models for its own products does not automatically count as allocation to OpenAI.
  - The denominator is Microsoft's GPU fleet, including capacity it controls through rentals. Electrical power, revenue shares and normalized computing performance are not interchangeable with GPU counts.
  - The Anthropic qualification acknowledges uncertainty; it does not specify an alternative threshold.
support_condition: Comparable records show that OpenAI was allocated at least 80% of Microsoft's GPU fleet in the target period.
contradiction_condition: Comparable records show that OpenAI's allocation was below 80% in the target period.
measurement_requirements: A contemporaneous total GPU inventory and customer allocation breakdown, with consistent treatment of rented hardware, idle capacity, GPU generations and Microsoft-operated inference.
source_requirements: Microsoft allocation records, corroborated customer records, or an independent reconstruction with sufficient coverage and uncertainty bounds to distinguish the 80% threshold.
