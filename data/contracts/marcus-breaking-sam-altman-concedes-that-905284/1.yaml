assessment_axis: historical_observation
explicit_source_elements:
  - Hassabis is no longer on board either
  - nor are Sutskever and LeCun
  - Nadella and Pichai have also hinted at skepticism around scaling
  - insiders are losing faith in pure scaling
evaluator_interpretation:
  - The ordinary reading is about scaling existing AI methods alone being sufficient for AGI, not whether larger models can keep improving.
  - The first sentence attributes a rejection of that sufficient-route thesis to Hassabis, Sutskever and LeCun. The second requires only expressions of doubt from Nadella and Pichai.
  - Assess the public positions established before publication on 2026-03-16. Public statements have no regular reporting period, so the target covers the preceding public record through that date, with no invented starting date.
  - Treat statements that new research or breakthroughs are needed as evidence against scaling alone. Continued enthusiasm for scaling is compatible with that position.
  - The surrounding account of changing views also suggests a transition. An established skeptical position supports the stated position but does not establish a recent conversion.
support_condition: Public statements before publication establish that each of Hassabis, Sutskever and LeCun rejected scaling existing methods alone as sufficient for AGI, and that Nadella and Pichai expressed at least some doubt about its sufficiency. A claimed change of position additionally needs evidence of the earlier position.
contradiction_condition: A named leader's public statements materially conflict with the position attributed to him. In particular, explicitly retaining scaling alone as a live route to AGI contradicts an unqualified attribution of rejection. Continued belief that scaling improves models does not by itself contradict skepticism about sufficiency for AGI.
measurement_requirements: Compare each leader's own statements in context. Distinguish pretraining, scaling existing systems, new algorithms, and AGI sufficiency. Do not infer beliefs from infrastructure spending.
source_requirements: Prefer original interviews or transcripts available before publication. Use accessible reputable reporting when an original transcript cannot be obtained. Marcus's writing establishes the claim only.
