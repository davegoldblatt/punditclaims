evaluator_interpretation:
  - "Plain reading: in its recent fundraising, OpenAI has been agreeing to terms that favor investors (contingent tranches, guaranteed returns, seniority, downside protection) beyond ordinary equity terms."
  - No period was named. I read it as describing OpenAI's 2026 fundraising up to the post date (January 2026 to 2026-06-10), which covers the deals he mentions.
  - "'More and more' is read loosely: a run of new, unusually investor-friendly terms in recent deals. A strict measured increase compared with every earlier round is not required."
support_condition: Credible reports from early-to-mid 2026 show OpenAI giving investors unusual protective or sweetened terms, such as contingent tranches or guaranteed minimum returns.
contradiction_condition: Credible reports show that OpenAI's recent deals used plain equity terms without special investor protections, or that the reported sweeteners never existed or were withdrawn.
measurement_requirements: Reported financing terms of OpenAI deals in 2026 (Amazon investment and the private equity joint venture), ideally compared with what is typical.
source_requirements: Wire service or major business press reports of deal terms, or company filings. The speaker's own writing is excluded.
