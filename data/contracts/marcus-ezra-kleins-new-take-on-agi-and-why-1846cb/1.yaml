  - reliable ability to understand complex syntactic and semantic structure
  - Failings here are also often reflected in quirky errors
  - what we have
  - still missing a lot of prerequisites
evaluator_interpretation:
  - The normative statement about what AGI should do is not scored. Its context makes a descriptive assertion about contemporary systems.
  - The plain empirical reading is that contemporary general-purpose language models exhibit recurring errors on tasks requiring complex grammatical structure and meaning.
  - Often means a reproducible pattern across test cases, not a single unusual response. Marcus supplies no numerical reliability threshold.
  - For the ongoing state, use early-2025 evaluations available through the post date, January 1–March 5, 2025.
support_condition: Independent controlled evaluations of contemporary general-purpose models demonstrate recurring errors attributable to complex syntactic and semantic structure.
contradiction_condition: Independent evaluations establish reliable performance across the relevant structural phenomena and show that the alleged recurring failures do not reproduce.
measurement_requirements: Specify model versions, prompts, tasks, repeated trials, and scoring. Distinguish linguistic structure from general reading comprehension and from properties of embedding geometry.
source_requirements: Independent empirical research. The Murphy paper coauthored by Marcus can identify the intended phenomena but cannot establish that Marcus was right.
