assessment_axis: historical_observation
explicit_source_elements:
  - has spent nearly half a trillion dollars
  - between its capital expenditures and venture capital funding
  - combined revenue of the fucking smartwatch industry
  - Projected Big Tech Capital Expenditures in 2025 and revenue from AI
evaluator_interpretation:
  - Read this as a financial comparison, not a causal claim that every dollar of revenue was produced by the listed investment.
  - The surrounding calculation identifies 2025 as the main comparison year, although its venture-funding inputs also include the second half of 2024.
  - The ordinary reading is approximately $500 billion of capital spending plus venture funding, compared with annual generative-AI revenue of roughly the same scale as annual smartwatch revenue.
  - Do not silently equate expenditure plans with completed spending or annualized revenue with revenue earned during a year.
  - No numerical tolerance for 'nearly' or 'combined revenue of' is supplied; a borderline result would remain interpretation-dependent.
support_condition: Comparable records establish capital expenditures plus venture funding reasonably close to $500 billion for the stated scope and periods, and annual generative-AI revenue comparable to smartwatch revenue on a consistent basis.
contradiction_condition: A sufficiently complete comparison establishes that either the spending total or the relative revenue scale is materially inconsistent with the claim.
measurement_requirements: Identify the companies, distinguish AI-specific from total company capex, separate forecasts from completed flows, disclose fiscal-year differences, and avoid mixing annual revenue with run rates. Explain any overlapping financing and revenue flows.
source_requirements: Company expenditure disclosures, a documented venture-funding dataset, and revenue estimates with accessible methods and matching industry definitions.
metric_scope:
