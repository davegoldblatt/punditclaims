explicit_source_elements:
  - The only companies
  - currently profiting
  - from the AI gold rush
  - those selling shovels
evaluator_interpretation:
  - Shovels means chips, cloud compute and supporting infrastructure, following the examples in the post.
  - The plain reading concerns positive financial profit attributable to AI activity, not merely revenue, funding or share-price gains.
  - "For current financial performance, use the latest completed calendar reporting quarter normally public before the post: October–December 2023. Different fiscal calendars remain a limitation."
  - The broad industry claim supplies no common accounting basis. Examples of individual companies' earnings do not establish one for every AI business.
support_condition: Comparable financial records establish profits for infrastructure suppliers and no positive AI-attributable profits among model developers, application sellers or adopters in the target period.
contradiction_condition: At least one non-infrastructure company has documented positive AI-attributable profit in the target period on the applicable accounting basis.
measurement_requirements: Separate profit from revenue and cash flow, identify the accounting basis, and attribute the result to AI rather than unrelated operations.
source_requirements: Prefer filings or explicit company financial disclosures. Private-company profitability reports require a clear period and definition.
