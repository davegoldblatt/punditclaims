assessment_axis: causal_assessment
explicit_source_elements:
  - otherwise be isolated by their incompetence
  - feign enough intelligence to get by
  - lowering the quality of code being shipped
evaluator_interpretation:
  - The plain reading is that LLMs conceal inadequate engineering ability, allowing people who would otherwise fail workplace checks to contribute production code, thereby reducing its quality.
  - Inadequate ability means failing independently assessed requirements for the relevant work. Being junior or unfamiliar with one library is not itself incompetence.
  - Getting by means passing hiring, performance or review checks. Shipped code means deployed or released code, rather than a laboratory exercise.
  - The claim does not require proof of deliberate deception by each engineer.
support_condition: Evidence links independently measured low baseline competence to LLM-enabled passage through workplace checks and then to worse released-code outcomes than an appropriate comparison group.
contradiction_condition: Comparable evidence shows that LLM-enabled contributions from the specified low-competence group maintain or improve released-code quality, without the proposed concealment mechanism.
measurement_requirements: Measure baseline competence before AI use, subsequent passage through workplace checks, and defects or vulnerabilities in released code. Separate skill, seniority, task difficulty and review practices.
source_requirements: Prefer longitudinal workplace studies or controlled experiments with production follow-up. Learning quizzes, anecdotes and output counts alone are insufficient.
