explicit_source_elements:
  - OpenAI lost $5 billion
  - after $3.7 billion in revenue
  - Anthropic just under $3 billion in 2024
evaluator_interpretation:
  - Assess calendar-year 2024 results, not whether these figures appeared in earlier forecasts.
  - Read the figures as rounded amounts and as separate company figures, not a combined total.
  - The ordinary reading of 'lost' is a company-wide loss after revenue. However, the cited reporting mixes loss estimates and projected cash burn; it does not establish a common accounting definition.
  - The single metric_scope object describes the bundled claim. Each evidence item separately identifies its company and financial measure.
support_condition: Completed-year evidence confirms all three amounts on the financial definitions underlying the claim, allowing ordinary rounding.
contradiction_condition: Completed-year evidence measuring the same financial quantity on the same accounting basis materially differs from a stated amount.
measurement_requirements: Distinguish revenue, net loss, operating loss and cash burn. Reconcile exclusions and adjustments before comparing figures. Forecasts alone do not establish completed-year results.
source_requirements: Prefer financial statements. Independently verified reporting on private financial records is acceptable when those records are unavailable.
