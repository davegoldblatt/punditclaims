evaluator_interpretation:
  - We have means the publicly available scientific record.
  - A solid test means a documented evaluation of the December o3 system without ARC-specific training.
  - The human-comparability phrase motivates the requested control; it does not assert that removing ARC training would equalize every aspect of human and model experience.
  - "The ongoing state is assessed over the latest relevant reporting interval: the December 20 announcement through the December 22 post."
support_condition: The public evaluation record lacks an ARC-untrained result, and evaluator statements or contemporaneous scrutiny confirm that the effect of ARC-specific training remains unmeasured.
contradiction_condition: A reliable ARC evaluation of the relevant system without ARC-specific training was publicly available by December 22, 2024.
measurement_requirements: A documented score, identified model version, evaluation tasks, inference settings, and disclosure that ARC-specific training was excluded.
source_requirements: Prefer the evaluator's report and contemporaneous records. Later publications may clarify historical facts but cannot make a result public retroactively.
