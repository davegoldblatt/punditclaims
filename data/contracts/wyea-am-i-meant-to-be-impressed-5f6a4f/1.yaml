assessment_axis: historical_observation
explicit_source_elements:
  - At the current rate of sales
  - six months to install a quarter’s GPUs
  - there are warehouses of these things
evaluator_interpretation:
  - The ordinary reading concerns NVIDIA data-center GPUs, rather than consumer graphics cards.
  - Six months per quarter's sales describes installation throughput running at approximately half shipment throughput, rather than merely a six-month delivery-to-installation delay.
  - Warehouse accumulation means sold GPUs awaiting deployment beyond ordinary transit and assembly inventory.
  - Use January–March 2026, the latest completed calendar quarter before publication, as the common measurement period. Zitron did not identify a fiscal quarter.
support_condition: Comparable shipment and commissioning data show that deploying one quarter's sold GPUs requires approximately six months at prevailing installation throughput, with corroborated accumulation of uninstalled units.
contradiction_condition: Comparable data show installation throughput materially inconsistent with the claimed two-to-one ratio, or comprehensive inventory records contradict the claimed accumulation.
measurement_requirements: Match geography, GPU generations, unit definitions, reporting periods, and commissioning status. Revenue, announced power capacity, and construction spending cannot substitute directly for GPU counts.
source_requirements: Shipment records and operator or ODM installation and inventory records, or independent measurements reconciling those records.
