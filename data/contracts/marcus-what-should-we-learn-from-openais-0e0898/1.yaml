assessment_axis: historical_observation
explicit_source_elements:
  - Regulatory capture is the default
  - mosts governments, however well-intentioned, aren’t expert enough
  - lobbying runs deep and at many levels
evaluator_interpretation:
  - The surrounding discussion makes AI regulation the subject.
  - "I read 'the default' as the usual pattern: industry interests routinely displace the public purposes of AI regulatory institutions or decisions. Lobbying or advisory membership alone does not establish capture."
  - The claim describes an ongoing state without a reporting period. I use a snapshot as of the post date, 2024-05-26, because regulatory institutions have no standard reporting quarter. Earlier records and later retrospective research can inform that snapshot.
  - Marcus supplies no jurisdictions, denominator, or numerical threshold. Establishing the usual pattern requires representative evidence, rather than selected examples.
support_condition: Representative evidence establishes that capture was the usual pattern across AI regulatory institutions or decisions as of 2024-05-26.
contradiction_condition: Representative evidence establishes that AI regulatory institutions or decisions usually retained independence from industry interests as of 2024-05-26.
measurement_requirements: Identify a defensible population of institutions or decisions and assess representative cases. Distinguish industry access and influence from displacement of public purposes.
source_requirements: Prefer primary institutional records and systematic empirical research. Individual cases can provide context but cannot alone establish prevalence.
