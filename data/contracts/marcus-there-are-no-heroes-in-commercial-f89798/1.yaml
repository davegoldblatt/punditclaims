ambiguity_flags:
  - The deadline is incorporated from the identified op-ed rather than repeated by Marcus.
  - Smarter has no specified measurement.
  - Most fields has no supplied taxonomy or weighting.
  - Nobel-caliber performance is not equivalent to answering expert-level examination questions.
