assessment_axis: causal_assessment
explicit_source_elements:
  - as far as I can tell
  - running it is so costly
  - OpenAI hasn’t yet even turned a profit
evaluator_interpretation:
  - The plain reading is company-wide unprofitability, with generative-AI operating costs materially contributing to losses. Those costs need not be the sole cause.
  - For the ongoing financial state, use calendar 2023, the latest completed annual period before the February 2024 post. Marcus specified neither a reporting period nor quarterly accounts.
  - The word 'yet' additionally implies no earlier profitable reporting period; an annual loss alone cannot establish that broader history.
  - "'As far as I can tell' qualifies his confidence; it is not a conditional antecedent."
  - Marcus identifies no financial source or accounting basis. The contract therefore retains accounting_basis unknown.
support_condition: Comparable company-wide financial records establish unprofitability for the target period and the asserted earlier history, while cost records show that running generative AI materially contributed to those losses. The accounting basis must be established before a supported score is permitted.
contradiction_condition: Comparable records establish a profitable period before publication, or demonstrate that the asserted operating costs did not materially contribute to the losses. The accounting basis must be established before a contradicted score is permitted.
measurement_requirements: Company-wide bottom-line profit or loss, with a reconciliation of revenue, inference costs, training costs, compensation, and other expenses. Revenue run rate, cash burn, and operating loss cannot substitute for net profit.
source_requirements: Prefer financial statements and cost disclosures. Credible reporting based on financial records may help, but must identify the period, financial measure, and accounting treatment.
