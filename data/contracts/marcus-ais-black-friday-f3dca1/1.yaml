  - an American AI company that is partly owned by the US Government
  - Europe and Asia are not going to trust
  - companies like OpenAI
  - maybe even Google
  - Just the way the US doesn't trust Huawei
evaluator_interpretation:
  - The antecedent is that the US government actually takes an ownership stake in OpenAI (or Google).
  - "The plain outcome reading: after such a stake, European and Asian governments or major buyers would treat OpenAI the way the US treats Huawei, through restrictions, procurement exclusions or bans. The Google part is hedged with 'maybe' and is not scored."
support_condition: After a US government stake in OpenAI is completed, European or Asian governments restrict, ban or exclude OpenAI from procurement on trust or security grounds, in a Huawei-like way.
contradiction_condition: After a completed stake, Europe and Asia keep adopting and buying OpenAI products with no Huawei-like restrictions over a reasonable period.
measurement_requirements: First, proof that the stake was completed. Then government policy, procurement or regulatory actions in Europe and Asia aimed at OpenAI.
source_requirements: Official government actions or reputable news reports.
