  - Europe and Asia do not specify countries, institutions or populations.
  - The Huawei comparison does not specify particular restrictions.
  - Companies like OpenAI leaves the wider company class unspecified.
  - Google is included only tentatively.
  - No deadline or duration is stated.
  - The ownership condition comes from the surrounding passage.
