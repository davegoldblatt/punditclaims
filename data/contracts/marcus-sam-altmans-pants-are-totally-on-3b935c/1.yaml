explicit_source_elements:
  - Altman was
  - launching a full court press for loan guarantees
  - likely in conjunction with Nvidia
  - seemed to be laying groundwork for a bailout
evaluator_interpretation:
  - The firm core is that Altman was undertaking a concerted effort to obtain federal loan guarantees during the late-October and early-November controversy.
  - Read 'full court press' ordinarily as multiple deliberate, related efforts, led or approved by Altman; no numerical lobbying threshold is imposed.
  - Nvidia coordination is explicitly hedged. It is assessed as a possible explanation, not treated as an established fact or a prerequisite for grading the firm core.
  - The target window covers the preceding week or two and the events immediately before the post.
  - This concerns lobbying conduct, not the amount or accounting treatment of a financial obligation.
support_condition: Documents or credible testimony establish multiple related efforts led or approved by Altman to obtain federal loan guarantees during the target period.
contradiction_condition: Reliable records affirmatively disprove the alleged concerted effort or establish that the cited activities were unrelated to seeking federal loan guarantees.
measurement_requirements: Distinguish public discussion, general industrial-policy advocacy, and actual coordinated efforts to secure guarantees. Establish Altman's involvement rather than infer it solely from his title.
source_requirements: Company submissions, contemporaneous communications, meeting records, original remarks, or independently sourced reporting.
