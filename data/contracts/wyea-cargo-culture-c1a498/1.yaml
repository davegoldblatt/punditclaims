assessment_axis: causal_assessment
explicit_source_elements:
  - popularity” of AI
  - entirely from social pressure and endlessly-discounted access
  - the very second that they charged the actual costs
  - customers started freaking out
  - whether AI has ROI
evaluator_interpretation:
  - The context primarily concerns generative AI products, particularly coding tools. Popularity means adoption and continued use.
  - "Entirely is an exclusive causal assertion: practical usefulness or other independent drivers must not contribute to adoption."
  - The very second is read as a prompt customer response, not a literal second-by-second deadline.
  - Actual costs means prices covering the relevant provider costs. A switch to published API prices does not by itself establish this.
  - The second clause asserts that a pricing event happened; it is not treated as a conditional forecast.
support_condition: Credible causal evidence attributes adoption exclusively to social pressure and discounted access, and dated records establish prompt ROI objections following verified cost-covering prices.
contradiction_condition: Credible evidence establishes an independent adoption driver within the claimed product scope, or directly refutes the asserted cost-covering pricing event and customer response. Evidence of usefulness alone does not establish an adoption cause.
measurement_requirements: Separate adoption causes from productivity effects. Identify the actual pricing change, provider cost basis, affected customers and timing of ROI objections.
source_requirements: Prefer causal adoption studies, documented pricing histories, provider cost records and attributable customer responses.
