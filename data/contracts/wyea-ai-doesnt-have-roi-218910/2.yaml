explicit_source_elements:
  - nobody can show you the ROI from AI
  - AI does not have a return on investment
evaluator_interpretation:
  - "Plain reading: spending on AI (mainly LLMs and generative AI, given the context) does not yield measurable returns. Credible measured or reported positive returns would count against it. Widespread failure to realize returns would count in its favor."
  - He names no period for this ongoing state. I use January 2025 to the post date (2 June 2026), the span of the main enterprise ROI surveys before the post. It is not limited to one quarter.
  - Self-reported executive surveys count as evidence, but they are weaker than audited figures.
support_condition: Credible studies or disclosures show that firms deploying AI generally fail to get returns that exceed costs, and none can document positive returns.
contradiction_condition: Credible studies or company disclosures document positive returns from AI investments for a meaningful share of firms.
measurement_requirements: Enterprise surveys of measured AI returns; company disclosures of AI cost and benefit.
source_requirements: Consultancy or academic surveys, company statements, reputable news.
