explicit_source_elements:
  - It’s now very clear
  - “inference is profitable”
  - “most compute is being used for training”
  - myths are dead
  - Anthropic
evaluator_interpretation:
  - "The ordinary reading rejects two propositions: inference earns more than it costs to serve, and training consumes more than half of compute."
  - The immediate example is Anthropic, while the wording generalizes to AI labs. Anthropic is therefore the minimum relevant company scope; industry-wide conclusions require broader evidence.
  - For this ongoing observation without a named reporting period, use January through March 2026, the latest completed calendar quarter before publication.
  - Profitability requires matched inference receipts and serving costs. Company-wide net losses do not establish inference losses.
  - Compute means computational resources used, not automatically expenditure. Research expense also need not consist entirely of training.
support_condition: Matched evidence establishes that inference was not profitable and that training used no more than half of compute in the relevant company scope and target quarter.
contradiction_condition: Matched evidence establishes positive inference profit or a training share above half. A mixed result requires direct evidence settling the two components in opposite directions.
measurement_requirements: Quarter-specific inference revenue and serving costs on a consistent basis, plus training-versus-inference allocation measured in comparable computational units.
source_requirements: Company financial and workload disclosures or independently documented measurements. Compute purchases alone cannot establish either conclusion.
