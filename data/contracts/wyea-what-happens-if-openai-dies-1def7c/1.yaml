explicit_source_elements:
  - SoftBank can quite literally not afford to invest anything further
  - a $10 billion loan
  - collateralized by its entire OpenAI holdings
evaluator_interpretation:
  - The assessed proposition concerns SoftBank Group, including its financing subsidiaries. The separate attribution to Jensen Huang is outside the normalized proposition supplied for grading.
  - Afford means capacity to finance additional OpenAI investment while meeting existing obligations. Borrowing alone does not establish incapacity.
  - Further investment means investment beyond existing commitments; fulfilling an already announced tranche is not sufficient to refute that reading.
  - For ongoing financial capacity, the reference period is the latest reported quarter before publication, April–June 2026. Because this bundled claim also expressly describes a subsequent loan, the single target interval includes subsequent events through August 18.
  - "The loan amount is company-reported: the post's linked news article attributes its information to SoftBank's financial report. Affordability remains a separate qualitative inference."
support_condition: Financial records establish no capacity for additional OpenAI investment, and transaction records establish $10 billion borrowed with the entire OpenAI holding pledged as collateral.
contradiction_condition: Records establish usable capacity for additional investment, or transaction records disprove the claimed borrowing amount or pledge of the entire OpenAI holding. A mixed outcome is appropriate if distinct factual components are supported and contradicted.
measurement_requirements: Separate executed borrowing from an undrawn facility, pledged collateral from valuation-linked covenants, and additional investment capacity from existing commitments. Assess liquidity against obligations rather than treating gross asset value as spendable cash.
source_requirements: SoftBank financial disclosures and financing documents; reliable reporting may supplement them.
