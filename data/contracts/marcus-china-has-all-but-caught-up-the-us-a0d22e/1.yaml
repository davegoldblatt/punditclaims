explicit_source_elements:
  - lack of a technical moat
  - companies like OpenAI
  - remain unprofitable
  - That’s basically what has happened.
evaluator_interpretation:
  - The surrounding retrospective assertion makes this a claim about what happened from January 2025 through publication, rather than an indefinite new forecast.
  - OpenAI is the named test case; 'companies like' does not establish a universal claim about every frontier lab.
  - Unprofitable ordinarily means company-wide net losses, not cash burn or operating losses alone.
  - The absence of a technical moat must materially explain the losses. Coexistence of competition and losses is insufficient.
  - No financial source or accounting basis is identified in the supplied passage, so the contract's accounting basis remains unknown.
support_condition: Comparable realized net-loss records establish continued unprofitability, and evidence identifies weak technical differentiation as a material cause after considering development spending, growth investment and accounting charges.
contradiction_condition: Comparable records establish sustained net profitability during the claimed continuation, or credible causal evidence rules out the asserted material contribution of weak technical differentiation.
measurement_requirements: Company-wide realized net income on a consistent accounting basis, together with evidence connecting competitive substitution or pricing pressure to losses.
source_requirements: Financial statements where available; clearly identified reporting on private-company accounts otherwise. Causal evidence must go beyond benchmark similarity and reported losses.
