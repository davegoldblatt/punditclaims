assessment_axis: forecast_outcome
explicit_source_elements:
  - The AI bubble
  - will eventually pop
evaluator_interpretation:
  - Treat the sentence as an undated forecast that the AI investment boom will collapse.
  - In the surrounding post, the relevant boom centers on US hyperscalers and AI developers and their wider investment ecosystem.
  - Popping means a broad, severe valuation collapse with substantial financing or investment disruption.
  - A regional correction is relevant evidence but does not automatically establish collapse of the broader boom described.
  - The word bubble is the speaker's characterization, not independent proof of the forecast.
support_condition: Dated evidence establishes a broad severe collapse in valuations and financing or investment across the relevant AI boom.
contradiction_condition: No finite period without a collapse disproves an eventual prediction. Contradiction would require a terminal event making the predicted collapse impossible under the same reading.
measurement_requirements: Consistent measures of representative AI valuations, funding, and investment, distinguishing regional episodes from the broader ecosystem.
source_requirements: Prefer original market and funding data. Reputable reporting can establish events where primary records are unavailable, with its limitations stated.
metric_scope: null
original_horizon: eventually
horizon_interval:
  start: 2026-05-26
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a dated broad collapse meeting the support condition. A regional selloff or isolated business failure is insufficient by itself.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Eventually supplies no deadline.
  - Bubble and pop have no numerical definitions.
  - Geographical scope is inferred from the surrounding discussion.
  - A regional interpretation could produce a different assessment.
retrospective_or_prospective: retrospective
