assessment_axis: causal_assessment
explicit_source_elements:
  - The deaths that follow
  - will be a direct result
  - those who choose to continue to lie
  - what an LLM does
evaluator_interpretation:
  - The surrounding passage attributes future deaths in military operations to deceptive capability claims that induce reliance on LLMs.
  - Direct result requires a documented causal chain from a materially false capability claim to military reliance and then to deaths. Deployment, inaccurate outputs and deaths occurring together are insufficient.
  - Lying implies knowing deception; an inaccurate prediction or an honestly mistaken capability statement does not establish it.
  - I retain the causal axis because attribution is the central assertion. There is no stated deadline or explicit antecedent.
support_condition: A credible investigation documents materially false capability statements made knowingly, military decision-makers' reliance on those statements, and a resulting lethal decision that would materially differ without that reliance.
contradiction_condition: A sufficiently complete investigation of the deaths covered by the assertion establishes that the alleged deceptive statements did not cause the relevant reliance or lethal decisions. One unrelated incident cannot disprove every possible future case.
measurement_requirements: Identify the statements, speakers, evidence of knowledge, recipients, operational decisions, deaths and competing causal explanations.
source_requirements: Prefer released investigations, operational records, court findings and attributable testimony. News accounts of unreleased investigations can provide context but cannot substitute for the missing causal links.
