assessment_axis: historical_observation
explicit_source_elements:
  - these six million Blackwell GPUs
  - they certainly haven’t gone into data centers that are powered and turned on
  - many of which aren’t even online
  - tens of thousands
evaluator_interpretation:
  - The surrounding passage acknowledges some deployed Blackwell GPUs. The ordinary contextual reading concerns the shipment cohort as a whole, rather than asserting that zero Blackwell GPUs operate.
  - Support requires affirmative evidence of a material undeployed portion. An incomplete public list is not evidence that undisclosed deployments do not exist.
  - For this ongoing state, November 2025 is used as the latest completed calendar month before publication. There is no common reporting calendar for deployment inventories.
  - The shipment count must be reconciled across GPU dies, physical accelerator packages and rack configurations.
support_condition: Shipment-linked inventories or commissioning records show that a material portion of the identified six-million shipment cohort had not reached powered, operating data centers in the target period.
contradiction_condition: A sufficiently complete reconciliation shows that substantially the whole identified shipment cohort was installed in powered, operating data centers in the target period.
measurement_requirements: Identify the shipment cohort, counting unit, recipients, installed quantities and commissioning status. Avoid double-counting announcements, racks, dies and packages.
source_requirements: Operator commissioning records, shipment-linked inventories or a credible comprehensive deployment census. Announcements of planned capacity are insufficient.
