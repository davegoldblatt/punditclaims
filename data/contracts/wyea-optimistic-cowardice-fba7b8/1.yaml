assessment_axis: historical_observation
explicit_source_elements:
  - does not anticipate being profitable until 2030
  - does not have any explanation
  - other than “we will build Stargate”
evaluator_interpretation:
  - This is an observation about OpenAI's expectations and explanations at publication, not a prediction that profitability will actually arrive in 2030.
  - The plain reading concerns company-wide profitability and a stated commercial route to it. A plan can count as an explanation without proving it will succeed.
  - Use the first quarter of 2025 through March 24 as the current reporting window for the expectations described. Earlier plans matter only if shown still applicable.
  - The surrounding context relies on press reporting of internal projections, so their basis is estimate.
  - Do not substitute a cash-flow breakeven date for a net-profit date.
support_condition: Contemporaneous projections identify 2030 as the first profitable year, and sufficiently complete descriptions of the plan establish that Stargate is its only explanation.
contradiction_condition: Contemporaneous projections identify an earlier first profitable year on the same basis, or contemporaneous records describe another substantive route to company-wide profitability.
measurement_requirements: Identify the profitability measure, the date and version of the projection, and its revenue, margin, and cost assumptions.
source_requirements: Dated company projections or independently reported internal documents and management explanations applicable on March 24, 2025.
