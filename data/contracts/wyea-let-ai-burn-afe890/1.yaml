explicit_source_elements:
  - said demand can’t be that large
  - 50% of hyperscaler RPOs are from Anthropic and OpenAI
  - inflating obligations by $448 billion
evaluator_interpretation:
  - The numerical proposition is that OpenAI and Anthropic together account for approximately half of the relevant hyperscalers' outstanding performance obligations, totaling approximately USD 448 billion.
  - The surrounding discussion names Microsoft, Amazon, and Google. I use those as the provisional comparison set, while preserving the uncertainty about whether another set was intended.
  - "For this ongoing financial observation, I use March 31, 2026: the latest common quarter-end ordinarily covered by public quarterly reports before July 7. This is a stock of outstanding obligations, not quarterly revenue."
  - The supplied passage does not identify whether the combined customer attribution is company-reported or an external estimate. The contract's accounting basis therefore remains unknown.
  - Not large has no numerical demand threshold. Concentration alone does not establish that the remaining absolute demand is small, or distinguish AI compute from other cloud services.
support_condition: A reconciliation for the same date, company set, accounting treatment, and contract scope establishes approximately USD 448 billion of recognized outstanding obligations attributable to the two customers and approximately a 50% share. Separate evidence establishes the claimed small scale of other compute demand.
contradiction_condition: A matching reconciliation establishes a materially different customer amount or share, or comparable evidence establishes substantial other compute demand under an identified threshold. No supported or contradicted score is permitted while the contract's accounting basis remains unknown.
measurement_requirements: Identify the denominator and customer-attributable numerator at the same date. Distinguish remaining obligations from announced total deal values, revenue, financing, and unrecognized contingent commitments; distinguish cloud-wide backlog from AI-compute demand.
source_requirements: Hyperscaler filings and customer-attribution disclosures, supplemented by clearly identified estimates where primary customer breakdowns are unavailable.
