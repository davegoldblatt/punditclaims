assessment_axis: causal_assessment
explicit_source_elements:
  - has now sold
  - at least $200 billion dollars’ worth of GPUs
  - multiple gigawatts-worth
  - have yet to be ingested by the market
  - through their obfuscation of operational capacity and refusal to disclose AI revenues
  - helped create one of the largest speculative asset bubbles in history
evaluator_interpretation:
  - The surrounding discussion makes not yet ingested mean sold GPUs not yet installed and operational, including equipment awaiting power.
  - The $200 billion threshold is a stock valued at original GPU sales prices, not all data-center construction spending or NVIDIA’s unsold inventory.
  - Now refers to September 22, 2026, the post date.
  - The full claim also requires a causal contribution from disclosure practices to speculative investment. Large spending alone does not establish an asset bubble.
  - The historical ranking of the alleged bubble has no supplied comparison measure and cannot be scored separately with confidence.
support_condition: A reconciled inventory establishes at least $200 billion of sold NVIDIA GPUs still nonoperational on the post date, with associated multi-gigawatt requirements. Investment evidence must also connect misleading or withheld disclosures to a historically exceptional speculative overvaluation.
contradiction_condition: A sufficiently complete inventory puts the value of sold but nonoperational NVIDIA GPUs below $200 billion. A separately decisive causal analysis could also disprove the alleged role of disclosure practices; isolated examples of working GPUs would not suffice.
measurement_requirements: Match shipments and sales prices to buyer inventories, installation and energization dates. Exclude buildings, land, networking, other manufacturers’ equipment and unsold NVIDIA stock. Distinguish ordinary construction delays from speculative overvaluation.
source_requirements: Supplier and buyer records reconciled across the market, supplemented by deployment audits and evidence of how disclosures influenced investment decisions.
