explicit_source_elements:
  - I'd bet money
  - ChatGPT was trained
  - multiple Axel Springer publications
  - anything else it could find publicly-available on the web
evaluator_interpretation:
  - This expresses confidence about past training, not a conditional forecast.
  - Multiple means at least two publications. ChatGPT means a model underlying the service before the post.
  - The web language ordinarily means broad collection of accessible material, not literally every public webpage.
  - The target is training completed before publication. No earliest training date is supplied.
  - The Times lawsuit is background, not evidence that Axel Springer publications were used.
support_condition: Model-specific disclosures, authenticated training records, or reliable extraction evidence establish prior training on at least two Axel Springer publications and broad public-web material.
contradiction_condition: Comprehensive, reliable provenance establishes that the relevant ChatGPT models had not trained on content from at least two Axel Springer publications.
measurement_requirements: Distinguish actual training from crawling, inclusion in a possible source corpus, licensing permission, and retrieval during a conversation.
source_requirements: Prefer training records, company disclosures, or authenticated litigation evidence. A licensing announcement alone cannot establish earlier use.
