explicit_source_elements:
  - Very little of what has been tried has been discussed explicitly
  - companies are often quite closed
  - because
  - the public science of neurosymbolic AI is greatly impoverished
evaluator_interpretation:
  - The plain reading is that withheld company methods substantially reduced publicly available, reproducible knowledge of neurosymbolic AI by the post date.
  - Opacity alone does not establish the asserted size or cause of the research deficit.
  - A public paper is evidence of disclosure, but does not establish that all attempted methods or necessary replication details were disclosed.
  - I do not invent numerical thresholds for very little or greatly.
support_condition: Evidence identifies withheld neurosymbolic methods and shows that their withholding substantially obstructed replication, comparison, or public research progress.
contradiction_condition: Broad disclosure and replication evidence establishes that company withholding did not materially restrict public neurosymbolic knowledge.
measurement_requirements: A defensible inventory of disclosed and withheld methods, plus documented effects on research or replication and consideration of alternative causes.
source_requirements: Primary transparency audits, company methodological disclosures, and independent replication or research-impact studies specific to neurosymbolic methods.
