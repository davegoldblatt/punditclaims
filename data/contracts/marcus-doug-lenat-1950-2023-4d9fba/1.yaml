explicit_source_elements:
  - sometimes see an illusion of common sense
  - depending on the vagaries of what the training set is
  - the precise wording of a question
  - something is obviously still missing
evaluator_interpretation:
  - "Read illusion behaviorally: apparently competent answers do not establish robust commonsense generalization. This is not a claim about consciousness."
  - "Retain both stated dependencies: question wording and training-data composition or patterns. Wording sensitivity alone does not settle the full claim."
  - Evidence of dependence on training data must go beyond the trivial fact that models are trained on data.
  - Use 2023 through publication as the contemporary evaluation period; the source names no narrower period or reporting cycle.
support_condition: Contemporary evaluations demonstrate apparently successful commonsense performance that is unreliable under equivalent wording and establish a relevant dependence on training-data composition or artifacts.
contradiction_condition: Controlled evaluations establish robust commonsense generalization across equivalent wording and relevant training-distribution changes, undermining the proposed explanation of apparent competence.
measurement_requirements: Separate correctness, paraphrase robustness, and training-data effects. Attribute effects to training data only with controlled comparisons or comparably strong evidence.
source_requirements: Primary robustness evaluations plus studies that identify or manipulate relevant training data. Speculation about undisclosed training corpora is insufficient.
