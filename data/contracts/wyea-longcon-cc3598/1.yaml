assessment_axis: forecast_outcome
explicit_source_elements:
  - when this all falls apart
  - I believe it will
  - a very public reckoning
  - for the tech industry
evaluator_interpretation:
  - This is a joint prediction that the generative AI boom will collapse and that its collapse will produce a prominent public reckoning.
  - The explicit assertion that it will fall apart makes collapse part of the prediction, rather than an external antecedent whose absence makes the whole claim unscorable.
  - The plain reading of falls apart is a broad, sustained breakdown of the boom, evidenced across financing, valuations, investment activity, or major business failures. A single failed company or market correction is insufficient.
  - A very public reckoning means prominent accountability proceedings or sustained industry-wide scrutiny explicitly responding to that breakdown. It need not result in criminal convictions.
  - No deadline or required lag between collapse and reckoning is stated.
support_condition: A documented broad collapse of the generative AI boom is followed by prominent public accountability proceedings or sustained scrutiny of the tech industry explicitly tied to that collapse.
contradiction_condition: A clearly completed collapse and aftermath establish that the asserted public reckoning did not occur. Continued growth, an isolated setback, or the absence of proceedings by an arbitrary date cannot contradict this undated prediction.
measurement_requirements: Establish the breadth and persistence of the collapse using multiple indicators. Date the subsequent public proceedings or scrutiny and establish their connection to the collapse, rather than to unrelated product harms.
source_requirements: Market and investment records, company disclosures, and insolvency records for collapse; legislative, regulatory, court, or other public records for accountability. Reputable reporting may document sustained public scrutiny. Evidence must have been available by 2026-10-28.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated broad collapse followed by prominent public accountability or sustained industry-wide scrutiny explicitly caused by it can settle support. Public hearings without the collapse, or a collapse without the subsequent reckoning, cannot settle the joint prediction.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Falls apart has no numerical threshold or specified breadth.
  - Very public reckoning does not specify a forum, sanction, or duration.
  - No interval between collapse and reckoning is stated.
  - When could be read conditionally in isolation, but the speaker explicitly predicts the antecedent.
retrospective_or_prospective: retrospective
