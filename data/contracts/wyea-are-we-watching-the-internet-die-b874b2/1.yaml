assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI
  - a terribly-flawed and unprofitable way
  - feed the growth-at-all-costs tech engine
evaluator_interpretation:
  - The ordinary empirical reading is that commercial generative AI had material reliability problems and its providers were not earning an overall profit.
  - The target is the commercial activity generally. OpenAI or Anthropic can provide examples but cannot alone establish an industry-wide result.
  - For the ongoing profitability assertion, use calendar 2023, the latest completed annual business period before publication. The speaker supplies no reporting cadence; this annual-period choice is an interpretation.
  - Unprofitable means overall profit after costs, rather than negative gross margin or cash consumption alone.
  - The speaker cites no financial figures or accounting framework in this passage, so the accounting basis remains unknown.
  - Terribly flawed and growth-at-all-costs contain judgments that financial statements and error measurements cannot fully settle.
support_condition: Comparable records for the target period establish that commercial generative AI generally failed to earn an overall profit, while representative evaluations establish material product failures.
contradiction_condition: Comparable records establish general profitability, or representative evaluations defeat the asserted material reliability problems. A profitable parent company or isolated successful task is insufficient.
measurement_requirements: Comparable realized revenue and total costs for generative AI activities, with disclosed accounting treatment and representative coverage; product evaluations must specify models, tasks, and failure rates.
source_requirements: Prefer financial filings and separately reported business results, plus controlled evaluations. Estimates must be identified and cannot silently substitute for an unspecified accounting basis.
