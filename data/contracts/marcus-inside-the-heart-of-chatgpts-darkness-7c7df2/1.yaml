evaluator_interpretation:
  - The ordinary testable reading is that users could bypass ChatGPT's safeguards through prompting and obtain content those safeguards normally refused.
  - Skin deep is treated as a statement about behavioral robustness, not a measurable claim about consciousness or moral understanding.
  - Use February 1–11, 2023, because current refers to the service discussed alongside examples from that week.
support_condition: A contemporaneous independent test documents a prompt-based bypass that elicits restricted violent or otherwise harmful content from ChatGPT.
contradiction_condition: Reliable contemporaneous replication disproves the alleged harmful outputs, supported by adversarial testing showing the described bypasses ineffective.
measurement_requirements: A dated test identifying the service, bypass method, ordinary refusal, and resulting output. Distinguish policy circumvention from demonstrated real-world harm.
source_requirements: Prefer direct experiments or demonstrations. A news organization's own contemporaneous test is acceptable evidence.
