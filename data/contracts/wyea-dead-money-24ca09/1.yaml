evaluator_interpretation:
  - The plain reading is that current AI application revenue falls far short of the annual revenue required by the investment models discussed in the post.
  - The surrounding analysis explicitly uses calendar-2026 annual revenue estimates. The target is those estimates as understood at publication, not a claim that final 2026 revenue was already reported.
  - Use the application layer identified in the surrounding passage. Do not add chip sales and cloud sales to application revenue without addressing double counting.
  - A large present shortfall does not establish that infrastructure investment can never earn a return. No precise percentage defines 'same universe of scale'.
support_condition: An independently documented, sufficiently complete estimate of calendar-2026 AI application revenue is substantially below a comparable annual revenue requirement, with the gap remaining large under reasonable measurement and model assumptions.
contradiction_condition: A comparable industry revenue estimate is already close to or above the relevant annual requirement, so that the claimed large shortfall does not hold.
measurement_requirements: Match industry coverage, annual revenue definitions, currency, model assumptions, and capex vintage. Separate realized revenue estimates from annualized run rates. Distinguish break-even from a positive investment return and current requirements from requirements for future infrastructure.
source_requirements: Independent industry revenue estimates or reconciled company disclosures, together with the underlying analyst model. The speaker's calculations alone cannot establish the shortfall.
