evaluator_interpretation:
  - The plain reading is that multiple companies besides Uber were signaling concerns about AI's costs or practical benefits. It does not require a measured productivity-to-spending ratio.
  - I use May 1–26, 2026 because the surrounding examples describe recent announcements and decisions.
  - A pricing-driven reassessment or withdrawal of an unreliable deployment counts as an implicit signal. Merely switching suppliers does not establish poor returns.
support_condition: Reports establish that at least two companies were questioning AI costs relative to usefulness or withdrawing deployments that failed to deliver expected benefits.
contradiction_condition: Reliable evidence refutes the attributed concerns and establishes that the cited decisions had reasons unrelated to AI costs or usefulness.
measurement_requirements: Identify the company, decision or statement, timing, and reported reason. No numerical return estimate is required.
