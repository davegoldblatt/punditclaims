  - The application-outcome reporting window is evaluator-selected because the statement describes an ongoing state without dates.
  - Investment has no stated starting date, company coverage, geography, accounting basis, or aggregation method.
  - The investment figure could refer to funding, infrastructure expenditure, or a combination; these cannot be interchanged or added without checking overlap.
  - The latest completed reporting year does not capture every development immediately before publication.
