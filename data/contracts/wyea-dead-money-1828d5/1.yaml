assessment_axis: forecast_outcome
explicit_source_elements:
  - If they aren’t going to pay
  - $1.3 trillion in compute bills
  - the jig is up for AI data center demand
evaluator_interpretation:
  - "'They' refers to Anthropic and OpenAI."
  - The antecedent means a substantial failure or definitive refusal by the two companies to meet the referenced compute obligations. It does not mean that all future commitments are already payable.
  - The plain reading of 'the jig is up' is a broad and sustained collapse in commercially funded AI data center demand, not merely slower growth or a decline at one supplier.
  - The supplied words do not identify the accounting basis or contractual composition of the $1.3 trillion.
support_condition: After documented substantial nonpayment or repudiation of the referenced obligations by Anthropic and OpenAI, sector-wide bookings, utilization and related revenues show a broad sustained collapse attributable to the lost demand.
contradiction_condition: After the antecedent is established, comparable sector data show demand remaining substantial and sustained despite the labs' nonpayment. Conditions before the antecedent cannot contradict this forecast.
measurement_requirements: Establish payment due dates, defaults, cancellations and amounts for both companies. Then measure bookings, utilization and realized revenues across the affected AI data center market, including replacement customers.
source_requirements: Contracts, creditor notices, court records or company disclosures must establish the antecedent. Supplier filings and independent market measurements should establish the subsequent demand outcome.
