assessment_axis: historical_observation
explicit_source_elements:
  - The US has 1,200 AI bills
  - roughly 150 enacted into law
  - nothing that feels like a coherent AI policy
evaluator_interpretation:
  - The linked Fortune essay specifies state bills introduced and enacted during 2025; use that period and scope.
  - Read 1,200 as a rounded count, rather than a claim of exactly 1,200 distinct bills. Read roughly 150 as an approximation.
  - Assess the numerical assertion. The phrase about what feels coherent expresses a subjective judgment without an objective test.
  - Count broadly defined AI-related legislation, including targeted measures and government-use provisions. Do not equate every counted bill with comprehensive regulation of AI companies.
support_condition: A legislative tracker reports approximately 1,200 AI-related bills introduced across US states during 2025, with approximately 150 of those enacted.
contradiction_condition: Comparable records for the same year, jurisdictions and definition of AI-related legislation establish materially different introduction or enactment totals. Counts using narrower subject definitions or different periods do not suffice.
measurement_requirements: Identify the counting year, geographic coverage, definition of AI-related legislation, and distinction between introduction and enactment. Treat the bill count as rounded to the nearest hundred; do not impose an exact threshold on 'roughly 150'.
source_requirements: Prefer dated reports from legislative trackers or official legislative records. Use independent summaries as corroboration. The speaker's linked essay may clarify scope but cannot establish accuracy.
