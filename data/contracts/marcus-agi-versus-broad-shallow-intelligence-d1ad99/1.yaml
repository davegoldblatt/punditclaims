  - Every declaration of us already reaching AGI
  - I have seen
  - rests on redefining the term downwards
evaluator_interpretation:
  - The claim covers only the declarations Marcus personally has seen. There is no public list of these, so no one outside can check that the set is complete.
  - Whether a given definition is 'redefining downwards' depends on which earlier definition counts as the standard one. That is a judgement call, not a measurement.
  - Individual declarations can be shown as context to see whether they use looser definitions. They cannot settle a universal claim about his own reading.
support_condition: It would be supported only if the full set of declarations he saw were known, and each one used a definition weaker than the original AGI definitions (Legg, Goertzel, his own 2022 wording).
contradiction_condition: It would be contradicted by a public pre-January-2025 declaration that AGI had been reached, which he is known to have seen, and which used the original human-level, reliable-generalization standard rather than a weaker one.
measurement_requirements: null
source_requirements: An enumeration of declarations Marcus saw, plus the definition each one used. No such record exists.
