explicit_source_elements:
  - Claude doesn’t know how to relate words on a page
  - a model of human biology
  - a world model of its own conversional world
  - at a loss to reliably enforce its own instructions
evaluator_interpretation:
  - The claim attributes instruction failures to a specific representational deficit. Showing that Claude can be jailbroken would establish the failure, but not its proposed cause.
  - The surrounding reference to the latest Claude model makes the Claude generation available in June 2025 the main subject.
  - Reliable enforcement means consistently following governing instructions under relevant adversarial interactions; Marcus supplies no numerical threshold.
support_condition: Controlled studies of the relevant Claude models establish the proposed deficit and show that it materially causes instruction failures, separating it from competing explanations.
contradiction_condition: Controlled studies establish the relevant representations and show that instruction failures arise despite their effective connection to the instruction language, undermining the asserted causal explanation.
measurement_requirements: Measure instruction compliance and internal representations separately. Use interventions or comparable causal controls; successful jailbreaks alone are insufficient.
source_requirements: Public experimental methods and results identifying the tested Claude version, instructions, attacks, and interventions.
