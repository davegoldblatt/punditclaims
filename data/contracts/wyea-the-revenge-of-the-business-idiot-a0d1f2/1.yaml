assessment_axis: historical_observation
explicit_source_elements:
  - A trillion dollars in annual revenue is necessary by the end of 2028
  - would require over 30GW of data center capacity to be built by then
  - at a time when only 5GW at most appears to be under construction
evaluator_interpretation:
  - "The checkable core is the factual statement about the present: that at most about 5GW of data center capacity appeared to be under construction around the post date (2026-05-26)."
  - The parts saying $1 trillion is 'necessary' and that it 'would require over 30GW' are his own model of what NVIDIA needs. They are a requirement and an inference, not facts that can be observed, so they are not scored here.
  - "Plain reading: because he compares the 5GW with the 30GW that must be built 'by the end of 2028', '5GW under construction' means the total capacity under construction at the time. It does not mean only the subset scheduled to finish in 2026. At a minimum this covers the US, where most of the AI buildout is."
  - "Target period: the first half of 2026. The post says 'at a time when', so the claim describes conditions at publication. H1 2026 is the latest window that public trackers reported on."
  - If independent trackers show clearly more than 5GW under construction in that window, even in a subset such as US-only or primary markets only, the ceiling of '5GW at most' is contradicted.
support_condition: Credible trackers or analysts measuring capacity under construction in H1 2026 report about 5GW or less in total, with no credible measure showing materially more.
contradiction_condition: Credible trackers or analysts measuring capacity under construction in H1 2026 report materially more than 5GW, even within a subset such as US-only or eight primary markets.
measurement_requirements: Gigawatts or megawatts of data center capacity reported as under construction, measured in or near H1 2026, from industry trackers, real estate firms, or analysts.
source_requirements: Industry trackers (CBRE, BNEF, Sightline/Currence), analyst research (Jefferies), or reputable news reports of them.
metric_scope: null
