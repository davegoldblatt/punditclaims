ambiguity_flags:
  - He does not say whether '5GW' means total capacity under construction or only the capacity due to come online in 2026. The likely source, a Sightline/Currence outlook, gave about 5GW for the 2026-sch…
  - Geographic scope (global or US) and facility scope (AI-only or all data centers) are not stated.
  - The hedge 'appears' softens the statement, but 'at most' sets an explicit ceiling.
  - The $1 trillion requirement and the 30GW requirement are his model assumptions and are not scored.
  - Target period chosen as H1 2026, the latest period trackers reported on around the post date.
