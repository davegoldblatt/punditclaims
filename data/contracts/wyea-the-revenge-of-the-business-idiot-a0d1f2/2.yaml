ambiguity_flags:
  - Necessary to keep this going does not identify a financial sustainability or growth benchmark.
  - The revenue recipient and accounting basis are unspecified.
  - Annual revenue does not identify a fiscal year, calendar year, or trailing year.
  - The capacity figure does not distinguish IT load from total facility power or new construction from replacement equipment.
  - The construction estimate is explicitly qualified by appears.
  - Geographic coverage, project coverage, and expected completion years are unstated.
  - The latest completed quarter is an evaluator-selected period for the ongoing construction observation.
