assessment_axis: causal_assessment
explicit_source_elements:
  - A trillion dollars in annual revenue is necessary
  - by the end of 2028
  - would require over 30GW of data center capacity to be built by then
  - only 5GW at most appears to be under construction
evaluator_interpretation:
  - "Assess the complete argument: the asserted revenue requirement, its asserted capacity requirement, and the qualified estimate of construction underway."
  - The preceding reference to NVIDIA makes NVIDIA revenue the leading reading, but the passage does not clearly distinguish NVIDIA sales from downstream AI-service revenue.
  - Read necessary as an asserted requirement for sustaining the buildout discussed, not merely a revenue forecast. A forecast that revenue might reach $1 trillion would not establish necessity.
  - Read annual revenue as revenue over a year, not cumulative sales or an annualised run rate. The exact fiscal or calendar revenue period is unspecified.
  - Treat appears as a qualification about the available construction evidence. Do not convert it into an unqualified claim that the true worldwide total cannot exceed 5GW.
  - For the ongoing construction observation, use January–March 2026, the latest completed quarter before publication. The requirement model is assessed as an argument made on May 26, 2026, with a stated completion date of December 31, 2028.
  - The plain-reading treatment applies to the firm requirement language. It does not remove the uncertainty in the construction estimate.
support_condition: A reproducible financial model tied to the buildout described establishes the $1 trillion annual-revenue requirement by the end of 2028, and an engineering and revenue model establishes why that requires more than 30GW of new capacity. Contemporary construction records, with matching geography and project coverage, justify the qualified estimate of at most roughly 5GW underway.
contradiction_condition: A comparable financial or engineering analysis demonstrates that the described buildout can be sustained without one of the asserted requirements, or the contemporary inventory clearly makes the qualified construction estimate untenable on its intended scope. Announced capacity, later construction starts, and a different project cohort do not suffice.
measurement_requirements: Specify whose revenue is measured, the annual period, the meaning of sustaining the buildout, prices, costs, utilisation, replacement versus new capacity, and the conversion from sales to GW. Construction counts must distinguish IT load from facility power, actual building from announcements, and all completion years from the 2026 delivery cohort.
source_requirements: Use independently reproducible financial and capacity models, NVIDIA disclosures where relevant, and dated project inventories with construction-status definitions. A revenue aspiration or construction headline alone cannot settle the combined argument.
