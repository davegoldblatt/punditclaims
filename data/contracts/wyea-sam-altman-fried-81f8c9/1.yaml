  - on some level
  - guaranteed revenue for one of the big tech firms
evaluator_interpretation:
  - The ordinary reading is that serving each interaction uses commercially supplied infrastructure from Microsoft, Google or Amazon and thereby contributes to their revenue.
  - On some level permits indirect revenue through purchased capacity; it does not require a separate invoice for every interaction.
  - Use the latest completed calendar quarter before publication for this undated ongoing commercial arrangement.
  - Free access for an end user would not by itself contradict the claim.
support_condition: Hosting and commercial terms establish that all served ChatGPT and Claude interactions in the target period use revenue-bearing capacity from at least one named provider.
contradiction_condition: A documented class of served interactions in the target period uses infrastructure without any revenue-bearing connection to the named providers.
measurement_requirements: Coverage of both products' inference hosting and applicable commercial terms, including purchased capacity, credits and commitments.
source_requirements: Contemporaneous hosting disclosures and contracts, billing terms or later records explicitly describing the target period.
