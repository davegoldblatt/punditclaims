assessment_axis: forecast_outcome
explicit_source_elements:
  - someone else will buy the compute
  - No they won’t
  - the companies that are meant to buy the compute can’t afford it
  - nobody else is buying compute at even close to that scale
evaluator_interpretation:
  - The forecast concerns replacement demand for the large compute commitments discussed in the post, rather than whether any other company buys any compute.
  - The plain reading is that other buyers will not absorb that capacity at a scale comparable to the labs' commitments.
  - The affordability and current-demand statements are reasons offered for the forecast; they do not themselves establish its outcome.
  - No express conditional antecedent or deadline is stated. A release of capacity is a necessary opportunity to test replacement demand, not an event assumed to have occurred.
  - Comparable scale requires evidence tied to the identified capacity and its economic value, rather than a small unrelated contract.
support_condition: The identified commitments reach a final disposition after the labs relinquish the capacity, and the relevant capacity is permanently retired or otherwise becomes unavailable for replacement purchase without other buyers absorbing it at comparable scale.
contradiction_condition: Dated, binding replacement purchases show other customers absorbing a substantial, comparable-scale portion of the identified committed capacity relinquished by the labs.
measurement_requirements: Track the original commitments, any release or default, the same capacity offered to replacements, binding replacement contracts, prices, delivery dates and capacity measures. Distinguish proposed expansions from existing commitments.
source_requirements: Prefer original and replacement contracts, filings, court records or company disclosures. News reports may identify candidate events but must establish the connection to the same capacity.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve against the forecast upon documented comparable-scale replacement purchases of the identified relinquished capacity. Resolve in its favor only upon a final, irreversible disposition preventing such replacement across the relevant capacity. Temporary vacancy, a prospective tenant or an unrelated new campus is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - The specific portfolio of commitments is not enumerated in the sentence.
  - The amount required to be 'even close to that scale' is unspecified.
  - The sentence combines a future replacement-demand claim with present-tense supporting assertions.
