assessment_axis: forecast_outcome
explicit_source_elements:
  - if they can’t do that
  - large chunks
  - OpenAI and Anthropic’s revenues disappear
evaluator_interpretation:
  - The antecedent is a sustained loss of fundraising access among the AI startup customers whose spending materially supports the two providers.
  - A decline in aggregate venture funding alone does not establish that those customers can no longer finance their spending.
  - Large chunks means a material loss of existing revenue at each provider, attributable to the affected customers. No numerical threshold or response time is supplied.
  - Revenue means realized revenue, not valuation, financing or an annualized run rate.
  - No accounting basis is specified for the future revenue comparison.
support_condition: After the specified customers lose continued fundraising access, matched customer and provider records show a material disappearance of their revenue contributions at both OpenAI and Anthropic.
contradiction_condition: After the antecedent occurs and the affected customers have exhausted their financing runway, comparable records show their revenue contributions remain substantially intact. An arbitrary short observation window would not suffice.
measurement_requirements: Identify the affected customer cohort, establish its loss of funding access and remaining runway, and measure realized provider revenue attributable to it before and after the event.
source_requirements: Funding records and customer financial disclosures must establish the antecedent. Provider financial disclosures or independently verified customer-level spending records must establish the outcome.
metric_scope:
  company: OpenAI and Anthropic, assessed separately
  metric: Realized revenue lost following startup customers' loss of fundraising access
  currency: null
  units: share of revenue
  accounting_basis: unknown
