assessment_axis: historical_observation
explicit_source_elements:
  - The return on investment
  - that people dream of
  - is just not there
  - for most customers
evaluator_interpretation:
  - The surrounding discussion identifies generative AI and business customers as the subject.
  - Most means more than half of business customers, rather than more than half of projects.
  - The plain reading is that realized financial returns generally fall short of customers' hopes. This does not assert that most customers receive no benefit whatsoever.
  - The observation concerns the latest 2025 customer experience reportable before publication. I use 2025 through December 7, rather than imposing a quarterly reporting period on survey evidence.
  - Significant realized returns are relevant evidence, but neither any positive return nor enterprise-wide profit impact alone measures whether customers' expectations were met.
  - This is an aggregate customer-outcome claim, not a financial figure for a named company; metric_scope is null.
support_condition: Credible, broadly applicable customer evidence shows that more than half of business customers had not achieved the financial returns they expected from generative AI during the target period.
contradiction_condition: Comparable evidence shows that at least half of business customers had achieved or exceeded their expected financial returns from generative AI during the target period.
measurement_requirements: Measure customers rather than projects; identify generative AI separately; compare realized returns with expectations for the same investment and elapsed period. Distinguish missing measurements, pending returns, and disappointing returns.
source_requirements: Prefer original surveys with disclosed sampling, questions, fieldwork dates, and definitions. Vendor-sponsored surveys require scrutiny of sample selection. Broad AI measures and project-level results are contextual unless their applicability is established.
