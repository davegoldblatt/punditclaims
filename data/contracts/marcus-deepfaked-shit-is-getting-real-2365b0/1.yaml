  - An entire cast of deepfaked people
  - include a deep faked CFO
  - scammed a company out $25 million
evaluator_interpretation:
  - The claim concerns the specific incident in the linked February 4 report, subsequently dated to January 2024.
  - Read $25 million as an approximate US-dollar description of the money transferred to fraudsters, following the cited news report, rather than an exact amount or audited accounting loss.
  - The cast means the apparent colleagues and executives presented to the victim. It excludes the victim.
  - The wording does not require interactive, real-time generation of the impersonations.
support_condition: Reliable accounts establish that fabricated video participants, including the company's CFO, helped induce transfers totaling approximately US$25 million in this incident.
contradiction_condition: Reliable findings establish that the incident did not involve the claimed video impersonations, or that the money transferred was materially different from approximately US$25 million.
measurement_requirements: Measure the total funds transferred in the incident. Distinguish the reported US-dollar equivalent from the original Hong Kong dollar amount and from losses after recoveries.
source_requirements: Prefer police findings and company disclosures. News reporting may establish the reported dollar equivalent and details attributed to investigators.
