assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI and Anthropic's revenues
  - by my estimates
  - more than half
  - the entire revenue of the generative AI industry
  - including the hyperscalers
evaluator_interpretation:
  - The ordinary reading is an estimate of the companies' contemporary share of generative-AI revenue at the time of the post.
  - Use the latest reported monthly revenue rates available around June and July 2025, through the post date. The surrounding discussion uses annualized figures, so the claim is not restricted to realized April–June sales.
  - Annualized rates must be compared with annualized rates; annual totals and full-year forecasts cannot be substituted.
  - The numerator combines OpenAI and Anthropic. The denominator includes other generative-AI suppliers and hyperscaler generative-AI services.
  - The author's estimate is a qualification of the measurement, not a conditional antecedent.
  - A consistent treatment of reseller revenue and payments between suppliers is necessary. The speaker does not specify that treatment.
support_condition: A comparable contemporary revenue estimate, including hyperscalers, places OpenAI and Anthropic together above 50% of the total.
contradiction_condition: A comparable contemporary estimate places their combined share at or below 50%, or a defensible same-basis lower bound for the rest of the industry equals or exceeds their combined revenue.
measurement_requirements: Contemporaneous annualized revenue rates with consistent product coverage, treatment of reseller revenue and company-to-company transactions. Separate generative AI from broader AI and unrelated cloud revenue.
source_requirements: Company disclosures and credible attributed estimates covering both the numerator and the industry denominator. An estimate covering only model developers is insufficient.
metric_scope:
