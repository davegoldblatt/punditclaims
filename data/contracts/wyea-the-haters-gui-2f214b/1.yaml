explicit_source_elements:
  - OpenAI and Anthropic's revenues
  - by my estimates
  - more than half
  - entire revenue of the generative AI industry
  - including the hyperscalers
evaluator_interpretation:
  - "'By my estimates' describes the evidentiary basis, not a conditional antecedent."
  - Read revenue as sales earned during a common period, not financing, valuation, or annualized revenue run rate.
  - Use April–June 2025, the latest completed quarter before publication, because no measurement period is specified.
  - Include generative AI products and services sold by hyperscalers. The treatment of infrastructure suppliers, hardware, and transactions between industry participants must be explicit.
  - The numerical test is combined OpenAI and Anthropic revenue divided by consistently defined total industry revenue, strictly greater than 50%.
support_condition: Comparable-period estimates on a consistent revenue basis establish a combined share above 50%, including hyperscaler generative AI revenue.
contradiction_condition: Comparable-period estimates establish a combined share of 50% or less, or a reliable lower bound for other industry revenue equals or exceeds the two companies' combined revenue.
measurement_requirements: Match periods, realized versus annualized measurement, currency, and gross versus net recognition. Define industry membership and consistently handle reseller and infrastructure transactions.
source_requirements: Prefer company disclosures reconciled to a transparent industry estimate. A market-spending forecast or an estimate excluding hyperscalers cannot settle the claim.
