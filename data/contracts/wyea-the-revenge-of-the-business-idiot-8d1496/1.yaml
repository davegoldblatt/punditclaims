explicit_source_elements:
  - at least $178.5 billion
  - in America alone in 2025
  - have been sunk into data center construction
  - based on flawed information
  - astronomically more flawed than the assumptions that led to the dot com bubble bursting
evaluator_interpretation:
  - The ordinary reading is actual US data-center construction expenditure during calendar 2025, not the face value of financing deals or announcements covering future years.
  - The post links the numerical amount to Bloomberg reporting, so its implied financial basis is an estimate.
  - The statement does not expressly limit the total to private construction or specify whether equipment and associated power infrastructure are included.
  - The spending amount is separately testable. The comparative judgment about flawed assumptions has no supplied scale and must not be treated as proved merely by a spending total.
support_condition: A matching national estimate establishes at least $178.5 billion of actual 2025 data-center construction spending. Supporting the full statement additionally requires documented investment assumptions and a defensible comparison with dot-com-era errors.
contradiction_condition: A matching national construction-expenditure estimate below $178.5 billion contradicts the numerical component. A financing total or a narrower private-sector series alone is not a matching national expenditure total.
measurement_requirements: Calendar-year realized construction expenditure in nominal US dollars, with explicit treatment of public construction, equipment, land and associated power infrastructure. Distinguish spending from financing commitments.
source_requirements: Readable official construction records or a transparent, reconciled national estimate; project underwriting records for the assumptions comparison.
