assessment_axis: causal_assessment
explicit_source_elements:
  - that is why they hallucinate, frequently
  - They wouldn’t need to do so
  - reliable access to relevant databases
evaluator_interpretation:
  - The claim attributes frequent factual hallucinations to reconstructive generation without dependable access to factual records.
  - Reliable access means that correct, relevant records actually reach the answering system, not merely that a database or search tool exists.
  - "Wouldn't need to is not automatically a guarantee of zero errors: the surrounding text explicitly calls external retrieval a partial workaround."
  - Evidence that retrieval helps supports a causal contribution, but does not alone establish the proposed general mechanism.
support_condition: Controlled comparisons show that dependable access to relevant structured facts substantially reduces factual hallucinations, while isolating missing access or reconstructive generation as the causal factor.
contradiction_condition: Controlled tests directly undermine the proposed mechanism, or show that supplying verified relevant records does not remove the information deficit invoked by the explanation. Residual errors alone do not refute a weaker contribution claim.
measurement_requirements: Matched models, questions, decoding, and scoring; verification that relevant facts were supplied; separate factual errors from retrieval failures and reasoning failures.
source_requirements: Primary controlled evaluations and error analyses. Ordinary correlations between retrieval use and accuracy are insufficient for the full causal claim.
