assessment_axis: historical_observation
explicit_source_elements:
  - when Altman returned to Senate last week
  - an entirely different tune
  - effectively trying to block AI regulation at every turn
  - no longer talking about AI regulation
  - actively resisting it
evaluator_interpretation:
  - Last week's Senate appearance refers to the May 8, 2025 Commerce Committee hearing.
  - The target observation is that hearing. His May 16, 2023 testimony supplies the historical comparison and is treated as context.
  - The plain reading alleges a shift from supporting regulation to consistently resisting it.
  - Opposition to government preapproval or conflicting state rules does not automatically mean opposition to every regulatory safeguard.
  - Effectively qualifies the characterization of his conduct; it is not a conditional antecedent.
support_condition: The May 8 testimony shows active opposition to substantive regulatory proposals, compared with support in 2023. The stronger universal component requires consistent resistance without meaningful regulatory endorsement.
contradiction_condition: Altman explicitly endorses substantive regulatory safeguards during the May 8 hearing, contradicting the assertion that he resisted regulation at every turn.
measurement_requirements: Compare his answers in context, including the proposals each senator actually put to him. Separate a change in emphasis from rejection of all regulation.
source_requirements: Prefer complete official hearing records. Keep event dates separate from the later publication of transcripts.
