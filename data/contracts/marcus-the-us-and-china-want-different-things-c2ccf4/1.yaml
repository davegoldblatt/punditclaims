explicit_source_elements:
  - Buolwamini, Gebru, Birhane, Mitchell, Raji, Sweeney, Zuboff, Whittaker
  - and many others
  - have been warning us about this for years
evaluator_interpretation:
  - Buolwamini refers to Joy Buolamwini; the other surnames refer to Timnit Gebru, Abeba Birhane, Margaret Mitchell, Inioluwa Deborah Raji, Latanya Sweeney, Shoshana Zuboff, and Meredith Whittaker.
  - This refers collectively to bias, unreliable inference, opaque data and systems, and surveillance harms discussed in the preceding paragraph. It does not require every person to have assessed Fivecast or every listed harm.
  - For years means that relevant public warnings substantially predate August 2023, including work at least two years earlier.
  - The target period covers the unspecified earlier years through publication. No starting year is imposed.
  - The rhetorical question about learning nothing is not assessed as a separate factual assertion.
support_condition: Dated public work by all eight named people documents warnings about the relevant family of harms years before the post, with additional authors establishing a broader body of warnings.
contradiction_condition: Reliable publication records or direct statements establish that the attributed warnings did not occur, were materially misattributed, or began only shortly before the post.
measurement_requirements: Verify authorship, public availability, dates, and substantive discussion of the relevant harms. Establish that warnings existed, without treating their existence as proof that every warning was correct.
source_requirements: Prefer the researchers' original papers, reports, and public testimony. Their own work is primary evidence that they issued warnings; Marcus's characterization is not evidence.
