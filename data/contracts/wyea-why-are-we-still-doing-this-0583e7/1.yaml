assessment_axis: causal_assessment
explicit_source_elements:
  - This is, of course, a big bucket of bollocks
  - our ability to serve customers—as measured by revenue—directly tracks available compute
  - $20 billion in annualized revenue
  - $25 billion in March 2026
  - I think that’s highly unlikely
evaluator_interpretation:
  - In context, Zitron rejects the proposition that available compute directly constrains or drives OpenAI's revenue growth.
  - The January-to-March 2026 comparison is his concrete proposed test.
  - Directly tracks is not interpreted as a promise of exact proportionality every month. Neither speaker supplies such a rule.
  - The assessment requires evidence about available operational compute, rather than spending commitments or future planned capacity.
support_condition: Comparable evidence for the cited period shows that revenue growth did not track available compute, with enough information about timing, utilization, efficiency, prices, and demand to support the categorical rejection.
contradiction_condition: Comparable operational and financial evidence establishes the disputed relationship for the cited period and shows that additional available compute enabled the observed revenue growth.
measurement_requirements: Paired revenue and operational compute measurements with matching dates and definitions; causal evidence must distinguish capacity effects from pricing, utilization, efficiency, and demand.
source_requirements: Company operating disclosures or independently verified capacity and revenue records. Announced future capacity and annual correlations are insufficient by themselves.
