explicit_source_elements:
  - 5GW of capacity by the end of 2026
  - 1.5GW at the end of 2025
  - according to statements made to its investors
  - I can find no compelling evidence
  - even a gigawatt of compute for it to buy
evaluator_interpretation:
  - Assess the public-evidence assertion, not Zitron's private search history.
  - The nearest historical referent is Anthropic's claimed end-2025 capacity. Use 2025 as the target year, with the threshold assessed at year-end.
  - The relevant threshold is one gigawatt, not the reported five-gigawatt forecast.
  - Available compute means operational capacity allocated or commercially accessible to Anthropic. A future procurement agreement alone does not establish delivery.
  - The quoted end-2026 expectation belongs to the reported investor statements; it is not Zitron's own forecast.
support_condition: A sufficiently comprehensive contemporaneous record shows that the one-gigawatt threshold lacked credible operational or procurement evidence, or establishes an upper bound below it.
contradiction_condition: Public evidence available by the post credibly establishes at least one gigawatt of operational capacity available to Anthropic by the end of 2025, without double counting.
measurement_requirements: Reconcile IT power with total facility power, distinguish installed from announced capacity, and identify Anthropic's allocation across providers.
source_requirements: Dated operational disclosures, delivery records, procurement terms and independently documented facility measurements. Evidence published after the post cannot establish what Zitron could have found before it.
