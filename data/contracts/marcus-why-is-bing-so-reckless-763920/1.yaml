evaluator_interpretation:
  - The ordinary reading is that established reinforcement-learning methods can suffer substantial performance losses under small changes to their training circumstances.
  - May describes an empirically demonstrable vulnerability, not a prediction that every changed environment defeats every agent.
  - No longer work means substantial failure at the learned task, not necessarily complete failure on every trial.
  - The target is the experimental record available by February 20, 2023; no single reporting quarter applies.
  - This assessment does not establish that RLHF failed in Bing or that every language-model update requires complete retraining.
support_condition: Controlled pre-post experiments show trained reinforcement-learning agents losing substantial task performance after small environmental changes.
contradiction_condition: The apparent examples fail replication or involve materially different tasks rather than small changes, and reliable evidence does not establish the claimed vulnerability.
measurement_requirements: Describe the trained agent, the environmental perturbation and performance after the change. Distinguish failure to transfer from failure to learn the original task.
source_requirements: Primary experimental papers or researchers' direct reports with methods and results.
