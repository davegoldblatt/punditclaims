assessment_axis: forecast_outcome
explicit_source_elements:
  - neither of them are done raising
  - billions of dollars
  - in 2026
evaluator_interpretation:
  - Both CoreWeave and Nebius must secure additional financing after publication and by December 31, 2026.
  - Read “billions” as at least $2 billion for each company, including cumulative qualifying transactions.
  - Count completed securities offerings and executed lending facilities as financing secured. Do not require every committed loan dollar to have been drawn.
  - Exclude proposals, customer revenue and previously announced financing completed before publication.
  - “At random” is rhetorical and supplies no measurable condition.
  - Use estimate for the press-reported financing basis under the requested classification. This is not a GAAP earnings measure.
support_condition: Each company secures at least $2 billion of additional external financing during the forecast interval.
contradiction_condition: After December 31, sufficiently complete financing records show that at least one company secured less than $2 billion during the interval.
measurement_requirements: Company-specific transaction amounts and execution dates; distinguish gross financing secured from net proceeds, undrawn capacity and proposals.
source_requirements: Dated financing reports corroborated by issuer announcements or filings. Press-reported amounts retain the contract's estimate classification.
