assessment_axis: causal_assessment
explicit_source_elements:
  - depending on the company
  - that “growth”
  - either “barely related” or “entirely unrelated” to AI
evaluator_interpretation:
  - The companies are Microsoft, Alphabet, Amazon and Meta, as identified immediately before the claim.
  - Use current consolidated business growth in January–March 2026, compared with the corresponding prior-year quarter.
  - The ordinary reading is that AI contributes little or nothing to that growth. It includes AI services and demonstrable effects of AI on existing products.
  - Do not equate a segment's growth, a revenue run rate, or an advertising-performance improvement with its contribution to consolidated realized revenue growth.
  - No numerical cutoff for 'barely' is supplied or invented.
support_condition: Reliable company-level attribution shows that AI accounts for little or none of current consolidated growth across the named companies.
contradiction_condition: Reliable attribution establishes a substantial AI contribution to current consolidated growth for at least one named company.
measurement_requirements: Comparable realized quarterly revenue and a documented attribution of incremental revenue or operating earnings to AI. Separate segment results, run rates and product-performance tests from consolidated attribution.
source_requirements: Primary financial disclosures, documented experiments or independently corroborated analyses with transparent attribution methods.
metric_scope:
