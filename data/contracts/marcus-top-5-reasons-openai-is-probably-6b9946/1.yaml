assessment_axis: historical_observation
explicit_source_elements:
  - Even now
  - GPT can’t be trusted to follow the rules of chess
  - those rules are stated directly
  - in the training set
  - probably multiple times
evaluator_interpretation:
  - The plain reading concerns contemporary general-purpose GPT models playing chess through text, without an external chess engine or legality filter.
  - Cannot be trusted means that ordinary play can produce illegal moves and needs checking. It does not mean that GPT cannot make legal moves or play competent games.
  - The assertion that rules were directly present in training data is retained as a separate factual component. The hedge concerns repetition, not clearly the underlying presence of the rules.
  - Reciting chess rules or receiving them in a prompt does not establish their presence in the original training corpus.
  - The target is the latest publicly testable 2023 GPT capability picture through the post date. No regular reporting period applies.
support_condition: Reproducible tests show material illegal-move failures in relevant contemporary GPT models, and credible training documentation establishes that explicit chess rules were included in those models' training data.
contradiction_condition: Representative testing establishes dependable unaided rule compliance for the relevant GPT models, or authoritative training records refute the asserted exposure to explicit chess rules. Evidence must identify which component it contradicts.
measurement_requirements: Identify model version, prompting, sampling settings, game or move counts, illegal-move criteria, retries, and external assistance. Distinguish move legality from playing strength.
source_requirements: Prefer reproducible contemporary studies and primary training documentation. Do not infer training-set contents solely from model behaviour.
