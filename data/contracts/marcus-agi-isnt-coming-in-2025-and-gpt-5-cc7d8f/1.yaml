evaluator_interpretation:
  - "Condition: OpenAI releases a model named GPT-5."
  - His previously stated criteria are read as his 2022 five-task test (understand movies, understand novels, cook in any kitchen, reliably write 10,000+ lines of bug-free code, convert arbitrary math proofs to symbolic form), which required at least three of five, and similar AGI criteria.
  - "Plain reading: GPT-5 at release would not qualify as AGI by criteria of that kind."
support_condition: After GPT-5's release, its developer or credible evaluators find that it falls short of AGI or of Marcus-type criteria.
contradiction_condition: Credible evaluation shows GPT-5 meets at least three of Marcus's five tasks, or is widely accepted as AGI.
measurement_requirements: Evaluations of, or developer statements about, GPT-5 against AGI criteria.
