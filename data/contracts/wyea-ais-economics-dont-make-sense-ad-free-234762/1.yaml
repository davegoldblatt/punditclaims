assessment_axis: causal_assessment
explicit_source_elements:
  - a large part
  - if not the majority
  - AI compute revenue
  - dependent on a continual flow of venture capital and debt
evaluator_interpretation:
  - Read the claim as material dependence of external AI compute rental revenue on repeated financing of customers' payments.
  - The possible majority is an escalation, not a firm commitment that the share exceeds 50%.
  - Assess the industry described, not CoreWeave alone or only OpenAI and Anthropic.
  - Use calendar 2025, the latest complete annual period public financial evidence could describe before publication.
  - Trace the source of customer payments through intermediaries where possible. A provider borrowing to build infrastructure is not itself proof that its customers require financing to pay.
  - Treat the investor-belief language as an explanation offered for financing availability, rather than a separately measurable universal claim about investors' motives.
support_condition: Representative revenue and customer cash-flow data show that a substantial industry share could not continue without repeated venture or debt financing, after accounting for customer revenue, existing cash, and intermediaries.
contradiction_condition: Representative data show that financing-dependent payments form only an immaterial share of AI compute revenue and that customers can sustain the remaining payments from operating resources.
measurement_requirements: Define the revenue denominator, avoid double counting across cloud intermediaries, match customer payments with operating cash generation and financing, and distinguish existing reserves from dependence on continual new funding.
source_requirements: Provider customer-concentration disclosures, customer cash-flow statements and financing records, and representative industry coverage or a defensible aggregate estimate.
