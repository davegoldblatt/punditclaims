claim_id: wyea-the-ai-industry-is-lying-to-you-ea6b1b
version: 1
claim_revision_ref:
  id: wyea-the-ai-industry-is-lying-to-you-ea6b1b
  version: 2
  content_hash: c1a60e4cfe6a710854473647fe087936299d386b141cddbf4c1dec766f198861
assessment_axis: forecast_outcome
explicit_source_elements:
  - Hundreds of billions of dollars have been sunk into buying GPUs
  - in some cases years in advance
  - NVIDIA’s 2025 and 2026 revenues
  - will take until 2028 to 2029 to actually operationalize
  - assuming that any of it actually gets built
evaluator_interpretation:
  - Operationalize means the purchased equipment is installed in powered facilities and performing computing work.
  - Read the forecast as describing deployment of the sales cohort in aggregate. It does not explicitly say that no individual GPU can operate earlier.
  - Use calendar 2025 and 2026 as a provisional reading of the unqualified years. Preserve the fiscal/calendar ambiguity rather than treating fiscal 2026 revenue as calendar 2026 revenue.
  - The exact words describe the construction rate as the basis for the prediction; they do not explicitly require that the rate remain unchanged through 2029.
  - The explicit construction antecedent is met if relevant GPU-equipped AI facilities are actually built. Evidence of one operating cluster satisfies that limited antecedent but cannot settle aggregate deployment timing.
support_condition: Matched sales and commissioning records show that deployment of the relevant 2025–2026 GPU sales cohort generally required waiting until 2028–2029, with the claimed advance-purchase spending independently documented.
contradiction_condition: Representative, value-weighted records establish that the relevant cohort was largely operational before 2028, or establish a materially different deployment timetable incompatible with the forecast.
measurement_requirements: Match GPU purchases and NVIDIA revenue recognition to equipment installation and useful operation. Separate GPUs from networking and other products, fiscal from calendar years, and installed equipment from announced capacity.
source_requirements: Sales-cohort disclosures, shipment records, customer acceptance and commissioning records, and operational measurements. Aggregate revenue and isolated installations are insufficient.
metric_scope:
  company: NVIDIA
  metric: GPU sales revenue represented by equipment awaiting operational deployment
  currency: USD
  units: dollars
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: 2025-01-01
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: until 2028 to 2029
horizon_interval:
  start: 2026-03-24
  end: 2029-12-31
  precision: day
target_period: null
condition_status: met
early_resolution_rule: Before 2028, resolve as contradicted only if representative records connect the relevant sales cohort to widespread completed deployment. An isolated operating cluster or a revenue announcement is not decisive.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The revenue years are not identified as fiscal or calendar years.
  - No accounting basis is specified for the spending and revenue comparison.
  - The share of sales that must remain uninstalled is unspecified.
  - Revenue includes products other than GPUs unless explicitly restricted.
  - Operationalize could mean installation, acceptance or revenue-producing utilization.
  - An unchanged future construction rate is not an explicit antecedent in the quoted words.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
