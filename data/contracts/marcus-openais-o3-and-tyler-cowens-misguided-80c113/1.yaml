evaluator_interpretation:
  - The plain reading is that fabricated references are a substantial, recurring reliability problem across commonly used LLM systems. It does not mean every model fabricates most citations.
  - Because this describes an ongoing state, the target period is early 2025 through publication, rather than earlier generations or subsequent improvements.
  - The assessment concerns citation fabrication, not the separate allegation that Cowen failed to acknowledge it.
support_condition: Contemporaneous evaluations document substantial, recurring fabrication of references or source links across multiple commonly used LLM systems.
contradiction_condition: Broad evaluations of contemporary systems establish that fabricated references are rare across relevant citation tasks, undermining the claimed scale of the problem.
measurement_requirements: Distinguish fabricated references from wrong attribution, incomplete metadata, and broken links. Preserve differences between models and tasks.
source_requirements: Prefer original citation audits with documented methods and independently checked sources.
