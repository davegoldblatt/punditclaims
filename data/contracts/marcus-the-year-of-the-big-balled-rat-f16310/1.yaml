assessment_axis: historical_observation
explicit_source_elements:
  - GenAI is messing with science.
  - Two clearest examples so far this year
evaluator_interpretation:
  - The plain reading is that generative AI had introduced defective material into published scientific work. It does not require showing that all AI use harms science or that its overall costs exceed its benefits.
  - The surrounding words 'so far this year' establish January 1 through March 14, 2024 as the observation period.
  - Scientifically incorrect AI-generated illustrations that reached publication count as damage to the scientific record.
support_condition: Documented cases within the target period show that generative-AI material entered published scientific work and introduced scientific errors or materially compromised its reliability.
contradiction_condition: Reliable examination establishes that the alleged defects were absent, were not generated by AI, or did not enter published scientific work. Failure to find additional examples alone would not contradict the claim.
measurement_requirements: Identify published material, establish its generative-AI provenance, and document a concrete scientific or publication-integrity defect.
source_requirements: Prefer the original publications, publisher notices, and independent examination of the material. The speaker's own assertions are insufficient.
