assessment_axis: forecast_outcome
explicit_source_elements:
  - At some point
  - venture capitalists will be forced to stop funnelling money into unprofitable, unsustainable AI companies
  - those companies unable to funnel money into the pockets of those buying GPUs
  - harder for those companies buying GPUs to justify (or raise debt for) buying more GPUs
evaluator_interpretation:
  - "This is a three-step chain, and all three steps must happen for support: (1) VCs are forced to largely stop funding unprofitable AI startups; (2) those startups can no longer pay compute providers; (3) GPU buyers find it harder to justify or finance GPU purchases because of that."
  - "'Unprofitable, unsustainable AI companies' describes the companies; it is not an antecedent condition."
  - No deadline is stated, so this is an open-horizon forecast.
support_condition: Documented, sustained collapse in VC funding to unprofitable AI startups, followed by documented payment shortfalls to compute providers, and GPU buyers citing reduced demand or financing difficulty as a result.
contradiction_condition: Cannot be contradicted by time alone because there is no deadline. Continued heavy VC funding only shows the event has not happened yet.
measurement_requirements: VC funding data for AI (e.g. Crunchbase, PitchBook); company disclosures of customer payment failures; GPU buyer statements or financing records.
source_requirements: Venture data providers, company filings, reputable financial news.
metric_scope: null
original_horizon: at some point
horizon_interval:
  start: 2025-12-08
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: "Settled as supported if, before the evaluation date, documented evidence shows all three steps: a forced, broad pullback of VC money from unprofitable AI startups; resulting failures by those startups to pay compute providers; and GPU buyers reporting reduced ability to justify or finance GPU purchases because of it."
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'At some point' sets no deadline."
  - "'Forced to stop' could mean a full stop or a sharp pullback; I read it as a broad, sustained pullback."
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
