ambiguity_flags:
  - The antecedent of 'they' could mean LLMs or machines generally.
  - Fine-tuning and external tools are not specified.
  - The first two inability claims are unqualified, unlike the explicit reliability qualifications that follow.
  - "'A new story' may mean a news story or a newly written story."
  - "'We have yet to see' mixes public capability with personal awareness."
  - General driving competence and restricted-domain safety are different standards.
  - Current is interpreted as 2023 through publication despite the reference to an earlier discussion.
