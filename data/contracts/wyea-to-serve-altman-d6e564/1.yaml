evaluator_interpretation:
  - The sentence offers a qualified analogy and a judgment about the distribution of benefits and risks.
  - Its factual premise that Microsoft uses OpenAI's research is checkable, but that narrower premise does not establish the complete claim.
  - No ordinary, sufficiently determinate threshold identifies when a partnership becomes an R&D facility with terms rigged for one party.
support_condition: No determinate condition for the complete statement is supplied. Research access or product integration alone would establish only its factual premise.
contradiction_condition: No determinate condition for the complete statement is supplied. Benefits to OpenAI would not necessarily refute an arrangement also favoring Microsoft.
measurement_requirements: A test would require a specified comparison of control, benefits, costs and risks, plus a threshold for the claimed imbalance.
source_requirements: Contractual records can establish the underlying arrangements, but cannot supply the speaker's missing evaluative threshold.
