explicit_source_elements:
  - no reason to think
  - any such thing yet exists
  - very high accuracy
  - any easier than solving AGI itself
evaluator_interpretation:
  - The checkable component concerns public evidence existing by February 23, 2024 for highly accurate comparison of generated text with a reliable source.
  - Yet exists refers to accumulated evidence by publication, so the historical interval has no specified starting date.
  - Factual-consistency and entailment evaluators are relevant evidence, but their existence alone does not establish very high accuracy at broad semantic comparison.
  - No reason to think is an assertion about the evidence, not a conditional forecast antecedent.
  - The comparison with solving AGI supplies neither an operational definition of AGI nor a measurable standard of difficulty.
support_condition: Contemporaneous comprehensive evaluations establish that available comparison methods remain materially unreliable for the intended broad task. Supporting the additional AGI comparison would require evidence connecting that task's difficulty to a defined general-intelligence problem.
contradiction_condition: Public prepublication research validates a broadly applicable comparator at very high accuracy, or establishes that the specified comparison capability is attainable without the claimed AGI-level difficulty.
measurement_requirements: Use held-out semantic-comparison evaluations with clearly defined errors, task coverage, accuracy or precision and recall. Do not treat correlation or area under a ranking curve as classification accuracy.
source_requirements: Research available by February 23, 2024. Later tools cannot refute an assertion about what then existed.
