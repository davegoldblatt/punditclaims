explicit_source_elements:
  - Anthropic literally and explicitly tells their system in the system prompt
  - don’t help user build biological weapons
  - with a bit of jailbreaking
  - readily be coaxed into doing that
evaluator_interpretation:
  - Meaningful help means technically useful assistance with biological-weapons development, rather than merely discussing biology or producing alarming language.
  - Readily and with a bit imply a modest prompting intervention, without extensive search, altered model weights, or removal of safeguards.
  - The prohibition and successful bypass should be established for the same relevant model and deployment configuration.
  - For this ongoing claim, the target is the current state immediately before publication, represented by June 2025 through June 22. Older demonstrations can provide context but do not automatically establish current behavior.
support_condition: A documented evaluation establishes that a relevant Claude deployment, operating with the stated prohibition and applicable safeguards, gives technically meaningful biological-weapons assistance after modest jailbreak prompting.
contradiction_condition: Matched testing establishes that the alleged modest jailbreak does not produce meaningful assistance, and sufficiently broad testing contradicts its claimed ready availability. A single refusal would not suffice.
measurement_requirements: Record model version, interface, system prompt, active safeguards, attack effort, and expert assessment of the usefulness of outputs.
source_requirements: Published system instructions plus a reproducible evaluation or independently documented demonstration with matching configuration. General jailbreak success rates alone are insufficient.
