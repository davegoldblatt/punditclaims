evaluator_interpretation:
  - I read large fraction as a substantial minority, without requiring a majority or assigning an invented numerical cutoff.
  - I use U.S. adults as the population, consistent with the surrounding U.S. news context; the speaker does not specify geography.
  - Medical advice includes seeking information about symptoms, conditions, treatment and whether to obtain care. It does not require replacing a clinician.
  - For this ongoing adoption claim, the target is the latest pre-post partial calendar year. Survey respondents may report use during the preceding year.
support_condition: A representative general-adult survey available before the post finds that a substantial minority have intentionally used chatbots for health information or advice.
contradiction_condition: Comparable representative surveys show that such use is confined to a small, marginal share of adults.
measurement_requirements: Use the general adult population as denominator, identify survey fieldwork and recall periods, and distinguish intentional chatbot use from passive exposure to AI search summaries.
source_requirements: Original representative survey findings with disclosed sampling and question scope.
