target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve supported when a dated post-publication empirical report documents a completed qualifying use and substantive errors. The public release is the resolution event; it need not reveal the exact dates on which individual tests ran.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
