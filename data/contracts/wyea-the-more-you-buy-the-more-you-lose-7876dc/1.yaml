assessment_axis: causal_assessment
explicit_source_elements:
  - The more AI servers that hyperscalers buy
  - more demand they create for RAM and high-bandwidth memory
  - increases the price of RAM and HBM
  - makes the AI servers more expensive
  - AI has yet to provide meaningful improvements in revenue or cashflow
  - they’re forced to raise more debt
evaluator_interpretation:
  - The claim describes an existing feedback mechanism through July 28, not a forecast with a deadline.
  - Hyperscalers means Microsoft, Alphabet, Meta and Amazon, named in the supplied context.
  - Meaningful improvements means financially material realized contributions attributable to AI. It does not require AI to repay all infrastructure investment immediately.
  - Forced to raise debt means higher costs and insufficient cash generation made additional borrowing necessary to maintain the investment program, rather than merely making debt attractive.
  - The words provide no starting date. The target period therefore has an open start and ends on the post date.
  - No accounting basis or common financial measure is supplied for the revenue, cash-flow and borrowing assertions.
support_condition: Evidence establishes that hyperscaler AI purchases materially increased memory demand and prices, passed through into server costs, and created financing shortfalls that required additional debt because realized AI revenue or cash-flow contributions were immaterial.
contradiction_condition: Comparable evidence refutes a material link in the chain, establishes material realized AI contributions contrary to the stated premise, or demonstrates that the attributed additional borrowing was not required by the asserted cost-driven shortfall.
measurement_requirements: Track actual memory transaction prices and comparable server configurations. Separate realized revenue from annualized run rates, revenue from profit, and financing choices from demonstrated funding necessity.
source_requirements: Supplier and purchaser disclosures, independent pricing data, realized AI financial contributions, and financing records addressing alternative funding sources and uses.
