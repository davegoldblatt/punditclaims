explicit_source_elements:
  - Stop Reporting That It Raised $110bn
  - It Is Factually Incorrect
  - $35bn contingent on AGI or an IPO
  - paying in three installments
evaluator_interpretation:
  - Assess the latest 2026 financing round through publication on March 3, rather than OpenAI's cumulative fundraising.
  - The surrounding discussion reads 'raised' as money actually received. Financial announcements can also use it for agreed financing. The categorical criticism requires distinguishing these meanings.
  - The numerical allegation is attributed to press reporting, so its accounting basis is estimate. Investor disclosures are separately identified as company-reported commitments.
support_condition: Records establish that the challenged reporting represented $110 billion as already received, while less had been funded; alternatively, records establish that the announced financing commitments themselves did not total $110 billion.
contradiction_condition: Records establish receipt of $110 billion by publication, or establish that the challenged reporting accurately described $110 billion of agreed commitments without claiming full payment.
measurement_requirements: Separate cash transferred, signed commitments, conditional commitments, and scheduled installments. Do not count financing commitments as cash receipts.
source_requirements: Dated investment agreements, investor disclosures, closing records, and the reporting whose wording is challenged. Press reports may establish reported terms but cannot substitute for payment records.
