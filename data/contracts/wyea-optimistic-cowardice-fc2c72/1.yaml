  - Even if all of these things somehow happen
evaluator_interpretation:
  - The 'even if' clause is rhetorical framing, not a condition to be met. The checkable core is that each company loses billions of dollars a year.
  - "Plain reading of 'lose': annual net loss. Each company must have lost at least about $2 billion ('billions') in its latest full year before the post."
  - "Target period: calendar 2024, the latest full year reported before the 24 March 2025 post."
  - "'No tangible evidence that this will ever change' is a judgement about prospects. It is not scored separately."
support_condition: Reported or reliably reported 2024 net losses of billions of dollars for both CoreWeave and OpenAI.
contradiction_condition: Either company's 2024 net loss was below $1 billion, or it was profitable.
measurement_requirements: 2024 annual net loss for CoreWeave (GAAP, from its IPO filing) and OpenAI (private; figures from company documents as reported by reputable press).
source_requirements: CoreWeave filings or reports of them; reputable news reports of OpenAI's financial documents.
