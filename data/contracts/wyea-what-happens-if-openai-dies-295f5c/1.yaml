assessment_axis: historical_observation
explicit_source_elements:
  - meet its compute obligations
  - both the demand necessary
  - more than $800 billion in cash
  - alternatively, the ability to trade stock for compute
  - which it’s done in the past
evaluator_interpretation:
  - This is an assessment of obligations existing at the post date, not a prediction that OpenAI will default.
  - The full post identifies the relevant payment window as through the end of 2030.
  - Needs cash means cumulative funding as payments fall due, not an $800 billion cash balance required immediately.
  - The stock alternative is an alternative means of settlement, not a forecast antecedent.
  - The demand clause concerns demand sufficient to sustain the commercial funding plan. Whether demand is strictly necessary when outside financing is available remains part of the claim to test.
  - The basis is estimate because the full post attributes its total to press reporting and analyst estimates.
support_condition: A nonduplicative schedule of OpenAI's existing compute obligations establishes more than $800 billion payable through 2030, the relevant cash or equity settlement provisions, and the asserted dependence on customer demand. A documented earlier equity-for-compute transaction supports the historical aside.
contradiction_condition: A complete comparable schedule places the required amount at or below $800 billion, or establishes that the asserted settlement or demand requirements do not apply.
measurement_requirements: Separate binding minimum payments from forecasts, optional capacity, partner spending, and overlapping agreements. Identify due dates, cancellation conditions, financing arrangements, and whose shares any equity settlement uses.
source_requirements: Contracts, filings, counterparty disclosures, or reliable reporting that permits a complete reconciliation of obligations as of the post date.
