assessment_axis: forecast_outcome
explicit_source_elements:
  - Eventually
  - these data centers
  - taking 18-36 months to complete
  - paying customers at a scale that the market can’t actually support
evaluator_interpretation:
  - These data centers means the AI-oriented construction pipeline funded or underway when the post appeared.
  - The ordinary reading is a market-wide shortage of sustainable paying demand as that pipeline opens, rather than a claim that every facility will fail.
  - Commissioning is the forecast's observation setting, not a separate optional antecedent.
  - The construction duration is not a deadline measured from publication.
  - Paying demand requires actual payments and sustained use; preleases alone do not establish it.
support_condition: Representative operating evidence from the publication-date pipeline shows persistent demand-driven vacancies, insufficient paid use or customer payment shortfalls that prevent the new capacity from being sustained.
contradiction_condition: Representative evidence after substantial commissioning shows sustained paying demand sufficient to support the new capacity and its operating and financing obligations.
measurement_requirements: Track a defined construction cohort through commissioning, occupancy, actual paid usage, collections and financing requirements. Separate lack of demand from power, permitting and construction delays.
source_requirements: Project and operator disclosures, tenant payment records, lender reports and independent market measurements covering a representative share of the relevant pipeline.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Substantial commissioning of the relevant pipeline followed by representative sustained operating results could conclusively establish adequate or inadequate paying demand. Isolated facilities or preleasing statistics cannot.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline or named project cohort.
  - No specified utilization, payment or economic viability threshold.
  - The 18-36 month construction duration does not identify completion dates.
