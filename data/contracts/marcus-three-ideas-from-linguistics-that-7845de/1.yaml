evaluator_interpretation:
  - The examples concern unusual semantic role or relation reversals, rather than necessarily ungrammatical syntax.
  - Problematic means representative contemporary approaches show substantial, repeatable difficulty preserving the changed meaning. It does not require every model to fail every example.
  - "Because AI evaluations have no regular reporting quarter, current is assessed using the current calendar year through publication: 2022-01-01 to 2022-06-22."
support_condition: Controlled evaluations of representative contemporary models show substantial failures distinguishing sentences or images whose meanings change when the same words exchange roles or positions.
contradiction_condition: Broad, representative contemporary evaluations show reliable handling of these semantic reversals, including unusual configurations.
measurement_requirements: Controlled pairs with the same words in different orders, checking the resulting roles or relations rather than general image quality.
source_requirements: Primary evaluations of models current in the target period. Later studies may provide methodological context but cannot substitute for contemporaneous outcome evidence.
