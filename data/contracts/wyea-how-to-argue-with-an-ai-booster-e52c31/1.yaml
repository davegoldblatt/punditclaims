assessment_axis: historical_observation
explicit_source_elements:
  - maybe $40 billion in revenue
  - no profit
  - these companies
evaluator_interpretation:
  - These companies refers to generative AI businesses in the surrounding discussion, not the entire revenue of every diversified technology company.
  - Maybe makes the revenue amount approximate; it does not turn it into a future forecast.
  - The ordinary reading of revenue is earned revenue. The source does not explicitly identify an annualized run rate, so annualized figures cannot silently substitute for it.
  - No profit is read as no bottom-line profit from the relevant businesses, rather than no gross profit or negative cash flow.
  - Use the second quarter of 2025 as the latest completed reporting frame for the ongoing observation. This does not establish that the unexplained $40 billion figure was intended as quarterly revenue.
  - The source supplies neither a company roster nor a revenue measurement period or accounting basis; those omissions prevent a matched aggregate calculation.
support_condition: Comparable records for the intended companies and revenue period establish aggregate earned revenue reasonably described as about $40 billion and no bottom-line profit on the same stated scope and accounting basis.
contradiction_condition: Comparable records on the intended scope establish revenue clearly inconsistent with about $40 billion, or positive bottom-line profit contrary to the intended no-profit assertion.
measurement_requirements: Identify the company roster, revenue period, gross-versus-net revenue treatment, profit measure, and accounting basis. Avoid double-counting transactions between providers and resellers. Do not substitute financing, annualized run rates, gross profit, operating income, or cash burn for the claimed measures.
source_requirements: Company financial disclosures where available, otherwise clearly identified reporting or estimates with matching scope. Unknown accounting basis prevents a supported or contradicted score.
