evaluator_interpretation:
  - The preceding sentence anchors the claim to the experiments presented in January 2024.
  - "'Without directly eliciting' is qualified by 'without naming Mario': a descriptive prompt may still strongly suggest a particular character."
  - "'Plagiaristic-like' means recognizable reproduction of a character's distinctive appearance, not a legal conclusion."
  - Distinguish evidence of the general unnamed-character behavior from verification of the attributed experiment and quoted Italian-plumber example.
support_condition: Reliable independent documentation verifies the attributed experiment, including recognizable Mario output from an Italian-plumber prompt that does not name Mario.
contradiction_condition: Reliable records establish that the attributed example named Mario, did not produce recognizable Mario imagery, or was materially misdescribed.
measurement_requirements: A prompt-output record with sufficient prompt history to check whether the character was named, plus provenance linking it to the described experiments.
source_requirements: Independent contemporary testing or independent documentation of the original prompt-output records. The speaker's account alone is insufficient.
