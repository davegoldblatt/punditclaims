  - The combined amount has no established consistent accounting basis.
  - Obligations may include binding floors, conditional estimates, leases, or optional capacity.
  - Many has no numerical threshold.
  - Most could refer to contract count, committed dollars, or near-term payments.
  - Kick in could mean contract commencement, cash payment, or expense recognition.
