explicit_source_elements:
  - OpenAI and Anthropic
  - over $1.3 trillion in obligations
  - many of them non-cancellable
  - looking to take their companies public
  - before most of them kick in
  - tricking retail investors
evaluator_interpretation:
  - Assess the outstanding commitments and IPO plans described as current during October 2026 through the post date, including contractual updates disclosed after quarter-end.
  - Obligations means outstanding contractual payment commitments. Financing raised, supplier investment plans, and aspirational spending targets do not automatically qualify.
  - Avoid counting the same obligation twice through both a supplier arrangement and an aggregate commitments total.
  - Read most by committed dollars, because the statement emphasizes financial burden; the speaker does not specify this denominator.
  - Read kick in as commencement of contractual payments, not the date the agreement was signed or the date its expense appears in earnings.
  - The post identifies company disclosures for some Anthropic amounts but does not establish a consistent source or accounting basis for the combined $1.3 trillion figure. Its aggregate basis is therefore unknown.
  - Non-cancellability and IPO timing are asserted components of an observation, not antecedents of a conditional forecast.
  - Tricking investors requires a specific material misrepresentation or omission; large disclosed obligations alone do not establish it.
support_condition: A reconciled, non-overlapping schedule establishes more than $1.3 trillion of combined outstanding obligations, substantial non-cancellable commitments, IPO plans preceding payment commencement for most of the committed dollars, and material misleading offering disclosures.
contradiction_condition: A comprehensive comparable schedule places the combined amount at or below $1.3 trillion, or authoritative cancellation, payment, IPO, or disclosure records refute a specified material component. Incomplete disclosures alone cannot establish a lower total.
measurement_requirements: Separate binding minimum payments from conditional capacity estimates and optional spending. Establish cancellation exceptions, outstanding amounts, payment commencement, and IPO timing on a consistent basis. Do not add overlapping contractual and financial-statement totals.
source_requirements: Contracts, counterparties' filings, company obligation schedules, IPO filings, and evidence identifying any material misrepresentation. News reports can supply context where primary records are unavailable.
