explicit_source_elements:
  - a brazen attempt to bury costs
  - to make things feel better
  - a company that lost $21 billion
  - only actually lost $8 billion
evaluator_interpretation:
  - The checkable claim is that OpenAI's approximately $21 billion loss was misleadingly reduced to approximately $8 billion through the exclusion or concealment of costs.
  - The surrounding discussion identifies the 2025 annual results, so the target period is calendar 2025.
  - I read the $21 billion figure as an operating-loss claim in the context of revenue and operating expenses. The sentence itself does not specify operating loss, net loss, or cash burn.
  - The financial basis is company_reported because the passage invokes figures from the company's financial results. It does not explicitly specify GAAP.
  - Utter loathing is rhetorical attribution of motive and is not independently graded. The alleged concealment remains part of the factual assessment.
  - Confirming the rounded operating-loss figure alone would not establish the whole claim. A separately defined adjusted loss can coexist with an operating loss.
support_condition: Same-period records confirm an operating loss of approximately $21 billion and establish that the approximately $8 billion presentation concealed or misleadingly excluded costs while purporting to represent the same loss measure.
contradiction_condition: Comparable records disprove the approximately $21 billion operating loss, or a complete reconciliation and the relevant presentation establish that the $8 billion figure transparently measured a different result without the alleged concealment.
measurement_requirements: Keep operating loss, net loss attributable to the company, adjusted loss, and cash burn separate. Reconcile each excluded item and examine how the $8 billion figure was described to its audience.
source_requirements: Prefer full financial statements, a company reconciliation, and the original presentation of the adjusted figure. Use independent financial reporting where primary records are unavailable.
