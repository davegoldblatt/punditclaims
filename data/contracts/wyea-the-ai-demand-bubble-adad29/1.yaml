explicit_source_elements:
  - Azure grew 41% year-over-year
  - 40% or more
  - Microsoft Azure’s growth came from them
  - based on Wells Fargo’s estimates
  - 23% of Azure revenue in FY2026
evaluator_interpretation:
  - The target is Microsoft's fiscal year ended June 30, 2026, as specified by the surrounding discussion.
  - Them means OpenAI and Anthropic together.
  - Share of growth means the increase in Azure revenue from the labs divided by the increase in total Azure revenue between FY2025 and FY2026.
  - Based on Wells Fargo estimates specifies the evidentiary basis; it is not a conditional forecast antecedent.
  - The attribution is assessed as an estimate. Microsoft's reported growth can check the denominator but cannot independently verify the customer allocation.
support_condition: The Wells Fargo estimates, using consistent FY2025 and FY2026 Azure and customer-revenue definitions, imply that the labs supplied at least 40% of Azure's year-over-year revenue increase.
contradiction_condition: The comparable estimates imply a contribution below 40%. An incomplete calculation alone does not prove the numerical claim false.
measurement_requirements: Calculate (lab Azure revenue FY2026 minus lab Azure revenue FY2025) divided by (total Azure revenue FY2026 minus total Azure revenue FY2025). Exclude non-Azure revenue-sharing payments and use consistent currency and revenue definitions.
source_requirements: The original Wells Fargo model or an independently verifiable reproduction containing both years' customer estimates, plus Microsoft's corresponding annual Azure growth disclosure.
