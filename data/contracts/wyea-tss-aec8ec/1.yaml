explicit_source_elements:
  - Google, Microsoft and Meta
  - bet their futures on generative AI
  - cramming it into their products
  - little regard for utility
  - all to show the markets
evaluator_interpretation:
  - The ordinary reading is that all three companies made generative AI central to their strategies and widely integrated it, primarily to impress investors despite weak concern for usefulness.
  - For this ongoing, nonfinancial conduct, I use June 2024, the latest completed month before publication. Earlier announcements are context.
  - The metaphor about betting their futures supplies no spending threshold. Capital spending alone cannot establish disregard for usefulness or investor signaling as the principal motive.
support_condition: Contemporaneous evidence establishes substantial strategic reliance and product integration at all three companies, together with evidence that usefulness was subordinated to impressing investors.
contradiction_condition: Contemporaneous records directly refute a material element, such as showing that a named company had not made the alleged strategic commitment. Useful individual features alone do not disprove the motive allegation.
measurement_requirements: Separate product availability and strategic commitment from demonstrated usefulness and management motives. Do not treat total capital expenditure as spending exclusively on generative AI.
source_requirements: Company announcements can establish launches. Internal records, credible interviews, or independent investigations are needed for the alleged priorities and motives.
