assessment_axis: historical_observation
explicit_source_elements:
  - LLMs are mimics
  - what they say isn’t always true
evaluator_interpretation:
  - I read 'mimics' as saying that LLMs can reproduce patterns and assertions learned from human language, including false ones.
  - I do not read 'mimics' as independently establishing that every output is copied or that no internal representation exists.
  - "'Isn’t always true' requires documented false factual answers, without any minimum error rate."
  - The target is the publicly documented behavior of existing LLMs through the post date, without a specified starting date or recurring reporting period.
support_condition: Primary evaluations document LLM outputs reproducing human misconceptions or other false factual assertions.
contradiction_condition: Evidence establishes that the apparent falsehoods are actually correct, or that the asserted imitation mechanism does not explain the relevant outputs. High average accuracy alone does not contradict 'isn’t always true'.
measurement_requirements: Use factual questions with assessable answers. Separate false assertions from fiction, role-play, refusals, and uncertainty. Do not generalize benchmark error rates to all ordinary usage.
source_requirements: Primary evaluations or developer documentation available by 2026-10-28 concerning behavior documented before the post.
