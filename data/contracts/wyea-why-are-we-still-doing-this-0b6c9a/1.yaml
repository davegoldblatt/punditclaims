evaluator_interpretation:
  - The surrounding discussion concerns independent AI compute providers. I read demand as annual spending on their compute services, excluding the specified hyperscaler purchases.
  - I use calendar 2025, the latest completed annual reporting period before the post and the year explicitly used in the next sentence.
  - A billion dollars is an approximate magnitude, not an exact dollar ceiling.
  - "AI labs and NVIDIA are not automatically excluded: the stated exclusion concerns hyperscalers moving compute off their balance sheets."
  - The passage does not identify an accounting basis or a market-wide calculation. I therefore record the basis as unknown.
support_condition: A market-wide estimate with disclosed coverage and customer exclusions places realized 2025 spending near $1 billion.
contradiction_condition: Comparable customer-level evidence establishes spending materially above or below $1 billion after applying the stated exclusion.
measurement_requirements: Annual realized compute-service spending, with customer classifications, treatment of reselling, and safeguards against counting the same spending twice. Financing, hardware sales, future contracts and annualized run rates cannot substitute.
source_requirements: Provider disclosures or a transparent independent market estimate that separates the excluded purchases.
