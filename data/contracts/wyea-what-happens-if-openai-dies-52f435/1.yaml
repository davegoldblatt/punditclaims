assessment_axis: forecast_outcome
explicit_source_elements:
  - at least $100 billion a year
  - or it’s toast!
evaluator_interpretation:
  - The surrounding discussion makes this a claim about outside financing needed for survival, rather than revenue.
  - Read 'toast' as insolvency or cessation of normal operations caused by insufficient funding.
  - Count financing actually received by OpenAI, excluding unfulfilled commitments and secondary share sales whose proceeds go to shareholders.
  - The claim supplies neither an annual measurement convention nor a deadline for collapse.
support_condition: A complete annual period with less than $100 billion of financing received, followed by documented failure caused by the funding shortfall, would support the conditional prediction.
contradiction_condition: Documented survival through a complete annual operating period with less than $100 billion of financing received would contradict the ordinary annual survival requirement.
measurement_requirements: A complete financing ledger, opening liquidity, payment obligations and evidence of continued operations or insolvency. Commitments must be separated from disbursements.
source_requirements: Prefer recipient financial statements, investor disbursement disclosures and insolvency records. Press estimates must identify their basis.
metric_scope:
  company: OpenAI
  metric: Annual outside financing required for survival
  currency: USD
  units: billions per year
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a documented annual financing shortfall and survival through that operating year, or a documented funding-caused insolvency following that shortfall. Fundraising announcements alone do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Calendar, fiscal or rolling year is unspecified.
  - The delay between insufficient financing and collapse is unspecified.
  - "'Needs' does not explicitly distinguish financing receipts from commitments."
retrospective_or_prospective: retrospective
