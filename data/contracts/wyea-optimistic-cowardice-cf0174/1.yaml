  - contingent on its ability to continue raising money
  - lose over $14 billion in 2025
evaluator_interpretation:
  - The plain reading asserts a necessary financing dependency, not merely that fundraising would help OpenAI expand.
  - For the numerical component, read unqualified company-wide losses as annual net losses. The surrounding discussion also uses cash-burn language, so that alternative must remain explicit.
  - The context identifies the $14 billion figure as Zitron's estimate based on reported spending, rather than a specified accounting-standard forecast.
  - Assess the 2025 loss component and whether resources available without further fundraising could meet CoreWeave payments as they became due. The statement is assessed as a causal claim containing a dated numerical premise.
support_condition: Comparable 2025 results establish losses above $14 billion, and a dated cash-and-obligations reconciliation establishes that OpenAI could not meet CoreWeave payments without further fundraising.
contradiction_condition: Comparable results establish losses of $14 billion or less, or a cash-and-obligations reconciliation establishes that OpenAI could meet the relevant CoreWeave payments without further fundraising.
measurement_requirements: Separate net losses, operating losses, noncash charges, and cash burn. Reconcile opening unrestricted cash, operating cash flows, existing facilities, new financing receipts, and payment due dates.
source_requirements: OpenAI financial statements and cash records, the CoreWeave payment schedule, and financing closing records. Independently verified reporting may substitute for unavailable private-company records.
