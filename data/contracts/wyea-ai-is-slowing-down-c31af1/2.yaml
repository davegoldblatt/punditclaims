assessment_axis: forecast_outcome
explicit_source_elements:
  - both OpenAI and Anthropic
  - speeding as fast as they can toward IPO
  - both will, inevitably, start charging their customers more
  - very likely moving the vast majority of them to token-based billing
  - either kill or vastly limit their subsidized subscriptions
  - no deadline stated
evaluator_interpretation:
  - The firm commitment is only that both companies will start charging customers more. The billing shift and the subscription cuts are marked 'very likely', so they are hedged. They are described in the commentary but are not required for support.
  - The IPO race is the stated reason, not a condition. Support does not require proof that the IPO caused any price rise.
  - "Plain reading of 'charging more': each company raises the price customers pay for an existing paid product after the post. That means a higher list price for an existing subscription tier, or a higher per-token rate for the same model. A new, more expensive tier is not a rise for existing customers. Cutting usage limits at the same price is an arguable effective rise, but it is not counted on its…"
support_condition: After 2026-06-08, both OpenAI and Anthropic each raise the price customers pay for an existing paid product, such as a subscription list price or a per-token rate for the same model.
contradiction_condition: With no deadline, no single event contradicts the forecast. It could only be judged false if one or both companies plainly never raised prices over a long period after reaching IPO. No such period has passed.
measurement_requirements: Dated company announcements or pricing pages, or reliable news reports, showing a price rise on an existing product by each company after 2026-06-08.
source_requirements: Company pricing pages, help-center notices, S-1 or other filings, or reputable news reports.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Supported early if, after 2026-06-08, each of OpenAI and Anthropic raises the price of an existing paid product (a subscription list price, or a per-token rate for the same model). No early contradiction is possible because no deadline was stated.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - "'Charging more' could mean higher list prices or less usage for the same price; only list-price or per-token rises count here."
  - The billing-shift and subscription-cut parts are hedged as 'very likely'.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
