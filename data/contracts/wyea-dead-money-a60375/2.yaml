ambiguity_flags:
  - No period named; I used the year before the post.
  - "'At a loss' could mean negative gross margin on serving or simply overall operating losses; the causal claim needs the first."
  - "'Every few months' is not a fixed interval."
  - He cites no source or accounting basis for the loss claim.
