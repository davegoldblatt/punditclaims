assessment_axis: causal_assessment
explicit_source_elements:
  - businesses are fundamentally built on reselling tokens from the large AI labs
  - at a loss
  - which is why
  - companies like Harvey and Perplexity
  - have to raise hundreds of millions of dollars
  - every few months
evaluator_interpretation:
  - "Plain reading: wrapper startups such as Harvey and Perplexity pay the labs more for model usage (tokens) than they earn from customers for it, so they lose money on serving. That loss is the reason they must keep raising large rounds often."
  - "Three parts must hold: (1) a loss on reselling model output, meaning negative gross margin or serving costs above revenue; (2) Harvey and Perplexity each raise hundreds of millions of dollars at intervals of a few months; (3) the losses are what force the raises."
  - He describes an ongoing state with no period named. I use the year before the post (2025-09-01 to 2026-09-29) as the period public evidence could cover.
support_condition: Credible reports show negative gross margins or serving costs above revenue at Harvey and Perplexity (or wrapper startups broadly), and both firms raising hundreds of millions of dollars every few months to cover those losses.
contradiction_condition: Credible reports show these firms have positive gross margins on serving customers, or that they do not raise hundreds of millions every few months, or that they raise for reasons other than covering losses on serving.
measurement_requirements: Gross margin or cost of model usage against revenue for Harvey and Perplexity; dates and sizes of their funding rounds; any stated reason for raising.
source_requirements: Company disclosures or filings preferred. Reputable press reports (Bloomberg, Reuters, The Information) are acceptable for private-company financials and rounds.
metric_scope:
  company: Harvey and Perplexity (and wrapper AI startups generally)
  metric: gross margin on resold model tokens; equity funding raised per round
  currency: USD
  units: USD millions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: 2025-09-01
  period_end: 2026-09-29
  stock_or_flow: flow
