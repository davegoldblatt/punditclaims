assessment_axis: causal_assessment
explicit_source_elements:
  - These businesses
  - reselling tokens from the large AI labs at a loss
  - which is why
  - Harvey and Perplexity
  - hundreds of millions of dollars every few months
evaluator_interpretation:
  - The ordinary reading is that serving customers costs more than the associated customer revenue, and this operating shortfall necessitates repeated large equity raises.
  - Company-wide net losses alone do not establish negative token-serving economics.
  - For the ongoing financial state, use April through June 2026, the latest completed calendar quarter before the post. Examine surrounding pre-post financing announcements for recurrence, and disclose subsequent pre-post changes.
  - Every few months means repeated rounds separated by months; the speaker supplies no exact maximum interval.
  - The quoted passage identifies no accounting basis. It remains unknown and prevents a definitive financial score.
support_condition: Comparable financial records establish negative service-delivery margins across the described businesses, including Harvey and Perplexity, and cash-flow evidence shows that those losses necessitated repeated raises of hundreds of millions within months.
contradiction_condition: Comparable records show that the asserted loss-making resale model does not generally hold, or demonstrate that the named companies' repeated financing was not required by those losses.
measurement_requirements: Customer revenue, attributable model and serving costs, treatment of free users, cash burn, cash reserves, financing dates and amounts, and evidence distinguishing operating necessity from discretionary expansion.
source_requirements: Company financial records and financing announcements, supplemented by credible reporting on private accounts. Announced investment purposes alone cannot establish necessity.
