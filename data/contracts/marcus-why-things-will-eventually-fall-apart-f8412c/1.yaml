assessment_axis: causal_assessment
explicit_source_elements:
  - everybody
  - essentially the same technical solution
  - essentially the same data
  - so there is no moat
evaluator_interpretation:
  - The context concerns competing general-purpose generative AI model providers, rather than every business using AI.
  - A moat means a durable competitive advantage that rivals cannot readily copy or overcome.
  - Essentially the same allows implementation differences. A shared architecture alone does not establish equivalent capabilities or training data.
  - The claim concerns the situation at publication. Earlier measurements provide context; later developments do not automatically establish what held then.
  - Benchmark convergence is relevant but cannot by itself establish the absence of advantages in distribution, switching costs, proprietary data or infrastructure.
support_condition: Evidence establishes substantially interchangeable technology and data among the relevant providers, and shows that this similarity prevents any provider from maintaining a durable competitive advantage.
contradiction_condition: Evidence establishes a durable competitive advantage for at least one relevant provider, or material technological or data differences that defeat the asserted causal explanation. A temporary benchmark lead alone is insufficient.
measurement_requirements: Comparable model evaluations, information about training data and methods, and longitudinal evidence about switching costs, customer retention, pricing power or other durable advantages.
source_requirements: Technical disclosures and independent measurements, supplemented by credible competition research. Claims of durable advantage require evidence beyond a provider's promotional assertions.
