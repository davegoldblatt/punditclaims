assessment_axis: historical_observation
explicit_source_elements:
  - GPT and similar AI systems
  - time, space, human interactions
  - The weaknesses here are many and critical
evaluator_interpretation:
  - Assess the descriptive assertion about weaknesses, rather than the recommendation to ask particular questions.
  - The plain reading is that contemporary models have multiple substantial weaknesses in basic temporal, spatial, and interpersonal reasoning. It does not require failure on every task.
  - Read critical as materially limiting dependable reasoning in these domains. The wording does not specify measured downstream harm.
  - "For this ongoing research-state observation, use the latest completed research year and the elapsed publication year: 2022 through 17 February 2023. This observation window is evaluator-selected."
support_condition: Primary evaluations establish recurrent, substantial errors across basic temporal, spatial, and interpersonal reasoning, with several distinguishable failure types that undermine dependable answers.
contradiction_condition: Broad evaluations of contemporary models establish robust performance across these domains and show that alleged weaknesses are isolated, unusually difficult, or caused mainly by defective tests.
measurement_requirements: Identify models, task difficulty, sample sizes, prompting methods, and human comparisons where available. Distinguish simple reasoning from difficult multi-step tasks and acknowledge successful results.
source_requirements: Prefer independent primary evaluations of models available before the post. Do not use Marcus's or his coauthor's own examples as independent confirmation.
