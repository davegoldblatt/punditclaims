evaluator_interpretation:
  - The immediate context identifies Imagen and LaMDA; I assess these models rather than all Google research.
  - Community inspection ordinarily means meaningful access for external scientific evaluation. Public weights are sufficient but not necessary.
  - Publication of a paper, selected demonstrations, and constrained consumer feedback do not automatically establish independent scientific access.
  - For this ongoing state, I use the current 2022 model-release cycle through the post date as the latest reportable period; the source supplies no finer reporting interval.
  - The rhetorical criticism of scientific appearance and Google's motives is not separately scored.
support_condition: Dated access policies and records establish systematic withholding of meaningful external scientific evaluation for Imagen and LaMDA during the relevant period.
contradiction_condition: Documented external researchers received meaningful access to inspect or independently evaluate the named models, contradicting the asserted systematic refusal.
measurement_requirements: Distinguish model or API access, independently chosen tests, constrained demonstrations, published outputs, and plans for future access.
source_requirements: Contemporary Google policies and releases, supplemented by documented independent researcher access or refusals.
