assessment_axis: forecast_outcome
explicit_source_elements:
  - once that becomes clear
  - the markets will punish
  - those most deeply invested
  - I have no idea when this reckoning will happen
evaluator_interpretation:
  - The antecedent is public evidence, broadly recognized by investors, that generative AI offers disappointing commercial returns relative to the earlier booms.
  - The ordinary reading of market punishment is a material fall in valuations among the companies most exposed to generative-AI investment, attributable to that realization.
  - Concerns about future returns, a spending announcement or an unrelated stock decline do not alone establish the antecedent.
  - The speaker supplies no company list, exposure ranking, decline threshold or response window. No numerical cutoff is imposed.
support_condition: After the antecedent is independently established, a dated market repricing materially reduces valuations among highly exposed companies, with credible evidence linking the repricing to the recognized weakness in generative-AI returns.
contradiction_condition: The condition would first have to occur. Because no response deadline is supplied, a finite period without punishment cannot conclusively contradict the forecast.
measurement_requirements: Identify highly exposed companies using information preceding the event; measure valuation changes against market and sector movements; distinguish return disappointment from rates, competition and fears that AI will disrupt other businesses.
source_requirements: Comparable evidence of weak returns and investor recognition, followed by market-price records and credible event attribution. Reputable reporting may document investor explanations when primary records do not establish motives.
