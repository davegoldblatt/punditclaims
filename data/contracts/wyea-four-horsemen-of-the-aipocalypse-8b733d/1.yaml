assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA claims
  - $500 billion in orders between 2025 and 2026
  - $1 trillion of sales through 2027
  - unclear where any of those orders are meant to go other than a warehouse in Taiwan
evaluator_interpretation:
  - Assess whether NVIDIA made the reported statements, not whether its future revenue eventually reached those amounts.
  - Read the deployment clause, alongside the surrounding assertion that there is nowhere to put GPUs, as a broad assertion that identifiable deployment destinations were absent.
  - An existing deployment can challenge that broad assertion without proving that every projected order has sufficient capacity.
  - The target period covers the historical announcements beginning in 2025 and deployment information public before the post.
  - The financial scope describes the sales-visibility component. Deployment destinations are a separate nonmonetary component.
support_condition: NVIDIA publicly stated the reported sales magnitudes and contemporaneous deployment records support the assertion that destinations were unidentified.
contradiction_condition: NVIDIA's statements materially differ in amount or meaning, or contemporaneous records identify actual deployments inconsistent with the broad no-destination assertion.
measurement_requirements: Separate cumulative sales visibility, purchase orders and realized revenue. Distinguish actual deployments from announced future capacity.
source_requirements: NVIDIA statements and dated records from NVIDIA or customers identifying deployments. News reporting may establish an announcement when readable primary text is unavailable.
