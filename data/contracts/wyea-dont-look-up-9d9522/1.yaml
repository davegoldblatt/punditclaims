explicit_source_elements:
  - Outside of hedge fund and investor Jane Street and NVIDIA
  - neoclouds do not have significant customers
  - at the level that would warrant all this capex
  - either through direct contracts or by proxy via Microsoft or Google
evaluator_interpretation:
  - Exclude OpenAI- and Anthropic-funded demand, including purchases made for them by intermediaries, as well as Jane Street and NVIDIA.
  - Use April–June 2026 as the latest completed quarterly period before the post.
  - The ordinary reading concerns customers whose commitments materially support the capacity investment. Merely naming a small customer is insufficient.
  - The phrase 'warrant all this capex' requires a relationship between independent customer commitments and investment scale; customer existence alone does not settle the full proposition.
  - Neither a specific capital-expenditure denominator nor an accounting basis is supplied.
support_condition: Customer and project records show that demand outside the exclusions is too small to materially support the identified neocloud investment.
contradiction_condition: Independent customers have commitments demonstrably large enough to support a material portion of the relevant capacity investment on comparable terms.
measurement_requirements: Match customers to ultimate demand, contract durations, committed capacity and associated investment. Do not compare multiyear contract totals directly with annual revenue or annual capital expenditure.
source_requirements: Prefer filings, signed-contract disclosures and project financing records. Distinguish committed amounts from options or conditional purchases.
