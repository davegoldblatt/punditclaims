explicit_source_elements:
  - In some cases
  - bots that actively cultivate those attachments
  - feigning romantic and/or sexual interest
  - “friendly” emoticons
evaluator_interpretation:
  - Some cases is an existence qualifier, not a forecast condition.
  - Actively cultivate means providing or promoting features that invite a personal or romantic bond. It does not require proof that developers intended emotional harm.
  - The examples are alternatives; both sexual overtures and emoticons need not be demonstrated.
  - The observation period is February 2023 through publication, including the product changes discussed in the post.
support_condition: Documented product features, marketing, or developer statements show at least one chatbot deliberately offered interactions inviting emotional or romantic attachment.
contradiction_condition: Reliable product and development records establish that the alleged examples lacked such features or that the behavior was exclusively unintended and neither offered nor promoted.
measurement_requirements: Distinguish product features and marketing from isolated, unplanned model outputs.
source_requirements: Dated product records or developer statements preferred; independent reporting documenting features and marketing is acceptable.
