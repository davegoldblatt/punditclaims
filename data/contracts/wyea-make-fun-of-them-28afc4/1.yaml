explicit_source_elements:
  - 500 million people using ChatGPT
  - very few are actually paying for the product
  - the user numbers weren’t there outside
  - the most occasional users
  - people who are actually using it as part of their daily lives
evaluator_interpretation:
  - "'Very few' means a small proportion of users, not a small absolute subscriber count."
  - The OpenAI-focused context suggests other OpenAI products, although the wording could extend to competing AI services.
  - "'User numbers weren’t there' means a lack of substantial adoption, not literally zero users. The speaker supplies no comparison threshold."
  - I use the latest prepublication calendar quarter, April through June 2025, for this ongoing adoption claim. Earlier snapshots are contextual unless the source reports them as current in that quarter.
  - Subscribers, weekly active users, developers and daily users are different measures. A subscriber-to-weekly-user ratio is approximate.
support_condition: Contemporaneous figures show a small paying share of ChatGPT users and sufficiently comprehensive adoption evidence shows little substantial use of other OpenAI products.
contradiction_condition: Comparable figures show a substantial paying share, or reliable adoption measures establish substantial use outside ChatGPT under the stated product scope.
measurement_requirements: Dated subscriber and active-user counts, their definitions, and comparable adoption measures for the products included outside ChatGPT.
source_requirements: Prefer company disclosures and independently measured usage. News reports may supply subscriber counts when the underlying disclosure is unavailable.
