explicit_source_elements:
  - OpenAI has argued
  - literally can’t build what they are building
  - without an exemption from copyright
  - would crush artists, musicians, writers, and other creators
evaluator_interpretation:
  - "Test the factual attribution: before the post, OpenAI argued that building its leading models required copyrighted material and legal permission to train on it without obtaining individual permission for every work."
  - Read 'exemption' in its ordinary, nontechnical sense as legal latitude to use protected material. This can include an asserted existing fair-use defense; it does not necessarily mean a newly enacted statutory exception.
  - "'Would crush' expresses Marcus's judgment about the threat to creators. He supplies no measurable harm threshold, named legal change, jurisdiction, or deadline, so it is not made a separate outcome requirement."
  - "'Has argued' concerns statements made by publication; no lower date boundary is supplied."
support_condition: Contemporaneous statements establish both OpenAI's asserted need for copyrighted training material and its argument that copyright law permits that training. Support applies to this factual attribution, not to a measured finding that creators were crushed.
contradiction_condition: The relevant statements reject the attributed necessity or permission argument, or their full context shows Marcus materially reversed OpenAI's position. Invoking existing fair use rather than requesting a new statute is not by itself a contradiction under the stated reading.
measurement_requirements: Compare the attributed argument with the substance and context of OpenAI's statements. Do not require subsequent livelihood losses to establish what OpenAI argued.
source_requirements: Prefer contemporaneous OpenAI submissions and announcements. Reputable contemporaneous reporting may establish inaccessible submissions, with that limitation disclosed.
