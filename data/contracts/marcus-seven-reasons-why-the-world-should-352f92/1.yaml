assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI has argued
  - literally can’t build what they are building
  - without an exemption from copyright
  - would crush artists, musicians, writers, and other creators
evaluator_interpretation:
  - This combines a historical attribution with a prediction about harm. Establishing the attribution alone cannot establish the whole claim.
  - An exemption can include reliance on existing fair use. Marcus does not explicitly say that OpenAI demanded a new law or exemption from every copyright obligation.
  - The ordinary reading of 'crush' is severe, widespread damage to creators' livelihoods.
  - The historical attribution concerns statements made before the post. The harm prediction supplies no deadline, jurisdiction, or particular exemption.
support_condition: OpenAI's statements establish that it regarded permission to train without individual copyright authorization as necessary, and reliable evidence establishes the claimed severe harm caused by the relevant exemption.
contradiction_condition: Reliable records contradict the attributed position, or evidence about the specified exemption establishes effects incompatible with the claimed severe, widespread harm. Missing evidence of harm alone is not contradiction.
measurement_requirements: Distinguish needing copyrighted training material from needing permission-free access. For creator harm, identify the exemption and measure livelihood effects attributable to it, separating those effects from AI adoption generally.
source_requirements: OpenAI's contemporaneous submissions establish its position. Independent causal research or authoritative records are required for the livelihood claim.
