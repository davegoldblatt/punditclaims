explicit_source_elements:
  - a right to about 49%
  - a for-profit subsidiary of OpenAI’s profits
  - up until a very complex point
  - may require litigation to resolve
  - the for-profit hasn’t made any profits
  - the for-profit is owned by a non-profit
evaluator_interpretation:
  - This is a compound claim about profit entitlement, limits on returns, corporate structure, and historical profitability.
  - About 49% describes a contractual distribution share, not a revenue share or conventional equity percentage.
  - Owned by a nonprofit is read as having a nonprofit corporate parent; the wording does not necessarily assert sole economic ownership.
  - Hasn’t made any profits describes the subsidiary’s history since its creation through publication. An annual loss alone cannot establish that entire history.
  - The plain reading of profits is realized bottom-line profit. The post supplies neither an accounting basis nor an identified financial source, so accounting_basis remains unknown.
  - May require litigation is a possibility, not a separate firm forecast.
  - The metric_scope records the profitability component. Contractual distribution percentages require separate evidence and are not interchangeable with net income.
support_condition: Records establish an approximately 49% capped profit entitlement, nonprofit parentage, and no realized profits over the subsidiary's history on an identified, consistent accounting basis.
contradiction_condition: Comparable records establish materially different contractual rights or corporate parentage, or demonstrate realized profits during the claimed history. A difference between profit-distribution rights and accounting profit must not be treated as a contradiction.
measurement_requirements: Identify the legal entity, distribution stages, cap, profit definition, accounting basis, and financial periods. Do not substitute revenue, cash burn, or absence of distributions for profitability.
source_requirements: Investment agreements and corporate records for structure and rights; financial statements or adequately specified financial reporting for profitability.
