assessment_axis: forecast_outcome
explicit_source_elements:
  - Anthropic
  - hundreds of billions of compute costs due
  - in the next few years
  - they’re going to increase dramatically
evaluator_interpretation:
  - The claim combines a payment forecast with a forecast of substantially higher annual compute costs.
  - Read 'hundreds of billions' as at least $200 billion cumulatively due, rather than merely contracted for delivery over a longer period.
  - Use the next three calendar years, through December 2029, as a provisional interpretation of 'the next few years'. The wording does not establish a unique deadline.
  - Read 'increase dramatically' as a substantial increase over 2026 annual compute costs. The speaker supplies no percentage threshold.
  - Contractual payments, recognized expenses, and annualized quarterly spending must be distinguished and reconciled.
support_condition: Payment schedules establish at least $200 billion due within the interpreted horizon, and comparable annual results show substantially higher compute costs than in 2026.
contradiction_condition: Complete records for the interpreted horizon establish less than $200 billion due, or comparable annual compute costs remain flat, decline, or increase only slightly.
measurement_requirements: Dated contractual payment schedules and comparable annual compute-cost disclosures, including a reconciliation of lease payments, capital expenditures, and recognized expenses. Do not divide lifetime commitments evenly across years unless the contracts require that schedule.
source_requirements: Prefer Anthropic filings and contractual disclosures. Future operating results must be reported outcomes, not management forecasts.
metric_scope:
  company: Anthropic
  metric: Compute costs and contractual compute payments due
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
