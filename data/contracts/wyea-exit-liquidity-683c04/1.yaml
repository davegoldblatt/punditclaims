early_resolution_rule: Resolve early only if dated records establish both the cumulative payment threshold within the horizon and an already-realized substantial increase in comparable annual compute costs, or a decisive event makes the forecast impossible. Signing contracts alone does not establish future realized costs.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
