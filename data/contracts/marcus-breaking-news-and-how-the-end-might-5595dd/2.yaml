explicit_source_elements:
  - spending most money with least assets
  - they’ve made the most commitments
  - They do not have the deep pockets that Google does
  - OpenAI, Anthropic, Google, maybe Amazon
evaluator_interpretation:
  - Read together with the discussion of cash burn and paying bills, the ordinary claim is that OpenAI's spending is most stretched relative to its asset backing, and that it has undertaken the largest financial commitments. Absolute quarterly expenditure alone would not test this reading.
  - Assets means resources available to support spending. Compare liquid resources and total assets separately; neither company valuation nor promised investment is automatically available cash.
  - Commitments means outstanding obligations to spend money, especially on computing infrastructure. Distinguish binding obligations from announced ambitions and avoid counting overlapping agreements twice.
  - Use May 2026, the latest completed month before publication, to interpret the ongoing state. Marcus supplies no reporting period; quarterly observations are context unless they establish the May position.
  - Include Anthropic and Google, with Amazon as the expressly tentative additional comparator. Parent-company resources matter where they are available to support the AI business.
  - The passage identifies no accounting basis or particular financial dataset. The contract therefore retains an unknown accounting basis.
support_condition: Comparable records establish that OpenAI had the most strained relationship between cash spending and available assets among the named providers, alongside the largest outstanding spending commitments. The comparison must explain its treatment of asset backing, payment schedules and conditional commitments.
contradiction_condition: Comparable records establish that OpenAI did not have the greatest spending burden relative to asset backing, or that another named provider had larger outstanding commitments on the same basis. Larger absolute expenditure by Google or Amazon alone does not contradict the claim.
measurement_requirements: Match periods, entities and accounting definitions. Separate cash burn from expenses and net losses; separate assets from valuation and undrawn financing; distinguish contractual payment obligations from forecasts. Do not manufacture a single ranking from incompatible figures.
source_requirements: Prefer financial statements and contractual disclosures. Private-company reporting may supplement them if its definitions and dates are clear. An unknown contract accounting basis precludes a supported or contradicted money assessment.
