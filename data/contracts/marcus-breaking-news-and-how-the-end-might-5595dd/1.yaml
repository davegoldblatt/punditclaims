ambiguity_flags:
  - No reporting period specified; latest completed quarter adopted.
  - Three distinct financial measures are combined.
  - Absolute spending versus spending relative to assets is ambiguous.
  - Assets could mean total assets, cash or owned infrastructure.
  - Commitments could include nonbinding plans.
  - Company-wide versus AI-business-only perimeter is unspecified.
  - Accounting basis and currency are unspecified.
  - A single metric_scope cannot represent both flows and stocks.
