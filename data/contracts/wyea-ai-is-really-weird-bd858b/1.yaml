evaluator_interpretation:
  - The principal assertion is a conditional judgment about business sustainability.
  - The passage supplies no financial test, duration, or event that would establish sustainability or its absence.
  - Do not replace sustainability with bankruptcy, current profitability, positive cash flow, or a chosen customer-retention threshold.
  - The historical-loss aside is distinct from the sustainability conclusion. Its accounting measure and basis are unspecified, so later net-loss disclosures cannot silently define its scope.
support_condition: No faithful binary support condition can be fixed without adding a sustainability measure and time frame that the speaker did not supply.
contradiction_condition: No faithful binary contradiction condition can be fixed without adding those same definitions.
measurement_requirements: A defined viability measure and assessment period, verified Meta spending and revenue contribution, and a specified accounting measure for the loss-history aside.
