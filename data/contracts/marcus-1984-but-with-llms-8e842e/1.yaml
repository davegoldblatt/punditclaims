assessment_axis: causal_assessment
explicit_source_elements:
  - No LLM is fully coherent in its 'beliefs'
  - because by nature they parrot a variety of conflicting things from their training
  - training ... is itself inconsistent
  - rather than reasoning their way to a coherent view
evaluator_interpretation:
  - The claim has two parts. First, every LLM shows inconsistent stated views across related prompts. Second, the cause is that LLMs repeat conflicting training data instead of reasoning.
  - Both parts must be supported. The period is the state of LLMs up to the post date.
support_condition: Consistency studies show that major LLMs give inconsistent opinions across paraphrased or related prompts, and controlled studies trace that inconsistency to conflicting training data rather than to other causes.
contradiction_condition: Some LLM is shown to be fully consistent, or studies show the inconsistency comes mainly from something other than conflicting training data (for example prompt format or post-training).
measurement_requirements: Consistency or robustness evaluations of LLM opinions, plus studies that test the cause.
source_requirements: Peer-reviewed or preprint research.
