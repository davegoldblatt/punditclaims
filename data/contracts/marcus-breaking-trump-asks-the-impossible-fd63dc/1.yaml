explicit_source_elements:
  - not an Anthropic problem
  - a Generative AI problem
  - At least with respect to LLMs
  - guardrails can't be circumvented
evaluator_interpretation:
  - The plain reading is that vulnerability to jailbreaks extends across developers of general-purpose language models. The surrounding discussion explicitly focuses on LLMs.
  - Support requires documented successful jailbreaks across multiple non-Anthropic developers. It does not require equal vulnerability across models.
  - The statement describes an ongoing condition without a reporting period. I use May 2026, the latest complete calendar month before the post, as the reporting snapshot.
  - This assesses the shared vulnerability of existing systems, not a mathematical claim that every possible future generative system must be vulnerable.
support_condition: Public adversarial evaluations describing the target period document successful guardrail bypasses in general-purpose language models from at least two non-Anthropic developers.
contradiction_condition: Broad, credible evaluations establish that the alleged vulnerability was specific to Anthropic and that comparable non-Anthropic systems reliably prevented the relevant bypasses. Failure to find attacks in one bounded test would not establish this.
measurement_requirements: Identify tested models and developers, distinguish attempted attacks from successful bypasses, and retain the evaluation's attack conditions. Do not treat benchmark success rates as rates of harmful behavior during ordinary use.
source_requirements: Prefer original cross-vendor evaluations with described methods. Evidence must describe the target period and have been available by 2026-10-28.
