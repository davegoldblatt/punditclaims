assessment_axis: forecast_outcome
explicit_source_elements:
  - destined to burn billions of dollars
  - in increasing intervals
evaluator_interpretation:
  - The ordinary reading is increasing net cash consumption, rather than increasing accounting losses or gross spending.
  - I would measure operating cash flow after capital expenditures, infrastructure prepayments, and relevant finance-lease principal payments, excluding financing proceeds and transfers into financial investments.
  - Comparable quarterly reporting periods provide an ordinary way to assess the rate, but the speaker supplies neither a reporting interval nor a deadline.
support_condition: Successive comparable future periods show net cash consumption measured in multiple billions of dollars, with the amount consumed per period increasing.
contradiction_condition: A definitive end to the company's operations or financial obligations establishes that the predicted pattern never occurred. Temporary positive cash flow alone cannot disprove an undated forecast.
measurement_requirements: Comparable cash-flow statements and supporting notes separating operating and infrastructure cash consumption from financing, investment transfers, and noncash charges.
source_requirements: Company financial statements or equivalent independently verified cash-flow disclosures.
metric_scope:
  company: Anthropic
  metric: Net cash consumption from operations and infrastructure investment
  currency: USD
  units: billions per comparable reporting period
  accounting_basis: company_reported
