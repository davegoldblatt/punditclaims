explicit_source_elements:
  - That capex reduction
  - a reduction in expenditures on NVIDIA GPUs
  - take a chunk out of the US stock market
  - downstream ramifications
  - just like the dot com bubble did on the wider economy
evaluator_interpretation:
  - This predicts an eventual causal chain, with no deadline. The capex decline is part of the predicted sequence, rather than a separately supplied conditional antecedent.
  - The ordinary reading is a material reduction in AI infrastructure investment by the large technology companies discussed, followed by lower NVIDIA GPU spending, meaningful losses in broad US equities, and damage to economic activity.
  - The dot-com comparison means spillovers into the wider economy; it does not specify an identical recession or market decline.
  - The context alternates between slower capex growth and an outright reduction. Both must be distinguished from accounting reclassifications.
  - No currency, accounting basis, numerical threshold, or measurement period is specified.
support_condition: A documented AI investment downturn is followed by lower spending on NVIDIA GPUs, meaningful broad US equity losses, and wider economic harm, with evidence connecting the links.
contradiction_condition: "A completed AI investment downturn and adequate follow-up show that a necessary link failed: comparable NVIDIA GPU spending did not fall, or the predicted market and economic damage did not follow. Continued expansion before such a downturn does not contradict an undated forecast."
measurement_requirements: Comparable AI infrastructure expenditure series for the named buyers; NVIDIA GPU purchases distinguished from total NVIDIA revenue and networking sales; broad US equity returns; and output, employment, or consumption measures. Separate spending levels from growth rates, guidance from realized spending, and causal effects from unrelated shocks.
source_requirements: Company filings and disclosures for expenditure and GPU sales, market measurements, official economic statistics, and credible analysis connecting the events. News reports can document market reactions when primary attribution is unavailable.
