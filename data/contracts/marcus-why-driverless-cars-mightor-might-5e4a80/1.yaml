assessment_axis: forecast_outcome
explicit_source_elements:
  - reliable self-driving cars will emerge
  - eventually be safer than humans
evaluator_interpretation:
  - This is an existence forecast, with no fixed deadline.
  - The plain reading includes genuinely driverless vehicles operating reliably within defined service areas. It does not require every vehicle to drive everywhere under every condition.
  - Reliable means sustained real-world operation without a human supervising the driving. Safer means lower crash and injury-crash rates per mile against reasonably comparable human driving.
support_condition: Independent real-world evidence establishes sustained driverless operation and lower overall and injury-crash rates than comparable human drivers within the vehicles' operating areas.
contradiction_condition: A decisive finding establishes that such vehicles cannot emerge. Failures of particular systems or the passage of time alone cannot contradict an unlimited eventual forecast.
measurement_requirements: Compare driverless miles with human miles in matching locations and periods. Account for crash-reporting differences and distinguish overall crashes from injury crashes.
source_requirements: Public deployment records and independent safety analysis using documented crash and mileage data.
metric_scope: null
original_horizon: eventually
horizon_interval:
  start: 2023-10-27
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported once a public independent study documents sustained real-world driverless deployment with lower overall and injury-crash rates than comparable human driving. The finding must apply to deployed vehicles, not a simulation or supervised demonstration.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Reliable has no numerical threshold.
  - The claim does not specify whether geographically limited operation qualifies.
  - Safer has no specified metric or human comparison group.
  - Eventually supplies no deadline.
retrospective_or_prospective: retrospective
