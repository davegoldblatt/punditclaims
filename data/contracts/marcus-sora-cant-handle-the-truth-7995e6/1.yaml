ambiguity_flags:
  - Grounding could otherwise imply more than paired video-text training.
  - The surrounding post says only one of the three kings is on the board; the claim does not require three kings simultaneously occupying it.
  - The causal wording tests sufficiency, not the mechanism producing the error.
