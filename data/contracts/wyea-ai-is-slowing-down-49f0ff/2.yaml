  - nor can you measure its return on investment
evaluator_interpretation:
  - Read literally, the line says per-task cost and ROI cannot be measured at all. Reviewers found that reading stretched against the speaker, since per-request token billing makes after-the-fact cost plainly measurable.
  - In context, the speaker means that companies lack practical, real-time visibility and predictability of AI spend, and have no reliable way to tie spend to returns. That reading is a sweeping generalization about companies' practices, with no threshold or measure that evidence could settle.
