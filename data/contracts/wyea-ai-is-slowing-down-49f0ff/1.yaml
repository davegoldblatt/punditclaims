assessment_axis: historical_observation
explicit_source_elements:
  - you can’t measure
  - the cost of a particular task with AI
  - nor can you measure its return on investment
evaluator_interpretation:
  - The plain reading is a categorical claim that task costs and financial returns cannot be measured. It does not merely say that measurement is difficult or that returns are disappointing.
  - I distinguish measuring expenditure after a task from predicting its cost before execution.
  - Task-specific model charges count as measurable task expenditure. They do not establish the full cost of implementation, supervision, or correcting mistakes.
  - Financial ROI requires attributable monetary benefits and relevant costs. Time savings alone, or assumed financial benefits, do not establish realized ROI.
  - Because the statement describes an ongoing capability without a reporting period, I use May 2026, the latest completed calendar month before publication.
  - A documented counterexample can contradict the categorical statement. If only the cost component is disproved, the assessment must leave the ROI component explicitly unsettled.
support_condition: Evidence establishing that task expenditure and attributable financial returns cannot be measured within the stated scope. Widespread difficulty or missing reports alone would not establish impossibility.
contradiction_condition: A documented measurement of expenditure attributable to a particular AI task contradicts the cost component. A documented comparison of attributable realized financial benefits against relevant investment and operating costs contradicts the ROI component.
measurement_requirements: Separate task-level expenditure from aggregate budgets, predictions from measurements, and realized financial returns from monetized time-saving estimates.
source_requirements: Dated primary measurement records, reproducible benchmarks, or deployment studies. Vendor-operated measurements must be identified as such.
