evaluator_interpretation:
  - The surrounding passage distinguishes conventional ownership of OpenAI from contractual rights to its subsidiary’s profits.
  - The qualification expresses uncertainty, rather than a condition that must happen.
  - For this ongoing legal arrangement, the reporting window runs from the latest explicit company ownership statement located before publication through the post date. Corporate ownership has no regular quarterly reporting period here.
  - This is a claim about legal ownership, not the value of Microsoft's investment.
support_condition: Reliable records distinguish Microsoft's profit-distribution rights from ownership of 49% of OpenAI.
contradiction_condition: Reliable records establish that Microsoft held conventional ownership of 49% of OpenAI under the arrangement being described.
measurement_requirements: Distinguish the nonprofit parent, its commercial subsidiaries, profit rights, and voting or management rights.
