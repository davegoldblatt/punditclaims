ambiguity_flags:
  - Exploding and reconstructing are technically unspecified metaphors.
  - No distinction is made between base models and systems with additional checking.
  - The wording does not distinguish a contributing cause from a complete explanation.
  - Factual accuracy and internal coherence are different properties.
