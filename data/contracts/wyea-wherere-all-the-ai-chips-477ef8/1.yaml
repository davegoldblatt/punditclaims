explicit_source_elements:
  - It’s very clear
  - Microsoft is playing silly buggers with the term “capacity”
  - makes me believe this is an industry-wide problem
evaluator_interpretation:
  - Read the colloquial accusation as a claim that Microsoft materially blurs operational AI capacity with broader facility or secured-power capacity. Do not infer deliberate deception.
  - The industry-wide extension is explicitly a belief. Assess whether the same material conflation is documented across major operators.
  - "For this ongoing disclosure claim, use the most recent calendar reporting cycle before publication: July 1 through September 22, 2026."
  - Different capacity measures are not inherently misleading when their scopes are explained.
support_condition: Microsoft's disclosures materially present broader or uncommissioned capacity as operational AI capacity, with comparable evidence of the practice across major operators.
contradiction_condition: The relevant disclosures consistently distinguish operational AI capacity, overall facility capacity and contracted power, and the alleged conflation disappears when those definitions are applied.
measurement_requirements: Compare the exact disclosures and definitions. Separate facility power, IT load, contracted power, commissioning and workload availability. A difference between total and AI-specific capacity is not sufficient by itself.
source_requirements: Contemporaneous company disclosures and definitions, supplemented by independent records where actual operational status is disputed.
