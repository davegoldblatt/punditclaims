  - CoreWeave’s S-1
  - appears to be built for collapse
  - over 60% of its revenue
  - one customer, Microsoft
evaluator_interpretation:
  - The testable numerical assertion concerns Microsoft's share of CoreWeave's revenue for fiscal 2024, the financial year discussed in the surrounding passage.
  - Revenue dependence means revenue concentration, not a claim that Microsoft guaranteed future purchases.
  - The hedged phrase about collapse is an assessment of risk without a defined failure event or deadline. Supporting the concentration figure does not establish that collapse was inevitable.
support_condition: CoreWeave's reported fiscal 2024 revenue attributable to Microsoft exceeded 60% of total revenue.
contradiction_condition: Comparable fiscal 2024 disclosures put Microsoft's share at 60% or below.
measurement_requirements: Use recognized annual revenue and the corresponding customer concentration percentage, not bookings, remaining performance obligations, or forecast revenue.
source_requirements: CoreWeave's registration statement or equivalent financial disclosure identifying Microsoft and the relevant year.
