  - Revenue could have been intended as a full-year estimate or confused with annualized run rate.
  - Revenue accounting basis and gross-versus-net recognition are unstated.
  - Few, production, and the population of companies are undefined.
  - Profit uncertainty is about public knowledge at publication, whereas the revenue clause names the full year.
