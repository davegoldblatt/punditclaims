assessment_axis: historical_observation
explicit_source_elements:
  - A billion or two in revenue this year
  - it’s not clear how much of that is profit
  - a lot of companies spent money testing LLMs
  - few were actually using the LLMs in production
evaluator_interpretation:
  - This year means calendar 2023. The ordinary financial reading is approximately USD 1–2 billion of actual revenue, not an annualized run rate.
  - Because the post preceded year-end, the revenue amount may have been a provisional full-year estimate. It is not treated as a separately stated forecast.
  - The profit clause concerns what was publicly established at publication, not whether later disclosures revealed a profit or loss.
  - The adoption clause concerns 2023 before publication. Few means a small minority of relevant companies, without imposing an invented percentage cutoff.
  - The revenue assertion names no source or accounting basis. The contract therefore records unknown rather than assuming company-reported or estimated accounts.
  - The single target period covers the explicitly named year; post-publication adoption changes cannot settle the pre-publication adoption clause.
support_condition: Comparable calendar-2023 revenue is approximately USD 1–2 billion, contemporary public reporting leaves profit undetermined, and representative evidence shows experimentation substantially exceeding production among relevant companies.
contradiction_condition: Comparable calendar-2023 revenue falls outside the approximate range, contemporary public records clearly establish the profit amount, or representative pre-publication evidence shows production was widespread among companies testing LLMs.
measurement_requirements: Keep realized annual revenue separate from monthly revenue and annualized run rate. Adoption evidence must distinguish experiments from production and identify its sample, fieldwork dates, and denominator.
source_requirements: Company financial disclosures or reputable financial reporting, plus original enterprise surveys. Account registrations and selected customer examples are not representative production-deployment measures.
