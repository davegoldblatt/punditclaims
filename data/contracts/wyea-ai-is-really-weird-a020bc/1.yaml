assessment_axis: causal_assessment
explicit_source_elements:
  - sudden burst in token burn across OpenRouter
  - doesn’t suggest a bunch of people suddenly decided to connect
  - nearly twice the amount of tokens
  - to do the same tasks
evaluator_interpretation:
  - Assess the February–March 2026 increase described in the surrounding launch chronology.
  - "Read this as a comparative causal explanation: increased tokens per task, rather than increased adoption, principally explains the observed aggregate increase."
  - Compare Opus 4.6 with Opus 4.5 and Sonnet 4.6 with Sonnet 4.5 on matched tasks and representative settings.
  - Treat 'suggests' as a qualification of confidence, not a conditional antecedent.
  - Distinguish output tokens, input tokens, cached tokens, and aggregate routed tokens. A benchmark output-token ratio alone cannot explain total platform traffic.
support_condition: Matched-task measurements show approximately doubled token use under relevant settings, and OpenRouter traffic decomposition shows that this change principally explains the increase rather than new users, more tasks, or a changed task mix.
contradiction_condition: Representative matched-task measurements show no comparable increase, or OpenRouter cohort and request data establish adoption or workload growth as the principal cause.
measurement_requirements: Matched prompts, model versions, reasoning settings, tools, context, and token categories; dated OpenRouter user, request, task-mix, and token-per-task data.
source_requirements: Reproducible benchmarks and primary OpenRouter measurements. Anecdotal usage-limit reports cannot establish platform-wide causation.
