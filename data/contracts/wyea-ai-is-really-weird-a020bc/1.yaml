ambiguity_flags:
  - Nearly twice has no specified tolerance.
  - Token burn does not distinguish input, output, reasoning, or cached tokens.
  - Same tasks does not specify effort settings or required output quality.
  - The wording shifts between Anthropic models and other providers.
  - Aggregate traffic can change through several mechanisms simultaneously.
