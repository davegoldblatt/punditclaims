ambiguity_flags:
  - Language models versus all generative AI tools
  - Persistent fallibility versus literal inevitability
  - Autocomplete as metaphor versus complete technical description
  - Unauthorized use versus unlawful theft
  - No dataset definition or verified petabyte quantity
  - Whether the sourcing allegation concerns some or all training material
