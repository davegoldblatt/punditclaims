assessment_axis: causal_assessment
explicit_source_elements:
  - fantastical versions of autocomplete
  - can't help but make the same mistakes
  - learned from the petabytes of information
  - stolen from others
evaluator_interpretation:
  - "The central testable assertion is causal: learning from source material gives generative AI a persistent tendency to reproduce errors in that material."
  - Cannot help means a recurring limitation, not that every answer is false or that error rates cannot improve.
  - Autocomplete is read as a description of next-token prediction for language models, rather than a literal description of every generative architecture.
  - Stolen is read as material acquired or used without rights-holder authorization. Lack of authorization alone does not establish unlawful infringement.
  - The assessment concerns technology discussed at publication. Subsequent models cannot retroactively settle its capabilities.
  - The claim joins a technical mechanism, a breadth claim about tools, a data-volume assertion, and a contested provenance characterization.
support_condition: Representative controlled studies trace recurring output mistakes to erroneous training examples, and provenance records establish the asserted unauthorized sourcing and scale for the relevant tools.
contradiction_condition: Representative evidence defeats the claimed error mechanism or demonstrates that the asserted sourcing characterization does not apply to the relevant tools. Error-rate improvements alone do not disprove persistent fallibility.
measurement_requirements: Trace specific training errors into outputs while controlling prompts and other causes; distinguish model families and training stages. Establish dataset provenance, authorization, and volume independently.
source_requirements: Controlled research, technical training disclosures, verifiable dataset records, and relevant legal findings. Allegations of infringement are not findings, and next-token training alone does not prove inevitable error reproduction.
