explicit_source_elements:
  - OpenAI's spend and revenue share
  - Microsoft's $331.8 billion in FY26 revenue
  - around 7.26%
evaluator_interpretation:
  - FY26 means Microsoft's fiscal year ending June 30, 2026.
  - The numerator is Microsoft's recognized revenue from commercial arrangements with OpenAI, including revenue-sharing payments. It is not OpenAI's total spending or Microsoft's cash collections.
  - Approximately 7.26% means the calculated share rounds to 7.26% at two decimal places. The stated total revenue is rounded to one decimal place in billions.
support_condition: Microsoft's FY26 disclosures show total revenue rounding to $331.8 billion and OpenAI commercial revenue whose share of that total rounds to 7.26%.
contradiction_condition: Comparable FY26 disclosures show a materially different total or an OpenAI revenue share that does not round to approximately 7.26%.
measurement_requirements: Divide realized FY26 OpenAI commercial revenue, including revenue sharing, by realized consolidated FY26 revenue. Use the same currency, reporting period and revenue-recognition basis.
source_requirements: Microsoft's FY26 financial statements and related-party disclosure, preferably the filed 10-K.
