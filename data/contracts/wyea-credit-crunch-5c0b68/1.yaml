assessment_axis: forecast_outcome
explicit_source_elements:
  - at least $444 billion in revenue
  - in the next three years
  - if this revenue fails to arrive
  - either through insolvency or renegotiation of terms
  - every connected hyperscaler
  - massive revenue misses
evaluator_interpretation:
  - Read the deadline as three years from publication, ending October 6, 2029.
  - Read 'massive revenue misses' as large shortfalls in reported revenue against analyst forecasts established before the payment failure, rather than merely slower growth or lower share prices.
  - The condition requires lost expected payments through insolvency or renegotiation. Concerns about future affordability do not establish it.
  - The surrounding passage identifies Microsoft, Google, SpaceX, Oracle and Amazon, but the complete set of connected hyperscalers and their individual forecast allocations need verification.
support_condition: After the stated payment failure occurs, every connected hyperscaler reports a large revenue shortfall against the prior analyst baseline, attributable to the lost OpenAI or Anthropic business.
contradiction_condition: After a qualifying payment failure and completion of the affected reporting periods, at least one connected hyperscaler avoids a large revenue miss against the prior baseline.
measurement_requirements: Recover the original analyst forecasts, company allocations, accounting definitions and reporting periods. Compare like-for-like realized revenue with those forecasts and establish the contribution of lost payments. Do not substitute financing, backlog or annualized run rates.
source_requirements: Original analyst research, documented defaults or amended contracts, and hyperscaler financial disclosures. News reports may establish private contractual events when primary records are unavailable.
metric_scope:
  company: Connected hyperscalers receiving payments from OpenAI and Anthropic
  metric: Aggregate revenue expected from OpenAI and Anthropic
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: 2026-10-06
  period_end: 2029-10-06
  stock_or_flow: flow
  annualized_or_realized: realized
