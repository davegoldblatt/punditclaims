  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires a documented qualifying payment failure and completed affected revenue periods establishing the predicted result or a decisive counterexample. Revised forecasts or expressions of concern alone do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No numerical definition of massive.
  - No original analyst baseline or company allocation is supplied.
  - Calendar, fiscal and rolling three-year periods are not distinguished.
  - The amount of missing revenue needed to trigger the condition is unspecified.
  - Connected hyperscalers is not exhaustively defined.
retrospective_or_prospective: prospective
