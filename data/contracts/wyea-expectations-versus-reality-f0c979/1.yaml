assessment_axis: forecast_outcome
explicit_source_elements:
  - will now see his company publicly burn
  - as a result of launching half-finished shit
  - damaging public trust in the tech industry in the process
evaluator_interpretation:
  - I read 'his company publicly burn' as a conspicuous business failure of Rabbit, such as collapse, shutdown, or a documented terminal business failure. Poor reviews alone do not establish that outcome.
  - "The forecast includes a causal claim: the unfinished R1 launch must materially contribute to the company failure."
  - The trust claim concerns the wider technology industry, rather than dissatisfaction with Rabbit alone.
  - "'Now' conveys urgency but supplies no calendar deadline. The unfinished launch is an asserted cause, not a conditional antecedent."
support_condition: Rabbit undergoes a public business failure, credible evidence identifies the unfinished R1 launch as a material cause, and consumer research documents resulting damage to trust in the technology industry.
contradiction_condition: Decisive evidence rules out the stated causal chain, such as a terminal company outcome demonstrably unrelated to the launch, together with evidence addressing the alleged trust effect. Continued operation at an arbitrary date does not refute an undated forecast.
measurement_requirements: A documented company-level failure; evidence separating launch-related causes from financing, regulation, or other causes; and research connecting exposure to the Rabbit episode with wider industry trust.
source_requirements: Company or court records for a terminal outcome, independently corroborated reporting for business events and causes, and credible consumer research for the trust effect.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon a decisive company outcome with evidence sufficient to establish or rule out the forecast's causal chain, including its industry-trust component. Bad reviews, financial distress, product discontinuation, or continued operation alone are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Publicly burn' could mean reputational humiliation rather than company collapse."
  - "'Now' does not establish a deadline."
  - The magnitude and population of the alleged industry-trust effect are unspecified.
retrospective_or_prospective: retrospective
