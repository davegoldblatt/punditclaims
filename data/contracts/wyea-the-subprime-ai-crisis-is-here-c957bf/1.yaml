  - their current workload or workflow
  - based on their current subscription
evaluator_interpretation:
  - The ordinary reading concerns reliable assurance supplied by a standard subscription, rather than a prediction that every user's workflow will actually fail.
  - Assess the terms in force on March 31, 2026, and whether they assure unchanged workload support through June 30, 2026.
  - The scope is ordinary individual subscriptions. Separately negotiated enterprise guarantees require separate examination.
  - Three months describes the assurance being discussed; it does not turn the statement into a forecast of actual service failure.
support_condition: Both providers' standard terms allow relevant service or capacity changes within three months and do not assure unchanged support for a subscriber's existing workload throughout that interval.
contradiction_condition: The relevant standard subscriptions provide enforceable three-month assurances of the capacity and functionality needed to continue existing workloads.
measurement_requirements: Terms, service-change provisions, and applicable subscription assurances in force at publication. Later changes or uninterrupted service alone do not settle what was assured then.
source_requirements: Dated provider terms and official subscription documentation.
