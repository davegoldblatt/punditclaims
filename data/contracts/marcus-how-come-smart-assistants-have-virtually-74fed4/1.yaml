assessment_axis: historical_observation
explicit_source_elements:
  - When an LLM produces a sentence
  - you can't directly use that sentence to control stuff
  - unless you build another system to parse the sentences into actions
  - Nobody knows how to do this reliably
evaluator_interpretation:
  - The claim concerns natural-language output and its connection to device actions, not merely whether a model can generate executable code.
  - Reliably means dependable performance across ordinary variations of assistant requests, rather than perfect performance or a successful demonstration.
  - The ongoing knowledge claim is assessed using the current research year through the post date, January 1–November 22, 2022. This field has no standard quarterly reporting period.
  - The architecture assertion and the broader assertion that no reliable method was known must both be considered.
support_condition: Contemporary architectures establish the need to connect generated language to executable actions, and sufficiently broad evaluations establish that available methods remained unreliable for ordinary assistant requests.
contradiction_condition: A publicly documented method available by the post date reliably converted LLM sentences into actions across a meaningful range of ordinary requests, or demonstrated that the asserted separate interpretation step was unnecessary for such sentences.
measurement_requirements: Separate language interpretation errors from perception, planning, and actuator failures. Examine repeated task success and robustness, not only demonstrations or code-generation benchmarks.
source_requirements: Contemporary primary architecture descriptions and empirical evaluations of systems available by November 22, 2022.
