evaluator_interpretation:
  - The forecast covers calendar 2026.
  - "Plain reading: during 2026, there will be many demos of humanoid home robots, but few will work reliably in real homes. Home deployments will be scarce, limited, heavily assisted (for example teleoperated), or have documented reliability problems."
  - "Early resolution rule: contradicted early if, before 2026-12-31, independent reviews document humanoid robots doing useful household tasks autonomously and reliably in many ordinary homes at scale."
support_condition: By the end of 2026, demos of humanoid home robots are plentiful, while real home use is rare, limited, heavily teleoperated or shown to be unreliable in independent reviews.
contradiction_condition: During 2026, humanoid robots are shown in independent reviews to work reliably and autonomously in many consumer homes, or demos are few.
measurement_requirements: Counts of demos; independent home trials and reviews recording task success, failures and human intervention; delivery counts.
source_requirements: Independent reviews, reputable news reports, and company disclosures.
