evaluator_interpretation:
  - This concerns the content of OpenAI's forecasts reported by April 28, not whether the projected subscriber changes eventually happened.
  - "The context supplies the comparison: Plus falls from approximately 44 million in 2025 to 9 million in 2026; Go rises from approximately 3 million to 112 million."
  - I read primary business line as the largest revenue-producing product line at the forecast baseline.
  - I read different product as a different subscription tier. Additional Go subscriptions can include people switching from Plus; they need not all be new OpenAI customers.
  - The observation period covers the forecasts reportedly made at the beginning of 2026 and their reporting by the post date.
support_condition: Reliable records establish the reported Plus and Go projections, implying approximately 109 million additional Go subscriptions, and establish Plus as OpenAI's largest revenue-producing product line at the baseline.
contradiction_condition: Reliable records establish materially different projections, or establish that Plus was not the primary revenue-producing product line at the relevant baseline.
measurement_requirements: Distinguish forecast subscriber stocks from actual results, net additions from gross acquisitions, and Plus revenue from revenue across all consumer plans.
source_requirements: Prefer the underlying forecast documents or OpenAI disclosures. Otherwise require accessible, reputable reporting on those documents and on the product revenue breakdown.
