assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT as some sort of search replacement
  - I do not believe that's a functional business model
  - 500 million people a week could be using ChatGPT
evaluator_interpretation:
  - The ordinary reading of functional business model is a commercially sustainable way to provide and monetize search-replacement usage.
  - The statement about 500 million users concedes possible popularity; it does not establish measured search usage or a condition for scoring.
  - Use January–March 2025, the latest completed calendar quarter before the post, as the financial observation period. This does not imply that OpenAI published quarterly accounts.
  - Assess the economics of search-replacement usage, including its attributable revenue and costs. Company-wide losses alone cannot establish that this particular activity is commercially unsustainable.
  - No accounting basis or numerical profitability threshold is supplied.
support_condition: Evidence for the target period establishes that search-replacement usage could not sustain its attributable operating costs under the business model then available. Temporary investment losses alone are insufficient.
contradiction_condition: Evidence for the target period establishes commercially sustainable search-replacement usage through attributable revenues and adequately allocated costs.
measurement_requirements: Search-specific revenue, usage, serving costs, and a defensible allocation of shared costs, with the accounting basis and treatment of subscriptions stated.
source_requirements: Prefer product-level company disclosures or financial records. Independently sourced reporting may help, but company-wide revenue, financing, and forecasts cannot substitute for search-specific economics.
