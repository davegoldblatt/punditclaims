explicit_source_elements:
  - by the standards articulated in the original definitions of AGI
  - robustness across environments
  - reliable generalization under novelty
  - autonomous goal-directed behavior
  - current AI systems remain limited
evaluator_interpretation:
  - "Plain reading: in February 2026, frontier AI systems clearly fell short of human-level robustness, generalization to novel situations, and autonomous goal-directed behavior."
  - "'Current AI systems' means the frontier systems available at the post date (for example Claude Opus 4.6, released February 2026). The target period runs from February 2026 through March 2026, so that it covers the first independent evaluations of those same systems. This choice is flagged as an ambiguity."
  - "'Remain limited' is a weak claim. It is supported if public evaluations of those systems show a large gap from human performance on tests built for novel environments and self-directed goal discovery."
support_condition: Independent evaluations of frontier systems from the period show large shortfalls against humans on tasks requiring generalization to novel environments, inferring goals without instructions, or robust autonomous behavior.
contradiction_condition: Independent evaluations from the period show frontier systems matching humans on novel-environment, goal-discovery and robustness tests without task-specific help.
measurement_requirements: Benchmarks designed to test novel-environment generalization and autonomous goal acquisition (for example ARC-AGI-3), and agentic evaluations of frontier models current at the post date.
source_requirements: Benchmark organizers or reputable reports of their published results. Expert opinion pieces count as context only.
