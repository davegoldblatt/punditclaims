assessment_axis: causal_assessment
explicit_source_elements:
  - LLMs never induce proper world models
  - which is why
  - can’t even play chess reliably
  - errors with startling regularity
evaluator_interpretation:
  - Assess the explanation of existing capabilities at the post date, rather than treating 'never' as a separate forecast.
  - A functional world model represents relevant states and relationships and uses them to guide predictions or actions.
  - The causal assertion requires evidence connecting deficiencies in those representations to the specified errors. Observing errors alone is insufficient.
  - The period is the accumulated capability record through 2025-08-12. No lower bound is supplied because the assertion concerns what LLMs have ever learned.
support_condition: Controlled studies show that the relevant LLMs lack functional world representations and that this deficiency causes their chess failures and recurring errors, with plausible alternative explanations addressed.
contradiction_condition: Studies establish functional world representations in systems within the claim's scope and directly undermine the asserted explanation of their failures, or isolate a different explanation incompatible with the claimed causal mechanism.
measurement_requirements: Specify models, tasks, error denominators, and reliability measures. Use interventions on representations or comparable controlled tests to establish causation.
source_requirements: Primary experimental studies with documented methods. Anecdotes and the speaker's own writing cannot establish the causal mechanism.
