assessment_axis: historical_observation
explicit_source_elements:
  - access to an enormous amount of data
  - from search and email especially
  - at a scale that nobody else has
evaluator_interpretation:
  - The ordinary reading is a claim that Google's overall accessible data holdings exceed every other company's, with search and email as especially important sources.
  - Access means data Google can actually process for relevant services under applicable permissions. It does not automatically mean unrestricted permission to train models.
  - Use July 2026, the latest completed calendar month before publication, for the ongoing comparison. This period is inferred.
  - User counts and search shares are indicators of scale, not direct measurements of comparable data holdings.
support_condition: Comparable evidence establishes Google's very large accessible data holdings and shows that no other company matches their overall scale.
contradiction_condition: Comparable evidence identifies another company with equal or greater accessible data holdings on the same measure and period.
measurement_requirements: Use comparable coverage, data categories, duplication rules and access permissions across companies. Do not equate users with bytes, records or training tokens.
source_requirements: Company disclosures, regulatory findings or independent measurements that permit a like-for-like comparison.
