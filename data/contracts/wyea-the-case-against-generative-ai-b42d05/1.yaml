condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No numerical meaning is supplied for 'multiply'.
  - Complexity and number of steps are related but distinct variables.
  - No reliability threshold or class of autonomous work defines 'fatal'.
  - The author's definition of hallucination is broader than factual fabrication.
