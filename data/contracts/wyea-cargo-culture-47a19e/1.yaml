evaluator_interpretation:
  - The claim concerns Boris Cherny's permitted usage, not his personal payments.
  - The linked sourcing treats token consumption as an estimated retail API-price equivalent. I do not read this as Anthropic's actual infrastructure cost.
  - I use May 2026, the latest completed month before publication, for the ongoing monthly allowance.
  - Support requires permission for approximately $130,000 or more per month. Lower observed consumption alone would not contradict an allowance.
support_condition: A dated company statement, permission record, or credible account establishes that Anthropic permitted Cherny monthly token usage worth approximately $130,000 or more on the stated valuation basis during May 2026.
contradiction_condition: Comparable records establish an enforced monthly allowance below approximately $130,000 during May 2026.
measurement_requirements: Distinguish permitted usage from consumed tokens. Establish the valuation basis, model mix, input/output mix, caching treatment, and monthly period.
source_requirements: Prefer Anthropic or Cherny's own dated records. An outside estimate of consumption is insufficient to establish permission.
