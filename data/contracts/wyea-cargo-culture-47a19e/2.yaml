explicit_source_elements:
  - guy who's allowed to burn
  - upwards of $130,000 a month in tokens
  - by Anthropic
  - Boris Cherny, Claude Code chief, running loops that 'never stop running'
evaluator_interpretation:
  - "Plain reading: in the months up to the post, Anthropic let Cherny use tokens whose value at Anthropic's public list prices was at least about $130,000 per month. Valuing internal use at retail-equivalent prices is a fair reading because Anthropic does not bill its own staff."
  - The post cites Cherny's talk (around the 32:00 mark of a YouTube video). In that talk he gave his token use since March, so the target period is March 2026 to the post date.
  - Being 'allowed' is satisfied if he actually used that much without being stopped. No formal cap or allowance needs to be shown.
support_condition: A credible source shows Cherny's monthly token use in roughly March–June 2026 was worth at least about $130,000 a month at Anthropic list prices. The source could be his own disclosed figures with a known model and token mix, Anthropic data, or credible reporting.
contradiction_condition: A credible source shows his monthly token use in that period was worth clearly less than about $130,000 a month at list prices, with enough detail on model and token mix to price it.
measurement_requirements: Monthly token volume for Cherny, split into input, output and cache tokens, with the model and speed tier used. Prices must be Anthropic list prices for that period.
source_requirements: Cherny's own statements, Anthropic disclosures, or reputable reporting. Unsourced blog estimates are context only.
