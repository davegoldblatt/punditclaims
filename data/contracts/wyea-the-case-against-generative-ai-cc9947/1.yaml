explicit_source_elements:
  - based on my estimates
  - needs to raise more than $290 billion
  - in the next four years
  - based on its $300 billion deal with Oracle alone
evaluator_interpretation:
  - The deadline is September 29, 2029, four years after publication.
  - Needs to raise means required additional external financing after accounting for available funds and operating cash flows. Raising money voluntarily does not establish that it was required.
  - The Oracle agreement is the stated basis for the estimate, not an unfulfilled conditional antecedent.
  - The separate report of a $115 billion cash-burn forecast is background, not the proposition being graded.
support_condition: A documented funding reconciliation establishes that meeting the Oracle obligations requires more than $290 billion of additional external financing within the four-year interval.
contradiction_condition: A complete reconciliation establishes that the Oracle obligations require no more than $290 billion of additional external financing within that interval.
measurement_requirements: Oracle payment schedules, enforceable obligations, opening available funds, operating cash flows, and financing requirements attributable to this agreement. Distinguish commitments, payments, financing proceeds, and secondary share sales.
source_requirements: Prefer the executed agreement and company financial disclosures. Clearly attributed reporting may provide context where these records are unavailable.
