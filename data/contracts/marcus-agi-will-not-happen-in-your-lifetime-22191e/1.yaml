evaluator_interpretation:
  - Read 'great answers' as robust, broadly applicable methods, rather than the absence of any useful representation or model-learning technique.
  - The scope is AI research generally, including symbolic and model-based approaches, not only language models.
  - Use January 2023 through the publication date as the current research snapshot because no reporting period is specified.
support_condition: Research available at the target snapshot establishes that reliable general solutions to both abstract knowledge representation and complex model induction remain open, despite narrower working methods.
contradiction_condition: Reproducible systems available at the target snapshot robustly represent abstract knowledge and learn complex models from observations or descriptions across substantially different unfamiliar domains.
measurement_requirements: Evaluate abstraction, transfer, model accuracy and robustness beyond training conditions. Separate a useful method from a general solution.
source_requirements: Primary research and evaluations of systems available by 2023-01-22, covering more than a selected failing model or narrow successful task.
