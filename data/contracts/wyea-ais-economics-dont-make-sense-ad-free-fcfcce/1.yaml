assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - inherently unpredictable
evaluator_interpretation:
  - In context, an ordinary reader would understand that users cannot generally guarantee the correctness or successful execution of arbitrary LLM tasks, including repeated tasks.
  - This does not mean every response is random, every task fails, or deterministic inference is mathematically impossible.
  - For this ongoing technical observation, use the current pre-publication reporting window, April 1–28, 2026. LLM reliability has no standard quarterly reporting cycle.
  - "Output repeatability and factual correctness are distinct: a repeatable answer can still be incorrect."
support_condition: Contemporaneous evaluations show meaningful variation or unreliable execution in deployed LLM systems under repeated or closely controlled tasks.
contradiction_condition: Representative evaluations establish generally reliable, predictable task outcomes under ordinary deployment conditions across the scope described. Determinism on a controlled example alone does not establish this.
measurement_requirements: Repeated tasks with documented models, inputs, inference settings, and outcome checks. Distinguish variation in wording from variation in task success.
source_requirements: Primary empirical research or reproducible evaluations available by the evaluation date and describing the target period; older findings may supply context.
