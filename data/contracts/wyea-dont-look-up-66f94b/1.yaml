assessment_axis: causal_assessment
explicit_source_elements:
  - if more and more of the revenues of these three companies are coming from cloud segments
  - increasingly-dominated by AI revenues
  - mostly driven by two unprofitable, unsustainable companies
  - the literal future of Microsoft, Google, and Amazon is whether Anthropic and OpenAI can pay them
evaluator_interpretation:
  - In the surrounding discussion of analyst growth expectations, 'literal future' means corporate growth prospects and financial exposure. It does not supply a bankruptcy prediction.
  - "The antecedent is compound: rising cloud share of corporate revenue, increasing AI dominance within cloud, and majority dependence of that AI revenue on the two labs."
  - Assess whether payment dependence follows under those conditions. This is a conditional causal assessment, not a dated prediction that the labs will default.
  - Do not assume the antecedent is met merely because AI demand or cloud revenue is growing.
  - Neither 'unsustainable' nor the size of a material threat is numerically defined.
support_condition: Comparable evidence establishes the compound antecedent, and company-level payment-loss analysis shows that the expected corporate growth prospects materially require continuing payments from the two labs.
contradiction_condition: With the antecedent established, credible financial and replacement-demand analysis shows that the companies can maintain their expected growth prospects despite the loss of those payments.
measurement_requirements: Comparable cloud shares of corporate revenue, AI shares of cloud revenue and lab shares of AI revenue; payment obligations; liquidity; and consolidated growth sensitivity to lost payments.
source_requirements: Company segment disclosures, customer-level analyst models, lab financial records and credible payment-loss scenarios available by 2026-10-28.
