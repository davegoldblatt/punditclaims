explicit_source_elements:
  - spent around $293 billion in four years
  - when you remove OpenAI
  - less than $3 billion a quarter in revenue, not profit
evaluator_interpretation:
  - The main numerical claim concerns Microsoft's AI revenue excluding revenue from OpenAI, rather than Microsoft's entire business.
  - Use fiscal Q3 2026, January–March 2026, as the latest reported quarter before publication.
  - The plain reading of quarterly revenue is realized revenue. The surrounding annualized figures create an alternative reading as a quarterly equivalent of a run rate; these measures must remain separate.
  - Read the spending component as approximately four years ending with that quarter, provisionally April 2022–March 2026. The precise starting boundary is not supplied.
  - The wider post calls the spending AI capital expenditure. Corporate capital expenditure requires a reconciliation before it can establish AI-only spending.
  - The single metric_scope records the main revenue measure. The separate spending component requires its own four-year capital-expenditure reconciliation.
  - The surrounding calculation is an estimate using reported figures and an estimated OpenAI contribution; no GAAP or non-GAAP basis is specified for the resulting AI-only revenue estimate.
support_condition: Comparable records establish realized AI revenue excluding OpenAI below $3 billion in the target quarter and approximately $293 billion of consistently defined AI-related capital expenditure over the stated four-year span.
contradiction_condition: Comparable records establish quarterly AI revenue excluding OpenAI of at least $3 billion, or spending materially inconsistent with approximately $293 billion under the same scope and period.
measurement_requirements: Actual quarterly AI revenue and the OpenAI customer contribution, with revenue-sharing and internal AI products treated consistently. Separately reconcile four-year spending, AI attribution, cash purchases and finance leases. Do not substitute annual run rate for realized revenue.
source_requirements: Company disclosures or corroborated records providing both revenue components, plus filings and a consistent reconciliation of the spending total.
