  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Early resolution requires both proof of the conditional antecedent and an irreversible settlement or failure covering the relevant commitments. Current losses, financing rounds and projections alone do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Growth metric and baseline are unspecified.
  - "'Around 10x' has no precise tolerance."
  - Profitability has no defined accounting measure or deadline.
  - The trillion-dollar threshold may be combined or per company.
  - The financing accumulation period is unspecified.
  - The three-year deadline expressly modifies growth, not necessarily all commitments.
retrospective_or_prospective: prospective
