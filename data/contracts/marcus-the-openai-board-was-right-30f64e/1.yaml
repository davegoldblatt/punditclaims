evaluator_interpretation:
  - In context, the factual assertion is that OpenAI's denial of intentional resemblance was false.
  - The ordinary reading concerns deliberately creating or selecting a Johansson-like voice, not merely whether listeners perceived a resemblance.
  - The target period covers the May 2024 demonstration and denial through the post date. Earlier casting records are background evidence about that denial.
support_condition: Reliable evidence establishes that resemblance to Johansson was an intended objective of selecting, directing, training, or tuning Sky.
contradiction_condition: Reliable evidence establishes an independent voice-selection and production process without an objective of resembling Johansson.
measurement_requirements: Distinguish perceived similarity, interest in hiring Johansson, and a deliberate imitation objective.
source_requirements: Prefer contemporaneous casting instructions, recordings, internal communications, attributable testimony, or adjudicated findings. Treat each party's statements as interested accounts.
