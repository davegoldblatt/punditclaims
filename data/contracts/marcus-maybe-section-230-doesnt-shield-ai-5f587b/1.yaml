  - recently support state law in Illinois
  - would shield AI labs from liability
  - death or serious injury of 100 or more people
  - at least $1 billion in property damage
  - pretty much the opposite
evaluator_interpretation:
  - The checkable core is OpenAI’s support for an Illinois proposal containing the described liability protection.
  - Because the sentence says “would,” read “state law” as proposed legislation rather than a claim that it was enacted.
  - Read “recently” as the current legislative year through publication.
  - The comparison with testimony is an evaluative characterization. Support for a conditional liability shield alone cannot establish knowingly false testimony.
  - The dollar amount is a statutory harm threshold, not a claim about OpenAI’s finances.
support_condition: Records establish that OpenAI supported an Illinois bill containing conditional protection from liability for the specified catastrophic harms.
contradiction_condition: Reliable records establish that the attributed support did not occur, or that the supported proposal lacked the described protection.
measurement_requirements: Check the proposal version, support date, harm thresholds, and conditions limiting the shield. Separately check later changes in OpenAI’s position.
source_requirements: Prefer legislative text, witness records, company testimony, and the original Senate testimony; use attributed reporting where primary records cannot be read.
