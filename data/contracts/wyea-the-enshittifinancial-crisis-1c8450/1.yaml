assessment_axis: forecast_outcome
explicit_source_elements:
  - Every single data center deal
  - AI will somehow become profitable one day
  - if there’s even one First Brands situation
  - the entire thing collapses
evaluator_interpretation:
  - Read in context, the forecast concerns AI data-center financing. It does not specify a deadline.
  - A First Brands-style situation means a material financing fraud at a data-center borrower involving fabricated assets or receivables, concealed liabilities, duplicate collateral pledges, or comparable deception, causing lender losses or borrower failure. An allegation of unrelated misconduct does not by itself establish this trigger.
  - The ordinary reading of collapse is a broad breakdown in financing across unrelated data-center borrowers, including widespread inability to obtain or renew funding and cascading failures. An isolated failed offering, higher borrowing costs, or falling securities prices is insufficient.
  - The assertion about every deal and future AI profitability is part of the claim's rationale. Assessing the conditional forecast does not establish that universal assertion or that future profitability is impossible.
  - This is a qualitative sector forecast, not a claim about a specified company's financial metric; metric_scope is null.
support_condition: A documented qualifying fraud occurs after the post, and evidence establishes a subsequent sector-wide financing breakdown attributable to its exposure. This would support the conditional forecast, without independently proving the universal assertion about every deal.
contradiction_condition: A documented qualifying fraud occurs, its financial consequences are demonstrably contained through a completed resolution, and broad data-center financing continues without the predicted cascade. Temporary survival alone cannot contradict a forecast with no stated transmission period.
measurement_requirements: Identify the fraud, its disclosure date, financing mechanism and financial consequences. Then examine financing issuance, refinancing access, failed transactions, defaults and lender exposure across unrelated borrowers. Distinguish completed financing from announcements and sector-wide failure from individual distress.
source_requirements: Prefer court records, regulatory findings, admissions, lender disclosures and financing documents for the trigger; use official market assessments and transaction records for contagion. Allegations must remain identified as allegations. Reputable reporting may supplement primary records.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a verified qualifying trigger and either a demonstrable systemic financing collapse linked to it or a completed containment of its financial consequences with broad financing continuing. Elapsed time or isolated market stress alone is not decisive.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - First Brands situation does not specify the required type or scale of fraud.
  - The entire thing does not define the geographic or institutional scope of collapse.
  - No deadline or interval between fraud exposure and collapse is stated.
  - Every single data center deal may mean AI-related deals in context rather than all data-center financing.
  - AI profitability has no specified entity, accounting measure or time horizon.
retrospective_or_prospective: retrospective
