explicit_source_elements:
  - a couple years ago
  - the conventional wisdom
  - OpenAI was unassailable
  - Now, by their own lights
  - they are in a Code Red
  - Google right on their heels
evaluator_interpretation:
  - This is a comparison between OpenAI's reputation roughly in 2023–2024 and its competitive position at publication on 2026-02-27. The target interval encompasses both parts; evidence must address the appropriate part.
  - For the ongoing state described by 'now', use February 2026 through the post date, the latest publicly reportable period before publication.
  - Read 'unassailable' as widely perceived to have a commanding lead that would be difficult to challenge. Neither literal invulnerability nor unanimous agreement is required, but evidence of leadership alone is insufficient.
  - Read 'Code Red' as an internally declared competitive emergency still current at publication.
  - Read 'right on their heels' as Google being a close competitor in frontier model capabilities. Marcus supplies no benchmark or numerical threshold.
support_condition: Contemporaneous coverage establishes a widespread earlier perception of a difficult-to-challenge OpenAI lead; OpenAI statements or reliable reporting establish a current Code Red; and contemporary capability comparisons establish Google as a close competitor.
contradiction_condition: Reliable evidence establishes that Code Red had ended before publication, that Google remained substantially behind across relevant capabilities, or that the alleged earlier conventional wisdom materially misrepresents contemporary views. Distinct supported and contradicted components would warrant mixed.
measurement_requirements: Use dated reporting for the reputational comparison and internal emergency. Use contemporary independent model comparisons for Google's competitive position. Do not substitute market share for model capability or actual technical leadership for public belief about its durability.
source_requirements: Prefer public company statements and independent benchmark measurements. Credible reporting may establish internal statements unavailable in public primary records. Establish conventional wisdom from a sufficiently broad contemporary record, not a single commentator.
