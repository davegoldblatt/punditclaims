explicit_source_elements:
  - OpenAI, Anthropic, Microsoft, Google, and Amazon
  - have done everything in their power
  - to obfuscate
  - the actual underlying costs of their operations
  - based on discussions with sources familiar with their infrastructure
evaluator_interpretation:
  - The plain reading alleges deliberate, systematic concealment of underlying AI operating costs by all five companies.
  - Read 'everything in their power' as emphatic language for a sustained effort, rather than an enumerable set of every conceivable action.
  - The surrounding discussion concerns AI operations, not every expense of the diversified companies.
  - The reference to discussions with sources is an asserted evidentiary basis, not a conditional antecedent.
  - The retrospective conduct runs through publication. No starting date is supplied, so leave the start open rather than invent a financial reporting period.
  - This is a claim about disclosure conduct and intent, not a claim about a particular monetary amount; metric_scope is therefore null.
support_condition: Documents, corroborated testimony or findings establish a systematic effort by each named company to obscure its underlying AI operating costs.
contradiction_condition: Comparable records establish that the alleged pattern did not occur, including sufficiently complete and candid cost disclosure by a named company that is incompatible with the collective allegation.
measurement_requirements: Separate missing disclosure, aggregated financial reporting, commercial confidentiality and deliberate misleading conduct. Assess each company individually.
source_requirements: Prefer internal records, court findings, regulatory records and original disclosures. Independent transparency studies can establish disclosure gaps but do not alone establish intent.
