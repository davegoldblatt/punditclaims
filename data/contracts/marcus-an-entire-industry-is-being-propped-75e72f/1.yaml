assessment_axis: historical_observation
explicit_source_elements:
  - the whole thing Jensen Huang said
  - a kind of post hoc fallacy
  - take the most extreme outliers in history post hoc
  - project from there
evaluator_interpretation:
  - Read the criticism as retrospective selection of exceptional winners followed by an inference about new investments. Marcus defines his meaning; do not require the separate logical error of inferring causation from temporal sequence.
  - The ordinary testable reading is that Huang used unusually successful historical investments as evidence for comparable opportunities in the forthcoming IPOs without establishing why those examples were representative or predictive.
  - Merely naming successful companies, or describing a possibility, is insufficient by itself to establish the alleged reasoning error.
  - The target is the interview underlying the comparison circulated before the June 8 post. Reporting identifies it as a February 2026 interview, so the target period is that month.
  - The phrase 'a kind of' qualifies the classification; it is not a conditional antecedent.
support_condition: An authenticated account of Huang's remarks shows him selecting exceptional historical winners after their success and using them to justify comparable prospective IPO returns, without a relevant selection rule or supporting comparison. Appropriate historical return evidence establishes that the selected examples were exceptional.
contradiction_condition: The complete remarks show that the alleged comparison was misattributed, or that Huang explicitly avoided extrapolating from the selected winners and instead supplied a materially different, independently supported argument.
measurement_requirements: Identify who said each passage and distinguish a possibility from a prediction. Compare historical investment outcomes using consistent starting prices, holding periods, split and dividend treatment, and a cohort that includes unsuccessful companies.
source_requirements: Prefer the original recording or an authenticated transcript. Historical return comparisons should use primary market records or documented research. Social-media captions and abbreviated paraphrases cannot establish the entire argument.
