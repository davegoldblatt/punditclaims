  - Major institutions has no defined geographic or institutional universe.
  - Piled money into may include arranging, commitments, funded lending or equity ownership.
  - Take forever is rhetorical; adjacent context supplies approximate construction times.
  - Only seem to lose it is qualified and does not identify project-level or corporate accounting.
  - The schema's single monetary scope cannot also represent the separate project-profit flow.
