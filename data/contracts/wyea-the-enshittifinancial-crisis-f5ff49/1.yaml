explicit_source_elements:
  - Every single major bank and financial institution
  - hundreds of millions if not billions of dollars
  - into building data centers
  - take forever to even start generating money
  - only seem to lose it
evaluator_interpretation:
  - Read this as a universal claim about major financial institutions financing AI data-center construction, followed by a general claim of long revenue lead times and losses after operation begins.
  - The adjacent context suggests roughly one to three years rather than literally forever.
  - Separate an institution's own funded or committed exposure from arranging or underwriting a larger syndicated facility.
  - Read losing money as losses after relevant costs, not merely construction spending exceeding early revenue.
  - Use July–September 2025, the latest completed reporting quarter before publication, for ongoing operating results and the quarter-end exposure position.
  - The passage gives no defined institution universe or accounting basis.
support_condition: Institution-by-institution records establish at least hundreds of millions of dollars of qualifying exposure for every major institution in the intended universe, and matching project records establish long pre-revenue construction periods and subsequent losses.
contradiction_condition: A verified major institution has less than the claimed qualifying exposure, or matching project-level records establish a material exception to the claimed operating pattern. A missing deal announcement alone is not an exception.
measurement_requirements: Identify the institution universe, funded balances and commitments separately, retained exposure per institution, project construction and revenue-start dates, and project-level income after the relevant costs.
source_requirements: Prefer credit agreements, lender disclosures, construction records and project financial statements. Corporate results and syndicate membership are context unless linked to the claimed project and exposure.
