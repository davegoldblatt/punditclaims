assessment_axis: not_applicable
explicit_source_elements:
  - Every single major bank and financial institution
  - piled hundreds of millions if not billions of dollars
  - into building data centers
  - take forever to even start generating money
  - at which point they only seem to lose it
evaluator_interpretation:
  - "The claim has two parts: that every major bank and financial institution has put at least hundreds of millions into data center construction, and that those data centers take a long time to earn money and then 'seem' to lose it."
  - "'Every single major bank and financial institution' names no defined set, so the universal cannot be checked institution by institution."
  - "'Only seem to lose it' is an impression, not a firm claim that the projects are loss-making. Treating it as a firm loss claim would drop his hedge."
  - Project-level revenue and profit for bank-financed data centers are generally not public.
support_condition: Would require a defined list of major banks and institutions each shown to have committed hundreds of millions or more to data center construction, plus public operating results showing the financed facilities lag on revenue and then run losses.
contradiction_condition: Would require a clearly major bank shown to have no meaningful data center exposure, or financed AI data centers shown to earn money quickly and profitably.
measurement_requirements: A defined set of 'major' institutions; deal-level financing records; project-level operating results.
source_requirements: Loan and bond records, company filings, reputable financial press.
