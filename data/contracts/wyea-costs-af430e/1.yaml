evaluator_interpretation:
  - The testable claim combines the two monthly AWS amounts with a causal account of Cursor's financial pressure.
  - Cash crunch means difficulty funding near-term obligations, rather than merely higher costs or lower margins.
  - The claimed sequence requires evidence that Priority Service Tiers increased Cursor's effective costs and initiated its cash pressure, with the AWS increase worsening that pressure.
  - Rent-seeking is an evaluative description. Subprime AI Crisis is treated as the author's name for the asserted provider-to-customer price cascade, not a separately defined economic event.
  - The AWS amounts concern payments after credits and discounts, following the post's clarification.
support_condition: Independent records confirm the two AWS amounts and show that Priority Service Tier charges initiated Cursor's liquidity pressure, that the AWS increase worsened it, and that provider cost increases contributed to customer repricing.
contradiction_condition: Comparable records materially disprove the billing amounts or establish that the asserted liquidity pressure or causal sequence did not occur. A different contributing cause alone would not disprove the claim.
measurement_requirements: Monthly AWS payments; dated Anthropic contract and effective-price changes; cash balances, obligations and payment schedules; and evidence connecting these changes to Cursor's pricing decisions.
source_requirements: Billing and liquidity records or independently sourced reporting. Temporal proximity and customer price changes alone cannot establish causation.
