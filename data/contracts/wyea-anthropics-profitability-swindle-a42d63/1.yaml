ambiguity_flags:
  - Present-tense spending language follows an explicitly future July payment rate.
  - Comparable and around have no numerical tolerance.
  - The first amount omits its monthly unit.
  - Spending could refer to incurred charges or cash payments.
  - The conditional calculation is accompanied by an unconditional assertion that spending is greater.
