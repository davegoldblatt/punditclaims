explicit_source_elements:
  - an Air Canada chatbot
  - confabulated (“hallucinated”) an answer
  - telling a customer that bereavement trips would be refunded
evaluator_interpretation:
  - The plain reading is that the chatbot incorrectly told a customer they could obtain a refund through Air Canada's bereavement policy after purchasing travel.
  - Refund includes a partial refund through a reduced fare. The wording does not expressly claim that the chatbot promised reimbursement of the entire trip.
  - Hallucinated is read as giving invented or incorrect policy information. Establishing the chatbot's architecture or the technical cause of the error is a separate question.
  - The target is the past customer interaction described in the post. Its date is unspecified in the supplied text, so the interval has no asserted start and ends on the post date.
  - This concerns the content of customer advice, not a measure of Air Canada's finances.
support_condition: A reliable record establishes that the chatbot told the customer that a retroactive bereavement refund or fare reduction was available when the applicable policy did not permit it.
contradiction_condition: The interaction record shows no such advice, or the applicable policy permitted the retroactive refund described by the chatbot.
measurement_requirements: Compare the recorded chatbot response with the applicable bereavement policy, distinguishing a partial fare refund from reimbursement of the entire trip.
source_requirements: Prefer the tribunal decision and its account of the customer's screenshot and applicable policy.
