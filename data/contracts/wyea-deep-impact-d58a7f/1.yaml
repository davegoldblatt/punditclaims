explicit_source_elements:
  - Both OpenAI and Anthropic
  - billions of dollars a year
  - after revenue
evaluator_interpretation:
  - Each company must separately have an annual loss of at least $2 billion; their losses cannot be added together.
  - After revenue ordinarily means a loss after recognizing revenue, rather than gross spending or financing needs.
  - The post later explicitly associates these losses with 2024, so the target is calendar 2024.
  - The post relies on press estimates, including an Anthropic cash-burn report. The contract therefore records estimate as the stated basis, while retaining net annual loss as the plain reading of the normalized claim.
  - The infinite-money metaphor and assertion about management's attitude are outside this numerical assessment.
support_condition: Comparable evidence establishes that OpenAI and Anthropic each incurred at least $2 billion in annual losses after revenue during 2024 on the stated estimated-loss basis.
contradiction_condition: Comparable evidence establishes that at least one company incurred less than $2 billion in annual losses after revenue during 2024 on that basis.
measurement_requirements: Separate net loss, operating loss, cash burn, gross expenditure, and financing. Reconcile adjustments and noncash charges before treating different bases as equivalent.
source_requirements: Primary financial records where available; otherwise reputable reporting on financial documents. The speaker's own reporting cannot independently establish the outcome.
