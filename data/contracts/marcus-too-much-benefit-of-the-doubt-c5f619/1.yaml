assessment_axis: historical_observation
explicit_source_elements:
  - at present
  - no viable option
  - AlphaStar and LLMs would surely be unsafe and inadequate
  - we don’t yet have anything markedly better
  - a safe and useful domestic humanoid robot
evaluator_interpretation:
  - The plain reading is that available AI could not provide sufficiently reliable and safe general household decision-making for a domestic humanoid robot.
  - The surrounding hypothetical grants successful motor control. Failures of locomotion or manipulation hardware alone therefore cannot establish the claim.
  - Viability means practical suitability across ordinary household tasks and unexpected situations. It does not require perfect performance or a particular philosophical definition of intelligence.
  - The target is the publicly observable state on 2022-10-16. This technology has no regular reporting period, so I use the post-date snapshot rather than inventing a quarterly or annual window.
  - Earlier experiments inform that snapshot but remain context when their measured events occurred outside the target period.
  - The household application defines the scope of this observation; it is not a conditional forecast.
support_condition: Evidence establishing that the available candidate controllers lacked the reliability, general household competence, and safety needed for this use, including evidence supporting the asserted inadequacy and unsafety of AlphaStar and contemporary LLM systems. Missing demonstrations alone are insufficient to establish the entire claim.
contradiction_condition: A documented system available at the target date that could provide safe, adequate general household decision-making with functioning motor skills would contradict the no-option assertion. Successful isolated tasks alone would not suffice.
measurement_requirements: Evaluations should identify the system version, household task coverage, autonomy, human intervention, planning failures, and safety outcomes. Separate cognitive failures from failures of the motor capabilities granted in the hypothetical.
source_requirements: Prefer dated primary evaluations and deployment records. Later publications may establish historical facts only if they clearly concern systems and capabilities at the target date.
