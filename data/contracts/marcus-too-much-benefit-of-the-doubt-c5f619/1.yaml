ambiguity_flags:
  - No task coverage, reliability threshold, or acceptable safety risk is specified.
  - General intelligence and markedly better are undefined.
  - LLMs could mean unmodified language models or systems combining them with perception, skills, and safeguards.
  - The ongoing-state observation has no reporting period; the post-date snapshot is an evaluator choice.
  - Lack of demonstrated safety and demonstrated unsafety are different propositions.
