explicit_source_elements:
  - Eventually
  - help us reason critically
  - overcome human bias
  - just the facts, without confabulation
evaluator_interpretation:
  - The plain reading is that machines will combine useful critical-reasoning assistance, reduced human bias, and dependable factual answers across varied ordinary tasks.
  - The calculator comparison implies dependable factual reliability. It does not require answering unknowable questions or prohibit admitting uncertainty.
  - Success on one narrow task does not establish the combined capability. No deadline or numerical reliability threshold was supplied.
support_condition: A built system demonstrably combines improved human critical reasoning, reduced bias, and factual reliability without confabulation across varied tasks, confirmed by independent evaluations.
contradiction_condition: A decisive result establishes that the combined capability cannot be built. Failures of existing systems cannot by themselves contradict an undated eventual forecast.
measurement_requirements: Controlled human comparisons measuring reasoning quality and bias, alongside independent factual audits across varied tasks. Report errors, abstentions, task coverage, and replication.
source_requirements: Public methods and results, with independent evaluation beyond a developer demonstration or selected examples.
