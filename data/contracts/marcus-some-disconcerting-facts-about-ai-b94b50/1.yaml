evaluator_interpretation:
  - "The ordinary reading concerns generative AI businesses collectively: they provide useful services, but realized revenue remains small relative to the costs of developing and delivering them."
  - Use calendar 2025, the latest complete annual period before publication. Marcus supplies no reporting period.
  - Do not substitute all hyperscaler capital expenditure for generative AI costs, or annualized revenue for realized revenue.
  - No company, currency, numerical ratio, or accounting basis is specified. The accounting basis therefore remains unknown, preventing a supported or contradicted financial verdict.
support_condition: Comparable sector-wide accounts show useful commercial activity but realized generative AI revenue substantially below attributable development and delivery costs during 2025.
contradiction_condition: Comparable sector-wide accounts show realized generative AI revenue comfortably covering attributable development and delivery costs during 2025.
measurement_requirements: Use matching business boundaries and periods, eliminate transactions counted at multiple stages of the supply chain, and distinguish capital spending, depreciation, operating expenses, and cash burn.
source_requirements: Prefer financial statements and documented commercial results. Estimates must disclose coverage and methods; individual providers cannot establish the sector-wide result.
