assessment_axis: historical_observation
explicit_source_elements:
  - agents
  - do not
  - cannot exist
evaluator_interpretation:
  - The referenced essay describes autonomous AI that works without oversight and replaces a person's job. It expressly distinguishes this from coding tools that can run delegated tasks.
  - Respect that contextual meaning rather than treating any tool-using chatbot as a decisive counterexample.
  - Assess the current capability assertion during December 2025, the latest month in which demonstrations and evaluations could be publicly reported before the post.
  - Assess cannot exist as an additional categorical impossibility assertion, not as a forecast with an invented deadline.
  - The source does not specify the job, duration, acceptable error rate, or amount of permissible human intervention.
support_condition: Evidence establishes the absence of systems meeting the contextual autonomous-worker standard, together with a defensible reason such systems cannot exist.
contradiction_condition: An independently verified system performs a substantive human job autonomously without the oversight the source excludes, or a result otherwise directly refutes the asserted impossibility.
measurement_requirements: Report task scope, success rate, duration, human interventions, and whether the system performs a complete role or selected tasks.
source_requirements: Prefer independent evaluations with inspectable methods and results. Vendor demonstrations require explicit treatment of human assistance and failure cases.
