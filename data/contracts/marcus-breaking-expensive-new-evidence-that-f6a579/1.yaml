explicit_source_elements:
  - In my 2020 article, The Next Decade in AI
  - I foresaw all this
  - urged the field to start focusing on world (cognitive) models and neurosymbolic AI
evaluator_interpretation:
  - Assess whether the 2020 paper warned that increasing data and computation alone would leave important limitations and advocated cognitive models and neural-symbolic approaches.
  - Read 'foresaw all this' as a general warning about the limitations of scaling. It does not specify a forecast of particular companies, personnel departures, model releases, or dates.
  - The paper is evidence of what Marcus previously argued, not evidence that his technical position or his interpretation of the 2026 developments is correct.
support_condition: The 2020 paper contains both the general warning about relying on scaling and the stated recommendations.
contradiction_condition: The paper endorses scaling alone as sufficient, rejects the stated research directions, or does not contain the claimed warning and recommendations.
measurement_requirements: Compare the paper's arguments and recommendations with the retrospective description. Do not count a general warning as a specific prediction of corporate events.
source_requirements: Use the dated 2020 paper to establish its contents and publication history. Independent evidence would be required to establish whether subsequent events vindicated its technical claims.
