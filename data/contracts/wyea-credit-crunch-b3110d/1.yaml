assessment_axis: forecast_outcome
explicit_source_elements:
  - most data center debt goes unpaid
  - OpenAI and Anthropic fail to meet their obligations
  - AI GPU sales grind to a halt
  - catastrophic misses on their earnings expectations
  - future revenue growth stories collapsing
  - NVIDIA’s revenues dropping as much as 90%
  - once the debt-backed AI capex boom ends
evaluator_interpretation:
  - Treat the described collapse as a joint antecedent, not as an event assumed to have happened.
  - Most debt means a majority by amount of the relevant data-center debt, rather than a majority of borrowers.
  - Payment failures mean documented failures to meet contractual obligations; falling stock prices or expensive borrowing do not suffice.
  - Catastrophic earnings misses means severe misses against forecasts recorded before the results. No numerical cutoff is supplied.
  - As much as 90% is an upper-bound scenario, not a promise of an exact 90% decline or a requirement for at least a 90% decline.
  - Revenue means realized consolidated revenue. The baseline, measurement interval, and accounting basis are unspecified.
  - No deadline is assigned to this sentence. The following sentence's next-few-years wording is not automatically imported.
support_condition: After the full antecedent is documented, comparable records show severe earnings misses and a collapse in expected revenue growth at all three hyperscalers, together with a substantial decline in NVIDIA revenue consistent with the stated scenario.
contradiction_condition: After the full antecedent, sufficiently sustained comparable results show the predicted company-wide earnings and revenue damage does not occur. An exact 90% fall is not required, so a smaller decline alone is not a contradiction.
measurement_requirements: Establish the debt population and unpaid amount, both labs' missed obligations, and GPU-sales collapse. Preserve pre-result earnings expectations and compare NVIDIA revenue using a fixed baseline and consistent accounting.
source_requirements: Debt and default records, lab or creditor disclosures, chip-sales records, company earnings releases, and dated consensus estimates.
