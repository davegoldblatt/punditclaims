  - AI-fueled cybercrime
  - bioweapons attacks facilitated by AI
  - teen suicides apparently linked to GenAI
  - will be on his hands, and his reputation
  - My own hunch
evaluator_interpretation:
  - The claim mixes a moral judgment ('on his hands') with a loose forecast that Trump's reputation will suffer from any AI harm. It names no deadline, no measure of blame or reputation, and no threshold.
  - A testable version would need polling or reporting that ties specific post-order AI harms to Trump. The words give no way to say when such blame would count as enough, or by when.
support_condition: Credible polling or reporting, after a specific AI-linked harm, showing the public broadly holds Trump responsible and that his standing fell because of it.
contradiction_condition: Major AI-linked harms occur and polling or reporting shows the public does not blame Trump or his standing is unaffected, over a period long enough to be fair to the claim.
measurement_requirements: None specified by the speaker. Would need polling on attribution of blame for specific AI harms.
source_requirements: Reputable polls (e.g., Pew, AP-NORC, Gallup) asking who is responsible for specific AI harms; major news reporting.
