evaluator_interpretation:
  - Read 'those expectations' as the preceding claim's AGI-level expectations.
  - Read the scope as products developed through the generative-AI methods vendors demonstrably knew at publication, allowing further development of those methods.
  - The claim states an impossibility without a deadline. Current shortcomings alone cannot support it.
  - Use broad, flexible human-level cognitive competence as the ordinary capability reading, without requiring perfection.
support_condition: A compelling impossibility result establishes that the specified class of methods cannot deliver the advertised broad capabilities.
contradiction_condition: A qualifying product demonstrably delivers the advertised broad capabilities, with independent verification and evidence that it falls within the claimed technical scope.
measurement_requirements: Evaluate broad transfer, reliability and sustained performance across domains. Establish continuity with methods known at publication. A vendor declaration or isolated benchmark result is insufficient.
source_requirements: Dated technical disclosures and independent evaluations of any candidate decisive product or impossibility result.
