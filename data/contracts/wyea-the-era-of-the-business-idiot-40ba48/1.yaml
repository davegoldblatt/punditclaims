explicit_source_elements:
  - Google also has a generative AI thing
  - you don't have a choice about using it
  - it's now stapled onto Google Search and Google Assistant
evaluator_interpretation:
  - "Plain reading: when the post went out (May 2025), Google had built generative AI into Google Search and Google Assistant by default, without a normal setting that lets users switch it off."
  - For Search, this means AI Overviews (and the new AI Mode) shown in standard results with no off switch. For Assistant, it means Google moving Assistant users to Gemini and retiring classic Assistant on most phones.
  - Workarounds such as the 'Web' results filter, URL tricks, or other search engines do not by themselves defeat the plain reading. 'Don't have a choice' is read as 'cannot turn it off in the product', not as 'physically forced to read it'.
  - "The claim describes a current state without naming a period. I use March 1 to May 21, 2025: the period when Google announced the Assistant-to-Gemini switch, up to publication."
support_condition: Google sources from around the post date show generative AI built into Search results by default and Assistant being replaced by Gemini, and there is no setting to turn AI Overviews off.
contradiction_condition: As of May 2025, users could simply switch off AI Overviews in Search settings, or Google Assistant was staying as a non-generative assistant with no plan to replace it.
measurement_requirements: Google product announcements and help documentation on defaults and opt-out settings, from around May 2025.
source_requirements: Google's own blog posts and help pages, or reputable tech news reports.
