assessment_axis: historical_observation
explicit_source_elements:
  - more than two years into the generative AI boom
  - OpenAI's biggest, sexiest products are Deep Research ... and Operator
  - "Deep Research: spend a lot of compute to get a poorly-cited research paper"
  - "Operator: a compute-intensive application that rarely completes a task in minutes that would otherwise have taken you seconds"
evaluator_interpretation:
  - '"Biggest, sexiest products" is rhetorical framing and is not scored.'
  - "The testable parts are: (a) Deep Research was compute-heavy and its citations and sources were of poor quality; (b) Operator was compute-heavy, slow, and rarely completed tasks."
  - 'Plain reading of "rarely completes": Operator failed at most of the tasks it attempted, so success was the exception, not the rule.'
  - "Period: the launch versions, from Operator's launch (2025-01-23) to the post date (2025-02-17)."
support_condition: Evaluations from the period show that Deep Research often relied on weak or SEO-type sources and used heavy compute, and that Operator failed at most tasks and was slow.
contradiction_condition: Evaluations from the period show Deep Research's sourcing was generally sound, or that Operator completed most of the tasks it attempted.
measurement_requirements: Benchmark success rates or structured tests of Operator's task completion. Documented assessments of Deep Research's source quality and compute use.
source_requirements: OpenAI launch documentation and independent evaluations or contemporary hands-on reports from early 2025.
