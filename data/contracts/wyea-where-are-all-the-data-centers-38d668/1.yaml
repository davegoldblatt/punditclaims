assessment_axis: historical_observation
explicit_source_elements:
  - Pick a data center
  - probably barely under construction
  - if it’s “finished” it’s actually “partly done”
  - no real guide as to when the rest will finish
evaluator_interpretation:
  - In context, the population is newly announced or developing data-center projects in the current construction boom, rather than all long-established operating facilities.
  - "Read 'probably' as more likely than not: more than half of projects by count."
  - A project qualifies if it has not progressed beyond early construction, or is described as finished despite only partial delivery and lacks a credible schedule for the remainder.
  - Use Q1 2026, the latest completed calendar quarter before publication, because no observation period is specified.
  - Capacity-weighted shares and forecasts of future delays do not establish the required present project-count share.
support_condition: A representative project inventory shows that more than half of the relevant projects meet one of the stated construction-status conditions during the target period.
contradiction_condition: A representative inventory shows that half or fewer meet those conditions, with remaining projects completed or beyond early construction with credible delivery schedules.
measurement_requirements: A defined project population, project-count weights, dated construction stages, distinctions between phases and whole campuses, and records of remaining completion schedules.
source_requirements: A representative tracker backed by permits, construction records and commissioning disclosures. Selected delayed projects or aggregate MW figures are insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-01-01
  end: 2026-03-31
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The relevant project population is implicit.
  - Q1 2026 is an evaluator-selected reporting window.
  - "'Barely under construction' has no precise milestone."
  - "'No real guide' does not define what makes a schedule credible."
  - Building, phase and campus counts can yield different shares.
retrospective_or_prospective: retrospective
