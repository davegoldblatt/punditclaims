evaluator_interpretation:
  - "Plain reading: during 2025, a growing and substantial share of countries would model their AI regulation on the EU approach, chiefly the EU AI Act."
  - Evidence counts if it shows countries adopting or drafting EU-style AI rules in 2025, or if it shows major economies choosing other approaches.
support_condition: During 2025 many countries, including major economies, adopt or advance AI laws modelled on the EU AI Act, and analysts describe EU influence as growing.
contradiction_condition: During 2025 few countries follow the EU model, most major economies choose lighter non-EU approaches, and analysts describe EU influence as limited or fading.
measurement_requirements: 2025 national AI legislation and policy choices compared with the EU AI Act; expert assessments of EU regulatory influence.
source_requirements: Policy-institute analyses, law-firm reviews of national AI laws, reputable news on EU and national AI policy.
