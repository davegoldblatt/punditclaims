assessment_axis: causal_assessment
explicit_source_elements:
  - the money is absolutely real
  - dependent on both
  - continued value of investing in AI data centers
  - these three to five customers
  - keep raising tens of billions of dollars whenever they need to
evaluator_interpretation:
  - Assess a claimed present dependence of NVIDIA revenue, not a prediction that revenue will collapse by an unstated deadline.
  - The ordinary reading requires a material dependence on continued AI infrastructure investment and recurring external financing by the principal customers.
  - Raising money includes debt and equity. Existing cash and cash generated by operations must be distinguished from new fundraising.
  - The phrase open question expresses uncertainty about investment value; it is not an antecedent event that must occur before assessment.
  - Use FY2027 Q2 as the financial reference period because the surrounding argument explicitly cites those earnings. The revenue accounting basis is company_reported because the post relies on company figures.
support_condition: Evidence identifies the principal customers, links a material share of NVIDIA revenue to their AI investments, and shows that sustaining those purchases requires repeated external financing in tens of billions.
contradiction_condition: Matched customer funding and purchase records establish that the asserted material dependence does not hold, including evidence that principal purchases can be sustained without the claimed recurring fundraising.
measurement_requirements: Trace NVIDIA sales through direct buyers to ultimate customers, then compare purchase commitments with operating cash generation, available cash, debt and equity financing. Raising money is not by itself proof that purchases required it.
source_requirements: Prefer NVIDIA disclosures, identified customers' financial statements, financing agreements and purchase contracts. General financing risks cannot establish the exact customer-level dependency.
