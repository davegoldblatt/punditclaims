assessment_axis: forecast_outcome
explicit_source_elements:
  - In 2029
  - AI will not be able to reliably construct bug-free code
  - more than 10,000 lines
  - from natural language specification or by interactions with a non-expert user
  - Gluing together code from existing libraries doesn’t count.
evaluator_interpretation:
  - The deadline is December 31, 2029, allowing the whole named year.
  - Reliably means repeatable success across varied substantive programming tasks, rather than one selected demonstration. Marcus supplies no numerical success rate.
  - Bug-free means correctly implementing the requirements without functional defects. Passing a finite test suite is evidence of correctness, but does not by itself establish this.
  - Count substantive newly generated source code, excluding padding and pre-existing library code. Marcus does not specify a line-count convention.
  - Either input route qualifies. An expert may supply the natural-language specification under the first route; expert implementation or repair would not establish the AI's capability unaided.
  - The input restrictions define the task, rather than a conditional forecast requiring a separate antecedent.
  - This assessment concerns the individual programming prediction, not winning the broader three-of-five AGI bet.
support_condition: Evaluations during 2029, covering leading available systems and varied qualifying tasks, consistently find that systems cannot reliably produce correct new programs exceeding 10,000 substantive source lines under either permitted input route. Mere absence of a public demonstration is insufficient.
contradiction_condition: A system repeatedly produces correct new programs exceeding 10,000 substantive source lines from natural-language specifications or non-expert interaction, with independently assessed correctness and without counting library assembly as the implementation.
measurement_requirements: Record task selection, complete prompts and interventions, generated source, dependency provenance, line-count rules, repeated-run success rates, and independent correctness checks against the requirements. Verification and testing must address actual required behavior, not merely compilation or selected examples.
source_requirements: Prefer independent reproducible evaluations with public artifacts and interaction logs. Developer demonstrations may identify candidates but must establish all criteria before resolving the forecast.
metric_scope: null
original_horizon: In 2029
horizon_interval:
  start: 2022-05-31
  end: 2029-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An independently reproducible demonstration of repeatable capability meeting every input, originality, length and correctness requirement may contradict the forecast early, provided the system and artifacts establish a continuing capability. Failures before 2029 cannot support the forecast conclusively.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No numerical reliability threshold or task distribution is specified.
  - Bug-free has no stated verification standard.
  - Source-line counting and the boundary between ordinary dependency use and library assembly are unspecified.
  - Permitted scaffolding and human assistance are not fully specified.
retrospective_or_prospective: prospective
