explicit_source_elements:
  - either directly or by proxy
  - NVIDIA’s customer base
  - effectively Anthropic and OpenAI
evaluator_interpretation:
  - In this AI-compute discussion, the ordinary reading is that NVIDIA's AI infrastructure customer demand overwhelmingly depends on these two labs, including purchases through intermediaries.
  - The claim does not require every NVIDIA customer to be one of the labs, but it implies that independent demand is secondary.
  - Use NVIDIA's fiscal second quarter ended July 26, 2026, the latest completed reporting quarter before publication.
  - Direct customer counts and identities are insufficient because the claim expressly includes proxies.
  - No numerical share is imposed on the word 'effectively'.
support_condition: Reliable downstream attribution shows that the two labs overwhelmingly account for NVIDIA's AI infrastructure demand, with other independent uses secondary.
contradiction_condition: Reliable attribution shows substantial independent demand inconsistent with reducing the customer base essentially to the two labs.
measurement_requirements: Trace demand through distributors, cloud providers, and other intermediaries to ultimate workloads. Distinguish internal cloud-provider workloads, other model developers, enterprises, and public-sector uses.
source_requirements: NVIDIA disclosures combined with customer deployment records or credible downstream demand measurements for the target quarter.
