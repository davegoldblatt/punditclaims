assessment_axis: historical_observation
explicit_source_elements:
  - artists, writers, and other creators
  - not paying a nickel (to most) for training materials
  - A lot of them are losing gigs
evaluator_interpretation:
  - Most means more than half of the creators whose material OpenAI used for training, counted by creator rather than by number of works.
  - Compensation includes payments passed through a publisher or other intermediary when they reach the creator.
  - A lot means substantial documented instances of lost commissions or assignments, without requiring a majority of creators to have lost work.
  - The latest observable period is early 2024 through the post date. This is an ongoing-state observation, not a claim about subsequent employment.
  - The two clauses do not establish that OpenAI itself caused every reported loss of work. The word fleecing is evaluative and is not separately scored.
  - The financial scope below covers the compensation clause; the employment clause concerns lost assignments.
support_condition: Evidence establishes that more than half of the relevant creators received no training compensation and that substantial numbers of creators were already losing assignments.
contradiction_condition: Evidence establishes that at least half of the relevant creators received compensation, or sufficiently comprehensive employment evidence contradicts substantial losses of assignments.
measurement_requirements: A defensible denominator of creators represented in training data, linked payment records, and dated records or surveys of lost assignments. Distinguish respondents' attribution from demonstrated causation.
source_requirements: Training-data and licensing records, creator compensation records, and employment or commission evidence. Licensing announcements alone cannot establish majority coverage.
