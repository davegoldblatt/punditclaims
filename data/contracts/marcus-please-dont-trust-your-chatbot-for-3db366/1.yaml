evaluator_interpretation:
  - The testable core is that commonly used LLMs repeatedly give materially incorrect medical answers with unjustified confidence.
  - I read the language as a warning against unverified reliance, not a claim that every answer is wrong or that medical applications have no value.
  - The context explicitly invokes approximately year-old testing. I interpret the observation as covering the 2025-to-publication evidence period; extending those findings to every model available on publication day is a separate inference.
support_condition: Independent evaluations across commonly used models document recurring medical errors together with confident presentation, with additional evidence that errors can affect consequential medical decisions.
contradiction_condition: Comparable evaluations find medical errors exceptional and show that models reliably communicate uncertainty when wrong.
measurement_requirements: Expert assessment of answer correctness and confidence, with model versions, prompts and testing dates identified. Distinguish stress-test error rates from ordinary-use prevalence.
source_requirements: Primary medical evaluations; expert-judged studies preferred. Recommendations alone do not establish error frequency.
