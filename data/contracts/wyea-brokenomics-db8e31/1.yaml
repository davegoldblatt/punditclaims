  - There is no reversing this trend
  - OpenAI and Anthropic
  - rather than raising more money
evaluator_interpretation:
  - The trend refers to the preceding discussion of costs exceeding customer payments and resistance to higher effective prices.
  - The plain reading is a prediction that neither company can achieve a durable reversal of those economics.
  - For an early contradiction, I require at least two consecutive comparable quarters of full operating-cost coverage, including training, with continued customer purchases at those prices. The two-quarter persistence test is my operational choice.
  - A reversal at either named company would refute the categorical claim about both.
  - Fundraising is part of his explanation, not a forecast condition. I do not grade the separate superlative about fundraising records.
  - No deadline or accounting basis is supplied.
support_condition: The unlimited negative forecast cannot be established by a finite stretch of losses. Terminal failure of both businesses without a sustained reversal could settle its business-history reading.
contradiction_condition: Either company demonstrates sustained full-cost operating profitability and continued customer purchases on comparable terms, meeting the stated persistence test.
measurement_requirements: Comparable quarterly operating results including training and compensation, reconciled accounting measures, and evidence of customer retention or purchases at cost-covering prices. Efficiency gains, revenue growth, and one profitable quarter are insufficient alone.
source_requirements: Prefer filings, financial statements, and customer or transaction records. Separate management's claims from independently measured results.
