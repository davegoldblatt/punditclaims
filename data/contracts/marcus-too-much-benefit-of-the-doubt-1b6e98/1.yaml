evaluator_interpretation:
  - A viable competitor means an existing system with credible human-comparable breadth in learning, reasoning, language, and practical adaptation.
  - The claim does not require an AI to exceed every human on every task. Conversely, superhuman performance in one specialty is insufficient.
  - The surrounding child examples make flexible acquisition of unfamiliar abilities part of the comparison.
  - For the ongoing state, I use October 1–16, 2022, the current reporting month through the post. Earlier system evaluations are context unless they establish the relevant October state.
support_condition: Broad contemporary evaluations or a well-supported field assessment establish that existing leading systems fall materially short of human-comparable breadth and adaptability.
contradiction_condition: An existing system credibly demonstrates human-comparable breadth and adaptability across the relevant domains, including unfamiliar tasks.
measurement_requirements: Use varied tasks, appropriate human comparisons, and evidence of adaptation beyond training examples. Do not equate a system's task count, name, or selected benchmark scores with general intelligence.
source_requirements: Primary evaluations of plausible candidates and independent broad assessments covering the target period. The speaker's own conclusions cannot establish the result.
