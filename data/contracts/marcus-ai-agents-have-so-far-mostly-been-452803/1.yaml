assessment_axis: causal_assessment
explicit_source_elements:
  - current agents
  - grossly vulnerable to cyberattacks
  - as a consequence of their superficial understanding of what they’re being asked
evaluator_interpretation:
  - "'Current' means agents as of the post date; I use 2025 up to 2025-08-03."
  - "Plain reading of 'grossly vulnerable': in realistic tests, attackers can reliably make most frontier agents break their rules."
  - "Plain reading of the cause: the attacks work because agents respond to surface features of input (injected text, fake system tags, fake reasoning) and do not grasp who is actually instructing them or what the task really requires. Evidence that agents cannot tell trusted from untrusted instructions counts toward this."
support_condition: Large-scale tests show most current agents can be made to violate policies with modest effort, and successful attacks exploit the agents' failure to tell genuine instructions from injected or spoofed text.
contradiction_condition: Tests show current agents resist most attacks, or the main attacks succeed through causes unrelated to how agents interpret instructions (for example, ordinary software bugs in the surrounding system).
measurement_requirements: Attack success rates against frontier agents; descriptions of how successful attacks work.
source_requirements: Peer-reviewed or preprint red-teaming studies; expert security analysis.
