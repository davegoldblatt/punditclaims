explicit_source_elements:
  - we’re mistaking things for inevitability
  - far too much of the discussion
  - taking for granted that we are on the only path
evaluator_interpretation:
  - The checkable plain reading is that treating the current AI development path as unavoidable is widespread in public AI discussion. The judgment that this happens too often is normative.
  - Use October 2026, the month of the post, for the ongoing discussion described. Marcus supplies no reporting period.
  - Expecting continued AI development does not itself mean believing that its present technical and institutional path is the only possible one.
support_condition: A representative contemporary analysis finds widespread assertions that the present development path is unavoidable, despite documented alternatives.
contradiction_condition: A representative contemporary analysis finds that discussion generally recognizes meaningful alternatives and that assertions of a single unavoidable path are uncommon.
measurement_requirements: A defined sample of public commentary, transparent coding of inevitability claims, and a distinction between inevitable adoption and an inevitable development path.
source_requirements: Prefer original discourse research and the underlying commentary. Isolated examples or another author's agreement cannot establish prevalence.
