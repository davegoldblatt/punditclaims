assessment_axis: historical_observation
explicit_source_elements:
  - nobody has any proof
  - anyone is profitable on inference
  - plenty of proof they’re not
evaluator_interpretation:
  - Read profitability on inference as revenue exceeding the costs of serving models, before training and other company expenses.
  - Read proof as credible financial evidence, including reporting based on financial documents, rather than requiring publicly audited accounts.
  - Use calendar 2025, the latest completed annual period discussed in the surrounding financial claims. Evidence must also have been public before the post to contradict the assertion about what evidence existed.
support_condition: Public financial evidence establishes negative inference margins across the relevant labs, without credible evidence of a positive margin.
contradiction_condition: Credible financial reporting available before the post establishes a positive inference-related gross margin for at least one lab.
measurement_requirements: Separate serving costs from training and other expenses. Identify exclusions, adjustments, and whether free users are included.
source_requirements: Financial disclosures or credible reporting based on financial records; executive assertions and hypothetical models alone are insufficient.
