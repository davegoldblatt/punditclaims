assessment_axis: causal_assessment
explicit_source_elements:
  - Venture capital funding
  - allows it
  - massively subsidize its services
evaluator_interpretation:
  - The ordinary reading is that outside equity funding enables Anthropic to provide services for substantially less than their cost.
  - The subscription discussion makes customer-service economics relevant. Company-wide losses alone do not establish that paid services are sold below their delivery costs.
  - Assess the financing mechanism operating at publication. Do not infer a subsidy from the difference between subscription prices and API retail prices.
support_condition: Evidence establishes a substantial shortfall between service receipts and comparable service costs, and shows that venture funding finances that shortfall.
contradiction_condition: Comparable evidence establishes that the relevant services cover their costs without the claimed substantial funding-supported shortfall.
measurement_requirements: Realized service receipts, actual utilization, comparable delivery costs, a stated treatment of research and overhead, and records connecting financing to the shortfall.
source_requirements: Prefer financing announcements, financial statements, and product-level cost disclosures. Funding totals alone cannot establish a service subsidy.
