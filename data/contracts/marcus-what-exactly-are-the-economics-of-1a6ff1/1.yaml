explicit_source_elements:
  - works brilliantly in some use cases
  - selling ads
  - helping coders write code faster
  - playing classic board games
  - in many others it simply isn’t reliable enough
  - truly autonomous driverless cars
  - medical diagnosis
  - ChatGPT-style search
evaluator_interpretation:
  - The plain reading is a contrast between demonstrated practical successes and applications where reliability still limits dependable deployment.
  - Reliability means suitability for the intended task under realistic operating conditions. It does not require perfection.
  - Truly autonomous driving means operation without an onboard human driver; the wording does not specify whether geographically restricted operation counts.
  - Medical diagnosis does not specify clinician assistance versus independent diagnosis. Both must be distinguished when weighing evidence.
  - Use January 1–August 14, 2023 as the current-year deployment and evaluation window. Earlier experiments are context, even when published during 2023.
  - The magical-economic-engine phrase is rhetorical and supplies no separate economic metric.
support_condition: Evidence shows practical benefits in the successful examples and material reliability limitations preventing dependable intended use across the negatively described applications.
contradiction_condition: Representative evidence shows the alleged successes lack practical benefit, or the negatively described applications meet appropriate reliability standards in their intended operating conditions.
measurement_requirements: Evaluate each application separately. Distinguish authorization from measured safety, clinician assistance from autonomous diagnosis, and unsupported citations from demonstrably false answers. Individual failures alone do not establish comparative unreliability.
source_requirements: Contemporaneous productivity evaluations, deployment records, safety evidence, clinical evaluations, and search-quality audits. Earlier measurements must be identified as context.
