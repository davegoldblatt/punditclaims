  - the painting never changed
evaluator_interpretation:
  - The ordinary reading is that recognizable, impressive generated scenes also contain basic semantic or physical errors. The reference to superintelligence is figurative.
  - The target is the release demonstrations available when Marcus wrote, from September 29 through October 2, 2022.
  - The examples illustrate the broader observation; support need not establish that every demonstration fails. Nevertheless, a general technical limitation alone does not verify a visible error.
  - The phrase 'as ever' supplies rhetorical continuity, not a separately measurable claim about every earlier AI system.
support_condition: The original demonstrations, or reliable independent descriptions of them, establish recognizable generated scenes alongside basic semantic or physical errors.
contradiction_condition: Reliable inspection establishes that the alleged defects are absent or misdescribed and that the cited demonstrations do not exhibit comparable basic errors.
measurement_requirements: Inspect the original clips across frames, including the cat's anatomy and whether brush movements alter the portrait. Distinguish intentional surreal content from unintended inconsistency.
source_requirements: Prefer Meta's original release clips and research paper. Independent contemporaneous inspection can corroborate their contents; Marcus's account cannot corroborate itself.
