assessment_axis: causal_assessment
explicit_source_elements:
  - massive backlogs
  - Google, Microsoft, Amazon, CoreWeave, IREN, Nebius, and Nscale
  - come not from the incredible demand for AI compute
  - the incredible ability for Anthropic and OpenAI to sign contracts
evaluator_interpretation:
  - Read the claim as saying that the two labs predominantly explain the named providers' backlogs and that those backlogs overstate broad independent customer demand.
  - Use the latest completed reporting quarter, April–June 2026, for the ongoing provider-wide backlog assertion. The surrounding later Nscale deal is contextual evidence, not a substitute for a matching quarterly breakdown.
  - A contract with Microsoft or another intermediary is not attributed to a lab without evidence of the ultimate customer.
  - Contract concentration alone does not establish that the underlying demand is unrealizable.
  - Backlog, remaining performance obligations, and total contract value require separate definitions and cannot automatically be added together.
support_condition: Comparable provider records show that the two labs directly or indirectly dominate each named backlog, and contract conditions, financing, or usage evidence establishes that these totals materially overstate broad independent demand.
contradiction_condition: Comparable records show substantial backlog originating outside the two labs that defeats the asserted predominance, or show that the backlogs credibly reflect broad independent demand. Evidence about incremental growth alone does not establish the composition of the whole backlog.
measurement_requirements: Obtain provider-specific backlog definitions, customer shares, ultimate users, delivery dates, financing conditions, and cancellation rights. Separate backlog stocks from quarterly bookings and changes.
source_requirements: Filings and contract disclosures with customer attribution. Reported private contracts may supplement primary records if their sourcing and limitations are clear.
