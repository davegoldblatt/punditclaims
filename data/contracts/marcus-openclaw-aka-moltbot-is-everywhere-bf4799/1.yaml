explicit_source_elements:
  - Systems like OpenClaw and AutoGPT
  - At their best
  - basically do anything a human personal assistant or intern might do
  - booking itineraries
  - maintaining finances
  - writing reports
  - tracking and even completing tasks
evaluator_interpretation:
  - The plain reading concerns the broad range of ordinary digital assistant and intern work under favorable conditions.
  - The examples make physical errands an inappropriate test of this software claim.
  - At their best allows suitable models, integrations, permissions, and human setup; it does not assert dependable unsupervised performance.
  - Basically anything requires broad coverage beyond a few selected successes, while allowing occasional exceptions.
  - For the ongoing capability observation, use January 2026, the latest completed month before the post and the period of the examples in its context.
support_condition: Dated demonstrations or evaluations establish end-to-end capability across the named task classes and a representative breadth of ordinary digital assistant work under favorable conditions.
contradiction_condition: Evidence establishes that the contemporary systems cannot perform a substantial ordinary digital task class even with favorable setup, rather than merely documenting individual failed attempts.
measurement_requirements: Distinguish advertised integrations from completed tasks, itinerary suggestions from completed bookings, financial document preparation from broader financial maintenance, and potential capabilities from observed results.
source_requirements: Contemporaneous demonstrations with inspectable results or reproducible evaluations; project showcases can establish reported examples but not representative coverage.
