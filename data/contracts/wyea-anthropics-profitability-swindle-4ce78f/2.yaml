ambiguity_flags:
  - "'Scale linearly' is hedged with 'it appears' and has no stated measure. It is read as 'costs rose roughly in step with revenue', not as strict proportionality."
  - The claim describes a WSJ chart that cannot be inspected. Filed quarterly figures are used in its place, and the chart may have shown different series or projected values.
  - "'Costs' is not defined. Total operating expenses and compute expense are both checked."
  - "'Last year' implies the pattern held through 2025. The start of the period (Q1 2025) is chosen from the quarters the filing reports."
