assessment_axis: historical_observation
explicit_source_elements:
  - '"based on this unhelpfully-labeled diagram from the Journal, it appears"'
  - '"(as I said last year)"'
  - '"its costs scale linearly with its revenues"'
  - "\"except they…magically didn't in the second quarter\""
evaluator_interpretation:
  - "The speaker hedged ('it appears'), so this is not graded as a claim of strict mathematical proportionality. The ordinary reading is looser: Anthropic's costs kept rising roughly in step with revenue in the quarters before Q2 2026, and Q2 2026 was the one quarter that broke from that pattern."
  - The paywalled WSJ chart cannot be read. The test therefore uses Anthropic's own quarterly figures for Q1 2025 to Q2 2026, which cover the same quarters, as published in its S-1 of October 2026 and reproduced by secondary analyses.
  - "'Costs' means total operating expenses (revenue minus operating income), with compute and infrastructure as the main part. 'Second quarter' means calendar Q2 2026 (April to June)."
  - The word 'magically' implies something suspicious. That motive is not graded here. Only the pattern in the numbers is graded.
support_condition: Quarterly costs rose about as fast as revenue from 2025 through Q1 2026, so the cost-to-revenue ratio stayed roughly level, and then dropped sharply for the first time in Q2 2026.
contradiction_condition: Costs had already stopped keeping pace with revenue before Q2 2026, for example in Q1 2026, so Q2 was not the single break. Or costs did not track revenue in 2025 either.
measurement_requirements: Use Anthropic's quarterly revenue, total operating expenses and compute and infrastructure expense for Q1 2025 to Q2 2026. Compare quarter-on-quarter growth in costs with growth in revenue, and the cost-to-revenue ratio for each quarter.
source_requirements: "Use Anthropic's company-reported quarterly figures: the S-1 filing, or analyses that reproduce its quarterly table. Treat press reports of investor projections as context only."
metric_scope:
