explicit_source_elements:
  - you can’t reason reliably
  - if you can’t maintain cognitive models of the world
  - no matter how much memory or compute you might have
evaluator_interpretation:
  - This is a general theoretical claim that maintaining world models is a necessary condition for reliable reasoning, at any scale.
  - No test, threshold, or deadline is given. 'Reason reliably' and 'maintain cognitive models of the world' have no agreed operational definitions, and whether a given system has world models is itself disputed.
  - A universal 'no matter how much compute' claim cannot be confirmed by finite experiments. Refuting it would first require agreement that some system lacks world models yet reasons reliably.
support_condition: Not adjudicable. Support would need an accepted way to tell whether a system maintains world models, plus evidence that every system lacking them fails at reliable reasoning at every scale.
contradiction_condition: Not adjudicable. Contradiction would need agreement that a specific system lacks world models, plus evidence that it nonetheless reasons reliably.
