assessment_axis: historical_observation
explicit_source_elements:
  - GenAI
  - has had very little impact on GDP
  - despite initial enthusiasm
evaluator_interpretation:
  - The ordinary reading concerns a small realized economy-wide GDP effect by publication, rather than future potential or productivity gains on individual tasks.
  - I use calendar 2024, the latest completed annual reporting period before publication, to assess the ongoing aggregate state.
  - No geography is specified. Evidence from one country is informative but cannot alone establish the unrestricted claim.
  - GDP effects include investment and production effects, not only productivity gains from using GenAI.
support_condition: Credible retrospective economic estimates show that GenAI made only a small contribution to aggregate GDP through 2024, accounting for both adoption and investment effects.
contradiction_condition: Credible retrospective estimates establish a substantial aggregate GDP contribution from GenAI through 2024.
measurement_requirements: Estimate realized GDP effects relative to a counterfactual without GenAI. Distinguish GDP levels from growth rates, productivity from output, and domestic value added from gross spending.
source_requirements: Prefer national-accounting analysis or economic research with explicit attribution methods. Forecasts and task-level experiments are context only.
