assessment_axis: forecast_outcome
explicit_source_elements:
  - Large Language Models
  - will not solve
  - the kind of complex problems that actually matter
evaluator_interpretation:
  - The plain reading is a categorical denial that LLMs will produce correct solutions to consequential complex problems.
  - A scientifically important problem concerning disease mechanisms qualifies; a clinical cure is not required.
  - An LLM may operate within a research system using tools and human verification, provided it materially generates the solution. The wording does not require an unaided chatbot.
  - No deadline is stated.
support_condition: A finite period without a qualifying solution cannot establish this unlimited negative prediction.
contradiction_condition: At least one consequential complex scientific, medical or engineering problem receives a correct solution materially generated by an LLM and verified against evidence external to its generated answer.
measurement_requirements: Document the problem, the LLM's contribution, the correctness check and the problem's scientific or practical importance. Benchmark success or an untested hypothesis alone is insufficient.
source_requirements: Require original research with experimental or independently checkable validation. Distinguish participating academic validation from a fully independent replication.
