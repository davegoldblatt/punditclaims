original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented post-publication case meeting the contradiction condition settles the categorical negative forecast when the verified result becomes public.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Actually matter does not specify a domain or importance threshold.
  - Solve does not specify whether assisted research systems qualify.
  - No deadline is stated.
