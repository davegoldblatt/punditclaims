  - the same Achilles’ Heel remains
  - a more abstract, similarity-independent way
evaluator_interpretation:
  - The plain reading is that learning rules which transfer beyond familiar training examples remained a weakness of contemporary deep learning.
  - Persistence of a weakness does not require every neural architecture to fail every rule-learning task.
  - The historical comparison concerns the type of behavioral limitation. It does not establish identical internal mechanisms across three decades.
  - The target is the 2023 research state through publication. With no regular reporting period, I use the current calendar year through 2023-10-19.
support_condition: Contemporary controlled studies document continuing failures to transfer learned rules to unfamiliar problem sizes or structures despite strong performance on familiar cases.
contradiction_condition: Contemporary studies establish broadly dependable rule transfer across unfamiliar sizes and structures, showing that the described generalization weakness had been overcome. Individual successes qualify the claim but do not alone establish this.
measurement_requirements: Separate familiar-case performance from transfer to held-out sizes or structures. Document architectural changes, training coverage, and any external symbolic components.
source_requirements: Primary studies available by publication, including successful neural generalization results as counterevidence.
