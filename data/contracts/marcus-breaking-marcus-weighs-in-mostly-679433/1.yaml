  - JEPA
evaluator_interpretation:
  - The object of the claim is LeCun's JEPA line of world models as it stood at the post date. Its flagship public result is V-JEPA 2 (June 2025).
  - "'Opaque, uninterpretable neural network' is read as: an end-to-end learned neural network whose knowledge sits in learned latent embeddings rather than explicit, inspectable structure."
  - "'Doesn't lend itself to reasoning' is read as: the system does not support reasoning, planning or inference over its world model. Demonstrated planning with the model counts against this part."
support_condition: Published JEPA architectures are purely neural, with implicit latent representations and no explicit structured knowledge, and show no reasoning or planning ability.
contradiction_condition: Published JEPA work includes explicit, interpretable structure, or shows the world model being used for reasoning or planning.
measurement_requirements: Architecture descriptions and reported planning or reasoning results in JEPA papers.
source_requirements: Primary research papers from LeCun's group.
