explicit_source_elements:
  - GDM's new work
  - proof of concept
  - Neural networks and symbol systems
  - can be profitably combined
evaluator_interpretation:
  - "'Profitably' means producing useful technical results, not financial profit."
  - "This is an existence claim: the described work demonstrates a useful combination of learned neural components and formal symbolic reasoning."
  - The relevant event is the July 2024 IMO demonstration discussed in the surrounding text.
  - Support does not require proof that hybrids always outperform other approaches, that every component was indispensable, or that the systems were fully autonomous.
  - The phrase 'contra Hinton and LeCun' is not separately assessed as a claim about those researchers' complete positions.
support_condition: Architecture and result records establish that neural components interacted with symbolic deduction or formal proof machinery to produce valid solutions to difficult mathematical problems in the July 2024 demonstration.
contradiction_condition: The systems lacked the claimed neural-symbolic interaction, or the reported useful mathematical results were shown to be invalid.
measurement_requirements: Verify both the interaction of neural and symbolic components and useful mathematical outputs. Distinguish medal-equivalent scoring from participation under the human competition's conditions.
source_requirements: Primary architecture descriptions and published proof artifacts or technical accounts of the 2024 results.
