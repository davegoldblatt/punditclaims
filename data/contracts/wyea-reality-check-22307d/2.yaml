explicit_source_elements:
  - There is nothing else after generative AI
  - There are no other hypergrowth markets left in tech
evaluator_interpretation:
  - In context, the claim is that no market other than generative AI could carry the growth and valuations of big tech and public software firms. It links directly to 'Google, Microsoft, Amazon and Meta do not have any other ways to continue showing growth'.
  - "'Hypergrowth market' has no stated growth rate or size threshold. 'Nothing else after' also looks forward with no deadline."
  - Small-scale fast growth, such as robotaxi rides, would not fairly test a claim about markets able to carry tech-industry growth. A size-and-growth threshold would have to be invented, and the result would turn on that choice.
support_condition: Not scoreable. It would need an agreed definition of a hypergrowth market big enough to carry big-tech growth.
contradiction_condition: Not scoreable for the same reason. Any counterexample depends on a threshold the speaker did not give.
