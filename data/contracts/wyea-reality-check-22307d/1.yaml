  start: 2025-01-01
  end: 2025-03-31
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Latest completed quarter selected for an undated ongoing observation.
  - "'Hypergrowth' has no stated metric, threshold, or minimum market size."
  - "'After generative AI' could instead refer to a future successor capable of sustaining Big Tech's growth."
  - The boundary between generative AI and other AI-enabled markets is unspecified.
