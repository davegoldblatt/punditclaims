assessment_axis: historical_observation
explicit_source_elements:
  - at least $200 billion
  - if not more than $300 billion
  - NVIDIA’s GPU sales
  - made a year or years in advance
evaluator_interpretation:
  - The surrounding discussion makes installation into operational infrastructure the reference point for 'in advance'.
  - The firm commitment is at least $200 billion. More than $300 billion is a tentative extension.
  - The contextual buildout begins in 2022. I assess sales from January 1, 2022 through publication on September 22, 2026.
  - Sales means completed GPU sales valued at NVIDIA's sale proceeds, not purchase commitments, customer rack costs or annualized revenue.
  - The accounting basis is estimate because the passage presents the speaker's inferred allocation of sales and capital expenditures.
  - The reference to fiscal 2028 revenue is background, not a separate forecast in this claim.
support_condition: Matched sales and commissioning records establish at least $200 billion of NVIDIA GPU sales in the stated cohort with at least twelve months between sale and operational installation.
contradiction_condition: Comprehensive matched records, or a reliable upper bound covering the relevant sales cohort, establish that less than $200 billion qualifies.
measurement_requirements: GPU-specific sale values and dates matched to customer installation dates. For still-uninstalled equipment, elapsed time since sale must already establish twelve months, or reliable records must establish the later installation date.
source_requirements: NVIDIA sales records and customer commissioning or asset records, or independently verified reporting that reconciles them. Aggregate capex, deferred revenue and construction balances alone are insufficient.
metric_scope:
  company: NVIDIA
  metric: Cumulative value of GPU sales preceding operational installation by at least twelve months
  currency: USD
  units: billions of dollars
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2022-01-01
  period_end: 2026-09-22
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
