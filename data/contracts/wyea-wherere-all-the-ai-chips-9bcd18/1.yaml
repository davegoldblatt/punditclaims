ambiguity_flags:
  - The exact sentence does not specify the cumulative sales period; the 2022 starting point comes from context.
  - The installation reference point comes from context.
  - Sales could otherwise be confused with orders or customer purchases of complete systems.
  - The estimate does not explain how uninstalled equipment was assigned a delay of at least one year.
