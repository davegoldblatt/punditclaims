explicit_source_elements:
  - $33 million dollars
  - all of it unprofitable
  - nearly $400 million in annualized revenue
  - on July 31 2025
evaluator_interpretation:
  - The surrounding passage anchors the figure to the July 2025 run rate reported on July 31, rather than September revenue.
  - The monthly figure means annualized revenue divided by twelve. It is not an independently reported calendar month's realized revenue.
  - Unprofitable means Claude Code's attributable costs exceeded its revenue. Anthropic-wide losses would not establish this.
  - The metric scope records the numerical revenue claim. The profitability component has no specified cost allocation or accounting basis.
support_condition: A July run rate equivalent to approximately $33 million per month, together with product-level evidence that attributable costs exceeded revenue.
contradiction_condition: A materially different July revenue run rate, or reliable evidence of positive Claude Code product profit for that period.
measurement_requirements: Keep annualized run rate separate from realized revenue. Profitability requires Claude Code revenue and attributable costs on a consistent basis.
source_requirements: Prefer product-level financial disclosures. Identified press estimates can establish the reported run rate, but company-wide financial results cannot establish product profitability.
