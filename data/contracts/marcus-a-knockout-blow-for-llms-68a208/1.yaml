assessment_axis: historical_observation
explicit_source_elements:
  - neural networks of various kinds
  - can generalize within a training distribution
  - generalizations tend to break down outside that distribution
evaluator_interpretation:
  - "The plain reading is a recurring empirical weakness: networks that perform well on held-out examples resembling their training data often perform substantially worse after a distribution shift."
  - The words 'tend to' allow successful exceptions. 'Break down' means a substantial loss of successful generalization, without requiring accuracy to fall to zero.
  - The surrounding passage explicitly describes a longstanding pattern dating from 1998 through the post. I assess that historical research record through 2025-06-07. This scientific claim has no quarterly reporting cycle.
  - A new example from the same distribution is distinguished from a test that changes combinations, sequence lengths, domains, or other relevant data properties.
support_condition: Controlled studies across several neural-network variants and tasks show successful within-distribution generalization alongside substantial performance losses under specified distribution shifts.
contradiction_condition: Broad, controlled comparisons across varied neural networks and meaningful distribution shifts show that within-distribution performance generally carries over, making substantial breakdown an exceptional rather than recurring pattern.
measurement_requirements: Compare held-out within-distribution and shifted test performance using task-appropriate measures. Identify the training distribution and the shift; distinguish successful generalization from training-set memorization.
source_requirements: Primary experimental papers or benchmark records with described training and evaluation procedures. Include successful generalization results as counterevidence.
