  - Overall could mean aggregate financial impact rather than the absence of substantial individual successes.
  - Opportunities does not specify contracts, deployments, prospective markets or investment returns.
  - The exclusion of OpenAI as a customer comes from the surrounding argument.
  - An ongoing-state claim is evaluated using the latest reported quarter before publication.
