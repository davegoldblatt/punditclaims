explicit_source_elements:
  - Both Google and Microsoft
  - now forcing generative AI features onto customers
  - Google Workspace
  - $2-per-user-per-month
  - consumer Office subscriptions
  - adding Copilot AI features
  - customers really don't want
evaluator_interpretation:
  - Now refers to the subscription changes announced in January 2025 by the post date, including changes scheduled to apply at renewal.
  - Treat forcing as moving customers into an AI-inclusive paid bundle by default without their choosing an AI add-on. Whether comparable non-AI plans remained available is a material qualification.
  - Treat customers don't want the features as a general demand claim about the affected subscriber populations, not a claim that literally no customer wants AI.
  - The Google amount must be checked by plan and billing arrangement. A matching example does not establish a uniform increase for all Workspace business users.
  - The post links press reporting, so the contract records estimate as its reporting basis. Company announcements are kept under their own company_reported basis.
  - The claim combines two companies and different subscription units. Individual-company pricing evidence is component context, not an interchangeable measurement of the combined scope.
support_condition: Evidence establishes the stated Google price increase for the relevant plans, a Microsoft consumer-subscription increase tied to Copilot, default AI bundling, and representative evidence that affected customers generally did not want the bundled features.
contradiction_condition: Comparable evidence disproves a stated pricing or bundling component, or representative evidence shows affected customers generally wanted the features. Accessible comparable non-AI plans would materially qualify a compulsory-bundling reading.
measurement_requirements: Preserve company, plan, country, currency, billing commitment, per-user versus per-subscription units, effective dates, and renewal rules. Customer demand requires representative evidence about the affected subscribers and these features.
source_requirements: Dated pricing announcements and subscription terms; independent representative customer research for demand. Individual complaints and general AI-adoption surveys are insufficient.
