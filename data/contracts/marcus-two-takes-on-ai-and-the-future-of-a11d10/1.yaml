  - the July METR study
  - coding tools sometimes impair productivity rather than increasing it
evaluator_interpretation:
  - Assess what the July 2025 publication found, rather than the performance of every coding tool.
  - Sometimes means at least the circumstances studied; it does not imply a typical effect across all developers.
  - The target period is July 2025 because the claim concerns that publication's findings. Its experiments used earlier-2025 tools.
support_condition: The July METR study reports that allowing AI coding tools increased task-completion time in the studied setting.
contradiction_condition: The study reports no slowdown, or its design and results do not support the claimed existence of a productivity impairment.
measurement_requirements: Compare task-completion time with and without AI access, preserving the studied developers, tasks and tools.
source_requirements: The original July METR paper and methodological disclosures.
