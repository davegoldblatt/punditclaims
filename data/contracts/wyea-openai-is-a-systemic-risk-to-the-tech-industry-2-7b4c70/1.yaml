explicit_source_elements:
  - OpenAI will have to
  - at the very least, put a billion dollars into
  - it's unclear who actually pays for what parts of Stargate
  - meant to be up and running by the end of 2026
evaluator_interpretation:
  - Read put money into as OpenAI's own capital contribution or direct funding of Stargate development, consistent with the surrounding discussion of capital contributions.
  - The end of 2026 describes intended project operation. It does not expressly set a deadline for OpenAI's contribution, so the financial forecast has an open horizon.
  - Uncertainty about who pays is a qualification, not an antecedent that must occur.
  - A definite obligation to contribute at least USD 1 billion can settle will have to before all cash is paid. An aspiration or proposed contribution cannot.
  - Use estimate as the financial basis because the contribution discussion relies on press reporting.
support_condition: Verified cumulative OpenAI capital contributions to the described Stargate project reach USD 1 billion, or a binding agreement establishes an unavoidable contribution of at least that amount.
contradiction_condition: The relevant project is definitively completed or terminated with verified total OpenAI contributions below USD 1 billion and no remaining obligation to contribute.
measurement_requirements: Identify OpenAI's own contribution, distinguishing it from partners' funding, project-wide investment totals, financing raised by OpenAI and ordinary cloud-purchase commitments.
source_requirements: Executed agreements, financial disclosures or reputable reporting that clearly distinguishes definite obligations and completed contributions from plans.
