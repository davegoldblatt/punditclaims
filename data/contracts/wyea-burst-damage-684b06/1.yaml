evaluator_interpretation:
  - The monetary claim is an approximate worldwide cumulative estimate through the post date, not spending during 2024 alone.
  - The starting date is unspecified and is left open.
  - A meaningful aggregate must distinguish financing from expenditure financed by it and avoid counting the same resources twice.
  - The quality statement is read as a broad comparison with competent human work available at the time, not a claim that every AI output loses every comparison.
  - No numerical tolerance around $200 billion or representative quality benchmark is supplied.
support_condition: A transparent, reasonably comprehensive estimate places cumulative generative AI spending near $200 billion by August 5, 2024, without material double counting; representative comparisons also establish the claimed general quality disadvantage.
contradiction_condition: A comparable aggregate places spending clearly outside a reasonable rough-estimate range, or representative evaluations establish that the general quality comparison is reversed. One narrow benchmark cannot settle the broad quality claim.
measurement_requirements: Separate funding, infrastructure purchases and operating costs; allocate shared cloud infrastructure to generative AI; disclose omissions and uncertainty. Quality tests must specify tasks, models, human comparators and evaluation methods.
source_requirements: Investment datasets, expenditure records and transparent aggregate estimates, supplemented by independent human-versus-AI evaluations using systems available by the post date.
