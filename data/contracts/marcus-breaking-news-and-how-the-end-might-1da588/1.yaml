  - to make a reliable version of the product
  - either have to charge more than customers want to pay, or the providers have to take a loss
evaluator_interpretation:
  - The claim depends on a 'reliable version of the product', which Marcus does not define and which he generally holds does not yet exist. No public data measures the cost of such a product.
  - "'More than customers want to pay' has no stated threshold."
  - Provider margins on current products can be observed but are not the product he describes, so they are context only.
support_condition: "Not adjudicable: no observable measure of a 'reliable version' and its costs."
contradiction_condition: Not adjudicable for the same reason.
