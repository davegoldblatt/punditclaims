explicit_source_elements:
  - I can’t think of a single measure
  - any existing model in 2024
  - outpace GPT-4 by as much
  - GPT-4 outpaced the state of the art in 2020
  - already behind the curve
evaluator_interpretation:
  - I assess the qualified empirical suggestion that no qualifying comparison exists, rather than Marcus's private ability to recall an example.
  - Models must have existed by June 5, 2024. Later 2024 releases do not qualify.
  - GPT-4 ordinarily means the original model in this comparison, but the version is not explicit.
  - For scored benchmarks, the default comparison is improvement in the same score units under comparable evaluation conditions.
  - The 2020 baseline must be the actual relevant leader; GPT-3 cannot automatically stand in for every 2020 state of the art.
  - Context capacity is a plausible reading of single measure, but may fall outside the intended comparison of intellectual performance.
  - Behind the curve needs an identified trajectory and an expected value by the post date.
support_condition: Comparable evaluations across the relevant measures show that no model existing by the post achieved a gain over GPT-4 as large as GPT-4's gain over the corresponding 2020 leader, and the claimed shortfall is established against a specified trajectory.
contradiction_condition: At least one relevant, comparable measure shows an eligible model's gain over GPT-4 equaling or exceeding GPT-4's gain over the corresponding 2020 leader.
measurement_requirements: Use consistent datasets, score direction, prompting, tools, sampling and model versions. Distinguish absolute gains from relative gains and error reduction. Avoid treating context capacity as demonstrated reasoning quality without stating that interpretation.
source_requirements: Primary benchmark records or model reports for all comparison endpoints. Later reports may document eligible older models, but later models cannot substitute for them.
