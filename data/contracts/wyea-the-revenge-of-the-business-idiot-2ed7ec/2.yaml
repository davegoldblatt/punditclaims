ambiguity_flags:
  - '"That demand" could mean all demand behind NVIDIA and Samsung guidance, or only the narrower set of third-party data center projects funded by private credit and banks that the section discusses.'
  - He states no period. The window from January 2026 to the post date is an evaluator choice for a present-tense claim.
  - '"Almost entirely" has no numeric threshold.'
