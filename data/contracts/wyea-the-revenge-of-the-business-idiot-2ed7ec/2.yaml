assessment_axis: historical_observation
explicit_source_elements:
  - That "demand"
  - almost-entirely funded by debt
  - 'responding to: guidance from companies like NVIDIA and Samsung prove that "the demand is there"'
  - present tense, post of 2026-05-26
evaluator_interpretation:
  - "\"That demand\" refers to the AI compute and data center demand shown in supplier guidance such as NVIDIA's. That demand comes mostly from hyperscalers and large AI buyers."
  - 'Plain reading: "almost entirely funded by debt" means debt pays for the large majority (roughly 80-90% or more) of spending on AI compute and data centers, not operating cash flow or equity.'
  - He names no period. The claim describes an ongoing state at the post date, so the target period is 1 January 2026 to the post date. That covers the latest quarters reported before the post (calendar Q1 2026, and NVIDIA's quarter ending April 2026).
  - If the largest buyers paid for most of their capital spending out of operating cash flow in that period, the claim is false on this reading.
support_condition: Evidence that most spending on AI compute and data centers in early 2026, including by the largest hyperscaler buyers, was paid for with borrowed money rather than operating cash flow or equity.
contradiction_condition: Evidence that major buyers behind that demand (for example Alphabet and Meta) paid for their capital spending in early 2026 mainly out of operating cash flow, so debt was not almost the whole source of funding.
measurement_requirements: Compare capital spending with operating cash flow and debt raised by the main AI compute buyers in the target period.
source_requirements: Company earnings releases or filings for cash flow and capex. Credible aggregate estimates of how AI infrastructure is funded.
metric_scope:
  company: AI compute and data center buyers (industry-wide, mainly hyperscalers)
  metric: Share of AI compute and data center spending funded by debt
  currency: USD
  units: percent of spending
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-05-26
