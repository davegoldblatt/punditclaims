explicit_source_elements:
  - That “demand”
  - almost-entirely funded by debt
evaluator_interpretation:
  - The ordinary reading is that borrowed money finances overwhelmingly most AI compute purchasing demand, with operating cash and equity making only a minor contribution.
  - The surrounding discussion concerns sector-wide demand, not merely the subset of projects financed through debt deals.
  - Because no period is named, use January through March 2026, the latest completed calendar quarter that public company reports could cover before the post.
  - No numerical cutoff or accounting basis is supplied. Do not invent a percentage threshold or infer funding attribution from debt issuance alone.
support_condition: A representative, reconciled account of first-quarter AI compute purchases shows that debt financed overwhelmingly nearly all purchases, with only minor non-debt funding.
contradiction_condition: Comparable records show that operating cash or equity financed a substantial share of the same purchases, inconsistent with almost entirely debt funding.
measurement_requirements: Trace actual compute purchases to debt, operating cash and equity. Include relevant purchasers and off-balance-sheet financing without counting the same transaction repeatedly.
source_requirements: Company financing and cash-flow disclosures supplemented by a transparent sector-wide reconciliation.
