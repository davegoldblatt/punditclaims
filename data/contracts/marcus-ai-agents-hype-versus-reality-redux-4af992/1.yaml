explicit_source_elements:
  - you can't build agents unless you have
  - common sense, sound reasoning, a tight grounding in reality
  - systems that reliably do what you ask
  - enough theory of mind to infer your intentions
evaluator_interpretation:
  - This is a claim about what is necessary to build (by implication, capable and reliable) agents. Read literally, it is false at once, because agents of some kind were built. In context, Marcus clearly means the general, trustworthy agents he describes as years away.
  - The prerequisites (common sense, theory of mind, tight grounding in reality) have no agreed operational measures. A necessity claim can only be tested once a system exists that meets the target without the listed traits, and none had clearly done so or failed to do so by a settled standard.
support_condition: "Not adjudicable: no observable event would show that the listed traits are necessary."
contradiction_condition: "Not adjudicable in practice: refuting it would require agreed measures showing a reliable general agent that lacks common sense or theory of mind, and no such measures exist."
