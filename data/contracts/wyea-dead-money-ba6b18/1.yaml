explicit_source_elements:
  - there are reasons to believe
  - things have gotten worse
  - using adjusted margins
  - faking a “profit” in Q3 2026
evaluator_interpretation:
  - The checkable core is that Anthropic presented Q3 profitability using adjustments that concealed an otherwise unprofitable result.
  - The suggestion that economics worsened is hedged. It is not a firm commitment that every measure deteriorated.
  - Using an adjusted measure alone does not establish deception or deterioration.
  - The target is Q3 2026, explicitly named in the claim. The claim concerns a presentation already made, even though the quarter had not ended when the post appeared.
  - The accounting basis is classified as estimate because the underlying investor communication was reported by the press.
support_condition: A contemporaneous investor presentation and a matching Q3 reconciliation establish that Anthropic represented itself as profitable only by excluding material expenses, with evidence that the presentation obscured this distinction. Comparable unadjusted results would separately establish deterioration.
contradiction_condition: The actual presentation and matching Q3 results establish ordinary profitability without the disputed exclusions, or establish that the alleged profitability representation was not made.
measurement_requirements: Distinguish gross margin, adjusted operating income, operating income, net income and cash flow. Compare the same periods and expense definitions.
source_requirements: Prefer the investor presentation and financial reconciliation. Independently sourced reporting can establish what shareholders were told.
