  - only spending $30 a day
  - any of Anthropic’s more-recent models
evaluator_interpretation:
  - The plain reading is that ordinary active development with recent Anthropic models necessarily exceeds $30 per developer per day.
  - The surrounding discussion makes this a claim about metered token costs, rather than subscription fees divided by calendar days.
  - Recent models means models available when the post appeared, including its explicit example, Opus 4.7.
  - I use April 2026 through the post date as the current observation period. The post specifies neither a measurement window nor a minimum daily workload.
support_condition: Model-specific daily usage evidence establishes a cost floor above $30 for ordinary active development with the recent models covered by the claim.
contradiction_condition: Credible usage records show ordinary active development with a recent model costing $30 or less per developer per active day, using the applicable token prices.
measurement_requirements: Identify models, active days, input and output tokens, cache charges, and all relevant sessions. Distinguish metered costs from subscription payments and monthly averages.
source_requirements: Prefer Anthropic's model-specific usage statistics or reproducible developer logs. Aggregate statistics without model identification provide context.
