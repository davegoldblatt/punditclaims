evaluator_interpretation:
  - "Assess the tentative factual inference as a whole: prior corporate knowledge, deliberate interference, a commercial motive, and an export-violating relationship."
  - Corporate knowledge means knowledge by relevant NVIDIA officers beyond Jensen Huang's knowledge of his own relationship.
  - The target is the historical episode described through publication. Its starting date is unspecified.
  - Contacting investigators and a subsequent transfer between agencies do not alone establish an intention to obstruct.
support_condition: Credible records or corroborated reporting establish prior corporate knowledge of the affair, efforts intended to impede the investigation to preserve business, and actual export violations in that relationship.
contradiction_condition: Reliable evidence affirmatively refutes a material part of the account, such as demonstrating that the relevant transactions complied with export rules or that the alleged interference did not occur.
measurement_requirements: Establish who knew what and when, what NVIDIA requested, how officials responded, and which transactions violated which restrictions.
source_requirements: Prefer communications, investigative records and enforcement findings. Corroborated reporting can support the inference; photographs, allegations and company denials alone cannot settle it.
