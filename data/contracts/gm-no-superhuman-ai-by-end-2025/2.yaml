assessment_axis: forecast_outcome
explicit_source_elements:
  - "'I don’t buy the predictions for the next year', replying to Musk's 'smarter than any one human probably around the end of next year'"
  - "'AGI superior to the smartest individual humans would not arrive by the end of 2025'"
  - "Marcus's stated test: 'show at least one piece of intellectual work that the very best humans can do that AGI can’t'"
  - "Marcus's reading of Musk: AGI 'will be able to do any intellectual work that any human can do by the end of next year'"
evaluator_interpretation:
  - We count a published task set that humans have been shown to solve, and that no verified AI system solved in full, as intellectual work that skilled humans can do and AI could not.
  - We use the latest public measurement before the deadline. A result first published after 2025-12-31 is not used.
support_condition: A dated public measurement shows that, near the end of 2025, at least one kind of intellectual work that skilled humans can do was not done by any AI system.
contradiction_condition: By 2025-12-31 an AI system could do any intellectual work that any human can do, so that no task set was left where humans succeed and AI fails.
