assessment_axis: not_applicable
explicit_source_elements:
  - ChatGPT and other AI tools
  - for the most part
  - sold based on what they might do in the future
  - to people that will never really use them
  - Altman has done well to manipulate, pester and terrify those in power
  - the idea that they might miss out on something
evaluator_interpretation:
  - The claim mixes three things. One is the content of sales pitches across all AI tools ('based on what they might do in the future'). Another is a forecast about buyers' future behaviour ('will never really use them'). The third is a description of Altman's motives and their effect on 'those in power' ('manipulate, pester and terrify').
  - No public dataset measures what share of all AI tool sales rest on future capability rather than current use. 'Those in power' and 'never really use them' also have no plain, measurable boundary. Whether buyers means purchasing organisations or the people inside them changes the answer.
  - Public usage data (for example, hundreds of millions of weekly ChatGPT users) speaks only to part of the claim and cannot settle the 'for the most part' sales characterisation.
support_condition: Not adjudicable. It would need representative data showing most AI tool sales are pitched mainly on future capabilities to buyers who do not use them.
contradiction_condition: Not adjudicable. It would need representative data showing most AI tool sales rest on current capabilities and that buyers actually use what they buy.
