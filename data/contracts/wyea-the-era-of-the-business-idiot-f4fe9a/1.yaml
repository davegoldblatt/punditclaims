assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT and other AI tools
  - for the most part
  - sold based on what they might do in the future
  - people that will never really use them
  - Altman
  - the idea that they might miss out
evaluator_interpretation:
  - For the most part means a majority, not merely several prominent examples.
  - Given the surrounding discussion of institutional procurement, the primary reading concerns purchasing decision-makers and the organizations they represent.
  - Future benefits must be the principal sales rationale, rather than one element of an otherwise current-capability pitch.
  - The claim also asserts that Altman's appeals to fear of missing out influenced those decisions; promotional language alone would not establish that effect.
  - For the ongoing sales observation, use the latest completed calendar quarter before publication, January through March 2025.
  - Never really use has no defined duration or intensity. Low initial adoption cannot establish permanent nonuse.
support_condition: Representative evidence links a majority of relevant purchases to primarily speculative future-capability pitches and subsequent nonuse by the specified buyers, with evidence that Altman's fear-of-missing-out appeals influenced decisions.
contradiction_condition: Representative matched evidence shows that the majority of relevant purchases principally concerned delivered capabilities and that the specified buyers actually used them, or directly refutes the asserted influence mechanism.
measurement_requirements: Define the purchasing population and weighting; connect contemporaneous sales materials, buyer motivations, and usage records for the same purchases. Distinguish decision-maker use, employee use, free use, and paid use.
source_requirements: Procurement records, representative buyer research, actual usage measurements, and dated pitches. Individual examples cannot establish market prevalence.
