ambiguity_flags:
  - "'Political capital' has no specified measure."
  - "'Rapidly' has no numerical rate."
  - "'A few months ago' gives an approximate baseline."
  - A reading confined to national favorability would produce a different assessment from the ordinary broader meaning.
