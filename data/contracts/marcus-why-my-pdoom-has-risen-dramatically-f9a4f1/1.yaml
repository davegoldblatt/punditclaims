assessment_axis: historical_observation
explicit_source_elements:
  - His political capital
  - rapidly diminishing
  - relative to where it was a few months ago
evaluator_interpretation:
  - The referent is Elon Musk.
  - "Read political capital in its ordinary sense: usable influence through government access, alliances, and political support."
  - Read 'a few months ago' as approximately April 2025, with the comparison ending on July 15. Use April 1–July 15 to capture that comparison.
  - A substantial deterioration over weeks or months qualifies as rapid. No numerical political-capital index is invented.
  - Public favorability is one indicator, not the whole claim; leaving a time-limited government role alone would also be insufficient.
support_condition: Converging records show a substantial deterioration in Musk's government standing, key political alliances, or usable political support between approximately April and July 15, 2025.
contradiction_condition: Comparable records show that his government access, alliances, and usable political support remained broadly intact or strengthened, with no substantial decline over the stated period.
measurement_requirements: Dated government-role and alliance records, supplemented by comparable polling. Distinguish public perceptions from actual access and influence.
source_requirements: Prefer official transcripts and primary polling. Do not infer political influence from business valuation or media attention.
