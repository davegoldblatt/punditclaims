explicit_source_elements:
  - large language models
  - wicked hard to update
  - typically requiring full retraining
  - sometimes taking weeks or months
evaluator_interpretation:
  - Update means refreshing stored factual knowledge, as indicated by the surrounding comparison with databases and outdated information.
  - Full retraining ordinarily means a new comprehensive training run, rather than a targeted factual edit.
  - Typically concerns usual practice or requirements; one successful editing demonstration cannot establish what was usual.
  - The ongoing observation is assessed for December 1–30, 2022, the current month before publication. Earlier experiments provide context rather than direct measurements of December practice.
support_condition: Representative records show that factual updates to large language models usually required comprehensive retraining in December 2022, with documented update runs lasting weeks or months.
contradiction_condition: Representative records show that effective factual updates usually used incremental training or editing without comprehensive retraining, or otherwise directly refute the claimed typical requirement.
measurement_requirements: Distinguish initial pretraining from factual updates, targeted edits from broad refreshes, and experimental feasibility from routine deployment. Report actual update durations.
source_requirements: Contemporaneous training records, deployment documentation, or primary studies establishing the scope and prevalence of updating methods.
