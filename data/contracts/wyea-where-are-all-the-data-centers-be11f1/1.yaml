assessment_axis: historical_observation
explicit_source_elements:
  - about 18 to 24 months
  - any kind of data center
  - the bigger they are, the less likely they are to get completed on schedule
evaluator_interpretation:
  - Read as a general description of typical construction times, rather than an exceptionless minimum.
  - Measure construction from groundbreaking to operational readiness. Distinguish an operational phase from completion of an entire campus.
  - The contextual construction cycle runs from October 2023 through publication on May 12, 2026.
  - The size claim concerns missing originally announced completion dates. Longer construction times alone do not establish more schedule failures.
support_condition: Representative project records show typical construction lasting approximately 18–24 months across facility types, and lower on-time completion rates for larger projects.
contradiction_condition: Representative comparable records show typical durations materially outside that range, or show that larger projects do not have lower on-time completion rates.
measurement_requirements: Project size, facility type, groundbreaking date, original delivery deadline, actual operational date, and whether delivery covers a phase or the whole project. Include delayed and unfinished projects to avoid selecting only successful completions.
source_requirements: Industry datasets with disclosed methods, supported where possible by dated developer announcements and commissioning records.
