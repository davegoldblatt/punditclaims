original_horizon: null
horizon_interval: null
target_period:
  start: 2023-10-01
  end: 2026-05-12
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Typical duration versus a universal claim.
  - Groundbreaking, structural completion, energization, and operational readiness are different milestones.
  - Individual buildings, initial phases, and whole campuses may have different schedules.
  - No size measure or geographic sample is specified.
  - The observation period is inferred from the contextual project dates.
