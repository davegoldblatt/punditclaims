explicit_source_elements:
  - hype itself is becoming a kind of risk factor
  - The more hype, the bigger the fall
  - if expectations aren’t met
evaluator_interpretation:
  - In this post about an investment bubble, the ordinary reading of 'fall' is a decline in valuations or investment enthusiasm.
  - "I read the claim as a tendency: stronger prior hype magnifies the decline following a comparable disappointment."
  - The condition defines the circumstances of the causal claim. It is not a separate forecast that a disappointment must occur by a particular date.
  - The claim supplies no fixed observation window. Later research may test the proposed mechanism, but later market movements alone cannot establish it.
support_condition: Comparisons of generative AI investments show that greater prior hype produces larger declines after comparable expectation misses, accounting for other material causes.
contradiction_condition: Credible comparisons find no meaningful amplification, or a reversed relationship, with sufficient precision to reject the proposed tendency.
measurement_requirements: Measure hype before the disappointment, specify the expected and realized outcomes, and compare subsequent declines while accounting for fundamentals and market-wide changes.
source_requirements: Empirical studies or reproducible market data with a credible causal comparison. Warnings, anecdotes and simple correlations are insufficient on their own.
