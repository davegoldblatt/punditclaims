assessment_axis: historical_observation
explicit_source_elements:
  - It [OpenAI] cannot afford to pay anybody
  - nowhere is that more obvious
  - negotiated year-long payment terms for CoreWeave
evaluator_interpretation:
  - "Plain reading: at the time of the post, OpenAI lacked the means to pay its compute providers."
  - "'Afford' is read as having the funds available from any source (revenue or capital raised), not as covering costs from revenue alone. The narrower 'not from revenue' reading would make this a profitability claim, which is a separate claim in the post."
  - "Target period: the claim describes an ongoing state with no named period, so it uses calendar 2025 up to the post date (2025-01-01 to 2025-12-29), the latest period public evidence covers."
  - The year-long CoreWeave terms are offered as an illustration. The test is whether OpenAI could pay providers.
support_condition: Evidence that in 2025 OpenAI could not meet its compute bills, for example missed or deferred payments it could not fund, or cash too small to cover what it owed.
contradiction_condition: Evidence that in 2025 OpenAI actually paid large compute bills and had substantial cash or capital available to pay providers.
measurement_requirements: OpenAI's payments to compute providers in 2025 and its available cash or committed capital.
source_requirements: OpenAI financial statements as reported by reputable press, provider filings, reputable news on funding.
metric_scope:
