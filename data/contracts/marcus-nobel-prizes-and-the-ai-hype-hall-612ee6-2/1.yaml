assessment_axis: historical_observation
explicit_source_elements:
  - AI still can’t reliably
  - river-crossing problems
evaluator_interpretation:
  - In context, AI means contemporary general-purpose language and reasoning models, rather than every historical programmed puzzle solver.
  - Reliably means consistent success across varied, solvable river-crossing puzzles, including ordinary changes to familiar constraints. One failure or one success is insufficient.
  - Marcus supplies no numerical threshold, model list, prompting protocol, or tool policy; I do not invent a percentage cutoff.
  - For the ongoing observation, I use the current-year reporting window before the post, January 1 through March 9, 2025. This is an evaluator-selected period, not an explicit interval in his words.
  - Later evaluations are decisive only if they establish performance of the relevant model versions during that target period; otherwise they are context.
support_condition: Reproducible evaluations of leading models in the target period show recurring material failures across varied, solvable river-crossing tasks under clearly described, reasonable conditions.
contradiction_condition: Reproducible evaluations establish consistent success by leading contemporary models across a sufficiently varied river-crossing suite, rather than isolated familiar examples.
measurement_requirements: Model versions, test dates, exact prompts, tool access, puzzle solvability, repeated trials, and independently checked solutions. Aggregate scores on unrelated puzzles do not establish river-crossing reliability.
source_requirements: Primary evaluations or reproducible benchmark records tied to models and conditions in the target period.
