explicit_source_elements:
  - I think
  - Anthropic is outright misleading its investors
  - if it’s saying
  - only burn $11 billion in 2026 and 2027
  - per The Information
evaluator_interpretation:
  - Assess the allegation that the representation was materially misleading when made, rather than replacing it with a forecast that eventual cash burn exceeds $11 billion.
  - The allegation concerns representations made before the May 6 post about the 2026–2027 forecast. The target period covers those current-year representations through publication.
  - Read the amount as $11 billion in each year, while retaining the ambiguity between an annual amount and a combined two-year amount.
  - I think expresses the author's confidence; it does not remove the factual allegation.
  - A larger financing round or a subsequent forecast miss alone does not establish that an earlier projection misled investors.
support_condition: Investor communications and contemporaneous financial records show that the represented burn forecast materially understated reasonably expected cash needs or omitted material qualifications.
contradiction_condition: The actual investor communications and contemporaneous forecasts establish that the representation fairly described the expected cash burn, assumptions, and material risks.
measurement_requirements: Identify the cash-burn definition, annual versus combined scope, forecast version, investor audience, and assumptions known when communicated.
source_requirements: Investor materials and contemporaneous internal forecasts, preferably authenticated records or findings examining those records. Later results alone are insufficient.
