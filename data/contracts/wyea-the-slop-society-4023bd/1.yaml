assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI
  - burns $5 billion a year
evaluator_interpretation:
  - The ordinary financial meaning of 'burns' is net cash consumed, rather than gross spending or accounting losses.
  - Use calendar 2024, the latest completed annual period before publication.
  - Treat $5 billion as an approximately rounded annual figure.
  - The post links this assertion to an earlier article citing press estimates of 2024 losses. This establishes an estimate-based source, but leaves an important ambiguity between cash burn and losses.
support_condition: A sufficiently documented estimate of OpenAI's net cash consumed during calendar 2024 is approximately $5 billion, using a disclosed and consistent cash-flow definition.
contradiction_condition: A comparable estimate of calendar-2024 net cash consumption is materially outside approximately $5 billion.
measurement_requirements: A full-year cash-flow measure separating operations and investment from financing receipts, with any treatment of computing credits explained. Accounting losses cannot substitute without reconciliation.
source_requirements: Prefer financial statements or direct financial disclosures. Reputable reporting may establish an estimate if its metric and period are clear.
