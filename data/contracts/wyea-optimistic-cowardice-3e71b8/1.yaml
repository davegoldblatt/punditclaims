evaluator_interpretation:
  - The ordinary reading is that broad human-level general intelligence and capability had not been publicly demonstrated by publication.
  - This is not a claim that capable AI systems, general-purpose models or empirical AGI research did not exist.
  - Human-level means broad competence across unfamiliar cognitive and practical tasks, rather than superiority on isolated examinations.
  - The claim does not require consciousness, personhood or perfection on every task.
  - No reporting interval is specified. I use the current calendar quarter through publication, January 1–March 24, 2025, as the period for assessing the contemporary public state of evidence.
support_condition: Contemporaneous broad assessments and independent evaluations show substantial remaining gaps from general human capability, without a verified public demonstration meeting the ordinary reading.
contradiction_condition: A public, independently evaluated system had demonstrated broadly human-level general intelligence and capability by March 24, 2025. A narrow benchmark success or an unsupported AGI label is insufficient.
measurement_requirements: Assess breadth, transfer to unfamiliar tasks and reliable task completion against appropriate human comparisons. Do not require infallibility or equate one benchmark with AGI.
source_requirements: Contemporaneous scientific syntheses and independent capability evaluations, including serious claims that existing systems already qualified as AGI.
