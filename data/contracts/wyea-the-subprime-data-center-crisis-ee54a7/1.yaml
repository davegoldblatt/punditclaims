explicit_source_elements:
  - the vast majority
  - AI data center compute revenue
  - contingent on the continued ability
  - two unprofitable, unsustainable AI companies
  - to raise tens or hundreds of billions of dollars a year
  - 70% to 90% of that demand is from Anthropic and OpenAI
evaluator_interpretation:
  - The two companies are OpenAI and Anthropic, identified in the surrounding text.
  - The ordinary reading concerns realized revenue earned by AI compute providers, including hyperscalers and neoclouds, rather than model-company revenue or hardware sales.
  - The contextual 70%–90% estimate guides the meaning of vast majority; it is not treated as an independently established measurement.
  - Use January through March 2026, the latest completed quarter ordinarily reportable before the July post.
  - Dependence requires evidence that continuing compute purchases need external financing at the stated annual scale. A large funding round alone does not establish that requirement.
  - Unsustainable is read as unable to maintain the stated spending without outside funds, rather than certain eventual failure.
  - The accounting basis is estimate because the surrounding passage constructs an assumed sector-demand total rather than citing consolidated sector accounts.
support_condition: Comparable provider revenue data establish an overwhelming share attributable to OpenAI and Anthropic, and cash-flow evidence establishes dependence on recurring external financing of tens or hundreds of billions of dollars annually.
contradiction_condition: Comparable data establish a substantially smaller dependent revenue share, or establish that continuing the relevant purchases does not require external financing at the claimed scale.
measurement_requirements: A consistent sector denominator, attribution through intermediary providers without double counting, realized revenue, and both companies' cash flows, available cash and financing requirements.
source_requirements: Provider financial disclosures and customer concentration data, combined with reliable financial records for OpenAI and Anthropic. Funding announcements alone cannot settle the claim.
