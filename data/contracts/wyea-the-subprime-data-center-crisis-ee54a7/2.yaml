explicit_source_elements:
  - the vast majority of the AI data center compute revenue
  - is contingent on
  - the continued ability of two unprofitable, unsustainable AI companies
  - to raise tens or hundreds of billions of dollars a year
  - this is the quite literal situation
evaluator_interpretation:
  - "Plain reading: well over half (call it 70% or more) of the revenue that AI data center operators (hyperscalers and neoclouds) earn from AI compute comes, directly or indirectly, from OpenAI and Anthropic. Both companies fund that spending by raising outside capital rather than from their own cash flow."
  - "'Unsustainable' is a judgment and is not scored. 'Unprofitable' and reliance on outside fundraising are factual."
  - "Target period: he describes an ongoing state with no period named. The most recent period public evidence could cover before the 2026-07-22 post is used, from 2026-04-01 to the post date."
support_condition: Credible sector-wide data or company disclosures show that OpenAI and Anthropic account for the large majority of AI data center compute revenue across hyperscalers and neoclouds, and that both rely on outside fundraising to pay for it.
contradiction_condition: Credible data show that OpenAI and Anthropic account for well under a majority of AI compute revenue across providers, or that their compute spending is mostly paid from operating cash flow.
measurement_requirements: Share of AI data center compute revenue attributable to OpenAI and Anthropic across major providers, plus the two companies' funding sources for compute.
source_requirements: Company filings, provider disclosures of customer concentration, or reputable independent estimates covering the sector.
