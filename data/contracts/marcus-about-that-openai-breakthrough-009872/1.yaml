explicit_source_elements:
  - “breakthroughs” rarely turn to be general
  - live up to initial rosy expectations
  - Often advances work in some contexts, not otherwise.
evaluator_interpretation:
  - The ordinary reading is a historical frequency claim about publicly touted AI advances before the post.
  - Generality should be assessed against the initial expectations for each advance, not against an added requirement that every advance achieve general intelligence.
  - The retrospective period ends on the post date. The source supplies no starting date, population of breakthroughs, or numerical meaning for rarely.
support_condition: A reasonably representative historical comparison finds that meeting initially expected generality was uncommon and failures across contexts were common.
contradiction_condition: A comparable historical comparison finds that advances commonly met their initial expectations for generality.
measurement_requirements: Identify a representative population, record contemporary expectations, and compare subsequent performance across the contexts those expectations covered. Selected successes or failures cannot establish the frequency.
source_requirements: Original announcements paired with independent evaluations or a systematic historical review.
