assessment_axis: causal_assessment
explicit_source_elements:
  - GenAI uses a massive amount of power
  - to the point of keeping fossil fuels in vogue
  - that's good for oil-rich countries
  - even if GenAI never becomes reliable
evaluator_interpretation:
  - "Plain reading has two parts: (1) AI-driven electricity demand is sustaining fossil-fuel power, for example delaying coal or gas plant retirements or driving new gas plants; (2) this benefits oil-rich (fossil-exporting) countries."
  - The claim describes an ongoing state at the post date. I use the period from 2023 to the post date (2024-10-30), when the AI data-centre boom was visible in utility plans.
  - "'Even if GenAI never becomes reliable' is a hedge, not a condition to test."
support_condition: Evidence that AI data-centre demand was keeping fossil generation in use or expanding it, and that this benefits oil- or gas-exporting countries.
contradiction_condition: Evidence that AI power demand was met without sustaining fossil fuels, or that fossil exporters did not benefit.
measurement_requirements: Utility plans and energy-agency analysis linking data-centre demand to fossil generation; fossil-export demand or revenue linked to AI.
source_requirements: Energy agencies (IEA, EIA), utility filings, reputable reporting.
