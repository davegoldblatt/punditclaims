evaluator_interpretation:
  - Assess the four named companies individually, rather than an undefined wider class.
  - Never covers each company's history through publication, not merely its latest quarter.
  - The ordinary reading of company profitability is positive company-wide net income in a completed reporting period.
  - The post does not specify an accounting basis. None is inferred from the sources subsequently found.
  - The Anthropic exception is an additional historical assertion to verify, not an antecedent that suspends assessment.
  - The claimed subsidy requires evidence of a material economic concession, not merely a commercial relationship with a Musk company.
support_condition: Comparable historical records establish no profitable reporting period for the named companies except one Anthropic quarter, and substantiate material Musk-linked subsidies during that exception.
contradiction_condition: Comparable records establish another profitable reporting period, or establish that the asserted Anthropic exception is false on the specified measure. Scoring requires an identified accounting basis.
measurement_requirements: Distinguish net income, operating income, adjusted earnings and cash flow. Cover historical reporting periods and identify the alleged subsidy and its terms.
source_requirements: Company financial statements and subsidy agreements are preferred. Reliable financial reporting may supply otherwise private results, with its limitations stated.
