explicit_source_elements:
  - Based on Microsoft’s own disclosures
  - without Anthropic and OpenAI’s additions
  - RPO would have been effectively flat
  - in Q3FY26
evaluator_interpretation:
  - Read this as a sequential comparison beginning with FY2026 Q1, covering the additions discussed for Q2 and the subsequent Q3 balance. Do not substitute a year-over-year test.
  - Use Microsoft's named fiscal quarters. The context's parenthetical calendar-quarter labels are inconsistent with those fiscal periods.
  - Effectively flat means little material net change, not exact equality. The speaker supplies no numerical tolerance.
  - Removing additions requires their actual contribution to reported RPO, including any replacement of prior commitments, recognition of revenue, and other adjustments. Announced contract values are not automatically equal to additions to the quarter-end balance.
  - The exclusion is a scope adjustment, not a conditional forecast.
support_condition: A reconciliation of the quarter-end RPO balances shows little material sequential change after removing the actual RPO contributions of the identified OpenAI and Anthropic additions.
contradiction_condition: The same reconciliation shows a material residual sequential change inconsistent with an effectively flat balance.
measurement_requirements: Comparable commercial RPO balances at September 30, December 31, and March 31, with the identified contracts' net contributions reconciled on the same basis. A year-over-year figure excluding only OpenAI is insufficient.
source_requirements: Microsoft disclosures or a documented reconciliation grounded in them. Contract announcements alone cannot establish the counterfactual balances.
