evaluator_interpretation:
  - Read 'would' as a description of their research positions, not a conditional forecast.
  - Read 'pure prediction' as language prediction without grounded interaction, goals, or an adequate world model; neither speaker is rejecting all predictive learning.
  - Compare the prominence of the proposed ingredients in their stated research programs, without inventing numerical weights.
  - The context traces positions from 2019 to the September 2025 interview. Use that historical window to assess the positions described as continuing at publication.
support_condition: Their public positions emphasize world understanding and limits of language prediction alone, with Sutton centering reinforcement learning and Marcus centering neural-symbolic combinations and built-in structure.
contradiction_condition: Their public positions reject a material part of this comparison, such as Sutton endorsing language prediction alone or Marcus assigning reinforcement learning the greater central role.
measurement_requirements: Compare substantive statements about research priorities. Shared vocabulary alone is insufficient.
source_requirements: Original interviews or independently reported accounts of their positions. Statements establish what they advocate, not whether their technical views are correct.
