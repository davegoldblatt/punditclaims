assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI and Anthropic have become more expensive to run
  - OpenAI’s non-GAAP operating margin
  - from negative 122% to negative 183%
  - in Q2 2026
evaluator_interpretation:
  - Read 'increased' as an increase in the magnitude of the negative margin, meaning deterioration.
  - Use calendar Q2 2026 as the reported quarter and Q1 2026 as the immediately preceding comparison quarter.
  - Read 'more expensive to run' as rising total operating costs, not rising costs per customer or token.
  - For the ongoing cost claim, use Q2 2026, the latest completed quarter before the post, compared with Q1. The speaker does not explicitly specify this cost comparison.
  - The single metric_scope describes the precisely specified OpenAI margin. The separate cost claims concern two companies and do not specify a common accounting basis; evidence for them cannot substitute for the margin comparison.
support_condition: Comparable non-GAAP records show OpenAI's margin at approximately -122% in Q1 and -183% in Q2 2026, and comparable expense records establish rising operating costs for both labs.
contradiction_condition: Comparable records establish a materially different OpenAI non-GAAP margin or demonstrate that either lab's operating costs did not rise under the stated comparison.
measurement_requirements: Quarterly realized operating income divided by quarterly realized revenue, with identical non-GAAP exclusions across quarters. Cost trends require comparable expense definitions and periods.
source_requirements: Company statements or filings where available; otherwise reputable reporting identifying the financial measure and adjustments. Unadjusted operating losses cannot establish a non-GAAP margin.
