assessment_axis: historical_observation
explicit_source_elements:
  - LLMs are fully capable
  - make up truly terrible advice
  - this disconcerting recipe from last week
evaluator_interpretation:
  - "The ordinary reading is a capability claim: an LLM can generate seriously harmful advice. It does not say every model does this, or that such advice is common."
  - Advice recommending consumption of poisonous substances qualifies as truly terrible advice.
  - For the ongoing capability claim, the target is the current calendar month through publication, August 1–16, 2023. There is no standard reporting interval for this capability.
  - I read 'from last week' as identifying the recently reported example, rather than necessarily dating its original generation. Any difference between those dates must be disclosed.
  - An example elicited with deliberately dangerous ingredients still establishes capability, but does not establish spontaneous harmful advice during ordinary use.
support_condition: A documented LLM output in the target period recommends a materially dangerous action, with sufficient evidence to identify the system and the danger.
contradiction_condition: Reliable records show that the cited output was fabricated, was not generated by an LLM, or did not contain harmful advice, and the available evidence does not establish the claimed capability.
measurement_requirements: Identify the model or application, relevant user input, generated recommendation, and reason the recommendation is dangerous. Separate output dates from reporting dates.
source_requirements: Prefer original output records and operator documentation. Contemporaneous reporting reproducing the output and obtaining an operator response can establish the incident when an accessible original record is unavailable.
