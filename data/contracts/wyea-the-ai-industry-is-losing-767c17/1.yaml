explicit_source_elements:
  - Outside of OpenAI
  - Microsoft may as well not have an AI business
evaluator_interpretation:
  - The plain reading is that Microsoft lacks a commercially meaningful AI business beyond OpenAI as a paying customer.
  - The surrounding discussion of OpenAI's Azure spending supports excluding that customer, rather than excluding every Microsoft product that uses OpenAI technology.
  - Use Microsoft's fiscal third quarter ending March 31, 2026, its latest reported quarter before the post.
  - Assess commercial scale through paid adoption. Do not convert seats into revenue using undisclosed prices or infer profitability.
  - The exact claim asserts business significance rather than a particular monetary measure, so metric_scope is null.
support_condition: Evidence establishes that Microsoft's AI business beyond OpenAI consists only of negligible paid adoption or commercially insignificant activity.
contradiction_condition: Contemporaneous evidence establishes substantial paid adoption of Microsoft's AI products beyond OpenAI's own infrastructure purchases.
measurement_requirements: Distinguish paid product adoption from free users, demonstrations, bookings, and OpenAI's Azure spending. A few customer examples alone would not establish material scale.
source_requirements: Microsoft's dated commercial disclosures or independently verified customer and product records.
