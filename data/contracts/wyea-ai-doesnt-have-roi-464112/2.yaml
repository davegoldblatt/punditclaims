assessment_axis: not_applicable
explicit_source_elements:
  - nobody can actually measure the ROI of AI
  - or even create a standard measurement of the cost of a task
  - thanks to the inevitable hallucination-prone nature of LLMs
  - the ever-growing list of different harnesses and "agentic" interfaces
evaluator_interpretation:
  - In context, 'standard measurement of the cost of a task' means a per-task cost that holds across tools and harnesses and can be predicted in advance. It does not mean any one vendor's or benchmark's average.
  - "'Nobody can actually measure the ROI of AI' is an impossibility claim. It turns on what counts as a real ROI measurement, and the speaker gives no test for that."
  - The 'thanks to' clause gives a cause (hallucination and harness sprawl). No public evidence could isolate that cause from other reasons a standard is missing.
support_condition: Would be supported if there were no credible, accepted method for measuring AI ROI and no cross-harness standard for per-task cost, and if that gap could be shown to come from hallucination and harness sprawl.
contradiction_condition: Would be contradicted by a widely adopted, reproducible method for measuring AI ROI or a standard per-task cost that holds across harnesses and can be predicted.
measurement_requirements: Would need an accepted definition of what makes an ROI or cost measurement valid. The claim does not supply one.
source_requirements: Industry standards bodies, peer-reviewed ROI methods, or cross-vendor cost standards.
