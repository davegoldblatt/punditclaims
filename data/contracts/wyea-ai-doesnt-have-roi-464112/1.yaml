early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Standard measurement could mean a reproducible method or a universally adopted industry standard.
  - Cost could mean inference expenditure or all deployment costs, including human review and downstream errors.
  - Measuring realized expenditure differs from predicting every future task's cost.
