assessment_axis: causal_assessment
explicit_source_elements:
  - nobody can actually measure the ROI of AI
  - or even create a standard measurement of the cost of a task
  - thanks to the inevitable hallucination-prone nature of LLMs
  - the ever-growing list of different harnesses
evaluator_interpretation:
  - The plain reading is a claim of measurement impossibility, not merely difficulty or uncertain future costs.
  - A standard task-cost measurement means a reproducible accounting method for defined tasks, models and execution procedures. It need not produce the same cost for every task.
  - A credible counterexample to either asserted impossibility contradicts the combined universal claim. Measuring task costs alone does not establish business ROI.
  - The causal claim is evaluated using work available before publication.
support_condition: Evidence establishes that neither deployment ROI nor reproducible costs for defined tasks can be measured because of model errors and changing execution systems.
contradiction_condition: A credible study measures deployment costs and attributable returns, or demonstrates reproducible cost accounting for defined AI tasks while recording unsuccessful attempts.
measurement_requirements: Specify tasks, models, execution procedures, cost boundaries and treatment of failures. Distinguish measured expenditure from predicted expenditure, and task inference costs from complete deployment costs.
source_requirements: Primary research or documented deployment accounting available before 2026-06-02. Promotional ROI assertions without methods are insufficient.
