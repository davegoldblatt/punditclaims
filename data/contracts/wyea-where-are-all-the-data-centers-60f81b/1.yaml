assessment_axis: historical_observation
explicit_source_elements:
  - Hyperscalers
  - retrofitting old data centers
  - fit their new chips
  - no compelling evidence
  - more than a few hundred megawatts a piece
  - since 2023
evaluator_interpretation:
  - Assess the public evidence available by publication, not the private contents of Zitron's research.
  - Read since 2023 as January 1, 2023 through May 12, 2026. The cited capacity additions also fall after 2023, so the start-date ambiguity does not change the result.
  - The relevant major hyperscalers include AWS, Microsoft, and Google.
  - Retrofitting is a general practice claim, not an assertion that every facility was converted.
  - Added capacity means reported additions to available data center fleet capacity, including expansions and leased facilities. Future commitments and power-generation projects alone do not count.
  - No exact cutoff is assigned to a few hundred; multi-gigawatt additions plainly exceed it.
support_condition: Documented retrofits support the first component. A comprehensive review finding no credible per-provider additions clearly above a few hundred megawatts would support the second.
contradiction_condition: Credible pre-publication disclosures of realized gigawatt-scale additions by named hyperscalers contradict the claimed absence of compelling evidence. Planned additions alone do not.
measurement_requirements: Distinguish realized fleet additions from construction plans, power-purchase agreements, and ultimate campus capacity. Keep each provider's figures separate.
source_requirements: Dated operator disclosures, commissioning records, or independent facility measurements available by May 12, 2026.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2023-01-01
  end: 2026-05-12
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Few hundred is approximate.
  - Hyperscalers is not an enumerated company list.
  - Added capacity could mean fleet additions or only newly constructed greenfield facilities.
  - Power capacity is not identical to occupied IT load.
  - No compelling evidence includes a judgment about evidential quality.
retrospective_or_prospective: retrospective
