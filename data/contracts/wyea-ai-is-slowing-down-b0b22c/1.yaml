explicit_source_elements:
  - In a year
  - Anthropic and OpenAI’s businesses
  - roughly twice the size they are today
  - double again basically every year
  - until 2029 or 2030
evaluator_interpretation:
  - Read business size as revenue, following the surrounding discussion of revenue growth and compute commitments.
  - Assess each company separately using comparable revenue measurements around June 2026 and subsequent annual checkpoints.
  - The first checkpoint is June 8, 2027. Use December 31, 2030 as the latest possible endpoint.
  - This is a claim that approximately annual doubling is necessary to sustain commitments, not merely a prediction that doubling will happen.
  - The testable conditional antecedent is a material shortfall from that growth path while the relevant commitments remain.
  - No precise tolerance for roughly doubling or accounting basis is supplied.
support_condition: A material shortfall from approximately annual revenue doubling occurs and financial evidence shows that the resulting growth shortfall prevents the relevant commitments from being funded.
contradiction_condition: Either company materially misses the approximate doubling path yet demonstrably sustains its relevant commitments through adequate operating resources and financing.
measurement_requirements: Comparable revenue observations for both companies at the baseline and annual checkpoints, plus compute obligations, costs, liquidity, and financing. Do not substitute valuation, fundraising, or user counts for revenue.
source_requirements: Company financial disclosures and contractual records; reliable reporting may fill gaps in private-company disclosures.
