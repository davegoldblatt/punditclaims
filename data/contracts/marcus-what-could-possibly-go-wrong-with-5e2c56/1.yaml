explicit_source_elements:
  - a system that can write emails, make appointments, sign checks
  - the consequences of unreliability, discomprehension, and hallucination all escalate
evaluator_interpretation:
  - The ordinary reading is that executing an erroneous instruction can directly change external systems and cause harm beyond producing an erroneous answer.
  - This concerns the consequences of errors, not a claim that tool access necessarily increases error frequency.
  - The examples describe a class of action-taking systems; they do not require every listed action or every deployment to produce harm.
support_condition: Controlled demonstrations or documented incidents trace an agent error through an executed action to damage or disruption that an unexecuted advisory answer would not itself cause.
contradiction_condition: Comparative evidence shows that executing the relevant errors does not increase their consequences, including where the agent can change external systems.
measurement_requirements: Establish the chain from agent error to executed action to external consequence. Distinguish simulated harm, reproduced sandbox harm, and production incidents.
source_requirements: Primary experimental reports or first-party incident accounts with enough detail to identify the mechanism.
