assessment_axis: forecast_outcome
explicit_source_elements:
  - If capacity doesn’t come on fast enough
  - OpenAI and Anthropic
  - can’t pay for it
evaluator_interpretation:
  - The plain reading is that delayed compute availability prevents the labs from generating or obtaining enough money to meet their compute obligations.
  - A qualifying delay must be measured against the delivery schedule underlying the affected lab's obligations. General capacity shortages alone do not establish this condition.
  - The statement names both companies. Full support requires evidence for both; evidence concerning only one cannot establish the entire claim.
  - The surrounding discussion of 2027 spending does not supply a deadline for this particular conditional forecast.
support_condition: Verified capacity delays cause both labs to become unable to meet the affected compute payment obligations.
contradiction_condition: A qualifying delayed-capacity episode concludes with an affected lab demonstrably able to meet all associated obligations despite the delay, contradicting the claimed necessary inability to pay.
measurement_requirements: Original delivery schedules, actual availability dates, contractual payment triggers, amounts due, payments made, and evidence connecting any inability to pay to the delay.
source_requirements: Contracts, supplier disclosures, financial filings, court records, or reliable reporting based on those records. Risk warnings alone cannot establish an actual failure.
