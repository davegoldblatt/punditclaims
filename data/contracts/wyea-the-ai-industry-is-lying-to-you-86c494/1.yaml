assessment_axis: historical_observation
explicit_source_elements:
  - data center construction is dramatically slower than NVIDIA's GPU sales
  - GPU sales continue to accelerate dramatically every single quarter
  - "context: NVIDIA FY2026 (February 2025 to January 2026) data center revenue"
evaluator_interpretation:
  - The claim has two parts. (a) GPUs are being sold faster than data centers can be built to house them. (b) NVIDIA's GPU sales grew faster every quarter.
  - For (b), 'GPU sales' is read as NVIDIA's Data Center segment revenue and its compute (GPU) sub-line, the measure the speaker uses in his context. 'Accelerate every single quarter' is read as sales growing faster each quarter than the quarter before. Under a looser reading, sales at least rising every quarter, a quarter in which GPU compute sales fell would still contradict it.
  - For (a), credible statements from buyers or measurements showing purchased GPUs waiting on unbuilt or unpowered data center space count as support.
  - He names no period, so the target period is NVIDIA's fiscal 2026, the most recent full year of reports before the post, which he cites himself.
support_condition: NVIDIA's data center or GPU compute revenue rose faster each quarter of FY2026, and there is evidence that GPU purchases outran the data center space ready to house them.
contradiction_condition: NVIDIA's own figures show a FY2026 quarter in which GPU sales growth slowed or GPU compute revenue fell, and/or evidence shows data center construction keeping pace with GPU deliveries.
measurement_requirements: Quarterly NVIDIA Data Center revenue and compute revenue with sequential growth rates for FY2026. Statements from buyers or independent measures of GPUs left uninstalled for lack of space or power.
source_requirements: NVIDIA earnings releases or reliable reports of them. Buyer statements or independent capacity data for the construction comparison.
metric_scope:
  company: NVIDIA
  metric: Data Center segment revenue (and its compute sub-line) as a stand-in for GPU sales, measured by quarterly sequential growth
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: fiscal
  period_start: 2025-01-27
  period_end: 2026-01-25
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-02
  end: 2026-01
  precision: month
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Accelerate' could mean growth getting faster or just continued growth."
  - "'GPU sales' could mean total Data Center revenue or GPU compute revenue only."
  - "'Dramatically slower' has no measure; construction pace and GPU sales are in different units."
  - No period is named; NVIDIA FY2026 was chosen as the most recent full year reported before the post.
