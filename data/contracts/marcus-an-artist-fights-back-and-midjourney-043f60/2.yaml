explicit_source_elements:
  - Before the day was done
  - Midjourney retaliated
  - revoking Southen’s privileges
  - wiping his history
evaluator_interpretation:
  - The surrounding reference to yesterday identifies December 22, 2023. Both account actions must have occurred that calendar day, after Southen's demonstration.
  - Retaliated means Midjourney acted to punish Southen for exposing or publicizing the outputs. Sequence alone does not establish that motive.
  - Revoking privileges means withdrawing his ability to use Midjourney. Wiping history means removing his existing account history of prompts or generations, not merely blocking access to an otherwise retained history.
  - The claim does not require proof that every backup or independently saved screenshot was destroyed.
support_condition: Reliable evidence establishes that Midjourney revoked Southen's access and removed his account history on December 22, 2023, in punitive response to his demonstration. Responsive motive may be established by communications or sufficiently strong corroborated circumstances; an admission is not required.
contradiction_condition: Reliable evidence establishes that either action did not occur that day, that his history remained intact despite lost access, or that the actions were unrelated to punishing his demonstration. Missing evidence alone does not contradict the claim.
measurement_requirements: Establish the demonstration and both account actions with dates and, where necessary, timestamps in a consistent timezone. Distinguish history removal from loss of access, and assess evidence of motive separately from chronology.
source_requirements: Prefer Southen's contemporaneous records, enforcement notices, account records, and Midjourney communications. Reporting and firsthand testimony may contribute, but repeated versions of one allegation are not independent corroboration. Marcus's own writing cannot establish the outcome.
