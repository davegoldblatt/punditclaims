  - AI
  - will eventually work reliably
evaluator_interpretation:
  - In context, reliable AI means systems whose factual answers and reasoning can generally be trusted across varied tasks, including tasks involving retrieved information.
  - Success on a narrow task or improvement on one benchmark does not establish this broad outcome.
  - Marcus supplies neither a numerical error threshold nor a deadline. No numerical threshold is imposed.
  - The discussion of neurosymbolic AI is a possible route, not a condition attached to this forecast.
support_condition: Public, independently replicated evaluations demonstrate broadly trustworthy factual output and reasoning across varied tasks and realistic use, with rare material errors and appropriate abstention.
contradiction_condition: Decisive evidence establishes that broadly reliable AI cannot ever be achieved. Failures in existing systems or the passage of time cannot establish this.
measurement_requirements: Evaluate factual accuracy, reasoning, abstention, task coverage and robustness across independent tests and realistic use. Distinguish narrow benchmark success from broad reliability.
source_requirements: Independent evaluations with disclosed methods and reproducible results. Company demonstrations alone cannot establish broad reliability.
