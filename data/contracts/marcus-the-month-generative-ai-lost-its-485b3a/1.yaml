  - its bonds are doing badly
evaluator_interpretation:
  - The daily observation concerns June 26, 2026; the weekly observation concerns the week ending that day.
  - The ordinary weekly price comparison uses the preceding week's last trading close. Daily closing prices provide a reproducible check, but cannot establish the exact intraday snapshot Marcus saw.
  - Doing badly means falling secondary-market bond prices or widening credit spreads.
  - The AI description is a descriptive clause, not a conditional forecast antecedent.
  - These are investor market-price observations, not measurements of SpaceX's revenue, cash, accounting losses, or debt balance; metric_scope is therefore null.
support_condition: Matching market records show a small daily rise, a weekly decline rounding to 11.74%, and weakening bonds, alongside evidence of the AI investment framing.
contradiction_condition: Matching records show a materially different weekly decline, no small daily rise, or bonds strengthening rather than weakening. Separate supported and contradicted components warrant mixed.
measurement_requirements: Identify the security, trading venue, baseline, timestamp, and price-return convention. Do not substitute a decline from the IPO peak for the weekly return.
source_requirements: Exchange or established market-data records for shares; transaction data or reputable contemporaneous reporting for bonds and investment framing.
