assessment_axis: forecast_outcome
explicit_source_elements:
  - The idea, it would seem, is ... a little AI-powered gadget that you wear all the time, maybe like a necklace or pendant
  - A camera and microphone
  - You would be monitored all the time
  - Everything you say, everything you do ... recorded, but analyzed, interpreted and turned into data
  - which of course OpenAI train their models on
evaluator_interpretation:
  - "Read as a conditional forecast. Antecedent: OpenAI's io gadget turns out to be an always-worn device with a camera and microphone. Consequent: users are monitored continuously and OpenAI trains its models on the captured data."
  - Scoring needs the device to exist with that form, plus evidence about how it captures data and how that data is used.
support_condition: OpenAI releases an always-worn io device with a camera and microphone, and specs, independent testing or OpenAI's data-use terms show it captures users' speech and actions continuously and that the data is used to train OpenAI models.
contradiction_condition: Such a device is released, but it does not capture continuously (for example, it only listens on a wake word), or OpenAI does not use the data for training (for example, training is opt-in or excluded by default).
measurement_requirements: Released device specs; OpenAI privacy and data-use terms for the device; independent teardown or testing.
source_requirements: OpenAI product documentation and privacy policy; independent reviews or testing.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Can be scored only after OpenAI releases a device that meets the antecedent (always-worn, with camera and microphone) and its data practices are documented.
interpretation_determines_result: false
ambiguity_flags:
  - Marcus hedged the antecedent himself ('it would seem', 'maybe like a necklace').
  - "'Monitored all the time' could mean always recording or merely always available."
retrospective_or_prospective: retrospective
