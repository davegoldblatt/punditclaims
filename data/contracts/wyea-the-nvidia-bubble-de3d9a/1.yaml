assessment_axis: historical_observation
explicit_source_elements:
  - AI
  - it is not paying for itself
  - a continual drain on the debt markets and the venture capital industry
evaluator_interpretation:
  - The ordinary reading is that the AI industry collectively cannot cover its costs from customer business and repeatedly needs outside financing.
  - The surrounding discussion concerns the generative AI industry and its infrastructure. It does not establish that every individual AI company loses money.
  - For the ongoing financial state, use July–September 2026, the latest completed calendar quarter before publication. Earlier financing records can establish context for 'continual'.
  - Financing raised is not itself a loss. Expansion spending, operating costs, investment returns and cash flow must be distinguished.
  - No accounting basis or aggregate industry boundary is specified.
support_condition: Comparable industry-wide accounts show that customer receipts fail to cover costs and that recurring debt and venture financing fills the resulting funding gap.
contradiction_condition: Comparable accounts show that the industry covers its costs and investment needs from its AI business without the claimed recurring dependence on debt and venture financing.
measurement_requirements: An industry perimeter, consistent accounting treatment, revenue and cost totals, cash flows and financing flows. Eliminate transactions within the industry to avoid counting the same money repeatedly.
source_requirements: Company accounts and financing records, supplemented by a transparent aggregate study separating AI operations from unrelated businesses.
