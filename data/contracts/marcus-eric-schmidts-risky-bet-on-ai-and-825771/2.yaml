ambiguity_flags:
  - No activation criterion for 'isn’t magic'.
  - Risk warning and apparent prediction of actual harm are combined.
  - Environmental harm has no specified measure or system boundary.
  - "'Current harm' refers to the post's contemporary baseline without quantification."
  - "'Many' supplies no exact number of orders of magnitude."
  - No deadline or risk probability is supplied.
