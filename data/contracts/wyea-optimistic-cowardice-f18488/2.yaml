explicit_source_elements:
  - There's an honor system
  - honor systems often don't work when there's billions of dollars on the line
  - there's no real consequences for actually cheating
  - There's no accusation that OpenAI — or any other vendor — has done this, but it remains a possibility
evaluator_interpretation:
  - "The checkable core is two factual statements. First, vendor-reported scores on benchmarks like SimpleQA rest on trust: the vendor runs the test, the answers are public or available to it, and no independent check confirms it did not train on them. Second, no binding rule or penalty enforces against such cheating."
  - The line 'honor systems often don't work when billions are on the line' is a general maxim, not a fact about AI. It is not scored on its own.
  - Zitron explicitly makes no accusation of actual cheating. So support does not require any documented case of cheating.
  - "Target period: from SimpleQA's public release (October 2024) to the post date (2025-03-24). This is the state of benchmark practice he describes in the present tense."
support_condition: Sources from the target period show benchmark results that vendors run themselves, on test sets they can see, with only informal or no safeguards against training on the test (for example, an unwritten agreement and no independent check).
contradiction_condition: Sources show that during the target period major vendor benchmark results were subject to binding independent audits, enforceable rules, or penalties against training on test data.
measurement_requirements: "Look at how benchmark results were produced and safeguarded: who ran the test, who had access to the answers, and what enforcement existed."
source_requirements: Benchmark publisher documentation, or reputable reporting that quotes the benchmark makers.
