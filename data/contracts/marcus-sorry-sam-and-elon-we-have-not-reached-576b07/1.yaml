evaluator_interpretation:
  - Assess the objective capability count, rather than merely whether Marcus held this opinion.
  - Current means capability as of July 28, 2026. This is an instantaneous capability claim, so the target is the publication day rather than a financial reporting period.
  - "Use the original task-specific standards: film understanding, novel understanding, sourced biographies and obituaries, learning unfamiliar games, legal briefs, reliable large-program construction, exceptional books, exceptional screenplays, major scientific discoveries, and mathematical proof formalization."
  - Preserve the bet's reliability, assistance, generality and resource restrictions. Do not substitute an ordinary benchmark pass for completion of a task.
  - The original tasks have different human comparison levels; do not impose a best-human threshold on every task.
support_condition: A sufficiently comprehensive assessment of systems available by the post establishes that no more than two tasks meet their original criteria. Missing demonstrations alone do not establish inability.
contradiction_condition: Verifiable results establish that systems available by the post meet at least three of the ten original task criteria.
measurement_requirements: Task-by-task evaluations identifying system versions, assistance, resources, reliability and contamination controls. Three established passes suffice for contradiction; support requires evidence bounding the total at two.
source_requirements: Original bet for definitions only; independent evaluations, reproducible demonstrations or a documented adjudication for capability.
