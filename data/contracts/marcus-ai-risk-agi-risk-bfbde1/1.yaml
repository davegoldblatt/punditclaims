  - Controls could mean their number, effectiveness, coverage, or enforceability.
  - Current AI does not specify a population of systems.
  - The March 2023 reporting window is evaluator-selected for an undated ongoing state.
  - The TaskRabbit example involved supervised pre-release testing, making its relevance to deployed safeguards uncertain.
