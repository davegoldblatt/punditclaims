explicit_source_elements:
  - we don’t have tons of controls over current AI
  - especially now that people can hook them up to TaskRabbit and real-world software APIs
evaluator_interpretation:
  - In context, current AI primarily means contemporary LLMs and their external integrations.
  - The ordinary reading concerns limited effective safeguards over harmful behavior and external actions, rather than a literal count of controls.
  - "Use March 1–28, 2023 as the current-state reporting window: the latest public documentation available during the month of the post. This is an evaluator-selected snapshot because Marcus supplies no reporting period."
  - TaskRabbit and APIs illustrate the concern; especially is not a condition that must occur after the post.
  - An isolated bypass is insufficient to establish the broad claim, and an isolated safeguard is insufficient to refute it.
support_condition: Representative contemporary documentation and testing show that safeguards governing LLM behavior and external actions were broadly limited or readily bypassed in consequential ways.
contradiction_condition: Representative contemporary documentation and testing show that effective safeguards broadly constrained the relevant harmful behavior and external actions.
measurement_requirements: Assess safeguard coverage and effectiveness across relevant systems. Distinguish model refusals, application permissions, network restrictions, human supervision, and external-service controls.
source_requirements: Prefer dated launch documentation and original evaluations. Distinguish controlled pre-release demonstrations from ordinary deployed access.
