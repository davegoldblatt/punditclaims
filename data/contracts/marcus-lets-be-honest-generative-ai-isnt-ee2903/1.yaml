evaluator_interpretation:
  - The plain reading is that a substantial share of ordinary LLM performance primarily reproduces learned examples rather than generalizing to new cases.
  - Demonstrating that models memorize some material is insufficient to establish the claimed share of their overall activity.
  - The Hinton clause requires an identifiable statement by Hinton that conflicts with the relevant empirical finding.
  - For the ongoing state of LLMs, use the latest completed quarter before publication, October–December 2025. Earlier studies are context.
support_condition: Representative studies separate memorization from generalization and show that memorization primarily explains a substantial share of ordinary LLM performance, while a verified Hinton statement disputes that same proposition.
contradiction_condition: Representative studies show that the claimed substantial dependence on memorization is absent, or a verified record establishes that the position attributed to Hinton is materially inaccurate.
measurement_requirements: Define the sampled tasks and denominator, distinguish verbatim extraction from ordinary generation, and test performance on genuinely novel or controlled examples.
source_requirements: Original research with disclosed methods, plus a primary record of the specific Hinton statement.
