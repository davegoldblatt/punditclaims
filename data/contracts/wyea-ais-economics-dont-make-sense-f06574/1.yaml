explicit_source_elements:
  - OpenAI or Anthropic
  - both of them had worse margins than expected
  - margins strip out training costs
  - nobody can explain to me how
  - stories that have both of them becoming profitable by 2028 or 2029
evaluator_interpretation:
  - The checkable financial core is whether both companies' 2025 gross margins disappointed earlier expectations on the same basis, excluding model-training costs.
  - I use 2025 because the cited margin discussion concerns the latest completed annual reporting cycle, rather than future profitability.
  - The 2028 and 2029 dates describe other people's projections, not Zitron's forecast deadline.
  - The personal statement about explanations he has received cannot be independently verified. It is not converted into a claim that profitability is impossible.
  - Press-derived financial figures are assessed as estimates, not as declared GAAP results.
support_condition: Comparable reports establish that both companies' 2025 gross margins excluding training costs were below their earlier forecasts.
contradiction_condition: Comparable records establish that either company's 2025 margin met or exceeded its earlier forecast, or that the apparent shortfall disappears when the accounting definitions are matched.
measurement_requirements: For each company, the earlier forecast, the subsequent result or retrospective estimate, and matching treatment of training, free users, partner payments, and revenue.
source_requirements: Prefer financial statements and dated internal forecasts. Document-based reporting is acceptable where the underlying private records are unavailable.
