assessment_axis: causal_assessment
explicit_source_elements:
  - $1.3 trillion in compute commitments
  - Anthropic and OpenAI
  - have created a distortion
  - demand for AI compute
  - massive amounts of capital
evaluator_interpretation:
  - Read the amount as approximately USD 1.3 trillion of combined outstanding compute commitments accumulated by the post date, not annual spending or realized revenue.
  - Read distortion as apparent demand materially exceeding credible funded future usage because of the labs' commitments.
  - Future delivery and a gap between current usage and multiyear commitments do not alone establish distortion.
  - The target is the accumulated position through September 22, 2026; no starting date for the commitments is supplied.
  - The claim supplies no source or accounting basis for the aggregate.
support_condition: A reconciliation of distinct outstanding compute obligations establishes approximately USD 1.3 trillion by publication, and contract, financing, usage, or market evidence shows that these commitments materially inflate apparent demand beyond credible future usage.
contradiction_condition: A complete comparable reconciliation materially conflicts with the stated aggregate, or evidence establishes that the commitments reflect credible funded future usage and do not produce the claimed demand distortion.
measurement_requirements: Distinguish binding minimum obligations from options, announced plans, financing, equipment purchases, and provider backlogs. Avoid counting the same capacity through multiple intermediaries. Compare obligations and usage over matching delivery periods.
source_requirements: Contracts or filings with obligation schedules and conditions, financing records, usage evidence, and a reproducible reconciliation. Analyst estimates can provide context but do not establish causation.
