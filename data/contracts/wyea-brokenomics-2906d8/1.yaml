explicit_source_elements:
  - stopping training
  - turn these businesses profitable
  - they’d have done it already
  - inference would be a money-printer
evaluator_interpretation:
  - The testable financial reading is that removing training expenses alone would leave OpenAI and Anthropic unprofitable.
  - Hold contemporaneous revenue and non-training expenses constant. This does not assume that future revenue would survive indefinitely without new models.
  - Profitable refers to the whole business after remaining expenses, not merely a positive inference gross margin.
  - Use January through March 2026, the latest completed calendar quarter that evidence could report before the June 15 post. The post names no accounting period.
  - The claim does not specify an accounting basis. It remains unknown; strong financial scoring is therefore unavailable under the stated rules.
  - The assertion about what management would already have chosen is an argument, not independent evidence of the counterfactual financial result.
support_condition: Comparable records for each company show a loss after removing only training expenses while retaining all other relevant expenses.
contradiction_condition: Comparable records show that removing training expenses alone would produce a profit for either named company, with any difference between the companies reported explicitly.
measurement_requirements: Revenue, total expenses, separately identified training expenses, and remaining expenses for the same quarter and accounting basis. Cash burn, operating loss, net loss, and gross margin must remain distinct.
source_requirements: Company financial records are preferred. Reporting on private records must identify its basis and cannot substitute research-and-development spending for training alone.
