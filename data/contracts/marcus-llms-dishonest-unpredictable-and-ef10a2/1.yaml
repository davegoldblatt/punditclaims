evaluator_interpretation:
  - In context, control means reliably enforcing operators' safety instructions, including under adversarial or conflicting-goal conditions.
  - The ordinary contextual reading is imperfect dependable control, rather than a claim that prompts, safeguards, access restrictions, and shutdown mechanisms have no effect.
  - Thus far makes this a cumulative observation ending at publication. Later improvements cannot retrospectively settle it.
support_condition: Evaluations available by publication document consequential violations of explicit safety instructions across contemporary LLMs under relevant stress conditions.
contradiction_condition: Evidence establishes dependable enforcement of the relevant safety instructions under comparable stress conditions and shows the alleged violations to be invalid. Merely reducing failures does not establish dependable enforcement.
measurement_requirements: Identify tested models, instructions, failure behavior, and whether safeguards reduce or eliminate failures. Do not extrapolate stress-test frequencies to ordinary deployment.
source_requirements: Original evaluations with documented methods and explicit discussion of safeguards and limitations.
