assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA’s overall data center segment revenue was $195.7 billion
  - America’s data center purchases at around $135 billion
  - around $44 billion of GPUs and associated technology uninstalled
  - FY2026
evaluator_interpretation:
  - Assess the estimated sales value of NVIDIA GPUs and associated hardware purchased for US deployment during FY2026 that remained uninstalled.
  - Use the completed FY2026 sales cohort and fiscal-year-end installation status as the reporting baseline. The source does not clearly distinguish year-end status from status at the post date.
  - FY2026 is interpreted as NVIDIA's actual fiscal year, January 27, 2025 through January 25, 2026, rather than the surrounding text's approximate February-to-January description.
  - The uninstalled balance is an estimate combining reported revenue with an analyst hardware-cost assumption. It is not a company-reported inventory balance.
  - An error in an input or an invalid inference does not alone prove the estimated uninstalled balance false.
support_condition: Matched sales, destination and installation records establish approximately USD 44 billion at original sales value of the FY2026 US-deployment cohort remaining uninstalled at the reporting baseline.
contradiction_condition: Comparable records establish a materially different uninstalled balance, beyond ordinary estimation uncertainty.
measurement_requirements: Match hardware sales to US deployment destinations and installation dates. Reconcile the fiscal sales period with installation activity, equipment installed in existing facilities, non-NVIDIA equipment costs and the distinction between customer headquarters and shipment destination.
source_requirements: NVIDIA and customer shipment, inventory or deployment disclosures, or an independently documented reconciliation of the same sales cohort. Aggregate revenue and data-center absorption alone are insufficient.
