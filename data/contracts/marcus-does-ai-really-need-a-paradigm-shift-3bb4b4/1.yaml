explicit_source_elements:
  - whenever AGI comes
  - an explicit type/token distinction
  - will be crucial
  - tied not to time but to architecture
evaluator_interpretation:
  - Treat arrival as a demonstrated system with broadly accepted human-level general cognitive capability. Broad acceptance is an evaluator safeguard.
  - Read type/token distinction as an explicit separation between a general kind or category and particular instances of it.
  - Language-model tokenization alone does not establish this distinction in the system's reasoning.
  - Read crucial as central dependence supported by component tests or equivalent evidence.
  - Test the first broadly accepted AGI; dependence in that system would support the arrival prediction without proving universal necessity.
support_condition: The AGI condition is established, and technical evidence shows an explicit kind-versus-instance representation whose removal substantially undermines the arriving system's general capability.
contradiction_condition: The AGI condition is established, and complete architectural evidence or controlled tests show that the system achieves general capability without an explicit type/token distinction.
measurement_requirements: Broad capability evaluations, inspection of representations distinguishing kinds from individuals, and interventions establishing whether the distinction is central.
source_requirements: Public architectural or mechanistic documentation and independent capability assessments available by 2026-10-28. Token identifiers and benchmark scores alone are insufficient.
