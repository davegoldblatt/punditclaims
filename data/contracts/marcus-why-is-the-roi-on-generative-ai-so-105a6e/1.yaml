assessment_axis: forecast_outcome
explicit_source_elements:
  - you’d never be able to trust
  - the output of GenAI
evaluator_interpretation:
  - Read as a continuing prediction about generative AI reliability, rather than a claim about whether Marcus previously said these words.
  - The plain reading is that users will never be able to rely on generative AI output in ordinary factual and professional work without routinely checking its correctness.
  - Trust means practical reliability appropriate to the task, not mathematical perfection on every possible input.
  - Marcus supplies neither a numerical reliability threshold nor a deadline. No numerical cutoff is attributed to him.
support_condition: A conclusive demonstration that generative AI cannot attain practical reliability under this reading, with assumptions covering the claimed technology and uses. Continuing errors in existing systems alone cannot establish 'never'.
contradiction_condition: A dated, independently replicated demonstration that generative AI output can reliably be used without routine external verification across representative factual and professional tasks, with useful answer coverage and errors appropriate to those tasks.
measurement_requirements: Measure correctness, serious errors, abstention and answer coverage together. Use representative tasks, independently checked answers and tests beyond a single narrow benchmark. Explain why the measured reliability permits reliance without routine verification.
source_requirements: Primary research or documented evaluations available by 2026-10-28. A decisive practical demonstration requires independent replication; a theoretical impossibility result must apply beyond restricted training assumptions.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted upon a dated demonstration meeting the contradiction condition, or as supported upon a conclusive impossibility result meeting the support condition. Isolated successes, narrow benchmark saturation and continuing failures do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Trust has no stated error tolerance or verification standard.
  - The scope could mean general reliability or reliability in any particular use.
  - The wording does not distinguish standalone generators from systems using retrieval, tools or checks.
  - Never supplies no finite deadline.
