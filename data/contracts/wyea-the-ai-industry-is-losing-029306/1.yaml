explicit_source_elements:
  - AI does not do what you have been promised it does
evaluator_interpretation:
  - Assess the normalized proposition about capability delivery. The separate assertion about enthusiasts' motives is outside this listed proposition.
  - In context, the ordinary reading concerns agents doing useful tech work reliably with substantially less continuous prompting and supervision.
  - This is not interpreted as claiming that AI performs no useful tasks.
  - Use May 2026, the latest completed month before the June 30 post, for the ongoing capability observation. Earlier promises may provide context, but performance evidence must describe this period.
  - No particular product, promise, task distribution, or acceptable failure rate is supplied.
support_condition: A representative comparison of public promises with reproducible May 2026 performance shows a material failure to deliver the advertised autonomy and reduction in human effort.
contradiction_condition: Comparable evidence shows that the advertised autonomy and reduction in human effort were generally delivered under the promised conditions.
measurement_requirements: Match specific promises to product versions, tasks, operating conditions, success rates, human intervention, and net human time. Output volume alone is insufficient.
source_requirements: Dated public promises and reproducible performance evaluations; company measurements require clear limitations and preferably independent replication.
