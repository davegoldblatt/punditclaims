evaluator_interpretation:
  - "'These large customers' refers to the five largest customers in the immediately preceding sentence."
  - The ranking concerns revenue during January–September 2026. The usage reports and June statement are assessed through the post date.
  - "'Reported to reduce' requires credible contemporaneous reporting of reduced use or efforts to reduce it; a desire to reduce spending is not proof that all spending fell."
  - Internal employee use is distinguished from customer consumption distributed through Microsoft products.
support_condition: Evidence identifies both Meta and Microsoft among Anthropic’s top five revenue customers for January–September 2026, documents reports of both reducing use, and confirms Suleyman’s June statement.
contradiction_condition: Reliable evidence excludes either company from the relevant top five or directly refutes a claimed usage report or the attributed June statement.
measurement_requirements: Match the customer ranking to the nine-month period. Keep internal usage, resale or distribution, spending targets and realized spending separate.
source_requirements: Customer concentration disclosures identifying the companies, plus company statements or credible contemporaneous reporting about usage reductions and Suleyman’s remarks.
