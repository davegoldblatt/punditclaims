assessment_axis: causal_assessment
explicit_source_elements:
  - every user loses you money
  - in generative AI
  - because
  - impossible to do cost control in a consistent manner
evaluator_interpretation:
  - The ordinary reading is a universal claim about user-level economics, including paying users, rather than a claim that providers have company-wide net losses.
  - The surrounding discussion suggests comparing revenue from a user with the cost of serving that user. It does not specify a consistent accounting basis or allocation of shared expenses.
  - The causal assertion concerns capabilities existing at publication. Later improvements would not by themselves disprove it.
support_condition: Comparable user-level records establish losses across the claimed population, and operational evidence shows that unavoidable failures of cost controls cause those losses.
contradiction_condition: Verified user-level records establish a profitable counterexample on the specified accounting basis, or operational evidence disproves the asserted architectural impossibility of consistent cost control.
measurement_requirements: Match realized user revenue to actual serving costs over the same billing period. Separate API retail prices from provider costs and company-wide losses from user-level contribution.
source_requirements: Provider records or independently validated measurements of user-level economics and enforced cost controls. Estimates must disclose their assumptions.
