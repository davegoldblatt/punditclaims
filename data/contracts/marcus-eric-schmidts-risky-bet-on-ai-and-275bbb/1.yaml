evaluator_interpretation:
  - Read 'here to say' as the apparent typo 'here to stay'.
  - The main historical assertion is that the named harmful uses were established by October 5, 2024; 'already' makes the lookback cumulative.
  - Read 'here to stay' as established and persistent, rather than literally impossible ever to eliminate.
  - Preserve the additional comparison about inherent reasoning requirements. Case reports alone cannot establish that comparison.
  - The comparison appears to concern the beneficial scientific applications discussed immediately before this sentence.
support_condition: Reliable records establish the named harmful uses by publication and evidence supports their persistence and the stated comparison in reasoning requirements.
contradiction_condition: Reliable evidence refutes a material named occurrence or shows that the claimed inherent reasoning comparison is false. Failure to find reports alone is insufficient.
measurement_requirements: Distinguish verified AI use from suspected impersonation, measure recurrence separately from isolated incidents, and define comparable reasoning requirements for harmful and beneficial tasks.
source_requirements: Prefer investigations, original testimony and technical studies. Clearly identify allegations and secondary accounts when direct verification is unavailable.
