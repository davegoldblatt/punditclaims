assessment_axis: causal_assessment
explicit_source_elements:
  - demand for AI chips
  - far more a result
  - NVIDIA’s deliberate channel stuffing
  - antagonistic approach to doing business
  - than ... how many chips the world needs right now
evaluator_interpretation:
  - The ordinary reading is that NVIDIA deliberately induces purchases or early acceptance beyond immediate operational requirements, and that this explains substantially more apparent chip demand than current workloads do.
  - No numerical margin is supplied for 'far more'; none is invented.
  - The scope is the current AI chip market described on October 20, 2026, not historical cryptocurrency-related allegations.
  - Early delivery, financing support and idle equipment are relevant mechanisms, but none alone establishes deliberate channel stuffing or its comparative importance.
support_condition: Contracts, communications or credible findings establish deliberate NVIDIA pressure causing excess purchases or early acceptance, and a market-level causal comparison shows its effect substantially exceeds demand from current operational needs.
contradiction_condition: Credible causal evidence establishes that current operational needs explain at least as much demand as the alleged pressure, or directly refutes the alleged mechanism across the relevant market.
measurement_requirements: Connect ordering and delivery terms to actual deployments and workloads; distinguish voluntary advance procurement from supplier-induced excess; estimate the relative contributions of competing causes.
source_requirements: Customer contracts, authenticated communications, deployment and utilization records, or an independent investigation with causal evidence. Sales growth and inventory alone are insufficient.
