explicit_source_elements:
  - Our new systems work better
  - still superficial
  - fine for lab demos
  - often at a loss in the real world
evaluator_interpretation:
  - The plain reading is improved apparent capability alongside recurring material failures in ordinary deployment. Superficial is read as unreliable performance, not a separately testable claim about consciousness or understanding.
  - The surrounding discussion primarily concerns contemporary generative AI, but does not identify a fixed model population.
  - Often means recurring failures, not universal failure or failure on most tasks.
  - Use January 2023, the latest complete month before the post, for the ongoing deployment claim. Earlier evaluations provide context for the conceded improvement.
  - A full assessment requires enough evidence to connect demonstrated capability with deployment performance beyond one selected product.
support_condition: Contemporary deployment records and comparative evaluations show improved capabilities but recurring material failures across ordinary uses of the systems under discussion.
contradiction_condition: Broad, comparable deployment evidence shows dependable performance on those ordinary uses, with failures sufficiently unusual to conflict with the claim of recurring practical unreliability.
measurement_requirements: Identify model versions, tasks, material errors and opportunities to succeed. Distinguish laboratory evaluations, actual deployment, human editing failures and model failures.
source_requirements: Prefer deployment audits, original evaluations and first-party incident records. Include evidence of useful performance without treating usefulness alone as a contradiction.
