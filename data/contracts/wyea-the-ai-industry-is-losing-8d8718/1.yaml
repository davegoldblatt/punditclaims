assessment_axis: forecast_outcome
explicit_source_elements:
  - at least $2 trillion
  - brand new revenue
  - by 2030
  - if it doesn’t
  - effectively all of that capex
  - prop up Anthropic, OpenAI
evaluator_interpretation:
  - This is a conditional economic-necessity claim, not a prediction that $2 trillion will actually be earned.
  - The ordinary reading is that the named hyperscalers need substantial new realized AI-related revenue by the end of 2030 to obtain benefits beyond sustaining the named AI businesses.
  - An annual revenue level reached by 2030 is a plausible working reading, but cumulative revenue is also possible. The post does not supply a baseline for new revenue.
  - The consequence requires evidence about the actual beneficiaries and economically material uses of the infrastructure. Missing the revenue threshold alone cannot establish it.
  - The shortfall condition cannot be established merely because the threshold has not been reached in 2026.
support_condition: At the deadline, comparable new revenue falls below the stated threshold and evidence shows that effectively all relevant capex benefits were confined to sustaining Anthropic, OpenAI and Meta's chatbot operations.
contradiction_condition: Despite a qualifying revenue shortfall, the relevant capex demonstrably produces substantial durable economic benefits beyond those named uses. Reaching the threshold alone would leave the conditional consequence untriggered.
measurement_requirements: Specify the company set, revenue baseline, annual versus cumulative measurement, attribution to AI investment, and treatment of transactions between participants. Measure realized revenue and infrastructure benefits separately.
source_requirements: Company revenue disclosures and independently assessable evidence of infrastructure utilization, customers, returns and beneficiaries through the deadline.
