assessment_axis: causal_assessment
explicit_source_elements:
  - such a superficial understanding of their own output
  - that they can’t begin to fact check it
evaluator_interpretation:
  - The ordinary reading of can’t begin is absence of meaningful self-fact-checking ability, rather than merely imperfect reliability.
  - Self-fact-checking means identifying the truth or falsity of factual claims generated by the same model, assessed against independent human judgments.
  - Prompting a model to assess its generated claims qualifies. A separate search engine or trained detector is an additional component and must be identified.
  - The alleged superficial understanding is a causal explanation, not something established simply by observing errors.
  - Use the current year's pre-publication reporting window, 2025-01-01 through 2025-05-05.
support_condition: Controlled evaluations show no meaningful ability to distinguish correct from incorrect self-generated factual claims, and evidence connects that inability to the alleged representational deficit.
contradiction_condition: Controlled evaluations demonstrate meaningful identification of errors in the same model’s factual outputs. Such evidence contradicts the asserted inability without proving comprehensive understanding or dependable autonomous verification.
measurement_requirements: Separate self-evaluation from evaluation of other models; report correct error detection, false judgments, abstentions, external evidence, and independent ground truth.
source_requirements: Primary controlled self-fact-checking evaluations and, for the explanation, studies testing the proposed causal mechanism.
