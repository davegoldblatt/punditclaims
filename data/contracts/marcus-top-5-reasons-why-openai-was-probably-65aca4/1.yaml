explicit_source_elements:
  - OpenAI’s strength has been in scaling up an existing paradigm
  - Transformers
  - developed elsewhere (Google)
  - not developing new paradigms
evaluator_interpretation:
  - The plain reading concerns the architectural foundation of OpenAI's principal GPT advances through publication.
  - Scaling includes increasing model size and developing the training infrastructure needed to make larger models effective.
  - New paradigm means a replacement for the underlying Transformer approach. This is not read as denying every OpenAI contribution to training, alignment, or engineering.
support_condition: Primary model histories establish the Transformer's Google origins and show that major GPT advances retained that architecture, with scaling central to their progress.
contradiction_condition: The principal GPT advances instead relied on a fundamentally different architecture originated by OpenAI, or the Transformer did not originate in the cited Google research.
measurement_requirements: Compare published model architectures and stated contributions. Distinguish architectural replacement from improvements to training and post-training.
source_requirements: The original Transformer paper and OpenAI's model papers, including evidence of contributions beyond scaling.
