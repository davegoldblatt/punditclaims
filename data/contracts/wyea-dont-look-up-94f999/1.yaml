evaluator_interpretation:
  - Following the normalized proposition, assess the loss forecast for OpenAI and Anthropic separately. The separate assertion about the number of compute buyers is outside this claim.
  - This year means calendar 2026 and next year means calendar 2027.
  - Read lose as annual net loss, rather than cash burn or operating loss.
  - Read tens of billions as at least $20 billion for each company in 2026, and more as a larger annual loss for each company in 2027.
  - No accounting basis is supplied. Retain unknown; do not silently substitute GAAP, adjusted losses or cash burn.
support_condition: Each company reports a comparable annual net loss of at least $20 billion for 2026 and a larger annual net loss for 2027.
contradiction_condition: Final comparable results show that at least one company fails either its 2026 minimum or its 2027 increase.
measurement_requirements: Separate annual net losses for each company and year, with consistent accounting treatment. Interim losses and projections cannot substitute for final annual results.
