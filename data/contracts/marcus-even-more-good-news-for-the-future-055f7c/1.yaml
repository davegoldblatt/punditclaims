assessment_axis: historical_observation
explicit_source_elements:
  - What the Apple paper shows
  - LLMs are no substitute
  - good well-specified conventional algorithms
evaluator_interpretation:
  - The plain reading is that LLM-generated answers cannot generally replace reliable execution of specified algorithms when correctness matters.
  - The statement explicitly describes what the Apple study demonstrated. The target period is its June 2025 reporting period, rather than all subsequent model development.
  - Writing or calling conventional software is different from replacing its execution with model-generated steps.
  - This does not mean that LLMs cannot solve any algorithmic problem.
support_condition: The study documents systematic failures to execute specified, solvable algorithms correctly as task size increases.
contradiction_condition: Comparable evaluations show the tested models reliably executing the specified algorithms across the tested sizes, or establish that the reported failures disappear after correcting material experimental errors.
measurement_requirements: Check complete solutions against task rules. Distinguish direct generation, executable code, external solvers, and systems with error correction.
source_requirements: The original study and primary replication or correction studies. Later systems can qualify generalizations but cannot change the original experimental results.
