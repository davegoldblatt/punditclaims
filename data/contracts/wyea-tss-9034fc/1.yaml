  - Already
  - AI developers become less discerning
  - the training data they use
  - unverified social media posts
  - satirical news sites
  - other AI-generated content
evaluator_interpretation:
  - The plain reading is a deterioration in training-data selection standards, not simply the presence of imperfect material.
  - I use the first half of 2024 as the latest complete pre-publication observation window. The claimed change requires comparison with earlier practices.
  - Information retrieved while answering a search query is not necessarily training data.
  - Deliberately generated and screened synthetic training data does not by itself demonstrate reduced discernment.
support_condition: Comparable dataset audits or documented policy changes show developers relaxing training-data selection standards by the first half of 2024.
contradiction_condition: Comparable evidence across the relevant developers shows that selection standards remained stable or became stricter, contradicting the alleged deterioration.
measurement_requirements: Distinguish training from retrieval, and compare selection standards or measured data quality over time.
source_requirements: Dated dataset documentation, audits, or documented developer practices. Output mistakes alone cannot identify training-data provenance.
