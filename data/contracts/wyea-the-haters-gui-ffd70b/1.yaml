ambiguity_flags:
  - The OpenAI numerator may refer to a different period or annualization basis from the January denominator.
  - Real revenue is a speaker-defined exclusion, not an accounting measure.
  - At cost, just above cost, and costing more than it earns require different cost definitions to be mutually consistent.
  - The context mixes an annualized revenue snapshot and a full-year capital spending plan.
  - The target period encompasses these different fiscal-2025 reference points.
