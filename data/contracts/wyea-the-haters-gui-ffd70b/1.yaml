assessment_axis: historical_observation
explicit_source_elements:
  - 76.9% of Microsoft's AI revenue comes from OpenAI
  - at just above or at cost
  - '"real" AI revenue about $3 billion'
  - 3.75% of this year's capital expenditures
  - 16.25% if you count OpenAI's revenue
  - costs Microsoft more money than it earns
evaluator_interpretation:
  - The context explicitly identifies the $13 billion denominator as the AI annual revenue run rate announced in January 2025. I preserve that annualized basis.
  - Real AI revenue is read as the speaker's subtraction of OpenAI-related revenue, not a recognized accounting revenue category or a profit measure.
  - The $10 billion input is attributed to press reporting, so the derived non-OpenAI revenue estimate has accounting_basis estimate.
  - The observation combines a January-announced revenue run rate with a fiscal-2025 spending plan. The target period therefore spans FY2025; it is not a claim about realized calendar-2025 revenue.
  - The contract's metric_scope records the central estimated revenue remainder. The customer share, pricing, spending comparison, and loss assertion require separate matching evidence.
support_condition: Evidence establishes approximately $10 billion of OpenAI-related revenue within the same approximately $13 billion annualized AI revenue measure, substantiates near-cost pricing and the asserted loss, and verifies the applicable $80 billion spending denominator.
contradiction_condition: Comparable evidence establishes a materially different customer share or revenue remainder, or shows that the cost and loss assertions are false. Correct arithmetic alone neither supports nor contradicts the underlying financial inputs.
measurement_requirements: Match the numerator and denominator by period, annualization method, revenue definition, and customer scope. Distinguish server operating costs from fully allocated costs, and planned capital expenditure from realized expenditure.
source_requirements: Microsoft disclosures and readable reporting on the OpenAI contract and revenue breakdown, available by 2026-10-28. Unreadable articles and search snippets cannot supply decisive evidence.
