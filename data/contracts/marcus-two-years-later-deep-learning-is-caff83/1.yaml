evaluator_interpretation:
  - The substantive assertion ranks deep learning's suitability across applications, rather than merely stating that it can make mistakes.
  - No ordinary, sufficiently definite reading supplies a common measure of best across accuracy, usefulness, safety, cost, and consequences of error.
  - Success in a high-stakes application would not by itself contradict a relative claim about where a technique is best.
  - The pattern-recognition description is separable, but establishing it would not settle the compound proposition.
support_condition: No fair binary support condition can be specified without adding a task population and a measure of comparative suitability.
contradiction_condition: No fair binary contradiction condition can be specified without the same additions; isolated high-stakes successes are insufficient.
measurement_requirements: A defined comparison across applications, a common performance or utility measure, and explicit acceptable-error thresholds would be needed.
