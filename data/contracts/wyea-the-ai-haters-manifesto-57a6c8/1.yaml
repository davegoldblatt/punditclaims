ambiguity_flags:
  - True LLM has no size or capability threshold.
  - Per-model training costs and company-wide training expenses are interchanged.
  - Accounting basis and included cost categories are unspecified.
  - The investment-justification clause is normative.
  - The categorical cost assertion is present-tense and does not explicitly depend on the financial-mania condition.
