evaluator_interpretation:
  - "The comparison is to cumulative Roomba unit sales, so the humanoid threshold is approximately 10 billion cumulative units: 200 multiplied by 50 million."
  - The threshold is derived from Marcus's stated baseline, without independently endorsing that baseline.
  - Nearish term supplies no fixed deadline. The separate present-capability assertion is assessed under the next claim.
support_condition: Worldwide cumulative humanoid robot sales remain below approximately 10 billion through an endpoint justified by the speaker's meaning of nearish term.
contradiction_condition: Verified worldwide cumulative humanoid sales reach approximately 10 billion within an unambiguously near-term interval.
measurement_requirements: Cumulative completed unit sales, with consistent product definitions and no double counting. Orders, production capacity, shipments, rentals, and annual sales must be distinguished.
source_requirements: Manufacturer disclosures reconciled with independent worldwide industry measurements. Another analyst's forecast cannot establish the outcome.
