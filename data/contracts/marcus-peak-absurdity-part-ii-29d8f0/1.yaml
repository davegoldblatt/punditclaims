evaluator_interpretation:
  - "'They' means OpenAI, and the statement refers to September 2025."
  - The plain reading is that liquid funds already held were only a small fraction of USD 300 billion.
  - Marcus supplies no numerical meaning for 'anywhere near'. A clear large shortfall could settle the claim; a borderline comparison would remain unresolved.
  - No accounting basis is stated or clearly implied.
support_condition: Comparable September 2025 evidence establishes that OpenAI's cash and readily available liquid assets were a small fraction of USD 300 billion.
contradiction_condition: Comparable evidence establishes funds at, above, or sufficiently close to USD 300 billion that the ordinary description 'nowhere near' is untenable.
measurement_requirements: Measure liquid assets held at the historical date. Identify restrictions and accounting basis; distinguish investment commitments from cash received.
source_requirements: Prefer authenticated company financial records and investor disclosures. Use financing announcements only to describe financing.
