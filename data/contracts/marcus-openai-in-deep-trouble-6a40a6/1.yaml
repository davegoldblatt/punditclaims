evaluator_interpretation:
  - Some refers to departed OpenAI personnel.
  - Serious competitors means credible competing AI businesses or research ventures, demonstrated by deployed products or substantial relevant research teams.
  - Similar IP is read as comparable technical work and capabilities in advanced AI models. It does not assert copying, infringement, or ownership of OpenAI's confidential material.
  - Started describes founding events accumulated before publication; the competitors must already have existed by March 1, 2025.
support_condition: Former OpenAI personnel founded credible competing ventures pursuing substantially overlapping AI technology before publication.
contradiction_condition: The proposed examples were not founded by former OpenAI personnel, did not yet exist, or had no substantial competing technical activity.
measurement_requirements: Establish founder histories, venture existence, and overlapping products or research. Do not equate similar capabilities with shared proprietary code or model weights.
source_requirements: Company product disclosures and founding records, supplemented by reputable reporting where dated primary biographies or announcements are unavailable.
