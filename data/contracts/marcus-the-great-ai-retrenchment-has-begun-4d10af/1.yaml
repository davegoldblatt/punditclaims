  - GPT-5 is treated as shorthand for the anticipated next major model; the quoted remarks address internal models generally rather than confirming an internal model name.
  - The observation window is June 1–15, 2024, the current month through publication, reflecting just and as of yet.
  - The claim concerns an already-existing internal capability lead, not whether a much stronger future model could be developed.
support_condition: A contemporaneous on-record account from someone positioned to know says OpenAI's internal models lacked a substantial capability lead over public models.
contradiction_condition: Dated internal evaluations or credible on-record accounts establish that OpenAI already possessed a substantially more capable next-generation model during the target period.
measurement_requirements: A comparison with the public models available at the time. Later release dates alone do not establish June internal capabilities.
source_requirements: Prefer the original interview or internal technical records. Reputable contemporaneous reporting of the CTO's remarks can support the ordinary qualitative reading, with its limits disclosed.
