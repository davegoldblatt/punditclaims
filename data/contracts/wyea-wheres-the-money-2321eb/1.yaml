  - loses money on every single prompt and output
evaluator_interpretation:
  - "The ordinary reading is a universal claim about request-level profitability: attributable revenue does not cover the cost of serving any prompt-response pair."
  - Company-wide losses do not establish that every request loses money.
  - The statement describes an ongoing condition without a reporting period. I use Q4 2024, the latest completed calendar quarter before publication, as the reporting proxy.
  - The statement specifies no accounting basis. The later discussion of reported company-wide losses does not establish an accounting basis for individual requests.
support_condition: Comparable revenue and serving-cost records show negative contribution for every request across the claimed developers during the target period.
contradiction_condition: A documented request or identifiable request category earns more attributable revenue than its serving cost during the target period, using a matching, specified accounting basis.
measurement_requirements: Match actual revenue and serving costs by model, product, usage and request category. State how subscription revenue, hardware costs, training and overhead are allocated. Do not substitute company-wide net losses for request-level results.
source_requirements: Prefer company cost records or disclosures. Independently documented estimates may inform the assessment, but assumptions and accounting differences must remain explicit.
