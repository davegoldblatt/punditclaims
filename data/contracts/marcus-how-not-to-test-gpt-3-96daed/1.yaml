evaluator_interpretation:
  - "'Read' means exposure during training to descriptions of the classic false-belief experiments discussed in the preceding paragraphs."
  - "'Again and again' means repeated exposure, whether through multiple descriptions or repeated sampling. No exact count is supplied."
  - "'Almost certainly' asserts very high likelihood, not documented certainty. Circumstantial corpus evidence is relevant, but web availability alone does not establish training inclusion."
  - The target is training completed before the post. Its starting date is unspecified.
support_condition: Training documentation combined with dated corpus records establishes repeated exposure, or makes such exposure highly likely without relying only on the experiments' general popularity.
contradiction_condition: A sufficiently complete corpus audit or documented exclusion process establishes that relevant descriptions were absent or that repeated exposure was unlikely.
measurement_requirements: Identify the relevant GPT-3 training corpus, retained descriptions of the experiments and evidence bearing on repeated sampling or multiple occurrences.
source_requirements: Developer training documentation, dated candidate corpus material and preferably a corpus-level inclusion audit. Model self-reports and the speaker's assertions are insufficient.
