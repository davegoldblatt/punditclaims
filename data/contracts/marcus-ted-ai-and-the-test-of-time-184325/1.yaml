assessment_axis: causal_assessment
explicit_source_elements:
  - You can’t teach
  - if your students don’t know whether or not to believe you
evaluator_interpretation:
  - The plain causal reading is that uncertainty about whether to believe a tutor prevents effective learning from that tutor.
  - Teaching is assessed through learning gains, rather than merely presenting information or improving answers while assistance remains available.
  - The learner's uncertainty must be measured or credibly established. Tutor errors alone do not establish that psychological condition.
  - This is a general causal statement without a dated population or deadline, so relevant studies published by the evaluation date can inform it.
support_condition: Controlled evidence establishes that uncertainty about the tutor's truthfulness prevents meaningful learning, with content quality and other plausible causes adequately separated.
contradiction_condition: Credible evidence demonstrates meaningful learning from a tutor among learners whose uncertainty about whether to believe that tutor is established.
measurement_requirements: Measure both learner uncertainty about the tutor and learning gains. Distinguish uncertainty from error exposure, dissatisfaction, confusion and assisted task performance.
source_requirements: Primary educational experiments with sufficient methods to identify the relevant learner state and learning outcome.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Can't teach could express categorical prevention or a looser warning about teaching quality.
  - Neither effective teaching nor the degree of uncertainty is operationally defined.
  - The wording is general, while its immediate context concerns LLM tutors.
