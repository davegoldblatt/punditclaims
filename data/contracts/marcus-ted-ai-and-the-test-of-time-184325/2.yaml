explicit_source_elements:
  - You can’t teach
  - if your students don’t know whether or not to believe you
evaluator_interpretation:
  - In context, this is a maxim about the importance of trust in teaching with an unreliable tutor.
  - The statement does not distinguish impaired teaching from impossible teaching. Treating it as a claim that uncertain students cannot learn anything would stretch it against the speaker.
  - Replacing it with a specified reduction in learning gains would introduce a commitment the speaker did not make.
support_condition: No fair binary support condition can be specified without adding a meaning or threshold for successful teaching.
contradiction_condition: No fair binary contradiction condition can be specified. Some learning despite uncertainty would not necessarily contradict the contextual warning.
