assessment_axis: historical_observation
explicit_source_elements:
  - Uber’s experience
  - indicative of effectively every company’s experience with AI
evaluator_interpretation:
  - The surrounding passage defines the relevant experience as rising AI costs that are difficult to connect to useful output.
  - Effectively every means nearly all adopting companies, allowing isolated exceptions. It does not merely mean that these difficulties are common.
  - I use January 1 through May 25, 2026, for the ongoing enterprise experience described before publication.
  - The statement concerns the prevalence of an experience, rather than a specified company's financial result.
support_condition: Broad, reasonably representative enterprise evidence shows that nearly all adopters experience rising costs without a demonstrable connection to useful output.
contradiction_condition: Broad enterprise evidence identifies a substantial share reporting useful results relative to costs, beyond isolated success stories.
measurement_requirements: Survey fieldwork dates, sampling, respondent population, definitions of value and costs, and the distinction between measured outcomes and expectations must be available.
source_requirements: Original enterprise surveys and documented deployments. Self-reported results must be identified as such.
