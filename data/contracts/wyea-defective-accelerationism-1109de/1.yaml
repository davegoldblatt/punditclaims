plain_reading: true
ambiguity_flags:
  - Few months supplies no exact deadline; the six-month endpoint is an evaluator interpretation.
  - Need money could mean a liquidity shortfall or funding discretionary expansion.
  - No funding amount or financial reporting basis is specified.
  - Inflated relative valuation has no stated valuation method or threshold.
