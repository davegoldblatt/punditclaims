explicit_source_elements:
  - at this point
  - raised $3.36 billion
  - at best, about a billion dollars of revenue
  - assuming it linearly grew between periods
  - up and down months
evaluator_interpretation:
  - At this point means cumulatively through March 31, 2026.
  - Revenue means revenue actually earned since inception, not ARR or an annualized revenue run rate.
  - The revenue estimate has an estimate accounting basis because the passage explicitly constructs it from reported milestones using interpolation.
  - The funding figure is a separate cumulative financing assertion. Funding and annualized revenue evidence cannot substitute for cumulative realized revenue.
  - Linear growth is an estimation assumption, not a conditional forecast. Fluctuating months do not mathematically make linear interpolation an upper bound.
  - About a billion allows ordinary approximation; the speaker supplies no numerical tolerance.
support_condition: A complete financing record supports approximately $3.36 billion raised, and cumulative realized revenue through publication is approximately $1 billion or less. To validate at best, the evidence must justify an upper bound rather than merely one interpolation.
contradiction_condition: Comparable records show materially different cumulative financing or cumulative realized revenue materially above approximately $1 billion by publication.
measurement_requirements: Financing proceeds through the cutoff and a monthly realized-revenue series or cumulative revenue statement from inception through publication.
source_requirements: Company financial statements and complete funding announcements; clearly attributed press estimates may inform an estimate but must preserve the underlying metric.
