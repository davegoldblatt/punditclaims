assessment_axis: forecast_outcome
explicit_source_elements:
  - “large impact” side
  - with respect to education
  - with some words of caution
evaluator_interpretation:
  - The plain reading is that AI substantially changes teaching, learning, or assessment across a substantial part of education. Impact may be beneficial or harmful.
  - Words of caution do not identify an antecedent that must occur. This is not a conditional forecast.
  - The NYT panel's introduction, available in its syndicated Spanish translation, frames the exercise around the next five years. I apply that contextual horizon through February 2, 2031, although the individual education question supplies no deadline.
  - Widespread experimentation supports the forecast but does not alone establish a large change in educational practice. Improved test scores are not required.
support_condition: Evidence establishes substantial, widespread changes attributable to AI in teaching, learning practices, or assessment.
contradiction_condition: Evidence covering the contextual deadline shows that AI remains peripheral and has produced little substantial change in teaching, learning, or assessment.
measurement_requirements: Identify the education level, country, observation period, actual practices affected, and whether results are self-reported. Distinguish access and occasional use from changes in educational practice.
source_requirements: Prefer original education surveys, institutional records, and independent studies. Announced access agreements alone cannot establish impact.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated study or documented implementation can settle the forecast early if it establishes substantial changes in ordinary teaching, learning, or assessment across a broad education population. Isolated pilots and access announcements cannot.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Large has no numerical threshold.
  - Education does not specify country, age group, or institutional level.
  - The five-year horizon comes from the overall panel framing, not the education sentence.
  - The forecast does not specify whether impact concerns learning practices, assessment, outcomes, or teachers' work.
retrospective_or_prospective: retrospective
