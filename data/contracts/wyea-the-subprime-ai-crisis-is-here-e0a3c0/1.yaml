assessment_axis: forecast_outcome
explicit_source_elements:
  - AI startups only retain their value
  - the perception that these companies could theoretically go public or be acquired
  - one failed exit or firesale
  - break the illusion
evaluator_interpretation:
  - The ordinary testable reading is that one failed exit or distressed sale can destroy broad confidence in AI startup exits and cause widespread valuation markdowns.
  - A seller-specific loss is insufficient to establish the predicted industry effect.
  - The trigger is assessed after publication. No deadline or reaction period is supplied.
  - I include dedicated AI infrastructure startups within AI startups. Restricting the phrase to model developers and applications would make the identified Firmus trigger inapplicable.
support_condition: A documented failed exit or distressed sale is followed by broad AI startup markdowns and evidence linking the loss of exit confidence to that event.
contradiction_condition: Evidence establishes that the specified event did not destroy broad exit confidence under an agreed reaction period. No such period is supplied, so continued confidence through a finite cutoff cannot conclusively refute the undated forecast.
measurement_requirements: Separate the triggering transaction from its consequences. Use representative private-company valuation changes and exit-confidence evidence, accounting for other causes.
source_requirements: Company or court transaction records, or reputable reporting where primary records are unavailable, plus independent valuation and market evidence.
metric_scope:
  company: AI startups
  metric: Retention of startup valuations and exit confidence
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Support can resolve early only after a dated qualifying event and documented broad valuation damage attributable to it. A failed transaction alone, or a finite interval without a crash, is not conclusive.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Break the illusion has no numerical threshold.
  - No deadline or reaction period is stated.
  - The breadth of affected companies is unspecified.
  - Including AI infrastructure startups determines whether Firmus satisfies the condition.
  - A bankruptcy sale process is not necessarily a completed firesale.
  - No valuation accounting basis is supplied.
retrospective_or_prospective: retrospective
