evaluator_interpretation:
  - Assess documented behavior during the six-week history discussed in the post, through January 14, 2023.
  - Untruthful means producing false factual statements, without implying conscious intent to deceive.
  - The ordinary reading is that ChatGPT demonstrably makes these kinds of errors, not that every answer is wrong or that a particular error rate has been measured.
  - Treat the list as examples supporting the general reliability observation. Identify any example not independently recovered rather than silently treating it as verified.
support_condition: Independent contemporary records demonstrate arithmetic or word-problem mistakes and fabricated biographical and scientific content presented as factual.
contradiction_condition: The cited demonstrations are shown to be inauthentic, outside the target period, or factually correct, and the alleged pattern of errors and fabrications is not substantiated. Some correct answers alone do not contradict an assertion that errors occur.
measurement_requirements: Check recorded responses against arithmetic, the supplied problem, knowledgeable biographical sources, and relevant scientific expertise. Do not infer a population error rate from selected examples.
source_requirements: Primary interaction records or first-hand expert checks identifying contemporary behavior. Later reports are usable when they explicitly date the earlier interaction.
