assessment_axis: causal_assessment
explicit_source_elements:
  - Generative AI chatbots are driving people insane
  - by providing them an endlessly-configurable pseudo-conversation
evaluator_interpretation:
  - The ordinary checkable reading of driving people insane is causing or materially worsening serious delusions, psychosis-like symptoms, or related psychiatric crises in some users.
  - The claim does not specify prevalence and need not mean that previously healthy users are the only people affected.
  - The proposed mechanism is sustained, adaptive conversation that reinforces disordered beliefs.
  - The video-game comparison is rhetorical commentary, not a conditional antecedent.
  - The target is the ongoing state in 2025 through June 16. Later evidence may clarify earlier cases, but later-onset cases cannot establish this historical causal claim.
  - Causal support need not come from a randomized experiment, but must distinguish chatbot contribution from mere coexistence with an emerging psychiatric episode.
support_condition: Well-documented cases or studies from the target period establish that chatbot conversations materially caused or worsened serious psychiatric symptoms, with clinical assessment or comparably strong evidence addressing alternative explanations.
contradiction_condition: Strong evidence about the relevant cases and users shows that chatbot interaction did not materially contribute to their psychiatric deterioration and that the apparent relationship is explained by other causes.
measurement_requirements: Establish symptom chronology, chatbot exposure and content, severity, prior vulnerabilities, sleep and substance factors, and evidence distinguishing induction or exacerbation from symptoms merely involving a chatbot.
source_requirements: Prefer clinical case reports, documented chat logs reviewed by clinicians, and longitudinal or comparative studies. News accounts may establish reported cases but must not be treated as controlled causal findings.
