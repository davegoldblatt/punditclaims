evaluator_interpretation:
  - Assess the conditional estimate without treating its assumptions as independently established facts.
  - Check the arithmetic separately from the claim about actual equipment awaiting deployment.
  - Read 'sitting in warehouses' to include purchased equipment held pending deployment, including at unfinished facilities; it still requires evidence of hardware possession and non-deployment.
  - "Use the mixed reporting-date interval underlying the calculation: Amazon's December 2025 base and the latest reportable company balances before the post."
  - Read 'estimated $234 billion' as rounded to the nearest billion for the arithmetic check, without inventing an empirical error tolerance.
support_condition: The stated inputs produce the rounded estimate, and comparable evidence validates the CIP additions, hardware allocations, and ownership/deployment status needed to infer approximately USD 234 billion of held GPU/TPU equipment.
contradiction_condition: The arithmetic materially fails, or sufficiently complete comparable measurements establish that the inferred stock or its assumed composition is materially inconsistent with the claim.
measurement_requirements: Separate GPU/TPU equipment from buildings, power infrastructure, other servers, networking, capitalized costs, and future orders. Validate allocations for the unfinished-asset stock, not merely for quarterly spending.
source_requirements: Company asset breakdowns, inventory/deployment records, or credible reporting that measures the relevant purchased but undeployed hardware.
