assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft intends
  - pause new signups for the student and paid individual tiers
  - tighter rate limits
  - eventually move users to “token-based billing”
  - actual cost of their token burn
evaluator_interpretation:
  - Assess whether Microsoft held the three stated policy plans on April 20, 2026, rather than treating eventual implementation as a forecast with an invented deadline.
  - Paid individual tiers means Pro and Pro+, as specified in the surrounding text.
  - Read token-based billing as charging according to token consumption and model prices. The surrounding API-price example indicates retail token charges, not verified reimbursement of Microsoft's internal costs.
  - Later statements count as evidence of April intent only when they explicitly describe the earlier restrictions as preparation for the billing transition.
  - The assessment addresses the substance of the plans, not independent authentication of the leaked documents.
support_condition: Dated company statements or reliable reporting of those statements establish the signup pause, tighter usage limits, and an already-planned transition to token-based billing.
contradiction_condition: Reliable contemporaneous records establish that a material stated plan did not exist, was misreported, or concerned different subscription tiers.
measurement_requirements: Distinguish policy intent from implementation dates, usage limits from request allowances, and token-priced billing from internal compute-cost reimbursement.
source_requirements: Company announcements or authenticated planning records. Later reporting must explicitly connect the transition to the April plans.
