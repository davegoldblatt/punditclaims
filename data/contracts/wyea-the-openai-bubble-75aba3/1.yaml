early_resolution_rule: Support requires an observed, documented chain from financing constraints to reduced GPU purchasing and then reduced NVIDIA HBM requirements. Short-term growth or a forecast of future growth cannot conclusively contradict the undated prediction.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or comparison period is supplied.
  - "'As much' does not specify purchase value, GPU count, or computing capacity."
  - "'Won’t need as much' does not specify HBM purchase volume or inventory requirements."
  - Treating general AI infrastructure borrowing as GPU financing is an explicit interpretation of the antecedent.
  - No accounting basis or quantitative threshold is specified.
