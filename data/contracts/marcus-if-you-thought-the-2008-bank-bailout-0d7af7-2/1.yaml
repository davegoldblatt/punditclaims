assessment_axis: historical_observation
explicit_source_elements:
  - overhyping and economically shaky AI companies
  - spend far more than they earn
  - "companies that would be bailed out with taxpayer money (context: OpenAI, CFO Sarah Friar's remarks; Nvidia in a footnote)"
evaluator_interpretation:
  - The checkable core is 'spend far more than they earn'. 'Overhyping' and 'economically shaky' are judgments of opinion and are not scored separately.
  - From the post's context, the main company meant is OpenAI, whose CFO's remarks prompted the post. Nvidia is named only as making 'the same play' on lobbying, not as a company that spends more than it earns, so it is not tested on spending.
  - "Plain reading: in the most recent periods reported before the post (calendar 2025 through Q3 2025), OpenAI's spending (costs, losses, cash burn) was a large multiple of its revenue, not just slightly above it."
  - The target period is 2025-01-01 to 2025-11-05, the stretch of an ongoing state that public reports could cover before the post date.
support_condition: Reliable reports for 2025 periods before the post show OpenAI's expenses or losses well above its revenue, for example losses or costs larger than revenue for the same period.
contradiction_condition: Reliable reports show OpenAI's 2025 spending was close to or below its revenue (roughly break-even or profitable), or only slightly above it.
measurement_requirements: Compare OpenAI's reported revenue with its reported costs, net loss, or cash burn for the same or overlapping 2025 periods.
source_requirements: OpenAI financial disclosures as reported by reputable news outlets, or filings by investors that use equity-method accounting (Microsoft 10-Q). OpenAI was private, so press reports of shareholder disclosures are acceptable.
metric_scope:
  company: OpenAI
  metric: spending (expenses, net loss, cash burn) relative to revenue
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-09-30
  stock_or_flow: flow
