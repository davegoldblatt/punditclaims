horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolution requires a demonstrated broad financing cutoff and a subsequent decisive collapse or durable survival through that cutoff. Market volatility alone cannot settle it.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
