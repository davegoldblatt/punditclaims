evaluator_interpretation:
  - The ordinary reading is that a broad loss of financing for the AI investment boom leads to its collapse.
  - A collapse means a broad, sustained reversal in investment and valuations accompanied by canceled projects or business failures.
  - Higher financing costs, individual failed deals and temporary stock declines do not alone establish that financing has run out.
support_condition: Evidence establishes broad financing exhaustion followed by a sustained collapse of the AI investment boom.
contradiction_condition: After a verified financing cutoff, durable operating cash generation or replacement funding sustains the boom through the affected funding cycle.
measurement_requirements: Track financing availability, completed funding, investment, valuations, cancellations and failures across the sector. Establish the sequence of events.
source_requirements: Funding disclosures, market datasets and insolvency or project records, supplemented by reputable reporting on financing availability.
