interpretation_determines_result: true
ambiguity_flags:
  - Tentative inference introduced by 'suggest'.
  - Demand could mean any purchases, substantial adoption or demand sufficient to sustain the business.
  - Profit could mean gross margin, operating profit or net profit.
  - The move from CoreWeave to the entire sector has no stated scope or inference standard.
