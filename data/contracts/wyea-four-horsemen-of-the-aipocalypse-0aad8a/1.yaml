ambiguity_flags:
  - Global capacity could mean AI capacity or all data-center capacity
  - Ownership, reservation, and actual utilization are different measures
  - Provider and customer allocations can overlap
  - Forever supplies no numerical lead-time threshold
  - Ongoing observation has no explicit period; latest completed quarter used
