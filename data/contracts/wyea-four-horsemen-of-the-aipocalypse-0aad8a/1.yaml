assessment_axis: historical_observation
explicit_source_elements:
  - data centers take forever to build
  - a limited amount of global capacity
  - most of which is taken up by Microsoft, Google, Amazon, Meta and OpenAI
  - the first three of those already providing capacity to both Anthropic and OpenAI
evaluator_interpretation:
  - Forever is ordinary emphasis for lengthy construction and commissioning lead times, not a claim that completion is impossible.
  - The surrounding discussion makes usable AI data-center capacity the principal denominator. All data-center capacity is a plausible alternative reading.
  - Most means more than half.
  - Taken up includes owned or reserved operational capacity, counted once when a cloud provider supplies another named company.
  - Use January through March 2026, the latest completed calendar quarter before publication, for this ongoing industry observation.
  - The supplier statement is a subsidiary factual element; it does not itself establish the global majority.
support_condition: Contemporaneous global inventories show that the five named firms collectively hold or reserve more than half of usable AI capacity without double counting, and demonstrate material constraints and long delivery times. The stated supplier relationships must also be documented.
contradiction_condition: A comparable global inventory places the five firms at half or less, or representative evidence shows abundant promptly deliverable capacity inconsistent with the claimed constraints. A disproved supplier relationship would contradict that subsidiary element.
measurement_requirements: A global operational-capacity denominator, consistent compute or IT-power units, company and tenant allocations, and construction-to-operation timelines. Separate AI capacity, hyperscale capacity, all data centers, and announced projects.
source_requirements: Industry inventories with published definitions and dates, project delivery records, and primary supplier disclosures.
