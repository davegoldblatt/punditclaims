assessment_axis: causal_assessment
explicit_source_elements:
  - This is why Michael Burry brought it up recently
  - spreading out these costs
  - "allows big tech to make their net income (IE: profits) look better"
  - spreading out costs over six years rather than three
evaluator_interpretation:
  - Plain reading has two parts. First, Burry raised depreciation because he thinks longer schedules flatter earnings. Second, lengthening the useful-life estimate of servers and GPUs cuts yearly depreciation expense and so raises reported net income.
  - The claim is about the general mechanism. It does not require a separately measured GPU-only effect.
  - "Period: the recent run of useful-life extensions by big tech (2022 onward) through the post date. That is flagged."
support_condition: Reports or filings showing big tech useful-life extensions lowered depreciation and raised reported net income, plus a report that Burry's stated reason was that longer useful lives inflate earnings.
contradiction_condition: Evidence that longer useful-life estimates did not raise reported net income, or that Burry raised depreciation for an unrelated reason.
measurement_requirements: Disclosed effect of useful-life changes on depreciation expense and net income; Burry's stated reasoning.
source_requirements: Company filings or reputable reports of them; reputable news reports of Burry's statement.
