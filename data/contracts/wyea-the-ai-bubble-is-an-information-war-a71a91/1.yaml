evaluator_interpretation:
  - "Hyperscalers: Amazon (AWS), Microsoft (Azure), Google (Cloud), and Oracle (OCI), as of the post date."
  - "'Actual revenues' means a reported dollar revenue figure for a period. Growth percentages and vague or annualized run-rate statements do not count."
  - "Period: the most recent disclosures before the post, Dec 2025 to 2026-03-03."
  - The motive clause ('not something you do when things are going well') is opinion and is not scored.
support_condition: No major hyperscaler reported a dollar revenue figure for GPU or accelerator rental before the post; disclosures were limited to segment totals, growth rates, or run-rate remarks.
contradiction_condition: At least one major hyperscaler reported actual dollar revenue from GPU or own-silicon rental before the post.
measurement_requirements: Hyperscaler earnings releases and calls from late 2025 to early 2026.
