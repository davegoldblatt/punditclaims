assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - cost too much to run
  - costs appear to increase linearly with revenues
evaluator_interpretation:
  - The checkable component is the claimed relationship between serving costs and realized revenue. Too expensive has no stated profitability or return threshold and is not separately scored.
  - "Read linearly in its ordinary business sense: serving costs rise approximately in proportion to revenue, leaving the serving-cost share of revenue broadly stable."
  - Use January–March 2026 as the latest completed reporting quarter before publication, with preceding comparable periods needed to assess the relationship.
  - Distinguish inference serving costs from training, research, financing charges, and total operating expenses.
  - The claim identifies neither an accounting basis nor a particular provider. Its accounting basis therefore remains unknown.
support_condition: Comparable realized-revenue and serving-cost series show approximately proportional growth across a representative set of LLM providers through the target quarter.
contradiction_condition: Comparable series show a material, sustained departure from proportional growth across the relevant providers, rather than an isolated model, price change, or accounting reclassification.
measurement_requirements: Multiple comparable periods; consistent treatment of paid and free usage, cloud reseller payments, training, depreciation, and revenue recognition.
source_requirements: Provider financial disclosures or independently documented financial records separating serving costs from other expenses.
