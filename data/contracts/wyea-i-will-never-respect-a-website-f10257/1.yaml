assessment_axis: forecast_outcome
explicit_source_elements:
  - Large Language Models
  - absolutely cannot and will not do
  - in the future
  - eliminating 50% of white collar jobs
  - Superintelligence
evaluator_interpretation:
  - The plain reading is a categorical rejection of the large-scale job elimination and superintelligence discussed immediately before this sentence.
  - Superintelligence means broadly exceeding human intellectual capabilities, rather than exceeding humans on one benchmark.
  - The surrounding reference to 50% of white-collar jobs supplies a scale example, but the sentence does not specify a workforce, geographic denominator, capability test, or deadline.
  - LLM-based systems using tools count when their relevant capabilities substantially depend on LLMs.
  - This assessment addresses the normalized capability forecast, not the separate allegation about executives' commercial intentions.
support_condition: Evidence establishes a durable limitation preventing LLM-based systems from producing the referenced outcomes. Their absence during a finite observation period cannot establish the unrestricted claim that they will never occur.
contradiction_condition: Credible evidence establishes either LLM-caused white-collar job elimination at the referenced scale or independently demonstrated, broadly superhuman intellectual capabilities.
measurement_requirements: Labor evidence must identify actual employment losses, a defined workforce and baseline, and causal attribution to LLM adoption. Capability evidence must cover diverse substantive tasks with human comparisons, reliable performance, and disclosed assistance.
source_requirements: Prefer independent labor research, administrative employment data, and reproducible capability evaluations. Predictions, product labels, exposure estimates, and isolated demonstrations cannot settle the forecast.
metric_scope: null
original_horizon: in the future
horizon_interval:
  start: 2026-04-14
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, independently verified occurrence of either denied outcome can contradict the categorical forecast. Benchmark progress or limited occupational effects alone do not meet this rule.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline beyond 'in the future'.
  - The capabilities denied are identified through surrounding discussion.
  - Superintelligence has no specified operational test.
  - The job-loss denominator and geographic scope are unspecified.
  - The scope of future LLM-based systems is unspecified.
retrospective_or_prospective: retrospective
