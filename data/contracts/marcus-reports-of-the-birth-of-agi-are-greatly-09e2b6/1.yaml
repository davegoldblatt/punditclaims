assessment_axis: historical_observation
explicit_source_elements:
  - Current machines can’t do this
  - especially not the reliability part
  - flexible and general
  - resourcefulness and reliability comparable to (or beyond) human intelligence
evaluator_interpretation:
  - The plain reading concerns systems combining broad competence with human-comparable reliability, rather than whether machines can perform any individual task reliably.
  - Interpret 'current' as current when the post reapplies the definition in October 2023. The passage's reference to last year's discussion creates a genuine timing ambiguity.
  - Use 2023 through publication as the current research period because the claim supplies no narrower reporting interval.
  - Allow ordinary human fallibility. The mere existence of model errors does not settle the human comparison.
  - Evidence confined to LLMs cannot by itself establish an unrestricted claim about every kind of AI system.
support_condition: Broad evaluations of contemporary general-purpose systems establish substantial deficits against humans in the combined flexibility, resourcefulness and reliability standard.
contradiction_condition: At least one contemporary system demonstrates the combined standard across representative general tasks under comparable human and machine conditions.
measurement_requirements: Measure successful generalization, sustained task completion and error rates across varied tasks, with comparable human baselines and explicit tool access.
source_requirements: Primary evaluations of systems from the target period. Separate evidence about general-purpose systems from isolated specialist successes.
