  - the user isn’t looking to infringe
  - doesn’t mention any character or film by name
evaluator_interpretation:
  - The surrounding passage identifies DALL-E accessed through Bing.
  - I use December 1–29, 2023 as the latest contemporaneously observable month before publication. The post supplies no exact experiment dates.
  - The ordinary reading is a capability to produce infringing imagery from a name-free request without requiring an intention to infringe.
  - Recognizable copyrighted characters establish a possible infringement risk, but do not alone establish infringement. A reasoned copyright assessment can suffice; a court judgment is not required.
  - Omitting a name does not establish innocent intent when a tester deliberately describes the desired character.
support_condition: An independently documented name-free request from the target period produces protected expression under circumstances supporting infringement, with evidence that deliberate infringement was unnecessary.
contradiction_condition: Reliable evidence rules out the claimed behavior in the relevant deployment. Showing that some generic prompts produced original images would not contradict this possibility claim.
measurement_requirements: Full prompt and conversation context, dated output, relevant protected work, evidence concerning user intent, and an assessment of substantial similarity and applicable authorization or exceptions.
source_requirements: Independent contemporary demonstrations and a grounded copyright assessment; Marcus's own examples are insufficient as independent outcome evidence.
