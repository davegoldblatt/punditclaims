evaluator_interpretation:
  - In context, 'general issue' means that historically inappropriate demographic substitutions appeared across historical subjects beyond popes. It does not assert that most generated images were inaccurate.
  - The discussion refers to examples circulating yesterday and still reproducible now, giving a February 20–21 target period.
  - Generating a person of color for a modern nationality is not by itself a historical error.
support_condition: Credible contemporary observations document historically inappropriate demographic substitutions in multiple historical subjects beyond popes.
contradiction_condition: Reliable examination establishes that the alleged examples beyond popes were misattributed, explicitly fictional, or historically appropriate, leaving the problem confined to pope images.
measurement_requirements: Identify prompts, generated depictions, historical setting, and observation dates. Distinguish factual historical requests from fictional or open-ended requests.
source_requirements: Prefer independently reproduced outputs or provider records. Reports must describe the prompts and results sufficiently to assess historical relevance.
