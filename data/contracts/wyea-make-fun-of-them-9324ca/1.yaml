assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI makes $12.7 billion this year
  - loses $14 billion
evaluator_interpretation:
  - "'This year' means calendar 2025."
  - I treat the figures as approximate forecasts, consistent with the supplied normalized proposition and the surrounding discussion of reported financial projections.
  - I use a 5% tolerance for each amount. This tolerance is evaluator-supplied.
  - The plain financial reading of 'loses' is net loss attributable to OpenAI, not spending, operating loss or cash burn.
  - "The accounting basis is estimate: the passage discusses externally reported projections and does not identify GAAP, IFRS or a specified adjusted measure."
  - Revenue and net loss are separate components. Agreement on revenue and disagreement on loss produces a mixed outcome.
support_condition: Reported full-year revenue is within 5% of $12.7 billion and reported full-year attributable net loss is within 5% of $14 billion.
contradiction_condition: Either component falls outside its tolerance on the corresponding measure. If one component agrees and the other disagrees, the combined assessment is mixed.
measurement_requirements: Use realized calendar-year revenue and attributable net loss. Keep operating loss, adjusted losses, cash burn and annualized revenue separate.
source_requirements: Prefer public financial statements. If unavailable, use credible reporting on financial records with independent verification; the speaker's own publication is insufficient.
metric_scope:
  company: OpenAI
  metric: Annual revenue and attributable net loss, assessed separately
  currency: USD
  units: billions
  accounting_basis: estimate
