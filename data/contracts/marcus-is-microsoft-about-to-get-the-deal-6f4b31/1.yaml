explicit_source_elements:
  - 75% of OpenAI’s profits until it recoups its investment
  - not the sort of thing that a rocketship startup would typically agree to
  - if the reporting is correct
evaluator_interpretation:
  - Rocketship startup means a rapidly growing startup with strong financing prospects.
  - The test concerns whether this profit-allocation arrangement was customary, rather than whether any successful startup ever accepted one.
  - "For prevailing financing practice, use the latest completed quarter with published market evidence before the post: the third quarter of 2022. The speaker supplied no comparison period."
  - The monetary scope records the rumored allocation percentage, not a realized profit amount. Its accounting basis is a press estimate, and the contractual definition of profits is unspecified.
  - The condition qualifies the application to OpenAI. The comparison of financing terms can be investigated separately from confirmation that OpenAI signed them.
support_condition: Representative financing records or a well-supported market survey show that allocating 75% of ongoing profits to one investor until repayment was unusual among comparable rapidly growing startups.
contradiction_condition: Representative records show that this arrangement, or a materially equivalent ongoing-profit allocation, was customary among comparable rapidly growing startups.
measurement_requirements: A defined comparison group and financing terms that distinguish ongoing-profit distributions from liquidation preferences, dividends, ownership percentages, and revenue sharing.
source_requirements: Executed financing documents or representative transaction surveys. Reporting about the OpenAI deal alone cannot establish market prevalence.
