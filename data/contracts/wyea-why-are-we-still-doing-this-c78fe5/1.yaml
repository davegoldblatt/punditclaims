assessment_axis: historical_observation
explicit_source_elements:
  - every AI company is unprofitable
  - there is no path to profitability
evaluator_interpretation:
  - The surrounding discussion makes generative AI providers the relevant companies. Profits from unrelated businesses at diversified technology companies would not settle this claim.
  - The ordinary reading of unprofitable is a company-wide net loss, rather than negative cash flow or a loss on one product.
  - I use calendar 2025, the latest completed annual reporting period before publication and the year discussed immediately before the claim.
  - I read no path to profitability as a claim about the viability of the businesses at publication, rather than a forecast with an unstated deadline.
  - The passage combines company statements and press estimates without supplying one accounting basis for the universal assertion. Its accounting basis therefore remains unknown.
support_condition: Comparable financial records would need to establish losses throughout the relevant population, together with evidence that their operating economics offered no feasible route to covering total costs. Losses at two companies alone would not suffice.
contradiction_condition: An in-scope company reporting a net profit in the target period on an identifiable, comparable basis would defeat the universal profitability assertion. A demonstrated, financially substantiated route to covering total costs would defeat the no-path assertion.
measurement_requirements: Company-wide net results for the same period; a defined population of generative AI providers; and a distinction between net profit, operating profit, gross profit and cash flow.
source_requirements: Financial statements or sufficiently detailed company disclosures. Reports of founder statements can identify counterexamples to investigate, but must specify the relevant period and meaning of profit.
