assessment_axis: historical_observation
explicit_source_elements:
  - There’s still no clear business model
  - systems like GPT-4 still cost a lot to run
  - A billion or two in revenue this year is impressive
  - it’s not clear how much of that is profit
evaluator_interpretation:
  - In context, 'no clear business model' means no clearly established route to sustainable profits. Marcus acknowledges revenue, so the existence of subscriptions or API charges does not contradict him.
  - "'Cost a lot to run' concerns the expense of serving model outputs and its importance to sustainable economics. It does not refer to training costs alone. Marcus supplies no numerical threshold or comparison."
  - The target is the ongoing business position in 2023 through publication. The year-to-date window follows 'this year' in the surrounding passage; it is not an assertion about completed full-year results.
  - Temporary losses alone do not establish an unsustainable business model. Equally, revenue growth alone does not establish a sustainable one.
  - The claim names no financial source or accounting basis. Its accounting basis remains unknown.
support_condition: Reliable evidence about the target period establishes unresolved obstacles to covering recurring operating and development costs with durable customer revenue, alongside inference expenses material to that problem. A lack of public accounts alone is insufficient.
contradiction_condition: Reliable evidence establishes a credible, economically grounded route to durable profits under the business model then operating, or establishes that inference expenses were immaterial to its economics. Merely documenting prices, funding or revenue does not meet this condition.
measurement_requirements: Comparable revenue and expense records, inference costs separated from training and other expenses, customer retention or recurring demand, and evidence supporting the contemporaneous route to profitability. Do not substitute API selling prices for OpenAI's costs or annualized revenue for realized revenue.
source_requirements: Prefer contemporaneous company records or authenticated financial documents. Clearly attributed reporting and cost estimates can inform the assessment, with their limitations stated. Later evidence must describe the target period.
