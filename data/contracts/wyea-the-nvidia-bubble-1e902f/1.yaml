assessment_axis: causal_assessment
explicit_source_elements:
  - analysts and the mainstream media
  - have been critical to inflating the NVIDIA Bubble
  - laundering the reputations
  - rationalizing the inherent lunacy of the AI bubble
evaluator_interpretation:
  - The plain causal reading is that analyst endorsements and mainstream coverage made a substantial contribution to speculative NVIDIA and AI investment beyond what business fundamentals would justify.
  - Critical means a major causal contribution, not necessarily the sole cause.
  - Treat 'I believe' as introducing a factual causal assessment, rather than making the claim uncheckable.
  - Use the period from 2023 through the post because the passage contrasts the 2023 analyst defense with events three years later.
  - Reputational laundering is treated as a proposed mechanism. The evaluative description of lunacy is not separately scored.
support_condition: Evidence identifies substantial investment or valuation effects attributable to analyst and media promotion, distinguishes those effects from underlying business news, and links them to speculative excess.
contradiction_condition: Credible causal evidence shows that the asserted promotion had no substantial contribution, or that the alleged excess is explained by fundamentals rather than the claimed mechanism.
measurement_requirements: Identify coverage and analyst interventions, investor exposure, subsequent trading or financing decisions, and plausible alternative causes. Correlation between publicity and rising prices is insufficient.
source_requirements: Contemporaneous analyst reports and coverage, investor or financing records, and research capable of distinguishing causal effects from responses to business performance.
