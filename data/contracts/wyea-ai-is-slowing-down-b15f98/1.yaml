assessment_axis: historical_observation
explicit_source_elements:
  - These are signs
  - AI’s revenue growth is slowing
  - it’s likely going to slow further
  - providing limited-to-no visibility into spend
evaluator_interpretation:
  - The supplied proposition concerns the present revenue-growth assertion. The separate, undated prediction of further slowing is not treated as an elapsed forecast.
  - Slowing means a lower percentage growth rate in realized revenue over comparable intervals, not merely lower growth in selected customers' budgets.
  - The industry-wide wording cannot be settled by silently substituting one company.
  - For the ongoing observation, I use May 2026, the latest complete calendar month before the June 8 post, with earlier comparable months as the baseline.
  - The statement provides no accounting basis for an industry revenue series. The cited customer-budget reporting does not supply one.
support_condition: A consistently defined industry revenue series shows growth decelerating during the target period, with evidence that the cited spending caps are relevant indicators of that change.
contradiction_condition: A comparable industry revenue series shows unchanged or accelerating growth during the target period, and the cited caps do not establish the asserted slowdown.
measurement_requirements: Use a stable industry boundary, consistent revenue recognition and comparable monthly growth intervals. Avoid double-counting payments between labs and compute providers. Separate actual revenue from run rates, budgets and commitments.
source_requirements: Company financial records or a transparent industry revenue dataset, supplemented by dated evidence about the affected customers' spending.
