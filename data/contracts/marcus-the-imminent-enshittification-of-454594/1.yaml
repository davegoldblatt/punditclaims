explicit_source_elements:
  - Amazon, too
  - been infested
  - people are using GPT
  - create low-quality books
evaluator_interpretation:
  - The ordinary reading is a recurring presence of substantially defective GPT-produced books on Amazon, rather than a claim that most Amazon books were defective.
  - GPT retains its stated meaning; reports about unspecified AI tools do not automatically establish GPT authorship.
  - The surrounding account describes examples collected since February 12. The target period is February 12 through August 16, 2023.
  - Substantial defects include incoherent prose, misleading authorship, or factual unreliability. Mere stylistic dislike is insufficient.
support_condition: Multiple books available on Amazon during the target period have documented substantial defects and sufficiently established GPT provenance.
contradiction_condition: Reliable evidence shows that the alleged pattern or its purported examples were not on Amazon, were not GPT-produced, or lacked substantial quality defects.
measurement_requirements: Connect Amazon availability, substantial defects, and GPT provenance for the same books. Do not combine confirmed GPT authorship of one set with defects in an unrelated set.
source_requirements: Prefer preserved listings, book samples, and creator disclosures. Firsthand inspections and reputable reporting may establish availability and defects, but uncertain authorship must remain qualified.
