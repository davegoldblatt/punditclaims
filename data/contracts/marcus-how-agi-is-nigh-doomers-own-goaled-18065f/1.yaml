assessment_axis: causal_assessment
explicit_source_elements:
  - It has made
  - dodgy companies
  - gave lip service to AI safety
  - tremendously wealthy
  - on the promise, not yet delivered
  - they could create AGI
evaluator_interpretation:
  - "'It' refers to the doomer publicity described immediately before the sentence."
  - The plain reading is that this publicity materially enriched frontier AI companies by promoting expectations of AGI, while their safety conduct fell short of their assurances.
  - OpenAI and Anthropic are relevant examples from the surrounding dispute, not an exhaustive company list supplied by Marcus.
  - "'Dodgy' is evaluative language. 'Lip service' is tested through a material mismatch between safety assurances and conduct, without assuming access to private intentions."
  - The claim specifies neither a financial measure nor an accounting basis. Financing and valuations are examined separately as context, without treating either as revenue, profit, or cash on hand.
  - "'Not yet delivered' concerns AGI as of the post date. No AGI definition or acceptance test is supplied."
  - The causal history ends on the post date; no exact starting date is stated.
support_condition: Evidence links doomer publicity to material enrichment through AGI expectations, identifies material failures to honor safety assurances, and establishes that AGI had not been delivered under a defensible stated test.
contradiction_condition: Credible evidence refutes the claimed enrichment mechanism or demonstrates delivery of AGI under the applicable test. A safety-policy announcement alone does not disprove 'lip service.'
measurement_requirements: Keep investment received, investment commitments, valuation, revenue, profits, and cash separate. Establish the causal investment rationale, compare safety promises with actual conduct, and specify an AGI test before assessing delivery.
source_requirements: Financing records and investor explanations, contemporaneous safety policies and implementation evidence, and independent capability assessments. Company disclosures cannot by themselves establish the publicity's causal effect.
