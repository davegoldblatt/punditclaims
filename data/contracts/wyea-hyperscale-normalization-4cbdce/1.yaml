assessment_axis: historical_observation
explicit_source_elements:
  - AI companies never share their actual revenues
  - $11.6 billion in Q2 2026
  - or their underlying economics
evaluator_interpretation:
  - The nearby Anthropic discussion identifies Anthropic as the company associated with the quarterly figure.
  - Q2 2026 means realized revenue for April through June 2026, rounded to one decimal billion dollars.
  - In context, AI companies primarily means standalone frontier AI developers. Expanding it to every public company selling AI would stretch the claim.
  - The disclosure assertion concerns public company disclosures available when the post appeared. Investor-only sharing and press leaks are distinct from direct public disclosure.
  - The numerical target period is Q2 2026. A later statement may verify that quarter's revenue, but a later disclosure event cannot retroactively contradict the September description of disclosure practices.
  - The passage gives no accounting basis or attribution for the $11.6 billion figure. Its basis is recorded as unknown rather than assumed to be GAAP.
support_condition: A matching quarterly revenue measure rounds to $11.6 billion, and a sufficiently complete review establishes the claimed absence of public realized-revenue and underlying-economics disclosures among the relevant companies before the post.
contradiction_condition: A matching quarterly revenue measure does not round to $11.6 billion, or a relevant company had publicly disclosed actual revenue or underlying economics before the post. Each component must retain its own period and accounting scope.
measurement_requirements: Realized quarterly revenue, with accounting basis and gross-versus-net recognition identified. For the disclosure component, identify the company, disclosure date, audience, and actual financial measures disclosed.
source_requirements: Company financial statements and dated public disclosures, supplemented by independently verified reporting. Leaks and annualized run rates do not establish direct public disclosure of realized revenue.
