evaluator_interpretation:
  - Read as a claim that, as of the post date, there was no documented case of GPT-4 by itself (without a human-built tool system steering it) producing original science-fair-level research or singlehandedly building an original computer system.
  - Systems where humans wrap GPT-4 in tools and automation do not count as 'on its own', but they are noted as context.
  - Benchmarks of autonomous software work are used as a proxy for 'designing and implementing computer systems singlehandedly'.
support_condition: Evaluations up to June 2024 show GPT-4 alone failing at autonomous, open-ended software or research tasks, and no documented case shows it doing original work of this kind unaided.
contradiction_condition: A documented case before June 2024 shows GPT-4 alone producing original research ideas carried through to results, or singlehandedly designing and building an original software system.
measurement_requirements: Benchmark results on autonomous real-world software tasks; documented demonstrations of GPT-4-generated original research.
source_requirements: Peer-reviewed or preprint evaluations, model cards, or primary demonstrations dated before 2024-06-05.
