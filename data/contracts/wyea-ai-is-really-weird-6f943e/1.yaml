condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The billing migration is explicitly unconfirmed.
  - No employers, baseline, or comparison interval are specified.
  - Cost per employed engineer, total team expenditure, and cost per unit of output are different measures.
  - Billing at API rates need not mean compulsory use of the API itself.
