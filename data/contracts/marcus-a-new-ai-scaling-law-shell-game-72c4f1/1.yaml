explicit_source_elements:
  - the more time you spend on a problem, the more accurate you get
  - expensive
  - burns up more GPU time
  - unreliable
evaluator_interpretation:
  - The target is inference-compute scaling exemplified by the contemporary o1 family, including additional reasoning and repeated sampling.
  - Read expensive as additional computational and inference cost per problem. Marcus supplies no absolute price or affordability threshold.
  - Read unreliable as additional inference computation not assuring additional accuracy across tasks and budgets, rather than as a claim that it never helps.
  - "Use the o1 release-to-post window for this ongoing observation: 2024-09-12 through 2024-11-24."
  - The reference to Nadella identifies the approach; it is not a forecast antecedent.
support_condition: Contemporary measurements show added inference resource costs and an o1-family experiment in which increasing the inference budget fails to produce further accuracy gains.
contradiction_condition: Matched experiments establish dependable accuracy improvements across the relevant tasks and budgets, or show that the claimed additional inference work has no resource cost.
measurement_requirements: Token usage, inference costs or runtime, together with accuracy measurements at different budgets within a model. Comparisons between models alone cannot establish the effect of longer inference.
source_requirements: Primary experiments or reproducible evaluations identifying the model, task and inference method.
