  end: 2024-11-24
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Expensive has no absolute threshold.
  - Unreliable has no stated frequency or accuracy threshold.
  - Longer individual reasoning and additional independently sampled answers are different ways to increase inference compute.
  - The observation period is inferred from the contemporary o1 release window.
