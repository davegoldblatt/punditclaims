explicit_source_elements:
  - NVIDIA (and other hardware sellers to a much lesser extent)
  - the only link in the chain
  - really profitable
evaluator_interpretation:
  - The plain reading is that hardware sellers earn substantial profits from AI activity, while the other described business layers do not.
  - Profit means earnings after the costs of providing the product, including depreciation and financing costs where relevant. Revenue growth, fundraising and gross profit alone do not establish this.
  - I use calendar 2025, the latest completed annual period and the year explicitly used for the neighboring profitability comparison. Differently dated fiscal results are context.
  - The claim does not identify a consistent accounting basis. I therefore record unknown rather than silently choosing GAAP or adjusted earnings.
support_condition: Comparable AI-specific financial evidence establishes substantial hardware profits and an absence of substantial profits across the other described layers during the target period.
contradiction_condition: Comparable evidence establishes substantial profits in a non-hardware layer during the target period.
measurement_requirements: Separate AI activity from unrelated businesses; include the relevant operating, depreciation and financing costs; distinguish company profitability from profitability of an entire business layer.
source_requirements: Company financial disclosures or reliable reporting with an identified profit measure and period. A company's statement that it is profitable is relevant but insufficient to establish an unspecified profit margin.
