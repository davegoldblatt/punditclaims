ambiguity_flags:
  - Major is not defined.
  - GPT-4 may refer to the original model or the latest GPT-4 variant.
  - Many and close have no numerical thresholds.
  - Quality depends on task, benchmark and evaluation method.
  - The price clause does not specify model tiers or access channels.
