assessment_axis: forecast_outcome
explicit_source_elements:
  - People who buy Altman’s narrative
  - will continue to invest
evaluator_interpretation:
  - The ordinary reading is that investors who endorse OpenAI's transformative AI prospects will keep backing the company financially.
  - Public endorsement of OpenAI's AGI prospects is an observable proxy for buying Altman's narrative; investment alone does not establish that belief.
  - Continued investment means subsequent participation by an investor that has already invested. The sentence is read as a general prediction, not a promise that every believer invests forever.
  - This tests investor behavior and participation, not an investment amount, valuation, or accounting measure.
  - No deadline is supplied.
support_condition: A named investor publicly endorses OpenAI's transformative AI prospects and subsequently confirms repeat investment in OpenAI after May 5, 2024.
contradiction_condition: Decisive evidence establishes that the relevant endorsing investors permanently ceased investment, with no prospect of renewed participation. A temporary funding gap or one investor's withdrawal is insufficient.
measurement_requirements: Match the public endorsement and repeat participation to the same investor. Distinguish completed participation from a proposed or conditional investment.
source_requirements: Prefer direct investor statements and completed funding disclosures. A funding announcement without evidence of the investor's endorsement cannot establish the antecedent.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when an identified investor publicly endorsing OpenAI's transformative prospects subsequently confirms completed repeat participation. This settles the ordinary continued-backing prediction, not indefinite future investment.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Buying Altman's narrative is not directly observable; public endorsement is a proxy.
  - No particular investor cohort, investment amount, or deadline is named.
  - Continue does not specify duration or number of subsequent investments.
retrospective_or_prospective: retrospective
