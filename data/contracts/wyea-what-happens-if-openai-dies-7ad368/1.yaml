  - $12.1 billion
  - on compute
  - $5.7 billion in revenue
  - lose $6.4 billion
  - doesn’t include things like data costs or salaries
evaluator_interpretation:
  - The surrounding paragraph explicitly identifies calendar Q1 2026.
  - Lose $6.4 billion means revenue minus the claimed compute expense before other expenses. It is not a claim about net income or cash burn.
  - Calling the whole $12.1 billion compute and excluding data costs and salaries are substantive parts of the claim.
  - The accounting basis is estimate because Zitron attributes the inputs to press reporting.
support_condition: Reliable Q1 records establish $12.1 billion of compute expense excluding data and salaries, against $5.7 billion of revenue, producing a $6.4 billion shortfall before other expenses.
contradiction_condition: Comparable records establish materially different figures, or show that the claimed compute total includes costs explicitly said to be excluded.
measurement_requirements: Reconcile expense categories and revenue on the same accounting basis. Separate cash burn, cost of revenue, research and development, operating loss, and net loss.
source_requirements: Underlying quarterly financial records or accessible reputable reporting that identifies the expense categories and their contents.
