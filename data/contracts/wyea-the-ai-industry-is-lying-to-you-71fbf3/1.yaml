ambiguity_flags:
  - "'Way longer' has no numerical threshold."
  - The relevant industry representations are not enumerated.
  - "'Actual capacity' could refer to IT load, energized capacity or total facility power."
  - Physical construction and power-related equipment delays can overlap.
