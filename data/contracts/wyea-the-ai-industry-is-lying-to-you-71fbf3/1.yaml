assessment_axis: causal_assessment
explicit_source_elements:
  - another more-obvious reason
  - it takes way longer to build a data center
  - than anybody is letting on
  - only added 3GW or so
  - America in 2025
evaluator_interpretation:
  - The plain reading is that physical construction and commissioning take materially longer than industry representations imply, independently contributing to delays alongside power constraints.
  - Do not interpret 'anybody' as a literal claim that no industry participant ever disclosed a long schedule.
  - Assess the 2025 experience and construction status through the March 24, 2026 post.
  - The approximately 3 GW statement is a proposed supporting observation, not sufficient proof of the causal explanation.
  - Compare the same project phase and milestone; energization, delivery of GPUs and operation are not interchangeable.
support_condition: Representative project records show material schedule overruns attributable to construction or commissioning constraints beyond power availability, and show that public representations understated those durations.
contradiction_condition: Representative matched records show build durations broadly consistent with public representations, or establish that the relevant delays arose from other causes rather than understated physical construction time.
measurement_requirements: Compare dated original schedules, subsequent revisions and actual milestones. Separate power, permitting, equipment, labor, financing, scope changes and commissioning causes. National capacity additions must include the relevant facility types and use a consistent capacity definition.
source_requirements: Contemporaneous developer schedules, commissioning records and documented delay causes, supplemented by transparent industry research. Aggregate additions alone cannot identify causation.
