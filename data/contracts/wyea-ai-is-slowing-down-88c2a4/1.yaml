assessment_axis: forecast_outcome
explicit_source_elements:
  - These funds will be insufficient
  - as will Anthropic’s cash flow
  - have to raise at least another $200 billion
  - in the next year
evaluator_interpretation:
  - The deadline is June 8, 2027, one year after publication.
  - “Another” means additional financing beyond the cited USD 95 billion baseline, without double-counting previously committed investments.
  - “Raise” includes primary equity and debt financing received by Anthropic; it excludes valuation changes, secondary shareholder sales, and undrawn promises.
  - The claim asserts a funding need, so voluntarily raising USD 200 billion would not alone prove the full claim.
  - The forecast amount is the author's estimate, not an audited company funding requirement.
support_condition: Anthropic obtains at least USD 200 billion of additional financing by June 8, 2027, and cash-flow records establish that the baseline funds and operating cash flows could not cover its costs without that amount.
contradiction_condition: At the deadline, Anthropic has met the relevant costs with less than USD 200 billion of additional financing, or an irreversible earlier settlement establishes that less financing suffices for the entire period.
measurement_requirements: Reconcile financing received after publication against the baseline, operating cash flows, cash expenditures, opening liquidity, and unpaid obligations through the deadline.
source_requirements: Financing closing disclosures and company financial statements, supplemented by credible reporting where necessary.
metric_scope:
  company: Anthropic
  metric: Additional external financing required beyond the cited USD 95 billion baseline
  currency: USD
  units: billion
  accounting_basis: estimate
