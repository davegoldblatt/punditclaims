explicit_source_elements:
  - AI has done better over time on benchmarks
  - progress can be and often is illusory
evaluator_interpretation:
  - The plain reading concerns progress in the capability a benchmark purports to measure. A higher score alone need not establish that progress.
  - I read 'often' as a recurring, documented problem across research settings. Marcus supplies neither a numerical frequency nor a population of benchmark gains.
  - The historical scope is AI research through the post date. The wording supplies no starting date.
support_condition: Research documents recurring cases in which benchmark success depends on shortcuts and does not carry over to independent tests of the intended capability.
contradiction_condition: Evidence shows that the alleged recurring failures are invalid or isolated, and that the benchmark successes under discussion reliably transfer to independent tests of their intended capabilities.
measurement_requirements: Compare benchmark performance with controlled tests that remove misleading cues or change incidental features while preserving the intended task. Distinguish failure to generalize from the stronger assertion that no genuine improvement occurred.
source_requirements: Primary research and research syntheses describing results obtained by the post date. The speaker's writing is used only to establish scope.
