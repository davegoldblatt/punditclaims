early_resolution_rule: A documented qualifying failure must be followed by evidence establishing or decisively refuting the predicted broad financing consequences. A closure alone, or a few subsequent successful deals, cannot settle the compound claim.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The current stack is not an enumerated company cohort.
  - The context could be read more narrowly as referring to prominent frontier-model companies.
  - Narrative death has no direct measure.
  - No deadline, response lag or duration is specified.
  - The historical funding-dependence premise and conditional forecast are bundled.
  - No accounting basis is supplied for financial self-sufficiency.
