assessment_axis: forecast_outcome
explicit_source_elements:
  - None of the current stack of AI companies can survive on their own
  - venture capital industry is holding them up
  - If even one of these companies falters and dies
  - the entire narrative will die
  - harder for AI companies to raise
  - even harder to sell an AI company
evaluator_interpretation:
  - This is scored as a conditional forecast. The antecedent is that one of 'the current stack of AI companies' falters and dies.
  - In context ('$100 million to $500 million to multiple startups a year', 'AI startups demanding more capital than has ever been raised'), 'current stack' reads as the major, heavily funded AI companies of late 2025, not any small AI startup.
  - "'Dies' reads as ceasing operations or being liquidated, not merely restructuring or a down round."
  - If the antecedent occurred, the consequent would be tested by a measurable drop in AI startup fundraising and AI M&A after the failure.
support_condition: A major, heavily funded AI company of the late-2025 'stack' fails and shuts down, and afterward AI startup fundraising and AI company sales measurably fall, with the failure widely seen as breaking the AI narrative.
contradiction_condition: A major AI company of that stack fails and shuts down, yet AI startup fundraising and AI M&A hold up or grow in the following period.
measurement_requirements: Evidence of a qualifying failure (date, company, scale), then AI venture funding and AI M&A data for a meaningful period after it.
source_requirements: Court filings or company statements for the failure; PitchBook, Crunchbase or comparable data, or reputable news, for funding and M&A trends.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Only if a qualifying major AI company has clearly died and enough time has passed to observe AI fundraising and M&A afterward.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'current stack of AI companies' is not defined; it could mean frontier labs and heavily funded startups or any AI startup"
  - "'falters and dies' does not say whether a Chapter 11 sale with continued operations counts"
  - "'the entire narrative will die' has no stated measure"
  - no time frame for the consequences
retrospective_or_prospective: retrospective
