assessment_axis: forecast_outcome
explicit_source_elements:
  - they will be worth trillions
  - eventually (no time soon)
  - they will do a huge fraction of all human knowledge work
  - maybe physical labor too
evaluator_interpretation:
  - "Read as an undated long-term forecast: AI agents will eventually do a large share of human knowledge work and create economic value in the trillions of dollars."
  - "'Maybe physical labor too' is hedged, so it is not part of the test."
  - "'No time soon' means near-term evidence cannot contradict it."
support_condition: Credible labor or economic data show agents doing a large share of knowledge work, with economic value or market value in the trillions of dollars.
contradiction_condition: No fixed deadline. Only a decisive, lasting failure of agents to do much knowledge work over a very long period would count against it.
measurement_requirements: Share of knowledge-work tasks or hours done by AI agents, and an estimate of the value they create.
source_requirements: Official labor statistics, peer-reviewed economic studies, or company and market data.
metric_scope:
  company: AI agents (industry-wide)
  metric: economic value of AI agents
  currency: USD
  units: trillions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Supported early if credible measurement shows agents doing a large share of knowledge work with value in the trillions. No early contradiction, because he said 'no time soon' and gave no date.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'worth trillions' could mean market value, revenue, or economic output"
  - "'huge fraction' has no threshold"
  - "'eventually' has no date"
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
