evaluator_interpretation:
  - This is a claim about the arithmetic implication of stated assumptions, checkable when published, rather than a prediction requiring completed construction.
  - The target period covers the February pipeline estimate referenced in the passage through the June post.
  - Apply the stated per-gigawatt range uniformly to the stated 190GW, without introducing utilization, power-efficiency, or construction-cost adjustments.
  - The aggregate is an estimate assembled from third-party capacity data and an executive's cost estimate.
support_condition: Multiplying 190GW by the stated USD 80–100 billion per GW produces approximately USD 9.5–15 trillion.
contradiction_condition: The stated multiplication produces materially different endpoints.
measurement_requirements: Multiply both endpoints by 190 and convert billions to trillions by dividing by 1,000.
source_requirements: Independent documentation of the stipulated inputs; the calculation must be reproducible.
