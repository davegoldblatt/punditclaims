assessment_axis: forecast_outcome
explicit_source_elements:
  - Sundar Pichai, Andy Jassy, Larry Ellison, Elon Musk, Mark Zuckerberg and Satya Nadella
  - will gladly annihilate hundreds of billions of dollars
  - to avoid the inevitable
  - once they do, it’ll be gruesome
evaluator_interpretation:
  - The financial claim concerns AI investments by the companies associated with the named leaders, collectively.
  - I read hundreds of billions as at least USD 200 billion in aggregate. This lower bound is an evaluator interpretation.
  - Annihilate means economic losses or unrecoverable investment value, rather than capital expenditure, financing commitments, or temporary share-price declines.
  - The surrounding context identifies the inevitable event as an AI-business reckoning. Gruesome suggests severe consequences but supplies no measurable threshold.
  - The words gladly and to avoid assert motivation that spending records alone cannot prove.
  - The quote identifies no accounting basis. I do not silently assign GAAP or equate unlike loss measures.
support_condition: Comparable records establish at least USD 200 billion of AI-related investment destruction across the relevant companies, without double-counting, followed by a severe AI-business downturn. The motive requires separate evidence.
contradiction_condition: A completed reckoning and substantially final investment recoveries establish aggregate losses below the interpreted threshold, or direct records refute the asserted motive. Low losses at an interim date cannot refute an undated forecast.
measurement_requirements: Reconcile recognized impairments, realized investment losses, recoveries, and overlapping exposures on a defined accounting basis. Exclude ordinary spending and market-capitalization changes as substitutes for investment destruction.
source_requirements: Company filings, audited loss schedules where available, insolvency records, and asset-disposal disclosures. Documentary evidence is required for claims about intent.
metric_scope:
  company: Alphabet, Amazon, Oracle, Meta, Microsoft, and Elon Musk's relevant AI businesses
  metric: Aggregate AI-related investment losses and unrecoverable write-downs
  currency: USD
