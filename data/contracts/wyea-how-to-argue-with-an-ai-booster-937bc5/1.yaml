assessment_axis: forecast_outcome
explicit_source_elements:
  - I don't buy
  - continue growing forever
  - conversion rate isn't going to change
  - anytime soon
evaluator_interpretation:
  - The checkable forecast is that ChatGPT's low paid-user share will not materially improve in the near term.
  - The surrounding paragraph supplies approximately 3.5% of weekly active users as the stated baseline, but the factual baseline must be independently checked.
  - The disbelief about growing forever is not treated as a separate categorical forecast that finite observations could settle.
  - Anytime soon gives no latest calendar date. The screening suggestion through 2026 is not adopted as a deadline supplied by the speaker.
  - Change is read in context as a material improvement, not ordinary rounding variation or a trivial fluctuation.
support_condition: Matched post-publication observations show that the same paid-user share remains broadly stable over the intended near-term period. Without a bounded period, such observations supply provisional support rather than final resolution.
contradiction_condition: Consistently defined, matched observations show a sustained and clearly material increase from a verified publication-period baseline within a period unambiguously described as soon after the post.
measurement_requirements: Compare the same consumer and business paid-user populations against the same worldwide active-user denominator at baseline and follow-up. Account for overlapping subscriptions, activity definitions and rounded or lower-bound disclosures.
source_requirements: Prefer dated OpenAI disclosures containing paid and active counts together. Retrospective reporting may check the baseline but must not be mistaken for a post-publication change.
metric_scope: null
original_horizon: anytime soon
horizon_interval:
  start: 2025-08-25
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve against the conversion forecast only if matched, consistently defined observations demonstrate a sustained, clearly material improvement from the verified baseline in the initial months after publication. An older count published later, changing user definitions, or two unbounded lower bounds cannot establish that event.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Anytime soon has no bounded deadline.
  - No numerical threshold defines a material change.
  - The quoted baseline may combine stale counts or overlapping user populations.
  - Conversion may mean paid-user share or actual free-to-paid transitions.
  - The growth clause expresses disbelief and uses an unlimited horizon.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
