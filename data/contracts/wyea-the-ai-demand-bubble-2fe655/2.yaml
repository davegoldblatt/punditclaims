explicit_source_elements:
  - These companies (OpenAI and Anthropic)
  - lose tens of billions of dollars
  - horrendously unprofitable
  - at this time do not have an actual answer to 'how do these businesses function without infinite resources?'
evaluator_interpretation:
  - "'These companies' means OpenAI and Anthropic, named in the sentence before."
  - "He named no period. The claim describes an ongoing state on 2026-08-04. I use the latest periods public reporting covers before the post: calendar 2025 and the first half of 2026, which ended 2026-06-30. Both are tested, not 2025 alone."
  - "Plain reading of 'lose tens of billions': the companies' reported losses (net loss, the usual meaning of 'lose') come to $20 billion or more a year. That can be read for the two companies together or for each one. Operating losses are shown as context because much of the net losses are non-cash charges."
  - "Plain reading of 'horrendously unprofitable': losses that are large compared with revenue."
  - The third clause, that they have 'no actual answer' to how they would function without infinite resources, is a judgment with no testable standard. It is not scored.
support_condition: Reported figures show OpenAI and Anthropic posting net losses of tens of billions of dollars in 2025 and/or the first half of 2026, with losses large relative to revenue.
contradiction_condition: Reported figures show the two companies' losses well under $20 billion a year on both net and operating measures, or show them profitable during 2025 to mid-2026.
measurement_requirements: Net loss for OpenAI and Anthropic for calendar 2025 and for 2026 quarters or half-years, as reported from company documents (prospectus drafts, shareholder documents). Operating loss and non-cash charges are used as context.
source_requirements: Company filings or reputable news reports of company financial documents. Do not use the speaker's own reporting.
