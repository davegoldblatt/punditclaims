explicit_source_elements:
  - These companies lose tens of billions of dollars
  - horrendously unprofitable
  - at this time
  - do not have an actual answer
  - without infinite resources
evaluator_interpretation:
  - These companies means OpenAI and Anthropic.
  - Read the quantitative statement as combined annual net losses of at least $20 billion, with both companies loss-making. The wording could instead mean that each loses that amount.
  - Use calendar 2025, the latest completed annual period before publication, for the annual-loss reading suggested by the screening records. This is an interpretation because the speaker supplies no measurement period.
  - Read infinite resources as continuing outside financial support, not a literal infinite quantity.
  - The sentence does not identify an accounting basis for losses. Do not substitute cash burn, operating losses, or financing requirements for net losses.
support_condition: Comparable annual net-loss records show that both companies were loss-making and their combined losses reached at least $20 billion, while substantiated operating plans show no credible route to covering continuing costs without repeated outside support.
contradiction_condition: Comparable annual records show that the stated loss threshold or loss-making status is false, or a substantiated operating plan demonstrates a credible route to financing continuing operations without repeated outside support.
measurement_requirements: Same-year net losses for both companies on a specified accounting basis, with noncash charges distinguished from cash spending; separate evidence for the operating-plan assertion.
source_requirements: Company financial statements where available, otherwise independently verified financial reporting. The speaker's own reports cannot establish the outcome.
