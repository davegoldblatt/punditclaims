explicit_source_elements:
  - anyone
  - $2.75-per-hour-per-GPU
  - any kind of Blackwell GPU
  - they are losing money
evaluator_interpretation:
  - Anyone taking the quoted rate means the rental provider receiving payment.
  - Losing money means rental revenue fails to cover attributable ownership and operating costs, including capital consumption, rather than merely failing to cover electricity.
  - The context describes an hourly spot-price comparison covering roughly February through April 2026. Assess that interval rather than importing a provider's unrelated fiscal quarter.
  - The quoted press estimate concerns rental prices. It does not supply an accounting basis for Zitron's separate loss assertion.
support_condition: Provider-specific records or a defensible universal cost floor show attributable costs above USD 2.75 per billed GPU-hour for every Blackwell configuration covered by the claim.
contradiction_condition: At least one provider demonstrably covers all relevant costs while receiving USD 2.75 per Blackwell GPU-hour during the target period, on an accounting basis matching the claim.
measurement_requirements: Identify GPU configuration, acquisition and infrastructure costs, depreciation or capital recovery, financing, power, hosting, utilization, residual value, and allocation of shared costs.
source_requirements: Provider cost and revenue records are preferred. Cost models require explicit assumptions and cannot establish a universal result from one scenario.
