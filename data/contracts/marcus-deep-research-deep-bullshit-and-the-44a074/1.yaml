assessment_axis: forecast_outcome
explicit_source_elements:
  - Scientific researchers will start to use it
  - errors will seep in to the scientific literature
  - often undetected
evaluator_interpretation:
  - It refers to OpenAI Deep Research, not every product called deep research or every ChatGPT model.
  - Errors must enter publications as scientific assertions or references. Deliberately reproducing erroneous outputs in an evaluation does not constitute contamination.
  - Undetected means escaping the checks before publication, even if an audit subsequently discovers them.
  - Often requires evidence of a recurring pattern. No numerical frequency or deadline is supplied.
support_condition: Documented researcher use, published errors traced to OpenAI Deep Research output, and audits showing that such errors recurrently escaped publication checks.
contradiction_condition: Strong evidence that the predicted pathway cannot occur, or comprehensive evidence against recurrent escape in a clearly defined population. A finite search finding no cases cannot disprove this forecast without a deadline.
measurement_requirements: Match generated passages or references to published errors. Establish publication and detection dates. Assess frequency across a defined sample rather than isolated examples.
source_requirements: Author disclosures or generation records, published papers, and independent audits or publisher investigations identifying the originating product.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated audit establishing researcher use and a recurring pattern of product-attributable errors escaping publication checks can support the forecast. A single erroneous report or publication does not establish often.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Often has no stated numerical threshold.
  - Undetected has no stated duration or detection stage.
  - Scientific literature could include preprints as well as journal articles.
