explicit_source_elements:
  - Large language models lack mechanisms for verifying truth
  - integrate them with the tools of classical AI
  - databases, webs of knowledge, and reasoning
evaluator_interpretation:
  - In context, this concerns standalone generative language models before adding external checking tools.
  - Verifying truth means checking a factual assertion against independent evidence or an explicit verification procedure. Learned factual recall and plausible generation do not alone constitute verification.
  - The claim does not require a verifier to be infallible.
  - The recommendation to develop integrations is not separately graded.
  - "For this ongoing technical state, I use the latest pre-post research year: January 1 through December 10, 2022."
support_condition: Contemporary technical descriptions show that default standalone generation produces claims without an independent factual-checking procedure, with grounding or verification requiring additional mechanisms.
contradiction_condition: Contemporary technical descriptions demonstrate an independent factual-verification procedure within the standalone models covered by this reading.
measurement_requirements: Distinguish model pretraining and default generation from retrieval, external tools, fine-tuned checking systems, and human evaluation.
source_requirements: Primary architecture descriptions and technical papers documenting the actual generation and grounding procedures.
