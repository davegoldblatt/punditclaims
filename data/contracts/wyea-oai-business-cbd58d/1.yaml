explicit_source_elements:
  - around $4 billion on server costs in 2024
  - run ChatGPT and host other companies
  - every dollar of revenue
  - before you factor in paying
evaluator_interpretation:
  - The ordinary reading is that OpenAI's total 2024 inference-server expense consumed at least its total 2024 revenue, before training, payroll and other expenses.
  - The comparison includes serving free users. It is not a claim about customer-acquisition spending in the accounting sense.
  - The surrounding text names 2024, so the target is the full calendar year. Contemporaneous projections establish the basis for the statement but do not establish the eventual annual result.
support_condition: Comparable evidence establishes that OpenAI's 2024 inference-server expenses, including free-user serving costs, equalled or exceeded its 2024 revenue.
contradiction_condition: Comparable evidence establishes that those expenses were below its 2024 revenue.
measurement_requirements: Compare full-year revenue with inference-server expenses covering the same business and users. Exclude training and research compute, payroll, financing and annualized revenue. Reconcile differences in expense coverage before comparing estimates.
source_requirements: Prefer financial disclosures or underlying records. Independently reported estimates are admissible with their limitations; the speaker's own subsequent reporting is not independent confirmation.
