  - That deal
  - OpenAI’s to lose
  - they lost it
  - Apple is going with Google
  - Yesterday
evaluator_interpretation:
  - That deal refers to supplying the technology underlying Apple's next generation of foundation models and personalized Siri.
  - Lost means OpenAI did not secure this supplier role and Google did, with OpenAI having been considered.
  - OpenAI’s to lose suggests a favorable starting position, but supplies no testable probability or contractual entitlement. The assessment does not establish that OpenAI was the preferred bidder or involuntarily rejected.
  - The target event is the January 12, 2026 supplier announcement, not termination of every Apple–OpenAI relationship.
support_condition: Apple and Google announce the relevant Siri/foundation-model collaboration, and credible evidence establishes that OpenAI was an alternative considered for the role.
contradiction_condition: Apple awards that role to OpenAI instead, or the purported Google agreement does not cover the described Siri technology.
measurement_requirements: Distinguish the foundation-model supplier role from the existing optional ChatGPT integration.
source_requirements: Prefer the companies’ announcement; use reporting for private supplier-selection discussions.
