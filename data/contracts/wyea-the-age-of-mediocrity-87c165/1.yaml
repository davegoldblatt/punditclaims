assessment_axis: historical_observation
explicit_source_elements:
  - AI isn’t currently at a place
  - realistically replace a writer or writer’s room
evaluator_interpretation:
  - The Hollywood strike context makes professional screenwriting the relevant work.
  - Realistic replacement means delivering usable professional writing without substantial human writing or rewriting. Ordinary direction and editorial feedback remain permissible.
  - Generating dialogue or assisting a writer is relevant but does not by itself establish replacement.
  - For this ongoing capability claim, I use July 2023, the latest complete month before publication, as the reporting period.
support_condition: Representative evaluations or documented production experience show that available systems could not perform the substantive work of a professional screenwriter or writers' room without substantial human writing.
contradiction_condition: A documented production or credible professional evaluation demonstrates that AI could perform that work to usable standards without substantial human writing.
measurement_requirements: Identify the system, writing assignment, human contributions, output quality and production requirements. Distinguish assistance from replacement.
source_requirements: Dated production records, disclosed demonstrations or evaluations involving professional screenwriters. Missing reports of replacement cannot establish inability.
