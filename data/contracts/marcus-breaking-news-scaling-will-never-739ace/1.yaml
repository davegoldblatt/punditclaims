evaluator_interpretation:
  - This assessment concerns the supplied driverless-car proposition, not the separate prediction about LLM reliability.
  - I read 'just demos' as demonstration or trial activity without routine public passenger service.
  - For the ongoing state described immediately before publication, I use the latest completed calendar quarter, January through March 2024.
  - An operating public driverless service would contradict the necessary premise of this causal claim, without proving that generalization difficulties are unimportant.
support_condition: Driverless passenger operations remained demonstration-only, and technical evidence identifies poor generalization as the reason they had not become routine services.
contradiction_condition: A routine public passenger service was operating without a human driver during the target period.
measurement_requirements: Distinguish actual passenger operations from permits, announcements, employee testing, and demonstrations. Limited geographic coverage does not by itself make a service a demo.
source_requirements: Contemporaneous deployment records, regulatory filings, or operator disclosures; technical evidence would additionally be needed to establish the proposed cause.
