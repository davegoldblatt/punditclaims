evaluator_interpretation:
  - The claim concerns Altman's rise through the post date, not his subsequent career.
  - The ordinary reading is that flattering media portrayals contributed to appointments, investment, institutional backing, or public influence. They need not have been the main cause.
  - The existence of praise establishes the proposed mechanism's first step, but does not by itself establish its effect.
support_condition: Documented decisions or credible causal research show that media portrayals of exceptional ability contributed to Altman's acquisition of power.
contradiction_condition: Evidence tracing the relevant decisions and influence shows that the alleged media contribution did not occur. Evidence of other causes alone is insufficient.
measurement_requirements: Trace particular coverage to consequential decisions or changes in influence, distinguishing media effects from existing relationships and accomplishments.
source_requirements: Contemporaneous coverage, decision-maker accounts, institutional records, or credible causal research.
