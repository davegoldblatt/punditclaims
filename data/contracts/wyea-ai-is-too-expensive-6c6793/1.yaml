assessment_axis: historical_observation
explicit_source_elements:
  - Meta
  - at least $125 billion in capex in 2026
  - to this point
  - not shown any actual, real growth in its revenue from AI
  - those increases in conversion don’t mean actual revenue
evaluator_interpretation:
  - The capex statement concerns guidance announced by publication, not expenditure already incurred.
  - The revenue statement concerns demonstrated growth attributable to AI. Conversion improvements alone do not establish the amount of additional revenue.
  - Use January–March 2026, the latest reported quarter before publication, for the ongoing revenue observation. Examine disclosures available through May 19.
  - AI product sales are relevant counterevidence, but revenue from hardware containing AI does not by itself isolate revenue caused by AI.
  - The single metric_scope describes the disputed revenue component; the separate capex guidance has its own evidence scope.
support_condition: Contemporaneous guidance has a lower bound of at least $125 billion, and sufficiently complete disclosures establish that Meta had demonstrated no revenue growth attributable to AI under a consistent definition.
contradiction_condition: Contemporaneous guidance falls below the stated minimum, or Meta had demonstrated positive revenue growth attributable to AI, beyond conversion or engagement improvements alone.
measurement_requirements: Separate actual revenue from annualized run rates, advertising performance measures, and hardware sales whose AI contribution is not isolated.
source_requirements: Meta filings and earnings disclosures available by publication; later evidence may clarify that historical period but cannot substitute later revenue.
