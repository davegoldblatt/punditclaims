assessment_axis: forecast_outcome
explicit_source_elements:
  - self-learning “agent” that teaches itself stuff
  - nobody will do it
  - The entire premise of this nonsense
evaluator_interpretation:
  - Assess the forward-looking prediction, rather than separately grading the accompanying historical assertions.
  - "Read the agent in the context of AI 2027: an agent that repeatedly learns from its own work and improves its ability to perform research and engineering tasks."
  - A narrow demonstration of self-modifying code is relevant but does not automatically establish the broader capability described in the scenario.
  - Zitron gives no deadline. The title AI 2027 does not turn his prediction that nobody will do it into a forecast ending in 2027.
support_condition: A decisive impossibility result covering the specified capability could support the prediction. Failure to observe a qualifying agent during a finite search period cannot establish that nobody will ever build one.
contradiction_condition: A publicly documented agent demonstrates repeated autonomous learning from its own work, with independently verified, transferable improvements in research or engineering capability that meet the contextual reading.
measurement_requirements: Document successive learning cycles, retained improvements on held-out tasks, human intervention, and whether gains come from learning rather than additional attempts or a stronger externally supplied model.
source_requirements: A technical account and independent evaluation or replication. A developer's announcement alone is insufficient for a decisive resolution.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted when a dated, independently evaluated demonstration satisfies the contradiction condition. Do not resolve as supported merely because no qualifying demonstration has been found.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The speaker does not define self-learning or specify which AI 2027 agent he means.
  - Ordinary self-modification and the broader learning capability in AI 2027 are materially different possible readings.
  - No deadline or numerical capability threshold is supplied.
