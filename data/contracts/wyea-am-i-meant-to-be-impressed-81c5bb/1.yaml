explicit_source_elements:
  - both Microsoft and Amazon
  - I’d argue Google too, but we don’t know its AI revenues
  - heavily-dependent
  - unsustainable
  - Anthropic and OpenAI
evaluator_interpretation:
  - The firm assertion concerns Microsoft's and Amazon's AI revenues, not their entire diversified businesses.
  - Treat the Google parenthetical as explicitly tentative and do not impose the same firm commitment on it.
  - Read heavy dependence as customer concentration large enough that losing the labs' spending would materially reduce AI revenue. Do not invent a precise majority threshold.
  - Read 'unsustainable' as current operations requiring continued outside financing, rather than a prediction of inevitable failure.
  - Use January–March 2026, the latest completed reporting quarter discussed before the post, for the ongoing-state observation.
  - Treat the concentration assertion as an estimate because the context extrapolates customer spending and compares it with company revenue run rates.
support_condition: Matched-period customer revenue records establish material dependence for both Microsoft and Amazon, and the labs' financial records establish that current operations require continued outside financing.
contradiction_condition: Matched-period records show that a named provider's AI revenues have little reliance on the labs, or that the labs fund their ongoing operations sustainably without continued outside financing. Corporate-wide diversification alone does not contradict AI-business dependence.
measurement_requirements: Measure customer-derived AI revenue against the same provider's total AI revenue on a consistent period and run-rate basis. Separate direct compute purchases, model resale and revenue-sharing arrangements. Test operating financing needs separately from valuation changes, financing proceeds and purchase commitments.
source_requirements: Provider customer-concentration disclosures or independently verified billing records, plus lab financial statements and cash-flow records. Contract backlog and supplier partnerships are contextual unless tied to recognized revenue.
