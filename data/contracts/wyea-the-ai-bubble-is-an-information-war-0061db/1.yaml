assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI raised around $42bn
  - in 2025 alone
evaluator_interpretation:
  - Raised means completed primary investment funding received by OpenAI during calendar 2025. The surrounding discussion explicitly distinguishes completed funding from commitments.
  - Secondary shareholder sales, undrawn borrowing capacity, and uncompleted investment commitments are excluded.
  - "The funding basis is company-reported transaction amounts: the surrounding post cites investor disclosures for the completed funding tranches. No GAAP or IFRS income measure is implied."
  - Around is interpreted as within 5% of $42 billion. This tolerance is supplied by the evaluator, not the speaker.
support_condition: Completed 2025 primary investment funding totals approximately $42 billion, within the stated 5% tolerance.
contradiction_condition: A sufficiently complete record establishes completed 2025 funding outside that interval, or shows that reaching the interval requires counting secondary transactions or unfunded commitments.
measurement_requirements: Identify completed funding amounts and dates, include syndicated investors once, and distinguish company proceeds from shareholder sales and future commitments.
source_requirements: Investor or company completion disclosures, preferably reconciled across the year's funding rounds.
