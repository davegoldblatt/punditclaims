ambiguity_flags:
  - AI businesses is a broad, undefined population.
  - Demand may mean new customers or greater usage by existing subscribers.
  - Money lost may mean gross contribution, operating loss or net loss.
  - Engagement and customer profitability have no specified measures.
  - A literal universal reading is stronger than the general-pattern reading used here.
