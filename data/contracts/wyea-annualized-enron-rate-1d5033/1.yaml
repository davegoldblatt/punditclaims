assessment_axis: causal_assessment
explicit_source_elements:
  - in AI
  - the more demand you get, the more money you lose
  - your most engaged customers are also your least-profitable
evaluator_interpretation:
  - Read this as a claimed general economic pattern among AI service businesses in the surrounding discussion, not merely a claim that some fixed-price plans can lose money.
  - Demand can rise through more paying customers or through more usage by existing customers; those mechanisms must be distinguished.
  - Read least-profitable as lowest customer contribution after the costs of serving that customer. Company-wide losses are a separate measure.
  - "Use January–September 2026 as the contextual period: the passage describes Harvey's usage and margin changes during that year through its pre-post recovery."
  - This is a qualitative causal claim across businesses, not a specified monetary amount for one company.
support_condition: Representative causal evidence shows that additional demand generally increases AI businesses' losses and that their most engaged customers have the lowest contribution after serving costs, accounting for pricing, model mix and other cost changes.
contradiction_condition: Representative evidence shows that additional demand generally improves contribution or reduces losses, or that the most engaged customers are not generally the least profitable. Isolated exceptions are insufficient to settle the general pattern.
measurement_requirements: Separate customer acquisition from usage intensity; gross contribution from operating or net losses; and usage effects from changes in prices, model costs, research spending and fixed investment. Customer-level evidence is needed for the engagement ranking.
source_requirements: Company operating records, customer-level margin studies or credible research that identifies the effect of additional demand. Aggregate losses or isolated anecdotes alone are insufficient.
