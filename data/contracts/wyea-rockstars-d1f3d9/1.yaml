evaluator_interpretation:
  - The reference to Altman's history and continual conduct makes this a retrospective allegation through publication, with no stated starting date.
  - Lying means knowingly making false or materially misleading statements. Optimism, uncertainty, or an unsuccessful prediction alone does not establish lying.
  - The media allegation is read as a broad pattern of insufficient scrutiny, rather than a literal assertion that no journalist ever questioned Altman.
  - The claim concerns progress toward superintelligence. Allegations about governance or unrelated conduct cannot substitute for evidence about that subject.
support_condition: Multiple identifiable progress statements are shown to have been knowingly false or materially misleading when made, and representative coverage shows a broad failure to scrutinize them.
contradiction_condition: A sufficiently complete record refutes the alleged repeated knowing misrepresentation, or representative coverage establishes meaningful scrutiny contrary to the alleged broad media pattern.
measurement_requirements: Compare dated statements with contemporaneous internal or independent evidence and evidence of Altman's knowledge. Assess media coverage across a defined, representative sample.
source_requirements: Original statements, authenticated records or corroborated firsthand testimony, and contemporaneous reporting. Allegations and rebuttals must remain distinguished from established findings.
