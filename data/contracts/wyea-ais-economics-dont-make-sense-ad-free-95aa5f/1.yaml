assessment_axis: causal_assessment
explicit_source_elements:
  - every single AI service you use
  - subsidized compute
  - every single service is losing money as a result
evaluator_interpretation:
  - The context concerns paid generative-AI services. The ordinary reading is that their subscription receipts fail to cover serving-compute costs, causing service-level losses.
  - A company-wide loss caused by research, training, marketing, or other expenses does not establish this claim.
  - I use January–March 2026, the latest completed calendar quarter before the post, for the ongoing financial state. The speaker supplied no reporting period.
  - No common accounting basis or definition of loss is supplied. The contract therefore records an unknown accounting basis.
support_condition: Comparable service-level revenue and actual serving-compute expenses show that every relevant service subsidized compute and consequently incurred losses during the target period.
contradiction_condition: A relevant service demonstrably covered its serving-compute costs from customer receipts, or earned a service-level profit, during the target period.
measurement_requirements: Separate subscription revenue, actual inference expenses, other delivery expenses, and company-wide expenses. Distinguish average subscriber economics from unusually heavy users and distinguish API retail prices from providers' compute expenses.
source_requirements: Prefer service-level accounts or company disclosures with defined cost allocations. Identified financial reporting may supplement them; financing and revenue growth alone cannot settle profitability.
