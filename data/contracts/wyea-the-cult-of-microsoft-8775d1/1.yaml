assessment_axis: forecast_outcome
explicit_source_elements:
  - Google now claims that 25% of its code is written by AI
  - I anticipate
  - Microsoft isn't far behind
evaluator_interpretation:
  - "'I anticipate Microsoft isn't far behind' is an expectation. My plain reading is that Microsoft's share of code written by AI was, or would soon be, close to Google's claimed 25%."
  - "'Not far behind' means roughly 20% or more by Microsoft's own public account, within a near-term window of about a year after the post."
  - He set no deadline. The claim can be settled by a dated Microsoft disclosure that meets the rule below.
support_condition: A Microsoft executive or Microsoft disclosure, within about a year of the post, puts Microsoft's share of code written by AI at about 20% or more.
contradiction_condition: A Microsoft executive or disclosure in that window puts the share well below Google's figure, for example under about 10%.
measurement_requirements: A Microsoft-stated share of its code written or generated by AI. Google's figure is 'new code'; Microsoft's may use a different base, and this is noted.
source_requirements: Statements by Microsoft executives or Microsoft disclosures, reported by primary or reputable news sources.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled once Microsoft's CEO or another senior Microsoft executive publicly states, within about a year of 2024-11-01, a share of Microsoft code written by AI of roughly 20% or more (supported) or under roughly 10% (contradicted).
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Isn't far behind' is present tense. If it is read strictly as Microsoft's state in November 2024, no Microsoft figure from that time exists and the claim would be unresolved."
  - "'Not far behind' sets no number; I use roughly 20% or more."
  - Google measured 'new code' and Nadella spoke of code 'inside of our repos', so the two bases differ.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
