assessment_axis: forecast_outcome
explicit_source_elements:
  - By the end of 2027
  - big tech
  - $2 trillion
  - AI capex
  - with very little to show for it
evaluator_interpretation:
  - The preceding sentence identifies Microsoft, Alphabet/Google, Amazon and Meta.
  - Read $2 trillion as a cumulative spending milestone, not an annual spending rate. The cumulative starting date is unspecified.
  - Read 'very little to show for it' as small identifiable financial returns relative to AI investment. The surrounding discussion concerns revenue and profitability, not simply whether products exist.
  - The claim supplies neither a numerical return threshold nor a consistent definition of AI capital expenditure.
  - Treat the projected spending figure as an estimate. Do not count all corporate capital expenditure as AI expenditure without an allocation.
support_condition: By December 31, 2027, comparable records establish at least $2 trillion of cumulative AI capital expenditure by the four named companies, together with clearly small attributable financial returns relative to that investment.
contradiction_condition: Comparable records establish cumulative AI capital expenditure below the stated milestone at the deadline, or substantial attributable financial returns that clearly defeat the ordinary reading of 'very little'. Borderline returns cannot be classified using an invented cutoff.
measurement_requirements: Reconcile calendar periods, finance leases, cash purchases and shared infrastructure. Identify the cumulative starting date and AI allocation. Compare realized AI revenue and operating results with investment over appropriate periods; do not substitute revenue run rates for realized revenue.
source_requirements: Company filings and disclosures, supplemented by transparent estimates where AI allocations are unavailable. Guidance and purchase commitments cannot establish realized expenditure.
metric_scope:
