  - of Microsoft's operational capacity
evaluator_interpretation:
  - "Plain reading: at the time of the post, capacity Microsoft built for or allocated to OpenAI made up well over half (a 'vast majority') of the compute capacity Microsoft actually had running."
  - He named no measure. Capacity could mean power (MW/GW), GPUs, or the dollar value of in-service infrastructure. Any of these would count if a credible source gave it.
  - He describes a current state and names no period. I use the period from the start of 2026 to the post date (2026-05-19), the latest window public evidence could describe.
support_condition: A Microsoft disclosure or credible independent reporting showing that OpenAI workloads used or held well over half of Microsoft's operational compute capacity (by power, GPUs, or in-service infrastructure value) around early-to-mid 2026.
contradiction_condition: A Microsoft disclosure or credible independent reporting showing that OpenAI accounted for half or less of Microsoft's operational compute capacity around early-to-mid 2026.
measurement_requirements: Share of Microsoft's in-service compute capacity (MW, GPUs, or in-service asset value) allocated to OpenAI, at or near the post date.
source_requirements: Microsoft filings or earnings calls, or reputable independent reporting or analyst measurement that names the share. The speaker's anonymous sources cannot count as evidence.
