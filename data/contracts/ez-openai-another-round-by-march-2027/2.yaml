assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI
  - will almost-certainly have to raise another round of funding
  - by March 2027
  - likely at a similar scale to its $122 billion round
  - With its IPO likely delayed — if it ever happens — until 2027
  - post dated 2026-08-18
evaluator_interpretation:
  - We read 'almost-certainly' as high confidence about a definite outcome, which policy scores. The size clause ('likely at a similar scale') is hedged and is not scored.
  - We read 'by March 2027' as on or before 2027-03-31.
  - "'Have to raise' is a forecast of need. Needing a round does not guarantee raising one, so a missing round alone would not contradict it."
  - We count a round as raised when OpenAI announces it and an investor discloses a signed agreement. Need can be shown by OpenAI's own statements or financial disclosures.
support_condition: By 2027-03-31, evidence shows that OpenAI needed another funding round, for example because it raised one and said it needed the money.
contradiction_condition: By 2027-03-31, evidence shows that OpenAI did not need another funding round, for example because its disclosures show it could cover its costs without one.
measurement_requirements: OpenAI's own announcements and disclosures, labelled as company disclosures, and investors' disclosures of signed agreements.
