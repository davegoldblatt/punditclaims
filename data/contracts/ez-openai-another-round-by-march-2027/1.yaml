assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI
  - will almost-certainly have to raise another round of funding
  - by March 2027
  - likely at a similar scale to its $122 billion round
  - With its IPO likely delayed — if it ever happens — until 2027
  - post dated 2026-08-18
evaluator_interpretation:
  - We read 'almost-certainly' as high confidence about a definite outcome, which policy scores. The size clause ('likely at a similar scale') is hedged and is not scored.
  - We read 'by March 2027' as on or before 2027-03-31.
  - "'Have to raise' includes need as well as raising. Public evidence can show whether a round was raised. It can show need only as far as OpenAI says so."
support_condition: Between 2026-08-18 and 2027-03-31, OpenAI raised another funding round, and evidence shows it needed to.
contradiction_condition: By 2027-03-31, OpenAI had raised no new funding round.
measurement_requirements: A round counts when OpenAI announces it and an investor discloses a signed agreement. Need counts only as OpenAI's own stated need, labelled as a company disclosure.
