  - a novel independent design
  - meet the requirements
  - design to used with only one hand
evaluator_interpretation:
  - In context, they refers principally to contemporary generative image systems given unfamiliar design briefs.
  - Often means a recurring tendency, not an invented requirement that more than half of all outputs fail.
  - Success requires both meaningful novelty and compliance with the brief's functional constraints.
  - The target is the latest publicly documented performance of systems available before publication; no fixed reporting interval or starting date is supplied.
support_condition: Repeated evaluations across relevant design briefs show substantial recurring failures to produce both novel and functionally compliant designs.
contradiction_condition: Representative evaluations show reliable novel, compliant designs and establish that the alleged failures are isolated or unrepresentative.
measurement_requirements: Record model versions, prompts, all sampled outputs, sampling denominators, and separate assessments of novelty and functional compliance.
source_requirements: Primary design evaluations or reproducible demonstrations involving contemporary systems. Selected examples alone cannot establish a general frequency.
