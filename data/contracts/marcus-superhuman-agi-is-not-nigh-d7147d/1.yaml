assessment_axis: forecast_outcome
explicit_source_elements:
  - AGI superior to the smartest individual humans
  - would not arrive by the end of 2025
  - any intellectual work that any human can do
  - at least one piece of intellectual work that the very best humans can do that AGI can’t
evaluator_interpretation:
  - "Use Marcus's explicit explanation: superiority must extend across human intellectual work, rather than mean a higher average score on selected tasks."
  - Assess demonstrated practical capability using public evaluations of systems available by the deadline. Benchmark failures are evidence of capability gaps, not mathematical proof of impossibility.
  - The wager amount is background, not a claim about company finances.
support_condition: Evaluations covering the late-2025 frontier identify intellectual tasks that humans can solve but the leading AI systems still cannot reliably perform, with no demonstrated system closing that gap by the deadline.
contradiction_condition: A system available by December 31, 2025 demonstrates general intellectual capability meeting or exceeding the best humans across tasks, including independently tested unfamiliar tasks.
measurement_requirements: Human-solvable tasks, documented model versions and evaluation conditions, and coverage of late-2025 systems. Success on selected benchmarks alone does not establish the universal threshold.
source_requirements: Prefer independent benchmark measurements and technical reports. Distinguish developer-reported results from independently verified results.
metric_scope: null
original_horizon: by the end of 2025
horizon_interval:
  start: 2024-04-12
  end: 2025-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A verified qualifying system arriving before the deadline could contradict the forecast early. Failures before the deadline cannot establish non-arrival early.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No agreed operational definition of AGI.
  - No specified time, compute, or reliability allowance for performing a task.
  - Public evaluations cannot exclude undisclosed systems.
retrospective_or_prospective: retrospective
