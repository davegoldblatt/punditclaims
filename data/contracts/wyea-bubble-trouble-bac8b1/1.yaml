early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - More compute could refer to serving capacity, training scale or all development computation.
  - Hallucination definitions differ across tasks.
  - Many businesses has no numerical threshold.
  - The dwindling resource could refer to compute capacity or, less directly, usable data.
  - Destroy is not operationally defined.
