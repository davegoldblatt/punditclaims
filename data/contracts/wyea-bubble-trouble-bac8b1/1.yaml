assessment_axis: causal_assessment
explicit_source_elements:
  - today's models are rife with hallucinations
  - actively dangerous for many businesses
  - the only way to have fewer hallucinations
  - give the models more compute power
  - a dwindling resource
  - AI is actively helping to destroy
evaluator_interpretation:
  - Assess methods and model risks documented before April 4, 2024.
  - The ordinary reading of more compute power is increased model-processing capacity or computational scale, not every calculation involved in developing an alternative method.
  - The exclusive claim fails if a method improves factuality through changes to an existing model that can be incorporated without increasing its serving computation.
  - Business danger means a material risk from incorrect outputs in consequential workflows, not that every integration causes harm.
  - Treat the hallucination-risk, mitigation and resource-depletion clauses separately.
support_condition: Evidence establishes substantial hallucination risks in business workflows, necessity of increased processing capacity for reducing them, and an identifiable resource decline caused by AI.
contradiction_condition: A demonstrated alternative reduces hallucinations without increasing the deployed model's processing capacity, or evidence directly refutes another asserted causal link.
measurement_requirements: Compare factuality on the same task and model, disclose implementation and preparation costs, and distinguish benchmark improvements from general reliability. Resource depletion requires a defined resource and measured trend.
source_requirements: Primary research available before the post, with methods and limitations; business-risk evidence must concern consequential uses.
