assessment_axis: causal_assessment
explicit_source_elements:
  - Every single
  - “vibe coding is the future,” “the power of AI,” and “AI job loss” story
  - perpetuates a myth
  - will only lead to more regular people getting hurt
  - when the bubble bursts
evaluator_interpretation:
  - The ordinary reading is that the named categories of coverage uniformly contribute to additional harm to ordinary people following the collapse.
  - The surrounding discussion makes financial harm the principal testable meaning of hurt.
  - Preserve the universal every-single and exclusive only language; evidence about some harmful stories cannot establish the entire claim.
  - The triggering collapse is the broad, US-centered AI boom described in the surrounding discussion, not any isolated regional sell-off.
  - This is a causal claim with a future conditional consequence. Outcome scoring is withheld until its collapse condition is established.
support_condition: An established collapse of the relevant AI boom, followed by credible evidence that the specified coverage uniformly caused additional financial harm. Selected examples or correlations alone cannot establish the universal claim.
contradiction_condition: After the triggering collapse, a credible counterexample shows that a qualifying story had no harmful causal effect or instead reduced the relevant harm. The coverage and its consequences must be identified.
measurement_requirements: Define and sample the named coverage categories, measure audience exposure and ensuing decisions, and trace subsequent financial outcomes. Separate effects of coverage from the collapse itself and other causes.
source_requirements: Require evidence establishing the collapse condition and credible causal evidence about coverage and audience outcomes. Neither positive product claims nor reports of market losses alone suffice.
