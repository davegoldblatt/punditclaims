explicit_source_elements:
  - One more dancing robot
  - wouldn’t tell us much
  - close to (say) a real general-purpose domestic robot
  - the robotics community would be rightly skeptical
  - if that’s all that we saw
evaluator_interpretation:
  - The surrounding discussion identifies the September 30, 2022 presentation.
  - The antecedent requires a showing limited to dancing or comparable physical spectacle, without task-oriented demonstrations. Prerecorded demonstrations count as things the audience saw.
  - Community skepticism means a broad pattern of qualified roboticists questioning proximity to general-purpose household capability.
  - Rightly is an evaluative word and is not independently scored.
  - No separate deadline for expert reactions is supplied.
support_condition: Establish that the presentation showed only dancing or comparable physical spectacle, then establish a broad pattern of expert skepticism about readiness for general-purpose domestic work.
contradiction_condition: Establish that same antecedent, then show that qualified roboticists broadly regarded the display as persuasive evidence of near-term general-purpose domestic capability.
measurement_requirements: A reliable record of everything demonstrated and attributable robotics-community assessments of domestic readiness.
source_requirements: Prefer the presentation itself, supplemented by contemporaneous reporting and experts' direct statements.
