evaluator_interpretation:
  - In the surrounding discussion of password hashing, original credentials means recoverable usernames and passwords, including reversibly encrypted passwords. It does not mean session cookies.
  - Assess the technical assertion about retention. The phrase insanely dangerous is an evaluative description without a separate measurable threshold.
  - Use the launch-period implementation from April 23 through May 13, the latest public operating period described by the post.
support_condition: Implementation evidence shows that Rabbit retained recoverable original app passwords for subsequent operations.
contradiction_condition: Implementation evidence shows that Rabbit retained session cookies or tokens instead of original app passwords, allowing subsequent operations without keeping those passwords.
measurement_requirements: Separate transient password entry from persistent password storage, and distinguish passwords from session tokens.
source_requirements: Source-code inspection, a security assessment or authenticated implementation documentation covering the launch period.
