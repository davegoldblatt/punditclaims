evaluator_interpretation:
  - "The ordinary reading concerns factual answers: contemporary LLMs produce substantial amounts of correct information while making recurring factual errors."
  - It does not require every model to fail equally often, or imply that most answers in every task are wrong.
  - No arbitrary percentage threshold is added to 'often' or 'routinely'.
  - "For this ongoing observation, use the latest complete month before publication through the post date: 2025-04-01 to 2025-05-05. The surrounding discussion explicitly refers to recent o3 results."
  - This assesses the observed reliability claim, not the proposed causal explanation for individual hallucinations.
support_condition: Contemporaneous factual evaluations of multiple current LLMs show substantial correct-answer rates alongside recurring, non-isolated factual errors.
contradiction_condition: Broad, matching evaluations show that factual errors are exceptional, or that correct answers are too rare to support the claimed combination.
measurement_requirements: Use factual accuracy and hallucination results with identifiable models and tasks. Do not equate an error rate on a difficult benchmark with the error rate of all real-world usage.
source_requirements: Dated primary benchmark results or technical evaluations available by the evaluation cutoff and measuring the target period.
