explicit_source_elements:
  - gross margin of at best negative 25%
  - 25% of their rate limit
  - 75% gross margin on their tokens
  - current subsidies
evaluator_interpretation:
  - This is a claim about the stated model's arithmetic, not a disclosure of actual company margins.
  - A 75% API gross margin implies serving costs equal to 25% of API-price-equivalent consumption.
  - At best means that the highest modeled subscription margin among the tested tiers is no greater than -25%.
  - Utilization is assumed to scale API-equivalent consumption proportionally, with a constant workload mix.
  - The target is the current month through publication, June 1–15, 2026.
support_condition: Applying the assumed serving-cost ratio to 25% utilization produces margins of -25% or lower across the cited tiers.
contradiction_condition: Under the same model and inputs, at least one cited tier produces a margin above -25% at 25% utilization.
measurement_requirements: For each tier, obtain monthly subscription revenue and maximum monthly API-equivalent usage. Compute gross margin as revenue minus modeled serving cost, divided by revenue.
source_requirements: The original margin model or a transparent reproduction of its inputs. Actual company margins cannot substitute for the expressly assumed 75% margin.
