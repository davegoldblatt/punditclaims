explicit_source_elements:
  - even now
  - Twitter’s revenue and credibility burns
  - buying 10,000 GPUs
  - for a mysterious generative AI product
evaluator_interpretation:
  - The claim describes a recent purchase or purchase commitment for approximately 10,000 GPUs, rather than requiring proof that every unit had been delivered.
  - A mysterious product means that its intended application had not been publicly explained.
  - Credibility decline means documented loss of confidence among advertisers or institutional users. It does not require unanimous distrust.
  - The revenue clause means a decline in Twitter's actual revenue, not merely a reduction in forecast revenue or advertiser numbers.
  - For the ongoing financial state, I use March 2023, the latest complete calendar month before publication. The overall target period also includes April through the post date for the purchase and trust-related events.
  - The surrounding post links to press reporting about revenue. I therefore treat its financial basis as an estimate, without assuming GAAP figures.
  - The word 'while' joins contemporaneous observations; it does not make this a conditional forecast.
support_condition: Reliable reporting establishes the approximate GPU purchase and intended generative AI use by April 13, 2023, with its application still undisclosed; comparable revenue evidence establishes the financial decline for the selected reporting period; and documented actions or statements establish lost confidence in Twitter.
contradiction_condition: Reliable evidence disproves the reported purchase, materially changes its scale or intended use, or establishes that the accompanying revenue or credibility decline did not occur under the stated reading.
measurement_requirements: Distinguish orders from deliveries, approximate counts from exact counts, and generative AI development from unrelated computing. Revenue comparisons must cover the same company, revenue category, reporting period, and basis. Advertiser spending by a selected group cannot establish total company revenue.
source_requirements: Prefer procurement records, company disclosures, comparable financial records, and direct statements by affected organizations. Original reporting or clearly attributed secondary reporting may establish a private purchase when primary records are unavailable.
