assessment_axis: forecast_outcome
explicit_source_elements:
  - not just the models
  - the scientific literature itself
  - will be infected
evaluator_interpretation:
  - Infected means factual or citation errors from OpenAI Deep Research being incorporated into scientific publications as substantive content.
  - The surrounding text makes erroneous contamination the ordinary reading; harmless assistance or a disclosed outline alone does not satisfy it.
  - An evaluation publishing labelled examples of errors is not itself an instance of contamination.
  - This sentence supplies no minimum prevalence, so one authenticated contamination case can establish the literature component.
support_condition: At least one published scientific assertion or reference is demonstrably erroneous and traceable to OpenAI Deep Research output incorporated into the publication.
contradiction_condition: Decisive evidence rules out the predicted contamination pathway. Clean publications or failure to find a case by an unstated deadline are insufficient.
measurement_requirements: Verify the error, the publication's treatment of it as scientific content, and the provenance linking it to OpenAI Deep Research.
source_requirements: Published paper plus author records, generation logs, a publisher investigation or an independent audit identifying the product and transferred error.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: One authenticated, dated publication case meeting the support condition can settle the literature-contamination forecast early.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Infected is a metaphor without a stated prevalence threshold.
  - Scientific literature may include preprints.
  - Mere inclusion of generated material differs from incorporation of erroneous claims.
retrospective_or_prospective: retrospective
