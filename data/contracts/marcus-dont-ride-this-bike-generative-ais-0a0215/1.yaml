support_condition: Verified interaction sequences show that clear feedback about the relevant parts is followed by images retaining the specified errors across the three examples or closely comparable repeated tests.
contradiction_condition: The complete interaction records show that the specified corrections were successfully applied, or directly comparable testing establishes that the apparent failures resulted from misdescription or scoring errors.
measurement_requirements: Compare each image before and after feedback. Preserve the conversation sequence and distinguish correcting the named part from unrelated visual changes or textual assurances.
source_requirements: Dated interaction transcripts paired with inspectable images. Custom automated feedback systems must be distinguished from ordinary ChatGPT interaction.
