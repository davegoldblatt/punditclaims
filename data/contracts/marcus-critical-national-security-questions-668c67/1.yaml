  - "'For all of us' expresses the decision's public consequences, not a measurable claim that Meta legally governed everyone."
  - The context leaves unclear whether 'entirely up to them' excludes consultation or only binding public authorization.
  - "'Open-source' has both colloquial and formal licensing meanings."
