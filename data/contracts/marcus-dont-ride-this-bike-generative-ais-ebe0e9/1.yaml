explicit_source_elements:
  - errors of these sorts remain common
  - default, first answers
  - often reflect a lack of full comprehension
  - sometimes of language, sometimes of the world
evaluator_interpretation:
  - Errors of these sorts means failures involving composition, relations, counts, and inclusion or omission of specified objects or parts.
  - Common means recurring substantial failures across systematic tests, rather than isolated examples; no exact percentage is attributed to Marcus.
  - Comprehension is read behaviorally as satisfying the stated constraints. The assessment does not infer an internal mental state.
  - Current refers to systems available by December 8, 2024. With no standard quarterly research reporting period, the observation window is the latest reporting year to date.
  - Initial outputs means outputs before corrective interaction or selection of the best result.
support_condition: Systematic evaluations of unselected initial outputs show substantial recurring errors on the discussed kinds of compositional constraints.
contradiction_condition: Representative evaluations show that such errors are rare in unselected initial outputs across those tasks.
measurement_requirements: Use human-validated prompt adherence, disclose sampling and prompt rewriting, and avoid treating benchmark failure rates as the prevalence across all user requests.
source_requirements: Primary evaluations of contemporary image generators with disclosed generation and scoring procedures.
