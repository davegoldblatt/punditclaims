evaluator_interpretation:
  - Unreliable means that factual and reasoning errors remain substantial enough to require checking outputs. It does not mean that models never answer correctly.
  - The following sentences identify hallucination and reasoning as examples, but do not establish an exhaustive list of Marcus's longstanding concerns.
  - Supporting the entire proposition requires identifying that broader list and establishing that none of its problems had been solved.
  - No measurement period is specified. I use the six-month retrospective named in the title, ending on publication, as the reporting window for the continuing state.
support_condition: Contemporaneous evaluations show persistent reliability problems, and an identifiable inventory of the longstanding basic issues remains unsolved.
contradiction_condition: Evidence establishes dependable factual and reasoning performance across the claimed scope, or establishes that at least one identifiable longstanding basic issue had been solved.
measurement_requirements: Distinguish benchmark improvements from solving a general problem. Match each historical concern to an appropriate evaluation.
source_requirements: Use independent evaluations or technical disclosures for outcomes. Marcus's earlier statements may identify his concerns but cannot establish that those concerns remained valid.
