evaluator_interpretation:
  - The surrounding paragraph attributes the figures to reporting about 2025 revenue, so assess the claimed composition of that estimate.
  - The plain reading is that approximately $10 billion of the same $13 billion Microsoft AI revenue total is attributable to OpenAI purchasing Azure compute.
  - Both figures must use the same period, recognition basis and revenue definition.
  - The post also invokes Microsoft's January annualized run rate. Do not silently substitute that run rate for the reported full-year estimate.
support_condition: Accessible reporting or company records establish approximately $10 billion of OpenAI Azure compute revenue within the same approximately $13 billion Microsoft AI revenue estimate for 2025.
contradiction_condition: Comparable records establish a materially different OpenAI compute contribution, or show that the two cited figures cannot form the claimed same-period revenue breakdown.
measurement_requirements: Separate Azure compute revenue from revenue-sharing payments, investment, credits and other transactions. Distinguish Microsoft's recognized revenue from OpenAI cash payments and commitments. Match full-year estimates with full-year estimates.
source_requirements: Microsoft or OpenAI financial records, or independently accessible reputable reporting that identifies the source and scope of both estimates.
