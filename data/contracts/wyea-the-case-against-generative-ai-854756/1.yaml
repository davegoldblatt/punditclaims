assessment_axis: historical_observation
explicit_source_elements:
  - some people have lost jobs to AI
  - just not the white collar workers
  - software engineers
  - the career paths that the mainstream media and AI investors would have you believe
evaluator_interpretation:
  - Have lost describes cumulative displacement before publication, with no stated starting date.
  - The plain reading excludes salaried white-collar workers, including human-resources and administrative employees, from those already displaced.
  - I distinguish actual job loss from reassignment, attrition, hiring freezes, and predictions of future losses.
  - The surrounding discussion disputes displacement at scale and acknowledges losses among contractors. The categorical sentence is stronger than that surrounding argument; I assess that sentence without treating it as a claim of mass unemployment.
support_condition: Reliable occupational evidence shows actual AI-caused displacement confined to the acknowledged categories, with none among the excluded white-collar workers or software engineers.
contradiction_condition: Credible records identify actual AI-linked job losses among salaried white-collar workers or software engineers before publication.
measurement_requirements: Identify the affected occupation, actual employment loss, timing, and the evidence connecting the loss to AI. Separate individual displacement from net company employment.
source_requirements: Prefer employer records and employee-representative reports. Use attributed reporting for executive statements when a readable original record is unavailable.
