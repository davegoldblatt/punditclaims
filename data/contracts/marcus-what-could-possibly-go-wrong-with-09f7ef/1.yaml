assessment_axis: forecast_outcome
explicit_source_elements:
  - if they have direct access to user devices
  - the risks of them getting hacked will increase
  - the spoils of war for the attackers will increase
evaluator_interpretation:
  - Direct access means OpenAI software can operate on a user's computer, within whatever permissions the user grants.
  - The comparison is with otherwise comparable software without device access. Both compromise risk and the resources accessible to attackers must increase.
  - The surrounding discussion concerns OpenAI software and its users, but 'them getting hacked' could also mean OpenAI's central infrastructure.
support_condition: After device access becomes available, comparative security evaluations or documented attacks show that this access creates additional compromise opportunities and increases attackers' access to valuable user resources.
contradiction_condition: Comparable evaluations show that device access does not increase compromise opportunities or attacker access to valuable resources under the relevant deployment conditions.
measurement_requirements: Separate additional technical attack paths from attack frequency, and distinguish compromise of user-facing software from intrusion into OpenAI infrastructure.
source_requirements: A dated product disclosure establishing device access, followed by primary security evaluations or documented incidents.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A reproducible comparison establishing both predicted increases could settle the claim without a deadline. A product launch or isolated vulnerability alone does not settle the entire comparison.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or magnitude of increase.
  - The baseline deployment and its safeguards are unspecified.
  - Getting hacked may refer to OpenAI infrastructure, its software, or users' devices.
retrospective_or_prospective: retrospective
