  - chatbots are neither reliable nor truthful
  - don’t really grasp things like human psychology
evaluator_interpretation:
  - In the surrounding discussion of health advice, read reliable and truthful as practically dependable and factually trustworthy, not as requiring perfect answers or intentional honesty.
  - The speaker explicitly acknowledges good advice elsewhere in the passage, so this is not a claim that every chatbot answer is false.
  - Operationalize grasping human psychology as robust reasoning about people's beliefs and psychologically sensitive situations. This does not test consciousness or subjective understanding.
  - Assess publicly deployed general-purpose LLM chatbots represented by contemporary GPT models, without extending findings to every possible chatbot.
  - "Use January 1 through April 4, 2023: the latest completed quarter and immediately preceding days for the ongoing state described."
support_condition: Contemporaneous evidence shows material factual or reasoning failures and fragile psychological reasoning that prevent dependable use for the sensitive advice discussed.
contradiction_condition: Representative contemporary evaluations establish dependable factual and psychological performance across relevant variations. Isolated successes alone do not contradict a lack of dependability.
measurement_requirements: Contemporaneous model disclosures and factual or psychological evaluations. Distinguish narrow task accuracy from robust understanding and practical clinical competence.
source_requirements: Primary model evaluations and original research available by the post, with model versions identified and favorable findings retained.
