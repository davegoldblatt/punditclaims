assessment_axis: forecast_outcome
explicit_source_elements:
  - I don’t think any of these companies die
  - as a result of the bubble bursting
  - Meta, Microsoft, Google and Amazon
evaluator_interpretation:
  - Die means fail as an operating business, rather than suffer a share-price decline, layoffs or lower profits.
  - Google refers to the Google/Alphabet business, not the survival of a particular legal subsidiary name.
  - The antecedent requires an identifiable collapse of the AI investment boom. The speaker supplies no market threshold or duration.
  - A failure must be caused materially by that collapse; chronological sequence alone is insufficient.
support_condition: Following an identifiable AI bubble collapse and its material business consequences, all four named businesses survive as operating enterprises.
contradiction_condition: At least one named business fails or permanently ceases operating as a material consequence of that collapse.
measurement_requirements: A documented collapse, subsequent business survival or failure, and evidence connecting any failure to the collapse.
source_requirements: Prefer filings, insolvency records and official closure announcements. Independent market reporting can help establish the antecedent but cannot supply a definition the speaker omitted.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A documented AI bubble collapse followed by the permanent business failure of any named company, materially caused by the collapse, would conclusively contradict the forecast. Continued operation before a defined aftermath has ended cannot conclusively support this deadline-free forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AI bubble bursting has no specified threshold.
  - Die is interpreted as operating-business failure.
  - No deadline or post-collapse survival interval is supplied.
  - Causal attribution could be disputed where a failure has several causes.
retrospective_or_prospective: retrospective
