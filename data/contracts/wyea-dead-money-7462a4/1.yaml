assessment_axis: historical_observation
explicit_source_elements:
  - it appears
  - $200 billion to $300 billion
  - NVIDIA’s sales since 2022
  - sitting in warehouses or unplugged in data centers waiting for power
evaluator_interpretation:
  - Read as an estimate of the original sales value of NVIDIA AI GPUs that remain unused because deployment awaits power.
  - Since 2022 identifies the purchase cohort; it does not mean every chip has been idle since 2022.
  - Use April–June 2026, the latest completed calendar quarter broadly reportable by customers before the post, for the ongoing inventory observation.
  - The surrounding reliance on reporting and analyst estimates implies an estimated value, rather than an audited inventory figure.
support_condition: A credible inventory reconciliation or independently grounded estimate places the original NVIDIA sales value of qualifying unused GPUs between USD 200 billion and USD 300 billion during the target period.
contradiction_condition: Comparable evidence establishes a value outside that range, with uncertainty sufficiently narrow to exclude it.
measurement_requirements: Match NVIDIA sales since January 2022 to customers' unused hardware, original sales prices and deployment status. Separate GPUs from networking, buildings and other equipment. Avoid double counting reseller transactions.
source_requirements: Customer inventory disclosures, deployment records or a transparent independent estimate. Total NVIDIA revenue and forecasts of future electricity shortages cannot establish the claimed inventory.
