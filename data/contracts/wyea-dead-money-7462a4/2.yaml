evaluator_interpretation:
  - 'The speaker hedges twice: it is "questionable" how many Blackwell chips are rentable, and it only "appears" that $200-300B is idle. He offers a rough range he calls an appearance, not a measured fact.'
  - No company, regulator or analyst publishes the dollar value of uninstalled or unpowered NVIDIA hardware, so no public measure exists to test this range against.
  - Following the earlier reviewers, this hedged estimate is not scored as a firm figure. Context evidence is recorded for readers.
support_condition: Would be supported only if a credible measurement showed that roughly $200-300B of NVIDIA hardware sold since 2022 was unplugged or warehoused around September 2026. Because the claim is hedged, it is not scored.
contradiction_condition: Would be contradicted only if a credible measurement showed idle NVIDIA hardware far below $200B around September 2026. Because the claim is hedged, it is not scored.
measurement_requirements: A dollar estimate of NVIDIA chips sold since 2022 and not yet installed or powered as of about September 2026, built from deployment or inventory records.
source_requirements: Hyperscaler or neocloud disclosures of uninstalled GPU inventory, or an independent measurement of deployed vs. sold NVIDIA compute.
