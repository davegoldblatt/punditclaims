explicit_source_elements:
  - 80%
  - their revenue concentration
  - depends on spending and capital
  - unreliable to actively-unstable
evaluator_interpretation:
  - The surrounding discussion identifies 'their' as OpenAI and Anthropic.
  - Read the denominator as enterprise revenue, because the post introduces the 80% figure as an enterprise-revenue concentration estimate. Applying it to total revenue would be a separate extrapolation.
  - The plain reading requires evidence of fragile customer financing or unusually insecure spending, beyond the ordinary possibility that any customer can reduce purchases.
  - Use July 2026 as the latest monthly enterprise-spending reporting period demonstrably public before the post. The precise observation window behind the separate 80% statement is not disclosed.
  - The accounting basis is estimate because the claim relies on an outside transaction-data estimate, not either lab's reported accounts.
support_condition: Comparable customer-level evidence shows approximately 80% of each lab's enterprise revenue came from customers whose payments depended on demonstrably fragile financing or spending.
contradiction_condition: Comparable evidence shows the exposed share was materially below 80%, or shows durable financing and spending commitments for enough of the claimed exposed revenue to invalidate the asserted share.
measurement_requirements: Revenue shares linked to customer funding sources, operating cash generation, funding runway, cancellation rights and actual retention. Concentration and financial fragility must be measured separately and then connected.
source_requirements: Company revenue records or a validated representative estimate, matched to customer financial disclosures and spending commitments. A concentration statistic alone is insufficient.
