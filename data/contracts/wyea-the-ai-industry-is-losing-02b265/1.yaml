evaluator_interpretation:
  - The claim concerns the two companies' contribution to Exponential View's revenue estimate, calculated using their revenue and compute spending.
  - The context combines figures from 2025 and Q1 2026. The target period encompasses those periods, but inclusion in the numerator must also match Exponential View's reporting window.
  - I read 68% as an approximate percentage rounded to the nearest whole percentage point.
  - A valid comparison requires reconciling transactions with the report's treatment of double-counting.
support_condition: Comparable financial records and Exponential View's methodology establish that the two companies contributed approximately 68% of its $110 billion total, excluding Q2 2026 contributions.
contradiction_condition: A sufficiently complete reconciliation of the same companies, periods, financial measures and transactions establishes a materially different share.
measurement_requirements: Separate revenue, inference spending and training spending by company and period. Reconcile spending with revenue actually included in the denominator. Do not substitute annualized revenue, financing, total R&D or future commitments.
source_requirements: Exponential View's underlying methodology and company allocations, together with financial disclosures or independently reported financial records. Zitron's own estimates cannot independently establish the outcome.
