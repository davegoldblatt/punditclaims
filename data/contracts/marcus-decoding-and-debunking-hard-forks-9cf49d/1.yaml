support_condition: Dated records establish a qualifying predecessor before the post, and training records or a credible model-specific audit establish exposure to that implementation or comparable recipe-from-photo code.
contradiction_condition: Reliable records disprove the alleged predecessor or establish that the actual models did not train on the alleged class of code. Lack of disclosed training records alone is not contradiction.
measurement_requirements: Compare application functionality and establish chronology. Separately identify the actual model versions and their training provenance.
source_requirements: Repository history or archived documentation for predecessors; model-specific training records or independent provenance analysis for exposure.
