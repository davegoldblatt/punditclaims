explicit_source_elements:
  - Roose’s idea of recipe-from-photo is not original
  - the code for it already exists
  - the systems he is using presumably trained on that code
evaluator_interpretation:
  - "Score the firm claim that public code implementing the same basic idea preceded Roose’s essay: identify ingredients from a photograph and suggest recipes."
  - The ordinary reading requires a functional predecessor, not identical source code, interface, or lunch-specific features.
  - The phrase 'presumably trained' is an explicitly hedged inference. Exclude it from scoring; support for the existence claim does not establish training exposure or copying.
  - The target period covers historical predecessors before the essay discussed in the March 2, 2025 post. No lower date boundary is stated; this is a historical precedence claim, not a periodically reported ongoing metric.
support_condition: A dated public repository or tutorial predating Roose’s essay contains code connecting ingredient photographs to recipe suggestions.
contradiction_condition: Reliable historical evidence establishes that the claimed predecessors appeared only after Roose’s essay or lacked the photo-to-recipe functionality, and establishes that his implementation introduced that basic idea. Failure to find an example alone is insufficient.
measurement_requirements: Verify the photograph-to-ingredient-to-recipe workflow, the presence of implementation code, and public availability before Roose’s essay. No accuracy benchmark or identical-code comparison is required.
source_requirements: Prefer original repositories, historical revisions, and dated public records of their use. The speaker’s own assertion cannot establish the outcome.
