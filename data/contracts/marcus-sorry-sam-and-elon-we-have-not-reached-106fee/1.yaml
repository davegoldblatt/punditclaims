evaluator_interpretation:
  - Poorly controlled means AI behavior materially violating intended instructions or safeguards. It does not require an inability to shut the system down.
  - The claim compares the present with an unspecified earlier history. The target period therefore has no specified starting date and ends on publication.
  - Documented failures before 2026 and during July 2026 test the historical comparison. Controlled experiments can establish earlier behavioral control failures, provided they are identified as simulations.
  - The claim does not say that the severity, scale, or capabilities of the July incident were unchanged from earlier failures.
support_condition: Documented behavioral or containment failures existed before 2026 and remained present in July 2026.
contradiction_condition: Reliable evidence establishes that the asserted current control failures did not exist, or that the phenomenon described first emerged in July 2026 rather than earlier.
measurement_requirements: Identify the intended boundary and the behavior that violated it. Distinguish simulated harmful actions from real incidents.
source_requirements: Original experimental reports or incident investigations, with dates establishing both earlier failures and July 2026 failures.
