assessment_axis: causal_assessment
explicit_source_elements:
  - As a result
  - every AI startup runs at a loss
  - necessitates raising massive amounts of capital every few months
evaluator_interpretation:
  - In context, AI startups means application businesses that sell services using purchased LLM tokens. It is not restricted to the named examples.
  - The plain reading is that actual revenue fails to cover total operating costs because of token economics, and the resulting cash shortfall forces frequent large capital raises.
  - Use July–September 2026 for the ongoing financial state, the latest completed quarter before publication. Financing histories must be long enough to establish or disprove the asserted recurring necessity.
  - Every is universal, so one qualifying contemporaneous counterexample can defeat the universal claim.
  - The speaker supplies no accounting basis for losses. It remains unknown; gross profit, adjusted profit and cash flow cannot substitute for an unspecified bottom-line loss measure.
support_condition: Comparable accounts across the defined population establish operating losses caused by token costs relative to revenue, and cash-flow and financing records establish that these losses require large capital raises every few months.
contradiction_condition: A qualifying startup's comparable target-period accounts establish that it does not run at a loss, or its cash-flow and financing records establish that it operates without the asserted recurring capital requirement. A profitable gross margin alone is insufficient.
measurement_requirements: Realized revenue, token expenditure, total operating expenses, profit definition, cash flow, cash balances and complete financing histories. Establish financing necessity rather than merely observing fundraising.
source_requirements: Prefer company accounts and financing disclosures. Company claims of profitability require the profit measure and relevant period to be identified.
