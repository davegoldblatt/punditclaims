assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic having a $65 billion annualized run rate
  - Anthropic has made $16.5 billion in the first half of 2026
  - losing billions of dollars in the process
  - fundamentally meaningless
evaluator_interpretation:
  - Assess the financial assertions. Fundamentally meaningless is a value judgment without a measurable threshold.
  - Read made $16.5 billion as realized revenue, given the surrounding comparison with annualized revenue.
  - The first-half revenue and loss assertions describe January through June 2026.
  - Read losing billions as an aggregate loss of at least $2 billion, while flagging that the speaker specifies neither net loss, operating loss, nor cash burn.
  - The current run-rate assertion is a separate snapshot before publication. It cannot be used as first-half realized revenue.
  - The metric_scope describes first-half realized revenue. Its accounting basis is not specified; the post does not establish that its preliminary figures and later filed accounts use the same basis.
support_condition: Comparable records establish a $65 billion annualized run-rate snapshot before the post, $16.5 billion of first-half realized revenue at the stated precision, and first-half losses of at least $2 billion under an identified loss measure.
contradiction_condition: Comparable records establish that one of those financial assertions is false on the same period and accounting basis. A difference between preliminary estimates and filed accounts requires reconciliation before scoring.
measurement_requirements: Keep the run-rate snapshot, six-month realized revenue, net loss, operating loss, and cash burn separate. Identify accounting bases and whether the $16.5 billion was an estimate or a reported result. Do not convert a run rate into realized revenue.
source_requirements: Prefer Anthropic's filings and investor disclosures. Confidential investor figures may be documented through reputable reporting, with their preliminary status retained.
