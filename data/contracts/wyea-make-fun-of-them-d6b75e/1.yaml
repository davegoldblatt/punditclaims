explicit_source_elements:
  - SoftBank and Microsoft
  - pay all of OpenAI’s bills
evaluator_interpretation:
  - The ordinary literal reading is that these two companies exclusively fund OpenAI's expense payments.
  - All implies complete coverage, rather than merely being major investors or financing losses.
  - For this ongoing financial observation, the target period is January through March 2025, the latest completed calendar quarter public reporting could cover before the June 30 post.
  - The claim supplies no accounting basis, currency or expense definition. Its accounting basis remains unknown.
  - The separate statement about media marketing is outside the normalized claim.
support_condition: Matched funding and payment records establish that Microsoft and SoftBank exclusively supplied the resources covering all OpenAI bill payments during the target period.
contradiction_condition: Matched records establish that some target-period bill payments were funded from customers, other investors or other sources.
measurement_requirements: Reconcile expense payments with financing, operating receipts and opening cash. Distinguish commitments from received financing, and revenue from cash receipts and annualized run rate.
source_requirements: Company cash-flow records, financing records and payment disclosures covering the same period and accounting basis. Broad funding announcements alone are insufficient.
