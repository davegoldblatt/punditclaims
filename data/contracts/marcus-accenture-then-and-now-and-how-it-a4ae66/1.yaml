  - Generative AI
  - has not been delivering great gains
  - study after study
  - MIT, McKinsey, Bain
evaluator_interpretation:
  - The surrounding discussion makes substantial business-wide productivity gains and realized financial returns the ordinary reading of 'great gains'. Individual task improvements alone do not settle that claim.
  - The cumulative wording refers to the record available by June 18, 2026. I use the latest available study waves, retain their actual observation dates, and leave the starting boundary unspecified because the claim supplies none.
  - Positive returns need not be large returns. Missing expectations need not mean gains were small.
support_condition: Broad, reasonably representative evidence shows that substantial business-wide gains from generative AI remained uncommon, and the named studies substantively support that conclusion.
contradiction_condition: Comparable evidence shows substantial business-wide gains were widespread, or the named studies substantially undermine the claimed overall pattern.
measurement_requirements: Separate generative AI from AI generally, individual productivity from enterprise results, positive returns from large returns, and measured outcomes from expectations. Examine study populations and methods before generalizing.
source_requirements: Prefer the named original studies and comparable independent research. Use reporting on a study only when its original text cannot be retrieved, and identify that limitation.
