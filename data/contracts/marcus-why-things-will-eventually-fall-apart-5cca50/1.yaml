early_resolution_rule: A completed investment cycle with attributable returns conclusively exceeding all relevant costs for one covered developer could falsify everybody, provided intense competition held and the accounting basis was resolved. A profitable quarter, write-down or financing event alone cannot settle lifetime returns.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The investment cohort and population covered by everybody are unspecified.
  - Overpaying and modest profits have no numerical thresholds.
  - Accounting basis, currency and gross-versus-net profit treatment are unspecified.
  - No terminal date is supplied.
  - Competition is documented as present, but its future persistence is unknown.
retrospective_or_prospective: retrospective
