assessment_axis: forecast_outcome
explicit_source_elements:
  - everybody
  - will wind up overpaying
  - compared to the modest profits
  - in an intensely competitive regime
evaluator_interpretation:
  - Everybody refers to the competing AI developers discussed in the passage, including integrated firms such as Google.
  - Overpaying means that eventual attributable economic returns fail to justify the costs of the AI investment, including the cost of capital.
  - The claim concerns completed investment economics, rather than whether one quarter is profitable.
  - The speaker supplies no accounting basis, currency, investment cohort, profit threshold or terminal date.
  - Intense competition is treated as an antecedent. A provider's regulatory disclosure can establish that it faces such competition, but cannot establish that the condition will persist indefinitely.
  - Company-wide profits, revenue run rates and financing proceeds cannot substitute for returns attributable to AI investment.
support_condition: Under the competitive condition, completed and consistently measured investment histories show that every relevant developer earned insufficient attributable returns to justify its AI investment.
contradiction_condition: Under the competitive condition, at least one relevant developer conclusively earns sufficient attributable lifetime returns to justify the relevant AI investment after all associated costs and capital charges.
measurement_requirements: A defined investment cohort and consistent accounting basis, with attributable investment costs, operating costs, realized returns and terminal value. The unspecified accounting basis currently prevents a supported or contradicted money assessment.
source_requirements: Company filings or sufficiently detailed financial disclosures separating AI economics from unrelated businesses, with consistent treatment of capital spending, depreciation, financing and profit.
metric_scope:
  company: All competing AI developers discussed in the post
  metric: Eventual attributable profits relative to AI investment costs
  currency: null
  units: null
