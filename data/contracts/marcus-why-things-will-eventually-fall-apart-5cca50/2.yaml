early_resolution_rule: "A decisive dated event must establish completed investment economics: sufficiently comprehensive final returns demonstrating overpayment across the claimed group, or a clear company-level counterexample whose realized AI returns justify the relevant investments. A financing round, isolated write-down, temporary profit, or stock-price movement is insufficient."
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
