explicit_source_elements:
  - Cognition
  - its business loses hundreds of millions of dollars
  - necessitates burning billions more
  - for a chance to make less revenue than Duolingo
  - raised over $2.1 billion in funding at an astonishing valuation of $26 billion
evaluator_interpretation:
  - The firm, testable part is that Cognition's business loses hundreds of millions of dollars.
  - The surrounding text names Cognition's burn of about $200 million in Q2 2026 and an expected burn of about $800 million for the year. So the plain reading of 'loses hundreds of millions' is a cash burn or loss of at least $200 million over a recent period. Q2 2026 is the period the post itself names.
  - "'Necessitates burning billions more' and 'for a chance to make less revenue than Duolingo' are hedged, forward-looking judgments. They are not scored. Duolingo figures appear only as context."
  - Cash burn is accepted as the measure of 'loses', because the speaker's own context presents the loss as burn and no audited accounts exist for this private company.
support_condition: Credible reports show Cognition burned or lost roughly $200 million or more in Q2 2026, or a similar recent period.
contradiction_condition: Credible reports show Cognition was near breakeven or lost well under $100 million in the period, so that 'hundreds of millions' overstates its losses.
measurement_requirements: Reported cash burn or net loss for Cognition, in US dollars, for Q2 2026.
source_requirements: Company disclosures if any exist; otherwise reputable press reports relaying The Information or Bloomberg.
