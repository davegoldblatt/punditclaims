assessment_axis: historical_observation
explicit_source_elements:
  - its business loses hundreds of millions of dollars
  - necessitates burning billions more
  - for a chance to make less revenue than Duolingo
evaluator_interpretation:
  - Assess the normalized proposition. The fundraising and valuation figures are background, not substitutes for evidence of losses.
  - The surrounding passage uses cash burn to describe financial losses. Read the current-loss component as substantial net cash consumption, without treating it as an accounting net-loss figure.
  - Use Q2 2026 for the current operating observation because the context explicitly identifies that quarter. Keep the cited full-year expectation separate from realized quarterly results.
  - Read 'necessitates' as a claim about financing requirements already inherent in the business. No deadline or cumulative spending period is supplied.
  - The Duolingo comparison requires comparable realized revenue periods. A revenue run rate cannot establish realized annual revenue.
support_condition: Reliable records establish hundreds of millions of dollars of Q2 cash burn, substantiate a requirement for multiple billions of additional net cash consumption, and support the revenue comparison on a common period and basis.
contradiction_condition: "Comparable records establish that a material component is false: Q2 cash burn was substantially below hundreds of millions, the asserted additional funding requirement was unnecessary, or the stated revenue comparison fails on its intended period."
measurement_requirements: Separate cash burn, accounting losses, financing proceeds, spending commitments, realized revenue, and annualized revenue. Additional spending is not automatically additional net cash burn.
source_requirements: Prefer Cognition financial disclosures or records. Private-company financial reporting may supply estimates, but its attribution and measurement basis must be explicit.
