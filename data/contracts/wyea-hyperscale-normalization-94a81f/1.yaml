  - The passage combines Q2 realized burn with a full-year expectation.
  - No period or business milestone is specified for the additional billions.
  - The Duolingo revenue comparison has no explicit common period.
  - The single metric_scope records the current cash-burn component; the additional spending and revenue comparison require separate matching records.
