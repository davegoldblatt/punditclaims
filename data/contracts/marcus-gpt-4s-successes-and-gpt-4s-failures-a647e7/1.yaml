explicit_source_elements:
  - On its own
  - requires frequent, massive retraining
  - to be current with the news
  - GPT 3.5 knew nothing of 2022
  - GPT-4 seems to know little of 2023
evaluator_interpretation:
  - The principal proposition concerns the necessity and scale of training needed to keep standalone release-era GPT-4 current.
  - On its own excludes retrieval and supplying current news in the prompt.
  - Frequent means recurring updates as news changes; massive means large-scale training, rather than merely any parameter update. Marcus specifies neither a schedule nor a compute threshold.
  - The target is the March 2023 release state through the post date, using March month-to-date as the latest public reporting window.
  - The knowledge-date clauses are supporting assertions. A training cutoff does not establish literal ignorance of every later fact, or prove that massive retraining is necessary.
support_condition: Technical evidence establishes that keeping standalone release-era GPT-4 current requires repeated large-scale training, rather than substantially smaller updates.
contradiction_condition: A demonstrated method keeps that standalone model broadly current through substantially smaller updates without retrieval or current-news context.
measurement_requirements: Identify the model, update method, training scale and frequency, news coverage, and retained accuracy. Separate stale knowledge from the cost of correcting it.
source_requirements: Technical disclosures or reproducible experiments applicable to the original GPT-4 model. Results for other models or retrieval systems are context only.
