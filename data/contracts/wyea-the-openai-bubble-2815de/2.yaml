assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI and Anthropic
  - raised nearly $300 billion in the last few years
  - their actual infrastructure costs
  - the GPUs and the data centers to power their services
  - were entirely funded by hyperscalers
  - likely costing another $250 billion
  - Microsoft has said it spent $100 billion on its OpenAI relationship as of early 2026
evaluator_interpretation:
  - The firm assertion is that hyperscalers supplied all funding for the physical infrastructure serving the two labs.
  - The plain reading distinguishes funding that infrastructure from raising equity for the labs. It does not automatically equate paying a cloud-service invoice with financing construction.
  - The $250 billion figure is explicitly an estimate. Establishing that exact realized total is not a condition for supporting the categorical funding assertion.
  - The nearly $300 billion raised and Microsoft's reported spending are premises, not amounts that may simply be added to produce an infrastructure total.
  - The historical interval ends at publication. Its start remains unspecified because last few years does not establish a particular year.
  - Oracle is not excluded merely because it is smaller than the three providers named later. CoreWeave's classification and the treatment of outside capital providers remain explicit ambiguities.
support_condition: Records covering the relevant infrastructure establish that hyperscalers supplied its funding throughout the described period, with no material independent infrastructure funding. The hedged $250 billion estimate need not equal an audited total.
contradiction_condition: Records identify infrastructure actually serving either lab that was independently funded outside the hyperscaler group, with enough information to distinguish independent funding from a hyperscaler's borrowing, lease obligations or financing arrangements. A cloud invoice or an unidentified lender alone is insufficient.
measurement_requirements: Separate lab fundraising, physical infrastructure expenditure, infrastructure financing, service payments and future commitments. Identify the capital providers and who ultimately bears the funding obligations.
source_requirements: Prefer project financing disclosures, contracts, filings and testimony identifying the infrastructure and its users. A complete funding conclusion requires more than announcements of planned capacity.
