explicit_source_elements:
  - OpenAI and Anthropic
  - raised nearly $300 billion
  - in the last few years
  - the GPUs and the data centers
  - entirely funded by hyperscalers
  - likely costing another $250 billion
  - Microsoft has said it spent $100 billion
  - as of early 2026
evaluator_interpretation:
  - Read this as a cumulative claim through publication. Use 2023 through July 15, 2026 for 'the last few years'; the starting year is an interpretation.
  - The main monetary measure is spending on physical infrastructure serving the two labs, separate from capital raised by the labs.
  - Assess the nearly $300 billion fundraising assertion separately within this compound claim. Do not add investments, cloud purchase commitments and infrastructure expenditure without removing overlap.
  - Distinguish financing construction from supplying cloud services and ultimately paying cloud bills. The wording does not clearly distinguish these.
  - Treat 'likely' as qualifying the $250 billion estimate, while 'entirely' makes a firm assertion about funding sources.
support_condition: A reconciled record establishes approximately $250 billion of infrastructure spending attributable to the two labs, financed entirely by hyperscalers, additional to approximately $300 billion raised by the labs. The Microsoft comparison must use a compatible spending definition and period.
contradiction_condition: Comparable records establish materially incompatible totals, material double counting, or infrastructure financed outside hyperscalers under the stated interpretation of funding.
measurement_requirements: Separate actual expenditure from announced commitments, construction financing from customer payments, and infrastructure costs from equity investments. Attribute shared facilities to the labs and avoid counting the same money twice.
source_requirements: Prefer filings, financing agreements and company disclosures. A total requires reconciliation across providers; individual project announcements cannot establish the aggregate.
