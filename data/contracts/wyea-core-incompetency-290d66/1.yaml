explicit_source_elements:
  - Converting cryptocurrency mining data centers to HPC data centers
  - effectively starting from scratch
  - no easy or logical way
  - repurpose a bitcoin miner for AI
evaluator_interpretation:
  - Assess the conversion practices and designs discussed in the post, covering 2024 through publication.
  - Distinguish a Bitcoin ASIC machine from the site, power connection, buildings, and other infrastructure surrounding it.
  - The ordinary reading allows substantial modification costs, but starting from scratch implies that existing infrastructure supplies little practical advantage.
  - The claim contains separable assertions about specialized computing hardware and whole-facility conversion.
support_condition: Engineering records show that the mining machines cannot serve the intended AI workloads and that facility conversion requires substantial replacement of computing, cooling, and electrical systems.
contradiction_condition: Engineering records show material reuse of existing facilities or infrastructure that provides a practical conversion path, contradicting the broader implication that the entire facility must effectively be recreated.
measurement_requirements: Identify retained and replaced systems. Do not infer facility incompatibility solely from ASIC incompatibility, or easy conversion solely from an existing power contract.
source_requirements: Operator engineering disclosures, specifications, or documented conversions. Separate contemporaneous designs from later construction experience.
