assessment_axis: forecast_outcome
explicit_source_elements:
  - If the $50bn-per-gigawatt figure cited by OpenAI’s execs is accurate
  - OpenAI will need to spend $500bn
  - 10GW of capacity
  - required to unlock the promised $100bn from Nvidia
evaluator_interpretation:
  - The antecedent requires validation of the cost estimate for comparable NVIDIA-equipped capacity; merely repeating the estimate does not establish its accuracy.
  - In light of the surrounding discussion of financing partners, spending includes construction financed through partners for OpenAI's capacity. It does not assume OpenAI must supply every dollar from its own balance sheet.
  - "'Unlock the promised $100bn' refers to obtaining the full contemplated investment. It does not require completing all 10GW before any installment can be paid."
  - The claim has no deadline. An announced deployment target is not a deadline supplied by Zitron.
  - The accounting basis is estimate because the cost figure is attributed to press reporting.
support_condition: The USD 50 billion per-GW premise is established for the relevant capacity, and completed spending and deal records show USD 500 billion of buildout expenditure for 10GW associated with obtaining the full contemplated NVIDIA investment.
contradiction_condition: With the cost antecedent established, definitive comparable spending and deal records show that the asserted USD 500 billion expenditure was not required to obtain the full investment, or that the forecasted transaction became permanently impossible.
measurement_requirements: Match the same 10GW project, equipment scope, power-capacity definition, dollar basis, and total construction-cost boundary. Separate buildout expenditure from financing, chip revenue, and compute-service commitments.
source_requirements: Final deal terms and credible realized project-cost records, preferably company disclosures, filings, or audited project accounts.
metric_scope:
  company: OpenAI
  metric: Total buildout expenditure for 10GW of NVIDIA-equipped capacity, directly or through financing partners
  currency: USD
  units: billions of dollars
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only on definitive completion and cost records, or a definitive transaction-ending event, with the stated cost antecedent independently established. An estimate, delayed agreement, smaller investment, or statement that further investment is unlikely is insufficient alone.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The cost boundary of a gigawatt facility is not precisely defined.
  - OpenAI's direct spending and partner-financed construction are not clearly separated.
  - The wording does not specify an investment-installment schedule.
  - No forecast deadline is stated.
retrospective_or_prospective: retrospective
