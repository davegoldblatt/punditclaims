evaluator_interpretation:
  - "Two parts: (1) Starbucks ended its AI inventory tool shortly before May 26, 2026; (2) it did so because the tool's counts were unreliable."
  - Part (2) is supported if the company or credible reporting ties the shutdown to the tool's errors. It is weakened if the company gives a different reason and no source confirms the stated cause.
support_condition: Reports that Starbucks ended the AI counting tool around May 2026, and that the decision was driven by its miscounts.
contradiction_condition: The tool was not ended, or credible evidence shows the decision was made for reasons unrelated to accuracy.
