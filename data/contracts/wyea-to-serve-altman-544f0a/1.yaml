assessment_axis: historical_observation
explicit_source_elements:
  - generative AI
  - no mass-market utility
  - at least on the scale of truly revolutionary movements like the original cloud computing and smartphone booms
  - costs an eye-watering amount to build and run
evaluator_interpretation:
  - The ordinary reading is that generative AI had not demonstrated widespread practical usefulness comparable with the early cloud and smartphone booms. The qualification does not assert that nobody found it useful.
  - The observation describes the state around publication. Use the latest completed calendar quarter, April–June 2024, together with observations available for July before publication.
  - Useful adoption and demonstrated benefits matter; registrations, trial use and investment alone do not establish utility.
  - The cost clause concerns generative AI generally, rather than a specified company's financial metric. Company-specific cost estimates provide context.
  - Neither the comparison years nor a numerical threshold for comparable utility or enormous costs is supplied.
support_condition: Comparable evidence of sustained use and practical benefits shows substantially less mass-market utility than the early cloud and smartphone booms, alongside evidence of very large development and operating costs.
contradiction_condition: Comparable evidence establishes widespread practical utility on the stated scale by publication, or shows that development and operating costs were modest. Evidence against only one component must be identified as such.
measurement_requirements: Comparable populations, adoption stages, regular-use measures and practical benefits; development and operation must both be covered. Separate actual expenses from forecasts.
source_requirements: Prefer representative surveys, measured outcomes and primary cost research. Identify company disclosures and press estimates separately.
