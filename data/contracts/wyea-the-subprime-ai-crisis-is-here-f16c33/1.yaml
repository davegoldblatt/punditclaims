explicit_source_elements:
  - AI training costs are not going away
  - an inherent part of running these companies
  - are not capex
  - They are operating expenses
evaluator_interpretation:
  - These companies refers principally to OpenAI and Anthropic.
  - Training means model-development activity, distinguished from purchasing reusable servers or datacenters.
  - The ordinary present-tense reading is that continued model development is a recurring business requirement whose costs are expensed.
  - Use calendar 2025, the latest completed financial year before the post.
  - Not going away supplies no independently testable future deadline; this assessment does not interpret it as a forecast that training must continue forever.
  - No accounting framework is stated, so the contract's accounting basis remains unknown.
support_condition: The named labs' accounting policies and expenses show recurring model training treated as operating expense, with continuing development integral to their businesses.
contradiction_condition: Comparable records show material model-training costs themselves being capitalized, or show that continued training was not an ongoing requirement of the businesses described.
measurement_requirements: Separate model-development expenditure from capitalized hardware, finance leases and qualifying software assets. Distinguish incurred expenses from future spending plans.
source_requirements: Financial-statement accounting policies and expense disclosures for the named labs. Later publications may describe the target year.
