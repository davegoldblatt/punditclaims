explicit_source_elements:
  - the AI bubble
  - along with the massive private equity and credit funds backing it
  - is fueled almost entirely by debt
evaluator_interpretation:
  - "Plain reading: AI investment (mainly data-center and compute spending by hyperscalers and AI labs) was paid for almost entirely with borrowed money, not with operating cash flow or equity."
  - "He named no period. I use the latest period public evidence could describe before the post: calendar 2025 through the post date, 2026-03-10."
  - Private credit funds are debt providers by nature, so that part is close to true by definition. The test is whether the AI build-out as a whole was almost entirely debt-financed.
support_condition: Sources show that the large majority of AI capex and AI lab funding in 2025 to early 2026 came from borrowing.
contradiction_condition: Sources show that most AI capex was funded from operating cash flow, or that major AI funding came as equity.
measurement_requirements: Share of AI capex funded by operating cash flow vs debt for the big hyperscalers. Size and type (equity vs debt) of major AI lab funding rounds.
source_requirements: Company filings, bank analyst estimates reported by reputable press, announcements of funding rounds.
