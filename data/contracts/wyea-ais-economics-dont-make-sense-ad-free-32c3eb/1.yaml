assessment_axis: forecast_outcome
explicit_source_elements:
  - inevitable
  - the majority of AI subscriptions
  - move to token-based billing
evaluator_interpretation:
  - Majority means more than half.
  - The primary reading counts distinct paid LLM subscription offerings, rather than revenue or subscriber seats. The wording does not specify the denominator.
  - A transition counts when token consumption determines the paid allowance or additional charges. A message cap alone does not count.
  - A subscription fee bundled with token credits can count as token-based billing; retaining a monthly fee does not automatically exclude it.
  - The statement supplies no deadline. Its reference to enterprise changes is supporting context, not a condition.
support_condition: A documented market-wide census shows that more than half of in-scope paid subscription offerings have transitioned from non-token billing to token-based billing.
contradiction_condition: With no deadline, persistence of flat subscriptions at a finite date cannot contradict inevitability. Contradiction would require a decisive event making the predicted majority transition impossible.
measurement_requirements: Define a reproducible offering-level denominator and compare dated before-and-after billing terms. Report sensitivity to counting providers, plans, or subscriber seats.
source_requirements: Dated official billing terms for a comprehensive or demonstrably representative market census. Individual announcements establish examples, not a majority.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve supported if a dated, adequately comprehensive census establishes the majority transition. Individual providers' changes or reversals do not settle the market-wide forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Subscriptions could mean product offerings, plans, contracts, or subscriber seats.
  - AI could include products beyond the LLM services discussed in context.
  - Treatment of hybrid subscriptions and token credits is unstated.
  - No deadline is given.
retrospective_or_prospective: retrospective
