assessment_axis: historical_observation
explicit_source_elements:
  - An LLM just spits back
  - sometimes in transmogrified form
  - what it has read
evaluator_interpretation:
  - The ordinary reading is that LLM output is limited to reproducing or reworking previously encountered material, rather than applying learned rules to genuinely new problems.
  - Transmogrified allows paraphrasing and rearrangement; different wording alone is not a counterexample.
  - Novelty must be established against relevant training material. Familiar benchmark success is insufficient.
  - "Use January 1 through April 4, 2025: the latest completed quarter plus the April context of the ongoing claim."
support_condition: Controlled studies show that apparent solutions to new problems are explained by reproduction or reworking of encountered examples, with no demonstrated generalization beyond them.
contradiction_condition: A controlled study demonstrates contemporary LLMs solving genuinely new instances through learned rules, with training overlap and externally supplied solutions adequately excluded.
measurement_requirements: Document training and test construction, distinguish new wording from new solutions, control contamination, and separate the model’s contribution from external verification or search.
source_requirements: Prefer experiments with controlled training data and novel tests. Behavioral benchmark scores alone cannot establish an exclusive mechanism.
