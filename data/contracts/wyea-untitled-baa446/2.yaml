assessment_axis: historical_observation
explicit_source_elements:
  - The Information reported last week
  - OpenAI's annualized revenue may reach the billions in 2024
  - yet it remains deeply unprofitable
  - even if Apple had paid money to integrate it
  - ChatGPT would still lose money on every search
evaluator_interpretation:
  - "The checkable core is that OpenAI was 'deeply unprofitable' in 2024, the year he references. A plain reading of 'deeply unprofitable' is a large net loss: billions of dollars, or a loss that is a large share of revenue."
  - He describes an ongoing state in June 2024 and names 2024 as the year. The target period is therefore calendar 2024, not a single earlier quarter. Full-year 2024 figures are the most complete public evidence on that state.
  - "The sentence about The Information is a reference to a report, not a claim he is making about revenue. It is checked only as context: The Information did report in June 2024 that annualized revenue was in the billions."
  - "'Lose money on every search, even if Apple had paid' is a hypothetical with no stated payment amount. Public data does not break out cost per query or revenue per query. This part is treated as rhetorical emphasis and cannot be scored on its own. The outcome rests on the 'deeply unprofitable' part."
support_condition: Credible reporting or financial statements show that OpenAI ran a net loss of billions of dollars in calendar 2024, or one that is large compared with its revenue.
contradiction_condition: Credible evidence shows OpenAI was profitable in 2024, or near break-even, with only a small loss.
measurement_requirements: OpenAI net income or net loss for calendar 2024, from company documents or from reputable reporting on them.
source_requirements: Reputable news reporting of OpenAI's internal or audited financials. Zitron's own writing is not used as evidence.
metric_scope:
  company: OpenAI
  metric: net profit or loss
  currency: USD
  units: USD billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
  stock_or_flow: flow
