ambiguity_flags:
  - He named no period for 'remains deeply unprofitable'. The evaluator uses calendar 2024, the year he references.
  - "'Deeply unprofitable' has no threshold. The evaluator reads it as a multi-billion-dollar loss, or one that is large compared with revenue."
  - "'Lose money on every search even if Apple had paid' is a hypothetical with no payment amount, and public per-query economics do not exist. It is not scored on its own."
