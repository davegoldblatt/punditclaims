explicit_source_elements:
  - annualized revenue may reach the billions in 2024
  - it remains deeply unprofitable
  - even if Apple had paid money to integrate it
  - ChatGPT would still lose money on every search
evaluator_interpretation:
  - The main assertion concerns OpenAI's financial condition when the post appeared. The attributed, hedged revenue statement supplies context rather than a separate firm forecast.
  - For the ongoing profitability observation, use January–March 2024, the latest completed calendar quarter before publication. This is an evaluator-selected reporting interval; Zitron did not name one.
  - The ordinary reading of deeply unprofitable is substantial company-wide losses relative to revenue. No numerical loss threshold is supplied.
  - Read search as a ChatGPT query. Losing money on every search asserts losses at the query level; company-wide losses alone do not establish that assertion.
  - The Apple clause is a counterfactual about payment for the announced integration, not a conditional forecast awaiting a future payment. Neither the amount nor the payment structure is specified.
  - The contract's metric_scope records company-wide net profitability. Annualized revenue and query-level profitability are distinct measures and must be examined separately.
  - The Information attribution identifies a reporting basis for revenue, but the wording supplies no accounting basis for the loss assertions. The profitability accounting basis therefore remains unknown.
support_condition: Comparable financial records must establish substantial OpenAI losses in the target period. Separate ChatGPT revenue and cost records must establish losses across the asserted query scope, with a specified treatment of subscription revenue, shared costs, and the hypothetical Apple payment.
contradiction_condition: Comparable records showing OpenAI was profitable in the target period would contradict the company-wide assertion. Reliable evidence of profitable ChatGPT queries under a justified revenue-and-cost allocation would contradict the every-search assertion. Positive margins for another product alone would not suffice.
measurement_requirements: Distinguish realized revenue from annualized revenue, company net losses from operating losses or cash burn, and company-wide profitability from ChatGPT query economics. Query analysis requires costs, attributable revenue, usage, and explicit allocation rules. The hypothetical Apple payment needs an amount and structure.
source_requirements: Prefer OpenAI financial statements or authenticated internal records and primary partnership disclosures. Independent reporting may establish reported estimates, with its limitations stated. Do not use Zitron's own reporting as independent confirmation.
