assessment_axis: historical_observation
explicit_source_elements:
  - LLM’s like GPT
  - produce well-formed prose
  - do not produce interpretable representations of utterances
  - structured relationships between the parts of those sentences
evaluator_interpretation:
  - The plain output-capability reading is that GPT-style models cannot generate readable representations of sentence meaning and its constituent relationships. Task-specific prompting counts; the claim does not require spontaneous output or perfect accuracy.
  - An alternative reading concerns interpretable internal representations used during ordinary generation. Successful semantic parsing does not establish that architectural claim.
  - The period is an as-of snapshot of models available by 2022-06-22. These capabilities have no regular reporting period, so the interval has no invented starting date and includes demonstrations already public before the post.
support_condition: Architecture documentation and representative evaluations establish fluent generation while showing that the contemporary models cannot produce usable structured sentence representations under the output-capability reading.
contradiction_condition: A contemporary GPT-style model demonstrably generates interpretable structured meaning representations across held-out utterances, including conditions where a separate parser does not supply the representation.
measurement_requirements: Distinguish generated meaning representations from ordinary prose, externally recovered representations, and externally imposed grammar constraints. Examine held-out parsing results and the actual decoding setup.
source_requirements: Primary research or reproducible demonstrations involving models available before the post. Later models cannot settle this historical observation.
