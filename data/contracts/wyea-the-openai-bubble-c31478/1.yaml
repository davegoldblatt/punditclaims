  - such a large amount of compute
evaluator_interpretation:
  - The referent is taking over the Oracle compute capacity discussed as serving OpenAI, not buying an unspecified small portion.
  - Affordability means being able to meet the resulting payment obligations while meeting existing obligations, using available resources and obtainable financing.
  - Use the quarter ending June 30, 2026, as the latest completed financial period before the post, with liquidity measured at quarter-end.
  - The statement supplies no accounting basis or defined affordability metric. Do not replace it with a comparison of annualized revenue and the entire multiyear contract value.
support_condition: Comparable financial records and the relevant payment schedule demonstrate a financing shortfall that Anthropic could not cover while meeting its existing obligations.
contradiction_condition: Comparable records establish adequate resources and committed financing to meet the takeover payments and existing obligations, or a financed takeover on comparable terms demonstrates that capacity.
measurement_requirements: Quarter-end liquidity, financing availability, existing obligations, expected cash generation, and the amount and timing of payments for the same Oracle capacity. Valuation, funding proceeds, revenue, and cash are separate measures.
source_requirements: Anthropic financial statements and financing documents, plus Oracle contract or lease terms. Press estimates must remain identified as estimates.
