evaluator_interpretation:
  - The test in context is SimpleQA, not OpenAI's entire evaluation program.
  - The ordinary reading is that short, discrete factual lookups of the kind SimpleQA tests account for less than half of ChatGPT use.
  - I operationalize usage as the share of user messages. The speaker does not specify messages, conversations, users or time spent.
  - No reporting interval is specified. I use the current calendar quarter through publication, January 1–March 24, 2025.
  - This does not imply that long-form writing alone constitutes a majority.
support_condition: Representative usage evidence for the target period shows that fewer than half of ChatGPT user messages are short, discrete factual lookups, using a classification demonstrably comparable to SimpleQA.
contradiction_condition: Representative, comparable evidence shows that more than half of ChatGPT user messages in the target period are short, discrete factual lookups.
measurement_requirements: Identify the usage denominator, account coverage, sampling method and classification boundaries. Broad information-seeking or asking categories cannot automatically be equated with SimpleQA-style questions.
source_requirements: Representative platform usage research with period-specific results and a documented task taxonomy, alongside primary SimpleQA documentation.
