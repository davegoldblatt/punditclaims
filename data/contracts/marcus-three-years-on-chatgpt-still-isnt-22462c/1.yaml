ambiguity_flags:
  - "'Rich model' and 'faking it' have no supplied operational threshold."
  - GPT could mean GPT-5, the broader model family or the ChatGPT system.
  - "'Any normal seven-year old' does not define a sampling population or allowance for individual variation."
  - Reading the claim as denying every internal representation would materially strengthen it beyond the child-comparison context.
  - No observation period is specified; November through the post date is an evaluator-selected current-state window.
