assessment_axis: forecast_outcome
explicit_source_elements:
  - Anthropic and OpenAI
  - the biggest threats to their customers
  - will actively rent-seek and punish their success stories
evaluator_interpretation:
  - The ordinary reading predicts that both suppliers will exploit successful customers' dependence through adverse commercial terms or service restrictions.
  - An ordinary price increase does not by itself establish exploitation or punishment.
  - The comparative claim that these suppliers are customers' biggest threats remains part of the assessment.
  - No deadline or numerical measure of harm is supplied.
support_condition: Documented conduct by both suppliers that exploits successful downstream customers, together with comparative evidence that supplier conduct is the dominant threat to those customers.
contradiction_condition: A decisive event that makes the predicted conduct impossible, or comprehensive evidence refuting the comparative claim. A period without adverse changes cannot refute an undated prediction.
measurement_requirements: Identify affected customers, changes to contracts or access, commercial consequences, alternative suppliers, and competing explanations such as capacity constraints or contractual violations.
source_requirements: Prefer dated contracts, supplier announcements and customer disclosures. Reporting should distinguish announced restrictions from implemented restrictions.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only if dated evidence establishes the predicted exploitative conduct by both providers and the comparative harm, or a decisive event makes that conduct impossible. One restriction or a proposed future cutoff is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No definition of rent-seeking or punishment.
  - No customer population or measure for biggest threat.
  - Combines a present-tense ranking with predicted future conduct.
retrospective_or_prospective: retrospective
