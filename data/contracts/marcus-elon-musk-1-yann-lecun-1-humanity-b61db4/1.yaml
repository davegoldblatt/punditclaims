explicit_source_elements:
  - Frequently wrong
  - sometimes right
  - asking the same question often yields different results
  - never in doubt
evaluator_interpretation:
  - The ordinary reading is a recurring combination of factual errors, materially inconsistent answers to identical questions, and confident presentation of wrong answers.
  - Never in doubt is rhetorical language for habitual overconfidence, not a literal assertion that no answer ever contains a hedge.
  - Different results means substantive differences in answers, not harmless changes in wording.
  - The context generalizes from testing yesterday to current behavior. I use May 1–29, 2024 as the observation period.
support_condition: Repeated contemporary tests show a recurring factual error problem, substantive inconsistency on identical prompts, and unwarranted confidence in erroneous answers.
contradiction_condition: Broad contemporary repeated-prompt tests show reliable factual answers, substantive consistency, and appropriately expressed uncertainty, contradicting the alleged behavioral pattern.
measurement_requirements: Use a disclosed question set with verified answers, multiple independent repetitions, unchanged prompts and settings, and explicit coding of substantive inconsistency and uncertainty.
source_requirements: Independent evaluations or authenticated transcripts from the contemporary Grok product. Anecdotes may establish individual errors but not their general frequency.
