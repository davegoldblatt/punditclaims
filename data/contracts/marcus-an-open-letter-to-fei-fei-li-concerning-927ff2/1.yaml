evaluator_interpretation:
  - Assess the substantive description of the bill despite the introductory qualification.
  - Read 'kill switch' as the full-shutdown capability requirement.
  - The ordinary practical example is an independently held copy distributed through an open-source release.
  - Use the July 3 amendment, the latest published version before August 10. Do not substitute later amendments.
  - Distinguish the original covered model from covered model derivatives, including distributed copies.
support_condition: The applicable text excludes independently held open-source copies from the original developer's shutdown obligation.
contradiction_condition: The applicable text requires the original developer to retain shutdown capability over those independently held copies.
measurement_requirements: Read the shutdown definition together with the definitions of covered model, derivative and developer. Legislative intent alone does not settle ambiguous operative language.
