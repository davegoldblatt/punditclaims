evaluator_interpretation:
  - The ordinary reading is that substantive arrangements governing AI development and deployment were essentially absent.
  - The surrounding discussion of regulation makes public rules and oversight central. Governance includes operative legal obligations and responsible regulators; a proposed framework alone does not establish operative oversight.
  - No geographic restriction is stated. Examine major jurisdictions without treating any one jurisdiction's rules as globally applicable.
  - For this ongoing observation, the evidence window is the current calendar quarter through publication, January 1–March 30, 2023. This approximates the contemporary state, rather than a quarterly average.
support_condition: Public records show that substantive AI oversight was essentially absent, with relevant institutions and rules merely proposed or too limited to constitute meaningful governance.
contradiction_condition: Records establish substantive operative rules and oversight arrangements governing AI services or uses in major jurisdictions, beyond isolated statements of principle.
measurement_requirements: Distinguish enacted and operative obligations from proposals, voluntary guidance, and evidence of actual enforcement. Assess coverage without assuming comprehensive governance.
source_requirements: Promulgated legal instruments and official descriptions of existing regulatory arrangements; company governance records where relevant.
