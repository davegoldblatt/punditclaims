evaluator_interpretation:
  - In the surrounding examples, the ordinary behavioral reading is that these models do not reliably preserve the meanings of parts and their arrangement when interpreting novel combinations.
  - This reading does not equate the absence of a hand-coded semantic module with the absence of learned compositional ability.
  - Sidestep could instead describe architecture or training objectives; those readings are recorded separately rather than silently substituted.
  - Current models are assessed over the current calendar year through publication, 2022-01-01 to 2022-06-22, because model evaluations have no regular reporting period.
  - The assessment addresses the normalized proposition about foundation models, not the historical aside about Aristotle.
support_condition: Representative evaluations of contemporary foundation models establish systematic failure to preserve part meanings and their relations across novel combinations.
contradiction_condition: Representative evaluations of contemporary foundation models establish reliable compositional interpretation across controlled novel combinations. A narrow task success qualifies an absolute dismissal but does not alone establish general reliability.
measurement_requirements: Compositional generalization tests with model versions, prompting, fine-tuning, held-out combinations and task scope specified. Architecture descriptions must be distinguished from behavioral tests.
source_requirements: Primary model descriptions and evaluations. Outcome evidence must concern the target period; older architecture papers provide context only.
