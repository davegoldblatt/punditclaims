evaluator_interpretation:
  - The context concerns learned systems proposed as solutions to compositional understanding, through September 14, 2022.
  - The ordinary reading of reliability is successful generalization across unfamiliar combinations under controlled testing. Marcus supplies no numerical threshold.
  - Broad compositional understanding and mastery of a restricted benchmark are different commitments. Success on a restricted benchmark challenges the wording but does not establish a general solution.
  - The historical interval has no stated starting date.
support_condition: A sufficiently comprehensive record of proposed solutions shows that each fails controlled tests of the compositional ability it claims to solve.
contradiction_condition: At least one proposed solution publicly demonstrates reliable compositional generalization under careful testing, at the breadth implied by the surrounding discussion.
measurement_requirements: Identify the proposed solution, its claimed scope, training exposure, held-out combinations, evaluation procedure, and robustness across tests.
source_requirements: Public evaluations of systems available by the post date, or later records establishing their capabilities at that time. Failure of selected models cannot establish failure of every proposed solution.
