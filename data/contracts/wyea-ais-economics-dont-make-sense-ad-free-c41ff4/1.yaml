assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic and OpenAI
  - neither of them have a path to profitability
  - in the next few years
evaluator_interpretation:
  - Assess the normalized proposition about a path to profitability. The cash-burn clause supplies context and is not a separate forecast being graded here.
  - Read 'path' as a financially credible business route to sustainable company-wide profitability, including development and overhead costs.
  - A management projection is relevant but does not by itself establish a credible route. Current losses do not establish that no route exists.
  - Use calendar 2025, the latest complete annual financial period that public reporting could describe before the post. Assess its implications for the route claimed to exist at publication.
  - "'In the next few years' modifies intended cash burn and is not imported as a profitability deadline."
support_condition: Financial results, unit economics, commitments, and funding requirements show that neither company had a credible route to sustainable company-wide profitability under reasonably substantiated assumptions.
contradiction_condition: For at least one company, contemporaneous economics and a sufficiently funded operating plan substantiate a credible route to sustainable company-wide profitability.
measurement_requirements: Reconcile company-wide revenue with inference, training, staffing, financing, and other expenses. Examine pricing, customer retention, committed costs, funding needs, and realistic growth assumptions.
source_requirements: Company financial statements and sufficiently detailed operating plans, supplemented by reputable reporting on private documents when primary plans are unavailable.
