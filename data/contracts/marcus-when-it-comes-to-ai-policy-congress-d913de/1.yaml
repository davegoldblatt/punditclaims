ambiguity_flags:
  - "'Almost nothing' supplies no threshold."
  - "'All state regulation' could be rhetorical shorthand for restrictive AI-specific safeguards, but the surrounding text repeats the absolute formulation."
  - The observation combines current legislative status with an accumulated congressional record; the target period therefore ends at publication and has no specified beginning.
  - A restriction on enforcement is not literally a prohibition on passing legislation.
