assessment_axis: historical_observation
explicit_source_elements:
  - Congress, which has done almost nothing to address these concerns
  - is considering
  - a sweeping last-minute preemption provision
  - a federal budget bill
  - ban all state regulation on AI
  - for the next decade
evaluator_interpretation:
  - Assess the proposal and congressional record as they stood on May 14, 2025. The cumulative congressional record has no specified starting date.
  - Read 'almost nothing' as very limited substantive federal protection against the harms listed in the surrounding text. Research funding and administrative coordination alone do not establish comprehensive public protection.
  - "Read 'all' in light of the repeated assertion that states could not regulate AI 'in any way': exceptions therefore matter."
  - The decade would begin at enactment, rather than at publication of the post.
  - "'A major step backwards' is a policy judgment and is not independently scored."
support_condition: The contemporaneous budget proposal contains a ten-year state AI enforcement moratorium, with no material exceptions consistent with the asserted prohibition of all regulation. The congressional record shows very limited substantive public safeguards.
contradiction_condition: The proposal lacks the asserted moratorium or duration, preserves some state AI regulation despite the absolute wording, or the congressional record establishes substantial protections inconsistent with 'almost nothing'.
measurement_requirements: Distinguish enforcement from enactment, the original committee proposal from later amendments, and congressional passage from presidential enactment.
source_requirements: Use the contemporaneous committee text and legislative records. Later descriptions must identify the relevant earlier proposal.
