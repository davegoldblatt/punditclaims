assessment_axis: forecast_outcome
explicit_source_elements:
  - signed multiple different deals and contracts
  - cannot afford to pay
  - cannot hope to raise the money to pay for
  - will burn $300 billion
  - has no path to profitability of any kind
evaluator_interpretation:
  - This is a compound forecast about funding existing commitments, cumulative cash burn, and eventual profitability.
  - The ordinary reading is that OpenAI cannot obtain sufficient resources to honor the commitments as payments fall due. It does not require holding the entire contract value in cash immediately.
  - Burn means cumulative net cash consumption, consistent with the surrounding discussion of negative free cash flow. Financing receipts are excluded from that measure.
  - The $300 billion figure is the author's estimate based on reported projections. No accounting standard is supplied.
  - The sentence gives no firm deadline or unambiguous starting date for cumulative burn. Nearby projections do not impose one on every component.
  - Profitability means company-wide profit after business expenses, rather than a profitable product or an adjusted measure excluding major costs.
support_condition: Records establish inability to finance or pay the identified commitments, cumulative net cash burn of approximately $300 billion, and ultimate failure to reach company-wide profitability. All components must be established to support the compound claim.
contradiction_condition: Records establish sufficient funding and payment of the identified commitments, or sustained company-wide profitability. A completed liquidation with a reliably established lifetime burn materially below $300 billion would contradict the burn component. Partial findings must be reported separately.
measurement_requirements: Identify contracts existing at publication, payment schedules, available funding, actual payments, cumulative negative free cash flow over a consistent period, and company-wide earnings. Do not equate commitments with expenditure or financing with revenue.
source_requirements: Prefer financial statements, financing completion notices, contracts and court records. Clearly label press-reported estimates when underlying statements are unavailable.
