early_resolution_rule: "A completed financial outcome may settle an individual component: documented funding and discharge of the identified obligations, sustained company-wide profitability, realized cumulative burn reaching the stated amount, or final liquidation accounts. Funding announcements, projections, temporary losses, or ordinary contract amendments alone do not settle the compound prediction."
