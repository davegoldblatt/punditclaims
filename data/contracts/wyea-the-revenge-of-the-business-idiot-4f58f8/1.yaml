assessment_axis: causal_assessment
explicit_source_elements:
  - Venture capitalist subsidies are the only reason
  - Perplexity or Lovable are alive
  - a large chunk of both Anthropic and OpenAI’s API revenue
  - only made possible through those subsidies
evaluator_interpretation:
  - "The claim has two linked parts: continuing venture funding is necessary for the named startups' survival, and similarly dependent customers generate a substantial share of each model provider's API revenue."
  - Large chunk means a substantial share, but the source supplies no numerical threshold. Do not silently substitute a majority or a fixed percentage.
  - Receiving venture funding, losing money, and depending on new funding to survive are distinct propositions.
  - Assess the ongoing state over January through March 2026, the latest completed quarter before the post.
  - The revenue claim concerns each provider separately and API revenue specifically, not combined company revenue or annualized run rates.
support_condition: Comparable records establish the named startups' dependence on venture funding for continued operation and trace a substantial share of each provider's realized API revenue to customers with that dependence.
contradiction_condition: Records establish that the named survival premise is false, or that subsidy-dependent customers account for only an insubstantial share of at least one provider's API revenue.
measurement_requirements: Startup cash balances, cash flows, obligations, financing needs, and payments to model providers; provider API revenue denominators and customer-level revenue classified by demonstrated funding dependence.
source_requirements: Prefer company accounts, funding records, and provider customer-revenue disclosures. Funding announcements or customer counts alone cannot establish the causal revenue share.
