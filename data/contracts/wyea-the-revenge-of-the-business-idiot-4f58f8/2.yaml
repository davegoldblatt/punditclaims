assessment_axis: causal_assessment
explicit_source_elements:
  - Venture capitalist subsidies are the only reason
  - companies like Perplexity or Lovable are alive
  - a large chunk of both Anthropic and OpenAI's API revenue
  - only made possible through those subsidies
evaluator_interpretation:
  - "Part 1: companies like Perplexity and Lovable could not keep operating without venture money. Money already raised and spent to cover losses counts, as well as new rounds, because they lose money."
  - "Part 2: a large share (plain reading: at least roughly a fifth to a quarter) of both Anthropic's and OpenAI's API revenue comes from VC-funded, loss-making customers. Without that venture money, that revenue would not exist."
  - "Both parts must hold, for both Anthropic and OpenAI, for the claim to be supported. Period: the state as of the post (2026)."
support_condition: Evidence that Perplexity and Lovable are loss-making and rely on venture money to operate, and that a large share of each of Anthropic's and OpenAI's API revenue comes from such VC-dependent customers.
contradiction_condition: Evidence that companies like Perplexity or Lovable are self-sustaining (profitable or cash-flow positive), or that only a small share of Anthropic's or OpenAI's API revenue comes from VC-dependent startups.
measurement_requirements: Profit and cash-flow data for Perplexity and Lovable. Breakdown of Anthropic and OpenAI API revenue by customer type or funding source.
source_requirements: Company disclosures, IPO filings, or credible reporting citing financial documents.
metric_scope:
