evaluator_interpretation:
  - The ordinary reading is that the R1's user-facing software is an Android application running on dedicated Android hardware.
  - This does not require every cloud service or hardware feature to reside inside one APK.
  - The target is the launch-period product discussed in the post, during April and May 2024 through publication.
support_condition: Firmware inspection identifies Android applications providing the R1 interface, and investigators demonstrate that its main application can run on other Android hardware.
contradiction_condition: Firmware inspection establishes that the main interface is not an Android application, or that the reported Android port does not reproduce the R1 software.
measurement_requirements: Inspect operating-system and application files, and distinguish an actual port from a visual imitation.
source_requirements: Prefer firsthand firmware analysis and demonstrations. Include Rabbit's response.
