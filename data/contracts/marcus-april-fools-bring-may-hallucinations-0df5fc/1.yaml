explicit_source_elements:
  - Humans are (usually, if well-motivated)
  - sort things like jokes and fiction from reality
  - current AI doesn’t have a clue
evaluator_interpretation:
  - The ordinary reading is that contemporary generative AI lacks a usable ability to distinguish jokes or fictional assertions from factual accounts, while attentive humans generally possess that ability.
  - The context concerns treating satire as factual information. Detecting wordplay or explaining a supplied joke is relevant but does not directly measure that distinction.
  - "For this ongoing capability claim, use the most recent completed quarter plus the April days explicitly discussed: January 1 through April 4, 2025. This period is an evaluator choice, not an explicit interval supplied by Marcus."
  - The qualification about motivation describes the human comparison group; it is not a conditional forecast.
support_condition: Representative controlled tests show contemporary AI consistently failing to distinguish satire or fiction from factual accounts under conditions in which attentive humans usually succeed.
contradiction_condition: Controlled tests establish a usable ability in contemporary generative AI to distinguish satire or fictional assertions from factual accounts. Occasional mistakes would not establish the claimed absence of ability.
measurement_requirements: Identify model versions, prompts, factual and nonfactual examples, labeling criteria, contamination controls, and human comparison conditions. Distinguish prompted classification from ordinary search-summary behavior.
source_requirements: Prefer primary evaluations and independently documented incidents. The speaker’s account or a derivative repetition of it cannot independently establish the claim.
