evaluator_interpretation:
  - The sentence combines a policy prescription with a conditional warning about future abuse.
  - "'Infinitely' ordinarily functions here as rhetorical emphasis, but supplies no measurable amount, frequency, population, or stopping point."
  - Replacing 'infinitely' with a specified number of repeated conversions would introduce a materially different claim.
  - "'For free' does not specify whether the relevant cost is compensation for charitable assets, a conversion tax, transaction expenses, or some other obligation."
support_condition: No faithful finite support condition can be specified without adding a threshold and defining both cost-free conversion and exploitation.
contradiction_condition: No finite observation period without abuse would disprove an unlimited warning about the future. The normative prescription also has no empirical contradiction condition.
measurement_requirements: A test would require a defined conversion regime, a definition of exploitation, a measurable predicted frequency or effect, and an observation period.
source_requirements: After clarification, official conversion records and evidence of nonprofit privileges being abused could test a narrower claim. They cannot settle the sentence as written.
