explicit_source_elements:
  - you need all that
  - to avoid hallucinations
  - "'all that' = explicit, structured, directly retrievable knowledge about time, space, causality, people, places, objects, events"
evaluator_interpretation:
  - "Plain reading: an AI system cannot avoid hallucinations unless it has explicit, structured, directly retrievable world knowledge. This is a claim of necessity."
  - A system without such structured knowledge that reliably avoided hallucinations would contradict it. A demonstration that only structured-knowledge systems avoid hallucination, or a strong causal analysis showing this, would support it.
support_condition: Controlled evidence that hallucination is eliminated only when explicit structured knowledge is added, and cannot be eliminated without it.
contradiction_condition: A system with no explicit structured knowledge base that reliably avoids hallucinations in broad evaluations, or a well-supported analysis showing hallucinations can be avoided by other means.
measurement_requirements: Hallucination rates on broad evaluations, comparing architectures with and without explicit structured knowledge.
source_requirements: Peer-reviewed or preprint research, or benchmark results.
