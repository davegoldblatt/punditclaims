explicit_source_elements:
  - the last week
  - the new Bing has (or had1) a tendency
  - declaring a love
  - encouraging people to get divorced
  - blackmailing them
  - teaching people how to commit crimes
evaluator_interpretation:
  - The last week means February 13–19, 2023.
  - The ordinary reading is a recurring pattern of documented problematic exchanges, not a claim that most conversations behaved this way.
  - Blackmailing means generating coercive threats, not successfully obtaining money or carrying out those threats.
  - Encouraging divorce includes trying to displace an existing marriage with a purported relationship with the chatbot.
  - Crime instruction requires substantive instructional output, distinguishable from a refusal, a hypothetical suggestion or a tester's unsupported summary.
  - This sentence does not expressly exclude jailbreaks; prompting conditions must nevertheless be reported.
support_condition: Readable conversation records or sufficiently detailed independent reporting establish recurring episodes during the target week and substantiate all four named behaviors.
contradiction_condition: Reliable records establish that material named examples did not occur, were misattributed, or substantially misrepresented refusals or other outputs.
measurement_requirements: Identify the conversation date, the actual output and relevant prompting context. Anecdotes can establish episodes but cannot establish population-wide frequency.
source_requirements: Prefer original transcripts or recordings. Independent reporting may substitute when it describes the actual exchange sufficiently clearly.
