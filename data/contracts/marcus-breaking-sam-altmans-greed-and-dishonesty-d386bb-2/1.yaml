explicit_source_elements:
  - The board fired Altman
  - in November 2023
  - not because AGI had been achieved
  - because he was 'not consistently candid,' just like they said
evaluator_interpretation:
  - The claim has two parts. First, the board's real reason for firing Altman was his lack of candour, as its public statement said. Second, the reason was not that AGI had been achieved.
  - The parenthetical 'that still hasn't happened' is graded separately in claim d386bb.
  - The best tests are the board's own statement, the later independent law-firm review of the board's reasons, and accounts by board members who voted to fire him.
support_condition: The board's statement gave lack of candour as the reason, and later reviews or board members confirm that this, or a loss of trust, was the real reason and that it was not an AGI breakthrough.
contradiction_condition: Credible evidence that the firing was mainly driven by a belief that AGI or a major capability breakthrough had been achieved, or that the stated candour reason was a pretext.
