explicit_source_elements:
  - 89% of all AI startup revenues
  - both unprofitable
  - agreeing to spend over $1.3 trillion
  - in the next seven years
  - most of which is contingent on continual funding and debt
evaluator_interpretation:
  - The assertion that demand never made sense is opinion; assess the accompanying financial propositions.
  - Read revenues as realized revenue, not annualized run rate.
  - Use July–September 2026 for the ongoing revenue-share and profitability assertions, as the latest ordinarily reportable quarter before publication.
  - Assess agreements already in place at publication, with spending due over the following seven years through November 17, 2033.
  - Read most as more than half of the commitment amount and distinguish economic financing dependence from an express contractual funding condition.
  - The metric_scope records the spending-commitment component; revenue concentration and profitability require separate metrics.
support_condition: Comparable current revenue totals establish the 89% share, both companies have net losses on the stated basis, and non-overlapping agreements exceed $1.3 trillion within seven years with more than half demonstrably dependent on additional financing.
contradiction_condition: Matched records materially refute the revenue share, either company's net-loss status, the amount and timing of commitments, or the majority-financing dependency.
measurement_requirements: Define all AI startups and the revenue period; avoid run-rate substitutions and double-counted compute agreements; establish payment schedules and financing dependence.
source_requirements: A transparent revenue dataset, company financial statements, and contract or filing disclosures. Secondary reporting must preserve the underlying scope.
