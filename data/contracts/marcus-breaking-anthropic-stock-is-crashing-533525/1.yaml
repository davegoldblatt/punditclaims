explicit_source_elements:
  - SoftBank
  - after Nvidia
  - one of the biggest funders of generative AI
  - fell 14.5% overnight
evaluator_interpretation:
  - SoftBank means SoftBank Group's Tokyo-listed shares, rather than its telecommunications subsidiary or a US depositary receipt.
  - Overnight refers to the November 20 Tokyo session relative to the November 19 close, viewed from the US.
  - The percentage is rounded to one decimal place; an earlier intraday decline is not necessarily inconsistent with the final session decline.
  - The funding clause describes SoftBank as a leading generative-AI capital provider, with Nvidia singled out ahead of it. It does not specify an exact ordinal rank, investment universe or measurement basis.
  - The whole claim requires checking both the share-price movement and the funding comparison.
  - The contract's monetary scope records the funding comparison. The stock-price evidence is separate context and cannot settle that comparison.
support_condition: Trading records show a November 20 decline rounding to 14.5%, and comparable funding evidence establishes the claimed leading position relative to Nvidia and other major generative-AI funders.
contradiction_condition: Reliable trading records show a materially incompatible session decline, or comparable funding evidence clearly disproves the stated relative funding position.
measurement_requirements: Tokyo share-price changes against the previous close, plus consistently defined cumulative generative-AI funding comparisons. Do not combine completed investments, announced commitments, portfolio valuations and infrastructure spending as equivalent amounts.
source_requirements: Prefer exchange prices and company investment disclosures; comparative funding evidence must cover the relevant peer group on a consistent basis.
