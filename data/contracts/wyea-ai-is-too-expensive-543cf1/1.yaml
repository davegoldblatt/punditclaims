assessment_axis: forecast_outcome
explicit_source_elements:
  - to pay this off
  - over $100 billion each in AI revenue
  - in the next year
  - Doubling that won’t be enough
  - Tripling it won’t be enough
  - assuming the absolute best-case scenario
  - a combined $70 billion in annual revenue
  - investments ... total over $900 billion
evaluator_interpretation:
  - This asserts a necessary revenue level for investment recovery. It does not predict that each company will actually reach that level.
  - Read the next year as the twelve months following publication, ending May 19, 2027.
  - Read revenue as realized annual AI revenue because the surrounding text explicitly distinguishes run rates from revenues.
  - The stated investment and current-revenue premises must be established on consistent definitions before scoring the conditional claim.
  - Payoff requires an investment-recovery account. Revenue alone cannot establish recovery without costs, margins, prior recoveries, and the investment allocation among companies.
  - The speaker's aggregate figures are estimates, rather than a stated GAAP or company-reported AI segment measure.
support_condition: With the stated premises established, comparable investment-recovery accounts show that each company required more than $100 billion in annual AI revenue within the horizon, and that doubling or tripling the stated combined revenue was insufficient.
contradiction_condition: With the premises established, at least one company demonstrably recovers its relevant investment without exceeding $100 billion in annual AI revenue within the horizon, or matching accounts show recovery possible at the stated doubled or tripled combined revenue.
measurement_requirements: Establish the investment baseline, its allocation, realized AI revenue, operating costs, prior recoveries, and the meaning and timing of payoff. Do not substitute total cloud revenue, run rates, company-wide profit, or announced financing.
source_requirements: Company investment and revenue records, supported by a transparent recovery calculation. The speaker's estimates cannot independently establish their own antecedent.
metric_scope:
  company: Microsoft, Alphabet (Google), and Amazon, each
  metric: Annual AI revenue required to recover the stated investment baseline
  currency: USD
  units: Billions per company per year
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-05-20
  period_end: 2027-05-19
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: in the next year
horizon_interval:
  start: 2026-05-19
  end: 2027-05-19
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Resolve early only if matching records establish the premises and document completed investment recovery below a claimed necessary threshold, or conclusively establish the necessary threshold for the entire stated horizon. A revenue milestone alone is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Pay this off and covering these losses do not specify a recovery method.
  - The investment baseline has no defined start date or allocation among the companies.
  - Making annual revenue could mean trailing realized revenue or an exit run rate; the context favors realized revenue.
  - The wording does not clearly state whether full investment recovery must occur within the year or whether that year's revenue level is necessary for eventual recovery.
  - The combined revenue and investment premises are asserted estimates.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
