explicit_source_elements:
  - Elon is right
  - they don’t have
  - all or most
  - the Stargate funding
  - in hand
evaluator_interpretation:
  - The plain reading is that OpenAI and its partners had not secured a majority of Stargate’s announced $500 billion funding.
  - Most means more than half. Support therefore requires evidence that no more than $250 billion was secured.
  - In hand includes cash obtained and binding financing available to the project. It excludes fundraising ambitions and financing still under discussion.
  - Because this describes an ongoing state without a reporting period, use February 2025, the latest completed calendar month before publication. Stargate funding is an event-driven financing measure rather than a regularly reported quarterly account.
  - Treat the attributed outside assessment of funding as an estimate, rather than a claim based on audited company accounts.
  - This does not assert that Stargate would fail to raise money later or that the entire four-year budget needed to be available immediately.
support_condition: Reliable records or reporting establish that no more than $250 billion of the announced $500 billion was secured during the target period.
contradiction_condition: Reliable records or reporting establish that more than $250 billion of the announced $500 billion was secured during the target period.
measurement_requirements: Measure total secured Stargate financing across its partners without double counting. Distinguish cash and binding available financing from proposed equity, prospective borrowing, spending plans and separate investments in OpenAI.
source_requirements: Prefer financing agreements and partner disclosures. Reputable reporting may establish private financing arrangements, but an undisclosed total is not itself evidence of a shortfall.
