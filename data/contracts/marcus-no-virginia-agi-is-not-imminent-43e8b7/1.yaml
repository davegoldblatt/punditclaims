explicit_source_elements:
  - We are not even close
  - machines that exceed the capacity of typical humans
  - cope with unusual circumstances while driving
evaluator_interpretation:
  - This describes driving capability at publication, rather than predicting a date for future capability.
  - The ordinary reading is that a substantial capability gap remained before automated driving broadly exceeded ordinary human drivers in unexpected or uncommon road situations.
  - Unusual circumstances include unexpected road hazards, emergency scenes, and crash-imminent situations. No single category is treated as representative of all unusual driving.
  - The target period is the current calendar year through August 20, 2023. The claim concerns the contemporary technology state and identifies no reporting cycle.
  - The phrase 'unusual circumstances' specifies the comparison's scope; it is not a conditional forecast antecedent.
support_condition: Representative, comparable evaluations of unusual driving situations show a substantial remaining capability shortfall relative to typical human drivers.
contradiction_condition: Representative, comparable evaluations show that automated systems were already near or above typical human performance across a broad range of unusual driving situations.
measurement_requirements: Compare human and automated performance on matched situations, exposure, and outcomes. Isolated incidents, aggregate crash rates, and selected simulations cannot independently establish the broad capability gap.
source_requirements: Original evaluations, official incident records, and transparent human comparisons concerning systems operating by the post date; retrospective evidence is admissible if available by October 28, 2026.
