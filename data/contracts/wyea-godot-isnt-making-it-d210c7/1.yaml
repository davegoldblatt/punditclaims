assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI or Anthropic
  - both of whom are running unprofitable businesses
  - likely charging nowhere near enough to cover their costs
evaluator_interpretation:
  - The surrounding discussion identifies 2024 as the relevant year. I assess the financial position described by the annual estimates available when the post appeared.
  - Unprofitable means that each company's revenue falls below its total expenses. It does not necessarily mean that serving an additional paying customer loses money.
  - The ordinary reading of the pricing clause is a substantial shortfall between current customer payments and the full costs of supplying the business's products. No numerical meaning is assigned to 'nowhere near'.
  - The pricing inference is qualified by 'likely'; it is not treated as an unconditional assertion of negative gross margins.
support_condition: Comparable evidence establishes losses at both companies and a substantial shortfall between their customer payments and the relevant full costs, with enough detail to assess the pricing inference.
contradiction_condition: Comparable evidence establishes profitability at either company, or establishes that their prevailing customer payments adequately cover the costs meant by the claim.
measurement_requirements: Separate revenue, total expenses, serving costs, training costs, and other expenditure for each company. Do not substitute cash burn for accounting losses or annualized revenue for realized revenue.
source_requirements: Prefer company financial statements. Contemporary financial reporting may establish estimates, but its accounting definitions and forecast status must remain explicit.
metric_scope:
  company: OpenAI and Anthropic, each separately
  metric: Profitability and coverage of total costs by customer revenue
  currency: USD
  units: dollars
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
