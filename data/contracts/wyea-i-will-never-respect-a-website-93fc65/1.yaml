assessment_axis: causal_assessment
explicit_source_elements:
  - OpenAI and Anthropic
  - need to show continued revenue growth
  - capacity available for new customers
  - old customers will always be the first to be punished
evaluator_interpretation:
  - Punishment means reduced access, tighter usage limits, or removal of an included service.
  - First compares existing customers with new customers. It does not compare cheaper and more expensive subscription tiers.
  - Always is a categorical commitment. A documented allocation decision that protects existing subscribers while restricting new subscribers can contradict it.
  - The revenue-growth premise is part of the proposed causal explanation, not a separate conditional forecast.
support_condition: Allocation policies and decisions at both companies establish that preserving capacity for revenue growth consistently makes existing customers bear restrictions before new customers.
contradiction_condition: Either company restricts access for new subscribers while preserving the corresponding access for existing subscribers in a decision addressing demand or subscription capacity.
measurement_requirements: Compare existing and new customers receiving the same service, identifying the restriction, timing, and stated reason. Simultaneous growth and restrictions alone do not establish causation.
source_requirements: Prefer company policies and dated announcements, corroborated by reporting on actual implementation.
