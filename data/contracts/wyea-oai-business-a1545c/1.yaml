assessment_axis: forecast_outcome
explicit_source_elements:
  - it’s fair to assume
  - models like o1 and GPT-5
  - also known as “Orion”
  - significantly more expensive to train
  - GPT-4 cost $100 million to train
evaluator_interpretation:
  - The comparison is with the approximately $100 million GPT-4 training cost stated immediately before the claim.
  - More expensive means dollar training expenditure, not inference prices, benchmark performance or floating-point operations alone.
  - The named examples must be evaluated separately. Evidence for one cannot establish the claim about both.
  - Significantly means clearly above the baseline after allowing for estimation uncertainty; no arbitrary percentage threshold is imposed.
  - The wording identifies GPT-5 with Orion. Evidence must establish which development project it concerns rather than silently substituting a later product name.
support_condition: Comparable training-cost evidence places both named examples clearly above the stated GPT-4 baseline, with model identity and included costs established.
contradiction_condition: Comparable evidence establishes that the named examples did not cost materially more than GPT-4. Conflicting established outcomes for the examples would justify mixed.
measurement_requirements: Dollar estimates with uncertainty and consistent treatment of pretraining, post-training, experimental runs, inherited base-model training and staff costs.
source_requirements: Model-specific company disclosures or transparent independent cost estimates. Aggregate company research spending and compute counts alone are insufficient.
metric_scope:
  company: OpenAI
  metric: Training expenditure per named model compared with GPT-4
  currency: USD
  units: USD millions per model
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
