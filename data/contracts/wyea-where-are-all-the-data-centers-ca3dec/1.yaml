  id: wyea-where-are-all-the-data-centers-ca3dec
  version: 2
  content_hash: bc3b0d5b31a68dc5daf4e63ff45a51721e0fe97386d5b3dc0917b0574021f4d8
assessment_axis: forecast_outcome
explicit_source_elements:
  - Oracle is building 7.1GW of total capacity for OpenAI
  - at this rate
  - Stargate Abilene won’t be done until mid-2027
  - the rest either never get finished or are done in 2030 or later
evaluator_interpretation:
  - Done means full commissioning of the relevant campus scope, not the opening of a building or delivery of some GPUs.
  - The at-this-rate qualification is retained as a condition that the construction and commissioning pace underlying the prediction persists.
  - For Abilene, mid-2027 is provisionally treated as June through August 2027; a completion within that window would require review of the date ambiguity.
  - The remaining-sites clause predicts no full completion before January 1, 2030. It does not promise completion by the end of 2030.
  - The horizon ends on the last day before 2030 for testing that lower-bound claim; it is not a deadline for eventual completion.
  - The ordinary reading of the rest applies to the other Oracle/OpenAI campuses in the stated portfolio, but the precise portfolio requires reconciliation.
support_condition: With the pace condition established, Abilene does not reach full commissioning before mid-2027 and none of the other covered campuses reaches full commissioning before 2030.
contradiction_condition: With the pace condition established, dated records show Abilene fully commissioned clearly before mid-2027, or another covered campus fully commissioned before 2030.
measurement_requirements: Fix the portfolio and campus boundaries as of the post, establish the baseline and subsequent commissioning pace, and distinguish IT capacity, facility power, building delivery and operational acceptance.
source_requirements: Dated owner, developer or customer acceptance records, supported where possible by commissioning or utility records. Target dates and partial openings are insufficient.
metric_scope: null
original_horizon: mid-2027; 2030 or later
horizon_interval:
  start: 2026-05-12
  end: 2029-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: A documented full-campus completion before the relevant lower-bound date can contradict the applicable clause only if the pace condition is also established. Partial deliveries, revised schedules and announcements do not settle it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - At this rate supplies no measurable baseline or tolerance for changes in pace.
  - Mid-2027 has no exact date.
  - The rest may mean each remaining campus or completion of the portfolio collectively.
  - The 7.1GW portfolio and the boundary of Abilene require reconciliation.
  - 2030 or later is a lower bound, not a final completion deadline.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
