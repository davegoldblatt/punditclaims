explicit_source_elements:
  - Statistical approximation through generative AI
  - rarely reliable
evaluator_interpretation:
  - The ordinary reading is that dependable, consistently correct performance is uncommon across ordinary uses of generative AI.
  - Reliable does not mean flawless on every possible input, and rarely does not merely mean that some failures exist.
  - The sentence is broad, although the surrounding paragraph discusses copyright and source attribution.
  - For the ongoing state, January 1–24, 2024 is the latest pre-post month-to-date reporting window. Generative AI has no common reporting cycle; older evaluations are background rather than direct measurements of that window.
support_condition: Representative contemporary evaluations show that dependable performance is uncommon across ordinary generative-AI uses, under defensible task-specific standards.
contradiction_condition: Representative contemporary evaluations show that dependable performance is common across ordinary generative-AI uses under those standards.
measurement_requirements: A defensible population of models and tasks, appropriate reliability standards, repeated measurements and transparent weighting across uses. Selected failures or successes alone cannot establish rarity.
source_requirements: Primary evaluations covering a representative task mix and the target state. Generalizations must account for both successful and unsuccessful uses.
