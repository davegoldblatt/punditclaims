assessment_axis: historical_observation
explicit_source_elements:
  - Statistical approximation through generative AI
  - is rarely reliable
evaluator_interpretation:
  - The ordinary reading is that generative AI seldom performs dependably across its ordinary uses. Dependability means consistently meeting the task's requirements, not never making an error.
  - Marcus supplies neither a numerical meaning of 'rarely' nor a distribution of tasks. I do not invent either.
  - The target is the state of generative AI at publication. There is no regular reporting cycle or stated beginning, so the period has an unspecified start and ends on the post date. Earlier evaluations of relevant systems are admissible; experiments need not have occurred in January.
  - Selected failures establish limitations, while selected successes establish capabilities. Neither alone establishes how common dependable performance is.
support_condition: Representative evaluations of systems available at publication show that dependable performance is uncommon across ordinary uses, with results robust to reasonable choices of tasks and reliability standards.
contradiction_condition: Representative evaluations of those systems show that dependable performance is common across ordinary uses, with results robust to reasonable choices of tasks and reliability standards.
measurement_requirements: Evaluate repeated performance, task requirements, errors, and variation across relevant models and uses. Explain task selection and distinguish average usefulness from dependable performance.
source_requirements: Independent evaluations or reproducible primary research. Anecdotes and the speaker's own conclusions cannot establish the claimed prevalence.
