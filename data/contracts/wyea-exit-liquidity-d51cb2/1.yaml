assessment_axis: causal_assessment
explicit_source_elements:
  - a large chunk of both companies’ revenues
  - dependent on their customers being able to continually raise capital
  - companies like Harvey
  - hundreds of millions of dollars every few months
  - to keep up with their costs
evaluator_interpretation:
  - Assess whether a substantial share of each provider's revenue requires customers to obtain repeated new financing to maintain purchases.
  - Venture backing or a completed funding round is not sufficient evidence of that necessity.
  - Read Harvey as a proposed example of the mechanism, not as a representative sample by itself.
  - Use July–September 2026 for the current dependence claim, with earlier funding history treated as context.
support_condition: Customer cash-flow and purchasing evidence establishes that repeated financing is necessary to sustain purchases representing a substantial share of each provider's revenue.
contradiction_condition: Representative evidence establishes that nearly all relevant purchases can be sustained from customer operations or existing resources without repeated financing, leaving only a small revenue share dependent on new capital.
measurement_requirements: Link provider revenue to customer cash generation, cash reserves, financing requirements, and purchasing responses to financing interruptions. Distinguish growth investment from funding required to maintain existing purchases.
source_requirements: Customer financial disclosures or reliable financial reporting combined with provider revenue exposure and evidence of the financing-to-spending mechanism.
