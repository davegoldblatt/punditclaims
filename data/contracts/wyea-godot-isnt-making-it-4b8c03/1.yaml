assessment_axis: forecast_outcome
explicit_source_elements:
  - this bubble bursting
  - massive layoffs
  - a dearth in venture capital funding
  - a much more fragile tech ecosystem
evaluator_interpretation:
  - The antecedent is a broad collapse of the generative AI investment boom surrounding the companies discussed, rather than any regional stock correction.
  - The predicted consequences are widespread technology-sector layoffs, substantially reduced access to venture funding, and increased business failures or financial vulnerability caused by that collapse.
  - The claim supplies neither numerical thresholds nor a deadline or a specified delay between the collapse and its consequences.
support_condition: Establish the antecedent, then show all three consequences through sector-wide employment, venture-funding and business-distress evidence, with credible evidence linking them to the AI collapse.
contradiction_condition: After an established collapse and a sufficiently observed aftermath, show that the predicted industry-wide damage did not occur, or that the asserted causal connection is inconsistent with the evidence.
measurement_requirements: Comparable pre-collapse and post-collapse measures of technology employment, funding availability and business distress. Separate investment dollars from deal counts and fundraising by venture funds.
source_requirements: Independent investment datasets, employment statistics and business-failure records, supplemented by reporting on causes.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A dated, broad AI investment collapse followed by clearly documented occurrence of all three attributable consequences could establish support without a stated deadline. A regional correction or isolated layoffs cannot.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No definition or geographic boundary for the bubble bursting.
  - No thresholds for massive, dearth or more fragile.
  - No deadline or specified observation period after the antecedent.
