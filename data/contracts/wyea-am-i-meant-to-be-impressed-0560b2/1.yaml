explicit_source_elements:
  - Every single one of these companies
  - talking about AI non-stop
  - not one of them can show a profit
evaluator_interpretation:
  - The surrounding discussion makes AI-business profitability the ordinary reading, rather than total corporate profitability.
  - The core companies are Amazon, Microsoft, Google, Meta, OpenAI and Anthropic. The wider passage also mentions hardware suppliers and other businesses, making the outer boundary uncertain.
  - Talking about AI non-stop is rhetorical emphasis, not a separate measurable frequency claim.
  - Can show means publicly demonstrate AI-specific profit by publication.
  - Use January–March 2026, the latest reported quarter before publication. Profit for a broader cloud or advertising segment is not automatically AI-specific profit.
  - The phrase does not specify GAAP, adjusted operating profit, gross profit or net income; the accounting basis remains unknown.
support_condition: A sufficiently complete review of the identified companies' public disclosures establishes that none demonstrated positive AI-specific profit on an identifiable, comparable basis by publication.
contradiction_condition: At least one identified company publicly demonstrated positive profit attributable to its AI business for the target period, with the relevant costs and accounting basis disclosed.
measurement_requirements: Identify the company set and AI-business boundary. Separate revenue, gross margin, operating income, net income and investment gains. Account for shared research, infrastructure and depreciation costs.
source_requirements: Public filings and earnings disclosures available by publication, supplemented by reliable reporting for private-company financials.
