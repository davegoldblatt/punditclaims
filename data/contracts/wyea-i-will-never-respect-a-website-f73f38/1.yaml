assessment_axis: forecast_outcome
explicit_source_elements:
  - I believe
  - things will only get worse
  - as capacity issues continue
evaluator_interpretation:
  - Things refers to customer access, usage allowances, subscription prices, and reliability at the two companies discussed immediately around the sentence.
  - The descriptions insane and deceptive are opinions and are not separately scored.
  - I believe introduces a substantive prediction rather than removing its factual content.
  - The condition requires evidence of continuing capacity pressure after April 14.
  - Only get worse is tested against material improvements in customer terms during continuing constraints. It is not treated as a prediction about an unspecified weighted satisfaction score.
support_condition: Comparable customer terms and service records show sustained deterioration while capacity constraints continue. With no deadline, finite deterioration alone cannot establish that conditions will only worsen indefinitely.
contradiction_condition: A dated, material improvement in customer access, allowances, prices, or reliability occurs while the relevant capacity constraints demonstrably continue.
measurement_requirements: Compare the same plans and services over time, separate temporary promotions from durable changes, and establish that the capacity condition held when the outcome occurred.
source_requirements: Dated company changes and service records, with separate evidence of contemporaneous capacity constraints.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A material improvement for existing customers can contradict only get worse before any deadline, but only if evidence establishes continuing capacity constraints at the time of that improvement.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - Things does not specify a metric or customer group.
  - Only get worse could mean uninterrupted deterioration or a worsening overall trend.
  - The capacity condition has no numerical threshold.
retrospective_or_prospective: retrospective
