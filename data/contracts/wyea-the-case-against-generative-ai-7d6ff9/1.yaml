assessment_axis: causal_assessment
explicit_source_elements:
  - capable of writing code
  - can’t do software engineering
  - understanding, maintaining and executing code to produce functional software
  - do not “learn,” cannot “adapt”
  - break down the more of your code and variables you ask them to look at at once
evaluator_interpretation:
  - "Assess capabilities current in the quarter up to the post: July 1 through September 29, 2025. Technical capabilities have no standard reporting period, so this is an explicit evaluator-selected window."
  - Substantive repository maintenance, debugging, testing, and feature implementation count as engineering tasks. Success on them does not establish the ability to take responsibility for an entire engineering job.
  - The passage combines a categorical inability claim with narrower concerns about reliability and context handling. These components can receive different evidential assessments.
  - Learning and adaptation are read operationally as using codebase context and feedback, rather than requiring human-like understanding or automatic changes to model weights.
support_condition: Controlled evaluations and deployment evidence show the asserted maintenance, adaptation, and context limitations. Supporting the complete causal claim would additionally require showing that those limitations prevent software engineering.
contradiction_condition: Reproducible success on substantive repository engineering tasks contradicts categorical inability. Demonstrated adaptation or controlled absence of the asserted context degradation would contradict the corresponding limitations.
measurement_requirements: Separate code generation from repository maintenance and execution. Measure task correctness, retained functionality, human assistance, adaptation, and the effect of context size while controlling task difficulty.
source_requirements: Prefer reproducible research and dated deployment studies. Include benchmark weaknesses and distinguish company self-reports from independent tests.
