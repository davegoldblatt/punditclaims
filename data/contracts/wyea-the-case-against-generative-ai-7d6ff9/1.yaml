ambiguity_flags:
  - The current-capability claim supplies no reporting period; the pre-post quarter-to-date window is evaluator-selected.
  - Do software engineering could mean performing substantive tasks or independently owning an entire job.
  - Learn, adapt, understand, and break down have no operational thresholds.
  - The claim does not distinguish standalone models from agents using tools and feedback.
