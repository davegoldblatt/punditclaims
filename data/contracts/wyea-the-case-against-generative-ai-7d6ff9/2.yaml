explicit_source_elements:
  - LLMs are capable of writing code
  - can't do software engineering
  - software engineering is the process of understanding, maintaining and executing code to produce functional software
  - LLMs do not "learn," cannot "adapt"
  - break down the more of your code and variables you ask them to look at at once
evaluator_interpretation:
  - The core claim is a capability judgment resting on the speaker's own definition of software engineering. That definition covers long-term maintenance, judgment and responsibility across a codebase.
  - He gives no threshold, task, benchmark or reliability level at which an LLM would count as 'doing software engineering'. Success on single repository tasks does not test his definition, and reviewers have said treating it that way would be unfair to him.
  - "'Do not learn' and 'cannot adapt' have no stated meaning. They could refer to fixed weights after training, or to whether a model adapts in context. Choosing either would decide the result for him."
  - The narrower sub-claim, that performance degrades as more code and context is supplied, can be tested. It is shown here as context only, because it cannot settle the main claim on its own.
support_condition: Would need an agreed test of 'doing software engineering' in his sense (sustained understanding and maintenance of functional software), showing LLMs fail it because they do not learn or adapt and they degrade as context grows.
contradiction_condition: Would need reproducible evidence that LLMs, without human engineers supplying the judgment, sustain understanding and maintenance of real functional software over time, in his sense of the term, and do not degrade with larger codebases.
measurement_requirements: null
source_requirements: Independent evaluations or peer-reviewed or preprint studies of LLM performance on long-horizon maintenance of real codebases.
