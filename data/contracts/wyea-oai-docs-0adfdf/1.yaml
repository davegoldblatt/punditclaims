explicit_source_elements:
  - According to the documents viewed by this newsletter
  - OpenAI spent $5.02 billion
  - on inference alone with Microsoft Azure
  - in the first half of Calendar Year CY2025
evaluator_interpretation:
  - The target period is January 1 through June 30, 2025.
  - Assess the spending amount, not merely whether Zitron reported seeing documents. The document attribution is a sourcing qualification, not a conditional forecast.
  - Read spending as charges incurred for Azure inference during the period, separate from training and revenue-sharing payments. The wording does not establish that every charge was settled in cash.
  - Treat $5.02 billion as rounded to the nearest $0.01 billion.
  - Use company_reported because the claim purports to reproduce company financial records. This classification does not authenticate those records or establish GAAP treatment.
  - Read the amount as gross inference spending before offsetting separate revenue flows between the companies.
support_condition: Authenticated company records or independently corroborated reporting establish that OpenAI incurred Azure inference charges during January–June 2025 that round to US$5.02 billion, with the accounting treatment identified.
contradiction_condition: Comparable records establish a different January–June 2025 Azure inference total outside the stated rounding precision, or demonstrate that the claimed total includes material spending outside the specified service or period.
measurement_requirements: A six-month Azure inference total, or reconciled quarterly totals, separating training, other providers, revenue-sharing payments, credits, and cash settlement from charges incurred.
source_requirements: Prefer Microsoft or OpenAI financial records. Independent reporting must verify the relevant records or amount; repetition of Zitron's claim is insufficient.
