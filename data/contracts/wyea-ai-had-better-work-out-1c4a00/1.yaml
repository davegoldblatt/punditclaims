ambiguity_flags:
  - The claim combines a since-2015 performance comparison with Q3 2026 investment concentration.
  - Investments could mean dollars or deal counts; context favors dollars.
  - Related to LLMs has no classification boundary.
  - Economic worth and particularly good have no stated thresholds.
  - Portfolio valuation growth and realized investor returns are different measures.
