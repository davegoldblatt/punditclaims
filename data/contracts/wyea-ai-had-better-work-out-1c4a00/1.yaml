assessment_axis: historical_observation
explicit_source_elements:
  - venture capital is not particularly good at creating value
  - the majority of its investments in a single industry
  - the majority of those investments
  - companies related to or powered by Large Language Models
  - have yet to prove their economic worth
evaluator_interpretation:
  - The surrounding figures indicate investment dollars, rather than deal counts.
  - Use global venture investment for the concentration assertion and Q3 2026 as its latest expressly identified quarter.
  - The value-creation comparison concerns investment since 2015 through the post. The target interval encompasses that history; its components must retain their separate periods.
  - Majority means more than 50%. The second majority uses AI investment as its denominator.
  - Evaluate weak value creation against the S&P 500 comparison invoked in context, using matched cash-flow timing and consistent treatment of fees and unrealized value.
  - Economically unproven means lacking demonstrated sustainable commercial returns. Revenue alone does not establish those returns, and undisclosed profitability does not establish losses.
support_condition: Comparable evidence establishes weak venture returns against the contextual benchmark, more than half of global Q3 2026 venture dollars going to AI, and more than half of those AI dollars going to LLM-related businesses without demonstrated sustainable commercial returns.
contradiction_condition: "Comparable evidence decisively refutes a material component: the concentration thresholds, the claimed lack of demonstrated economic returns among the majority of recipients, or the contextual venture-performance comparison."
measurement_requirements: Global investment amounts classified consistently by AI and LLM exposure; recipient financial evidence; venture cash flows, distributions, residual values, fees, and a cash-flow-matched public-market benchmark.
source_requirements: Primary investment datasets and return benchmarks with disclosed methodology, supplemented by recipient financial disclosures. US-only growth-equity figures cannot settle global venture-capital shares.
metric_scope: null
original_horizon: null
horizon_interval: null
