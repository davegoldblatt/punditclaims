assessment_axis: causal_assessment
explicit_source_elements:
  - there is not one risk but many
  - bias, disinformation, defamation, toxicity, invasion of privacy
  - risks to employment, intellectual property, and the environment
  - precisely because recent techniques can be applied in so many ways, still poorly understood
evaluator_interpretation:
  - Assess the substantive risk claim as it stood when posted on 2024-08-20; the reference to Senate testimony is background.
  - The ordinary reading concerns credible risks, not a claim that every harm has occurred everywhere or that net employment losses are inevitable.
  - Read the causal explanation as saying that broad applicability spreads exposure to different harms and limited understanding makes those harms harder to anticipate and control. It does not identify these as the only causes.
  - Recent techniques principally refers to generative AI and foundation models in this context.
support_condition: Research documents plausible mechanisms or observed examples across the listed risk categories and explains how broad reuse and gaps in understanding contribute to their spread or management difficulty.
contradiction_condition: Strong evidence shows that the listed categories are not credible AI risks, or that broad applicability and limited understanding do not contribute to the claimed range of risks.
measurement_requirements: Distinguish risk from realized harm, and employment disruption from proven aggregate job loss. Assess causal mechanisms rather than requiring one numerical risk measure.
source_requirements: Research papers and authoritative scientific assessments available by the evaluation date, with evidence relevant to the state of AI at the post date.
