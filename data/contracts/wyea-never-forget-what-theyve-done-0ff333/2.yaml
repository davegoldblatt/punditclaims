assessment_axis: causal_assessment
explicit_source_elements:
  - the information you look for is worse
  - because of Sam Altman and Satya Nadella
  - attachment to Large Language Models
  - have pumped our internet full of bullshit
evaluator_interpretation:
  - The plain reading is that the expansion of LLMs promoted by Altman and Nadella substantially increased low-quality online content and thereby worsened information people encounter.
  - Low-quality content includes fabricated information, misleading material, and mass-produced content with little informational value. AI authorship alone does not establish poor quality.
  - The attribution concerns their companies' development, deployment, and support of LLMs. It does not require personal authorship of junk content or an intention to cause harm.
  - Their contribution need not be the main or exclusive cause. 'Full of' indicates widespread proliferation, not a literal majority of internet content.
  - The statement concerns accumulated effects by June 9, 2025. It supplies no starting date, so the target period has an open lower bound.
  - This assessment addresses the supplied proposition about Altman and Nadella, not the surrounding accusations about Google or Facebook.
support_condition: Evidence establishes substantial proliferation of low-quality online content, connects OpenAI's and Microsoft's LLM expansion to that proliferation, and shows resulting deterioration in information encountered by users. Publication and exposure studies or credible comparisons can establish contribution without showing that these companies caused most of the harm.
contradiction_condition: Credible evidence covering the claimed phenomenon shows that the attributed expansion did not substantially contribute to low-quality content or did not produce the asserted deterioration. Other contributors, beneficial uses, or limited failures alone would not contradict the claim.
measurement_requirements: Distinguish AI authorship from factual accuracy and usefulness; distinguish content production from user exposure. Assess growth, quality, and attribution separately, then examine the causal connection.
source_requirements: Prefer independent studies and documented investigations, supplemented by company records establishing tool use and deployment. Later publications may describe conditions before the post, but evidence must have been available by October 28, 2026.
