  - No specified measure or comparison baseline for information being 'worse'.
  - The cumulative causal period has no explicit starting date.
  - The wording attributes responsibility to individuals without specifying particular corporate decisions.
  - Documented examples of pollution are easier to establish than the broader deterioration asserted.
