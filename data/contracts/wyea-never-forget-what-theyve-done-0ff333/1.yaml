explicit_source_elements:
  - the information you look for is worse
  - because of Sam Altman and Satya Nadella
  - deranged attachment to Large Language Models
  - pumped our internet full of bullshit
evaluator_interpretation:
  - "Plain reading: LLM products pushed by OpenAI (Altman) and Microsoft (Nadella) led to a flood of low-quality AI-generated content online, and this made the information people find worse."
  - "Testing it needs two things: evidence of a large rise in AI-generated content after ChatGPT, and evidence that this lowered the quality of what people actually find. It also needs a way to attribute that to these two leaders rather than to LLMs in general."
  - "Target period: ChatGPT's launch (November 2022) to the post date."
support_condition: Studies show a large rise in AI-generated web content since ChatGPT, that this content made search results or information found worse, and that the rise traces mainly to OpenAI and Microsoft tools.
contradiction_condition: Studies show AI content did not rise much, or that it did not reach users or lower the quality of results, or that it was driven by other actors.
measurement_requirements: Measured share of AI-generated web content over time, measured quality of search results, and some attribution to OpenAI and Microsoft products.
source_requirements: Independent measurement studies or peer-reviewed research.
