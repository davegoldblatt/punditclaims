assessment_axis: historical_observation
explicit_source_elements:
  - capital expenditures on generative AI and the associated infrastructure
  - over $200 billion
  - in the last year
evaluator_interpretation:
  - Read 'the last year' as the twelve months immediately preceding publication, December 3, 2023 through December 2, 2024.
  - The ordinary reading concerns spending already incurred, not announced budgets or future commitments.
  - Associated infrastructure includes infrastructure supporting generative AI. Counting all corporate capital expenditure requires evidence that it serves this purpose.
  - The statement identifies neither an accounting basis nor a defined group of companies.
support_condition: Comparable expenditure records establish more than USD 200 billion of realized generative-AI and associated infrastructure capital expenditure during the target period, without double counting.
contradiction_condition: A sufficiently comprehensive, comparable accounting establishes a total no greater than USD 200 billion during that period.
measurement_requirements: Separate actual expenditure from forecasts and commitments. Identify company coverage, treatment of finance leases, allocation of shared infrastructure, and exclusions for unrelated assets.
source_requirements: Company disclosures or a transparent aggregation grounded in those disclosures, with a documented allocation to generative AI.
