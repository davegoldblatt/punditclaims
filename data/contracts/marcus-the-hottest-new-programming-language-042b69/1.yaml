explicit_source_elements:
  - If the system really is being “programmed in English”
  - not always doing what is being asked to do
  - internal “system prompt”
  - allegedly
evaluator_interpretation:
  - "Preserve the condition: the relevant English instructions must actually have governed the ChatGPT sessions being evaluated."
  - "'Not always' requires at least one verified violation, not a high failure rate."
  - General GPT-4 failures or another product's behavior cannot establish a violation of this particular ChatGPT prompt.
  - Use January 1 through February 15, 2024 as the latest completed month and elapsed publication month for this ongoing observation.
support_condition: Establish that the relevant English system instructions applied, then identify at least one contemporaneous ChatGPT response or tool call that conflicts with an applicable instruction.
contradiction_condition: An authenticated, complete record of the relevant sessions establishes compliance and shows that the alleged violations involved different instructions, products, or misidentified outputs. A few compliant responses alone do not contradict 'not always'.
measurement_requirements: Pair dated session records with the instructions active in those sessions. Distinguish ChatGPT's tool-call text from the image subsequently generated by DALL-E.
source_requirements: Authenticated instructions or a credible technical reconstruction, plus independently documented outputs. A model's purported quotation of its own prompt is not sufficient authentication by itself.
