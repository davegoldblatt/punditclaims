support_condition: Robustness and distribution-shift studies of contemporary LLMs show, across many domains, that performance collapses under small or modest input changes, with few robust exceptions.
contradiction_condition: Studies of contemporary LLMs show robust generalization under distribution shift in a broad range of domains, so 'nearly any' generalization does not break easily.
measurement_requirements: Performance under shifted or perturbed inputs versus in-distribution inputs, across many task domains.
