explicit_source_elements:
  - LLMs can’t be trusted to run algorithms
  - as complexity and distance from the training distribution grows
  - The real takeaway from the Apple paper
evaluator_interpretation:
  - The plain reading is a warning about dependable, unaided algorithm execution by contemporary models, not a claim that every model fails every algorithm.
  - Both increasing problem complexity and departure from training examples matter to the stated claim.
  - Use June 2025, the reporting period of the Apple study discussed in the post. This is an inferred period for an ongoing observation.
support_condition: Controlled evaluations of contemporary models show substantial execution failures as complexity increases and as inputs depart from a documented training distribution, with solvability and output budgets checked.
contradiction_condition: Comparable evaluations establish dependable execution across increasing complexity and documented distribution shifts, sufficiently broadly to defeat the general reliability warning.
measurement_requirements: Measure complete execution accuracy, problem size, training-distribution exposure, output budgets, and whether external code execution is permitted.
source_requirements: Original experiments with reproducible task definitions and documented training exposure; distinguish measured distribution shifts from speculation about proprietary training data.
