evaluator_interpretation:
  - Assess both the financial characterization of the declaration and the allegation of deliberate misleading revenue messaging.
  - Read $5 billion as an approximate total, consistent with the supplied proposition. The surrounding text explicitly treats $5.5 billion as an upper boundary.
  - Use cumulative revenue since commercial entry and cumulative training and inference spending through March 9, 2026. Their starting dates are not supplied.
  - A lower bound does not establish an approximate total or an upper bound. Intent requires evidence beyond a supposed numerical inconsistency.
support_condition: The declaration or reconciled company records establish approximately $5 billion cumulative revenue and approximately $10 billion cumulative training and inference spending, with independent evidence of knowingly misleading revenue messaging.
contradiction_condition: Comparable records disprove the approximate totals, or records directly disprove the alleged knowing misrepresentation. Failure of the inference alone is not proof that no deception occurred.
measurement_requirements: Preserve lower-bound language, cumulative periods and the distinction between realized revenue, annualized revenue, expenditure and financing.
source_requirements: Read Rao’s original declaration; require independent records for the allegation of deliberate deception.
