assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI products do not provide significant revenue growth
  - not useful in the way that unlocks significant business value
  - products that have some adoption run at such a grotesque loss
evaluator_interpretation:
  - This is a combined claim about supplier revenue growth, customer business value and supplier losses.
  - Significant means commercially meaningful, rather than merely statistically detectable. No numerical threshold is invented.
  - Business value can include measured cost savings or improved output after implementation costs and service-quality effects.
  - Use January through March 2025, the latest broadly reportable completed quarter before publication.
  - A credible counterexample challenges the blanket wording, but one customer's savings cannot settle industry-wide revenue growth or product profitability.
  - No accounting basis or product population is supplied for the financial clauses.
support_condition: Representative evidence shows no commercially meaningful product-attributable growth or customer gains, together with large losses on adopted generative AI products.
contradiction_condition: Comparable evidence establishes commercially meaningful product-attributable revenue growth, net customer value or profitable adopted products. Any conclusion must identify which clause it settles.
measurement_requirements: Separate customer benefits from supplier finances. Measure realized revenue, implementation and operating costs, quality effects, and product-level profitability over comparable periods.
source_requirements: Product financial disclosures and credible customer evaluations, preferably independently measured; company-reported benefits must retain attribution and quality limitations.
