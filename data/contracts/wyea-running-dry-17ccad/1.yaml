assessment_axis: forecast_outcome
explicit_source_elements:
  - AI data center capex
  - almost-entirely funded by debt
  - when that debt runs out
  - NVIDIA’s growth
  - overall data center construction
  - will slow
evaluator_interpretation:
  - The principal proposition is a conditional forecast with a financing premise.
  - Almost entirely means an overwhelming share of total AI data-center investment, rather than only its funding shortfall or a selection of highly leveraged developers.
  - Debt runs out means a broad loss of new debt financing needed for construction, rather than higher yields alone.
  - NVIDIA growth is read as revenue growth. Construction slowdown means a lower pace of starts or completed capacity, measured consistently before and after financing withdrawal.
  - The current financing premise concerns the latest completed reporting quarter before the post, July through September 2026. It is not independently scored as an observation here.
  - The accounting basis for the financing share and the specific NVIDIA growth measure are not supplied.
support_condition: Evidence establishes the near-total debt-financing premise, a broad debt cutoff, and subsequent slowing of both NVIDIA revenue growth and overall construction attributable to that cutoff.
contradiction_condition: After a verified broad cutoff, reliable comparable data show that the predicted slowdowns do not occur through the affected funding cycle, or direct financing evidence disproves the asserted near-total debt dependence.
measurement_requirements: A sector-wide financing denominator separating operating cash, equity and debt; matched pre- and post-cutoff NVIDIA revenue growth and construction measures; evidence addressing alternative causes.
source_requirements: Company financing and cash-flow disclosures, consistent construction datasets, NVIDIA financial reports and reliable credit-market records.
