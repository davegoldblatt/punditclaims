interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No threshold defines viral, stronger or more nuanced.
  - No longer could be categorical or rhetorical emphasis on a shift in relative influence.
  - The exact quotation is broader than the normalized proposition.
  - The population of platforms and manipulation campaigns is unspecified.
