assessment_axis: causal_assessment
explicit_source_elements:
  - Viral content is no longer a result of lots of people deciding
  - a condition created by algorithms
  - algorithms manipulated by forces
  - getting stronger and more nuanced thanks to generative AI
evaluator_interpretation:
  - Assess the asserted causal change as of 2024-03-11.
  - Stronger means greater capacity to obtain distribution or viral reach; more nuanced means more adaptive or sophisticated manipulation.
  - Retain the source's displacement claim about audience interest rather than reducing it to the weaker proposition that some AI content becomes popular.
  - A fair test distinguishes increased production capacity from increased success in manipulating recommendations.
support_condition: Comparisons establish that generative AI increased manipulation sophistication and viral reach, and that manipulated recommendation systems displaced audience interest as the principal explanation of the virality being described.
contradiction_condition: Representative comparisons show no such AI-caused improvement, or establish that audience interest remains central rather than being displaced by AI-enhanced manipulation.
measurement_requirements: Compare otherwise similar campaigns with and without generative AI, measuring tactics, authentic engagement, recommendation exposure and viral reach separately. Account for audience preferences and coordinated fake engagement.
source_requirements: Prefer independent campaign studies, platform experiments and dated investigations. Later observations cannot establish the state at publication unless they reconstruct earlier activity.
