evaluator_interpretation:
  - The ordinary factual reading is that the advertised app-action features were highly unreliable in practical launch-period use, with repeated failures or substantial delays.
  - This does not mean that every action failed or that every R1 feature was unusable.
  - Use the April 23 launch through the May 13 post, reflecting the launch demo and recent reviews discussed in context.
  - No numerical success-rate threshold is supplied, so assess the qualitative claim against firsthand task reports.
support_condition: Contemporaneous firsthand tests repeatedly fail to complete core advertised app actions, or show delays and errors that make them unreliable for ordinary use.
contradiction_condition: Representative contemporaneous tests show core advertised app actions completing reliably with practical response times; isolated bugs would not establish barely functioning.
measurement_requirements: Evaluate completed app actions and practical delays. Separate these from unrelated camera, battery and general chatbot performance.
source_requirements: Contemporaneous demonstrations or firsthand independent reviews describing actual task attempts, including successful attempts.
