assessment_axis: forecast_outcome
explicit_source_elements:
  - over $700 million in 2024
  - before you consider stock-based compensation
  - a number that will also have to increase
  - because it’s “growing”
evaluator_interpretation:
  - Assess a rise in OpenAI's company-wide annual cash salary expense from its comparable 2024 baseline.
  - The stock-compensation exclusion defines the metric; it is not a conditional antecedent.
  - Growth and hiring are the stated explanation, rather than an explicit if-then condition.
  - No deadline is stated. Do not impose a 2025 deadline.
  - Headcount growth, advertised salaries, equity awards, and subsidiary payroll are insufficient by themselves to establish the company-wide annual cash salary bill.
support_condition: Comparable completed-year evidence shows company-wide cash salary expense exceeding its established 2024 level, with evidence consistent with expansion of the workforce.
contradiction_condition: A decisive terminal event establishes that the salary bill never increased after the post. A decrease in one subsequent year alone cannot defeat this undated forecast.
measurement_requirements: Comparable full-year company-wide salary expenses excluding stock compensation, with a verified 2024 baseline. Separate salaries from benefits, bonuses, and equity where the source distinguishes them.
source_requirements: Company payroll disclosures, financial records, or credible independent reporting of total salary expense. Hiring counts and wage samples are context only.
metric_scope:
  company: OpenAI
  metric: Annual cash salary expense excluding stock-based compensation, compared with 2024
  currency: USD
  units: millions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when a subsequent completed calendar year's comparable company-wide cash salary expense demonstrably exceeds the verified 2024 baseline. Resolve as contradicted only on a terminal event that makes any later increase impossible and establishes that no increase occurred.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is supplied.
  - The wording does not distinguish base salaries from cash bonuses or employee benefits.
  - The baseline says over $700 million, while available secondary reporting gives a rounded $700 million.
  - The causal wording does not specify how much of an increase must come from hiring rather than higher pay.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
