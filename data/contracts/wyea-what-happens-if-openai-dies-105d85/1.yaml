assessment_axis: forecast_outcome
explicit_source_elements:
  - Microsoft Absorbs OpenAI
  - Microsoft’s first move
  - cancel effectively all cloud contracts that OpenAI has
  - restate guidance
  - $250 billion in “incremental Azure spend”
evaluator_interpretation:
  - Absorption means a completed takeover placing OpenAI's business under Microsoft's control, beyond a minority investment or partnership.
  - The following sentence about Google, Oracle, and Amazon makes external cloud contracts the ordinary reading of the cancellation clause.
  - Effectively all means all material external cloud commitments, allowing immaterial exceptions.
  - First move means initial integration decisions; no numerical response window is supplied.
  - The $250 billion is a purchase commitment described using company terminology, not realized Azure revenue.
support_condition: After a completed Microsoft absorption of OpenAI, initial integration actions cancel all material external cloud commitments and Microsoft revises guidance to remove the specified incremental Azure commitment.
contradiction_condition: After absorption, definitive initial integration decisions retain material external cloud commitments, or Microsoft explicitly retains the specified commitment in applicable guidance after addressing the takeover.
measurement_requirements: Establish control, inventory material external contracts before and after absorption, and compare the same guidance measure before and after the transaction. Contract commitments must not be substituted for recognized revenue.
source_requirements: Acquisition and control disclosures, contract termination records or confirmed counterpart disclosures, and Microsoft's actual guidance revisions.
metric_scope:
  company: OpenAI
  metric: Incremental Azure purchase commitment reflected in Microsoft guidance
  currency: USD
  units: billions
  accounting_basis: company_reported
