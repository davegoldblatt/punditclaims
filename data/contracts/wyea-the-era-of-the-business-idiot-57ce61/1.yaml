assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI
  - forced adoption and proliferation
  - providing a meager return
  - massive investment of capital
evaluator_interpretation:
  - The plain reading is that realized economic benefits were small relative to the capital committed to generating them. It does not assert that every deployment produced zero benefit.
  - Returns may include supplier earnings and users' realized savings or output gains. These require separate measurement before any aggregation.
  - No ordinary numerical cutoff uniquely defines meager; I do not impose one.
  - For the ongoing observation, use the latest completed calendar quarter before publication, January through March 2025.
  - Forced adoption describes the claimed setting. Establishing it requires evidence of imposed deployment, rather than assuming all adoption was compulsory.
  - This is an industry-wide economic claim, not a specified company's accounting metric, so metric_scope is null.
support_condition: Broad, consistently scoped evidence establishes that realized benefits were small relative to the capital required for those benefits during the target period, while accounting for meaningful successful deployments.
contradiction_condition: Broad, consistently scoped evidence establishes substantial realized net benefits relative to the relevant capital investment during the target period.
measurement_requirements: Match benefits and investment by activity, population, and period. Separate funding raised from capital expenditure, revenue from profit, and task productivity from realized financial returns. Avoid double-counting transactions between suppliers and customers.
source_requirements: Industry investment data, company financial disclosures, and representative or independently measured deployment benefits. Do not use selected success or failure anecdotes as industry totals.
