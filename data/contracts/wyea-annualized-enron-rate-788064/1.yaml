assessment_axis: historical_observation
explicit_source_elements:
  - 80% of Anthropic and OpenAI’s revenues
  - 1% of their customers
  - the vast majority of which are AI startups
  - 300% to 1000% of their revenue on AI tokens
evaluator_interpretation:
  - The plain reading concerns each provider's total realized revenue and its own paying customers, rather than only business payments visible through one financial platform.
  - Use July–September 2026, the latest completed calendar quarter before the post, because no measurement period is specified.
  - Vast majority refers to a clear predominance by customer count within the high-spending group; no precise percentage is supplied.
  - The spending ratio compares actual token expenditure with the same startup's realized revenue over the same period.
  - The surrounding argument invokes external spending estimates, so estimate is the applicable basis.
support_condition: Matched customer-level data establish approximately 80% of each provider's total revenue from its top 1% of customers, show that a clear predominance of those customers are AI startups, and establish token expenditures of three to ten times their same-period revenue.
contradiction_condition: Comparable full-population data materially conflict with the 80%/1% concentration, the customer classification, or the three-to-ten-times spending ratios. A narrower sample or a different concentration statistic alone does not establish contradiction.
measurement_requirements: Complete paying-customer denominators and realized revenue distributions for both providers; customer classifications; and matched actual token expenditures and realized startup revenue.
source_requirements: Prefer provider financial records and customer accounts. Payment-platform samples must disclose coverage and cannot be silently generalized to total company revenue.
metric_scope:
  company: OpenAI and Anthropic, assessed separately
  metric: Total revenue share from top 1% of customers, their classification, and token expenditure relative to customer revenue
  currency: null
  units: percent and expenditure-to-revenue ratio
