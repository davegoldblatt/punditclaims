assessment_axis: historical_observation
explicit_source_elements:
  - the Anthropic-Musk compute deal
  - AI data centers are mostly not getting finished
  - taking two or three years even for smaller builds
evaluator_interpretation:
  - Treat this as an observation about construction outcomes. The deal is offered as an indicator, not as a cause of construction delays.
  - Use January–March 2026, the latest completed calendar quarter before publication, to assess the ongoing industry state.
  - Read 'mostly not getting finished' as a majority of projects failing to reach usable operation when completion could reasonably be expected. Counting recently announced projects whose completion dates remain in the future would not establish failure.
  - Read 'two or three years' as a typical construction-start-to-usable-operation duration of approximately 24–36 months, including smaller facilities. Isolated exceptions would not settle this industry-wide claim.
support_condition: A representative AI-project cohort shows that more than half of projects expected to be operational remain unfinished, and completed smaller projects typically require approximately 24–36 months from construction start to usable operation.
contradiction_condition: Comparable representative records show that most projects reach usable operation as expected, or that completed smaller facilities typically take materially less than two years. An individual fast build is insufficient.
measurement_requirements: Project-level construction starts, original completion expectations, commissioning dates, operational status, and facility size. Separate first operational phases from completed campuses, and delays from cancellations.
source_requirements: Prefer commissioning records, permits and operator disclosures, combined with a transparent industry dataset. The Anthropic agreement alone cannot establish industry completion rates.
