ambiguity_flags:
  - The observation has no explicit reporting period; the latest completed calendar quarter is used.
  - The project population and the denominator for 'mostly' are unspecified.
  - The speaker does not distinguish unfinished projects from overdue projects.
  - "'Smaller builds' has no size threshold."
  - Construction start, first usable phase, and full-campus completion are different milestones.
