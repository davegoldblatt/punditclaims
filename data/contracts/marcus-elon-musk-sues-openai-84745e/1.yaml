explicit_source_elements:
  - the recital of facts in Musk’s lawsuit
  - largely accurate
  - consistent with
  - earlier reporting by The New York Times and The New Yorker
evaluator_interpretation:
  - The relevant document is the original February 2024 state complaint, not every allegation in later federal pleadings.
  - Largely accurate means substantially correct on the central historical assertions. It does not require every incidental detail to be correct.
  - Central assertions include the founding commitments, subsequent assurances, Musk's participation, and the claimed departure from those commitments.
  - The target period covers the founding discussions through the state complaint. The unspecified earlier news articles are not treated as identified corroboration.
support_condition: Independent records substantially confirm the complaint's central factual narrative, including the commitments and alleged departures.
contradiction_condition: Independent records disprove central parts of that narrative sufficiently to defeat its substantial overall accuracy.
measurement_requirements: Assess material assertions rather than count true and false sentences. Separate historical facts, disputed intentions, legal conclusions, and characterizations of AGI.
source_requirements: Original complaint plus contemporaneous records, discovery, independent reporting, or findings on the merits.
