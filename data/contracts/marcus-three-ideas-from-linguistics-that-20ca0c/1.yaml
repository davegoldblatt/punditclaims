assessment_axis: causal_assessment
explicit_source_elements:
  - its word sequence predictions are often so good
  - more a reflection of the tremendous size of the input corpus
  - than of a system that genuinely maps sentence onto reference and cognitive models
evaluator_interpretation:
  - The target is GPT-3 as discussed in June 2022.
  - "The ordinary reading is a comparative causal claim: training-corpus size explains more of GPT-3's successful word prediction than representations connecting sentences to referents and changing world states."
  - Prediction quality can be tested with held-out next-word loss and completion accuracy; these measures are supplied by the evaluator.
  - Corpus size and learned representations can contribute jointly. Evidence that one matters does not by itself establish that it matters more than the other.
  - No observation reporting period or forecast deadline is imposed on this causal assessment.
support_condition: Controlled experiments on GPT-3 or validated faithful replications attribute a greater contribution to training-corpus size than to referential or world-state representations on held-out word prediction.
contradiction_condition: Comparable controlled experiments establish that referential or world-state representations contribute at least as much as corpus size to GPT-3's held-out word prediction.
measurement_requirements: Vary corpus size while controlling data quality, model capacity, and training budget; separately intervene on referential or state-tracking representations. Compare effects on the same prediction tasks and account for interactions between data and learned mechanisms.
source_requirements: Primary controlled studies with identifiable models, training conditions, interventions, and prediction results, available by 2026-10-28.
