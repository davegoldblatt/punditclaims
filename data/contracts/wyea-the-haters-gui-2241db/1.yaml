evaluator_interpretation:
  - The ordinary reading of a bubble is that speculative expectations have pushed valuations materially beyond what plausible future earnings and returns can sustain.
  - The surrounding discussion identifies NVIDIA as the central point of failure. Concentration alone does not establish that its failure would destabilize the entire AI trade.
  - For the ongoing market observation, the target is the latest completed trading session before publication through the publication date. Earlier financial reports provide context.
  - No numerical valuation threshold, definition of weakness, or test of systemic dependence is supplied.
support_condition: Evidence about the market at publication establishes both unsustainable speculative valuations across the AI trade and a dependence on NVIDIA capable of destabilizing that trade.
contradiction_condition: Evidence about the same market establishes that the asserted broad overvaluation or central dependence does not hold. Subsequent price appreciation alone would not establish this.
measurement_requirements: Valuations compared with defensible earnings and return assumptions, plus evidence tracing financial dependence on NVIDIA. Distinguish concentration, vulnerability, and an established bubble.
source_requirements: Contemporaneous market data, financial disclosures, and transparent independent valuation or systemic-risk analysis.
