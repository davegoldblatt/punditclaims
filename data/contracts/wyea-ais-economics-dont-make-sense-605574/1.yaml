evaluator_interpretation:
  - The observation describes Abilene during April 22–28, 2026, the dates supplied by the surrounding passage.
  - The plain reading is that operational capacity corresponded to two buildings and that delivery was behind an applicable announced schedule.
  - A missed milestone already due by April 28 would support the schedule allegation. A later completion target is not itself an April failure.
  - A revised completion forecast could demonstrate slippage against an original plan, but the applicable baseline must be identified.
  - Operational power, critical IT load, energized buildings, and completed construction are distinct measures.
support_condition: Dated capacity evidence establishes approximately two buildings in operation, and an applicable milestone or documented schedule revision establishes delay as of April 22–28.
contradiction_condition: Dated records establish materially more than two buildings operational, or establish compliance with the applicable schedule and resolve the alleged earlier slippage.
measurement_requirements: The original and revised delivery schedules, milestone definitions, building-level commissioning dates, and the basis of the reported megawatt figure.
source_requirements: Prefer Oracle and Crusoe announcements, contractual milestones, commissioning records, and independent dated observations.
