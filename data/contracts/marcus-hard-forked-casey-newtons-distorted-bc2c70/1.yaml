assessment_axis: historical_observation
explicit_source_elements:
  - A whole lot of students
  - (perhaps the majority of OpenAI's users)
  - use LLMs daily to write term papers
  - coders use it a lot too
evaluator_interpretation:
  - "Plain reading: a large number of students use LLMs in writing their assessed papers, and a large share of programmers use AI tools in their work."
  - The parenthetical 'perhaps the majority of OpenAI's users' is openly hedged. I do not score it.
  - I read 'daily' loosely, as habitual use. No source measures how many students use LLMs daily for papers.
  - "'Write term papers' is read to include using LLMs to help write or generate text for assessed work, not only submitting unedited AI text."
  - He named no period. I use calendar 2024 up to the post date, the latest period surveys before the post could report on.
support_condition: Surveys from 2024 show that a substantial share of students use generative AI for written assessments, and that a majority or large share of developers use AI tools in their work.
contradiction_condition: Surveys show only a small share of students using LLMs for written work, or only a small share of developers using AI tools.
measurement_requirements: Survey shares of students using generative AI for assessments and of developers using AI tools, from the 2024 period.
source_requirements: Independent surveys such as HEPI, Pew or Stack Overflow.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2024-01-01
  end: 2024-12-06
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Daily' is not measured by any survey I found."
  - "'Write term papers' could mean help with writing or wholesale AI-written text. The outcome depends on the looser reading."
  - The hedged parenthetical about OpenAI's user base is not scored.
  - No period stated. The 2024 window is my choice.
