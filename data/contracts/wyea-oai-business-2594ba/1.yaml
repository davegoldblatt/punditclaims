early_resolution_rule: Resolve the full claim only when dated financing and financial-necessity evidence jointly establish it, or a demonstrated alternative route to continued operation disproves exclusivity. An above-threshold financing by itself settles only the narrower numerical reading.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - $200 billion is not explicitly stated as a minimum.
  - Pre-money versus post-money valuation is unspecified.
  - Only way to survive is stronger than a prediction that another large round will occur.
  - Survival has no defined duration or financial test.
  - The $10 billion amount is qualified by likely.
