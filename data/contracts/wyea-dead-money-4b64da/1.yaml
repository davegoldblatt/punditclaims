explicit_source_elements:
  - if that debt was repriced today
  - at the very best
  - between 11% and 13.22%
evaluator_interpretation:
  - Today means September 29, 2026.
  - Assess the conventional fixed-rate unsecured bond basket discussed in the surrounding passage, rather than every form of CoreWeave borrowing.
  - The ordinary reading is an indicative replacement yield range before an additional new-issue premium.
  - This is a contemporaneous counterfactual calculation, not a forecast conditional on an actual refinancing.
  - The statement about last year's coupons supplies background; the screened target is the replacement yield range.
support_condition: Matching September 29, 2026 Treasury benchmarks and CoreWeave credit spreads reproduce replacement yields spanning approximately 11% to 13.22% for the identified bond basket.
contradiction_condition: Reliable, same-date and same-instrument observations establish replacement yields materially inconsistent with that range, including comparable issuance below the claimed best-case floor.
measurement_requirements: Identify each bond, seniority, currency, maturity and original tenor. Distinguish yield to maturity, yield to worst, coupon and new-issue yield; document any conversion between them.
source_requirements: Issuer bond documents plus independently dated bond-market observations or comparable firm underwriting terms. Secured loans and convertible coupons are not substitutes.
