explicit_source_elements:
  - each of these deals is guaranteed by the parent company
  - CoreWeave itself
  - will eventually be forced to make them whole
evaluator_interpretation:
  - The antecedent, supplied by the surrounding sentence, is collapse of the relevant CoreWeave borrowing SPVs.
  - "'Make them whole' means full payment of creditors' enforceable claims, rather than merely allowing creditors to pursue CoreWeave."
  - Treat the guarantee statement as an asserted premise, not as permission to assume every facility has an unlimited payment guarantee.
  - "'Eventually' supplies no deadline."
support_condition: Following a qualifying SPV collapse, final payment records show full creditor recovery compelled through CoreWeave's parent guarantees.
contradiction_condition: Following a qualifying collapse, a final binding resolution establishes that creditors will receive less than full payment and cannot obtain the shortfall from CoreWeave.
measurement_requirements: Identify the failed borrower, applicable guarantee, enforceable creditor claims, parent payments, and final recoveries. A guarantee's existence alone is not evidence of full recovery.
source_requirements: Filed guarantees, dated default or insolvency records, court orders, and creditor-payment disclosures.
metric_scope:
  company: CoreWeave
  metric: Full creditor recovery under parent guarantees following subsidiary SPV collapse
  currency: USD
  units: creditor claims and recoveries
  accounting_basis: company_reported
