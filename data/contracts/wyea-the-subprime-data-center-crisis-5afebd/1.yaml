early_resolution_rule: After a qualifying SPV collapse, settle only on documented full payment or a final binding disposition establishing an unrecoverable shortfall. Distressed trading prices and the wording of an untriggered guarantee do not settle recovery.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Collapse' does not specify insolvency, payment default, or liquidation."
  - "'Eventually' has no deadline."
  - "'Each of these deals' may refer to the named DDTLs or a wider set."
  - A legal guarantee and actual payment in full are different propositions.
