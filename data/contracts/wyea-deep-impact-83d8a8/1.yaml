assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI loses money on every transaction
  - even its $200-a-month "ChatGPT Pro" subscription
evaluator_interpretation:
  - The ordinary reading is that revenue from each paid transaction or subscription fails to cover the attributable cost of supplying it. A company-wide loss alone does not establish this.
  - For this ongoing observation, use January 2025 through the post date, the latest current operating period that could have been described publicly.
  - The cited Pro statement concerns the subscription product collectively. It does not necessarily describe every subscriber.
  - The universal assertion supplies no accounting basis. The narrower Pro example refers to a company executive's statement.
support_condition: Comparable revenue and attributable-cost evidence establishes losses across all transactions and subscriptions in the target period, including Pro.
contradiction_condition: Reliable evidence identifies a profitable transaction or subscription in the target period on the same cost basis.
measurement_requirements: Transaction or subscriber revenue matched to attributable costs, with the treatment of training, research, overhead and unused capacity stated.
source_requirements: Company records or a transparent, independently checkable reconstruction. Aggregate company losses cannot establish universal negative unit economics.
