  - Test the company's characterization of its largest investment. The statement does not specify an expenditure amount or establish that metaverse spending previously ranked first.
  - The comparison runs from the rebranding to the post date.
support_condition: Contemporary announcements establish the rebranding date and an increased strategic emphasis on AI, with Zuckerberg identifying AI as Meta's largest investment before the post.
contradiction_condition: The attributed investment statement is inaccurate, the timing is wrong, or contemporary announcements do not establish the claimed change in strategic emphasis.
measurement_requirements: Compare public strategic announcements. Do not infer a measured transfer of spending between AI and the metaverse from their wording.
