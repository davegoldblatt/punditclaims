evaluator_interpretation:
  - The preceding discussion makes this a claim about GPT-4 with Code Interpreter or Wolfram Alpha.
  - The plain reading is that users cannot depend on consistently correct solutions across ordinary simple word problems; it does not require literal perfection.
  - Use the 2023 model generation as the reporting period, restricted to evaluations conducted before October 23. No regular reporting interval is specified.
  - Separate ordinary single-answer use from additional verification and repeated-sampling methods.
support_condition: Representative tests of simple word problems show recurring material failures with the named plug-ins under ordinary use.
contradiction_condition: Representative tests show consistently dependable solutions across simple mathematical and scientific word problems with the named plug-ins.
measurement_requirements: Task difficulty, accuracy, plug-in identity, prompting, repeated sampling, and error examples must be reported. Advanced-problem failures alone cannot settle this claim.
