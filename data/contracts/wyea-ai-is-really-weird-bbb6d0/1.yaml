ambiguity_flags:
  - Repeated seem qualifies the worker assertions.
  - No comparison period or geographic scope.
  - Nominal versus inflation-adjusted pay is unspecified.
  - Replacement could mean individual layoffs, reduced hiring or occupation-wide displacement.
  - Truly vibe coded has no stated provenance threshold.
  - Incredible and beloved are evaluative terms without a common pass/fail standard.
