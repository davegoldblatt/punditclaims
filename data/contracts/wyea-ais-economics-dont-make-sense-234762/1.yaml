assessment_axis: historical_observation
explicit_source_elements:
  - a large part — if not the majority
  - AI compute revenue
  - dependent on a continual flow of venture capital and debt
evaluator_interpretation:
  - The surrounding discussion makes this a claim about revenue from renting AI computing capacity.
  - The plain reading is that a substantial share of customer payments could not continue without further external financing. Being unprofitable or having raised money does not alone establish that dependence.
  - The majority formulation is qualified. I do not turn it into a firm threshold above 50%.
  - For this ongoing observation, I use January through March 2026, the latest completed calendar quarter that public evidence could describe before the post.
support_condition: Revenue-weighted evidence shows that a substantial share of AI compute rental revenue in the target period depended on customers obtaining continuing venture funding or debt.
contradiction_condition: Representative evidence shows that financing-dependent customers accounted for only a small share of the sector's revenue, with the remainder sustainably funded from customer operations or existing resources.
measurement_requirements: A sector revenue denominator, customer-level compute payments, and evidence separating dependence on additional financing from existing cash, operating cash generation, and discretionary expansion.
source_requirements: Provider revenue disclosures matched to customer financing and cash-flow records. Financing announcements alone are insufficient.
