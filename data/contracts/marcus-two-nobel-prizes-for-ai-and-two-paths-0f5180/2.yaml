assessment_axis: historical_observation
explicit_source_elements:
  - the citation seems to indicate
  - he won it for inventing back-propagation
  - but, well, he didn’t
evaluator_interpretation:
  - The categorical assertion is that Hinton did not invent back-propagation. In context, inventing means originating the method, rather than subsequently developing, demonstrating or popularising it.
  - The words 'seems to indicate' qualify Marcus's interpretation of the Nobel citation. That impression is not scored as a categorical assertion about what the citation says.
  - The assessment covers historical priority through the post date. The claim supplies no starting date.
support_condition: Reliable historical records establish that back-propagation existed before Hinton's contribution, or establish that his contribution was a rediscovery or development of an existing method.
contradiction_condition: Reliable historical records establish Hinton's original priority for back-propagation. Evidence that he made important subsequent contributions would not suffice.
measurement_requirements: Distinguish original invention from independent rediscovery, demonstration and popularisation.
source_requirements: Use historical publications, accounts from participants, or authoritative histories. Read the Nobel materials for context without converting the qualified citation impression into a categorical claim.
