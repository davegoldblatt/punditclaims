evaluator_interpretation:
  - "Assess two components separately: Hinton's historical priority and what the Nobel announcement credits."
  - Inventing means originating the method, rather than independently rediscovering, demonstrating or popularizing it.
  - Read 'seems to indicate' as a qualified description of the award documents, not a claim about Marcus's private impression.
  - The target period covers the relevant research history through the announcement discussed in the post.
support_condition: Earlier documented development establishes that Hinton did not originate back-propagation. The citation component is supported if the award documents credit him with originating it.
contradiction_condition: The priority component is contradicted by evidence establishing Hinton's original invention. The citation component is contradicted if the official explanation identifies different foundational work and acknowledges predecessors for back-propagation.
measurement_requirements: Distinguish invention, independent rediscovery, practical demonstration and popularization.
source_requirements: Historical research records and the Nobel awarding body's own citation and explanation.
