evaluator_interpretation:
  - Because the post appeared during 2023, the observation concerns year-to-date evidence available before publication, not the completed calendar year.
  - The post links directly to Crunchbase's August 29 report about American startups. I therefore use its U.S. scope and broad AI-related classification.
  - Reliable roads to capital means comparatively resilient aggregate fundraising, not guaranteed access for individual startups.
  - Metric scope is null because this is a sector-wide funding-share claim rather than a claim about one company's money.
support_condition: The linked U.S. funding dataset places AI-related startups above 25% of 2023 year-to-date startup investment and reports greater funding resilience than the broader startup market.
contradiction_condition: Matched U.S. year-to-date data place the share at or below 25%, or show that the asserted relative funding resilience did not exist.
measurement_requirements: Use dollar share rather than deal share; keep geography, funding categories, AI classification and observation window consistent.
source_requirements: Primary venture-funding datasets or the dataset provider's own analysis.
