assessment_axis: forecast_outcome
explicit_source_elements:
  - as much as $447 billion in costs
  - in the next four years
  - pay for it up front in big, ugly chunks
  - unlike previous years
evaluator_interpretation:
  - The surrounding quotation anchors the deadline to December 31, 2030; this is the latest plausible endpoint rather than the literal fourth anniversary of the post.
  - The forecast concerns realized payments under the cited compute commitments, including substantial payments before the related capacity becomes operational.
  - The approximately $447 billion figure describes the projected scale of those commitments. It is not treated as a ceiling on spending under unrelated future contracts.
  - The statement does not specify how much must be prepaid or what payment size qualifies as a large chunk.
support_condition: Payment disclosures through the deadline substantiate the projected approximately $447 billion scale under the cited commitments and show substantial advance payments before capacity becomes operational.
contradiction_condition: Final payment records or definitive termination of the cited arrangements establish a materially different payment scale or show that substantial upfront payments did not occur.
measurement_requirements: Reconcile actual cash payments to the cited commitments, identify payments made before the post, and distinguish cash paid, expenses incurred, capitalized assets, and unpaid obligations.
source_requirements: Company cash-flow statements, contractual-obligation reconciliations, lease notes, and payment or termination disclosures through the deadline.
