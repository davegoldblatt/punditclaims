assessment_axis: forecast_outcome
explicit_source_elements:
  - Anthropic
  - compute commitments
  - as much as $447 billion in costs
  - in the next four years
  - unlike previous years
  - pay for it up front in big, ugly chunks
evaluator_interpretation:
  - Read $447 billion as an approximate upper exposure under the commitments discussed, not a required realized payment total or a ceiling on spending under future agreements.
  - Use December 31, 2030 as the endpoint because the surrounding passage explicitly identifies that date.
  - Read the upfront-payment wording as a substantial shift toward large payments before the related compute becomes operational. It does not require every payment to be upfront or establish a numerical majority threshold.
  - Read compute costs as the compute and infrastructure commitments cited in context. Distinguish contractual exposure, costs incurred, and cash payments.
support_condition: Records substantiate approximately $447 billion of potential costs under the referenced commitments through end-2030, and payment terms and subsequent performance establish a substantial shift toward large advance payments. Realized payments need not approach $447 billion for the upper-exposure statement to hold.
contradiction_condition: Records establish that the stated upper exposure was materially misrepresented, or comprehensive payment records establish that the predicted substantial shift toward large advance payments did not occur. Lower realized payments alone do not contradict an upper exposure. Spending under additional agreements does not by itself contradict the quoted amount.
measurement_requirements: Track the referenced commitments through end-2030, including amendments, cancellations, amounts incurred, cash payments, and the dates related capacity becomes operational. Compare advance-payment practices with the preceding arrangements. Do not substitute expense recognition, financing raised, or total commitments extending beyond 2030 for payments within the forecast period.
source_requirements: Prefer dated company filings, contractual payment schedules, and subsequent financial disclosures. Distinguish company expectations from completed payments and verify any event offered as an early resolution.
