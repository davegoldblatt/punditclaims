explicit_source_elements:
  - based on audited financial documents
  - independently verified by the Financial Times
  - OpenAI lost around $38.5 billion in 2025
evaluator_interpretation:
  - The surrounding text identifies the measure as net loss attributable to OpenAI after allocating losses to noncontrolling interests.
  - This is a statement about accounting loss, including noncash charges, rather than cash burn.
  - The accounting basis is company_reported because Zitron purports to quote company financial statements. Audited does not by itself identify GAAP or IFRS.
  - The word around permits corroboration reported at a coarser precision, provided the accounting measure matches.
support_condition: Audited company accounts, or independent reporting verifying those accounts, establish an approximately $38.5 billion net loss attributable to OpenAI for calendar 2025.
contradiction_condition: Comparable verified accounts establish a materially different attributable net loss, or establish that the stated figure represents a different accounting measure.
measurement_requirements: Full-year attributable net loss in USD, including noncash charges and after allocations to noncontrolling interests.
source_requirements: Company financial statements or independent verification of their contents. Repetition of Zitron alone is insufficient.
