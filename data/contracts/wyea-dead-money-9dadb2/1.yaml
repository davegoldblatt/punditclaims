assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA’s GPU sales are proof of actual demand for AI services
  - hyperscaler growth is a result of all those capital expenditures
  - a complete lie
evaluator_interpretation:
  - Assess the factual substance of the two asserted relationships, not whether an unidentified person knowingly deceived anyone.
  - The ordinary reading challenges the inference from hardware purchases to downstream demand and from capital spending to growth. It need not deny that any individual chip ever earns revenue.
  - Use April–June 2026 as the latest broadly reportable quarter before the post, with earlier spending relevant as a possible cause.
  - This is a qualitative causal claim, without a specified financial amount or accounting measure.
support_condition: Evidence tracing purchases, deployment and customer activity shows that the asserted downstream demand and growth relationships are materially false for the relevant hyperscalers.
contradiction_condition: Evidence tracing purchases to paid AI use and deployed capital to material incremental growth establishes the relationships the claim rejects; coincident increases in spending and revenue alone are insufficient.
measurement_requirements: Separate hardware orders, operational capacity, paid service consumption and incremental growth. Address deployment lags, other growth drivers and the difference between some contribution and explanation of aggregate growth.
source_requirements: Deployment and service records, financial disclosures with specific causal attribution, or credible independent causal analysis.
