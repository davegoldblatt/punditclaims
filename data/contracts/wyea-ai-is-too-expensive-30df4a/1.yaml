explicit_source_elements:
  - $45 billion in annualized revenue
  - assuming it had zero operating expenses
  - not be enough
  - a single year of capital expenditures
  - Microsoft, Google, Meta, or Amazon
  - 2024 or 2023
evaluator_interpretation:
  - Treat $45 billion and zero operating expenses as stipulated inputs to an arithmetic comparison, not claims that Anthropic actually achieved those conditions.
  - The ordinary reading is that every named company's individual annual capex total in both named years exceeds $45 billion.
  - Use each company's reported annual capex, preserving its fiscal-year convention and stated treatment of leases.
  - One company-year at or below $45 billion is sufficient to disprove the universal comparison.
  - The comparison concerns company-reported historical expenditure, not a separately specified GAAP capex measure.
support_condition: All eight company-year capex totals exceed $45 billion on their stated company-reported bases.
contradiction_condition: At least one named company reports annual capex of $45 billion or less for 2023 or 2024.
measurement_requirements: Compare $45 billion with individual annual capex totals. Do not combine companies or years, or substitute current capex guidance.
source_requirements: Company annual reports or full-year earnings disclosures for the named years.
