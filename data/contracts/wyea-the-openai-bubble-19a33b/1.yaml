explicit_source_elements:
  - Otherwise
  - very little evidence
  - more than a few billion in demand for AI compute
  - that’s being generous
evaluator_interpretation:
  - "Read 'otherwise' as excluding the six immediately named consumers: Microsoft, Google, Amazon, CoreWeave, Meta and Oracle."
  - Assess the public evidence of demand, not merely whether underlying demand existed.
  - Use January–March 2026 as the latest ordinary quarterly reporting period broadly available before the July 15 post. The speaker supplies no period.
  - Treat 'a few billion' as an approximate three-to-five-billion-dollar scale, not an exact threshold.
  - The statement gives no accounting basis for demand. Do not silently equate capital expenditure, rental expense and multiyear contracts.
support_condition: A sufficiently comprehensive review finds only limited credible evidence of demand above the approximate few-billion-dollar scale among the included buyers, on a consistent period and spending basis.
contradiction_condition: Strong public records establish demand clearly above that scale among buyers outside the six named companies, within the chosen period and on a matching basis.
measurement_requirements: Identify the ultimate buyers, reporting period, AI-specific expenditure and treatment of infrastructure purchases versus rental commitments. Avoid counting the same demand at multiple points in the supply chain.
source_requirements: Prefer customer disclosures, filings and executed contracts. Use reporting only with its source and measurement limitations stated.
