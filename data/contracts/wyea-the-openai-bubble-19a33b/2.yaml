explicit_source_elements:
  - The largest consumers of compute remain Microsoft
  - Google
  - Amazon
  - CoreWeave
  - Meta
  - Oracle
  - Otherwise, there’s very little evidence
  - more than a few billion in demand for AI compute
  - and that’s being generous
evaluator_interpretation:
  - The plain reading concerns publicly evidenced demand outside the six named consumers, as it stood when the post was published.
  - The target date is a snapshot of that public evidence. It does not restrict demand to a quarter or convert the claim into an annual spending ceiling.
  - The source supplies neither a spending interval nor a distinction between hardware purchases, compute-service spending and outstanding contracts. These measures must remain separate.
  - The surrounding passage attributes substantial demand to OpenAI and Anthropic through the named providers. Counting that same demand again as outside demand would not fairly test the passage.
  - A few billion is an approximate scale, not a specified numerical cutoff. No precise accounting basis is supplied.
support_condition: A sufficiently comprehensive public accounting of demand outside the named consumers shows only a few billion dollars on a clearly identified, comparable measurement basis. Failure to find contracts alone is insufficient.
contradiction_condition: Public records available by the post show demand outside the named consumers substantially exceeding a few billion dollars on a comparable basis, without double-counting provider and customer transactions. A result that depends on substituting cumulative hardware value for annual service spending is insufficient.
measurement_requirements: Identify the buyer, the compute purchased, the contractual or spending period, and whether each amount is realized expenditure, asset value or a future commitment. Do not add these categories together.
source_requirements: Prefer customer disclosures, executed contracts and filings. Use independent market estimates only with their methodology and coverage stated.
