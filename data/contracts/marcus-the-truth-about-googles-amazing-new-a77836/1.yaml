  - not straight off the shelf
  - didn’t turn out have a whole lot of application in the real world
evaluator_interpretation:
  - The claim concerns the 2019 demonstration and practical applications developed by the post date.
  - Little real-world application means limited practical use beyond research demonstrations. It does not mean no scientific influence.
  - The demonstrated system and its specific methods are the relevant scope; the usefulness of reinforcement learning generally would not settle this claim.
  - The hardware and practical-application components must both be established to support the whole claim.
support_condition: Technical records establish use of a modified, sensor-equipped cube, and subsequent records establish limited practical application of the demonstrated system or its specific methods through the post date.
contradiction_condition: Records establish that the referenced demonstration used an ordinary uninstrumented cube, or document substantial practical application of the demonstrated system or its specific methods during the target period.
measurement_requirements: Distinguish sensor-assisted experiments from vision-only experiments, and practical deployment from laboratory demonstrations, citations, or research influence.
source_requirements: Original technical documentation for the hardware; deployment records or a credible retrospective for practical application. A lack of search results alone is insufficient.
