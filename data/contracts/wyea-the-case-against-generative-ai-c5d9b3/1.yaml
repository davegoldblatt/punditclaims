  - large language models
  - actually replace coders
  - Not really, no
evaluator_interpretation:
  - The plain reading concerns practical substitution for working software developers, not whether models can generate any useful code.
  - Replacement means performing substantive coding responsibilities without another human doing that programming. Ordinary management and review may remain.
  - The statement describes contemporary capability. With no reporting calendar specified, I use the current calendar year through publication as the latest reportable capability period.
  - Evidence from earlier in that period is not automatically representative of models available at its end.
support_condition: Representative evaluations and documented deployments establish that contemporary systems still require humans to perform substantive coding responsibilities rather than functioning as practical developer substitutes.
contradiction_condition: Verified deployments establish that contemporary LLM systems reliably took over substantive developer responsibilities, or representative independent evaluations demonstrate that substitution under realistic conditions.
measurement_requirements: Measure completed work, reliability, human intervention and responsibility for substantive programming. Productivity gains, benchmark successes and employment declines alone do not establish job substitution.
source_requirements: Prefer independent evaluations and documented workplace records. Employment evidence must distinguish association from demonstrated substitution.
