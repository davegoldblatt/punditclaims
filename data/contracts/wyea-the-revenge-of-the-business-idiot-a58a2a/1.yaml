evaluator_interpretation:
  - The financial clause concerns calendar January–March 2026 and the company's adjusted operating margin, rounded to a whole percentage point.
  - The ordinary reading of ChatGPT growth is growth in its active user base, rather than OpenAI revenue, market share, or Codex usage.
  - For the ongoing growth assertion, use April 2026, the latest complete calendar month before publication, compared with preceding months.
  - The target-period envelope includes Q1 for the financial clause and April for the ongoing usage clause; these remain separate tests.
support_condition: Comparable Q1 financial reporting establishes a non-GAAP operating margin rounding to −122%, and a consistent active-user series establishes a sustained plateau through April.
contradiction_condition: Comparable Q1 reporting establishes a materially different margin, or a consistent active-user series shows meaningful continued growth through April.
measurement_requirements: Use adjusted operating income divided by realized quarterly revenue. For growth, compare the same active-user definition and observation frequency; do not compare a quarterly average directly with a single month's peak.
source_requirements: Company financial records or reputable reporting on those records; company usage disclosures or consistent independent user measurements.
