assessment_axis: causal_assessment
explicit_source_elements:
  - GPT doesn’t talk randomly
  - because it’s pastiching things actual people said
  - synonyms and paraphrases
evaluator_interpretation:
  - GPT refers to the GPT-3 generation and related systems discussed in the December 2022 post.
  - Nonrandom means linguistically structured rather than arbitrary characters or words. It does not mean generation involves no randomness.
  - Pastiching is read as generating combinations of patterns learned from human text. Literal retrieval of existing passages is a stronger reading.
  - The assessment concerns the source of linguistic structure, not whether generated statements are true.
support_condition: Training documentation and controlled generation evaluations establish that learning patterns from human text produces structured, human-like output.
contradiction_condition: Controlled evidence establishes that the output's linguistic structure does not depend materially on patterns learned from human text.
measurement_requirements: Document the training objective and corpus, and assess generated language under controlled conditions. Distinguish linguistic coherence from factual accuracy and literal copying.
source_requirements: Primary model documentation and empirical studies of the relevant GPT generation. Earlier models may provide context but cannot alone settle the claim.
