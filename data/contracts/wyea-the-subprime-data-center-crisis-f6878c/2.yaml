explicit_source_elements:
  - not that there's no demand
  - the vast majority of that demand
  - coming from either Anthropic and OpenAI
  - two companies that cannot afford to pay for it long-term
  - and hyperscalers, who are mostly buying compute on behalf of OpenAI and Anthropic
evaluator_interpretation:
  - "Testable core: in 2026 up to the post, the vast majority (read as well over half) of AI compute rental demand came from OpenAI and Anthropic directly, or from hyperscalers buying mostly to serve OpenAI and Anthropic."
  - "'Cannot afford to pay for it long-term' is a forward-looking judgment about solvency. It is noted but not scored here, because no period or test is given."
  - "Target period: 2026-01-01 to 2026-07-22, the most recent state before the post."
support_condition: Spending or contract data show OpenAI, Anthropic, and hyperscaler purchases made mainly for them account for the large majority of AI compute demand.
contradiction_condition: Data show a large share of AI compute demand comes from other buyers, or that hyperscalers mainly buy compute for their own use (for example Meta, or Microsoft's own products) rather than for OpenAI and Anthropic.
measurement_requirements: Shares of AI compute spend or contracted capacity by end buyer, and the end use of hyperscaler-rented capacity.
source_requirements: Neocloud filings, hyperscaler disclosures, reputable reporting.
