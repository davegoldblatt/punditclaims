explicit_source_elements:
  - not that there’s no demand
  - the vast majority of that demand
  - Anthropic and OpenAI
  - cannot afford to pay for it long-term
  - hyperscalers
  - mostly buying compute on behalf of OpenAI and Anthropic
evaluator_interpretation:
  - The sentence combines current demand concentration, attribution of hyperscaler purchases and a judgment about continuing financial capacity.
  - Vast majority means clear predominance; no precise percentage is invented. Mostly means more than half.
  - I use January through March 2026 for the ongoing observation, the latest regular reporting quarter available before the post.
  - Hyperscaler purchases require attribution to their ultimate workloads; the identity of the immediate buyer is insufficient.
  - Affordability requires comparing continuing compute obligations with operating cash generation and accessible financing. Current losses alone do not establish inability to pay.
  - Long-term has no deadline. I assess the sentence's present financial-capacity assertion without inventing a future failure date.
  - The affordability clause names no accounting measure or basis. Its metric scope is therefore unknown, which prevents a supported or contradicted financial score.
support_condition: Comparable market-wide data establish clear predominance by the named buyer groups and majority attribution of hyperscaler purchases to the two labs, while matched financial evidence establishes inability to fund continuing obligations.
contradiction_condition: Comparable market-wide data disprove a necessary concentration or attribution component, or matched financial evidence establishes sustainable capacity to meet the continuing obligations.
measurement_requirements: A common market denominator, customer-level spending or capacity, ultimate-workload attribution, and separate financial analyses of each lab's obligations, operating cash flows and available financing.
source_requirements: Provider and customer filings, verified contracts and financial disclosures. Financing commitments must be distinguished from received cash and revenue.
