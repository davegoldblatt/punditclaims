explicit_source_elements:
  - Across domains involving causality, value trade-offs, justification, and error monitoring
  - humans attend to reasons, stakes, and responsibility
  - language models optimize for linguistic plausibility
evaluator_interpretation:
  - The ordinary reading is a broad contrast between what guides human and model judgments in the named domains.
  - I distinguish a model's training objective from its observed response to evidence, consequences, and errors. One does not by itself establish the other.
  - The wording does not explicitly say that linguistic plausibility is the only model objective, or that humans always reason responsibly.
  - I use the cited 2025 research period through the post date for this ongoing comparison.
support_condition: Controlled comparisons across the named domains show that human judgments systematically track reasons and stakes while model judgments instead track linguistic plausibility, with training and process evidence consistent with that contrast.
contradiction_condition: Representative comparisons show that the proposed contrast fails across the named domains, with models systematically tracking relevant reasons, consequences, and errors; training records also rule out the asserted account of their optimization.
measurement_requirements: Vary evidence, causal structure, stakes, and linguistic presentation separately. Distinguish behavioral findings, internal-process evidence, and descriptions of pretraining or post-training.
source_requirements: Primary human–model comparisons and model-training documentation. A conceptual paper repeating the contrast is context rather than independent confirmation.
