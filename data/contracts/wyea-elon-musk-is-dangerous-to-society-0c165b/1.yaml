explicit_source_elements:
  - open-air beta test
  - self-driving vehicles
  - has harmed and killed people
evaluator_interpretation:
  - The plain reading is that Tesla's public-road deployment of automated driving features contributed to crashes causing bodily injuries and deaths before the post.
  - I include Autopilot within this description. Zitron does not explicitly name the narrower product Full Self-Driving Beta.
  - A contributing cause is sufficient; the wording does not require Tesla's systems to be the sole cause.
  - The present-perfect wording describes cumulative past events through September 13, 2023. No starting date is specified.
  - The claim concerns Tesla's deployment of these systems, not a finding of personal legal liability against Musk.
support_condition: Reliable crash investigations or court findings establish that Tesla's automated driving behavior or inadequate safeguards contributed to public-road crashes causing injuries and deaths by September 13, 2023.
contradiction_condition: Authoritative evidence establishes that the claimed injuries and deaths did not occur, or that Tesla's systems and deployment safeguards did not contribute to them. Exoneration in an individual unrelated crash does not disprove this cumulative claim.
measurement_requirements: Establish crash dates, bodily injuries or fatalities, the system involved, and a causal contribution. System engagement or raw crash counts alone are insufficient.
source_requirements: Prefer completed official crash investigations and court findings. Distinguish findings from allegations and technical causation from legal liability.
