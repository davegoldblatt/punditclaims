assessment_axis: historical_observation
explicit_source_elements:
  - the billion or so dollars
  - they are losing each month
  - this year
evaluator_interpretation:
  - Assess the supplied proposition about OpenAI’s losses, not the surrounding speculation about acquisition motives.
  - "'This year' means calendar 2026 through the April 3 post, rather than a forecast of the completed year."
  - Use January through March, the latest completed quarter before the post, to assess the ongoing monthly rate.
  - The ordinary accounting reading of 'losing' is net losses averaged per month. Cash burn is a plausible colloquial alternative and must be kept separate.
  - The supplied passage identifies neither an accounting basis nor a source for the loss figure. The contract therefore retains accounting_basis unknown.
  - "'Billion or so' allows approximation but does not specify an exact tolerance."
support_condition: Comparable realized loss records for the target period establish a monthly average reasonably described as approximately US$1 billion, with the intended accounting basis established.
contradiction_condition: Comparable realized loss records establish a materially different monthly average on the intended accounting basis.
measurement_requirements: Distinguish net losses, operating losses, cash burn, and forecasts. Divide a quarterly realized total by three only to estimate an average, not to claim identical losses each month.
source_requirements: Prefer OpenAI financial statements or disclosures. Credible reporting on shareholder documents is usable with its verification limits stated.
