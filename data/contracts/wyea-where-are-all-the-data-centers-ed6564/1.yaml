  - actual capacity
  - brought online
  - isn’t ... 2GW in six months
evaluator_interpretation:
  - The full post explicitly links the roughly 2 GW comparison to Microsoft's FY2026 second- and third-quarter earnings statements. Use October 2025–March 2026, rather than a rolling six-month window or November–April.
  - Read 'actual capacity ... brought online' as equipped operational data-center capacity available for workloads, including owned and leased facilities.
  - Treat 2 GW as approximate because the referenced first-quarter contribution was described as nearly one gigawatt.
  - Do not equate a reported capacity addition with operational capacity unless its definition establishes that connection.
support_condition: Comparable records establish that Microsoft added materially less than approximately 2 GW of equipped operational capacity during October 2025–March 2026.
contradiction_condition: Comparable records establish that Microsoft added approximately 2 GW or more of equipped operational capacity during October 2025–March 2026.
measurement_requirements: A defined operational-capacity measure, commissioning dates within the six-month period, owned and leased coverage, and reconciliation of total facility power with IT power.
source_requirements: Microsoft operational disclosures with a clear capacity definition, or sufficiently comprehensive commissioning and supplier records. Lack of publicly named sites does not establish a shortfall.
