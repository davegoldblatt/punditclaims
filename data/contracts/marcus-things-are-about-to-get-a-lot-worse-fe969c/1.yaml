assessment_axis: causal_assessment
explicit_source_elements:
  - GenAI systems
  - don’t give attribution to source materials
  - because
  - at least as constituted now, they can’t
evaluator_interpretation:
  - “Now” refers to systems available on 2023-12-29.
  - In this discussion of training materials and provenance, attribution means reliably identifying the training sources behind an output. Merely citing a retrieved webpage or labeling an image AI-generated does not establish that capability.
  - The claim asserts that technical inability explains missing attribution. Missing product features alone cannot establish that cause.
  - A limited research demonstration or matching service bears against an absolute impossibility claim, but does not necessarily establish reliable attribution in deployed systems.
support_condition: Technical evidence establishes that contemporary deployed systems could not reliably identify the training sources behind their outputs, and that this limitation explains their failure to provide attribution.
contradiction_condition: A contemporary deployed system demonstrably provides reliable training-source attribution, or technical evidence establishes that the claimed inability was not the reason attribution was absent.
measurement_requirements: Distinguish verified training-source influence from textual similarity, retrieved citations, and identification of the generating model. Demonstrations must describe their coverage and reliability.
source_requirements: Contemporary technical documentation, reproducible research, or retrospective evidence explicitly addressing the December 2023 systems.
