condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Attribution could mean training-source provenance or ordinary citations.
  - “Can’t” could mean architectural impossibility or an unavailable practical capability.
  - The scope of “GenAI systems” is broader than the named examples, DALL-E and ChatGPT.
