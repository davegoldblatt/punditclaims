assessment_axis: forecast_outcome
explicit_source_elements:
  - combined compute demand of every single AI company in the world
  - doesn’t currently reach $100 billion
  - needs to be ten times that by 2030
  - or all those data centers got built for no reason
evaluator_interpretation:
  - This combines a present observation with a future economic-necessity claim. The overall assessment follows the forecast while retaining a separate target period for the observation.
  - I read compute demand as the annual dollar value of compute services consumed by AI companies, without double-counting purchases within the supply chain. Infrastructure capital spending is a different measure.
  - For the ongoing observation, I use the latest completed quarter that could have been publicly reported before publication, January through March 2026, expressed at an annual rate.
  - I read 'ten times that' as approximately $1 trillion annually, referring to the stated $100 billion benchmark.
  - I read 'built for no reason' as failure of the referenced buildout to justify its economic cost, rather than literally having no use.
  - Economic viability and compute demand are joint outcomes; the wording does not supply a separate external antecedent.
support_condition: Comparable global evidence establishes annual compute demand below $100 billion in the observation period and demonstrates that approximately $1 trillion in annual demand by 2030 is necessary for the referenced buildout to justify its costs.
contradiction_condition: Comparable evidence establishes current demand of at least $100 billion, or the referenced buildout demonstrably justifies its costs with annual demand below the claimed 2030 requirement.
measurement_requirements: A defined worldwide company population, consistent valuation of purchased and internally supplied compute, elimination of double counting, and a cost-and-revenue model for the specified data centers.
source_requirements: Primary financial disclosures and transparent aggregate research with compatible scope and periods. Forecast infrastructure purchases cannot substitute for observed compute-service demand.
metric_scope:
  company: All AI companies worldwide
  metric: Aggregate annual dollar value of compute-service demand
  currency: USD
  units: billions per year
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-03-31
  stock_or_flow: flow
  annualized_or_realized: annualized
  gross_or_net: not_applicable
original_horizon: by 2030
horizon_interval:
  start: 2026-06-08
  end: 2030-12-31
  precision: day
target_period:
  start: 2026-01-01
  end: 2026-03-31
  precision: day
condition_status: unknown
early_resolution_rule: An early contradiction requires directly comparable evidence disproving the current ceiling, or completed economic outcomes conclusively disproving the claimed necessity. Forecasts and infrastructure announcements do not settle the future requirement.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The sentence combines an observation and a forecast.
  - The current observation is assigned to the latest potentially reportable quarter; no measurement period is named.
  - "'AI company' and treatment of hyperscalers' internal consumption are undefined."
  - Compute demand has no stated accounting or valuation basis.
  - Annualization is inferred from the surrounding annual-revenue discussion.
  - The specific data-center portfolio and economic return standard are unspecified.
  - The contract's metric period describes the current component; the future requirement applies by the end of 2030.
retrospective_or_prospective: prospective
