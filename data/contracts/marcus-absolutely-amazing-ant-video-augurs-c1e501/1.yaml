assessment_axis: forecast_outcome
explicit_source_elements:
  - '"The average user"'
  - '"will have no idea what is and is not legit"'
  - 'context: "In short order, with Sora or some opensource counterparts"'
  - 'context: scammers making "photorealistic fake videos simply to sell ads" on YouTube'
evaluator_interpretation:
  - "Condition: photorealistic AI-generated videos have become common on major video platforms such as YouTube."
  - 'Plain reading of "no idea": ordinary viewers cannot reliably tell real videos from current photorealistic AI videos. In studies, that means average accuracy near chance (roughly 50-60%) or most people unable to reach reliable accuracy. It does not require exactly 50%.'
  - "Evidence: controlled studies of ordinary or general-population viewers that use current-generation video models."
support_condition: After AI videos have become common on platforms, studies of ordinary viewers find average real-vs-AI video accuracy near chance, or find that most participants cannot reliably tell the two apart.
contradiction_condition: Studies of ordinary viewers using current photorealistic AI videos find that average viewers reliably tell them apart from real footage (for example 75% accuracy or higher).
measurement_requirements: Human detection accuracy for telling real from AI-generated video, measured with general or convenience samples of non-expert viewers and current-generation models.
source_requirements: Peer-reviewed papers, preprints, or published study results with stated methods; platform measurements for the condition.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: If, once photorealistic AI videos are common on major platforms, a sizable study of ordinary viewers finds overall detection accuracy near chance, with most participants unable to distinguish reliably, the forecast is settled as supported. If such studies find that average viewers detect AI videos reliably (about 75% or more), it is settled as contradicted.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - '"No idea" is hyperbolic. Studies report 52-66% accuracy, so the result depends on whether modest above-chance accuracy counts as having "no idea".'
  - No deadline is stated beyond "in short order" in the surrounding text.
  - Lab studies tell viewers to look for fakes. Casual platform viewing is not measured directly.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
