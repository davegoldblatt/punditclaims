explicit_source_elements:
  - Large language models still make stuff up
  - hallucinate
  - still can’t be trusted in their reasoning
  - remain unreliable
evaluator_interpretation:
  - The ordinary reading is that contemporary general-purpose LLMs still produce unsupported factual assertions and material reasoning errors, so unchecked answers are not dependable.
  - This does not assert that every answer is wrong or that no bounded application can use an LLM reliably.
  - Factuality and reasoning require separate evidence; neither is inferred solely from the other.
  - No measurement period is specified. I use the six-month retrospective named in the title, ending on publication, as the reporting window for the continuing state.
support_condition: Contemporaneous evaluations document both unsupported factual output and substantial reasoning failures in leading LLMs.
contradiction_condition: Representative evaluations establish dependable factual accuracy and reasoning across the claimed general-purpose scope, with the alleged recurring failures absent.
measurement_requirements: Identify the models, tasks, and evaluation methods. Do not equate an unsupported-fact rate on one task with an error rate for all uses.
source_requirements: Prefer reproducible research and technical disclosures available before the post. Preserve the versions of studies that were then available.
