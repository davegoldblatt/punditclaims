assessment_axis: historical_observation
explicit_source_elements:
  - common names are points of failure
  - in particular SMBC and MUFG
  - aggressively loaned
  - just about every part of the AI economy
evaluator_interpretation:
  - The ordinary reading is that these banks are shared financing dependencies whose withdrawal or distress could materially disrupt multiple parts of the AI economy.
  - This does not require either bank actually to fail, and it does not assert that either bank is insolvent.
  - Repeated participation in lending syndicates establishes connections, but not necessarily material dependence on an individual bank.
  - For the ongoing state, use October through December 2025, the latest completed reporting quarter before the post.
  - This assessment concerns lending relationships and dependence, not a specified loan balance or accounting measure.
support_condition: Exposure records establish substantial lending by both banks across major AI layers, and borrower dependence or financing-network analysis shows that disruption at these lenders could materially impair financing across those layers.
contradiction_condition: Representative exposure and financing evidence shows that the alleged cross-layer dependence is absent or that readily substitutable financing prevents the asserted common failure risk.
measurement_requirements: Identify lenders, commitments versus drawn funds, retained exposures after syndication, borrower dependence, and realistic alternatives. Do not infer dependence from arranger titles alone.
source_requirements: Financing agreements, bank and borrower disclosures, and credible concentration or stress analysis.
