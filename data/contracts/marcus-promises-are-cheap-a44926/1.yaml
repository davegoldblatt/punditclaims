assessment_axis: historical_observation
explicit_source_elements:
  - according to December’s Remote Labor Index
  - only 2.5%
  - human “online tasks”
  - physical tasks were excluded
  - could be done by AI
evaluator_interpretation:
  - December means December 2025.
  - Because Marcus attributes the figure to a named benchmark, the ordinary scoped reading concerns its evaluated remote freelance projects and tested agents.
  - Could be done means completed end to end at the benchmark’s required professional quality.
  - December’s is read as the results reported during December, not necessarily a new study or new test runs conducted that month.
  - The figure is not treated as a universal ceiling on all online tasks or all possible AI configurations.
support_condition: The RLI results reported during December 2025 identify approximately 2.5 percent as the highest automation rate among evaluated agents on its remote-work projects.
contradiction_condition: The comparable December results report a materially different highest automation rate, or 2.5 percent measures something other than acceptable completion of the evaluated remote-work projects.
measurement_requirements: Preserve the benchmark’s task population, completion-quality criterion and tested-agent scope. Separate publication of standing results from the dates of the underlying experiments.
source_requirements: The original RLI study plus dated December records establishing what results were being reported then.
