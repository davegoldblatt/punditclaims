assessment_axis: forecast_outcome
explicit_source_elements:
  - 2025 will be known as
  - the year of the peak bubble
  - the moment at which Wall Street began to lose confidence in generative AI
  - Valuations may go up before they fall
evaluator_interpretation:
  - This predicts retrospective recognition of a speculative peak and the beginning of a sustained change in investor confidence.
  - The year 2025 identifies the proposed turning point, not a deadline for recognition.
  - A peak in speculative enthusiasm need not be the highest subsequent nominal valuation, because Marcus explicitly allows further valuation increases.
  - No particular company's financial metric is asserted; the claim concerns the market cycle and its later interpretation.
support_condition: A durable reversal in the generative-AI boom is documented, and independent financial retrospectives broadly identify 2025 as both its speculative peak and the beginning of Wall Street's sustained loss of confidence.
contradiction_condition: A sufficiently established history of the completed market cycle identifies a different speculative peak or confidence turning point, inconsistent with the proposed 2025 interpretation.
measurement_requirements: Triangulate market histories, investment activity and investor sentiment. Distinguish temporary corrections, company-specific distress and nominal valuation records from a broad speculative turning point.
source_requirements: Use independent financial histories and broad market records. Company disclosures can establish individual facts but cannot establish what Wall Street collectively came to believe.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolution requires a durable broad reversal and convergent independent retrospectives identifying 2025 as the peak and confidence turning point, or an established history locating those turning points elsewhere. A temporary selloff or further rally is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline for retrospective recognition.
  - Peak bubble could refer to prices, investment or speculative enthusiasm.
  - Wall Street and loss of confidence have no specified population or measure.
  - Will be known does not specify how widespread agreement must become.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
