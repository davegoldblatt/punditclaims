  - significantly extend GPT-4’s ability
  - solve math and science problems
  - GPT-4 with either plug-in
evaluator_interpretation:
  - Compare GPT-4 with each plug-in separately against GPT-4 without that plug-in on comparable problems.
  - Read 'significantly' as a substantial practical improvement, not a commitment to a particular statistical test.
  - Read the claim as extending useful problem-solving capabilities, not improving every problem or every subject.
  - Assess the product configurations available around the 2023 post, not later models or replacement tools.
support_condition: Primary comparisons show substantial practical improvements from each named plug-in on matched mathematical problems, with additional evidence that the capabilities help solve science problems.
contradiction_condition: Comparable evaluations show no meaningful extension from either or both plug-ins, or show that apparent gains disappear when material differences in the comparisons are accounted for.
measurement_requirements: Compare correctness on the same tasks. Identify differences in model access, prompts, sampling, and repeated-answer voting that could affect causal attribution.
source_requirements: Primary evaluations with an explicit GPT-4 baseline. Successful demonstrations alone do not establish the magnitude of improvement.
