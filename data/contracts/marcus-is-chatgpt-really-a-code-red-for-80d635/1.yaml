ambiguity_flags:
  - "'Ultra-PC' is an evaluative label without a specified measure."
  - "'Removal' could mean the public demo or the entire model release."
  - The causal sentence does not distinguish offensive outputs from other reasons for criticism.
  - The reporting window is inferred from the late-2022 launches and the post's November–December comparison.
