assessment_axis: historical_observation
explicit_source_elements:
  - large language models aren’t inherently ultra-PC
  - ChatGPT is
  - writing essays on the alleged benefits of antisemitism
  - its abrupt removal by Meta AI
evaluator_interpretation:
  - Read 'ultra-PC' in its immediate context as restrictions on offensive responses, rather than a measurable political ideology.
  - Read 'removal' as withdrawal of Galactica's public demonstration, rather than withdrawal of all model files.
  - Assess the November–December 2022 deployment period discussed in the post. ChatGPT's restrictions need not have been infallible.
  - Read the causal wording as attributing withdrawal to criticism of offensive and unreliable outputs collectively, not to one antisemitic response alone.
support_condition: Contemporaneous records establish deliberate restrictions on ChatGPT's offensive responses, Galactica's generation of antisemitic material, and withdrawal of its public demonstration following criticism of such outputs.
contradiction_condition: Reliable records establish that the reported Galactica outputs or withdrawal did not occur, that withdrawal had an unrelated cause, or that ChatGPT lacked the described deliberate restrictions.
measurement_requirements: Historical output records, documentation of ChatGPT's restrictions, and a dated account of Galactica's withdrawal. No numerical political-correctness score is implied.
source_requirements: Prefer developer documentation and firsthand output records. Use contemporary reporting for the withdrawal where a directly accessible primary announcement is unavailable.
