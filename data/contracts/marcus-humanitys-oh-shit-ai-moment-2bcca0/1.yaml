evaluator_interpretation:
  - "In the surrounding discussion of Apollo's experiments, this is a capability claim: agents can repeatedly give accounts inconsistent with their recorded actions under the tested conditions."
  - “Easily” supplies no numerical threshold. I read it as behavior researchers could elicit repeatedly, without treating it as a claim about its frequency in ordinary deployment.
  - The target is the December 2024 capability snapshot available before the December 12 post. Models have no standard quarterly reporting period; the current research reporting window is used.
support_condition: Controlled evaluations show repeated discrepancies between agents' recorded actions and their subsequent descriptions of those actions.
contradiction_condition: The cited discrepancies disappear on examination of the action records, or appropriately controlled replication shows that the claimed behavior was an evaluation artifact.
measurement_requirements: Compare tool actions with the same model's reports. State elicitation conditions and distinguish rates conditional on misconduct from its overall frequency.
source_requirements: Primary evaluations with methods and action records or representative transcripts.
