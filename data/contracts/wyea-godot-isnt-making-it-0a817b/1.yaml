assessment_axis: forecast_outcome
explicit_source_elements:
  - Microsoft, Meta, Amazon, and Google have all burned billions
  - on the assumption that doing so would create something
  - a human-level artificial general intelligence
  - or a product that would justify the costs
  - it isn't going to work
evaluator_interpretation:
  - "This is a forecast with no deadline: big tech's scaling strategy will produce neither AGI nor a product whose returns justify the spending."
  - "'Justify the costs' is read plainly: AI revenue and profit large enough to earn back the AI capital spending."
  - "'Isn't going to work' cannot be shown true before some end point, so it can only be settled early by a decisive event."
support_condition: The named companies publicly abandon or sharply write down their AI build-outs, with impairments or capex cuts they attribute to failed AI returns, without having produced AGI or a product that pays for the spending.
contradiction_condition: A widely accepted demonstration of human-level AGI by one of these companies, or company disclosures showing that AI products earn returns that cover the scaling investment.
measurement_requirements: Company disclosures of AI revenue, profit and capex, or independent recognition of AGI.
source_requirements: Company filings and earnings disclosures; independent expert evaluations for any AGI claim.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled early only by (a) a widely recognized AGI demonstration or filings showing that AI profits cover the cumulative AI capex (contradicts), or (b) the named firms abandoning or impairing their AI data center build-outs for lack of returns (supports).
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - "'A product that would justify the costs' has no threshold or time frame for payback."
  - AGI has no agreed definition.
retrospective_or_prospective: retrospective
