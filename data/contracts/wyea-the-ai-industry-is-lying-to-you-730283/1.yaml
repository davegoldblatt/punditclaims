  - more data centers would be near or at the finish line
  - waiting for power to be turned on
evaluator_interpretation:
  - Read the claim as saying that unrealistic construction schedules independently explain the delays being discussed, beyond power constraints.
  - The claim does not deny that power constraints exist.
  - Assess the ongoing situation at publication, using project histories through March 24, 2026; no historical starting date is supplied.
  - Unfinished buildings alone do not establish the cause of delay. Power uncertainty could affect whether construction starts or proceeds.
  - The counterfactual requires evidence about how developers sequence construction and power procurement.
support_condition: Project records show that original construction schedules were infeasible because of independent non-power constraints and that those constraints materially caused missed delivery dates. Evidence also supports the inference drawn from the scarcity of completed sites waiting for power.
contradiction_condition: Matched project records show feasible construction schedules whose execution was delayed by power availability, including decisions to defer construction until power could be secured, undermining the claimed causal explanation.
measurement_requirements: Original schedules, actual milestones, delay reasons, power-ready dates, and evidence identifying which activity controlled delivery. A representative count of completed-but-unpowered facilities would test the counterfactual.
source_requirements: Project records, utility or regulatory documents, developer disclosures, and independent construction tracking. Delay prevalence alone is insufficient.
