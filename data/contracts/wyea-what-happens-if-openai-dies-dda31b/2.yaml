assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic is just as unprofitable
  - "[as OpenAI]"
  - made hundreds of billions of dollars' worth of promises
  - it also can't keep
evaluator_interpretation:
  - "Three parts: (1) Anthropic's losses are comparable to OpenAI's; (2) Anthropic has made compute and spending commitments worth hundreds of billions of dollars; (3) it cannot meet them."
  - "Plain reading of 'just as unprofitable': losses from running the business (operating loss) of similar size. GAAP net loss is also reported, with a note that non-cash fair-value charges dominate Anthropic's."
  - "No period is named. I use the latest period public evidence covers up to the post: the first half of 2026 for losses, and commitments as reported for mid-2026."
  - Part (3) is about future performance and cannot be tested yet. It does not decide the outcome.
support_condition: Anthropic's H1 2026 losses are of similar size to OpenAI's, and its reported commitments total at least $200B.
contradiction_condition: Anthropic's H1 2026 operating losses are far smaller than OpenAI's (or it is operating profitably), or its commitments are well under $200B.
measurement_requirements: Compare Anthropic's and OpenAI's reported operating (and net) losses for the same 2026 periods, and Anthropic's total disclosed future compute commitments.
source_requirements: Anthropic's S-1 or reports of it; reputable reports of OpenAI's investor-reported results.
metric_scope:
  company: Anthropic (compared with OpenAI)
  metric: operating loss relative to OpenAI; total compute commitments
  currency: USD
  units: billions
  accounting_basis: company_reported
