assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic is just as unprofitable
  - hundreds of billions of dollars’ worth of promises
  - it also can’t keep
evaluator_interpretation:
  - Read 'just as unprofitable' as similarly loss-making, without requiring identical dollar losses. A fair comparison still requires consistent profit measures.
  - Read 'hundreds of billions' as at least $200 billion of existing compute commitments, rather than investment announcements or optional capacity.
  - Read 'can't keep' as an assertion of financial inability, not merely exposure to substantial risk.
  - Use calendar Q2 2026, the latest completed quarter before the post, for the ongoing financial observation and its quarter-end commitments snapshot. Whether commitments changed between June 30 and August 18 remains a separate limitation.
  - The single metric_scope records the quantified commitments component. The profitability component additionally requires comparable losses for Anthropic and OpenAI; the source does not identify their accounting basis.
support_condition: Comparable financial results establish that Anthropic is similarly loss-making, existing commitments reach at least $200 billion, and dated evidence establishes inability to meet those commitments after allowing for funding and their payment schedules.
contradiction_condition: Matched evidence establishes profitability inconsistent with the comparison, commitments below the stated scale, or demonstrable ability to fulfill the identified commitments. A positive operating result alone does not negate a net loss.
measurement_requirements: Distinguish net income, operating income, adjusted income and cash burn. Separate fixed commitments from options and estimates, avoid double-counting contracts, and compare payment schedules with available resources.
source_requirements: Company financial statements and contractual disclosures, comparable OpenAI results, and evidence of payment capacity or default. Risk warnings alone cannot establish inevitable nonpayment.
