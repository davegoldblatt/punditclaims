ambiguity_flags:
  - Annual revenue period inferred from the latest completed fiscal year before publication.
  - Cumulative capex starting date is unspecified.
  - Capex treatment of finance leases and allocation to AI are unspecified.
  - Outside OpenAI could mean excluding OpenAI as a customer or excluding a broader set of OpenAI-related arrangements.
  - The surrounding discussion links to press reporting, but does not supply a reproducible revenue calculation.
