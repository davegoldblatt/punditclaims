assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft spent more than $260 billion on capex
  - to create a business
  - less than $11 billion in annual revenue outside of OpenAI
evaluator_interpretation:
  - Assess the financial assertions, excluding the judgment that they constitute an objective disaster.
  - Read annual revenue as revenue actually earned over a year, rather than a current revenue rate multiplied by twelve.
  - Use the fiscal year ending June 30, 2026, the latest completed annual reporting period before the post, for the revenue assertion.
  - The cumulative capex assertion has no stated starting date. Do not invent one or assume all Microsoft capex served AI.
  - The metric_scope describes the annual revenue component. The cumulative expenditure component requires a separate reconciliation.
support_condition: Comparable records establish both cumulative expenditure above $260 billion attributable to creating this AI business and realized annual AI revenue excluding OpenAI below $11 billion.
contradiction_condition: Comparable records establish annual AI revenue excluding OpenAI of at least $11 billion, or establish cumulative expenditure of at most $260 billion over the intended accumulation period.
measurement_requirements: Identify the capex accumulation period, treatment of leases, and allocation between AI and other businesses. Separately measure realized annual AI revenue and revenue from OpenAI over the same annual period. Do not subtract annual realized customer revenue from an annualized run rate.
source_requirements: Prefer Microsoft filings and disclosures. Press estimates must identify their inputs and use comparable periods and definitions.
metric_scope:
  company: Microsoft
  metric: Annual AI revenue excluding revenue from OpenAI
  currency: USD
  units: billions
  accounting_basis: estimate
