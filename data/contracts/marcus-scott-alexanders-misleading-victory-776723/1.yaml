assessment_axis: historical_observation
explicit_source_elements:
  - The field of AI
  - littered with Band-Aid solutions
  - work for one problem, and not the next
evaluator_interpretation:
  - The ordinary reading is that narrowly effective methods that fail on related problems recur across AI research. It does not say every method fails to generalize.
  - I interpret 'Band-Aid solutions' as methods or interventions whose demonstrated benefits do not reliably transfer to related cases.
  - The statement concerns the accumulated research record through publication, rather than a particular reporting quarter.
support_condition: Multiple independent evaluations across different task domains document methods or targeted interventions that succeed on their original tasks but fail on related cases.
contradiction_condition: Broad comparative evidence shows that the alleged pattern is exceptional or mistaken, with the relevant methods consistently transferring their gains to related problems.
measurement_requirements: Compare original-task performance with related held-out tasks or changed testing conditions. Distinguish failure to transfer from failure on an unrelated task.
source_requirements: Primary evaluations documenting methods, test conditions, successes, and failures. The speaker's own assertions cannot establish the pattern.
