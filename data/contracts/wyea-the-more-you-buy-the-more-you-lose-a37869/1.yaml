assessment_axis: forecast_outcome
explicit_source_elements:
  - extremely difficult to meet that timeline
  - at a rate of 800MW every two years
  - more than a decade before it opens
  - Even if the data center has broken ground
evaluator_interpretation:
  - The phase-one deadline is December 31, 2028, the latest date meant by sometime in 2028.
  - I read opens in the decade clause as completion of the full campus. Reading it as first operation would conflict with the preceding discussion of phased delivery.
  - Even if construction has begun is a concession, not an assertion that groundbreaking occurred or a prerequisite for the forecast.
  - The decade clause expressly assumes a sustained build rate of 800MW every two years. That assumption must be distinguished from an observed construction rate.
  - Difficulty is not synonymous with missing a deadline. Timely delivery could still involve substantial difficulty.
support_condition: Records establish substantial difficulty delivering approximately 800MW by the end of 2028. For the full-campus clause, records also establish the stipulated construction rate and completion more than ten years after construction began.
contradiction_condition: Records establish timely phase-one delivery without substantial difficulty, or full-campus completion within ten years while the stipulated rate and capacity definitions apply. Faster construction would invalidate the assumed rate rather than contradict the conditional arithmetic.
measurement_requirements: Dated construction, commissioning and operational records; consistent definitions of facility power and IT load; separate dates for initial operation and full-campus completion.
source_requirements: Developer and customer disclosures, utility energization records, permits or independently verified construction records. Announced schedules alone do not establish delivery.
metric_scope: null
original_horizon: sometime in 2028
horizon_interval:
  start: 2026-07-28
  end: 2028-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Verified completion and operation of phase one could settle its delivery timing early, but would require evidence about construction difficulty to settle that wording. Full-campus commissioning could settle the opening clause only if the stipulated construction-rate condition were established. Announcements, leases and financing guarantees are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Opens could mean initial operation or full-campus completion.
  - Extremely difficult has no stated measure.
  - The decade's starting point is not explicit.
  - The stipulated construction rate has not been established as an actual sustained rate.
  - The 2028 deadline applies to phase one, not explicitly to full-campus completion.
  - Facility power and IT load may differ.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
