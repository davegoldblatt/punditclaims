explicit_source_elements:
  - The paradigm we have right now
  - so data-greedy
  - the entire public internet
  - doesn’t seem to be enough
evaluator_interpretation:
  - Read as a qualified empirical claim that prevailing AI development was encountering limits to what public internet data alone could provide.
  - Enough refers to sustaining developers' intended capability improvements. Marcus supplies neither a performance target nor a data quantity.
  - Seeking licensed data is relevant, but does not by itself prove that public data was insufficient; quality, access rights, and convenience can also motivate licensing.
  - The target is the technical state as of September 7, 2023. There is no regular reporting period for the adequacy of all public internet data, so the publication date is used as the latest reportable snapshot.
support_condition: Contemporaneous measurements or documented development experience showing that public internet data alone was insufficient for the prevailing paradigm's stated development goals.
contradiction_condition: Contemporaneous evidence demonstrating that public internet data alone adequately met those same development goals, without the claimed data constraint.
measurement_requirements: Specify the relevant data stock, usable quality, development goal, and whether the constraint was already present or merely forecast. Distinguish insufficient quantity from licensing or quality preferences.
source_requirements: Contemporaneous research, developer disclosures, or documented training-data decisions. Later forecasts cannot establish the September 2023 state.
