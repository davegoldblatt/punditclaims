  - even regression
  - improvement we’ve seen
  - LLM-based services like ChatGPT
evaluator_interpretation:
  - The plain reading is that useful capabilities were improving more slowly, with some capabilities getting worse.
  - I use 2023 through the post date as the comparison window for successive service versions. The speaker supplies neither a starting date nor a reporting period; this window is an evaluator choice.
  - A slowdown requires comparisons of gains across successive intervals. A decline on one task establishes a local regression, but does not by itself establish a general slowdown.
support_condition: Comparable longitudinal evaluations show diminishing gains across a representative set of capabilities, together with reproducible regressions on some tasks.
contradiction_condition: Comparable longitudinal evaluations show sustained or accelerating gains across representative capabilities and fail to substantiate the alleged regressions. Improvements on selected tasks alone do not disprove a slowdown.
measurement_requirements: Version-specific results using comparable prompts, scoring and conditions across enough observations to distinguish declining performance from a declining rate of improvement.
source_requirements: Prefer original evaluations with disclosed methods and dated model versions. Separate service behavior from claims about underlying model intelligence.
