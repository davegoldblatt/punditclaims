evaluator_interpretation:
  - The plain reading is the share of households making their own payments for consumer AI services, rather than using free services or employer-funded subscriptions.
  - Households is not explicitly limited to one bank's customers. The surrounding discussion is international, so neither worldwide nor US coverage can be assumed without qualification.
  - Treat 3% as rounded.
  - Use January–March 2026, the latest completed quarter before publication, and assess the latest payment observations publicly available within it.
  - Easy access is contextual framing, not a separately quantified causal claim.
support_condition: A representative household measure for the intended population finds approximately 3% directly paying for consumer AI services during the target period.
contradiction_condition: A comparable representative measure finds a materially different share, after accounting for rounding, sampling uncertainty, and who pays.
measurement_requirements: Specify geography, household denominator, payment channels, covered services, observation window, and treatment of employer-funded or bundled subscriptions.
source_requirements: Prefer original household surveys or transaction research with population and coverage limitations disclosed.
