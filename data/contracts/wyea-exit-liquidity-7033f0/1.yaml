evaluator_interpretation:
  - The surrounding heading and quoted disclosure identify January through September 2026, rather than lifetime revenue.
  - "'As much as' describes the upper end of an estimated range, not an exact audited amount."
  - The claim attributes the estimated revenue to competitor distillation specifically; policy or commercial-term violations generally are a broader category.
  - The dollar estimate combines company disclosures with press-reported Q3 revenue, so its accounting basis is estimate.
support_condition: Comparable evidence establishes roughly $33.08 billion of realized January–September revenue and attributes an estimated share reaching approximately 7%, or $2.31 billion, to competitor model distillation during that period.
contradiction_condition: Comparable revenue or customer-level evidence establishes materially different amounts, or shows that applying the cited 5–7% range to competitor distillation during these nine months is incorrect.
measurement_requirements: Use realized revenue for January–September 2026. Establish the period and customer category behind the distillation percentage. Do not substitute run-rate revenue or all policy-violating revenue.
source_requirements: Company financial disclosures and a distillation-specific revenue breakdown; credible reporting may supply unavailable private-company figures if its limitations are stated.
