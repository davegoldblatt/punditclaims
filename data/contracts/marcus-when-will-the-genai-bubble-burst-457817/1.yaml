assessment_axis: causal_assessment
explicit_source_elements:
  - inherent to how the system makes predictions
  - LLMs themselves
  - don’t have the wherewithal to look things up and reason over them
evaluator_interpretation:
  - The ordinary reading is that hallucinations arise partly from the prediction mechanism and partly from inadequate factual lookup and reasoning.
  - Inherent means a structural source of errors, not that every answer must be false.
  - The phrase 'LLMs themselves' may exclude external retrieval tools. Evidence about an augmented system therefore does not automatically refute the narrower claim about an unaided model.
  - The assessment concerns the mechanisms of the LLMs discussed in March 2024. Later research may explain those mechanisms but cannot substitute newer systems for them.
support_condition: Research establishes the claimed causal contributions for the relevant models, rather than merely showing that hallucinations occur.
contradiction_condition: Research shows that the asserted causal mechanism does not hold, or demonstrates lookup and reasoning within the scope meant by 'LLMs themselves'. Improvements alone do not disprove a structural risk.
measurement_requirements: Distinguish pretrained models from post-trained and retrieval-augmented systems. Separate unsupported factual generation, retrieval failures, and reasoning failures. State the assumptions of theoretical results.
source_requirements: Primary theoretical research and controlled experiments. Demonstrations must identify the model and external components.
