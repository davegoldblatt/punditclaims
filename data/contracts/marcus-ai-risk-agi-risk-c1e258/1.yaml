assessment_axis: causal_assessment
explicit_source_elements:
  - you don’t have to be superintelligent
  - to create serious problems
evaluator_interpretation:
  - This is a claim that serious harm is possible without superintelligence, not a prediction of catastrophe.
  - The ordinary reading of serious problems includes death, serious injury, or substantial material harm.
  - A documented contribution by a limited-purpose AI system is sufficient. AI need not be the sole cause.
  - The introductory characterization of the literature is outside the supplied normalized proposition.
  - A specialized driving system with documented perception and response limitations is treated as below superintelligence.
support_condition: A credible investigation establishes that a below-superintelligent AI system contributed materially to serious harm.
contradiction_condition: Evidence establishes that the proposed examples did not involve AI or did not causally contribute to serious harm, together with a defensible basis for finding that such harm requires superintelligence. Failure to find an example alone would not establish contradiction.
measurement_requirements: Identify the system, its relevant limitations, the harm, and its causal contribution. Distinguish system failures from human and organizational contributions.
source_requirements: Prefer official investigations or independently documented incidents over hypothetical scenarios.
