evaluator_interpretation:
  - The ordinary reading concerns a meaningful effect on measured economic output, including investment and production. It is not limited to productivity gains from using AI.
  - No country is named. US national accounts are a relevant test case, but cannot establish a worldwide result.
  - For this ongoing macroeconomic observation, the target is the first quarter of 2026, the latest completed GDP quarter reportable before the post.
  - Materiality means an economically meaningful contribution, without imposing an invented numerical cutoff.
support_condition: Credible estimates isolating AI's contribution show a negligible effect on GDP in the relevant economy and target quarter.
contradiction_condition: Credible estimates isolating AI's contribution show an economically meaningful effect on GDP in the relevant economy and target quarter.
measurement_requirements: Distinguish GDP from gross investment, aggregate demand and productivity. Account for imports and separate AI activity from broader technology spending.
source_requirements: National accounts and transparent economic estimates available by the evaluation date, including later analyses of the target quarter.
