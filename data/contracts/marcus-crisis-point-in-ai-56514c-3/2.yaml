explicit_source_elements:
  - the draft EU AI Act
  - the closest thing we have
  - AI regulation with real teeth
evaluator_interpretation:
  - The comparison concerns the regulatory landscape as of publication on 2023-11-10.
  - The ordinary meaning of 'real teeth' is enforceable obligations backed by meaningful consequences for violations.
  - The complete claim also ranks the draft EU AI Act above alternatives. Marcus supplies no standard for deciding which regulation is 'closest', including how to weigh coverage, sanctions, oversight and whether rules are already binding.
  - The explicit reference to a draft means that lack of enacted status alone cannot fairly contradict the claim.
  - Testing only whether the EU draft contained enforcement provisions would weaken the claim by dropping its comparison. Ranking regulatory systems using evaluator-selected weights would add a commitment Marcus did not make.
  - The separate assertions about jeopardy and possible regulatory capture are outside this claim.
support_condition: No sufficient support condition can be specified for the complete comparison without adding a ranking standard. Evidence of meaningful enforcement provisions would support the narrower description 'real teeth', but would not establish 'the closest thing we have'.
contradiction_condition: No sufficient contradiction condition can be specified for the complete comparison without adding a ranking standard. Another jurisdiction's enforceable AI rules would establish a relevant alternative, but would not alone show that the EU draft was less close to what Marcus meant.
measurement_requirements: A comparison would require a defined set of alternatives and a stated rule for weighing regulatory scope, binding obligations, oversight and sanctions. The supplied words provide neither.
source_requirements: Primary legislative texts and official descriptions of proposals or rules existing by 2023-11-10. Subsequent enactment or implementation cannot determine this contemporaneous comparison.
