assessment_axis: historical_observation
explicit_source_elements:
  - The collapse of SaaS
  - the collapse of the business models of both venture capital and private equity
evaluator_interpretation:
  - Assess the supplied proposition about SaaS, venture capital and private equity; exclude the separate political assertion in the surrounding sentence.
  - The ordinary reading of business-model collapse is widespread breakdown of the ability to operate economically and sustain the model, rather than merely falling valuations or a difficult fundraising year.
  - For SaaS, examine customer demand, revenue, retention, profitability and business failures. For VC and PE, examine fundraising, exits, distributions, realized returns and fund closures.
  - The observation concerns conditions at publication. Use calendar 2025, the latest completed annual reporting period available before the post, together with contemporary market observations through March 10, 2026.
  - No geography is specified. US VC data and global PE data are relevant but do not establish a universal result.
  - This is an industry-level viability claim, not a claim about a named company's financial figure; metric_scope is null.
support_condition: Representative evidence shows widespread operational deterioration in SaaS and a sustained breakdown of fundraising, investment realization and capital recycling in both VC and PE, sufficient to demonstrate that their business models were failing during the target period.
contradiction_condition: Representative operating and realized-return evidence shows the claimed sectors continued to sustain their business models, with the observed declines confined to valuations, particular segments or an ordinary downturn. Large individual deals or continued activity alone are insufficient.
measurement_requirements: Distinguish valuations from operating results, investment deployment from fundraising, exit values from cash distributions, and unrealized valuations from realized returns. Assess breadth and persistence rather than isolated winners or failures.
source_requirements: Prefer broad industry datasets and original research. Keep geography, reporting periods and financial measures explicit. Later publications may describe the target period, but later economic outcomes cannot settle this observation.
metric_scope: null
original_horizon: null
