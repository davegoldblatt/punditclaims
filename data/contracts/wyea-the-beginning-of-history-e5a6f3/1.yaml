ambiguity_flags:
  - No numerical threshold or duration defines 'collapse'.
  - SaaS could refer to share prices, operating businesses or the subscription model.
  - VC and PE could refer to traditional fund economics, particular managers or the entire industries.
  - No geography is specified.
  - "The reporting window is inferred from an ongoing-state claim: latest completed annual results plus market observations through publication."
