explicit_source_elements:
  - Two weeks later, it has already come out
  - the database that indexes the whole thing is in plain text
  - except on systems that are explicitly set to encrypt everything
evaluator_interpretation:
  - Assess the early Recall implementation examined around the post date, not later redesigned releases.
  - Plain text means readable, unencrypted database contents, not that the SQLite file is literally a plain-text document.
  - Read the exception as referring to whole-disk encryption, which is distinct from encryption applied to the database itself.
  - Use May 24 through June 7, 2024, reflecting the post's recent two-week context. Its reference to March 24 conflicts with that context.
  - The descriptions bananas and Keystone Kops level security are opinions; the assessable proposition is the database's storage protection.
support_condition: Direct technical examination of the relevant early Recall implementation establishes that its screenshot-derived text index was readable in an SQLite database without separate database encryption, while system-level disk encryption could protect the stored files.
contradiction_condition: Direct examination establishes that the relevant early implementation independently encrypted its index database, or that the plaintext reports concerned a different product or materially different implementation.
measurement_requirements: Identify the tested version and distinguish database encryption, whole-disk encryption, and access after a user has logged in.
source_requirements: Prefer researchers' direct examinations, reproducible tools, and contemporary Microsoft documentation. Later versions are context only.
