  - generative AI does not "know" anything
  - somewhere between useless and actively harmful as training data
evaluator_interpretation:
  - The testable assertion is that substantial model-generated training content provides no useful learning or causes deterioration.
  - The sentence does not restrict itself to unfiltered content or repeated replacement of all original human data.
  - The philosophical statement about knowing is treated as the offered explanation, not as a separate measurable outcome.
  - Large synthetic datasets used for pretraining or fine-tuning qualify as reams; no precise size threshold was supplied.
support_condition: Controlled studies show that substantial synthetic training content consistently fails to improve held-out performance or causes degradation across the relevant uses.
contradiction_condition: Controlled studies demonstrate useful improvements from substantial model-generated training content, even if other synthetic-data procedures cause harm.
measurement_requirements: Compare otherwise similar training procedures and held-out performance. Identify curation, synthetic volume, retention of real data, and whether training is recursively repeated.
source_requirements: Primary experimental or theoretical research with its assumptions stated.
