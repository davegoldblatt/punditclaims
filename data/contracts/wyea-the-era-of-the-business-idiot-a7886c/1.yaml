assessment_axis: causal_assessment
explicit_source_elements:
  - '"fastest growing product in Silicon Valley history"'
  - didn't grow because it was useful, or good, or able to do anything in particular
  - but because a media controlled by Business Idiots decided it was "the next big thing"
  - talking about it nonstop since November 2022
  - even to this day the company can't really explain what it is you're meant to use it for
evaluator_interpretation:
  - "Plain reading: ChatGPT's growth from launch to May 2025 came from media hype rather than from people finding it useful for particular tasks. Usefulness played essentially no part."
  - "Testable implication: if usefulness played no part, users would not report using it for concrete tasks at growing rates, or finding it helpful. Independent surveys during the period that show growing task-based use and reported helpfulness count against the claim."
  - Media attention plausibly drove awareness and trial. That alone does not support the claim, because the claim excludes usefulness, not just credits hype.
  - The 'company can't explain' clause is treated as rhetorical emphasis. The scoring rests on the growth-cause clause.
support_condition: Evidence from the period that ChatGPT use was mostly one-off trial, with few users doing concrete tasks or finding it helpful. Or evidence that growth tracked media coverage while task-based use did not grow.
contradiction_condition: Independent evidence from the period that growing shares of people used ChatGPT for specific tasks (work, learning) and that a substantial share of users found it helpful. That would show usefulness contributed to its growth.
measurement_requirements: Representative surveys of ChatGPT use and perceived helpfulness between November 2022 and May 2025.
source_requirements: Independent survey organisations preferred over OpenAI's own studies.
