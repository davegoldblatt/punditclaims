assessment_axis: causal_assessment
explicit_source_elements:
  - ChatGPT's popularity
  - '"fastest growing product in Silicon Valley history"'
  - didn't grow because it was useful, or good, or able to do anything in particular
  - but because a media controlled by Business Idiots decided it was "the next big thing"
  - talking about it nonstop since November 2022
  - guaranteeing that everybody would try it
  - even to this day the company can't really explain what it is you're meant to use it for
evaluator_interpretation:
  - The core claim is causal and counterfactual. Media hype, not usefulness, was the reason ChatGPT's user base grew from November 2022 to May 2025.
  - Evidence that people use ChatGPT for tasks, or say it helps them, does not by itself settle the cause of growth. Such use can sit alongside hype-driven adoption, so it is not treated as enough to contradict the claim.
  - "A fair test would need evidence that separates the two causes: for example, studies linking media exposure to sign-ups and early drop-off, compared with retention and continued use driven by task value."
  - The side remark that OpenAI 'can't really explain what it is you're meant to use it for' is read as a judgment about how clearly OpenAI explains the product, as of the post date. It is not a measurable claim on its own.
  - "'Useful' and 'good' are partly value judgments."
support_condition: Credible studies show that ChatGPT's adoption and sustained use from Nov 2022 to May 2025 were driven mainly by media attention, with little lasting use tied to task value. For example, most users would try it after coverage and then leave, and media exposure would explain growth better than usefulness does.
contradiction_condition: Credible studies that separate the causes show that sustained growth and retention were driven mainly by repeated use for valued tasks, independent of media coverage. For example, word-of-mouth or retention driven by usefulness would explain most growth once media exposure is controlled for.
measurement_requirements: "Causal evidence on what drove adoption: user acquisition and retention studies tied to media exposure, or surveys on why people adopted and kept using ChatGPT. Usage counts alone are insufficient."
source_requirements: Peer-reviewed or preprint research, independent surveys (e.g., Pew), or company-disclosed cohort and retention data. The speaker's own writing does not count.
