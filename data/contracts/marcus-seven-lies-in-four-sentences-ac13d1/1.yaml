ambiguity_flags:
  - No accuracy threshold or definition of distinguishing facts from fiction is supplied.
  - The wording can mean lack of meaningful capability or lack of dependable verification; these readings need not receive the same outcome.
  - LLMs names a broad class without specifying models, prompts, tools or subject matter.
  - The ongoing observation has no explicit reporting period; the current-year period through publication is an evaluator choice.
