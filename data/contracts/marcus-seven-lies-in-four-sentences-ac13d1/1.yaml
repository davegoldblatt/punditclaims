assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - too dumb to distinguish facts from fiction
  - still thinks
evaluator_interpretation:
  - Assess the claim about LLM capability, rather than whether Marcus held this belief.
  - The plain reading is that contemporary LLMs lack a meaningful ability to tell factual statements from false ones. This does not require perfect accuracy.
  - Treat fiction as false factual assertions, consistent with the surrounding discussion of fabricated news.
  - Use 2023 through the post date as the current-year observation period for contemporary models. The source supplies no reporting interval, and model evaluations have no standard quarterly reporting cycle.
  - Controlled classification of independently labelled true and false statements tests this ability. Generating an occasional correct answer is insufficient.
  - The surrounding example also suggests a narrower concern about dependable verification of generated news. Evidence of limited classification ability does not establish that stronger reliability.
support_condition: Controlled evaluations of contemporary LLMs find no meaningful discrimination between true and false statements after accounting for chance, label imbalance and refusals.
contradiction_condition: A controlled evaluation of a contemporary LLM demonstrates systematic discrimination between independently labelled true and false statements, including successful identification of both classes.
measurement_requirements: Identify the tested model, evaluation task, reference labels, classification results and treatment of refusals. Consider class-specific results and possible training-data exposure. Distinguish factual classification from factual generation.
source_requirements: Primary empirical studies of models evaluated during the target period, available by 2026-10-28. Prefer original pre-post versions. The speaker's examples cannot independently establish the outcome.
