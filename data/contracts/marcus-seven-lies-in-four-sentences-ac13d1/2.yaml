assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - too dumb to distinguish facts from fiction
  - being able to compare what they say with the world
evaluator_interpretation:
  - The ordinary reading is that contemporary LLMs cannot reliably distinguish factual assertions from plausible falsehoods, especially in their own output. It does not require complete inability or performance at chance.
  - Reliable means dependable across varied factual checking tasks. Occasional mistakes alone would not establish the claim; substantial, recurring errors would. Marcus supplied no numerical cutoff, and none is attributed to him.
  - "The claim concerns capabilities at publication, not all future LLMs. Because no reporting period is specified, the observation window is the current year through the post: January 1–October 4, 2023."
  - Prompting, retrieval and repeated-sampling results count, with their testing conditions preserved. Generating false statements alone does not establish inability to recognize them.
support_condition: Controlled evaluations of contemporary models show substantial, recurring failures to distinguish factual from false or fabricated assertions across varied tasks, including checking model-generated text. Successful methods do not establish dependable general factual checking.
contradiction_condition: Controlled evaluations of contemporary models demonstrate consistently dependable factual discrimination across varied tasks, including plausible falsehoods and their own generated assertions. Merely performing above chance or succeeding on a narrow task is insufficient.
measurement_requirements: Use evaluations with stated models, factual reference labels and a direct recognition or verification task. Distinguish classification accuracy from ranking metrics, and factual falsity from mere lack of support in a supplied document.
source_requirements: Primary empirical research concerning models available by October 4, 2023, published by October 28, 2026. Preserve version dates and include successful checking results as counterevidence.
