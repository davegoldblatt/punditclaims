assessment_axis: historical_observation
explicit_source_elements:
  - entire data center buildout strategy
  - over a gigawatt of capacity
  - in the hands of Core Scientific
  - doesn't appear to have built an AI data center before
  - majority of its money from mining and selling crypto
evaluator_interpretation:
  - Entire means all of CoreWeave's planned buildout, not merely an important supplier relationship.
  - Read money as revenue in the company financial disclosures discussed in the post, not net profit or financing proceeds.
  - Use fiscal 2024 for the revenue clause, the latest disclosed annual period before publication.
  - Assess contracted buildout as it stood at publication. The prior-construction clause covers history before publication, so the combined target interval has no lower bound.
  - The phrase doesn't appear qualifies the speaker's confidence. Assess whether public evidence of a prior AI facility existed, without claiming to know what he personally saw.
  - The financial metric scope applies to the revenue clause; construction history and developer relationships are nonmonetary subclaims.
support_condition: Contemporaneous records place all relevant CoreWeave expansion exceeding one gigawatt with Core Scientific, show no documented prior AI facility, and establish that cryptocurrency mining supplies most Core Scientific revenue.
contradiction_condition: A documented buildout with another developer defeats the exclusive-dependence clause; a documented prior AI facility defeats the apparent lack of experience; cryptocurrency revenue of half or less defeats the majority clause.
measurement_requirements: Distinguish gross site power from critical IT load, contracted capacity from operational capacity, and revenue from profit. Do not equate hosting cryptocurrency GPUs with building an AI facility.
source_requirements: Developer announcements, facility history and company financial disclosures published by the evaluation date.
