assessment_axis: historical_observation
explicit_source_elements:
  - In OpenAI and Anthropic’s case
  - a model that controls your computer and performs tasks based on a prompt
  - so unreliable as to be disqualifying
  - the tasks it succeeds at
  - remarkably simple
evaluator_interpretation:
  - The plain reading is that the then-current computer-use agents cannot be depended on for unattended general computer work, with successful demonstrations concentrated in ordinary simple tasks.
  - "Assess January 1 through February 24, 2025: the latest complete month and the current partial month before the post."
  - Do not interpret the statement as a forecast about later agent versions.
  - "'Disqualifying' is read in the surrounding context of autonomous task execution, not as claiming the products have no possible supervised use."
  - Whether 'the tasks it succeeds at' means exclusively simple tasks or predominantly simple demonstrations is unresolved.
support_condition: Representative tests show frequent failures in unattended ordinary computer work, while task-level results show successful performance concentrated in simple tasks.
contradiction_condition: Representative tests establish dependable unattended performance and substantial successful completion of complex computer workflows by the then-current products.
measurement_requirements: Identify the model, interface, task difficulty, permitted steps, retries and human interventions. Aggregate success rates alone cannot classify the complexity of successful tasks.
source_requirements: Dated evaluations of the relevant product versions, preferably independent and reproducible. Vendor benchmarks and small demonstrations require explicit limitations.
