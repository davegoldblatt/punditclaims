ambiguity_flags:
  - No numerical reliability threshold defines 'disqualifying'.
  - No task taxonomy defines 'remarkably simple'.
  - The statement may concern all successful tasks or the demonstrations being discussed.
  - The observation window is inferred from the ongoing description of current products.
  - OpenAI's browser product and Anthropic's computer-use API are different deployment settings.
