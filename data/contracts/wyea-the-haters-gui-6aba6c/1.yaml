  - actual capital expenditure numbers are likely much lower
  - even when factoring in inflation
  - Amazon Web Services
  - a bargain
  - a fraction of the cost
  - 2024 or 2025
evaluator_interpretation:
  - The checkable core compares cumulative early AWS buildout spending through the 2015 profitability disclosure with Amazon's total annual capex in 2024 or its 2025 budget known at publication.
  - I use 2006–2015 as the approximate early-buildout window implied by the surrounding nine-or-ten-year example; its exact endpoints are not supplied.
  - The plain reading of a fraction is materially less, without imposing an unstated ratio.
  - The $67.6 billion calculation is expressly illustrative, not an observed AWS expenditure total.
  - Bargain is an evaluative judgment. Inflation adjustment is a measurement requirement, not a conditional forecast.
support_condition: A defensible historical AWS expenditure series, adjusted into comparable dollars, establishes that cumulative early buildout capex was materially below Amazon's 2024 annual capex and/or its contemporaneous 2025 budget.
contradiction_condition: Comparable historical evidence establishes that inflation-adjusted cumulative AWS buildout capex was not materially below the relevant annual comparator. An error in the illustrative calculation alone does not settle the broader claim.
measurement_requirements: Identify AWS-specific annual expenditures, treatment of leased equipment, the buildout endpoints and an inflation index. Compare gross with gross or net with net. Keep the 2025 budget distinct from subsequently realized spending.
source_requirements: Historical filings and defensible AWS allocations, official inflation data, and contemporaneous Amazon capex disclosures.
metric_scope:
  company: Amazon Web Services and Amazon.com
  metric: Inflation-adjusted cumulative early AWS buildout capex relative to Amazon total annual capex in 2024 or the contemporaneous 2025 budget
  currency: USD
  units: Billions of comparable purchasing-power dollars and expenditure ratios
