explicit_source_elements:
  - NVIDIA has committed to $30 billion in multi-year cloud compute agreements
  - spending $6 billion or more a year through 2028
  - a $6.3 billion backstop for CoreWeave
  - NVIDIA is 'obligated to purchase the residual unsold capacity' through April 2032
  - suggesting that there would be residual capacity that had gone unsold
evaluator_interpretation:
  - "The facts he asserts are tested: about $30 billion in multi-year cloud service commitments, roughly $6 billion or more a year through 2028, and a $6.3 billion CoreWeave order under which NVIDIA must buy residual unsold capacity through April 2032."
  - "'Anti-demand signal' and 'suggesting ... unsold' are his hedged reading of those facts. They are not scored as a claim that capacity actually went unsold."
  - "Target period: NVIDIA's commitments as disclosed before the 2026-07-22 post. That covers the CoreWeave order signed 2025-09-09 through the latest 10-Q before the post, for the quarter ended 2026-04-26."
support_condition: NVIDIA or counterparty filings, or reliable reports of them, show about $30 billion in multi-year cloud service commitments, and a $6.3 billion CoreWeave order obliging NVIDIA to buy residual unsold capacity through April 2032.
contradiction_condition: The filings show materially different commitment totals, or show that the CoreWeave order has no residual-capacity purchase obligation or a materially different value or end date.
measurement_requirements: NVIDIA's disclosed multi-year cloud service agreement commitments in its latest 10-Q before the post. CoreWeave's 8-K terms for the September 2025 NVIDIA order.
source_requirements: SEC filings, or reputable reports quoting them.
