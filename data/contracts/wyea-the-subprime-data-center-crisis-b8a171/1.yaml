explicit_source_elements:
  - $30 billion in multi-year cloud compute agreements
  - $6 billion or more a year through 2028
  - rent back its GPUs
  - $6.3 billion backstop for CoreWeave
  - purchase the residual unsold capacity
  - through April 2032
  - suggesting ... billions of dollars
evaluator_interpretation:
  - Assess both the disclosed commitments and the inference that they signal billions of dollars of otherwise unsold capacity.
  - Read spending through 2028 as the payment schedule attached to existing commitments, not a claim that future payments had already occurred.
  - Use NVIDIA's quarter ended April 26, 2026, its latest reported quarter before the post, for the outstanding commitment amount.
  - A contingent purchase obligation establishes protection against unsold capacity; its face amount does not establish the realized or expected shortfall.
support_condition: Matching disclosures establish the commitment total, payment schedule and CoreWeave terms, while provider records establish billions in capacity that would otherwise remain unsold.
contradiction_condition: Matching disclosures materially refute the financial amounts or terms, or comparable provider records refute the inferred unsold-capacity shortfall. A contractual contingency alone establishes neither outcome.
measurement_requirements: Separate outstanding commitments, scheduled payments, contingent backstops, capacity actually delivered and purchases triggered by unsold capacity. Identify fiscal versus calendar years.
source_requirements: NVIDIA filings and CoreWeave agreement disclosures for contractual facts; provider sales, utilization and backstop-payment records for the demand inference.
