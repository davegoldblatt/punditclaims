assessment_axis: forecast_outcome
explicit_source_elements:
  - the vast majority of AI data centers
  - will collapse
  - someone actually paying money for AI compute
  - This is an inevitability
  - how much capacity there is versus how much people are actually paying
evaluator_interpretation:
  - "Collapse means financial failure: insolvency, debt default, permanent closure, or abandonment because paid compute demand cannot sustain the project."
  - Vast majority means an overwhelming majority, not merely more than half. No numerical cutoff is supplied.
  - The relevant population is the AI data centers operating or being developed in the boom described at publication. Geography and treatment of announced projects are unspecified.
  - The reference to paying for compute describes the predicted failure mechanism, rather than an independent conditional antecedent.
  - The nearby four-year statement concerns operating expenses. It does not establish a deadline for this collapse forecast.
support_condition: Reliable project-level records establish that an overwhelming majority of the relevant AI data centers financially failed because paid compute demand could not sustain them.
contradiction_condition: Comprehensive records establish that enough of the relevant project population completed its economic life without the predicted failure to rule out an eventual overwhelming-majority collapse. Continued operation at an interim date is insufficient.
measurement_requirements: A defined project population and denominator; consistent definitions of financial failure; dated outcomes; and evidence connecting failures to inadequate paid compute demand. Leasing commitments, capacity, realized usage, and customer payments must be distinguished.
source_requirements: Court and insolvency records, default notices, operator disclosures, and independently documented project outcomes covering the relevant population.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve on a dated, independently documented event or cumulative record establishing overwhelming-majority financial failure in the relevant population, with inadequate paid compute demand established as the mechanism. Individual failures, financing stress, and construction delays do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical definition of vast majority.
  - No geographic boundary or project denominator.
  - Collapse could refer to projects, operators, or financing vehicles.
  - Treatment of announced but unbuilt facilities is unspecified.
retrospective_or_prospective: retrospective
