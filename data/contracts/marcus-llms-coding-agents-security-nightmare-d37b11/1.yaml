assessment_axis: historical_observation
explicit_source_elements:
  - Anything that might get into a prompt
  - can spell trouble
evaluator_interpretation:
  - The plain reading is a warning that attacker-controlled content entering an agent's context can carry instructions, including content presented as development data.
  - Can expresses a possible attack route, not successful exploitation of every string, input channel, or protected system.
  - The scope includes coding assistants and agents performing repository-development workflows through tools.
  - For this ongoing technological state, use the current calendar year through 2025-08-17 as the observation window.
support_condition: Primary demonstrations show malicious instructions reaching development agents through distinct ordinary content channels and causing unauthorized behavior.
contradiction_condition: Evidence establishes a general separation of external content from actionable instructions that rules out the claimed risk across the scoped agents and channels.
measurement_requirements: Identify the external input channel, how content enters model context, the resulting behavior, and relevant permission assumptions. Do not infer universal exploitability from examples.
source_requirements: Original demonstrations or controlled evaluations of developer-agent workflows during the observation period.
