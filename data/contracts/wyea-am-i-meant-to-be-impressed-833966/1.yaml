assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft is OpenAI’s primary cloud provider
  - I estimate
  - around 70% of its AI revenue
  - taking up the majority of its infrastructure
evaluator_interpretation:
  - Read the revenue estimate as OpenAI's share of Microsoft's current AI revenue pace, consistent with the surrounding run-rate comparisons.
  - For the ongoing quantitative claims, use January–March 2026, the latest completed Microsoft reporting quarter before the May 6 post.
  - Read 'its infrastructure' as Microsoft's AI compute infrastructure, given the surrounding discussion of GPUs, rather than all Microsoft infrastructure.
  - Read 'majority' as more than half of available AI compute capacity allocated to OpenAI workloads, measured consistently across the numerator and denominator.
  - Treat primary-cloud-provider status as a separate relationship statement; it does not establish either quantitative share.
support_condition: Comparable evidence for January–March 2026 establishes that OpenAI supplied approximately 70% of Microsoft's AI revenue pace and occupied more than half of its relevant AI compute capacity, with the primary-provider relationship also established.
contradiction_condition: Comparable records materially contradict the approximate revenue share, establish an infrastructure share of no more than half, or establish that Microsoft was not the primary provider. Any supported and contradicted components must be identified separately.
measurement_requirements: Microsoft AI revenue and OpenAI-attributable revenue measured over the same interval and on the same recognition basis; total and OpenAI-allocated AI capacity measured in comparable units. Customer revenue shares cannot substitute for capacity shares.
source_requirements: Company disclosures or independently verified financial and capacity records. Capacity estimates must identify provider attribution and distinguish operational capacity from future commitments.
