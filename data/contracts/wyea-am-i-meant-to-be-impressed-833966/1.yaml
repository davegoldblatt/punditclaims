ambiguity_flags:
  - The present-tense estimate names no reporting period; the latest completed reported quarter is used.
  - The surrounding text combines late-2025 estimates with a current AI revenue run rate.
  - Infrastructure could mean GPU count, compute capacity, power capacity or actual utilization.
  - The treatment of Microsoft's own products using OpenAI models and externally leased capacity is unspecified.
  - No numerical tolerance is supplied for 'around 70%'.
