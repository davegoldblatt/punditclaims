  - regulation of foundation models
  - some kind of sneaky last minute move
  - a massive, massive misrepresentation
evaluator_interpretation:
  - Marcus explicitly explains late as a last-minute addition around the December 2023 agreement. The testable core is whether broad general-purpose AI regulation had appeared substantially earlier.
  - The target period covers the legislative process from the April 2021 proposal through the December 12, 2023 post.
  - Following Marcus's stated scope, general-purpose AI provisions count as relevant predecessors to foundation-model regulation. They need not contain every obligation in the eventual agreement.
  - The assessment concerns chronology, not whether LeCun intended to deceive or whether massive is a measurable degree of error.
support_condition: Dated negotiating texts contain substantive proposed requirements for general-purpose AI well before the final December 2023 negotiations.
contradiction_condition: The relevant broad regulatory provisions first appeared only during the final December negotiations, with earlier texts containing no substantive proposed duties.
measurement_requirements: Distinguish a first mention, proposed provider duties and the final wording of particular obligations.
source_requirements: Dated legislative proposals or negotiating texts, preferably from EU institutions. A faithful hosted copy of an original document is acceptable.
