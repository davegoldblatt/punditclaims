assessment_axis: causal_assessment
explicit_source_elements:
  - threatening the environment
  - data centers
  - built on too much speculation
evaluator_interpretation:
  - Environmental threat means material risks from emissions, water consumption, or other resource burdens attributable to generative-AI infrastructure.
  - Too much speculation means construction materially exceeds demand supported by credible usage, commitments, and reasonable projections. Uncertainty alone is insufficient.
  - I assess construction and risks existing by February 23, 2026. Announced projects, connection requests, completed buildings, and utilized computing capacity are distinct.
support_condition: Evidence links generative-AI data-center construction to material environmental risks and shows that the relevant construction exceeds substantiated demand.
contradiction_condition: Evidence demonstrates no material environmental threat from the relevant buildout, or establishes that the allegedly excessive construction is justified by credible demand.
measurement_requirements: Separate generative AI from other data-center workloads; distinguish modeled risks from realized impacts and project proposals from built capacity. Compare construction with utilization and credible demand commitments.
source_requirements: Environmental measurements or assessments and original construction, demand, utilization, or power-planning records.
