  - be truthful
  - obey the laws of physics
  - don’t just invent (or eliminate) objects
evaluator_interpretation:
  - The contextual plain reading concerns guarantees for broad semantic constraints in general-purpose generation, rather than merely encouraging compliance through prompts.
  - A guarantee must cover the stated constraint throughout its declared operating domain; high benchmark accuracy is insufficient.
  - A guarantee for a narrow mathematical constraint is material counterevidence to the categorical wording, but does not automatically guarantee general truthfulness, physical correctness, or object permanence.
  - The statement is reaffirmed as an ongoing technical state in December. Because there is no reporting cycle, the target is the pre-post portion of December 2024.
support_condition: Technical evidence establishes the claimed inability to encode and guarantee the named broad constraints in the relevant systems and operating domains. Ordinary output failures alone do not establish that no method exists.
contradiction_condition: A documented method available by the post guarantees at least one named broad constraint for the relevant general-purpose outputs, with explicit assumptions and a valid proof or complete enforcement mechanism.
measurement_requirements: Inspect the exact constraint, output domain, assumptions, enforcement mechanism, and guarantee. Distinguish exact restricted guarantees from empirical reliability and unrestricted semantic guarantees.
source_requirements: Technical papers, proofs, and implementations are necessary. Missing product features or unsuccessful demonstrations cannot establish universal impossibility.
