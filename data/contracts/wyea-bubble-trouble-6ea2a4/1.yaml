explicit_source_elements:
  - hallmark of a bubble
  - high-revenue, negative-profit industry
  - Glossy stories
  - never seem to discuss profits
  - only endless growth
evaluator_interpretation:
  - Hallmark expresses a resemblance or warning sign, not a specified diagnostic rule for identifying bubbles.
  - Glossy stories and never seem describe an undefined, hedged impression of coverage.
  - Do not convert never seem into a literal claim that no article discussed profitability.
  - Use 2023 through the post date as the contextual coverage window identified by the supplied context.
  - "The embedded revenue description is not a sufficiently specified financial measurement: it does not distinguish realized revenue, annualized revenue or projections."
support_condition: No fair binary support condition exists without defining the coverage sample, the amount of profit discussion required and the proposed bubble criterion.
contradiction_condition: No fair binary contradiction condition exists for the hedged statement. Counterexamples can challenge a literal universal reading but cannot settle the stated impression.
measurement_requirements: A defined article corpus and coding rule for profitability discussion; separate realized revenue, annualized revenue and forecasts if assessing the embedded financial description.
source_requirements: Full contemporaneous articles are primary evidence of what coverage discussed. Company accounts would be needed only for a separate financial claim.
