explicit_source_elements:
  - whether the systems reliably deliver what they are asked for
  - They don’t.
  - a clever user with a lot of experience and time to kill
  - Compositionality remains a problem. So does negation.
evaluator_interpretation:
  - The plain reading is that the contemporary systems repeatedly fail straightforward requests without extensive prompting or retries. It is not that every request fails.
  - The surrounding examples concern image generation, especially composition and negation. Failures in an image-generation pipeline do not by themselves establish failures in every language-model task.
  - No numerical reliability threshold or representative task distribution is specified.
  - I use February 1–8, 2024, the publication month through the post date, as the latest observable period for this ongoing-state claim. The references to examples from last night and the author's current attempt anchor it to contemporary use.
  - The concession about clever prompting is not a conditional forecast or an antecedent that must occur before the observation can be assessed.
support_condition: Independent repeated tests of the systems operating in the target period show recurring failures to fulfill straightforward composition, negation, or comparable instructions without elaborate prompting. Isolated selected failures are insufficient.
contradiction_condition: Independent representative repeated tests of the same systems and relevant instructions show consistently correct fulfillment with ordinary prompts, and establish that the alleged recurring failures do not replicate.
measurement_requirements: Identify model versions, interfaces, prompts, testing dates, complete outputs, attempt counts, and scoring rules. Distinguish ordinary prompts, automatic prompt rewriting, and manual prompt engineering. Include successes as well as failures.
source_requirements: Prefer reproducible primary evaluations or documented independent replications. The speaker's own examples cannot independently establish the outcome.
