assessment_axis: forecast_outcome
explicit_source_elements:
  - if it doesn’t make that much revenue
  - doesn’t get funding or debt to support it
  - OpenAI will run out of money
  - Anthropic will if that capacity gets built
  - doesn’t make tens of billions of dollars a month
evaluator_interpretation:
  - Treat the two companies as separate conditional branches. OpenAI requires both the revenue shortfall and insufficient financing; Anthropic requires the referenced capacity to be built and the stated monthly revenue shortfall.
  - For OpenAI, the context supplies a reported $113 billion revenue projection for calendar 2028, alongside approximate monthly figures. That revenue year is not a deadline for cash exhaustion.
  - Run out of money means insufficient available liquidity to meet obligations when due.
  - The cash outcome has no stated accounting basis. The contextual revenue projection is a press estimate and cannot supply an accounting basis for cash.
support_condition: After the respective antecedent is established, reliable liquidity and obligation records show that the company cannot meet payments because available funds are exhausted.
contradiction_condition: After the respective antecedent is established, records demonstrate a durable ability to meet obligations without the revenue or financing the claim treats as necessary. Continued operation for a short interval is insufficient.
measurement_requirements: Separate realized revenue, annualized run rate, financing commitments, cash received, unrestricted cash, available credit, and payment obligations. Establish capacity commissioning and when obligations become payable.
source_requirements: Prefer financial statements, financing disclosures, debt documents and commissioning records. Announced funding is not automatically cash received.
