assessment_axis: historical_observation
explicit_source_elements:
  - for a long time
  - OpenAI snarfs the intellectual property of artists and writers
evaluator_interpretation:
  - The ordinary reading is that OpenAI has used creators' copyrighted works without obtaining permission for those uses.
  - The reference to a longstanding practice makes the target historical conduct through the post date. No starting date is specified.
  - The claim does not require every training source to be unlicensed. Lack of permission and unlawful infringement are separate questions.
  - The assessment concerns OpenAI's conduct, not Marcus's account of his own writing.
support_condition: Reliable records establish actual use of creators' copyrighted works without their permission, rather than merely allegations or the possibility of such use.
contradiction_condition: Reliable records establish that the alleged uses were authorized, or that OpenAI did not use the works concerned.
measurement_requirements: Identify actual copyrighted works and distinguish permission, licensing and claimed legal exceptions.
source_requirements: Prefer court findings, undisputed facts in court records and OpenAI's disclosures. Allegations alone are insufficient.
