explicit_source_elements:
  - nobody yet can buy
  - a super-smart (or even decently smart) robot
  - at any price
evaluator_interpretation:
  - The surrounding discussion makes this a claim about a general-purpose household helper capable of performing a useful range of chores autonomously.
  - A research platform requiring substantial programming, a remotely operated machine, or a single-purpose appliance does not by itself meet that description.
  - The claim describes availability on the post date. Earlier product announcements provide context but do not establish the entire market on that date.
  - The Facebook M cancellation is outside the supplied normalized proposition.
support_condition: Contemporaneous market evidence establishes that no purchasable robot offered the described general household capabilities.
contradiction_condition: At least one robot was purchasable on the post date and demonstrated a useful range of autonomous household chores.
measurement_requirements: Establish both actual purchase availability and delivered capabilities. Separate autonomous operation from remote control, demonstrations, and capabilities requiring further development.
source_requirements: Dated commercial records and capability evaluations, preferably including independent testing.
