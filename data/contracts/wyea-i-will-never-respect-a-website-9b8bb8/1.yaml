assessment_axis: historical_observation
explicit_source_elements:
  - At its current infrastructure scale
  - cannot satisfactorily serve its current paying customer base
  - still expects to burn $14 billion
evaluator_interpretation:
  - Assess the service condition and existence of the financial expectation at the post date, rather than whether the projected cash burn ultimately occurred.
  - For the ongoing service condition, use March 14 through April 14, the latest month of daily service records before the post.
  - Satisfactorily serve means reliably provide paid access under ordinary usage conditions; it does not require satisfying unlimited demand.
  - The post hyperlinks the burn figure to a press report about 2026 projections, so use an estimated calendar-2026 net cash-burn scope. The year is contextual rather than explicit in the sentence.
  - Current infrastructure scale is a scope qualifier, not an unfulfilled conditional antecedent.
support_condition: Records establish material capacity-related failures affecting existing paying customers, and a matching report establishes that Anthropic expected approximately $14 billion of net cash burn for 2026 as of the post.
contradiction_condition: Comparable service records establish adequate paid service despite the alleged constraints, or a matching contemporaneous financial record establishes a materially different cash-burn expectation.
measurement_requirements: Separate outages and engineering defects from capacity shortages, and paid customers from all traffic. Distinguish projected net cash burn from revenue, total spending, accounting losses, and realized cash flows.
source_requirements: Dated status and capacity records, subscription commitments, and the underlying projection or reliable reporting of it.
metric_scope:
  company: Anthropic
  metric: Projected net cash burn
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
