interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Satisfactorily has no explicit availability or customer-satisfaction threshold.
  - The latest month is an evaluator-selected reporting window for the ongoing state.
  - The financial year is inferred from the linked report.
  - The source does not define which cash-flow components burn includes.
  - Realized in metric_scope distinguishes a projected full-year cash-flow total from an annualized run rate; it does not mean the forecast had occurred.
retrospective_or_prospective: retrospective
