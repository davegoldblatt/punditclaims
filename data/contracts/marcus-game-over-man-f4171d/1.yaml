support_condition: Comparable Oracle share prices on the identified dates show a decline approximately equal to 61%.
contradiction_condition: Comparable prices show a decline materially different from 61%, including after allowing for ordinary rounding and reasonable quotation times.
measurement_requirements: Calculate 100 × (1 − endpoint price / baseline price). Distinguish raw share prices from dividend-adjusted historical prices and total returns.
source_requirements: Dated market quotations or reliable reporting of those quotations. Marcus's writing may identify his call, but cannot establish the price decline.
