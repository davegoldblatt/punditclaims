explicit_source_elements:
  - one can still easily jailbreak Bing
  - get it to produce egregious misinformation
  - "Context: Microsoft had introduced fixes and claimed to have solved the problems."
evaluator_interpretation:
  - The ordinary reading is that a user could bypass Bing Chat's safeguards with straightforward text prompts and obtain serious factual falsehoods.
  - Easily means without privileged access, custom software, or extensive technical work. Marcus supplied no numerical success-rate threshold.
  - Egregious misinformation means substantial false claims about real events or consequential subjects, including fabricated conspiracy narratives.
  - "The target period is March 1 through April 2, 2023: the recent operating period following the early-March assurance described in the post, ending on publication. Evidence of a subsequently blocked technique alone cannot establish that it still worked at publication."
  - Despite Microsoft's fixes describes the historical setting; this is not a conditional forecast.
support_condition: A credible, dated Bing Chat demonstration within the target period shows straightforward prompting bypassing safeguards and producing serious factual falsehoods, with no evidence that the demonstrated route had already been closed before publication.
contradiction_condition: Contemporaneous testing establishes that the alleged straightforward bypasses no longer produced serious misinformation, with sufficiently broad coverage to rebut the claimed capability. Blocking one prompt alone is insufficient.
measurement_requirements: Identify Bing Chat specifically, the testing date, the prompt sequence, the resulting false claims, and any subsequent retest or patch. Distinguish jailbreaks from ordinary factual errors.
source_requirements: Prefer dated transcripts and firsthand testing. Reports about ChatGPT alone do not establish Bing's behavior. The speaker's own writing cannot establish the outcome.
