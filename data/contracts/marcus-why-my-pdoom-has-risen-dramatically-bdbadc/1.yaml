contradiction_condition: Comparable records show improvement or no deterioration in the relevant harmful behavior. Opposing trends across dimensions would warrant mixed rather than a single directional result.
measurement_requirements: Identify model version, product, mode, prompts, sampling, and a consistent harm standard. Account for differences in user provocation and exposure.
