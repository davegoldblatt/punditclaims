assessment_axis: historical_observation
explicit_source_elements:
  - basically every AI data center I’ve seen
  - uses behind-the-meter gas turbines
  - an environmental disaster
evaluator_interpretation:
  - The relevant population is the AI data centers Zitron had encountered, not all data centers worldwide. Publicly discussed sites could help reconstruct that population.
  - The plain reading is that nearly all those sites actually use on-site gas turbines and cause serious environmental harm. Announced plants, reciprocating engines and grid-supplied gas generation are not interchangeable with operating behind-the-meter turbines.
  - For this ongoing observation, use August 2026, the latest complete month before publication. This period is an evaluator choice because the post names none.
support_condition: A sufficiently complete inventory of the sites he meant shows operating behind-the-meter gas turbines at nearly all of them, with credible evidence of serious environmental harm.
contradiction_condition: Evidence covering that same population shows a substantial share without operating behind-the-meter gas turbines, or shows that the claimed serious environmental effects do not hold across nearly all sites.
measurement_requirements: Identify the sites and their operating status, generation technology, connection arrangements and actual or credibly estimated emissions. Distinguish permitted emissions ceilings from measured emissions.
source_requirements: Prefer operating records, air permits, utility records and environmental measurements. Individual examples cannot establish prevalence within an unidentified population.
