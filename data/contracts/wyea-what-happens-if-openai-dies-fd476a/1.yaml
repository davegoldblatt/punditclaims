assessment_axis: causal_assessment
explicit_source_elements:
  - needs to keep raising money because its costs increase with its revenues
  - no clear path to either reducing them or increasing prices
  - moved enterprise customers onto accounts
  - pay the actual cost of their AI services
evaluator_interpretation:
  - "Read this as a financial explanation: growth-related service costs and pricing constraints cause a continuing need for outside financing."
  - Use Q2 2026 for the financial relationship, the latest completed quarter before publication and the quarter discussed in context; earlier periods are needed as comparators.
  - Read 'reducing' costs as improving the economics enough to reduce financing dependence. A reduction in one unit cost does not establish a reduction in total spending.
  - A 'clear path' means a concrete, credible operational or pricing route, not a guarantee of profitability.
  - Use estimate accounting basis because the financial argument is built on press-reported estimates.
support_condition: Comparable financial and customer evidence connects revenue growth to cash costs and financing shortfalls, while demonstrating that practical cost reductions or sustainable price increases cannot materially relieve those shortfalls.
contradiction_condition: Comparable evidence shows that the asserted cost and pricing constraints do not explain financing dependence, or establishes a practical route that materially reduces that dependence.
measurement_requirements: Separate revenue, inference costs, research costs, prepayments, cash burn and financing. Assess unit-cost changes alongside volume, realized prices, customer retention and total expenditure.
source_requirements: Prefer financial statements, operational cost measurements and enterprise pricing and retention records. Correlation between growth and spending alone cannot establish the causal claim.
