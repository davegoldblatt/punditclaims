explicit_source_elements:
  - Jensen Huang
  - collaborators at NVIDIA including its general counsel
  - deliberately and repeatedly
  - violated US commerce law
evaluator_interpretation:
  - In context, commerce law means the US export restrictions governing the alleged diversion of NVIDIA chips to China.
  - The claim alleges actual, knowing violations involving Huang and the general counsel, not merely wrongdoing by customers or other employees.
  - Repeatedly requires more than one unlawful act. A conviction is not essential if authenticated records otherwise establish the conduct and knowledge.
  - This is a cumulative allegation of past conduct through the post date. No starting date is supplied.
support_condition: Official findings, admissions, or authenticated transaction and communication records establish repeated unlawful exports or knowing participation by Huang and NVIDIA collaborators including its general counsel.
contradiction_condition: Reliable findings or comprehensive records establish that the alleged conduct was lawful, did not occur, or did not involve the named executives knowingly.
measurement_requirements: Identify the transactions, applicable restrictions and licences, each executive's involvement, and evidence of knowledge. Allegations against other people do not establish this claim.
source_requirements: Prefer court records, enforcement findings and authenticated communications. Distinguish charges and investigations from established violations.
