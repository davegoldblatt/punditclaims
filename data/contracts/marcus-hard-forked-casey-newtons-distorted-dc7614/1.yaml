evaluator_interpretation:
  - "Plain reading: by the post date (2024-12-06), there were documented real-world cases of AI being used in each of three ways: to produce or spread misinformation, to carry out scams, and to deny insurance claims."
  - The claim is about whether these uses happened. It is not about how common or how effective they were.
  - "'AI' is read broadly to include generative AI and predictive algorithms, which is how the post uses the term."
  - "Target period: Marcus names no period. I use 2019-01-01 to the post date, which covers the insurer algorithm deployments documented in 2019-2022 and the generative-AI misuse reported in 2023-2024."
support_condition: Credible primary or official sources, available by the evaluation date, document AI being used for (a) misinformation or influence campaigns, (b) fraud or scams, and (c) denying or driving denials of insurance claims, on or before 2024-12-06.
contradiction_condition: Credible investigation shows that one or more of the three named uses did not happen. For example, the insurer tools played no part in claim denials, or the reported AI misuse cases were fabricated.
