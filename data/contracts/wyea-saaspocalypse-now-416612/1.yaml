explicit_source_elements:
  - Every company promising "AI agents"
  - really just trying to rebrand the concept of chatbots
  - connect them to data sources
  - give them guardrails
evaluator_interpretation:
  - The contextual scope is enterprise SaaS vendors promising AI agents, including the vendors named nearby.
  - I read rebranding as a claim about the substance of their offerings, rather than an independently measurable claim about executives' private motives.
  - The plain reading is that all these offerings were limited to chatbot functionality with data connections and controls. A demonstrated counterexample would defeat every.
  - For this ongoing observation, I use the September 2024 announcement cycle through publication. Earlier announcements are background evidence.
  - Every company is a scope restriction, not a forecast antecedent.
support_condition: A sufficiently complete contemporary inventory shows that the relevant offerings were functionally limited to chatbots with data access and guardrails.
contradiction_condition: At least one relevant offering demonstrably performed substantive agent work beyond that reduction, such as independently initiating and completing a workflow rather than merely conducting a data-grounded conversation.
measurement_requirements: Identify product versions and availability, and distinguish demonstrated behavior from promised future functionality.
source_requirements: Contemporaneous specifications and deployment or demonstration records. Universal support requires broad coverage; contradiction requires one verified counterexample.
