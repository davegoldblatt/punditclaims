evaluator_interpretation:
  - The ordinary reading concerns multiple familiar secondary-school problem families, not merely numerous variants of one exceptional problem.
  - Failure to express means that the released system’s language cannot faithfully state the task without extending it or supplying substantive mathematical work externally.
  - Student accessibility requires representative tasks and evidence of their difficulty; curriculum inclusion alone is weaker evidence than successful student performance.
  - Assess the February 2025 system described in the post.
support_condition: Several representative problem families are demonstrably outside the system’s expressive language, and matching educational evidence shows that mathematically strong high-school students solve representative instances readily.
contradiction_condition: Faithful encodings show that the representative supposedly excluded families are expressible, or matching evidence defeats the asserted student-accessibility comparison.
measurement_requirements: Distinguish unsupported language constructs from unsuccessful proof search. Match student evidence to concrete tasks and distinguish multiple families from repeated instances.
source_requirements: The language specification or author documentation, representative tasks, and suitable student-performance or educational evidence.
