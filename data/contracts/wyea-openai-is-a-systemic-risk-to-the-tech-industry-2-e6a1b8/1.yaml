assessment_axis: forecast_outcome
explicit_source_elements:
  - fairly impressive uptime
  - if it is running up against a wall
  - this streak will end
evaluator_interpretation:
  - The surrounding discussion makes the condition a shortage of capacity to serve demand.
  - The plain reading is a material deterioration in reliability attributable to capacity pressure. An isolated outage does not by itself establish that a streak of generally good uptime has ended.
  - Zitron supplies no reliability threshold, comparison window, or deadline.
support_condition: Confirmed capacity pressure is followed by a material, sustained deterioration in comparable service availability, with evidence connecting the deterioration to that pressure.
contradiction_condition: Comparable reliability measurements show that confirmed capacity pressure did not produce the predicted deterioration during the relevant episode. A finite period without deterioration cannot conclusively refute an unrestricted future prediction.
measurement_requirements: Comparable availability or request-success measurements before and after the post, consistent service coverage, and incident attribution distinguishing demand pressure from unrelated failures.
source_requirements: Dated company capacity disclosures, incident reports, and preferably independent availability measurements.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Resolve as supported only after a documented material deterioration in reliability is linked to confirmed capacity pressure. An isolated outage or capacity warning is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical meaning for fairly impressive uptime.
  - No duration or severity specified for the streak ending.
  - Requiring sustained deterioration rather than any outage is an evaluator interpretation.
  - The claim does not distinguish ChatGPT, API, and other product availability.
retrospective_or_prospective: retrospective
