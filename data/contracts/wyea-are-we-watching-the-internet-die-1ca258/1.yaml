assessment_axis: causal_assessment
explicit_source_elements:
  - these platforms
  - reward scale and volume far more often than quality
  - AI naturally rewards
  - the spammiest ways to manipulate the algorithm
evaluator_interpretation:
  - Assess the causal mechanism asserted as of 2024-03-11.
  - The ordinary reading is that engagement and volume incentives give AI-assisted spam producers a systematic distribution or monetization advantage over producers prioritizing quality.
  - Reward means reach, engagement, or earnings. Spammiest is rhetorical emphasis, not a requirement to identify the single worst spammer.
  - The platform-incentive premise is part of the causal claim, not a conditional forecast.
support_condition: Comparative platform evidence shows that AI-assisted spam gains a systematic advantage because ranking or payment systems favor production volume over independently assessed quality.
contradiction_condition: Comparable evidence shows that the asserted volume-over-quality incentive does not operate, or that AI-assisted spam receives no resulting advantage after relevant differences are accounted for.
measurement_requirements: Measure production volume, content quality, distribution and any earnings separately. Compare similar producers or exploit changes in AI access or platform incentives. Successful examples alone cannot establish the claimed comparative mechanism.
source_requirements: Prefer platform experiments, independent audits and research with observable methods. Distinguish verified earnings from creators' promotional claims.
