evaluator_interpretation:
  - The amount is in US dollars, rounded to two decimal places in billions.
  - The accounting basis is company_reported because the surrounding text attributes the figure to OpenAI's financial documents.
  - The ordinary reading of paid requires payment or settlement for R&D services; recording an expense alone does not establish when it was paid.
support_condition: Independently verified records establish that OpenAI paid or settled approximately $10.59 billion to Microsoft for R&D during calendar 2025.
contradiction_condition: Comparable records establish a materially different amount, or establish that the cited amount was an expense accrual rather than payments made during 2025.
measurement_requirements: Identify the Microsoft counterparty, R&D classification, calendar-year coverage, amount, and distinction between expenses recognized and payments settled.
source_requirements: OpenAI's related-party disclosures and payment reconciliation, counterparty confirmation, or independent reporting that specifically verifies this figure. Repetition of Zitron's report is insufficient.
