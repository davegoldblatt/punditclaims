  - so far
  - AI's impact
  - far less than either cell phones or the internet
evaluator_interpretation:
  - Read 'impact' as the accumulated effects on economic activity and everyday life through the post date.
  - Retain AI's broad scope. The surrounding discussion emphasizes generative AI but expressly acknowledges AI-powered search.
  - Adoption is relevant evidence of reach, not an interchangeable measure of economic or social impact.
  - The comparison concerns accumulated impact by May 22, 2025, not adoption speed at the same age after launch. No starting date is supplied.
support_condition: Comparable evidence across economic effects and everyday use shows AI's accumulated impact substantially below that of both mobile phones and the internet.
contradiction_condition: Comparable evidence shows AI's accumulated impact comparable to or greater than at least one of the two technologies.
measurement_requirements: Use comparable populations, periods, and outcome measures. Account for AI embedded in phones and internet services; do not compare a global ownership rate directly with a U.S. generative-AI usage rate.
source_requirements: Official adoption statistics and credible comparative economic or social measurements, with methods and technology definitions disclosed.
