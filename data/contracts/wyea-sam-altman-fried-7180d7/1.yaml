  - '"just over a year into the existence (and proliferation) of ChatGPT, DALL-E, and other image generators"'
  - '"these things are interesting, surprising"'
  - '"but not particularly useful for anything"'
evaluator_interpretation:
  - "Plain reading: in the roughly 15 months after ChatGPT launched, generative AI products such as ChatGPT and DALL-E had no meaningful practical use for real tasks."
  - Well-designed studies showing clear, measured gains on real work tasks from these tools during that window would contradict the claim. A broad usefulness claim needs only one solid counterexample domain to fail.
  - "'Not particularly useful' is softer than 'useless', so small or doubtful gains would not count against him. Large, statistically clear gains would."
support_condition: Credible studies or data from late 2022 to February 2024 showing that ChatGPT, DALL-E or similar tools gave no meaningful practical benefit on real tasks.
contradiction_condition: Credible controlled studies from late 2022 to February 2024 showing large, measurable productivity or quality gains from generative AI tools on real work tasks.
measurement_requirements: Measured effects on task time, quality or output (for example randomized experiments or field studies) of generative AI tools available in the period.
source_requirements: Peer-reviewed papers or established working-paper series (NBER, Science); company usage figures as context only.
