assessment_axis: historical_observation
explicit_source_elements:
  - performance on MathGLM steadily declines as the problems gets bigger
  - discrepancy between it and a calculator steadily increasing
  - generalizing by similarity
  - doing better on cases that are in or near the training set
  - never, ever getting to a complete, abstract, reliable representation
evaluator_interpretation:
  - Assess the MathGLM experiments discussed in the post, rather than later models.
  - Read 'steadily declines' primarily as a consistent downward trend; separately report whether every successive digit length declines.
  - Treat calculator performance as an ideal exact-arithmetic reference within the tested domain, not as a measured device benchmark.
  - The similarity mechanism and absence of an abstract representation are separate empirical assertions. Error rates alone cannot establish them.
  - Use September 2023, the reporting month of the paper discussed, as the target period.
support_condition: The reported size-dependent results show the claimed decline, and controlled training-distance tests or analysis of the model's computations establish similarity dependence and failure to acquire the asserted reliable abstraction.
contradiction_condition: Matched results overturn the downward trend, or model-specific analysis demonstrates a reliable multiplication procedure that generalizes independently of proximity to training examples. A local accuracy increase contradicts only a strictly monotonic reading.
measurement_requirements: Separate multiplication-only scores from mixed arithmetic; inspect each digit length; control training exposure and problem difficulty when testing similarity.
source_requirements: Original MathGLM tables and training methods, plus model-specific controlled or mechanistic analyses for the representation claim.
