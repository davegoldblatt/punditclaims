explicit_source_elements:
  - Multimodal generative AI that can accept both visual and audio inputs
  - already a feature
  - basically every major Large Language Model
evaluator_interpretation:
  - "Plain reading: when the post went up on 2025-05-27, nearly all of the leading LLMs of the time (OpenAI GPT-4o, Google Gemini, Anthropic Claude, Meta Llama, xAI Grok, DeepSeek) could take both image input and audio or spoken input."
  - "'Basically every' allows one or two minor exceptions. It does not allow several of the leading model families to lack one of the two input types."
  - It is unclear whether 'feature in' an LLM means the model itself takes raw audio (native audio input) or that the company's chatbot product offers voice input, for example by turning speech into text first. Both readings are assessed here.
  - The claim describes an ongoing state with no named period. The target period is the model lineup current at posting, set as 2025-04-01 to 2025-05-27. Llama 4 came out in April 2025 and Claude 4 in May 2025.
support_condition: Evidence that, as of late May 2025, nearly all leading LLMs or their chatbot products accepted both image and audio or voice input.
contradiction_condition: Evidence that, as of late May 2025, several leading LLM families lacked image input or audio input. Examples would be a flagship model documented as text-and-image only, or as text only.
measurement_requirements: Company documentation or launch posts on the input types of each leading model current in spring 2025. Reputable news reports on product voice features may be used.
source_requirements: Primary company announcements or documentation where possible. Reputable tech press for product feature launches.
