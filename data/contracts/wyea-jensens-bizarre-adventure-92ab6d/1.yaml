explicit_source_elements:
  - 20%
  - revenue comes from illicit sales to China
  - its FY 2026 revenues
  - around $43.18 billion
  - I trust Culper’s reporting
evaluator_interpretation:
  - The context identifies NVIDIA and fiscal 2026, rather than current quarterly revenue.
  - The denominator is NVIDIA's total consolidated revenue because Zitron says company revenue and supplies the corresponding dollar estimate.
  - Illicit sales means transactions that violated applicable export restrictions, not merely sales associated with Chinese demand.
  - The accounting basis is estimate because the claim expressly adopts a research firm's allegation.
  - Fiscal 2026 is mapped to January 27, 2025 through January 25, 2026 using NVIDIA's fiscal calendar.
support_condition: A defensible reconciliation shows that approximately 20% of NVIDIA's total fiscal 2026 revenue was attributable to export-violating sales to China.
contradiction_condition: A sufficiently complete reconciliation establishes a materially different share, or establishes that the transactions counted toward the alleged share were lawful.
measurement_requirements: Match recognized NVIDIA revenue to the fiscal year, trace final destinations, establish the applicable restrictions and licenses, and avoid counting entire third-party server purchases as NVIDIA revenue.
source_requirements: Transaction records, financial disclosures and export findings, or independently verifiable estimates connecting those records. Repetition of Culper's allegation is insufficient.
