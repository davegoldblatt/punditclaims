evaluator_interpretation:
  - Read in context, OpenAI was unwilling to restrict all training material to public-domain or individually licensed sources.
  - The payment allegation concerns at least some copyrighted material, rather than an assertion that OpenAI never paid or licensed anyone.
  - Assess stated corporate policy through the latest pre-post public statements in January 2024, using January 1–10 as the observation window. Corporate policy has no quarterly reporting period.
  - Public statements can establish an advocated policy, but cannot directly establish private motives or every payment.
  - This is a qualitative training-policy claim, not a quantified company spending claim.
support_condition: Contemporaneous OpenAI statements advocate continued use of copyrighted training material under a legal rationale that does not require individual paid licences.
contradiction_condition: OpenAI had committed to using exclusively public-domain or appropriately licensed training material and had abandoned reliance on unlicensed copyrighted material.
measurement_requirements: Distinguish an exclusively licensed training policy from selective licensing alongside reliance on fair use.
