horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Huge moat has no stated magnitude or durability threshold.
  - Moat may encompass technology alone or broader advantages such as distribution, capital and brand.
  - Many and practically competitive have no numerical definitions.
