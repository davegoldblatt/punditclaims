assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic and OpenAI have both offered subscriptions
  - impossible to provide at scale
  - at the price and availability
  - leading up to 2026
  - with the intention of growing their revenue
  - to acquire more customers, equity investment and attention
evaluator_interpretation:
  - The claim concerns subscription offers made before 2026. Its starting date is unspecified, so the target period has an open start and ends on December 31, 2025.
  - In context, impossible to provide at scale means unable to sustain delivery economically at substantially the advertised prices and availability as the subscriber base grows.
  - The assertion applies to both companies and includes a separate claim about their purposes in offering those terms.
  - Evidence of tighter limits or losses supports concern about the terms but does not alone establish impossibility.
  - The wording alleges a growth purpose; it does not explicitly require proof that executives knew the offers were impossible when launched.
  - Leading up to 2026 is a time description, not a conditional antecedent.
support_condition: For each company, evidence establishes the relevant pre-2026 offer, shows that its price and availability could not be sustained at scale, and connects the decision to offer those terms to the stated revenue, customer, investment, and attention objectives.
contradiction_condition: Reliable evidence shows that at least one company's relevant offers were economically deliverable at scale on substantially the same terms, or establishes that a material part of the attributed purpose is false.
measurement_requirements: Dated subscription terms, actual availability and usage, subscriber-level revenue and allocated service costs, capacity requirements, and contemporaneous evidence of decision-makers' objectives.
source_requirements: Prefer original offers, company disclosures, internal records made public, and verified financial data. Executive recollections can inform intent but are not conclusive by themselves.
