  - Leading up to 2026 supplies no starting date.
  - At scale has no subscriber or usage threshold.
  - Availability could refer to usage allowances, uptime, or access during peak demand.
  - No accounting basis or cost allocation is specified.
  - The wording does not specify how the several attributed growth objectives were connected.
