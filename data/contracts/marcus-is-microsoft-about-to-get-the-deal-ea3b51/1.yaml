  start: 2022-11-30
  end: 2023-12-31
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Commodities' has no stated measure; it can mean many substitutable suppliers or no performance or price differentiation."
  - "'Quickly becoming' leaves the time window open; we used launch through end of 2023."
  - The IP clause is hedged ('it's not clear').
