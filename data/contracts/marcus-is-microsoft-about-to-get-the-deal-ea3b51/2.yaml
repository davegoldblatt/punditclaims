assessment_axis: historical_observation
explicit_source_elements:
  - large language models themselves
  - quickly becoming commodities
  - it’s not clear
  - any unique, protectable intellectual property here
evaluator_interpretation:
  - The plain reading is a rapid movement toward competing LLMs serving similar needs with less dependence on a particular supplier. It does not require complete interchangeability or the disappearance of frontier performance differences.
  - Use 2022, the most recent completed calendar year before the post, to assess the ongoing industry trend. This observation does not promise an outcome during 2023.
  - Converging task performance, widening practical availability and declining comparable prices are indicators of commoditization. Model counts alone are insufficient; documented customer switching is helpful but not required.
  - Read the IP clause as uncertainty about an exclusive technological advantage that competitors cannot readily reproduce. It is not an assertion that OpenAI owns no intellectual property.
support_condition: Evidence from the target period establishes a substantial movement toward practical substitutes across ordinary LLM uses, through improving comparable capabilities and access or pricing. The qualified IP clause requires assessing what was publicly established about an exclusive, protectable advantage, without demanding proof that no IP existed.
contradiction_condition: Evidence establishes that practical substitutability was stagnant or declining across ordinary uses during the target period. Alternatively, contemporaneous public records clearly establish the exclusive, protectable technological advantage whose existence Marcus questioned. A remaining performance lead or an isolated patent is insufficient by itself.
measurement_requirements: Compare dated models on common tasks, accounting for access restrictions, adaptation requirements and comparable usage costs. Assess change over time rather than treating one performance ranking as a trend.
source_requirements: Prefer contemporaneous independent comparisons, original model papers, vendor release and pricing records, and relevant IP records. Later publications may document earlier facts but cannot establish what was publicly clear in January 2023 merely through later developments.
