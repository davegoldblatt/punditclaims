original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Demand could mean token consumption, paying customers or willingness to pay.
  - Inflated has no stated magnitude or comparison baseline.
  - Subsidized could mean below production cost or merely cheaper than API list prices.
retrospective_or_prospective: retrospective
