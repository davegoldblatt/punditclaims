evaluator_interpretation:
  - The plain factual reading is that Anthropic acquired or used creators' protected works in ways that violated their rights.
  - The statement does not say every work was unlawfully acquired or that every training use infringed copyright.
  - Unauthorized acquisition is assessed separately from whether subsequent model training is fair use.
  - The implied past acquisition and use extend through the post date; no starting date is supplied. This is a claim about conduct already undertaken, rather than a periodic financial observation.
  - Later court records may establish facts about conduct before the post. Settlement alone is not treated as an admission or liability judgment.
support_condition: Reliable records establish pre-post acquisition or use of protected works without authorization that was not legally excused.
contradiction_condition: Reliable records establish that the challenged acquisition and use were authorized or legally permitted, with no substantiated rights violation remaining.
measurement_requirements: Distinguish acquisition, retention, training and output reproduction; identify the works, conduct dates and legal findings.
source_requirements: Court records or comparable primary evidence. Allegations and lack of permission alone are insufficient where fair use may apply.
