explicit_source_elements:
  - These funds will be insufficient to cover Anthropic’s costs
  - as will Anthropic’s cash flow
  - it will have to raise
  - at least another $200 billion
  - in the next year
  - post dated 2026-06-08
evaluator_interpretation:
  - We read 'in the next year' as on or before 2027-06-08.
  - We read 'raise' as new external funding (equity, debt, or IPO proceeds) received or committed in the window. 'Another' means beyond the $95 billion of 2026 rounds named in the preceding sentence.
  - "'Have to raise' includes need as well as raising. Public evidence can show how much was raised. It can show need only through Anthropic's own disclosures."
support_condition: Between 2026-06-08 and 2027-06-08, Anthropic raised at least $200 billion of new external funding, and its disclosures show it needed the money to cover its costs.
contradiction_condition: By 2027-06-08, Anthropic had raised less than $200 billion of new external funding and its disclosures show it could cover its costs.
measurement_requirements: Amounts from Anthropic's filings or announcements, labelled as company disclosures, summed with inputs and rounding shown.
