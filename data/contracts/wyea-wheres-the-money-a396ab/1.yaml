ambiguity_flags:
  - The ongoing-state sentence names no period; calendar 2024 is selected from the surrounding annual financial discussion.
  - Loss per customer could mean attributable customer costs or allocated company-wide costs.
  - The scope includes paying customers generally, while the next sentence specifically concerns subscribers.
  - The burn-rate statement does not separate causation from simultaneous growth in subscribers and spending.
  - Not a real company is rhetorical and has no ordinary financial test.
