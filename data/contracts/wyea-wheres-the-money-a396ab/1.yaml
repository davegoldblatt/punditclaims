assessment_axis: historical_observation
explicit_source_elements:
  - loses money on every single paying customer
  - just like with its free users
  - Increasing paid subscribers also, somehow, increases OpenAI's burn rate
  - This is not a real company
evaluator_interpretation:
  - "Read every single paying customer literally: each customer's attributable costs exceed the revenue received from that customer."
  - Read the subscriber-growth statement as an additional causal assertion that incremental paying subscribers worsen net cash burn, rather than merely increasing gross costs.
  - Use calendar 2024, the latest full annual reporting period underlying the surrounding financial discussion. The sentence itself supplies no period.
  - The plain reading concerns customer economics; dividing company-wide losses equally across customers does not establish it.
  - Treat not a real company as rhetorical judgment, not a separate claim about legal incorporation.
  - The press-estimate accounting basis follows the financial reporting used in the surrounding argument, but no customer-cost allocation method is supplied.
support_condition: Customer-level or exhaustive cohort evidence establishes losses across every paying customer, and incremental-cost evidence shows that adding paid subscribers worsened net cash burn during the target period.
contradiction_condition: Comparable evidence identifies a paying customer or cohort with positive profit after attributable costs, or establishes that additional paid subscribers improved net cash burn. Evidence must cover more than a narrower cost category.
measurement_requirements: Matched customer revenue and attributable service, acquisition, support, and other relevant costs; a defensible treatment of shared costs; and incremental cash-flow analysis separating subscriber effects from research spending and free-user costs.
source_requirements: Customer or cohort financial records, company disclosures, or credible independent reporting with enough cost detail to test the universal and incremental claims. Aggregate company losses alone are insufficient.
metric_scope:
  company: OpenAI
  metric: Profit or loss per paying customer and incremental cash burn from added paid subscribers
  currency: USD
  units: dollars per customer and incremental dollars of cash burn
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
  stock_or_flow: flow
