evaluator_interpretation:
  - Assess Mythos Preview against the public ECI frontier trend represented in Naam's April 8 comparison.
  - Not far off trend means consistent with ordinary variation and measurement uncertainty around the preceding frontier trajectory, rather than a clear departure.
  - Do not impose an arbitrary numerical distance that Marcus did not supply.
  - Broader means coverage across more kinds of capabilities than METR's software-oriented task suite.
  - Anthropic's internal AECI and Epoch's public ECI require a justified conversion before their scores can be compared.
support_condition: Comparable scores and a reproducible historical fit place Mythos Preview near the preceding public ECI frontier trend, and the index covers a broader range of capabilities than METR's suite.
contradiction_condition: Comparable scores place Mythos Preview clearly outside the preceding public trend's ordinary variation and uncertainty, or the claimed broader coverage is absent.
measurement_requirements: Identify the checkpoint, score version, model dates, trend-fitting interval, normalization method, and uncertainty. Do not substitute a cybersecurity-only index or an internal AECI trend for public ECI.
source_requirements: Prefer Epoch's historical data and methodology, together with the underlying calculations for Naam's normalization.
