  - actually have the money to pay for their obligations
  - only been able to keep up
  - low cost of signing contracts
evaluator_interpretation:
  - The ordinary reading concerns each company's ability to fund contractual payments when due, not whether today's cash covers every future payment immediately.
  - Use April–June 2026, the latest completed calendar quarter that could have been reported before publication, for the financial position underlying this ongoing claim.
  - The word 'only' requires evidence that small initial payments were necessary to remaining current, after accounting for financing and operating cash receipts.
  - The passage does not identify an accounting basis for its liquidity comparison.
support_condition: For both companies, matched liquidity and payment schedules show insufficient available funds for obligations as they fall due, and demonstrate that deferred or small initial payments explain their ability to remain current.
contradiction_condition: Matched records show that either company could fund the relevant scheduled obligations, or establish that keeping current did not depend on small initial payments.
measurement_requirements: Separate cash, usable investments, unconditional financing, operating cash receipts, and payment obligations by company and payment date. Do not equate operating losses with cash burn or total multiyear commitments with immediately payable debt.
source_requirements: Financial statements, financing terms, and contractual payment schedules; corroborated reporting where company records are unavailable.
