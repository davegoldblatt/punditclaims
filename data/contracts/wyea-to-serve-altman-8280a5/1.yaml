assessment_axis: forecast_outcome
explicit_source_elements:
  - companies like Etched
  - years from delivering
  - working silicon
  - at the scale that OpenAI would need
evaluator_interpretation:
  - The assessment follows the supplied delivery proposition. The labels iterative and innovative are not delivery criteria.
  - I interpret years as a minimum of two years. The interval therefore tests an asserted minimum delay, not a promise to deliver by its end.
  - OpenAI scale means demonstrated production and deployment capacity adequate for a substantial OpenAI workload. A prototype, first rack or future supply agreement alone is insufficient.
  - At the scale OpenAI would need qualifies the predicted delivery; it is not a conditional antecedent.
  - Etched is the named target. Other specialist suppliers are relevant to the broader wording, but their equivalence must be established.
support_condition: Dated production and delivery records establish that Etched and the relevant comparable suppliers did not deliver working systems at the specified deployment scale within the first two years after the post.
contradiction_condition: Verified delivery within that interval demonstrates working specialist silicon at a scale adequate for a substantial OpenAI workload, from Etched or an established comparable supplier.
measurement_requirements: Shipment dates, quantities, operational capacity, customer deployment and a defensible comparison with OpenAI's workload requirements. Announced future capacity is insufficient.
source_requirements: Prefer supplier and customer disclosures, filings, shipment records and independent operational measurements.
metric_scope: null
original_horizon: years
horizon_interval:
  start: 2024-07-29
  end: 2026-07-29
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A verified qualifying delivery before 2026-07-29 would contradict the minimum-delay reading immediately. A prototype or unfulfilled capacity commitment would not.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Years supplies no exact number; two years is an evaluator-selected minimum.
  - OpenAI's required scale is not quantified.
  - The class of companies like Etched is unspecified.
  - Delivery could mean chips, integrated racks or hosted compute capacity.
