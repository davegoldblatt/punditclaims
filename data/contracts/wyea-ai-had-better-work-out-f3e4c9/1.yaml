explicit_source_elements:
  - price of borrowing for them is skyrocketing
  - ten-year-dated Treasuries stubbornly sitting above 5%
  - overall economics of AI data centers increasingly problematic
  - nobody can seem to measure
  - how much they make
  - how much they cost
evaluator_interpretation:
  - Read the main proposition as a sharp increase in marginal financing costs across multiple AI infrastructure borrowers that increases the difficulty of financing projects profitably.
  - Do not interpret it as saying every borrower faces the same increase or that fixed coupons on outstanding bonds automatically reset.
  - Use October 13–20, 2026 for the current state, based on the surrounding last-week market discussion, with earlier prices as comparison baselines.
  - Read the final wording about measurement as rhetorical concern about uncertain project returns, not a literal assertion that no company reports revenue or costs.
  - Higher expected debt-service costs are an inference from higher market financing rates, not evidence of an already realized increase in every project’s interest expense.
support_condition: Comparable credit measurements show a sharp, multi-borrower increase in required yields or spreads, Treasury yields exceed 5% during the described episode, and evidence links the repricing to concerns about project or customer risk and more expensive prospective financing.
contradiction_condition: Representative comparable financing rates are broadly stable or falling, the Treasury threshold fails during the described episode, or project financing evidence shows that the asserted cost pressure is not occurring.
measurement_requirements: Matched-bond spread and yield comparisons, contemporaneous Treasury yields, and evidence distinguishing prospective financing costs from existing fixed interest obligations.
source_requirements: Prefer official Treasury data and transparent market measurements. Use financial reporting for investor explanations, with sampling and causal limits disclosed.
