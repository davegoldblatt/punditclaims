assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s GPT and Anthropic’s Claude
  - receiving billions in cloud credits
  - to run their extremely-expensive models
  - without having to build out their own infrastructure
evaluator_interpretation:
  - The assessed proposition is dependence on large technology companies' cloud support; welfare recipients is rhetorical.
  - Cloud credits means rights to consume cloud services supplied as funding or support. Cash investment, cloud purchasing obligations and discounts are distinct unless their equivalence is established.
  - The wording may mean billions collectively or billions for each company. Both readings require actual amounts attributable to cloud credits.
  - The observation concerns funding and computing arrangements operating during 2024 through the post date, not credits newly issued only during that interval.
  - The claim gives no accounting basis for the cloud-credit amount. It is therefore unknown.
  - The prevalence aside has no named usage measure and is not treated as a precise market-share ranking.
support_condition: Reliable terms quantify billions of dollars of cloud credits supplied to the named labs and establish material reliance on the providers' infrastructure to train or run their models.
contradiction_condition: Complete comparable terms establish materially less than billions in cloud credits, or establish that the labs did not materially depend on those providers' infrastructure.
measurement_requirements: Separate cash financing, credits granted, credits consumed, discounts and committed cloud purchases. Identify amounts by recipient and provider; do not sum unlike measures.
source_requirements: Investment agreements, cloud-service terms, company disclosures or reliable reporting that identifies the form and amount of support.
