  - if my 2020 article is correct
  - explicit, structured, directly retrievable knowledge
  - time, space, causality, people, places, objects, events
  - You need all that for formal reasoning
evaluator_interpretation:
  - "The plain reading is an architectural necessity claim: a world model needs accessible, structured knowledge of the listed kinds to perform formal reasoning about the world."
  - Formal reasoning means deriving conclusions through specified inference rules. Physical prediction or successful robot control alone does not establish that capability.
  - The parenthetical qualifies his confidence in the thesis. It is not an independently observable forecast condition, and the correctness of his entire 2020 article is not assumed.
  - A narrow mathematical theorem prover would not by itself settle what a general world model requires.
support_condition: A demonstrated necessity result, with assumptions matching the claimed world-model capability, establishes that the specified knowledge and representation are required. Successful examples using that representation alone are insufficient.
contradiction_condition: A documented world model performs valid formal reasoning about the world while demonstrably lacking the stipulated explicit, structured, directly retrievable knowledge.
measurement_requirements: Inspect the architecture and knowledge representation, verify the reasoning outputs, and distinguish formal inference from prediction, planning, and informal explanations.
source_requirements: Public technical descriptions and reproducible reasoning evaluations. The speaker's article can define his thesis but cannot independently establish it.
