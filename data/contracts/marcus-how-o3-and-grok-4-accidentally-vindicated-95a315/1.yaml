assessment_axis: historical_observation
explicit_source_elements:
  - From what I can tell
  - most modern models
  - make heavy use
  - running systems of symbolic rules and training on their outputs
evaluator_interpretation:
  - Most means more than half of the relevant models, not merely several prominent examples.
  - Heavy use means a substantial contribution to training, rather than incidental filtering or preprocessing. Marcus supplies no numerical threshold.
  - The surrounding discussion concerns contemporary generative language and reasoning models. Model-generated text alone does not establish generation by symbolic rules; rule-based verification can establish involvement but does not by itself establish its extent.
  - The target is the model population current on the post date. There is no standard reporting period for this observation, so a point-in-time snapshot is used.
support_condition: Representative training disclosures establish that more than half of contemporary models substantially used augmented training data produced through symbolic rule execution.
contradiction_condition: Representative disclosures establish that half or fewer used such data substantially, or that the purported use was generally incidental.
measurement_requirements: A defined model population, a defensible counting method, and model-level disclosures separating symbolic generation, symbolic verification, and neural generation, with quantities or other evidence of substantial use.
source_requirements: Primary training reports or documented datasets. Selected examples cannot establish prevalence across the population.
