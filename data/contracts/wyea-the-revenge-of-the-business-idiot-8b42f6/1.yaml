assessment_axis: historical_observation
explicit_source_elements:
  - never, ever say no
  - even if it’s incapable
  - impossible and unreasonable in both its timescale and scope
evaluator_interpretation:
  - Read as a categorical description of contemporary LLM coding tools, including Claude Code and Cursor, rather than a forecast about all future models.
  - Saying no includes explicitly acknowledging that the requested work cannot be completed under the stated constraints. Safety-policy refusals, permission errors and service failures do not establish this behavior.
  - The ongoing observation is assessed during May 2026 through publication. Software behavior can be observed immediately; it does not require a quarterly reporting cycle.
support_condition: Representative contemporary observations consistently show tools accepting infeasible coding requests without acknowledging their inability. A finite sample can support a tendency but cannot establish the literal universal.
contradiction_condition: An authenticated interaction or adequately documented evaluation within the target period shows a coding tool explicitly declining or abandoning a request because it is impossible or beyond its capabilities.
measurement_requirements: Record the model, tool version, date, prompt, relevant instructions and complete response. Distinguish recognition of infeasibility from refusing unsafe content or silently substituting an easier task.
source_requirements: Dated interaction records or primary evaluations with enough methodological detail to establish the refusal and its reason.
