assessment_axis: forecast_outcome
explicit_source_elements:
  - regardless of how capable it is at any given task
  - can and will be used
  - replace entire roles
  - or force current workers
  - massive amounts of extra work
  - because they’re “enhanced by AI”
evaluator_interpretation:
  - The plain reading is that employers will eliminate whole positions through AI substitution or substantially increase existing workers' assignments by invoking AI productivity.
  - The word 'or' makes these alternative routes to support; both need not occur.
  - "'Regardless of how capable' is not an antecedent that must happen. It asserts that demonstrated equivalent task quality will not necessarily be required."
  - For the replacement route, require a completed whole-position substitution and evidence that implementation proceeded despite material capability shortcomings.
  - Entire roles means whole jobs at the affected employer, not the disappearance of an occupation everywhere.
support_condition: A documented post-publication employer eliminates whole positions through AI substitution despite material capability shortcomings, or imposes substantially more work on existing staff because of claimed AI assistance without establishing adequate capability.
contradiction_condition: Decisive evidence rules out both predicted practices. Individual successful deployments or employers protecting jobs cannot disprove this forecast without a deadline.
measurement_requirements: Separate eliminated positions from automated tasks. For the workload route, require a substantial change in assigned work and an employer link to AI, rather than worker perceptions alone.
source_requirements: Prefer staffing records and employer statements; use reputable reporting with identified affected workers and documented output defects where primary records are unavailable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when a completed post-publication event establishes either route, including the capability qualification.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or prevalence threshold.
  - Entire roles could mean individual positions or entire occupations.
  - Massive amounts of extra work has no numerical threshold.
  - Regardless of capability could be read more strongly as universal indifference to performance.
  - The two predicted outcomes are joined by or.
retrospective_or_prospective: retrospective
