  - Not every image looks like this
  - after a few minutes experimentation from a friend
  - Bard makes fantastic images
  - drawing from copyrighted sources
  - as capable as the other systems Reid Southen and I looked at
  - derivative artwork that appears to infringe without attribution
evaluator_interpretation:
  - The target is the newly released Bard image generator as observed on February 1, 2024.
  - The ordinary factual reading is that generic prompts could produce recognizable versions of protected characters or artwork without identifying their sources, comparably to the systems previously examined.
  - The comparison concerns demonstrated capability, not an unstated numerical success rate.
  - Drawing from copyrighted sources requires evidence connecting outputs to protected source material. Resemblance alone does not establish the exact training examples or their licensing status.
  - Appears to infringe describes apparent copying, not a final legal finding. Fantastic is an aesthetic judgment and is not independently scored.
support_condition: Authenticated launch-day Bard prompts and complete responses show recognizable protected characters or artwork without source attribution, with source comparisons and independently documented comparable outputs from the referenced systems.
contradiction_condition: Reliable records show that the attributed Bard examples were misidentified or materially misrepresented, or that the claimed source resemblance, missing attribution, or comparable capability was absent. Occasional refusals alone would not contradict the qualified claim.
measurement_requirements: Preserved prompts, complete responses, generation dates, identified source artwork, and comparable demonstrations from the other systems. Any stronger assertion about training provenance requires additional evidence.
source_requirements: Independent contemporary demonstrations or authenticated records. Marcus's own publication cannot establish his claim.
