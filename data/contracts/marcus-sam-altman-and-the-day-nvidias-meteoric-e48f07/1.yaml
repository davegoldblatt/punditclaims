evaluator_interpretation:
  - The context identifies August 7, 2025 as the launch date.
  - The ordinary factual reading concerns broadly advertised PhD-level intellectual assistance across domains.
  - Marcus's wording is treated as a paraphrase, not a verbatim quotation or a claim about physical activities.
  - Wildly overhyped is an evaluative description. The assessable core is the launch comparison and whether GPT-5 delivered the broadly implied expert capability.
  - A meaningful deficit against qualified PhD experts on relevant intellectual tasks counts against across-domain expert parity; occasional errors alone do not.
support_condition: The launch record establishes a broad PhD-level comparison, and evaluations of the launch model establish a relevant domain in which it falls below qualified PhD experts.
contradiction_condition: The launch record materially excludes the alleged broad comparison, or appropriate expert comparisons substantiate the advertised capability in the domains offered as counterexamples.
measurement_requirements: Compare the launch model with qualified experts on the same tasks. Distinguish model variants and test settings; do not equate imperfect accuracy with sub-expert performance.
source_requirements: Launch statements and primary evaluations with human expert baselines. Contemporaneous reporting may establish the spoken statement when a usable primary transcript is unavailable.
