  - LLMs
  - write all code
  - Not really!
evaluator_interpretation:
  - The ordinary practical reading is that current LLM systems cannot reliably complete every programming task correctly without human correction.
  - This does not mean that LLMs cannot produce useful code or complete some projects.
  - The observation concerns capabilities in the current month through the post date, May 1–26, 2026.
  - An alternative reading concerns generating every line at a particular organization. The selected reading concerns the range of programming tasks, not an organization's percentage of generated code.
support_condition: Reproducible evaluations of contemporary leading LLM coding systems identify programming tasks they cannot complete correctly under reasonable specified conditions.
contradiction_condition: Reproducible evidence establishes reliable autonomous completion across the claimed programming scope, including the tasks presented as counterexamples. Success on selected projects alone is insufficient.
measurement_requirements: Executable correctness checks, disclosed tasks and evaluation conditions, and identification of the models and agent software tested.
source_requirements: Prefer original benchmark research with public tasks, code, and evaluation procedures.
