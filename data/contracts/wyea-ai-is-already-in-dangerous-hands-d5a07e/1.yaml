evaluator_interpretation:
  - Assess whether the named reporting and its underlying work had any demonstrated contemporary capability basis, not whether its forecasts ultimately came true.
  - The ordinary reading of 'not based on anything' denies a capability basis across the named strands. A demonstrated basis for one named strand contradicts that blanket denial.
  - Use early 2023 through publication, encompassing the early-GPT-4 reference and subsequent reporting.
  - Do not equate simulated blackmail with deployed blackmail, or substitute Claude results for an unidentified early-GPT-4 story.
support_condition: The identified reporting and underlying analyses lack demonstrated contemporary LLM capabilities relevant to their claims.
contradiction_condition: At least one named strand explicitly relies on measured contemporary LLM capabilities, even if its extrapolation remains speculative.
measurement_requirements: Trace a named strand to its underlying evidence. Separate task performance from employment effects, and controlled demonstrations from real-world incidents.
source_requirements: The underlying forecast or reporting plus primary capability measurements. Later capabilities cannot establish what an earlier story was based on.
