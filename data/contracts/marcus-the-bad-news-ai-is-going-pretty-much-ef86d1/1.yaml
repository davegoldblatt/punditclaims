assessment_axis: forecast_outcome
explicit_source_elements:
  - coding would disappear soon
  - is bullshit
  - this prediction from Anthropic CEO Dario Amodei back in March
evaluator_interpretation:
  - The plain reading is that substantial human code writing will continue in the near term despite AI automation.
  - Disappearance concerns human code writing across software development, not merely a high AI-generated share at selected companies.
  - The referenced March forecast provides context, but Marcus does not explicitly adopt either its six-month or twelve-month endpoint.
  - Soon supplies no latest defensible calendar day. I therefore leave the horizon open rather than silently imposing October 2026 or a one-year deadline.
support_condition: Evidence that substantial human code writing persists through an endpoint established for soon. Without that endpoint, continued coding supports persistence but cannot conclusively close the forecast.
contradiction_condition: Broad evidence that AI has eliminated substantial human code writing within an interval clearly covered by the claim's near-term language.
measurement_requirements: Measure actual human coding or representative code authorship. Developer employment, AI adoption, and company-specific code shares are informative but not interchangeable.
source_requirements: Representative developer surveys, repository measurements, and employment evidence, with fieldwork dates separated from publication dates.
metric_scope: null
original_horizon: soon
horizon_interval:
  start: 2025-09-05
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, economy-wide disappearance of substantial human code writing demonstrably caused by AI during the clearly near-term interval would contradict the claim. Local automation and continued employment alone do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Soon has no fixed deadline.
  - The contextual March prediction contains both six-month and twelve-month horizons.
  - Coding may mean writing code or the broader software-development occupation.
  - Disappearance has no numerical threshold.
retrospective_or_prospective: retrospective
