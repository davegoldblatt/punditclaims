evaluator_interpretation:
  - The ordinary reading is that NVIDIA's interventions enabled additional AI spending beyond what would otherwise have occurred.
  - The claim concerns interventions before publication; it supplies no starting date.
  - No numerical effect, accounting basis, or common spending measure is specified. Individual financing arrangements can establish a mechanism without establishing the claimed industry-wide effect.
support_condition: Records connect NVIDIA's interventions to financing and purchases that would otherwise have been smaller, delayed, or unavailable, with evidence sufficient to establish a broader increase in AI spending.
contradiction_condition: Evidence shows that the interventions did not increase AI spending overall, for example because they merely replaced available funding or shifted existing spending without increasing it.
measurement_requirements: Separate completed investments and purchases from announced intentions, guarantees, financing capacity, and future commitments. Establish additional spending rather than count transfers repeatedly.
source_requirements: Executed agreements, lender or recipient disclosures, spending records, and credible analysis of the financing dependency and broader effect.
