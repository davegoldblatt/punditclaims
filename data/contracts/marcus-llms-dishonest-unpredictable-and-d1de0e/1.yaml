assessment_axis: historical_observation
explicit_source_elements:
  - Few people want to fund such a thing
  - different architectures that can actually obey our instructions
  - the immediate money lies in LLMs
evaluator_interpretation:
  - The ordinary reading is that investor appetite for more controllable alternatives to LLMs was scarce relative to appetite for LLM businesses.
  - The target is current investor appetite in June 2025 through publication. Earlier financing records provide background rather than direct measurement of that month's appetite.
  - Alternative architectures must be aimed at improving controllability or instruction adherence; all non-LLM AI investment cannot automatically be counted.
  - Funding announcements are proxies for willingness to invest. They do not measure immediate commercial returns.
  - This is an industry-level claim about investor interest, not a specified company's financial metric.
support_condition: Representative contemporaneous investment records and investor evidence show scarce interest in qualifying alternative architectures relative to LLMs, with evidence for the stated commercial incentive.
contradiction_condition: Representative evidence shows broad investor appetite for qualifying alternatives, rather than merely a few funded exceptions.
measurement_requirements: A consistent architecture classification, investor or deal counts with a denominator, comparable periods, and separate evidence about commercial returns. Dollar totals alone cannot measure how many people want to invest.
source_requirements: Investment disclosures, representative funding datasets, and direct investor statements. Individual announcements cannot establish market-wide scarcity or prevalence.
