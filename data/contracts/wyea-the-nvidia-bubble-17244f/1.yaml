explicit_source_elements:
  - 11% of Microsoft’s total revenues
  - Q1 Fiscal Year 2026
  - Microsoft’s overall revenues are in decline
  - AI revenues aren’t filling the gap outside of an AI lab
  - lost $10.9 billion in Q3 2026
  - raised only $11 billion of the $30 billion it wanted
  - $1.25 trillion
  - lower than expected
evaluator_interpretation:
  - Preserve the stated fiscal year; do not silently substitute FY2027.
  - Read overall revenue decline as a decline in revenue level, ordinarily year over year.
  - For the ongoing revenue assertion, use the latest reportable quarter before publication, July–September 2026.
  - Read the unqualified loss as net loss unless its source establishes another basis.
  - Read raised as funding completed by publication, distinguishing money received from promised later tranches.
  - The single metric_scope records the financing component. Revenue share, revenue trend, loss and valuation require separate measurements and cannot be treated as one financial metric.
  - Suggests expresses an inference, not a conditional forecast.
support_condition: Separate, period-matched records substantiate the revenue share, decline, non-OpenAI AI revenue gap, loss, completed financing, target and valuation comparison.
contradiction_condition: Matched records materially refute a stated component; a mixed assessment requires independently established supporting and contradicting components.
measurement_requirements: Keep Microsoft fiscal periods separate from calendar quarters; distinguish total revenue, customer revenue, net loss, operating loss, financing received and valuation.
source_requirements: Microsoft filings and company disclosures; OpenAI financial or financing records, or clearly attributed reputable reporting where those records are unavailable.
