explicit_source_elements:
  - 11% of Microsoft’s total revenues
  - Q1 Fiscal Year 2026
  - which suggests
  - lost $10.9 billion in Q3 2026
  - raised only $11 billion of the $30 billion it wanted
  - at $1.25 trillion
  - lower than expected
evaluator_interpretation:
  - The firm assertions concern the revenue share, loss, funding amount, funding target and valuation.
  - The words 'which suggests' make the Microsoft revenue-decline and AI-shortfall statements tentative inferences. They are discussed but are not converted into firm assertions or required to be proved for support.
  - Q1 FY2026 is retained as written. It is not silently changed to Q1 FY2027.
  - Q3 2026 for OpenAI is read as July–September 2026 because no fiscal calendar is supplied.
  - The funding statement concerns the amount raised by publication, not a claim that the round had permanently closed at $11 billion.
  - "The target-period envelope contains separate subperiods: Microsoft's named fiscal quarter, OpenAI's third calendar quarter of 2026, and its latest financing through November 17. Evidence must match the relevant subperiod."
  - The structured metric_scope records the leading Microsoft revenue-share assertion. OpenAI loss, financing and valuation are separate metrics, recorded on their evidence items rather than treated as interchangeable.
  - The supplied sentence does not identify the accounting basis or source of the financial figures. An operating-loss report cannot automatically establish an unspecified net loss.
support_condition: Matched-period evidence establishes the approximately 11% Microsoft revenue share in Q1 FY2026, the specified OpenAI quarterly loss on a matching basis, and approximately $11 billion raised toward an original $30 billion goal at a $1.25 trillion valuation below the earlier target. The tentative Microsoft inference is not scored as a firm assertion.
contradiction_condition: Matched-company, matched-period and matched-basis evidence materially disproves one or more firm numerical assertions. Evidence from Q1 FY2027 alone cannot disprove a Q1 FY2026 revenue share.
measurement_requirements: Keep fiscal and calendar quarters separate. Distinguish recognized revenue from revenue share payments alone; operating loss from net loss; funding received from commitments; and valuation from cash raised.
source_requirements: Prefer Microsoft's filings and OpenAI disclosures. Where private-company records are unavailable, identify attributed press reporting and its limitations.
