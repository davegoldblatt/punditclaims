evaluator_interpretation:
  - The ordinary reading is substantial practical assistance to human-led scientific work, through saved effort or expanded research capabilities.
  - The analogy does not commit to matching a measured historical productivity gain from calculators or databases.
  - The sentence states no deadline and does not explicitly restrict assistance to systems built in 2026–2027.
  - Substantial benefits across documented research uses can settle this broad claim without proving gains for every scientist or field.
support_condition: Credible workflow evidence and documented scientific applications establish substantial practical gains for human scientists from AI assistance.
contradiction_condition: Broad, reliable evidence establishes that AI assistance provides no material practical gains across scientific work. Individual failures alone are insufficient.
measurement_requirements: Distinguish actual research assistance from benchmark scores, adoption alone, and autonomous-scientist demonstrations. Identify self-reported gains and limits on causal inference.
source_requirements: Primary research studies and documented scientific results, preferably from different research teams.
