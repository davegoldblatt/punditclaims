assessment_axis: forecast_outcome
explicit_source_elements:
  - even if it does
  - burns billions and billions of dollars a year
  - will die without continual funding
evaluator_interpretation:
  - Assess the normalized prediction about survival without continuing outside funding. The separate year-end conversion prediction is outside this claim.
  - ‘Die’ means cease operating as a going concern because it cannot finance its obligations.
  - ‘Without continual funding’ means outside financing actually ceases, not merely that financing becomes expensive or the company continues losing money.
  - Conversion does not itself trigger the survival test. ‘Even if’ says conversion would not remove the claimed dependence.
support_condition: After outside financing ceases, OpenAI exhausts its available resources and ceases operating because it cannot fund its obligations.
contradiction_condition: After outside financing ceases, OpenAI demonstrably becomes self-financing and continues operating without replacement outside financing. Survival for a short period on previously raised cash is insufficient.
measurement_requirements: Establish financing cessation, available cash, operating cash flows, and the reason for any failure. Distinguish cash burn from accounting losses.
source_requirements: Company or investor disclosures, financial records, or credible reporting documenting financing cessation and the subsequent operating outcome.
