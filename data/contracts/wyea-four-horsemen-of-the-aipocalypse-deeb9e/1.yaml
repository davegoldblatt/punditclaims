ambiguity_flags:
  - Years' worth has no specified deployment or sales baseline.
  - Selling may mean accepting orders, shipping products or recognizing revenue.
  - The custodian and ownership of warehoused GPUs are unspecified.
  - The target period uses the latest publicly reported quarter before the post.
  - The wording can imply either years of supply or a multi-year installation delay.
