assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA Is Selling Years’ Worth of GPUs In Advance
  - And Warehousing Them
evaluator_interpretation:
  - The ordinary reading is that a substantial quantity of sold AI GPUs, equivalent to multiple years of deployment, is physically stored because usable installation capacity is unavailable.
  - Future orders or sales visibility alone do not establish that the corresponding GPUs have been manufactured, sold and warehoused.
  - "For this ongoing inventory and sales statement, use NVIDIA's latest publicly reported quarter before the post: fiscal Q4 2026, ending January 25, 2026."
  - The claim is tested as a physical shipment, storage and installation assertion. The surrounding dollar calculations are not treated as a separate revenue claim.
  - Storage may occur at NVIDIA, manufacturers, distributors or customers; the wording and context do not clearly identify the custodian.
support_condition: Matched shipment, ownership, warehouse and deployment records show a substantial stock of sold NVIDIA AI GPUs awaiting usable facilities, with a quantified scale equivalent to multiple years of deployment.
contradiction_condition: A sufficiently comprehensive reconciliation shows that the alleged stock largely consisted of unmanufactured future orders, or that sold GPUs were deployed or awaiting only ordinary delivery intervals rather than accumulating at the claimed scale.
measurement_requirements: GPU units and models, sale and shipment dates, inventory ownership and location, installation dates, available facility capacity, and an explicit baseline for measuring years of supply.
source_requirements: NVIDIA, manufacturer and customer records reconciled across the supply chain. NVIDIA's own inventory balance or an isolated storage anecdote is insufficient.
