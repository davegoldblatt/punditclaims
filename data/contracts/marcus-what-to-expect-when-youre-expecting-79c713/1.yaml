explicit_source_elements:
  - not be trustworthy and complete enough
  - give reliable medical advice
  - despite devouring a large fraction of the Internet
evaluator_interpretation:
  - The ordinary reading is that released GPT-4 cannot safely serve as an independent source of medical advice across clinical situations.
  - This does not mean GPT-4 cannot provide any correct advice or assist a clinician.
  - Despite its Internet training is explanatory emphasis, not an antecedent that must occur before the prediction applies.
  - Reliability is assessed through consequential errors and omissions requiring professional checking; Marcus supplies no numerical safety threshold.
support_condition: Clinical evaluations find consequential errors or omissions that make reliance on GPT-4 alone unsafe for general medical guidance.
contradiction_condition: Broad clinical validation establishes sufficiently accurate, complete, and safe independent medical guidance across the intended range of medical situations.
measurement_requirements: Evaluate GPT-4 medical recommendations for accuracy, completeness, and potential harm, using qualified clinicians and clinically relevant cases.
source_requirements: Primary clinical evaluations; examination scores alone cannot establish safe independent medical advice.
