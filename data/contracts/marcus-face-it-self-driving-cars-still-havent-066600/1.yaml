evaluator_interpretation:
  - The central causal claim is that increased actual robotaxi operations following the August 10 approval caused material traffic disruption in San Francisco.
  - Read chaos as observable traffic obstruction and service disruption, without requiring citywide breakdown.
  - The human-nanny language refers to onboard or remote human support described in the preceding paragraph.
  - Use August 10–19, 2023, from the approval discussed in the post through publication.
support_condition: Records establish an actual increase in operations and connect that increase to the reported disruptions, alongside evidence of continuing difficulties and human support.
contradiction_condition: Records show that the alleged operational increase did not occur, or establish that the claimed causal connection was false.
measurement_requirements: Separate permission to expand from actual additional vehicles, hours, or trips. Establish a causal mechanism or a suitable comparison rather than relying only on events following approval.
