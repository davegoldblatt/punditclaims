explicit_source_elements:
  - Southen's experiment
  - shows that a user of Midjourney
  - could easily
  - inadvertently
  - infringe on copyright
evaluator_interpretation:
  - "Read as a claim about what Southen's December 2023 tests of Midjourney v6 showed: that an ordinary user, without trying to copy a protected work, could easily get output that infringes copyright."
  - "Three parts must hold: (a) near-copies were easy to get; (b) a user could get them without meaning to; (c) the outputs would infringe copyright. Part (c) is a legal question."
support_condition: Records of the tests show that prompts which did not ask for a specific copyrighted work still produced near-copies of protected film frames, or a court or other authoritative body found that such outputs infringe.
contradiction_condition: Records show that the near-copies came only from prompts that named the specific film, actor, or scene, so the tests showed deliberate rather than accidental reproduction. Or an authority found such outputs non-infringing.
measurement_requirements: Documented prompts and outputs from Southen's December 2023 tests, plus any legal finding on whether such outputs infringe.
source_requirements: Contemporaneous reporting on the prompts, independent research, or court rulings. The speaker's own later writing (such as his IEEE Spectrum article co-written with Southen) is excluded.
