ambiguity_flags:
  - "'Inadvertently' is unclear: a user who types a film's name and asks for a 'movie scene' may not mean to copy a real frame, yet still asked for that film."
  - Whether these outputs legally 'infringe' has not been decided by any court found.
  - "'Could' makes this a claim about what is possible, not about what actually happened."
