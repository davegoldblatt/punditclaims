  - Even so-called 'thinking' AI models
  - are vulnerable to this
  - "this = LLM grooming: swarms flooding the web with duplicative, crawler-targeted content to poison training data"
evaluator_interpretation:
  - "Plain reading: as of the post, reasoning ('thinking') models had been shown to absorb or repeat narratives seeded through web-scale data poisoning or LLM grooming, or to be meaningfully vulnerable to it."
  - Lab backdoor attacks on reasoning fine-tuning datasets are related but are not the same as web-scale grooming by swarms. They count as context unless they test that route.
  - The claim is present tense, so the period covers the months before the post.
support_condition: An audit or study tests reasoning or 'thinking' models (for example o-series, extended-thinking, or DeepSeek-R1 modes) and finds they repeat or absorb narratives seeded through LLM grooming or web-scale data poisoning.
contradiction_condition: Audits of reasoning models find they reliably resist narratives seeded through grooming, or studies show reasoning models are robust to this kind of poisoning.
measurement_requirements: Rates at which reasoning models repeat or cite seeded narratives, or attack success rates for poisoning reasoning models through web-crawled data.
source_requirements: Independent audits, peer-reviewed papers or preprints, or vendor disclosures that name reasoning models.
