explicit_source_elements:
  - A few days ago
  - $1.4 trillion in obligations
  - a mere $13 billion in revenue
evaluator_interpretation:
  - Assess the financial comparison, not the description of Altman's emotions.
  - The reference period is the late-October interview and the days immediately preceding the post.
  - Obligations means announced multiyear infrastructure commitments, not necessarily recognized debt or expenditure already incurred.
  - The revenue figure lacks a reporting period and does not distinguish realized revenue, a full-year projection, or an annualized run rate. These measures cannot be substituted for one another.
  - The single contract metric_scope describes the revenue denominator. The commitments component has a separate scope in its evidence item.
support_condition: Contemporaneous records establish approximately $1.4 trillion in infrastructure commitments and approximately $13 billion in revenue on an identifiable, consistent reporting basis.
contradiction_condition: Comparable records establish a materially different commitments total or revenue figure for the period and measure actually asserted.
measurement_requirements: Identify the revenue period and whether it is realized, projected, or annualized. Distinguish infrastructure commitments from debt, partner investment, and completed expenditure.
source_requirements: Company disclosures or reliable reporting of the underlying financial records and commitments.
