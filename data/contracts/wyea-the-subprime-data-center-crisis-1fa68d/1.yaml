assessment_axis: forecast_outcome
explicit_source_elements:
  - the vast majority of AI data centers
  - will collapse
  - when they face the cold, harsh reality of “someone actually paying money for AI compute,”
  - This is an inevitability
evaluator_interpretation:
  - The plain reading is a forecast of widespread financial failure caused by insufficient paying demand for AI compute. The subprime comparison describes the proposed mechanism, not a separate numerical claim.
  - Collapse means default, insolvency, permanent closure, or abandonment because compute receipts cannot support the project's obligations. Share-price declines, construction delays, write-downs, and ordinary acquisitions alone do not qualify.
  - Vast majority means an overwhelming share of projects, substantially more than half. No precise percentage is supplied, so borderline findings would remain unresolved.
  - The working population is AI data centers operating or being developed when the post appeared, across owners and countries. Counting projects rather than companies or megawatts is an evaluator interpretation.
  - The payment condition means projects have reached the stage when actual compute receipts must sustain their financial obligations. Evidence that individual operators have customers does not establish that this test has occurred across the claimed population.
  - The nearby reference to four years concerns operating-expense expectations; it does not clearly give this collapse forecast a deadline.
support_condition: Records establish that an overwhelming share of the relevant AI data-center projects defaulted, became insolvent, permanently closed, or were abandoned after reaching the payment test, with inadequate paying compute demand materially causing those failures.
contradiction_condition: Completed project and financing records establish that enough of the relevant population passed the payment test and completed their financial obligations without collapse to rule out failure of a vast majority. Continued operation at an interim date is insufficient.
measurement_requirements: A documented project population and denominator; project-level operating dates, customer receipts, obligations, defaults and closures; and evidence distinguishing inadequate demand from permitting, power, construction, or other causes.
source_requirements: Prefer court and insolvency records, lender disclosures, audited operator accounts, and independently documented project records. Forecasts and market-price changes cannot establish completed failures.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon dated records establishing qualifying failures across an overwhelming share of the relevant population, or completed financial outcomes that make that share impossible. Individual failures or temporary survival cannot settle the forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical definition of vast majority.
  - No defined project population, geography, or counting unit.
  - Collapse is not explicitly defined.
  - The payment trigger could mean beginning commercial service or becoming dependent on receipts rather than continued financing. That distinction affects whether the condition is already met.
retrospective_or_prospective: retrospective
