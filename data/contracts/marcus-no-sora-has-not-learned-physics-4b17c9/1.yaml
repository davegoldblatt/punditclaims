explicit_source_elements:
  - precisely because Sora is not a physics engine
  - a large fraction of Sora's videos
  - inconsistent with physics or biology
  - in very basic ways
evaluator_interpretation:
  - The target is the original Sora preview discussed in the post.
  - A large fraction means a substantial share of representative outputs, beyond isolated failures. The speaker gives no numerical cutoff.
  - Basic inconsistencies include unintended violations of object continuity, ordinary physical interactions, or anatomical structure.
  - The claim requires evidence of both prevalence and causation. A collection of failures does not establish either the population rate or its cause.
  - The target period is the public preview through the post date because no separate observation window is stated.
support_condition: A representative evaluation finds a substantial share of basic physical or biological failures in the original Sora, and controlled evidence attributes those failures to the absence of physics-engine computation.
contradiction_condition: A representative evaluation finds only isolated basic failures, or controlled evidence rejects the claimed causal explanation.
measurement_requirements: Specify the original model, sampling procedure, prompts, denominator, error definitions, and uncertainty. Separate intended impossible scenes from unintended failures. Test causation while controlling other material differences.
source_requirements: Representative original-Sora evaluations and controlled comparisons or equivalent causal evidence. Curated demonstrations and later-model benchmarks cannot settle the entire claim.
