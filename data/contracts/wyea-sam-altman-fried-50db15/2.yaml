explicit_source_elements:
  - '"In plain English, this means"'
  - '"generative AI is being shoved into plenty of places"'
  - "\"it doesn't seem to be generating organizations money\""
  - "based on a McKinsey August 2023 survey: 55% adopted AI, 23% said more than 5% of EBIT came from AI, similar to 2022"
evaluator_interpretation:
  - The sentence is the speaker's own gloss on survey figures he just quoted ('this means'). It is hedged ('doesn't seem'). It names no metric, no threshold for 'generating money', no set of organizations, and no period.
  - Turning it into a scored claim would mean supplying the metric (EBIT share? profit? revenue?), the population, the period and a cutoff for how many organizations must profit. The speaker gave none of these. Earlier drafts were found unfair for doing exactly that.
  - Checking only whether the McKinsey figures exist would test the cited data, not this sentence, which is an interpretation of that data.
  - So the claim is treated as a hedged interpretation that cannot be scored true or false.
support_condition: Not scorable. A scored version would need the speaker to name a measure and threshold, for example that most adopting organizations reported no measurable earnings gain from generative AI in 2023. He did not.
contradiction_condition: Not scorable for the same reason. No stated measure or threshold exists for evidence to contradict.
