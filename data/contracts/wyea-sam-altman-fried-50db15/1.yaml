ambiguity_flags:
  - "'Doesn't seem' qualifies the conclusion."
  - "'Generating money' could mean revenue, earnings, or cost savings; the surrounding EBIT discussion guides this reading."
  - No prevalence threshold defines the claim about organizations generally.
  - The 2023 survey-year target is an evaluator choice for an ongoing state grounded in the report named in context.
  - Survey-year adoption and retrospective earnings figures describe different periods.
  - The cited AI-wide statistics do not isolate generative AI.
