assessment_axis: historical_observation
explicit_source_elements:
  - generative AI
  - being shoved into plenty of places
  - doesn't seem to be generating organizations money
  - A McKinsey report from August 2023
  - 23% of said respondents
  - more than 5% of their Earnings Before Interest (EBIT)
evaluator_interpretation:
  - The sentence makes a tentative empirical inference, rather than an unconditional claim that no organization earned any money.
  - The surrounding EBIT discussion suggests realized organization-wide earnings contributions, rather than vendor revenue, financing, or projected productivity.
  - The ordinary reading is that adoption has not yet produced broadly demonstrated earnings gains.
  - The target is the 2023 state invoked by the cited survey, the latest annual survey context named before the post. Its retrospective figures about 2022 are context, not measurements of 2023 generative AI earnings.
support_condition: Representative evidence specific to generative AI shows that realized organization-wide earnings contributions were absent or uncommon during the target period.
contradiction_condition: Representative evidence specific to generative AI shows broadly realized organization-wide earnings contributions during the target period.
measurement_requirements: Distinguish generative AI from other AI; adoption from earnings; function-level revenue or cost changes from organization-wide EBIT; and modest positive contributions from contributions exceeding 5%.
source_requirements: Survey methodology and reported historical results, or comparable financial records. Forecast benefits and later-period outcomes are insufficient.
