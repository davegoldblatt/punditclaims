explicit_source_elements:
  - artificial intelligence companies
  - are running out of data
  - high-quality text-based data
evaluator_interpretation:
  - The surrounding discussion narrows data to usable, human-generated training text for frontier models.
  - The plain reading is that training requirements were approaching the available supply, not that companies had already exhausted it.
  - The observation concerns the current situation in the week of publication, April 1–4, 2024. Unlike company earnings, this research question has no standard reporting quarter.
  - The quoted researchers' two-year estimate is context, not a deadline independently adopted by Zitron.
support_condition: Contemporaneous measurements or well-supported estimates establish that frontier training requirements were approaching the available stock of usable text.
contradiction_condition: Comparable measurements establish substantial remaining usable text relative to training requirements, undermining the claim of approaching exhaustion.
measurement_requirements: Compare usable text supply and training requirements using consistent quality filters, token counts, access assumptions and treatment of repeated data.
source_requirements: Prefer research estimates and documented laboratory practices. Reports of concern alone do not establish actual exhaustion.
