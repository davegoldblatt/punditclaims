explicit_source_elements:
  - no industry can thrive
  - if the government appears arbitrary and capricious
  - as they did last night
  - (effectively) abruptly shutting down an entire thriving industry
  - appearing very selective and reactive
evaluator_interpretation:
  - In context, the effective shutdown concerns Fable, Mythos, and activity dependent on them. It is not a literal assertion that every US AI company stopped operating.
  - The sentence combines an operational event with a universal causal maxim and judgments about governmental conduct.
  - No ordinary, sufficiently stable measure of thrive or appearing arbitrary is supplied. Selecting revenue, investment, service availability, or another measure would materially rewrite the causal claim.
  - The June 12 suspension can be checked as context, but cannot settle the whole sentence.
support_condition: No fair binary support condition exists for the whole claim without adding a measure of thriving, an exposure period, and a standard for apparent arbitrariness.
contradiction_condition: No fair binary contradiction condition exists for the whole claim. Continued operation of unrelated AI services would not refute the contextual effective-shutdown language.
measurement_requirements: null
source_requirements: Company disclosures and government records can establish the operational suspension, but cannot supply the missing causal criteria.
