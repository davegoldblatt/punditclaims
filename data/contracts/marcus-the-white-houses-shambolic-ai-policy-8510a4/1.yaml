assessment_axis: causal_assessment
explicit_source_elements:
  - no industry can thrive
  - if the government appears arbitrary and capricious
  - as they did last night
  - (effectively) abruptly shutting down an entire thriving industry
  - very selective and reactive
evaluator_interpretation:
  - Last night identifies the June 12, 2026 directive.
  - The surrounding reference to the US AI industry supplies the ordinary scope of entire industry.
  - Effectively shutting down an industry means stopping its ordinary operations across providers, including through indirect effects.
  - The concrete shutdown allegation can be tested separately from the broader causal generalization. A materially false shutdown allegation contradicts that part of the compound claim.
support_condition: Operational records show an effective industry-wide shutdown caused by the directive, and credible comparative evidence supports the claimed incompatibility between arbitrary government action and industry prosperity.
contradiction_condition: Contemporaneous records establish that substantial AI operations remained available, refuting the entire-industry shutdown; alternatively, adequately defined comparative evidence refutes the universal causal assertion.
measurement_requirements: Measure operational availability across the industry. Distinguish loss of two models from cessation of industry activity.
source_requirements: The directive, contemporaneous service disclosures, and operational records. Comparative evidence would be needed to adjudicate the broader causal generalization.
