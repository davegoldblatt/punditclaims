assessment_axis: forecast_outcome
explicit_source_elements:
  - Some will cost lives
  - some will cost many lives
  - AI-triggered mistakes
evaluator_interpretation:
  - The forecast concerns military AI errors causing deaths after March 1, 2026.
  - Both fatal errors and errors causing clearly large losses of life must be established to support the whole claim.
  - Many lives has no supplied numerical threshold. A small number of deaths alone cannot establish the larger casualty component.
  - "AI assistance in a lethal operation is insufficient by itself: an AI error must have contributed to the deaths."
support_condition: Credible investigations establish postpublication military AI mistakes causing deaths, including at least one incident with clearly numerous fatalities.
contradiction_condition: Conclusive evidence rules out the predicted events over the forecast's entire scope. A finite period without a confirmed incident cannot contradict this undated forecast.
measurement_requirements: Establish incident dates, fatalities, the AI system's role, the specific error and its causal contribution. Separate technical errors from deliberate targeting and human casualty-tolerance decisions.
source_requirements: Public investigations, forensic records or credible investigative reporting with attributable evidence. Official acknowledgment is useful but is not mandatory.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when dated postpublication evidence establishes both fatal military AI errors and at least one clearly large fatality incident caused by such an error. Earlier incidents and allegations alone do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Many lives has no numerical threshold.
  - The boundary between an AI error, an ordinary equipment failure and human misuse requires causal investigation.
retrospective_or_prospective: retrospective
