assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic and OpenAI
  - now make up 50% of all upcoming hyperscaler revenues
  - the only way either of them can pay is if somebody, either a venture capitalist or hyperscaler, chooses to give them the money
  - neither of whom have any path to sustainability or profitability outside of accounting shenanigans and willing co-conspirators
evaluator_interpretation:
  - "'Upcoming hyperscaler revenues' is read as the contracted revenue backlog (remaining performance obligations) of the major cloud providers."
  - "'Now' is the state as of the post (May 26, 2026). The latest backlog disclosures came with Q1 results in late April, and press analysis of them followed in May. Pre-publication May figures count."
  - "'50%' is read as roughly half; 'more than half' meets it."
  - "'No path to profitability outside of accounting shenanigans and willing co-conspirators' builds in exceptions that cannot be tested, since any profit or funder can be labeled one of them. It is a judgment about prospects and is not scored as decisive. 'The only way either can pay' is about how future commitments will be funded and is treated as context."
support_condition: Reliable reporting from around the post date shows OpenAI and Anthropic together account for about half or more of major hyperscalers' contracted backlog.
contradiction_condition: Reliable reporting from around the post date shows their combined share is well below half (for example, under 40%).
measurement_requirements: Combined OpenAI and Anthropic share of the contracted backlog at Microsoft, Alphabet, Amazon and Oracle, as of the latest disclosures before May 26, 2026.
source_requirements: Hyperscaler disclosures, or reputable news and analyst reports estimating the share.
metric_scope:
