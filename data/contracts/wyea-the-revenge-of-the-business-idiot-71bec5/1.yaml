explicit_source_elements:
  - neither of whom have any path to sustainability or profitability
  - outside of accounting shenanigans and willing co-conspirators
  - 50% of all upcoming hyperscaler revenues
  - the only way either of them can pay
  - a venture capitalist or hyperscaler
evaluator_interpretation:
  - The post elsewhere identifies revenue backlog. I therefore provisionally read upcoming revenues as contracted cloud revenue backlog, not all revenue hyperscalers will eventually earn.
  - For the ongoing financial observation, use Q1 2026, the latest completed calendar quarter before publication. Subsequent contract announcements provide context, not a matched quarterly measurement.
  - Read 50% as approximately half, rather than an exact percentage.
  - Read no path as a claim about feasible business plans at publication, not merely current losses or an indefinite prediction of eventual failure.
  - Outside funding must be necessary to meet obligations, rather than simply having been received. The accounting and co-conspirator language does not specify an accounting standard or a test for improper conduct.
support_condition: A consistently defined aggregate backlog shows approximately half attributable to the two companies, and comparable financial records establish that neither can meet its obligations or reach sustainable profitability through a feasible operating plan without the excluded financing or accounting practices.
contradiction_condition: Comparable records show a materially different backlog share, or establish that either company can fund its obligations and achieve sustainable profitability without the excluded practices.
measurement_requirements: Matched reporting dates, a defined hyperscaler population, customer-specific backlog amounts, and complete cash-flow and payment schedules. Distinguish contracted backlog from realized revenue and financing from customer receipts.
source_requirements: Prefer hyperscaler filings and company financial records. Identify press estimates as estimates. Fundraising announcements alone cannot establish financing necessity.
