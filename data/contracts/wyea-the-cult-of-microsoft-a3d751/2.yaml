explicit_source_elements:
  - the difference between an AI model creating a class declaration, or an IDE doing it is minimal
  - You've substituted one tool for another, but the outcome is the same
  - even before generative AI was a thing, developers were using autocomplete
evaluator_interpretation:
  - "Plain reading: for routine boilerplate such as a class declaration, the code an AI assistant produces is functionally about the same as what a standard IDE's code generation produces for the same request."
  - It is a general claim about tools at the time of writing. I take the target period as 2024 up to the post date, which is flagged as an ambiguity.
  - It does not claim AI and IDE tools are the same for complex code.
support_condition: Matched comparisons, documentation or studies show that for the same routine class declaration, AI assistants and IDE code generation produce essentially the same functional result.
contradiction_condition: Matched comparisons or studies show AI-generated class declarations differ materially from IDE-generated ones (for example, much more complete, or wrong more often) for the same requirement.
measurement_requirements: A comparison of AI-generated and IDE-generated class declarations for the same requirement, judged on functional output.
source_requirements: Benchmarks, peer-reviewed or preprint studies, or vendor documentation with matched outputs.
