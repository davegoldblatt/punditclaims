ambiguity_flags:
  - Completed investments versus commitments and investment rights
  - Six years versus a fiscal-year schedule ending with an open-ended bucket
  - Direct product purchases versus deployment through cloud intermediaries
  - Circular financing can describe reciprocal commerce without establishing improper accounting
  - Historical superlative has no objective measure
  - Observation period includes post-quarter announcements named in the claim
