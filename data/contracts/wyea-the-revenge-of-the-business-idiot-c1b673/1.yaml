assessment_axis: historical_observation
explicit_source_elements:
  - investing tens of billions of dollars
  - IREN, CoreWeave
  - both Anthropic and OpenAI
  - $30 billion on cloud service agreements
  - in the next six years
  - paying its customers to buy its products
  - the most blatant circular financing since the dot com bubble
evaluator_interpretation:
  - This describes investments and purchase commitments already made, not a forecast that NVIDIA will later enter such agreements.
  - The observation period covers the latest reported fiscal quarter, January 26 through April 26, 2026, plus subsequent transaction announcements before the post.
  - Investing can include announced commitments, but completed investments, conditional commitments and unexercised investment rights must remain distinguishable.
  - Circular financing means NVIDIA finances counterparties that also purchase or deploy NVIDIA products. It does not by itself establish fraud or fictitious revenue.
  - The historical superlative is rhetorical and has no supplied comparison measure; it is excluded from the checkable financial core.
  - The six-year phrase describes the payment schedule of existing commitments. A claim that all payments fall within that window requires more than a final bucket labelled 'and thereafter'.
support_condition: Contemporaneous disclosures reconcile tens of billions of investments or commitments involving the named counterparties, approximately $30 billion of cloud-service commitments payable within the stated window, and the reciprocal NVIDIA-product relationships.
contradiction_condition: Comparable disclosures materially conflict with the amounts, identify investment rights as completed payments, place material payments outside the stated window, or disprove the claimed reciprocal relationships.
measurement_requirements: Keep investment amounts separate from cloud commitments, carrying values and actual cash outlays. Identify transaction status, counterparties, contractual payment dates and product purchases.
source_requirements: NVIDIA filings and original announcements or filings from transaction counterparties.
