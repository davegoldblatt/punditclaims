interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Latest reported quarter selected for an ongoing observation without an explicit period.
  - Existing businesses could be read narrowly as on-premises software or broadly to include established cloud applications.
  - Plateauing and only real growth have no numerical thresholds.
  - Lacks comparable profitable businesses is different from having no profitable business.
  - The GPU product cohort, margin definition and accounting basis are unspecified.
  - Several financial metrics are combined in one claim.
