assessment_axis: historical_observation
explicit_source_elements:
  - Oracle lacks Microsoft or Google’s existing profitable businesses to fall back on
  - if these data centers are delayed
  - its existing business lines plateauing
  - its only real growth
  - theoretical deals with OpenAI
  - GPU compute with negative 100% margins
evaluator_interpretation:
  - This describes Oracle's current financial position. The delay clause explains the claimed vulnerability rather than conditioning the observation on a future delay.
  - "The target is Oracle's latest reported quarter before the post: fiscal Q3 2026, December 1, 2025 through February 28, 2026."
  - The ordinary reading is that mature businesses provide little growth or comparable financial support, while meaningful growth is confined to OpenAI commitments and loss-making GPU compute.
  - Existing businesses include established cloud applications as well as on-premises software; they are not restricted to the reporting line named Software.
  - The statement does not identify a common accounting basis, a margin definition or a GPU product cohort. Those cannot be supplied merely by selecting a convenient evidence source.
support_condition: Comparable target-period evidence shows mature businesses broadly plateauing without material profitable growth outside the stated AI activities, and establishes a negative 100% GPU-compute margin on the claimed scope and accounting basis.
contradiction_condition: Matching evidence establishes material realized growth and profitability in established businesses outside the named AI activities, or a materially different GPU margin for the same period, product scope and cost definition. A definitive grade requires resolving the unspecified financial basis.
measurement_requirements: Separate realized revenue from contractual backlog; distinguish established applications, software and GPU infrastructure; identify gross versus operating or net margin and its cost allocation; assess the financial-support comparison separately from simple profitability.
source_requirements: Oracle's target-period segment disclosures and a verifiable GPU-margin source, with comparable Microsoft and Alphabet records for the financial-support comparison.
metric_scope:
  company: Oracle
  metric: Existing-business revenue growth and profitability; GPU-compute profit margin
  currency: USD
  units: USD and percent
