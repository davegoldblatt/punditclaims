explicit_source_elements:
  - OpenAI and Anthropic
  - unprofitable, unreliable products prone to hallucinations
  - new products — such as OpenAI’s Sora
  - cost way too much money to both run and train
  - results that, well, suck
evaluator_interpretation:
  - "Assess the factual core: product profitability, recurring factual or consistency failures, and Sora's cost relative to useful output."
  - Treat boring and suck as opinions, without inventing a numerical quality threshold.
  - Unprofitable products ordinarily means product revenue fails to cover relevant costs. Company-wide losses alone do not establish that each product loses money.
  - Use calendar 2024, the latest completed reporting year before the post, for the ongoing economics claim and evaluations of the products then available.
  - No accounting basis or method of allocating training and research costs to products is supplied.
support_condition: Comparable product-level economics establish losses for both companies' relevant products, evaluations document recurring reliability failures, and disclosed Sora costs and useful-output measurements substantiate the cost claim.
contradiction_condition: Comparable product-level accounts establish profitability for the products described, or relevant evaluations materially refute the claimed recurring failures. Quality improvements alone do not settle profitability.
measurement_requirements: Separate company losses from product margins; distinguish inference costs from training and research allocations; identify tested model versions and tasks.
source_requirements: Product financial disclosures or clearly qualified estimates, reproducible evaluations, and primary documentation of Sora limitations and costs.
