assessment_axis: historical_observation
explicit_source_elements:
  - outside of unprofitable AI startups
  - vast majority
  - enterprises spending money on AI
  - tech companies rather than other industries
evaluator_interpretation:
  - The ordinary grammatical reading concerns the number of enterprise buyers, rather than the share of dollars spent.
  - Vast majority means an overwhelming majority, not merely more than half. No exact percentage is imposed.
  - Use August 2026, the latest completed month before the post, for this ongoing purchasing observation.
  - Exclude unprofitable AI startups before calculating the industry distribution.
  - The surrounding discussion emphasizes spending concentration, so a spending-weighted reading is also plausible and must be distinguished.
support_condition: Representative August buyer counts, classified by industry and excluding unprofitable AI startups, show an overwhelming technology-sector majority.
contradiction_condition: Comparable buyer counts show technology companies are a minority or only a narrow majority after the stated exclusion.
measurement_requirements: A buyer-count denominator, a documented technology-sector definition, enterprise classification, profitability labels and representative industry coverage. Within-industry adoption rates are insufficient.
source_requirements: Representative enterprise purchasing records or a well-designed survey measuring paid purchases, with industry and startup-profitability classifications.
