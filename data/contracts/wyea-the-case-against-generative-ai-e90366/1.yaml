evaluator_interpretation:
  - The continuation of the post explicitly describes 2025 revenue estimates. Assess the stated annual estimate, rather than substituting quarterly revenue or a trailing run rate.
  - Exclude exactly the five named customers. Meta is not in that list, although the subsequent calculation switches to excluding the Magnificent Seven.
  - "'Barely $1 billion' means approximately $1 billion or less, not a precisely specified numerical ceiling. No arbitrary tolerance is imposed."
  - The metric concerns revenue expected to be earned during the calendar year, not annualized monthly revenue, financing or total multiyear contracts.
  - Treat this as an observation about the revenue estimate presented at publication. Later realized results provide context but do not automatically validate its inputs.
support_condition: A reproducible, like-for-like 2025 estimate shows the three companies' combined revenue excluding exactly the five customers is approximately $1 billion or less.
contradiction_condition: Comparable disclosures or defensible bounds establish that the residual is materially above $1 billion, beyond any reasonable reading of 'barely'.
measurement_requirements: For each company, use the same calendar year and revenue basis, then subtract revenue attributable to each named customer without double counting. Preserve the distinction between estimates, realized revenue and annualized run rates.
source_requirements: Customer-level company disclosures or documented estimates with transparent assumptions. Missing customer identities or allocations must remain gaps.
