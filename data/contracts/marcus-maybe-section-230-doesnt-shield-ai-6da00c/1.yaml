explicit_source_elements:
  - essentially all their software
  - fabricate fairly regularly
  - even defame people
  - sometimes give bad medical information
evaluator_interpretation:
  - Read the scope as broad coverage of major LLM providers, rather than every individual model or software product.
  - Read recurring fabrication as a reproducible tendency in realistic uses, without inventing a numerical frequency threshold.
  - Read “defame” in its ordinary sense of false, reputation-damaging statements; a completed legal finding of defamation is not required.
  - "For this ongoing technical claim, use the current-year evaluation period before publication: January 1 through June 11, 2026. No standard quarterly reporting cycle exists."
  - Older incidents provide context but cannot alone establish the state of current systems.
support_condition: Contemporary, sufficiently broad evaluations establish recurring fabrication across major providers, with documented reputationally harmful falsehoods and erroneous medical outputs.
contradiction_condition: Representative contemporary evidence establishes that recurring fabrication is not broadly present, or directly refutes the claimed categories of harmful output.
measurement_requirements: Identify models, versions, dates, prompts, task selection, error definitions, and provider coverage. Distinguish difficult or adversarial benchmarks from ordinary-use frequency.
source_requirements: Prefer reproducible cross-provider evaluations and authenticated outputs. Treat lawsuit allegations as allegations and use older incidents only as context.
