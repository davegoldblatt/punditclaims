target_period: null
condition_status: not_applicable
early_resolution_rule: A dated public acknowledgment of the need for a different approach, corroborated by another independent research voice after the post, settles the prediction that recognition would begin.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - People and the extent of recognition are unspecified.
  - Genuinely new does not identify a technical threshold.
  - No deadline is given.
  - A screening suggestion of broad agreement adds a threshold absent from the quoted sentence.
  - Public acknowledgment does not establish when a researcher first formed that belief.
