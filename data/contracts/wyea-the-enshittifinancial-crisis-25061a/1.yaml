assessment_axis: forecast_outcome
explicit_source_elements:
  - This is a doom-spiral
  - can only be reversed
  - it will have to happen next year, without fail
  - It won’t.
evaluator_interpretation:
  - Next year means calendar 2026, ending December 31, 2026.
  - The ordinary reading of reversal is a broad, durable improvement in operating economics that ends the described cycle of increasing losses and repeated financing dependence.
  - The surrounding paragraph identifies OpenAI, Anthropic and connected startups as the relevant businesses.
  - Magical and most aggressive in history are rhetorical descriptions, not separately measurable thresholds.
  - Profitability, operating cash flow and financing receipts must remain distinct. A single company's positive quarter is not automatically an industry-wide reversal.
support_condition: Evidence covering the deadline shows that the described broad cycle of losses and financing dependence remained unreversed during 2026.
contradiction_condition: Evidence establishes a broad and durable reversal during 2026 in the named companies and a representative connected-startup cohort, rather than isolated improvements or additional financing.
measurement_requirements: Comparable 2026 losses, operating cash flows, capital expenditures and external funding requirements, with sufficient coverage to assess durability and industry breadth.
source_requirements: Company filings and financial disclosures, supplemented by reliable reporting and representative startup financial data.
metric_scope:
  company: OpenAI, Anthropic and connected AI startups
  metric: Reversal of losses, cash burn and recurring external financing dependence
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: next year
horizon_interval:
  start: 2025-12-29
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Before the deadline, only evidence of a broad, durable reversal of the specified financial cycle can conclusively contradict the forecast. Continued losses or financing needs before year-end cannot conclusively support it, because a later turnaround remains possible.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Doom-spiral and reversal have no numerical threshold.
  - The breadth and duration required for an industry turnaround are unstated.
  - The connected-startup cohort is undefined.
  - No accounting basis is specified for the underlying financial measures.
retrospective_or_prospective: prospective
