assessment_axis: forecast_outcome
explicit_source_elements:
  - Venture capital isn’t really what’s propping up generative AI
  - it’s Google or Microsoft
  - If either of them decide
  - slow down investment
  - the boom is done
  - reducing their capex
evaluator_interpretation:
  - The main test is the conditional forecast. The opening statement supplies its explanation; spending disclosures alone cannot establish that causal dependence.
  - Read alongside 'reducing their capex', the trigger means a decision to reduce either company's overall AI investment or planned investment envelope. Pausing individual projects does not necessarily establish that trigger.
  - The ordinary reading of 'the boom is done' is a broad collapse in generative AI financing and expansion, not a temporary share-price decline.
  - No deadline or permissible delay between the investment decision and the sector's collapse is supplied.
support_condition: A documented companywide investment retrenchment by Google or Microsoft is followed by a broad collapse in generative AI financing and expansion, with evidence connecting the two.
contradiction_condition: After a qualifying retrenchment, decisive evidence establishes that the sector's financing and expansion continue independently of the withdrawing support. Continued activity before the trigger does not contradict the forecast.
measurement_requirements: Distinguish total investment from individual projects, spending levels from growth rates, and actual investment decisions from accounting reclassifications. Examine financing and operations across the sector.
source_requirements: Dated company disclosures for the antecedent; primary financing announcements and operating records for the subsequent sector outcome.
metric_scope:
