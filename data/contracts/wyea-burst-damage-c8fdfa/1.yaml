ambiguity_flags:
  - Slowdown could mean reduced total spending, slower spending growth, or individual project delays.
  - No quantitative definition of the boom ending.
  - No deadline or causal lag.
  - The claimed dependence on these two companies is not separately quantified.
  - No accounting basis or investment perimeter is specified.
