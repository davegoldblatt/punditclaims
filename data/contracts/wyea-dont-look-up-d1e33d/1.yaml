measurement_requirements: Would require a fixed commentary sample, a definition of hype, a prevalence threshold, a specified earnings metric and consensus source, and a definition of lab distress.
source_requirements: A reproducible longitudinal commentary record and independently dated trigger evidence would be necessary after those definitions were supplied.
