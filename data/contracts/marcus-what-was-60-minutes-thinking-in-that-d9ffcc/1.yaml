assessment_axis: historical_observation
explicit_source_elements:
  - In 2016
  - radiologists have been replaced by machines
  - seven years later
  - Zero
evaluator_interpretation:
  - The period runs from the stated 2016 prediction through the October 10, 2023 post.
  - Replaced means a radiologist's job or professional role was eliminated because a machine took over the work. Automating individual readings or assisting a retained radiologist is insufficient.
  - No geography is supplied, so the zero claim is read globally.
  - Employment growth can coexist with individual displacement and therefore cannot establish an exact zero.
support_condition: Sufficiently comprehensive employment and deployment records establish that no radiologist's job or professional role was replaced by a machine during the period.
contradiction_condition: At least one documented case within the period establishes that a radiologist's job or professional role was eliminated because a machine took over the work.
measurement_requirements: Gross displacement attributable to machine substitution, distinguished from net employment changes, vacancies, retirements, outsourcing, and task automation.
source_requirements: Employer or workforce records documenting causes of displacement, corroborated deployment records, or sufficiently comprehensive surveys. Product capability announcements alone are insufficient.
