assessment_axis: forecast_outcome
explicit_source_elements:
  - Nothing China can realistically do
  - short of full out nuclear war
  - Google, Microsoft, and Amazon
  - stop
  - serving generative AI on the cloud
evaluator_interpretation:
  - The plain reading concerns preventing major US providers from operating their cloud generative AI businesses, including serving US customers.
  - A Chinese regional ban, retirement of one model, or temporary outage does not establish that a provider has been stopped from serving cloud generative AI.
  - An actual Chinese action would demonstrate feasibility; reliable evidence must also establish that it caused the cessation.
  - The nuclear-war exception limits qualifying causes. It is not an antecedent that must occur before the forecast can be evaluated.
support_condition: The named providers remain able to supply cloud generative AI despite Chinese actions throughout the unlimited horizon. Finite continued operation cannot prove this universal prediction.
contradiction_condition: A realistically executed Chinese action other than full nuclear war causes a named or comparable major US provider to cease its cloud generative AI business, rather than merely restricting one region or product.
measurement_requirements: Establish the scope and persistence of cessation and distinguish Chinese causation from commercial decisions, unrelated failures, and temporary disruptions.
source_requirements: Provider operational records and credible independent or official evidence connecting cessation to the Chinese action.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted upon a dated, verified cessation of a major US provider's cloud generative AI business caused by Chinese action within the stated nuclear-war exclusion.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Realistically is not defined.
  - The examples do not specify whether stopping one provider or the whole US sector is required.
  - Stop does not specify duration; the surrounding market argument suggests business cessation.
retrospective_or_prospective: retrospective
