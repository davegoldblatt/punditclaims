assessment_axis: historical_observation
explicit_source_elements:
  - Scaling hasn’t gotten us to AGI
  - or ‘superintelligence”
  - let alone AI we could trust
evaluator_interpretation:
  - Read this as a statement about capabilities achieved by the publication date, not a prediction that scaling can never succeed.
  - Scaling means increasing training data, model size, or computation, including inference computation. The claim concerns systems developed through that approach; it does not isolate scaling's causal contribution.
  - The ordinary reading of AGI is broadly human-level cognitive competence, including learning and handling unfamiliar tasks. Superintelligence means broadly exceeding human capabilities, rather than excelling at individual tasks.
  - In this context, AI we could trust means broadly dependable general-purpose AI. It does not require perfect accuracy or deny that particular applications can be dependable with suitable safeguards.
  - For the ongoing state, use August 2025, the latest completed calendar month before publication, extended through September 3 to include developments immediately before the post. This reporting window is an evaluator choice because capability evaluations have no standard reporting period.
support_condition: Representative evaluations of the leading scaled systems show substantial gaps in general human-level competence and broad dependability, with sufficiently comprehensive coverage to establish that none had demonstrated AGI, general superintelligence, or broadly trustworthy operation during the target period.
contradiction_condition: Credible, independently corroborated evidence establishes that a scaled system available by the post date had achieved at least one of those outcomes. Isolated benchmark victories or dependable narrow applications do not suffice.
measurement_requirements: Assess generality across substantially different tasks, adaptation to unfamiliar situations, and reliability under realistic use. Report human comparisons, assistance, safeguards, and evaluation limitations. Neither one failed task nor one exceptional benchmark score settles the claim.
source_requirements: Prefer dated independent evaluations and primary technical disclosures. Company claims require scrutiny and corroboration for broad achievement claims. Later publications qualify only when they establish facts about systems in the target period.
