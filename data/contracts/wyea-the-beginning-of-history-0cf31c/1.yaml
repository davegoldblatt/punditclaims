  - both companies lose billions of dollars
  - my own reporting
  - OpenAI made billions less
  - spent billions more in 2025
evaluator_interpretation:
  - Assess the supplied proposition about losses and discrepancies, rather than the surrounding annualized-revenue figures.
  - Use calendar 2025 for the explicit annual comparison and the latest completed annual period for the ongoing loss assertion.
  - Read billions as a difference of at least $2 billion, separately for revenue and spending.
  - The comparison requires an identifiable earlier report measuring the same annual revenue and spending.
  - The financial figures are reporting-based estimates. The speaker does not specify whether losses mean net losses, operating losses or cash burn; the ordinary net-loss reading must not be populated with another measure.
support_condition: Comparable records establish multibillion-dollar annual losses at both companies and show OpenAI’s 2025 revenue at least $2 billion below, and spending at least $2 billion above, the identified earlier reports.
contradiction_condition: Comparable records establish that either company did not have multibillion-dollar losses, or that either claimed OpenAI discrepancy was absent or below $2 billion.
measurement_requirements: Identify the earlier baseline, preserve its accounting basis and reconcile revenue, expenses, cash burn and net losses separately.
source_requirements: Independent financial disclosures or independently verified reporting; the speaker’s reporting alone cannot verify his claim.
