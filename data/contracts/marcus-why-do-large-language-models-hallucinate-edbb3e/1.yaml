evaluator_interpretation:
  - The ordinary reading is that contemporary LLMs recurrently give unsupported or conflicting Wikipedia-related facts, despite relevant training exposure.
  - Reliable means consistent factual fidelity on ordinary factual requests, not an absolute requirement of zero errors.
  - The immediate sentence concerns knowledge retained from training. Tests with the source article supplied measure a related but distinct capability.
  - Use the current year's pre-publication reporting window, 2025-01-01 through 2025-05-05, for the ongoing state described. No scientific reporting period is specified.
support_condition: Wikipedia-grounded evaluations show substantial recurring unsupported or incorrect answers in representative models with documented relevant Wikipedia training exposure.
contradiction_condition: Representative evaluations of those models establish consistently faithful Wikipedia-based answers, with justified departures rather than recurring unsupported assertions.
measurement_requirements: Report model versions, Wikipedia reference versions, error rates, refusals, question difficulty, training exposure, and whether source passages were supplied.
source_requirements: Primary Wikipedia-grounded evaluations and model training documentation. General factuality scores alone are insufficient.
