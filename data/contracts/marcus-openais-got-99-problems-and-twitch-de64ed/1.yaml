explicit_source_elements:
  - OpenAI painted a false dichotomy
  - building AI for free
  - building AI by paying for their raw materials
  - licensing copyrighted materials
evaluator_interpretation:
  - Assess both the availability of licensing and Marcus's characterization of OpenAI's parliamentary argument.
  - An available licensing route means actual agreements permitting copyrighted material to be used in AI development. It does not require proof that every training input could economically be licensed.
  - The target covers the contemporaneous licensing activity and parliamentary submission discussed in the post, through publication.
support_condition: Documented licensing agreements establish an available alternative, and the parliamentary submission presents uncompensated use as necessary while excluding that alternative.
contradiction_condition: Licensing was unavailable for the relevant use, or the submission expressly acknowledged licensed training material and partnerships instead of presenting free access as the sole option. Different findings on these two components warrant mixed.
measurement_requirements: Distinguish copyrighted material from unlicensed material, and an existing licensing route from a fully licensed replacement for all training data.
source_requirements: The parliamentary submission and contemporaneous licensing announcements. A faithful reproduction may be used if the official page cannot be read.
