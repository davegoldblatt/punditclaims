assessment_axis: historical_observation
explicit_source_elements:
  - “powerful” is a marketing term
  - the media has adopted
  - something it doesn’t understand
  - “autonomous AI that can do things for you”
  - at this point
  - any Large Language Model doing anything
evaluator_interpretation:
  - The plain reading alleges a broad journalistic pattern, rather than asserting that every journalist uses these terms identically.
  - Indiscriminate use means calling ordinary LLM responses agents without distinguishing autonomous action.
  - For the ongoing state, use May 2025, the latest complete calendar month before publication. Earlier reporting supplies context.
  - Adoption of company terminology alone does not establish that journalists lack understanding.
support_condition: A representative contemporary media sample shows widespread promotional use of powerful without a meaningful capability explanation and indiscriminate use of agent for ordinary LLM activity. Evidence also substantiates the claimed lack of understanding.
contradiction_condition: Representative contemporary evidence shows that coverage generally explains relevant capabilities and consistently distinguishes agents from ordinary LLM responses.
measurement_requirements: A reproducible corpus with a stated outlet sample, coding rules, denominators and comparisons against the relevant company announcements. Isolated examples cannot establish the prevalence claimed.
source_requirements: Use original media articles as primary records of journalistic language, paired with contemporary company announcements. A corpus study would be preferable for assessing prevalence.
