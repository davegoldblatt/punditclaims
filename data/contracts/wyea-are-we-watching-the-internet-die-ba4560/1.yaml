assessment_axis: causal_assessment
explicit_source_elements:
  - OpenAI's ChatGPT and Anthropic's Claude
  - dependent on a constant flow of training data to improve their models
  - effectively impossible for them to operate without violating copyright
evaluator_interpretation:
  - The claim concerns the practical requirements of developing and improving these services as of March 11, 2024.
  - In context, operating includes maintaining competitive models through further training. It does not mean that every individual answer requires newly collected training data.
  - Violating copyright means infringement, not merely using material protected by copyright.
  - "Practical necessity is stronger than evidence that infringement occurred: it requires showing that workable lawful alternatives were unavailable."
support_condition: Evidence establishes that continued improvement of ChatGPT and Claude practically required fresh training material that could not lawfully be obtained or used, with applicable legal findings supporting the infringement premise.
contradiction_condition: A documented, practically adequate lawful training and improvement route for the named services defeats the asserted necessity. Evidence of lawful use of only a small part of their training material is insufficient by itself.
measurement_requirements: Training-data provenance, rights and permissions, applicable legal treatment, and performance comparisons showing whether lawful alternatives could sustain useful improvement.
source_requirements: Company training disclosures and licensing records, court decisions, and reproducible research. Distinguish company legal positions from judicial findings and acquisition from training use.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Operate could mean serving existing models or developing improved replacements.
  - Constant flow and effectively impossible have no quantitative thresholds.
  - No jurisdiction or particular copyrighted works are specified.
  - The wording does not distinguish unlawful acquisition, training use, and infringing outputs.
retrospective_or_prospective: retrospective
