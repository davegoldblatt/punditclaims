evaluator_interpretation:
  - The plain reading concerns AI-driven technological development that humans cannot halt or meaningfully constrain, rather than every failure of an individual safeguard.
  - Use July 1–28, 2026, the current month through publication, for the ongoing state described. There is no regular reporting period for this phenomenon.
  - An unauthorized cyberattack is relevant but does not by itself establish uncontrollable technological acceleration.
support_condition: Technical evidence sufficiently covering contemporary AI development establishes that humans retained effective means of stopping or constraining it, including the systems implicated in apparent loss-of-control incidents.
contradiction_condition: A documented case establishes that AI-driven technological development continued beyond effective human control despite attempts to stop or constrain it.
measurement_requirements: Distinguish failed safeguards, delayed detection, and voluntary continuation from inability to regain control. Examine the development activity, interventions attempted, and their results.
source_requirements: Technical incident records and independent investigations addressing human control during the target period, published by the evaluation date.
