assessment_axis: forecast_outcome
explicit_source_elements:
  - what the EU decides
  - will affect all of us
evaluator_interpretation:
  - The ordinary reading is that EU generative-AI regulation will have consequences beyond EU borders through globally used products, provider practices, or other countries' policies.
  - All of us expresses worldwide relevance; it does not require proof of an individually measurable effect on every human.
  - A concrete global product or development policy adopted because of EU regulation counts as an effect.
  - The surrounding reference to this week concerns negotiations, not a deadline for worldwide effects.
support_condition: Dated records show that an EU decision on generative AI caused a concrete change to a globally used provider's product or development practices outside the EU, or a documented regulatory change elsewhere.
contradiction_condition: A decisive record establishes that the relevant decision had no effects outside the EU and could no longer produce them. Delay or a lack of observed effects alone does not contradict an undated forecast.
measurement_requirements: Establish the EU-related cause, the concrete practice or policy change, and its application outside the EU. Legal territorial scope alone is insufficient.
source_requirements: Prefer provider disclosures or official records explicitly connecting a worldwide change to EU regulation. Distinguish policy adoption from completed deployment.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a dated, documented adoption of a global product or development policy explicitly attributed to EU generative-AI regulation and extending beyond EU users. The event establishes an actual policy effect even if rollout continues.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - Affect does not specify a mechanism or minimum magnitude.
  - All of us may be read literally or as worldwide relevance; this assessment uses the ordinary latter reading.
  - A global policy change establishes effects on provider practices, not completed deployment to every user.
retrospective_or_prospective: retrospective
