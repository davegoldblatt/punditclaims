  - with Sora
  - In short order
evaluator_interpretation:
  - Assess only the supplied proposition that open-source counterparts to Sora will emerge, not the surrounding predictions about scammers or advertising.
  - The plain reading of counterparts is publicly usable models with the same core text-to-video function. It does not require identical video quality, duration, or benchmark performance.
  - Read open-source as public model weights and runnable source code under an open-source license. Complete disclosure of the training dataset is not an added requirement.
  - The surrounding phrase 'In short order' expresses urgency but supplies no calendar deadline for this proposition.
support_condition: Dated primary records establish public releases after February 18, 2024 of text-to-video models with downloadable weights and runnable source code under open-source licenses.
contradiction_condition: A decisive barrier establishes that such counterparts cannot emerge. Failure to find a release by an evaluator-selected date cannot contradict this forecast without a stated deadline.
measurement_requirements: Verify release dates, text-to-video functionality, availability of weights and executable source code, and licensing. A project name or announcement of future work alone is insufficient.
source_requirements: Use official repositories, release announcements, model documentation, or papers from the developers, available by October 28, 2026.
