explicit_source_elements:
  - These revenue backlogs
  - both circular financing
  - financialized marketing schemes
  - creating the illusion of demand via revenue backlogs
evaluator_interpretation:
  - The plain reading is that the cited AI infrastructure backlogs materially reflect financing that returns to its providers through purchases, and are promoted in a way that overstates independent customer demand.
  - Investment by a customer in its supplier does not by itself establish that the supplier financed that customer's purchases.
  - Marketing a backlog does not by itself establish misleading marketing. Contract commitments, financing links and the representations made about demand must be examined together.
  - Use April–June 2026, the latest completed calendar quarter reportable before the post and the period underlying its CoreWeave example.
support_condition: Contracts and funding records establish material financing loops within the cited backlogs, while promotional representations materially overstate demand independent of those arrangements.
contradiction_condition: Records establish that the cited backlogs predominantly represent independently funded purchases and that their promotion accurately describes customer concentration and financing dependencies.
measurement_requirements: Trace investments, purchases, guarantees and backlog recognition by counterparty. Distinguish committed future purchases from delivered services and realized revenue.
source_requirements: Company filings, contracts and financing announcements, together with the promotional statements being assessed. Customer investment alone is insufficient.
