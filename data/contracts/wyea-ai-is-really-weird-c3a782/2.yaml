assessment_axis: historical_observation
explicit_source_elements:
  - the media continues to perpetuate
  - the myth
  - of some sort of present or future "agentic AI"
  - that will destroy all employment
  - "example: CNBC repeated ServiceNow CEO's view that agents would send college grad unemployment over 30%"
evaluator_interpretation:
  - "'Destroy all employment' is read as shorthand for mass job-loss narratives, not literally the end of all jobs, as an informed reader would take it."
  - "The claim has two checkable parts for the period around the post: (a) mainstream media were running stories that present AI agents as a present or coming driver of large-scale job loss; (b) the 'present' version is a myth, meaning labor-market data at the time did not show AI causing broad job destruction."
  - "The 'future' version cannot be checked: whether agentic AI will someday cause mass unemployment is unknown. That part is noted but not scored."
  - "Period: the weeks before the post ('continues', 'a few weeks ago'), taken as 2026-01-01 to 2026-04-08."
support_condition: Major outlets in early 2026 publish stories presenting AI agents as causing or about to cause large job losses, AND credible labor-market research from the same period finds no broad AI-driven job destruction.
contradiction_condition: Media coverage in the period did not present such narratives, OR credible data from the period showed AI agents already causing large-scale job destruction across the economy.
measurement_requirements: Dated media coverage; economy-wide labor-market analysis covering late 2025 to early 2026.
source_requirements: Reputable news outlets for the media part; independent research (e.g., Yale Budget Lab) for the labor-market part.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-01-01
  end: 2026-04-08
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
