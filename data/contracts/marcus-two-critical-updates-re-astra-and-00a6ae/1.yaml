evaluator_interpretation:
  - Half refers to five of the ten announced mathematical results.
  - The scare quotes allow different proofs and experimental procedures; they do not require reproducing OpenAI's exact reasoning.
  - The asserted event is obtaining the mathematical results, not merely announcing that they were obtained.
  - The target period covers the announcement and reported replication on August 1–2. Earlier model availability is supporting context.
  - The methodological caveats are qualifications of an observation, not antecedents of a conditional forecast.
support_condition: Dated evidence establishes that Alpöge obtained valid solutions corresponding to five announced results using the publicly released Fable within approximately 24 hours.
contradiction_condition: Reliable records establish fewer than five corresponding solutions, a materially longer elapsed time, or use of a different or unreleased model.
measurement_requirements: Identify the five mathematical statements, check that the solutions establish them, and establish model identity and elapsed time. Identical proof methods are unnecessary.
source_requirements: The researcher's original report, model-release records, and proof artifacts or sufficiently detailed expert verification.
