explicit_source_elements:
  - As Mor Naaman's work shows
  - most people
  - won't even know what hit them
  - LLMs will know everything you say
  - talk you into almost anything
  - always-worn AI gadgets such as OpenAI's planned io device (context)
evaluator_interpretation:
  - "Plain reading: once LLM systems, especially always-on wearable assistants, are widely used to persuade people, a majority of the people persuaded will not realize they are being persuaded or manipulated."
  - The claim looks ahead to a future world of widely used LLM gadgets. Lab studies from before or after the post are consistent with it, or cut against it, but they do not settle a forecast about what most people will experience.
  - No deadline is stated, so it can only be settled early by a decisive event.
support_condition: Representative real-world evidence, such as a large field study or official investigation of deployed LLM assistants or wearables, showing that a majority of people who were persuaded or manipulated by them did not notice the influence.
contradiction_condition: Representative real-world evidence showing that a majority of people exposed to persuasion by deployed LLM assistants do notice the influence or recognize when they are being steered.
measurement_requirements: Share of exposed people who fail to notice persuasion or steering by LLM systems in real-world use, from a representative sample or population-level measure.
source_requirements: Peer-reviewed or preprint studies with representative or field samples, official regulator investigations, or independent audits. The speaker's own writing does not count.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled early only by a representative field study or official finding about deployed LLM assistants (not a one-off lab task) that clearly shows a majority of exposed people did, or did not, notice the persuasion.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Won't even know what hit them' is rhetorical. It could mean failing to notice persuasion in a single interaction, or failing to notice broader societal manipulation."
  - Unclear whether the claim is about all LLM persuasion or specifically about always-on wearable gadgets.
  - No deadline is stated.
  - Part of the sentence ('Mor Naaman's work shows') points back to an existing lab finding, but the claim itself looks ahead to the future.
