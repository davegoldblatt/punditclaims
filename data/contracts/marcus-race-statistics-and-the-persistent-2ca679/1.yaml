explicit_source_elements:
  - Until we shift our focus
  - represent and reason about values
  - rather than simply perpetuating past data
  - the same problems, over and over again
evaluator_interpretation:
  - Read 'the same problems' as recurring stereotyped depictions and failures on noncanonical visual configurations, as discussed immediately before the forecast.
  - The condition is continued development without the proposed shift toward representing and reasoning about values.
  - The speaker gives no deadline, model population, recurrence count or observable test for whether that shift has occurred.
  - Do not equate the continued use of training data with proof that the proposed shift has not occurred.
  - Finite recurrence can corroborate the forecast's concern without settling its indefinite conditional scope.
support_condition: Longitudinal evaluations establish repeated specified failures in systems for which independent evidence establishes that the proposed shift has not occurred. Definitive resolution additionally requires an identifiable endpoint for the conditional period.
contradiction_condition: Representative longitudinal evaluations establish durable disappearance of the specified problems while independently establishing that the proposed shift has not occurred.
measurement_requirements: Repeated comparable tests across dated model versions, fixed definitions of the relevant failures, and an independently observable criterion for the proposed development shift.
source_requirements: Primary longitudinal evaluations plus development records establishing the condition. Failure reports alone cannot establish the antecedent.
