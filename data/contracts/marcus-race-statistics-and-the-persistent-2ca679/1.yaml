early_resolution_rule: "A decisive event must establish the condition and settle the conditional period: for example, a documented qualifying shift closing a longitudinal record, or a comprehensive demonstration that the specified problems have durably disappeared without that shift. Individual failures, successes or product releases do not suffice."
