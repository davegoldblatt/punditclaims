assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s revenue represents 69%
  - Microsoft’s year-over-year cloud growth
  - calendar year 2025
  - without it
  - Intelligent Cloud would’ve only grown 8% year-over-year
evaluator_interpretation:
  - The target is calendar 2025, compared with calendar 2024, using the Intelligent Cloud segment rather than the broader Microsoft Cloud measure.
  - "'OpenAI’s revenue' means Microsoft revenue attributable to OpenAI, as indicated by the preceding Azure-spending discussion."
  - "The context supplies a one-year subtraction calculation: divide the stated OpenAI amount by the segment revenue increase, then subtract that amount from 2025 segment revenue while retaining the 2024 baseline."
  - A claim about OpenAI's actual contribution to year-over-year growth instead requires its revenue contribution in both years. A comparison excluding OpenAI from the business requires excluding it from both years.
  - The combined claim uses an estimate basis because the customer amount comes from the speaker's reporting on financial documents. The claimed audit does not establish Microsoft's revenue recognition.
support_condition: Comparable calendar-year segment data and independently verified Microsoft revenue attributable to OpenAI reproduce the stated percentages, with the treatment of 2024 explicitly established. A one-year subtraction result must be distinguished from an actual customer contribution to growth.
contradiction_condition: Matching recognized-revenue records produce percentages that do not round to 69% and 8% under the established comparison, or show that the spending amount cannot be treated as the claimed Microsoft segment revenue.
measurement_requirements: Let R25 and R24 be comparable Intelligent Cloud revenue and O25 and O24 be recognized Microsoft revenue attributable to OpenAI. The contextual arithmetic is O25/(R25-R24) and (R25-O25-R24)/R24. Incremental contribution is (O25-O24)/(R25-R24); growth excluding OpenAI is (R25-O25)/(R24-O24)-1. Round percentages to whole percentage points.
source_requirements: Microsoft segment disclosures and customer-level recognized revenue or a documented reconciliation of OpenAI expenses to that revenue. Independent reporting on audited documents can assist, but repetition of the speaker's calculation cannot validate it.
