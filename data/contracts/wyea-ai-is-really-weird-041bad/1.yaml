explicit_source_elements:
  - 90% of NVIDIA’s revenue
  - 8% or so of the S&P 500’s value
  - people that immediately lose money on installing it
evaluator_interpretation:
  - Data centers means NVIDIA’s Data Center end-market revenue.
  - For the ongoing revenue assertion, the default comparison is the latest reported quarter before publication, ending January 25, 2026.
  - The index assertion concerns NVIDIA’s float-adjusted index weight around April 8, 2026, independently of its revenue mix.
  - The target interval encompasses that latest quarter and the publication-date market snapshot; it does not make every observation within the interval interchangeable.
  - The plain reading of immediate losses concerns buyers’ economics from installing the hardware. An initial capital payment is not itself proof of a loss.
  - No accounting basis or financial source is identified in the supplied claim, so the contract basis remains unknown.
support_condition: Comparable revenue data establish a share near 90%, contemporary index records establish a weight near 8%, and buyer-level records establish the asserted immediate installation-related losses.
contradiction_condition: Comparable records materially contradict a percentage or demonstrate that the asserted generalization about buyers’ installation losses is false.
measurement_requirements: Data Center revenue divided by consolidated revenue for the same quarter; dated float-adjusted index weight; installation-level revenue and costs under a specified loss measure.
source_requirements: NVIDIA disclosures, index-provider records, and buyer disclosures isolating the relevant infrastructure economics.
