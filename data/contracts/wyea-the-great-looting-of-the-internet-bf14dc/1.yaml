explicit_source_elements:
  - OpenAI
  - has yet to turn any kind of profit
  - operating costs vastly surpass
  - revenue it gets from licensing its technology or selling premium memberships
evaluator_interpretation:
  - Read profitability as company-level earnings after costs, rather than positive revenue or financing.
  - Read the cost comparison as operating costs substantially exceeding realized licensing and subscription revenue over the same period.
  - Use calendar 2023, the latest completed annual period before publication, for the ongoing operating-cost comparison; the post names no reporting period.
  - "'Has yet' additionally claims an absence of prior profitability through publication; one annual loss cannot establish that entire history."
  - No accounting basis or attribution to company figures or press estimates is supplied in the quoted claim. Record the basis as unknown.
  - Do not impose an arbitrary numerical definition of 'vastly'.
support_condition: Matched financial records establish a substantial operating-cost excess over realized licensing and subscription revenue, together with a sufficiently complete history showing no company-level profit before publication.
contradiction_condition: Comparable records establish prior company-level profitability or show that operating costs did not substantially exceed the specified revenue in the target period.
measurement_requirements: Match period, entity scope, accounting basis and revenue categories. Do not substitute annualised revenue, financing, cash burn or projected losses for realized operating results.
source_requirements: Prefer financial statements or company disclosures. Clearly identified reporting based on financial records may help, but estimates and projections must retain their status.
