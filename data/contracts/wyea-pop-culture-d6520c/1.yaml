explicit_source_elements:
  - Generative AI isn't creating new jobs
  - isn't creating new ways to do your job
  - isn't making anybody any money
  - the path to boosting revenues is unclear
evaluator_interpretation:
  - "Plain reading: as of July 2024, generative AI had not created jobs or new ways of working, and nobody was earning money from it."
  - The claim joins several parts with 'and'. It is false if any firm part is clearly false.
  - "'The path to boosting revenues is unclear' is a judgment and is not scored."
  - He named no period. I use 2024-01-01 to 2024-07-08, the latest period reported before the post.
support_condition: Evidence that, in the first half of 2024, no company made meaningful money from generative AI and no jobs or working methods could be traced to it.
contradiction_condition: Company-reported results from the first half of 2024 showing substantial profit or revenue from generative AI. Clear evidence of new generative AI jobs or new working methods would also count.
measurement_requirements: Company-reported revenue or profit attributed to generative AI for periods ending by July 2024. Data on jobs or adoption from the same period.
source_requirements: Company earnings releases or reputable reports of them; labor market studies.
