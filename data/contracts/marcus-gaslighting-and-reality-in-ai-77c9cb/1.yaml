  - represent the ways in which things unfold over time
  - the central flaw in large language models
evaluator_interpretation:
  - Those problems refers to the nonsensical outputs and elementary reasoning failures discussed in the surrounding passage.
  - The plain reading of central flaw is a principal explanation of these failures, not merely one contributing factor.
  - The claim concerns the GPT-style models discussed from 2019 through the post date, rather than models released afterward.
support_condition: Controlled interventions show that missing or defective temporal state representations cause the relevant failures, and that this mechanism explains a principal share of them compared with plausible alternatives.
contradiction_condition: Controlled studies show that the relevant models already possess adequate temporal representations and that other mechanisms principally cause the cited failures, or that repairing temporal representations does not materially address them.
measurement_requirements: Intervene on representations while controlling other changes. Compare effects with alternative explanations, including calculation, retrieval, instruction following, and decoding. Assess a representative collection of the claimed failures.
source_requirements: Primary causal experiments or controlled ablations on relevant model versions. Behavioral examples and expert agreement alone are insufficient.
