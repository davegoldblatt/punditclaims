explicit_source_elements:
  - there have been some acquisitions
  - they are sparse
  - seem almost entirely centered around bizarre acqui-hires and confusing fire sales
evaluator_interpretation:
  - This describes the cumulative generative AI startup acquisition record through publication. No starting date is supplied, so the start remains unspecified.
  - Sparse means uncommon relative to the relevant startup population or a defensible comparable acquisition market.
  - Almost entirely means an overwhelming predominance, not merely several prominent examples. No numerical cutoff is invented.
  - Acqui-hires primarily transfer people and related rights; fire sales require evidence of distress or forced disposal. Seem is an epistemic hedge, not a condition.
support_condition: A representative acquisition inventory through August 6, 2025 shows low acquisition incidence and an overwhelming predominance of talent-focused or demonstrably distressed transactions.
contradiction_condition: A representative inventory shows ordinary business acquisitions were common enough to defeat the scarcity claim, or formed a substantial share inconsistent with almost entirely.
measurement_requirements: Specify the generative AI company universe, count transactions consistently, distinguish announced agreements from completed acquisitions, and classify structure and distress from evidence.
source_requirements: A documented transaction dataset supplemented by company announcements, filings, or regulatory records. Selected anecdotes cannot establish the market-wide proportions.
