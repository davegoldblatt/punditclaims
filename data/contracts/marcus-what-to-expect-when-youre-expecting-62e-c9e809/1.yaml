evaluator_interpretation:
  - The target is GPT-5, including its original chat variant.
  - "The plain reading is existential: at least some recommendations will be plainly dangerous or materially wrong, rather than merely stylistically disappointing."
  - Advice includes actionable guidance generated in response to a request. The speaker did not exclude deliberately risky requests.
  - Warnings must be considered alongside the guidance; a warning does not automatically make dangerous actionable content harmless.
support_condition: A documented GPT-5 output gives clearly dangerous or materially erroneous actionable guidance, with enough surrounding context to assess it fairly.
contradiction_condition: The alleged examples are shown to be misattributed, materially misrepresented, or sound advice in context. Finite successful tests alone cannot disprove an unrestricted claim that some bad advice will occur.
measurement_requirements: Verify the model and prompt, inspect the recommendation and accompanying warnings, and identify a concrete safety or factual defect.
source_requirements: Primary testing or attributable transcripts; generic ChatGPT anecdotes without model identification are insufficient.
