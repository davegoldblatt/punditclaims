assessment_axis: historical_observation
explicit_source_elements:
  - Between them, Anthropic and OpenAI
  - all AI compute demand
  - at a minimum 70%
  - if not 80% to 90%
evaluator_interpretation:
  - The firm minimum is 70%; 80% to 90% is a suggested higher range.
  - The ordinary reading covers worldwide AI compute demand, including training, inference, and internal AI workloads, rather than only frontier-model cloud rentals.
  - For this ongoing observation, I use January through March 2026, the latest completed calendar quarter that public reporting could cover before the June 8 post.
  - Compute demand should be attributed to the workload or customer using it, avoiding double-counting the cloud provider and its customer.
  - The claim is a compute-share claim, so metric_scope is null. Spending can be a proxy only if numerator and denominator use comparable prices, scope, and periods.
  - Installed capacity, ownership, utilization, incremental purchases, and demand are distinct measures.
support_condition: A sufficiently comprehensive, period-matched measurement establishes that Anthropic and OpenAI jointly account for at least 70% of worldwide AI compute demand.
contradiction_condition: A sufficiently comprehensive, period-matched measurement, or a defensible bound, places their combined share below 70%.
measurement_requirements: A common measure of AI compute demand for both companies and the worldwide denominator during Q1 2026. Cover rented and internally supplied compute, account for heterogeneous hardware and utilization, and prevent double-counting. Capacity or spending estimates require an explicit conversion to demand.
source_requirements: Independent industry measurements with disclosed methods, supported where possible by company usage or expenditure records. Provider ownership shares and isolated customer samples are insufficient.
