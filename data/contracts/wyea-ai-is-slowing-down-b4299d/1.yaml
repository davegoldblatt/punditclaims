ambiguity_flags:
  - The source names no observation period; Q1 2026 is the latest completed reportable quarter selected for the ongoing claim.
  - Demand has no stated unit and may refer to spending, utilized compute, or capacity sought.
  - The surrounding dollar figures suggest spending, while the claim itself says all AI compute demand.
  - The treatment of hyperscaler-hosted inference for the two companies' models is unspecified.
  - The source does not explicitly distinguish all AI from generative AI.
