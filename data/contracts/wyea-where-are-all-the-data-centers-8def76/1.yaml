assessment_axis: historical_observation
explicit_source_elements:
  - a total mismatch
  - the so-called “rapid buildout” of AI data centers
  - reality
evaluator_interpretation:
  - The ordinary factual reading is that usable AI capacity is coming online materially more slowly than public buildout claims imply.
  - The contextual construction cycle runs from October 2023 through May 12, 2026.
  - Compare announced delivery with actual commissioning for the same projects and dates. Do not treat all announced future capacity as already overdue.
  - The speaker supplies neither a numerical shortfall threshold nor a defined set of public claims.
support_condition: Broad, matched records show a material shortfall between AI capacity publicly represented as deliverable by specified dates and usable capacity actually commissioned by those dates.
contradiction_condition: Broad, matched records show that actual usable AI capacity substantially tracks the delivery pace represented in public claims.
measurement_requirements: A defined announcement cohort, original delivery dates, AI-specific usable capacity, and dated commissioning records. Separate IT power from total facility power and phases from entire campuses.
source_requirements: Original announcements paired with commissioning disclosures or independent operational measurements; aggregate datasets must use comparable scope and units.
