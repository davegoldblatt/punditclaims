explicit_source_elements:
  - spent $21bn
  - propping up the ecosystem
  - feeds billions of dollars into its coffers
  - $17.5bn
  - $3.5bn in land, power, and shell guarantees
evaluator_interpretation:
  - The surrounding annual-report discussion identifies FY2026 as the period.
  - The ordinary reading of spent is money actually deployed. However, the immediately preceding sentence explicitly includes guarantees, creating a genuine alternative reading of total financial support.
  - Propping up is treated as providing financial support, without assuming that recipients would otherwise fail.
  - The revenue clause requires evidence of billions in NVIDIA sales associated with the supported ecosystem; it does not by itself establish that the support caused those sales.
support_condition: A reconciliation establishes approximately $21 billion actually deployed through the stated investments and guarantees during FY2026, together with billions in NVIDIA revenue from the supported ecosystem.
contradiction_condition: Comparable records establish materially different actual spending or disprove the claimed revenue relationship.
measurement_requirements: Separate investment outlays, contingent guarantee exposure, payments under guarantees, and revenue associated with recipients. Do not add a contingent exposure balance to cash spending.
source_requirements: NVIDIA’s financial statements and guarantee disclosures, supplemented by recipient purchase records or a documented revenue reconciliation.
