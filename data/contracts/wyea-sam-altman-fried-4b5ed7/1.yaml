assessment_axis: forecast_outcome
explicit_source_elements:
  - I believe
  - once reality catches up with artificial intelligence's marketing
  - dramatic knock-on effect
  - savages the entire tech industry
evaluator_interpretation:
  - I believe expresses confidence rather than a separate factual antecedent.
  - The antecedent means a broadly recognized mismatch between AI promises and demonstrated technical or commercial performance.
  - The predicted consequence is severe damage across the technology sector caused by that reassessment, rather than losses confined to an individual AI company.
  - The claim supplies neither a deadline nor numerical thresholds for the trigger or the damage. An isolated market decline is not by itself decisive evidence of the entire causal sequence.
support_condition: Evidence establishes the stated reassessment of AI promises and severe, broadly distributed technology-sector damage attributable to it.
contradiction_condition: After an identifiable qualifying reassessment, evidence establishes that its consequences have run their course without severe sector-wide damage. Mere non-occurrence by the evaluation date cannot contradict this undated forecast.
measurement_requirements: Dated evidence of the expectations reversal, sector breadth and severity of damage, and a causal connection. Distinguish AI disappointment from interest rates, competition, energy prices, and unrelated business problems.
source_requirements: Prefer sector statistics and primary disclosures, supplemented by independent reporting that identifies causes. Commentary or warnings alone cannot establish fulfillment.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve early only when dated evidence establishes both a qualifying collapse in AI expectations and clearly severe technology-sector-wide consequences caused by it. The absence of such an event cannot resolve an undated forecast against the speaker.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - Reality catching up with marketing has no specified observable trigger.
  - Dramatic and savages have no severity threshold.
  - Entire tech industry does not specify geography, subsectors, or a measure of damage.
  - No interval between the trigger and its consequences is specified.
retrospective_or_prospective: retrospective
