assessment_axis: causal_assessment
explicit_source_elements:
  - In some cases
  - the pressure to use AI for everything
  - turning companies’ software stacks into slop
evaluator_interpretation:
  - "Slop has the ordinary testable meaning of poorer software quality: more defects, unreliable operation, or avoidable maintenance and review burdens."
  - Some cases requires credible company-level examples, not an industry-wide average effect.
  - The causal assertion requires evidence connecting pressure to use AI with the degradation, rather than merely finding AI use and defects together.
  - In some cases limits the scope; it is not a conditional forecast.
support_condition: At least one well-documented company case shows that organizational pressure to use AI contributed to a measurable deterioration in software quality or maintainability by the post date.
contradiction_condition: The alleged examples are shown not to involve deterioration or not to result from AI-use pressure, and sufficiently comprehensive evidence rules out the asserted cases. Successful adoption elsewhere alone cannot refute some cases.
measurement_requirements: Use defect rates, incidents, code rework or maintenance burdens with relevant baselines. Establish the adoption pressure, its timing and its contribution while considering workload and staffing changes.
source_requirements: Prefer incident reviews, repository records, engineering measurements and documented management directives. Anonymous reports require corroboration.
