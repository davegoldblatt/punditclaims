explicit_source_elements:
  - one thing to write code, and another to debug it
  - still another to maintain it, a year or a decade later
  - which is even harder
  - any coder with any chops at all knows
evaluator_interpretation:
  - "Plain reading: in software engineering, writing, debugging and long-term maintenance are distinct activities, and keeping code working over months or years is generally recognized as harder and costlier than writing it in the first place."
  - This is a general claim about the discipline with no named period. I read it as describing the state of software-engineering knowledge up to the post date (2026-03-10).
  - The words 'any coder with any chops at all knows' are rhetoric. I do not test them by surveying coders. I test whether established software-engineering literature treats long-term maintenance as the larger and harder burden.
support_condition: Established software-engineering literature or studies, available by the post date, find that maintenance takes most of a program's lifecycle effort or cost, or that code gets harder to change as it evolves.
contradiction_condition: Credible software-engineering research finds that long-term maintenance is generally no harder or costlier than initial development, or that practitioners do not regard it as a separate and harder task.
measurement_requirements: Lifecycle effort or cost shares, or findings on growing difficulty of change, from software-engineering literature.
source_requirements: Peer-reviewed or preprint software-engineering research or standard references; not the speaker's own writing.
