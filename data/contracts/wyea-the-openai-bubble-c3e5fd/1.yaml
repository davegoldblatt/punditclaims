evaluator_interpretation:
  - "Two parts. (1) Each of the four stocks rose on the day its OpenAI deal was announced. (2) Each deal was at least misleading: plain reading is that the deal as announced was not binding, was later dropped or cut sharply, or was not proceeding as announced by the post date."
  - "'Misleading' is a value judgment. It is tested here only against whether each deal went ahead as announced, judged on evidence up to the post date (2026-07-15)."
  - The side remark that investors were 'underwater within two months' is not scored.
support_condition: Evidence that all four stocks rose on announcement AND that each of the four deals was non-binding, collapsed, was cut sharply, or was not proceeding as announced.
contradiction_condition: Evidence that a stock did not rally, or that one or more of the deals was binding and moving ahead as announced by the post date.
measurement_requirements: Announcement-day share moves; deal status (binding or not, cancelled, replaced, or on schedule) by 2026-07-15.
