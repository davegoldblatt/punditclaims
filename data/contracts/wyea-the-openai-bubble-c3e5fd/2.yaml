assessment_axis: historical_observation
explicit_source_elements:
  - All four of these companies’ stocks rallied
  - on deals
  - somewhere between misleading and fictional
evaluator_interpretation:
  - The four companies are NVIDIA, AMD, Broadcom, and Disney, and the relevant deals are their OpenAI announcements discussed in the post.
  - “Rallied on” means meaningful positive share-price reactions around the announcements, with contemporaneous evidence linking the moves to the news. It does not require the deal to be the sole cause.
  - “Misleading or fictional” means each announcement materially overstated or misrepresented the arrangement's existence, commitment, scope, financing, or readiness, judged against what it actually communicated and disclosed.
  - Neither openly conditional terms nor subsequent cancellation alone establishes misleadingness. A signed agreement or technical progress alone does not establish accuracy.
  - The historical period runs from the first relevant announcement through the post date. Later publications can establish facts about that period, but subsequent developments alone cannot rewrite the announcements' original truth.
  - The neighboring statements about investors being underwater and later recoveries are outside the selected claim.
support_condition: For each of the four companies, establish a meaningful announcement-related stock rise and a material discrepancy between the announcement's communicated deal status and the underlying facts. The discrepancy must show misleading presentation or a fictitious arrangement, not merely an uncertain project or later change.
contradiction_condition: Reliable evidence establishes that a named company's stock did not rally on its announcement, or establishes that the challenged announcement accurately represented the underlying arrangement and material qualifications. A blanket finding requires examining both the communicated claims and the underlying facts.
measurement_requirements: Announcement timestamps, contemporaneous intraday or closing share-price changes, reporting on the reaction, original announcement language, and records of the actual arrangements and relevant qualifications. Keep intraday, premarket, and closing measurements distinct.
source_requirements: Prefer original announcements, securities filings, agreements, and exchange data. Use reputable contemporaneous reporting for market reactions and inaccessible private negotiations. Allegations require corroboration beyond the speaker's own account.
