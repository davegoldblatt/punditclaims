assessment_axis: forecast_outcome
explicit_source_elements:
  - AI built in 2026 or 2027
  - will be valuable
  - future Nobel Laureates
evaluator_interpretation:
  - The years specify when the AI is built, not a deadline for its benefit or the Nobel award.
  - Valuable means materially assisting scientific work, rather than incidental use.
  - Future laureates means people who receive a Nobel Prize after the post. The assistance need not itself earn the prize.
  - The model-vintage restriction defines the eligible systems; it is not an if-then antecedent.
support_condition: A documented AI system built in 2026 or 2027 materially assists scientific work by someone subsequently confirmed as a Nobel laureate after the post.
contradiction_condition: Evidence would need to rule out qualifying benefit for all future laureates from the specified model cohort. Mere non-occurrence by a finite evaluation date cannot do that.
measurement_requirements: Verify the system’s build vintage, the nature of the scientific assistance, the scientist’s identity, and Nobel award timing.
source_requirements: Research papers or detailed scientist accounts, dated system documentation, and official Nobel records.
metric_scope: null
original_horizon: in 2026 or 2027
horizon_interval:
  start: 2025-03-09
  end: 2027-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when a documented material benefit from a system built in 2026–2027 is linked to a scientist confirmed as a post-publication Nobel laureate. All elements must be public by the evaluation date.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Valuable has no stated quantitative threshold.
  - The build years could be mistaken for an outcome deadline.
  - Future laureates could be read more loosely to include existing laureates doing future research.
  - The claim does not require the assisted work itself to receive a Nobel Prize.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
