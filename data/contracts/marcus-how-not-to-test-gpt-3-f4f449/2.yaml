assessment_axis: historical_observation
explicit_source_elements:
  - Large language models and other machine learning based Ais such as machine translation systems
  - do improve overall over time
  - if they haven’t improved, they aren’t released
  - they don’t improve across the board
evaluator_interpretation:
  - The plain reading is that successive systems improve in overall task performance, while improvement does not extend to every task, capability, or example. Unchanged performance can establish nonuniform improvement; actual deterioration is not required.
  - Overall improvement means better performance across a reasonably broad evaluation of the system’s intended tasks. Marcus supplies no particular benchmark or numerical threshold.
  - The release qualifier is a substantive assertion that versions without overall improvement are withheld. Evidence of successful releases alone does not establish that selection rule.
  - The observation concerns historical development through publication on 2023-02-17. Because 'over time' supplies no starting date or reporting cycle, the target period has an unspecified start rather than an invented quarterly window.
  - The release qualifier is part of the observation, not an antecedent that makes this a conditional forecast.
support_condition: Comparable evaluations show overall gains alongside tasks, capabilities, or examples that do not improve. Evidence about release decisions also establishes that overall improvement is a condition for releasing successor versions within the claimed scope.
contradiction_condition: Representative comparable evaluations undermine the claimed overall improvement or nonuniformity, or a documented successor release lacks overall improvement on a broad evaluation of its intended tasks. A decline on one task alone does not contradict overall improvement.
measurement_requirements: Compare identified predecessor and successor systems under comparable prompts, scoring, and test distributions. Distinguish aggregate performance from individual tasks and examples. For the release qualifier, examine release criteria and decisions, including unsuccessful candidates, rather than inferring a rule from improved products.
source_requirements: Use primary evaluations and documented release decisions concerning systems developed by the post date. Later publications may establish historical facts, but later model behavior cannot settle this historical observation.
