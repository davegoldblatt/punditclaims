assessment_axis: forecast_outcome
explicit_source_elements:
  - These three companies
  - cannot stop spending money on AI capex
  - the second they stop
  - investors will
  - ask why they spent all that money
  - what they got in return
evaluator_interpretation:
  - The three companies are Google, Amazon and Microsoft.
  - Treat this as a conditional forecast of investor scrutiny following an actual cessation of AI capital spending by any named company.
  - Stopping spending means ending AI capital expenditure, not reducing its growth rate, lowering guidance or cancelling individual projects.
  - Read 'the second' as promptly following disclosure, including the first ordinary investor discussion of the decision.
  - Read 'cannot stop' as an asserted practical pressure from investors. Investor questions alone would not prove literal inability or establish that this pressure caused continued spending.
support_condition: A documented cessation of AI capital spending is followed promptly by identifiable investors or their representatives asking what the earlier investment achieved and why it was undertaken.
contradiction_condition: After a documented cessation, sufficiently comprehensive records of the announcement and first investor discussion establish the absence of the predicted scrutiny. A few silent investors or an incomplete transcript are insufficient.
measurement_requirements: Establish an actual company-wide cessation, its announcement date, and the timing and content of subsequent investor questions. Keep total capital spending separate from AI-specific spending.
source_requirements: Company disclosures for the antecedent; complete earnings-call or investor-meeting records and attributable investor statements for the response.
