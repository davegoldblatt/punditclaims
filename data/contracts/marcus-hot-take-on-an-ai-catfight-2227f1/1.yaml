evaluator_interpretation:
  - Read as narrowing the capability gap between leading Chinese and U.S. language models, not claiming that China already led.
  - Use comparable language, coding and mathematical-reasoning benchmarks as ordinary measures of LLM capability.
  - Assess the latest models available before the post and the preceding year's trend, using earlier results as the baseline.
  - Later publications may establish historical results, but post-January 22, 2025 model improvements do not count.
support_condition: Comparable evaluations show that leading Chinese models materially narrowed their performance gap with leading U.S. models across several relevant benchmarks by the post date.
contradiction_condition: Comparable evaluations show no meaningful narrowing, or a widening gap, across the relevant capability measures during that period.
measurement_requirements: Compare contemporaneous leading models under comparable benchmark methods. Distinguish capability from model counts, investment, pricing and national AI capacity.
source_requirements: Independent benchmark compilations, with contemporaneous technical reports as corroboration and explicit treatment of developer-reported results.
