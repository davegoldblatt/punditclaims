evaluator_interpretation:
  - Pretraining means ARC-specific training, not all training needed to produce a language model.
  - The claim concerns the experiment underlying the December 20 demonstration, as discussed on December 22.
  - The plain reading asserts that the experiment was not performed. Merely showing that no result was published would establish a narrower claim.
  - Restricting the assertion to experiments performed by ARC Prize would materially change its evidential burden.
support_condition: Experimental records or statements from the relevant investigators establish that the December o3 system was not evaluated without ARC-specific training before the post.
contradiction_condition: A dated experimental record establishes that the relevant ARC-untrained version was evaluated before the post, whether or not its results were public.
measurement_requirements: Identify the December preview system, the training excluded, the evaluation performed, and its date. Distinguish an unperformed experiment from an unpublished result.
source_requirements: OpenAI experimental records or statements, or evaluator testimony with a clearly stated scope of knowledge.
