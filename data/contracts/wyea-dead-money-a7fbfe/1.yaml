assessment_axis: forecast_outcome
explicit_source_elements:
  - Everybody
  - egregiously ignorant or hopelessly optimistic
  - will make this situation so much worse
  - when it collapses
evaluator_interpretation:
  - Read the factual core as a forecast of a broad breakdown in the AI data center buildout, aggravated by widespread overoptimistic or poorly informed investment decisions.
  - Treat everybody as rhetorical generalization rather than a separately testable assertion about every person's mental state.
  - Collapse requires widespread failures, defaults or cancellations with substantial losses, rather than isolated setbacks or a temporary market decline.
  - The statement predicts collapse; when is not an external antecedent that must occur before an otherwise separate forecast is scored.
  - There is no stated deadline.
support_condition: A broad wave of AI data center failures, defaults or cancellations causes substantial losses, and credible investigations show that optimistic assumptions or inadequate diligence materially amplified those losses.
contradiction_condition: A conclusively completed outcome for the relevant buildout demonstrates that the predicted breakdown did not occur, or a qualifying breakdown occurs with persuasive evidence against the claimed amplifying mechanism. Continued operation over a finite observation period is insufficient.
measurement_requirements: Sector-wide project and debt outcomes, realized investor losses, and records establishing how underwriting or investment assumptions affected those losses.
source_requirements: Prefer default records, court filings, project disclosures and regulatory investigations. News reporting may identify developments but market anxiety alone does not establish collapse or causation.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only on dated evidence of a sector-wide breakdown with substantial realized losses and credible causal evidence that widespread optimism or inadequate diligence materially worsened it. One failed project, rising yields or a stock selloff is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Collapse has no quantitative threshold or defined project cohort.
  - The relevant people and institutions are unspecified.
  - Much worse supplies no counterfactual or magnitude.
  - The causal mechanism is asserted without an operational definition.
retrospective_or_prospective: retrospective
