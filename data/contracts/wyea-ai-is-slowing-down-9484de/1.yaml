assessment_axis: forecast_outcome
explicit_source_elements:
  - if OpenAI can’t afford
  - or doesn’t want
  - its compute
  - Oracle will simply run out of money
evaluator_interpretation:
  - The trigger is OpenAI's inability or unwillingness to pay for its contracted Oracle compute, evidenced by a material default, repudiation, or cancellation.
  - Declining an uncommitted expansion or moving proposed capacity between sites does not by itself establish that trigger.
  - Run out of money means Oracle exhausts usable liquidity and cannot meet obligations as they fall due, rather than merely reporting negative free cash flow.
  - No deadline or lag between trigger and consequence is supplied.
  - The claim supplies no accounting basis for money or liquidity.
support_condition: The trigger occurs and Oracle subsequently experiences a documented liquidity failure materially attributable to the lost OpenAI payments.
contradiction_condition: The trigger occurs, but completed replacement arrangements or final settlement establish that Oracle can fund the affected obligations without the lost OpenAI payments.
measurement_requirements: Verify the OpenAI contract event and its reason, then examine Oracle's usable cash, committed financing, payment obligations, replacement customers, and any payment default. Negative free cash flow alone is insufficient.
source_requirements: Contract disclosures, company filings, creditor or court records, and reliable reporting identifying the actual trigger.
metric_scope:
  company: Oracle
  metric: usable liquidity sufficient to meet obligations
  currency: USD
  units: dollars
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Require a verified OpenAI trigger followed by a documented Oracle liquidity failure, or a completed financial resolution that conclusively funds the affected obligations despite that trigger. Survival for an arbitrary interval is not decisive.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or consequence lag is stated.
  - The scale of lost compute purchases needed to trigger the claim is unspecified.
  - Run out of money has no supplied liquidity definition.
  - The wording does not specify treatment of replacement customers, refinancing, or asset sales.
retrospective_or_prospective: retrospective
