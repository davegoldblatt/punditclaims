assessment_axis: historical_observation
explicit_source_elements:
  - there are absolutely some jobs being taken by AI
  - to this point
  - little or no research
  - happening at scale
evaluator_interpretation:
  - This claim concerns the research available through June 16, 2025, not whether later research found displacement.
  - In context, AI primarily means generative AI and LLMs.
  - The ordinary reading of 'at scale' is widespread realized displacement across the broader labor market or major occupations, rather than isolated employers or a narrow freelance platform.
  - The claim allows limited research and some displacement. It does not assert that no displacement study exists.
  - The opening concession is not an antecedent that makes this observation conditional.
  - The cumulative phrase 'to this point' supplies an ending date but no starting date for the research record.
support_condition: Contemporary research and its literature assessments show that broad realized displacement remained weakly evidenced, while observed losses were limited or concentrated.
contradiction_condition: A substantial body of research available by June 16, 2025 establishes widespread realized generative-AI displacement across the broader labor market or major occupations.
measurement_requirements: Separate realized employment effects from technical exposure, forecasts, task automation, job postings, and firm announcements. Assess geographic and occupational coverage.
source_requirements: Prefer empirical papers and contemporary literature assessments. Include research finding displacement even when its scope is narrower than the ordinary reading.
