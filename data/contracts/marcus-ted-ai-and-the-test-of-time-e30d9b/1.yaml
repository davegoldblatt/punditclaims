explicit_source_elements:
  - LLMs would be used by bad actors
  - they increasingly are
evaluator_interpretation:
  - This assesses the claimed increase in actual malicious use, not the earlier forecast.
  - The comparison is with the previous TED year. Use April 2023 through April 15, 2024; the exact baseline date is not supplied.
  - Malicious use includes research, coding and deceptive-content assistance for harmful operations. It need not produce a successful attack.
  - An increase in published reports, interest or future risk alone does not establish an increase in actual use.
support_condition: Comparable observations or a substantiated longitudinal threat assessment establish growing actual LLM use by malicious actors during the target period.
contradiction_condition: Comparable observations establish that actual malicious LLM use was flat or declining over the relevant comparison period.
measurement_requirements: Identify actors, observed activities and dates, with a comparable baseline or an explained method for inferring growth. Separate LLMs from other AI technologies.
source_requirements: Prefer provider abuse investigations and direct threat-intelligence reports. Distinguish observed conduct from forecasts and inferred attribution.
