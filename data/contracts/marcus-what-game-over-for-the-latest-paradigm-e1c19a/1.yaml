evaluator_interpretation:
  - This refers to reliably interpreting pragmatic implications, particularly the conversational implicatures illustrated in the surrounding passage.
  - The ordinary reading is substantial practical difficulty for contemporary systems lacking the stated resources. It does not assert impossibility.
  - Lacking an explicit symbolic component is not automatically equivalent to lacking learned cognitive representations or commonsense knowledge.
  - For this ongoing observation, the target is the latest evaluation period reported in the study specifically identified by the post. Its API experiment timestamps place the relevant testing in August–September 2022.
support_condition: Evaluations show substantial, persistent difficulty interpreting pragmatic implications in contemporary systems whose lack of the relevant cognitive and commonsense resources is independently established.
contradiction_condition: Systems established to lack those resources reliably interpret a suitably broad range of pragmatic implications without substantial difficulty.
measurement_requirements: Use pragmatic interpretation tests, human comparisons, and documented prompting conditions. Establish the systems' relevant resources independently of their task failures; an ablation is helpful but not required.
source_requirements: Primary evaluations of systems contemporary with the post, including architecture or capability evidence relevant to the without clause.
