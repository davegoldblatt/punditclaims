evaluator_interpretation:
  - The claim concerns the tandem image presented in the April 22 post, as it appeared that day.
  - The ordinary reading is that several distinct mechanical or anatomical faults would be readily apparent to a knowledgeable cyclist.
  - "'Anybody' and 'immediately' express obviousness to knowledgeable observers; they do not require testing every expert or imposing an unstated time limit."
  - Unusual height alone is not an error because the prompt expressly requested a taller bicycle. Faults must concern component identity, placement, connections or practical operation.
support_condition: The exact image and a documented independent assessment establish several distinct mechanical or anatomical faults that a knowledgeable cyclist could readily recognize.
contradiction_condition: A qualified assessment of the exact image establishes that the alleged faults are mechanically plausible or explained by perspective, and that numerous readily apparent problems are absent.
measurement_requirements: A sufficiently clear copy of the tandem image and an itemized explanation of distinct faults, distinguishing mechanical failures from unusual but feasible design choices.
source_requirements: An inspectable original artifact supported by authoritative bicycle references or a qualified independent review. Assertions repeated from Marcus and comments with unverified expertise are insufficient alone.
