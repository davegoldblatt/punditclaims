evaluator_interpretation:
  - The plain reading is that the listed problems remained substantial unresolved limitations in 2022, and that invoking them continued his earlier criteria.
  - This does not require that neural networks had made no progress or could never perform these tasks.
  - The target period spans the claimed continuity from 2012 through publication. Evidence of remaining technical limitations must describe systems evaluated in 2022.
  - Support for one technical concern does not automatically establish all four concerns or the separate assertion about unchanged criteria.
support_condition: Contemporary evaluations establish substantial remaining limitations across the listed capabilities, and dated records establish continuity of the relevant criteria from 2012 to September 2022.
contradiction_condition: Contemporary evaluations establish robust resolution of the listed concerns, or dated records show a material change in the relevant success criteria that contradicts the claimed continuity.
measurement_requirements: Distinguish learned generalization from performance on familiar test distributions, architectural capacity from successful training, and persistent limitations from categorical inability.
source_requirements: Independent technical evaluations and independently preserved historical records. Marcus's own assertions cannot establish that the technical criticism is correct.
