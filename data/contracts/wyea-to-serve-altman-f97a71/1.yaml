assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI has devoured no monopoly
  - the product category it created
  - entirely subsidized by venture capital and Microsoft
evaluator_interpretation:
  - Devouring a monopoly means materially replacing an incumbent's protected or dominant business, rather than merely competing with it.
  - The category is general-purpose generative AI models and assistants, as indicated by the discussion of OpenAI and its competitors.
  - Entirely subsidized ordinarily means dependent on outside funding to cover costs. It does not mean that customers pay nothing.
  - For the ongoing financial state, use April–June 2024, the latest completed quarter reportable before publication. The cumulative monopoly-displacement wording also requires historical context through the post.
  - Venture capital could include corporate venture investments. An investment by Amazon therefore does not automatically refute the ordinary reading.
support_condition: Market evidence shows no incumbent monopoly materially displaced by OpenAI, and comparable category-wide financial evidence shows dependence on the stated outside funding sources during the target period.
contradiction_condition: Evidence identifies a monopoly materially displaced by OpenAI, or establishes a relevant provider operating sustainably without the claimed subsidies. Other funding sources contradict an exclusive-source reading only if they fall outside the intended meaning of venture capital.
measurement_requirements: Define the relevant markets and providers. Compare customer revenue with full costs and distinguish investment receipts from operating subsidies and profitability.
source_requirements: Contemporaneous market studies or competition findings, plus provider-level financial records and financing disclosures.
