assessment_axis: historical_observation
explicit_source_elements:
  - In 2025
  - SoftBank paid OpenAI $867 million
  - Microsoft paid it $303 million
evaluator_interpretation:
  - Read the amounts in context as commercial related-party payments to OpenAI, excluding equity financing.
  - The ordinary meaning of 'paid' is money transferred during calendar 2025. Recognized revenue alone does not establish when payment occurred.
  - The surrounding discussion cites company financial statements, so company_reported is the claimed basis.
support_condition: Related-party disclosures or independently verified payment records establish that SoftBank paid $867 million and Microsoft paid $303 million commercially to OpenAI during calendar 2025.
contradiction_condition: Comparable records establish materially different commercial cash payments for either counterparty during calendar 2025.
measurement_requirements: Identify each counterparty's reporting perimeter and distinguish cash receipts from recognized revenue, receivables, noncash consideration, equity investments, and netted transactions. Allow rounding to the nearest million dollars.
source_requirements: Prefer OpenAI's related-party and cash-flow notes or counterparty disclosures. Reporting must establish what the amounts measure.
