explicit_source_elements:
  - the candidates
  - in the House, the Senate, and for President
  - certainly aren’t going to bother to talk about AI policy
  - if we don’t let them know that it matters
  - to all of us
evaluator_interpretation:
  - The antecedent is an absence of citizens communicating that AI policy matters to the relevant candidates.
  - Low polling salience does not establish that absence. Nor does a lack of published constituent correspondence.
  - The claim supplies no deadline, so I do not add an election-day deadline.
  - A candidate's policy statement alone cannot contradict the conditional without evidence that its antecedent held.
support_condition: For a clearly identified covered set of candidates and observation period, credible records establish no prior citizen communication of AI-policy concern and no subsequent AI-policy discussion. Without a terminal period, this can provide only provisional support.
contradiction_condition: A covered candidate discusses AI policy after publication, with credible evidence establishing the absence of prior citizen communication that AI policy matters.
measurement_requirements: Match dated candidate statements to evidence about prior constituent communications. Define the candidate population, relevant period and what counts as communicating concern.
source_requirements: Candidate records and reliable constituent-contact evidence are required. Surveys and public campaign statements alone cannot establish the negative antecedent.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A dated AI-policy statement by a covered candidate can conclusively contradict the forecast only if separate evidence establishes that the no-citizen-communication antecedent held.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is supplied.
  - The relevant candidate population is not enumerated.
  - The required amount and form of citizen communication are unspecified.
  - It is unclear whether public polling, advocacy organizations or direct constituent contacts satisfy the condition.
  - Certainly may be rhetorical emphasis.
