support_condition: Talks or reported statements by prominent researchers at NeurIPS 2025 say that scaling current approaches has limits or no longer gives meaningful returns.
contradiction_condition: Coverage of NeurIPS 2025 shows that prominent speakers mostly endorsed continued scaling, or that no notable figures raised doubts about it.
