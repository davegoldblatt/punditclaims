evaluator_interpretation:
  - OpenAI or its operating affiliates must be defendants in a substantial plurality of unresolved civil actions.
  - Use at least five distinct pending actions as a conservative operational reading of many. Count actions rather than plaintiffs, allegations, or motions.
  - Report consolidation explicitly and check that the conclusion also holds when consolidated actions are grouped.
  - For this ongoing observation, use public litigation status during September 1–25, 2024, ending at publication.
support_condition: Court records and reliable contemporaneous status reporting establish at least five distinct pending actions against OpenAI.
contradiction_condition: A sufficiently complete litigation inventory establishes fewer than five pending actions, with the purported additional actions dismissed, concluded, duplicated, or directed at other defendants.
measurement_requirements: Identify case numbers or distinct case names, establish unresolved status, and account for consolidation.
source_requirements: Prefer court orders and dockets. Use dated litigation reporting where accessible primary records are unavailable.
