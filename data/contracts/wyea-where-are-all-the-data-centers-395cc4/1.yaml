explicit_source_elements:
  - I’ve spent hours and hours looking
  - I’ve come up with
  - a few hundred megawatts
  - delivered in the past two years
evaluator_interpretation:
  - The claim concerns capacity Zitron identified in his research, not an unconditional ceiling on worldwide deliveries.
  - "The two-year observation period runs backward from the post date: May 12, 2024 through May 12, 2026."
  - Delivered means completed and operating capacity, consistent with the surrounding discussion. Announcements and planned campus capacity do not qualify.
  - A few hundred means several hundred megawatts; the wording does not justify choosing a precise numerical cutoff.
support_condition: An independently checkable record of the projects he identified, with commissioning dates and comparable capacity measurements, totals only several hundred megawatts within the target period.
contradiction_condition: An independently checkable record establishes that his research identified substantially more than several hundred megawatts of qualifying delivered capacity. A larger market-wide total alone does not contradict the personal research claim.
measurement_requirements: Identify the research sample, remove duplicate projects and phases, verify operational dates, and distinguish critical IT load from total facility power and planned capacity.
source_requirements: Contemporaneous research records corroborated by operator disclosures, commissioning records, utility records or independent measurements. The post itself cannot establish that the research conclusion was correct.
