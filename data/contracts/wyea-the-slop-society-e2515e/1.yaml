assessment_axis: historical_observation
explicit_source_elements:
  - AI-generated slop
  - already dominates the platform
  - Facebook
evaluator_interpretation:
  - Assess the supplied normalized proposition, excluding the surrounding claims about Meta's motives and platform quality.
  - The ordinary reading of dominates is that low-quality AI-generated material makes up most content users encounter in Facebook feeds. For measurement, most means more than half of feed exposures.
  - Because already describes the current state without a reporting period, use January 1–17, 2025, through publication. This is the immediately preceding period that contemporaneous feed observations could describe.
  - A sample of selected spam pages or one person's personalized feed cannot establish platform-wide predominance.
support_condition: Representative measurements for the target period show that low-quality AI-generated content accounted for more than half of Facebook feed exposures.
contradiction_condition: Representative measurements for the target period show that such content accounted for half or less of Facebook feed exposures, with uncertainty sufficiently small to distinguish the result.
measurement_requirements: A representative sample of users and feed exposures, a disclosed method for identifying AI-generated and low-quality content, and uncertainty estimates. Distinguish content generated by AI from human content recommended by an AI ranking system.
source_requirements: Prefer independent feed audits or research with disclosed sampling methods. Platform disclosures need a comparable denominator and clear definitions.
