assessment_axis: forecast_outcome
explicit_source_elements:
  - The jobs market isn't going to change because of generative AI
  - generative AI can't actually do many jobs
  - it's mediocre at the few things that it's capable of doing
  - no deadline stated
evaluator_interpretation:
  - Read as a forecast with no deadline that generative AI will not cause a material, measurable change in employment or hiring patterns.
  - "Plain reading: the forecast fails if credible labor-market research broadly establishes material changes in employment, occupations or hiring that are attributable to generative AI. Narrow or contested effects in subgroups do not by themselves count as decisive."
support_condition: Over a long period of widespread generative-AI adoption, labor-market research continues to find no material AI-caused change in employment or hiring.
contradiction_condition: Credible, broadly accepted labor-market studies or official statistics establish material changes in employment, occupations or hiring that are caused by generative AI.
measurement_requirements: Employment, hiring, and occupational-mix data with credible attribution to generative AI.
source_requirements: Peer-reviewed or working papers from recognized research institutions, official statistics.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Contradicted early if broadly accepted research shows a material, causally attributed generative-AI effect on employment or hiring. No early support is possible short of a long record of null effects under wide adoption.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'change' has no stated size or scope; subgroup effects (for example, entry-level workers) versus economy-wide effects"
  - no deadline
  - whether changes found so far are caused by AI is contested
retrospective_or_prospective: retrospective
