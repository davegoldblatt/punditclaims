ambiguity_flags:
  - The post recalls an early-2025 warning but also presents the observations as continuing concerns in October 2026; this assessment uses the retrospective reading.
  - Beginning of 2025 has no exact date; January is an evaluator approximation.
  - Increasingly has no specified baseline or numerical threshold; the latest completed annual survey before the recalled warning is used.
  - New security holes could mean vulnerabilities introduced into a program or previously unknown vulnerability classes; the former is the ordinary reading.
  - The claim does not distinguish laboratory cases from deployed software.
