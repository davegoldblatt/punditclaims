  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Actual compute expense versus API-equivalent retail value.
  - No exact date for 'up until recently'; recent pre-post months are an evaluator choice.
  - Subscription tier, usage pattern and billing-period length are unspecified.
  - The OpenAI comparison is qualified and supplies no numerical ratio.
  - Allowed maximum consumption versus average realized consumption.
