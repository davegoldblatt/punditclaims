assessment_axis: historical_observation
explicit_source_elements:
  - up until recently
  - Anthropic allowing you to burn upwards of $8 in compute for every dollar of your subscription
  - OpenAI allows you to do the same
  - hard to gauge by how much
evaluator_interpretation:
  - The ordinary reading is permitted heavy-user consumption, not average consumption across subscribers.
  - Anthropic's threshold is at least approximately eight dollars of actual compute expense per subscription dollar.
  - For OpenAI, 'the same' means subsidized usage exceeding subscription fees; the following qualification does not commit OpenAI to the same eight-to-one ratio.
  - The surrounding explanation identifies compute as what the provider pays to serve the model. API retail-equivalent value is a different measure.
  - Use the recent pre-publication period, January 1 through April 28, 2026, as an explicit interpretation of 'up until recently'.
  - The linked independent analysis makes the Anthropic figure an estimate, not a company-reported accounting figure.
support_condition: Dated usage and actual-cost measurements show that Anthropic permitted approximately eight or more dollars of compute expense per subscription dollar, and OpenAI permitted compute expense above subscription fees, during the relevant period.
contradiction_condition: Complete permitted-usage and actual-cost records rule out the Anthropic threshold or show that OpenAI's permitted usage could not exceed subscription fees. An API-price mismatch alone does not prove the actual-cost assertion false.
measurement_requirements: Historical subscription fees and allowances, model-specific usage, caching, enforcement limits and actual provider compute costs. Measure the ratio over the same billing period.
source_requirements: Reproducible usage measurements combined with disclosed or credibly estimated provider costs. API-equivalent valuations must be identified separately.
metric_scope:
  company: Anthropic and OpenAI
  metric: Actual compute expense of permitted subscription usage divided by subscription fees
  currency: USD
  units: USD of compute expense per USD of subscription fees
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-04-28
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
