assessment_axis: historical_observation
explicit_source_elements:
  - operating costs are insane
  - already committed to several grand projects
  - pushing deeper and deeper into the red
evaluator_interpretation:
  - I treat 'insane' as rhetorical emphasis, without inventing a numerical threshold.
  - The checkable financial core is that OpenAI's realized losses were increasing while it undertook major projects.
  - I interpret growing losses as increasing absolute losses, not a worsening loss-to-revenue ratio.
  - For the ongoing financial state, the latest completed quarter is January–March 2025. I include the preceding calendar year to test the claimed trend.
  - The statement identifies neither an accounting basis nor whether 'the red' means operating loss, net loss, or cash burn. These measures must not be substituted for each other.
support_condition: Comparable realized financial results through the latest completed quarter show increasing losses on a specified consistent basis, alongside documented major project commitments made by the post date.
contradiction_condition: Comparable realized results show that losses were stable or declining over the relevant recent periods, or records refute the claimed project commitments.
measurement_requirements: A consistent series of realized losses and operating expenses through March 31, 2025, with project commitments separately documented. Forecast losses and later annual results cannot establish the earlier realized trend.
source_requirements: Company accounts or credible reporting of matching financial periods and measures, plus primary project announcements. Resolve the unknown accounting basis before a decisive financial verdict.
