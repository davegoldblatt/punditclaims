assessment_axis: historical_observation
explicit_source_elements:
  - At the end of the year
  - just over $50 billion in assets
  - almost half of that in cash
evaluator_interpretation:
  - The surrounding 2025 discussion makes the measurement date December 31, 2025.
  - Read 'just over' as assets modestly above $50 billion and 'almost half' as a cash share near, but below, one-half.
  - Cash means the balance-sheet cash category, including cash equivalents if grouped with cash. Do not automatically include marketable securities or undrawn financing.
  - The cash proportion is part of the observation, not a forecast condition.
  - The speaker is describing company financial statements, so company_reported is the claimed basis.
support_condition: A year-end balance sheet or credible reporting of it places total assets modestly above $50 billion and cash near half of those assets.
contradiction_condition: Comparable year-end records show assets materially different from just over $50 billion or a cash share materially different from nearly half.
measurement_requirements: Compare cash and total assets for the same reporting entity and date. Preserve distinctions between cash, marketable securities, and financing commitments.
source_requirements: Prefer the year-end balance sheet. Reputable reporting of the audited documents is acceptable when the primary statement is unavailable.
