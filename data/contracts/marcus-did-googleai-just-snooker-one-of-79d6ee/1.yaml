explicit_source_elements:
  - did better on a handful of items than DALL-E2
  - not that the newer system (Imagen) systematically groks compositionality
  - none of which Alexander tested
evaluator_interpretation:
  - Assess the normalized proposition about what Alexander's September 2022 comparison establishes.
  - The plain reading of systematic compositionality is reliable handling of new combinations of objects, attributes and relations across varied prompts.
  - A small comparison selected from earlier failures can establish local improvement without establishing that broader ability.
  - The suggestion of possible regressions is a statement about an untested possibility, not a claim that regressions occurred.
support_condition: The published comparison uses a small set of earlier failure cases and lacks the coverage and controls needed to establish reliable compositional generalization.
contradiction_condition: The cited comparison includes a broad, systematically selected evaluation demonstrating reliable compositional generalization, including cases the earlier model handled successfully.
measurement_requirements: Inspect prompt selection, sample counts, scoring, reported results and coverage of earlier successes.
source_requirements: Alexander's original evaluation and any accompanying methods or results. Marcus's account cannot establish its shortcomings.
