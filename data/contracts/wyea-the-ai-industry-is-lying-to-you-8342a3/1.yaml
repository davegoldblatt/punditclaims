explicit_source_elements:
  - hyperscalers
  - forcing everybody in their companies
  - use AI tools as much as possible
  - tying compensation and performance use to token burn
  - non-technical people
  - vibe-code features that actually reach production
evaluator_interpretation:
  - The ordinary reading describes broad employee requirements across multiple hyperscalers, including the firms discussed in the surrounding passage. Examples from AI laboratories or unrelated software firms cannot establish that scope.
  - Token burn means consumption volume, not merely AI proficiency, adoption or useful results.
  - The production assertion includes work subsequently reviewed or repaired by engineers, because the context explicitly allows that route.
  - For the ongoing employment practices, the target is March 1–24, 2026, the current reportable month through publication. Earlier policies and later changes are context unless their operation during this interval is established.
support_condition: Policies or corroborated accounts establish broad mandatory use at multiple hyperscalers, compensation and performance consequences tied specifically to token volume, and identifiable nontechnical AI-coded contributions reaching production during the target period.
contradiction_condition: Adequately scoped policy and implementation records establish that the asserted requirements or token-based incentives did not apply, or that the described contributions did not reach production. Missing public policies alone do not contradict the claim.
measurement_requirements: Identify companies, covered employee populations, enforcement, review and pay criteria, token metrics, and production releases. Separate encouragement from mandates and prototypes from deployed features.
source_requirements: Prefer employment policies, compensation criteria and release records. Use attributed reporting where internal primary records are unavailable, preserving disputes between employees and management.
