early_resolution_rule: A documented trigger followed by a completed, sustained downturn or recovery can resolve the forecast without a calendar deadline. A bailout-caused durable reversal would decisively contradict its no-reversal component.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Hyperscaler population and capex comparison period are unspecified.
  - GPU demand is not defined as orders, shipments, utilization or spending.
  - Kill revenues and prolonged depression have no numerical thresholds.
  - The affected manufacturers and accounting bases are unspecified.
  - The universal assertion about possible bailouts exceeds what one failed intervention could prove.
