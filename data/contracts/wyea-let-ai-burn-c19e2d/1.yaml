assessment_axis: forecast_outcome
explicit_source_elements:
  - once demand wanes for NVIDIA’s GPUs
  - after hyperscalers reduce their capex
  - no bailout that can reverse the trend
  - kill the revenues of Taiwanese ODMs
  - kill the revenues of RAM and storage companies
  - a prolonged depression throughout a semiconductor industry
evaluator_interpretation:
  - The antecedent requires a broad reduction in hyperscaler capital expenditure followed by declining NVIDIA GPU demand. Slower spending growth alone does not establish it.
  - Kill revenues means severe revenue declines, rather than literally zero sales.
  - A prolonged depression means a sustained, broad semiconductor contraction across multiple reporting periods.
  - The predicted sequence contains causal links; simultaneous share-price declines would not establish those links.
  - No calendar deadline is supplied.
support_condition: After the documented spending-and-demand trigger, severe revenue declines spread through Taiwanese AI-server ODMs and RAM/storage suppliers into a sustained semiconductor contraction, with evidence supporting the claimed causal sequence. An attempted bailout fails to reverse that contraction.
contradiction_condition: After the documented trigger, a completed downturn-and-recovery episode clearly breaks the predicted inevitable sequence, or an implemented bailout demonstrably reverses the downturn.
measurement_requirements: Comparable hyperscaler capex series, NVIDIA GPU demand or order measurements, supplier revenue series and broad semiconductor output or sales data. Causal attribution must distinguish demand weakness from supply constraints and unrelated shocks.
source_requirements: Company filings and order disclosures, industry statistics, and official records of any bailout. Stock-market commentary alone is insufficient.
metric_scope:
  company: Taiwanese AI-server ODMs and RAM/storage manufacturers; firms unspecified
