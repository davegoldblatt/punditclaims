assessment_axis: forecast_outcome
explicit_source_elements:
  - once demand wanes for NVIDIA’s GPUs
  - after hyperscalers reduce their capex
  - no bailout that can reverse the trend
  - kill the revenues of Taiwanese ODMs
  - kill the revenues of RAM and storage companies
  - a prolonged depression throughout a semiconductor industry
evaluator_interpretation:
  - The antecedent requires an industry-level reduction in hyperscaler capital spending followed by weaker demand for NVIDIA GPUs. A slower growth rate, an isolated project cancellation or a share-price decline is insufficient by itself.
  - "'Kill the revenues' means severe revenue declines across the named supplier groups, not literally zero revenue at every company."
  - "'Prolonged depression' means a sustained, broad semiconductor contraction extending beyond a brief inventory adjustment. The speaker supplies no numerical severity or duration threshold."
  - The claim predicts a causal sequence, so coincident declines alone would not establish it.
  - The nearby reference to 2030 concerns a separate demand scenario. It is not an explicit deadline for this conditional chain.
  - "'No bailout can reverse' is categorical. One unsuccessful bailout, or several unsuccessful bailouts, cannot establish that every feasible bailout would fail."
support_condition: First establish the antecedent. Then establish that it causes severe revenue declines among Taiwanese AI-server ODMs, followed by severe declines among RAM and storage suppliers and a sustained industry-wide contraction. Full support also requires evidence establishing that feasible bailout interventions cannot reverse the relevant trend; observing one failed rescue or observing no rescue is insufficient.
contradiction_condition: After the antecedent occurs, a bailout demonstrably produces a durable reversal of the relevant decline, or a completed downturn-and-recovery episode establishes that the predicted supplier collapse and prolonged industry contraction did not follow. Continued growth before the antecedent occurs does not contradict this conditional forecast.
measurement_requirements: Use comparable actual hyperscaler capex series, NVIDIA GPU orders or demand measures, and revenue series for Taiwanese AI-server ODMs, RAM suppliers and storage suppliers. Track broad semiconductor activity over time. Separate causal effects from product transitions, prices, export restrictions and other shocks. Document any rescue, its implementation and its causal contribution to recovery.
source_requirements: Prefer filings, company disclosures, official industry statistics and independent demand measurements. A categorical claim about bailout impossibility needs evidence beyond the outcome of individual interventions.
metric_scope:
  company: Taiwanese AI-server ODMs, RAM suppliers, storage suppliers and the semiconductor industry
