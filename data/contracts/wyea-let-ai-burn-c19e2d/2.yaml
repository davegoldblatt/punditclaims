early_resolution_rule: After a documented trigger, a dated bailout followed by a durable reversal causally attributable to that intervention could conclusively contradict the categorical assertion. A completed triggered downturn-and-recovery episode without the predicted broad collapse could also contradict the chain. No single failed bailout can conclusively support the assertion that no bailout can work.
