evaluator_interpretation:
  - The plain reading is that LLM-generated code has recurring fabricated dependencies or other invented references that create practical reliability risks.
  - Apparently inherent expresses a tentative explanation. It is not treated as a firm claim that every possible future system must fail.
  - The statement describes technology available at publication. With no standard reporting quarter for this subject, the observation window is the current calendar year through 2025-08-17.
  - Asking for trouble means exposure to a real risk, not that every generated program fails.
support_condition: Systematic evaluations in the observation period find recurring hallucinated code dependencies or references, with credible consequences for execution or security.
contradiction_condition: Representative evaluations find that the claimed hallucinations are absent or practically negligible across ordinary code-generation tasks.
measurement_requirements: Distinguish fabricated dependencies from ordinary programming mistakes. Report task selection and mitigation effects. Do not equate a hallucination with an observed malware infection.
source_requirements: Primary empirical research on code-generating models or coding agents. The speaker's writing cannot establish the result.
