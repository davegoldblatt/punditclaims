assessment_axis: forecast_outcome
explicit_source_elements:
  - As the number of propositions and the complexity of what is represented increases
  - e.g., to include logical quantifiers
  - I expect encoding too will turn out to be unreliable
evaluator_interpretation:
  - Encoding means the internal representation of the supplied propositions, distinguished from producing an answer or decoding that representation.
  - The antecedent is exposure to larger and more complex propositional inputs. Quantifiers are an example, not a required feature of every test.
  - Increasing the number of interacting Boolean clauses is an ordinary instance of increasing proposition count and represented logical complexity.
  - The forecast concerns systematic encoding failures, not an isolated mistake or a requirement that every model fail on every larger input.
  - No deadline is stated.
support_condition: Controlled experiments with larger and more complex propositional inputs demonstrate systematic loss or corruption of their internal representation, with controls separating encoding failure from probe, reasoning, and decoding failure.
contradiction_condition: Well-controlled experiments across substantial increases in proposition count and logical complexity establish robust internal encoding, including on cases where generated answers fail.
measurement_requirements: Vary proposition count and complexity, examine internal representations, and validate measurement methods. Behavioral answer accuracy alone is insufficient.
source_requirements: Public experiments with model identities, datasets, complexity controls, and reproducible representation measurements.
