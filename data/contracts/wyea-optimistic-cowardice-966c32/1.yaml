assessment_axis: historical_observation
explicit_source_elements:
  - the benchmarks used to test AI performance
  - they’re easily gamed
  - quite often
  - not an effective way of showing actual progress
evaluator_interpretation:
  - The context concerns benchmarks used to evaluate generative language models, rather than every benchmark in every AI field.
  - Gaming means increasing a reported score through exposure to test material or test-specific optimization without corresponding general improvement.
  - Actual progress means improved performance on independent tasks relevant to the capability being claimed.
  - "'Quite often' means a recurring, consequential problem across commonly used evaluations; it does not mean all benchmarks or necessarily a majority."
  - Because this describes an ongoing state without a period, assess benchmarking practice during March 2025 through the post date.
support_condition: Evidence establishes readily achievable score inflation and recurring failures of benchmark gains to transfer to independent relevant tasks across commonly used evaluations.
contradiction_condition: Broad validation shows that commonly used evaluations resist readily achievable score inflation and that their gains reliably track independent relevant performance.
measurement_requirements: Controlled contamination or optimization experiments, independent task comparisons, and evidence of how widespread the demonstrated problems are. Isolated examples establish possibility but do not alone settle frequency.
source_requirements: Primary experiments and validation studies, supplemented by systematic reviews. Vendor score announcements alone are insufficient.
