evaluator_interpretation:
  - The plain reading is that adding visual training had not eliminated hallucinations in contemporary multimodal models.
  - The claim does not say that multimodal training offers no improvement or that elimination is forever impossible.
  - I assess persistence after multimodal training, not its isolated causal effect relative to otherwise identical text-only training.
  - For the ongoing state of published evaluations, I use January 1–October 21, 2023, the current research reporting year through publication.
support_condition: Contemporaneous multimodal models exhibit verified hallucinations after training on visual and language inputs.
contradiction_condition: Representative contemporary evaluations establish that hallucinations had been eliminated in the relevant multimodal systems, with the alleged failures explained as something else.
measurement_requirements: Evaluate invented or unsupported content against the actual image or other ground truth. Reduced error rates alone do not contradict persistence.
