ambiguity_flags:
  - The model families and versions are not specified.
  - Extremely similar has no named capability measure or threshold.
  - Same data could mean identical corpora or overlapping source categories.
  - Dwindling could concern unused data, legal access, quality or supply relative to demand.
  - The first-half reference period is an evaluator interpretation of an ongoing causal claim.
