assessment_axis: causal_assessment
explicit_source_elements:
  - their models are all extremely similar
  - as they’re all trained on the same
  - quickly-dwindling amount of training data
  - Microsoft, Meta, Google and Amazon
evaluator_interpretation:
  - Assess contemporary general-purpose models associated with the named companies, including relevant partnerships, rather than every specialized model they ever produced.
  - The ordinary reading is substantial similarity in useful capabilities caused by substantial overlap in training sources and rapid exhaustion of unused suitable data.
  - Read same as largely shared sources, not necessarily byte-identical training corpora.
  - Read dwindling as a shrinking supply of additional usable material relative to training demand; data are not physically consumed by training.
  - Use the first half of 2024 as the contemporary reference period. Similar benchmark scores alone would not establish the proposed cause.
support_condition: Comparable evaluations establish substantial model similarity, corpus evidence establishes substantial overlap and rapid exhaustion of additional usable data, and causal evidence connects that overlap or constraint to the similarity.
contradiction_condition: Comparable evidence materially refutes a central component, or controlled evidence shows that the proposed shared-data mechanism does not explain the claimed similarity.
measurement_requirements: Specify model versions, comparable capability tests, corpus overlap and the relevant stock of usable data. Separate data availability forecasts from observed depletion and distinguish common outputs from internal representation similarity.
source_requirements: Prefer model documentation, training-data disclosures, original data-availability studies and controlled comparisons. Vendor benchmarks require qualification.
