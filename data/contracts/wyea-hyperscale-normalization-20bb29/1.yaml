ambiguity_flags:
  - Latest completed reporting quarter selected for an ongoing claim with no named period.
  - Undefined commercial materiality in 'really.'
  - Unclear inclusion of AI glasses and other bundled products.
  - No measure for the relative judgment 'far worse.'
  - An active paid API and a material established business are different tests.
