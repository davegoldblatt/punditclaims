assessment_axis: historical_observation
explicit_source_elements:
  - Meta
  - doesn’t really have an AI business
  - in the same boat, except far worse
evaluator_interpretation:
  - Read 'AI business' as a substantive commercial activity selling AI products or services to customers, beyond using AI internally to improve advertising.
  - AI-enabled consumer products are relevant; they are not automatically excluded merely because they include hardware.
  - The word 'really' suggests commercial substance, but supplies no revenue or materiality threshold.
  - Use April through June 2026, the latest completed quarterly reporting period before the September 1 post, for the ongoing observation.
  - Later announcements are context unless they explicitly establish activity during that quarter.
  - This is a claim about the existence and substance of a business, not a claim of a specified revenue amount. The relative judgment 'far worse' has no supplied comparison measure.
support_condition: Contemporaneous product and financial records establish that Meta had no substantive customer-facing AI commercial activity during the target quarter, with AI monetization confined to indirect improvements in its existing advertising business.
contradiction_condition: Contemporaneous records establish substantive sales of AI products or services during the target quarter. A product announcement or an unquantified minor revenue stream alone does not settle the qualifier 'really.'
measurement_requirements: Identify actual products sold, launch and sales dates, paying customers or realized sales, and evidence of commercial scale. Do not treat missing separate segment disclosure as zero revenue.
source_requirements: Meta filings, earnings-call disclosures and dated product documentation. Prefer direct disclosures over commentary about its strategy.
