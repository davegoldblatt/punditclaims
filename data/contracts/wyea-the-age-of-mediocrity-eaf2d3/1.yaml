assessment_axis: forecast_outcome
explicit_source_elements:
  - will gladly replace
  - artists, writers and any other role
  - they believe can be automated
  - in a heartbeat
evaluator_interpretation:
  - The plain reading is that employers will willingly substitute AI for paid work, including creative work, when management considers it automatable.
  - Artists and writers illustrate the threatened occupations; the sentence does not establish a measurable prediction for every occupation or every company.
  - Readiness is assessed through completed management decisions, rather than inferred emotions. 'In a heartbeat' supplies no literal time limit.
  - Early support requires completed substitutions at multiple companies after the post, including creative or editorial work.
support_condition: Multiple companies complete AI-related worker substitutions after August 3, 2023, including creative or editorial work, with evidence connecting the staffing decisions to automation.
contradiction_condition: Decisive evidence establishes that the predicted substitutions cannot occur. Individual employers retaining workers would limit the generalization but cannot disprove this forecast without a deadline.
measurement_requirements: Distinguish completed worker substitutions from announcements, hiring restraint, ordinary layoffs, and tools that merely assist existing staff.
source_requirements: Prefer employer statements and staffing records; use reputable reporting with identified workers or company responses when primary records are unavailable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported once multiple completed employer substitutions are documented after the post, including creative or editorial work. Resolve on the date the final required case is established.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or prevalence threshold.
  - Occupational examples could be read as separate predictions.
  - Gladly and in a heartbeat are rhetorical descriptions of readiness.
retrospective_or_prospective: retrospective
