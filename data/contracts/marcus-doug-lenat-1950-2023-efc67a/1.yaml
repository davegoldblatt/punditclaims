explicit_source_elements:
  - Cyc (and the parent company, Cycorp
  - never exploded commercially
  - still in business 40 years later
  - very very few AI companies have survived that long
evaluator_interpretation:
  - Read forty years as an approximate description of the Cyc project's continuity, including its later operation through Cycorp. Distinguish the project's age from the corporation's age.
  - The historical period runs from the project's inception in 1984, identified in the supplied screening context, through publication.
  - Commercial explosion means broad adoption or major commercial scale. Marcus states no revenue, valuation, or other financial metric.
  - The rarity comparison requires evidence about AI businesses old enough to have survived approximately forty years, with consistent treatment of projects, corporations, acquisitions, and successors.
support_condition: Evidence establishes approximately forty years of project continuity and an operating commercial successor in 2023, limited commercial scale, and very few comparable surviving AI businesses.
contradiction_condition: Evidence establishes a substantial interruption or closure, broad commercial success, or that comparable forty-year survival was common. A corporate founding date alone contradicts only a literal corporate-age reading.
measurement_requirements: Separate project inception, corporate formation, continued operation, commercial adoption, and comparative survival. Do not infer limited commercial success from limited publicity.
source_requirements: Dated organizational histories and operating records, independent commercial evidence, and a defensible historical comparison group.
