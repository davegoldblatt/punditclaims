explicit_source_elements:
  - difficult to find one compelling description
  - without tumbling into the murky world of tech bro science fiction
  - a $7 million Super Bowl commercial
  - couldn't seem to find a tangible use case
  - without outright lying about what the result would be
evaluator_interpretation:
  - The checkable core is whether Microsoft's February 2024 Copilot advertisement materially misrepresented the results obtainable from the tasks it depicted.
  - The plain reading concerns usable results under the conditions represented in the advertisement. It does not require identical outputs on every attempt.
  - The target period is February 2024, the month of the advertisement, with the assessment restricted to product capabilities before the February 27 post.
  - Calling a result misleading and alleging deliberate lying are distinct. The latter requires evidence that the advertiser knowingly represented a false result.
  - Whether a description is compelling or resembles science fiction is subjective and cannot independently determine the outcome.
  - The advertising cost and company valuation identify the advertisement; they are not treated as separate financial propositions.
support_condition: The advertisement and contemporaneous tests or production records establish that its depicted results materially misrepresented the product's capabilities under the represented conditions. Establishing outright lying also requires evidence of knowing misrepresentation.
contradiction_condition: Contemporaneous reproductions or authenticated production records establish that the depicted practical results were attainable under materially equivalent conditions, without undisclosed intervention that changes the advertised capability.
measurement_requirements: Compare the advertised prompts and outputs with the February 2024 product, recording complete conversations, product version, subscription, repeated attempts, editing, and disclosures. Distinguish output variability from an unavailable capability.
source_requirements: Prefer the original advertisement and production records. Independent contemporaneous tests may establish actual behavior. The speaker's own tests cannot independently substantiate his allegation.
