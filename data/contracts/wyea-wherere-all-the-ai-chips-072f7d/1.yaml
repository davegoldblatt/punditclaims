explicit_source_elements:
  - At the end of 2025
  - 1.9GW of compute
  - would suggest
  - the vast majority of Microsoft’s infrastructure and some of Oracle’s
  - doesn’t distinguish between whether that’s active power, IT load or even accessible
evaluator_interpretation:
  - Assess the disclosure about year-end 2025 capacity, distinguishing the period described from the publication date.
  - "The plain reading separates three questions: whether OpenAI reported approximately 1.9 GW, whether it defined that measure, and whether provider allocations justify the Microsoft–Oracle inference."
  - Calling compute available addresses claimed accessibility, but does not establish actual electricity consumption, utilization or an IT-load boundary.
  - Treat 'would suggest' as a tentative inference, not a conditional forecast. Do not assign a numerical threshold to 'vast majority'.
support_condition: The disclosure reports approximately 1.9 GW for 2025 without specifying electrical basis or accessibility, and comparable provider totals and allocations substantiate the infrastructure inference. Individual components may receive separate findings.
contradiction_condition: The disclosure explicitly describes availability or defines its electrical basis, or comparable provider allocations refute the infrastructure inference. A contradiction of one component does not disprove the others.
measurement_requirements: Distinguish available capacity, contracted capacity, IT load, facility power and actual consumption. Compare provider allocations with total infrastructure measured on the same date and basis; annual capacity additions are not total capacity.
source_requirements: Read OpenAI's original disclosure and any clarification. Prefer provider disclosures for capacity allocations; independent summaries may corroborate the reported figure.
