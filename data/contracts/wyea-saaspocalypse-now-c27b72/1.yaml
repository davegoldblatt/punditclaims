assessment_axis: historical_observation
explicit_source_elements:
  - In essence
  - Amazon is benefitting from AI
  - in much the same way NVIDIA is
  - they need cloud compute to do so
evaluator_interpretation:
  - "The surrounding passage makes this a comparison of supplier roles: AWS and NVIDIA benefit from customers needing computing infrastructure to develop and run AI."
  - The sentence does not specify equal revenues, margins, growth rates or business models.
  - It does not explicitly assert that all, or a measured majority, of either company's AI business comes from experimentation.
  - "For the ongoing state, use the latest reported operating quarters available before the post: the April–June calendar quarter and the corresponding fiscal-quarter reporting window through July."
  - This is a qualitative business-model observation, not a claim about a specified monetary amount.
support_condition: Contemporaneous disclosures show actual customer use or demand for AWS computing services and NVIDIA computing products to develop or operate AI.
contradiction_condition: Contemporaneous evidence shows that the proposed computing-supplier benefit did not exist for one of the companies, or that the claimed similarity depends on a materially false description of its offerings.
measurement_requirements: Establish actual services, customer workloads and demand. Do not substitute overall company revenue for an AI revenue breakdown.
source_requirements: Company disclosures or documented customer deployments from the latest pre-publication reporting period, with material evidence of other business activities retained as context.
