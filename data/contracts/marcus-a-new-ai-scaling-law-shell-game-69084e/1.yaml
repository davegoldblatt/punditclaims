assessment_axis: historical_observation
explicit_source_elements:
  - scaling with how long you train a model
  - which isn’t really holding anymore
evaluator_interpretation:
  - Assess the parenthetical claim about pretraining, rather than the separate enumeration of three scaling approaches.
  - The plain reading is that increasing pretraining scale no longer reliably delivers the capability gains previously expected. It need not mean that every additional training step produces no benefit.
  - The surrounding last-few-weeks discussion places the current state in November 1–24, 2024. Older experiments provide context only.
  - Training duration is read in the surrounding context of pretraining compute, model size and data, rather than wall-clock time alone.
support_condition: Comparable predictions and measured frontier pretraining results for the claimed period show systematic shortfalls in expected capability gains.
contradiction_condition: Comparable predictions and measured results for that period show that increasing pretraining scale continued reliably to deliver the expected gains.
measurement_requirements: Specify the predicted quantity, actual result, compute and data scale, training recipe and uncertainty. Distinguish next-token loss from downstream capability and expected diminishing returns from failure of a scaling relationship.
source_requirements: Training reports, experiments or disclosed internal records permitting predictions to be compared with outcomes. General impressions or release delays are insufficient.
