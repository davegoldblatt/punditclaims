assessment_axis: historical_observation
explicit_source_elements:
  - The State Department intends to revoke the visas
  - large numbers of foreigners
  - largely student protestors
  - in part based on AI analysis of their social media posts
evaluator_interpretation:
  - This describes an existing intention, not a forecast that revocations will be completed by a deadline.
  - Use March 1–10, 2025 as the contemporaneous reporting window for the ongoing state described in this March 10 post.
  - The ordinary reading is a plan to revoke many visas, with student protesters making up most intended targets. No numerical minimum is supplied.
  - AI analysis need only contribute to the review; the claim does not require autonomous AI decisions.
  - Reviewing many accounts does not by itself establish an intention to revoke many visas.
  - The reference to Axios identifies the claim's evidentiary basis. It is not a conditional antecedent.
support_condition: Reliable evidence establishes that, by the post date, the department intended many visa revocations, principally involving student protesters, with AI analysis of their social media contributing to the process.
contradiction_condition: Reliable evidence establishes that the department had no such intention, or that the intended program excluded AI analysis of social media, contemplated only isolated revocations, or principally targeted a different population.
measurement_requirements: Distinguish the population screened from the population intended for revocation. Establish the intended target group without equating all foreign students or all alleged Hamas supporters with student protesters.
source_requirements: Prefer official policy records or attributable statements. Credible contemporaneous reporting can establish reported intentions, but repeated accounts of the same anonymous sources are not independent confirmation.
