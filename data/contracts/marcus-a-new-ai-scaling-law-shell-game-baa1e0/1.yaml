explicit_source_elements:
  - the new ones
  - will eventually run out
  - scaling with how long you post-train a model
  - scaling with how long you let a given model wrestle with a given problem
evaluator_interpretation:
  - The forecast covers both post-training and inference-time scaling.
  - The ordinary reading is that extending these scaling approaches will eventually cease producing meaningful performance improvements.
  - A plateau for one model, task or implementation is relevant but does not by itself establish that both scaling approaches have run out.
  - The claim supplies neither a deadline nor a numerical definition of meaningful improvement.
support_condition: Public experiments establish sustained plateaus or breakdowns in both scaling relationships across meaningful task sets as compute increases, with enough controls to distinguish the claimed limits from a particular implementation's failure.
contradiction_condition: A decisive result establishes that the claimed eventual breakdown cannot occur within the stated scope. Continued gains over a finite compute range do not refute an eventual limit.
measurement_requirements: Measure performance across increasing post-training and inference-time compute budgets. Identify model, task, algorithm, uncertainty and whether a plateau persists when implementation problems are addressed.
source_requirements: Primary experimental reports with methods and results available by 2026-10-28.
