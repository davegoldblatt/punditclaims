evaluator_interpretation:
  - This is conditional on an actual end of the AI boom; it does not assert that the condition will occur.
  - "'The next week is crucial' is emphasis, not an explicit deadline for a collapse, particularly given the allowance for several more months."
  - Read 'sudden and violent' as an abrupt and severe financial contraction associated with the ending described in the post.
  - Use the post's own collapse markers rather than treating any technology-stock decline as the antecedent.
support_condition: An independently established ending under the post's markers occurs, and dated evidence shows an abrupt, severe contraction.
contradiction_condition: The antecedent occurs, but the documented ending is gradual or mild rather than sudden and severe.
measurement_requirements: Dated evidence of a qualifying collapse or significant public generative-AI capex retreat, followed by evidence of its speed and severity.
source_requirements: Company filings and announcements for collapse markers; independent reporting or market measurements for timing and severity.
