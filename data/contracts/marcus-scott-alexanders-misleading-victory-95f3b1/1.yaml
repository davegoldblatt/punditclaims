evaluator_interpretation:
  - This reports both model failures and Marcus's own testing experience. Independent failures alone cannot verify his elapsed testing time.
  - Compositional failures mean visible mismatches in requested objects, parts, attributes, counts, or relationships.
  - The immediate-response context places the reported testing in early July 2025 before publication. I use July 1–9 because no exact session date is supplied.
  - "'Many' means multiple distinct examples; no numerical minimum or exact duration is imposed."
support_condition: Independently inspectable session records establish multiple GPT-4o compositional image failures and show that Marcus elicited them within a few minutes.
contradiction_condition: Authenticated records of the reported sessions show that the alleged failures did not occur, involved a different model, or required substantially longer than the stated duration.
measurement_requirements: Original prompts, generated images, model identification, complete attempt sequence, and timestamps. Assess image compliance separately from elapsed time.
source_requirements: Authenticated session artifacts or independent verification of the reported sessions. Separate experiments can corroborate model limitations but cannot establish Marcus's timing.
