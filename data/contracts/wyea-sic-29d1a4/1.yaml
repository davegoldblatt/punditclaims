assessment_axis: causal_assessment
explicit_source_elements:
  - the story
  - has taken hold because it gets clicks
  - appeals to a fear that everyone
  - particularly those in the knowledge economy
evaluator_interpretation:
  - The claim attributes the spread of this particular AI job-loss narrative to engagement rewards and employment anxiety.
  - Everyone is read as ordinary rhetorical emphasis on widespread insecurity, not a literal claim that every person reports the same fear.
  - Because indicates material contributing causes, not necessarily the only causes.
  - The assessment concerns the narrative's spread through publication. Its starting date is not specified.
support_condition: Audience or editorial evidence links greater engagement with this particular narrative to employment fear, and shows that those engagement rewards materially contributed to further coverage.
contradiction_condition: Comparable evidence shows that the alleged fear-and-engagement mechanism did not materially contribute to the narrative's spread.
measurement_requirements: Story-specific engagement comparisons, audience measures of employment anxiety, and evidence linking engagement incentives to coverage decisions. General negativity effects alone are insufficient.
source_requirements: Publisher experiments or analytics, audience research, editorial records, or credible causal studies of this narrative.
