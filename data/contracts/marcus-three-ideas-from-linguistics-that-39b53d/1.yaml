evaluator_interpretation:
  - The claim proposes that prioritizing word prediction reduced work on theories connecting prediction to cognitive world models.
  - The hedge marks uncertainty about a causal proposition; it is not an antecedent that must occur.
  - The relevant history ends at the post. No starting date, institution, resource measure or amount of displacement is specified.
  - The existence of prediction research and gaps in theory would not, by themselves, establish displacement.
support_condition: Research histories, allocation records or documented project decisions show that prioritizing word prediction caused relevant theory work to receive less attention or support.
contradiction_condition: Evidence addressing the same research choices shows that prediction work did not displace the relevant theory work, or enabled more of it than would otherwise have occurred.
measurement_requirements: Identify what was displaced, the relevant allocation decisions and a defensible comparison with what would have happened without the prediction priority.
source_requirements: Documented project histories, funding or staffing decisions, or credible research-allocation studies covering the period before the post.
