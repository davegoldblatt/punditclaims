evaluator_interpretation:
  - "The comparison concerns the initial public releases before their first withdrawal: Tay in March 2016 and Galactica's hosted demo in November 2022."
  - I read the durations as approximate elapsed time, expressed in whole hours or days. The wording does not require precision to the minute.
  - The target interval covers two separate historical episodes, not continuous availability between them.
  - Counting three calendar dates inclusively is a possible alternative reading of 'three days', but it does not establish three elapsed days.
support_condition: Reliable records or contemporary reporting establish approximately 16 hours of initial public availability for Tay and approximately three days for Galactica's hosted demo.
contradiction_condition: Reliable records or contemporary reporting establish a materially different initial duration for either release. Withdrawal within 48 hours would contradict approximately three elapsed days, although it could span three calendar dates.
measurement_requirements: Measure from initial public availability to first withdrawal. Distinguish elapsed time from inclusive calendar-day counting, and hosted-demo withdrawal from discontinuation of the underlying model.
source_requirements: Prefer dated company launch and withdrawal records. Use contemporary reputable reporting where accessible primary records do not establish the duration; disclose conflicting reports.
