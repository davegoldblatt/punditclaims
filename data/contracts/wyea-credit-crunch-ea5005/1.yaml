assessment_axis: forecast_outcome
explicit_source_elements:
  - Once a public company
  - no longer be able to raise venture capital
  - over $95 billion in 2026
  - if it intends to raise even half that much
  - on a yearly basis
  - one of the largest issuers of junk-grade debt in history
evaluator_interpretation:
  - The first condition requires a completed public listing, not submission of an IPO registration statement.
  - The debt prediction additionally requires evidence of an intention to raise approximately $47.5 billion or more annually.
  - The $47.5 billion figure is half of the stated $95 billion reference amount; 'over' makes the literal threshold slightly higher.
  - Venture capital means financing from venture investors, not all equity financing.
  - No numerical historical rank is imposed on 'one of the largest'.
support_condition: After the conditions occur, financing records establish the claimed constraint on venture financing and actual junk-grade debt issuance at a demonstrably exceptional historical scale.
contradiction_condition: After listing, Anthropic completes venture financing alone at the stated scale, or under the additional fundraising condition its completed financing and debt records decisively establish an incompatible funding outcome.
measurement_requirements: Separate venture financing, public equity, corporate debt and supplier financing. Measure annual gross proceeds and actual issuance, not valuation or undrawn facilities; compare junk issuance on a consistent historical basis.
source_requirements: Listing records, company fundraising plans, financing disclosures, credit records and a documented historical issuance comparison.
