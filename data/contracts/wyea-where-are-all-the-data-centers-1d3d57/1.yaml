evaluator_interpretation:
  - Similar problems refers to compute capacity constraints in the preceding Anthropic sentence.
  - The forecast requires a capacity shortage after publication that construction delays materially caused.
  - Eventually supplies no deadline.
  - Slow construction is the predicted cause, not a separately stated conditional antecedent.
support_condition: A dated OpenAI capacity shortage, service restriction, or deployment limitation is credibly linked to delayed data center construction.
contradiction_condition: A decisive event makes the predicted future outcome impossible. Capacity growth or the absence of shortages over a finite interval cannot alone contradict an eventual forecast.
measurement_requirements: Identify the affected OpenAI workload, the unavailable capacity, the construction timetable, and the link between the delay and the operational constraint.
source_requirements: Prefer operational disclosures from OpenAI or infrastructure partners. Reputable reporting may establish the event when primary documentation is unavailable.
