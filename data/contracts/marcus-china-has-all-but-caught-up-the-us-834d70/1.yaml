evaluator_interpretation:
  - The assessable proposition is the financial observation. The suggested purchase price and the judgment that it is generous are not treated as financial measurements.
  - The ordinary reading of money-losing ventures is company-wide net losses, including the costs of developing and running the business.
  - "For the ongoing observation, I use April through June 2026: the latest completed calendar quarter that reporting could cover before the July 20 post. This is an evaluator-selected reporting window, not a period Marcus specified."
  - The industry is read as frontier generative-AI developers. Sustained profitability requires repeated company-wide profits, rather than revenue growth, positive gross margins, or a single adjusted profitable quarter.
  - The supplied passage identifies no financial source or accounting basis. The contract therefore retains unknown accounting basis, which prevents a supported or contradicted score under the supplied rules.
support_condition: Comparable company-wide results establish net losses at both companies for the target period, with sufficient sector evidence to substantiate the lack of demonstrated sustained profitability. The accounting-basis ambiguity must first be resolved from source context.
contradiction_condition: Comparable results establish company-wide profitability at either named company, or clear sustained profitability across the relevant frontier-model sector. Operating or adjusted profits alone do not refute the net-loss reading, and the accounting-basis ambiguity must first be resolved.
measurement_requirements: Separate net income, operating income, adjusted measures, and cash flow. Require matching periods and accounting bases for each company. Define sector coverage and a sustained-profitability test before drawing an industry-wide conclusion.
source_requirements: Prefer company financial statements or filings. Where unavailable, use credible reporting that identifies the period and profit measure. Later disclosures may establish earlier results if published by October 28, 2026.
