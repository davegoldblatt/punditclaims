assessment_axis: historical_observation
explicit_source_elements:
  - coding agents
  - by extension most of generative AI
  - can’t reliably follow rules
  - can’t be trusted. Period.
evaluator_interpretation:
  - The surrounding discussion concerns system-prompt instructions and guardrails, especially restrictions intended to prevent harmful actions.
  - The ordinary factual reading is that these instructions are not dependable enforcement across coding agents and most generative AI systems.
  - Reliability is not interpreted as mathematical perfection. Repeated consequential failures matter, but one failure does not establish general unreliability.
  - The extension to 'most' requires coverage beyond one product or one specially constructed task family.
  - Assess capabilities reported during April 1–27, the current month before publication. The categorical conclusion about trust is a judgment, not a separately measurable outcome.
support_condition: Representative evaluations show repeated material violations of explicit high-priority rules across coding agents and a defensible majority of relevant generative AI systems under realistic operating conditions.
contradiction_condition: Representative evaluations establish dependable adherence to relevant rules across coding agents and most generative AI systems, including meaningful adversarial and operational testing.
measurement_requirements: Specify models, instructions, tasks, failure rates, consequences, and defenses. Distinguish ordinary instruction following, adversarial conflict resolution, and enforcement by external software.
source_requirements: Prefer reproducible multi-model evaluations and dated operational records. Isolated anecdotes cannot establish the majority claim.
