explicit_source_elements:
  - Anthropic and OpenAI
  - burn billions of dollars a year
  - margins that get worse over time
  - absolutely no path to profitability
evaluator_interpretation:
  - The normalized financial proposition is assessed; the separate assertion about a majority of media coverage is not included.
  - Annual burn refers to cash consumption, not accounting net losses or gross spending.
  - For the ongoing annual assertion, 2025 is the latest completed calendar year before the post. Margin trends require a comparable 2024 baseline.
  - Margins ordinarily means profit as a share of revenue, but the speaker does not specify gross, operating, net, or adjusted margins.
  - No path to profitability is read as an assertion about the business economics then available, not as a forecast that the companies can never become profitable.
  - The supplied financial assertion names no source or accounting basis; the contract basis remains unknown.
support_condition: Comparable records show each company consuming multiple billions of dollars annually, worsening margins on a consistent basis, and no economically substantiated route to profitability under the business conditions described.
contradiction_condition: Comparable records materially contradict annual cash consumption or margin deterioration, or establish an economically substantiated profitability route that defeats the categorical assertion.
measurement_requirements: Separate annual cash-flow measures and consistent margin series for each company, plus explicit revenue, cost, and financing assumptions for any profitability route.
source_requirements: Financial statements where available; otherwise clearly attributed financial reporting. Forecast profitability must not be treated as realized profitability.
