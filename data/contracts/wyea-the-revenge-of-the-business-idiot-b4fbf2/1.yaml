assessment_axis: forecast_outcome
explicit_source_elements:
  - I believe
  - the vast majority
  - these data centers
  - go unused and/or unfinished
evaluator_interpretation:
  - The natural reference is the AI data-center buildout discussed immediately above, especially projects associated with Microsoft, Google, Meta and Amazon.
  - "Freeze the project population at publication: projects then planned or under construction, excluding later announcements."
  - Count projects rather than dollars or megawatts because the sentence refers to data centers.
  - Read 'go unused and/or unfinished' as an ultimate project outcome, not ordinary construction work in progress or temporary vacancy.
  - "'Vast majority' means an overwhelming majority. Do not silently replace it with a bare majority or an invented precise percentage."
  - "'I believe' expresses confidence, not an antecedent condition. No deadline is stated."
support_condition: A defensible register of the publication-date cohort ultimately shows an overwhelming majority permanently abandoned before completion or retired without meaningful operational use.
contradiction_condition: A defensible register shows enough of that same cohort completed and meaningfully used that an overwhelming majority cannot have gone unfinished or unused; completion and use of more than half would suffice.
measurement_requirements: A fixed, deduplicated project register, dated construction and cancellation records, and evidence of actual operation. Separate phases, relocations and renamed projects consistently.
source_requirements: Permits, operator disclosures, utility connections and independent utilization records. Announcements and preleases alone are insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: "Resolve only when irreversible outcomes settle the fixed cohort: permanent abandonment or retirement without use for an overwhelming majority, or verified completion and meaningful use of more than half. Delays, temporary vacancies and preleases do not qualify."
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical definition of 'vast majority'.
  - The exact project cohort and geographic scope are unspecified.
  - Projects versus buildings, phases or campuses is unspecified.
  - No minimum operational-use duration is supplied.
