explicit_source_elements:
  - Sam Altman has acknowledged
  - wanting to train
  - everyone's personal documents
  - Word files, email etc
evaluator_interpretation:
  - The claim attributes a public statement to Altman made by August 7, 2024.
  - I read 'everyone's' as users generally, without adding a claim that participation would be compulsory.
  - Training on personal documents is distinct from accessing documents through retrieval or a context window.
  - Discussing a possible future does not by itself establish an acknowledged intention to implement it.
support_condition: A dated statement by Altman explicitly expresses a desire or intention for AI to learn through training on users' personal documents and email.
contradiction_condition: An authoritative correction or the complete attributed statement establishes that Marcus materially reversed or misrepresented what Altman said. Failure to locate a matching statement alone is insufficient.
measurement_requirements: Check the statement's wording and surrounding discussion, including distinctions between training, access, personalization, and user choice.
source_requirements: Prefer recordings, original interview transcripts, or reporting by the institution that hosted the statement.
