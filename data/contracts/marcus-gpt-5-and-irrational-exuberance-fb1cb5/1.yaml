horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only upon a documented GPT-5-driven intelligence explosion, or decisive evidence closing GPT-5's possible role in initiating one. Release without such an event is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Singularity has no specified operational definition.
  - Mark could mean coincide with, initiate, or constitute.
  - No deadline or observation window is supplied.
