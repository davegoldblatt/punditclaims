  start: 2024-01
  end: 2024-12
  precision: month
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No period named; calendar 2024, the year containing the post, is used because OpenAI publishes no quarterly figures
  - "'far from break-even' has no numeric threshold"
  - "'burning capital' could mean cash burn or accounting loss"
