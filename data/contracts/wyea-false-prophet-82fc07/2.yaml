assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT is a damned expensive product to operate
  - the company burning through capital at a prodigious rate
  - OpenAI is aggressively monetizing it (both to consumers and to businesses)
  - far from crossing the break-even rubicon
evaluator_interpretation:
  - "Plain reading: in mid-2024, OpenAI's costs, including the compute that runs ChatGPT, were large compared with its revenue. It was losing billions a year, and losses were far above zero compared with revenue."
  - He describes an ongoing state at the post date (June 2024) without naming a period. OpenAI is private and publishes no quarterly results. The nearest period public evidence reports on is calendar 2024, the year that contains the post. I use that year.
  - "'Far from break-even' is met if losses are a large share of revenue, for example annual losses on the order of revenue or more. Being only slightly below break-even would contradict it."
  - "'Burning through capital' is read as large losses and cash outflows paid for by outside funding. It does not require a separate cash-flow statement."
  - The monetization part ('aggressively monetizing') is his framing. It is not decisive; the testable core is high costs and a large loss.
support_condition: Credible reporting or financial statements show OpenAI's 2024 costs well above revenue and losses in the billions, roughly as large as revenue or larger.
contradiction_condition: Evidence shows OpenAI near or at break-even in 2024, or with losses small compared with revenue.
measurement_requirements: Net loss or operating loss compared with revenue for OpenAI in calendar 2024, plus operating cost or compute cost figures.
source_requirements: Company financial statements, or reputable news reports of company documents. OpenAI files no public statements, so press reports of its internal figures are acceptable.
metric_scope:
  company: OpenAI
  metric: operating costs and net loss relative to revenue
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
