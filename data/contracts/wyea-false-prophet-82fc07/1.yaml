  - burning through capital at a prodigious rate
  - aggressively monetizing it
  - far from crossing the break-even rubicon
evaluator_interpretation:
  - The plain reading is that operating ChatGPT is costly and OpenAI has a substantial financial deficit despite charging customers.
  - The statement describes an ongoing state without a reporting period. I use January through March 2024, the latest completed calendar quarter that public financial reporting could cover before the post.
  - Cash burn, operating loss, and net loss are separate measures; none substitutes automatically for the others.
  - The claim supplies no financial source or accounting basis. Its accounting basis is therefore unknown, which prevents a supported or contradicted money assessment under the supplied rules.
support_condition: Matched actual financial records show substantial ChatGPT operating costs, substantial OpenAI cash consumption, and a large deficit relative to revenue during the target quarter.
contradiction_condition: Matched records show low operating costs relative to revenue, little cash consumption, and operations at or near break-even during the target quarter.
measurement_requirements: Separate actual revenue, product operating costs, cash flow, and profitability measures for the same period, with defined accounting treatment.
source_requirements: Company financial statements or independently verified financial records. Later annual forecasts and earlier losses are context only.
