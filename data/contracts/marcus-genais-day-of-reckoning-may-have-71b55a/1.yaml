assessment_axis: historical_observation
explicit_source_elements:
  - most are losing money
  - few have made any profits at all
  - GenAI model building companies
evaluator_interpretation:
  - The plain reading is that a majority by company count were loss-making, and only a small minority had ever earned bottom-line profits.
  - "For current losses, I use the latest completed annual reporting period before publication: calendar 2024, or the corresponding company fiscal year."
  - The historical profits clause additionally requires earlier records through the post date; a single annual loss cannot establish that a company never profited.
  - The source does not indicate an accounting basis or clearly define the company population.
support_condition: Comparable records for a defined representative population establish losses at a majority in the target period and prior profits at only a small minority.
contradiction_condition: Comparable records establish that a majority were not loss-making in the target period, or that prior profits were widespread rather than confined to a small minority.
measurement_requirements: Company-count coverage, bottom-line results for the target year and historical profitability records. Parent-company, model-business, operating-income and cash-burn measures must remain distinct.
source_requirements: Financial statements and credible financial reporting available by the evaluation date, including later disclosures of target-period results.
