assessment_axis: causal_assessment
explicit_source_elements:
  - It only caught fire
  - because the media insisted it did so
evaluator_interpretation:
  - It refers to ChatGPT, and caught fire means its rapid rise to widespread adoption and public attention.
  - Only because is read as claiming that media insistence was necessary for the takeoff, rather than merely helpful.
  - The historical scope runs from launch through the post, with attention to the initial adoption surge.
  - Professional news coverage is distinguished from ordinary users sharing experiences on social media.
support_condition: Credible causal evidence shows that ChatGPT would not have experienced its takeoff without media promotion of its importance.
contradiction_condition: Credible causal evidence establishes that comparable takeoff occurred independently of that media promotion.
measurement_requirements: Measure adoption and exposure over time, distinguish news coverage from user sharing, and address reverse causation and other adoption drivers. Correlation or temporal ordering alone is insufficient.
source_requirements: Acquisition records, credible causal studies, or unusually decisive historical evidence separating media influence from product access, usefulness, and user sharing.
