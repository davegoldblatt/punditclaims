explicit_source_elements:
  - Generative AI
  - has never been reliable
  - has always been unprofitable
  - has always been unsustainable
evaluator_interpretation:
  - "The ordinary reading concerns generative AI broadly: dependable operation in normal use and an ability to cover the full costs of providing it."
  - The financial context makes economic sustainability the principal reading, although the word could also include environmental sustainability.
  - "'Never' and 'always' describe the history before publication. The starting date is unspecified; February 2024 dates his commentary, not necessarily the asserted history."
  - A profitable individual provider challenges an exceptionless reading, but does not establish aggregate sector profitability.
  - The statement about how long he has been saying this is not treated as evidence for the underlying claims.
support_condition: Historical evidence establishes persistent unreliability in ordinary uses and sector-wide losses after full costs, together with a defined failure of economic sustainability.
contradiction_condition: Comparable evidence establishes dependable ordinary operation or sector-wide profitability and self-financing during the claimed history. A provider-level exception is decisive only under an explicitly universal provider-by-provider reading.
measurement_requirements: Specify the relevant uses, acceptable error rates, sector boundary, full-cost profit measure and meaning of sustainability. Benchmark accuracy, provider profit and sector profit are different measures.
source_requirements: Use dated reliability evaluations and financial records covering the period before publication. Provider statements should be identified as self-reported.
