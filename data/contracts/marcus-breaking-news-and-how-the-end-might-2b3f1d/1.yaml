explicit_source_elements:
  - Anthropic has taken a lot of the business market
  - OpenAI has lost a lot of it
evaluator_interpretation:
  - The plain reading concerns relative enterprise market share, not necessarily falling customer counts or revenue.
  - I interpret the business market as enterprise purchases and use of foundation-model services, including APIs.
  - The surrounding comparison with a few years ago supports a trend beginning around 2023 and ending before the post.
  - Large movements in market share count as substantial; Marcus supplies no numerical threshold.
  - This is a market-share claim, not a claim about either company’s recognized revenue.
support_condition: A credible enterprise market-share series shows a substantial Anthropic gain and substantial OpenAI share loss over the comparison period.
contradiction_condition: Comparable enterprise market-share measurements show no substantial Anthropic gain or no substantial OpenAI share loss.
measurement_requirements: Keep enterprise API share, business adoption rates and absolute revenue distinct. Do not infer customer switching from aggregate share movements.
source_requirements: Prefer original enterprise surveys or transaction datasets, identifying their population and any financial interest of the publisher.
