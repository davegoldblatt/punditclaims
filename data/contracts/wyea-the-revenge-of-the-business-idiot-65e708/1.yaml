explicit_source_elements:
  - tens of gigawatts of data centers being developed
  - require around $380 billion in annual revenue
  - to substantiate
  - a big fucking problem
evaluator_interpretation:
  - This is a present assessment of the economics of the development pipeline, not a forecast that operators will earn $380 billion.
  - Substantiate means economically justify the investment after operating costs, hardware replacement and a reasonable capital return.
  - The observation period is January 1 through May 25, 2026, covering the ongoing development pipeline described before publication.
  - The annual revenue requirement is a modeled recurring amount; no realization year is supplied.
  - The statement that this is a big problem is evaluative and is excluded from the numerical test.
support_condition: An identified development pipeline totaling tens of gigawatts and a transparent, defensible financial model yield approximately $380 billion of required recurring annual revenue.
contradiction_condition: A comparable inventory and financial model for the same facilities, capacity basis and return requirements show a materially different revenue requirement or disprove the stated development scale.
measurement_requirements: Identify sites and development stages; distinguish facility power from critical IT power; disclose construction, hardware, replacement, utilization, operating and financing assumptions; distinguish operator revenue from end-user spending.
source_requirements: Dated capacity inventories and primary project disclosures, paired with reproducible financial models. Different-scope industry estimates are context only.
