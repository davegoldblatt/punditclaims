assessment_axis: historical_observation
explicit_source_elements:
  - More recently
  - apparently shifted towards defining AGI purely in terms of profits
  - according to The Information
  - Microsoft and OpenAI are considering
  - $100 billions in profits
evaluator_interpretation:
  - "Preserve the qualifications: Marcus describes an apparent shift and reported consideration, not a confirmed replacement of OpenAI's definition."
  - Test whether the companies were considering a profit-only AGI definition with the stated threshold. The existence of an article alone does not establish that substantive claim.
  - An already agreed contractual trigger is relevant but does not by itself establish contemporaneous consideration of a broader definition. Conversely, an existing capability-based public definition does not rule out a proposed change.
  - For the ongoing state described immediately before the January 7 post, use December 2024, the most recent completed month. This is an observation period, not a period over which profits must be earned.
  - The monetary figure is a proposed definitional threshold attributed to press reporting. Do not assume annual profits, realized profits, a particular accounting standard, or a specified profit accumulation period.
support_condition: Reliable evidence establishes that, in December 2024, Microsoft and OpenAI were considering making $100 billion in profits the sole criterion for AGI, and supports the apparent shift Marcus describes. Evidence must distinguish that proposal from an existing contractual condition governing Microsoft’s rights.
contradiction_condition: "Reliable evidence establishes that the reported proposal was materially misdescribed: for example, the companies explicitly rejected a profit-only definition, or the complete relevant records establish that the figure concerned only a contractual condition and that no such definitional shift was under consideration. A continuing public capability definition alone is insufficient."
measurement_requirements: Identify what the $100 billion measures, whether earning it or being capable of earning it is required, and whether it defines AGI or triggers contractual rights. No calculation of actual company profits is needed.
source_requirements: Prefer the agreement, investor documents, negotiation records, or dated statements from the companies. Reporting based on documents can inform the assessment, but distinguish original reporting from summaries and do not treat repetition as independent confirmation.
