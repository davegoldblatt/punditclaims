  - many people that dick around with ChatGPT
  - years since it launched
  - we still can't find a clean way to say what it does or why it matters
  - other than the fact that everybody agreed it did
evaluator_interpretation:
  - "The sentence is the author's judgement about public discussion: no one has found a 'clean way' to describe ChatGPT's function or importance."
  - "'Clean way to say' names no measure. No fact could show that a description is or is not 'clean' to the author's satisfaction, so the claim is treated as rhetorical and normative."
  - The narrower factual question of whether people use ChatGPT for specific tasks is covered under claim wyea-the-era-of-the-business-idiot-a7886c.
support_condition: Not adjudicable. Support would need an agreed test showing that no clear account of ChatGPT's function or value existed by May 2025. No such test exists.
contradiction_condition: Not adjudicable. Clear descriptions and usage data exist, but they cannot settle whether the author or 'we' find them a 'clean way to say' what it does.
measurement_requirements: null
source_requirements: Would need a shared standard for what counts as a clear account of a product's function. None exists.
