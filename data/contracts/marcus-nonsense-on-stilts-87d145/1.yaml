evaluator_interpretation:
  - The program is Eugene Goostman, and the assessment concerns its legacy from 2014 through June 12, 2022.
  - Assess the firm contribution claim. The preceding 'I doubt' statement about name recognition is a separate hedged aside.
  - An ordinary lasting contribution includes substantive reuse of its technology in later AI systems or enduring research advances attributable to it. It need not transform the entire field.
  - Publicity, museum display and citations alone do not establish a lasting technical contribution.
support_condition: Credible historical evidence establishes that the system left no enduring technical or research contribution during the period; absence of search hits alone is insufficient.
contradiction_condition: Documented subsequent adoption of Eugene Goostman's code or methods, or a substantive enduring research contribution, establishes a nonzero legacy by June 12, 2022.
measurement_requirements: Trace a specific technical or research contribution to Eugene Goostman and date the downstream use. Separate technical reuse from publicity and general chatbot development.
source_requirements: Primary developer accounts, implementation records, software histories or research papers documenting downstream use. Retrospective sources must clearly date the relevant events.
