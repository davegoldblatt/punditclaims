assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI
  - currently spends $2.35 to make $1
evaluator_interpretation:
  - Assess the OpenAI ratio, not the separate statement about Microsoft's losses.
  - The linked explanation derives the ratio from press estimates of calendar-2024 revenue and losses. Assess it on that estimate basis.
  - Read 'spends' as expenses implied by the reported loss calculation, not marginal inference costs or a cash-flow measure.
  - Treat $2.35 as rounded to the nearest cent. The full-year flow classification does not mean these estimates were already realized when published.
support_condition: The contemporaneous 2024 revenue and loss estimates imply expenses per dollar of revenue that round to $2.35.
contradiction_condition: Comparable estimates on the same period and accounting scope imply a materially different ratio.
measurement_requirements: Use revenue and losses for the same calendar year and estimate basis. Calculate implied expenses as revenue plus losses, while preserving disclosed exclusions.
source_requirements: Prefer public financial records. If unavailable, use reputable reporting that identifies or independently confirms the financial estimates.
metric_scope:
  company: OpenAI
  metric: Estimated expenses implied by reported losses divided by revenue
  currency: USD
  units: USD of expenses per USD of revenue
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
