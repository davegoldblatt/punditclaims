ambiguity_flags:
  - All code could be misread as every possible program rather than complete authorship of a project.
  - Good and useful have no specified thresholds.
  - The three cautions are read as a denial of an automatic satisfactory outcome, not three quantified predictions.
  - The current-month observation period is an evaluator choice because no period is named.
