early_resolution_rule: A documented OpenAI payment failure followed by attributable severe distress at Oracle settles the forecast in support. A completed resolution of that failed exposure without severe distress can contradict it.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No numerical definition of massive leverage.
  - Severe trouble is expressed colloquially.
  - No deadline or response lag.
  - The proportion of borrowing attributable specifically to OpenAI is unspecified.
retrospective_or_prospective: retrospective
