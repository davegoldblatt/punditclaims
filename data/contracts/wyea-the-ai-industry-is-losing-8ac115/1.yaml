assessment_axis: forecast_outcome
explicit_source_elements:
  - Oracle has massively leveraged itself
  - for the benefit of one company, OpenAI
  - if that company can’t pay its bills
evaluator_interpretation:
  - The condition means OpenAI cannot meet material compute payments owed to Oracle. A revenue shortfall or falling share price does not establish that condition.
  - The predicted consequence means severe financial distress at Oracle attributable to that payment failure, such as default, distressed restructuring, or loss of investment-grade financing.
  - The surrounding FY2026 debt figures provide historical background. They do not independently establish that Oracle's survival depends on OpenAI.
  - No deadline or delay between payment failure and distress is supplied.
support_condition: After a documented OpenAI payment failure, Oracle experiences severe financial distress materially caused by its OpenAI exposure.
contradiction_condition: Following a documented OpenAI payment failure, Oracle resolves or absorbs the affected exposure without severe financial distress. Temporary survival alone is insufficient.
measurement_requirements: Identify the missed obligations, their materiality, Oracle's exposure and recoveries, and subsequent liquidity, debt-service and refinancing outcomes. Separate existing indebtedness from borrowing attributable to OpenAI.
source_requirements: Oracle filings, creditor or rating-agency records, and documented payment failures. Reports of financial risk alone cannot establish the condition.
metric_scope:
  company: Oracle
  metric: Debt and leverage associated with OpenAI exposure
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: fiscal
