assessment_axis: forecast_outcome
explicit_source_elements:
  - Getting to AGI
  - will require new ideas
  - not just new code optimizations
evaluator_interpretation:
  - Use Marcus's accompanying definition of broad autonomous human-level capability.
  - New ideas means substantive conceptual or methodological advances beyond making existing implementations more efficient, relative to June 5, 2026.
  - Require expresses necessity. Finding new ideas in one successful system would not alone establish that they were necessary.
  - The claim supplies no deadline.
support_condition: An established AGI and credible technical evidence show that substantive new ideas were necessary, or a valid general result establishes that code optimization alone cannot suffice.
contradiction_condition: An independently substantiated AGI is achieved solely through code optimization of methods already available at publication, with sufficiently complete development records to establish that route.
measurement_requirements: Establish both the claimed capability and its development route. Distinguish new ideas being used from their being necessary.
source_requirements: Independent capability evaluations and detailed technical development accounts; a necessity claim additionally needs evidence excluding the optimization-only route.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve upon a dated, independently substantiated AGI achievement with development evidence meeting the support or contradiction condition, or a valid general necessity result. Benchmark success or an AGI announcement alone does not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - The boundary between a new idea and code optimization is unspecified.
  - The claim requires necessity, which is stronger than observing a successful development route.
retrospective_or_prospective: retrospective
