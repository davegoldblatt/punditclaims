assessment_axis: historical_observation
explicit_source_elements:
  - Blackstone
  - has staked its entire future
  - on whether AI works out
evaluator_interpretation:
  - The plain reading is that Blackstone's continued viability depends on its AI investments succeeding. Having substantial AI investments or treating AI as a major growth opportunity is insufficient.
  - The claim describes an existing dependence, rather than predicting a dated failure.
  - Use April–June 2026, the latest reported quarter before the October 20 post. Blackstone scheduled its third-quarter investor call for October 22.
  - This is a qualitative claim about strategic dependence, with no specified financial amount, ratio or accounting measure. Accordingly, metric_scope is null.
  - The description of the company as evil is a value judgment outside the normalized proposition.
support_condition: Evidence establishes that Blackstone's AI exposures, obligations and earnings dependence were sufficient to threaten the firm's continued viability if those investments failed.
contradiction_condition: Evidence establishes that independent businesses, financial resources and limits on firm-level obligations would preserve Blackstone's continued viability despite failure of its AI investments.
measurement_requirements: Distinguish Blackstone Inc.'s own exposure from assets managed for investors. Assess AI dependence across businesses, including guarantees, capital commitments, fee income and indirect losses. Neither portfolio size nor the existence of multiple business segments alone settles viability.
source_requirements: Contemporaneous filings and company disclosures, supplemented where necessary by credible independent analysis of firm-wide exposure and downside resilience. Evidence must have been available by October 28, 2026.
