assessment_axis: causal_assessment
explicit_source_elements:
  - hyperscaler cashflows are deteriorating
  - negative in the case of Google and Amazon
  - making further capex contingent on debt
  - AI revenues are not covering their costs
evaluator_interpretation:
  - Read cashflows as free cash flow after capital expenditures, because the passage concerns funding further capital spending.
  - Use the quarter ended June 30, 2026 for the named calendar-year reporters, the latest completed quarterly reporting period available before the post. Earlier quarters provide comparison context.
  - Google refers to consolidated Alphabet, rather than an undisclosed Google-only cash-flow statement.
  - Contingent on debt means that the planned additional spending requires borrowing after considering operating cash, liquid assets and other funding sources.
  - Assess the full causal chain. Negative free cash flow alone does not establish that AI operations lose money or that borrowing is necessary.
  - The speaker does not specify an accounting basis; retain unknown rather than assign one from the evidence.
support_condition: Comparable reports establish deteriorating free cash flow, negative quarterly free cash flow at Alphabet and Amazon, AI revenues below attributable costs, and a financing gap that makes planned further capex dependent on debt.
contradiction_condition: Comparable records refute a necessary factual premise or establish that the asserted funding dependence or AI operating deficit does not hold.
measurement_requirements: Separate operating cash flow from free cash flow, quarterly figures from trailing-year figures, capital purchases from operating expenses, and borrowing activity from borrowing necessity.
source_requirements: Company cash-flow statements, capital budgets, liquidity and financing disclosures, and separately identified AI revenue and cost records.
metric_scope:
  company: Hyperscalers, including Alphabet and Amazon, assessed separately
  metric: Free cash flow after capital expenditures and its relationship to capex financing
  currency: USD
