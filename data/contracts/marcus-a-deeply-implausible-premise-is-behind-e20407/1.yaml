assessment_axis: historical_observation
explicit_source_elements:
  - For all intents and purposes
  - the race is basically a tie
  - both countries serving many of their own customers
  - using largely similar products
evaluator_interpretation:
  - "The plain reading is practical parity in commercially available generative AI: both countries have substantial domestic adoption and broadly comparable products, without a large advantage in their usefulness."
  - Customers includes users of free services; the wording does not require paying customers or equal market shares.
  - Similar products means comparable functions and practical capabilities, not identical models or identical benchmark scores.
  - The context concerns LLM-based services. I do not expand the claim to equality in chips, investment, military applications, or all AI research.
  - For this ongoing observation, I use the current calendar quarter through publication, October 1–December 13, 2025, as the reporting window. Later publications can supply retrospective evidence, but later developments cannot settle the claim.
  - The adjacent prediction about leads changing hands is not part of this observation.
support_condition: Evidence within the target period establishes substantial domestic use in both countries, broadly comparable available products, and no large, practically consequential capability advantage across representative uses.
contradiction_condition: Evidence within the target period establishes that either country lacked substantial domestic use or comparable products, or that one country's available systems had a large practical capability advantage across representative uses. A narrow benchmark lead alone is insufficient.
measurement_requirements: Use country-specific adoption evidence, dated product availability and feature descriptions, and comparisons of contemporaneous leading systems across representative tasks. Distinguish downloads from active users and benchmark performance from practical usefulness.
source_requirements: Prefer independent evaluations and adoption measurements, supported by dated company documentation. Company performance claims require qualification. Sources must have been available by October 28, 2026.
