assessment_axis: forecast_outcome
explicit_source_elements:
  - Assuming everything exists in a vacuum
  - OpenAI needs
  - at least $5 billion in new capital a year
  - to survive
evaluator_interpretation:
  - The qualification holds the July 2024 revenue and spending assumptions fixed. This is a conditional financing requirement, not a prediction of how much investors will provide.
  - New capital means external funding required after accounting for operating cash flows, existing usable cash and previously committed funding.
  - The surrounding discussion bases the figure on press estimates. An estimated operating loss is not automatically an equal cash shortfall.
support_condition: A cash-flow and financing reconciliation under the stated unchanged assumptions establishes a recurring requirement for at least $5 billion of new external capital annually.
contradiction_condition: A comparable reconciliation establishes that OpenAI could maintain those operations with less than $5 billion of new external capital annually.
measurement_requirements: Distinguish operating losses, net losses, cash burn, cloud credits, opening cash, existing funding commitments and additional capital required. Do not annualize a partial year without justification.
source_requirements: Company financial records or reputable reporting that explains the relevant cash flows and financing assumptions.
