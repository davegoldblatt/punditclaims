evaluator_interpretation:
  - The claim describes the government actions announced February 27 and their status when Marcus posted February 28.
  - Permanently means an exclusion announced without a future reinstatement date, rather than an order that no court or government could ever reverse.
  - Declare includes a public directive to designate Anthropic. It does not necessarily mean the subsequent statutory paperwork was already complete.
  - Punitively means a retaliatory exclusion extending beyond rejection of proposed contract terms.
  - Absurdly is an evaluative judgment and is not independently scored.
support_condition: Government records establish an announced permanent exclusion and supply-chain-risk directive beyond contract rejection, with evidence supporting the punitive characterization.
contradiction_condition: Records establish only rejection of contract terms, no supply-chain-risk declaration, or an explicitly temporary exclusion with planned reinstatement.
measurement_requirements: Distinguish the announced exclusion, transition period, formal designation, and later judicial relief.
source_requirements: Government directives and court records, checked against contemporaneous disclosures.
