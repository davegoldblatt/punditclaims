assessment_axis: historical_observation
explicit_source_elements:
  - Coreweave bonds have reached 15%
  - suggesting that credit markets have had enough
  - Oct 13, 2026
evaluator_interpretation:
  - The ordinary reading of 15% is a secondary-market bond yield, expressed as an annual rate, rather than a coupon, bond price, or credit spread.
  - The claim means at least one CoreWeave bond reached approximately 15%; it does not require every issue to have that yield.
  - The whole-percentage figure permits ordinary rounding to 15%. An intraday high qualifies because Marcus says 'have reached', rather than specifying a closing yield.
  - The embedded October 13 market post and October 14 publication establish the target period as October 13–14, 2026.
  - The estimate basis reflects the third-party market commentary cited in the post. Currency is null because the asserted yield is a percentage and Marcus specifies no currency.
  - "'Suggesting that credit markets have had enough' is a hedged interpretation of the yield. It is not treated as a separate firm assertion that all credit became unavailable."
support_condition: Dated market data or reliable reporting establishes that a CoreWeave bond's secondary-market yield reached approximately 15% during October 13–14, 2026.
contradiction_condition: Reliable coverage of the relevant issues and intraday trading establishes that none reached approximately 15%, or a substantiated correction establishes that the cited figure was not a CoreWeave bond yield.
measurement_requirements: Establish the observation date, issuer, bond issue where available, and yield measure. Distinguish intraday highs from closing observations. A single lower closing yield cannot disprove an earlier high.
source_requirements: Prefer dated transaction or market-data records. Use reputable contemporaneous reporting where accessible primary trading records cannot be obtained, and disclose that limitation.
