  - short-lived, uninstalled GPUs
  - In Fiscal Year 2025
  - In Fiscal Year 2026
evaluator_interpretation:
  - The claim concerns the acquisition cost of GPUs remaining uninstalled, rather than total equipment purchases or depreciated carrying value.
  - Use June 30, 2026, the endpoint of the fiscal years used in the calculation, as the inventory measurement date. This is the latest completed reporting period before publication.
  - The acquisition cohort is FY2025–FY2026. An estimate needs a defensible reconciliation of GPU purchases and installations; adding spending categories does not establish the remaining inventory.
  - Treat $106.7 billion as approximate. Do not impose an unstated numerical tolerance.
support_condition: A credible reconciliation identifies approximately $106.7 billion of Microsoft GPUs purchased during FY2025–FY2026 and still uninstalled at June 30, 2026, after excluding CPUs and other equipment.
contradiction_condition: Comparable purchasing and installation records establish an uninstalled GPU value materially incompatible with $106.7 billion, allowing for reasonable estimation uncertainty.
measurement_requirements: GPU-specific acquisition costs, installation dates, transfers, returns and disposals, reconciled to the same acquisition cohort and inventory date.
source_requirements: Microsoft records or an independently documented estimate with identifiable inputs. Aggregate capital expenditures and capacity in gigawatts are insufficient alone.
