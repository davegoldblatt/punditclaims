assessment_axis: forecast_outcome
explicit_source_elements:
  - As these generative AI companies become more desperate
  - they'll (intentionally or otherwise) ingest AI-generated content
  - causes a degenerative training effect
  - destroys the model's ability to deliver useful answers
evaluator_interpretation:
  - The antecedent means a demonstrated shortage of suitable training data that drives companies to use generated content.
  - The outcome requires a company model to lose its practical usefulness because of that training choice. A small performance decline or an artificial laboratory collapse is insufficient.
  - Synthetic-data use alone does not establish the scarcity condition or the predicted destruction of usefulness.
support_condition: Documented scarcity-driven ingestion of generated data is followed by a substantial loss of usefulness, with evaluations establishing that the ingestion caused the collapse.
contradiction_condition: After the antecedent is established, evidence conclusively breaks the asserted causal chain for the relevant company models. Continued performance over a finite interval alone cannot disprove an undated future collapse.
measurement_requirements: Identify the affected models, data shortage, training-data changes, before-and-after usefulness, and causal controls separating synthetic-data effects from other changes.
source_requirements: Company training disclosures plus independent evaluations or controlled studies tied to the actual affected models.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve in support if a documented company-model collapse satisfies the scarcity, ingestion, causation, and loss-of-usefulness requirements. Laboratory demonstrations alone do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Desperation has no observable threshold.
  - No company, model, deadline, or number of training generations is specified.
  - The amount and treatment of generated training data are unspecified.
  - Destroys usefulness has no benchmark threshold.
retrospective_or_prospective: retrospective
