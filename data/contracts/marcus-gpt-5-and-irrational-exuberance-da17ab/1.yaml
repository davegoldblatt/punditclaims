assessment_axis: historical_observation
explicit_source_elements:
  - very little of what GPT-4 does
  - fully replicable
  - Sometimes summarization (aka compression) works
  - sometimes it doesn’t
evaluator_interpretation:
  - Replicability means reliably reproducing successful task performance under comparable conditions, rather than producing identical wording.
  - The claim combines a broad assertion about GPT-4's capabilities with a narrower assertion about summarization failures.
  - I use March 2023 through the post date as the latest reporting window for the initial GPT-4 release. Later model versions do not establish its condition then.
  - I do not assign an unstated numerical cutoff to 'very little'.
support_condition: Repeated evaluations of the contemporary GPT-4 model show that reliable successes are uncommon across a reasonably broad selection of tasks, including both successful and failed summarization attempts.
contradiction_condition: Comparable repeated evaluations establish reliable success across a substantial breadth of contemporary GPT-4 capabilities, inconsistent with successes being only rare exceptions.
measurement_requirements: Identify the model version, prompts, sampling settings, repeated trials, task selection, and criteria for successful reproduction. Distinguish factual errors, prompt sensitivity, and changes between model versions.
source_requirements: Primary evaluations with methods and results. Selected demonstrations alone cannot establish the prevalence implied by 'very little'.
