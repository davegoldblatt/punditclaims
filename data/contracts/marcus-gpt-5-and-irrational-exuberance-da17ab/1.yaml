  - "'Fully replicable' could refer to repeated prompts, variations of a task, or independent reproduction."
  - The example concerns compression and reconstruction, which is not identical to ordinary summarization.
  - The observation has no explicit reporting period; the initial-release reporting window is an evaluator choice.
