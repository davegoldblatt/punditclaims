explicit_source_elements:
  - 79% of survey correspondents said they had tried Microsoft Copilot
  - CNBC Technology Executive Council poll held in October
  - tremendous, given how new the product is
  - clear refutation of any 'people are ignoring AI' narrative
evaluator_interpretation:
  - The checkable core is whether the October 2024 CNBC survey reported that about 79% of respondents had tried or were using Copilot, and whether that population was not ignoring AI.
  - "'Refutation' is read as applying to the surveyed population (tech leaders at large firms). It is not read as a claim about the whole public."
  - "'How new the product is' is read as Copilot having launched about a year earlier."
support_condition: The CNBC survey reports about 79% of respondents using Copilot, about a year after launch, and shows broad AI uptake among respondents.
contradiction_condition: The survey reports a materially different figure, or shows respondents largely not using or ignoring AI.
measurement_requirements: Share of CNBC TEC respondents reporting Copilot use.
source_requirements: CNBC report of the October 2024 Technology Executive Council survey.
