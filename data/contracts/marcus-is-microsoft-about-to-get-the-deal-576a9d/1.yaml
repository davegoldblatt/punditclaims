evaluator_interpretation:
  - "The core claims are qualitative: ChatGPT cost a lot to run, and OpenAI's revenue up to the post was small, roughly $10-40 million."
  - The $3 million/day figure is credited to rumor, not stated as fact. It is checked against contemporary estimates and reported as a limitation, but it does not decide the result alone.
  - "'Revenue so far' is read as OpenAI's 2022 revenue, the last full year before the post (January 2023)."
support_condition: Credible reporting shows OpenAI's 2022 revenue was in the low tens of millions of dollars, and that ChatGPT's running costs were large (e.g., described by OpenAI as very high, or estimated at about $100,000 per day or more).
contradiction_condition: Reporting shows OpenAI's 2022 revenue was far above low tens of millions (e.g., hundreds of millions), or that ChatGPT's running costs were trivial.
measurement_requirements: OpenAI 2022 revenue in USD from reported figures; estimates or statements on ChatGPT inference cost from late 2022.
source_requirements: Company statements or reputable press reports of OpenAI financials; dated independent cost estimates.
