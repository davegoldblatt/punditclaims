evaluator_interpretation:
  - The claim concerns the GPT-5 system announced on August 7, 2025.
  - The ordinary reading of AGI is broadly human-level general cognitive capability, including reliable adaptation and learning across unfamiliar tasks.
  - Strong performance on selected benchmarks or expert-level answers in some domains does not by itself establish AGI.
  - Obviously expresses confidence; it adds no separate measurable threshold.
support_condition: Evidence identifies substantial missing general capabilities, supported by evaluations or a concrete acknowledgment from the developer that the launched system falls short of AGI.
contradiction_condition: Broad, credible evaluations establish general human-level capability and adaptation across unfamiliar intellectual tasks, rather than isolated benchmark successes.
measurement_requirements: Evidence about breadth, reliability, learning, and adaptation. No single benchmark is treated as an AGI test.
source_requirements: Prefer developer disclosures and independent evaluations. Attributed reporting may establish developer statements when a readable primary transcript is unavailable.
