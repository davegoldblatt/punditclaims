assessment_axis: forecast_outcome
explicit_source_elements:
  - There is no AGI coming.
  - There is no conscious computer.
evaluator_interpretation:
  - Treat the AGI sentence as an indefinite negative forecast, with no invented deadline.
  - Use the ordinary meaning of broadly general, approximately human-level intelligence. Zitron supplies no particular test.
  - Consciousness means subjective experience and is distinct from intelligence.
  - The consciousness sentence is grammatically a present observation. It is retained as a separate component of this bundled claim, rather than silently converted into a forecast.
support_condition: Finite nonappearance cannot establish that AGI will never arrive. The present consciousness component would require evidence adequate to establish that existing computers lack subjective experience.
contradiction_condition: A publicly documented system achieves broadly general human-level intelligence with substantial independent acceptance. Alternatively, credible evidence establishes that a conscious computer already existed when the post was published.
measurement_requirements: Independent assessments of broad capability, rather than a single benchmark or company declaration. Consciousness requires evidence beyond conversational self-reports.
source_requirements: Primary evaluations and scientific assessments, with independent scrutiny and explicit treatment of disagreements.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve the AGI forecast as contradicted if a dated, independently scrutinized system gains broad acceptance among relevant researchers as human-level AGI. A consciousness finding can contradict the present-tense component only if it establishes existence by August 25, 2026.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - AGI has no definition or test in the claim.
  - Consciousness has no operational definition in the claim.
  - The supplied claim bundles a forecast with a present-tense observation.
  - General intelligence does not imply consciousness.
retrospective_or_prospective: retrospective
