assessment_axis: forecast_outcome
explicit_source_elements:
  - Neurosymbolic AI
  - will displace
  - pure LLMs
  - over time
evaluator_interpretation:
  - "Plain reading: at some future point, hybrid systems that combine neural networks with explicit symbolic parts (logic, rules, symbolic programs, knowledge structures) will replace pure LLMs as the main approach in leading AI products and research."
  - "'Over time' sets no deadline, so this is an open-horizon forecast."
  - The claim would be met by broad evidence that leading labs and products have moved from pure LLMs to systems with real symbolic parts. A single paper or niche product would not be enough.
  - Whether today's LLMs that call tools (code interpreters, agent harnesses) already count as 'neurosymbolic' is disputed. I do not treat tool use alone as a decisive displacement event.
support_condition: "Clear, dated evidence that neurosymbolic systems have become the main approach in leading AI products and research, replacing pure LLMs. Examples: frontier labs describing their flagship systems as neurosymbolic and moving away from pure LLM scaling, or independent surveys showing that neurosymbolic systems lead in deployment and research."
contradiction_condition: Because there is no deadline, nothing can strictly refute this forecast. In practice it would be contradicted only if neurosymbolic approaches were clearly abandoned, or if pure LLMs stayed dominant over a very long period, beyond any reasonable reading of 'over time'.
measurement_requirements: "Adoption and deployment evidence: flagship architectures from leading labs, market share of products, and the share of research output."
source_requirements: "Primary sources: lab technical reports and announcements, peer-reviewed or preprint surveys, and independent measurements of adoption. The speaker's own writing does not count."
metric_scope: null
original_horizon: over time
horizon_interval:
  start: 2025-12-30
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: The forecast can be settled early as supported only by a decisive, dated event showing that neurosymbolic systems have replaced pure LLMs as the main approach. For example, most frontier labs officially adopting neurosymbolic architectures for their flagship models, documented in primary sources. No early contradiction rule applies, because the horizon is open.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Over time' gives no deadline."
  - Neither 'neurosymbolic' nor 'pure LLM' is defined. LLMs with tools or harnesses may or may not count as neurosymbolic.
  - "'Displace' could mean full replacement or only losing the dominant position."
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
