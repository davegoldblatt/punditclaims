assessment_axis: causal_assessment
explicit_source_elements:
  - theoreticals and hypotheticals
  - created one of the (if not the) largest equities bubbles in modern history
  - heavily-centralized around the valuations of a handful of names
  - buying or selling stuff to do with AI GPUs
evaluator_interpretation:
  - The ordinary reading is that speculative AI expectations have materially inflated equity values beyond reasonable earnings prospects, with the excess concentrated in a small group of AI-related companies.
  - Large market capitalization or concentration alone does not establish a bubble.
  - The historical ranking requires comparable measures of speculative overvaluation, rather than simply comparing nominal market capitalization across decades.
  - The contemporaneous market-state window is the last completed trading session before publication and the publication day, October 19–20, 2026. The drafting time is unknown.
  - No numerical rank is imposed on 'one of the largest'; a decisive conclusion would need to remain credible across reasonable historical measures.
support_condition: Comparable historical analysis establishes an exceptionally large speculative equity overvaluation in the contemporaneous AI trade, concentrated in a small group of companies, and evidence attributes a material part of that overvaluation to AI expectations.
contradiction_condition: Robust contemporaneous evidence shows that the claimed speculative overvaluation is absent, is not historically exceptional, or is not materially attributable to AI expectations. A different conclusion under one model alone is insufficient.
measurement_requirements: Compare valuation relative to earnings and defensible future cash flows, concentration, and the scale of estimated overvaluation across historical episodes. Distinguish earnings growth from changes in valuation multiples and account for other market drivers.
source_requirements: Dated market data and transparent valuation or bubble studies, preferably from primary research or official financial-stability analysis. Causal conclusions require more than simultaneous AI enthusiasm and rising prices.
