assessment_axis: historical_observation
explicit_source_elements:
  - I estimate
  - around $22 billion
  - global, non-Anthropic/OpenAI compute demand
  - an indeterminately-large chunk
  - AI startups
  - can only afford to pay
  - as long as venture capital continues to fund them
evaluator_interpretation:
  - In context, compute means AI compute services, not all general-purpose computing.
  - Use 2026-04-01 through 2026-06-30, the latest completed calendar quarter before publication, to measure the ongoing state.
  - Read $22 billion as an estimated annual pace of spending by customers other than Anthropic and OpenAI. Annualization is an evaluator interpretation because the statement supplies no time unit.
  - Around permits reasonable estimation uncertainty, but the speaker supplies no numerical tolerance.
  - The startup clause asserts dependence on further venture financing, not merely that customers have previously raised venture capital.
  - The amount is checkable in principle. The phrase indeterminately-large does not supply a separately scoreable market-share threshold.
support_condition: A comparable global estimate places annualized AI compute-service demand excluding the two labs near $22 billion, and representative customer financial evidence establishes a material contribution from startups unable to sustain those purchases without additional venture funding.
contradiction_condition: Comparable estimates place the same demand materially outside a reasonable range around $22 billion, or representative financial evidence shows the asserted startup dependence is not material.
measurement_requirements: Define the spending period and market boundary; separate service spending from chip purchases and construction; exclude the two labs consistently; avoid counting reseller and end-customer payments twice; assess startup cash generation, reserves, obligations, and alternative funding.
source_requirements: A transparent global compute-spending estimate with customer exclusions, plus representative startup financial records supporting the financing-dependence assertion.
