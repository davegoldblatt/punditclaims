explicit_source_elements:
  - only one theorem of middling importance
  - the Robbins conjecture
  - has ever been proved autonomously by an AI system
  - back in 1996
evaluator_interpretation:
  - The historical cutoff is July 22, 2025; 'ever' leaves the beginning unbounded.
  - In context, the claim excludes other autonomous proofs of original research results of at least meaningful mathematical importance, not merely exercises or reproving known theorems.
  - Because Marcus counts EQP, 'AI system' includes symbolic automated reasoning systems and is not restricted to neural networks.
  - Autonomous proof search permits humans to state and encode the problem, configure the search, and check the result. It excludes humans supplying the substantive proof for a computer merely to verify.
  - Solutions of longstanding recognized research problems are treated as meeting the ordinary qualitative importance threshold. This does not assert an exact ranking against Robbins.
support_condition: A sufficiently comprehensive historical record establishes Robbins as the only qualifying original research theorem proved by automated reasoning through the cutoff.
contradiction_condition: At least one additional nontrivial, recognized open research problem was settled by autonomous proof search before July 22, 2025, with a validated proof.
measurement_requirements: Distinguish machine-generated proofs from machine checking of human proofs; document the human setup, mathematical novelty, significance, and date.
source_requirements: Original research papers and proof records describing how the result was obtained and checked.
