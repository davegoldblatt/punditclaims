explicit_source_elements:
  - categorically failed to find product-market fit
  - underlying product cannot support itself
  - entirely-dependent on venture capital
  - at least $160 million every three to six months since February 2025
evaluator_interpretation:
  - The plain reading is that customer receipts cannot sustain Harvey's operations and continued venture financing is necessary to keep the business operating.
  - Product-market fit means sustained customer demand at commercially sustainable prices. Neither acquiring customers nor raising capital alone establishes it.
  - For the ongoing financial claim, use July–September 2026, the latest completed calendar quarter before publication. The separately stated fundraising history runs from February 2025 through publication and is treated as historical context.
  - The financial argument relies on reported private-company estimates, so estimate is the applicable basis. Gross margin, operating profit and operating cash flow remain distinct measures.
support_condition: Comparable financial records show that customer receipts do not cover ongoing operating costs, that venture funding is necessary to meet the shortfall, and that customer demand cannot sustain commercially viable pricing. Dated financing records also establish the stated fundraising pattern.
contradiction_condition: Comparable records show that Harvey can sustain operations from customer receipts without continued venture financing, or establish sustained demand at commercially viable prices. A materially different financing history would contradict the fundraising component separately.
measurement_requirements: Realized revenue, cost of revenue, operating expenses, operating cash flow, available cash, financing sources, customer retention and pricing data. Funding announcements and annualized revenue cannot substitute for operating results.
source_requirements: Prefer company financial disclosures or financial records. Attributed reporting on private financial information is acceptable with its limitations stated.
