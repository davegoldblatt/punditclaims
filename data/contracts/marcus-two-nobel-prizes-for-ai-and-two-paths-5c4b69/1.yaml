ambiguity_flags:
  - The publication-year observation window is evaluator-selected because the ongoing claim names no period.
  - The claim does not specify models, tasks, or a required prevalence of errors.
  - "'Opaque' does not specify how much interpretability would suffice."
  - "'Hobbled' and 'bone-headed' have no stated severity thresholds."
  - "'Greedy to the extreme' supplies no comparison class or threshold."
  - Training versus inference, total versus per-task consumption, and water accounting boundaries are unspecified.
