  - Mythos
  - most things that humans can do in 16 hours
  - let alone do them reliably
evaluator_interpretation:
  - This is a claim about what follows from the graph, not an assertion that Mythos is incapable of those activities.
  - Most things refers to a broad range of human activities, rather than most sampled benchmark tasks.
  - Reliably means dependable performance beyond the graph's 50% success criterion; Marcus supplies no exact reliability threshold in this sentence.
  - Use the May 8–10 graph snapshot, the latest published update before the post.
  - Pre-existing methodological restrictions apply to that snapshot; they are not new measurements of Mythos.
support_condition: The graph measures success on a restricted task distribution at 50%, without a demonstrated basis for extrapolating to dependable performance on most human activities lasting sixteen hours.
contradiction_condition: The graph or its supporting validation establishes reliable performance on a representative majority of human activities requiring up to sixteen hours.
measurement_requirements: Distinguish human task duration from model runtime, sampled tasks from all human activities, and 50% success from dependable completion.
source_requirements: Use METR's definitions, sampling scope, and guidance on interpreting time horizons.
