assessment_axis: historical_observation
explicit_source_elements:
  - Without OpenAI and Anthropic
  - the underlying businesses of the big three hyperscalers are deteriorating
  - their AI plays are a catastrophic failure
  - the sheer amount of cash they’ve required to date
  - demands an outsized return for years to come
evaluator_interpretation:
  - In the cloud-focused context, the plain reading is that the remaining cloud businesses are worsening after removing the two labs' contributions, and the remaining AI businesses have severely inadequate financial returns relative to their investment.
  - I use April–June 2026, the latest reported quarter available before the August 4 post, as the target period. Earlier comparable periods are needed to measure deterioration.
  - Removing the labs requires consistent treatment of direct compute purchases, model resale, investment gains, and attributable costs. Subtracting their revenue alone does not establish the counterfactual.
  - The surrounding argument relies on analyst estimates, so the financial basis is estimate.
  - "'Catastrophic failure' supplies no numerical return hurdle. I do not invent one or assume that multiyear infrastructure should recover its cost immediately."
support_condition: Comparable financial evidence excluding the two labs shows worsening underlying cloud performance across the three providers and severely inadequate returns from their remaining AI investments.
contradiction_condition: Comparable evidence with the same exclusions shows healthy or improving underlying cloud performance and adequate AI investment returns. Evidence establishing only one component would address only that component.
measurement_requirements: Revenue growth, operating profitability, and investment returns with the labs' direct and indirect contributions and attributable costs removed consistently; comparable prior periods; and capital costs matched to the assets' service periods.
source_requirements: Provider disclosures or independently documented analyst models with transparent customer exclusions and cost allocation. Consolidated results alone are insufficient.
