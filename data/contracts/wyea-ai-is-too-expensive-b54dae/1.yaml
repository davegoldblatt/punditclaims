evaluator_interpretation:
  - Assess the commitments existing on May 19, 2026, not every agreement or amendment signed later.
  - Read the four-year payment window as May 19, 2026 through May 19, 2030.
  - Treat $380 billion as an approximate estimate assembled from the five named providers, not an audited liability.
  - The observation concerns the estimated obligations already incurred. It is distinct from a forecast of all future compute spending.
  - Later disclosures can illuminate earlier agreements, but later amendments cannot be attributed to the publication-date commitment.
support_condition: Contract terms and payment schedules for the five named providers substantiate approximately $380 billion payable within the four-year window, including the stated component estimates.
contradiction_condition: A complete comparable schedule establishes a materially different total payable within that window, or reliable original contract terms decisively disprove a stated component on the same basis.
measurement_requirements: Separate contract ceilings, minimum commitments, optional usage, cancellation rights and actual payment schedules. Do not place an entire longer-term contract into four years without evidence.
source_requirements: Original agreements, filings or company disclosures; clearly attributed reporting may fill gaps where contractual terms are not public.
