assessment_axis: historical_observation
explicit_source_elements:
  - underlying customer base
  - effectively every AI data center
  - either a hyperscaler
  - not actually afford to pay for their compute without somebody else giving them the money
evaluator_interpretation:
  - The plain reading is that almost all AI data centers depend on hyperscalers or customers whose compute payments require external financing.
  - External financing means investment, borrowing, or subsidies. Ordinary customer payments do not count; otherwise the assertion would be trivial.
  - Accounting losses or a funding round alone do not establish inability to fund compute from operations and existing resources.
  - "For the ongoing financial condition, use the latest completed reporting quarter ordinarily available before publication: April through June 2026. Later announcements provide context."
  - This is an industry customer-composition claim, without a specified company financial metric.
support_condition: Representative facility-level customer records, linked to customer financial disclosures, show that almost all facilities depend on hyperscalers or customers unable to fund their compute payments without external financing.
contradiction_condition: Representative records establish a material population of AI data centers supported by non-hyperscaler customers that can fund compute from their own operations and resources. An isolated exception does not refute 'effectively every.'
measurement_requirements: A defined population of AI data centers, facility-level customer exposure, and evidence of customers' funding needs. Report facility counts and capacity or revenue concentration separately.
source_requirements: Customer agreements and operator disclosures, combined with customer cash-flow, liquidity, and financing records. Funding announcements alone are insufficient.
