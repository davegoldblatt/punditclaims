ambiguity_flags:
  - No numerical threshold for 'effectively every.'
  - Facility count, capacity, and customer spending are different possible denominators.
  - Underlying customers may mean direct tenants or ultimate compute users.
  - No observation period is specified; the latest completed reporting quarter is used.
  - Receiving outside financing does not establish dependence on it.
