evaluator_interpretation:
  - He names no period, so I read 'are losing money' as describing calendar 2025, the year in progress when he posted on 2025-12-03 and the latest period with public loss data.
  - "Plain reading: OpenAI was running large net losses and could not pay for its operations and planned spending from its own revenue, so it needed repeated outside funding to keep going."
  - "'At the mercy of investors' is rhetoric. I score it as reliance on outside capital, not as proof that investors imposed harsh terms."
support_condition: Credible reports show OpenAI ran net losses in 2025 and needed ongoing outside fundraising to fund operations and spending.
contradiction_condition: Credible reports show OpenAI was profitable or cash-flow positive in 2025, or could fund itself without new outside capital.
measurement_requirements: Reported or reliably estimated OpenAI net loss or cash burn for 2025, plus reporting on its reliance on external funding.
source_requirements: Company disclosures, filings of its investors (such as Microsoft), or reputable news reports of OpenAI financial documents.
