evaluator_interpretation:
  - "Read 'understand how to use' behaviorally: choosing appropriate tool operations, making useful calls, and correctly handling their results."
  - Read 'doesn’t reliably' as recurring consequential failures, not an assertion that every call fails or that GPT-4 has no useful tool skills.
  - Anchor the observation to the recent 105-problem testing discussed in the post. The linked study dates that testing to June–August 2023.
support_condition: Contemporaneous records show recurring avoidable failures in selecting, invoking, or interpreting the named tools, including examples involving both plug-ins.
contradiction_condition: Comparable testing shows consistently appropriate tool use, with alleged failures attributable to unrelated problem-solving errors or incorrect grading rather than tool use.
measurement_requirements: Inspect tool-use behavior and failure explanations. Overall wrong-answer rates alone do not establish misuse.
source_requirements: Primary evaluations or recorded outputs of the 2023 GPT-4 plug-ins. Marcus's post itself cannot establish the outcome.
