evaluator_interpretation:
  - The ordinary reading is that suppliers' models are broadly substitutable for common uses and price is a principal basis of competition.
  - Largely permits specialized models and remaining differences; one feature difference cannot refute the whole claim.
  - The assertion concerns the model layer, not whether finished applications or cloud services are commodities.
  - The post's last-three-months framing supplies the observation window. No standard reporting period exists for this market state.
support_condition: Representative evidence shows that buyers can substitute among suppliers for common workloads without substantial quality losses or switching costs, with price a principal basis of competition.
contradiction_condition: Representative evidence shows material differentiation or switching barriers across common workloads, such that supplier choice predominantly depends on factors other than price.
measurement_requirements: Workload-level substitution tests, switching costs, buyer selection criteria, and comparable prices. Similar aggregate benchmark scores alone are insufficient.
source_requirements: Prefer independent workload evaluations and representative buyer research. Identify investor interests and distinguish models from applications.
