explicit_source_elements:
  - markets or investors
  - AI
  - incredibly expensive
  - yet to turn a profit
  - doesn't matter
evaluator_interpretation:
  - The surrounding discussion limits AI to generative AI businesses and services, rather than all machine learning or chip manufacturers.
  - The ordinary reading is that investors generally overlook substantial costs and absent profits. It does not require every investor to be indifferent.
  - "For business finances, use the latest completed reporting quarter before publication: October–December 2023. For contemporaneous investor behavior, include January 2024 through February 27, 2024. The target period encompasses these two components."
  - The sentence does not distinguish an unprofitable industry overall from an industry containing no profitable businesses.
  - No accounting basis for profitability is supplied. It remains unknown; the money-claim rules therefore prevent a supported or contradicted verdict on the combined claim.
support_condition: Comparable financial evidence establishes substantial generative AI costs and absent profits on a defined basis, while broad market evidence shows investors continuing to disregard those economics.
contradiction_condition: Comparable financial evidence establishes profitability within the intended scope, or broad contemporaneous evidence shows investment decisions responding materially to the costs and expected returns.
measurement_requirements: Separate generative AI finances from parent-company and general cloud results. Distinguish investment enthusiasm from indifference to costs. Individual share-price movements cannot establish market-wide attitudes.
source_requirements: Prefer financial disclosures and direct investor statements. Reputable contemporaneous market reporting can document reactions, but cannot establish every investor's motives.
