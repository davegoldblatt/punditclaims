explicit_source_elements:
  - does not have a path to profitability
  - its future, like Anthropic's
  - dependent on a continual flow of capital
  - from venture capitalists and big tech
  - must also continue to expand infrastructure
evaluator_interpretation:
  - "Read this as a claim about OpenAI's business economics at publication: no financially workable route to sustained company-wide profits and continuing dependence on external financing and infrastructure."
  - Do not turn the present-tense claim into a prediction that OpenAI can never become profitable.
  - Use April–June 2025, the latest completed quarter before publication, for the current financial state. Earlier plans and later results are context unless they establish conditions in that quarter.
  - A published projection is evidence of a proposed route, but does not by itself establish that the route is financially workable.
  - The claim specifies no accounting definition of profitability.
support_condition: Contemporaneous costs, revenues, commitments, and financing requirements establish continuing external financing needs and rule out a financially workable route to sustained company-wide profits under the business plan then available.
contradiction_condition: Contemporaneous financial evidence establishes a workable route to sustained company-wide profits and eventual self-financing, or establishes that the asserted financing and infrastructure dependence did not hold.
measurement_requirements: Reconcile revenue, full operating costs, research spending, capital commitments, cash flow, and financing needs. Do not substitute gross margins or positive cash flow for net profitability.
source_requirements: Financial disclosures and sufficiently detailed business plans, preferably primary and independently checked. Fundraising announcements alone cannot establish necessity.
