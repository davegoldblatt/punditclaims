evaluator_interpretation:
  - Assess capabilities available as of April 15, 2024, using April 1–15 as the latest observation window for this ongoing technology claim.
  - The ordinary reading concerns dependable answers to varied everyday questions from a general-purpose virtual assistant.
  - Reliability does not require perfection. Success on narrow commands, selected demonstrations or a specialist question set alone would not settle the claim.
  - The universal company scope requires broader evidence than the failure of the Humane AI Pin.
support_condition: Representative contemporary evaluations across relevant providers establish material unreliability in general-purpose question answering, with sufficiently broad coverage to support the universal statement.
contradiction_condition: At least one assistant available in the target period demonstrates dependable performance on representative general-purpose questions under ordinary use.
measurement_requirements: Representative question selection, documented correct and incorrect answers, treatment of refusals and repeated testing. The assessment must distinguish deployed assistants from their underlying model APIs.
source_requirements: Independent evaluations of contemporary assistants, supported by reproducible methods and version information.
