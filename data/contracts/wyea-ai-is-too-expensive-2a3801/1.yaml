evaluator_interpretation:
  - Read in context, the claim concerns disclosure of realized AI revenue amounts, excluding annualized run rates.
  - The ordinary reading concerns each company's AI business overall. A narrower product or customer revenue disclosure would challenge a broader reading that they disclose no actual AI revenue whatsoever.
  - Use January–March 2026, the latest reported quarter before publication, as the revenue observation period. Check disclosures available through May 19, 2026.
  - This is an observation about disclosure at publication, not a prediction that disclosure will never occur.
support_condition: The four companies' reporting and other public disclosures through publication establish that none supplied a realized AI revenue total for the target period.
contradiction_condition: At least one company publicly supplied a realized AI revenue total for the target period before publication. A run rate, growth percentage, or mixed AI and non-AI segment total does not suffice.
measurement_requirements: Distinguish realized revenue amounts from annualized rates, revenue growth, bookings, and revenue from broader business segments.
source_requirements: Company reporting, statements, or public testimony. Establishing the universal negative requires sufficiently complete coverage of all four companies' disclosures.
