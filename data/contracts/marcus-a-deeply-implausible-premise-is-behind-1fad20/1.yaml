assessment_axis: forecast_outcome
explicit_source_elements:
  - nothing the United States can realistically do
  - short of full out nuclear war
  - stop Chinese companies
  - serving generative AI
  - China-based cloud infrastructure
evaluator_interpretation:
  - Read in context, this predicts the survival of Chinese domestic cloud generative AI provision, rather than the survival of every individual company or model.
  - Restrictions on importing chips, accessing overseas compute, or selling abroad do not themselves establish cessation of service on China-based infrastructure.
  - The nuclear-war exception excludes a cause; it is not an antecedent requiring evidence that a particular US policy occurred.
support_condition: Chinese companies remain able to serve generative AI on China-based infrastructure despite US actions throughout the unlimited horizon. Finite observations cannot conclusively establish this.
contradiction_condition: A feasible US action short of full nuclear war causes Chinese domestic cloud generative AI provision to cease, with no remaining Chinese providers able to supply it on China-based infrastructure.
measurement_requirements: Verify the physical service location, actual cessation across the claimed sector, persistence, and causal connection to US action.
source_requirements: Chinese provider operational records, corroborating independent evidence, and official records identifying the relevant US action.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted when dated evidence establishes that a qualifying US action has stopped Chinese companies collectively from providing generative AI on China-based cloud infrastructure.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Realistically is not defined.
  - Chinese companies could mean individual providers or the domestic sector; the surrounding exclusion argument favors the sector.
  - Stop does not specify a duration.
retrospective_or_prospective: retrospective
