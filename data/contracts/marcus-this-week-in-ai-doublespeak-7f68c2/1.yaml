explicit_source_elements:
  - essentially every potential harm OpenAI recently warned of
  - None are solved
  - we are told nothing about how the models work
evaluator_interpretation:
  - "The two components are assessed separately: whether the warned-of risk categories remained unresolved, and whether OpenAI disclosed any substantive information about model operation."
  - Recently refers to the GPT-4 launch warnings and disclosures preceding the March 18 post.
  - Solved means a broad harm category had been reliably eliminated or prevented; reducing its frequency or blocking selected prompts is mitigation.
  - The ordinary reading of nothing is no substantive technical disclosure. A narrower reading meaning insufficient detail for independent reproduction is recorded as an alternative.
  - The target is March 14–18, 2023, the latest public launch and disclosure period before the post.
support_condition: The launch materials describe the warned-of broad harms as unresolved despite mitigations, and disclose no substantive information about how the model operates or is trained.
contradiction_condition: Evidence establishes a complete solution to a warned-of broad harm, or identifies substantive public information about model operation or training. If only one component is contradicted while the other is supported, the combined claim is mixed.
measurement_requirements: Distinguish eliminated risks from reduced risks, and absence of disclosure from limited disclosure. Assess the broad risk categories in the launch materials rather than every conceivable individual harmful output.
source_requirements: Use the original March 2023 technical report and system card, with versions fixed where possible.
