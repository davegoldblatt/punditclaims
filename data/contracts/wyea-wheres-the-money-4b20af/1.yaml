assessment_axis: causal_assessment
explicit_source_elements:
  - Apple is radicalizing millions of people against generative AI
  - by forcing them to reckon with
  - terrible summaries, awful suggested texts and horribly-designed user interface elements
evaluator_interpretation:
  - The ordinary reading is that experiencing Apple Intelligence's defects caused millions of people to become substantially more opposed to generative AI generally by the post date.
  - I operationalize the plural 'millions' as at least two million people. Zitron supplied no exact threshold or geography.
  - Disliking Apple's implementation, declining to pay for it, or already opposing AI does not alone establish the claimed change in attitudes.
support_condition: Representative evidence links exposure to Apple Intelligence's defects to increased opposition to generative AI, with a defensible population estimate of at least two million affected people by publication.
contradiction_condition: Comparable evidence measures the causal change and rules out an effect affecting at least two million people. Favorable average ratings alone would not rule out a large dissatisfied minority.
measurement_requirements: Measure attitudes before and after exposure, distinguish general opposition to generative AI from product dissatisfaction, address selection and other causes, and report population estimates with uncertainty.
source_requirements: Representative surveys with credible causal identification, longitudinal studies, or comparable independent research. Anecdotes and defect reports establish context only.
