  end: 2025-04-04
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - A third is approximate; a literal 33.33% reading would differ.
  - The stock market benchmark is unnamed.
  - Conventional year-to-date returns use the preceding year-end close, not the first trading day's close.
