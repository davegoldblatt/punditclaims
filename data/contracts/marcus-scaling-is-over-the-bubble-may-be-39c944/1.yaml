assessment_axis: historical_observation
explicit_source_elements:
  - NVidia is down by a third
  - so far in 2025
  - Far more than the stock market itself
evaluator_interpretation:
  - Read 'a third' as an approximate description of the share-price decline, consistent with the supplied normalized proposition.
  - Use conventional calendar-year-to-date price performance, measured from the preceding year-end close through April 4, the last trading close before the Sunday post.
  - Use the S&P 500 price index as an ordinary broad US market comparator.
  - This is a traded-security price-return claim, rather than a claim about Nvidia's corporate finances; metric_scope is therefore null.
support_condition: Nvidia's year-to-date share-price decline is approximately one third and materially exceeds the broad market's decline over the same interval.
contradiction_condition: Nvidia's decline is materially smaller than approximately one third, or does not substantially exceed the broad market decline.
measurement_requirements: Use matching year-to-date endpoints and price returns. Do not substitute a decline from an intrayear peak or mix price returns with total returns.
source_requirements: Prefer historical market records; contemporaneous financial reporting may establish the returns when primary records cannot be read.
metric_scope: null
original_horizon: null
horizon_interval: null
