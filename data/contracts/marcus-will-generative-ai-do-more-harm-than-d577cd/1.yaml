assessment_axis: historical_observation
explicit_source_elements:
  - the effects of all that IP theft on artists and writers
  - potential negative effects more broadly across the employment market
  - these have been more modest than some people expected
evaluator_interpretation:
  - The plain reading is that some artists and writers have suffered harm from unauthorized appropriation of their work, while broader employment harms have been smaller than some earlier expectations.
  - The parenthetical refers to broader employment effects. It does not deny substantial harm to particular occupations.
  - For this ongoing observation, use September 2026, the latest completed calendar month before the post, to assess the position reached so far. Earlier events provide historical context.
  - An expectation must concern employment effects by the assessment period. A prediction about later years cannot be treated as having failed already.
  - Read IP theft as unauthorized appropriation, without assuming that every unlicensed training use is legally infringing.
  - Marcus supplies no geography. Country-specific findings can inform the assessment but cannot establish a worldwide result by themselves.
support_condition: "Evidence for the assessment period establishes both components: broader AI-related employment harms smaller than identifiable earlier expectations for the same population and elapsed period, and documented harm to artists and writers linked to unauthorized appropriation of their work."
contradiction_condition: Comparable evidence shows employment harms meeting or exceeding the identified earlier expectations, or reliable evidence refutes the alleged appropriation-related creator harms. Benefits elsewhere or lawful uses in particular cases do not alone refute the claim.
measurement_requirements: Compare like employment measures, populations, and dates. Distinguish task exposure, gross displacement, reduced hiring, and net employment effects. For creators, distinguish unauthorized copying, legal infringement, reported losses, and evidence linking those losses to the copying.
source_requirements: Prefer original labor research, official statistics, dated forecasts, creator surveys with disclosed methods, and court records. Publication dates must not substitute for underlying observation dates.
