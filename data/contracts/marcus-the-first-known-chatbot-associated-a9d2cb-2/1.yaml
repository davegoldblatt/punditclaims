assessment_axis: historical_observation
explicit_source_elements:
  - how rapidly chatbots are being deployed
  - the near total lack of regulation on how they can be used
evaluator_interpretation:
  - Assess only the observation identified by the screens, not the surrounding prediction of additional deaths.
  - Read rapid deployment as substantial public rollout and uptake over weeks or months.
  - Read regulation ordinarily to include binding existing laws governing chatbot services and their use, whether or not written specifically for chatbots.
  - No jurisdiction is specified. Assess the broad statement against major markets, without treating one isolated legal restriction as sufficient to refute near-total absence.
  - Use the latest completed quarter and the immediately preceding days, January 1 through April 4, 2023, to describe the ongoing rollout and regulatory state.
support_condition: Evidence shows rapid public deployment and uptake, while binding constraints on chatbot services and their use are largely absent across major markets.
contradiction_condition: Evidence shows slow or limited deployment, or substantial binding constraints on chatbot services and their use across major markets. Opposite findings for the two components warrant mixed.
measurement_requirements: Dated launches and uptake evidence; legal texts and enforcement records effective by April 4, 2023. Distinguish chatbot users from users of an entire search engine.
source_requirements: Prefer developer announcements and official legal records. Use reporting when the underlying deployment announcement cannot be retrieved.
