assessment_axis: historical_observation
explicit_source_elements:
  - having a machine look at a radiology scan
  - very different from replacing the entire job of a radiologist
evaluator_interpretation:
  - The ordinary reading is that image interpretation covers only part of a radiologist's substantive clinical responsibilities.
  - No numerical measure of difference is required. The test is whether replacing the job requires meaningful capabilities beyond examining images.
  - For this ongoing professional-role observation, use 2022 through the post date as the current reporting period. Professional duties have no regular quarterly reporting cycle.
support_condition: Contemporaneous professional descriptions identify substantial radiologist responsibilities beyond image interpretation.
contradiction_condition: Contemporaneous professional descriptions establish that image interpretation exhausts the substantive job, making demonstrated scan reading equivalent to replacing it.
measurement_requirements: Compare clinical responsibilities, not merely image-reading accuracy. Do not require every radiologist to perform every subspecialty's duties.
source_requirements: Dated professional standards or descriptions applicable before October 16, 2022.
