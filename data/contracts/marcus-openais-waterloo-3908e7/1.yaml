early_resolution_rule: Settled early as supported if, by the evaluation date, reputable reporting shows that LLM scaling was widely abandoned as the leading path and an alternative approach had displaced it. Settled early as contradicted only if an LLM-scaling system was widely accepted as AGI.
interpretation_determines_result: true
