assessment_axis: historical_observation
explicit_source_elements:
  - the company projects
  - somewhere in the region of $30 billion
  - in 2026
evaluator_interpretation:
  - This concerns the projection OpenAI held when the post appeared, not whether its eventual revenue met that projection.
  - The surrounding discussion identifies actual calendar-year revenue, rather than an annualized run rate.
  - The observation period covers projections announced during 2026 before publication. The revenue being projected covers the full calendar year.
  - ‘In the region of’ permits ordinary approximation, but supplies no numerical tolerance.
support_condition: Accessible reporting or company documents establish a current projection reasonably described as approximately $30 billion of actual calendar-year 2026 revenue.
contradiction_condition: Comparable evidence establishes that the current projection was materially different from approximately $30 billion.
measurement_requirements: Distinguish the forecast's announcement date from its revenue period. Exclude financing, valuation and annualized run rates.
source_requirements: Prefer dated company guidance or investor documents. Reporting about private investor materials is acceptable when the underlying documents are unavailable.
