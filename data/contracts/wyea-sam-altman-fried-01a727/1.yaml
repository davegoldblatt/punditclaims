assessment_axis: forecast_outcome
explicit_source_elements:
  - If AI startups
  - companies integrating these models into their apps
  - begin to falter
  - the only real revenue stream
  - more dependent on big tech to keep them alive
evaluator_interpretation:
  - The model providers referred to are OpenAI and Anthropic.
  - Read the antecedent as material weakening among the application-startup customer group, rather than an isolated firm's failure. No numerical threshold is supplied.
  - Read 'only real revenue stream' as the only commercially substantive revenue source, not a denial of every incidental receipt.
  - The predicted chain is weakening startup customers, weakening provider revenue from those customers, and increased dependence on big-tech support for survival.
  - The claim has no deadline or specified lag after the triggering downturn.
  - Revenue and financing must be examined separately. Fundraising alone does not establish survival dependence.
support_condition: After a documented qualifying downturn, records show that startup integration revenue was the only substantive revenue source for both providers, weakened because of that downturn, and caused greater reliance on big-tech support for survival.
contradiction_condition: After a documented qualifying downturn, sufficiently complete records decisively defeat the predicted chain, including by establishing substantive independent revenue sources and no resulting increase in survival dependence on big tech.
measurement_requirements: A consistent cohort of model-integrating startups; their business performance and model spending before and after a downturn; each provider's revenue by customer type; and financing and liquidity records establishing the causal link.
source_requirements: Dated sector or customer-cohort evidence must establish the antecedent. Provider disclosures and financing records must establish the consequences. Individual closures and aggregate fundraising are insufficient.
metric_scope:
  company: OpenAI and Anthropic, assessed separately
  metric: Revenue from model-integrating application startups, with dependence on big-tech financing assessed separately
