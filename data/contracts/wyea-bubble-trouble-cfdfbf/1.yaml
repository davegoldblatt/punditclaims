target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No size or geographic scope is specified for the reduction.
  - ChatGPT and Claude are examples; separate effects for each product are not specified.
  - Survival is not defined.
  - A worldwide net decline is a stronger reading than reduced production in relevant sources.
retrospective_or_prospective: retrospective
