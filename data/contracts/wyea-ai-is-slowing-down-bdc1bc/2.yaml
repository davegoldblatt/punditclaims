explicit_source_elements:
  - '"we need at least another $250 billion in annual AI compute demand"'
  - '"which likely means at least two other OpenAI or Anthropic-scale companies"'
  - "Context: \"even if Anthropic and OpenAI spent $500 billion a year in annual compute ... we'd need at least another $250 billion or more in annual compute revenue to justify it\""
evaluator_interpretation:
  - "This is a statement about what is needed to justify the planned data-center buildout, based on the speaker's own estimates: about 190GW planned, costing $80–100 billion per GW, with OpenAI and Anthropic spending at most around $500 billion a year. It is not a prediction that something will or will not happen by a date."
  - "'Another' is measured against OpenAI's and Anthropic's own compute spending. The baseline and the buildout size are his estimates, not reported figures."
  - The second part ('likely means at least two other ... companies') is hedged with 'likely' and is an inference from the dollar figure. It is not scored separately.
  - No deadline is stated in the sentence. The nearby text mentions 2030 and 'four years' as the time frame for the buildout.
support_condition: Would be supported if a reliable, independent analysis of the planned buildout cost and the needed return showed that justifying it requires at least $250 billion a year of AI compute demand beyond OpenAI and Anthropic.
contradiction_condition: Would be contradicted if such an analysis showed that the buildout could be justified with materially less than $250 billion a year of extra compute demand beyond OpenAI and Anthropic.
measurement_requirements: Total planned AI data-center capacity and cost, OpenAI's and Anthropic's annual compute spending, and a defined standard of what 'justify' means, such as the return needed on capital. These all depend on the model chosen.
source_requirements: Company filings on compute commitments, independent data-center capacity trackers, and analyst models of the return needed on capex.
metric_scope:
  company: AI compute market excluding OpenAI and Anthropic
  metric: additional annual AI compute demand (revenue) needed to justify the buildout
  currency: USD
  units: billions of dollars per year
  accounting_basis: estimate
