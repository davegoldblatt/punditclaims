ambiguity_flags:
  - "'Need' depends on an unstated standard of what would 'justify' the buildout."
  - The baseline (OpenAI and Anthropic spending $500 billion a year) is a hypothetical the speaker sets up, not a reported figure.
  - No deadline or year is given for when the demand must exist.
  - The two-company inference is hedged with 'likely'.
