assessment_axis: forecast_outcome
explicit_source_elements:
  - at least another $250 billion
  - in annual AI compute demand
  - likely means
  - at least two other OpenAI or Anthropic-scale companies
evaluator_interpretation:
  - The condition is the announced AI infrastructure buildout whose economics the post seeks to justify. The existence of that buildout is distinct from its eventual completion.
  - Another means annual compute purchases beyond those attributed to OpenAI and Anthropic in the surrounding calculation.
  - Annual demand means spending for a full year, not cumulative capital expenditure, fundraising, company valuation or an annualized revenue announcement.
  - Justifying the buildout means generating enough cash receipts to cover operating costs and capital obligations under a stated financial model.
  - The $250 billion is an estimated minimum requirement, not a prediction that this demand will necessarily appear.
  - The two-company statement is qualified by likely. It is a proposed source of demand, not a categorical assertion that smaller buyers cannot supply it.
  - No firm deadline is attached to this particular requirement. The nearby 2030 discussion supplies context but not an unambiguous deadline for this sentence.
support_condition: A reproducible model of the specified buildout, including costs, financing, utilization and the two labs' purchases, establishes that at least $250 billion of additional annual compute purchases is required for financial viability. Evidence about likely customer concentration must separately support the qualified two-company suggestion.
contradiction_condition: The specified buildout achieves financial viability with less than $250 billion in additional annual compute demand, or sufficiently complete financial records establish a lower requirement. Demand below the threshold while the buildout remains incomplete or unviable is not a contradiction.
measurement_requirements: Specify the buildout, completion schedule, capital recovery, financing costs, utilization, compute prices and baseline demand. Count compute purchases consistently and avoid adding the same spending at multiple layers of the supply chain.
source_requirements: Infrastructure contracts, project accounts, financing disclosures and customer spending records. A demand forecast or capital expenditure total alone cannot establish the claimed minimum.
metric_scope:
  company: AI compute market, excluding demand attributed to OpenAI and Anthropic
  metric: Additional annual compute purchases required for buildout viability
  currency: USD
  units: billions of dollars per year
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Resolve only when a completed, defined buildout and its accounts establish the minimum additional annual demand, or demonstrate viability below that minimum. Announced investment or the appearance of additional large AI firms alone cannot settle it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No explicit deadline.
  - The buildout's boundaries and completion assumptions are unspecified.
  - The baseline for another is supplied by the surrounding argument.
  - Financial viability and the required capital return are not defined.
  - OpenAI or Anthropic-scale could refer to revenue, compute purchases or another measure.
  - Likely does not specify a probability threshold or require exactly two new companies.
retrospective_or_prospective: retrospective
