assessment_axis: historical_observation
explicit_source_elements:
  - AI can do very little
  - actually automate your real job
evaluator_interpretation:
  - In this post, AI means generative AI and LLM-based systems.
  - The plain reading is that these systems could reliably take over only a small part of ordinary workers' actual workloads. It does not require complete replacement of a worker before automation counts.
  - Capability, deployment, time saved, and whole-job replacement are distinct measures.
  - No period is supplied. I use May 2025, the most recent completed month before publication, for the ongoing capability claim. Earlier measurements are context.
  - Very little is read as a small practical share, without inventing a numerical cutoff.
support_condition: Representative workplace evidence shows that reliable automation covered only a small share of ordinary workloads in the target period, including the human work needed to check and correct outputs.
contradiction_condition: Representative evidence shows substantial reliable automation across ordinary workloads in the target period. A narrow successful deployment alone does not settle the general claim.
measurement_requirements: Measure completed work or work time reliably automated, with quality and human oversight accounted for. Distinguish actual automation from assistance, potential exposure, and requests sent to a model.
source_requirements: Representative workplace studies or independently validated deployments. Vendor usage data and occupational exposure models require explicit limitations.
