assessment_axis: causal_assessment
explicit_source_elements:
  - Every single tech bubble
  - followed the same path
  - paved with flawed, deferential and specious journalism
  - from small blogs to the biggest mastheads
evaluator_interpretation:
  - The ordinary causal reading is that uncritical or misleading journalism helped fuel every technology bubble within the claim's scope.
  - The surrounding examples include AI, the metaverse, cryptocurrency, and Clubhouse.
  - The statement does not require every individual article to be deferential, or journalism to be the sole cause.
  - The word 'every' prevents examples from a few episodes from establishing the whole claim.
  - Whether nineteenth-century technology booms belong to 'tech bubbles' is uncertain; they are treated as historical context rather than automatic counterexamples.
support_condition: A defensible inventory of the relevant technology bubbles, with evidence in each case that flawed or deferential reporting materially contributed to speculative investment or adoption.
contradiction_condition: A clearly in-scope technology bubble for which strong evidence shows that the claimed journalistic mechanism was absent or had no meaningful enabling role.
measurement_requirements: Separate reporting tone from factual accuracy, deference, investor exposure, and causal effects. Correlation between positive reporting and rising prices is insufficient by itself.
source_requirements: Historical reporting records combined with credible causal or comparative research on investment behavior.
