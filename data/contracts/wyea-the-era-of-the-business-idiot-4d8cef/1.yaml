ambiguity_flags:
  - The universe of technology bubbles is not specified.
  - The source does not define a bubble or establish that each named episode qualifies.
  - The causal strength implied by 'paved with' is unspecified.
  - Historical technology booms may fall outside the contemporary meaning of 'tech'.
  - Flawed, deferential, and specious reporting are related but distinct properties.
