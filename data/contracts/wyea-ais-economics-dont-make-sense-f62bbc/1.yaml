assessment_axis: forecast_outcome
explicit_source_elements:
  - startups
  - 10% or more of their headcount in AI tokens
  - a tough time convincing investors
  - in six months
  - doing so is necessary
evaluator_interpretation:
  - Headcount means personnel costs, rather than a count of employees, because the sentence compares spending amounts.
  - Six calendar months after April 28 is October 28, 2026.
  - The surrounding discussion concerns tokens used by staff for internal work, rather than all inference costs incurred delivering a startup's product.
  - A tough time means substantive investor resistance, demands for justification or cuts, or financing difficulties explicitly linked to that spending.
  - The wording describes a general tendency among qualifying startups. An isolated anecdote cannot establish that tendency.
  - The spending threshold defines the target group; it is not a separate conditional antecedent.
support_condition: Evidence around October 28, 2026 shows a broad pattern of investor resistance to internal token spending among startups documented to spend at least 10% of personnel costs on it.
contradiction_condition: Evidence for the same qualifying population and period shows investors generally accept the spending as necessary without the predicted difficulty.
measurement_requirements: Match token expenses and personnel costs over the same period and accounting basis. Link investor reactions to those expenses and distinguish internal token use from product-serving costs.
source_requirements: Dated startup spending records and investor communications, or reliable reporting that documents both the spending ratio and investor response.
metric_scope:
  company: Startups spending at least 10% of personnel costs on internal AI tokens
  metric: Internal AI token spending divided by personnel costs
  currency: null
  units: percent
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: in six months
horizon_interval:
  start: 2026-04-28
  end: 2026-10-28
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Earlier concerns alone cannot settle a forecast about conditions six months later. Early resolution would require decisive evidence establishing the target-period outcome for the qualifying population.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Headcount is shorthand for an unspecified measure of personnel costs.
  - The spending measurement period and accounting basis are unspecified.
  - A tough time has no numerical threshold.
  - The proportion of qualifying startups expected to experience resistance is unspecified.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
