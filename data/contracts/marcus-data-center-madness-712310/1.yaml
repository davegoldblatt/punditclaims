evaluator_interpretation:
  - The plain reading is a noticeable, rapid retreat in Republican politicians' public support, not opposition by every Republican.
  - Abandoning includes distancing themselves from unrestricted development through moratoria, restrictions, and campaign attacks. It does not necessarily mean demanding permanent closure.
  - Use August 19–21, 2026, from the references to Wednesday and the preceding day. Earlier actions can supply background but are not newly occurring withdrawals in this window.
support_condition: Several prominent Republican politicians publicly distance themselves from data-center development during the stated window, with documented changes or newly intensified opposition.
contradiction_condition: "The alleged contemporaneous retreat is disproved: the examples retain their previous support without meaningful distancing, and broader records show no such movement."
measurement_requirements: Separate changed positions, new restrictive actions, renewed publicity for older positions, and continued support. Do not count a regulatory safeguard automatically as a total rejection.
source_requirements: Dated statements, legislation, campaign materials, or reputable reporting identifying the politicians and their actions.
