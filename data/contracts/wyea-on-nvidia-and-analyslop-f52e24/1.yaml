explicit_source_elements:
  - Every example you've read
  - somebody being amazed by it
  - a toy app or website
  - very similar to many open source projects or website templates
  - Anthropic trained its training data on
evaluator_interpretation:
  - “You've read” refers to publicly available accounts an informed reader could have encountered before the post, rather than an unknowable individual reading history.
  - A toy means a small demonstration with limited substantive functionality. An experimental system is not automatically a toy merely because it is unsuitable for production.
  - "This is a universal conjunction: a substantial non-toy example can contradict it without establishing that the model never learned from similar code."
support_condition: The relevant published accounts all concern small demonstrations or template-like sites, with evidence supporting the asserted similarity and training-source connection.
contradiction_condition: At least one pre-post published account expresses admiration for Claude Code producing a substantial working software system beyond a toy app or template-like website.
measurement_requirements: Identify the coding tool, publication date, expressed reaction, implemented functionality and inspectable artifact. Distinguish substantial functionality from production readiness.
source_requirements: Prefer first-person project accounts with public artifacts and independent technical examination. Do not infer specific training-data membership merely from resemblance.
