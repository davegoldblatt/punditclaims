explicit_source_elements:
  - Current deep-learning systems
  - frequently succumb to stupid errors
  - Still true
evaluator_interpretation:
  - The plain reading is that leading systems repeatedly make readily identifiable mistakes on ordinary questions or elementary reasoning tasks. It does not mean every system fails, or that most everyday answers are wrong.
  - "For this ongoing observation, I use the latest calendar quarter to date before publication: January 1 through March 10, 2024. Research has no standard quarterly reporting cycle; earlier measurements are context only."
  - Frequent means substantial recurrence in systematic testing, without imposing a numerical threshold Marcus did not supply.
support_condition: Contemporaneous systematic testing of several leading systems finds substantial rates of clear mistakes on ordinary factual questions or elementary tasks.
contradiction_condition: Broad, representative testing finds these mistakes consistently rare across leading systems and ordinary tasks, with apparent examples explained by misleading tests.
measurement_requirements: Identify tested systems, questions, error criteria, sample size and limitations. Do not treat selected failures as a population error rate.
source_requirements: Prefer original evaluations with documented methods and identifiable model versions.
