assessment_axis: causal_assessment
explicit_source_elements:
  - GenAI is pitched as (near) AGI
  - reliability problems persist
  - limiting how well it can be used in practice
evaluator_interpretation:
  - Read the marketing clause as prominent suppliers presenting their technology as approaching AGI, without requiring every supplier to make that pitch.
  - Read the reliability clause as recurring errors imposing practical limits on some important uses, rather than making every use ineffective.
  - "For this ongoing state, use the latest completed calendar quarter and the prepublication portion of April: January 1 through April 10, 2025."
  - The causal link requires evidence that unreliable outputs or action sequences constrain useful task completion; errors alone are insufficient.
  - No numerical error threshold or claim about aggregate financial ROI is added.
support_condition: Contemporaneous supplier messaging promotes approaching AGI, while evaluations or deployment evidence connect persistent errors with concrete limits on useful work.
contradiction_condition: Comparable evidence refutes the claimed promotional framing or shows that the alleged reliability problems do not impose the practical constraints asserted. Successful uses alone do not contradict a claim of limitations.
measurement_requirements: Identify the model, task, and failure mechanism. Separate task-specific evaluations from industry-wide conclusions and distinguish improved reliability from complete reliability.
source_requirements: Primary supplier statements for the marketing premise and direct evaluations, deployment studies, or documented product limitations for the reliability mechanism.
