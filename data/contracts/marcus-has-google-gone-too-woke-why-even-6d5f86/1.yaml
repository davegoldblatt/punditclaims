explicit_source_elements:
  - Current systems
  - mix historical data, images from old films etc, all together
  - way too unsophisticated
  - representative current sample
evaluator_interpretation:
  - The relevant systems are contemporary image generators discussed in the post.
  - I read representative current sample as generated population distributions reasonably matching an identified contemporary population, rather than every small image batch matching exact proportions.
  - The claim combines mixed-era training data with unreliable contemporary representation; evidence of biased outputs alone does not establish both.
  - Because no reporting interval is supplied, the target is the current deployment period in February 2024 through publication on February 21.
support_condition: Training documentation establishes mixed historical and contemporary inputs, and audits of the relevant deployments show persistent failure to represent specified contemporary populations.
contradiction_condition: Documentation disproves the asserted data mixing, or representative audits show that the relevant systems reliably produce contemporary population samples when the intended population is specified.
measurement_requirements: Identify model versions, prompts, geography, occupations, demographic reference populations, sampling uncertainty, and training-data provenance.
source_requirements: Primary training documentation and demographic audits using contemporary population records.
