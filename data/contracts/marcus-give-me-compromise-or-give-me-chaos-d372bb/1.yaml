assessment_axis: historical_observation
explicit_source_elements:
  - Big tech
  - Generative AI
  - to exempt it from any regulation
evaluator_interpretation:
  - Assess the supplied normalized proposition about regulation, excluding the parenthetical revenue claim.
  - Read 'Big tech' as a collective description of major technology companies, rather than a named company or a precisely defined membership.
  - The plain reading of 'any regulation' is a blanket exemption from binding regulation of generative AI, including its deployment. Opposition to particular foundation-model obligations does not alone establish that position.
  - Assess expressed policy objectives through company proposals and industry lobbying statements. These records cannot establish undisclosed motives.
  - Use November 1–28, 2023, the current month through publication, for the ongoing position described during the EU AI Act negotiations. No reporting period is specified.
support_condition: Contemporaneous company proposals or representative lobbying records establish a broad industry objective of exempting generative AI from binding regulation altogether.
contradiction_condition: Contemporaneous records show major technology companies advocating binding regulation applicable to generative AI, contradicting the blanket attribution. Seeking narrower obligations alone does not establish the claim.
measurement_requirements: Distinguish opposition to foundation-model rules from opposition to all regulation, and voluntary commitments from binding requirements.
source_requirements: Prefer dated company policy documents and original lobbying statements. Assess their substance, including proposed exemptions, rather than relying solely on general assurances about responsible AI.
