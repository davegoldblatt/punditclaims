assessment_axis: forecast_outcome
explicit_source_elements:
  - When the deck of cards collapses
  - he’ll find something to blame it on
  - market forces
  - a lack of energy breakthroughs
  - unfortunate economic forces
  - remain a billionaire
evaluator_interpretation:
  - The antecedent is a broad collapse of the AI investment boom described in the post, rather than an isolated company setback or ordinary market correction.
  - Blame means a public explanation by Altman assigning meaningful responsibility for that collapse to external factors. The listed examples are illustrative.
  - Remain a billionaire means credible estimates of personal net assets of at least US$1 billion after the collapse.
  - Capable of doing anything he wants is rhetorical emphasis, not a literal additional test.
  - No deadline or post-collapse observation interval is stated. Present wealth or warnings about a possible bubble cannot settle the conditional forecast.
support_condition: After an established broad AI-boom collapse, Altman publicly attributes meaningful responsibility to external factors and credible post-collapse estimates place his personal net worth at or above US$1 billion.
contradiction_condition: After the antecedent is established, credible evidence shows his net worth below US$1 billion, or a sufficiently complete public response record directly conflicts with the predicted external attribution. Mere silence over an arbitrary short period is insufficient.
measurement_requirements: Establish a broad, sustained reversal in AI financing and valuations. Then examine dated statements and personal net-worth estimates that account for liabilities and illiquid holdings.
source_requirements: Use industry financing records to establish the antecedent, original public statements for attribution, and credible wealth estimates or asset records for net worth.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A decisive event can settle the forecast only after the collapse antecedent is established. Support requires both predicted consequences; contradiction requires decisive failure of at least one.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Collapse has no numerical threshold or specified market coverage.
  - There is no deadline.
  - The interval after collapse during which wealth and public explanations should be assessed is unspecified.
