evaluator_interpretation:
  - The ordinary reading is that the AI businesses discussed in the post had little adequate financial support remaining without Huang and NVIDIA's funding.
  - The context encompasses model developers, infrastructure providers, and hyperscalers, while placing particular emphasis on financially dependent startups.
  - The context describes the immediate aftermath of the leadership change. I use November 12 through the November 17 post as the observation period.
  - This is a claim about industry dependence, not a specified financial metric for one company.
support_condition: Evidence establishes the withdrawal of NVIDIA's support and shows that remaining customer cash flows, reserves, investors, lenders, and other corporate backers were inadequate across the businesses within scope.
contradiction_condition: Evidence establishes substantial, usable support independent of Huang and NVIDIA that was sufficient to sustain the businesses within scope during the stated period.
measurement_requirements: Compare remaining usable funds and cash flows with financing needs. Avoid adding announced funding targets to completed financing or counting the same funds repeatedly through related companies.
source_requirements: Cash-flow statements, funding agreements, credit facilities, and dated evidence of NVIDIA's withdrawal; reporting can identify gaps but cannot substitute for an industry-wide financing assessment.
