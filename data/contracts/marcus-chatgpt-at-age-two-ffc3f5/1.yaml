assessment_axis: historical_observation
explicit_source_elements:
  - hundreds of billions more
  - have been invested
  - on further speculation
  - scaling would somehow magically cure problems
  - appear to be inherent with the technology
  - The last two years
evaluator_interpretation:
  - The ordinary numerical reading of hundreds of billions is at least 200 billion; US dollars are inferred from the industry context, not explicitly stated.
  - Have been invested describes investment already made by publication. Announced future spending is not automatically realized investment.
  - More is read as additional investment during the surrounding two-year retrospective, approximately 2022-11-28 through 2024-11-28; no earlier baseline is supplied.
  - The claim links the amount to an expectation that scaling would cure reliability problems. Spending on AI infrastructure or better models alone does not establish that rationale.
  - Magically is rhetorical. Appear to be inherent is a hedge about the problems, not a conditional forecast antecedent.
  - No company figures, press estimate, or accounting convention is identified, so the claimed accounting basis remains unknown.
support_condition: Comparable, nonduplicated records establish at least US$200 billion of additional realized investment within the period, with evidence connecting that amount to expectations that scaling would cure LLM reliability problems.
contradiction_condition: Comprehensive records on the same investment definition establish a total below US$200 billion, or establish that the amount attributable to the stated rationale falls below that threshold.
measurement_requirements: Identify investors, recipients, period, accounting basis and investment category. Separate completed financing, realized capital expenditure and future commitments; avoid counting financing and its subsequent expenditure twice.
source_requirements: Prefer filings and completed-transaction disclosures for amounts, and contemporaneous investor or company statements for investment rationales. Aggregate estimates must disclose coverage and avoid double counting.
