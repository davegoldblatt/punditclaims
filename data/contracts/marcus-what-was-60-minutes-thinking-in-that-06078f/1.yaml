assessment_axis: forecast_outcome
explicit_source_elements:
  - eventually
  - AI will have a big impact on drug design
  - Perhaps with current techniques, perhaps not
evaluator_interpretation:
  - Eventually supplies no deadline.
  - The allowance for future techniques broadens the forecast; it is not an antecedent that must occur before scoring.
  - Big impact means a substantial demonstrated change in drug-design practice, productivity or successful therapeutic output.
  - One promising candidate is evidence of progress, but does not by itself establish a substantial impact across drug design.
support_condition: Public evidence establishes substantial, sustained changes in drug-design productivity or practice attributable to AI, or substantial therapeutic output from AI-designed drugs.
contradiction_condition: No finite period without success contradicts this unrestricted eventual forecast. An adverse trial result or failure of current techniques is insufficient.
measurement_requirements: Distinguish candidate generation, clinical efficacy, approval and adoption. Claims of productivity gains require measured outcomes and a credible comparison with conventional design.
source_requirements: Primary clinical reports, regulatory records and independently checkable evidence of adoption or productivity. Company announcements can document milestones but do not alone establish industry-wide impact.
metric_scope: null
original_horizon: eventually
horizon_interval:
  start: 2023-10-10
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only after a dated, independently substantiated milestone establishes substantial realized therapeutic output or sustained, substantial adoption or productivity gains attributable to AI in drug design. Candidate announcements, a single exploratory trial or a trial start do not alone meet this rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - Big impact has no numerical threshold.
  - The forecast permits unspecified future techniques.
  - Impact could concern productivity, adoption or successful medicines.
retrospective_or_prospective: retrospective
