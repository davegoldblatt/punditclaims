explicit_source_elements:
  - these price cuts
  - would be
  - deadly
  - to the AI industry
evaluator_interpretation:
  - Read the condition as substantial token-price reductions by both OpenAI and Anthropic following the contemplated June price competition.
  - Read 'deadly' as widespread business failure or lasting destruction of financial viability among AI model providers. Lower prices or narrower margins alone do not meet that standard.
  - No deadline is supplied. Later model-specific cuts establish that both companies cut token prices, but do not prove that the exact June proposals were implemented unchanged.
support_condition: Both companies implement substantial token-price cuts, followed by widespread insolvencies, closures, or lasting loss of financial viability attributable to those cuts.
contradiction_condition: Evidence conclusively establishes that the relevant cuts were absorbed while the affected industry achieved durable financial viability. A few months of continued operation cannot conclusively refute an undated prediction.
measurement_requirements: Dated old and new token prices, provider closures and insolvencies, financial viability across a defined industry population, and evidence separating the effect of price cuts from other causes.
source_requirements: Company pricing disclosures and filings, insolvency records, and credible industry financial reporting. Company survival or fundraising alone is insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Resolve only on a decisive documented industry failure attributable to the relevant cuts, or a completed adjustment with compelling evidence that those cuts cannot produce the predicted fatal damage. Ordinary continued operation is not conclusive.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The boundaries of 'AI industry' are unspecified.
  - The scale of damage meant by 'deadly' is unspecified.
  - No deadline or adjustment period is supplied.
  - Later model-specific reductions may differ from the cuts contemplated in June.
