assessment_axis: forecast_outcome
explicit_source_elements:
  - I think
  - a lot of these data center deals
  - will never get built
  - thus will never get paid
evaluator_interpretation:
  - The factual commitment is that a substantial number of the announced AI infrastructure deals under discussion will permanently fail to produce the contracted facilities and consequently will not receive the associated payments.
  - Trash is an opinion and is not assessed.
  - A lot does not specify a count, percentage or denominator. No numerical threshold is invented.
  - Never getting paid is interpreted as failure to receive the contemplated operating-contract payments, rather than a claim that no contractor, lender or developer receives any money.
  - There is no specified deadline. Delay, tenant withdrawal and permanent project abandonment are distinct events.
  - This concerns a sector-level set of deals, not a specified company's financial statement metric.
support_condition: Records identify a clearly substantial set of the referenced deals that permanently ended without the contracted facilities being delivered, together with evidence that noncompletion prevented the contemplated payments.
contradiction_condition: Completion and payment records for all or essentially all of an identifiable referenced cohort leave no substantial set fitting the prediction. A single completed project is insufficient.
measurement_requirements: Identify the cohort as understood at publication, track original deals and replacements, distinguish delays from permanent cancellation, and verify payment consequences.
source_requirements: Project and contract termination records, commissioning records, customer acceptance and payment disclosures. News reporting may establish a withdrawal when primary records are unavailable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only when definitive completion/payment or permanent termination/nonpayment records establish the result across a clearly substantial, identifiable cohort. An isolated cancellation or passage of time is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - A lot has no numerical threshold.
  - These deals does not identify a closed cohort.
  - Never provides no deadline.
  - Paid does not identify the recipient or payment type.
  - A site can continue with a replacement customer after a deal ends.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
