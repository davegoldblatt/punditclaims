ambiguity_flags:
  - Pure for profit play is not a defined legal or financial category.
  - At odds can mean structural constraints or actual conflict in every decision; the ordinary structural reading is used.
  - The historical period is inferred from always and the surrounding discussion of the 2019 hybrid structure.
