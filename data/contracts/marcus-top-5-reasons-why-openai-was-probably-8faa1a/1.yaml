assessment_axis: historical_observation
explicit_source_elements:
  - overriding nonprofit mission
  - was always going to be at odds
  - a pure for profit play
evaluator_interpretation:
  - The ordinary reading is that OpenAI's governing mission constrained pursuit of investor returns whenever the two conflicted.
  - Pure for profit means an investment whose commercial objectives are not subordinated to OpenAI's charitable mission.
  - The historical scope is the hybrid arrangement from its 2019 introduction through the post date, rather than a newly selected reporting period.
  - The claim does not require that earning profits and serving the mission always conflict.
support_condition: Contemporaneous governance documents give the nonprofit controlling authority and explicitly subordinate investor interests to its mission, including when doing so can reduce financial returns.
contradiction_condition: The governing arrangement gives unrestricted commercial objectives priority over the nonprofit mission or leaves that mission without controlling authority.
measurement_requirements: Examine mission priority, nonprofit control and obligations accepted by investors. Profitability or valuation alone cannot establish compatibility with a purely commercial mandate.
source_requirements: Contemporaneous company governance disclosures, governing agreements or official legal records.
