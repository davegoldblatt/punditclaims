explicit_source_elements:
  - if a system does well on a benchmark that is designed to solve X, the system has actually solved X
  - Over and over, the field of AI has discovered otherwise
  - Guy van den Broeck’s study is a perfect example
evaluator_interpretation:
  - The plain reading is that multiple studies have found benchmark success without reliable mastery of the intended task.
  - I treat 'solved X' as reliable performance on valid instances of the intended task beyond the benchmark's incidental cues.
  - The named study is assessed alongside other documented cases. 'Perfect example' is rhetorical emphasis rather than a separate measurable threshold.
  - The claim describes the research record through the post date, with no stated beginning.
support_condition: Multiple studies document benchmark success alongside failures on valid tests of the intended task, and the van den Broeck study demonstrates this mismatch.
contradiction_condition: The named study does not demonstrate the alleged mismatch, and the purported repeated examples do not survive examination of their tasks, controls, or results.
measurement_requirements: Identify the intended task, establish benchmark success, and examine independent or controlled tests of the same underlying ability. An unrelated harder task is insufficient.
source_requirements: The named research paper and independent primary studies reporting relevant results by the post date.
