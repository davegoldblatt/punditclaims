evaluator_interpretation:
  - The ordinary financial reading is whether available resources and committed financing could meet existing construction commitments when payments became due.
  - Use the December 31, 2024 balance-sheet snapshot, the latest complete financial position publicly reported before the post.
  - The surrounding $39 billion figure is an extrapolated buildout estimate, not an identified contractual payment total.
  - Requiring cash on hand to equal every future payment would be a narrower test than ordinary payment capacity.
support_condition: A dated schedule shows that existing cash, usable committed financing, and reasonably documented contractual receipts were insufficient for existing commitments when due.
contradiction_condition: A dated schedule demonstrates sufficient available funding and contractual receipts to cover those commitments when due.
measurement_requirements: Separate unrestricted cash, conditional borrowing availability, estimated construction costs, and contractual payments; identify payment dates and avoid counting overlapping commitments twice.
source_requirements: Company liquidity and commitment disclosures, construction agreements, and a reproducible basis for the external buildout estimate.
