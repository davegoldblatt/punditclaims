assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic spent $2.66 billion on Amazon Web Services
  - through the end of September
  - 104% of its $2.55 billion in revenue up until that point
  - based on my own analysis of reported revenues
  - likely spent just as much on Google Cloud
evaluator_interpretation:
  - The period is calendar 2025 from January 1 through September 30, 2025, matching the October 2025 reporting he refers to.
  - "The scored core is two figures: about $2.66B of AWS spending and about $2.55B of revenue for that period, giving a ratio of roughly 104%."
  - The Google Cloud clause is explicitly hedged ('likely'). It is not scored as support or contradiction; it is only noted as context.
support_condition: Independent reporting or company disclosure shows Anthropic's AWS spending for January to September 2025 was about $2.66B (roughly equal to or above its revenue for that period), and its revenue for the period was about $2.55B.
contradiction_condition: Independent reporting or company disclosure shows Anthropic's AWS spending for January to September 2025 was materially below $2.66B (well under its revenue), or its revenue for the period was materially different from $2.55B so that the 104% ratio fails.
measurement_requirements: AWS-specific spending (billing or expense) for Jan to Sep 2025 and Anthropic revenue for the same period, from a source independent of the speaker.
source_requirements: Anthropic filings (e.g. its S-1), Amazon disclosures, or reputable independent reporting. The speaker's own reporting cannot count.
metric_scope:
  company: Anthropic
  metric: AWS spending as a share of revenue (AWS spend ~$2.66B vs revenue ~$2.55B)
  currency: USD
