explicit_source_elements:
  - Tools like Claude Code
  - can actually be very useful
  - they are neurosymbolic
  - not pure LLMs
evaluator_interpretation:
  - Usefulness means demonstrated assistance with substantive software work, without requiring universal gains or autonomous replacement of engineers.
  - "For the architecture assertion, use the broad operational reading: a neural language model combined with explicit executable tools and programmed control mechanisms."
  - This reading of 'neurosymbolic' is an evaluator interpretation. It does not establish that Claude Code contains a formal symbolic reasoning engine.
  - Assess the product's capabilities during April 1–27, the current month before publication.
support_condition: Dated evidence demonstrates useful software work and shows that Claude Code combines model inference with executable tools or programmed control mechanisms, under the stated broad architectural reading.
contradiction_condition: Evidence establishes either that the product cannot provide substantive software assistance or that it is only language-model inference without the external computational components described in the contract.
measurement_requirements: Distinguish the Claude model from the Claude Code product. Separate demonstrated usefulness from marketing claims and distinguish tool integration from formal symbolic reasoning.
source_requirements: Prefer dated product documentation and concrete task or deployment reports.
