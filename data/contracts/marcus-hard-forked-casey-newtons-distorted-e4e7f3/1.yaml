evaluator_interpretation:
  - Assess the technical-state observation, rather than estimating how much danger the absence of guarantees causes.
  - The ordinary reading concerns dependable assurances covering general-purpose AI behavior across realistic uses, including adversarial situations.
  - A guarantee about one restricted property under specified assumptions does not establish helpfulness, harmlessness and honesty together.
  - Use the latest pre-post technical reporting quarter, 2024 Q4 through December 6, for the ongoing state. Earlier research is context.
  - This is a claim about available assurance methods, not a proof that safe AI is impossible.
support_condition: Contemporaneous evaluations demonstrate substantial failures of intended safeguards, and technical research explains why available testing and assurance methods do not guarantee the three broad behavioral properties.
contradiction_condition: A publicly documented and independently scrutinized method available in the target period supplies reliable, sufficiently general assurances of helpfulness, harmlessness and honesty for current or concretely buildable advanced AI.
measurement_requirements: Distinguish empirical safety improvements, restricted formal guarantees and broad behavioral assurances. Examine the assumptions and scope of any claimed guarantee.
source_requirements: Contemporaneous independent evaluations and primary technical research, including proposed guarantee methods and their limitations.
