  - Industry size could mean revenue, valuation or economic impact.
  - The boundary between generative-AI services, bundled software and infrastructure is unspecified.
  - "'Actually try' supplies no objective threshold beyond ordinary commercialization."
  - The accounting basis is unspecified.
