evaluator_interpretation:
  - The plain reading is that Bubeck publicly overstated the novelty of GPT-5-assisted mathematical results and Hassabis publicly challenged that portrayal.
  - Blew up means publicly exposed or called out the overstatement; it does not require Hassabis to have independently discovered the mathematical correction.
  - Wildly overhyped is assessed through the concrete distinction between finding existing solutions and producing new solutions to genuinely open problems.
  - The target period is October 1 through the October 18 publication date.
support_condition: Records show Bubeck presenting literature-retrieval results in wording reasonably implying novel mathematical solutions, a substantive correction establishing the results were already known, and a public challenge by Hassabis.
contradiction_condition: The relevant results were genuinely new, Bubeck's disputed presentation clearly limited itself to literature retrieval, or Hassabis did not publicly challenge the presentation.
measurement_requirements: Identify the disputed statements, distinguish database status from mathematical novelty, and establish the content and timing of Hassabis's response.
source_requirements: Original posts and corrections, statements from the relevant mathematicians, and reliable contemporary reporting where deleted posts cannot be recovered.
