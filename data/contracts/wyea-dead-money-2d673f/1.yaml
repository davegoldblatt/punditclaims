target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No scale or duration defines stopping new financing.
  - Pressure and fixing the problem have no specified measures.
  - All existing debt may be literal or a market-wide generalization.
  - The passage combines an ongoing mechanism with a conditional consequence.
