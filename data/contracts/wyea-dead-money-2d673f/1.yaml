assessment_axis: causal_assessment
explicit_source_elements:
  - the more data center debt that gets raised
  - the more expensive both the data centers and the debt become
  - the only way of fixing the problem is to stop financing new data center debt
  - once that happens
  - create pressure on all of the debt that’s already been issued
evaluator_interpretation:
  - The plain reading asserts a causal feedback mechanism, an exclusive remedy, and a further consequence if new financing stops.
  - Pressure on existing debt means worsening credit conditions, such as falling prices, rising spreads or greater default risk.
  - Issuance and costs moving together would not alone establish that issuance caused the increases.
  - This is assessed as a causal claim. The financing-stop clause remains an unobserved contingency unless a qualifying halt is documented.
  - No company-specific monetary amount is asserted, so metric_scope is null.
support_condition: Evidence identifies increased issuance as a cause of both financing and development cost increases, establishes why stopping issuance is necessary, and documents or credibly identifies broad existing-debt stress caused by a financing halt.
contradiction_condition: Credible evidence breaks a necessary link, demonstrates another effective remedy while financing continues, or shows that a qualifying halt does not exert the asserted broad pressure.
measurement_requirements: Separate issuance effects from benchmark interest rates, demand, credit quality, power constraints, equipment supply and project execution. Distinguish debt price changes from default risk.
source_requirements: Causal research, identified market episodes or sufficiently detailed financing and project records. Commentary and contemporaneous correlations provide context only.
