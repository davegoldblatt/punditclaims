explicit_source_elements:
  - across the full set of our Technology Review questions
  - GPT-3’s earlier version to the current version (InstructGPT)
  - far more modest than one might have expected
  - fewer outright wacky answers
  - some old answers now correct
  - some backsliding, too
evaluator_interpretation:
  - The plain reading is a limited overall improvement on the complete question set, with fewer plainly nonsensical responses, some corrected failures, and some newly incorrect answers.
  - The surrounding discussion supplies Alexander’s six-question comparison as the reference for expectations. It does not supply a numerical threshold for modest improvement.
  - The target is the comparison newly reported around the post date. I use June 1–7, 2022 for this early-June observation; the earlier GPT-3 answers serve as its historical baseline.
  - Backsliding means an earlier correct response becoming incorrect on the same question. It does not by itself establish a decline in the model’s average capability.
support_condition: An admissible comparison covering the complete question set shows a limited aggregate improvement, fewer plainly nonsensical answers, at least one corrected earlier failure, and at least one earlier success becoming incorrect.
contradiction_condition: An admissible complete-set comparison shows a clearly large aggregate improvement under consistent scoring, or establishes that one of the claimed directional changes did not occur.
measurement_requirements: Matched prompts and outputs for both versions, complete-set coverage, model and sampling settings, consistent correctness and nonsense criteria, and counts of improvements, unchanged results, and regressions. Separate observed response changes from claims about repeatable model performance.
source_requirements: Evidence available by 2026-10-28. Under the supplied rule, Marcus’s own or coauthored writing cannot establish that his claim was correct. Independent examination of authenticated historical outputs could qualify.
