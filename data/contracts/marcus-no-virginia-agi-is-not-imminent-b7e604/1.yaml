assessment_axis: historical_observation
explicit_source_elements:
  - Humans can write summaries of things without hallucination
  - LLMs cannot do so reliably
evaluator_interpretation:
  - The plain reading concerns dependable factual faithfulness in ordinary summarization, not an inability to produce any correct summary.
  - Hallucination means adding factual content unsupported by, or inconsistent with, the material being summarized.
  - For this ongoing observation, I use August 2023 through publication as the latest reporting window. The monthly boundary is an evaluator convention because model evaluations have no fixed reporting cycle.
  - No numerical reliability threshold, document distribution, prompting method, or model list is supplied. I do not substitute a requirement of perfect accuracy.
support_condition: Representative evaluations of then-current LLMs show recurring unsupported factual content across ordinary summarization tasks, sufficient to undermine dependable use.
contradiction_condition: Representative evaluations show that then-current LLMs dependably produce factually faithful summaries across ordinary tasks, including suitable comparisons with human summaries.
measurement_requirements: Human-validated factual-consistency measurements, identified model versions and prompts, document types, sample sizes, and uncertainty. Overall summary preference and error-detection accuracy are insufficient substitutes.
source_requirements: Primary evaluations with observations attributable to the target period. Later publications may qualify only when their underlying observations are dated to that period.
