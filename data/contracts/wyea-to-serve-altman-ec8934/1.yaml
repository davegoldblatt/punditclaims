assessment_axis: causal_assessment
explicit_source_elements:
  - OpenAI's continued existence
  - is necessary
  - keep companies interested/invested
  - in the industry at all
evaluator_interpretation:
  - The industry means generative AI.
  - Necessary means that corporate interest and investment would not continue if OpenAI ceased operating.
  - Investment in competitors while OpenAI remains active is relevant context, but does not test that counterfactual.
  - This is a causal necessity claim, not a conditional forecast with a stated deadline.
support_condition: Credible causal evidence shows that OpenAI's disappearance would eliminate corporate participation in generative AI, separating that effect from wider market conditions.
contradiction_condition: Companies demonstrably continue meaningful generative-AI participation after OpenAI ceases operating, or credible causal evidence otherwise establishes that such participation does not require its existence.
measurement_requirements: Define cessation as the end of OpenAI's operating business, not a corporate conversion, leadership change or service outage. Distinguish durable participation from winding down prior commitments.
source_requirements: Dated evidence of cessation and subsequent corporate decisions, or a credible causal study identifying the counterfactual.
