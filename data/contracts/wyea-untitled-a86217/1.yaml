assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI’s deal will immediately lose them money
  - from the second iOS 18 launches
  - doesn’t even appear to pay OpenAI
evaluator_interpretation:
  - Losing money means the deal's attributable costs exceed its attributable revenue, including subscription revenue. Lack of a payment from Apple alone does not establish a loss.
  - The stated deadline is the public launch of iOS 18, not the later launch of its ChatGPT integration.
  - The financial prediction is an estimate inferred from the press reporting cited in the surrounding passage. It is not a claim about GAAP net income.
support_condition: Reliable deal-specific accounts or reporting establish a negative financial contribution when iOS 18 launched.
contradiction_condition: Reliable deal-specific accounts or reporting establish a nonnegative financial contribution at that launch.
measurement_requirements: Revenue and costs attributable to the Apple deal at launch, with consistent treatment of preparation costs, serving costs, and subscription conversions.
source_requirements: Deal-specific financial disclosures, contractual records, or credible reporting based on those records. Company-wide losses are insufficient.
