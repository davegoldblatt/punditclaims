explicit_source_elements:
  - as popular as ChatGPT may be
  - it isn't a business
  - constantly loses money
evaluator_interpretation:
  - I read 'isn't a business' in context as a claim that ChatGPT does not cover its attributable costs, rather than a literal denial that it sells subscriptions.
  - The target is ChatGPT across its offerings, not OpenAI as a whole or only ChatGPT Pro.
  - For the ongoing financial state, I use January–March 2025, the latest completed calendar quarter before the post. Earlier comparable periods would also be needed to establish 'constantly'.
  - The statement identifies no accounting basis or cost-allocation method; accounting_basis therefore remains unknown.
support_condition: Comparable product-level accounts show ChatGPT revenue below attributable costs in the target quarter and consistently in preceding reporting periods.
contradiction_condition: Comparable product-level accounts show ChatGPT covering its attributable costs in the target quarter or a material preceding period inconsistent with continuous losses.
measurement_requirements: ChatGPT revenue and attributable inference, development, staffing, and overhead costs on a consistent basis. Do not substitute OpenAI-wide losses, cash burn, or gross margins for ChatGPT's product result.
source_requirements: Product-level accounts or credible reporting that identifies the product boundary and accounting basis. The unknown basis must be resolved before a supported or contradicted outcome.
