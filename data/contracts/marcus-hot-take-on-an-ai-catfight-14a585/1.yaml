evaluator_interpretation:
  - Read as cumulative AI infrastructure expenditure compared with cumulative corresponding AI revenue through the post date.
  - The surrounding discussion suggests generative AI, but the industry boundary and starting date are unspecified.
  - Read 250B as US dollars. Treat both numerical figures as approximate, while retaining the firm claim of a very large spending excess.
  - No cited financial source establishes an accounting basis; mark it unknown.
support_condition: Comparable cumulative expenditure and revenue records for the same industry, period and accounting basis show spending vastly exceeding revenue, with estimates broadly consistent with the suggested scale.
contradiction_condition: Comparable records show expenditure near or below revenue, or show that the suggested magnitude is materially overstated beyond reasonable estimation uncertainty.
measurement_requirements: Match industry coverage and cumulative periods. Separate realized expenditure from commitments and realized revenue from annualized run rates. Avoid double-counting transactions between infrastructure suppliers and AI providers.
source_requirements: Industry estimates with transparent methods and underlying company disclosures covering both sides of the comparison.
