explicit_source_elements:
  - needs $655 billion
  - in the next five years
  - to pay all its bills
  - loses billions of dollars a year
evaluator_interpretation:
  - Assess the spending requirement or projection that existed when the post appeared, rather than whether future spending has already occurred.
  - The plain reading of all its bills is gross company-wide expenditure, not an external financing gap after revenue.
  - Read next five years literally as February 26, 2026 through February 26, 2031; a calendar 2026–2030 budget is a plausible alternative but is not identical.
  - Use calendar 2025 for the annual-loss component because the surrounding passage explicitly discusses 2025 results.
  - The observation window includes the described 2025 loss year and the spending-plan snapshot on February 26, 2026.
  - The single contract metric_scope records the quantified spending requirement. Annual net losses are a separate component and require separately scoped evidence.
support_condition: A contemporaneous, complete spending schedule or credible financial projection establishes approximately $655 billion of company-wide bills over the stated five years, and comparable annual results establish multibillion-dollar net losses.
contradiction_condition: Comparable evidence establishes a materially different total requirement over the same five years, or establishes that the described annual net losses did not occur. A different compute-only budget does not by itself contradict total bills.
measurement_requirements: Separate total expenditure from compute expenditure, contractual commitments from projections, gross bills from external financing needs, and net losses from operating losses or cash burn.
source_requirements: Prefer financial statements and complete commitment schedules. If unavailable, use independent financial reporting with its basis and limitations stated.
