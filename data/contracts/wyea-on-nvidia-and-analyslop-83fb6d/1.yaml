ambiguity_flags:
  - Compound observation combines a current spending projection with historical annual losses.
  - Next five years could mean a rolling interval or calendar years 2026–2030.
  - Needs does not distinguish binding obligations from planned expenditure.
  - Losses does not specify net income, operating income, or cash burn; the ordinary accounting reading is net losses.
  - The latest annual period is taken as 2025 from the surrounding passage.
