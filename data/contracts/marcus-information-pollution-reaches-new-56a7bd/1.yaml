explicit_source_elements:
  - Meanwhile
  - X itself
  - is promoting nonsense
evaluator_interpretation:
  - The plain reading is that X's own discovery or recommendation features were giving prominence to false or misleading stories.
  - Promotion includes automated placement in Explore or a homepage trending panel. It does not require deliberate endorsement by X employees.
  - "The target period is April 4–6, 2024: the immediately preceding Thursday and Friday referenced in the surrounding passage through publication on Saturday. This is an interpretation of the ongoing state, not an explicit date range supplied by Marcus."
  - A documented instance establishes this unquantified observation. The claim does not specify frequency, audience size, or a rate of increase.
support_condition: A contemporaneous record shows X's own discovery or recommendation features prominently surfacing at least one demonstrably false or misleading story during the target period.
contradiction_condition: Reliable records establish that the alleged platform promotions in the target period did not occur, or that the promoted stories identified as nonsense were accurate. Merely showing that users posted falsehoods would not establish platform promotion.
measurement_requirements: Identify the story, establish its falsity, and distinguish placement by X's features from ordinary user posts.
source_requirements: Prefer archived platform displays or contemporaneous screenshots. Direct reporting that documents those displays can establish placement; independent fact-checking can establish falsity.
