assessment_axis: causal_assessment
explicit_source_elements:
  - Both companies
  - much the same product
  - giving away API credits and free weeks of access
  - to create the symbolic aura of an “essential” product
  - continue convincing VCs and the public markets
  - effectively paying their customers
evaluator_interpretation:
  - Both companies means OpenAI and Anthropic; the immediately preceding discussion identifies their competing coding products.
  - The observation concerns promotional activity leading up to June 23, 2026. Earlier promotions establish a practice but do not automatically establish an offer remained active that day.
  - Effectively paying customers is read as subsidizing access, not necessarily making cash payments.
  - The alleged investor-facing purpose is a substantive causal component. Establishing promotions alone does not establish that purpose.
support_condition: Dated records establish promotional credits or free access for both competing offerings, and reliable evidence connects those promotions to the claimed effort to manufacture apparent indispensability for investors.
contradiction_condition: Reliable records refute a material promotional assertion or establish that the alleged causal account is false. A company's stated alternative purpose alone is insufficient.
measurement_requirements: Identify the product, eligibility, dates and form of each promotion. Distinguish API credits, subscription usage allowances and free trials. Examine evidence of purpose separately from promotional activity.
source_requirements: Prefer dated offer terms and company announcements for promotions; require internal records, attributable testimony or a credible investigation for the claimed investor-facing purpose.
