evaluator_interpretation:
  - The comparison concerns performance on the 2025 IMO problems in the reported evaluations.
  - The ordinary reading of 'much stronger' is a substantial score advantage over every named MathArena configuration. It does not establish superiority under equal compute budgets or on mathematics generally.
support_condition: Both experimental systems have reported, expert-graded IMO 2025 scores substantially above every named model in the referenced MathArena evaluation.
contradiction_condition: Either experimental system lacks the substantial reported score advantage, or reliable checking overturns the results on which that advantage depends.
measurement_requirements: Compare scores on the same six IMO 2025 problems, out of 42, preserving model configurations and differences in evaluation procedures.
source_requirements: MathArena's original evaluation and documented grading of the experimental systems; distinguish official IMO grading from separately commissioned grading.
