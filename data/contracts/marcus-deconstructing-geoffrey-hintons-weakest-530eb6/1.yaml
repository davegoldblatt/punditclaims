assessment_axis: historical_observation
explicit_source_elements:
  - LLMs don’t store things in simple databases
  - when presented with enough data
  - has demonstrably duplicated lengthy training materials multiple times
  - called memorization in the field
evaluator_interpretation:
  - This asserts that repeated examples of substantial training-text reproduction had been demonstrated by the post date.
  - Lengthy means extended passages or substantial code, rather than common short phrases. Multiple times means more than one demonstrated reproduction, not a minimum frequency in ordinary use.
  - Enough data describes the training setting. It does not specify a universal data-volume threshold or assert that every model reproduces every passage.
  - The wording has demonstrably duplicated refers to accumulated past demonstrations, so the target period has no stated beginning and ends on the post date.
  - The database distinction concerns text generated by learned model parameters, rather than text fetched through an external retrieval system.
support_condition: Primary research documents multiple extended outputs matching training material from neural language models, with methods that distinguish memorization from retrieval or accidental phrase overlap.
contradiction_condition: The relevant demonstrations are invalidated, or their apparent reproductions are shown to be prompt copying, external retrieval, or coincidental short overlap rather than generation of memorized training passages.
measurement_requirements: Document model and prompting method, compare generated text with training material, and report output lengths and repeated examples. Do not infer ordinary-use frequency from adversarial extraction.
source_requirements: Primary extraction studies with documented matching procedures; preferably models whose training membership can be verified.
