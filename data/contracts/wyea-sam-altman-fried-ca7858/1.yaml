early_resolution_rule: A dated longitudinal assessment establishing a sustained, broad slowdown under comparable measures could support early resolution. An isolated benchmark plateau or model release is insufficient. Continuing progress cannot conclusively disprove an eventual slowdown without supplying a deadline.
