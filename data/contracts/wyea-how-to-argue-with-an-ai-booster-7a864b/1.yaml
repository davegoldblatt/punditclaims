explicit_source_elements:
  - once built
  - very little economic activity
  - They don't create jobs
  - massive amounts of land and utilities
  - piss off and poison their neighbors
evaluator_interpretation:
  - The context concerns operating AI data centers in America. Construction employment is excluded.
  - The ordinary reading is that permanent employment and continuing local economic benefits are small relative to the facilities' scale. The separate assertion that they create no jobs is stronger.
  - Poisoning means harmful pollution affecting neighboring communities; complaints alone do not establish harmful exposure.
  - Because no reporting period is specified, use April–June 2025, the latest completed quarter before publication. Earlier industry studies provide context only.
  - Evidence from one controversial facility can establish an example, but cannot establish the entire industry's typical effects.
support_condition: Representative operating-facility evidence shows small continuing economic benefits and negligible permanent employment, substantial land and utility demands, and documented neighborhood opposition and harmful pollution.
contradiction_condition: Comparable evidence shows substantial continuing economic benefits or employment, or materially undermines the asserted resource and pollution effects. Verified permanent jobs would contradict the literal no-jobs clause.
measurement_requirements: Separate operating employment and output from construction, announced jobs from filled jobs, electricity capacity from consumption, and emissions or complaints from measured harmful exposure.
source_requirements: Prefer utility records, employment records, public economic studies, environmental measurements and permitting records. Identify statements from interested parties.
