ambiguity_flags:
  - Latest completed quarter selected for an undated ongoing observation.
  - Very little and massive have no numerical thresholds or comparators.
  - No jobs could mean literally none or very few relative to investment.
  - The breadth of the generalization is unspecified.
  - Poison could refer to emissions, harmful exposure or demonstrated illness.
