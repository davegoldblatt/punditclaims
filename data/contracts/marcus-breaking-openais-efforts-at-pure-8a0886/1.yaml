explicit_source_elements:
  - the myth that you could predict an AI system's performance simply based on how much data and how many parameters you use
  - which motivated a half trillion dollar industry
  - is dead
evaluator_interpretation:
  - "'The myth is dead' is a rhetorical judgment. It could mean that the belief had been shown false, or that the field had abandoned it. Marcus does not say which, and he gives no measure for either."
  - Under the 'abandoned' reading, OpenAI's CEO had publicly backed scaling laws four days earlier. But he folded inference compute into the picture, which partly fits Marcus's point that data and parameters alone are not the story. So the evidence cuts both ways and settles nothing.
  - Under the 'shown false' reading, no agreed test separates 'scaling laws still predict loss' from 'scaling laws fail to predict useful capability'.
support_condition: Not adjudicable. A clear sign would be broad agreement in the field, or among leading labs, that data-and-parameter scaling no longer predicts performance, together with labs abandoning that basis for investment.
contradiction_condition: Not adjudicable. A clear sign would be leading labs still openly relying on data-and-parameter scaling laws to predict performance and to justify investment after February 2025.
