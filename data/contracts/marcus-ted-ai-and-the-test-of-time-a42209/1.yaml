explicit_source_elements:
  - LLMs were not reliable
  - They still aren’t
evaluator_interpretation:
  - The plain reading is that general-purpose LLMs continued to make recurring factual or reasoning errors that prevented users from depending on their answers without checking.
  - This does not mean that every answer was wrong, that no application was reliable, or that models had stopped improving.
  - Use the most recent completed quarter before publication, January through March 2024, for contemporaneous evaluations. Marcus supplied no reporting period or numerical reliability threshold.
support_condition: Contemporaneous evaluations across multiple prominent models document recurring factual or reasoning errors in substantive tasks.
contradiction_condition: Broad contemporaneous evaluations establish dependable factual and reasoning performance across the claimed scope, with failures confined to exceptional cases.
measurement_requirements: Evaluations must identify their tasks and models. Task-specific results must not be presented as a universal error rate.
source_requirements: Primary evaluations or documented tests available before the post, preferably covering multiple model families.
