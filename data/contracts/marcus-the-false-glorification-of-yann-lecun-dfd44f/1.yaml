explicit_source_elements:
  - the idea of world models is not new
  - goes back to the 1950s
  - Herb Simon’s General Problem Solver
evaluator_interpretation:
  - In context, world models includes symbolic cognitive representations of a problem environment and rules describing possible changes.
  - Goes back to means that a relevant antecedent existed by the 1950s; it does not assert that GPS was the earliest conceivable antecedent.
  - The claim does not require GPS to have learned a modern neural model from sensory data.
  - Simon's General Problem Solver identifies a project associated with Simon, not a claim of sole authorship.
support_condition: Historical technical records establish that GPS existed in the 1950s and represented a problem environment internally, including transformations used to reason about possible solutions.
contradiction_condition: Technical or historical records establish that GPS lacked the relevant internal representation, or that the attributed work did not exist until after the 1950s.
measurement_requirements: Compare the actual representation and transformation mechanism with the broad cognitive-model meaning used in the post.
source_requirements: Original GPS documentation or scholarly technical accounts explicitly tied to its dated publications.
