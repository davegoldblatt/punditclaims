assessment_axis: historical_observation
explicit_source_elements:
  - Not all current AI is dangerous
  - A lot of current AI is not dangerous
evaluator_interpretation:
  - The ordinary contextual reading is that many narrow AI applications pose little material danger in ordinary use, rather than that they have zero conceivable risk.
  - GPS navigation and AlphaFold illustrate the claim; they do not define the entire population of current AI.
  - I use October 2026 through the post date as the latest reportable month for this ongoing observation. Marcus supplies no reporting period.
  - A lot means a substantial, varied set of applications, without imposing an invented numerical percentage.
support_condition: Representative safety assessments and deployment records establish that many current AI applications pose little material danger in ordinary use.
contradiction_condition: Representative evidence establishes material danger across the supposedly low-risk applications sufficient to undermine the claim that many are low risk. An isolated harmful incident does not refute the whole proposition.
measurement_requirements: Define the application population, intended use, exposure and severity of harms. Distinguish low risk from no recorded incidents, and assess the examples without treating them as a complete survey.
source_requirements: Current safety evaluations, deployment studies and incident investigations, preferably independent and covering varied narrow applications.
