evaluator_interpretation:
  - The plain reading is that a substantial number of corporate customers moved purchases or workloads from OpenAI to Anthropic.
  - A customer need not stop using OpenAI entirely, but adding Anthropic without displacing OpenAI does not establish the claim.
  - Use calendar 2025, the latest completed annual enterprise-adoption period before the post, for this ongoing observation.
  - Market-share changes are supporting context, not a direct count of customer transfers.
support_condition: Customer-level purchasing records, a suitable survey, or multiple documented migrations establish substantial movement from OpenAI to Anthropic during the target period.
contradiction_condition: Comparable customer-level evidence shows little such movement and attributes Anthropic's gains predominantly to new demand or additions without meaningful displacement.
measurement_requirements: Track customer transitions or displaced workloads, distinguish customer counts from spending shares, and account for customers using multiple providers.
source_requirements: Prefer purchasing panels, surveys with disclosed methods and customer disclosures. Disclose financial interests of survey sponsors.
