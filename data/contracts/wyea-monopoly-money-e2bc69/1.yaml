assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft, Google, Amazon and Meta
  - monopolize the infrastructure itself
  - data centers they can build (or already own)
  - access to the specialized GPUs necessary to run these models
evaluator_interpretation:
  - The ordinary contextual reading is effective collective control of infrastructure for large-scale model training and operation, sufficient to obstruct independent competition.
  - This does not require literal ownership of every data center or GPU. Conversely, a majority share of general cloud revenue does not by itself establish control of AI infrastructure.
  - Use calendar Q2 2024, the latest completed quarter that could have been reported before the post, for the undated ongoing state.
  - The claim supplies no geographical limit; the comparison is worldwide.
support_condition: AI-specific capacity, GPU-access, and commercial-access evidence establishes effective collective control by the four firms over competitive large-scale model infrastructure.
contradiction_condition: Evidence establishes material independent infrastructure and GPU access at competitive scale, sufficient to show that the four firms did not exercise the claimed collective control.
measurement_requirements: Worldwide AI-capable data-center capacity, high-end GPU ownership or secured access, availability to independent customers, and dependence on the named firms. Distinguish physical ownership from capacity controlled through contracts.
source_requirements: Infrastructure inventories, procurement disclosures, competition investigations, and independent market measurements. General cloud revenue shares are contextual proxies only.
