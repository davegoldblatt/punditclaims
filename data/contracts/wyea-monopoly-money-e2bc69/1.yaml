  start: 2024-04-01
  end: 2024-06-30
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Latest reportable quarter selected for an undated ongoing observation.
  - Monopolize could mean exclusivity, effective control, or merely substantial concentration.
  - No defined infrastructure market, geographical scope, or market-share threshold.
  - Ownership, procurement priority, rented capacity, and customer access are different forms of control.
