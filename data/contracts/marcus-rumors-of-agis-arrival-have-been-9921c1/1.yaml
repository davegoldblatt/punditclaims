assessment_axis: historical_observation
explicit_source_elements:
  - Task-level performance
  - even when impressive
  - is not sufficient evidence of general intelligence
evaluator_interpretation:
  - The ordinary reading is that high performance on individual fixed tasks alone does not establish flexible transfer across broad unfamiliar tasks.
  - This does not say task performance is irrelevant, or that sufficiently broad and well-controlled behavioral evaluations cannot provide evidence of intelligence.
  - Treat this as a claim about the evidentiary relationship illustrated by research available through publication, rather than a claim restricted to one current model.
support_condition: Measurement research or controlled experiments show that strong performance on tested tasks can coexist with failure to transfer the relevant knowledge or skill.
contradiction_condition: Task scores alone reliably establish the specified broad generalization, without additional assumptions, controls, or transfer evaluations.
measurement_requirements: Separate performance on trained or familiar tasks from performance under meaningful changes of task or context.
source_requirements: Primary measurement research and experiments testing transfer, including qualifications and evidence that identified failures can be mitigated.
