evaluator_interpretation:
  - Assess the supplied normalized historical proposition. The appended prediction about future lobbying is outside this claim's normalized scope.
  - Repeatedly means at least two documented failures of voluntary technology-industry arrangements intended to protect the public.
  - Failure means a material shortfall against promised or intended protections, not proof that every voluntary program failed.
  - The present-perfect wording describes accumulated history before the post. No starting date is supplied, so the target period has an open beginning.
support_condition: At least two documented pre-post failures show voluntary technology-industry arrangements materially falling short of public-protection commitments or intended safeguards.
contradiction_condition: The alleged examples are rebutted or shown not to concern self-regulation, leaving no established pattern of repeated failures. Successful programs alone do not refute this existential claim.
measurement_requirements: Identify the voluntary safeguard, its intended protection, and the documented shortfall. Do not equate every regulatory violation with a failure of self-regulation.
source_requirements: Official investigations, enforcement records, or independent assessments documenting distinct failures.
