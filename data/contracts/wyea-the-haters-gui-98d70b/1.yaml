evaluator_interpretation:
  - Assess the implied prediction that the AI investment bubble will burst, rather than the personal promise to request an apology.
  - The ordinary contextual reading is a severe, sustained reversal across the AI trade discussed in the post, particularly its US companies and financing ecosystem.
  - No percentage decline, geographical boundary or deadline is supplied. A regional crash or brief correction alone does not establish the broader event.
  - The apology follows the predicted event; it is not an antecedent conditioning the bubble forecast.
support_condition: A documented, severe and sustained collapse across AI-linked valuations and investment establishes that the AI boom described in the post has broken.
contradiction_condition: No finite period without a collapse disproves an eventual forecast with no deadline.
measurement_requirements: Dated market prices and drawdown duration across representative AI companies, accompanied by financing or investment evidence. Distinguish regional and company-specific declines from a broad collapse.
source_requirements: Prefer exchange or index data and financial disclosures, supplemented by independent reporting on causes and breadth.
