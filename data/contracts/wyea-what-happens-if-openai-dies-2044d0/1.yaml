assessment_axis: historical_observation
explicit_source_elements:
  - a particularly-busy four-week-long period
  - use that period to inflate your revenues
  - exactly what OpenAI is doing
evaluator_interpretation:
  - Read this as an allegation that OpenAI deliberately selects unusually strong measurement windows to make annualized revenue unrepresentative.
  - The surrounding discussion concerns annualized revenue, not fabricated recognized sales.
  - "Use March 4 through August 18, 2026: the allegation invokes the dated March report and presents the practice as continuing at publication."
  - The product launch is an example, not a condition that must occur.
  - A trailing-window calculation alone does not establish deliberate selection or misleading representativeness.
support_condition: Independent records establish that OpenAI selected unusually busy four-week windows or selectively timed disclosures, and that this materially overstated a representative run rate during the described period.
contradiction_condition: Calculation records and disclosure schedules establish consistently applied windows without the alleged exceptional-period selection, with sufficient underlying revenue data to test representativeness.
measurement_requirements: Underlying weekly revenue, calculation dates, reporting policy and disclosure timing; evidence distinguishing sustained growth from temporary spikes.
source_requirements: Company calculation records, documented disclosure procedures, or credible reporting that establishes actual selection practices. A hypothetical alternative calculation is insufficient.
