assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority of companies that have bought GPUs
  - have yet to turn them into meaningful revenue
  - if they’ve turned them on at all
  - Most of NVIDIA’s sales are sitting in warehouses
evaluator_interpretation:
  - The context concerns AI GPUs, rather than consumer graphics purchases.
  - Read 'vast majority of companies' by company count and 'meaningful revenue' as substantial realized revenue attributable to GPU use; profitability is a separate question.
  - Read the warehouse assertion as more than half of sold AI GPU hardware remaining physically stored and undeployed. Unit count and sales value are plausible alternative denominators.
  - Use calendar Q2 2026, the latest completed common customer reporting quarter before the post, for the ongoing deployment and revenue state.
  - Exclude the normative demand that NVIDIA should have been forced to disclose this.
support_condition: A representative purchaser census establishes that a large majority lack substantial GPU-generated revenue, and shipment-to-deployment records establish that over half of the relevant sold hardware remains warehoused.
contradiction_condition: Representative records establish that either asserted majority is false. Examples of successful buyers or installed clusters alone are insufficient.
measurement_requirements: Specify the buyer population, sales cohorts and denominator. Measure realized GPU-attributable revenue separately from company revenue, profitability, reservations, installed capacity and active GPU-hours.
source_requirements: Representative purchaser revenue and deployment records linked to NVIDIA shipments, with a documented sampling method if a census is unavailable.
