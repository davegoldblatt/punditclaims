assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority of companies that have bought GPUs
  - have yet to turn them into meaningful revenue, if they've turned them on at all
  - Most of NVIDIA's sales are sitting in warehouses
evaluator_interpretation:
  - "Plain reading: as of the post (September 2026), more than half of the GPUs NVIDIA has sold (by value or units) are in storage and not installed. Also, most GPU-buying companies have not yet earned meaningful revenue from them."
  - "He describes a present state without naming a period. The target period is the most recent window public evidence could cover before the post: from the start of NVIDIA's fiscal Q3 2027 (2026-07-27) to the post date (2026-09-22)."
  - "'Sitting in warehouses' is read broadly as purchased but not yet installed and powered, which includes racks staged at sites without power."
support_condition: Representative evidence (industry-wide estimates, NVIDIA or customer disclosures) showing that most of NVIDIA's sold GPUs were uninstalled or in storage around September 2026, and that most buyers were not earning meaningful revenue from them.
contradiction_condition: Representative evidence showing that most NVIDIA GPUs sold were installed and running around September 2026, for example customer disclosures or credible estimates that only a small share sits in staging.
measurement_requirements: The share of NVIDIA's cumulative data center GPU sales (by value or units) that is uninstalled at the time of the post, from a representative source covering most buyers.
source_requirements: NVIDIA or customer filings, credible industry trackers, or independent measurement. Single-company anecdotes are context only.
