explicit_source_elements:
  - basically any
  - AI compute capacity estimates
  - are guesses
evaluator_interpretation:
  - The surrounding discussion concerns estimates of installed or available AI compute, especially company and industry totals.
  - The plain reading is that almost all such estimates lack a sufficiently verified empirical foundation. Merely having uncertainty does not make an estimate a guess.
  - Use the latest completed quarter before publication, July–September 2026, to assess the contemporary estimation methods. Earlier methodological publications are context.
  - A few well-documented facilities would not by themselves disprove a claim qualified by 'basically'.
support_condition: A representative examination of contemporary capacity estimates shows that nearly all depend principally on unverified assumptions about operational capacity.
contradiction_condition: A substantial, representative set of contemporary estimates has documented operational inputs and credible validation sufficient to distinguish it from guesswork.
measurement_requirements: Identify the population of estimates, distinguish operational capacity from planned capacity, and assess input verification, coverage, allocation assumptions and uncertainty.
source_requirements: Original datasets and methods, operational disclosures, permits and independent validation. Company announcements alone do not establish that announced capacity is operational.
