explicit_source_elements:
  - Google
  - $402 billion in revenue last year
  - $132 billion in profit
  - vastly more cash to play with than OpenAI and Anthropic
evaluator_interpretation:
  - Google means consolidated Alphabet, consistent with the post's interchangeable use of Google and Alphabet.
  - Last year means calendar 2025. Profit ordinarily means net income. The figures are approximate whole-billion descriptions, although the revenue rounding is unspecified.
  - The current cash comparison concerns the latest completed reporting quarter before publication, ending June 30, 2026.
  - Cash to play with ordinarily includes unrestricted cash, cash equivalents and readily marketable short-term investments. Financing announcements and future operating earnings are not cash balances.
  - "The target interval encompasses two distinct components: 2025 annual results and the June 2026 cash snapshot. They must be tested separately."
  - No source or accounting basis is attributed in the supplied words. The contract therefore retains an unknown accounting basis rather than inferring GAAP from the evidence.
support_condition: Comparable financial records establish approximately the stated 2025 revenue and net income, and contemporaneous cash resources substantially exceeding those of each named competitor.
contradiction_condition: Comparable records materially disagree with either annual figure, or establish that Alphabet's available cash resources were comparable to or below those of either competitor.
measurement_requirements: Test annual revenue and net income separately from cash stocks. The metric_scope describes the annual figures; the additional cash comparison requires separate company balance sheets at June 30, 2026, with consistent treatment of securities, restricted cash and debt. Do not assign an arbitrary ratio to 'vastly'.
source_requirements: Prefer annual financial statements and contemporaneous balance sheets. Private-company press estimates must remain distinguishable from company disclosures.
