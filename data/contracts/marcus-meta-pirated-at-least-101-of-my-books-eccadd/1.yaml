explicit_source_elements:
  - In every single case
  - they used them
  - without my permission
evaluator_interpretation:
  - "'They' means Meta and 'them' means the Marcus books and scientific articles identified in the preceding LibGen claim."
  - In context, 'used' means used for Llama training. Merely appearing in LibGen does not establish that use.
  - "'Every single case' covers the whole referenced set, not only some unidentified subset."
  - "'Without my permission' means Marcus did not authorize the use, directly or through someone empowered to authorize it for him. Lack of permission does not by itself decide fair use."
  - The observation concerns use completed by March 20, 2025. The post supplies no starting date.
support_condition: Records establish that Meta used every work in the identified Marcus set for training by the post date and that Marcus had not authorized any of those uses.
contradiction_condition: Reliable records establish at least one work in that set that Meta did not use as claimed, or at least one claimed use that Marcus authorized.
measurement_requirements: Define the referenced work list; establish training inclusion and permission status for each work; distinguish downloading from training use.
source_requirements: Work-specific training records, admissions, or judicial findings, together with independent permission or licensing records. General statements about LibGen or other authors cannot establish the universal Marcus-specific claim.
