assessment_axis: causal_assessment
explicit_source_elements:
  - Record sales across NVIDIA, Micron, Sandisk, SK Hynix, and Samsung
  - a direct result
  - an entirely speculative asset bubble
  - reckless and directionless capital expenditures
evaluator_interpretation:
  - "Assess the factual causal core: the record-sales increase is attributable to speculative infrastructure expansion without economically grounded end demand."
  - Do not require every ordinary sale by these suppliers to be speculative; the assertion concerns the explanation for record sales.
  - Use each supplier's latest reported fiscal quarter before the post, with quarter ends in March through May 2026.
  - "'Reckless' and 'directionless' are judgments, not independently measurable outcomes."
  - Supplier revenue growth or capacity purchases alone cannot establish that an asset bubble is their entire cause.
support_condition: Evidence tracing the record-sales increase across all five suppliers shows that speculative capacity purchases, unsupported by economically grounded use, explain the increase.
contradiction_condition: A credible causal analysis establishes a material contribution to the record-sales increase from economically grounded demand independent of the alleged speculative expansion.
measurement_requirements: Separate quantities, prices, product mix and end uses. Link purchases to utilization and customer economics, and address how sales would have differed without speculative spending.
source_requirements: Supplier financial disclosures, customer procurement and utilization records, and independent analysis connecting spending to end demand.
