ambiguity_flags:
  - Virtually zero has no numerical threshold.
  - Cost could mean marginal generation expense or the full cost of creating an effective deception.
  - Terrific supplies no success-rate threshold.
  - The statement is restated in October 2026 from an early-2025 warning.
