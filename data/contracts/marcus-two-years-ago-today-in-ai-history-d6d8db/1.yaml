assessment_axis: historical_observation
explicit_source_elements:
  - no concretely implemented international AI governance
  - no national AI agency
  - no longer even positioned well
  - detect and address AI-escalated cybercrime
evaluator_interpretation:
  - This is a three-part observation about the position at publication on May 16, 2025.
  - For these institutional and operational claims, the target is the publication-day state rather than a financial reporting period.
  - International governance ordinarily includes operating cross-border oversight arrangements, although the hearing context could imply a binding international regulator.
  - National AI agency means a dedicated US AI regulator in this context; an AI research office is not automatically equivalent.
  - The cybercrime clause requires evidence of inadequate detection and response capacity and deterioration from an earlier position. Proposed cuts alone do not establish either.
support_condition: Records establish the absence of implemented international governance and a dedicated US AI regulator, together with an assessed deterioration leaving US AI-cybercrime defenses inadequate.
contradiction_condition: Records establish qualifying governance or a dedicated regulator, or demonstrate adequate and undiminished AI-cybercrime detection and response capacity. A split across established components warrants mixed.
measurement_requirements: Separate binding regulation from voluntary cooperation, regulators from research institutes, and operational capability from staffing or budget proposals.
source_requirements: Institutional mandates, operating records and dated capability assessments describing the May 16, 2025 state.
