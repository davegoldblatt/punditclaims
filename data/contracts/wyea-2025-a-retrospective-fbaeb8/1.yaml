assessment_axis: causal_assessment
explicit_source_elements:
  - AI companies'
  - ridiculous valuations
  - unsustainable businesses
  - make exits or IPOs impossible
evaluator_interpretation:
  - Read the statement as a categorical claim that AI-focused software companies cannot achieve genuine acquisition exits or IPOs because of their valuations and business economics.
  - Following the linked essay, exclude talent-hiring and licensing arrangements that do not acquire the company.
  - Do not restrict AI companies to the few largest model developers; that restriction is absent from the quoted statement.
  - No minimum investor return or requirement to exceed a previous valuation is stated.
  - The decisive test is completion of an exit transaction. No numerical valuation or accounting result is being graded; financial figures are contextual.
support_condition: Evidence establishes that the described valuation and business constraints prevent genuine acquisition exits and IPOs across the claimed company class. Mere absence of transactions is insufficient.
contradiction_condition: A qualifying AI-focused software company completes a genuine acquisition exit or IPO despite the categorical assertion that such exits are impossible.
measurement_requirements: Distinguish announced agreements from completed transactions and acquisitions from licensing or employee-hiring deals.
source_requirements: Closing announcements, securities filings, or equivalent primary transaction records.
