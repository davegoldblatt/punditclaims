assessment_axis: forecast_outcome
explicit_source_elements:
  - the punishment for doing so will be grim
  - Only an industry out of options would choose this bubble
  - reverberate through the valuations
  - every public software company, and many of the hardware ones too
evaluator_interpretation:
  - The plain reading is a forecast of severe, broadly felt financial harm to the technology industry caused by its generative AI investment.
  - The surrounding valuation discussion makes major financial damage a testable reading of 'grim', although no numerical threshold is supplied.
  - No deadline is stated. The claim is not conditional merely because it describes consequences of a choice the author says has already occurred.
  - A company-specific setback or a short market fluctuation is insufficient by itself to establish the broad predicted punishment.
support_condition: Documented severe losses, failures, or valuation damage across a substantial part of the technology industry, with persuasive evidence that generative AI investment caused the harm.
contradiction_condition: A clearly completed investment episode with comprehensive evidence that the predicted broad severe harm did not occur; continued growth or survival before an unspecified deadline is insufficient.
measurement_requirements: Assess breadth, severity, and attribution. Separate AI-investment consequences from interest rates, general market movements, and unrelated business problems.
source_requirements: Prefer filings and market measurements for losses, with independent reporting or research for attribution.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only upon a dated episode that clearly demonstrates severe, broad industry harm attributable to generative AI investment, or a definitive completion of the contemplated episode that rules that outcome out.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical meaning for 'grim'.
  - The required breadth and duration of harm are unspecified.
  - Attribution to generative AI investment may overlap with macroeconomic causes.
retrospective_or_prospective: retrospective
