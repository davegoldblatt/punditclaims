explicit_source_elements:
  - Driverless cars
  - still are only available
  - couple percent of the world’s cities
evaluator_interpretation:
  - Available means members of the public can obtain passenger rides without an onboard safety driver. Testing permits and announced launches do not count.
  - The ordinary reading is very limited worldwide availability, quantified as roughly two percent. 'Only' also permits an upper-bound reading; a substantially smaller percentage would distinguish those readings.
  - I use August 1–9, 2025 as the current reporting window preceding publication. Marcus supplies no census date or definition of a city.
  - Count distinct cities, rather than operators, service zones, vehicles or residents.
support_condition: A contemporaneous worldwide service inventory and a consistently defined city denominator establish approximately two percent coverage, or establish coverage below that level under an explicitly qualified upper-bound reading.
contradiction_condition: Comparable records establish coverage materially above a couple percent. Coverage substantially below two percent contradicts only the approximate-value reading, not the upper-bound reading.
measurement_requirements: Deduplicate operating locations, distinguish public driverless service from supervised testing, and apply the same geographic definition to numerator and denominator.
source_requirements: Dated operator or regulatory records and a documented worldwide city census. A global compilation must disclose its coverage and service definitions.
