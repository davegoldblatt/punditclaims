explicit_source_elements:
  - the Federal government is trying
  - undermine the states’ abilities to pass and enforce AI regulation
evaluator_interpretation:
  - The plain reading is that federal authorities were pursuing measures intended to restrict states' enactment or enforcement of AI laws. The claim concerns an effort, not its success.
  - Federal government includes the executive administration; the statement does not require agreement among all federal branches.
  - For this ongoing policy observation, the assessment covers the incumbent administration through publication, January 20, 2025–February 14, 2026. Earlier actions count only insofar as they establish an ongoing effort at publication.
  - The statement does not say that every state AI law would be targeted.
support_condition: Official federal directives, proposals, or implementation establish an ongoing effort to preempt, challenge, or deter state AI legislation or enforcement by the post date.
contradiction_condition: Public records establish that the alleged restrictive effort did not exist or had been abandoned by the post date. Failure to achieve restrictions would not itself contradict an assertion about trying.
measurement_requirements: Distinguish efforts to restrict state authority from restrictions actually enacted or upheld. Check the scope and exceptions of each measure.
source_requirements: Prefer dated executive orders, agency directives, legislative records, and court records publicly available by the evaluation date.
