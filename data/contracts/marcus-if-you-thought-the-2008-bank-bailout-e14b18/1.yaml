evaluator_interpretation:
  - The ordinary reading is that OpenAI was pursuing government-backed financing to lower its borrowing costs.
  - A publicly floated guarantee supports the proposed financing mechanism, but is weaker evidence than a concrete company financing plan.
  - Indirect taxpayer backing means transferring financing risk to the federal government; it does not by itself establish an actual taxpayer payment.
  - The target is the company's position expressed on November 5, including its same-day clarification.
  - This is a qualitative claim about a financing proposal, not a quantified financial result; metric_scope is null.
support_condition: OpenAI's executives or formal proposals advocate federal backing for its financing and identify lower financing costs as a benefit.
contradiction_condition: Contemporaneous company statements or financing records expressly reject an active government backstop for OpenAI's own infrastructure commitments.
measurement_requirements: Distinguish floating a policy, seeking a company-specific guarantee, receiving a guarantee, and taxpayers making payments.
source_requirements: Recorded executive statements, company policy submissions, financing requests, or reliable reporting reproducing them.
