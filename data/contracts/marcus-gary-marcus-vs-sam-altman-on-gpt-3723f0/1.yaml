measurement_requirements: Evidence must establish both broad general capability and the methods responsible for it. A single benchmark or an executive's declaration is insufficient.
source_requirements: Independent capability evaluations and sufficiently detailed technical disclosures to establish whether the system uses only the relevant techniques.
