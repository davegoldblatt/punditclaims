assessment_axis: causal_assessment
explicit_source_elements:
  - Debugging with deep learning is wicked hard
  - nobody (a) really understands how it works
  - knows how to fix problems other to collect more data and add more layers and so forth
evaluator_interpretation:
  - Assess the state of knowledge available when the post appeared, on 2022-05-31. The target period has no lower bound because established earlier methods remain relevant to that state.
  - The ordinary reading is that limited understanding makes diagnosis and repair difficult, and that practitioners lack effective targeted remedies beyond broadly changing data, training, or model size.
  - Assess the difficulty and its proposed explanation separately. A targeted repair need not solve debugging generally to count against the assertion that such remedies were unknown.
  - Do not interpret 'understands' as requiring complete mathematical understanding, or 'and so forth' as automatically encompassing every possible repair.
support_condition: Contemporaneous research or engineering evidence shows that model opacity materially obstructed diagnosis and repair, and that effective remedies were generally limited to broad data or training changes.
contradiction_condition: Contemporaneous work demonstrates useful understanding of internal mechanisms and effective targeted repairs beyond collecting more data or enlarging models. Evidence that debugging was routinely straightforward would also contradict the difficulty claim.
measurement_requirements: Use research and engineering records available by 2022-05-31. Distinguish demonstrated local repairs from comprehensive understanding and general debugging reliability.
source_requirements: Primary research and engineering reports, with publication versions fixed before the post; contemporary surveys may establish the state of the field.
