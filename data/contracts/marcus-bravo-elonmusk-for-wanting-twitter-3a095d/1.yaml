assessment_axis: historical_observation
explicit_source_elements:
  - Large language models
  - without equal at generating misinformation
  - they suck at detecting it
evaluator_interpretation:
  - This describes capabilities at the time of the post, not later models.
  - There is no regular reporting period for model capabilities. I use the current calendar year through the post, 2022-01-01 to 2022-11-09, and require evidence applicable to models available then.
  - The ordinary reading is that LLMs were exceptionally effective, unmatched producers of convincing false content but unreliable detectors of false information.
  - Detection means judging factual accuracy, not identifying whether text was written by a machine.
  - Unmatched generation requires comparative evidence. Fluency or the production of some false answers alone does not establish superiority.
support_condition: Representative comparisons applicable to the target period establish both superior misinformation generation relative to human and other automated alternatives and broadly unreliable factual detection by contemporary LLMs.
contradiction_condition: Comparable evidence applicable to the target period establishes that alternatives match or exceed LLM misinformation generation, or that contemporary LLMs reliably detect misinformation across representative tasks. Narrow successes would qualify the claim without necessarily settling it.
measurement_requirements: Separate generation and detection tests. Generation comparisons should assess credibility and production efficiency. Detection tests should report both missed falsehoods and false accusations against true information, with human or established-system baselines and checks on generalization.
source_requirements: Primary evaluations with identifiable model versions, methods and experimental timing. Later publications are admissible only when their results can be tied to the historical target period.
