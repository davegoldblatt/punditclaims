assessment_axis: forecast_outcome
explicit_source_elements:
  - at least $21 billion in loans
  - collateralized by his Oracle shares
  - any doubts around Oracle’s ability to pay for its debts or OpenAI’s ability to pay Oracle
  - will threaten massive margin calls
evaluator_interpretation:
  - The forecast concerns Ellison's personal borrowing, not Oracle's corporate debt.
  - The condition requires documented concerns about either company's payment capacity after publication.
  - The ordinary reading of 'threaten massive margin calls' is a material exposure to demands for additional collateral or repayment. An actual margin call is sufficient but not necessary.
  - The $21 billion figure describes the asserted loan balance, not the size of a predicted margin call. It is background to the normalized forecast and is not independently established here.
  - No deadline or numerical definition of 'massive' is supplied.
support_condition: Following documented payment concerns, loan agreements, lender notices, and collateral valuations establish a material collateral shortfall or credible exposure to large additional collateral or repayment demands.
contradiction_condition: Complete loan records establish that the relevant borrowing cannot face such demands following the concerns, or that all relevant loans were extinguished before any such exposure arose. An absence of publicly reported calls alone is insufficient.
measurement_requirements: Outstanding principal, pledged assets, collateral valuation rules, maintenance thresholds, repayment rights, and other collateral or liquidity available to Ellison.
source_requirements: Prefer loan documents, lender notices, court records, and regulatory filings. News reports may establish public credit concerns but cannot substitute for undisclosed loan terms.
