assessment_axis: historical_observation
explicit_source_elements:
  - Rather than inducing an abstract notion of addition
  - large language models learn addition piecemeal
  - performing markedly better on specific examples they have seen before
  - than on examples they have not seen before
evaluator_interpretation:
  - The surrounding text ties the observation to the arithmetic research reported earlier in 2022.
  - Seen versus unseen refers to pretraining exposure to particular addition examples, not merely the frequency of individual numbers.
  - An abstract notion of addition means a transferable addition rule; it need not imply perfect execution on every problem.
  - The target period is 2022 through the post date, following the explicit earlier-this-year context.
support_condition: Matched addition tests show a substantial advantage for examples present in pretraining, and controlled generalization tests support piecemeal learning rather than a transferable addition procedure.
contradiction_condition: Controlled tests show comparable performance on matched seen and unseen addition examples, or demonstrate a transferable addition procedure that cannot be explained by memorizing those examples.
measurement_requirements: Identify complete-example exposure separately from operand frequency and co-occurrence. Match numerical difficulty and prompting. Correlation alone cannot establish the learning mechanism.
source_requirements: The cited Razeghi study and primary arithmetic evaluations with inspectable exposure checks.
