ambiguity_flags:
  - "'Real plan' has no stated standard of detail."
  - "'AI companies' could mean major model developers or include specialist biotechnology firms."
  - "'Cure' could be confused with treatment or disease modification."
  - The five-to-ten-year interval has no explicit starting point; it is read as running from the plan's presentation.
  - "'As far as I know' qualifies the assertion rather than supplying a forecast condition."
