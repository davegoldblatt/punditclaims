explicit_source_elements:
  - As far as I know
  - the question about real plans
  - a simple “no”
  - any of the AI companies
  - ever presented
  - cure even one disease in 5-10 years
evaluator_interpretation:
  - Assess the qualified public-record assertion, not Marcus's private knowledge.
  - The question covers plans publicly presented at any time up to August 17, 2026; 'ever' supplies no lower date bound.
  - A real plan identifies a disease, a proposed curative approach, development and clinical-testing steps, and an intended five-to-ten-year delivery timetable.
  - A plan need not already have succeeded or guarantee success.
  - AI companies includes specialist companies whose core business is AI-driven drug discovery.
  - A treatment program does not automatically constitute a cure plan.
support_condition: A sufficiently comprehensive review of relevant public company disclosures establishes that none presented a plan meeting the disease, cure, development-path and timetable criteria by the post date.
contradiction_condition: At least one qualifying AI company publicly presented such a plan by August 17, 2026.
measurement_requirements: Identify the company, publication date, disease, curative objective, development steps and intended completion interval for each candidate plan.
source_requirements: Dated company disclosures, presentations, filings or trial-development documents. Later announcements require proof of an earlier public presentation to contradict the claim.
