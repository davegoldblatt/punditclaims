explicit_source_elements:
  - no known technology
  - reliably align a chatbot
  - in a persistent way
  - a human’s emotional needs
evaluator_interpretation:
  - The plain reading is dependable responsiveness to a person’s emotional needs across an ongoing relationship, rather than occasional empathy or average symptom improvement.
  - Known technology means publicly documented technology available by February 22, 2023.
  - Persistent requires repeated evaluation over time, but Marcus supplies neither a duration nor an acceptable failure rate.
  - The observation concerns the state of technology on the post date. Earlier studies inform that state but are not direct measurements of all technology then available.
support_condition: A sufficiently comprehensive assessment of technologies known by the post date establishes that none demonstrated dependable, sustained responsiveness to individual emotional needs.
contradiction_condition: At least one technology known by the post date has credible longitudinal evidence demonstrating such dependable responsiveness, beyond average short-term benefit.
measurement_requirements: Longitudinal measurement of individual emotional needs, appropriate chatbot responses, failures, and harms. Symptom scores and engagement alone are insufficient.
source_requirements: Public technical research and longitudinal evaluations of pre-publication technology, preferably independently replicated.
