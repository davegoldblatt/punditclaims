explicit_source_elements:
  - And mostly they weren’t.
  - companies buying those chips
  - making profits from those chips
evaluator_interpretation:
  - Mostly means more than half of buyer companies by company count, rather than a majority of spending.
  - Profit means a positive result after the costs of activities using the chips, rather than revenue growth or company-wide profit alone.
  - The surrounding statement describes a continuing state. Use July–September 2026, the latest completed calendar quarter normally reportable before the post, as the common reporting window.
  - The AI context limits the population to buyers of Nvidia chips for AI. Marcus supplies no accounting basis.
support_condition: Comparable records covering a defined, representative population show that more than half of Nvidia AI-chip buyer companies did not earn profits from their chip-using activities during the target quarter.
contradiction_condition: Comparable records show that at least half of those buyer companies earned profits from their chip-using activities during the target quarter.
measurement_requirements: A buyer-company denominator, a consistent profit definition, allocated chip-related costs and comparable quarterly results. Company-wide losses or operating profits cannot automatically substitute for chip-derived net profitability.
source_requirements: Customer disclosures or a representative independent study identifying Nvidia buyers and measuring the relevant profitability.
