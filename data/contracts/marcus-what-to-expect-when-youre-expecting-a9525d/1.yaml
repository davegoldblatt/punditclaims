explicit_source_elements:
  - “Alignment” between what humans want and what machines do
  - will continue
  - a critical, unsolved problem
evaluator_interpretation:
  - The surrounding passage makes this a prediction that GPT-4 will retain consequential alignment problems after release.
  - The context identifies helpfulness, harmlessness and truthfulness as the relevant intended behavior.
  - Critical means consequential for safe and dependable use, not a numerical ranking against other research priorities.
  - Remaining unsolved does not mean that alignment measures produce no improvement or that alignment can never be solved.
support_condition: Released GPT-4 exhibits consequential departures from intended behavior despite alignment measures, documented by its developer or reproducible evaluations.
contradiction_condition: Evidence establishes that GPT-4's alignment measures reliably resolve the relevant consequential departures across representative and adversarial conditions.
measurement_requirements: Identify the released model, intended behavior, actual departures, and whether mitigations prevent those departures.
source_requirements: Developer safety disclosures and primary evaluations of GPT-4's behavior.
