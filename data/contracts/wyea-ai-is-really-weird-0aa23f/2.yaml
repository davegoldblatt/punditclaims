assessment_axis: historical_observation
explicit_source_elements:
  - only OpenAI and Anthropic
  - seem to be able to make
  - '"billions of dollars of revenue"'
  - however many billions there might be is up for discussion
  - "context: 'all of the companies in question heavily subsidize their products'; 'these are the fastest-growing companies of all time'"
evaluator_interpretation:
  - The hedge 'seem to' is kept. The claim is read as being about what public evidence showed at the time, not a guarantee that no other firm exists.
  - "'The companies in question' is read, from the context, as AI-native model and application companies (OpenAI, Anthropic, Cursor, xAI and the like), not diversified big tech (Microsoft, Google), chip makers, or cloud landlords. In the same post he treats hyperscalers separately."
  - "'Billions of dollars of revenue' is read as realized annual revenue of at least $2 billion, not annualized run rates. The speaker himself contrasts run rates with realized revenue."
  - The 'up for discussion' clause is his skepticism about exact amounts. It is not graded except that OpenAI and Anthropic should in fact have billions.
  - "Period: calendar 2025 (the latest full year) through the post date."
support_condition: OpenAI and Anthropic each had realized revenue in the billions for 2025, and public evidence by the post date showed no other AI-native company with at least $2B of realized annual revenue (the next largest reporting only run rates).
contradiction_condition: Credible public evidence available by the post showing another AI-native model or application company with realized annual revenue of at least $2B from AI products, OR evidence that OpenAI or Anthropic did not reach billions.
measurement_requirements: Realized (not annualized) revenue in USD for calendar 2025 or the latest reported period before 2026-04-08.
source_requirements: Company filings or disclosures, or reputable financial press.
metric_scope:
  company: OpenAI and Anthropic, compared with other AI-native generative-AI companies
  metric: revenue
  currency: USD
  units: billions of US dollars
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
