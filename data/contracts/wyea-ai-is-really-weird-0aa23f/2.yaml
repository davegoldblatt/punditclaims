  end: 2026-04-08
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'seem to' hedges the exclusivity claim."
  - Which firms count as 'the companies in question'. Including Microsoft's AI business, CoreWeave, or SpaceX's AI segment (which includes X advertising) could change the result.
  - "'billions' threshold taken as at least $2B in realized revenue."
  - Period chosen as 2025 through the post date because none is stated.
retrospective_or_prospective: retrospective
