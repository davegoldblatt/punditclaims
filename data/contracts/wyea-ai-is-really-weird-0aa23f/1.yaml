explicit_source_elements:
  - only OpenAI and Anthropic
  - seem to be able to make
  - billions of dollars of revenue
  - however many billions there might be is up for discussion
evaluator_interpretation:
  - The ordinary reading concerns revenue from generative-AI products, rather than the entire revenue of chipmakers, cloud conglomerates, or acquired social networks.
  - I interpret billions as at least USD 2 billion of realized annual revenue.
  - I use calendar 2025, the latest completed revenue year before publication and the year discussed in the surrounding text.
  - The surrounding discussion relies on press estimates, so the contract uses estimate as its basis.
  - The qualification about exact amounts expresses uncertainty without specifying an error threshold. It is not treated as an allegation of a particular accounting misstatement.
support_condition: Comparable annual revenue evidence shows OpenAI and Anthropic each above USD 2 billion and every other company in the intended group below that threshold.
contradiction_condition: At least one other company in the intended group earned USD 2 billion or more in comparable realized generative-AI revenue during the target year.
measurement_requirements: Use realized annual revenue, not financing, valuation, annualized run rate, or unrelated business revenue. Establish the relevant company universe.
source_requirements: Company disclosures or credible financial reporting with clear periods and revenue definitions; sufficiently broad coverage to test the word only.
metric_scope:
  company: OpenAI, Anthropic, and other generative-AI product vendors
  metric: Annual realized generative-AI revenue
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-12-31
