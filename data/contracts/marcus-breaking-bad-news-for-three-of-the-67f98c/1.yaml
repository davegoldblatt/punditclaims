assessment_axis: forecast_outcome
explicit_source_elements:
  - “Brace for bailouts.”
  - "Context: “what might happen to the economy and people’s retirement funds”"
  - No deadline, named recipient, amount, or numerical threshold.
evaluator_interpretation:
  - The plain reading is a prediction of government financial rescues of AI companies or firms exposed to an AI downturn.
  - A bailout means extraordinary public financial assistance intended to prevent or address financial failure. Ordinary procurement, research funding, growth investment, and private fundraising do not alone qualify.
  - The downturn supplies the predicted causal setting, rather than an explicit if-then antecedent that excuses the forecast if no downturn occurs.
  - I treat the plural as a general prediction of bailout activity, without imposing a minimum number. One qualifying rescue programme could establish that activity.
support_condition: After the post, a government implements or makes a binding commitment to an extraordinary financial rescue of an AI company or AI-exposed firm, with documented financial distress attributable to an AI downturn.
contradiction_condition: There is no finite observation period that can establish permanent non-occurrence because Marcus supplied no deadline. A period without bailouts, or current political opposition to them, cannot alone contradict this forecast.
measurement_requirements: Identify the recipient, government action, commitment or implementation date, financial distress, and documented connection to an AI downturn.
source_requirements: Prefer government announcements, enacted measures, financial records, and recipient disclosures. Reputable reporting may establish relevant facts when primary records are unavailable. Speculation and requests for assistance do not establish a bailout.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a dated, implemented or binding government rescue after 2026-05-28 that meets the support condition. Proposals, lobbying, general subsidies, and statements about future policy do not meet this rule.
interpretation_determines_result: false
