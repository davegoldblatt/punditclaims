ambiguity_flags:
  - Global AI compute spending has no specified accounting boundary.
  - The statement moves between spending, a flow, and infrastructure capacity, a stock.
  - The full-year plan is observable before the year's actual spending is complete.
  - "'Author's estimate' is an attribution, not a conditional antecedent."
