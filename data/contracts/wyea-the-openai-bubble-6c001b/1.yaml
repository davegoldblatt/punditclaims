assessment_axis: historical_observation
explicit_source_elements:
  - intends to spend $50 billion or more on compute
  - this year
  - I estimate
  - more than 50% of all global AI compute spend
  - 50%+ of all AI compute infrastructure
evaluator_interpretation:
  - Assess the estimate of calendar-year 2026 spending plans asserted at publication, rather than a forecast of completed year-end spending.
  - The central proposition is OpenAI's share of global spending. Verifying its own budget alone does not verify that share.
  - A comparable denominator must avoid counting both cloud customers' payments and the providers' underlying capital purchases as separate final expenditure.
  - The infrastructure parenthesis describes physical capacity and requires a separate measure; spending share cannot establish it.
  - The spending classification denotes a full-year budget rather than an annualized revenue or expenditure run rate.
support_condition: Comparable contemporaneous estimates establish an OpenAI 2026 compute budget of at least USD 50 billion and a share strictly above 50% of worldwide AI compute spending.
contradiction_condition: Comparable evidence establishes a budget below USD 50 billion or a spending share of 50% or less.
measurement_requirements: Use the same calendar year, spending definition and economic accounting boundary for numerator and denominator. Separate rental costs, capital expenditure, depreciation and physical capacity.
source_requirements: Seek the original spending disclosure and a documented global estimate with coverage and methods sufficient to reconcile the two.
metric_scope:
  company: OpenAI
  metric: Planned compute spending and its share of worldwide AI compute spending
  currency: USD
  units: billions and percent
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
