assessment_axis: forecast_outcome
explicit_source_elements:
  - once the AI bubble bursts
  - the customers of AI compute
  - predominantly unprofitable, venture-backed startups
  - won’t exist
evaluator_interpretation:
  - This is a conditional forecast with no stated deadline. The nearby 2030 cost comparison does not supply a deadline for this sentence.
  - The plain reading is a broad disappearance of the current venture-backed compute-customer population after an AI investment collapse, not the failure of one startup.
  - A bubble burst requires evidence of a broad collapse in AI investment and valuations. A temporary price decline or an individual financing problem is insufficient.
  - Won't exist means ceasing business operations. Acquisition, restructuring or a name change alone does not establish disappearance of compute demand.
  - Predominantly unprofitable and venture-backed describes the baseline customer population and needs independent verification.
support_condition: After the triggering collapse is established, business-survival records show that the described customer population has broadly ceased operating.
contradiction_condition: After the triggering collapse and its aftermath are established, a substantial continuing population of the same customers remains operational and continues purchasing compute.
measurement_requirements: Define and document the pre-collapse customer cohort, its profitability and venture backing, the date and breadth of the collapse, and subsequent operating and compute-purchasing status.
source_requirements: Market and investment records establishing the trigger, plus filings, insolvency records and customer or supplier disclosures establishing business survival.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A decisive resolution requires both a documented broad AI investment collapse and clear subsequent evidence of disappearance or substantial continuing operation of the baseline customer population. Individual failures and pre-collapse survival do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - AI bubble bursts has no specified market measure or threshold.
  - No deadline or post-collapse observation period is supplied.
  - The customer cohort and meaning of predominantly are unspecified.
  - The wording does not quantify how complete the predicted disappearance must be.
retrospective_or_prospective: retrospective
