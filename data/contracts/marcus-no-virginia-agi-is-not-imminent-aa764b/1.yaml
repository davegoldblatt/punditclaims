assessment_axis: historical_observation
explicit_source_elements:
  - Humans can learn rules of games like chess
  - modest amounts of explicit instruction
  - LLMs can’t stick to explicit rules
evaluator_interpretation:
  - The plain reading is a criticism of dependable rule adherence over an interaction, not a claim that LLMs never produce legal moves.
  - "Chess provides the concrete test: making legal moves throughout games when asked to play, without an external engine enforcing legality."
  - For this ongoing observation, I use August 2023 through publication as the latest reporting window. The monthly boundary is an evaluator convention because model evaluations have no fixed reporting cycle.
  - The normalized proposition concerns LLM rule adherence. The separate claim about how quickly humans learn is not established by chess transcripts alone.
support_condition: Contemporaneous tests show recurring violations of game rules or explicit interaction instructions despite clear requests to play, including failures beyond isolated notation mistakes.
contradiction_condition: Contemporaneous, repeated tests show dependable adherence throughout varied games and explicitly specified rule tasks under modest instruction.
measurement_requirements: Identify the model, prompt, game record, illegal move or violated instruction, and any retries or external legality checks. Distinguish legal play from strong strategic play.
source_requirements: Primary dated experiments or demonstrations. Successful games must be retained as counterevidence, and later model releases must not be substituted.
