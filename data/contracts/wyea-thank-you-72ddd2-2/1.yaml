assessment_axis: forecast_outcome
explicit_source_elements:
  - AI bubble popping
  - tens of thousands of people will lose their jobs
evaluator_interpretation:
  - The surrounding discussion makes the predicted job losses a consequence of the AI bubble popping.
  - The plain reading requires actual job losses caused by the collapse, rather than all technology layoffs or all cuts attributed to AI adoption.
  - I read the plural tens of thousands as at least 20,000 people, without treating a larger total as failure.
  - The context concerns the broader AI boom centered on major US technology companies, but it does not explicitly restrict affected workers to the United States.
  - No deadline or accumulation period is supplied.
support_condition: The relevant AI-boom collapse is independently established, and reliable records identify at least 20,000 actual job losses attributable to it, without double counting.
contradiction_condition: The relevant collapse occurs and a sufficiently complete accounting of its employment effects establishes fewer than 20,000 attributable job losses after those effects have run their course. An incomplete count cannot establish failure.
measurement_requirements: Count affected people, distinguish announcements from implemented losses, avoid duplicate announcements, and separate collapse-related cuts from automation, investment reallocations, and unrelated restructuring.
source_requirements: Employer disclosures, executed WARN notices or comparable records, employment statistics, and independently documented reasons for the cuts. Aggregate layoff trackers alone do not establish causation.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve as supported when a qualifying collapse is documented and at least 20,000 attributable job losses have occurred. The passage of time or unrelated layoffs cannot settle the claim.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The AI bubble and its collapse are not defined.
  - Geographic and industry boundaries are unstated.
  - The 20,000 lower bound is an evaluator interpretation of tens of thousands.
  - No deadline or period for accumulating job losses is supplied.
retrospective_or_prospective: retrospective
