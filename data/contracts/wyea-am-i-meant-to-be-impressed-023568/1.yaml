explicit_source_elements:
  - Anthropic and OpenAI
  - have now committed
  - over $718 billion
  - Microsoft, Amazon and Google’s revenues
  - neither of them can actually afford to pay for it
evaluator_interpretation:
  - The dollar assertion concerns the aggregate announced purchase commitments to the three named suppliers, not recognized supplier revenue.
  - Have committed does not necessarily mean the entire original contract value remains unpaid.
  - Affordability means the ability to meet contractual payments when due using available resources and financing. It does not require holding the full lifetime contract value in cash immediately.
  - Use the publication date as the stock-observation date because now refers to the then-existing collection of commitments.
  - The aggregate combines company announcements with reported estimates, so estimate is the appropriate basis.
support_condition: A deduplicated reconciliation establishes commitments above $718 billion as of publication, and payment schedules compared with each lab's resources establish that both cannot meet their obligations when due.
contradiction_condition: A complete reconciliation establishes commitments at or below the threshold, or payment schedules and available resources demonstrate that at least one lab can fund its obligations.
measurement_requirements: Separate original contract totals, remaining obligations, optional capacity, additions to existing contracts, and recognized revenue. Compare due payments with cash, cash generation, and enforceable financing commitments.
source_requirements: Contracts or company disclosures for commitments; reliable reporting where contract terms are private; financial statements and payment schedules for affordability.
