assessment_axis: historical_observation
explicit_source_elements:
  - revenue concentration appears to be getting worse over time
  - these 70% estimates
  - continued growth of overall compute and AI model rental platforms like Vertex, Foundry and Bedrock
evaluator_interpretation:
  - Concentration means the combined OpenAI and Anthropic share of hyperscaler AI revenue.
  - The surrounding passage discusses analyst projections for 2026–2029. Assess whether estimates available at publication show increasing concentration across comparable projected periods, not whether those future revenues have already occurred.
  - The source gives no comparison baseline. The 2026–2029 interval comes from the surrounding projections and is an evaluator interpretation.
  - An increasing AI share of total cloud revenue, or an increasing lab share of total cloud revenue, does not by itself establish an increasing lab share of AI revenue.
support_condition: Independently attributable, comparable analyst estimates available by the post date show an increasing combined OpenAI and Anthropic share of hyperscaler AI revenue over successive periods.
contradiction_condition: Comparable estimates show that the combined share is stable or declining across the relevant providers and periods, rather than increasing.
measurement_requirements: At least two comparable periods; consistent AI revenue definitions; separate customer shares for each provider or a consistently weighted aggregate; and reconciliation of fiscal and calendar years.
source_requirements: Original analyst tables or independent reporting that directly verifies their contents. Estimates must have existed by 2026-08-11; later reporting may authenticate them.
