  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - Hedged wording ('appears to be').
  - No period named; I use 2025 to the post date.
  - Unclear whether 'concentration' means share of AI revenue or share of total cloud revenue.
  - The stated reason (estimates rely on growth of model rental platforms) does not itself measure a trend.
  - The rising shares he points to are projections for 2027-2028, not observed shares.
retrospective_or_prospective: retrospective
