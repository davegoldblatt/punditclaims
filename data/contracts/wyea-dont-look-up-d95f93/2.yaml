assessment_axis: historical_observation
explicit_source_elements:
  - revenue concentration
  - appears to be getting worse over time
  - because these 70% estimates mostly rely on the continued growth of overall compute and AI model rental platforms like Vertex, Foundry and Bedrock
evaluator_interpretation:
  - "The claim is hedged ('appears'). I read it as: the analyst estimates and other public evidence available by the post date show OpenAI and Anthropic taking a rising share of hyperscaler (AWS, Azure, Google Cloud) AI or cloud revenue over successive periods."
  - I do not treat it as a firm claim of a measured trend. A hedged 'appears' is tested against what the public record showed, not held to a definite audited trend.
  - No period is named. I take the period to run from 2025 through the post date (2026-08-11), covering the latest reported quarter (Q2 calendar 2026) and the analyst notes then in circulation.
  - Hyperscalers do not disclose revenue by customer, so the test must rest on independent analyst estimates or company disclosures, not on the speaker's own compilation.
support_condition: Independent, citable analyst estimates or company disclosures, published by the evaluation date, showing OpenAI and Anthropic's share of hyperscaler AI or cloud revenue rising from one period to the next.
contradiction_condition: Independent analyst estimates or company disclosures showing that share flat or falling across successive periods, or showing non-lab customers growing faster than the two labs.
measurement_requirements: Share of AWS, Azure and/or Google Cloud revenue (or AI revenue) attributed to OpenAI plus Anthropic, compared across at least two periods on the same basis.
source_requirements: Primary analyst notes or reputable reporting of them that does not merely relay the speaker's own figures; company filings or earnings-call disclosures.
metric_scope:
  company: Amazon (AWS), Microsoft (Azure), Alphabet (Google Cloud)
  metric: Share of hyperscaler AI/cloud revenue from OpenAI and Anthropic
  currency: USD
  units: percent of revenue
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: 2025-01-01
  period_end: 2026-08-11
  stock_or_flow: flow
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
