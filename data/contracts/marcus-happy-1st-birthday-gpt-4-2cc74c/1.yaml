evaluator_interpretation:
  - The ordinary reading is that these failure modes continued to occur, not that performance never improved or that every model failed equally often.
  - Hallucinations are unsupported or false assertions. Instability includes material changes in answers or behavior across prompts, service updates, or deployments.
  - Nonsensical errors include plainly incoherent output and elementary mistakes inconsistent with a model's otherwise demonstrated abilities.
  - The birthday retrospective supplies the preceding year as the reporting period. Evidence must concern models or services operating during that year.
support_condition: Evaluations and operational records document continuing hallucinations, materially variable behavior, and occasional incoherent or elementary errors in GPT-4-class systems during the target period.
contradiction_condition: Comparable evidence establishes that the named failure modes had been eliminated by publication. Lower error rates or a repair to one incident alone would not contradict persistence.
measurement_requirements: Identify the tested model and version where possible. Separate model behavior from infrastructure faults and avoid treating either as proof of an inevitable architectural limitation.
source_requirements: Original evaluations with disclosed methods, reproducible examples, or provider incident records.
