assessment_axis: forecast_outcome
explicit_source_elements:
  - One day
  - one or both of Anthropic and OpenAI die
  - leads to half or more
  - demand for AI compute and actual industry production evaporating
  - any further ability for Google, Amazon and Microsoft to further feed themselves money
evaluator_interpretation:
  - This is a conditional scenario, not a dated prediction that a lab must fail.
  - Die means permanently ceasing material AI operations, rather than a temporary outage, paused training, acquisition with continuing operations or loss of one customer.
  - Half or more applies to industry-wide AI compute demand and production relative to their pre-failure levels.
  - The final clause concerns the investment-to-cloud-purchase financing channel described in the surrounding passage.
  - No deadline or post-failure measurement window is supplied; neither is invented here.
support_condition: After a qualifying lab failure, comparable industry evidence shows that the failure caused at least a 50% decline in AI compute demand and production, together with cessation of the described financing channel.
contradiction_condition: After a qualifying lab failure and completion of the resulting adjustment, comparable evidence shows that industry demand or production retains more than half its pre-failure level, or that the described financing channel continues.
measurement_requirements: Verify the failure, define industry coverage and production consistently, compare pre- and post-failure demand and output, account for migration to other suppliers, and identify causation rather than simultaneous change.
source_requirements: Closure or insolvency records and operating disclosures for the antecedent; comparable independent industry measurements and financing records for the consequences.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_met
early_resolution_rule: A verified permanent cessation of material operations by at least one named lab, followed by evidence that conclusively establishes or rules out the claimed lasting industry decline and financing-channel cessation, can resolve the scenario. Continued operation alone cannot refute an undated conditional forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Die is undefined.
  - Actual industry production has no specified measure.
  - No deadline or post-failure adjustment period is stated.
  - The scope of the financing-channel cessation is unclear if only one lab fails.
retrospective_or_prospective: retrospective
