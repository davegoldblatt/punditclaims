assessment_axis: causal_assessment
explicit_source_elements:
  - Because of the immense amounts of data
  - because of the immense number of parameters
  - sometimes
  - come very close to memorization
evaluator_interpretation:
  - Read memorization as near-verbatim or verbatim reproduction of training passages, not reproduction of an arbitrary current prompt.
  - The claim includes both the existence of such reproduction and a causal contribution from training-data scale and parameter count.
  - Distinguish total corpus size, repeated exposure to a passage and number of training steps.
  - Do not require memorization to increase monotonically under every possible training configuration.
support_condition: Extraction research establishes reproduction of training passages, and controlled evidence establishes contributions from parameter count and training-data scale under relevant conditions.
contradiction_condition: Evidence rules out the claimed reproduction or materially refutes the alleged causal contributions. Failure to isolate one contribution leaves the compound claim unresolved.
measurement_requirements: Verify generated passages against training data. Separate parameter count, unique data volume, duplication, training duration and prompt length.
source_requirements: Primary extraction experiments and studies varying the relevant training factors.
