assessment_axis: historical_observation
explicit_source_elements:
  - "\"If Anthropic is truly facing a 'capacity crunch'\""
  - "\"it's choosing to solve said crunch through sheer, unbridled greed\""
  - '"taking on more customers"'
  - '"as it struggles to keep its services at above two nines of availability"'
evaluator_interpretation:
  - The condition is whether Anthropic faced a real capacity shortage around the time of the post.
  - "'Greed' and 'choosing' are moral judgments and are not graded. The checkable parts are (a) that Anthropic kept adding customers and (b) that it struggled to keep availability above 99% ('two nines')."
  - "'Struggles to keep above two nines' is read as measured availability of its main services near or below 99%, not as a requirement that every service fell below 99%."
  - The period is the roughly 90 days before the post (about February 5 to May 6, 2026), which matches the window Anthropic's status page reports.
support_condition: Anthropic faced a capacity shortage; its status page showed availability for its main services at or just around 99% in the period; and it reported growing customer numbers in the same period.
contradiction_condition: Availability for Anthropic's main services was comfortably above 99% (for example 99.9%), or Anthropic was not adding customers in the period.
measurement_requirements: Status-page uptime percentages for claude.ai, the API and Claude Code in the period, plus company-reported customer counts in the period.
source_requirements: Anthropic's own status page (an archived copy) and company announcements; news reports for the capacity condition.
