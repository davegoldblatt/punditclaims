assessment_axis: historical_observation
explicit_source_elements:
  - If Anthropic is truly facing a “capacity crunch”
  - taking on more customers
  - struggles to keep its services at above two nines of availability
  - sheer, unbridled greed
evaluator_interpretation:
  - Two nines means 99% availability.
  - I assess the factual assertion that customer intake continued during capacity pressure and poor service availability. Greed is an evaluative description, not an independently measurable motive.
  - For this ongoing observation, I use April 2026, the latest complete calendar month before publication. The speaker did not specify an availability measurement window.
  - Availability should be measured separately for the main customer-facing services. An incident count or one component's uptime cannot establish an aggregate figure for all services.
support_condition: Contemporaneous records establish capacity pressure, continued customer intake, and availability at or below 99% for principal customer-facing services during the target period.
contradiction_condition: Comparable records establish that intake stopped during the capacity constraint, or that the relevant services consistently exceeded 99% availability during the target period.
measurement_requirements: April service-level uptime with defined treatment of partial outages, together with evidence of customer intake during capacity pressure. Keep monthly and rolling 90-day percentages separate.
source_requirements: Prefer Anthropic's dated disclosures and archived status records. Use contemporary reporting when the original historical status figures cannot be retrieved.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-04-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The availability window is unspecified; April is the evaluator's latest-complete-month convention.
  - The services covered and their aggregation are unspecified.
  - Struggling to exceed 99% is less precise than a claim that measured monthly uptime was below 99%.
  - Greed is a value judgment.
  - Growth in a high-spending customer cohort does not by itself establish new customer intake.
retrospective_or_prospective: retrospective
