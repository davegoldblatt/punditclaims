evaluator_interpretation:
  - The testable assertion is that employers still require human software engineers. Continued substantial demand for their work supports this ordinary reading.
  - Use March 2026, the latest completed month for which employment and hiring evidence could have been public before the post.
  - The word 'absurd' is an opinion. Current employment cannot settle an unspecified forecast about engineers eventually disappearing.
support_condition: Evidence shows continuing employer demand for human software engineers during March 2026.
contradiction_condition: Evidence shows that human software engineers were no longer needed for software development and operation during the target period.
measurement_requirements: Separate software engineering demand from employment in technology generally. Job advertisements indicate hiring intent, not completed hires or proof of technical indispensability.
