assessment_axis: causal_assessment
explicit_source_elements:
  - As it stands
  - a slowdown is deeply impractical
  - due to the massive commitments
evaluator_interpretation:
  - The ordinary reading is that existing compute obligations make a substantial slowdown economically difficult because sizeable payments would remain unavoidable.
  - Deeply impractical does not mean impossible. A brief pause is not enough to test a sustained slowdown.
  - The causal assessment concerns commitments in force on September 14, 2026. Later disclosures may document earlier agreements, but subsequent amendments must be excluded.
  - The surrounding discussion relies on reported estimates of lab commitments. It does not specify GAAP or another accounting basis.
  - As it stands anchors the assessment to publication; it is not a future antecedent.
support_condition: Contracts in force at publication, together with cash-flow evidence, show that a substantial slowdown would leave unavoidable payments large enough to make the slowdown economically difficult.
contradiction_condition: Contractual flexibility, replacement workloads or demonstrable savings establish that the commitments would not materially obstruct a substantial slowdown.
measurement_requirements: Establish payment floors, delivery conditions, cancellation rights and timing; compare unavoidable costs with resources and savings under a defined slowdown.
source_requirements: Executed contracts or filings describing their terms, and dated financial projections. Separate agreements in force before publication from later amendments.
