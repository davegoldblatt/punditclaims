assessment_axis: forecast_outcome
explicit_source_elements:
  - we can expect more companies
  - following the same sly opt-out playbook
  - hiding what is going in obscure settings and Terms of Service nobody reads
evaluator_interpretation:
  - The graded forecast concerns additional companies adopting the practice after November 26, 2024.
  - More companies requires multiple additional companies; two is a minimum, not a claim about widespread prevalence.
  - Hiding is assessed through disclosure and interface design, not an inferred motive. Default training alone is insufficient.
  - Nobody reads is rhetorical emphasis on poor visibility, not a literal claim that no person reads terms.
  - The prefatory assertion about every company's desperation is not part of this extracted forecast.
support_condition: At least two additional companies introduce default inclusion of user data in AI training after the post, with evidence that notice and opt-outs were confined to obscure settings or terms rather than clearly presented to affected users.
contradiction_condition: A decisive development rules out the predicted additional adoption. Failure to find examples by an arbitrary date cannot contradict an undated forecast.
measurement_requirements: For each company, establish the introduction date, training-data scope, default setting, opt-out path, and notices shown to affected users.
source_requirements: Dated policy versions, company announcements, interface records, or reliable reporting establishing both default inclusion and disclosure practices.
