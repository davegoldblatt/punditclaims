original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported once at least two additional companies have demonstrably introduced the complete practice after the post. Announced opt-out policies alone do not establish concealment.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No number beyond the plural more companies.
  - Obscure and hiding are qualitative.
  - Default inclusion and concealed disclosure are distinct parts of the forecast.
