horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Dated evidence can settle the original model's properties if it resolves both the observable-failure prediction and the substantive claim about understanding. Failures alone settle only the seams component.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Same playbook is broader and less precise than architectural identity.
  - Really understand the world has no stated threshold.
  - Eventually provides no deadline.
  - Observable failure and absence of understanding are different propositions.
