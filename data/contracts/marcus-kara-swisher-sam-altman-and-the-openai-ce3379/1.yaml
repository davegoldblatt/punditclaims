assessment_axis: historical_observation
explicit_source_elements:
  - lied by omission
  - under oath at the Senate
  - saying he had no equity in OpenAI
  - he just loved his job
  - held a stake in YCombinator that held a stake in OpenAI
  - owned an investment firm called OpenAI Startup
evaluator_interpretation:
  - The claim concerns the May 16, 2023 hearing, not Altman's holdings when Marcus published the post.
  - The ordinary reading of 'lied by omission' is that Altman knowingly created a misleading impression about his financial interests. Establishing an omitted connection alone does not settle that allegation.
  - I interpret 'OpenAI Startup' as the OpenAI Startup Fund. Ownership or control of its management entities must be distinguished from entitlement to investment profits and from equity in OpenAI itself.
  - The YC connection may be through a particular investment fund rather than ownership of the accelerator itself.
  - This is an ownership-disclosure claim, not a claim about a measured amount of company revenue, spending, valuation, or other financial performance.
support_condition: The hearing record establishes the quoted denial without the relevant qualifications, ownership records establish the identified interests at the time, and evidence supports the inference that the omission knowingly misrepresented Altman's financial position.
contradiction_condition: Reliable records establish that the relevant interests did not exist at the hearing, that Altman disclosed them in the relevant testimony, or that the alleged misleading representation is otherwise demonstrably false.
measurement_requirements: Compare the complete testimony with ownership and beneficial-interest records effective on May 16, 2023. Separate direct equity, indirect investment exposure, management control, and personal profit entitlement.
source_requirements: Prefer the official hearing record and contemporaneous ownership documents. Company disclosures establish what the company acknowledged; attributed news reports are a fallback for unavailable ownership documents.
