evaluator_interpretation:
  - The claim concerns OpenAI's total realized revenue, not merely whether Zitron published this estimate.
  - The Microsoft revenue share is an estimation method, not an antecedent that makes this a conditional forecast.
  - I interpret the stated precision as USD 4.329 billion rounded to the nearest USD 1 million.
  - Gross revenue here means OpenAI's total recognized sales revenue before its payment to Microsoft, rather than the net bilateral settlement.
support_condition: Reliable records establish January–September 2025 realized revenue rounding to USD 4.329 billion, or complete revenue-sharing records validly reproduce that total.
contradiction_condition: Comparable records establish a different January–September 2025 total, outside the stated rounding interval.
measurement_requirements: Match the nine-month period. Establish the revenue-share percentage, covered revenue, timing, and reciprocal offsets before converting a Microsoft payment into OpenAI revenue.
source_requirements: OpenAI revenue records or independently verified reporting on them; alternatively, complete Microsoft settlement records and applicable contract terms.
