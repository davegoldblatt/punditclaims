explicit_source_elements:
  - If we assume that half of that gets built
  - $875 billion in annual revenue
  - needed to keep these data centers from running out of money
  - their margins are atrocious
  - they’re all paid for with onerous debt
evaluator_interpretation:
  - The antecedent concerns half of the referenced 190GW project pipeline, rather than half of all existing data centers.
  - The claim concerns annual revenue required for cash sustainability after that capacity is built.
  - The preceding price-times-capacity calculation is an estimate, not an observed cash break-even calculation.
  - No deadline is supplied for this particular conditional claim. The surrounding 2030 discussion does not establish a completion deadline for this exact project cohort.
  - Revenue requirements must include operating payments, debt service, and necessary replacement expenditure, with external financing distinguished from operating sustainability.
support_condition: After half of the identified pipeline becomes operational, comparable project financial records establish that approximately $875 billion annually is required to meet ongoing cash obligations.
contradiction_condition: After the antecedent is established, comparable records show that the built cohort can sustainably meet its obligations at materially less annual revenue, or establish a materially different break-even requirement.
measurement_requirements: Identify the original project cohort, its operational capacity, facility-power versus IT-load convention, utilization, realized revenue, operating payments, debt terms, and replacement spending.
source_requirements: Project-level completion records and financial disclosures, or a transparent financial model tied to the completed cohort.
