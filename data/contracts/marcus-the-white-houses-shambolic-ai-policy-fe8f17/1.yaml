explicit_source_elements:
  - what was just identified was not new
  - likely not specific to Mythos or Fable
evaluator_interpretation:
  - The referent is the reported Fable safeguard bypass behind the June 12 directive.
  - Not new requires prior documentation of the same vulnerability mechanism or materially equivalent technique, not identical wording of a prompt.
  - Likely not specific is a qualified claim that the relevant weakness extends beyond these models.
  - The normative objection to how the government should have responded is outside the normalized factual proposition.
  - A known software bug found by a model is distinct from a known vulnerability in the model's safeguards.
support_condition: Technical descriptions connect the reported bypass to a previously documented mechanism, with cross-model evidence supporting its lack of specificity.
contradiction_condition: Technical evidence establishes a genuinely new mechanism specific to these models and undermines the suggested cross-model applicability.
measurement_requirements: Compare the bypass mechanism, prompts, safeguards, and affected versions. Keep novelty of the bypass separate from novelty of the software flaws it revealed.
source_requirements: The original report or a sufficiently detailed first-hand technical account, earlier dated research, and cross-model tests.
