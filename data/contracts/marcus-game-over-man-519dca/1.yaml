evaluator_interpretation:
  - In context, collapse means a breakdown beginning in the Nvidia-supported AI financing system, with material effects across AI businesses.
  - Opening phases does not require bankruptcy or a completed industry collapse.
  - The ordinary reading nevertheless requires effects already occurring, rather than forecasts that financing might tighten.
  - The target is the current episode described through November 16, including the preceding week's events. I use November 9–16, 2026.
support_condition: Evidence shows an actual retreat in Nvidia-backed financing and material linked disruption or destabilization across multiple AI businesses during the described episode.
contradiction_condition: Direct evidence shows the alleged retreat or its claimed industry effects did not occur, or that the described disruptions arose independently of the asserted financing breakdown.
measurement_requirements: Distinguish implemented financing changes, proposed changes, market repricing, and operational disruption. Establish the connection between financing changes and industry effects.
source_requirements: Prefer financing announcements, filings and affected companies' disclosures; use reported transactions when primary records are unavailable.
