explicit_source_elements:
  - get it right, reliably
  - that’s just not realistic
  - given the current state of AI
evaluator_interpretation:
  - The surrounding passage concerns factual synthesis of online information and multi-step research, particularly launch-version OpenAI Deep Research.
  - The ordinary reading is that users could not depend on these systems for accurate research without substantive checking. It does not mean every answer was wrong or that the systems had no useful capabilities.
  - "For this ongoing technical state, the target period is 2025-02-02 through 2025-02-03: the launch and publication window. A financial reporting period would not apply."
  - Marcus supplied no numerical reliability threshold; the assessment concerns material factual, source-selection, and uncertainty-calibration weaknesses.
support_condition: Evidence describing systems available during the target period establishes material weaknesses in factual synthesis, source discrimination, or communicating uncertainty that prevent dependable unchecked research.
contradiction_condition: Broad, relevant evaluations establish dependable factual synthesis and multi-step research across ordinary uses, with failures sufficiently rare and minor that substantive checking is generally unnecessary.
measurement_requirements: Assess factual correctness, source quality, inference validity, and uncertainty communication. Distinguish useful performance or benchmark improvements from dependable report accuracy.
source_requirements: Contemporaneous technical disclosures or evaluations identifying the tested system and relevant limitations. Later evaluations of changed models cannot decide this observation.
