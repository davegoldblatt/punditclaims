assessment_axis: causal_assessment
explicit_source_elements:
  - in the last few months
  - Anthropic and OpenAI
  - all of their enterprise customers
  - token-based billing in Q1 2026
  - CEOs encouraged (or actively incentivized)
  - in some cases
  - a KPI that could cost them their job
evaluator_interpretation:
  - Treat all enterprise customers literally; introducing a billing option or changing new contracts is insufficient.
  - Q1 2026 means January 1 through March 31.
  - The broader causal observation covers the first quarter and the following months through June 2, when the post says spending problems had surfaced.
  - Usage incentives must be connected to unnecessary consumption or spending problems; chronological coincidence alone does not establish causation.
  - A mixed outcome may describe separately established factual components while leaving the wider causal explanation unproved.
  - The insults about management are opinions and are not assessed.
support_condition: Both providers completed universal enterprise migration during Q1, documented employer incentives encouraged excessive use, some policies placed employment at risk, and customer records link these changes to the spending problems described.
contradiction_condition: Evidence establishes retained legacy enterprise arrangements beyond Q1 or a different migration timetable, or directly contradicts the claimed incentive and causal mechanisms. Partial support and contradiction should be identified separately.
measurement_requirements: Distinguish new contracts from renewals, API billing from enterprise subscription billing, adoption targets from token-volume targets, and employee perceptions from formal employment policies.
source_requirements: Dated billing terms, contracts, migration notices, employer policies, and customer spending records. Reputable reporting may substitute where internal records are unavailable.
