horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when a reliably documented, dated incident after the post meets the support condition. Earlier incidents, attempted attacks, and harmless demonstrations do not settle it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
