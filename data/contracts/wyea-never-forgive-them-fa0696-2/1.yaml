assessment_axis: historical_observation
explicit_source_elements:
  - software
  - is built upon
  - the large-scale larceny of creative works
evaluator_interpretation:
  - Only the supplied normalized proposition about OpenAI's use of creative works is assessed. The surrounding financial, environmental and motive assertions are outside this claim.
  - The ordinary contextual reading of larceny is substantial copying and use of creative works without creators' permission, including pirated source copies. It is not treated as an assertion of a criminal conviction.
  - Built upon refers to the historical development and training of OpenAI's software, not a claim that every model used every disputed dataset.
  - The target period covers development before the post. Its start is unspecified because the speaker supplied no starting date.
  - Later disclosures may establish what happened before publication. Unauthorized copying and the legal question of fair use are assessed separately.
support_condition: Admissions, reliable training records or court findings establish substantial use of creative works obtained without rightsholders' permission in developing OpenAI models before the post.
contradiction_condition: Reliable evidence establishes that the relevant creative works were licensed, public domain or otherwise supplied with permission, and that the alleged substantial unauthorized use did not occur.
measurement_requirements: Connect acquisition of copyrighted creative works to model development or training and establish substantial scale. Distinguish party allegations, documented admissions and judicial findings.
source_requirements: Prefer court records, underlying company communications and company disclosures. Legal arguments alone do not establish either permission or infringement.
