assessment_axis: historical_observation
explicit_source_elements:
  - sometimes
  - mediocre and often-broken
  - keep a vigilant eye on
  - a subsided product that loses Anthropic money
  - as an enterprise to Anthropic and they still lose money
evaluator_interpretation:
  - The financial reading assessed is that both consumer subscriptions and enterprise offerings lose Anthropic money.
  - The weaker reading is only that Anthropic remains unprofitable overall despite receiving both kinds of revenue. That does not establish losses on both offerings.
  - I use calendar 2025, the latest completed annual period before publication, for the ongoing financial observation. No quarterly offering-level reporting period is identified in the claim.
  - The surrounding post invokes Anthropic's own financial statements in a sworn declaration, so the claimed basis is company_reported rather than an assumed GAAP definition.
  - For testing the offering-level assertion, losses mean revenue below attributable costs, with shared training and operating costs explicitly allocated.
  - "'Mediocre', 'work-shaped', and 'vigilant' provide no separate quality or supervision threshold. 'Sometimes' is a frequency qualifier, not a forecast condition."
support_condition: Comparable realized revenue and attributable-cost records for 2025 establish losses in both consumer subscriptions and enterprise offerings, using a disclosed and consistent cost allocation.
contradiction_condition: Comparable records show that at least one of those offerings earned a profit on the same cost basis.
measurement_requirements: Separate consumer and enterprise results. Distinguish inference gross margin, fully allocated profit, consolidated net loss, and cash burn. Do not infer offering losses from company-wide losses.
source_requirements: Anthropic disclosures or sufficiently detailed reporting of its financial records, including channel definitions and cost allocation.
metric_scope:
  company: Anthropic
  metric: Profit or loss of consumer subscriptions and enterprise offerings separately
  currency: USD
  units: dollars; sign of profit or loss
  accounting_basis: company_reported
