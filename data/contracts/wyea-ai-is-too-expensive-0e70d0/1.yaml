  - The distinction between marginal serving costs and fully allocated costs is unstated.
  - The consumer and enterprise populations may overlap.
  - Calendar 2025 is an evaluator-selected reporting period for an ongoing observation.
  - The qualitative output claims have no task population or measurable threshold.
