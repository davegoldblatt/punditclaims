explicit_source_elements:
  - LLMs can do work-shaped stuff, sometimes
  - mediocre and often-broken stuff that you have to keep a vigilant eye on
  - a subsided product that loses Anthropic money
  - pay a shit ton of money as an enterprise to Anthropic and they still lose money
evaluator_interpretation:
  - The first half (LLM output is 'mediocre and often-broken' and needs a 'vigilant eye') is a hedged, subjective judgment with no measure. It is not scored.
  - "The checkable core is the money part. Plain reading: even with large enterprise payments, Anthropic as a company still loses money. This does not require that each enterprise contract is unprofitable on a fully allocated basis; he did not specify any cost allocation."
  - "He names no period. Following the rule for ongoing states, the period is the latest full quarter before the May 19, 2026 post: Q1 2026 (January to March). This choice is flagged."
  - "'Lose money' is read as a reported operating or net loss."
support_condition: Anthropic's reported results for Q1 2026 show a loss (operating or net) while a large share of its revenue came from enterprise customers.
contradiction_condition: Anthropic's reported results for Q1 2026 show it was profitable on both an operating and a net basis.
measurement_requirements: Reported operating income (loss) and net income (loss) for the quarter ended March 31, 2026, plus a statement of how much revenue comes from enterprises.
source_requirements: Anthropic's SEC filings (S-1) or other company-reported financial statements.
