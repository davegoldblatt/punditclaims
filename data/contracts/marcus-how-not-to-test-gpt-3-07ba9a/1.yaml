explicit_source_elements:
  - often
  - a slight rephrasing
  - a slightly more complex example
  - a slightly simpler example
  - the same failure will reemerge
evaluator_interpretation:
  - In context, this describes an observed weakness of contemporary LLM evaluations, rather than a forecast with a future deadline.
  - The plain reading is that apparent reasoning successes repeatedly fail to survive modest variations; it does not require every model or every successful answer to fail.
  - Often means a recurring pattern across related tests, not a numerical majority of all possible prompts.
  - I use early 2023 through the post date as the latest reportable period for the ongoing observation.
support_condition: Independent paired evaluations during the target period show repeated failures on modest variants of reasoning problems that the model appeared to solve.
contradiction_condition: Broad, relevant paired evaluations show that apparent successes reliably survive modest variants and that recurring failures are rare.
measurement_requirements: Compare base tasks and variants using comparable model settings. Explain why each variation preserves the relevant reasoning skill or makes the task simpler.
source_requirements: Independent evaluations with inspectable prompts and responses, preferably research papers.
