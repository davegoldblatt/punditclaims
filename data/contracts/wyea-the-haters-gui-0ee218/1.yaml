assessment_axis: forecast_outcome
explicit_source_elements:
  - so many people
  - will see their retirements wrecked
  - all because big tech didn’t have a new way to show quarterly growth
evaluator_interpretation:
  - The plain reading is widespread, severe damage to retirement security caused by the predicted AI-market collapse.
  - Losses in an individual investment are relevant but do not automatically establish that an entire retirement has been wrecked.
  - No country is expressly specified, so relevant evidence is not restricted to American accounts.
  - The collapse is part of the predicted causal sequence, not an expressly stated conditional antecedent.
support_condition: Retirement-account or pension evidence documents severe losses affecting many people and materially impairing retirement security, with credible attribution to an AI-market collapse.
contradiction_condition: A completed, identifiable AI-collapse episode with comprehensive evidence of no widespread severe retirement damage would count against that episode-specific prediction. Healthy accounts before any final deadline cannot disprove the unrestricted forecast.
measurement_requirements: Distribution and severity of retirement losses, affected population, consequences for retirement income or timing, and attribution separating AI losses from other market forces.
source_requirements: Prefer pension administrators, regulators, and representative account datasets. News accounts can document individual losses but cannot alone establish their population-wide prevalence.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only when a dated AI-related collapse and widespread severe damage to retirement security are jointly documented.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Many and wrecked have no numerical thresholds.
  - Geographic scope is unspecified.
  - Temporary account drawdowns and lasting impairment of retirement security are different readings.
  - No deadline is supplied.
retrospective_or_prospective: retrospective
