assessment_axis: historical_observation
explicit_source_elements:
  - no obvious moat
  - Meta is giving away similar software for free
evaluator_interpretation:
  - A moat means a clear, durable competitive advantage that competitors cannot readily overcome. A temporary lead on a benchmark is insufficient.
  - Similar software means general-purpose language models with comparable uses and capabilities, not identical products or performance.
  - Free means no license fee for ordinary permitted use. It does not imply free computing resources or unrestricted licensing.
  - For this ongoing observation, use the latest publicly observable state during September 1–25, 2024, ending at publication.
support_condition: Evidence establishes both a comparable, no-fee Meta offering and the absence of a clear, durable OpenAI competitive advantage.
contradiction_condition: Evidence establishes a clear, durable OpenAI competitive advantage, or establishes that Meta offered no comparable software without a license fee.
measurement_requirements: Compare capabilities and licensing separately from durable advantages such as switching costs, distribution, exclusive assets, or persistent technical leadership.
source_requirements: Contemporaneous model documentation, licenses, evaluations, and evidence about competitive advantages. Company performance claims require appropriate caution.
