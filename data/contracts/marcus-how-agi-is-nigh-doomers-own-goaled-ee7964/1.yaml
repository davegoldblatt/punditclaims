  end: 2028-09-22
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as contradicted only when a dated achievement satisfies the independent demonstration and substantial-recognition criteria. Lack of achievement before the deadline cannot establish support.
