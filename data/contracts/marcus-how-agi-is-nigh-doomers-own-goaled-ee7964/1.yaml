evaluator_interpretation:
  - Treat the passage as a skeptical forecast that AGI will not be achieved within roughly three years of summer 2025, while preserving that the wording expresses plausibility rather than certainty.
  - AGI means broadly human-level general capability established through independent evaluation and substantial expert recognition, not merely a vendor declaration.
  - Summer 2025 is the quoted forecast's anchor. Republication in March 2026 does not restart the three-year clock.
  - Because the original summer date is missing, use September 22, 2028 as a conservative outer deadline allowing the astronomical reading of Northern Hemisphere summer.
  - The supplied summer-2025 label is dating context, not a contingent antecedent.
support_condition: At the end of the stated window, credible independent assessments establish that broadly human-level AGI has not been achieved under the stated reading.
contradiction_condition: A system achieves broadly human-level general capability within the window, demonstrated independently and substantially recognized as AGI.
measurement_requirements: Evaluate breadth, unfamiliar-task learning, and reliable performance across domains. A single benchmark or company announcement is insufficient.
source_requirements: Independent evaluations and assessments from multiple relevant research groups, with primary demonstrations where available.
