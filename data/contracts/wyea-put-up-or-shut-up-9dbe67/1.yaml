assessment_axis: historical_observation
explicit_source_elements:
  - generative AI
  - a big, stupid, costly and environmentally-destructive bubble
evaluator_interpretation:
  - The plain reading is that the contemporary generative-AI investment boom was speculative, expensive and environmentally harmful.
  - Bubble means investment or valuations materially exceeding what plausible future economic returns could justify. A subsequent collapse is neither the stated claim nor a necessary condition.
  - Use April–June 2024, the latest completed quarter before publication, for the ongoing state. Older annual reports are context.
  - Stupid is rhetorical evaluation and has no separate factual test.
  - This is a sector-wide characterization, not a stated monetary figure for a particular company; metric_scope is therefore null.
support_condition: Evidence establishes substantial speculative overinvestment or overvaluation in the target period, substantial costs, and environmental damage attributable to generative AI.
contradiction_condition: Evidence establishes that the investment and valuations were justified by plausible returns, or materially refutes another factual component of the compound characterization.
measurement_requirements: Separate investment, valuation, realized revenue, operating costs and projected returns. Attribute environmental impacts to generative AI rather than treating all cloud or data-center activity as generative AI.
source_requirements: Prefer investment datasets, financial disclosures and attributable environmental measurements. Investor commentary can identify concerns but cannot alone prove a bubble.
