assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft put $11 Billion into Microsoft
  - demanded an exclusive from OpenAI
  - Microsoft wouldn’t “see other people”, but they are
evaluator_interpretation:
  - I read the second occurrence of Microsoft as a typo for OpenAI.
  - The ordinary reading is that Microsoft had invested $11 billion in OpenAI, secured exclusivity from it, and nevertheless worked with other AI developers.
  - I interpret exclusivity as cloud-provider exclusivity. The wording does not specify its scope or establish that Microsoft required exclusivity across every commercial relationship.
  - I interpret seeing other people as commercial collaboration with another AI developer, including distributing its models.
  - The target is the cumulative history leading to the relationship described on May 6, 2024. The starting date is unspecified. These investments and agreements are discrete events, so a quarterly reporting window would be inappropriate.
  - The supplied passage identifies no source or accounting basis for $11 billion. Its financial basis is therefore unknown. I do not silently substitute commitments for funding already provided, or treat $11 billion as a $11–13 billion range.
  - Despite introduces historical premises, not a conditional forecast.
support_condition: Evidence establishes the stated cumulative investment on an identifiable financial basis, OpenAI's applicable exclusivity obligation, and Microsoft's collaboration with another AI developer by May 6, 2024.
contradiction_condition: Comparable evidence establishes a materially different investment amount on the same basis, or directly disproves the claimed exclusivity or other-partner relationship. A different commitment total alone does not disprove an amount already funded.
measurement_requirements: Separate cumulative funding provided from future commitments, cash from computing credits, and cloud exclusivity from broader commercial exclusivity. The unknown financial basis prevents a supported or contradicted verdict on the monetary component.
source_requirements: Prefer dated company announcements and contractual or regulatory records. Financial reporting must identify the amount, timing, and basis. News estimates can provide context but cannot resolve a mismatched financial measure.
