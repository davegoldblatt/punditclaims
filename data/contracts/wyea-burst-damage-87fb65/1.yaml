assessment_axis: historical_observation
explicit_source_elements:
  - $19 billion
  - in the last quarter
  - on cloud and AI expenses
  - not done spending more money than it’s ever spent before
  - neither makes Microsoft nor the people using it that much money
evaluator_interpretation:
  - The spending period is Microsoft's fiscal fourth quarter, April–June 2024, explicitly identified in the surrounding text.
  - In context, expenses means capital expenditure including finance leases, rather than operating expenses or cash expenditure alone.
  - The spending-plan clause describes an intention already announced by the post date. It is not a forecast that spending necessarily increased.
  - The ordinary reading of not much money is limited financial benefit relative to investment, rather than literally zero revenue. Revenue, profit and customer returns must still be distinguished.
  - The latest completed quarter is also used for the ongoing financial-benefit assertion. July guidance is retained as context outside that quarter.
support_condition: Microsoft reports approximately $19 billion of quarterly capital expenditure, predominantly for cloud and AI, announces further increases, and comparable evidence establishes limited generative AI financial returns for Microsoft and its customers.
contradiction_condition: Comparable disclosures materially contradict the spending amount or announced direction, or evidence establishes substantial generative AI financial returns inconsistent with the ordinary reading of the claim.
measurement_requirements: Separate cash expenditure from capital additions including finance leases; separate cloud infrastructure from generative AI; distinguish revenue, profit and customer returns. Do not compare long-lived investment directly with quarterly profit as if both were expenses.
source_requirements: Microsoft financial disclosures and guidance, plus representative customer financial evidence. Product adoption and general productivity measures alone cannot establish financial returns.
