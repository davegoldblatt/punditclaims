ambiguity_flags:
  - Expenses could mean cash expenditure, operating expenses or capital additions; context indicates capital expenditure.
  - Cloud and AI expenditure does not isolate generative AI expenditure.
  - Not much money supplies no threshold and does not distinguish revenue from profit.
  - The customer population is unspecified.
  - The ongoing financial-benefit assertion is assigned to the latest completed quarter.
  - The compound claim combines quarterly expenditure with guidance announced after that quarter.
  - The single financial scope describes expenditure; the separate returns assertions lack a specified accounting measure.
