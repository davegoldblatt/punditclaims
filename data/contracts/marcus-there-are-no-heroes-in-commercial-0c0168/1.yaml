explicit_source_elements:
  - Anthropic? Same thing.
  - they ripped off some of my books
  - Hardly seems ethical.
evaluator_interpretation:
  - “Same thing” incorporates the preceding claim of broad training on publicly accessible material including copyrighted works.
  - The personal allegation requires evidence connecting Marcus's books to Anthropic's acquisition and training practices.
  - “Ripped off” is read as unauthorized copying or use, without assuming every training use was legally infringing.
  - The ethical judgment is not separately scored and is not a condition that must occur.
  - The historical period ends at the post; no starting date is supplied.
support_condition: Records establish broad copyrighted-material training and identify Marcus-authored books copied or used as alleged, with evidence distinguishing acquisition from actual training.
contradiction_condition: Reliable records refute the broad copyrighted-training allegation or establish that the specifically alleged Marcus works were not copied or used.
measurement_requirements: Title- or author-level identification and provenance linking works to Anthropic; dataset possession alone must not be treated as proof of training.
source_requirements: Court findings, authenticated training records, settlement works records or independent title-level documentation. Marcus's own assertion cannot establish the personal allegation.
