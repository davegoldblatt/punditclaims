ambiguity_flags:
  - “Same thing” inherits the imprecise breadth of the preceding sentence.
  - “Ripped off” conflates copying, training, infringement and ethical criticism.
  - Marcus does not identify the books.
  - The supplied condition “hardly seems ethical” is an opinion, not an antecedent.
