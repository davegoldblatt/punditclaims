evaluator_interpretation:
  - "'These companies' refers to every major consumer and enterprise tech player selling an AI product and running compute on big tech's systems. The tense is present, so it describes the state of things around the post date (September 2024)."
  - Checking the claim would require showing that big tech prices AI compute and models below cost (a subsidy), and that each company's AI offering depends on that. The speaker says in the same post that hyperscalers 'bake those costs into other parts of their earnings' and that 'we can't know for sure'. No public cost data shows below-cost pricing.
  - "'On some level' sets no threshold for dependence. 'Every single one' includes big tech firms themselves, which makes the statement close to circular for them."
support_condition: None can be stated fairly. The claim would need public evidence of below-cost pricing by big tech plus dependence for every major AI seller, and 'on some level' gives no threshold.
contradiction_condition: None can be stated fairly. Showing that some company runs its own compute, or pays full price, would not rule out dependence 'on some level'.
