assessment_axis: historical_observation
explicit_source_elements:
  - On some level
  - every single one of these companies
  - dependent on big tech’s willingness
  - subsidize the entire industry
evaluator_interpretation:
  - The preceding sentence defines the population as major consumer and enterprise technology companies selling AI products.
  - The ordinary reading is material economic dependence of their AI offerings on continuing Big Tech subsidies, including indirect dependence through model providers.
  - Buying cloud services does not by itself establish receiving a subsidy or needing one.
  - Because this describes an ongoing state without a reporting period, use April through June 2024, the latest completed calendar quarter generally reportable before the September 16 post.
  - This is a qualitative industry-dependence claim, not a specified company financial measure.
support_condition: Evidence covering the claimed population establishes that every major AI seller materially depended on continued Big Tech subsidies during the target period.
contradiction_condition: At least one clearly in-scope major AI seller had a viable AI offering during the target period without material direct or indirect dependence on those subsidies.
measurement_requirements: Identify the company population, actual subsidies, underlying training and inference costs, customer receipts, and whether each offering would remain viable without the subsidy. Infrastructure location alone is insufficient.
source_requirements: Contemporaneous contracts, cost disclosures, and product economics, including upstream relationships where indirect dependence is alleged.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2024-04-01
  end: 2024-06-30
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No reporting period; the latest generally reportable completed calendar quarter is used.
  - Major tech players are not enumerated.
  - "'On some level' leaves indirect dependence open-ended."
  - Subsidies could mean credits, below-cost prices, internal cross-subsidies, or investment.
  - Dependence of an AI offering and dependence of the entire company are different propositions.
