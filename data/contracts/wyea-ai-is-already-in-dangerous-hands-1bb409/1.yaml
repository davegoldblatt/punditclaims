  - its own hacking incidents
evaluator_interpretation:
  - "Assess the supplied normalized proposition: labs' public safety communications never address actual harms involving their existing products."
  - Addressing includes discussing observed misuse, harmful interactions, and safeguards for deployed products. It does not require acknowledging legal responsibility or proving safeguards effective.
  - The word never extends the claim to public communications before the post. No artificial starting date or reporting quarter is imposed.
  - The narrower claim about omissions in the CBS interview is not treated as equivalent to the broader claim about all safety discourse.
support_condition: A sufficiently comprehensive record shows safety communications confined to hypothetical future harms, with no discussion of harms involving existing products.
contradiction_condition: At least one public, pre-post safety communication directly discusses harms or misuse involving an existing product.
measurement_requirements: Read the communications in context and distinguish discussion of current products from speculation about future systems.
source_requirements: Dated lab publications or original interviews available before the post. Company statements establish what was discussed, not whether the claimed protections worked.
