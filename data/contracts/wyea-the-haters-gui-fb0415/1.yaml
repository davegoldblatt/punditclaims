assessment_axis: causal_assessment
explicit_source_elements:
  - five companies' spend on NVIDIA GPUs
  - largely dictate
  - how stable the US stock market will be
  - not saying that any of the Magnificent 7 are going to die
evaluator_interpretation:
  - The five companies are Amazon, Alphabet/Google, Microsoft, Meta and Tesla, as identified in the surrounding heading.
  - Read this as a claim about the market's existing structural dependence at the post date, rather than a separately timed forecast.
  - Largely dictate means that their NVIDIA purchases are a leading determinant of broad US equity-market instability, not merely a contributor.
  - Broad-market volatility and drawdowns are ordinary indicators of instability. NVIDIA's index weight alone does not measure this causal dependence.
  - The disclaimer about companies dying is a scope limitation, not an antecedent.
support_condition: Credible causal analysis establishes that changes or shocks to the named buyers' NVIDIA purchases are a leading driver of broad US equity volatility or drawdowns under the market structure described.
contradiction_condition: Credible causal analysis shows that these purchases have only a minor influence, with other drivers accounting for the claimed broad-market instability.
measurement_requirements: Buyer-specific NVIDIA investment data, broad US equity measures and a method distinguishing spending shocks from earnings, interest rates, trade policy and other market news.
source_requirements: Documented purchase data and credible market attribution research. Market concentration, revenue concentration and contemporaneous price movements alone are insufficient.
