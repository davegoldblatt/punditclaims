evaluator_interpretation:
  - The claim covers reactions to GPT-5 in the week between its launch (2025-08-07) and the post (2025-08-14).
  - Part A, 'some customers wanted the old models back', holds if users publicly asked for GPT-4o or other legacy models and OpenAI responded.
  - Part B, 'almost nobody felt satisfied', is read plainly as satisfaction with GPT-5 being rare across its users. Clear reports of substantial satisfied user groups, such as enterprise or developer customers, would contradict it.
support_condition: Reports show users demanding the old models back, and reports show dissatisfaction was near-universal, with few satisfied users.
contradiction_condition: Reports show that no meaningful group asked for the old models, or that substantial groups of users and customers were satisfied with GPT-5 in its launch week.
measurement_requirements: Contemporaneous reporting on user reactions, OpenAI's actions on legacy models, and customer or developer statements in the launch week.
source_requirements: Reputable news reports or OpenAI statements dated August 2025.
