assessment_axis: historical_observation
explicit_source_elements:
  - Amazon says it’s “fully operational”
  - it’s fucking lying
  - nearly half a million Trainium 2 chips
  - each chip being 500 watts
  - around 250MW
evaluator_interpretation:
  - The ordinary reading is that Amazon materially overstated Rainier's operational readiness.
  - Distinguish the advertised compute cluster from the eventual full buildout of its Indiana campus.
  - Use April 2026 through the post date for the ongoing operational allegation. Earlier launch records establish what Amazon originally described.
  - The arithmetic is a conditional chip-power calculation. It does not by itself measure the facility's total electrical demand.
  - The accusation of lying additionally implies knowledge of a false statement; operational incompleteness alone would not establish that knowledge.
support_condition: Contemporaneous commissioning or operating records show that the capacity Amazon described as fully operational was materially incomplete or unavailable. To support the allegation of lying, evidence must also show Amazon knew its description was false.
contradiction_condition: Records establish that the advertised Rainier cluster was commissioned and operating as described, and that the larger 2.2GW figure concerned subsequent campus expansion rather than the operational scope Amazon claimed.
measurement_requirements: An explicit boundary for the advertised cluster, commissioned equipment and buildings, dated workload records, and separate measures of chip power, IT power and total facility demand.
source_requirements: Amazon's original statement, customer confirmation, and independent commissioning, utility or site records. An assertion of intent requires additional documentary evidence.
