assessment_axis: causal_assessment
explicit_source_elements:
  - now
  - Google’s AI summaries
  - ripping away large chunks of the traffic
  - major media outlets
  - make content for machines to promote
evaluator_interpretation:
  - The claim concerns losses already occurring by June 16, 2025, rather than eventual effects.
  - Large chunks means substantial traffic losses; no numerical threshold is supplied.
  - The target is major publishers that rely on search optimization. This identifies a publisher class, not a conditional forecast.
  - Lower click-through rates on affected searches can establish a mechanism, but do not alone quantify substantial publisher-level traffic losses.
  - Assess the normalized AI-summary claim; the adjoining social-network assertion is outside scope.
support_condition: Publisher-level data and credible comparisons attribute substantial traffic losses at major search-optimized media outlets to Google's AI summaries by publication, separating their effect from ranking changes, search demand and other referral changes.
contradiction_condition: Comparable publisher-level evidence shows negligible attributable losses, or establishes that the apparent substantial losses arose from other causes.
measurement_requirements: Measure affected-query exposure, clicks and publisher-level referral traffic. Use matched comparisons or rollout variation, with controls for rankings, query mix, seasonality and other search changes.
source_requirements: Prefer publisher analytics, independent measurement and transparent causal studies. Use reputable reporting of publisher disclosures when the underlying analytics are unavailable.
