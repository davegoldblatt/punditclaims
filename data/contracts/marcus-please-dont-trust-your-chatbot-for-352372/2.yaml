interpretation_determines_result: true
ambiguity_flags:
  - "'Can easily' supplies no frequency or testable threshold."
  - "'LLMs' does not specify models, versions, or configurations."
  - "'Decently well' and competent clinical interviewing have no stated measures."
  - Categorical language about interview ability is embedded in a qualified warning about possible harm.
  - The wording does not distinguish omitted questions from other causes of incorrect advice or user decisions.
