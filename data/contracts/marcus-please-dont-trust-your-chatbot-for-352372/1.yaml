assessment_axis: causal_assessment
explicit_source_elements:
  - don’t know what they don’t know
  - work decently well with the information they’ve got
  - don’t know how to conduct clinical interviews
  - in the hands of the lay public
  - can easily give bad advice because the proper questions never get asked
evaluator_interpretation:
  - The testable mechanism is that failures to elicit relevant missing information materially cause inaccurate advice during lay-user interactions, despite better performance with complete case information.
  - I do not interpret the wording as requiring that a model never asks any useful question.
  - A performance gap alone does not identify its cause. The assessment must distinguish missing information from reasoning errors, communication failures and users disregarding correct advice.
  - The claim concerns systems relevant to public medical use at publication; older experiments can inform the mechanism but cannot alone establish unchanged behavior in newer systems.
support_condition: Controlled elicitation comparisons, or sufficiently detailed matched interaction analyses, show that omitted relevant questions or information cause otherwise avoidable advice errors across the relevant models.
contradiction_condition: Comparable lay-user studies show reliable elicitation of missing information, or establish that the observed errors persist independently of information elicitation and are explained by other mechanisms.
measurement_requirements: Compare complete-information performance with interactive performance and isolate the effect of eliciting omitted facts. Separate model advice from the user's final decision.
source_requirements: Primary interaction studies with transcripts, intervention details and medical assessment. General benchmark accuracy is insufficient.
