explicit_source_elements:
  - Right now
  - the math for profitability doesn’t work
evaluator_interpretation:
  - Assess only the normalized profitability proposition, not the separate productivity and scaling clauses.
  - The ordinary reading is that the generative AI business, taken in aggregate, was not currently earning a net profit.
  - Use calendar 2024, the latest completed annual financial period before publication.
  - This does not assert that no individual supplier was profitable or that future profitability was impossible.
  - No accounting basis is stated. The preceding comparison of annual revenue with cumulative spending does not define a net-income measure.
support_condition: A consistently scoped industry income estimate shows that realized GenAI revenues were below attributable expenses for the same reporting period.
contradiction_condition: A consistently scoped industry income estimate shows positive aggregate GenAI net income for that period.
measurement_requirements: Match revenue and expenses in the same period. Identify GenAI activities separately, and distinguish net income from operating income, cash burn, gross margins and cumulative capital expenditure.
source_requirements: Prefer financial disclosures or documented industry estimates with a stated accounting basis. Individual-company losses are context for an industry-wide proposition.
