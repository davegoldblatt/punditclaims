explicit_source_elements:
  - at least so far
  - OpenAI lacks both profits and a moat
evaluator_interpretation:
  - Profits means positive company-wide net earnings, rather than revenue, gross margin, financing, or annualized sales.
  - Use calendar 2023, the latest completed financial year before publication, for the financial component. This is a period choice, not an assertion that full-year accounts had been published.
  - A moat means a durable advantage that protects the business against competition. Benchmark leadership or the existence of competitors alone does not establish or exclude one.
  - The broader target period includes the competitive position through January 27, 2024.
  - Marcus supplies no financial source or accounting basis, so accounting_basis remains unknown.
support_condition: Comparable company-wide financial evidence establishes no positive net earnings in the target financial period, and evidence of competitive conditions establishes an absence of durable protective advantages.
contradiction_condition: Comparable financial evidence establishes positive net earnings, or evidence establishes a durable competitive advantage at publication.
measurement_requirements: Match financial period, entity and accounting basis. Assess barriers to entry, distribution, switching costs, access to resources and capabilities separately from individual benchmark scores.
source_requirements: Company-wide financial statements or clearly defined financial reporting, plus contemporaneous competitive evidence. Unknown accounting basis prevents a supported or contradicted financial verdict.
