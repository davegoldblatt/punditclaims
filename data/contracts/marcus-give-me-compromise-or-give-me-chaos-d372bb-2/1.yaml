  - No accounting source or basis is identified, so accounting_basis is unknown and a supported or contradicted money verdict is unavailable.
  - Revenue is before expenses; treatment of reseller payments and other double counting is unspecified.
support_condition: A comprehensive, consistently defined cumulative revenue estimate through November 28, 2023 establishes several billion US dollars, with a clearly defined comparison showing a negligible share of economic activity.
contradiction_condition: Comparable cumulative revenue evidence establishes an amount clearly outside the ordinary several-billion-dollar range, or a non-negligible economic share.
measurement_requirements: Separate realized revenue from annualized run rates, forecasts, financing, customer budgets and infrastructure sales. Reconcile provider coverage, cumulative dates and double counting. Identify a compatible economic denominator.
source_requirements: Company disclosures and a documented sector-wide aggregation or market estimate, with official economic statistics for the comparison.
