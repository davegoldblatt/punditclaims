assessment_axis: historical_observation
explicit_source_elements:
  - AI data centers are increasingly funded
  - both directly and through private credit
  - using pension and insurance funds
  - rely on these (theoretical) payments for future yield
  - pay out premiums
evaluator_interpretation:
  - Use April through June 2026, the latest completed calendar quarter before the July 22 post for which financing announcements could already be public. Earlier periods provide comparison context.
  - The plain reading is expanding pension and insurer participation in AI data center financing, not a specified percentage share of all financing.
  - New commitments establish expanding participation but must be distinguished from deployed capital, guarantees and proposed transactions.
  - Read the reference to paying out premiums as meeting pension and insurance benefit obligations from portfolios that include these investments. It does not claim that an entire fund depends on one project.
  - This is a qualitative claim about financing sources, not a stated company financial amount; metric_scope is null.
support_condition: Dated records establish increasing pension and insurer participation through direct investment and private credit by the target quarter, and trace expected project payments into investments supporting beneficiary or policyholder obligations.
contradiction_condition: Comparable records show that the asserted participation was absent or declining, or establish that the identified money and payment flows were not pension or insurance assets supporting those obligations.
measurement_requirements: Comparable financing and allocation records over time, identification of ultimate capital providers, separation of commitments from funding and guarantees, and documentation of repayment and beneficiary obligations.
source_requirements: Pension and insurer disclosures, financing documents and fund records. Reputable reporting may fill transaction details missing from primary disclosures, with that limitation stated.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The ongoing observation has no stated reporting period; the latest completed quarter is used.
  - "'Increasingly' supplies neither a baseline nor a measure of growth."
  - Funding can mean commitments or capital already deployed.
  - The text says premiums, although its apparent concern is benefit and policyholder payments.
  - AI-specific capacity is not consistently separated from broader hyperscale data centers.
retrospective_or_prospective: retrospective
