explicit_source_elements:
  - around 80% of OpenAI and Anthropic’s revenues
  - venture backed startups
  - heavily subsidize their userbases
  - growth is mostly tied to whether VC can continue funding its customers
evaluator_interpretation:
  - Revenues means each company's total realized revenue, including consumer and business revenue.
  - The wording could instead refer to their combined revenue; both readings should be checked where data permits.
  - Use the latest completed calendar quarter before publication, July through September 2026, for the ongoing revenue claim.
  - Mostly means venture funding is the predominant driver of revenue growth, not merely one source of exposure.
  - Heavy subsidy means customers materially fund service delivery from outside capital rather than receipts from their own users.
support_condition: Representative revenue records show that approximately 80% of total revenue comes from venture-backed startups with materially subsidized users, and funding-linked spending evidence shows continued venture financing predominantly determines growth.
contradiction_condition: Comparable revenue records place that share materially away from 80%, or representative customer economics and spending evidence show that user subsidies or venture funding are not the predominant source of the claimed growth dependence.
measurement_requirements: Revenue-weighted customer classifications for both companies, reconciled to total revenue; customer subsidy measurements; and evidence separating venture-funding effects from price, usage, efficiency, and customer-mix changes.
source_requirements: Company customer-revenue disclosures or representative independently measured data, plus customer financial records and evidence linking funding changes to AI purchases.
