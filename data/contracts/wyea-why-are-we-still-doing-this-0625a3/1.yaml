assessment_axis: causal_assessment
explicit_source_elements:
  - The flippancy with which the media reports on these data centers
  - is allowing con artists to get rich
  - creating the conditions for yet another great financial crisis
evaluator_interpretation:
  - Read this as a claim about a causal process already operating by the post date, not a prediction that a crisis must occur by an unstated deadline.
  - The ordinary test is whether misleading or materially incomplete coverage helped induce financing, enriched demonstrably deceptive promoters, and increased systemic financial vulnerability.
  - “Con artists” requires evidence of deception; risky investments or rising wealth alone do not establish it.
  - No numerical threshold for a great financial crisis or the media's contribution is supplied.
support_condition: Credible evidence traces material omissions or misleading coverage to investor decisions, gains by deceptive promoters, and consequential systemic exposure.
contradiction_condition: Credible investigation of the implicated financing shows that the alleged deceptive enrichment or media-driven financing mechanism did not occur, or that the claimed systemic transmission mechanism was absent.
measurement_requirements: Identify coverage, investor reliance, financing flows, promoter gains and financial-system exposure. Separate correlation from the claimed causal links.
source_requirements: Prefer investor records, regulatory or court findings, and financial-stability research. General risk warnings alone cannot establish the whole chain.
