explicit_source_elements:
  - None of the top labs
  - actually is remotely transparent
evaluator_interpretation:
  - The ordinary reading is that no leading AI laboratory provided meaningful public information permitting scrutiny of its models' development, capabilities, or risks.
  - Leading laboratories include Meta, OpenAI, Google/DeepMind, and Anthropic. Marcus supplies neither a list nor a transparency threshold.
  - Substantive disclosures across training data, methods, and evaluation count as meaningful transparency; complete disclosure of every institutional activity is not required.
  - For this ongoing observation, the evidence window is the current calendar quarter through publication, January 1–March 30, 2023. This approximates the contemporary state, rather than a quarterly average.
support_condition: Contemporary records show that leading laboratories uniformly withheld substantive information needed to scrutinize model development and evaluation, with public disclosures largely superficial.
contradiction_condition: At least one clearly leading laboratory published substantive information across several relevant dimensions, allowing meaningful scrutiny beyond promotional claims.
measurement_requirements: Inspect actual public documentation of data sources, training methods, compute, evaluations, and limitations. Do not substitute a later transparency score for the contemporary record.
source_requirements: Contemporary technical papers and disclosures, or retrospective research specifically reconstructing the same period.
