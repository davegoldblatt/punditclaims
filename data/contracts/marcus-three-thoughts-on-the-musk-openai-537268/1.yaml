explicit_source_elements:
  - capitalized on that claim
  - in recruiting
  - raising money and reputation from Musk
  - in tax exmpt status
  - in a countless other ways
evaluator_interpretation:
  - The historical period covers the founding effort through the post date.
  - The ordinary reading is that OpenAI used its nonprofit public-benefit identity to attract researchers, obtain Musk's financial and public backing, and obtain tax exemption.
  - Capitalized on means obtained benefits through that identity; it does not by itself allege that every recruit or donation depended exclusively on nonprofit status.
  - The fundraising component is unquantified. No currency, amount, or accounting basis is supplied, so none is inferred.
  - The named benefits can be investigated. Countless other ways supplies no additional testable category.
support_condition: Contemporaneous recruiting, donor, publicity, and tax records establish the named benefits and connect them to OpenAI's nonprofit commitment.
contradiction_condition: Positive evidence establishes that a named benefit did not occur or that the asserted connection to nonprofit commitments was materially false. Missing records alone do not contradict the claim.
measurement_requirements: Separate receipt of benefits from proof that the nonprofit commitment helped obtain them. Do not equate donor pledges with receipts or charitable contributions with operating revenue.
source_requirements: Recruiting records or participant accounts, donor records, contemporary public endorsements, and IRS determination or filing records.
