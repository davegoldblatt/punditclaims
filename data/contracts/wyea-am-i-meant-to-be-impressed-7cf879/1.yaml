explicit_source_elements:
  - have spent over a trillion dollars on AI
  - either nothing
  - vague statements
  - pathetic revenues
evaluator_interpretation:
  - The surrounding discussion identifies Microsoft, Alphabet/Google, Amazon and Meta.
  - Treat spending as cumulative AI capital expenditure because the preceding comparisons explicitly concern capex.
  - "Use March 31, 2026 as the reporting cutoff: the latest completed quarterly period discussed before the May 6 post. The cumulative starting date is not consistently specified."
  - Read the return criticism as saying disclosed financial returns are poor relative to investment. The speaker expressly acknowledges revenue, so this is not a literal claim that no AI products or revenue exist.
  - Use company_reported as the accounting basis for the spending comparison because the context relies on company quarterly figures; this does not validate their classification as AI spending.
support_condition: Comparable records establish more than $1 trillion of cumulative AI capital expenditure through the reporting cutoff, and identifiable financial returns are clearly small relative to that investment under the ordinary reading.
contradiction_condition: Comparable records establish cumulative AI expenditure at or below $1 trillion for the intended period, or clearly substantial attributable financial returns defeat the return characterization. Merely identifying nonzero revenue is insufficient.
measurement_requirements: Specify the cumulative start, separate AI from other investment, reconcile lease treatment, and compare actual financial returns over consistent periods. Monthly revenue, annualized revenue and cumulative capital expenditure are not interchangeable.
source_requirements: Company filings or disclosures and independently supported AI allocations. The speaker's estimates cannot independently establish the expenditure total.
