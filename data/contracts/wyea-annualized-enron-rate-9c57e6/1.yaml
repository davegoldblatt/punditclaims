ambiguity_flags:
  - Every AI startup is broader literally than the application businesses discussed in context.
  - Massive discount has no numerical threshold.
  - Actual cost could mean retail API prices, negotiated supplier charges, or the provider's own inference cost.
  - The claim does not distinguish heavy-user subsidies from aggregate startup economics.
  - No reporting period is specified; the latest completed quarter is used.
