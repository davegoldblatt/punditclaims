assessment_axis: causal_assessment
explicit_source_elements:
  - Every AI startup
  - an extraction mechanism for OpenAI and Anthropic
  - reselling their tokens
  - at a massive discount
  - because users are unwilling to pay the actual cost
evaluator_interpretation:
  - In context, AI startup means an AI application business using these providers' models, rather than every hardware, robotics, or model-training company.
  - The plain reading is that each such startup materially subsidizes customers' token consumption because customers will not pay enough to cover the supplier cost.
  - The comparison is aggregate realized customer payments against actual supplier charges after discounts, not the maximum usage permitted to one heavy user.
  - The latest completed quarter before publication, July through September 2026, is used for current operating economics.
  - The surrounding comparisons use reported margins and estimated token costs, so the financial basis is estimate.
support_condition: Records covering the relevant startup population show material token resale subsidies at every firm, together with demand or pricing evidence establishing insufficient willingness to pay as the cause.
contradiction_condition: A relevant startup demonstrably covers its actual token supplier costs through customer payments without the claimed material subsidy, or reliable evidence disproves the asserted causal explanation.
measurement_requirements: Matched customer receipts, actual supplier invoices, negotiated discounts, model mix, and usage across customers; evidence of demand at cost-covering prices.
source_requirements: Startup financial and billing records or credible independently verified reports. Published price lists and research previews are informative but do not establish realized aggregate margins.
metric_scope:
  company: AI application startups using OpenAI or Anthropic
  metric: Customer receipts relative to actual token supplier expenditure
  currency: null
  units: Ratio of receipts to expenditure
  accounting_basis: estimate
  fiscal_or_calendar: calendar
