explicit_source_elements:
  - LLMs continue to lack stable models of the world
  - they can't reliably stick to legal moves in chess
  - can't be fully trusted even to know how many limbs someone has
  - passage from summer 2025 essays, quoted in a 2026-03-02 post
evaluator_interpretation:
  - The footnote quotes a summer 2025 essay, so the claim describes leading LLMs in summer 2025 (June to August 2025).
  - "Plain reading: in that period, leading LLMs could not reliably keep track of the state of a situation, such as the positions of pieces on a chess board. Marcus's own example is illegal chess moves."
  - The claim is about reliability ('stable'), not about whether LLMs have any internal world representation at all.
support_condition: Dated evidence from summer 2025 showing leading LLMs often losing track of world state, for example frequent illegal chess moves or board-tracking failures in public tests.
contradiction_condition: Dated evidence from summer 2025 showing leading LLMs reliably tracking world state, for example consistently legal chess play without a list of legal moves across leading models.
measurement_requirements: Published evaluations or documented tests of state tracking (legal chess moves, board awareness) by leading LLMs in June to August 2025.
source_requirements: Benchmark or tournament reports, papers, or reputable news reports of documented tests.
