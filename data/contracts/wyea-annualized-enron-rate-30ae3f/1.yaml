explicit_source_elements:
  - vast majority of hyperscaler AI revenues
  - Anthropic and OpenAI’s compute spend
  - dependent on near-perpetual funding
  - vast majority of Anthropic and OpenAI’s revenues
  - AI startups
evaluator_interpretation:
  - The claim has two revenue-concentration assertions and a financing-dependence assertion for each layer. All must hold for full support.
  - The plain reading of 'vast majority' is an overwhelming share, substantially above half. No exact percentage is imposed.
  - Treat hyperscalers as the major commercial cloud providers discussed in the post, including Microsoft, Amazon, Google and Oracle.
  - Read the two labs' revenue share on a combined basis; do not replace total revenue with API revenue or enterprise revenue.
  - Read 'near-perpetual funding' as an ongoing need for repeated external financing to sustain the spending, not literal proof about eternity.
  - Use January–June 2026, the latest common financial reporting window described in the post. Later monthly spending samples are context.
  - Treat the shares as estimates, consistent with the post's use of spending samples and reported figures.
support_condition: Comparable revenue breakdowns show overwhelming concentration at both layers, and cash-flow evidence shows that the relevant spending materially requires repeated external financing.
contradiction_condition: Comparable breakdowns show a substantial majority of either revenue pool comes from other customer groups, or cash-flow records show the asserted financing dependence does not hold.
measurement_requirements: Use realized revenue with consistent periods and recognition rules. Identify ultimate customer types, exclude pass-through double counting, and distinguish historical fundraising from a continuing financing requirement.
source_requirements: Customer-level revenue disclosures or representative measurements reconciled to company totals, plus cash-flow and financing records for the labs and relevant startups.
