assessment_axis: forecast_outcome
explicit_source_elements:
  - When the AI bubble bursts
  - none of this infrastructure
  - will be particularly useful
evaluator_interpretation:
  - The surrounding passage identifies infrastructure as AI GPUs and data centers built during the investment boom.
  - The contextual antecedent is a broad collapse of the AI investment boom associated with the named hyperscalers and model companies. A decline in one national stock market does not automatically establish that event.
  - Useful means substantial productive operation or reuse, whether by original owners or subsequent purchasers. A low resale price alone does not establish uselessness.
  - No deadline, numerical collapse threshold, or post-collapse observation period is supplied.
support_condition: After the antecedent is established, broad evidence across the relevant GPUs and data centers shows little substantial productive use or viable reuse.
contradiction_condition: After the antecedent is established, reliable records demonstrate substantial sustained productive use of a material part of the infrastructure. Continued use before a collapse does not settle the forecast.
measurement_requirements: Date the investment collapse separately from subsequent utilization. Track operation, workloads, transfers, reuse, and abandonment; distinguish financial losses from lack of utility.
source_requirements: Independent evidence of the collapse and dated operator, purchaser, court, or utilization records establishing what happened to the infrastructure afterward.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Once a broad AI investment collapse is established, a dated and documented case of substantial sustained productive use of a material portion of the affected infrastructure can decisively contradict the assertion that none will be particularly useful. Support requires representative post-collapse evidence across the infrastructure categories.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Bubble burst has no numerical trigger.
  - The geographic and market scope of the collapse is unstated.
  - Particularly useful has no numerical threshold.
  - No deadline or post-collapse observation period is specified.
  - Infrastructure includes different assets with potentially different reuse prospects.
retrospective_or_prospective: retrospective
