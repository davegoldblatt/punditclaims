evaluator_interpretation:
  - Read this as a claim that multiple distinct customers obtained substantially lower GPU rental prices than the public benchmarks invoked in the surrounding examples.
  - The context expressly compares long-term agreements with headline index prices. Identical contract duration is therefore not required, but differences in duration, hardware, services and pricing dates must remain visible.
  - Distinguish signed payment obligations from invoices paid and revenue already earned.
  - The observation concerns discoveries made by publication; the words do not specify the earliest discovery date.
support_condition: At least two independently documented customer examples show substantial price gaps against the identified public benchmarks, with hardware, dates and contractual status established.
contradiction_condition: Reliable records show that the cited examples do not establish repeated substantial gaps, because the contract prices or benchmark comparisons are materially wrong.
measurement_requirements: For each example, establish GPU model, dollar price per GPU-hour, contract date and duration, bundled services, payment status, and the date and definition of the comparison index.
source_requirements: Contracts or company disclosures and dated benchmark readings. Reputable reporting may substitute for private contracts, with its limitations stated.
