explicit_source_elements:
  - the demand for AI-powered software is not there
  - neither is the demand for selling AI-powered add-ons to other software
  - if Microsoft is struggling to sell AI-powered software attached to the literally-most-used enterprise software
evaluator_interpretation:
  - "Plain reading: as of the post, there was no substantial paying customer demand for AI-powered software products or for AI add-ons sold with existing software."
  - "He named no period. The test uses the latest quarters companies could report on around the post: April 2026 to the post date."
  - Large paid adoption figures, with seats or recurring revenue in the millions or billions and growing, would show demand 'is there'.
  - He may have meant demand too small to justify AI capex. That reading is noted but not adopted, because his words are absolute.
support_condition: "Leading AI software products and AI add-ons show little paid uptake: small, flat or falling paid seats or recurring revenue."
contradiction_condition: Major AI add-ons and AI software products show large and growing paid adoption in the period, such as tens of millions of paid seats or billions in recurring revenue.
measurement_requirements: Paid seats, annual recurring revenue (ARR) or revenue for prominent AI software products and AI add-ons, April to early August 2026.
source_requirements: Company earnings releases and filings first. Reputable news reports for private companies.
