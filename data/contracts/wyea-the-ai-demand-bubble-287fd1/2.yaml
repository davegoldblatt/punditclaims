assessment_axis: historical_observation
explicit_source_elements:
  - the demand for AI-powered software is not there
  - neither is the demand for selling AI-powered add-ons to other software
  - without hyperscalers paying themselves to do so
  - a brutal story of unproductive capex
  - doesn’t appear that Microsoft 365 Copilot is a meaningful business
evaluator_interpretation:
  - In context, the ordinary reading is that independent customer demand is insufficient to sustain the AI software business at the scale of investment described. The passage acknowledges paid seats and revenue, so evidence that some customers pay cannot alone contradict it.
  - Assess standalone AI software and paid AI additions to existing software separately. Infrastructure purchases alone do not establish demand for either category.
  - Use April–June 2026, the latest completed reporting quarter before the August 4 post, for the ongoing observation. The surrounding fiscal-year figures provide context rather than a forecast deadline.
  - The speaker supplies no required return, investment allocation, or numerical threshold for sufficient demand. Do not invent one or require a single quarter’s revenue to recover multiyear investment.
  - This is a market-demand claim, not a claim specifying one company’s financial metric; contract metric_scope is null.
support_condition: Representative evidence for both software categories shows that independent customer purchasing and renewals, at actual prices, are insufficient to sustain the associated business and investment, with apparent demand materially dependent on supplier financing or subsidies. Low adoption or losses alone would not establish this.
contradiction_condition: Representative evidence shows durable, independently funded customer purchasing and renewals at prices and costs that sustain the associated business and investment in either claimed category. Paid-seat counts, revenue growth, or isolated successful products alone do not settle this contextual claim.
measurement_requirements: Connect actual customer payments, discounts, renewals and usage to attributable delivery costs and investment. Distinguish software from infrastructure, standalone products from add-ons, and customer spending from financing. Assess investment over its relevant economic life.
source_requirements: Use records available by October 28, 2026. Prefer customer purchasing records, independent transaction measurements and product-level financial disclosures. Company adoption announcements are relevant but cannot alone establish investment adequacy.
