  - Demand 'is not there' could be read literally, but the surrounding acknowledgment of paid sales makes adequacy relative to investment the fairer reading.
  - No numerical adequacy threshold, required return, investment allocation or recovery period is specified.
  - The boundary between AI software, model services and infrastructure is not defined.
