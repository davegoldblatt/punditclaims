assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - they don’t know what they don’t know
evaluator_interpretation:
  - The ordinary behavioral reading is that LLMs do not reliably recognize when they lack the knowledge needed to answer accurately. This does not require that they have no useful uncertainty signals whatsoever.
  - Recognition is assessed through confidence calibration and appropriate abstention, without making claims about subjective awareness.
  - For this ongoing observation, use the current calendar quarter through publication, April 1–June 22, 2025, as the latest reporting window for contemporary model evaluations. Marcus supplied no reporting period.
support_condition: Contemporary evaluations across multiple LLMs demonstrate substantial failures to recognize uncertainty or withhold answers when necessary information is unavailable.
contradiction_condition: Representative contemporary evaluations show that LLMs reliably distinguish answerable from unanswerable questions and communicate uncertainty or abstain appropriately across varied tasks.
measurement_requirements: Distinguish answer accuracy, confidence calibration, and appropriate abstention. Successful uncertainty estimation on selected tasks does not establish reliable performance across tasks.
source_requirements: Primary empirical studies with identifiable models, tasks, and evaluation methods. Earlier studies may qualify the interpretation but are context for the specified period.
