assessment_axis: historical_observation
explicit_source_elements:
  - Overall impact
  - on productivity
  - return on AI investment
  - so far
  - modest
evaluator_interpretation:
  - The plain reading is that AI had delivered limited realized gains across the economy and businesses overall, while allowing substantial gains in particular settings.
  - Use 2025, the latest completed calendar year that could be broadly reported before the post, as the reporting period for this ongoing observation. This does not test developments during early 2026.
  - Productivity means output relative to inputs. Investment returns mean financial benefits relative to investment costs.
  - Evidence about the proportion of firms benefiting does not by itself establish the size of aggregate benefits.
  - This is a cross-business qualitative claim, not a claim about a named company's financial accounts; metric_scope is null.
support_condition: Broad evidence establishes limited realized AI-attributable productivity gains and limited financial returns relative to investment costs during the target period.
contradiction_condition: Broad evidence establishes substantial realized AI-attributable productivity gains or substantial aggregate returns relative to investment costs during the target period.
measurement_requirements: Distinguish aggregate gains from the experience of the typical firm, realized results from expectations, and net investment returns from revenue increases or cost reductions alone.
source_requirements: Prefer representative business surveys and research identifying AI's contribution. General productivity statistics and individual success stories cannot alone establish the overall effect.
