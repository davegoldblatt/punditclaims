explicit_source_elements:
  - pony up $1 billion in 2025
  - similar annual payments going forward until its completion
  - heavily delayed
  - tariffs, labor shortages
  - scrappy but unproven startups
evaluator_interpretation:
  - The primary test is whether OpenAI paid approximately USD 1 billion or more toward the Abilene buildout during calendar 2025.
  - The 2025 payment deadline is explicit. The later annual-payment clause remains tied to completion, for which this sentence supplies no fixed final date.
  - The surrounding discussion frames these as development contributions. Ordinary purchases of cloud services require evidence linking them to the claimed buildout payments.
  - Assuming even the rosiest numbers is rhetorical qualification, not a measurable antecedent.
  - The predicted delays and their causes are additional assertions, not conditions that excuse the payment prediction if they fail to occur.
  - A complete supported finding would also require comparable subsequent annual payments and evidence for the claimed substantial delays and causes.
support_condition: Records establish approximately USD 1 billion or more in qualifying OpenAI payments during 2025, similar payments in subsequent applicable years, and substantial project delay attributable to the stated factors.
contradiction_condition: Complete payment records establish a materially smaller 2025 total with no qualifying omitted payments, or records decisively refute the continuing-payment or substantial-delay assertions. Conflicting results across these components warrant mixed.
measurement_requirements: Separate OpenAI's payments from project financing and partners' spending. Use calendar-year cash outlays, distinguish buildout contributions from service purchases, and compare actual construction milestones against the pre-claim schedule.
source_requirements: Payment records, financial disclosures or documented reporting identifying payer, recipient, purpose and year; construction records and evidence connecting any delay to the named causes.
