early_resolution_rule: The 2025 payment component can be supported early by verified cumulative qualifying payments reaching USD 1 billion. That alone does not resolve the later-payment and delay components.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Approximately USD 1 billion versus a strict minimum.
  - Direct development contributions versus cloud-service payments.
  - Similar annual payments has no numerical tolerance.
  - Completion may mean the first operating phase or the full campus.
  - Heavily delayed has no numerical threshold.
  - The 2025 deadline has elapsed, but the continuing-payment clause has no fixed terminal date.
