assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI or Anthropic shutting down
  - very unlikely based on their corporate structure
  - “collapsing” will be more like the Character.ai deal
  - a big tech firm absorbs them
evaluator_interpretation:
  - The assessable forecast concerns what happens conditional on a collapse; it does not predict a dated collapse.
  - Absorption includes a transfer of the core team or business to a large technology company while a residual entity survives. Ordinary investments and commercial partnerships do not qualify.
  - Collapse means a failure to continue the substantive business independently, not a falling valuation or an ordinary restructuring.
  - The alleged concealment motive and the unquantified probability of shutdown cannot be separately established by transaction records.
support_condition: A documented collapse of either company is resolved through a rescue absorption of its core business or team by a large technology company.
contradiction_condition: A documented collapse ends in permanent closure without such absorption, or another completed disposition inconsistent with the predicted mechanism.
measurement_requirements: Establish the collapse separately from the transaction, then examine control, leadership transfers, assets and continuing operations.
source_requirements: Completed transaction disclosures, corporate filings and operating records. Announced investments alone are insufficient.
