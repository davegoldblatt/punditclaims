evaluator_interpretation:
  - The claim concerns OpenAI's position on May 13, 2024.
  - The plain reading of 'have' is possession of a completed GPT-5 model, including internally. Public non-release alone does not establish this.
  - Fourteen months refers approximately to the interval since GPT-4's announcement. It does not establish when GPT-5 development began or whether work continued throughout that interval.
support_condition: Reliable dated development records or disclosures establish that OpenAI lacked a completed GPT-5 on May 13, 2024, despite attempting to develop its successor over approximately the stated interval.
contradiction_condition: Reliable records establish that a completed GPT-5 existed by May 13, 2024, or establish a development chronology incompatible with the claimed duration.
measurement_requirements: Distinguish research, training, incomplete checkpoints, completed models, demonstrations, and public releases.
source_requirements: Dated company disclosures, development records, or reliable reporting with direct knowledge of internal development. A missing public announcement is insufficient.
