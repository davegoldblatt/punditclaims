evaluator_interpretation:
  - The plain financial reading is that the AI industry was incurring substantial overall losses, not merely that some companies were losing money.
  - The surrounding discussion concentrates on generative AI developers, but also includes cloud providers and AI more generally. These boundaries cannot be treated as interchangeable.
  - For the ongoing profitability observation, use October–December 2023, the latest completed calendar quarter reportable before publication.
  - The surrounding post relies on press accounts of company finances, so estimate is the implied financial basis.
  - Proving its worth could mean useful applications, customer returns, or sustainable supplier profits. The speaker supplies no single test.
support_condition: Comparable financial evidence covering the relevant industry in the target quarter shows substantial aggregate losses. Supporting the additional worth claim requires a defensible, specified meaning of worth and evidence addressing it.
contradiction_condition: Comparable industry-wide evidence shows profitability or losses inconsistent with substantial overall unprofitability. Demonstrated useful applications would contradict only a reading that denies practical benefits altogether.
measurement_requirements: Industry coverage, comparable revenue and expense recognition, and separation of net losses from gross margins, cash burn, financing, and revenue run rates. Individual company results cannot establish the aggregate.
source_requirements: Company accounts or credible financial reporting for the target period; independent empirical evidence for practical benefits. Later publications may establish historical facts, but later operating results cannot replace the target period.
