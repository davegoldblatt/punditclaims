assessment_axis: historical_observation
explicit_source_elements:
  - a large share
  - these supposed “diverse” customers
  - unprofitable and unsustainable AI startups
evaluator_interpretation:
  - Read 'these customers' as the business customers discussed in the surrounding concentration argument.
  - A large share means a substantial proportion of customers by count; the wording does not supply a numerical cutoff or explicitly substitute revenue weighting.
  - Read 'unsustainable' as unable to maintain current operations and spending from internally generated funds without continuing external support, rather than certain eventual failure.
  - For this ongoing state, use July–September 2026, the latest completed quarter before publication. Earlier observations are context.
support_condition: Representative customer data show that a substantial proportion are AI startups that are both loss-making and dependent on continuing external support to maintain current operations.
contradiction_condition: Representative customer data show that only a small proportion meet both conditions.
measurement_requirements: Identify the customer population, count qualifying customers, and establish both losses and financing dependence. Venture backing alone is insufficient.
source_requirements: Customer composition data linked to financial statements, cash-flow records, or reliable financial reporting.
