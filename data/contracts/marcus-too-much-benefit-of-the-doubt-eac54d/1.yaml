explicit_source_elements:
  - AI can solve some aspects of radiology
  - doesn’t mean by any stretch of the imagination that they can solve all aspects
  - scanning an image is not reading clinical notes
evaluator_interpretation:
  - The ordinary empirical reading is that success on selected image tasks does not establish competence across the whole radiology workflow.
  - This does not assert that AI cannot read any clinical text or that future systems cannot combine capabilities.
  - Use 2022 through the post date as the current capability-reporting period; there is no standard quarterly reporting cycle for research capabilities.
support_condition: Contemporary evaluations and workflow descriptions show that successful image-related systems have bounded capabilities or unresolved requirements elsewhere in radiology work.
contradiction_condition: Contemporary evidence establishes that the cited scan-reading success also demonstrates competence across all substantive radiologist responsibilities.
measurement_requirements: Distinguish tested functions from untested functions. Include text and clinical context where required; do not equate isolated benchmark performance with whole-job competence.
source_requirements: Research evaluations or documented clinical capabilities public by October 16, 2022.
