explicit_source_elements:
  - China is practically begging to collaborate.
  - make Al a new frontier for China-US cooperation
  - make good use of the intergovernmental dialogue mechanism on AI
evaluator_interpretation:
  - The ordinary contextual reading is that Chinese authorities were actively inviting AI cooperation with the United States. 'Practically begging' emphasizes eagerness; it supplies no measurable degree of urgency.
  - Assess public overtures, which Marcus explicitly offers as his evidence. This does not establish private intentions or willingness to accept any particular American proposal.
  - For this ongoing diplomatic observation, use September 2026 through the September 23 post. Public statements can be reported immediately; no quarterly reporting lag applies.
  - The claim concerns AI cooperation generally, without committing China to Marcus's specific cancer or cybersecurity proposals.
support_condition: Authoritative Chinese government or CCP statements during the target period actively call for bilateral AI cooperation, beyond merely acknowledging that cooperation is possible.
contradiction_condition: Authoritative contemporaneous evidence establishes that China rejected bilateral AI cooperation generally, or that the purported Chinese appeals were materially misrepresented. Disagreement over particular terms alone does not contradict the claim.
measurement_requirements: Identify the speaker or institutional publisher, date, proposed cooperation, and whether the appeal specifically concerns the United States and AI.
source_requirements: Prefer original Chinese government statements and CCP publications. Treat them as evidence of their public position, not independent proof of sincerity.
