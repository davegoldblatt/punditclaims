condition_status: unknown
early_resolution_rule: Resolve only after documented OpenAI nonpayment and either Oracle's resulting business failure or a completed settlement that definitively removes the exposure while Oracle survives. Continued operation alone does not refute an undated forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Combines a conditional forecast and a historical observation.
  - "'Die' has no defined legal or financial threshold."
  - No deadline follows OpenAI nonpayment.
  - Hyperscalers are not enumerated.
  - Cash flow and its accounting basis are unspecified.
  - January–March 2026 is an evaluator-selected latest commonly reported quarter for the cash-flow component.
  - One metric_scope cannot express the distinct companies and financial measures separately.
