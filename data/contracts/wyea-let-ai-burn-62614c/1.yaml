assessment_axis: forecast_outcome
explicit_source_elements:
  - Oracle (which will die if OpenAI can’t pay it)
  - hyperscalers
  - having to fund the buildout with debt
  - as their cash flow turns negative
evaluator_interpretation:
  - This combines a conditional forecast about Oracle with an observation about hyperscalers. One overall outcome cannot fully represent both.
  - Read 'die' as insolvency, liquidation, or cessation of Oracle's business caused by OpenAI's inability to meet material payment obligations.
  - Read 'cash flow' as free cash flow after capital expenditure, given the surrounding discussion of construction funding. The speaker does not specify its accounting definition.
  - For the cash-flow observation, use January–March 2026, the latest commonly reported quarter before the July 7 post. Do not substitute subsequent quarterly results.
  - Do not treat a delayed construction project, a falling share price, or concern about future payments as an actual OpenAI payment failure.
support_condition: Documented material nonpayment by OpenAI followed by Oracle's business failure attributable to that nonpayment would support the forecast. The accompanying observation requires comparable hyperscaler disclosures showing negative free cash flow and borrowing needed to fund the buildout.
contradiction_condition: Following documented OpenAI nonpayment, a completed restructuring or settlement that removes the exposure while Oracle remains solvent could decisively contradict the forecast. Positive comparable cash flow would challenge the accompanying observation, but would not settle Oracle's conditional forecast.
measurement_requirements: Identify the payment obligation, due date, actual default, Oracle's resulting solvency, and causal connection. Separately identify the hyperscalers, cash-flow definition, reporting periods, debt proceeds, and uses of funds.
source_requirements: Prefer payment disclosures, court records, audited accounts, and company cash-flow and debt disclosures. Predictions of default are insufficient.
metric_scope:
  company: Oracle and unspecified hyperscalers
  metric: Oracle solvency following OpenAI nonpayment; hyperscaler cash flow and debt financing of construction
  currency: null
  units: null
