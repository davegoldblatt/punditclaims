evaluator_interpretation:
  - "Use the factual definition supplied in the surrounding sentence: every public-road self-driving system had either an onboard safety driver or remote human assistance available."
  - Having remote assistance available does not necessarily mean continuous human observation, remote steering, or intervention on every trip.
  - Use August 1–19, 2023, for the ongoing state described in the publication month.
  - Do not silently restrict every vehicle on public roads to Cruise and Waymo.
support_condition: Contemporaneous operational documentation or an adequately comprehensive industry assessment establishes one of the two human-support arrangements for all public-road systems.
contradiction_condition: A verified public-road self-driving system operated without an onboard safety driver and without remote human assistance.
