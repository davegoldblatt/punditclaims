assessment_axis: forecast_outcome
explicit_source_elements:
  - GPT-4 by itself
  - won’t be a general purpose artificial general intelligence
  - capable of taking on arbitrary tasks
evaluator_interpretation:
  - The target is GPT-4 itself, excluding successor models and systems with additional reasoning or planning tools.
  - The plain reading is broad competence on unfamiliar tasks across domains, not infallibility or the ability to perform literally every imaginable task.
  - By itself specifies the evaluated configuration; it is not an antecedent whose future occurrence must be established.
  - Marcus supplies neither an AGI benchmark nor a required level of performance.
support_condition: Evaluations establish substantial limitations that rule out broadly general task competence under an ordinary reading of the claim.
contradiction_condition: Reproducible evaluations establish broadly general competence on unfamiliar tasks across domains using GPT-4 without external aids.
measurement_requirements: Identify the GPT-4 version, prompts, permitted assistance, task coverage and performance criteria. Isolated mistakes do not by themselves disprove general intelligence.
source_requirements: Primary capability evaluations, including material evidence of both capabilities and limitations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated evaluation of the named model may settle the forecast if it establishes or rules out the stated broad capability without relying on a disputed definition of AGI.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No operational definition of AGI.
  - No performance threshold for arbitrary tasks.
  - No deadline.
  - GPT-4 could denote its initial release or subsequent versions.
retrospective_or_prospective: retrospective
