assessment_axis: historical_observation
explicit_source_elements:
  - absolutely no advantage to or reason for
  - buying GPUs months or years in advance
  - outside of the vendor (NVIDIA) playing hardball
evaluator_interpretation:
  - The plain reading concerns purchasing GPUs substantially before operational deployment and denies any independent commercial or operational rationale.
  - The surrounding discussion includes both advance orders and already-delivered hardware in storage. These are materially different transactions and must be distinguished.
  - Because procurement conditions are reported continuously, use the current calendar quarter through the post date as the latest reportable period for this ongoing observation. This is an evaluator-selected period.
  - A demonstrated advantage need not justify every advance purchase. However, a benefit caused solely by the vendor pressure expressly excluded by the claim is not a counterexample.
  - This is a procurement-rationale claim, not a quantified claim about a company's money, so metric_scope is null.
support_condition: Evidence covering the relevant procurement arrangements shows that early purchasing supplies no independent operational or financial benefit and that the observed reasons arise solely from NVIDIA's pressure.
contradiction_condition: At least one well-documented arrangement in the target period shows an advantage to buying GPUs months or years before deployment that exists independently of NVIDIA pressure. Evidence about reservations must not be silently substituted for evidence about taking delivery and holding hardware.
measurement_requirements: Distinguish reservation, binding order, payment, delivery and deployment dates. Establish the benefit, the alternative of waiting, relevant holding costs and the source of any supply constraint.
source_requirements: Prefer procurement agreements and purchaser disclosures documenting actual timing and benefits. Expert descriptions of market practice can inform the assessment but may not establish independence from vendor pressure.
