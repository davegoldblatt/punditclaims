explicit_source_elements:
  - there isn’t actually real demand
  - from anyone that can actually afford to buy these GPUs
evaluator_interpretation:
  - The plain reading is a categorical claim that no financially capable buyer has genuine demand for NVIDIA GPUs.
  - Afford means possessing financial resources to fund purchases; it does not require the GPU investment itself to have already earned back its cost.
  - Use April–June 2026, the latest completed calendar reporting quarter before publication, for the underlying buyer-demand and financial-capacity observation. The August financing announcement is contextual.
  - The financing arrangement identifies the event prompting the claim; its headline size is not a separate financial proposition being graded.
  - This is a qualitative demand claim, so the contract has no monetary metric. Financial disclosures are used as context for a buyer's capacity.
  - A narrower claim about independently profitable end customers, or only OpenAI and Anthropic, would require different evidence.
support_condition: Evidence establishes that genuine GPU demand is confined to buyers unable to finance their purchases from adequate financial resources.
contradiction_condition: At least one actual NVIDIA GPU customer has deployed the hardware for an operating service and has demonstrated financial capacity to fund purchases.
measurement_requirements: Documented operating GPU deployments and contemporaneous evidence of the buyer's financial resources.
source_requirements: Primary customer or supplier deployment records and company financial disclosures; financing announcements alone are insufficient.
