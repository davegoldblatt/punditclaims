explicit_source_elements:
  - the generative AI market
  - a $50 billion revenue industry
  - masquerading as a $1 trillion one
  - the media is helping
evaluator_interpretation:
  - Treat $50 billion as an approximate current annual revenue scale, not an exact audited total.
  - The surrounding post combines annualized company figures and 2025 estimates. Use an annualized-scale reading, while explicitly retaining that ambiguity.
  - Use the second calendar quarter of 2025 as the latest completed reporting window before publication, not subsequent industry growth.
  - The surrounding discussion includes model providers, applications, and hyperscaler services. It distinguishes their revenue from purchases of GPUs and other capital expenditure.
  - Read the media clause as alleging presentation of current revenue scale as roughly $1 trillion. Clearly dated future forecasts or valuations do not by themselves establish that allegation.
support_condition: A consistently scoped estimate places the current annual revenue scale near $50 billion, and contemporaneous media records materially present that same market as generating roughly $1 trillion in current annual revenue.
contradiction_condition: Comparable revenue measurements place the market clearly outside the claimed approximate scale, or a sufficiently representative examination disproves the alleged presentation of current revenue as roughly $1 trillion.
measurement_requirements: Define industry coverage and treatment of intermediate cloud sales. Keep realized revenue, annualized revenue, spending, financing, valuation, and future forecasts separate.
source_requirements: Transparent industry estimates or a reconciled aggregation of company revenues, plus identifiable contemporaneous media examples for the representation clause.
