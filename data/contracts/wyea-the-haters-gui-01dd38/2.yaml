assessment_axis: historical_observation
explicit_source_elements:
  - generative AI market
  - $50 billion revenue industry
  - masquerading as a $1 trillion one
  - the media is helping
evaluator_interpretation:
  - Read $50 billion as an approximate annual revenue scale at the time of publication, rather than a forecast of completed 2025 revenue.
  - Use Q2 2025, the latest completed calendar quarter before publication, as the reference period for the current annualized revenue scale.
  - Read 'masquerading' as promotion and coverage conveying trillion-dollar commercial importance through expectations, valuations, or spending. It does not require journalists to report $1 trillion of current revenue.
  - The ordinary revenue reading concerns sales of generative AI products and services. Hardware sales, financing, valuations, and economic benefits must be identified separately.
  - Read 'the media is helping' as amplification of that presentation, without requiring proof of journalists' private intentions.
  - The quotation supplies no accounting basis or consistent treatment of sales between suppliers and application providers.
support_condition: A credible estimate with disclosed coverage and accounting treatment places annualized generative AI revenue around $50 billion in Q2 2025, while contemporaneous coverage amplifies expectations, valuations, or spending that portray the sector as a trillion-dollar commercial phenomenon.
contradiction_condition: Comparable market-wide revenue evidence clearly places the current annualized revenue scale outside a reasonable approximation to $50 billion, or a sufficiently representative examination of contemporaneous coverage contradicts the claimed amplification. A single careful article cannot disprove a general claim about media coverage.
measurement_requirements: Market-wide revenue estimates must disclose included products, geographic coverage, annualization method, and treatment of transactions within the supply chain. Examine media framing separately from revenue; spending and valuation cannot substitute for sales.
source_requirements: Prefer original market research and company disclosures. Use contemporaneous articles as direct evidence of their own framing. Do not use Zitron's writing to establish the revenue estimate or the alleged amplification.
