evaluator_interpretation:
  - "Same refers to the immediately preceding prediction: public offerings followed by index inclusion and losses borne by index trackers and retail holders."
  - The prediction covers both Anthropic and OpenAI.
  - The reference to relaxed rules concerns accelerated or loosened index eligibility generally; no particular index is named.
  - When reality catches up describes the predicted correction, rather than an independently measurable antecedent that must occur before scoring.
  - The following separate prediction about 2026 is not imported as a deadline for this sentence.
support_condition: Both companies go public, enter major indices through the described accelerated or relaxed route, and subsequent losses are documented for tracking funds and retail holders at their actual acquisition prices.
contradiction_condition: A decisive terminal event makes the predicted sequence impossible for at least one named company, or the completed investment episode establishes that the specified holders did not incur the predicted losses. Temporary gains or delayed listings do not suffice.
measurement_requirements: Offering and index inclusion dates, applicable eligibility rules, actual fund and retail acquisition prices, holdings, distributions, and subsequent returns. Corporate operating losses are not shareholder investment losses.
source_requirements: Company filings, official index notices and methodologies, fund records, and credible investor ownership and return data.
