explicit_source_elements:
  - Training is ridiculously expensive
  - getting more expensive
evaluator_interpretation:
  - In the surrounding discussion of competing leading labs, training means training frontier generative models, not every small model or fine-tuning job.
  - The ordinary testable content is that total frontier training expenditure is large and rising. 'Ridiculously' adds an evaluative emphasis without a separate numerical threshold.
  - Use the surrounding August 2023-to-publication comparison for the trend. Do not substitute declining cost per unit of capability for total expenditure per frontier training run.
  - The adjacent reported dollar figure indicates an estimate-based cost discussion. USD is the contextual currency; no particular company's spending total is asserted in this sentence.
  - The separate Claude 5.5 development-cost figure is not needed to establish this general trend.
support_condition: Independent, comparable estimates show substantial frontier training expenditure and an upward trend in total cost per leading training run during the contextual interval.
contradiction_condition: Comparable estimates show that frontier training expenditure is generally small or that total frontier training costs are flat or declining. Cheaper small models alone do not contradict the claim.
measurement_requirements: Separate final-run compute costs from full development costs, experimental runs, salaries, inference, and cost per fixed capability. Identify estimate uncertainty.
source_requirements: Prefer developer disclosures or independent cost studies with stated hardware, duration, pricing, and energy assumptions.
