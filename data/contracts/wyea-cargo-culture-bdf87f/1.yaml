explicit_source_elements:
  - OpenAI moved around numbers
  - to make things look better than they are
  - I believe
  - inference costs are being dumped in sales and marketing
evaluator_interpretation:
  - The checkable allegation is that OpenAI changed its expense presentation to improve its apparent economics, with inference expenses classified under sales and marketing.
  - The context concerns the 2025 annual financial results. I therefore use calendar 2025 as the target period.
  - The wording distinguishes a firm allegation about presentation from a tentative explanation about inference costs. Neither is treated as a conditional forecast.
  - The financial basis is company_reported because the allegation concerns the company's expense categories in the financial figures discussed in the surrounding passage.
  - A large marketing expense or a difference between two reported spending totals does not by itself establish reclassification or misleading intent.
support_condition: Accounting records or independently verified disclosures establish that inference expenses were placed in sales and marketing and that OpenAI changed or misleadingly presented its expense classifications to improve apparent performance.
contradiction_condition: A sufficiently complete accounting reconciliation establishes that the alleged inference expenses were not classified under sales and marketing and explains the apparent discrepancies without the alleged misleading change in presentation.
measurement_requirements: Reconcile calendar-2025 inference expenses, cost of revenue, and sales and marketing on the same recognition basis. Identify treatment of free users, credits, and non-cash expenses, and distinguish classification from a change in classification.
source_requirements: Prefer financial statements with accounting notes, expense ledgers, auditor findings, or documented company reconciliations. Independent reporting must establish the classification rather than repeat Zitron's inference.
