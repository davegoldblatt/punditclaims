ambiguity_flags:
  - "'Moved around numbers' could mean a reclassification between years, or simply a classification policy that flatters margins."
  - The S&M part is explicitly hedged ('I believe').
  - Booking free-user inference as S&M can be a defensible accounting choice. Whether that counts as 'making things look better' is a judgment.
