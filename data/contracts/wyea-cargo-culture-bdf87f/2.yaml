assessment_axis: historical_observation
explicit_source_elements:
  - It's very clear OpenAI moved around numbers to make things look better than they are
  - I believe that inference costs are being dumped in sales and marketing
  - $7.5 billion cost of revenue on $13.07 billion in revenue
  - $8.67 billion on inference in the first nine months of 2025
  - $5.73 billion sales and marketing
evaluator_interpretation:
  - The firm claim is that OpenAI presented its 2025 costs so that results looked better than the underlying economics. For example, it put some costs outside cost of revenue, flattering gross margin, or shifted figures between line items.
  - The 'I believe' clause about inference sitting in sales and marketing is the speaker's own hedged guess. It is not required for support. Evidence that inference costs were booked in S&M or another non-cost-of-revenue line would count toward the firm claim. So would any other documented reclassification.
  - "Target period: OpenAI's 2025 financial statements, which are the numbers he discusses."
support_condition: A credible source documents that OpenAI classified or shifted costs, such as inference compute, outside cost of revenue in a way that makes its 2025 margins or losses look better. Sources could be a public filing, auditor notes, a restatement, an OpenAI statement, or reputable reporting on its accounting.
contradiction_condition: A credible source shows OpenAI's 2025 inference compute was fully in cost of revenue under consistent policies. Or a source explains the gap between the roughly $8.67B nine-month Azure inference figure and the $7.5B full-year cost of revenue without any flattering reclassification.
measurement_requirements: OpenAI's 2025 income statement with notes on cost classification (cost of revenue, R&D, S&M), or reliable reporting on where inference compute for paid and free users is booked.
source_requirements: Filings (for example a public S-1), audited statements with notes, company statements, or reputable reporting. Analyst guesses are context only. The speaker's own reporting cannot be used as proof he was right.
metric_scope:
  company: OpenAI
  metric: classification of inference compute costs (cost of revenue vs. sales and marketing)
  currency: USD
