explicit_source_elements:
  - the NVIDIA Bubble has popped
  - Jensen Huang is done
  - no longer the circular financing titan
  - anybody depending on its theoretical backing
evaluator_interpretation:
  - The testable plain reading is that Huang's leadership has ended and NVIDIA has ceased being an available financial backer for dependent companies.
  - Huang's departure alone does not establish the financing claim. 'Done' does not supply a separate commitment that he will never return.
  - For this ongoing institutional state, use November 16, the latest complete day before publication on which leadership and financing developments could be publicly reported.
  - No numerical definition of a popped bubble, financing decline, or accounting basis is supplied.
support_condition: Records establish Huang's departure and an effective withdrawal of NVIDIA's financial backing from dependent companies, including new investments, guarantees and compute backstops.
contradiction_condition: Records establish continued leadership by Huang or material financial backing still available to dependent companies during the target period.
measurement_requirements: Distinguish existing obligations, proposed arrangements, new binding commitments and completed funding. A share-price decline or leadership change alone does not establish withdrawal of financing.
source_requirements: Leadership filings and dated financing agreements, cancellations or company policies; reputable reporting where primary transaction records are unavailable.
