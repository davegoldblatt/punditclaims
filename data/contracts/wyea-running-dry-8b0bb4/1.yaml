early_resolution_rule: A documented default, distressed restructuring or collapse attributable to unmet commitments after the funding condition occurs can resolve the affected company's prediction. Public-market access before funding exhaustion exempts that company rather than contradicting the prediction.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Venture capital may mean conventional VC or private financing more broadly.
  - Public markets could include debt markets as well as an IPO.
  - Crushed has no specified severity.
  - Trillion-plus could describe combined or individual commitments.
  - The commitments' accounting basis, enforceability and payment periods are unspecified.
  - No deadline is stated.
retrospective_or_prospective: retrospective
