assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI and Anthropic
  - need endless venture capital
  - when that runs out
  - unless they can make it to the public markets
  - crushed under their trillion-plus in commitments
evaluator_interpretation:
  - Endless is read as continuing dependence on outside funding, not a literal infinite sum.
  - For each company, the condition requires venture funding to become unavailable before it obtains public-market funding.
  - Crushed means default, insolvency, a distressed restructuring or forced contraction because obligations cannot be met.
  - The trillion-plus wording is treated as a combined commitments premise; the wording does not clearly assign that amount to each company.
  - USD is inferred from the US companies and financial context. No accounting basis or commitment schedule is supplied.
support_condition: For both companies, financing exhaustion before public-market access is documented, followed by inability to meet commitments and resulting default, distressed restructuring or collapse.
contradiction_condition: After the condition occurs, a company demonstrably meets or sustainably discharges its commitments without public-market funding or financial distress. Different outcomes for the two companies require separate treatment.
measurement_requirements: Company-specific funding availability, liquidity, binding payment schedules, public-market proceeds and default or restructuring records. Distinguish outstanding obligations from announced investment ambitions.
source_requirements: Company filings and financing disclosures, executed commitment records, court records and credible reporting where private-company records are unavailable.
metric_scope:
  company: OpenAI and Anthropic
  metric: Combined outstanding commitments
  currency: USD
  units: trillions
