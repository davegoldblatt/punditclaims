explicit_source_elements:
  - Generative AI systems like DALL-E and ChatGPT
  - have been trained
  - on copyrighted materials
evaluator_interpretation:
  - This concerns training completed before publication, including earlier versions of the named product families.
  - The post specifies no beginning date for that historical training, so the target period has an open start and ends on December 29, 2023.
  - Copyrighted materials includes licensed material. The claim does not require that the training was unauthorized or unlawful.
  - Both named product families must be covered; evidence about an unrelated model alone would not suffice.
support_condition: Company disclosures or reliable training records establish that copyrighted material was included in training DALL-E and models serving ChatGPT before the post.
contradiction_condition: Reliable records establish that a named product family was trained entirely without copyrighted material, for example solely on public-domain or otherwise unprotected data.
measurement_requirements: Evidence of actual training-data use, rather than merely a prospective licensing agreement or retrieval of material during a conversation.
source_requirements: Prefer company admissions, training disclosures, and licensing records. Distinguish established facts from allegations in complaints.
