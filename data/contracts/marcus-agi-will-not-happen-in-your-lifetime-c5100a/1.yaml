  - it’s mostly going to large language models
  - for you, like for me, that just seems like an approximation to intelligence
evaluator_interpretation:
  - The checkable assertion is that large language models received more than half of AI funding or spending. The comments about intelligence and frustration express opinions.
  - The ordinary denominator is money directed toward AI generally, including internal research spending and public funding, rather than only venture investment or generative AI investment.
  - I use October–December 2022, the latest completed quarter before the post, to operationalize the ongoing allocation claim. Marcus supplied no reporting period.
  - This is an industry allocation claim, not a claim about an individual company's accounts, so metric_scope is null.
support_condition: Comparable allocation records for the target period show that more than half of money directed toward AI went to large language models.
contradiction_condition: Comparable allocation records for the target period show that half or less went to large language models.
measurement_requirements: A defined funding or spending denominator, consistent geographic coverage, an LLM classification, and avoidance of double-counting investment proceeds and subsequent spending.
source_requirements: Broad investment datasets plus corporate and public research spending records. Individual funding announcements cannot establish the aggregate share.
