explicit_source_elements:
  - most of the money right now
  - it’s mostly going to large language models
  - for you, like for me, that just seems like
  - an approximation to intelligence, not the real thing
evaluator_interpretation:
  - In context, the money is funding directed toward developing general intelligence. The denominator is not all commercial AI investment.
  - The ordinary reading of 'most' is more than half of that funding, measured by monetary value rather than the number of projects.
  - Use January 2023 through January 21, the latest month-to-date period observable before publication, to examine current funding allocations. This is an evaluator-selected reporting window; Marcus supplied no accounting period. Existing allocations matter, not just transactions announced during those days.
  - The claim does not identify a company, currency, accounting basis, or whether 'money' means funding commitments or actual expenditure. Those measures must not be combined.
  - The description of LLMs as an approximation and a frustrating distraction is explicitly a personal judgment. The assessment concerns the separable funding-share assertion.
support_condition: Comparable records show that more than half of funding directed toward general-intelligence development in the target period was allocated to large language models.
contradiction_condition: Comparable records show that no more than half of funding directed toward general-intelligence development in the target period was allocated to large language models.
measurement_requirements: Identify the relevant general-intelligence research portfolio and its total funding, then identify its LLM allocation on the same monetary and temporal basis. Separate commitments, financing received, and expenditure. Account for mixed-purpose laboratories without assigning their entire budgets to LLMs.
source_requirements: Funding disclosures, research budgets, or a documented investment dataset covering the relevant portfolio. Individual funding rounds and totals for all commercial AI cannot establish this share.
