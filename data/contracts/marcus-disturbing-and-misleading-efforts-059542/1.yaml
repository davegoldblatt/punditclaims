explicit_source_elements:
  - has been and continues to be
  - California-registered 501(3)(c) nonprofit
  - pledged not to profits, but to humanity
  - tax-exempt status on the basis of their promise to deploy AI safely
evaluator_interpretation:
  - The surrounding discussion of the nonprofit board identifies OpenAI, Inc., the nonprofit parent, as the subject.
  - Read '501(3)(c)' as an inadvertent transposition of 501(c)(3).
  - The ordinary reading is that OpenAI held charitable tax-exempt status while its declared charitable mission included safe AI benefiting humanity. This does not assert that the IRS certified its products as safe.
  - For the ongoing state, examine the latest publicly reported annual period before the post, calendar 2022, and its continuation through May 30, 2024.
  - California registration does not mean California incorporation.
support_condition: Records establish that OpenAI, Inc. remained a California-registered, federally tax-exempt nonprofit through the post date, with safe AI benefiting humanity included in its declared exempt-purpose activities.
contradiction_condition: Records establish that the nonprofit lacked the claimed registration or exemption at the relevant time, or that the claimed safety and public-benefit purpose was absent from its exempt-purpose filings.
measurement_requirements: Identify the legal entity and distinguish registration, incorporation, federal exemption, and statements of charitable purpose.
source_requirements: Prefer the IRS determination, California registration records, and the nonprofit's tax filings. A mission statement establishes a declared purpose, not an IRS safety certification.
