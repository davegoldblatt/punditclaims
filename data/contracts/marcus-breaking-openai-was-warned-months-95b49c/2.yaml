assessment_axis: forecast_outcome
explicit_source_elements:
  - if OpenAI gets sued for harms caused by their so-called rogue agents
  - this headline will be Exhibit One
  - Punitive damages will be high.
evaluator_interpretation:
  - The condition means damages litigation alleging harm from autonomous agents of the kind discussed in the post. Injunction-only cases do not qualify.
  - A complaint can establish that OpenAI has been sued without establishing that its agents actually caused the alleged harm.
  - "I read 'Exhibit One' figuratively: the NYT report's account of ignored warnings becomes central evidence of responsibility or culpability. Literal exhibit numbering is unnecessary."
  - I read 'high' as a substantial punitive award in the context of the case, rather than a nominal award. Marcus supplied no dollar threshold.
  - A damages complaint with a separate claim concerning agent cyberattacks qualifies even if its general damages request does not allocate relief among claims. This reading makes Montana's complaint qualifying.
  - Filing allegations, requesting damages, or citing a newspaper report does not itself establish the predicted litigation outcome.
support_condition: A completed qualifying damages proceeding establishes that the NYT report's account of ignored warnings played a central evidentiary role and that OpenAI owes substantial punitive damages.
contradiction_condition: A completed qualifying proceeding establishes that the ignored-warning account was peripheral, excluded, or rejected and that punitive damages were denied, zero, or nominal after the relevant liability and remedy questions were resolved. If one predicted component holds and the other fails, assess the result as mixed. Injunction-only litigation, pending proceedings, and an undisclosed settlement do not establish failure.
measurement_requirements: Distinguish punitive damages from compensatory damages, statutory penalties, restitution, fees, and settlement payments. Assess evidentiary centrality from the litigation record. A borderline award cannot settle 'high' without imposing a threshold Marcus did not provide.
source_requirements: Filed complaints establish the condition. Evidentiary rulings, trial records, findings, verdicts, and judgments establish outcomes. Check subsequent modifications and appeals before treating an award as conclusive.
