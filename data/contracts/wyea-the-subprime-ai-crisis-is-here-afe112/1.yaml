assessment_axis: historical_observation
explicit_source_elements:
  - These subscriptions
  - for the most part mask
  - tokens that you are actually burning
  - in every single case that I’ve found
  - always in excess of the subscription cost
evaluator_interpretation:
  - The visibility assertion concerns whether ordinary subscription interfaces reveal actual token consumption.
  - The cost assertion is limited to cases the speaker examined, not every subscriber. The case set is not fully enumerated.
  - Use March 1–30, 2026, the observable portion of the subscription month immediately before publication.
  - In the surrounding discussion of cash losses, token cost ordinarily means the provider’s expense. Retail API-equivalent value is an alternative interpretation and must be reported separately.
  - Maximum permitted usage is distinct from actual consumption over a billing period.
support_condition: Representative subscription interfaces obscure actual token counts, and matched usage and expense records show costs exceeding fees in every identified examined case.
contradiction_condition: Representative interfaces disclose actual token consumption, or a documented case within the speaker’s examined set has matched token expense no greater than its subscription fee.
measurement_requirements: Identify the examined plans and billing periods; obtain actual input, output and cached-token usage, applicable provider costs, subscription fees and interface disclosures.
source_requirements: Prefer dated interface documentation, usage logs, invoices and provider cost records. API list-price calculations alone cannot establish provider expense.
