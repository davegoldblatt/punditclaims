  - at the scale necessary to support its existence
  - not saying ... it hasn't got any product-market fit
  - what they are not, at this time, is essential
evaluator_interpretation:
  - He concedes some product-market fit exists. The plain reading is that, at the time, paying demand for generative AI was too small to cover the cost of building and running it, so the leading firms depended on outside capital.
  - "Period: no period is named beyond 'at this time'. Calendar 2024 is used because the most recent public estimates before the post (July 2024) covered that year."
support_condition: 2024 evidence shows generative AI revenue well below the cost of building and running the models, with leading firms losing large sums and an industry-wide gap between spending and revenue.
contradiction_condition: 2024 evidence shows generative AI revenue covering its costs at leading firms, or industry revenue in line with spending.
measurement_requirements: Revenue versus costs at leading generative AI firms in 2024; industry-level comparisons of AI spending and AI revenue in 2024.
source_requirements: Reputable reports of company figures and credible industry analyses.
