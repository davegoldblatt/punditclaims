evaluator_interpretation:
  - "'Watered down' ordinarily means that amendments materially reduced at least some proposed obligations, oversight, or enforcement powers compared with an earlier version."
  - The comparison covers the bill's development from introduction through the post date.
  - "'Tiny step' expresses the speaker's judgment about adequacy; it is not treated as a measurable threshold."
  - The claim does not require every amendment to weaken the bill or all enforcement to disappear.
support_condition: Dated amendments adopted before August 23, 2024 materially removed or reduced an earlier obligation, oversight mechanism, or enforcement power.
contradiction_condition: The amendment record shows no material reduction of that kind, or the cited reductions occurred only after publication.
measurement_requirements: Compare provisions and amendment dates, distinguishing reductions from retained or strengthened protections.
source_requirements: Official bill versions, committee records, or a dated amendment explanation from the bill's author.
