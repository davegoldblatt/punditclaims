assessment_axis: historical_observation
explicit_source_elements:
  - His business is burning cash
  - investors don’t like the nonprofit
evaluator_interpretation:
  - His business means OpenAI's commercial business.
  - Burning cash means the business consumes more cash than it generates, excluding new financing. Accounting losses alone do not establish this.
  - Investors don’t like the nonprofit means material investors wanted changes to the existing nonprofit-controlled investment structure. It does not require every investor to oppose any continuing nonprofit role.
  - Use calendar 2024, the latest completed annual reporting period before the post, for the financial observation and contemporaneous evidence of investor preferences.
  - Marcus supplies no accounting basis or identifiable source for the cash-burn assertion. The nearby reference to reported financing terms does not establish the basis of the cash figure.
support_condition: Evidence establishes cash consumption by OpenAI's commercial business during the target period on an identifiable basis consistent with the claim, and statements or financing terms establish material investor dissatisfaction with the existing structure.
contradiction_condition: Comparable evidence establishes that OpenAI generated rather than consumed cash during the target period, or direct evidence establishes that the claimed investor objection to the existing structure was mistaken.
measurement_requirements: Distinguish cash consumption from operating losses, net losses, gross spending, financing proceeds and projections. Assess investor preferences through statements or investment conditions, without treating continued investment as proof of satisfaction with governance.
source_requirements: Prefer company financial disclosures and investor documents. Reporting based on private financial records may provide corroboration, with its limitations identified. An unknown accounting basis prevents a supported or contradicted money verdict under the supplied rules.
