explicit_source_elements:
  - his company (Meta)
  - how poor
  - making LLMs that don’t hallucinate
evaluator_interpretation:
  - The ordinary reading is that Meta’s available LLMs remained materially unreliable at producing factual answers.
  - The claim does not expressly say Meta was worse than competing developers.
  - "The target is the latest public model generation and its evaluations before the post: the July–August 2023 release period."
  - Hallucination means fabricated or factually unsupported output. A combined truthfulness-and-informativeness score is relevant evidence, but its complement is not a hallucination rate.
support_condition: Evaluations of Meta’s then-current LLMs show substantial factual reliability limitations, corroborated by documented hallucination behavior or explicit technical limitations.
contradiction_condition: Broad evaluations of those models demonstrate consistently reliable factual generation with only rare hallucinations under representative use.
measurement_requirements: Identify model versions, evaluation tasks and scoring methods. Distinguish factual generation from recognition of factual answers and from stylistic preference.
source_requirements: Prefer the original model report and reproducible contemporary evaluations; include favorable comparative results.
