  - even in things that they mostly get right
  - to do things right every time
evaluator_interpretation:
  - Assess the normalized reliability claim, not the surrounding claims about marketing or its motives.
  - The plain reading is that usually successful LLM workflows still produce occasional errors. It does not mean that every conceivable narrow task must fail.
  - "For this ongoing observation, use the latest complete calendar quarter before publication: April through June 2026. Zitron supplied no reporting period."
support_condition: Repeated evaluations show that LLMs sometimes fail tasks they can ordinarily complete successfully.
contradiction_condition: Representative repeated evaluations establish dependable, error-free performance across the workflows covered by the claim. An isolated perfect benchmark score is insufficient.
measurement_requirements: Distinguish average task success from consistent success across repeated attempts. Identify models, tasks, evaluation conditions, and residual errors.
source_requirements: Primary evaluation reports with documented methods; preferably independent evaluations.
