explicit_source_elements:
  - I don’t see much evidence
  - custom integrations that actually matter
  - any real examples of businesses “doing stuff with Claude”
  - other than making announcements about vague partnerships
evaluator_interpretation:
  - Assess the implied public-evidence claim, not whether Zitron personally encountered particular sources.
  - The ordinary reading of businesses 'doing stuff' includes a named business using Claude in a specific operational workflow.
  - Use January through March 2026, the latest completed calendar quarter before the post, for the ongoing state of documented business use.
  - A detailed deployment disclosure can be substantive evidence even when published alongside a partnership announcement. It need not independently establish profitability or large productivity gains.
support_condition: Evidence establishes that the relevant public examples were merely prospective or vague partnership announcements, without documented operational business use.
contradiction_condition: A dated, credible disclosure documents concrete operational Claude use by a named business during the target period.
measurement_requirements: Identify the customer, deployed application and actual business task. Distinguish existing use from future plans and projected benefits.
source_requirements: Prefer customer disclosures corroborated by implementation details. Vendor case studies require a limitation for promotional selection and lack of independent verification.
