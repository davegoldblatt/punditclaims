assessment_axis: historical_observation
explicit_source_elements:
  - When I point to the positive uses of Generative AI
  - I invariably point to
  - kind of valuable autocomplete for coding
evaluator_interpretation:
  - This is a claim about Marcus's public communication, not an independent claim that coding tools improve productivity.
  - The plain reading is that his discussions identifying positive generative AI uses consistently include coding assistance as useful autocomplete.
  - The relevant period is his public record through publication. This retrospective description of a speaking habit has no stated starting date and is not tied to a reporting quarter.
  - A discussion is assessed in context, rather than treating every isolated sentence as a separate occasion. Equivalent descriptions of coding assistance can count without the exact word 'autocomplete'.
  - "'Kind of' qualifies the description of the tool; it does not remove the checkable commitment in 'invariably'."
support_condition: A sufficiently comprehensive, independently documented record of his relevant public discussions consistently includes useful coding autocomplete.
contradiction_condition: A complete, dated public discussion before publication identifies positive generative AI uses but omits coding assistance, with enough context to rule out editorial omission.
measurement_requirements: Identify relevant discussions and inspect their complete context. Distinguish praise of generative AI from praise of other AI systems. A few matching examples cannot establish 'invariably'.
source_requirements: Independent reporting, recordings or externally published interview transcripts documenting what Marcus said. His own writing cannot serve as evidence that the self-description is correct.
