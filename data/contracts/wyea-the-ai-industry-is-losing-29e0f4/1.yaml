explicit_source_elements:
  - Anyone investing in data centers
  - building speculative capacity
  - demand that does not exist outside of Anthropic and OpenAI
evaluator_interpretation:
  - Read data centers as AI data centers, following the surrounding discussion.
  - Read the firm absence claim as denying substantial identifiable demand independent of OpenAI and Anthropic. Trivial demonstrations would not suffice as counterexamples.
  - A signed, substantial capacity agreement for another company's own AI operations demonstrates demand; it does not prove every investment will earn an adequate return.
  - Exclude purchases made by intermediaries specifically for the two labs. Include hyperscalers' independent own-use demand.
  - Use January through March 2026, the latest completed calendar quarter with public reporting available before the post.
  - The context acknowledges Meta and hyperscalers, creating tension with the categorical sentence. A narrower claim about demand sufficient to justify the entire buildout is not equivalent to this absence claim.
support_condition: Comprehensive customer and utilization evidence shows no substantial AI-capacity demand independent of OpenAI and Anthropic in the target period.
contradiction_condition: A dated, substantial AI-capacity contract or deployment identifies an independent customer using capacity for purposes other than serving the two labs.
measurement_requirements: Identify the ultimate customer, AI use and scale. Distinguish binding or dedicated capacity from optional capacity and distinguish contracted demand from delivered utilization.
source_requirements: Dated contracts, filings, provider disclosures or customer disclosures identifying the buyer and purpose.
