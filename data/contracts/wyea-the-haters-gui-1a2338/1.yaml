assessment_axis: historical_observation
explicit_source_elements:
  - Agentforce is a god damn chatbot platform
  - it's for launching chatbots
  - plug into APIs that allow them to access other information
  - neither autonomous nor "agents" by any reasonable definition
evaluator_interpretation:
  - The testable core is the categorical restriction to chat and information retrieval, together with the denial of meaningful autonomous action.
  - The plain reading of an agent includes software that selects and executes configured actions toward a task without a human directing every step.
  - Bounded permissions, initial configuration and human escalation do not themselves disqualify an agent. This reading does not require general intelligence, perfect reliability or replacing an entire job.
  - Use April–June 2025, the latest completed product-reporting quarter before the post, to assess already documented capabilities. Do not count later product additions.
support_condition: The available Agentforce product is limited to conversational responses and retrieval, with humans required to select and initiate each consequential action.
contradiction_condition: Contemporaneous technical documentation or demonstrations establish that available Agentforce configurations can orchestrate and execute actions beyond retrieval, including programmatic operation outside a chat interface.
measurement_requirements: Separate conversational interfaces from action capabilities, and autonomy from task success rates. Distinguish shipped functionality from announced future features.
source_requirements: Dated technical documentation, reproducible demonstrations or product-specific evaluations. Marketing labels alone are insufficient.
