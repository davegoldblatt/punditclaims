explicit_source_elements:
  - Microsoft’s Mustafa Suleyman
  - just tried to redefine superintelligence down
  - AI that is smarter than the smartest humans
  - models capable of delivering product value for millions of enterprises
evaluator_interpretation:
  - The claim concerns Suleyman’s public framing in early April 2026.
  - The ordinary reading of 'tried to redefine' includes presenting enterprise usefulness as what superintelligence means. It does not require a formal change to Microsoft’s technical definitions.
  - Describing enterprise usefulness only as an application, while expressly retaining the superhuman-capability requirement, would not establish the claimed redefinition.
support_condition: An attributable statement presents enterprise product value as the meaning or central criterion of superintelligence, without requiring performance beyond the smartest humans.
contradiction_condition: The original statement expressly preserves the superhuman-capability requirement and presents enterprise value only as a separate application or business objective.
measurement_requirements: Examine the attributable statement and its surrounding context.
source_requirements: Prefer the original interview, recording, transcript, or company statement. Marcus’s description cannot establish its own accuracy.
