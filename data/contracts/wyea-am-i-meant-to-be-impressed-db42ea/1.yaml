assessment_axis: historical_observation
explicit_source_elements:
  - most AI revenues out of Google, Microsoft and Amazon
  - two companies that lose billions of dollars a year
  - have no path to profitability
  - only able to keep paying these companies because the companies (and investors) keep feeding them money
evaluator_interpretation:
  - The two companies are OpenAI and Anthropic.
  - Most means more than 50% of realized AI revenue attributable to these two customers. The main reading combines the three hyperscalers; company-level shares should also be reported.
  - Use January–March 2026, the latest completed reporting quarter before the post, for the ongoing revenue and financing assertions. Annual losses require separate annual records and cannot be established by annualizing one quarter.
  - Read no path to profitability as no economically credible route under the business economics then prevailing, rather than a claim that profitability is impossible forever.
  - Treat the revenue concentration assertion as an estimate inferred from the surrounding discussion of reported financial figures. No GAAP or other formal accounting basis is specified.
  - Funding dependence requires evidence of a cash shortfall after operating receipts and available cash, rather than merely evidence that fundraising occurred.
support_condition: Comparable records establish that the two labs generated more than half of the named hyperscalers' realized AI revenue, that both incurred multibillion-dollar annual losses, and that their operating economics required continuing outside financing without a credible route to profitability.
contradiction_condition: Comparable records establish a combined revenue share of 50% or less, or establish that a lab could sustainably meet its obligations without continuing outside financing. A substantiated route to profitability would contradict that component.
measurement_requirements: Customer revenue and total AI revenue must cover the same quarter and accounting perimeter. Separate realized revenue from backlog and run rate. Separate net losses, operating losses and cash burn; reconcile cash balances, operating cash flows and payment obligations.
source_requirements: Prefer hyperscaler customer disclosures and lab financial statements. Clearly identified reporting or estimates may supplement missing private-company records, with their assumptions disclosed.
