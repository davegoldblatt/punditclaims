assessment_axis: forecast_outcome
explicit_source_elements:
  - AI might replace average people in some tasks soon
  - replacing the best humans
  - in a few years
  - Not going to happen
  - match the originality of top human scientists
evaluator_interpretation:
  - Grade the firm negative forecast about leading humans; the possibility concerning average people is hedged and is not a separate promised outcome.
  - The immediate context makes sustained original scientific work by leading scientists the principal test.
  - Replacement means reliable autonomous performance of the substantive research role at leading-human quality, rather than assistance, a single discovery, or success on a bounded benchmark.
  - The surrounding discussion explicitly refers to 2027 and 2028. Use December 31, 2028 as the latest contextual deadline; this is an interpretation, not an exact date supplied by Marcus.
support_condition: At the deadline, credible assessments of frontier capabilities and actual deployments establish that AI still cannot reliably substitute for leading scientists in sustained original research.
contradiction_condition: By the deadline, independently verified deployment or a sustained, reproducible demonstration establishes that AI can autonomously substitute for leading scientists in substantive original research.
measurement_requirements: Assess originality, scientific validity, reproducibility, sustained performance, and the extent of human intellectual intervention. Competition results or isolated generated papers are insufficient.
source_requirements: Prefer original research, independent expert evaluations, and deployment records documenting what AI and humans each contributed.
metric_scope: null
original_horizon: in a few years
horizon_interval:
  start: 2025-03-05
  end: 2028-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An independently verified, dated deployment or sustained demonstration meeting the replacement criterion would conclusively contradict the negative forecast before the deadline. Continued non-replacement before the deadline cannot establish support.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - A few years is approximate; the contextual endpoint is interpreted as the end of 2028.
  - Best humans does not identify a profession, population, or performance percentile.
  - Replacement could mean capability substitution or actual employment displacement.
  - The scientific-work scope is inferred from the immediately preceding discussion of top scientists.
retrospective_or_prospective: prospective
