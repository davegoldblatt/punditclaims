explicit_source_elements:
  - poor grasp of reality
  - not a reliable interpreter of the world
  - still stand
  - GPT-3 and its current batch of successors
evaluator_interpretation:
  - "The plain reading concerns observable reliability: these models still produced substantial factual or reasoning errors and could not generally be trusted to interpret situations correctly without checking."
  - This does not assert that the models lacked all useful knowledge or failed every task. It does not require a philosophical judgment about comprehension.
  - For the ongoing state, I use 2022 through June 7 as the latest public evaluation period. Earlier tests are historical context.
support_condition: Contemporary evaluations of GPT-3 and successors document substantial factual fabrication or reasoning failures under clearly described conditions.
contradiction_condition: Broad, reproducible evaluations establish dependable factual and everyday reasoning performance across varied settings, with the alleged failures no longer a substantive limitation.
measurement_requirements: Use factuality, hallucination and reasoning evaluations with identified models and prompting conditions. Do not equate a single benchmark score with universal competence.
source_requirements: Primary model evaluations and independent measurements; no reliance on the speaker's own assessments.
