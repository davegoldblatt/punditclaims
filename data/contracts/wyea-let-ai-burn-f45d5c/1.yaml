explicit_source_elements:
  - AI GPUs
  - useful for generative AI
  - not much else
evaluator_interpretation:
  - AI GPUs means data-center GPUs used for AI workloads, including A100, H100, and B200-class hardware.
  - The ordinary reading is that these GPUs have few substantial useful applications outside generative AI. It does not require non-generative workloads to dominate GPU sales or utilization.
  - For this ongoing capability claim, I use April through June 2026, the latest completed quarter before publication, as the reporting window.
  - Demonstrated scientific computation counts as useful even when another GPU offers better purchase-price performance. Merely theoretical compatibility is insufficient.
support_condition: Representative evidence establishes that useful applications outside generative AI are narrow or marginal on AI data-center GPUs.
contradiction_condition: Documented working applications establish substantial usefulness across several non-generative fields on AI data-center GPUs.
measurement_requirements: Identify the GPU model, distinguish physical or numerical simulation from generative models, and establish actual execution or measured performance.
source_requirements: Primary research, reproducible benchmarks, or operator documentation. Identify vendor interests and distinguish preprints from peer-reviewed research.
