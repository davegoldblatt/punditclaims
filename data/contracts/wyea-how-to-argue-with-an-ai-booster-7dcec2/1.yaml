explicit_source_elements:
  - not even good, reliable software
  - inconsistent and unreliable by definition
  - inefficient by design
  - financially ruinous
  - ADDS to the cognitive load
  - requiring them to be ever-vigilant
evaluator_interpretation:
  - Treat 'death of the art of technology' and 'good' as evaluative rhetoric; assess the factual assertions about reliability, efficiency, financial harm and user workload.
  - Read added cognitive load as a net increase relative to doing comparable work without generative AI, including checking and correction.
  - Read inefficiency as resources required per acceptable completed task, not merely the presence of computing costs.
  - For this ongoing observation with no stated period, use the latest completed calendar quarter before publication, April–June 2025. Earlier or insufficiently dated measurements are context only.
  - The claim does not identify whose finances are ruined, a monetary measure, or an accounting basis.
support_condition: Representative evaluations show unreliable task completion, inefficient resource use and increased total user workload, while comparable financial records establish the asserted financial harm for a defined population.
contradiction_condition: Comparable evaluations show dependable useful performance, efficient task completion or reduced total workload sufficient to refute the corresponding generalizations; financial contradiction requires a defined company population and matching accounting measure.
measurement_requirements: Measure repeatability and error rates, resources per acceptable result, and total cognitive workload including verification. Financial tests require a specified entity, metric and accounting basis.
source_requirements: Primary reliability evaluations, controlled workload studies, resource measurements and matching financial disclosures. Do not substitute task duration for cognitive load or company losses for harm to users.
