explicit_source_elements:
  - An entire industry
  - will collapse
  - because people aren’t getting it
evaluator_interpretation:
  - The surrounding discussion identifies the industry as generative AI.
  - The ordinary reading of collapse is a broad, sustained breakdown in the industry's commercial activity and financing, rather than isolated failures or a temporary stock-market decline.
  - The predicted cause is failure to understand outlier limitations.
  - No deadline is stated. Continued activity at the evaluation date cannot permanently contradict an undated prediction.
support_condition: A broad and sustained collapse of the generative-AI industry occurs, with credible evidence that misunderstood outlier limitations materially caused it.
contradiction_condition: A qualifying collapse occurs and strong causal evidence establishes a different explanation while ruling out the claimed mechanism. Mere survival for a finite period does not contradict the undated forecast.
measurement_requirements: Industry-wide evidence covering revenue, financing, closures and operating activity, plus evidence distinguishing technical limitations from financial or macroeconomic causes.
source_requirements: Primary business records and independent industry measurements, supplemented by credible causal reporting or research.
