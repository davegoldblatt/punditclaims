target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only after a dated, industry-wide collapse is established and its causal record either supports or rules out misunderstood outlier limitations as a material cause.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
