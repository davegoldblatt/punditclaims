assessment_axis: historical_observation
explicit_source_elements:
  - Sometimes that works as a fine substitute
  - sometimes it doesn’t
  - You can never know in advance which
evaluator_interpretation:
  - The claim concerns practical substitution for human task performance, not whether LLMs have human cognition.
  - The plain reading is that users cannot dependably distinguish successful from unsuccessful substitutions before the particular attempt. This does not require philosophical certainty, but a weak predictive association is insufficient to contradict it.
  - The observation concerns capabilities at publication. With no specified reporting interval for research results, I use the current reporting year, 2025, restricted to findings available by August 12. Earlier studies provide context.
  - A task succeeds when it meets independently specified requirements. Answer checking after execution does not count as advance prediction.
support_condition: Evaluations show both successful and unsuccessful task performance. Supporting the additional categorical claim requires evidence that dependable advance identification is unavailable across the claimed scope; failure of a few prediction methods alone is insufficient.
contradiction_condition: A method validated on previously unseen cases dependably identifies successful or unsuccessful substitutions before execution within a clearly defined task class. Merely predicting average performance, or checking completed answers, is insufficient.
measurement_requirements: Separate task success from prediction accuracy. Predictions must precede the tested attempt, use held-out cases, and report error rates and the proportion of cases covered. Examine transfer to unfamiliar tasks and whether benchmarks represent substitution for human work.
source_requirements: Primary empirical studies with accessible methods and results. Distinguish independent research from model developers' own findings.
