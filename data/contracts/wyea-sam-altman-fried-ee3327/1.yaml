explicit_source_elements:
  - impossibly unreliable
  - burns far more money than it makes
  - OpenAI made around $1.6 billion in revenue in 2023
  - competitor Anthropic
evaluator_interpretation:
  - Read the reliability assertion as saying factual outputs require substantial checking because material errors are common, rather than as a literal claim that every output is wrong.
  - Read the financial assertion as total development and operating costs substantially exceeding realized revenue across generative AI suppliers.
  - Use calendar 2023, the latest completed year and the year explicitly used in the surrounding financial comparison.
  - The surrounding passage relies on press estimates, so the financial accounting basis is estimate.
  - Results for OpenAI or Anthropic alone cannot establish a sector-wide result.
support_condition: Representative evaluations show widespread material unreliability, and comparable 2023 financial evidence shows aggregate generative AI supplier costs substantially exceeding realized revenue.
contradiction_condition: Representative evidence establishes dependable performance across the claimed factual uses, or comparable sector-wide financial evidence shows costs did not substantially exceed revenue.
measurement_requirements: Compare realized revenue and costs for the same companies and calendar year. Distinguish total losses, operating losses, cash burn, gross margins, and annualized revenue. Reliability tests must identify models, tasks, configurations, and error definitions.
source_requirements: Prefer financial disclosures and original evaluations. Press estimates may supply financial context when private-company statements are unavailable, but must retain their stated scope and basis.
