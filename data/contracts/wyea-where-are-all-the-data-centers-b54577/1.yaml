assessment_axis: historical_observation
explicit_source_elements:
  - a larger problem in the industry
  - really difficult to build data centers
  - for the most part, they’re not being fully built
evaluator_interpretation:
  - The ordinary reading is that construction difficulties are widespread and most new data-center projects are failing to reach their intended full operational build-out.
  - I interpret 'for the most part' as more than half of projects by count. The speaker does not specify a geography, project cohort, or capacity-weighted measure.
  - For this ongoing observation, I use January–March 2026, the latest completed calendar quarter that public evidence could describe before the May 12 post.
  - Full completion means delivery of the project's announced operational scope. Completing one building does not establish completion of a larger campus.
  - To distinguish construction failure from normal construction in progress, the completion test requires original delivery schedules. Future phases that were not yet due do not establish failure.
support_condition: Representative project-level records for the target period show widespread construction obstacles and more than half of projects due for full delivery remaining incomplete, stalled, or abandoned.
contradiction_condition: Comparable records show that at least half of projects due for full delivery reached their intended operational scope, contradicting the majority assertion. Evidence that construction obstacles were uncommon would separately contradict the difficulty assertion.
measurement_requirements: A defined project population, original delivery dates, announced full scope, and verified completion status. Report project counts separately from megawatts and distinguish operating phases from completed campuses.
source_requirements: Representative construction tracking supported by permits, commissioning records, operator disclosures, or independently verified project observations. Individual examples cannot establish an industry-wide majority.
