ambiguity_flags:
  - The observation supplies no reporting period; Q1 2026 is the evaluator's choice.
  - Geographic scope and the relevant population of projects are unspecified.
  - A project could mean a building, delivery phase, or entire campus.
  - Full completion could mean physical completion or operational commissioning.
  - The words do not distinguish projects overdue for completion from projects still within their planned construction schedules.
  - Project count and capacity-weighted completion could produce different results.
