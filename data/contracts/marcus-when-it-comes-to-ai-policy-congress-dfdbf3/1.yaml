assessment_axis: historical_observation
explicit_source_elements:
  - So-called leaderboards
  - no longer dominated
  - any one country
evaluator_interpretation:
  - The ordinary reading is that leading positions on major generative-AI leaderboards are no longer overwhelmingly concentrated in one country. Merely having entrants from several countries is insufficient.
  - Use leaderboard records published during May 1–14, 2025, the current partial month before the post.
  - Assess both the distribution of leading positions and performance gaps. Attribute models to their developing companies, using the parent company's country where necessary.
support_condition: Representative contemporaneous leaderboards show leading positions distributed across countries without a clear, overwhelming national concentration.
contradiction_condition: Representative contemporaneous leaderboards show one country's developers overwhelmingly occupying the leading positions, with the conclusion robust to model variants and ranking uncertainty.
measurement_requirements: Dated rankings, model developers, country attribution, score uncertainty, and coverage of more than one major leaderboard. Distinguish leaderboard categories from independent evaluations.
source_requirements: Prefer archived records and announcements from benchmark operators. Current rankings cannot establish May 2025 standings.
