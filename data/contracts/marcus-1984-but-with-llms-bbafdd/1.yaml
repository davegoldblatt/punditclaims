explicit_source_elements:
  - pretty hard to make an LLM that stands out from the pack
  - if you use the same data as everyone else
  - short of using some fine-tuning tricks
  - that likely reduce accuracy
evaluator_interpretation:
  - "This is a general claim about how hard something is. It has two built-in hedges: 'pretty hard' and fine-tuning that 'likely' reduces accuracy."
  - It sets aside fine-tuning, which is the main known way to shift a model's views. It names no measure of 'standing out' and no amount of accuracy lost. So no study result could clearly show it false.
support_condition: Would need evidence that models trained on shared web data cannot be made to differ much (for example in political lean) except through fine-tuning, and that such fine-tuning measurably lowers accuracy.
contradiction_condition: Would need evidence that models trained on the same data are routinely and easily made to differ sharply, by means other than fine-tuning or by fine-tuning that costs no accuracy.
measurement_requirements: null
source_requirements: Peer-reviewed or preprint comparisons of models' political lean and accuracy before and after steering.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - "'pretty hard' has no threshold"
  - "'stands out from the pack' has no measure (politics? benchmarks?)"
  - "'likely reduce accuracy' is itself hedged"
  - fine-tuning is carved out, and fine-tuning is the main known steering method
