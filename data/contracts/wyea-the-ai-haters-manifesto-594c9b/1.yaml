ambiguity_flags:
  - No workload, reasoning effort or harness specified.
  - Tokens could mean total tokens, output tokens or billed usage.
  - Sessions and completed tasks are not interchangeable.
  - Observation period inferred as the latest reporting month through publication.
  - Earlier equal pricing and subsequently reduced pricing both appear in the context.
