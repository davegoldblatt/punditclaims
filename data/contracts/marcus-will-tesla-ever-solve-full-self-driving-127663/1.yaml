assessment_axis: causal_assessment
explicit_source_elements:
  - the core issue is outliers
  - the endless list of unusual circumstances
  - like a person carrying stop sign
  - aren’t in anybody’s database
  - obvious to humans, yet baffling to current AI
evaluator_interpretation:
  - The ordinary reading is that failure to generalize to unfamiliar situations was the principal technical obstacle to full self-driving.
  - The database language is read as a claim that relevant unusual situations remain absent from training examples, not that no database contains any unusual event.
  - The human comparison requires evidence that people can reliably handle the same situations.
  - The claim concerns technology around publication; use June 1–15, 2022. Earlier studies provide context for that causal assessment.
support_condition: Representative failure analyses show unseen unusual situations are the principal barrier to full self-driving, with evidence of missing training coverage and better human handling.
contradiction_condition: Representative analyses show robust handling of unfamiliar situations, or establish that other causes account for the principal remaining barrier.
measurement_requirements: Compare outlier-related failures with other causes across representative driving conditions. Distinguish perception benchmarks from complete driving systems, rare examples from unseen examples, and difficulty from causal primacy.
source_requirements: Prefer reproducible experiments, documented failure analyses, and representative technical evaluations. Developer descriptions can establish methods or encountered cases but cannot alone establish comparative causal importance.
