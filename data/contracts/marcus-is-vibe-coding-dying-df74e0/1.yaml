evaluator_interpretation:
  - The surrounding text concerns amateur-oriented app builders. It does not establish a claim about all professional AI coding assistance.
  - In the chart context, consistent website-visit estimates are an acceptable usage proxy, provided their coverage and limitations are disclosed.
  - I use January through September 2025 to cover the claimed rise and subsequent decline, ending with the latest completed month before publication. The starting month is an interpretation because the chart's dates are absent from the supplied text.
  - Declining for months means a sustained downward trend over multiple months, not necessarily a decline every week.
support_condition: A comparable time series covering the main relevant platforms shows a steep initial rise followed by a sustained decline across multiple months before publication.
contradiction_condition: A comparable time series covering the same platforms and usage measure shows sustained growth or no material downward trend during the alleged decline.
measurement_requirements: Dated observations with consistent domains, geography, visit or activity definitions, and platform coverage. Separate visits, active users, paying users, and cumulative registrations.
source_requirements: Prefer the original analytics series or a documented reproduction. Commentary repeating the claim without recoverable measurements cannot settle it.
