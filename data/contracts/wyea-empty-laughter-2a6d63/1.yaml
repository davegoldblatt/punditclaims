evaluator_interpretation:
  - Assess the factual assertion that generative AI contributed to making the completed George Carlin special.
  - The ordinary broad reading includes generated speech or imagery as well as generated writing. It does not require AI authorship of the jokes.
  - The surrounding discussion also raises the narrower possibility of generated jokes, so script authorship must be distinguished from other production work.
  - The quality judgment and the suggestion that volume indicates AI use are not independently scored.
  - The target is production completed before the January 16, 2024 post. Its starting date is unspecified.
support_condition: Reliable production records, an attributable factual creator disclosure, or independently substantiated reporting establishes a generative AI contribution to the special's script, voice, or imagery.
contradiction_condition: Reliable production evidence establishes that the special was made without generative AI. Human authorship of the script alone does not establish this.
measurement_requirements: Identify the actual production contribution, distinguishing script writing, voice synthesis, and image generation. Promotional fiction and technical plausibility alone are insufficient.
source_requirements: Prefer production records and factual creator disclosures. Court allegations must be distinguished from findings. If relying on reporting, examine its attribution and conflicting accounts.
