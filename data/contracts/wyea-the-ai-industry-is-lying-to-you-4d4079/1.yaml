assessment_axis: forecast_outcome
explicit_source_elements:
  - the entire project
  - completed by October 2026
  - it obviously, blatantly won’t
evaluator_interpretation:
  - The target is the original eight-building Stargate Abilene campus, excluding separate proposed extensions.
  - Completed means all eight buildings are finished and energized for their intended data center use. It does not require maximum GPU utilization.
  - "By October 2026 is given its latest reasonable deadline: October 31, 2026."
  - A contractor completing only its power infrastructure scope does not establish completion of the entire campus.
support_condition: Dated records establish that at least one of the eight buildings remained unfinished or unenergized at the end of October 31, 2026.
contradiction_condition: Dated records establish that all eight buildings were completed and energized on or before October 31, 2026.
measurement_requirements: Building-level completion and energization dates covering all eight buildings, with construction distinguished from equipment installation, utilization and separate contractor scopes.
source_requirements: Developer or customer acceptance records, commissioning documents, occupancy records or a clear dated announcement covering the whole campus.
metric_scope: null
original_horizon: by October 2026
horizon_interval:
  start: 2026-03-24
  end: 2026-10-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Verified completion and energization of all eight buildings before the deadline would conclusively contradict the forecast. Irreversible cancellation of an unfinished part would support it. Revised schedules or incomplete work before the deadline are not conclusive.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - By October could mean the beginning or end of the month; the latest reasonable deadline is used.
  - Completed could refer to construction, energization, customer acceptance or full utilization.
  - Mortenson's own project scope may be narrower than the entire campus.
retrospective_or_prospective: prospective
