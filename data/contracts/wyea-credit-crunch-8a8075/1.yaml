assessment_axis: forecast_outcome
explicit_source_elements:
  - if Oracle builds these data centers
  - OpenAI doesn’t pay for them
  - existential financial risk
  - unseen in the history of the tech industry
evaluator_interpretation:
  - "Both antecedents must occur: Oracle builds the referenced facilities and OpenAI fails to make the associated contractual payments."
  - Read existential risk as a serious threat to Oracle's continued viability, supported by liquidity, solvency or going-concern evidence. Bankruptcy is not required.
  - Retain the historical superlative as a separate part of the claim; ordinary financial distress alone cannot support it.
  - This is a qualitative financial-risk forecast without a specified monetary metric or accounting basis.
support_condition: The antecedent occurs and the resulting exposure demonstrably threatens Oracle's continued viability, with credible historical comparison showing unprecedented severity within the technology industry.
contradiction_condition: After the qualifying nonpayment and associated liabilities have crystallized, evidence shows Oracle can absorb the loss without an existential threat; alternatively, a comparable or worse historical technology-sector crisis disproves the unprecedented component.
measurement_requirements: Verify completed facilities, payment obligations, nonpayment, recoveries, liquidity, debt maturities and alternative uses of the facilities. Assess survival risk rather than merely share-price losses, and compare historical crises on consistent measures.
source_requirements: Contracts, payment or court records, audited financial statements where available, credit analyses and documented historical comparisons.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A documented qualifying construction-and-nonpayment event followed by definitive evidence of existential exposure or its absence can settle the financial-risk component. Full support also requires the historical comparison; a share-price fall or downgrade alone is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - The required extent of construction and nonpayment is unspecified.
  - Existential risk has no numerical threshold.
  - The measure and comparison set for unprecedented risk are unspecified.
retrospective_or_prospective: retrospective
