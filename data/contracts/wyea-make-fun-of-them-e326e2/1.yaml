early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - A summary of projections known at publication can also be read as a forecast of actual results.
  - Fiscal and calendar years are not distinguished.
  - Capital expenditure definitions differ across companies, particularly for leases.
  - AI and generative AI are used without a consistent revenue boundary.
  - The revenue comparison includes an annualized figure.
  - No tolerance is given for the approximate revenue total.
