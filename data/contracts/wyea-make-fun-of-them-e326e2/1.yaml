assessment_axis: forecast_outcome
explicit_source_elements:
  - Projected Big Tech Capital Expenditures in 2025
  - "Microsoft: $80 billion"
  - "Meta: $72 billion"
  - "Amazon: $100 billion"
  - "Google: $75 billion"
  - $327 billion this year
  - what, $18 billion of revenue?
evaluator_interpretation:
  - Read as a paired projection of spending and AI revenue for the four named companies in 2025.
  - The revenue figure is approximate. No precise tolerance is supplied, so a small difference would not establish contradiction.
  - The comparison mixes company spending guidance with estimated AI revenue. Preserve the original definitions rather than silently standardizing them.
  - The single metric_scope records the composite estimate; it does not imply that spending and revenue share an accounting definition.
  - The words 'projected figures' describe estimates, not an antecedent that must occur before scoring.
support_condition: A reconciliation of the four companies' reported spending to the definitions behind the cited guidance, together with comparable realized 2025 AI revenue, establishes totals reasonably described as $327 billion and roughly $18 billion.
contradiction_condition: A complete, comparable reconciliation establishes that either stated total materially misses the outcome. A run rate, one company's result, or a different spending definition is insufficient by itself.
measurement_requirements: Identify calendar versus fiscal years, treatment of finance leases, and the AI revenue boundary. Do not substitute total cloud revenue, annualized revenue, or all company revenue for realized AI revenue.
source_requirements: Company disclosures for spending and separately disclosed AI revenue; reputable reporting or documented estimates where companies do not disclose AI revenue.
metric_scope:
  company: Microsoft, Meta, Amazon, and Alphabet combined
  metric: Projected capital expenditures and associated estimated AI revenue
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: 2025-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
