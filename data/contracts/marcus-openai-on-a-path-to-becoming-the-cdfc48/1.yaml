  - unprecedented amounts
  - personal data
evaluator_interpretation:
  - The ordinary reading is a historical record in the amount of personal data collected, compared with earlier products or companies.
  - The claim concerns cumulative collection through publication, rather than collection during a particular quarter.
  - The latest relevant position is therefore the cumulative amount publicly reportable by August 7, 2024.
  - Data sensitivity, collection categories, user counts, and total training tokens cannot independently establish the amount of personal data.
support_condition: Comparable measurements establish that ChatGPT had collected more personal data by the post date than any earlier comparable collection.
contradiction_condition: Comparable measurements establish that an earlier product or company collected at least as much personal data.
measurement_requirements: A consistent definition and unit for personal data, a dated ChatGPT total, and comparable historical totals. Any inclusion of model-training data must be consistent across comparisons.
source_requirements: Prefer audited inventories, regulator findings with quantities, or independent measurements with disclosed methods.
