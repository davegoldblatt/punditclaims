assessment_axis: historical_observation
explicit_source_elements:
  - AI data centers
  - take years
  - to build
evaluator_interpretation:
  - The plain reading concerns typical new AI data center construction, not an assertion that every retrofit or equipment installation takes years.
  - Read years as a multi-year construction-to-operation interval, ordinarily at least two years.
  - Measure from construction commencement to operational readiness. Planning, grid queues, initial operation and full-campus completion must be distinguished.
  - Use September 1–29, 2026 as the current observation window because the passage describes the buildout as it stood when posted.
support_condition: Representative evidence of construction durations applicable to the target period shows that new AI data centers typically require at least two years to become operational.
contradiction_condition: Representative comparable evidence shows that new AI data centers typically become operational in less than two years.
measurement_requirements: Consistent construction-start and operational dates; identification of AI use, project size, greenfield versus retrofit status, and first-phase versus full-campus completion. Forecast completion dates must remain separate from completed builds.
source_requirements: Prefer operator disclosures, permits and independent construction tracking. A few unusually fast or slow projects cannot establish typical duration.
