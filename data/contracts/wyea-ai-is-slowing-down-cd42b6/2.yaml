explicit_source_elements:
  - barely a few billion dollars of demand
  - outside of two companies
  - that lose billions — or tens of billions — of dollars a year
  - framed by 'OpenAI expects to spend $50 billion on compute in 2026'
evaluator_interpretation:
  - "Plain reading: in 2026, AI compute spending or committed purchasing by buyers other than OpenAI and Anthropic amounts to only a few billion dollars a year."
  - The period is calendar 2026, because the speaker frames the comparison with 2026 compute spending. This is not a retrospective 2025 test.
  - "'Demand' covers both buying GPUs for one's own data centers and renting compute from clouds or neoclouds. Hyperscaler capacity resold to OpenAI or Anthropic is not counted again as separate demand."
  - The part about losses refers to OpenAI and Anthropic and is not the tested element.
support_condition: Credible 2026 figures show that compute spending and commitments by all buyers other than OpenAI and Anthropic add up to only low single-digit billions of dollars.
contradiction_condition: Even one buyer other than OpenAI and Anthropic shows 2026 AI compute spending or new compute purchase commitments well above a few billion dollars, for its own use.
measurement_requirements: Dollar figures for 2026 AI compute capex or compute purchase contracts by named buyers other than OpenAI and Anthropic, excluding capacity resold to those two.
source_requirements: Company filings or announcements, or reputable news reports of them.
