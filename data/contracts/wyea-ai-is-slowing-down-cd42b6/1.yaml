assessment_axis: historical_observation
explicit_source_elements:
  - barely a few billion dollars of demand
  - outside of two companies
  - lose billions — or tens of billions — of dollars a year
evaluator_interpretation:
  - The two companies are OpenAI and Anthropic. The surrounding discussion identifies demand as demand for AI compute.
  - I read 'a few billion' as a low single-digit number of billions annually, without imposing an exact cutoff.
  - I use calendar 2025, the latest completed annual period before publication, to compare annual compute spending and annual losses. The surrounding 2026 spending projections are not realized results.
  - Demand means spending on compute services and comparable costs of compute used internally. Supplier sales and downstream purchases must not be counted twice.
  - The surrounding discussion uses spending estimates. I therefore classify the dollar-demand claim as an estimate.
  - The loss description is a separate component; evidence for it alone would not establish the market-demand claim.
support_condition: A sufficiently comprehensive estimate places annual AI compute demand outside OpenAI and Anthropic in the low single-digit billions, and comparable annual financial evidence establishes billion-dollar losses at both companies.
contradiction_condition: Comparable spending evidence establishes outside demand materially above the low single-digit billions, or comparable annual results disprove the loss description for either company.
measurement_requirements: Separate compute consumption costs from capital expenditure, financing, future commitments, application revenue, and installed capacity. Identify ultimate users and remove resale double counting.
source_requirements: Buyer disclosures or a documented market estimate covering the relevant period; financial results or reliable reporting of financial records for the loss component.
