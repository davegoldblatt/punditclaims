assessment_axis: historical_observation
explicit_source_elements:
  - using synthetic data for driverless cars
  - for close to a decade (if not longer)
  - it’s hardly solved the problem
evaluator_interpretation:
  - Close to a decade includes approximately nine years of documented use in autonomous-driving research.
  - The ordinary reading of solved the problem is reliable general driverless operation across ordinary roads and conditions, not merely a successful demonstration or a bounded service.
  - This does not require flawless driving or deny that commercial driverless services can be useful.
  - The target period covers the claimed approximately decade-long history through May 22, 2025.
  - The sentence describes an outcome after prolonged use; it does not establish that synthetic data caused any remaining limitations.
support_condition: Historical research establishes synthetic training-data use around 2015–2016 or earlier, and appropriately dated evidence establishes that general driverless operation remained unsolved by the post date.
contradiction_condition: The claimed duration is materially wrong, or general driverless operation had demonstrably been achieved by the post date.
measurement_requirements: Distinguish synthetic training data from simulation used only for testing. Distinguish general autonomy from commercial operation within specified locations and conditions.
source_requirements: Dated research documenting actual synthetic-data use, together with contemporary operational specifications or independent assessments of deployment limits.
