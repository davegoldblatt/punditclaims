  - They’re profitable on inference
  - no they are not
  - There is no proof of this statement anywhere
  - gross margins of 50%
evaluator_interpretation:
  - They refers principally to OpenAI and Anthropic.
  - Profitable on inference ordinarily means revenue exceeds attributable serving costs, excluding model training and unrelated corporate expenses.
  - The financial observation concerns the latest completed year, 2025. The separate assertion about public proof concerns the information available through March 31, 2026.
  - A reported positive margin is evidence, but its existence does not by itself establish audited profitability.
  - The speaker rejects the cited margin assertions rather than adopting a company-reported accounting measure.
support_condition: Comparable revenue and attributable inference expenses establish nonpositive inference margins for the named labs, and the public record contains no credible evidence of positive margins.
contradiction_condition: Reliable comparable records establish positive inference margins, or a credible public disclosure establishes that supporting evidence existed before publication. Reported estimates must be distinguished from conclusive proof.
measurement_requirements: Define treatment of free users, revenue-sharing payments, serving infrastructure and other attributable costs. Do not substitute company net losses for inference margins.
source_requirements: Prefer disclosed financial statements or reconciled company figures. Reporting about internal financial records may establish the existence of evidence, with its limitations stated.
