explicit_source_elements:
  - They’re profitable on inference- no they are not!
  - There is no proof of this statement anywhere!
  - Sam Altman saying it in August 2025?
  - Dario Amodei saying he had gross margins of 50%?
evaluator_interpretation:
  - The context principally concerns OpenAI and Anthropic. It does not clearly commit to a universal claim about every business selling inference.
  - The ordinary reading of profitable on inference is that revenue from serving models exceeds the attributable costs of serving them. This is distinct from company-wide net income and from recovering model-development costs.
  - "The statement contains two commitments: inference is not profitable, and public proof of inference profitability does not exist. Evidence supporting profitability is not automatically proof."
  - Proof means sufficiently substantiated financial information to establish the claimed margin, with identifiable revenue, costs and coverage. An audit is not an absolute requirement, but an executive assertion, hypothetical example or hardware benchmark alone is insufficient.
  - For the financial observation, calendar 2025 is the latest completed annual reporting period covered by the financial reporting located before publication. This is an evaluator-selected reporting proxy, not a period Zitron specified, and cannot by itself establish the position on March 31, 2026.
  - The no-proof assertion concerns the entire public record through March 31, 2026, without restricting the search to material about 2025. Later disclosures can illuminate historical profitability but cannot establish that proof was public when he wrote.
  - Zitron does not specify an accounting basis or settle whether attributable inference costs include free-user service, revenue sharing, staffing and overhead. No accounting basis is assigned merely because he mentions and disputes company executives.
support_condition: Comparable financial records establish non-positive inference profit for the labs in scope, and a documented search finds no sufficiently substantiated public demonstration of positive inference profit available by March 31, 2026. Failure to find proof alone does not establish unprofitability.
contradiction_condition: Reliable, adequately scoped records establish positive inference profit for a lab covered by the denial. Separately, the no-proof assertion is contradicted only by a sufficiently substantiated demonstration already public by March 31, 2026; the mere existence of favorable estimates or executive statements is insufficient.
measurement_requirements: Match realized inference revenue with attributable serving expenses for the same company and period. Identify treatment of free users, partner revenue shares, personnel, overhead and infrastructure. Keep inference margins separate from training expenses, company net income and annualized revenue.
source_requirements: Prefer financial statements or sufficiently detailed company disclosures, supported where possible by independent verification. Reporting and estimates may be material evidence without constituting proof. Historical financial evidence may be published through October 28, 2026; evidence that proof existed at publication must have been public by March 31, 2026.
