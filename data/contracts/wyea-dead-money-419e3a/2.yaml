  end: 2026-12-31
  precision: day
target_period:
  start: 2026-01-01
  end: 2026-12-31
  precision: day
condition_status: unknown
early_resolution_rule: Settled early only if Anthropic reports cumulative 2026 revenue for a part of the year that already exceeds about $48 billion. That would put the full year clearly beyond 'around $40 billion' however Q4 turns out. Revenue cannot fall below a figure already reported, so no early resolution on the low side.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Around $40 billion' has no stated tolerance."
  - "'Growing faster than OpenAI' has no stated period or measure: percentage growth, absolute growth, or run rate."
  - The premise is framed as an assumption, not a real-world condition.
retrospective_or_prospective: prospective
