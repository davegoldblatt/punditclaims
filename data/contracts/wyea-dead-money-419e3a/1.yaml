  - annual revenue around $40 billion for 2026
  - Through the first half of 2026
  - around $16.3 billion in revenue
evaluator_interpretation:
  - The forecast concerns Anthropic's realized calendar-year 2026 revenue, not its year-end annualized run rate.
  - For a consistent full-year test, growing faster means a higher percentage increase in realized 2026 revenue over 2025 than OpenAI, using comparable revenue accounting.
  - I would treat $36–44 billion as around $40 billion. This 10% tolerance is an evaluator convention, not a threshold supplied by Zitron.
  - The first-half figure is a premise of the forecast, not its full-year outcome.
support_condition: Comparable full-year results establish the faster-growth antecedent and Anthropic's realized 2026 revenue is $36–44 billion.
contradiction_condition: Comparable full-year results establish the faster-growth antecedent and Anthropic's realized 2026 revenue is outside $36–44 billion.
measurement_requirements: Anthropic and OpenAI realized revenue for 2025 and 2026, with consistent treatment of cloud-partner sales and calendar periods.
source_requirements: Prefer company financial statements or disclosures. Clearly attributed reputable reporting of company financial records is acceptable when primary records are unavailable.
