explicit_source_elements:
  - two AI labs
  - both lose billions of dollars
  - the latest model from one of them
  - randomly deletes people’s stuff
evaluator_interpretation:
  - The surrounding discussion identifies the labs as OpenAI and Anthropic.
  - The ordinary financial reading is actual annual losses of multiple billions of US dollars at each lab, rather than their combined losses, financing requirements, or projected spending.
  - For the ongoing financial assertion, use calendar 2025, the latest completed annual reporting period before the July 15 post. Annual measurement is an evaluator choice because the speaker provides no period.
  - For the deletion assertion, assess incidents involving a then-current model during 2026 through July 15. The combined target interval encloses these two component periods; it does not authorize using 2026 financial results to substitute for 2025 losses.
  - Randomly means unintended deletion outside the user's requested scope. It does not imply a statistically random mechanism, a particular frequency, or deletion in every configuration.
  - The supplied claim and context do not identify an accounting basis or distinguish operating loss from net loss. The contract therefore records unknown, which prevents a definitive supported or contradicted financial score.
support_condition: Comparable records establish multi-billion-dollar actual annual losses at each lab on the claim's identified accounting basis, and documented incidents establish unintended user-data deletion by one lab's latest model by July 15, 2026.
contradiction_condition: Comparable records show that at least one lab did not incur multi-billion-dollar losses in the selected financial period, or conclusive investigation disproves the claimed deletion behavior. A lack of incident reports alone is insufficient.
measurement_requirements: Keep each company's losses separate. Identify net versus operating loss, accounting basis, reporting period, and non-cash adjustments. For deletion, identify the model, incident date, requested action, actual destructive action, and relevant permissions.
source_requirements: Financial filings or independently verified financial documents; firsthand incident records and provider investigations for deletion. Later publications may establish earlier facts.
