assessment_axis: historical_observation
explicit_source_elements:
  - AI frequently needs to be patched
  - more and more problems are emerging
  - addressing them with afterthought, rather than forethought
evaluator_interpretation:
  - The plain reading describes a recurring, broad pattern of safety and security repairs following problems, alongside an increasing number of problems.
  - Patching includes changes to model safeguards and supporting systems, not only changes to model weights.
  - Reactive predominance is stronger than the existence of some reactive fixes; it does not mean that no preventive work occurs.
  - For this ongoing state, use the current year through publication, January 1 to July 22, 2026, as the latest reporting window for continuously published incident and remediation records. Earlier periods may supply comparison context.
support_condition: Representative incident histories and remediation timelines show recurring repairs, an increase in comparable problems, and a predominantly reactive response during the target period.
contradiction_condition: Representative records show that problems are not increasing or that preventive identification and mitigation predominate, materially defeating the claimed pattern.
measurement_requirements: Comparable incident definitions, reporting coverage, deployment exposure, and dates of discovery, harm, and remediation. Isolated examples cannot establish an industry-wide trend.
source_requirements: Incident databases with documented methods, developer change records, independent measurements, and preventive evaluation records.
