assessment_axis: historical_observation
explicit_source_elements:
  - currently losing billions of dollars a year
  - continues to accept new subscribers
  - capacity issues are not affecting its growth
evaluator_interpretation:
  - The financial claim means company-wide losses at an annual pace of at least $2 billion. The sentence does not distinguish accounting losses from cash burn.
  - For the ongoing financial and growth observations, use January–March 2026, the latest completed calendar quarter before publication. Annualizing that quarter would require an explicitly identified loss measure.
  - The ordinary reading of 'not affecting its growth' is that capacity problems did not reduce subscriber acquisition or retention. Positive growth and continued enrollment alone cannot establish that.
  - The descriptions of availability and quality are background characterizations; this assessment addresses the supplied proposition about losses and subscriber growth.
support_condition: Comparable financial evidence establishes losses at a multibillion-dollar annual pace during the target quarter, and subscriber evidence establishes that capacity problems did not impede acquisition or retention.
contradiction_condition: Comparable financial evidence disproves the stated loss pace, or reliable subscriber evidence shows that capacity problems reduced acquisition or retention during the target quarter.
measurement_requirements: An identified loss measure and accounting basis, quarterly results or a documented annual pace, subscriber additions and departures, and evidence separating capacity effects from other causes.
source_requirements: Prefer financial statements and dated subscriber records. Customer testimony can establish particular departures but cannot measure the aggregate effect by itself.
