assessment_axis: historical_observation
explicit_source_elements:
  - currently losing billions of dollars a year
  - continues to accept new subscribers
  - capacity issues are not affecting its growth
evaluator_interpretation:
  - "Plain reading of 'losing billions of dollars a year': Anthropic's annual loss, as the company reports it, is in the billions of dollars. Both net loss and operating loss are relevant."
  - "'Currently' with 'a year' is ongoing. Target period: the latest full year before the post (2025) plus the half-year containing the post (January to June 2026), the periods public evidence reports on. This choice is mine."
  - "Plain reading of the second part: despite capacity problems, Anthropic kept signing up subscribers and its growth continued. It does not require capacity problems to have had zero effect on any customer."
support_condition: Company figures showing an annual or half-year loss of billions of dollars, together with evidence that subscribers and revenue kept growing during the capacity problems.
contradiction_condition: Figures showing losses below a billion dollars a year, or evidence that subscriber signups or growth stalled or reversed because of capacity limits.
measurement_requirements: Company-reported net or operating loss for 2025 or H1 2026. Subscriber or revenue growth in early 2026.
source_requirements: Company prospectus figures as reported by Reuters, company statements, reputable press.
