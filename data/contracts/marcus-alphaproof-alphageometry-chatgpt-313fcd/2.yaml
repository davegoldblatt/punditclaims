ambiguity_flags:
  - Sanity-checking has no operational definition; it could mean checking within a model or verification supplied by a surrounding system.
  - The wording does not clearly distinguish every listed failure occurring in every model from a recurring family of failures across every model.
  - Defame could mean false personal accusations in ordinary speech or legally actionable defamation.
  - Over and over again and occasionally specify no numerical frequency.
  - Released is unclear for limited-access prototypes such as the explicitly included SearchGPT.
