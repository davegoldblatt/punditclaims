assessment_axis: forecast_outcome
explicit_source_elements:
  - not enough compute being built
  - Anthropic or OpenAI’s voracious demands
  - they will both be bartering
  - whatever price it’s available at
  - will savage their already-negative margins
evaluator_interpretation:
  - "The asserted shortage is the antecedent: available compute cannot keep pace with the labs' demand."
  - Whatever price means materially worse purchasing terms forced by scarcity, not literally an unlimited willingness to pay.
  - Savage means a material deterioration attributable to procurement costs, not an immaterial fluctuation.
  - Already-negative margins most naturally refers to overall profitability because the preceding gross-margin figures are positive. Net profit margin is a provisional operationalization; the speaker does not specify it.
  - No deadline is supplied.
support_condition: After publication, both companies face constrained compute supply, purchase capacity on materially worse comparable terms because of that constraint, and experience a material resulting deterioration in consistently measured profit margins.
contradiction_condition: A decisive completed episode or permanent change establishes that the asserted shortage did not produce the predicted procurement and margin effects. Temporary improvement or mere nonoccurrence cannot defeat an unlimited-horizon forecast.
measurement_requirements: Comparable procurement prices adjusted for hardware, performance, service terms and duration; consistent margin accounts; evidence separating procurement effects from training, pricing, product mix and financing charges.
source_requirements: Dated procurement records and financial disclosures, or independently verified reporting that connects shortages, purchasing terms and margins for each company.
metric_scope:
  company: Anthropic and OpenAI, assessed separately
  metric: net profit margin, provisional interpretation
  currency: null
  units: percent
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: 2026-05-19
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon dated post-publication evidence establishing the complete shortage-to-premium-purchase-to-margin-damage sequence for both companies, or a decisive event permanently foreclosing it. A single improving reporting period is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical threshold for savage.
  - Margin definition and accounting treatments are unspecified.
  - The duration and severity of the required shortage are unspecified.
retrospective_or_prospective: retrospective
