assessment_axis: historical_observation
explicit_source_elements:
  - '"operations are deeply-unprofitable"'
  - '"massive amounts of capital expenditures"'
  - '"$10bn in 2025 alone"'
  - "\"a number that's expected to double in 2026\""
  - '"time bomb" (rhetorical)'
evaluator_interpretation:
  - '"Time bomb" is a rhetorical judgment and is not scored.'
  - '"Deeply unprofitable": plain reading is a large GAAP loss relative to revenue for FY2025. I use net loss, because that is what the company actually lost. I note that operating loss was small.'
  - "\"$10bn in 2025\": CoreWeave's cash purchases of property and equipment for 2025."
  - "\"Expected to double in 2026\": the company's 2026 capex guidance, as of the post, was at least about twice the 2025 figure."
  - The target period covers FY2025 results and the guidance current when the post was published (through 2026-03-03).
support_condition: FY2025 shows a large loss, 2025 capex is about $10bn, and 2026 capex guidance as of the post is roughly double or more.
contradiction_condition: CoreWeave was profitable or only marginally loss-making on every measure, 2025 capex was far from $10bn, or 2026 guidance was well below double.
measurement_requirements: FY2025 net and operating results; 2025 cash capex; 2026 capex guidance given on or before 2026-03-03.
source_requirements: CoreWeave earnings release, earnings call, and reputable coverage.
metric_scope:
  company: CoreWeave
  metric: Capital expenditures (purchases of property and equipment)
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01-01
  end: 2026-03-03
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - '"Deeply unprofitable" holds on net loss (-23% margin) but not on operating loss (-1% margin).'
  - "CoreWeave reports two capex figures for 2025: $10.31bn cash purchases and $14.9bn on its own accrual measure."
  - '"Double" understates the guidance relative to the $10.31bn cash figure (about 3x) but matches it relative to $14.9bn.'
retrospective_or_prospective: retrospective
