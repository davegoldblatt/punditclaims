explicit_source_elements:
  - these “autonomous agents”
  - effectively chatbots that can answer questions based on a document
  - tech that’s existed for a decade or more
evaluator_interpretation:
  - The central capability claim is that contemporary autonomous agents amount to document question answering, without materially broader action-taking capabilities.
  - The historical comparison separately asserts that document-based question answering existed by May 2014.
  - The target covers technology history through publication because the statement explicitly combines contemporary capabilities with a decade-or-more comparison; it supplies no earliest historical date.
  - The rhetorical claim about every news story is outside the supplied normalized proposition.
support_condition: Contemporary agent systems are limited to document question answering, and dated records establish that this capability existed at least ten years earlier.
contradiction_condition: Contemporaneous agents demonstrably select and execute actions beyond document question answering, or the asserted historical age is disproved. Opposing results for the two components warrant mixed.
measurement_requirements: Identify actual executed actions rather than suggested actions. Establish the historical capability through dated technical documentation.
source_requirements: Use primary agent methods and evaluations available by publication, plus historical documentation of question-answering systems.
