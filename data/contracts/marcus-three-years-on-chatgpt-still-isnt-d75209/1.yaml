evaluator_interpretation:
  - Its results refers to the MIT NANDA finding described immediately before this sentence.
  - Held strong means subsequent evidence corroborated the approximately 5% finding, rather than merely showing that adoption remained difficult.
  - The target is the interval from the report's stated July 2025 date through the post. Survey fieldwork dates must be distinguished from publication dates.
  - A share receiving any return, a share achieving measurable profit-and-loss impact, and a share classified as high performers are not interchangeable.
  - The metric is a prevalence estimate across organizations, not an identified company's financial accounts.
support_condition: Subsequent evidence with sufficiently comparable organizations, denominators, and return definitions corroborates an approximately 5% share obtaining the stated benefit.
contradiction_condition: Subsequent comparable evidence establishes a substantially different share, or directly demonstrates that the original finding did not hold.
measurement_requirements: Match organizational coverage, company-versus-pilot denominators, generative-AI scope, and the threshold for a return. Separate financial returns from productivity benefits and subjective value.
source_requirements: The original MIT report and subsequent original surveys available by the post; later publications qualify only if they establish facts about the target period.
