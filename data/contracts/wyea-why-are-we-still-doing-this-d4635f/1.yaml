explicit_source_elements:
  - what you’re impressed by is the result of burning more money
  - than anybody has ever burned on anything
  - Troubled Asset Relief Plan (a little over $400 billion)
  - Paycheck Protection Program (somewhere between $800 billion and $900 billion)
evaluator_interpretation:
  - Read 'burning' as cumulative gross expenditure attributable to developing and supplying LLMs, because the context discusses capital spending rather than a consistent net-loss measure.
  - The comparison concerns expenditure incurred by March 17, 2026. Announced financing and future spending are not expenditure already incurred.
  - The surrounding figures are treated as estimates, not an audited industry account.
  - The named program comparisons are checkable separately from the much broader historical superlative.
support_condition: A reconciled, non-duplicative estimate of actual cumulative LLM expenditure exceeds the named programs on a consistent basis; supporting the literal superlative additionally requires comparison with other major historical undertakings.
contradiction_condition: Comparable accounts establish that cumulative LLM expenditure does not exceed a named benchmark, or identify a larger historical undertaking on the same spending basis.
measurement_requirements: Separate financing from expenditure, actual spending from plans, AI-specific spending from other infrastructure, and gross disbursements from net costs after recoveries. Avoid counting a funding transfer and its subsequent expenditure twice.
source_requirements: Company financial records for spending and official program accounts for government comparisons, supplemented by transparent estimates of LLM attribution.
