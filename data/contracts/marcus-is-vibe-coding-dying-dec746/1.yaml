explicit_source_elements:
  - can be fine
  - something very familiar
  - less reliable for the unfamiliar
evaluator_interpretation:
  - The preceding sentence makes familiarity relative to model training, not the user's personal experience.
  - Reliable means producing working code or a working application that satisfies the requested behavior.
  - This is a tendency across comparable tasks, not a claim that unfamiliar projects always fail.
  - There is no regular reporting cycle for this capability. I use the latest pre-publication month-to-date period, October 1–21, 2025, to represent the ongoing state described. Earlier evaluations remain contextual unless their applicability to that state is established.
support_condition: Comparable evaluations relevant to the described tools and period show successful familiar builds and systematically lower reliability on unfamiliar builds, without merely substituting harder tasks for unfamiliar ones.
contradiction_condition: Comparable evaluations show unfamiliar builds are similarly or more reliable across a sufficiently broad set of relevant projects.
measurement_requirements: Functional tests, repeated trials, specified model and tool versions, a defensible familiarity measure, and comparable project difficulty and assistance.
source_requirements: Prefer primary matched evaluations. Coding benchmarks can inform the assessment, but their relationship to complete amateur-built applications must be established.
