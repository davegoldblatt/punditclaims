explicit_source_elements:
  - can be fine
  - something very familiar
  - less reliable for the unfamiliar
  - generalizing outside the training distribution
evaluator_interpretation:
  - Familiarity refers to similarity to the model's training distribution, as indicated by the preceding sentence.
  - Reliability means producing code that correctly performs the requested task.
  - The claim describes a general tendency, not failure on every unfamiliar task.
  - Comparisons should account for task difficulty, supplied context and evaluation conditions.
  - This is a general capability observation through the post date. Earlier relevant evaluations remain eligible; no October-only window is imposed.
  - Code-generation benchmarks can inform the claim, but transferring their results to complete amateur-built applications requires caution.
support_condition: Relevant comparisons show successful performance on familiar tasks and consistently lower correctness on unfamiliar tasks, with material differences in difficulty and evaluation conditions addressed.
contradiction_condition: Relevant, adequately controlled comparisons show similar or better reliability on unfamiliar tasks across the claimed scope.
measurement_requirements: Functional tests or documented project outcomes, an explicit familiarity measure, and controls or analysis addressing difficulty and context differences.
source_requirements: Primary benchmark studies or project evaluations. Training familiarity must be measured or identified as a proxy rather than assumed from task difficulty.
