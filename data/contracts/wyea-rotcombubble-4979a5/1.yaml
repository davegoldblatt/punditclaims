evaluator_interpretation:
  - Assess the product allegation about Altman/OpenAI, with Rabbit as the comparison. The Y Combinator connection does not establish that allegation.
  - The ordinary reading requires a material mismatch between a sales representation and the product delivered, with future capabilities used to promote the purchase.
  - The claim concerns sales before the post. Its starting date is unspecified, so the historical window has no invented lower bound.
  - Disclosed limitations, unsuccessful individual outputs, and features explicitly advertised for later release do not by themselves establish a misleading capability representation.
support_condition: An identifiable OpenAI product sold before June 3, 2024, an attributable sales representation, and contemporaneous tests showing a material failure to deliver that representation, alongside evidence that future capabilities helped sell it.
contradiction_condition: Evidence identifying the representations at issue and showing that the delivered products met them, or that the alleged discrepancies concern clearly disclosed future features. One accurate advertisement cannot disprove every possible example.
measurement_requirements: Match the advertised capability, product version, purchase terms, promised availability and test conditions.
source_requirements: Contemporaneous advertising or attributable statements, paired with documented product tests. Rabbit evidence cannot establish OpenAI's conduct.
