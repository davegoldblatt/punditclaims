explicit_source_elements:
  - "\"Let's make this really clear\""
  - AI cannot "just handle coding"
  - "context: vibe coding and the claim it allows people who can't code to build functional, useful software"
evaluator_interpretation:
  - "Plain reading: as of the post date, AI systems could not on their own reliably do the work of software development, so that a person without coding skill could hand coding over to them and get working software. The claim is not that AI cannot write any code."
  - He describes the current state without naming a period. I use the period just before the post (July 1 to August 25, 2025), when the latest frontier models had been released and independently measured.
  - Independent measurements of how reliably frontier AI agents complete realistic software-engineering tasks on their own are fair evidence.
support_condition: Independent evaluations from around the post date show that frontier AI agents fail often on realistic software tasks of modest length, so they cannot be relied on to handle coding on their own.
contradiction_condition: Credible evidence from around the post date shows AI systems reliably completing realistic software development work end to end, without human coding expertise, at a level where coding could be handed off to them.
measurement_requirements: Success rates of autonomous AI agents on realistic software-engineering tasks, such as METR's task-length time horizons at 50% and 80% success.
source_requirements: Independent evaluator reports or peer-reviewed or benchmark results on frontier models available by August 2025.
