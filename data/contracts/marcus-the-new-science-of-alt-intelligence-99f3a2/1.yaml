evaluator_interpretation:
  - The surrounding discussion concerns AI application domains, rather than all software or economic activity.
  - I read triumphed as superior demonstrated task performance, and most as a majority of major AI domains.
  - Big Data includes learning from large collected or generated datasets; knowledge engineering means substantial hand-designed domain knowledge.
  - So far describes cumulative progress through publication. No historical start date is supplied.
  - Not all and for now restrict scope and time; they are not forecast antecedents.
support_condition: A broad, defensible comparison across major AI domains shows that data-driven methods outperform knowledge-engineered alternatives in a majority, while allowing exceptions.
contradiction_condition: A comparably broad domain comparison shows that data-driven methods do not lead in a majority. A few exceptions cannot contradict a claim that explicitly allows them.
measurement_requirements: Specify the domain universe and avoid counting several benchmarks within one domain as separate domain wins. Identify comparison systems and distinguish hybrid systems from a clean learning-versus-engineering comparison.
source_requirements: Original comparative evaluations and a credible cross-domain synthesis covering results available by the post.
