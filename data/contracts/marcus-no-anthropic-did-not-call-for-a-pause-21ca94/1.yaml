early_resolution_rule: Resolve support early if a dated post-publication decision to continue rapid frontier advancement is publicly justified, explicitly or unambiguously, by less cautious competitors. Resolve contradiction early upon an implemented company-wide halt expressly replacing continued advancement, or abandonment of frontier development. Separate releases, general geopolitical commentary, and temporary oper…
