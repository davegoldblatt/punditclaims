assessment_axis: forecast_outcome
explicit_source_elements:
  - I don’t expect my predictions to be as on target this year as last
  - for a happy reason
  - more fluid, more realistic, and more open-minded
evaluator_interpretation:
  - This year means 2026 and last means 2025, following the post's introduction of its 2026 predictions.
  - Less on target means a lower proportion of correct predictions under a consistent scoring method applied to both annual prediction sets.
  - The stated sixteen-of-seventeen result is Marcus's self-assessment, not an independently established baseline.
  - Treat the expectation as a directional forecast. The proposed explanation about intellectual change requires separate causal evidence; a lower hit rate alone would not establish it.
  - December 31, 2026 is the contextual assessment horizon. Individual predictions with later deadlines must retain those deadlines and cannot be treated as failures at year-end.
support_condition: Independent scoring of fixed, comparable prediction sets establishes a lower 2026 accuracy rate than the 2025 rate. Supporting the stated explanation additionally requires evidence connecting the field's changes to the forecasting errors.
contradiction_condition: Independent scoring of fixed, comparable prediction sets establishes a 2026 accuracy rate equal to or higher than the 2025 rate.
measurement_requirements: Specify the prediction units, denominators, treatment of compound and partially correct claims, exclusions and unresolved outcomes. Apply the same method to both years without counting this self-referential metaprediction in its own denominator.
source_requirements: Original prediction lists establish commitments only. Independent outcome evidence must justify each score; Marcus's own grading cannot establish accuracy.
metric_scope: null
original_horizon: this year
horizon_interval:
  start: 2025-12-20
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only if independently verified outcomes and a fixed scoring method mathematically force the comparison regardless of every remaining prediction's result.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - On target has no specified scoring method.
  - The six-or-seven framing and compound predictions leave the denominator unclear.
  - Including the metaprediction itself would make the comparison self-referential.
  - Some underlying predictions have later deadlines or require hindsight.
  - The causal explanation has no defined measure or identification method.
  - I don’t expect expresses an expectation without a numerical confidence.
