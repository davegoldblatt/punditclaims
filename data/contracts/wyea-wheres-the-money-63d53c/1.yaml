explicit_source_elements:
  - Without ChatGPT
  - the entire generative AI app market
  - a little more than half
  - 147 million monthly active users
  - users outside of China
evaluator_interpretation:
  - The comparison concerns January 2025 mobile-app monthly active users, as established by the preceding figures.
  - I retain the surrounding outside-China restriction and include DeepSeek because this sentence excludes only ChatGPT.
  - The post adds individual apps' MAUs, so the primary comparison is an additive app-user total, not deduplicated people.
  - A little more than half means modestly above 73.5 million. The speaker supplied no exact tolerance, so borderline differences cannot settle it.
support_condition: A reasonably complete, consistently measured January 2025 total for generative-AI mobile apps excluding ChatGPT and China is modestly above half the verified Pokémon Go benchmark.
contradiction_condition: Comparable data place the total clearly outside that approximate magnitude, or establish that the stated historical benchmark is materially wrong.
measurement_requirements: Same-month mobile MAU estimates, consistent geographic and platform coverage, an explicit app inventory, and clarity about additive users versus deduplicated people. Downloads and website visitors are not substitutes.
source_requirements: Prefer Sensor Tower's underlying estimates and methodology, with independent documentation of Pokémon Go's historical MAU benchmark.
