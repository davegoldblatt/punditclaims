assessment_axis: historical_observation
explicit_source_elements:
  - Without ChatGPT
  - it appears that
  - the entire generative AI app market
  - is a little more than half the size of Pokémon Go at its peak
  - when it had 147 million monthly active users
  - "context: January 2025 monthly active users, outside China"
  - "context: he names Grok, Amazon's Rufus and Character.ai as missed apps that 'there isn't a chance in hell' cover the shortfall"
evaluator_interpretation:
  - The criteria use only his words. His threshold is 'a little more than half' of 147 million, which is about 74 million monthly active users. His scope is 'the entire generative AI app market' excluding ChatGPT, in January 2025, outside China.
  - He counts Amazon's Rufus, an assistant built into the Amazon shopping app, as part of this market. So, by his own scope, AI assistants built into larger apps count.
  - "'It appears' marks this as an estimate from the data he had. It is tested as a statement about the market's size, not as a claim about what his data showed."
  - The Pokémon Go figure is a second, factual element ('at its peak, when it had 147 million'). It is checked as context because it describes 2016 to 2018, not January 2025.
support_condition: Measures of January 2025 show the non-ChatGPT generative AI app market outside China at roughly 74 to 90 million monthly active users, and Pokémon Go's peak was 147 million monthly active users.
contradiction_condition: A credible January 2025 figure shows non-ChatGPT generative AI assistant users far above about 74 million monthly actives within his stated scope. Or Pokémon Go's peak was not 147 million.
measurement_requirements: Monthly active users for January 2025. Company-reported figures and third-party estimates are both acceptable, with differences in definition noted.
source_requirements: Company disclosures, such as earnings calls or court exhibits, or third-party app analytics reported by reputable outlets.
