assessment_axis: forecast_outcome
explicit_source_elements:
  - raise $3.75 billion in debt
  - sign a deal with Meta
  - capacity that doesn’t exist
  - will likely take three to four years to build
  - it’s never happening
evaluator_interpretation:
  - The financing link in the post points to Nebius's own March 17 offering announcement, so its financial basis is company_reported.
  - The referenced capacity is the new March 2026 Meta agreement, not the earlier Meta agreement.
  - The principal forecast is that the referenced capacity will never materialize. The likely three-to-four-year estimate is not a firm delivery deadline and conflicts with the absolute parenthetical.
  - Actual delivery of a meaningful contracted tranche would refute the categorical never-happening reading, but would not prove complete fulfillment.
  - The assertion that signing the Meta deal was all that financing required is a separate causal assertion; announcement sequence alone cannot establish it.
support_condition: Definitive termination of the referenced capacity arrangement, with no delivery and no successor arrangement fulfilling it, establishes that it will not materialize. Financing documents must separately substantiate the amount and claimed causal mechanism.
contradiction_condition: Verified commissioning and delivery to Meta of meaningful capacity under the March 2026 agreement contradicts the categorical non-delivery forecast. A delivery promise, financing close or delivery under an earlier agreement does not.
measurement_requirements: Match commissioned capacity and customer acceptance to the specific March 2026 contract. Distinguish proposed debt principal, priced principal, gross proceeds and net proceeds.
source_requirements: Nebius and Meta disclosures, filings, commissioning records and customer acceptance records. Financing causation requires lender or transaction documentation.
