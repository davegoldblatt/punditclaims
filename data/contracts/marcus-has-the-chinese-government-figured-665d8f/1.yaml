ambiguity_flags:
  - China could mean its government or its prospective commercial buyers.
  - Not wanting chips could mean limiting imports or lacking demand.
  - The wording reports an appearance rather than a confirmed final policy.
  - Announced U.S. permission is not identical to completed individual export licensing.
