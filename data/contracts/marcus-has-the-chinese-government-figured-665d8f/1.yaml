assessment_axis: historical_observation
explicit_source_elements:
  - China didn’t want them
  - news just reported by the FT
  - seems
  - to some degree
evaluator_interpretation:
  - The contextual referent is Chinese government reluctance to permit unrestricted H200 purchases, rather than an absence of demand among Chinese companies.
  - The qualified wording commits to a credible reported indication of reluctance. It does not assert that a final restriction had already been adopted.
  - The observation covers December 8–9, 2025. Later purchasing behavior cannot independently settle what was being reported at that time.
  - The references to degree and the FT qualify an observation; they are not antecedents of a conditional forecast.
support_condition: Credible contemporaneous reporting describes Chinese authorities considering or imposing limits on H200 purchases after the U.S. announcement.
contradiction_condition: The relevant report is corrected or discredited, or reliable contemporaneous evidence establishes that the supposed government reluctance did not exist.
measurement_requirements: Distinguish government purchase restrictions from commercial demand, and contemplated restrictions from adopted policy.
source_requirements: The contemporaneous FT report or a reliable account of it, with official confirmation preferred where available.
