assessment_axis: historical_observation
explicit_source_elements:
  - LLMs are built
  - completely focus themselves on us
  - affirming every single interaction
evaluator_interpretation:
  - The surrounding discussion concerns conversational assistants, so I assess that class rather than all language models regardless of use.
  - I read 'affirming' as validating or agreeing with the user, beyond merely responding attentively or politely.
  - The claim concerns design as well as behavior. Training specifications explicitly requiring disagreement or resistance to sycophancy are relevant counterexamples.
  - This is an as-of-publication design claim without a reporting cycle. The target includes publicly documented designs established by 2026-04-14; no lower date is supplied.
support_condition: Training documentation establishing unconditional user affirmation as a design objective, together with interaction evidence supporting the claimed universal behavior.
contradiction_condition: A mainstream conversational LLM with documented training objectives that require withholding affirmation, disagreeing or avoiding sycophancy in some interactions; alternatively, clear observed counterexamples to universal affirmation.
measurement_requirements: Separate attention and helpfulness from agreement. Separate stated training objectives from observed behavior and measure the frequency of affirmation rather than assuming it is universal.
source_requirements: Dated primary training specifications and empirical sycophancy research relevant to systems existing by the post date.
