evaluator_interpretation:
  - The referenced literature concerns linguistic models of meaning and psychological accounts of constructing those models.
  - The plain reading is that the LLM research approach does not substantively engage that literature. This is broader than saying that mainstream architectures do not implement Kintsch's particular theory.
  - The target is the accumulated research record available immediately before the post. Research has no regular reporting period here, and the claim supplies no starting date.
support_condition: A sufficiently broad examination of relevant LLM research establishes systematic non-engagement with the specified literature.
contradiction_condition: Research available before the post substantively uses the specified literature to formulate and investigate how pretrained language models represent meaning.
measurement_requirements: Distinguish substantive theoretical engagement from incidental citations, and engagement from architectural adoption.
source_requirements: Original research papers or design documentation available before the post.
