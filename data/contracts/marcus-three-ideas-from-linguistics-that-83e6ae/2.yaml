explicit_source_elements:
  - The large language model approach
  - ignores all of this literature
  - the right models of meaning
  - the psychological processes by which those models might be derived
evaluator_interpretation:
  - Read the firm statement as alleging a lack of substantive use of the described literature in building language models.
  - Examine architecture, training objectives, and model-building methods. Research that only probes an existing model or mentions the literature does not qualify.
  - The relevant literature includes cognitive accounts of how discourse representations arise; the claim is not restricted to implementing Kintsch's particular model.
  - Include pretrained BERT-style language-model methods, while flagging that restricting 'the approach' to dominant GPT-style systems would change the assessment.
  - Assess model-building methods documented by 2022-06-22, including earlier methods still relevant then. No arbitrary annual window is imposed.
support_condition: Representative design documentation and a sufficiently comprehensive contemporary review establish that the model-building approach did not substantively use the specified meaning and comprehension literature.
contradiction_condition: A documented prepublication language-model architecture or training method explicitly uses that literature to change how discourse or meaning representations are learned.
measurement_requirements: Trace the cited cognitive or linguistic theory to an implemented architectural or training choice. A citation, evaluation framework, or post-hoc probe alone is insufficient.
source_requirements: Primary model-building papers or technical documentation available by 2022-06-22.
