assessment_axis: historical_observation
explicit_source_elements:
  - Neural networks
  - configurations that have been dominant over the last three decades
  - have trouble generalizing
  - beyond the multidimensional space that surrounds their training examples
evaluator_interpretation:
  - I read 'have trouble' as a recurring difficulty, not an assertion that successful generalization is impossible.
  - The ordinary reading is difficulty with materially unfamiliar inputs, relationships, or distributions. A literal boundary around training points is a different mathematical claim.
  - The three-decade reference defines the historical scope of the architectures being discussed. It does not require every architecture to fail in every year.
support_condition: Research on commonly used neural architectures finds substantial, recurring performance losses under distribution shifts or extrapolation beyond familiar training conditions.
contradiction_condition: Representative controlled evaluations show dependable generalization across materially unfamiliar conditions, undermining the claimed recurring difficulty.
measurement_requirements: Distinguish distribution shifts, new combinations, and geometric extrapolation. Compare performance under familiar and unfamiliar conditions, and disclose successful cases.
source_requirements: Primary empirical or theoretical research concerning architectures available by publication.
