assessment_axis: historical_observation
explicit_source_elements:
  - The vast majority
  - AI compute
  - is sold
  - either Anthropic or OpenAI
evaluator_interpretation:
  - The plain reading is that the two companies together purchase an overwhelming share of AI compute sold across providers, not merely a narrow majority.
  - Use July through September 2026, the latest completed calendar quarter that public reporting could cover before the post.
  - Measure compute supplied to the two ultimate purchasers, including purchases through intermediaries, without double counting.
  - The surrounding backlog discussion is relevant context, but future commitments do not establish the share of compute actually sold during the period.
  - No geography is specified, so the denominator is worldwide. Internally consumed, unsold compute is outside the sales denominator.
  - This is a physical compute market-share claim, not a stated revenue or spending figure; metric_scope is null.
support_condition: Comparable industry-wide data show that Anthropic and OpenAI together account for an overwhelming share of AI compute sold in the target quarter.
contradiction_condition: Comparable industry-wide data show that other purchasers account for a sufficiently large share to rule out an overwhelming combined share for Anthropic and OpenAI.
measurement_requirements: A common measure of delivered compute, such as accelerator-equivalent hours, with comparable coverage of providers and customers. Spending can serve as a proxy only with justified price and hardware adjustments. Backlogs, installed fleets, and token revenues cannot substitute directly.
source_requirements: Provider customer disclosures, purchaser records, or a transparent representative market estimate with an industry denominator and uncertainty bounds.
