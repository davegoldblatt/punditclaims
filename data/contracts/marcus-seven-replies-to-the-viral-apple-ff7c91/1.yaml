evaluator_interpretation:
  - The ordinary reading is dependable integration across diverse unfamiliar tasks and changed conditions, rather than success within one specialized domain.
  - Reliable does not mean infallible, and general does not require solving every possible problem.
  - There is no regular reporting period for this capability. I assess the publicly demonstrated state at publication, June 12, 2025; earlier evaluations provide context.
support_condition: Broad, representative evaluations of available neural-symbolic systems establish persistent failures of dependable transfer across diverse tasks and changed conditions.
contradiction_condition: A system available at publication demonstrates dependable neural-symbolic integration across diverse unfamiliar tasks and changed conditions in credible evaluations.
measurement_requirements: Evaluate complete integrated systems, with correctness checks, repeated trials, diverse task families, and tests of transfer. Failures of unaided language models alone are insufficient.
source_requirements: Public evaluations describing systems and methods available by publication, or later analyses specifically evaluating that historical capability.
