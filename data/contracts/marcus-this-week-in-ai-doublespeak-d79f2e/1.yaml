assessment_axis: historical_observation
explicit_source_elements:
  - reasoning is to obtain valid conclusions from known facts
  - GPT-4 frequently falls short
evaluator_interpretation:
  - The definition of reasoning fixes what is being assessed; it is not a forecast antecedent.
  - The ordinary reading is recurring failures to draw valid conclusions from supplied or established premises, rather than merely failures to recall facts.
  - Frequently requires evidence of recurring errors across a defined collection of relevant tasks. An isolated failure establishes possibility but not frequency.
  - The target is the original GPT-4 during its March 14–18, 2023 launch period, the latest public model period before the post.
support_condition: Evaluations attributable to the launch-period model show recurring invalid conclusions on a defined set of tasks whose necessary premises are supplied or established.
contradiction_condition: Broad evaluations attributable to that model show consistently valid conclusions on relevant tasks, with failures sufficiently exceptional to contradict the ordinary meaning of frequently.
measurement_requirements: Identify the evaluated model and period, task denominator, prompting method, and criteria for a valid conclusion. Separate reasoning failures from missing knowledge and output-format failures.
source_requirements: Prefer reproducible logical-reasoning evaluations or documented launch-period tests. Later studies require a defensible link to the model state described in the post.
