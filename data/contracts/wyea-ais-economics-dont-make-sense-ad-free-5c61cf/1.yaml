early_resolution_rule: A dated disclosure establishing first project profitability, its elapsed time from the relevant operating start, a comparable accounting measure, and timely OpenAI payments could settle the forecast. Aggregate Oracle profitability or financing announcements cannot.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No stated deadline.
  - No specified starting point for the multi-year interval.
  - Profit may mean periodic accounting profit or cumulative investment recovery.
  - The accounting basis and exact Stargate business boundary are unspecified.
  - Even if is a robustness assertion, but the requested conditional scoring rule requires payment evidence.
