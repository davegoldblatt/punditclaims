explicit_source_elements:
  - some of the latest systems have done better than earlier ones
  - for mission critical systems
  - even a small number of errors can be deadly
evaluator_interpretation:
  - "Part 1: on the long-term maintainability benchmark he cites (SWE-CI, Sun Yat-sen University and Alibaba), at least some newer AI coding systems scored better than earlier ones as of the post date."
  - Part 2 is a possibility claim ('can be'). It holds if documented cases exist where a small number of software errors in a mission-critical system contributed to deaths. It does not claim that AI-written code has killed anyone, and the Amazon aside in the next sentence is not graded here.
  - Part 1 describes results available at the post date (March 2026). Part 2 is a general claim covering history up to the post date.
support_condition: "Part 1: the cited benchmark or similar evidence shows newer models scoring higher than earlier ones. Part 2: an official or scholarly accident investigation ties deaths to one or a few software errors in a safety- or mission-critical system."
contradiction_condition: "Part 1: newer systems do no better than older ones on the cited benchmark. Part 2: no documented case exists of a small number of software errors causing deaths in a mission-critical system."
measurement_requirements: Benchmark scores by model release; official accident investigations attributing deaths to software errors.
source_requirements: Benchmark paper; government or peer-reviewed accident investigations.
