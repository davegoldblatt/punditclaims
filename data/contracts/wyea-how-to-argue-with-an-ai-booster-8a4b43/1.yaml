explicit_source_elements:
  - the only way
  - model developers have been able to improve the efficacy of new models
  - test-time compute
  - burn extra tokens to complete a task
evaluator_interpretation:
  - Read efficacy as measurable task performance, including accuracy, instruction following, and successful coding.
  - The word only excludes meaningful improvements in new non-reasoning models achieved through training rather than additional inference-time reasoning.
  - The retrospective phrase have been able to covers improvements achieved by publication. No starting date is supplied, so the target period has an open beginning; recent 2025 releases can test the assertion.
support_condition: Available evaluations show that meaningful improvements in new models required additional inference-time reasoning, with no demonstrated improvements from non-reasoning model development.
contradiction_condition: At least one new non-reasoning model demonstrably improves on its predecessor through training or another method that does not require extra inference-time reasoning.
measurement_requirements: Comparable task evaluations and documentation identifying whether the model uses additional inference-time reasoning. Better benchmark performance alone must not be confused with proof of a particular training mechanism.
source_requirements: Primary model reports or technical evaluations describing both the model's approach and its measured performance.
