assessment_axis: historical_observation
explicit_source_elements:
  - Usership for ChatGPT
  - until May 2023
  - more or less stabilized since then
  - without significant further growth
evaluator_interpretation:
  - The main test is whether ChatGPT's overall active audience broadly plateaued between May 2023 and the post date.
  - Usership ordinarily includes people using the website and mobile apps. Website visits are an imperfect proxy, not a count of distinct users.
  - Significant growth means a clear, sustained increase beyond ordinary fluctuations; Marcus supplied no numerical threshold.
  - April 2024 is the last complete calendar month before the post. Later publications may provide evidence about that month, but subsequent growth cannot settle this historical claim.
support_condition: Consistent measurements covering ChatGPT's overall active audience show broadly unchanged usage from May 2023 through the period immediately preceding May 5, 2024.
contradiction_condition: Comparable measurements show a clear, sustained increase in ChatGPT's overall active audience during that period.
measurement_requirements: A consistent active-user series covering website and mobile-app use, with overlapping users deduplicated. Visits, downloads, and geographically limited app audiences cannot independently settle the overall claim.
source_requirements: Prefer company usage records or independent audience measurements with documented coverage. Secondary reporting must identify its measurement source.
