ambiguity_flags:
  - No regulatory pressure could mean no AI-specific rules or no applicable regulation at all.
  - Little has no quantitative threshold.
  - The company population and relevant time period are unspecified.
  - Ethical design and costs to society cover multiple distinct outcomes.
