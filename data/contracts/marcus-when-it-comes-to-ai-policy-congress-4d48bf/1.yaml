assessment_axis: causal_assessment
explicit_source_elements:
  - With no regulatory pressure
  - little incentive
  - safety, transparency, or ethical design
  - any costs to society would be borne by society
evaluator_interpretation:
  - This is a general causal claim about incentives under an absence of regulation, rather than a forecast with a deadline.
  - Little incentive means weak incentives to prioritize the named protections, not literally no incentive.
  - The social-cost clause means firms would leave harms substantially uncompensated or otherwise externalized.
  - Regulatory pressure must be separated from customer demand, reputation, employee preferences, and improvements to product usefulness.
support_condition: Credible comparative or causal evidence shows that removing regulatory pressure generally leaves weak incentives for the named protections and shifts resulting harms onto others.
contradiction_condition: Comparable evidence shows that substantial nonregulatory incentives generally sustain these protections and cause firms to absorb the relevant social costs.
measurement_requirements: Measure protection efforts, their effectiveness, and who bears resulting harm. Isolate regulatory effects and distinguish safety from transparency and ethical design.
source_requirements: Comparative empirical studies or credible natural experiments. Economic models and voluntary research activity alone cannot settle the full claim.
