explicit_source_elements:
  - all four
  - are certain to become
  - repeat visitors to the bond markets
evaluator_interpretation:
  - "'All four' refers to Meta, Alphabet/Google, Amazon and Microsoft."
  - The plain reading requires each company to complete at least one additional bond issuance after July 28, 2026.
  - This assesses the occurrence of issuance, not the amount of debt raised.
  - The following analyst estimate over five years does not supply an explicit deadline for Zitron's sentence.
  - Subsidiary or special-purpose-vehicle issuance counts only if it is demonstrably an obligation of the named company. Equity offerings, bank loans and secondary-market trades do not count.
support_condition: Dated issuance records establish a further completed bond offering after publication for each of the four named companies.
contradiction_condition: A decisive event makes a future bond-market return permanently impossible for at least one named company. Mere non-issuance by the evaluation date is insufficient.
measurement_requirements: Verify issuer identity and completion date for each company. Distinguish proposed offerings from completed issuance and bonds from other financing.
source_requirements: Prefer issuer filings, final offering documents or closing announcements. Use reputable reporting where readable primary records are unavailable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Support once the last of the four companies completes a qualifying post-publication bond issuance. Issuance by fewer than four cannot settle the whole claim.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - "'Repeat visitors' could suggest multiple future visits rather than one further visit."
  - Treatment of subsidiary and special-purpose-vehicle borrowing is unspecified.
