  - burning money to make money
  - one day will make more money
  - no clear path to doing so
evaluator_interpretation:
  - The ordinary reading is that generative AI businesses were consuming cash without an adequately demonstrated route to sustained profitability. It is not a prediction that revenue would never grow.
  - The surrounding discussion makes OpenAI and Anthropic central examples, but does not define a complete industry population.
  - Because no reporting period is named, use April–June 2024, the latest completed calendar quarter before publication, for the ongoing cash-burn observation.
  - Assess the clarity of the business route using information available by July 8, 2024. Later disclosures may establish earlier financial facts, but later business developments cannot establish what was clear then.
  - The sentence identifies no accounting basis or financial source. Its accounting basis therefore remains unknown.
support_condition: Comparable financial records would establish cash consumption across the businesses described, while contemporaneous business plans and unit economics would fail to demonstrate a credible route to covering their full costs.
contradiction_condition: Comparable records would establish sustained positive cash generation across the businesses described, or contemporaneous evidence would demonstrate a credible route to sustained profitability. Revenue growth alone would not suffice.
measurement_requirements: Distinguish net cash consumption from accounting losses, operating expenses, financing and revenue. Evaluate profitability plans against their revenue, service-cost, research-cost and overhead assumptions.
source_requirements: Prefer company financial statements and contemporaneous business projections. Clearly identified press estimates may provide context, but cannot repair the claim's unspecified accounting basis.
