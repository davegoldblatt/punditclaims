assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI is locked in the Red Queen's Race
  - burning money to make money
  - in an attempt to prove that they one day will make more money
  - despite there being no clear path to doing so
evaluator_interpretation:
  - The plain, checkable core is that the leading generative AI companies, which the passage names as OpenAI and Anthropic, were spending far more than they earned, losing money while chasing revenue growth.
  - "'No clear path' to profit is a forward-looking judgment. It is weighed through whether the companies were profitable or close to it, not by trying to prove a negative about future plans."
  - He named no period. The claim describes the state at the time of the July 2024 post. Calendar year 2024, the annual period that includes the post, is used because these companies' losses are reported annually. No narrower quarter is imposed.
support_condition: Reliable reporting or filings show that leading generative AI companies such as OpenAI and Anthropic lost large sums in 2024 relative to their revenue, while still projecting future growth.
contradiction_condition: Reliable reporting or filings show that the leading generative AI companies were profitable or close to break-even in 2024, so they were not burning money.
measurement_requirements: Reported 2024 net or operating losses, or cash burn, for OpenAI and Anthropic, compared with their 2024 revenue.
source_requirements: Company filings or prospectuses, or reputable news reports based on company documents, published on or before the evaluation date.
