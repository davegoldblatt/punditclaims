assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI currently faces
  - at least eight
  - wrongful death lawsuits
  - from survivors of lost ChatGPT users
evaluator_interpretation:
  - Count distinct lawsuits pending against an OpenAI entity on January 15, 2026, the post date.
  - Each qualifying lawsuit must seek recovery for the wrongful death of someone who used ChatGPT, brought by surviving relatives or an estate representing their interests.
  - Count lawsuits, not plaintiffs, defendants, causes of action, or amended complaints.
  - A lawsuit concerning someone killed by a ChatGPT user does not qualify without evidence that the deceased person was also a ChatGPT user.
  - The claim concerns the existence of lawsuits, not whether their allegations have been proved.
  - Because 'currently' describes an ongoing legal status, use the publication-day snapshot, the latest period contemporaneous public records could describe.
support_condition: Identify at least eight distinct qualifying lawsuits pending on January 15, 2026, with evidence identifying the deceased ChatGPT user, surviving claimant or estate, OpenAI defendant, and wrongful-death claim.
contradiction_condition: A sufficiently comprehensive record establishes that fewer than eight qualifying lawsuits were pending on January 15, 2026. Finding fewer than eight through an incomplete search is insufficient.
measurement_requirements: A deduplicated case inventory, including filing dates, case numbers, parties, wrongful-death claims, evidence of each deceased person's ChatGPT use, and status on the target date.
source_requirements: Prefer complaints, dockets, and court orders. Contemporary reporting may establish case existence, but an unexplained aggregate count cannot resolve a material mismatch in who qualifies.
