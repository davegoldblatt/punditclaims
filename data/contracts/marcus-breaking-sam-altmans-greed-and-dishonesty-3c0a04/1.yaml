evaluator_interpretation:
  - "Plain reading of the factual core: (a) Altman publicly sided with Anthropic's red lines during its Pentagon dispute; (b) at the same time OpenAI was negotiating its own Pentagon deal, which it announced hours after Anthropic was cut off; (c) the deal's terms were widely seen as leaving room for surveillance uses; (d) a large public backlash followed."
  - "'Two-faced' and 'last straw' are characterisations. They are not graded beyond whether these facts and a large backlash occurred."
  - "Target period: February 26 to March 7, 2026, from the memo to the post date."
support_condition: Reports show Altman expressed support for Anthropic's red lines while his company was concluding its own Pentagon deal. The deal's surveillance terms were criticised and later tightened. A large user backlash followed.
contradiction_condition: Evidence that OpenAI was not negotiating with the Pentagon while Altman voiced support, that the deal's surveillance terms were never in question, or that there was no notable public backlash.
