explicit_source_elements:
  - “I support Dario”
  - negotiating behind his back
  - open to surveillance
  - was, for many people, the last straw
evaluator_interpretation:
  - Assess the factual assertions within the criticism. 'Two-faced' is an evaluative characterization, not a separate measurable outcome.
  - Public support means statements backing Amodei or Anthropic's position in the Pentagon dispute; the quoted wording need not be a verbatim Altman statement.
  - "'Behind his back' means relevant negotiations were concealed from Amodei or conducted without his knowledge while Altman professed support. Concurrent negotiations alone do not establish this."
  - In context, 'open to surveillance' means willingness to permit the disputed domestic surveillance of Americans, shown by statements, negotiating records or accepted terms. Military cooperation or concerns about loopholes alone are insufficient.
  - "'The last straw for many people' means the alleged conduct prompted a substantial group to withdraw support, use or employment. It does not require a majority, but criticism or download changes alone do not establish their reasons."
  - The target covers the late-February Pentagon negotiations and ensuing reaction through March 7. February 26 marks the beginning of the immediately preceding support-and-negotiation episode described in context.
  - All substantive components must be established to support the full claim. Missing evidence of concealment or willingness is not evidence that either allegation is false.
support_condition: Records establish public support for Amodei's position, overlapping negotiations concealed from him or conducted without his knowledge, willingness to permit the disputed surveillance, and substantial withdrawal of support attributable to that conduct by March 7.
contradiction_condition: Reliable records affirmatively refute a substantive component, such as showing Amodei was informed throughout the relevant negotiations or establishing that Altman rejected the disputed surveillance throughout them. A denial alone is insufficient. Mixed requires established true and false components, not merely established and unknown ones.
measurement_requirements: Establish the sequence of statements and negotiations, Amodei's knowledge, the surveillance uses permitted or rejected, and people's stated reasons for withdrawing support. Distinguish original terms from later amendments.
source_requirements: Prefer public statements, complete contract versions, correspondence and direct accounts. Use reputable reporting for private negotiations and audience behavior where primary records are unavailable.
