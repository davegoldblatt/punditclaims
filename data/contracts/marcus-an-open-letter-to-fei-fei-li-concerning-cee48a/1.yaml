contradiction_condition: Reliable regulatory records show that safety evaluation against defined requirements was generally absent in the named industries, making the asserted cross-industry practice materially inaccurate.
measurement_requirements: Identify concrete requirements imposed on manufacturers or approval applicants. Distinguish manufacturer evaluation from government testing and premarket approval from self-certification.
