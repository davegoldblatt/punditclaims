evaluator_interpretation:
  - “Apparently” qualifies the causal account. Marcus presents an uncertain explanation, rather than an unqualified assertion of demonstrated damage to trust.
  - The disclosure allegation is independently checkable, but checking that component does not settle the whole claim as worded.
  - Treating regulatory sanctions as a measure of a “major trust wound” would add a criterion Marcus did not specify. The plain-reading exception for firm language does not apply.
support_condition: No binary support criterion applies under the supplied rule for hedged claims. Records establishing nondisclosure and resulting regulatory distrust could corroborate the account without making its uncertain wording a firm claim.
contradiction_condition: No binary contradiction criterion applies without strengthening the statement. Records establishing prompt disclosure or rejecting the alleged causal connection could undermine the account, but would not supply its missing commitment.
