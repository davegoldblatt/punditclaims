evaluator_interpretation:
  - The relevant episode is the October 2 collision and Cruise's disclosures and regulatory consequences through October 27, 2023.
  - A major trust wound means a substantial documented loss of confidence among regulators or other important stakeholders.
  - Not initially acknowledging includes failing to affirmatively disclose the dragging. It does not require proof of intentional concealment.
  - Apparently expresses uncertainty about the causal account; it is not a conditional antecedent.
support_condition: Records establish both an initial disclosure failure concerning the dragging and a substantial loss of regulatory or stakeholder confidence attributable in part to that failure.
contradiction_condition: Records establish timely, adequate disclosure, or show that the alleged trust damage was unrelated to disclosure and arose solely from the collision.
measurement_requirements: Separate the initial collision, subsequent dragging, disclosure failures, and their consequences. A documented regulatory response can establish substantial trust damage without a public-opinion survey.
source_requirements: Regulatory findings and contemporaneous decisions, checked against Cruise's account and any investigation addressing its attempts to disclose video.
