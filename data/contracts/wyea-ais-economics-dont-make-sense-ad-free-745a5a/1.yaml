assessment_axis: forecast_outcome
explicit_source_elements:
  - If OpenAI can't raise $852 billion in revenue and funding
  - by the end of 2030
  - it won't be able to pay for Stargate
  - That'll kill the value of Oracle's stock
  - leading to a series of margin calls
  - leading to Ellison having to sell shares
  - in the space of 4 years
evaluator_interpretation:
  - I read this as a conditional forecast. The condition is that OpenAI's combined revenue and new funding, from about the post date (April 2026) through 2030-12-31, adds up to less than $852 billion. The predicted results are that OpenAI cannot pay its Stargate commitments, Oracle's stock falls sharply, margin calls hit Larry Ellison's pledged Oracle shares, and he is forced to sell shares.
  - The phrase 'in the space of 4 years' suggests the count starts around the post date, not at OpenAI's founding. That is my reading.
  - The condition can only be checked at the end of 2030. Before then it is unknown, unless something decisive happens first, such as OpenAI publicly defaulting on Stargate after confirmed under-raising.
support_condition: OpenAI's revenue plus funding from April 2026 through 2030 comes to less than $852 billion, OpenAI cannot pay its Stargate obligations, Oracle's stock collapses, and reliable reports or filings show margin calls or forced sales of Ellison's pledged Oracle shares.
contradiction_condition: OpenAI falls short of $852 billion by end-2030, but it still pays for Stargate, or Oracle's stock does not collapse, or Ellison faces no margin calls or forced share sales. If OpenAI reaches $852 billion, the condition is not met and the forecast cannot be scored.
measurement_requirements: Sum OpenAI's recognized revenue and its completed new funding (equity and debt actually received) from 2026-04-28 to 2030-12-31. Check whether OpenAI met its Stargate payment obligations. Track Oracle's share price. Check Oracle proxy filings and SEC filings for margin calls or forced sales of Ellison's pledged shares.
source_requirements: OpenAI financial disclosures (or an IPO prospectus if it goes public), funding announcements, Oracle 10-K, 10-Q and proxy filings, SEC Forms 4 for Ellison's sales, and reputable financial news.
metric_scope:
