  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: by the end of 2030
horizon_interval:
  start: 2026-04-28
  end: 2030-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Before 2030 ends, the forecast can be settled early only by one of two things. First, if OpenAI publicly defaults on or abandons its Stargate obligations because it lacks funds, and margin calls or forced sales of Ellison's pledged Oracle shares then follow, the forecast is supported. Second, if OpenAI has already received $852 billion in revenue plus funding since April 2026, the condition fails…
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Unclear whether the $852 billion counts from the post date or includes funding raised before it.
  - Unclear whether 'funding' means only money actually received or also commitments, including conditional tranches.
  - "'Kill the value' of Oracle's stock has no stated threshold."
  - Unclear whether 'Stargate' means only the Oracle contracts or all of OpenAI's Stargate commitments.
retrospective_or_prospective: prospective
