evaluator_interpretation:
  - The ordinary financial reading is that the existing business does not cover its costs and needs outside financing to continue unchanged. This does not necessarily predict bankruptcy.
  - For the ongoing observation, use July–September 2024, the latest completed calendar quarter before publication. The surrounding annual forecasts are relevant context but do not establish that quarter's results.
  - Treat the financial basis as an estimate because the surrounding argument relies on press reports of private financial information.
support_condition: Comparable results for the target quarter show losses, and cash-flow and liquidity evidence establish that continuing the existing business requires outside financing.
contradiction_condition: Comparable results show that the existing business covers its costs and can finance its continuing operations without additional outside funding.
measurement_requirements: Quarterly revenue, expenses, losses, cash consumption and available liquidity, with consistent accounting definitions. Fundraising alone does not establish operating losses or financial necessity.
source_requirements: Company financial records or independently verified reporting on those records. The speaker's own conclusions are insufficient.
