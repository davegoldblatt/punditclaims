explicit_source_elements:
  - a new blue-ribbon commission
  - in large part made up of the same tech CEOs
  - basically it’s regulatory capture all over again
evaluator_interpretation:
  - The referenced body is the DHS Artificial Intelligence Safety and Security Board announced on April 26, 2024.
  - The ordinary meaning of regulatory capture is industry control or material redirection of public oversight toward industry interests.
  - Industry representation, conflicts of interest and weak safeguards can establish vulnerability to capture. They do not alone prove that capture occurred.
  - The assessment concerns the board's establishment and initial governance as described at publication, rather than its later performance.
support_condition: Governance records or contemporaneous communications establish that industry controlled the board's public oversight function or materially redirected it toward industry interests.
contradiction_condition: Records affirmatively establish independent control and decision-making over the disputed function, sufficient to rebut the alleged industry domination. A diverse membership list alone is insufficient.
measurement_requirements: Examine membership, appointment and voting powers, mandate, safeguards and documented influence over decisions. Separate access and potential conflicts from demonstrated control.
source_requirements: Official establishment and governance records, supplemented by authenticated communications, investigations or documented decision histories.
