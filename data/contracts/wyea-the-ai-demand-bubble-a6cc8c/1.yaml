explicit_source_elements:
  - their largest cloud customers
  - two companies
  - cannot afford to pay them
  - without a near-infinite flow of venture capital or debt
evaluator_interpretation:
  - The two companies are OpenAI and Anthropic; the providers are AWS, Azure and Google Cloud.
  - Largest means customer spending recognized as cloud revenue, rather than contract face value, model popularity or revenue backlog.
  - I read the labs as the leading customers across these relationships, without requiring each lab to occupy the same rank at every provider.
  - Near-infinite is rhetorical emphasis on continuing substantial external financing, not a literal infinite amount.
  - The affordability assertion concerns maintaining payments under the described operations without repeated new financing, not immediate insolvency despite existing cash.
  - I use April–June 2026, the latest completed reporting quarter before the post.
  - Customer revenue rankings are treated as estimates because the surrounding argument relies on analysts' estimates.
support_condition: Comparable customer rankings identify the labs as the leading cloud customers across the named providers, and financial records show that both require continuing new venture capital or debt to maintain the associated payments.
contradiction_condition: Comparable rankings show other customers displacing the labs from the claimed leading positions, or financial records establish that a lab can sustain the relevant payments without continuing new financing.
measurement_requirements: Rank customers by recognized cloud revenue for the same period. Assess affordability using operating cash generation, existing liquidity, payment schedules and capital needs; neither accounting losses nor fundraising totals alone establish inability to pay.
source_requirements: Customer-level provider disclosures or credible rankings, together with lab financial statements or independently sourced cash-flow and liquidity records.
