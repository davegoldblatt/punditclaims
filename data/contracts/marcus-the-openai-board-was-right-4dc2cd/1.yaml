explicit_source_elements:
  - the claim that the resemblance to ScarJo was a “coincidence” was a lie
  - Sam knew perfectly well what the character sounded like
evaluator_interpretation:
  - The claim alleges a knowingly false denial, not merely an inaccurate statement.
  - Knowing what a voice sounds like, or noticing a resemblance, does not by itself establish knowledge that the resemblance was deliberately created.
  - The target period covers Altman's conduct around the May 2024 demonstration and denial through the post date.
support_condition: Evidence establishes both intentional Johansson resemblance and Altman's knowledge of that intention when he denied it.
contradiction_condition: Reliable evidence establishes that the denial was true, or that Altman did not know it to be false when he made it.
measurement_requirements: Assess the denial's truth and Altman's contemporaneous knowledge separately. A film reference or request to hire Johansson is circumstantial evidence.
source_requirements: Prefer authenticated communications, direct admissions, credible testimony about Altman's involvement, or adjudicated findings. Public statements alone do not establish private knowledge.
