evaluator_interpretation:
  - Assess the normalized funding proposition. The separate forecast about 2026 cash burn is outside this claim's screened scope.
  - "Use the two years ending on publication: June 23, 2024 through June 23, 2026."
  - Read the qualification as allowing the full announced amounts of the latest rounds, rather than asserting that every installment had already been paid.
  - Count primary financing received by the companies or committed in the qualifying rounds. Exclude valuations, secondary share sales, customer revenue, infrastructure purchase commitments, and undrawn credit facilities.
  - Count investor commitments embedded in later rounds once. Do not count subsequent fundraising announced after the post.
  - The words do not identify whether the aggregate comes from company-reported figures or press estimates. Preserve an unknown accounting basis rather than silently choosing one.
  - Read 'close to' as an approximate total, without inventing a precise percentage tolerance.
support_condition: A complete, non-duplicative financing ledger for both companies over the two-year period, counting the latest announced rounds in full under the stated assumption, establishes an aggregate reasonably described as close to $300 billion on a specified basis.
contradiction_condition: A complete ledger on that same basis establishes a materially different total. An incomplete subtotal or the fact that committed installments remain unpaid does not alone contradict this qualified claim.
measurement_requirements: Reconcile announcements, round extensions, strategic investments, embedded commitments, closing conditions, and financing dates. Separate cash received from committed capital and identify the treatment of convertible instruments.
source_requirements: Company or investor announcements, financing records, and reliable reporting where primary records are unavailable. A verdict requires a complete aggregate rather than selected large rounds.
