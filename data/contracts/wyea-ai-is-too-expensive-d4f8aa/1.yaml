assessment_axis: forecast_outcome
explicit_source_elements:
  - I think it’s fair to assume
  - at least $20 billion
  - operating expenses
  - across that four year period
evaluator_interpretation:
  - Treat this as a qualified numerical forecast rather than a condition dependent on a separate event.
  - Read the four-year period as May 19, 2026 through May 19, 2030, following 'the next four years' in the preceding paragraph.
  - Read operating expenses as additional non-compute operating costs, because the preceding tally already counts compute commitments.
  - The context concerns money Anthropic must make or raise. Any use of accounting expenses must therefore reconcile noncash charges and avoid double-counting compute.
  - Do not substitute four times a current annual run rate for actual cumulative expenses.
support_condition: Comparable records establish at least $20 billion of additional non-compute operating costs attributable to the specified four-year period.
contradiction_condition: Complete records for the four-year period establish less than $20 billion on the same scope and basis.
measurement_requirements: Separate compute from other operating costs, reconcile cash funding needs and noncash accounting charges, and allocate expenses to the forecast window.
source_requirements: Anthropic financial disclosures or reliable reporting with an explicit non-compute expense breakdown and period.
metric_scope:
