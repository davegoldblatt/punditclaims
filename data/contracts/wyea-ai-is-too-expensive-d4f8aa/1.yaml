  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Support early only if documented cumulative qualifying costs within the forecast window already reach $20 billion and cannot fall below it through reversals. Contradict early only after permanent cessation and final accounting establish a lower total with no remaining qualifying costs.
