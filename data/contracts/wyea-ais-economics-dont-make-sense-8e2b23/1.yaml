explicit_source_elements:
  - Oracle is insufficiently-capitalized
  - finish Stargate Abilene
  - at least another $150 billion
  - assuming that other partners pick up about $30 billion in costs
evaluator_interpretation:
  - Assess a present estimated funding shortfall, not a forecast that Oracle must eventually raise a particular amount.
  - Use Oracle's latest reported fiscal quarter before publication, ending February 28, 2026, as the financial baseline. Any subsequent financing requires a separately dated adjustment.
  - The plain reading concerns completing the named Abilene campus, including its computing equipment. The surrounding discussion also refers to several Stargate sites; those scopes cannot be silently combined.
  - Treat the $30 billion partner contribution as a modeling assumption, not an assertion that such funding had already been committed.
support_condition: An Abilene-specific completion budget and financing reconciliation establishes that Oracle needs at least $150 billion beyond its available and committed capital, after allowing approximately $30 billion from partners.
contradiction_condition: A comparable Abilene-specific reconciliation establishes a funding gap below $150 billion, or establishes that existing resources cover completion.
measurement_requirements: Separate buildings, power infrastructure, computing equipment, amounts already spent, remaining costs, committed financing, unrestricted capital and partner contributions. Avoid counting the same financing twice.
source_requirements: Oracle filings and project disclosures, supplemented by attributable estimates where necessary. Company-wide borrowing and a developer's construction financing cannot alone establish Oracle's site-specific shortfall.
