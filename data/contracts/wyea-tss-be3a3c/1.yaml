  - deeply unprofitable and unsustainable
  - world of generative AI
evaluator_interpretation:
  - Assess the normalized claim about generative AI economics, not the separate assertions about Nadella or layoffs.
  - The ordinary reading is that generative AI revenues substantially fail to cover development and operating costs, and that current operations depend on continuing subsidy or changed economics.
  - Use January–March 2024, the latest normally reportable financial quarter before publication. The post supplies no reporting period.
  - The statement identifies neither an industry aggregation method nor an accounting basis. Microsoft is named as a participant, not as the exclusive financial subject.
  - Treat unsustainable as a characterization of current economics, not an independently dated prediction of collapse.
support_condition: Comparable, representative financial records show substantial full-cost losses from generative AI activities during the target period and continuing dependence on subsidy.
contradiction_condition: Comparable, representative records show generative AI activities covering their full costs and sustaining operations from earned revenue during the target period.
measurement_requirements: Separate generative AI revenue and attributable development, inference, staffing and infrastructure costs. Specify expense allocation and accounting treatment. Do not substitute parent-company profits, investment proceeds or annualized revenue.
source_requirements: Prefer financial statements or company disclosures. Clearly identified press estimates may provide context but must match the period and financial measure.
