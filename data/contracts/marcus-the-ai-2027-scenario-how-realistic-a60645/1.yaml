  - except in about 10
  - the world’s 20,000 cities
evaluator_interpretation:
  - The main observation concerns deployment immediately before the post. Use May 1–22, 2025 as the current monthly snapshot.
  - Driverless service means ordinary passengers can obtain rides without an onboard safety driver. Announced launches, permits alone, supervised services, and closed testing do not qualify.
  - Cities must be counted consistently across countries, without adding overlapping operators' footprints.
  - The 2012 promise is a separate historical component. Its original wording must support universal availability rather than merely initial public access.
  - About ten permits approximation, but the speaker supplies neither a tolerance nor a definition of city.
support_condition: A contemporaneous worldwide inventory establishes approximately ten qualifying cities, a compatible geographic definition supports the denominator, and an identifiable 2012 statement supports the claimed 2017 promise.
contradiction_condition: Comparable records establish a materially different deployment count or denominator, or the identified promise materially differs from universal availability by 2017.
measurement_requirements: A deduplicated city list with operational dates, passenger access, onboard supervision status, and consistent geographic units.
source_requirements: Operator and regulator records for deployment; original recordings or reputable contemporaneous reporting for the 2012 promise; a defined statistical source for the denominator.
