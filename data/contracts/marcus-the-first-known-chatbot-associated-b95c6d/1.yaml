assessment_axis: forecast_outcome
explicit_source_elements:
  - As chatbots and chat-based search grow in popularity
  - large language models will serve up a lot of incompetent advice
  - there will be real harm to mental and physical health
evaluator_interpretation:
  - Growth in chatbot and chat-based-search use is an antecedent, not merely background.
  - Read a lot as repeated, non-isolated materially deficient advice; no numerical prevalence threshold is supplied.
  - Read the health statement as predicting actual injuries attributable at least partly to deficient advice or guidance, including exacerbation of existing illness.
  - Both mental and physical health are included. Potentially harmful answers alone do not establish actual injury.
  - Clinical evidence may establish contribution without proving that chatbot use was the sole cause. Allegations or temporal association alone are insufficient.
  - There is no deadline.
support_condition: After adoption grows, repeated materially deficient advice is documented and credible clinical or equivalent records establish actual mental and physical injury to which that advice contributed.
contradiction_condition: A decisive event permanently rules out the predicted outcomes under the stated condition. A finite period without documented injury cannot falsify this forecast without a deadline.
measurement_requirements: Adoption trends, repeated evaluations of advice, and dated injury records linking identifiable chatbot guidance to harm. Separate simulated risks, patient recollections and verified conversation records.
source_requirements: Prefer company adoption disclosures, clinical evaluations and patient records reported in research. Distinguish allegations from established clinical findings.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Resolve early as supported only when post-publication adoption growth, repeated deficient advice, and documented mental and physical injuries attributable to that advice jointly establish the forecast. The decisive injury must be dated; a publication date alone is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - A lot has no numerical threshold.
  - The required strength of causal attribution is unstated.
  - Mental and physical health could describe two required categories or an inclusive description of health harms.
retrospective_or_prospective: retrospective
