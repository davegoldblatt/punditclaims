  - There’s real revenues
  - people are paying it money
evaluator_interpretation:
  - Read this as a claim about OpenAI and established AI businesses discussed in the post, not every enterprise using an AI label.
  - Use calendar 2025, the latest completed annual operating period before publication, for the ongoing revenue assertion. The speaker names no reporting period.
  - Distinguish genuine customer revenue from the broader claim about how investor returns are funded. Real sales alone cannot establish the latter.
  - No accounting basis or revenue measure is supplied for this assertion; the contract therefore records an unknown basis.
support_condition: Records establish genuine customer revenue and a business and investor-payment structure inconsistent with using new investor funds to pay purported returns to earlier investors.
contradiction_condition: Reliable financial tracing or adjudicated findings establish a Ponzi structure in the relevant businesses, or establish that the claimed customer revenue was fictitious.
measurement_requirements: Separate customer payments, recognized revenue, annualized revenue, financing inflows, and payments to investors. Revenue evidence alone settles only the revenue premise.
source_requirements: Financial statements, customer-payment evidence, investor-distribution records, and relevant regulatory or court findings. Absence of a fraud finding is not proof of the negative.
