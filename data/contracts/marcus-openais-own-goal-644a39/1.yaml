support_condition: The email and contemporaneous public commitments establish that leadership had already adopted a materially less-open policy than it knowingly represented publicly.
contradiction_condition: The records establish that the intended policy matched the public commitment, or that reduced openness was only a later change rather than an existing intention.
measurement_requirements: Compare the email's temporal and conditional language with the scope and qualifications of contemporary public commitments.
source_requirements: Prefer the released correspondence and founding announcement. Treat company litigation narratives as interested interpretations.
