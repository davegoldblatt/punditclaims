explicit_source_elements:
  - both OpenAI and Anthropic
  - letting people burn thousands of dollars
  - $100-a-month or $200-a-month subscription
  - neither of them has some magical way of making inference cheap enough
evaluator_interpretation:
  - The ordinary reading concerns actual inference expenses incurred by each provider for heavy subscribers, rather than the retail API price of equivalent usage.
  - The claim concerns some heavy subscribers, not necessarily the average subscriber or every subscription.
  - Use April 2026, the latest complete monthly billing period before publication, for this ongoing monthly-cost observation.
  - Interpret 'justify' as covering the inference expense from the subscription payment. Broader strategic benefits are not measurable from this wording.
  - No accounting basis or identifiable financial source is supplied for this assertion. The contract therefore records an unknown basis.
support_condition: Comparable subscriber-level records show that both companies incurred thousands of dollars in actual monthly inference expenses for users paying $100 or $200, after applicable serving efficiencies.
contradiction_condition: Comparable records for either company establish that the alleged thousands of dollars represented retail API value and that actual inference expenses for the relevant heavy usage were covered by the subscription payment.
measurement_requirements: Matched monthly usage, subscription receipts and actual serving expenses for each company, including discounts, caching and hardware utilization. Distinguish heavy-user losses from average subscription profitability.
source_requirements: Provider cost records or independently verified measurements with a disclosed cost method. API-price conversions and company-wide losses cannot establish the claimed subscriber costs.
