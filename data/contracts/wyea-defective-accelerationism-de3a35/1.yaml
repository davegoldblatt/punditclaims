assessment_axis: historical_observation
explicit_source_elements:
  - exit liquidity for its founders, staff and VCs
  - rushed out
  - using financial engineering
  - “profitable” for a single quarter
  - before hundreds of billions of commitments began
evaluator_interpretation:
  - The plain reading is that the IPO enabled insider cash-outs and that financial arrangements or accounting treatments created a temporary appearance of profitability.
  - Providing liquidity does not by itself establish that insider exits were the principal purpose of the IPO.
  - The claim describes the IPO and an earlier quarter, but does not identify that quarter or distinguish operating income, net income and adjusted earnings. The target period therefore has an unspecified beginning and ends at publication.
  - Evidence of deliberate acceleration or misleading presentation requires more than the existence of ordinary IPO sales and disclosed accounting adjustments.
support_condition: Offering and sale records establish the claimed insider liquidity, and financial reconciliations identify arrangements responsible for the apparent profitable quarter. Evidence also connects the offering's timing and presentation to the asserted purpose.
contradiction_condition: Comparable records establish that the claimed liquidity did not occur or that profitability on the intended measure did not depend on the alleged financial arrangements. Evidence that the offering mainly raised corporate capital would challenge, but would not alone disprove, the asserted motive.
measurement_requirements: Distinguish primary issuance from secondary sales, sale eligibility from completed sales, and operating income from net income and adjusted earnings. Identify the quarter and the accounting treatment alleged to create profitability.
source_requirements: Final prospectus, selling-stockholder disclosures, completed-sale records and quarterly financial reconciliations; contemporaneous records for the asserted motive and rushed timing.
