evaluator_interpretation:
  - The claim concerns training that had occurred by publication on 2024-01-24. It specifies no starting date.
  - "“Some” is an existence claim: a documented example of a popular image generator is sufficient."
  - “Popular” means widely used. No particular user count or market share is required.
  - Copyrighted images include licensed copyrighted images. The claim does not require proof of unauthorized use or copyright infringement.
  - This assessment tests the stated training fact, rather than whether Marcus and Southen's images alone established it.
support_condition: Reliable records establish that at least one widely used generative image system had trained on images protected by copyright by 2024-01-24.
contradiction_condition: Comprehensive reliable records establish that no popular generative image system had trained on copyrighted images by 2024-01-24. Permission to use copyrighted images would not contradict the claim.
measurement_requirements: Evidence must connect copyrighted images to actual model training. A dataset's existence or an allegation alone is insufficient. Widespread use must also be documented.
source_requirements: Prefer developer disclosures, documented training-data research, or court records distinguishing admissions and findings from allegations.
