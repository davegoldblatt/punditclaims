evaluator_interpretation:
  - An ordinary reading of sticky is a capability that keeps users returning over time.
  - The post expressly concedes recurring word-finding, question-formulation and brainstorming uses. Those uses alone cannot contradict the claim.
  - Because the claim describes an ongoing state without a reporting period, I use July through September 2024, the latest completed calendar quarter before publication.
  - Repeated voluntary use of writing, coding or another distinct capability could contradict the claim; feature availability or aggregate subscriber retention alone cannot.
support_condition: Feature-level longitudinal evidence shows that recurring engagement during the target period was confined to conversational search and the expressly conceded uses.
contradiction_condition: Credible longitudinal evidence identifies a capability beyond those uses that repeatedly brought users back during the target period.
measurement_requirements: Repeated visits or sessions linked to specific uses, with enough information to distinguish sustained voluntary use from one-time trials or assigned experimental tasks.
source_requirements: Product telemetry, independent longitudinal measurement or research reporting feature-specific repeat use.
