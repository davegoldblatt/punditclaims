assessment_axis: historical_observation
explicit_source_elements:
  - LLMs on their own
  - remain stuck
  - a complete, abstract, reliable representation of what multiplication is
evaluator_interpretation:
  - The plain reading is that contemporary tool-free LLMs still lacked dependable multiplication that generalized across problem sizes beyond their training distribution.
  - On their own excludes external calculators and executed programs. Training on worked examples and generating intermediate steps remain within scope.
  - The target is the 2023 research state through publication. Because models have no regular reporting period, I use the current calendar year through 2023-10-19.
  - This assesses demonstrated reliability, not permanent impossibility or a claim that performance had never improved.
support_condition: Controlled evaluations show substantial exact-answer failures on multiplication, particularly when problem complexity exceeds training coverage, despite relevant training or prompting.
contradiction_condition: Contemporary tool-free LLMs demonstrate consistently reliable exact multiplication across substantially greater operand sizes excluded from training, with adequate controls against leakage.
measurement_requirements: Exact-answer accuracy, documented training and test sizes, and disclosure of prompting, intermediate steps, and external tools. High accuracy within training lengths alone does not establish generalization to unseen lengths.
source_requirements: Primary experimental studies available by the post date, using versions that existed then.
