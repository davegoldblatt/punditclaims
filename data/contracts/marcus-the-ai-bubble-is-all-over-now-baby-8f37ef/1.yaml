explicit_source_elements:
  - the economics don’t make sense
  - in large part because of the core technical problems
  - since 2019
evaluator_interpretation:
  - The ordinary reading is that fundamental LLM limitations substantially explain why the boom's business economics are unsustainable.
  - Economic viability means earning commercial returns that cover the costs of developing and delivering the technology over time.
  - In large part requires a substantial causal contribution, not merely the coexistence of technical failures and financial losses.
  - This record assesses the causal explanation. The separate forecast record assesses never will.
  - No particular company, financial amount, or accounting basis is specified, so this is a general economic proposition rather than a company-metric claim.
support_condition: Representative financial and deployment evidence shows economically unsustainable LLM operations and identifies technical limitations as a substantial cause through lost demand, restricted uses, verification costs, or remediation.
contradiction_condition: Comparable evidence establishes durable economic viability despite the alleged limitations, or shows that those limitations do not substantially explain the financial constraints.
measurement_requirements: Link technical failure rates to commercial outcomes and distinguish their effects from investment timing, compute prices, competition, financing, and management decisions.
source_requirements: Financial records combined with deployment evidence or credible causal studies. Benchmark failures or business losses alone are insufficient.
