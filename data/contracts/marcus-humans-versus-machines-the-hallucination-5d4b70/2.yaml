ambiguity_flags:
  - Intentions, egos and emotional states have no operational definitions in the post.
  - Literal mental-state attribution and functional descriptions of behavior can produce different verdicts.
  - The post does not distinguish standalone language models from systems that give them tools and objectives.
  - The causal claim is read as concerning contemporary LLMs; no explicit temporal scope is supplied.
