support_condition: Reports showing Sutskever and Leike resigned and the Superalignment team was dissolved between about May 13 and May 21, 2024, plus evidence that OpenAI's Sky statements in that window were knowingly false.
contradiction_condition: Evidence that the resignations or the dissolution did not happen in that week, or that OpenAI's Sky statements were accurate.
