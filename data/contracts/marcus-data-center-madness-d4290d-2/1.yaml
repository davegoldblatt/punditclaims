evaluator_interpretation:
  - Assess the present political-liability assertion. The surrounding speculation about a possible bailout is not the proposition being graded.
  - The plain reading of politically toxic is that association with data-center development creates substantial public resistance and political pressure. It does not require universal opposition or an electoral defeat.
  - Use August 1–21, 2026, the current month through publication, as the reporting window for this ongoing political state.
support_condition: Contemporaneous evidence combines widespread public opposition with politicians distancing themselves, imposing restrictions, or treating support for development as an electoral vulnerability.
contradiction_condition: Representative polling and political records instead show broad public acceptance and no substantial political liability from supporting development.
measurement_requirements: Combine polling with observed political behavior. Distinguish electoral pressure from demonstrated causation of election results, and restrictions from permanent bans.
source_requirements: Primary polling and government records, supplemented by reputable reporting of campaign conduct and electoral concerns.
