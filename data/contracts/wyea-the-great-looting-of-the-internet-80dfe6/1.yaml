explicit_source_elements:
  - AI neither solves any real problems
  - nor actually makes them any money
  - Google, Meta, Microsoft and OpenAI
evaluator_interpretation:
  - The context limits AI to generative AI and identifies the four companies.
  - Read 'real problems' as practical tasks with observable benefits, rather than requiring universal reliability.
  - "Read 'makes them any money' as profit: the next sentence explicitly acknowledges OpenAI revenue while denying profitability."
  - Use January–March 2024, the latest completed calendar quarter that could be described before the April 15 post. Later publications may establish facts about that quarter.
  - The financial clause specifies no accounting basis. Preserve that uncertainty rather than substituting total-company earnings or revenue.
  - The contextual qualifications are scope restrictions, not forecast antecedents.
support_condition: Evidence establishes both the absence of practical benefits from the named companies' generative AI and the absence of attributable profit during the target period.
contradiction_condition: A documented practical benefit contradicts the usefulness clause; attributable generative-AI profit on an identified basis contradicts the financial clause. An overall financial verdict also requires resolving the unspecified accounting basis.
measurement_requirements: Separate practical outcomes from promotional claims, revenue from profit, and generative-AI results from the companies' broader businesses.
source_requirements: Prefer documented deployments and financial disclosures with identifiable periods and attributable costs.
