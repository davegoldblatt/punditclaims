assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic and OpenAI
  - $1.1 trillion in compute commitments
  - contingent on their continued growth
  - their customers are protesting their costs
  - the market is clearly saying
  - you are not worth a trillion dollars
evaluator_interpretation:
  - I read $1.1 trillion as the approximate combined outstanding nominal value of compute commitments, rather than annual spending or money already spent.
  - For the ongoing state, I use June 2026, the current month described by the post and its discussion of IPO deliberations.
  - Contingent on growth most naturally describes the economic ability to fund commitments; it does not necessarily assert contractual cancellation rights.
  - Customer protests means identifiable objections by customers to pricing or the amount of usage purchased, not universal customer dissatisfaction.
  - The preceding IPO discussion makes OpenAI's proposed trillion-dollar valuation a natural referent. Extending that conclusion to Anthropic or their combined value requires an additional interpretation.
  - The commitment total has no stated accounting basis or direct source attribution. Public contract announcements cannot establish a complete total without reconciliation.
support_condition: A dated, non-duplicated schedule establishes approximately $1.1 trillion of combined outstanding compute commitments in June 2026, financial evidence establishes dependence on continued growth, identifiable customers object to costs, and contemporaneous market evidence supports the valuation assertion for the intended company or companies.
contradiction_condition: A complete comparable schedule establishes a materially incompatible commitment total, or direct evidence refutes another specified component under the same scope. Partial contract totals, later valuations and financing alone cannot contradict the June assertion.
measurement_requirements: Separate binding minimum purchases, options, equipment leases, infrastructure investment plans and spending forecasts. Reconcile overlaps, payments already made and contract dates. Distinguish pre-money, post-money and proposed IPO valuations.
source_requirements: Prefer company and counterparty filings, contracts, financial schedules and completed financing disclosures. Use customer records for protests and reputable reporting for private IPO deliberations when primary records are unavailable.
