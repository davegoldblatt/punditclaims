assessment_axis: historical_observation
explicit_source_elements:
  - Neither of these companies can afford to slow down
  - in part because of their massive compute obligations
  - their massive valuations are based on them being able to pull in
  - at least in Anthropic's case, between $190 billion and $200 billion in annual revenue
  - within the next two years
evaluator_interpretation:
  - "The checkable parts are his stated reasons: (a) Anthropic and OpenAI have very large compute obligations; (b) Anthropic's valuation rests on reaching about $190-200 billion in annual revenue within about two years."
  - "'Cannot afford to slow down' is his judgment drawn from those facts. I test the facts it rests on. I do not test whether a slowdown would in fact be unaffordable, which no public evidence can show directly."
  - "'Within the next two years' from September 2026 is read as revenue for 2028, the year the reports name. That is about two years forward."
  - He describes the state at the time of the post. I use 2026-01-01 to 2026-09-29 so that standing compute deals and the August 2026 valuation reports count.
support_condition: Credible reports before the post show Anthropic's valuation or IPO pricing based on about $190-200 billion of revenue around 2028, and show very large compute commitments.
contradiction_condition: Credible reports show Anthropic's valuation rests on a much lower revenue forecast or on current results, or that its compute commitments are small or freely cancellable.
measurement_requirements: The revenue forecast used to value Anthropic and its target year; the size and terms of Anthropic's and OpenAI's compute commitments.
source_requirements: Company filings or announcements preferred. Reuters reports and reputable secondary coverage of them are acceptable because the IPO pricing basis is not public.
