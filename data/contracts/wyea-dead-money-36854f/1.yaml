assessment_axis: historical_observation
explicit_source_elements:
  - Neither of these companies can afford to slow down
  - massive compute obligations
  - massive valuations are based on
  - at least in Anthropic’s case
  - between $190 billion and $200 billion in annual revenue
  - within the next two years
evaluator_interpretation:
  - This is a claim about financial capacity and valuation assumptions current at publication, not Zitron's own prediction that Anthropic will achieve the revenue.
  - The plain reading of 'cannot afford' is that a material, sustained growth slowdown would undermine the companies' ability to finance their compute plans or sustain their valuations.
  - Use September 1–29, 2026 as the latest month-to-date reporting window for the ongoing financing position and valuation assumptions. Earlier financial periods are context only.
  - Read 'within the next two years' as by September 29, 2028. Annual revenue means revenue earned over a year, not annualized revenue from a shorter interval.
  - The supplied numerical assertion has no explicit source attribution or accounting basis. Its basis remains unknown rather than being inferred from subsequently found reporting.
support_condition: Contemporaneous investor models establish that Anthropic's valuation requires $190–200 billion of realized annual revenue by the stated deadline, and financing schedules or sensitivity analyses show that a material slowdown would undermine both companies' compute funding or valuations.
contradiction_condition: Comparable contemporaneous models show that the stated valuation assumption is incorrect, or demonstrate that either company could sustain a material slowdown while maintaining its compute funding and valuation. A cash balance alone is insufficient.
measurement_requirements: Obtain valuation models, revenue definitions, compute payment schedules, available liquidity and slower-growth scenarios for both companies. Keep projected annual revenue separate from run rate, financing proceeds and realized revenue.
source_requirements: Prefer investor presentations, financing agreements and company financial disclosures. Confidential assumptions may be documented by reputable reporting, with the lack of the underlying models stated.
