  - Anthropic and OpenAI
  - $3 to $13 per every dollar of subscription revenue
  - allow users to burn
evaluator_interpretation:
  - The plain reading is that subscription users can incur actual compute costs worth several times their subscription payments. This is a claim about permitted usage, not necessarily average subscriber consumption.
  - For the ongoing monthly economics, use February 2026, the latest completed subscription month before publication. The speaker supplies no reporting period.
  - Retail API prices and providers' actual compute costs are different measures.
  - No accounting basis, particular plans, workload, or comparison group is identified.
support_condition: Comparable measurements establish that Anthropic and OpenAI subscriptions permit actual compute expenditure of $3–$13 per subscription dollar and that their subsidies exceed those of other comparable providers.
contradiction_condition: Comparable measurements establish materially different permitted compute-cost ratios or show another provider offering a larger subsidy on the same basis.
measurement_requirements: Plan-specific subscription fees, enforceable usage limits, workloads, actual inference costs, and comparable competitor measurements. Separate maximum permitted consumption from average consumption and API retail value from underlying costs.
source_requirements: Company cost disclosures or independently documented measurements with a disclosed cost methodology. Funding totals and total company losses cannot establish subscription-level economics.
