assessment_axis: historical_observation
explicit_source_elements:
  - The company
  - recently walked back
  - its core safety pledge
evaluator_interpretation:
  - The company refers to Anthropic. This assessment covers the normalized safety-policy claim, not the separate allegation about writers.
  - The plain reading is that Anthropic materially weakened a central commitment to require adequate safeguards before advancing potentially dangerous AI systems. It does not mean Anthropic abandoned every safety commitment.
  - I interpret 'recently' as the weeks preceding the February 28, 2026 post and use February 1–28, 2026 as the target period.
  - I identify the core pledge as the Responsible Scaling Policy's commitment linking model training and deployment to adequate safeguards.
support_condition: Dated policy documents show that, during the target period, Anthropic removed, narrowed, or made nonbinding a central requirement to establish adequate safeguards before proceeding with potentially dangerous model development or deployment.
contradiction_condition: The policy record shows that the relevant central commitment remained substantively intact throughout the target period, or that the supposed revision strengthened or clarified it without weakening its requirements.
measurement_requirements: Compare the preceding policy with the revised policy, including binding requirements, exceptions, and retained pause commitments. Distinguish weakening a pledge from evidence about actual model safety.
source_requirements: Dated Anthropic policy versions and announcements available by October 28, 2026. Reporting may corroborate the comparison but cannot substitute for accessible policy text.
