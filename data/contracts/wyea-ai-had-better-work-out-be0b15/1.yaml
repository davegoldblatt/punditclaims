assessment_axis: forecast_outcome
explicit_source_elements:
  - to keep the party going
  - perpetual, parabolic growth
  - both AI revenues and AI capex
evaluator_interpretation:
  - The ordinary reading is that sustained investor enthusiasm and elevated AI-related equity valuations require continuing, rapidly accelerating growth in both AI revenue and capital spending.
  - Parabolic is read colloquially, not as an exact quadratic function.
  - Keeping the party going refers to the broad AI investment trade, not every individual stock rising every day.
  - This is a necessary-condition claim. A continuing trade without the specified growth could disprove it; growth and rising stocks occurring together would not establish necessity.
support_condition: Evidence would need to establish that sustaining the AI trade depends on accelerating growth in both revenue and capital spending. Finite observations can support that mechanism but cannot establish the literal perpetual requirement.
contradiction_condition: Comparable, realized revenue and capital-spending series show a sustained end to acceleration in either measure, while broad AI-related valuations remain sustained after investors have had time to absorb that information.
measurement_requirements: Use a consistent AI-company universe, comparable reporting periods, realized revenue and capital expenditures, and a reproducible measure of AI-related equity valuations. Separate changes in spending levels from changes in growth rates. A short market rebound or one company's results are insufficient.
source_requirements: Company financial disclosures and reproducible market-price records. Financial reporting may provide context but must not substitute forecasts for realized results.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A dated, sustained counterexample meeting the contradiction condition can resolve this open-ended necessity claim. A temporary rally cannot. No finite event can establish that the requirement holds perpetually.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No definition of the AI trade or its company universe.
  - No numerical meaning for parabolic.
  - No duration or valuation threshold for keeping the party going.
  - Perpetual is literally unbounded.
retrospective_or_prospective: retrospective
