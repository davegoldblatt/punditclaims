evaluator_interpretation:
  - "Plain reading: through the end of 2025, hallucinations (confident false outputs) stay a well-documented, consequential problem for leading generative AI models and their deployments. They need not be unchanged or rising. They need to remain a recognized, material problem."
  - Evidence can be lab evaluations of leading models, statements by the labs themselves, or documented real-world incidents during 2025.
support_condition: Credible 2025 evidence shows that leading models still hallucinate at material rates, or that the problem keeps causing documented harm, and that the labs themselves still treat it as unsolved.
contradiction_condition: Credible evidence shows that by late 2025 hallucinations in leading models had become rare enough that they were no longer a significant practical problem, for example near-zero rates on standard factuality evaluations and no notable incidents.
measurement_requirements: Hallucination rates on factuality evaluations for 2025 frontier models, lab statements, and documented 2025 incidents.
source_requirements: Lab system cards and papers, and reputable news reports of incidents.
