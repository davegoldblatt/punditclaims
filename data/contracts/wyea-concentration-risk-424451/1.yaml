assessment_axis: historical_observation
explicit_source_elements:
  - In virtually every case I’ve found
  - the AI startup “subsidizes” the AI use of their customers
  - way more than their monthly subscription in tokens
  - at either full or a slightly-discounted price
evaluator_interpretation:
  - The plain reading concerns almost all startups Zitron examined, not every AI startup.
  - A subsidy means permitted customer usage can incur actual provider charges substantially above the customer's subscription payment. It does not necessarily mean the average subscriber is unprofitable.
  - Both the subscription allowance and the startup's actual token purchase prices must be established.
  - I use August 2026, the last complete subscription month before publication, for this ongoing observation. The post does not specify a reporting period.
  - No numerical cutoff is imposed for 'virtually every', 'way more', or 'slightly-discounted'. Borderline cases cannot settle the claim.
support_condition: Records covering almost all identified startups in Zitron's research show subscription allowances permitting substantially higher actual token costs than subscription payments, with provider charges at or only modestly below corresponding list prices.
contradiction_condition: Records covering the identified research population show a substantial share did not permit such subsidies, or obtained discounts large enough to invalidate the near-list-price component.
measurement_requirements: Identify the research population, subscription tiers, usage allowances, actual input/output/cached-token mix, invoices, credits and negotiated discounts for the same month.
source_requirements: Dated subscription terms and provider contracts or invoices, supplemented by credible reporting on actual unit economics.
