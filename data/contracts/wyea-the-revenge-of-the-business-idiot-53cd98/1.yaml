evaluator_interpretation:
  - The firm commitment is a future severe AI-sector crash. 'I believe' introduces the prediction rather than a conditional antecedent.
  - In context, the claim concerns the AI investment boom centered on the named US hyperscalers and AI developers.
  - A crash means a broad, severe collapse in AI valuations accompanied by substantial disruption of financing, investment, or business activity.
  - No numerical drawdown threshold or deadline is supplied. Do not invent either.
support_condition: Dated evidence establishes a broad, severe AI-sector collapse after publication, with major damage beyond a brief or isolated stock-price correction.
contradiction_condition: No finite period of continued growth alone disproves an eventual crash without a deadline. Contradiction would require a terminal event that makes the forecast impossible under the same interpretation.
measurement_requirements: Compare representative AI-sector valuations, financing, infrastructure investment, and business activity over consistent periods. Establish breadth and severity rather than relying on one company.
source_requirements: Prefer market measurements, funding datasets, filings, and documented failures. Use reputable reporting for events that lack accessible primary records.
