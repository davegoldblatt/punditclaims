support_condition: Comparable AI data center financing yields are materially higher than earlier in 2026, and matched benchmark yields and credit spreads both contribute to that increase.
contradiction_condition: Comparable financing yields are not materially higher, or reliable decomposition contradicts one of the asserted benchmark-rate and risk-premium contributions.
measurement_requirements: Match maturity, credit quality, currency, collateral and guarantees. Measure all-in yields rather than comparing coupons alone. Do not use the 10-year Treasury for every debt maturity.
