evaluator_interpretation:
  - The main proposition concerns a majority, meaning more than half. The 80% figure concerns the cited study's employment and productivity findings.
  - The ordinary reading of little or no return is little or no significant financial benefit, rather than a formally calculated investment-return ratio.
  - For this ongoing observation, use the latest completed survey waves available before publication. Their fieldwork spans September 2025 through January 2026.
  - This is a claim about survey responses across businesses, not a particular company's financial accounts; metric_scope is null.
support_condition: A broad, credible CEO survey finds that more than half report no significant financial benefit from AI.
contradiction_condition: Comparable survey evidence establishes that most CEOs report significant financial benefits from AI during the relevant period.
measurement_requirements: Distinguish CEOs from other executives, financial benefits from productivity or employment changes, and all respondents from AI adopters alone.
source_requirements: Original survey results and methods. Check the cited study separately from other surveys.
