  - January through September 2025
  - around 26% of its lifetime compute spend
  - based on my own reporting
  - suggests this company’s compute spend is absolutely out of control
evaluator_interpretation:
  - Test the numerical spending assertion and its lifetime-spending comparison.
  - The numerator covers January through September 2025. The lifetime denominator refers to the CFO's March 2026 affidavit and must be checked separately.
  - The reference to his reporting establishes an estimate basis; it is not a conditional forecast.
  - The phrase out of control is an evaluative conclusion without a numerical test and is not independently scored.
  - A denominator exceeding $10 billion cannot simply be replaced with exactly $10 billion.
support_condition: Independent records establish approximately $2.66 billion of AWS spending during January–September 2025 and a comparable lifetime compute total that makes the share approximately 26%.
contradiction_condition: Independent comparable records establish materially different AWS spending or a lifetime compute total inconsistent with the claimed approximate share.
measurement_requirements: Identify payments versus accrued expenses, treatment of credits, AWS-only spending, and the lifetime denominator's date and coverage.
source_requirements: AWS billing records, Anthropic or Amazon disclosures, or independent reporting with access to underlying records. Repetitions of Zitron's reporting are not independent corroboration.
