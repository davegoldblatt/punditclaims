explicit_source_elements:
  - every AI startup
  - economically broken
  - at its foundation
evaluator_interpretation:
  - The ordinary reading is that every AI startup has a business model unable to cover its ongoing costs sustainably from customer revenue.
  - Temporary losses caused by expansion do not by themselves establish that a business model is fundamentally unsustainable.
  - Use calendar 2025, the latest complete annual financial period before the post, because the claim specifies no reporting period.
  - The surrounding discussion concerns generative-AI services. Whether the wording also encompasses other AI startups remains ambiguous.
support_condition: Comprehensive evidence establishes structurally unsustainable economics across the relevant startup population, including credible apparent exceptions.
contradiction_condition: At least one qualifying startup demonstrably sustains its service and necessary ongoing development from customer revenue on a disclosed, comparable cost basis.
measurement_requirements: Revenue, delivery expenses, recurring development and operating expenses, and financing dependence measured consistently. Revenue growth or a positive gross margin alone does not establish sustainability.
source_requirements: Company financial disclosures or well-supported independent financial analysis covering the target period.
