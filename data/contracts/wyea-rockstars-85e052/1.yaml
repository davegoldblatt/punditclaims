explicit_source_elements:
  - launch a robotaxi network
  - Musk has been lying
  - since 2019
evaluator_interpretation:
  - The period runs from 2019 through publication on October 14, 2024.
  - The ordinary meaning of lying includes knowing that a representation is false. Repeated missed forecasts alone do not establish that knowledge.
  - The context identifies the 2019 promise of robotaxis in 2020 as a central example. Later deployment cannot retroactively meet that deadline.
support_condition: Documented robotaxi launch representations beginning in 2019, their nonfulfillment, and credible evidence that Musk knowingly misrepresented readiness or expected delivery.
contradiction_condition: Evidence disproving the alleged pattern, such as fulfillment of the relevant promises or reliable contemporaneous records establishing that the alleged knowingly false representations were not made.
measurement_requirements: Separate promised dates, actual deployment, technical readiness, and evidence of Musk's knowledge when speaking.
source_requirements: Contemporaneous statements and deployment records, plus internal records, testimony, admissions, or adjudicated findings bearing on knowledge. Failed predictions alone are insufficient.
