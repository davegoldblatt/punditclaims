  - recognizing objects
  - not nearly as good at planning, or reading, or language comprehension
evaluator_interpretation:
  - The ordinary reading compares the maturity and reliability of deep learning across the named abilities, rather than comparing unrelated benchmark percentages.
  - Reading is understood as understanding written material, given its pairing with language comprehension.
  - Human-relative task reliability is a useful comparison standard, but Marcus supplies neither this measure nor a required size of gap.
  - The observation concerns the current 2022 research record through May 31; academic research has no fixed reporting quarter.
support_condition: Representative, reasonably comparable evaluations establish useful object recognition and substantially weaker reliability in planning, reading, and language comprehension.
contradiction_condition: Representative, reasonably comparable evaluations establish that the claimed broad disadvantage in the other abilities does not hold.
measurement_requirements: Compare representative tasks using a defensible common standard, such as performance relative to human participants and reliability under changed conditions. Raw percentages from different benchmarks are insufficient.
source_requirements: Original evaluations publicly available by May 31, 2022, including strong results and failure analyses in all named domains.
