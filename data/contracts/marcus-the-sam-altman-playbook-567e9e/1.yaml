explicit_source_elements:
  - mostly just sells chatbots
  - Charitable work
  - at best a small part
  - the overall operation
evaluator_interpretation:
  - OpenAI means the overall organization, including its operating entities, rather than only the nonprofit parent.
  - The ordinary reading alleges chatbot sales dominate commercial activity and direct charitable activity occupies a small share of operations.
  - For a financial test, chatbot sales require a product revenue breakdown, while charitable work requires a comparable spending or activity denominator. These are separate comparisons.
  - Use calendar 2023, the latest completed annual operating period before the post, because the claim gives no reporting period and no regular quarterly disclosure basis.
  - Charitable work is not automatically identical to nonprofit legal status, a stated mission, or all research spending.
support_condition: Comparable records show chatbot products dominate sales and direct charitable work constitutes a small share of the overall organization's activity or spending.
contradiction_condition: Comparable records show chatbot products do not dominate sales, or charitable work forms a substantial share of overall operations.
measurement_requirements: A product revenue breakdown and consolidated activity or expenditure breakdown for the same period. Do not divide nonprofit spending by group revenue or substitute annualized run rate for realized revenue.
source_requirements: Consolidated company records, product-level disclosures and charity records with matching entity boundaries and accounting definitions.
