  - these companies will do it again
  - OpenAI and Anthropic
  - arbitrarily change pricing, service availability or functionality
  - Anthropic cut off access to AI coding platform Windsurf
evaluator_interpretation:
  - Assess the factual recurrence prediction, not the preceding expression of disapproval.
  - The plain reading concerns provider-imposed adverse changes affecting businesses dependent on their models.
  - Read the plural prediction as covering both named providers. A recurrence by Anthropic alone is partial evidence, not completion of the whole prediction.
  - "'Arbitrarily' requires evidence of discretionary or selectively imposed treatment. A documented service change alone does not prove caprice."
  - Routine outages and voluntarily chosen new products at different prices do not qualify.
support_condition: After July 21, 2025, both providers implement qualifying discretionary adverse changes to existing customers' pricing, access or functionality.
contradiction_condition: A decisive event makes qualifying recurrence impossible for both providers. Mere non-occurrence by the evaluation date cannot contradict this undated forecast.
measurement_requirements: Establish the affected customer, provider, effective date, change from prior terms, notice and stated reason. Distinguish implemented changes from future announcements.
source_requirements: Provider or customer announcements, contractual records, or credible reporting with attributable confirmation.
