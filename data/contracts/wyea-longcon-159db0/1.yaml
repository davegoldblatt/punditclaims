explicit_source_elements:
  - currently raising $2 billion
  - at a $60 billion valuation
  - primarily based off of this trumped-up marketing nonsense
evaluator_interpretation:
  - The claim concerns the fundraising process underway when the post appeared.
  - Primarily means that exaggerated promotional claims were the principal basis of investors' valuation decisions.
  - The surrounding criticism identifies forecasts of large future revenues and transformative capabilities as the alleged exaggerations.
  - The valuation is treated as a reported proposed equity valuation. The $2 billion financing amount is a separate transaction attribute.
  - The financial basis is estimate because the surrounding discussion relies on reporting rather than a completed company-announced transaction.
support_condition: Contemporaneous investment records show that materially exaggerated promotional claims were the main reason investors accepted the proposed $60 billion valuation.
contradiction_condition: Contemporaneous investment records establish that other factors principally determined the valuation, or establish that the specific claims alleged to drive it were not materially exaggerated.
measurement_requirements: Identify the promotional representations, assess their factual basis at the time, and establish their importance relative to revenue, customer demand, technology, strategic relationships and other investment considerations.
source_requirements: Investor underwriting materials, investment-committee records, fundraising documents or specific investor explanations. A large valuation or optimistic forecast alone cannot establish the causal claim.
