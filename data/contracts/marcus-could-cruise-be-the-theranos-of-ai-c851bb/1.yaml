assessment_axis: historical_observation
explicit_source_elements:
  - if Cruise’s vehicles really need an intervention every few miles
  - 1.5 external operators for every vehicle
  - with a very important asterisk
  - they don’t seem to even be remotely close
  - what they have been alleging to the public
evaluator_interpretation:
  - Both numerical premises must describe actual operational dependence before the proposed discrepancy can be assessed.
  - Necessary human intervention is distinct from an automatically initiated assistance request.
  - External operators means personnel assisting vehicle operation; it cannot silently be equated with all maintenance, customer support, and other operations staff.
  - Use October 2023, the latest operating month before the post.
  - Preserve Marcus's caveat that the numbers' meaning and the operators' duties were not established.
support_condition: Both numerical premises are established for October operations, and the necessary human duties materially conflict with Cruise's public autonomy representations.
contradiction_condition: Both premises hold, but verified operator duties and vehicle performance are consistent with Cruise's properly qualified public representations. Failure to establish a premise does not itself falsify this conditional statement.
measurement_requirements: Necessary interventions per mile, staff roles and shift coverage, active-vehicle denominator, and the actual tasks performed by remote operators.
source_requirements: Operational records or independently verified disclosures with consistent definitions, alongside public autonomy representations.
