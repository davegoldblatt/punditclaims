ambiguity_flags:
  - Intervention could mean a request, advice, a driving command, or a takeover.
  - External operators may be confused with total operations staff.
  - The staffing ratio does not specify simultaneous staffing or shift coverage.
  - October 2023 is the evaluator's latest-operating-period interpretation.
  - The claimed distance from public representations has no numerical threshold.
