assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT is estimated to cost
  - hundreds of thousands of dollars a day to run
  - the massive push to grow both the complexity and scale of the operation is deeply unsustainable
evaluator_interpretation:
  - The checkable core is whether a published estimate put ChatGPT's running cost at hundreds of thousands of dollars a day. He says 'estimated', so the test is whether such an estimate existed and was in circulation before the post, not OpenAI's exact real cost. Any 2023 estimate he could have cited counts. No particular month is required.
  - "'Deeply unsustainable' is his judgment. The plain reading, from his next sentence, is that costs far exceed revenue, so the operation depends on outside money rather than paying for itself. This part is treated as context, not scored on its own."
  - "Target period: 2023, up to the post date, because he describes the then-current state."
support_condition: A credible 2023 estimate putting ChatGPT's daily running cost in the hundreds of thousands of dollars (roughly $100,000 to $999,999, or about that).
contradiction_condition: Credible 2023 estimates putting ChatGPT's daily cost far below $100,000 or in the tens of millions, with no estimate in the hundreds of thousands in circulation.
measurement_requirements: Analyst estimate of ChatGPT's daily operating cost, in US dollars per day.
source_requirements: The original analyst estimate or reputable news reports of it.
metric_scope:
  company: OpenAI
  metric: ChatGPT daily operating (compute) cost
  currency: USD
  units: dollars per day
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2023-01-01
  period_end: 2023-11-20
  stock_or_flow: flow
