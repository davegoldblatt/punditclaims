evaluator_interpretation:
  - The company is OpenAI, and thus far ends on May 5, 2024.
  - The first clause is a checkable historical assertion about public demonstrations. Working and reliable would ordinarily require repeatable completion of the demonstrated class of tasks, rather than one selected successful run.
  - "The second clause explicitly describes an impression: does not seem to have. It neither asserts that OpenAI possessed no successor model nor merely asserts that none had been publicly demonstrated."
  - No factual success or failure criterion is assigned to the hedged successor-model clause. The plain-reading exception does not remove that hedge.
  - Because this record combines the firm demonstration claim with the explicitly hedged assessment, no single factual outcome is assigned to the whole sentence. The agent clause remains independently checkable.
support_condition: No whole-record support condition is assigned. For the firm agent clause alone, a sufficiently comprehensive record of OpenAI demonstrations through May 5, 2024 would need to show that none established repeatable task completion.
contradiction_condition: No whole-record contradiction condition is assigned. The firm agent clause alone would be contradicted by a dated OpenAI demonstration with credible evidence of repeatable successful performance within its stated task scope.
measurement_requirements: "For the agent clause alone: identify the demonstrated system, task scope, repeated outcomes, failures and human intervention. Do not require perfection or redefine reliability as universal competence. Do not invent a GPT-5 capability threshold."
source_requirements: "For the agent clause alone: dated company demonstration records and independent reliability evaluations available by the evaluation date, documenting the public record through May 5, 2024."
