assessment_axis: forecast_outcome
explicit_source_elements:
  - The same will be true of AI agents
  - some prompts, some of the time will work
  - some of the time they will give strange results
  - It will be difficult to know in advance what to expect
evaluator_interpretation:
  - "Plain reading: AI agents will behave inconsistently. The same agent on the same task will sometimes succeed and sometimes fail, sometimes with odd outputs, so users cannot easily predict the result."
  - "The forecast has no deadline. Early resolution rule: it is settled as supported if, after the post, a published repeated-trial evaluation shows leading agents succeeding on some runs and failing on others for the same tasks, and documented agent runs show strange, unexpected behaviour. It would be contradicted if agents were shown to behave consistently and predictably across repeated runs."
support_condition: Post-January-2025 evaluations show success dropping when the same tasks are repeated (pass^k falling below pass^1) and document strange agent behaviour.
contradiction_condition: Post-January-2025 evaluations show leading agents giving consistent, predictable results across repeated trials of the same tasks, with no notable strange behaviour.
measurement_requirements: Repeated-trial consistency metrics (such as pass^k) and documented agent behaviour from live experiments.
source_requirements: Benchmark papers or company research reports published after 2025-01-15.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Supported once a published post-January-2025 evaluation shows leading agents' success falling across repeated trials of the same tasks, together with documented strange behaviour. Contradicted once evaluations show consistent, predictable behaviour across repeated runs.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
