assessment_axis: historical_observation
explicit_source_elements:
  - the majority of Blackwell GPUs
  - collecting dust in a warehouse
evaluator_interpretation:
  - Read the belief statement as a factual estimate that more than half of shipped data center Blackwell GPUs are unused in storage.
  - Count physical GPU packages consistently, rather than counting each silicon die separately. Exclude consumer Blackwell graphics cards.
  - Use the current May 2026 observation window through publication, consistent with the surrounding May status checks. Earlier deployment estimates are context unless they establish the May state.
  - Installed but lightly utilized GPUs are not equivalent to GPUs sitting unused in warehouses.
  - The roughly three-million shipment figure in the context refers to an earlier shipment statement; it is not automatically the cumulative denominator for May 2026.
support_condition: A reconciled inventory shows that more than 50% of the relevant shipped Blackwell packages were unused in storage during the target period.
contradiction_condition: A reconciled inventory shows that at least 50% of those shipped packages were in service or otherwise demonstrably outside unused warehouse inventory.
measurement_requirements: Matching cumulative shipments and inventory status as of May 2026, with physical-package units, customer coverage, installation stages, and duplicate ownership or tenancy records reconciled.
source_requirements: Manufacturer shipment records and customer inventories, or independently validated estimates that measure stored and deployed units rather than assuming a deployment lag.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-05-01
  end: 2026-05-12
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Physical GPU packages versus silicon dies.
  - All shipments through publication versus the older shipment cohort cited in context.
  - Literal warehouse storage versus any equipment not yet operational.
  - The ongoing-state observation window is inferred from the surrounding May 2026 status checks.
retrospective_or_prospective: retrospective
