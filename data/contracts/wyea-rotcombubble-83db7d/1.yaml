assessment_axis: forecast_outcome
explicit_source_elements:
  - The Rot-Com bubble will inevitably pop
  - until it does
  - billions will be plowed into building hardware and software
evaluator_interpretation:
  - The context describes a broad technology growth and investment bubble, including AI and major technology companies.
  - A pop means a sharp, sustained collapse in valuations and investment across that sector, not an isolated company failure or regional correction.
  - The spending clause predicts aggregate investment before the collapse. It supplies no company-specific accounting metric; metric_scope is therefore null.
  - The forecast supplies no deadline, numerical collapse threshold or minimum duration. No such threshold is invented here.
support_condition: Evidence establishes a broad, sharp and sustained technology valuation and investment collapse, with billions invested in hardware and software beforehand.
contradiction_condition: A decisive event makes the predicted collapse impossible. Continued growth, continued investment or recovery from one correction cannot disprove an eventual collapse without a deadline.
measurement_requirements: Comparable valuation, financing and realized investment series showing breadth and persistence. Separate spending from financing commitments and account for non-AI components.
source_requirements: Market-index records, financing data and company filings or disclosures. Regional news reports are context unless the wider collapse is established.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented broad and sustained collapse in technology valuations and investment, together with the preceding billions invested, supports the compound forecast. A regional decline or continued spending alone does not settle it.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - "'Rot-Com bubble' has no precise constituent list or geography."
  - No numerical threshold or duration defines a pop.
  - The investment clause gives no accounting basis or allocation between hardware and software.
  - Investor motives are asserted without an observable measure.
retrospective_or_prospective: retrospective
