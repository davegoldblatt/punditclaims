assessment_axis: historical_observation
explicit_source_elements:
  - 160,000 views on the first episode
  - around 40,000 an episode
  - for the last 9 months
  - the George Carlin special
  - 55,000 views at the time of writing
evaluator_interpretation:
  - Read these as cumulative YouTube view counts at the time of writing, rather than downloads or unique viewers across all podcast platforms.
  - The preceding nine months run approximately from April 16, 2023, through January 16, 2024. This identifies the ordinary episode cohort; the first episode's count is also measured at the time of writing.
  - Around 40,000 describes typical episode counts, allowing ordinary variation. The statement supplies no numerical tolerance.
  - The plain reading of George Carlin special is the standalone special, although the surrounding discussion leaves possible confusion with its accompanying podcast episode.
support_condition: Dated records from the time of writing show approximately 160,000 views for the first episode, ordinary episodes from the preceding nine months typically around 40,000 views, and approximately 55,000 views for the identified Carlin upload.
contradiction_condition: Comparable contemporaneous records show a material mismatch in one or more of these figures or show that the ordinary episode cohort was not typically near 40,000 views. Later accumulated views alone do not contradict the claim.
measurement_requirements: Upload-level YouTube counts with capture timestamps, upload identities, and release dates. Examine the preceding nine months as a cohort rather than selecting individual episodes.
source_requirements: Archived YouTube pages, dated creator analytics, or independently preserved contemporaneous measurements. Zitron's own assertion cannot corroborate itself.
