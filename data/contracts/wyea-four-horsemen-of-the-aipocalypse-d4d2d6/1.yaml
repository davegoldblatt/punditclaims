assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic’s services
  - seem to have constant uptime issues
  - linked to a lack of capacity
evaluator_interpretation:
  - Constant means recurring interruptions, not uninterrupted failure.
  - Linked to means insufficient available serving capacity contributes to the reliability problems; it does not require every incident to share that cause.
  - Use the surrounding 90-day discussion to bound the recent operational period through publication.
  - Assess the supplied causal proposition. The preceding fundraising figure and description of public enthusiasm are background, not a separate financing assessment.
support_condition: Records establish recurring service interruptions and credible operational evidence identifies demand exceeding available capacity as a contributing cause during the described period.
contradiction_condition: Operational evidence establishes that the alleged recurring interruptions did not occur, or that capacity was adequate and did not contribute to the reliability problems.
measurement_requirements: Separate service availability from answer quality. Require evidence of a capacity link rather than inferring it solely from outages.
source_requirements: Company incident reports and capacity disclosures, supplemented by attributed reporting when a primary account of a particular incident is unavailable.
