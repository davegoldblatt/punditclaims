ambiguity_flags:
  - Constant is an unquantified description of frequency.
  - Capacity could refer to compute or another serving-system bottleneck.
  - The period is inferred from the adjacent 90-day uptime discussion.
  - The wording does not quantify the share of incidents attributable to capacity.
