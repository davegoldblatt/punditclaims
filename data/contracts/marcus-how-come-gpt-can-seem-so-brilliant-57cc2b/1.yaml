assessment_axis: causal_assessment
explicit_source_elements:
  - When GPT sounds plausible
  - because every paraphrased bit
  - is grounded in something that actual humans said
  - often some vague (but often irrelevant) relationship
evaluator_interpretation:
  - Grounded means derived from human utterances, not necessarily factually correct.
  - "The claim asserts more than training on human text: every constituent of plausible output has the stated provenance, and its recombination explains plausibility."
  - Paraphrasing allows changed wording; absence of an exact textual match is therefore not sufficient contradiction.
  - The scope is the GPT generation discussed in December 2022.
support_condition: Provenance analyses and interventions establish that the relevant constituents derive from human utterances and that their learned relationships account for output plausibility.
contradiction_condition: A well-defined plausible constituent is shown not to derive from human utterances under a defensible paraphrase criterion, or controlled interventions disprove the proposed explanation of plausibility.
measurement_requirements: Define constituent units and paraphrase criteria, examine the relevant training data, assess plausibility independently, and distinguish textual overlap from causal dependence.
source_requirements: Primary provenance studies or controlled interventions on relevant GPT models. Training descriptions alone cannot establish universal output provenance.
