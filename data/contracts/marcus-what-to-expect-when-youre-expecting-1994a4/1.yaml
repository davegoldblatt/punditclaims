assessment_axis: forecast_outcome
explicit_source_elements:
  - often do what you want
  - sometimes not
  - difficult to anticipate which in advance
evaluator_interpretation:
  - Doing what users want means correctly completing their intended legitimate tasks, including answering questions.
  - The plain reading concerns users' ability to anticipate success and failure before receiving an answer, rather than predicting aggregate benchmark scores.
  - Often and sometimes describe substantial success alongside meaningful failures; neither supplies a numerical threshold.
support_condition: GPT-4 succeeds frequently, but an empirical study of human expectations finds that users' inferred capability boundaries leave consequential, insufficiently anticipated failures.
contradiction_condition: Representative studies show that users reliably distinguish tasks GPT-4 will complete correctly from those it will fail, including after generalizing from previous interactions.
measurement_requirements: Compare advance beliefs about GPT-4 correctness with actual correctness. State whether human beliefs were directly elicited or estimated from a model of human responses.
source_requirements: Original human-prediction or human-generalization studies with GPT-4-specific results, available by the evaluation date.
