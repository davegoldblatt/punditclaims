  - will run out of real dollars to pay people
  - likely at exactly the time that it’s hardest to find more of them
evaluator_interpretation:
  - The ordinary reading is exhaustion of available cash sufficient to prevent OpenAI from paying obligations when due.
  - Accounting losses, cash burn, large commitments, fundraising, or a disputed payment do not alone establish cash exhaustion.
  - The cash-exhaustion forecast is firm; the coincidence with difficult fundraising is qualified by 'likely'.
  - The currency is read as U.S. dollars from the company and surrounding dollar-denominated commitments. No accounting basis or forecast date is supplied.
support_condition: Reliable records establish that OpenAI becomes unable to pay due obligations because available cash has been exhausted. Assess the qualified fundraising-timing clause separately if such an event occurs.
contradiction_condition: No finite period of continued solvency disproves an indefinite eventual forecast. Contradiction would require a definitive end to the relevant company's obligations with all obligations paid and no qualifying cash-exhaustion event.
measurement_requirements: Dated liquidity records, obligations due, and evidence that any nonpayment resulted from insufficient cash rather than a dispute, administrative delay, or voluntary decision.
source_requirements: Insolvency records, attributable company financial disclosures, or independently verified creditor and payment records.
