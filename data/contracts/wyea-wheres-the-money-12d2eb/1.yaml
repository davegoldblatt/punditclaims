assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic, like OpenAI
  - has no moat
evaluator_interpretation:
  - The ordinary business meaning of moat is a durable competitive advantage that protects against substitution or erosion of returns.
  - The claim concerns the competitive position immediately before publication. I use the last pre-publication day as the observable snapshot, rather than importing subsequent market outcomes.
  - Temporary benchmark leadership, investment, or a distribution partnership alone does not establish a durable moat.
  - The comparison includes OpenAI, but evidence about OpenAI alone cannot settle Anthropic's position.
support_condition: Evidence across material competitive dimensions shows easy substitution and no durable proprietary, cost, distribution, resource-access, or switching-cost advantage.
contradiction_condition: Evidence establishes at least one durable advantage protecting Anthropic against competitors; the comparison with OpenAI requires separate company-specific evidence.
measurement_requirements: Customer switching and retention evidence, comparable prices and capabilities, contractual exclusivity, resource access, and evidence of persistence. No numerical moat threshold is imposed.
source_requirements: Primary contracts or disclosures and independent customer or market measurements. Benchmark comparisons alone are insufficient.
