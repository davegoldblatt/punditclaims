ambiguity_flags:
  - No period was named; I took December 2025 to May 2026 from his own comparison of Q1 2026 data with late 2025.
  - "'Stalled' could mean zero growth or just a sharp slowdown; official figures rose from 800M (Oct 2025) to 900M (Feb 2026), but a December 2025 report already put the figure near 900M."
  - "'Struggle' to convert is a judgement with no stated benchmark."
