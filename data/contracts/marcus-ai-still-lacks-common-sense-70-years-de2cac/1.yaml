explicit_source_elements:
  - AI systems that act in the world on user’s behalf
  - are already here
  - to a limited degree
  - If general purpose domestic robots are a long way away
evaluator_interpretation:
  - An agent must execute some user-directed action, rather than merely describe an action. Actions in software count because the surrounding text explicitly includes websites.
  - Limited availability through a developer API qualifies; widespread consumer deployment is not required.
  - The domestic-robot phrase is concessive background, not a conditional antecedent or a separately dated forecast.
  - Use the latest completed product-reporting quarter before the post, October through December 2024, for the ongoing availability assertion.
support_condition: At least one publicly available AI system could perform limited actions for users during the target period.
contradiction_condition: The purported systems were only proposals, or available systems could not execute actions for users.
measurement_requirements: Verify release status and actual action capabilities. Do not require general autonomy or reliable completion of arbitrary tasks.
source_requirements: Dated product announcements or documentation describing public availability and action-taking functionality.
