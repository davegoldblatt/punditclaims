  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Does not appear' qualifies the assertion."
  - Costs could mean unit inference costs or total company expenditure.
  - Profitability could mean net income, operating income or another margin.
  - The two-year starting boundary is approximate.
  - Hardware changes can coincide with software and precision changes.
