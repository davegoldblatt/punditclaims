  - liabilities to Microsoft of $3.64 billion
  - at the close of the calendar year
  - additional $21 million
  - “accrued expenses and other current liabilities”
evaluator_interpretation:
  - The surrounding discussion identifies the balance-sheet date as December 31, 2025.
  - Additional means the $21 million is separate from, and not already included in, the $3.64 billion balance.
  - The Microsoft relationship applies to both balances.
  - The accounting basis is company_reported because the statement expressly attributes the balances to company financial figures.
support_condition: Independently verified year-end disclosures show approximately $3.64 billion owed to Microsoft plus a separate $21 million in accrued expenses and other current liabilities.
contradiction_condition: Comparable disclosures show different balances, a different counterparty or date, or that the $21 million is already included in the $3.64 billion.
measurement_requirements: Use outstanding liabilities at December 31, 2025, preserving the separate classifications and avoiding double counting. Annual expenses and later balances do not establish this stock.
source_requirements: The year-end related-party balance-sheet note, a matching counterparty reconciliation, or independent reporting specifically verifying both balances.
