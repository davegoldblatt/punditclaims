explicit_source_elements:
  - currently $124.2 billion short of break-even
  - $243 billion short of break-even without their revenues
  - $233.2 billion to $351 billion short
  - 10% ROIC
  - 2026 and 2027 capex
evaluator_interpretation:
  - This is a current comparison with a modeled future-capex revenue requirement, not a claim that 2027 spending has already occurred.
  - The main test covers both break-even shortfalls. The exact quotation also commits to the two 10% return shortfalls, so those are retained.
  - "For the current revenue input, the target covers the latest reported quarters before the post: April through June for calendar-quarter reporters and June through August for Oracle."
  - The model uses 2026–27 capital-expenditure estimates. That separate forecast input must not be mistaken for the observation period.
  - The ordinary reading is a shortfall in annual revenue pace, not a reported accounting loss or cash deficit.
support_condition: The original model and comparable current revenue data reproduce the stated break-even and 10% return shortfalls, with and without Anthropic and OpenAI revenue, allowing for disclosed rounding.
contradiction_condition: The model or comparable revenue records establish materially different shortfalls, or demonstrate that incompatible company coverage or accounting definitions invalidate the comparison.
measurement_requirements: Verify the model's company coverage, AI capex allocation, annualization, depreciation, operating costs and return assumptions. Subtract matching annual AI revenue, then exclude only the verified lab-attributable portion.
source_requirements: The original Goldman Sachs report or a sufficiently detailed reliable reproduction, together with independent evidence for the current revenue and customer-share inputs.
