  - The revenue inputs combine annual actuals, forecasts and run rates.
  - The model's hyperscaler coverage must be reconciled with the five-company revenue total.
  - Break-even on average annual capex differs from recovering cumulative capital investment.
  - The precision and rounding of the stated shortfalls are not explained.
