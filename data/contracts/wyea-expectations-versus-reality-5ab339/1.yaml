explicit_source_elements:
  - it lacks
  - timers, reminders, calendars, photos, access to your emails
evaluator_interpretation:
  - The target is the newly delivered R1's publicly available launch software through the May 13 post. I use April 23–May 13, 2024, as the launch-to-post observation period.
  - The ordinary reading is usable timer, reminder, calendar, photographic capture, and email-account features.
  - Photos means an ordinary photo-taking feature. Zitron separately acknowledges the camera's visual-analysis function, so the claim does not deny that the hardware can capture images for analysis.
  - The judgment concerns the feature list, not the rhetorical criticism of the developers.
support_condition: Contemporaneous documentation or testing establishes that all five ordinary features were unavailable in the launch-period product.
contradiction_condition: Contemporaneous documentation or testing establishes usable availability of a named feature. If some were available and others absent, the list is mixed.
measurement_requirements: Identify delivered functionality during the target period; distinguish announced features, visual-analysis images, and later software additions from ordinary available features.
source_requirements: Prefer dated Rabbit documentation and release notes, supplemented by contemporaneous hands-on reviews. Current documentation cannot establish the launch feature set.
