assessment_axis: causal_assessment
explicit_source_elements:
  - unrestrained AI spending
  - inflating the revenues of Anthropic and OpenAI
  - isn’t sustainable for anybody involved
evaluator_interpretation:
  - The plain reading is that poorly controlled enterprise token purchases are materially boosting both providers' revenue beyond an economically durable level.
  - Inflating means temporarily boosting revenue; it does not itself allege accounting fraud.
  - The claim concerns the spending pattern described at publication. Later evidence can illuminate its durability but cannot establish its cause merely by showing growth or contraction.
  - No common accounting basis, revenue period, sustainability threshold, or deadline is specified.
support_condition: Customer spending and renewal records, matched to both providers' revenue and costs, show that uncontrolled purchases materially boosted revenue and could not be maintained economically by the customers and providers involved.
contradiction_condition: Matched records show that the disputed spending was controlled, generated durable economic benefits, and supported economically maintainable revenue for both providers. Revenue growth alone is insufficient.
measurement_requirements: Separate realized revenue from annualized revenue, spending from financing, customer returns from provider margins, and temporary budget overruns from economic inability to continue purchasing.
source_requirements: Prefer customer budgets, invoices and renewal records together with provider accounts. Surveys and spending panels can provide context but cannot establish both companies' economics.
