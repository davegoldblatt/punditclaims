explicit_source_elements:
  - these services
  - there really isn’t any way
  - make sense at a monthly rate
  - every single AI company
  - loses incredible amounts of money
  - failing to make that much revenue
evaluator_interpretation:
  - In context, AI companies means businesses supplying generative AI models or services, rather than every diversified company using AI.
  - The plain reading is that monthly subscriptions cannot sustainably cover their costs and that all companies in scope incur substantial company-wide losses.
  - Use calendar 2025, the latest completed annual reporting period before publication, for the unspecified ongoing financial state. Annual accounts provide a common period for company-wide profitability.
  - Do not assign numerical thresholds to incredible losses or little revenue.
  - The loss assertion cites no accounting basis. The nearby revenue examples do not supply one for losses, so the contract basis remains unknown.
support_condition: Comparable company accounts establish substantial losses throughout the stated population, and subscription economics show that monthly receipts cannot sustainably cover attributable costs.
contradiction_condition: A company clearly within scope has demonstrated company-wide profitability in the target period, or a monthly subscription service has demonstrated sustainable full-cost profitability. A definitive monetary score additionally requires a stated accounting basis.
measurement_requirements: Company-wide income statements and subscription revenue, serving costs and other attributable expenses. Distinguish net income, operating income, gross profit and cash burn.
source_requirements: Prefer audited accounts and documented subscription economics. Founder interviews and press profitability descriptions require qualification.
