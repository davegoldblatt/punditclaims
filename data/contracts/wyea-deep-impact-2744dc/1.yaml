assessment_axis: forecast_outcome
explicit_source_elements:
  - “Agents”
  - aren’t coming
evaluator_interpretation:
  - The ordinary reading is software that carries out useful delegated multistep tasks with limited supervision, sufficiently reliably for repeated real-world use.
  - Final human review and bounded task scope do not disqualify an agent. A product name, scripted demonstration or isolated benchmark success is insufficient.
  - The scare quotes signal skepticism about the category; they do not supply a conditional antecedent.
  - No deadline or requirement for universal human replacement is stated.
support_condition: The open-ended negative forecast cannot be supported merely because qualifying agents have not appeared by an arbitrary evaluation date.
contradiction_condition: After publication, independent evidence establishes repeated real-world use of systems autonomously carrying out useful delegated multistep tasks with limited supervision.
measurement_requirements: Establish actual task execution, meaningful autonomy and repeated practical use. Distinguish benchmark performance, vendor claims, human review and demonstrated reliability.
source_requirements: Require independent evaluation or direct operational evidence from users other than the model vendor. Record limitations and failures.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated independent report establishing sustained practical use of qualifying agents after the post contradicts the no-arrival forecast, even without a deadline.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Agents is undefined and placed in scare quotes.
  - No deadline is supplied.
  - The required degree of autonomy and reliability is unstated.
  - The context could imply more general or transformative agents than the ordinary software category.
