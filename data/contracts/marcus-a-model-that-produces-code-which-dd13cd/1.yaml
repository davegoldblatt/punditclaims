assessment_axis: historical_observation
explicit_source_elements:
  - next-word prediction
  - a surprisingly long way in writing code
  - less far in making sure that code is robust
evaluator_interpretation:
  - The plain reading is that contemporary LLM coding systems can produce substantial working code while offering weaker assurance of security, reliability, and maintainability.
  - "'Surprisingly' expresses an attitude rather than a numerical threshold."
  - Treat 'next-word prediction' as shorthand for the LLM coding systems discussed in the post, including their deployed agent workflows. This does not establish that a training objective causes the observed weaknesses.
  - For the ongoing state described on May 1, use April 2026, the latest complete calendar month, and assess the publicly reported capability snapshot during that month.
  - A substantial functional-versus-security gap across tested systems can support the ordinary claim without establishing failure in every dimension of robustness or every deployment.
support_condition: Contemporaneous evaluations show substantial success at producing working code alongside materially lower success on additional security, reliability, or maintainability checks.
contradiction_condition: Representative contemporaneous evaluations show that successful code generation generally carries comparable assurance of security, reliability, and maintainability, with no material additional gap.
measurement_requirements: Prefer paired functional and robustness checks on the same tasks and systems. Distinguish benchmark results from population-wide vulnerability rates and distinguish security tests from proof of complete robustness.
source_requirements: Primary benchmark results or research with disclosed tasks and evaluation methods. Vendor-run research requires an explicit limitation concerning commercial interests and independent replication.
