evaluator_interpretation:
  - The plain reading concerns both continuing open-source releases and openness relative to other major AI developers.
  - Open-source releases mean publicly reusable code or model weights under an open-source license. Transparency is a related but distinct measure.
  - "For this ongoing observation, use the latest public comparative reporting cycle before the post: the September 2023 transparency assessment, supplemented by releases through March 6, 2024."
  - The comparative claim is tested against major foundation-model developers. This is a practical comparison group, not a census of every AI company.
support_condition: Release records show a near-total withdrawal from open-source work, and a credible contemporary comparison places OpenAI among the least open major developers.
contradiction_condition: Substantial continuing releases undermine the abandonment claim, or a credible contemporary comparison places OpenAI outside the least-open group. Contradicting either component defeats the combined claim, without establishing that OpenAI was generally open.
measurement_requirements: Dated releases, their licenses, and a comparative assessment that distinguishes model access from broader disclosure transparency.
source_requirements: Prefer release repositories and independent comparative research available before the post.
