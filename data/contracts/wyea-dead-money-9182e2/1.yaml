evaluator_interpretation:
  - Test the price comparison using the two contracts cited immediately before the sentence, rather than treating two contracts as a census of all B300 rentals.
  - Compare US dollars per GPU-hour with Silicon Data's H100 hyperscaler series, not its neo-cloud series.
  - The highest cited contractual rate is $4.30. For every cited rate to be less than half, the relevant H100 reading must exceed $8.60.
  - Use September 1–29, 2026 as the current pricing period before publication. Earlier contractual observations and regional medians are context.
  - The B300 generation description is background to the normalized price proposition, not a separate product-launch assessment.
support_condition: Verified cited contract rates are each strictly below half the contemporaneous Silicon Data H100 hyperscaler reading.
contradiction_condition: A verified cited rate is at least half the contemporaneous reading. Different results for the cited contracts or pricing phases should be reported separately.
measurement_requirements: The dated H100 hyperscaler series, its geographic and service scope, and the contracts' per-GPU hourly rates, duration, and bundled charges. Do not substitute a neo-cloud index or another provider's list price.
