assessment_axis: historical_observation
explicit_source_elements:
  - a new study from METR
  - LLMs do markedly better on coding benchmarks
  - than in real-word practice
evaluator_interpretation:
  - I read the explicit reference to a new METR study as a comparison between impressive benchmark performance and substantially weaker practical usefulness in that study's coding setting.
  - "'Markedly better' describes a meaningful qualitative mismatch; benchmark success rates and developer completion times are not interchangeable numerical measures."
  - The target period is February–June 2025, the period investigated by the study identified through the explicit reference. This is a historical study claim, not a claim about October 2026 tools.
  - This reading does not establish that the same gap holds across all developers, tasks or LLMs.
support_condition: The cited METR research documents substantially weak or negative practical coding effects despite impressive coding benchmark results for contemporary AI systems.
contradiction_condition: The cited research finds practical coding benefits commensurate with benchmark promise, or its reported results otherwise directly reject the asserted mismatch.
measurement_requirements: Identify the study's models, developers, tasks, practical outcome measure and benchmark comparison. Preserve the distinction between task success and human productivity.
source_requirements: The METR paper and its methodological discussion, including scope limitations and relevant subsequent corrections.
