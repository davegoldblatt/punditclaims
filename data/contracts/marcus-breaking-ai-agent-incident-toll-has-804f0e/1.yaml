contradiction_condition: The Axios report gave a much smaller count (for example dozens or hundreds), or attributed the incidents only to OpenAI.
measurement_requirements: Count of incidents under review as reported by Axios; which companies are named.
source_requirements: The Axios report, or reputable outlets restating it. Axios itself returned HTTP 403, so restatements are used.
