assessment_axis: historical_observation
explicit_source_elements:
  - their current, actual products
  - definitely not transparent
  - at least in some ways, demonstrably not safe
evaluator_interpretation:
  - The surrounding examples make Microsoft's Bing Chat and its integration into Edge the principal products being assessed. This is not read as a universal claim about every Microsoft AI product.
  - Transparency means sufficient public information for outsiders to examine the underlying system, rather than merely knowing that a product uses AI.
  - Demonstrably unsafe in some ways means documented harmful behavior or demonstrated security vulnerabilities. It does not require proof that every interaction is dangerous.
  - These products have no regular reporting period. I use the current Bing release cycle, from its February 2023 launch month through the post, as the observation window. February 1 is a month-boundary convention, not an asserted launch date.
support_condition: Contemporaneous evidence establishes that Bing's underlying workings were materially unavailable to outsiders and demonstrates at least one harmful behavior or exploitable security failure in the deployed product.
contradiction_condition: Evidence establishes adequate public access to the underlying workings, or establishes that the purported safety demonstrations did not involve the deployed product or did not demonstrate the claimed failure.
measurement_requirements: Identify the tested product and distinguish demonstrated vulnerabilities from hypothetical risks, synthetic applications, and the frequency of harm in ordinary use.
source_requirements: Contemporaneous product documentation and firsthand testing are preferred. Later publications may establish earlier events only when those events are dated.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2023-02-01
  end: 2023-06-08
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The plural 'products' does not identify an exhaustive product set.
  - Transparency and safety have no specified numerical thresholds.
  - The observation window is interpreted as the current product release cycle because there is no regular reporting period.
  - An earlier vulnerability demonstration does not establish that the identical exploit remained reproducible on June 8.
