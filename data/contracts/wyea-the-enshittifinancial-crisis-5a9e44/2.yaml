assessment_axis: causal_assessment
explicit_source_elements:
  - the AI bubble is really a stress test of the global venture capital, private equity, private credit, institutional and banking system
  - its willingness to fund all of this forever
  - because there isn't a single generative AI company
  - that's got a path to profitability
evaluator_interpretation:
  - "The 'stress test' line is a metaphor and cannot be checked by itself. The checkable part is the reason he gives for it: that no generative AI company has a path to profitability. If that reason is false, the causal claim built on it fails."
  - "Plain reading of 'path to profitability': a realistic route to making a profit from the business. A generative AI company that was already profitable around the time of the post has such a path. So does one that went on to report an operating profit before the evaluation date."
  - "'Not a single' is a universal. One clear counterexample contradicts it."
  - "'Generative AI company' means a company whose main product is built on generative AI models: model developers like OpenAI and Anthropic, and AI-native app makers. It excludes chipmakers and hyperscalers."
  - "Target period: the post's present-tense state (from mid-2025) through the evaluation date. 'Path' looks forward, so profitability reached after the post counts as evidence that a path existed."
support_condition: Through the evaluation date, no generative AI company reports or is credibly reported as profitable, or as clearly on course to profit, and the leading labs and startups keep relying on outside capital to cover losses.
contradiction_condition: At least one generative AI company is credibly shown to be profitable around the post date, or reports an operating profit before the evaluation date.
measurement_requirements: Company-reported profit or operating income for a generative AI company, from a filing, a company announcement, or reputable news coverage of a filing.
source_requirements: Primary company disclosures or filings where possible. Reputable news reports of filings are acceptable when the filing itself cannot be read.
metric_scope:
