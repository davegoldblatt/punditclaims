ambiguity_flags:
  - "'Path to profitability' is not defined. It could mean operating profit, net profit, or lasting profit."
  - "'Generative AI company' has no stated boundary. It is unclear whether small app makers count, or only model labs."
  - He gave no period. The window here runs from the post's present through the evaluation date, because 'path' looks forward.
  - The 'stress test' framing is a metaphor and cannot be tested on its own.
