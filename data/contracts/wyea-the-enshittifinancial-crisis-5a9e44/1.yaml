explicit_source_elements:
  - a stress test of the global venture capital, private equity, private credit, institutional and banking system
  - its willingness to fund all of this forever
  - there isn't a single generative AI company that's got a path to profitability
evaluator_interpretation:
  - The ordinary reading is that no generative AI business has a credible route to sustained company-wide profit, making the sector dependent on continued external financing.
  - The surrounding discussion includes application startups, so the claim is not restricted to frontier model laboratories.
  - Already sustained profitability would challenge the universal premise more strongly than a management forecast.
  - Use July–September 2025 for underlying ongoing operating conditions, the latest completed calendar reporting quarter before the post.
  - Treat stress test as exposure to investors withdrawing support, not as a formal regulatory stress-test result.
  - No profit measure or accounting basis is specified.
support_condition: Financial and operating evidence establishes the universal lack of viable profitability routes and shows that this lack, rather than merely expansion spending, makes continued operations dependent on the named financing system.
contradiction_condition: A generative AI company has a demonstrated, sustained company-wide profit or a substantiated route to it, defeating the universal premise; alternatively, evidence disproves the alleged dependence mechanism.
measurement_requirements: Distinguish gross margin, operating profit, net profit and cash flow. A profitability route needs evidence about revenue, full costs and financing needs, rather than an unsupported forecast.
source_requirements: Company accounts, documented operating plans and financing disclosures; independent analysis is needed for the broader causal claim.
