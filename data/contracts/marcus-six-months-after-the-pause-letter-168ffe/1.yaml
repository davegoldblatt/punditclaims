  - if Sam Altman’s May Senate testimony meant what I think it did
evaluator_interpretation:
  - "'On pause' means training GPT-5 had not begun or was being withheld as of the post. It does not require that an active training run had been stopped."
  - The claim is tentative, but its factual reading remains checkable against training records and company statements.
  - The target period covers the March letter and the subsequent status described six months later. May statements alone do not establish actual September training status.
  - GPT-5 means OpenAI's named successor, rather than every laboratory's prospective system exceeding GPT-4.
  - The reference to what testimony meant is an evidential qualification, not a conditional forecast.
support_condition: Reliable evidence establishes that GPT-5 training had not begun or remained suspended by September 21, and that the letter's practical scope was essentially confined to GPT-5.
contradiction_condition: Reliable evidence establishes that GPT-5 was actively training at the relevant time, or that the letter substantively called for pausing other laboratories' systems as well.
measurement_requirements: Distinguish training from preliminary research, deployment and naming decisions. Assess the letter's scope separately from OpenAI's conduct.
source_requirements: Use the letter for its stated scope and dated company statements, records or reliable reporting for training status. Later announcements must explicitly establish the earlier status to be decisive.
