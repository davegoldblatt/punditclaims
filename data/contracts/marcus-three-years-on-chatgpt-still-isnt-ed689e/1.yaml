assessment_axis: historical_observation
explicit_source_elements:
  - productivity studies
  - sometimes show a 30% gain
  - none have come close to 10x (1000% gain)
evaluator_interpretation:
  - Assess studies publicly available during the three years discussed in the post, through November 29, 2025.
  - The ordinary reading includes measured productivity on specific work tasks, with attention to output quality. It does not require a tenfold improvement across an employee's entire job.
  - Model estimates of hypothetical time savings are weaker evidence than measured human performance.
  - Tenfold output is a 900% increase. The parenthetical says 1000%, but this arithmetic discrepancy does not materially change the comparison.
support_condition: Studies establish gains around 30%, and a sufficiently broad review of the relevant literature finds no measured task-productivity gains approaching tenfold.
contradiction_condition: A study available before the post reports approximately tenfold productivity on a genuine work task with assessed output quality. A narrow task result contradicts the universal wording without establishing tenfold productivity across whole jobs.
measurement_requirements: Compare equivalent work with and without LLM use. Distinguish measured completion time and output quality from perceptions, model-generated estimates, and overall employee productivity.
source_requirements: Original studies or systematic reviews available by November 29, 2025.
