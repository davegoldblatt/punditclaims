assessment_axis: historical_observation
explicit_source_elements:
  - AI
  - less impact on real-world productivity
  - so far
  - than many people had anticipated
evaluator_interpretation:
  - The plain reading is that realized workplace productivity gains had disappointed expectations held by a substantial group. 'Many' need not mean a majority.
  - The comparison must concern gains previously expected by the observation period. Expectations for later years cannot establish disappointment by June 6, 2026.
  - Productivity means useful output relative to labor or other inputs. Adoption, investment, benchmark performance and employment changes alone do not measure it.
  - Read 'so far' cumulatively through the latest complete quarter before publication, ending March 31, 2026. Leave the start unspecified because Marcus supplies none.
  - A representative survey comparing earlier expectations with realized gains, or sufficiently broad matched studies, could establish the claim. One small occupational experiment establishes only a narrower example.
support_condition: Evidence shows that a substantial group previously expected greater AI productivity gains by the observation period than actually materialized. Expected and realized gains must concern comparable dates, populations, measures and adoption conditions.
contradiction_condition: Broad evidence matching earlier expectations to realized AI productivity gains for the same period shows that expectations were generally met or exceeded and provides evidence against a substantial disappointed group. Positive gains alone do not contradict the claim.
measurement_requirements: Identify when expectations were formed, when gains were expected, whose productivity was covered, and how gains were measured. Distinguish earlier expectations from contemporaneous perceptions and future hopes. Account for sampling limits and uncertainty.
source_requirements: Prefer original surveys, field experiments and dated forecasts. Aggregate productivity statistics require a credible estimate of AI's contribution and a matching earlier expectation.
