target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - Good has no stated competence standard.
  - Large-scale has no stated scale.
  - Vital could mean practically useful, indispensable to a particular system, or universally necessary.
  - Almost certainly hedges the proposed necessity.
