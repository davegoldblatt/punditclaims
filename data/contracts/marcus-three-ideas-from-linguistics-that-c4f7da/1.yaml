explicit_source_elements:
  - A good language understanding (or language production) system
  - almost certainly needs
  - some large-scale learning
  - as a vital component
evaluator_interpretation:
  - The surrounding discussion suggests broad language competence, including idioms and other conventional expressions.
  - The statement proposes necessity, rather than merely saying that learning improves performance.
  - Neither 'good' nor 'large-scale' has a sufficiently definite boundary to identify an uncontested counterexample.
  - Treat 'almost certainly' as a hedge, not a conditional antecedent or a numerical probability.
support_condition: No determinate scoring condition is available as written. After defining competence and learning scale, evidence would need to establish necessity within that defined class, rather than merely successful use of learning.
contradiction_condition: After those definitions are fixed, a system meeting the competence standard without the specified learning component would challenge necessity. The original wording does not determine whether a narrow-domain system qualifies.
measurement_requirements: A defined competence domain and performance standard, plus an operational boundary for large-scale learning and what makes it vital.
source_requirements: System documentation, independent performance tests and, where feasible, causal comparisons removing or reducing the learning component.
