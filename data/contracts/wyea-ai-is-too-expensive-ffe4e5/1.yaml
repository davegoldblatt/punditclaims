assessment_axis: forecast_outcome
explicit_source_elements:
  - not recovering these investments
  - without either a massive new product line that doesn’t exist today
  - three or four Anthropic or OpenAI-sized compute contracts
evaluator_interpretation:
  - Read the forecast as applying to Microsoft, Amazon and Google, the firms discussed in the surrounding passage.
  - Read recovery as cumulative net proceeds attributable to the AI investments covering their cost. Revenue alone does not establish recovery.
  - Read the compute contracts as additional contracts, following the surrounding demand for new customers and revenue.
  - The exceptions are necessary conditions asserted by the speaker, not sufficient conditions guaranteeing recovery.
  - No deadline is stated. The nearby discussion of Oracle in 2032 does not supply one for this forecast.
support_condition: A final accounting shows that the specified investments were not recovered, with no qualifying new product line or additional contracts during their economic lives.
contradiction_condition: A documented recovery of the specified investments occurs while neither asserted necessary condition has occurred.
measurement_requirements: Define the original investment cohort and reconcile its cumulative attributable proceeds, operating costs, continuing capital requirements and residual value. Document the timing and scale of any qualifying new products or contracts.
source_requirements: Company financial records with a defensible AI investment allocation, plus dated product and contract disclosures.
metric_scope:
  company: Microsoft, Amazon and Alphabet
  metric: Cumulative net recovery of AI investments existing at publication
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Documented investment recovery while both exceptions remain absent would conclusively contradict the forecast. Permanent closure and final accounting of the investment cohort without recovery or either exception could support it. Interim losses or revenues cannot settle it.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No recovery deadline or investment vintage is specified.
  - "'Massive' and 'Anthropic or OpenAI-sized' have no fixed monetary thresholds."
  - The required contract count may apply to each hyperscaler or to the group.
  - The absence of the exceptions cannot be established for an unlimited future period.
retrospective_or_prospective: retrospective
