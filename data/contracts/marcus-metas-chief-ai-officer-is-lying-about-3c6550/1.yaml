ambiguity_flags:
  - Foundation models and general-purpose AI systems are not identical categories, but Marcus expressly groups them together.
  - The surrounding discussion concerns regulation, while the specific historical assertion says 'first mention'; mentioning systems to exclude them differs from imposing direct obligations.
  - The French Council presidency is an institutional role, rather than evidence of exclusive French authorship of every underlying suggestion.
