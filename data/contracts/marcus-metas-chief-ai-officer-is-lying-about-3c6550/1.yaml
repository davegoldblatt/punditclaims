explicit_source_elements:
  - The first mention of foundation models
  - sometimes referred to as General Purpose AI
  - the middle of May 2022
  - From the French government.
evaluator_interpretation:
  - Read 'first mention' as the first express treatment of general-purpose AI in an AI Act proposal or negotiating text, including provisions specifying exclusions.
  - Read 'French government' as France acting through the French Council presidency.
  - The historical comparison covers the proposal and negotiations through May 2022, the claimed time of introduction. It starts with the Commission proposal on 21 April 2021.
  - The claim concerns who introduced the subject, rather than who first proposed direct obligations for general-purpose AI providers.
support_condition: The earliest relevant negotiating text expressly addressing general-purpose AI originated with the French Council presidency, with no earlier qualifying text from another presidency or institution.
contradiction_condition: An earlier negotiating text from another presidency or institution expressly addressed general-purpose AI before the French presidency's May 2022 intervention.
measurement_requirements: Compare dated negotiating documents, their institutional provenance, and their express provisions on general-purpose AI.
source_requirements: Prefer original Council or other EU negotiating documents. Use contemporary analysis to corroborate their chronology and meaning.
