assessment_axis: forecast_outcome
explicit_source_elements:
  - depreciation will spike
  - at some point
  - unless they intend to write the GPUs off
evaluator_interpretation:
  - Hyperscalers means Amazon, Alphabet, Microsoft and Meta, the four companies discussed in the surrounding passage.
  - The ordinary reading is a sharp increase in reported depreciation as the discussed GPU investments enter service. No numerical threshold or deadline is supplied.
  - The exception concerns an intention to write off the relevant GPUs. Silence about write-offs does not establish the absence of that intention.
  - The financial measure is company-reported depreciation expense, in the companies' reporting currency of US dollars.
support_condition: Dated disclosures establish that the relevant GPUs are being retained for use and that their entry into service produces a sharp increase in depreciation across the named hyperscalers.
contradiction_condition: The relevant GPU investments complete their use or disposition without a sharp depreciation increase and without the write-off exception applying. A period without a spike is insufficient.
measurement_requirements: Comparable depreciation expense over successive reporting periods, separating GPU-related changes from buildings, other equipment, amortization and changes in useful-life assumptions.
source_requirements: Financial statements and management disclosures identifying the relevant GPU assets, their treatment and associated depreciation. Evidence of the conditional antecedent is required.
metric_scope:
  company: Amazon, Alphabet, Microsoft and Meta
  metric: Reported depreciation expense associated with the discussed GPU investments
  currency: USD
  units: dollars
  accounting_basis: company_reported
  fiscal_or_calendar: fiscal
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: at some point
horizon_interval:
  start: 2026-09-22
  end: null
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: A post-publication disclosure can resolve support only if it establishes both the retention-for-use condition and the sharp GPU-related depreciation increase. Contradiction requires completed treatment of the relevant asset cohort without the predicted increase or the write-off exception.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical definition of spike or comparison baseline.
  - Unclear whether the prediction applies collectively or to every hyperscaler.
  - The write-off exception refers to intentions rather than an observable accounting charge.
  - The relevant GPU asset cohort is not precisely identified.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
