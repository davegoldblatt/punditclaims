  - argued for neurosymbolic approaches ... (as Sutskever now is)
  - more innate ... constraints (what Sutskever calls "new inductive constraints")
  - 2022 "Deep learning is hitting a wall" ... Kaplan scaling laws would eventually reach a point of diminishing returns (as Sutskever just did)
  - and/or
evaluator_interpretation:
  - "The claim has two sides: what Marcus's 2018 and 2022 pieces argued, and what Sutskever said in his November 25, 2025 Dwarkesh Patel interview. The interview transcript is the main record of what Sutskever said."
  - To avoid relying on Marcus's own writing as proof that he was right, a third-party description is used for the 2022 article.
  - The claim holds if the main points Sutskever made (scaling flattening, generalization problems) appear in the 2018/2022 pieces, and if the parallels Marcus drew (Sutskever now favouring neurosymbolic methods and innate constraints) are actually in what Sutskever said.
support_condition: The interview shows Sutskever saying scaling has diminishing returns and that models generalize poorly, and he also endorses neurosymbolic methods and built-in constraints, all of which Marcus's earlier articles had argued.
contradiction_condition: The interview shows Sutskever did not endorse neurosymbolic methods or innate constraints, or rejected them, so the claimed parallels on those points fail.
measurement_requirements: Compare the full Dwarkesh transcript (2025-11-25) with independent descriptions of Marcus's 2018 and 2022 articles.
source_requirements: Primary interview transcript; a third-party description of Marcus's articles.
