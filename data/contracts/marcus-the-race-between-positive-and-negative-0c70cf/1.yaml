  - proliferating fast
  - fake books
  - rings of fake websites designed to sell ads
  - election misinformation
  - articles partially written by GPT in which hallucinations may filter in
evaluator_interpretation:
  - The ordinary reading is rapid expansion of harmful applications across several domains, not an identical growth rate in every listed category.
  - The comparison with Marcus's personal reporting capacity is rhetorical and has no supplied measurable baseline.
  - The target is the current quarter through publication, the latest interval for which incident reporting could be available. Earlier counts supply comparison baselines.
  - The science clause identifies a possible route for errors; it does not assert that every AI-assisted paper contains hallucinations.
support_condition: Dated counts show substantial recent expansion in harmful applications, with contemporaneous documentation of their spread across the named domains.
contradiction_condition: Comparable evidence shows that the asserted expansion did not occur, or that the named applications were materially misidentified.
measurement_requirements: Separate newly discovered cases from newly created cases, and AI assistance from demonstrated harm.
source_requirements: Prefer original monitoring, research and official incident records; use reporting for cases without accessible primary documentation.
