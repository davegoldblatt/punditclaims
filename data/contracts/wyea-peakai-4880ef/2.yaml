evaluator_interpretation:
  - This is a conditional forecast. The antecedent is a clear, broad drop in AI usage, for example falling user counts or API volumes at major AI services.
  - "The consequent: big tech's total revenue (not just AI revenue, since the speaker did not narrow it) falls, and large completed data-center capacity sits idle. Cancelled or delayed construction is not the same as built capacity sitting unused."
  - The claim can be scored only if the usage drop has happened.
support_condition: After a documented broad drop in AI usage, big-tech revenue falls and large completed data-center capacity goes unused.
contradiction_condition: After a documented broad drop in AI usage, big-tech revenue does not fall, or data centers stay well used.
measurement_requirements: First, evidence of AI usage trends (user counts, token or API volumes). Then, if usage dropped, big-tech reported revenue and data-center use.
