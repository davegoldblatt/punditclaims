early_resolution_rule: Resolve in support only when dated evidence establishes the broad usage decline and both subsequent consequences. Current growth, isolated vacancies, or the passage of time alone cannot settle this undated conditional forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Usage has no specified metric, geographic scope, decline threshold, or duration.
  - A broad market decline is an evaluator interpretation; some narrower consumer measures report declines.
  - Big tech does not identify particular companies.
  - Revenue could mean AI-related revenue or total company revenue.
  - No currency or accounting basis is specified.
  - Acres does not establish a precise capacity threshold or distinguish leased space from active computing capacity.
  - No response lag is specified.
  - The relationship between the adjacent three-quarters forecast and this conditional sequence is ambiguous.
