assessment_axis: forecast_outcome
explicit_source_elements:
  - Once usage drops
  - so will the remarkable amounts of revenue that have flowed into big tech
  - acres of data centers sit unused
evaluator_interpretation:
  - I read usage as actual generative-AI use across the market. A temporary decline at one service does not by itself establish the condition.
  - I read the revenue consequence as a decline in big tech's AI-related revenue, and the capacity consequence as substantial completed data-center space becoming idle following that usage decline.
  - The claim requires both consequences. Slower revenue growth is not a revenue decline, and canceled construction is not completed capacity sitting unused.
  - The adjacent reference to three quarters concerns the predicted apocalypse. It does not clearly specify a deadline for completing this conditional sequence, so I leave its horizon open.
  - No accounting basis is stated or implied by an attributed financial figure. I therefore record it as unknown.
support_condition: A documented broad decline in generative-AI usage is followed by both lower comparable AI-related revenue across big tech and substantial completed data-center capacity becoming unused.
contradiction_condition: After a documented broad usage decline, comparable revenue and facility records establish that at least one promised consequence did not occur over the resulting contraction episode. Brief continued growth cannot conclusively contradict a forecast with no specified response lag.
measurement_requirements: Comparable usage measurements covering multiple major services and business uses; realized AI-related revenue measured consistently before and after the decline; and evidence of actual idle completed capacity. Adoption rates and leased-space vacancy are imperfect substitutes for usage volume and computing utilization.
source_requirements: Prefer independent usage measurements, company financial disclosures, and facility operating records. Establish the antecedent separately before assessing either consequence.
metric_scope:
  company: big tech; companies unspecified
  metric: revenue flowing into big tech, interpreted as AI-related revenue
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
