explicit_source_elements:
  - once it has raised its current ($6.5 billion to $7 billion) round
  - raise another round of at least the same size
  - by July 2025, if not sooner
evaluator_interpretation:
  - The deadline is July 31, 2025, the latest day the stated month can mean.
  - At least the same size means at least the amount actually raised in the referenced October round.
  - The ordinary forecast is that OpenAI would return for another large primary financing. Raising capital must include a completed investment, not merely an announcement, credit facility or secondary share sale.
  - Will have to is assessed as a prediction of repeat financing; the financing's occurrence cannot independently prove that no alternative was available.
  - Financing amounts are measured using transaction terms disclosed by the company or its investors, rather than an earnings accounting standard.
support_condition: After completing the referenced round, OpenAI receives at least that round's amount in a subsequent primary financing by July 31, 2025.
contradiction_condition: The antecedent occurs, but reliable financing records establish that no subsequent qualifying financing was completed by July 31, 2025.
measurement_requirements: Establish the initial round's actual amount, then verify completed primary investment in a separate round before the deadline. A first closing that already exceeds the threshold is sufficient.
source_requirements: Company or investor announcements and financial reports establishing completed investments.
