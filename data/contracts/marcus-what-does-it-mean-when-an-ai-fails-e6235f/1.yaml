assessment_axis: causal_assessment
explicit_source_elements:
  - The improvements, such as they are
  - come, primarily because
  - larger and larger sets of data
  - how human beings use word sequences
evaluator_interpretation:
  - The claim concerns the main cause of improvements from GPT-2 through GPT-3 and the successors discussed by June 2022.
  - Primarily means that increasing the quantity of training text was the leading explanation, rather than merely one useful contributor.
  - The ordinary reading concerns training-data quantity. It does not automatically include model parameter count, different training objectives, human feedback or prompting changes.
  - The sentence about pattern matching is not treated as a separately established theory of the models' internal representations.
support_condition: Controlled comparisons and a cross-generation accounting show that larger text datasets explain the dominant share of the relevant gains after accounting for model size, compute, data quality, prompting and training methods.
contradiction_condition: Controlled comparisons and a cross-generation accounting establish that another factor, or factors other than data quantity together, predominantly explain those gains.
measurement_requirements: Distinguish available dataset size from tokens actually processed, unique data from repeated exposure, and pretraining loss from downstream accuracy or human preference. Interacting factors require explicit causal comparisons.
source_requirements: Primary scaling experiments, ablations and documented training comparisons. Correlation between newer models and larger datasets is insufficient.
