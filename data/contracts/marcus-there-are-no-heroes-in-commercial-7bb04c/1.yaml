assessment_axis: forecast_outcome
explicit_source_elements:
  - if the humans are overtaxed
  - choosing many targets
  - rapidly
  - wind up overtrusting the technology
  - serious errors are still inevitable
evaluator_interpretation:
  - Treat this as a conditional forecast about subsequent AI-assisted targeting operations.
  - Both human overload and excessive reliance on AI must be established in the same operation.
  - A serious error means a materially mistaken targeting decision causing or threatening grave harm.
  - The ordinary occurrence reading predicts that serious errors will occur under these conditions. One incident cannot establish universal inevitability.
support_condition: A documented post-publication operation satisfies both conditions and produces a serious targeting error linked to them.
contradiction_condition: A finite error-free period cannot refute an undated prediction of eventual errors. Contradiction would require a clearly bounded interpretation and evidence that it failed; none is supplied here.
measurement_requirements: Identify the operation, review workload, time pressure, reliance on AI, erroneous targeting decision and causal connection. Distinguish allegations from investigative findings.
source_requirements: Prefer investigation findings and operational records. Credible reporting may establish facts provisionally, with competing accounts disclosed.
