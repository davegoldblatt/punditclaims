condition_status: unknown
early_resolution_rule: A serious targeting error after March 8, 2026 may settle the occurrence reading only if reliable evidence establishes both overload and overtrust in that operation and links them to the error. Earlier incidents and simulations do not settle this forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
