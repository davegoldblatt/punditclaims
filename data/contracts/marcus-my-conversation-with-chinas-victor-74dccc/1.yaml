evaluator_interpretation:
  - The referenced Marcus–Brundage terms operationalize success as at least eight of ten tasks under a mutually agreed judging panel.
  - The criteria specify technical feasibility by the deadline, with reasonable task adaptation and approximate per-task limits of $1 million of compute plus ten person-weeks.
  - Ten entirely separate bespoke systems do not satisfy the generality requirement.
  - The referenced criteria define the outcome; they are not an external antecedent that must occur before the forecast can be assessed.
  - Amodei's acceptance of the offered wager is not a condition of the forecast.
  - The wager amount is not a company financial metric.
support_condition: After December 31, 2027, the agreed judging process determines that fewer than eight tasks were technically feasible by that date under the referenced constraints.
contradiction_condition: At least eight tasks are established as technically feasible by December 31, 2027 under the referenced constraints and judging process.
measurement_requirements: Assess the ten tasks concerning movie understanding, novel understanding, biographies and obituaries, unfamiliar video games, legal briefs, long bug-free programs, Pulitzer-caliber books, Oscar-caliber screenplays, Nobel-caliber discoveries, and mathematical proof formalization. Apply the generality, human-involvement, reliability, and resource constraints.
source_requirements: The jointly stated terms define the test. Outcome evidence should be a documented judging decision or independently verifiable demonstrations explicitly assessed against those terms.
