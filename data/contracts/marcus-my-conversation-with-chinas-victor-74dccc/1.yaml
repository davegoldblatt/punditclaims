early_resolution_rule: Resolve early as contradicted only if a dated, documented assessment establishes satisfaction of at least eight tasks under the referenced rules. Isolated benchmark records, market odds, and general AGI announcements do not qualify. Nonachievement cannot establish support before the deadline.
