  - overselling doom and their own wares
  - literally and repeatedly calling for export controls themselves
evaluator_interpretation:
  - The outcome being explained is the June 12, 2026 export-control directive.
  - Repeated advocacy means separate public requests for export controls before the directive.
  - Considerable contribution means a material influence on the decision, rather than merely preceding it.
  - Overselling requires evidence of exaggeration. Public warnings alone do not establish exaggeration or its causal importance.
support_condition: Public advocacy records establish repeated requests, and decision records or credible accounts from officials show that exaggerated risk or product claims and those requests materially contributed to the directive.
contradiction_condition: A sufficiently complete decision record establishes that these factors did not materially contribute, or reliable records refute the claimed repeated advocacy.
measurement_requirements: Distinguish controls on chips and model weights from restrictions on access to hosted models. Establish influence on the particular directive.
source_requirements: Anthropic's original submissions and documented official explanations, preferably supported by decision records.
