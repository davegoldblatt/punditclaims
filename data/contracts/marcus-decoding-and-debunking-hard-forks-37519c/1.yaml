assessment_axis: forecast_outcome
explicit_source_elements:
  - At least for another decade or two
  - probably more
  - big projects
  - always going to require software architects who know what they are doing
evaluator_interpretation:
  - In the coding context, software architects means humans exercising competent architectural judgment, whether or not they hold that job title.
  - Big projects means substantial software systems with significant integration, reliability and maintenance requirements. Marcus supplies no numerical size threshold.
  - The minimum stated duration ends on 2035-03-02. The latest explicitly quantified duration ends on 2045-03-02, which is used for the horizon endpoint. 'Probably more' supplies no further deadline.
  - Requiring architects means needing their architectural input. Merely continuing to employ them would not establish necessity.
support_condition: Evidence across substantial software projects through the stated duration shows that competent human architectural input remains necessary. Present-day examples alone cannot establish the forecast.
contradiction_condition: A well-documented substantial software project succeeds without competent human architectural input during the claimed interval. A qualifying example before 2035-03-02 contradicts both stated durations; an example between 2035 and 2045 depends on the duration interpretation.
measurement_requirements: Project scope, design records, human contributions, testing, deployment and operational results must establish both substantial complexity and success without human architectural input. Generated-code percentages alone are insufficient.
source_requirements: Public project records and independently assessable results, preferably including design history and operational evidence. Vendor assertions or isolated benchmark scores cannot alone establish the counterexample.
metric_scope: null
original_horizon: At least for another decade or two and probably more
horizon_interval:
  start: 2025-03-02
  end: 2045-03-02
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An independently verifiable successful substantial software project completed without competent human architectural input before 2035-03-02 would conclusively contradict the universal forecast under either stated duration. No early event can establish continued necessity throughout the future interval.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The duration is expressed as a decade or two, followed by an unbounded probabilistic extension.
  - Big projects has no specified size or complexity threshold.
  - Architect may describe a job title or a function; the contract uses the function.
  - Observed human participation does not by itself establish necessity.
  - Whether autonomous reimplementation benchmarks count as big projects could change the assessment.
retrospective_or_prospective: prospective
