assessment_axis: historical_observation
explicit_source_elements:
  - '"venture is still enamored with AI"'
  - '"and very little else"'
  - '"plenty of companies to invest in, companies that have good ideas that generate revenues"'
  - present tense, post dated 2023-08-10; "still" points to a state that had lasted for some time
evaluator_interpretation:
  - "The claim has two parts. Part A: AI was the main focus of venture enthusiasm in mid-2023. Part B: venture showed 'very little' interest in anything else."
  - "He gave no measure. Plain reading: where venture money and attention went in 2023 up to the post. AI counts as the focus if data and reporting single it out as the standout or 'bright spot' sector. 'Very little else' counts as true if non-AI sectors drew only a small part of venture money or interest. It counts as false if most venture money still went to non-AI sectors, or if other sectors drew …"
  - Because of 'still', the period runs from the start of 2023 (after ChatGPT's launch) to the post date. This covers both the Q2 AI surge and the latest monthly data before the post (July 2023). It is not limited to one month.
  - "'Very little else' is read as strong but ordinary wording. It is not read as literally zero, and it is not read as just a figure of speech that means nothing."
  - The clause about 'plenty of companies ... that generate revenues' is framing and opinion about investable firms. It is not scored separately.
  - Weak non-AI funding fits his wider point that VCs were hoarding cash. The test is whether AI was the overriding focus of the money that was invested, not whether total investment was low.
support_condition: Data from 2023 up to the post shows AI as the clear standout in venture investment, and non-AI sectors drawing only a small part of venture money or interest.
contradiction_condition: Data from the same period shows that most venture money still went to non-AI sectors, or that other single sectors outdrew AI, so that 'very little else' does not hold. Strong AI enthusiasm alone would not contradict Part A.
measurement_requirements: AI share of global or US venture funding in H1 2023 and in the months right before the post, plus sector breakdowns, from venture data providers such as Crunchbase or PitchBook.
source_requirements: Venture data providers (Crunchbase, PitchBook, CB Insights) or reputable news reports of their data, available by the evaluation date and describing 2023 up to August.
