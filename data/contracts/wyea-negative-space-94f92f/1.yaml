assessment_axis: historical_observation
explicit_source_elements:
  - venture is still enamored with AI and very little else
  - plenty of companies to invest in
  - good ideas that generate revenues
evaluator_interpretation:
  - The plain reading is that venture investors overwhelmingly favor AI, with little investment interest extending to other businesses.
  - Use actual funding allocation as an observable measure of investment interest. Enthusiasm and completed investments can differ.
  - Use July 2023, the latest complete calendar month before the August 10 post, for the ongoing observation.
  - Read the unqualified reference to venture capital as industry-wide; use global funding data.
  - Treat 'good ideas' as an evaluative description. The central testable assertion is the claimed concentration on AI, rather than the investment merits of unspecified companies.
support_condition: Industry-wide evidence shows investment overwhelmingly concentrated in AI, with other sectors receiving only marginal funding and attention.
contradiction_condition: Industry-wide evidence shows substantial investment continuing outside AI, with AI accounting for only a minority of funding. This contradicts the concentration assertion under the funding-allocation reading, even if enthusiasm for AI was strong.
measurement_requirements: Use contemporaneous sector funding shares with a consistent denominator. Consider evidence about investor attention separately. Do not equate a funding downturn outside AI with an absence of interest.
source_requirements: Prefer original venture funding databases and their published analyses. Investor interviews can establish expressed enthusiasm but cannot alone establish industry-wide concentration.
