assessment_axis: historical_observation
explicit_source_elements:
  - finding of the Remote Labor Index
  - AI could only do about 2.5% of jobs
  - reported recently by the Washington Post
  - consistent with
evaluator_interpretation:
  - Because the sentence expressly attributes a finding to RLI, jobs means the commissioned projects in that benchmark.
  - The percentage refers to the best tested agent's end-to-end completion rate, not every agent's rate or the share of all occupations that AI can perform.
  - The target is the original RLI evaluation reported in 2025, rather than benchmark updates after the post.
  - Consistent with is read as compatibility with limited autonomous performance, not proof of small aggregate economic benefits.
  - The Washington Post attribution is checked separately from the primary numerical finding.
support_condition: The original RLI report records approximately 2.5% as the highest end-to-end project completion rate among evaluated agents.
contradiction_condition: The original report gives a materially different leading completion rate, or the 2.5% figure measures something other than successful completion of benchmark projects.
measurement_requirements: Verify the numerator, denominator, completion standard, evaluated systems, and original study version. Do not extrapolate benchmark completion to all jobs or economic value.
source_requirements: Use the original RLI paper for the result and methods. Use readable Washington Post coverage only to verify its wording and attribution.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: "2025"
  end: "2025"
  precision: year
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Jobs could be mistaken for all occupations rather than the benchmark's projects.
  - The sentence does not specify that 2.5% was the highest tested agent's rate.
  - The benchmark's measurement period is implicit in the cited original study.
  - Compatibility with low economic value is weaker than evidence establishing low economic value.
