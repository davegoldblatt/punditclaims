assessment_axis: forecast_outcome
explicit_source_elements:
  - by 2029
  - will have actually burned more than $290 billion
  - assuming that it survives that long
evaluator_interpretation:
  - Cash burn means cumulative negative free cash flow, consistent with the surrounding annual free-cash-flow discussion. It excludes fundraising, non-cash losses, and unspent contractual commitments.
  - The comparison period is calendar 2025 through 2029 because the surrounding projection table begins in 2025.
  - The latest reasonable deadline is December 31, 2029. The phrase could instead mean the beginning of 2029; that ambiguity does not affect the present assessment.
  - Survival means continuing to operate as OpenAI through the chosen endpoint.
  - The separate expression of disbelief in OpenAI's survival is not scored as an additional claim.
  - The accounting basis is estimate because Zitron builds his forecast from reported financial projections.
support_condition: OpenAI survives through the endpoint and comparable realized cash-flow records show cumulative net cash burn exceeding USD 290 billion during calendar 2025–2029.
contradiction_condition: OpenAI survives through the endpoint and comparable complete cash-flow records show cumulative net cash burn of USD 290 billion or less during calendar 2025–2029.
measurement_requirements: Use a consistent free-cash-flow definition across the whole period and reconcile any changes in scope. Financing inflows, operating losses, valuation, and gross compute commitments cannot substitute for cash burn.
source_requirements: Company cash-flow statements, audited accounts, filings, or credible reporting of actual financial records, plus evidence that OpenAI survived through the endpoint.
