  - Ongoing-state observation assigned to the latest completed quarter.
  - No explicit reference year or annualization method.
  - No commissioning horizon for the proposed capacity.
  - No definition of the favorable scenario.
  - Demand may exclude internally consumed compute, but the passage does not say.
  - Venture capitalists may mean conventional venture funds or outside financiers more broadly.
  - The capacity-to-spending conversion assumptions are unstated.
