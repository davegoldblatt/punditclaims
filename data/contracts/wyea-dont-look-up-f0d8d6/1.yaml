assessment_axis: historical_observation
explicit_source_elements:
  - 190GW of capacity in planning
  - $1.62 trillion and $2.92 trillion in annual compute spend
  - in the best-case scenario
  - roughly $110 billion in annual demand
  - 90%+ of that coming from two companies
  - only spend that money if they’re fed it by venture capitalists
evaluator_interpretation:
  - Read the two companies as OpenAI and Anthropic, as identified in the surrounding passage.
  - Read annual demand as an estimated yearly spending rate for AI compute, rather than AI application revenue or infrastructure financing.
  - Use Q2 2026, the latest completed quarter before the post, as the reference period for the ongoing demand and capacity assessment.
  - Read the trillion-dollar range as an estimate of the annual customer spending needed to sustain the proposed capacity when operating, not a claim that this spending was already occurring.
  - Best-case scenario is an unspecified favorable estimation scenario, not an independently observable forecast antecedent.
  - Treat the monetary figures as estimates. The passage presents a scenario calculation rather than reported financial accounts.
support_condition: A reproducible capacity and operating-economics model yields the stated annual spending range, while a comparable customer-demand estimate is roughly $110 billion, at least 90% attributable to the two labs, with financing records establishing the claimed dependence.
contradiction_condition: Comparable evidence materially overturns the required spending range, the demand ceiling, the concentration percentage or the asserted exclusive dependence on venture financing.
measurement_requirements: Reconcile planned, operating and canceled capacity; facility power versus IT load; utilization; hardware mix; pricing; financing costs; and commissioning dates. Measure customer compute spending without double-counting payments through suppliers. Keep financing, revenue, capex and compute rental spending separate.
source_requirements: A dated capacity database, transparent operating-economics assumptions, comparable customer-spending records and financing disclosures.
