evaluator_interpretation:
  - "The ordinary reading is a development heuristic: initial useful functionality often comes more easily than eliminating remaining failures."
  - The 80/20 wording is approximate, not an asserted universal measured ratio.
  - The driving example requires historical evidence spanning decades; the broader statement requires evidence beyond one industry's difficult cases.
  - The target is the historical development experience through the post. The speaker gives no exact beginning.
  - Successful deployment within a restricted operating area does not imply that every remaining driving problem has been solved.
support_condition: Representative development histories or reliability studies show repeatedly disproportionate effort to eliminate residual failures after comparatively easy initial progress, including a decades-long driving history.
contradiction_condition: Representative evidence shows that residual failures are generally no harder to remove than initial functionality is to achieve, or decisively disproves the asserted driving history.
measurement_requirements: Compare engineering effort or elapsed development time against reliability gains while holding task scope and operating conditions reasonably consistent.
source_requirements: Primary development histories, reliability evaluations and research on residual failure modes; isolated anecdotes cannot establish how often the pattern occurs across AI.
