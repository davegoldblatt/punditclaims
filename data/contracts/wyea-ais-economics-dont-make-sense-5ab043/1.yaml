assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI and Anthropic
  - 50% of AI data centers under construction
  - unclear whether the customer base for AI compute exists outside
  - a massive systemic weakness if either of them lacks the money to pay
evaluator_interpretation:
  - The surrounding GW discussion makes capacity share the ordinary reading of 50%, rather than a count of buildings.
  - "I use the latest prepublication monthly snapshot: April 2026 through April 28. The post does not identify a measurement date."
  - Demand should be attributed to the ultimate compute customer, including capacity supplied through intermediaries, without double counting.
  - The nonpayment clause describes a vulnerability, not a forecast that either company will default. It does not condition the present-tense concentration claim.
  - The statement about other customers is hedged. Evidence of another customer is relevant context, but does not by itself disprove the 50% share.
support_condition: A consistent April inventory attributes approximately half of AI capacity under construction to OpenAI and Anthropic, with identifiable contractual exposure to those customers.
contradiction_condition: A comparable April inventory establishes a materially different combined capacity share. Evidence of other customers alone does not settle that share.
measurement_requirements: A common construction-capacity denominator and customer-attributed numerator, using the same geography, power basis, project stages, and snapshot date. Contract protections and replacement demand are needed to assess the systemic-risk language.
source_requirements: Independent construction records combined with customer contracts or company disclosures. Announced compute purchases alone do not establish capacity under construction.
