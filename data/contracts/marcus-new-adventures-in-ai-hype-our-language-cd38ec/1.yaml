explicit_source_elements:
  - no more and no less
  - put together sequences of words
  - without any coherent understanding of the world behind them
  - applies as much to today’s LLM’s as those of three years ago
evaluator_interpretation:
  - The plain reading is that these models lack meaningful, coherent representations of situations and relationships, even when their language sounds convincing.
  - Understanding is assessed through generalization, consistency and interventions on internal representations. Fluent answers alone do not establish it.
  - The context explicitly connects June 2022 systems with those available on April 25, 2025. Later systems cannot settle this historical claim.
  - Understanding is distinct from sentience. Evidence about one does not establish the other.
support_condition: Representative evaluations establish that the relevant models rely on surface associations without coherent representations supporting generalization across related situations.
contradiction_condition: Reproducible evaluations and causal interventions demonstrate coherent, generalizable representations of situations and relationships in a model covered by the claim.
measurement_requirements: Tests should distinguish memorization from generalization and examine consistency under changed circumstances. Internal probes should be validated by interventions.
source_requirements: Primary research identifying the tested models, methods, results and limitations.
