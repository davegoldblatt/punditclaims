explicit_source_elements:
  - Fact is
  - xAI ain’t doing all that great
evaluator_interpretation:
  - The ordinary reading is weak business performance, not merely the absence of current profits.
  - Assess operating losses together with revenue development, commercial progress, and financing capacity.
  - "For this ongoing financial observation, use the latest reported quarter identified before publication: July through September 2025. Later fundraising is context."
  - The financial metric below records the profitability component; it is not a complete definition of business health.
  - The surrounding reference to press reporting implies an estimate basis.
support_condition: Contemporaneous financial and commercial evidence establishes materially weak performance overall, considering both operating results and the resources available to sustain development.
contradiction_condition: Comparable evidence establishes strong commercial performance and a sound financial position overall.
measurement_requirements: Keep realized quarterly revenue, net losses, cash spending, fundraising, and valuations separate. Do not treat startup losses alone as proof of business failure.
source_requirements: Prefer standalone xAI financial records and independently measured commercial results. Label reporting based on private documents and distinguish xAI from X.
