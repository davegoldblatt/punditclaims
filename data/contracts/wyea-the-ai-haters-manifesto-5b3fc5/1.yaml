ambiguity_flags:
  - Doomers identifies no fixed set of people.
  - Stopping could mean temporary interruption or permanent prevention.
  - Substantiation could mean empirical support for mechanisms or proof of catastrophic predictions.
  - The particular superintelligence concerns are not specified.
