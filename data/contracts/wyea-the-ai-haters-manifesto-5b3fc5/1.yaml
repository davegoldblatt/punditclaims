assessment_axis: historical_observation
explicit_source_elements:
  - AI doomers warning about spooky superintelligences
  - without ever succeeding in stopping a single thing
  - or even substantiating their concerns
evaluator_interpretation:
  - Ever covers the historical record through the post date; no starting date is supplied.
  - Stopping requires an actual halt or restriction attributable to the relevant advocates. A safety-related pause alone does not prove advocacy caused it.
  - Substantiating means supplying meaningful empirical evidence for a stated concern about advanced AI control or alignment. It does not require a catastrophe to have occurred.
  - Media prominence and the description ridiculous are framing, not separately scored numerical claims.
support_condition: A sufficiently comprehensive record establishes neither an attributable halt nor meaningful empirical evidence for the relevant concerns.
contradiction_condition: At least one attributable halt or a credible empirical demonstration materially supports a relevant concern about advanced AI control or alignment.
measurement_requirements: Identify the concern, the advocates and any causal connection to a halt. Distinguish experimental risk mechanisms from demonstrated real-world catastrophe.
source_requirements: Primary decision records and empirical research, including methodological limitations and material alternative explanations.
