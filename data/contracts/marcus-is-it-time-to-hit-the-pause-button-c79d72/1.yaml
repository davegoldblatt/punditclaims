assessment_axis: historical_observation
explicit_source_elements:
  - today’s "chatbots" like Sydney (Bing) and OpenAI's ChatGPT
  - vastly more powerful
  - far more capable of fooling people
  - things have dramatically changed since then
evaluator_interpretation:
  - The comparison is with Microsoft's 2016 Tay, as established by the preceding paragraph.
  - Power means breadth and competence across useful language tasks. Fooling people means inducing mistaken beliefs about generated information or its human origin; it does not require deliberate deception.
  - Both improvements must be substantial. No particular numerical multiplier is implied.
  - The current-state period is February 1–26, 2023, the rollout period discussed in the post. Earlier ChatGPT research and the 2016 Tay baseline are context.
support_condition: Comparable evaluations or sufficiently detailed documented interactions establish substantially broader capabilities and substantially greater ability to mislead people than Tay.
contradiction_condition: Comparable evidence establishes that either useful capabilities or ability to mislead people did not substantially exceed Tay's.
measurement_requirements: Identify model versions, tasks and what counts as fooling a person. A direct experiment is preferable, but credible comparable historical records could suffice.
source_requirements: Primary evaluations and documented interactions, supplemented by reputable reporting where original records cannot be read.
