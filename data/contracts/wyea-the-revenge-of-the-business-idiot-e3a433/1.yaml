assessment_axis: historical_observation
explicit_source_elements:
  - nothing has actually changed
  - Organizations writing massive amounts of code using LLMs
  - massive product stability issues
  - Zillow
  - spending millions of dollars a year
  - increasing software reviewer loads by 29,000 hours a month
evaluator_interpretation:
  - Read the broad allegation as a lack of improvement in useful software delivery accompanied by serious reliability problems. Code volume alone does not measure useful output.
  - Read 29,000 hours as an incremental monthly human review burden caused by added code, rather than total review time, elapsed pull-request time or a hypothetical projection.
  - Treat descriptions such as 'slop' as rhetoric; assess defects, maintainability, delivery and review labor.
  - For ongoing operations, use the latest complete month before publication and the current period through publication.
  - The linked background article presents annual spending as an extrapolation from current spending. The monetary component is therefore an annualized estimate for 2026, not a completed year's expenditure.
support_condition: Comparable engineering records show no useful delivery improvement and serious stability problems at the organizations invoked, while Zillow records establish an additional 29,000 human review hours per month and multimillion-dollar annualized AI spending.
contradiction_condition: Comparable outcome records show material delivery improvements without the alleged deterioration, or Zillow's underlying records establish that the 29,000-hour figure is incorrect or measures something other than incremental monthly human review labor.
measurement_requirements: Measure delivered functionality, defects or incidents, active human review time and staffing against a comparable baseline. Identify the month, aggregation method and causal attribution. Keep annualized spending separate from realized expenditure.
source_requirements: Authenticated Zillow records or independent verification of the internal deck, plus primary engineering measurements. Zitron's own reporting cannot independently substantiate his claim.
