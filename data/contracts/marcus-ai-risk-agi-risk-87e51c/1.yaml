explicit_source_elements:
  - computers rapidly and radically self-improve themselves
  - I don’t see as an immediate possibility
evaluator_interpretation:
  - The normalized proposition concerns Marcus's expectation about self-improvement, rather than his tentative description of Hinton's and Musk's views.
  - The surrounding discussion of superintelligence suggests substantial improvements to the systems themselves, rather than revisions to individual answers.
  - Marcus supplies neither a latest date for 'immediate' nor a threshold for 'rapidly and radically'. His expression of doubt also supplies no probability that could be tested.
  - A fixed evaluation window or numerical improvement threshold would add commitments that he did not make.
support_condition: No sufficiently definite support condition can be set from these words. Failure to observe an unspecified possibility does not establish that it was unavailable.
contradiction_condition: A clear demonstration of rapid, radical self-improvement immediately after publication could challenge the statement, but its timing and magnitude would still require thresholds absent from the claim.
measurement_requirements: Would require a defined time window, an improvement threshold, and a distinction between improving outputs and improving the system's underlying capabilities.
source_requirements: Dated technical reports documenting the system, human involvement, changes made, elapsed time, and independently measured capability gains.
