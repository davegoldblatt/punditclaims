target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - Immediate has no identifiable latest date.
  - Rapidly and radically have no stated thresholds.
  - Self-improvement could mean improving outputs, modifying software, or increasing general capabilities.
  - I don't see expresses an unquantified judgment about possibility.
