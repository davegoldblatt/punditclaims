evaluator_interpretation:
  - The comparison is between early January 2024 and prices available by January 13, 2026.
  - The ordinary reading concerns public LLM API prices for comparable capability, with competitive price reductions across suppliers.
  - Roughly a hundred times lower means approximately one hundredth of the earlier price. Marcus supplies no model basket, capability threshold, or token weighting.
  - This is a market service-price claim, not a claim about a particular company's financial accounts; metric_scope is therefore null.
support_condition: Documented competitive cuts and representative, capability-matched API comparisons show an approximately hundredfold price reduction over the stated two years.
contradiction_condition: Representative comparisons over those same endpoints and on the same capability and token basis show a materially different reduction, or evidence establishes that the asserted competitive cuts did not occur.
measurement_requirements: Hold capability, currency, input/output weighting, caching treatment, context length, and service conditions constant. Separate price per token from total spending and cost per completed task.
source_requirements: Historical provider price schedules and reproducible independent comparisons covering both endpoints; reputable reporting may establish competitive responses.
