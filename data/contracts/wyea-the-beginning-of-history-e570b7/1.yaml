assessment_axis: historical_observation
explicit_source_elements:
  - AI data centers
  - requires endless debt
  - massive upfront costs for NVIDIA chips and construction
  - that debt was already becoming difficult to raise
evaluator_interpretation:
  - ‘Endless debt’ is read as a continuing need for substantial borrowing during the buildout, rather than literally infinite borrowing.
  - ‘Becoming difficult’ means worsening access or terms, such as lender withdrawals, failed syndication or higher required spreads.
  - Use February 2026, the latest complete calendar month before the post, for the ongoing debt-market observation. Only developments established before the conflict are relevant to the pre-war component.
  - The claim concerns an industry-wide pattern. A single disputed financing report cannot establish that pattern.
  - No accounting basis, borrowing amount or debt-flow definition is supplied.
support_condition: Contemporaneous evidence establishes recurring borrowing dependence and a broad deterioration in AI data-center debt access before the war.
contradiction_condition: Comparable evidence establishes that the buildout did not depend on continuing borrowing, or that financing access and terms were broadly stable or improving during the target period.
measurement_requirements: Compare debt dependence and financing access across developers and tenants. Distinguish announced plans from completed borrowing, project debt from corporate bonds, and individual credit problems from an industry-wide deterioration.
source_requirements: Prefer borrower disclosures, lender records and systematic credit-market measurements. Preserve denials when reports rely on unnamed lenders or disputed deal details.
