assessment_axis: historical_observation
explicit_source_elements:
  - Hyperscalers
  - do not have meaningful AI revenues of any kind
  - outside of their own pseudo-startup investments
evaluator_interpretation:
  - The plain reading is that hyperscalers lack a substantial commercial AI revenue business serving customers other than their investee labs.
  - Meaningful means commercially substantial, not necessarily profitable or sufficient to recover capital expenditure.
  - The exclusion concerns investee labs as paying customers. Selling an AI product to an unrelated enterprise is not automatically excluded merely because the product uses a lab's model.
  - I use January–March 2026, the latest common reportable calendar quarter before the post.
  - The surrounding argument relies on company-disclosed AI revenue, so the contract uses company_reported accounting basis.
support_condition: Customer-level realized AI revenue disclosures show that revenue outside investee labs was negligible across the relevant hyperscalers.
contradiction_condition: At least one hyperscaler demonstrates commercially substantial realized AI revenue from customers outside its investee labs during the target period.
measurement_requirements: Separate AI revenue from total cloud or software revenue, exclude investee customers, and distinguish realized revenue from paid seats, usage, bookings and annualized run rates.
source_requirements: Company revenue disclosures with customer or product attribution, or independently verified records that can be reconciled to them.
metric_scope:
  company: Microsoft, Amazon, Alphabet and Oracle
  metric: Realized AI revenue from customers other than investee AI labs
  currency: USD
  units: dollars
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
