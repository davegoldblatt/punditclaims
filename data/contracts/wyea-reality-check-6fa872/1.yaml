ambiguity_flags:
  - Market recognition has no specified observable test.
  - Growth may mean ordinary continued growth or the hypergrowth discussed in the surrounding text.
  - The severity of 'hell to pay' is unspecified.
  - The number or proportion meant by 'many' hardware companies is unspecified.
  - The geographic and industry boundaries are unspecified.
  - There is no forecast deadline or specified lag after the trigger.
  - No valuation measure, currency, or accounting basis is specified.
