assessment_axis: forecast_outcome
explicit_source_elements:
  - Google, Microsoft, Amazon and Meta
  - do not have any other ways to continue showing growth
  - when the market works that out
  - there will be hell to pay
  - every public software company
  - many of the hardware ones too
evaluator_interpretation:
  - Assess the supplied conditional forecast. The assertion about growth alternatives defines its antecedent; it is not separately scored as a historical observation.
  - In context, 'other ways' means growth avenues beyond generative AI.
  - The ordinary reading of 'hell to pay' through valuations is substantial losses in market equity values attributable to the stated market reassessment.
  - The antecedent requires documented market recognition that all four named companies lack other growth avenues. Concern about AI investment returns or AI competition alone does not establish it.
  - Retain the universal software scope. A declining sector index alone cannot establish losses at every public software company.
  - No numerical loss threshold, hardware-company count, geographic boundary, or response deadline is supplied. None is invented.
  - The specific rule for an unestablished conditional antecedent takes precedence over the general unresolved outcome for undated forecasts.
support_condition: A documented market reassessment establishes the stated antecedent, followed by substantial valuation losses attributable to that reassessment across every public software company and many public hardware companies.
contradiction_condition: After the antecedent is established, a clearly completed market repricing provides firm-level counterexamples to the universal software prediction or shows that substantial, widespread valuation damage did not occur. Mere passage of time cannot contradict this undated forecast.
measurement_requirements: Establish the trigger independently of falling prices. Then examine company-level equity valuations around the documented repricing, with consistent sector classifications and adjustments for corporate actions. Separate the proposed cause from other market drivers. Index returns cannot prove universal company coverage.
source_requirements: Use contemporaneous investor statements and credible market reporting to establish the reassessment, corroborated by primary market measurements. Company disclosures can describe businesses but cannot alone establish what the market recognized. All evidence must have been available by 2026-10-28.
