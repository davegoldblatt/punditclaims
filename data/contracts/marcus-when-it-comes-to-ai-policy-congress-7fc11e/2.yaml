assessment_axis: forecast_outcome
explicit_source_elements:
  - Any regulation that is proposed
  - absorbed as a cost of business
  - trivial for trillion dollar companies
  - relatively modest costs of regulation
  - any real-world impact whatsoever
  - those likely tied outcomes
evaluator_interpretation:
  - The context concerns proposed state AI regulation and its compliance burden on very large technology companies.
  - Absorbed as a cost of business means companies can bear the costs while continuing their AI activities; trivial means financially immaterial to those companies.
  - The firm prediction concerns regulatory costs and their competitive effects. Likely tied outcomes remains qualified background, not an independently scored prediction of a tie.
  - No serious argument is read as the speaker's emphatic assessment of the claimed cost mechanism, not as a count of whether someone published an opposing opinion.
  - Proposals must create actual obligations before realized compliance costs can be tested. No deadline, financial ratio, or accounting convention is supplied.
  - This is an unconditional cost prediction over the relevant proposals, not a forecast conditional on the US and China actually tying.
support_condition: For covered regulations that become operative, measured attributable compliance costs are financially immaterial to affected trillion-dollar companies, and credible causal research finds no material effect from those costs on comparative US-China generative-AI capabilities. Individual examples support only their observed scope.
contradiction_condition: A covered regulation produces documented, financially material compliance costs for an affected trillion-dollar company, or credible causal evidence shows those costs materially change comparative US-China generative-AI capabilities.
measurement_requirements: Company-specific realized compliance expenditures and a justified materiality comparison, separating regulatory costs from ordinary safety spending and other business costs. Competitive effects require a credible comparison with what would have happened without the regulation.
source_requirements: Company disclosures, regulatory records, and independent causal studies. Economy-wide projections, burdens on small firms, political objections, and export-control effects alone do not establish the claimed company-level outcome. A money verdict also requires a justified accounting basis.
metric_scope:
  company: Trillion-dollar technology companies affected by proposed state AI regulation
  metric: Financial materiality of realized AI-regulation compliance costs
