explicit_source_elements:
  - requires more high-quality data than currently exists
  - to progress past the point we're currently at
  - outputs of generative AI are deeply unreliable
evaluator_interpretation:
  - The surrounding argument concerns the stock of high-quality human-generated material available in April 2024.
  - The plain reading asserts that meaningful further improvement in output correctness requires exceeding that stock.
  - Controlled improvements in error correction or objectively checked answers count as progress. They need not eliminate every hallucination.
  - Later experiments can test the claimed necessary condition; this is not a forecast with a deadline.
support_condition: Evidence establishes that meaningful further improvements require additional high-quality human data beyond the April 2024 stock, rather than changes in training, data use, or inference.
contradiction_condition: Controlled experiments demonstrate meaningful improvements in correctness using existing human datasets, self-generated training examples, or additional computation without requiring a larger human-data stock.
measurement_requirements: Identify the baseline, held-out evaluation, human-data inputs, and intervention. Distinguish increased accuracy from complete reliability.
source_requirements: Primary experimental papers with disclosed methods and comparisons; unsupported product claims are insufficient.
