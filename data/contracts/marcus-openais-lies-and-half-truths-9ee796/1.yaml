explicit_source_elements:
  - happy to let the public believe that we are open
  - really just a recruiting promise
  - don’t intend to live up to
  - Ilya, January 2016
  - shouldn’t disabuse people of that notion
  - Sam, May 2016
evaluator_interpretation:
  - This attributes an intention to leaders, rather than merely observing a later reduction in openness.
  - The claim requires evidence that the 2015 pledge was knowingly insincere, as well as evidence of recruiting motives and deliberate preservation of a public misconception.
  - A plan for genuine near-term sharing followed by restrictions does not automatically establish that the original pledge was only a sham.
  - The target period covers the 2015 pledge and the two 2016 episodes expressly identified.
support_condition: Contemporaneous records establish the recruiting purpose, an intention not to honor the actual 2015 commitments, and a decision to leave the resulting public misconception uncorrected.
contradiction_condition: Records establish that the alleged statements were materially misrepresented or demonstrate genuine intent to honor the actual pledge, rather than the intention Marcus attributes.
measurement_requirements: Compare the pledge's actual wording with complete contemporaneous discussions of publication, recruitment and public messaging.
source_requirements: Original correspondence and the founding announcement; contemporaneous reporting for meetings without an accessible original record.
