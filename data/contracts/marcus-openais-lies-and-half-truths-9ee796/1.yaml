ambiguity_flags:
  - Openness can mean publishing research, releasing every model or sharing the benefits of AI.
  - The phrase 'just a recruiting promise' attributes an exclusive motive.
  - The pledge encouraged publication but did not expressly promise publication of every future result.
  - The cited May episode is a reported meeting, not an internal email.
