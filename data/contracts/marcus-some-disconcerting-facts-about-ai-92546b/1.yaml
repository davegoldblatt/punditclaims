evaluator_interpretation:
  - Read this as a directional forecast that the debt-financed AI data center buildout will materially cause a recession or a more severe economic crisis.
  - Use the United States because the surrounding discussion concerns US credit issuance and a comparison with the 2008 crisis.
  - Recession is the minimum named outcome; maybe worse does not require a depression or banking collapse.
  - No deadline is supplied. The later reference to pain over the next few years does not clearly date this recession forecast.
  - The descriptions in the supplied conditions field are interpretive qualifications, not contingent antecedents.
support_condition: A US recession or more severe economy-wide crisis occurs after publication, with credible evidence that the debt-financed AI buildout materially caused it.
contradiction_condition: A clearly bounded conclusion of the referenced buildout and associated debt adjustment occurs without the predicted economic harm, with sufficient follow-up to exclude delayed effects. Mere continued growth cannot contradict an undated forecast.
measurement_requirements: Establish an economy-wide downturn and its timing separately from causal attribution. AI stock declines, individual defaults, and credit-market stress alone are insufficient.
source_requirements: NBER recession dating or comparably strong official economic evidence, combined with credible research or official investigations linking the downturn to AI investment and debt.
