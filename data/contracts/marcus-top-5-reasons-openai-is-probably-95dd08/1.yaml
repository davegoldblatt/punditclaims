assessment_axis: historical_observation
explicit_source_elements:
  - Big customers are still skittish
  - JP Morgan, Apple, and others have bans on their use
  - at least partly motivated around concerns about data leaks
  - reliability is a problem too
evaluator_interpretation:
  - The plain reading is that major employers restricted employee use of external LLM services such as ChatGPT. It does not imply that these employers prohibited every internal AI project or every authorised LLM application.
  - Skittish describes caution demonstrated by restrictions, not a separately measurable psychological state.
  - The data-leak language describes a reason for restrictions. It is not a conditional forecast.
  - For this ongoing, non-financial state, the target is the latest publicly reported policy and reliability picture in 2023 through the post date. These policies and evaluations have no regular quarterly reporting period.
support_condition: Contemporaneous reporting establishes restrictions at JPMorgan and Apple and at least one other major employer, identifies confidentiality concerns as a contributing reason, and documents substantive LLM reliability problems.
contradiction_condition: Authoritative records show the named restrictions did not exist in the described period, or directly refute the attributed confidentiality concerns. Reliable evaluations could separately contradict the reliability component.
measurement_requirements: Distinguish employee restrictions on external services from blanket prohibitions on all LLM development or use. Separate reported motives from confirmed leaks.
source_requirements: Prefer public company policies. Where internal policies are unavailable, use reputable reporting with identified documentary or source-based reporting, and primary research for reliability.
