explicit_source_elements:
  - does not have the cashflows to sustain itself
  - without continual subsidies from venture capital and NVIDIA
  - its largest companies in functional default
evaluator_interpretation:
  - The context chiefly concerns major independent AI labs and their infrastructure ecosystem, rather than every diversified company selling AI products.
  - Self-sustaining means operating receipts can meet ongoing operating costs and required investment without repeated fresh external funding.
  - Functional default means an inability to meet currently due obligations from available resources without fresh rescue funding. Losses or future fundraising needs alone do not establish it.
  - Use 2026-07-01 through 2026-09-30, the latest completed calendar quarter before the post, for the ongoing cash-flow claim.
  - The wording does not identify a cash-flow accounting basis or a precise company population. Preserve accounting_basis as unknown rather than importing one from evidence.
  - The executive-personality clause is outside the supplied normalized proposition. The financing counterfactual is not a conditional forecast.
support_condition: Comparable records show that the relevant industry cannot meet ongoing cash requirements without repeated VC or NVIDIA funding, and that its largest companies cannot meet due obligations from existing resources.
contradiction_condition: Comparable records establish self-funding across the relevant scope, or establish that the allegedly defaulting largest companies can meet due obligations from existing resources.
measurement_requirements: Separate operating cash flow, required capital expenditure, financing proceeds, liquid assets, and liabilities coming due. Do not substitute operating or net losses for cash flow.
source_requirements: Comparable cash-flow statements, financing disclosures, liquidity records, and obligation schedules for an identified set of major companies.
