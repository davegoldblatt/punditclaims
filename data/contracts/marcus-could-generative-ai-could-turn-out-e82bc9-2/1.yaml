assessment_axis: historical_observation
explicit_source_elements:
  - lack of RoI for most pilot studies
  - the reliability problems
evaluator_interpretation:
  - In context, AI means enterprise generative AI. Pilot studies means trial deployments, rather than published academic studies.
  - Most means more than half of pilots. Lack of ROI means pilots have not demonstrated positive financial returns after their costs; it does not mean they can never pay off.
  - Reliability problems means recurring factual errors or failures to follow supplied evidence in practical tasks. The claim does not require all systems to fail or performance to be deteriorating.
  - The statement describes an ongoing state without specifying a reporting period. I use January–March 2026, the latest completed calendar quarter before the post, as the observation period.
  - The two assertions are assessed together. Support for reliability alone cannot settle the majority-of-pilots assertion.
  - This is a claim about the prevalence of pilot outcomes, not a named company's financial accounts; metric_scope is null.
support_condition: Representative evidence shows that more than half of enterprise generative-AI pilots had not demonstrated positive financial ROI during the target period, and contemporaneous evaluations document recurring reliability failures.
contradiction_condition: Comparable representative evidence shows that at least half of pilots had demonstrated positive financial ROI, or sufficiently broad evaluations establish that the asserted recurring reliability problems no longer persisted. Opposing findings on the two components would warrant mixed.
measurement_requirements: Count pilots, not companies with at least one successful deployment. Report the denominator, sampling method, observation period, costs, returns, and treatment of unmeasured outcomes. Reliability evaluations must identify tasks, models, and observed failures. Missing measurement is not proof of zero return.
source_requirements: Prefer original surveys with disclosed methods and primary reliability evaluations. Earlier studies and surveys measuring enterprise-wide adoption or value are context unless they directly establish the target-period pilot outcome.
