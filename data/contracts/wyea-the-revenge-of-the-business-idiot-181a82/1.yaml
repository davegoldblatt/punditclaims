explicit_source_elements:
  - raise a combined $75 billion
  - between Google, Amazon and investors
  - since the beginning of the year
  - Both OpenAI and Anthropic
  - lower their gross margin projections
  - at the end of 2025
evaluator_interpretation:
  - Fundraising covers January 1 through May 26, 2026. The ordinary reading of 'has had to raise' is completed fundraising, excluding unexercised conditional future investments and avoiding double counting.
  - Interpret 'at the end of 2025' as the final calendar quarter of 2025. Compare forecasts for the same future period under the same gross-margin definition.
  - Treat 'had to' as descriptive emphasis unless evidence identifies a separate claim of financial necessity.
  - The fundraising sentence supplies no reporting or accounting basis, so its contract basis remains unknown. The linked gross-margin discussion concerns press-reported estimates.
  - The single metric_scope records the quantified fundraising assertion. The gross-margin assertions require separate company-specific comparisons and cannot be substituted for evidence of the funding total.
support_condition: A complete, nonduplicated closing record establishes approximately $75 billion raised by May 26, and dated comparable forecasts establish downward gross-margin revisions by both companies during Q4 2025.
contradiction_condition: A complete comparable funding record establishes a materially different total, or dated forecast records show that either alleged Q4 revision did not occur. Announced future financing is not evidence of completed fundraising.
measurement_requirements: Separate completed rounds, immediate investments, conditional commitments, debt facilities, and investments already included in another round. Distinguish a forecast reduction from an eventual result missing a forecast.
source_requirements: Company announcements, financing agreements, and closing records for fundraising; dated investor forecasts or reputable reporting that identifies their dates and definitions for margin revisions.
