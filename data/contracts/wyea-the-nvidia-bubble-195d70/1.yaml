explicit_source_elements:
  - beaten expectations and raised guidance
  - basically every fucking quarter
  - for the past two years
  - circular financing, illegal chip smuggling and channel-stuffing
evaluator_interpretation:
  - The two-year window runs from November 17, 2024 through the post date.
  - The claim says the three named practices materially explain the recurring beats and guidance increases. Merely showing that financing or advance deliveries occurred is insufficient.
  - Basically every quarter allows occasional exceptions; the speaker gives no exact count.
  - Channel-stuffing means inducing excessive or premature customer purchases to inflate reported sales, not simply shipping equipment before its installation.
  - The passage does not distinguish revenue beats, earnings-per-share beats, GAAP results or adjusted results.
support_condition: Quarterly results and contemporaneous expectations establish the recurring pattern, while transaction records and financial reconciliations show material contributions from each named practice to the beats and guidance increases.
contradiction_condition: Reliable transaction-level and quarterly reconciliations rule out the named practices as material explanations for the recurring pattern, or the asserted recurring pattern is demonstrably absent.
measurement_requirements: Match each quarter's reported metric and accounting basis to contemporaneous expectations and guidance. Trace financing, shipment timing and alleged illegal exports into recognized results without double counting.
source_requirements: Company filings, dated consensus estimates, contracts, shipment records and investigative evidence. Company assurances or accusations alone cannot establish causation.
