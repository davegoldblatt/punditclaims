assessment_axis: historical_observation
explicit_source_elements:
  - generative search
  - isn’t reliable enough
  - doesn’t yet have a clear business model
evaluator_interpretation:
  - The ordinary reliability reading is that users cannot consistently trust generated search answers and their supporting sources without material verification. It does not demand perfect accuracy.
  - In the surrounding discussion of costs and revenue, a clear business model means a credible, economically viable way to earn money from generative search. An advertised subscription or an advertising experiment alone does not establish that.
  - Viability need not mean current profitability. Credible evidence that customer payments or advertising can sustainably cover delivery and other relevant costs can establish a viable model.
  - Use the first calendar quarter of 2024, ending on the post date, as the latest reporting window for this ongoing industry observation.
  - Assess reliability and commercial viability separately. Weak evidence on one component cannot settle the other.
  - This is an industry-level commercial proposition, not a stated financial metric for a particular company; metric_scope is therefore null.
support_condition: Contemporaneous evaluations show consequential, recurring reliability failures in ordinary generative-search use, and commercial evidence establishes that a credible sustainable business model remained unsettled.
contradiction_condition: Representative evaluations establish adequate reliability for ordinary search use, or evidence establishes a clear viable commercial model for a substantial generative-search offering. Revenue mechanisms alone, and the mere absence of current profits, settle neither condition.
measurement_requirements: Identify products, versions, query samples, error severity and citation accuracy. For commercial viability, examine evidence connecting monetization, customer demand and relevant costs rather than treating funding, revenue or pricing announcements as proof.
source_requirements: Prefer original product evaluations, company disclosures and financial evidence. Use reporting for independently investigated failures or private-company economics when primary records are unavailable.
