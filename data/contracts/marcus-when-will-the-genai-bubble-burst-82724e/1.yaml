evaluator_interpretation:
  - The observation concerns the state of generative search at publication. I use the latest calendar quarter through the post, January–March 2024, as the observation window.
  - The plain reading of reliability is dependable answers to ordinary factual searches, without frequent material errors or misleading sources. Marcus specifies neither a numerical threshold nor particular tasks.
  - I read a clear business model as an identifiable, implemented way to earn revenue from the search service. This does not require demonstrated profitability. The surrounding discussion of costs also permits a stronger interpretation about economic sustainability, which the available evidence does not settle.
  - The two components are assessed separately. Evidence supporting reliability concerns and contradicting the absence of monetization warrants mixed, with the scope limitations stated.
support_condition: Contemporaneous evaluations show recurring material errors on ordinary factual searches, and evidence establishes that leading services lacked a defined, implemented revenue mechanism.
contradiction_condition: Representative evaluations establish dependable factual search, or contemporaneous documentation identifies an implemented revenue mechanism for generative search. Evidence against only one component does not establish that both components were false.
measurement_requirements: Identify tested products, tasks, testing dates, error categories and sampling limits. Distinguish a revenue mechanism from profitability or sustainable unit economics.
source_requirements: Prefer independent evaluations and contemporaneous company documentation. Use accessible reporting when primary documentation cannot be read.
