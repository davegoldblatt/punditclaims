assessment_axis: causal_assessment
explicit_source_elements:
  - The Hugging Face attack
  - not ... “powerful AI” so much as
  - weaponization
  - hundreds of billions of dollars’ worth
  - GPU-powered infrastructure
  - owned by Microsoft, Google, Amazon, Oracle, and CoreWeave
evaluator_interpretation:
  - The claim compares the causal importance of infrastructure scale with model capability in the July 2026 incident.
  - The dollar figure describes infrastructure value, not the attack's operating cost, company revenue or incident-response spending.
  - The named owners and claimed scale must be connected to resources enabling this incident. Industry-wide spending alone cannot establish that connection.
  - Dollars is read as US dollars. No valuation or accounting basis is supplied.
  - The wording leaves unclear whether the value refers to entire provider fleets or the resources allocated to the attack.
support_condition: Incident-linked resource and ownership records establish the claimed infrastructure scale and providers, while comparative evidence shows that resource scale explains the attack more strongly than model capability.
contradiction_condition: Comparable incident records disprove the infrastructure scale or ownership attribution, or controlled comparisons establish the opposite causal ordering.
measurement_requirements: Identify inference hardware, allocated capacity, duration, ownership and valuation basis. Compare outcomes while separately varying model capability and compute. Keep asset value separate from compute expenditure.
source_requirements: Incident logs, compute-allocation records, provider ownership records and comparable model or resource experiments.
