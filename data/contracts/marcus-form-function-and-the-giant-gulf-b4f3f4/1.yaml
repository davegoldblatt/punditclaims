  - Sketch a ladder and label one of the parts you stand on
evaluator_interpretation:
  - The plain reading is that contemporary Craiyon consistently struggled with these part-and-function tasks. The qualification limits confidence but does not remove the observable claim.
  - Completely at sea is read as substantial, repeated failure, rather than a mathematical claim of zero successes on every possible prompt.
  - The target is the September 2022 version discussed in the post. The latest observation window is September 1 through September 18.
  - Failure to render labels alone does not establish absence of knowledge about object functions.
support_condition: Independent inspection of relevant September 2022 Craiyon outputs shows repeated failure to identify and mark the requested functional parts across the bicycle, ladder, and comparable prompts.
contradiction_condition: Comparable September 2022 Craiyon outputs reliably identify and mark the requested parts across these tasks.
measurement_requirements: Archived outputs or a reproducible historical model version, complete prompt batches, and separate scoring of part selection, functional inference, and label rendering.
source_requirements: Independent evidence concerning Craiyon itself. Tests of DALL-E 2 or Stable Diffusion cannot settle this model-specific claim.
