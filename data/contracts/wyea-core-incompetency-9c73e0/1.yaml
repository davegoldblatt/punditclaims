explicit_source_elements:
  - billions of dollars of data center buildouts
  - the only way it can pay for them
  - burdensome loans
  - as of right now
  - does not appear to have the revenue to support
evaluator_interpretation:
  - The ordinary reading concerns whether customer-generated cash can support scheduled loan payments while meeting necessary operating expenses.
  - Use fiscal 2024, the latest complete financial reporting period available before publication, together with obligations outstanding at its year-end.
  - Revenue, operating cash flow, accounting losses, and expenditure on expansion are distinct measures.
  - The wording expresses a qualified assessment of financial capacity, not a prediction of default.
support_condition: A comparable schedule of customer cash receipts, necessary operating costs, and debt service shows a funding shortfall under the obligations outstanding at the reporting date.
contradiction_condition: Comparable records show adequate customer-generated cash for the relevant debt service and necessary operating costs. Evidence of equity or customer financing separately contradicts the exclusive assertion that loans are the only funding source.
measurement_requirements: Reconcile revenue to cash receipts, including customer advances; distinguish cash interest from accounting interest expense; compare principal and interest with receipts over matching periods.
source_requirements: Contemporaneous company financial statements, loan agreements, and liquidity disclosures. Later fundraising or business performance cannot establish the earlier position.
