early_resolution_rule: A conclusive event requires evidence that the IPO-inability antecedent occurred, followed by either the defined liquidity crisis or definitive retirement or refinancing of the relevant obligations without crisis. Delay alone does not trigger the rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Cannot go public' is not distinguished from delay or a voluntary decision."
  - No deadline or required duration of the impediment is given.
  - The claimed loan amount may conflate facility capacity with drawn debt.
  - The accounting basis of the claimed debt figure is unspecified.
  - The result would differ if any postponed IPO were treated as inability.
