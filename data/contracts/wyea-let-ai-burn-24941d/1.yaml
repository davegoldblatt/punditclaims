assessment_axis: forecast_outcome
explicit_source_elements:
  - $40 billion or more in short-term loans
  - if OpenAI can’t go public
  - SoftBank will face a legitimate liquidity crisis
evaluator_interpretation:
  - The antecedent requires demonstrated inability to complete an IPO, not merely remaining private or choosing a later listing date.
  - A liquidity crisis means inability to meet near-term obligations through available cash, ordinary asset sales, or refinancing, or emergency measures needed to avoid that inability.
  - The asserted short-term debt is background to the forecast. A facility limit is not automatically outstanding borrowing.
  - No deadline or duration of the IPO impediment is supplied.
  - A demonstrated inability to list must coincide with the relevant financing pressure before the conditional outcome can be scored.
support_condition: After evidence establishes that OpenAI cannot complete an IPO, SoftBank experiences a material funding shortfall, payment failure, or emergency liquidity intervention associated with its OpenAI financing.
contradiction_condition: After the antecedent is established, SoftBank meets or permanently refinances the relevant obligations without a liquidity crisis, eliminating the stated financing mechanism.
measurement_requirements: Establish the IPO impediment and its timing; then match debt maturities, drawn balances, unrestricted liquidity, asset-sale proceeds, refinancing, and payment performance.
source_requirements: Prefer issuer disclosures, regulatory or court records concerning an IPO impediment, debt documents, and payment or refinancing records. Use reputable reporting for management statements when no accessible primary record is located.
