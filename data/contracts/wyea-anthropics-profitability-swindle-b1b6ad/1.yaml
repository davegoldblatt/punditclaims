assessment_axis: forecast_outcome
explicit_source_elements:
  - Costs increase linearly with revenue
  - will continue to do so
  - in perpetuity
evaluator_interpretation:
  - The surrounding discussion concerns frontier AI labs, especially Anthropic and OpenAI.
  - An ordinary reading is that business costs will keep rising roughly in proportion to realized revenue, preventing sustained improvement in the cost-to-revenue ratio.
  - I do not interpret linearly as an exact mathematical equality in every reporting period.
  - Costs are not defined as inference costs, total operating expenses, cash spending or all expenses. No accounting basis is specified.
  - Because the post explicitly discusses a temporarily discounted quarter, one quarter of improved margins alone does not meet the early-resolution rule.
support_condition: Comparable observations can support the relationship over a finite period, but cannot establish that it will persist forever.
contradiction_condition: A consistent financial series for a lab within scope establishes a sustained material departure from proportional cost growth after publication, with the change surviving adjustments for temporary discounts, expense timing and accounting changes.
measurement_requirements: Repeated matched observations of realized revenue and a consistently defined cost measure, with reconciliation of supplier discounts, training expenses, stock compensation, distribution payments and material accounting changes.
source_requirements: Company filings or sufficiently detailed financial disclosures. News reports may provide context but must identify costs and accounting treatment before they can establish a decisive trend.
metric_scope:
  company: AI labs, especially Anthropic and OpenAI
  metric: Relationship between business costs and realized revenue
  currency: null
  units: cost-to-revenue relationship
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: 2026-05-21
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: in perpetuity
horizon_interval:
  start: 2026-05-21
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated disclosure can settle the forecast adversely if it establishes a sustained post-publication departure from proportional cost growth on a matching, consistent accounting basis, beyond temporary discounts or expense timing. No finite observation can conclusively establish perpetuity.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Costs and accounting basis are unspecified.
  - Linearly could mean exact linearity, proportional growth or a broad economic tendency.
  - The population of AI labs and whether the claim concerns each lab or the industry aggregate are unspecified.
  - No duration or magnitude defines a sustained departure.
  - In perpetuity supplies no finite deadline.
retrospective_or_prospective: retrospective
