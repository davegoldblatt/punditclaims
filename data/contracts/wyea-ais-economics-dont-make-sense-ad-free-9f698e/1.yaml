assessment_axis: forecast_outcome
explicit_source_elements:
  - if OpenAI can’t pay for that compute
  - Oracle dies
  - around $115 billion in debt
  - just to build Stargate’s data centers
evaluator_interpretation:
  - Oracle dies means insolvency, bankruptcy or cessation of its business, rather than a share-price decline or reduced growth.
  - The antecedent requires a documented inability by OpenAI to meet Stargate payment obligations. Construction delays, financing concerns and missed revenue targets do not establish it.
  - The debt figure is a supporting financial premise, not a separate trigger.
  - No deadline or maximum delay between nonpayment and collapse is supplied.
support_condition: A documented OpenAI inability to pay Stargate obligations is followed by Oracle's financial collapse, with evidence connecting the collapse to that failure.
contradiction_condition: After the antecedent occurs, Oracle permanently resolves the affected exposure while remaining solvent, making the claimed necessary collapse inapplicable. Temporary survival alone is insufficient without a deadline.
measurement_requirements: Dated payment defaults or equivalent evidence of inability to pay, legal and financial evidence of Oracle's solvency, and identification of the relevant liabilities.
source_requirements: Payment notices, creditor disclosures, filings, court records or independently verified reporting. Distinguish Oracle debt from developer debt and equity financing.
