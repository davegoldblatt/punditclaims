explicit_source_elements:
  - Virtually all of the world’s software
  - from web browsers to spreadsheets to word processors
  - still depends on knowledge engineering
evaluator_interpretation:
  - The examples suggest an ordinary reading of knowledge engineering as deliberately programmed rules, algorithms and domain knowledge. This is broader than the specialist meaning of building knowledge bases for expert systems.
  - Depends on means material functional dependence; it does not require every component to be handwritten.
  - For this ongoing state without a reporting cadence, the target is May 2022 up to publication. Earlier releases are background context.
  - Virtually all means nearly universal dependence across software categories, without imposing an invented percentage.
support_condition: Representative architecture or implementation evidence across the software population establishes nearly universal material dependence on explicitly engineered logic.
contradiction_condition: Representative evidence establishes a substantial population of software whose functioning does not materially depend on such logic.
measurement_requirements: Coverage across software categories, with a defensible sampling or population basis. A few applications establish examples but cannot alone establish the worldwide proportion.
source_requirements: Contemporaneous source code, versioned architecture documentation and technical disclosures.
