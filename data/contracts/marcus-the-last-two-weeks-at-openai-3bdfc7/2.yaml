support_condition: Reliable records establish both a February departure and shared leadership of the new agent project immediately before departure.
contradiction_condition: Reliable records establish that he did not depart in this period or that the stated project leadership role was incorrect.
measurement_requirements: Separate confirmation of departure from confirmation of project responsibilities.
