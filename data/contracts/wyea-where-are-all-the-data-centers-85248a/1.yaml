evaluator_interpretation:
  - The plain reading is an approximate upper bound on commissioned operating capacity at the Wisconsin site, not a measurement of momentary electricity consumption.
  - The surrounding comparison treats MW as total facility capacity rather than critical IT capacity.
  - The context explicitly uses April 2026 observations to describe the state at publication, so the target period is April 1 through May 12, 2026.
  - Startup activity can establish that some equipment was operating without establishing that the building's entire rated capacity was commissioned.
  - An older permit's design or backup-generator figure cannot establish the running-capacity ceiling unless its scope and continuing applicability are verified.
support_condition: Comparable operating records establish that the site's commissioned capacity remained no greater than approximately 117 MW at publication.
contradiction_condition: Dated records establish that materially more than 117 MW of total facility capacity was commissioned and operating at the site by publication.
measurement_requirements: Identify the operational portion of the campus, its commissioning date and total facility power capacity. Separate IT power, backup-generator ratings, design capacity and actual consumption.
source_requirements: Prefer commissioning records, operator disclosures with MW figures, utility records or independently corroborated operating-capacity estimates. Examine permits for scope and subsequent revisions.
