evaluator_interpretation:
  - The testable plain reading is that an LLM's assertion does not itself establish its truth. This does not mean all LLM statements are false.
  - Treat the claim as describing publicly available models in the current calendar quarter through publication, January 1–March 12, 2026. Technical evaluations have no fixed reporting cycle; this reporting window is an evaluator choice.
  - The assessment concerns factual reliability. It does not attempt to establish whether models have subjective experiences.
support_condition: Documented evaluations within the target period identify factual assertions by available LLMs that conflict with checked facts.
contradiction_condition: Evidence establishes that factual assertions by the relevant LLMs reliably guarantee truth, and that the purported counterexamples are not genuine errors. Success on a limited test alone would not establish this.
measurement_requirements: Compare actual factual outputs with identifiable ground truth. Distinguish false assertions from abstentions, fiction, and uncertainty.
