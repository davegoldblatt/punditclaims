evaluator_interpretation:
  - This year means calendar 2025.
  - The ordinary reading of AGI is broad, flexible human-level cognitive competence across domains, including unfamiliar tasks.
  - A single benchmark result or an unsupported declaration is insufficient. Perfection, superintelligence, and physical embodiment are not required.
  - Arrival is assessed through public releases or demonstrations and independently examinable evidence.
  - The adjacent speculation about Musk and Amodei's motives is outside the supplied normalized forecast.
support_condition: Retrospective evidence covering systems available through December 31, 2025 establishes that they remained materially short of broad, flexible human-level competence.
contradiction_condition: A system released or demonstrated in 2025 is independently established to meet that broad human-level standard.
measurement_requirements: Use evidence across domains and unfamiliar tasks, with human comparisons. Separate conversational imitation, narrow benchmark success, and general competence.
source_requirements: Independent evaluations and broad scientific assessments, including credible competing claims of achievement.
