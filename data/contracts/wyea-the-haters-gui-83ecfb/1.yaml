assessment_axis: forecast_outcome
explicit_source_elements:
  - Microsoft is NVIDIA's largest client for GPUs
  - any changes to Microsoft's future interest in OpenAI
  - such as reducing its data center expansion
  - would eventually hit NVIDIA's revenue
evaluator_interpretation:
  - The forecast concerns changes after publication.
  - Hit revenue means an adverse effect relative to what NVIDIA would otherwise have earned. NVIDIA's total revenue need not decline.
  - Under the broad wording 'any changes', a material change in Microsoft's contractual dependence on OpenAI qualifies as a condition event.
  - A narrower reading would require a reduction in OpenAI-related infrastructure or GPU procurement.
  - Eventually supplies no deadline. Customer ranking is a premise, not proof that a later change caused lost sales.
support_condition: A qualifying change occurs, and dated procurement or financial evidence attributes an adverse NVIDIA GPU revenue effect to that change.
contradiction_condition: A qualifying change occurs, and sufficiently complete procurement and financial evidence establishes that its transmission has finished without the predicted adverse revenue effect.
measurement_requirements: Trace the change through Microsoft or its infrastructure suppliers to NVIDIA orders and recognized revenue. Separate displaced purchases from purchases transferred to other cloud providers.
source_requirements: Partnership announcements can establish the condition. Customer procurement records or attributable NVIDIA sales disclosures are needed to establish the outcome.
metric_scope:
  company: NVIDIA
  metric: Adverse change in GPU sales revenue attributable to Microsoft's changed OpenAI commitment
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A dated, attributable NVIDIA revenue effect can settle the forecast without waiting for an unstated deadline. Aggregate revenue changes or partnership changes alone cannot.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Changes in Microsoft's interest could mean ownership, contractual dependence, investment or procurement.
  - The broad condition includes changes that need not reduce GPU demand.
  - Hit could mean slower growth rather than an absolute revenue decline.
  - No deadline, revenue threshold or accounting basis is supplied.
retrospective_or_prospective: retrospective
