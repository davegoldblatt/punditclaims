assessment_axis: historical_observation
explicit_source_elements:
  - what we've actually got is unprofitable, unsustainable generative AI
  - an unassailable problem of spitting out incorrect information
  - Sundar Pichai says is "an inherent feature"
  - plugged into Google Search, generating hilariously incorrect "answers"
evaluator_interpretation:
  - "Plain reading: in mid-2024 the leading generative AI businesses were losing money, and their products had a persistent factual-error problem that their makers could not say was solved."
  - OpenAI, the best-known pure generative AI company, stands in for 'generative AI' on profitability, because pure-play AI labs do not break out results otherwise.
  - "'Unsustainable' is a judgment about the future and is not tested separately. 'Unassailable' is read as 'not solved and seen by makers as built into the technology', not as a proof that errors can never be cut."
  - He gives no period. Because the post describes a current state, the target period is calendar 2024, the year of the post.
support_condition: Reports from 2024 show leading generative AI firms losing money, and makers or deployers admit in 2024 that factual errors remain unsolved or inherent, including errors in Google's AI search answers.
contradiction_condition: Evidence that leading generative AI businesses were profitable in 2024, or that the factual-error problem had been solved or was described by makers as solved in 2024.
measurement_requirements: Net loss or profit of a leading generative AI provider for 2024; dated statements from AI makers about hallucination or error rates in 2024.
source_requirements: Company statements, company documents reported by major news outlets, and company blogs.
metric_scope:
  company: Leading generative AI providers (OpenAI as the main pure-play example)
  metric: Profitability (net income or loss)
