explicit_source_elements:
  - Almost every single generative AI company that you've heard of
  - is deeply unprofitable
  - there are few innovations coming to save them from the atrophy of the foundation models
evaluator_interpretation:
  - "'Generative AI company that you've heard of' plainly means prominent model makers and AI startups, chiefly OpenAI and Anthropic, which he names in the surrounding text. 'Almost every' allows a few exceptions."
  - "'Deeply unprofitable' plainly means losses that are large relative to revenue, on a net or operating basis."
  - He names no reporting period for this present-tense observation. I use calendar 2024, the year that was underway when he posted, as the latest period public evidence can describe. It is not limited to one quarter.
  - The second clause ('few innovations coming to save them from the atrophy of the foundation models') is a forward-looking opinion with no measure or deadline. It is noted but not scored. The grade rests on the unprofitability observation.
support_condition: Reporting or company disclosures show that the most prominent generative AI companies, especially OpenAI and Anthropic, ran large losses relative to revenue in 2024, with at most a few profitable exceptions.
contradiction_condition: Reporting or disclosures show that several prominent generative AI companies, or the leading ones, were profitable or near break-even in 2024.
measurement_requirements: Full-year 2024 net or operating results, or contemporaneous projections, for prominent generative AI companies.
source_requirements: Company filings or disclosures (e.g., IPO prospectus), or reputable news reports of company documents.
