assessment_axis: historical_observation
explicit_source_elements:
  - Almost every single generative AI company that you’ve heard of
  - is deeply unprofitable
  - few innovations coming to save them
  - atrophy of the foundation models
evaluator_interpretation:
  - Read the population as prominent businesses focused on generative AI, including model developers and application companies.
  - Read deeply unprofitable as substantial losses relative to revenue, not simply any negative profit.
  - Use July–September 2024, the latest completed calendar quarter before publication, for the ongoing financial observation.
  - Treat the innovation clause as an assessment of the visible development pipeline, not a separate forecast with an invented deadline.
  - Overall profits of diversified technology parents do not establish profits from their generative-AI businesses.
  - No accounting basis, company roster or numerical meaning of almost every is supplied.
support_condition: Comparable actual financial results for a defensible broad roster show nearly universal substantial losses, while contemporary pipeline evidence supports a scarcity of credible remedies.
contradiction_condition: Comparable results show a substantial share of the relevant companies profitable or only slightly loss-making, or evidence establishes multiple credible remedies inconsistent with the asserted scarcity. One profitable exception does not disprove almost every.
measurement_requirements: A defined company population, comparable quarterly profit and revenue measures, and a review of innovations visible in the period. Distinguish losses from cash burn and annual forecasts.
source_requirements: Prefer financial statements and primary research. Attributed financial reporting may supply context where private-company accounts are unavailable.
