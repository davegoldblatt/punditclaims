evaluator_interpretation:
  - Read the categorical sentence together with the explicit concession that language models can participate in action workflows.
  - An ordinary functional test asks whether the model maps a user's intention to an explicit executable operation and carries out the requested action.
  - A demonstration using a separate grounding or action-selection system is relevant but does not automatically refute the qualified standalone claim.
  - The target is capabilities available as of 22 June 2022. No beginning or regular reporting interval is supplied; earlier demonstrations of then-existing models are relevant, while later-created agents are outside scope.
support_condition: Direct evaluations establish that then-current standalone models cannot perform the specified intent-to-action function, rather than merely showing occasional failures.
contradiction_condition: A documented contemporaneous demonstration succeeds at the specified function within the standalone scope, with the model's contribution distinguished from additional semantic interpretation, grounding and execution components.
measurement_requirements: Document the request, model output, executable operation, actual result and responsibilities of each system component.
source_requirements: Primary demonstrations or evaluations of models available by the post date, with enough architecture detail to assess the qualification.
