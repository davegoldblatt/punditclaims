explicit_source_elements:
  - Generative AI models
  - are expensive and compute-intensive
  - without providing obvious, tangible mass-market use cases
evaluator_interpretation:
  - I assess the resource-burden and use-case clauses separately.
  - I use 2024-01-01 through 2024-03-18 as the current reporting window because no period is named.
  - The ordinary reading of a tangible mass-market use case includes a useful consumer service delivered at substantial scale, including customer support.
  - Usage alone is insufficient; the application must perform an identifiable practical task.
  - The cost clause is a qualitative statement about model resources, not a specified company's financial result.
support_condition: Evidence establishes substantial computational and financial resource demands, while representative deployment evidence establishes the absence of useful applications serving a broad market.
contradiction_condition: A documented practical application serving a broad market contradicts the absence clause. Evidence of low resource demands would separately contradict the resource clause.
measurement_requirements: Assess resource demands separately from adoption. Identify actual tasks and deployed usage, rather than treating registrations, demonstrations, or projected profits as realized benefits.
source_requirements: Contemporaneous technical research and dated deployment disclosures. Identify company-reported usage as such.
