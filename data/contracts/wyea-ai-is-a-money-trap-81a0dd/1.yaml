assessment_axis: historical_observation
explicit_source_elements:
  - current fragility of the bubble
  - for most AI startups
  - there’s simply no way out
  - being acquired or going public does not appear to be a viable route
evaluator_interpretation:
  - The checkable core is whether more than half of AI startups lacked a commercially feasible acquisition or IPO route.
  - Commercial feasibility means a realistic exit route, not necessarily a completed transaction during the observation period.
  - The bubble language is qualitative framing and supplies no separate measurable threshold.
  - "For the ongoing market condition, use the latest completed quarter before publication: April through June 2025."
  - No geographic restriction is stated. Individual successful exits cannot settle a claim about most startups.
support_condition: Representative evidence shows that more than half of the relevant AI-startup population lacked both commercially feasible acquisition and IPO routes during the target period.
contradiction_condition: Representative evidence shows that at least half had a commercially feasible acquisition or IPO route during the target period.
measurement_requirements: A defined startup population and denominator, comparable evidence of exit feasibility, and treatment of failed processes, offers, valuations and investor returns.
source_requirements: Representative transaction and company-level evidence. A list of selected successes or failures is insufficient.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-04-01
  end: 2025-06-30
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Latest completed quarter chosen for an ongoing state with no stated reporting period.
  - AI startups is not defined by geography, age, funding stage or business model.
  - Viable does not specify an acceptable valuation, return or time to exit.
  - Cursor as an indicator of bubble fragility has no independent threshold.
