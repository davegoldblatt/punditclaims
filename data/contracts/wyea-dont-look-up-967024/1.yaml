assessment_axis: forecast_outcome
explicit_source_elements:
  - Assuming that OpenAI actually intends to pay
  - reported $750 billion in compute commitments through 2030
  - raise hundreds of billions of dollars a year
  - actual demand necessary to use that compute
evaluator_interpretation:
  - The antecedent concerns intent, rather than completed payment. A reported company spending plan is evidence of that intent, subject to the distinction between projected spending and binding commitments.
  - "'Raise' means external financing, excluding customer revenue. 'Hundreds of billions' ordinarily means at least $200 billion."
  - The annual requirement is provisionally applied to complete calendar years after publication through 2030; the speaker does not specify how to treat partial 2026.
  - Demand means customer use of the contracted compute. The claim supplies no utilization threshold.
support_condition: Records through 2030 establish performance of the stated spending plan, annual external financing of at least $200 billion during the applicable years, and demand using the compute; cash requirements also substantiate that this financing was necessary.
contradiction_condition: OpenAI fulfills the specified compute payments while raising less than $200 billion in an applicable full year, or fulfills them without the asserted demand requirement. This would provide a counterexample to the claimed necessity.
measurement_requirements: Separate paid compute expenditure, outstanding commitments, financing commitments, financing actually received, realized revenue, and utilization. Raising money voluntarily is not proof that raising it was necessary.
source_requirements: Company financial statements, financing documents, supplier contracts and payment records, and credible utilization evidence. Clearly label press estimates.
