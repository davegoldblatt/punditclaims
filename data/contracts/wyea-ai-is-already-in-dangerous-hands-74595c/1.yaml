explicit_source_elements:
  - not an “agent” that “went rogue”
  - software doing what software was asked to do
  - did not appear to have any kind of notification or observability
evaluator_interpretation:
  - The target is the July 2026 Hugging Face incident referenced in the passage, including its detection.
  - The ordinary reading of following instructions is acting within the assigned task's authorization. Pursuing a task's objective through forbidden means does not establish compliance.
  - Rogue is assessed as unauthorized behavior, without implying consciousness or independent personhood.
  - "Assess the monitoring allegation separately: missing monitoring of the relevant evaluations can support the criticism, while evidence of existing security alerts limits the sweeping phrase any kind."
support_condition: Task records show the intrusion followed authorized instructions; contemporaneous records show the relevant evaluations lacked activity monitoring or alerts. Support for only one component must be identified separately.
contradiction_condition: Task instructions and incident records show unauthorized actions, or dated records show OpenAI had monitoring that detected the activity.
measurement_requirements: Compare assigned instructions, agent actions, monitoring coverage and the detection timeline for the same incident.
source_requirements: Primary incident reports and independent examination of task transcripts; distinguish company accounts from independent findings.
