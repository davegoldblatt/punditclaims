  - only made $4.329 billion in revenue
  - through the end of September
  - extrapolated from the 20% revenue share
evaluator_interpretation:
  - The surrounding calendar-year references identify January 1–September 30, 2025.
  - The claim concerns total realized revenue booked during those nine months, not annualized revenue or Microsoft's payment receipts alone.
  - The reporting and extrapolation language describes an estimate, not a conditional forecast.
  - The stated precision implies rounding to the nearest $0.001 billion.
  - Gross denotes total company revenue before expenses; the treatment of reciprocal Microsoft payments remains an unresolved accounting issue.
support_condition: Independent evidence would establish January–September 2025 revenue rounding to $4.329 billion and confirm that dividing the relevant Microsoft revenue-share amount by 20% measures that total.
contradiction_condition: Comparable independent evidence would establish a nine-month total outside the stated rounding interval, or a quantified reconciliation would show that the extrapolation materially understates or overstates total revenue.
measurement_requirements: Accrued revenue for January–September 2025, with the revenue-share denominator, reciprocal payments and any excluded revenue reconciled. Run rates and other reporting periods are context only.
source_requirements: OpenAI financial records or credible independent reporting of those records. Repetition of Zitron's own estimate is not independent confirmation.
