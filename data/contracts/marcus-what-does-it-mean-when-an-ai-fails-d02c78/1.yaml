evaluator_interpretation:
  - "The context identifies six general problems: biological, physical, social and practical reasoning, object and individual tracking, and non sequiturs."
  - The ordinary reading is that these remained substantive weaknesses, despite improvements on particular examples. It does not require the models to fail every test.
  - Because this describes the current model generation without a reporting period, I use 2022 through the post date as the latest public evaluation period.
  - The qualification about Marcus's knowledge does not remove the factual assertion. However, evidence about only some categories cannot establish his assertion about all six.
support_condition: Public evaluations of the relevant model generation establish continuing substantive failures across all six categories, while allowing improvements on individual examples.
contradiction_condition: Robust evaluations establish that at least one of the six general problems had been resolved across varied tests by the post date. Better average scores or corrected examples alone do not suffice.
measurement_requirements: Tests must identify the model version, prompting conditions and relevant reasoning category. Broad claims require more than isolated anecdotes.
source_requirements: Primary evaluations or independent experiments. Marcus's and Davis's own conclusions cannot establish their correctness.
