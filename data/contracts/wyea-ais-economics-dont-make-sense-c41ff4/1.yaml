assessment_axis: historical_observation
explicit_source_elements:
  - Anthropic and OpenAI both intend
  - burn tens of billions of dollars
  - in the next few years
  - neither of them have a path to profitability
evaluator_interpretation:
  - Intend describes the companies' financial plans at publication. This is assessed as an observation about plans, not as a forecast of realized losses.
  - Use the latest completed calendar quarter before publication as the reporting window for the current plans.
  - Both means each company separately; their projected cash burn must not be pooled.
  - Tens of billions means cumulative net cash consumption of at least $20 billion per company over the next several years. The source does not give an exact ending year.
  - A path to profitability means a financially credible route to revenues exceeding total costs. An announced profit target alone does not prove that route is viable, while current losses alone do not prove its absence.
  - Cash burn, EBITDA, operating income, adjusted earnings, and net income remain distinct measures.
support_condition: Contemporaneous plans show each company expecting at least $20 billion of cumulative net cash burn over the next several years, and financial evidence establishes that neither has a credible route to sustained profitability.
contradiction_condition: Comparable plans show that either company's intended net cash burn is below the claimed scale over the relevant period, or financial evidence establishes a credible route to sustained profitability for at least one company.
measurement_requirements: Examine each company's projected net cash consumption separately. Assess profitability after relevant training, inference, personnel, financing, and other costs; do not substitute gross compute commitments or non-cash accounting losses for cash burn.
source_requirements: Dated company financial plans and cost assumptions. Credible reporting on private documents may establish reported plans, but the underlying documents and independent validation are preferable.
