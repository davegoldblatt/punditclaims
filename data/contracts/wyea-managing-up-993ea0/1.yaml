evaluator_interpretation:
  - The product is the Humane AI Pin in its April 2024 launch state.
  - $700 is ordinary rounding of a roughly $699 purchase price.
  - Overheating means heat warnings or heat-related interruption after a few minutes of active use, rather than a measured safety-temperature violation.
  - Repeated failures means multiple failures on ordinary requests, not that every request fails or every unit always overheats.
  - I use April 2024 through the post date, the launch-review period identified by the context.
  - The incidental consumer price is not a claim about Humane's company finances; metric_scope is therefore null.
support_condition: Launch-period pricing and direct tests corroborate a roughly $700 product, heat-related interruptions after brief use, and repeated failures on ordinary requests.
contradiction_condition: Reliable comparable launch tests establish that the alleged heat interruptions or repeated query failures did not occur, or establish a materially different purchase price.
measurement_requirements: Direct use of launch hardware and software, with reported heat behavior, elapsed-use descriptions and concrete examples of ordinary failed requests.
source_requirements: Use company pricing disclosures and firsthand independent reviews. Later software improvements or the company's eventual fate cannot settle launch behavior.
