early_resolution_rule: Resolve only after a qualifying failure and documented consequences satisfying the linked valuation and financing-collapse conditions. Failure alone cannot settle the forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - These startups could mean the named companies or the broader AI startup sector.
  - The failure condition explicitly introduces the panic sentence; its application to the preceding sentences is interpretive.
  - Death may mean liquidation or a broader financial failure.
  - No deadline or duration for the predicted panic.
  - No valuation baseline, portfolio weighting or accounting convention.
  - Money for venture capital could mean LP commitments or financing available to portfolio companies.
