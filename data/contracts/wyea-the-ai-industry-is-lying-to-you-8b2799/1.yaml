ambiguity_flags:
  - No specified models, programming languages, tasks or company standards.
  - No numerical thresholds for 'often', 'rarely' or 'far longer'.
  - Review time per comparable change versus aggregate review workload.
  - "'Guaranteeing' may express literal inevitability or a strongly stated general tendency."
