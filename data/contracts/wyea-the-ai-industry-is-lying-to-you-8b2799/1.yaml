assessment_axis: causal_assessment
explicit_source_elements:
  - often verbose
  - rarely aligns with in-house coding guidelines and standards
  - guaranteeing that it’ll take far longer to chew through
  - reviewing it will either skim-read it or feed it into another LLM
evaluator_interpretation:
  - The plain reading is a broad causal claim about professional review of LLM-generated code as of publication.
  - "'Often' requires recurring prevalence, and 'rarely aligns' means compliance is uncommon. Neither supplies a precise frequency."
  - "'Far longer' concerns materially greater review time for comparable work, not simply more total review work because more code is produced."
  - The proposed causal chain must connect verbosity and standards failures to review time and then to skimming or LLM delegation.
  - A small study of targeted patches can test inevitability in that setting, but cannot establish the prevalence of problems across contemporary generated code.
support_condition: Representative comparisons must find frequent verbosity, uncommon compliance with actual local standards and substantially longer review for comparable changes, with evidence that these problems cause reviewers to skim or delegate review.
contradiction_condition: Representative comparisons showing ordinary compliance and no substantial review penalty would contradict the general claim. Comparable observed workflows preserving thorough human review would rebut the claimed inevitable downstream behavior.
measurement_requirements: Match task, language, change size, model and reviewer experience. Measure local-rule compliance, active review time and actual reviewer behavior separately. Distinguish generated patches from entire generated implementations.
source_requirements: Primary comparative studies, controlled workplace trials and observed review behavior. Surveys may provide context but cannot alone identify the full causal chain.
