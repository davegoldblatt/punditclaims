assessment_axis: causal_assessment
explicit_source_elements:
  - strategy
  - requires a broad, deep understanding of the world
  - generative AI has never had robust models of the world
evaluator_interpretation:
  - A robust world model means a reliable representation of relevant relationships that remains useful when circumstances change.
  - The claim concerns broad understanding sufficient for consequential strategy, rather than mastery of one game or navigation task.
  - The historical component extends through publication on April 1, 2026; no starting date is specified.
  - The causal reading requires evidence connecting deficient world representations to deficient strategic reasoning. It does not require assuming that AI actually determined US war strategy.
support_condition: Evaluations establish broad failures of reliable world representation and show that those failures materially impair strategic reasoning under changing circumstances.
contradiction_condition: Evaluations demonstrate robust, broadly applicable world representations supporting reliable strategic reasoning, or directly undermine the proposed causal connection.
measurement_requirements: Tests must distinguish successful outputs from coherent underlying representations and examine transfer under changed conditions. Establishing the causal explanation requires interventions or other evidence separating world-model deficiencies from alternative causes.
source_requirements: Primary research with disclosed methods. Narrow demonstrations can inform the assessment but cannot alone establish a universal claim about generative AI or geopolitical strategy.
