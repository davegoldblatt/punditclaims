  period_end: 2029-09-01
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: in the next three years
horizon_interval:
  start: 2026-09-01
  end: 2029-09-01
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only if a completed component or an irreversible dated event conclusively establishes failure of a required component. New contracts, revised estimates and interim revenue do not settle the entire forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Rolling three-year interval versus three forecast calendar or fiscal years.
  - Aggregate versus supplier-by-supplier interpretation of the 70% share.
  - Undefined AI-revenue denominator.
  - Unspecified tolerance around $440 billion.
  - Unspecified accounting basis and marketplace revenue treatment.
  - No allocation measure for the predominant purpose of capital spending.
  - The separate Google Cloud threshold concerns calendar 2027.
retrospective_or_prospective: prospective
