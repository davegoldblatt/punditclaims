assessment_axis: forecast_outcome
explicit_source_elements:
  - Google, Amazon and Microsoft
  - currently spending hundreds of billions of dollars on capex
  - for the most part
  - around $440 billion in revenue
  - in the next three years
  - from Anthropic and OpenAI
  - more than 70% of their AI revenues
  - more than 48% of Google Cloud’s 2027 revenue
evaluator_interpretation:
  - Read the three-year forecast as covering September 1, 2026 through September 1, 2029. The separately stated Google Cloud share concerns calendar 2027.
  - Read $440 billion as aggregate realized revenue received by the three suppliers from the two named customers. Contract commitments, financing and annualized revenue are not substitutes.
  - Read the 70% threshold as the two customers' combined share of the three suppliers' aggregate AI revenue. The wording could alternatively mean each supplier separately.
  - The phrase 'for the most part' qualifies the purpose of capital spending; it is not a conditional antecedent.
  - The supplied passage does not identify an accounting basis or explain how the estimates were constructed. Do not infer one from similar estimates found elsewhere.
  - The capital-spending amount and its alleged purpose are additional components. Revenue concentration alone would not establish the purpose of most capital spending.
support_condition: Comparable customer-level accounts establish approximately $440 billion of realized revenue during the three-year interval, a share above 70% of aggregate AI revenue during that interval, and a share above 48% of Google Cloud revenue in calendar 2027. Evidence must also substantiate the current capital-spending scale and its claimed predominant purpose.
contradiction_condition: Comparable completed-period accounts establish failure of a numerical component, allowing for the unspecified approximation around $440 billion; or reliable evidence directly disproves the claimed predominant purpose of capital spending. A shortfall before the deadline does not qualify.
measurement_requirements: Customer-level recognized revenue, consistent treatment of marketplace sales and intercompany transactions, the same AI-revenue denominator across suppliers, and Google Cloud's calendar-2027 total revenue. Resolve the accounting basis and approximation tolerance before a numerical verdict.
source_requirements: Prefer supplier filings and customer-specific disclosures. Clearly identified estimates may supply context but cannot establish future realized revenue.
metric_scope:
  company: Google, Amazon and Microsoft
  metric: Aggregate revenue from Anthropic and OpenAI and their share of aggregate AI revenue; separately, their share of Google Cloud's calendar-2027 revenue
  currency: USD
  units: billions of dollars and percent
  accounting_basis: unknown
