  - less than a week after
  - Anthropic dropped its safety pledge
evaluator_interpretation:
  - The factual core concerns a policy change followed within fewer than seven days by favorable coverage presenting Amodei as patriotic and safety-conscious.
  - Fawning is evaluative. I require identifiable favorable framing, rather than treating publication of his self-description alone as endorsement.
  - I read the pledge description as requiring adequate safeguards before further training at relevant capability thresholds, not a guarantee that every model would be entirely safe.
support_condition: Dated policy records establish removal of the training-pause commitment, and coverage published fewer than seven days later favorably portrays Amodei as patriotic and committed to safety.
contradiction_condition: The relevant commitment remained substantively unchanged, or the identified favorable coverage falls outside the claimed interval. Critical coverage elsewhere would not itself disprove the existence of favorable coverage.
measurement_requirements: Compare the policy's effective date with coverage dates and distinguish journalists' framing from attributed statements by Amodei.
source_requirements: Old and revised policy documents, the dated announcement, and the coverage itself.
