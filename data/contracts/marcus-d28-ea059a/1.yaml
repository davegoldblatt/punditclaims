evaluator_interpretation:
  - This concerns the public evidential status of the extinction argument when Marcus published, rather than whether extinction will eventually occur.
  - The target period covers the public record through 2023-08-27. There is no natural reporting quarter for this observation about accumulated knowledge.
  - The plain reading of 'default' is the expected outcome of developing superhuman AGI without a successful intervention to make it safe.
  - "'Proven' means established by evidence or reasoning with substantiated premises. It does not require mathematical certainty or an actual extinction event."
  - "'A possibility' concedes a plausible risk; it does not assign that risk a numerical probability."
support_condition: The available arguments and research identify plausible routes to catastrophe but leave material assumptions unestablished between AI capabilities, power-seeking, and human extinction as the expected outcome.
contradiction_condition: Evidence available by publication establishes those material links sufficiently to demonstrate human extinction as the default outcome under the relevant conditions.
measurement_requirements: Examine what the arguments and formal results actually establish, including their assumptions and limits. Disagreement alone does not establish that a claim is unproven.
source_requirements: Use contemporaneous primary arguments and research. Later AI behavior cannot establish what had already been demonstrated in August 2023.
