  - large language models
  - certainly can happen with some regularity
  - technical literature on memorization and data leakage
evaluator_interpretation:
  - Reconstruction means generating substantial verbatim passages from training text, beyond merely reproducing text supplied in the prompt.
  - The plain reading of 'can happen with some regularity' is a recurring, experimentally measurable phenomenon across examples. It does not specify a percentage of ordinary conversations or require every model to reproduce training text.
  - The claim concerns an established capability as of 2024-02-05 and expressly invokes earlier research. The target period therefore ends on the post date and has no stated beginning. This capability has no quarterly or annual reporting period.
support_condition: Pre-publication experiments demonstrate repeated verbatim reproduction of training passages across many examples, with counts or rates that establish recurrence rather than an isolated anecdote.
contradiction_condition: Reliable experiments show that the purported repeated reconstructions were not training-text reproductions, or that reconstruction was confined to isolated, unrepeatable cases under the tested conditions.
measurement_requirements: Identify the tested models, prompting conditions, matching method, and number or rate of reproduced passages. Distinguish known training-set matches from matches against a proxy corpus, and targeted extraction from unprompted generation.
source_requirements: Primary empirical research available by the evaluation date and describing models or experiments from before the post. The speaker's writing can establish context but cannot establish the outcome.
