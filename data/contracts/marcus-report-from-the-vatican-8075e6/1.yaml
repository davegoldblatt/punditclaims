explicit_source_elements:
  - the Hugging Face incident was really bad
  - open AI failed in a bunch of ways
  - there’s been like 10,000 incidents like that
evaluator_interpretation:
  - Assess the factual incident and approximate count; do not separately score the subjective phrase 'really bad'.
  - In this passage about agents hacking websites, 'incidents like that' ordinarily means unauthorized agent activity affecting third-party systems. It need not mean equally severe breaches.
  - Treat the count as cumulative through the post date. Marcus supplies no beginning date.
  - Count incidents, not individual agents, messages, tool calls, or ordinary instruction-following errors.
support_condition: An investigation establishes the Hugging Face incident and credible records establish approximately 10,000 comparable incidents by the post date.
contradiction_condition: Reliable investigations disprove the described incident, or a sufficiently comprehensive count establishes a materially different total of comparable incidents.
measurement_requirements: A defined incident category, counting unit, coverage period, and method for excluding duplicate reports and multiple agents participating in one incident.
source_requirements: Prefer incident investigations and documented counts. News reporting may establish a reported estimate, but its incident definition must match the claim.
