assessment_axis: historical_observation
explicit_source_elements:
  - virtually everyone recognizes
  - large language models carry risks as well as opportunities
  - an urgent need to start to address these risks
evaluator_interpretation:
  - Virtually everyone means near-universal recognition, rather than merely majority agreement.
  - The claim combines recognition of risks, recognition of opportunities and urgency about beginning mitigation.
  - The population is unspecified. The ordinary broad reading includes public and professional stakeholders; the governance context also permits a narrower informed-stakeholder reading.
  - For this ongoing observation, I use the latest completed calendar quarter before publication, April through June 2023. There is no natural reporting cycle for this claim.
  - Recognition of urgency does not require support for a particular law, a training moratorium or one theory of AI risk.
support_condition: Representative contemporaneous evidence shows near-universal recognition of all three elements across the relevant population.
contradiction_condition: Comparable evidence shows a substantial share rejecting or not recognizing at least one element. Opposition to a particular intervention alone is insufficient.
measurement_requirements: Survey questions must distinguish risks, opportunities and urgency. Report the population, fieldwork dates and uncertainty; do not infer consensus from selected public statements.
source_requirements: Prefer representative public surveys and appropriately sampled expert surveys, with government and company statements used as supplementary context.
