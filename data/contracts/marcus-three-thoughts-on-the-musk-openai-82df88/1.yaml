explicit_source_elements:
  - repeatedly promised
  - in legal documents and public statements
  - to be a nonprofit for the benefit of humanity
  - and welched
evaluator_interpretation:
  - The historical period runs from OpenAI's incorporation through the post date.
  - The ordinary reading is that OpenAI committed to nonprofit operation for public benefit and subsequently abandoned that commitment through commercialization.
  - A public statement of purpose can establish a commitment without establishing an enforceable contract.
  - Distinguish the original nonprofit corporation from its for-profit operating businesses. Neither subsidiary creation nor continued nonprofit control alone settles whether the original commitments were broken.
support_condition: Contemporaneous legal and public records establish repeated nonprofit commitments, and subsequent records establish conduct incompatible with their scope.
contradiction_condition: The original records do not contain the alleged commitments, or subsequent records establish that the commitments continued to be fulfilled. Retained nonprofit control contradicts a claim of wholesale nonprofit abolition but does not alone disprove a broader claim of broken promises.
measurement_requirements: Compare the actual commitments, their corporate scope, and the completed organizational changes. Do not substitute allegations or a procedural court victory for a finding on breach.
source_requirements: Founding documents, contemporaneous public statements, restructuring records, and relevant court or regulator records.
