evaluator_interpretation:
  - Your cars means Tesla's deployed driving-assistance systems as of the post.
  - Hash-table-like is treated as a metaphor for dependence on learned patterns, not an assertion that Tesla literally implements its driving system as a hash table.
  - The causal commitment is that this dependence materially explains substantial difficulties with unusual situations.
  - So far as I know qualifies Marcus's confidence; it is not a conditional antecedent.
  - The contemporaneous system state is assessed during 2022 up to the post. Earlier architecture disclosures provide background only.
support_condition: Technical descriptions establish the relevant dependence on learned patterns, documented evaluations establish substantial unusual-situation failures, and failure analyses connect those failures to that dependence.
contradiction_condition: Reliable system and failure analyses establish that the relevant failures are absent or that the proposed dependence does not materially explain them.
measurement_requirements: Identify the software version, driving feature, unusual situation, and failure mechanism. Distinguish perception, planning, control, driver misuse, and software defects.
source_requirements: Prefer Tesla's technical disclosures and independent failure investigations. Complaints or crash videos alone cannot identify the architectural cause.
