  - The passage does not identify the accounting basis or provenance of the aggregate. Do not assume announced contract values equal recognized remaining performance obligations.
  - No numerical tolerance for 'around' is supplied.
support_condition: A reconciled, consistently scoped schedule shows approximately $748 billion of remaining obligations attributable to the two labs and a share of at least 50% of the same hyperscalers' total RPO.
contradiction_condition: A comparable customer-level reconciliation establishes a share below 50% or an attributable balance materially inconsistent with approximately $748 billion.
measurement_requirements: Match reporting dates, companies, contract coverage, reserve treatment and accounting definitions. Subtract fulfilled obligations and avoid double-counting intermediary contracts. Do not substitute investment, total contract value or revenue backlog with broader coverage.
source_requirements: Company filings and customer-level disclosures, supplemented by clearly identified estimates where primary customer attribution is unavailable.
