assessment_axis: historical_observation
explicit_source_elements:
  - Now
  - OpenAI and Anthropic
  - 50% or more
  - hyperscaler remaining performance obligations
  - or around $748 billion
evaluator_interpretation:
  - "'Hyperscalers' means Microsoft, Google (Alphabet's Google Cloud) and Amazon (AWS). The surrounding text treats these three as the hyperscalers and discusses Oracle separately. A $748 billion total that is half or more also only fits these three: if Oracle is added, half the base is about $1 trillion."
  - "'Now' (post dated 2026-06-30) is read as the latest reported quarter (ended 2026-03-31), plus large compute deals announced between then and the post date."
  - "'Remaining performance obligations' is read to cover each company's reported contracted backlog: Microsoft's commercial RPO, Google Cloud's backlog and AWS's backlog."
  - Supported if credible evidence shows contracts with OpenAI and Anthropic make up at least about half of the three companies' combined backlog, with a dollar total near $748 billion. Contradicted if evidence shows a share clearly below half or a dollar total far from $748 billion.
support_condition: Disclosures or credible reports show OpenAI and Anthropic contracts make up 50% or more of combined Microsoft, Google Cloud and AWS backlog in the first half of 2026, roughly $700-800 billion.
contradiction_condition: Disclosures or credible reports show OpenAI and Anthropic contracts make up clearly less than half of the three companies' combined backlog (for example under about 45%), or a dollar total far from $748 billion.
measurement_requirements: Combined backlog/RPO of Microsoft, Google Cloud and AWS around 2026-03-31, and the dollar value of the OpenAI and Anthropic commitments included in it.
source_requirements: Company filings and earnings calls for the backlog totals. Company disclosures or reputable news reports for the OpenAI and Anthropic shares, since Google and Amazon do not disclose them.
metric_scope:
  company: Microsoft, Alphabet (Google Cloud), Amazon (AWS)
  metric: Share and dollar value of remaining performance obligations / backlog attributable to OpenAI and Anthropic contracts
  currency: USD
  units: USD billions; percent of combined backlog
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-03-31
  period_end: 2026-06-30
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-03-31
  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - "Which companies count as hyperscalers: including Oracle changes the base from about $1.45 trillion to about $2 trillion."
  - Whether deals announced after the 2026-03-31 quarter end, notably Anthropic's AWS deal of more than $100 billion, count in both the numerator and the base.
  - Headline deal values may differ from what is actually booked in RPO.
  - Google and Amazon do not disclose how much of their backlog comes from OpenAI or Anthropic.
