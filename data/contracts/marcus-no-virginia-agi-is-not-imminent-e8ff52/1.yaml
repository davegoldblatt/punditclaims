explicit_source_elements:
  - doing well on a benchmark
  - not actually tantamount to being intelligent
  - pretty much everyone in the AI community knows
evaluator_interpretation:
  - In the AGI discussion, the plain reading is that a high benchmark score alone does not establish broad, reliable cognitive competence.
  - This does not assert that benchmark performance provides no evidence of ability or that benchmark-tested systems possess no intelligence.
  - The surrounding 2019-to-2023 discussion supplies the period for the empirical assessment.
  - The community-awareness language is treated as emphasis; no literal near-unanimity estimate is inferred.
support_condition: Systems with strong benchmark scores fail basic novel tests of abilities that those scores might reasonably be taken to establish.
contradiction_condition: Evidence establishes that the benchmark scores in question are sufficient to demonstrate the broad, reliable competence being inferred, including performance on novel tests.
measurement_requirements: Compare strong benchmark performance with controlled tests of basic capabilities and generalization beyond the benchmark.
source_requirements: Primary evaluations; a philosophical assertion about intelligence alone is insufficient.
