assessment_axis: historical_observation
explicit_source_elements:
  - They don’t make enough money to survive
  - without a continuous flow of venture capital
  - don’t seem to make impressive sums of money
  - even when allowed to burn as much as they’d like
evaluator_interpretation:
  - The checkable core is whether the referenced generative AI startups could fund continuing operations from their businesses without repeated new venture funding.
  - They could refer narrowly to the heavily funded companies discussed in the post or broadly to generative AI startups. Both readings must be disclosed.
  - Use April–June 2025, the latest completed calendar quarter that could have been reported before publication, for this ongoing observation.
  - Impressive supplies no objective revenue threshold and is not separately scored.
  - Don't seem is a hedge, not a conditional antecedent.
  - Survival requires cash-flow and liquidity evidence; an accounting loss or a financing announcement alone does not establish the necessity of continuous venture funding.
support_condition: Target-period cash flows, liquidity, and unavoidable obligations establish dependence on repeated new venture funding for the identified companies' continuing operations.
contradiction_condition: For the broad reading, a qualifying startup demonstrably funds continuing operations without repeated new venture funding. For the narrower reading, that evidence must concern the companies actually referenced.
measurement_requirements: Identify the company population, operating cash needs, available liquidity, financing dependence, and a survival interval. Do not substitute revenue, accounting losses, or fundraising choices for cash requirements.
source_requirements: Prefer cash-flow statements and company financing disclosures. Financial reporting must distinguish observed cash use from forecasts.
