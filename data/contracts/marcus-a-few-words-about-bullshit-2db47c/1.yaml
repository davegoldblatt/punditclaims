assessment_axis: historical_observation
explicit_source_elements:
  - MetaAI has got a new AI system
  - It prevaricates. A lot.
  - confabulate math and science
  - Pitch perfect and utterly bogus imitations of science and math
evaluator_interpretation:
  - The target is Galactica as released in November 2022.
  - In context, 'prevaricates' means producing false or fabricated material presented as factual; it does not require intentional deception.
  - The plain reading of 'a lot' is a recurring, substantial problem across scientific responses. Marcus supplies neither a numerical error rate nor a claim that most responses are false.
  - The observation concerns the launch-period behavior described in the post, November 15–16, 2022.
  - Repeated errors across documented prompts can establish the qualitative reading, but cannot establish a representative error rate across all uses.
support_condition: Launch-period records show repeated substantive falsehoods or fabrications across multiple scientific responses, including ordinary factual prompts, rather than one isolated failure.
contradiction_condition: Broad, credible launch-period testing shows that substantive falsehoods and fabrications were rare, and explains the cited examples as unrepresentative exceptions or misattributed outputs.
measurement_requirements: Inspect recorded prompts and outputs, distinguish ordinary questions from prompts containing invented premises, and check factual corrections. Do not equate benchmark error rates with a general fabrication rate.
source_requirements: Use contemporaneous firsthand test records and primary evaluations of the released model. Check disputed scientific facts against authoritative sources. Marcus's own assertions are not outcome evidence.
