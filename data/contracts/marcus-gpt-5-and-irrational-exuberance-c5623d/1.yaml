explicit_source_elements:
  - not smart enough to filter out falsehood
  - creating and spreading falsehoods it fails to verify
  - smart enough to be dangerous
evaluator_interpretation:
  - The plain reading is that contemporary GPT systems cannot reliably screen false assertions and can deliver unverified claims capable of causing harm. It does not mean they never distinguish truth from falsehood.
  - The target is the contemporary GPT product generation during March 2023 through the post date. This covers the latest completed month and the current partial month; these systems have no standard reporting period.
  - Danger includes the foreseeable reputational harm of presenting invented misconduct allegations as factual.
support_condition: Contemporaneous documented outputs show GPT systems presenting materially false factual assertions or invented supporting references, with credible evidence that factual verification remained unreliable.
contradiction_condition: Representative contemporaneous evidence establishes reliable factual screening, and the alleged failures are shown to be misattributed or otherwise invalid.
measurement_requirements: Identify the model where possible, the actual prompt and output, and the checks used to establish falsity. Distinguish unreliable verification from an absolute inability to recognize falsehood.
source_requirements: Prefer original output investigations and contemporaneous developer disclosures. Do not use Marcus's own account as corroboration.
