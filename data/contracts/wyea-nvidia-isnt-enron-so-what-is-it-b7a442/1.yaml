assessment_axis: forecast_outcome
explicit_source_elements:
  - At some point
  - a link in this debt-backed chain breaks
  - because very little cashflow exists to prop it up
evaluator_interpretation:
  - A 'link breaking' means a material participant in the chain (an AI lab, hyperscaler, neocloud such as CoreWeave or Lambda, or a GPU-backed lender) defaults on debt, files for bankruptcy, or fails to pay compute or GPU obligations.
  - The break must be tied to too little cash flow. Fraud or other unrelated causes do not count.
  - No deadline is stated, so this is an open-horizon forecast.
support_condition: A documented default, bankruptcy, or failure to pay debt or compute contracts by a material chain participant, caused by insufficient cash flow.
contradiction_condition: With no deadline, the forecast cannot be contradicted by the passage of time alone. Only a sustained period in which the chain's participants fund their obligations from operating cash flow would weigh against it, and that is not a decisive event.
measurement_requirements: Dated record of a default, bankruptcy filing, or missed payment, with its stated cause.
source_requirements: Court filings, company filings or announcements, rating agency actions, or reputable financial news.
metric_scope: null
original_horizon: at some point
horizon_interval:
  start: 2025-12-08
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Settled as supported if, before the evaluation date, a material chain participant (OpenAI, Anthropic, a hyperscaler, CoreWeave, Lambda, Nebius or a similar neocloud, or a major GPU-backed lender) defaults on debt, files for bankruptcy, or publicly fails to meet compute or GPU payment obligations because of insufficient cash flow.
interpretation_determines_result: false
