explicit_source_elements:
  - They will sue
  - feel gypped
  - force all kinds of info to come out
evaluator_interpretation:
  - "'They' refers to investors who lost money in the Huang controversy."
  - The forecast requires investor litigation concerning that controversy and substantial previously nonpublic information emerging because of that litigation.
  - "'Feel gypped' is assessed through expressed investor grievances, not an unverifiable private mental state."
  - The statement supplies no deadline. Existing lawsuits provide context but cannot alone establish the predicted future disclosures.
support_condition: Affected investors pursue litigation, express that they were wronged, and the litigation causes substantial previously nonpublic information about the Huang controversy to become public.
contradiction_condition: A decisive event establishes that the predicted litigation and disclosures cannot occur. Delay, one dismissal, or absence of disclosures so far is insufficient.
measurement_requirements: Identify relevant plaintiffs and filings, then trace substantial new public information to discovery, testimony, unsealed exhibits, or another litigation process.
source_requirements: Prefer court filings, docket records, testimony and released exhibits. News reports must distinguish litigation disclosures from independent reporting or government inquiries.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported only when documented investor litigation concerning the episode produces substantial previously nonpublic information in the public record. A complaint alone does not meet this rule.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline is stated.
  - "'All kinds of info' does not specify the amount or subjects of disclosure."
  - The wording does not distinguish new lawsuits from continued prosecution of existing suits.
retrospective_or_prospective: retrospective
