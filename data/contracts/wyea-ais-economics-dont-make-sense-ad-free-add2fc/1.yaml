assessment_axis: historical_observation
explicit_source_elements:
  - 15.2GW of data center capacity under construction
  - due by the end of 2028
  - PUE of around 1.35
  - roughly 11.2GW of critical IT
  - $14 million per megawatt
  - around $156.8 billion in annual revenue
  - required to actually make these data centers worth it
evaluator_interpretation:
  - Assess the construction pipeline described as current at the post date and the conditional revenue calculation. The 2028 date identifies the scheduled-delivery cohort, not a deadline for realizing revenue.
  - Treat 15.2 GW as total facility power and $14 million as annual GPU rental revenue per MW of IT capacity.
  - PUE and revenue per MW are stipulated assumptions, not predictions that must occur.
  - Read 'worth it' as covering operating and capital costs while earning an adequate investment return.
  - Use a construction-status snapshot at publication because the claim concerns projects currently under construction, rather than a quarterly accounting flow.
support_condition: Independent contemporary data establish the stated pipeline and power basis, the arithmetic yields approximately the stated annual revenue, and a transparent cost-and-return model establishes that revenue as the required level.
contradiction_condition: Comparable pipeline data materially contradict the capacity or power basis, the arithmetic materially fails, or a matching financial model demonstrates a materially different required revenue under the stipulated assumptions.
measurement_requirements: Verify project coverage, construction status, scheduled delivery, facility versus IT power, and the economic meaning of $14 million per MW per year. Test utilization, capital costs, equipment life, operating costs, financing, and required return.
source_requirements: The underlying construction tracker or independent project records, an authoritative PUE definition, and a reproducible financial model.
