ambiguity_flags:
  - Current construction status is interpreted as a publication-date snapshot.
  - Geographic and project coverage are not specified in the quoted claim.
  - Facility power versus IT power is assumed rather than independently established.
  - The annual time basis of $14 million per MW is supplied by context.
  - "'Worth it' supplies no return threshold or complete cost model."
  - Pure arithmetic and economic necessity are distinct readings.
