assessment_axis: historical_observation
explicit_source_elements:
  - The real problem w robots has never been demos
  - there have been many, for decades
  - making robots in robust in the real world
evaluator_interpretation:
  - In context, the ordinary reading concerns flexible robots operating in varied homes and workplaces. It does not deny successful specialized robots.
  - Robust means dependable operation despite changes, unfamiliar situations, and interactions with people.
  - Has never been demos is read as an emphatic distinction between demonstrating capabilities and making them dependable, not as a literal assertion that demonstrations require no difficult engineering.
  - The historical scope extends through the post date. Its beginning is unspecified because Marcus says decades without naming a starting year; this is not a latest-quarter observation.
  - Real problem is read as a central continuing obstacle, rather than a measured ranking of every obstacle in robotics.
support_condition: Historical records establish robotic demonstrations decades before the post, while pre-post research identifies reliability and adaptation in open-ended environments as central continuing obstacles.
contradiction_condition: Evidence establishes that dependable general-purpose operation in varied environments was already broadly achieved, or that the asserted distinction between demonstrations and dependable deployment is substantially false.
measurement_requirements: Historical examples of demonstrated capabilities and research or deployment evaluations addressing generalization, sustained operation, and failures under changing conditions.
source_requirements: Primary institutional histories, research papers, and documented deployment results available by the evaluation date and describing the period through September 29, 2022.
