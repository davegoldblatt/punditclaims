explicit_source_elements:
  - OpenAI’s non-profit board
  - has been proven
  - entirely beholden to financial interests
evaluator_interpretation:
  - Assess the factual assertion that the leadership crisis had demonstrated complete subordination of the nonprofit board’s decisions to financial interests.
  - The ordinary reading requires demonstrated control of decisions, beyond investor influence or pressure.
  - The target period is the firing and immediate response through the post date, November 17–20, 2023. Later descriptions of those events are admissible; later board decisions are outside this observation.
  - The recommendation to be concerned is normative. The adjacent customer-flight report and competition reference are not substitutes for evidence of board control.
support_condition: Records of the November 17–20 decisions demonstrate that financial stakeholders or financial objectives controlled the board’s response and overrode its independent judgment.
contradiction_condition: Records establish consequential independent board decisions contrary to financial demands and show that those decisions were not themselves controlled by other financial interests.
measurement_requirements: Separate financial pressure, formal governance rights, actual decision control, and directors’ motives. Do not infer complete control from one concession or complete independence from one refusal.
source_requirements: Contemporaneous decision records, communications, attributable testimony, or a documented investigation. News reporting may establish private negotiations where primary records are unavailable.
