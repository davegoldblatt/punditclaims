evaluator_interpretation:
  - The condition is a completed Anthropic IPO at a reported equity valuation of $1.5 trillion.
  - Read disaster in the surrounding financing context as severe impairment of OpenAI's ability to complete the specified financing on its intended terms.
  - Failure, abandonment, or materially adverse repricing must be linked to the qualifying Anthropic IPO; ordinary negotiation changes alone are insufficient.
  - The requested financing amount and valuation are reported targets, not completed financing.
  - No deadline is supplied.
support_condition: After the qualifying Anthropic IPO, OpenAI's specified financing fails or is materially impaired, with reliable evidence connecting the impairment to that IPO valuation.
contradiction_condition: After the qualifying IPO, OpenAI completes the specified financing on the stated terms without the predicted severe financing harm. This tests the contextual financing reading, not every possible meaning of disaster.
measurement_requirements: Anthropic's final IPO valuation; OpenAI's financing amount, valuation convention, closing status and final terms; chronology and evidence of the alleged causal link.
source_requirements: IPO closing documents and OpenAI financing records, supplemented by reputable reporting where private negotiations are not publicly disclosed.
