evaluator_interpretation:
  - The firm assertion is that no single system completed at least five of the ten tasks by December 20, 2025.
  - The parenthetical possibility of zero is hedged and is not treated as a firm zero-success assertion.
  - The retrospective concerns 2025 through publication, not the original wager's 2027 deadline or the remaining days of 2025.
  - Success must satisfy the tasks' full requirements, including reliability where specified. Related benchmark scores alone do not count.
support_condition: A sufficiently comprehensive independent task-level assessment establishes that no qualifying system completed five tasks during the target period.
contradiction_condition: Dated, independently assessable results establish that one qualifying system completed at least five tasks during the target period.
measurement_requirements: Map results to all ten original tasks, preserve task-specific requirements, and identify which results belong to the same system.
source_requirements: Primary demonstrations, reproducible evaluations, or a documented independent adjudication. Self-assessments and markets resolved from those self-assessments are insufficient.
