ambiguity_flags:
  - January 2025 is the evaluator's latest-completed-month choice for an undated ongoing state.
  - The denominator is an estimated range, but the percentage uses its upper endpoint.
  - Web visitors and app users may overlap and need not represent the same activity measure.
  - Paying share and free-to-paid cohort conversion are different measures.
  - Customer-level cost allocation and accounting basis are unspecified.
  - Astonishingly bad has no stated comparison standard.
