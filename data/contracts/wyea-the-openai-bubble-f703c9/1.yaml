assessment_axis: forecast_outcome
explicit_source_elements:
  - When OpenAI eventually leaves
  - CoreWeave, Cerebras, and Oracle
  - in the lurch
  - there won’t be anyone else
  - to pick up that compute
evaluator_interpretation:
  - The antecedent requires OpenAI to abandon or default on compute commitments, leaving identifiable capacity stranded at the named providers.
  - An agreed change in procurement, an ordinary contract expiration, or a provider's construction delay does not alone establish abandonment.
  - Read the consequent as no other customer taking over that stranded capacity. General demand for other capacity is insufficient.
  - Assess physical capacity and replacement use, not the dollar value of compute commitments.
  - No replacement period or deadline is supplied; do not invent one.
support_condition: The antecedent occurs, and records establish that the identified capacity at all three providers remains without replacement customers until its permanent retirement or another definitive end to its possible reuse.
contradiction_condition: After the antecedent occurs, a binding replacement contract or actual utilization establishes another customer taking up a material, identifiable portion of the abandoned capacity.
measurement_requirements: Identify the abandoned obligations and facilities or capacity, establish when abandonment occurred, and trace subsequent replacement contracts and utilization for that same capacity.
source_requirements: Termination or default disclosures, provider filings, replacement contracts, and dated utilization records. General customer announcements are context only.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: After verified abandonment, an actual replacement customer for the identified capacity can decisively contradict the absolute prediction. Support requires definitive retirement or closure of replacement opportunities across the affected capacity.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'In the lurch' does not define the form of abandonment."
  - No deadline or replacement window.
  - The treatment of partial replacement is unspecified.
  - The wording groups three providers without specifying whether abandonment must be simultaneous.
retrospective_or_prospective: retrospective
