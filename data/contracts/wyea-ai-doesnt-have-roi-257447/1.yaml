assessment_axis: causal_assessment
explicit_source_elements:
  - AI job loss is a fucking myth
  - Every company
  - laying off people because of “the power of AI”
  - because their shareholders are mad
  - because they know they’ll get headlines
evaluator_interpretation:
  - The claim denies actual employee displacement through AI and attributes all publicly AI-linked layoffs to shareholder pressure and publicity.
  - Assess causes of layoffs occurring by June 2, 2026, rather than later developments.
  - The description of companies announcing AI-linked layoffs defines the population; it is not a conditional forecast.
  - The nearby concession about some contract positions is respected. Contractor substitution alone will not settle the employee-layoff claim.
  - An employer's AI explanation is evidence of its stated rationale, but does not by itself establish the actual cause.
support_condition: Reliable records establish that the relevant layoffs did not result from AI taking over work, and that shareholder dissatisfaction and anticipated publicity explain the decisions across the claimed population.
contradiction_condition: Credible firm-level evidence establishes at least one actual employee displacement caused materially by AI taking over work, or establishes a relevant layoff decision incompatible with the universal attribution of motives.
measurement_requirements: Distinguish completed dismissals from announcements, attrition, redeployment, reduced hiring, and spending shifts. Connect staffing changes to work actually performed by AI.
source_requirements: Prefer staffing and operational records, internal decision documents, and corroborated worker evidence. Aggregate exposure studies and executive statements alone do not establish individual firms' motives.
