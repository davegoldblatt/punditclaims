explicit_source_elements:
  - OpenAI and Anthropic both
  - lose billions of dollars a year after revenue
  - their stories do not mirror any other startup in history
  - not Uber, not Amazon Web Services
evaluator_interpretation:
  - The monetary clause means each company separately incurs annual losses of at least USD 2 billion after accounting for revenue.
  - Use calendar 2024, the latest completed annual period before publication. The nearby 2025 projection is not treated as a realized annual result.
  - The surrounding discussion relies on reported private-company estimates, so the contract basis is estimate; no GAAP or other accounting standard is asserted.
  - After revenue is read as net loss rather than spending, financing or cash burn.
  - No dimensions of similarity are given for startup stories. Annual losses alone cannot establish or disprove the entire historical comparison.
support_condition: Comparable reported estimates establish at least USD 2 billion of realized annual net loss for each company in 2024. Supporting the entire compound claim would additionally require a defined, defensible historical comparison.
contradiction_condition: Comparable evidence establishes that at least one company's 2024 annual net loss was below USD 2 billion. A historical comparison can contradict the broader clause only under explicitly specified dimensions of similarity.
measurement_requirements: Separate companies and distinguish annual net losses from cash burn, operating losses, expenses, projections and annualized revenue. Preserve the reported accounting basis.
source_requirements: Prefer financial statements. Use credible financial reporting where primary records are unavailable, while keeping differently based figures contextual.
