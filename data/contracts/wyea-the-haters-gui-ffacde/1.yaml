evaluator_interpretation:
  - The companies are Amazon, Alphabet, Microsoft, Meta and Tesla, with the surrounding text emphasizing the first four.
  - The ordinary reading concerns generative AI services' attributable revenue, losses and contribution to company revenue growth.
  - I use January–March 2025, the latest generally reported quarter before publication.
  - Meaningful means a material contribution to the companies' growth; I do not invent a numerical cutoff.
  - Company growth disclosures can test the revenue component, but the claimed losses have no specified accounting basis.
support_condition: Comparable generative AI financial evidence shows substantial losses, small revenue and an immaterial contribution to company revenue growth during the target period.
contradiction_condition: Comparable evidence establishes a material generative AI contribution to company revenue growth or disproves the claimed substantial losses. Any conclusion must identify which component is settled.
measurement_requirements: Separate generative AI from other AI and cloud services. Measure realized revenue and its contribution to consolidated growth, and match costs to the revenue period. Capital expenditure is not an immediate operating loss.
source_requirements: Company disclosures or credible estimates with explicit service boundaries, cost allocations and accounting definitions.
