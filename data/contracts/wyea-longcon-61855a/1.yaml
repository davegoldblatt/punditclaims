assessment_axis: historical_observation
explicit_source_elements:
  - 300 million monthly active users
  - conversion rate of less than 4%
  - subscription revenue for ChatGPT Plus (and other monthly subscriptions)
  - the majority of OpenAI's revenue
evaluator_interpretation:
  - The numerical statement is hypothetical arithmetic using the surrounding passage's rounded 11 million paying subscribers. It does not assert that monthly active users actually numbered 300 million.
  - The arithmetic is assessed separately from the ongoing revenue-share assertion.
  - For the revenue assertion, 2024 is the latest completed calendar year before publication. This period is an evaluator choice because Zitron supplies no revenue accounting period.
  - Majority means more than half of revenue. The description of the rate as poor is an opinion and is not scored.
  - The financial claim is treated as an estimate based on the press reporting invoked in the passage.
support_condition: The stipulated calculation is below 4%, and matching estimates of realized 2024 revenue show subscriptions contributing more than half.
contradiction_condition: The stipulated calculation is at least 4%, or matching estimates show subscriptions contributed no more than half of realized 2024 revenue.
measurement_requirements: Keep hypothetical monthly users distinct from measured weekly users. For the revenue component, compare subscription revenue with total revenue for the same period and accounting scope; do not substitute annualized run rates.
source_requirements: Contemporaneous subscriber reporting and a company disclosure or credible financial estimate identifying the relevant revenue period and mix.
