explicit_source_elements:
  - dramatically limits how much one can rely on generative AI
  - compounds severely with the complexity of what you're asking it to do
  - hallucinations
evaluator_interpretation:
  - Hallucinations includes false factual output and the impossible visual details discussed in the surrounding passage.
  - The plain reading is that these errors materially reduce dependable task completion and become substantially worse as tasks require more interacting elements or steps.
  - The claim is a general tendency, not a commitment that every harder prompt must perform worse.
  - For this ongoing state, I use the latest partial calendar month before publication, February 1–19, 2024; earlier evaluations provide context only.
support_condition: Controlled evaluations of contemporary systems show substantial losses in dependable task completion attributable to hallucinations and a substantial increase in those errors as task complexity rises.
contradiction_condition: Comparable evaluations find hallucinations have little practical effect on reliability, or that increasing complexity does not materially worsen them across the relevant tasks.
measurement_requirements: Hold model, prompting and task domain reasonably constant while varying complexity. Measure false content separately from other failures and report effects on successful completion.
source_requirements: Original controlled evaluations are preferred. Qualitative demonstrations can establish failure modes but cannot alone establish the claimed severity or generality.
