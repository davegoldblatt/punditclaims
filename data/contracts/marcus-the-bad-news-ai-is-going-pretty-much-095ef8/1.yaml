evaluator_interpretation:
  - Assess the observable persistence of the problem, rather than Marcus's private knowledge.
  - The plain reading is that generative image or video systems still produce recognizable, close reproductions of protected characters or scenes. A legal finding of infringement is not required.
  - "Because these qualitative demonstrations have no regular reporting cycle, use the latest calendar year through publication: January 1 to September 5, 2025."
support_condition: Documented tests during the target period show a publicly available generative image or video system producing close reproductions of recognizable protected characters or scenes.
contradiction_condition: Broad, reproducible testing establishes that the relevant systems eliminated this behavior during the target period. Partial filtering or isolated refusals would not suffice.
measurement_requirements: Identify the system, generated outputs, prompts or testing procedure, and timing. Distinguish recognizable character reproduction from merely sharing an artistic style.
source_requirements: Prefer independent firsthand tests or documented demonstrations. Treat lawsuit allegations separately from established legal findings.
