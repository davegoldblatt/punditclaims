assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s latest models only get more expensive as time drags on
  - GPT-4.5 costs $75 per million input tokens, and $150 per million output tokens
evaluator_interpretation:
  - The adjacent per-token figures identify customer API prices as the ordinary measure of expensive.
  - Assess the recent model releases in 2025 through the post date. This is an observation about the release trend, not an indefinite forecast.
  - Only makes the statement stronger than saying that some models are expensive. A comparable newer model offered at lower prices is a counterexample.
  - A cheaper model's release need not establish that every model or every workload becomes cheaper.
support_condition: Published API prices show that successive comparable recent OpenAI models consistently became more expensive.
contradiction_condition: Before the post, OpenAI released a comparable newer model at lower API prices than its predecessor or the existing model it was replacing.
measurement_requirements: Compare published API prices on consistent token and billing terms. Keep customer prices separate from OpenAI's internal inference spending.
source_requirements: Dated OpenAI release announcements or historical pricing documentation.
