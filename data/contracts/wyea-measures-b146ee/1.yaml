evaluator_interpretation:
  - The ordinary reading compares OpenAI's financing requirement known at the post date with the largest cumulative investment previously made in any single startup.
  - I do not silently replace cumulative investment with the largest individual funding round.
  - The comparison concerns the financing requirement understood at the post date, not requirements announced later.
  - The statement does not quantify the requirement, define a funding horizon, or identify an accounting basis.
support_condition: A documented OpenAI financing requirement exceeds a reliable historical maximum for cumulative capital invested in an individual startup, using consistent treatment of equity, debt, commitments, and completed investments.
contradiction_condition: A reliable historical example of cumulative startup investment equals or exceeds the documented OpenAI requirement on the same basis.
measurement_requirements: A quantified financing requirement and a historical cumulative-investment comparison. Separate valuations, secondary share sales, announced commitments, and cash actually invested.
source_requirements: Company financing disclosures plus reliable historical financing records. Resolve the unspecified accounting basis and financing scope before assigning a decisive outcome.
