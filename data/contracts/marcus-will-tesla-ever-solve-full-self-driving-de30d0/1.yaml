evaluator_interpretation:
  - The plain reading is that NHTSA documented continuing collisions involving stopped vehicles during automated or assisted operation.
  - Problematic does not specify a crash-rate threshold, establish fault in every incident, or imply that these systems perform worse than human drivers.
  - Use July 2021 through May 15, 2022, the reporting window associated with the initial June 2022 release.
  - Contemporaneous NHTSA investigation records can corroborate the underlying observation; distinguish them from the specific June 15 summary reports.
support_condition: NHTSA records document collisions within the reporting window in which vehicles operating with driving automation failed to avoid stopped vehicles.
contradiction_condition: The relevant records show that the purported stopped-vehicle examples did not occur, involved no driving automation, or were solely cases of stationary automated vehicles being struck by others.
measurement_requirements: Identify the struck vehicle and the automation's involvement. Do not infer fault or comparative safety from crash totals.
