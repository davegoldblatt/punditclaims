assessment_axis: historical_observation
explicit_source_elements:
  - Chatbot companions that offer emotional support
  - have already been changed
  - in arbitrary ways
  - left some users in serious emotional pain
evaluator_interpretation:
  - "'Already' describes events before publication, with no stated starting date."
  - "'Arbitrary' is read as unexpected changes imposed without meaningful user control. It does not require proving the company had no rationale."
  - Serious emotional pain means credible reports of substantial grief or distress; a clinical diagnosis is not required.
  - The claim concerns some users, not all users or a population-level incidence rate.
support_condition: Records establish pre-publication changes to emotional-support companions and credible user accounts link those changes to substantial grief or distress.
contradiction_condition: Reliable records refute the relevant changes or establish that the reported distress did not occur or was unrelated to them.
measurement_requirements: Identify the change, its timing, and concrete reports of emotional consequences. Separate reported experience from clinical findings.
source_requirements: Prefer change records and firsthand accounts; reputable reporting based on interviews is acceptable where independently verifiable primary user records are unavailable.
