explicit_source_elements:
  - Silly errors certainly do
  - problems of abstraction
  - widespread
  - large language models
evaluator_interpretation:
  - Silly errors means objectively incorrect answers on elementary tasks, such as arithmetic, rather than stylistic disagreements.
  - Abstraction means applying a rule or relation beyond familiar examples or content.
  - Widespread means recurring across multiple contemporary models and tasks, not that every model fails every test.
  - Use evaluations from the latest completed research year, 2022, and the pre-post portion of 2023 to assess the ongoing state.
support_condition: Contemporary controlled evaluations document elementary errors and recurring failures to apply rules across multiple models, model sizes or task settings.
contradiction_condition: Representative contemporary evaluations establish reliable elementary accuracy and robust rule transfer, with the alleged abstraction problems confined to isolated or invalid examples.
measurement_requirements: Use objective answers, controlled changes in task content or familiarity, and more than a single anecdotal model response.
source_requirements: Original evaluations of models available before the post, including favorable results and comparisons with human limitations.
