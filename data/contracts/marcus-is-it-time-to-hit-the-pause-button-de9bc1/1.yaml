assessment_axis: causal_assessment
explicit_source_elements:
  - the new breed of systems
  - wildly popular
  - rapid, mass adoption by the general public
  - with greater adoption comes greater risk
evaluator_interpretation:
  - Mass adoption means millions of public users within weeks or a few months, rather than a specified market-share threshold.
  - The class-level adoption claim does not require every chatbot to have the same audience.
  - Greater risk means greater aggregate exposure to harmful outputs and misuse, not necessarily greater risk per user.
  - The relevant rollout runs from ChatGPT's November 2022 introduction through the post date.
support_condition: Public usage records establish rapid mass adoption, and credible empirical evidence or a supported causal account connects increased adoption to increased aggregate risk in these deployments.
contradiction_condition: Reliable usage records show adoption remained small or slow, or evidence establishes that expanded adoption did not increase aggregate risk under the relevant deployment conditions.
measurement_requirements: Distinguish visitors, visits, registered users and active users. For risk, identify the harm and explain how changes in exposure, safeguards and user behavior affect aggregate risk.
source_requirements: Original usage measurements where accessible; otherwise reputable reporting identifying the measurement source. Risk evidence must go beyond assuming that popularity itself demonstrates harm.
