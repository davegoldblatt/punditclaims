explicit_source_elements:
  - OpenAI cannot afford the $300 billion
  - NVIDIA hasn’t sent OpenAI a cent
  - won’t do so if it can’t build the data centers
  - OpenAI most assuredly can’t afford to do
evaluator_interpretation:
  - The main proposition concerns financing capacity at publication for the newly announced Oracle and NVIDIA arrangements.
  - Afford means the ability to finance payments when due, including credible external financing; it does not mean holding the entire multiyear headline amount in cash.
  - The NVIDIA payment statement is read as referring to the newly announced investment, not every historical NVIDIA investment in OpenAI.
  - The conditional wording describes the announced financing arrangement within this observation. It is not treated as a separate conditional forecast.
  - The monetary commitment is presented through contemporary reporting, so its claimed basis is estimate.
support_condition: Payment schedules, construction obligations, available liquidity, and committed financing demonstrate an unavoidable funding shortfall under the arrangements at publication.
contradiction_condition: Contemporaneous records establish sufficient financeable resources for the scheduled obligations and construction requirements. A large fundraising announcement alone is insufficient.
measurement_requirements: Match cash and financing availability to dated contractual payments and obligations borne by OpenAI. Separate leases from purchases, commitments from cash received, and annualized revenue from realized revenue.
source_requirements: Executed agreements, financing documents, and contemporaneous financial statements are preferred. Press reports and company descriptions can establish context but cannot substitute for missing payment schedules.
