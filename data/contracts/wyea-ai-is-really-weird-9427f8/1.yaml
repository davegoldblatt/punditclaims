explicit_source_elements:
  - the Magnificent Seven
  - building massive data centers
  - every single one of them is losing money doing so
  - revenues so putrid they refuse to talk about them
evaluator_interpretation:
  - Assess the supplied normalized proposition about AI operations and disclosure. The opening NVIDIA market-ranking and GPU-sales statements are outside that proposition.
  - The plain reading concerns losses attributable to AI infrastructure and services, rather than losses across the companies as a whole.
  - Use October–December 2025, the latest completed quarter ordinarily reportable before the April 8 post, for the ongoing financial assertion.
  - The relevant population is the Magnificent Seven members undertaking the described buildout; the sentence does not clearly identify every included company.
  - Losing money does not specify operating loss, net loss, negative cash flow or cumulative investment return. No cited accounting source establishes a basis, so accounting_basis is unknown.
  - Interpret refusal to discuss revenue as a disclosure assertion. Selected AI metrics can challenge that assertion without proving profitability or explaining management's motives.
support_condition: Comparable AI-specific financial records establish losses for every included company during the target quarter, and disclosure records support the claim that poor revenue caused the asserted silence.
contradiction_condition: Matching AI-specific accounts establish that at least one included company was not loss-making, or contemporaneous records refute the claimed refusal to discuss AI revenue. A definitive monetary verdict additionally requires a specified accounting basis.
measurement_requirements: AI-specific revenue and attributable costs, with consistent treatment of depreciation, research spending, shared infrastructure and capital expenditure. Keep realized revenue, annualized run rate, operating profit and net profit separate.
source_requirements: Company filings or disclosures with identifiable AI scope and accounting treatment. Consolidated and broad cloud-segment results are context only.
