explicit_source_elements:
  - we do not really have any firm understanding
  - how much AI compute actually exists
  - Microsoft
  - actively misleading the public
  - how much they’re bringing online
evaluator_interpretation:
  - Read firm understanding as a sufficiently reliable public account of operational AI capacity, not perfect knowledge of every chip.
  - Assess the public information and recent Microsoft communications available in the current reporting context, from July 1 through October 13, 2026.
  - Distinguish operational GPU capacity, total computing capacity, electrical capacity, planned capacity and hardware purchased.
  - Active misleading requires an identifiable communication that materially misrepresents capacity coming online. Sparse disclosure alone is insufficient.
  - Assess both the wording and its reasonable implication; proof of private intent is not imposed as an additional requirement.
support_condition: Evidence establishes material gaps in the public operational-capacity inventory and shows a specific Microsoft statement materially overstating or misrepresenting capacity brought online.
contradiction_condition: Reliable public operational inventories establish the relevant capacity, and records show that the Microsoft statements at issue accurately describe the capacity and commissioning status they reasonably convey.
measurement_requirements: Use consistent capacity definitions, scope and dates. Reconcile company statements with operational records rather than comparing AI-only capacity with total capacity.
source_requirements: Microsoft's original communications, dated commissioning or operational records, and independent capacity measurements with disclosed uncertainty.
