assessment_axis: forecast_outcome
explicit_source_elements:
  - human beings cannot create content at the scale that automation can
  - when a large chunk of the internet is content for robots
  - that is the content that will inform tomorrow's models
  - not saying that user-generated content will disappear
evaluator_interpretation:
  - The forecast is conditional and has no deadline; tomorrow's models means subsequent model generations.
  - Content for robots means material primarily produced to satisfy automated ranking, crawling, or similar systems, consistent with the surrounding discussion.
  - AI authorship alone does not establish that content was written for robots rather than human readers.
  - Inform models means enter their training data and contribute to learned behavior, not merely be retrieved after training.
  - The scale comparison concerns production capacity, not a claim that automation had already produced more total content than all humans.
support_condition: After robot-targeted material demonstrably becomes a substantial share of web content, dated training records show that later models ingest and learn from that material. Production measurements also substantiate automation's greater scalable output capacity.
contradiction_condition: Once the antecedent is established, representative subsequent training records show that the predicted material is effectively excluded and does not inform the relevant models. A temporary lack of examples would not disprove an undated forecast.
measurement_requirements: Representative web sampling with a stated denominator and classification of intended audience; comparable human and automated production-capacity measures; dated training-corpus provenance and filtering results.
source_requirements: Independent web measurements and primary training-corpus or model-development records. Detector labels alone cannot establish authorial purpose or actual training inclusion.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only if dated evidence establishes the antecedent and traces robot-targeted web content into subsequent models' training and learned behavior, or decisively excludes the predicted route for the claim's scope.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Large chunk has no numerical threshold.
  - Content for robots can be confused with content generated by robots.
  - The web-content denominator and production-capacity comparison are unspecified.
  - No model family, required training share, or deadline is stated.
retrospective_or_prospective: retrospective
