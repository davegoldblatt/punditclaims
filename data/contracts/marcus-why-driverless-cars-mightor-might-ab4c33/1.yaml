explicit_source_elements:
  - To get there
  - what we need is a much smarter AI
  - can reason, and not hallucinate
  - grounded in reality and not just corpus statistics
  - require fundamental research
evaluator_interpretation:
  - Following the supplied normalized proposition, this assessment concerns necessary technical capabilities and research, rather than separately adjudicating the accompanying research-funding assertion.
  - The plain reading is that reliable, safer-than-human driving requires improved reasoning grounded in the driving environment and control of fabricated representations, with fundamental research needed to obtain those capabilities.
  - The claim concerns necessity, not merely whether reasoning, sensing or research can help.
  - It does not explicitly require symbolic AI, a particular architecture or a ban on statistical learning.
support_condition: Technical and safety evidence identifies the stated capabilities and fundamental research advances as necessary for reliable, safer-than-human driving, rather than merely present in successful systems.
contradiction_condition: A documented system achieves reliable, safer-than-human driving while demonstrably lacking an asserted necessary capability, or a well-supported technical account establishes that the claimed fundamental advance was unnecessary.
measurement_requirements: Link comparable real-world safety outcomes to documented system capabilities and development history. Evidence must distinguish necessity from correlation and specify how reasoning, grounding and hallucination control are tested.
source_requirements: Public technical descriptions, capability evaluations and safety studies, ideally with component-removal tests or other evidence identifying the role of the claimed capabilities.
