evaluator_interpretation:
  - This is a testable statement about an existing dataset, not a conditional forecast.
  - Collapse means sum the five accuracy scores within each participant, preserving participants as independent observations.
  - The primary test combines both cohorts and compares the 50 LLM-assigned participants with the 50 internet-only participants.
  - Use an unadjusted, two-sided Welch t-test with significance at p < 0.05; also check the expert-only interpretation suggested by the preceding discussion.
  - This assesses the numerical significance claim, not whether this was the uniquely correct analysis.
support_condition: A participant-level t-test of total accuracy produces p < 0.05 for the combined sample, with a positive LLM-group difference.
contradiction_condition: The specified participant-level t-test produces p >= 0.05.
measurement_requirements: Join scores and assignments by participant ID, verify five accuracy scores per participant, sum within participant, and compare independent groups without multiple-comparison adjustment.
source_requirements: Original participant assignments and accuracy records, with the published statistical summary as a cross-check.
