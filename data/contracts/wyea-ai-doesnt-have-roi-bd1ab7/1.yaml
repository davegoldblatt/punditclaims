assessment_axis: historical_observation
explicit_source_elements:
  - a business model for your AI services that actually makes a profit
  - which nobody appears to have done
  - even with unlimited capital and the entire focus of the tech industry
evaluator_interpretation:
  - The ordinary reading concerns demonstrated profitability from selling generative AI model services, including image generation, rather than profits from selling chips or unrelated businesses.
  - Makes a profit means revenue exceeds the costs of providing and sustaining those services; positive revenue or gross margin alone is insufficient.
  - Appears refers to publicly demonstrated profitability, not undisclosed private results.
  - Unlimited capital is rhetorical emphasis, not a literal conditional antecedent.
  - "For this ongoing financial observation, the target is the latest completed calendar quarter ordinarily reportable before publication: January through March 2026. Earlier results provide historical context."
  - The supplied words identify no accounting basis. This remains unknown rather than being silently replaced with GAAP, operating profit, or adjusted EBITDA.
support_condition: Comparable public accounts across the relevant provider population establish that no provider demonstrated sustained profit from its AI services in the target period.
contradiction_condition: At least one relevant provider publicly demonstrates sustained profit attributable to its AI services in the target period, on a clearly specified and applicable accounting basis.
measurement_requirements: Service revenue and attributable costs, including infrastructure depreciation, personnel, model development, and financing where applicable; distinguish net profit, operating profit, gross profit, and adjusted measures.
source_requirements: Public financial statements or sufficiently detailed company disclosures available by publication. Later evidence may clarify the target period but cannot retroactively establish what was publicly apparent.
