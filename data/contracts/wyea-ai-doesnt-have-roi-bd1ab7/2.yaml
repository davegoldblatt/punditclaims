explicit_source_elements:
  - you'll have to come up with a business model for your AI services that actually makes a profit
  - which nobody appears to have done
  - even with unlimited capital and the entire focus of the tech industry
evaluator_interpretation:
  - "The hedge 'appears' is respected. The claim is about the visible record as of the post: whether any company selling AI services (model labs, GPU clouds) had publicly shown a business that actually makes a profit."
  - "'Actually makes a profit' is read as profit under standard reporting (GAAP operating or net income), not adjusted figures that exclude costs such as stock-based compensation."
  - "Target period: from the start of 2025 to the post date (2026-06-02). This is the record the speaker could see when he wrote 'appears to have done'. Later-reported results for quarters ending after the post are context."
  - The claim is mainly about firms running AI data centers or selling AI model services. Diversified companies whose AI results are not reported separately, such as hyperscalers, are not counted.
support_condition: Would be supported if, as of the post, the main AI service providers with public figures all showed losses over the recent periods and none had shown an actually profitable AI-services business.
contradiction_condition: Would be contradicted if, as of the post, a significant AI-services company had reported real (GAAP) profit from its AI services in a recent period.
measurement_requirements: Reported operating or net income of AI service providers for periods ending on or before the post date.
source_requirements: Company filings or company-reported figures, or reputable reporting on them.
