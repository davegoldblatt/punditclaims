ambiguity_flags:
  - Little fruit has no numerical threshold.
  - Alignment can encompass ordinary behavioral safety, adversarial robustness, or reliable control of future advanced systems.
  - Black box could describe model opacity or restricted evaluator access.
  - Thus far denotes cumulative progress but supplies no starting date.
  - The relative weight of measurable benchmark gains and unresolved control problems is unspecified.
