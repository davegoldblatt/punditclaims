assessment_axis: forecast_outcome
explicit_source_elements:
  - Human domestic robots like Optimus and Figure
  - will be all demo and very little product
  - predictions for 2026
evaluator_interpretation:
  - The forecast covers calendar 2026 (the post lists predictions 'for 2026').
  - "Plain reading: by the end of 2026, humanoid home robots such as Tesla Optimus and Figure will be shown mostly in demos, with few units actually sold or delivered to ordinary consumers' homes for regular use."
  - Other home humanoids (for example 1X NEO) fall under 'like Optimus and Figure' and are relevant, but Optimus and Figure are the named examples.
  - "Early resolution rule: contradicted early if, before 2026-12-31, reliable sources document thousands of humanoid robots of this kind delivered into consumer homes for regular use. Support can only be judged at the end of 2026."
support_condition: By 2026-12-31, consumer home deliveries of Optimus, Figure and similar humanoids are absent or tiny (pilot or early-access scale), while demos are plentiful.
contradiction_condition: "During 2026, reliable sources document a substantial product: thousands of humanoid robots sold and delivered to consumer homes and used there regularly."
measurement_requirements: Company-reported or independently reported consumer delivery counts, availability for purchase, and documented home use during 2026.
source_requirements: Company announcements and filings (for example Tesla shareholder reports), reputable news reports and independent reviews.
metric_scope: null
original_horizon: "2026"
horizon_interval:
  start: 2025-12-20
  end: 2026-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Contradicted early if reliable sources document thousands of home humanoids (Optimus, Figure or similar) delivered to consumer homes for regular use before 2026-12-31.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'very little product' has no numeric threshold."
  - Unclear whether non-named robots such as 1X NEO count; read as included through 'like'.
  - Unclear whether leased or teleoperated units count as product.
retrospective_or_prospective: prospective
