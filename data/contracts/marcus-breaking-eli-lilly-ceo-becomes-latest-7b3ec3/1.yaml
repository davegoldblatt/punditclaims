assessment_axis: historical_observation
explicit_source_elements:
  - we don’t have the data
  - Context ties the data claim to doing what Dario says on his timeline.
evaluator_interpretation:
  - The ordinary reading is that available biological data are inadequate to put the field in a position to deliver broad cures across the four named disease categories within a decade.
  - This is a claim about sufficiency for a particular goal, not a claim that biological datasets do not exist.
  - Use a snapshot at publication, 2026-11-12. There is no regular reporting quarter or other reporting cycle for field-wide biological data adequacy.
  - "Do not adopt the quoted '<1% of biology' as a defined metric: the denominator and measurement method are unspecified."
  - Existing data gaps must be linked to the asserted cure timeline; their existence alone does not establish the full claim.
support_condition: A contemporaneous assessment identifies indispensable missing biological data and establishes why those deficits leave the field unable to deliver the stated breadth of cures within the decade, accounting for feasible new data generation.
contradiction_condition: A contemporaneous validated assessment establishes that available biological data are sufficient to support a credible route to the full stated cure goal within the decade.
measurement_requirements: An inventory of relevant data coverage, validated requirements for the named disease categories, and an explicit connection between remaining deficits and the proposed development timeline.
source_requirements: Primary dataset assessments, validated biological-model evaluations, clinical-development evidence and transparent field-wide analyses.
