evaluator_interpretation:
  - The plain reading concerns comparable credit spreads, not a formal downgrade or an assertion that default is certain.
  - The operative comparison is SpaceX's average OAS against the named broad high-yield index near July 28.
  - July 1 through July 28 is the reporting window for the ongoing market observation. Earlier July data provide context but cannot establish that the comparison still held near publication.
  - No numerical tolerance for 'like junk' is supplied. Comparable readings should be close enough that the conclusion does not depend on an arbitrary cutoff.
support_condition: Contemporaneous, comparably calculated OAS data show that SpaceX's investment-grade bond basket traded near the named high-yield index, consistent with approximately 270 versus 282 basis points.
contradiction_condition: Matched data near publication show SpaceX spreads materially below the named high-yield benchmark, or show that the comparison results from incompatible spread measures or a nonrepresentative tranche.
measurement_requirements: Match dates, spread definitions, currency, basket weighting and maturity treatment. A BB-only comparison is not the named broad high-yield index.
source_requirements: Bond-pricing and index-provider records are preferred. Clearly dated independent reporting may substitute where the underlying data cannot be obtained.
