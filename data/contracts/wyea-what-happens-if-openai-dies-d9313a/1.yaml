assessment_axis: forecast_outcome
explicit_source_elements:
  - For OpenAI to actually survive
  - raise between $100 billion and $200 billion
  - basically every year until then
evaluator_interpretation:
  - The surrounding paragraph makes 2030 the endpoint, based on projected positive free cash flow. This is not a promise that profitability will occur then.
  - Read 'raise' as external financing received, including equity and borrowing, rather than revenue, valuation, or undrawn commitments.
  - Use calendar-year financing totals from 2026 through 2030. Whether the partial publication year counts is ambiguous.
  - The range describes the asserted financing requirement, not a prohibition on raising more than $200 billion.
  - "'Basically every year' allows some unspecified exceptions. One marginally lower year would not automatically refute it."
  - The condition is survival through the relevant financing period, not merely remaining operational on the evaluation date.
support_condition: OpenAI survives through the stated period, and comparable financing and cash-flow records establish annual financing needs broadly within $100–200 billion in essentially every relevant year. Raising those amounts alone establishes consistency, not necessity.
contradiction_condition: OpenAI survives through the period, or reaches sustained self-financing earlier, with materially less than $100 billion raised in enough completed years to defeat the ordinary meaning of 'basically every year'.
measurement_requirements: Annual financing proceeds, opening cash, cash uses, repayment obligations, noncash financing, and sustained operating status. Separate committed capital from money received and free cash flow from net income.
source_requirements: Company financing disclosures and financial statements, corroborated by investor disclosures or reliable reporting where primary records are unavailable.
metric_scope:
  company: OpenAI
  metric: Estimated annual external financing required for survival
  currency: USD
  units: billions per year
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: until then
horizon_interval:
  start: 2026-08-18
  end: 2030-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Earlier sustained self-financing could refute the requirement if complete records also show materially lower financing across enough completed relevant years. A funding announcement, interim survival, or insolvency alone would not establish the asserted necessity.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Unspecified exceptions in 'basically every year'.
  - Partial 2026 versus complete calendar years.
  - Financing commitments versus proceeds received.
  - Profitability versus positive free cash flow.
  - 2030 is a contextual endpoint.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
