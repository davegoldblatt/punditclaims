  - OpenAI's 'task' system that lets you schedule ChatGPT actions
  - scheduling needs to work reliably
  - And it won't
evaluator_interpretation:
  - The forecast is about ChatGPT Tasks as released in January 2025 and offered afterward.
  - "Plain reading: scheduled actions would sometimes fire at the wrong time, not fire, or get altered, so users could not count on them."
  - No deadline is stated. I treat it as open-horizon, settled early by documented hands-on failures of the shipped feature.
support_condition: Published hands-on tests or repeated user reports after launch show scheduled tasks not running, running at wrong times, or being altered.
contradiction_condition: Independent testing or broad reports show scheduled tasks running correctly and on time with rare failures.
measurement_requirements: Documented tests or user reports of task execution after the January 2025 launch.
source_requirements: Reputable hands-on reviews; first-hand user reports on OpenAI's own community forum as supporting detail.
