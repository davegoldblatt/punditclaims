  - their competitors didn’t have
  - didn’t acknowledge this
  - FrontierMath
evaluator_interpretation:
  - The claim concerns access and disclosure when the December 20, 2024 FrontierMath result was presented.
  - Privileged access means access to benchmark problems or solutions beyond the access available to competing developers.
  - The claim alleges undisclosed access, not that OpenAI trained on the answers or fabricated its score.
  - Later disclosure does not negate nondisclosure at the announcement.
support_condition: Primary records establish preferential access to FrontierMath data and that the access arrangement was not disclosed with the December announcement.
contradiction_condition: OpenAI lacked preferential access at that time, competitors had equivalent access, or the announcement clearly disclosed the arrangement.
measurement_requirements: Distinguish problem statements from solutions, developer access from evaluations conducted by Epoch, and disclosure of sponsorship from disclosure of data access.
source_requirements: Epoch's access agreements or public account of them, plus records of announcement-time disclosure.
