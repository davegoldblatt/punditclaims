explicit_source_elements:
  - If AI is described in terms of the unknown and being uncontrollable
  - the “risk” gets turned on its head
  - we must let these companies keep doing this
  - they’re the only ones who understand it
evaluator_interpretation:
  - Read as a claim that this framing shifts audiences or policy arguments toward allowing incumbent AI companies to continue development because of their perceived exclusive expertise.
  - A weaker response to existential-risk messaging is not equivalent to increased support for incumbent development.
  - The conditional wording states a causal mechanism, not a forecast with an activation condition or deadline.
support_condition: Comparative audience research or well-documented policy-process evidence shows that unknowability and uncontrollability framing causes greater support for continued incumbent development through perceived exclusive expertise.
contradiction_condition: Research testing that framing and outcome finds no shift, an opposite shift, or evidence inconsistent with the asserted expertise mechanism.
measurement_requirements: Measure support for continued incumbent development and perceived exclusive expertise under otherwise comparable framings. Separate changes in concern, mobilization and regulation preferences.
source_requirements: Primary framing experiments, audience studies or policy records that can connect the stated framing to the stated response.
