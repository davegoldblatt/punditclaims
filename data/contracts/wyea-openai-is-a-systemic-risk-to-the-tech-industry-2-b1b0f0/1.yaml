original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after both antecedent failures are documented and a subsequent failure or completed resolution decisively establishes the downstream outcome.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Failure is undefined.
  - No deadline or transmission interval is stated.
  - Crusoe’s survival is expressed probabilistically without a probability.
