assessment_axis: forecast_outcome
explicit_source_elements:
  - If OpenAI fails, and CoreWeave fails
  - so too does Core Scientific
  - I don’t fancy Crusoe’s chances, either
evaluator_interpretation:
  - Failure means bankruptcy, insolvency proceedings, or permanent cessation of business. Falling share prices or financial distress alone do not qualify.
  - Both OpenAI and CoreWeave must fail before the predicted consequences can be assessed.
  - The Crusoe clause expresses a weaker expectation than the categorical Core Scientific clause.
  - No deadline or interval between the companies’ failures is supplied.
support_condition: After documented failures of both OpenAI and CoreWeave, Core Scientific also fails. A subsequent Crusoe failure would support the additional, weaker expectation.
contradiction_condition: After both antecedent failures, a completed restructuring or other decisive resolution establishes that Core Scientific survives the resulting disruption. Temporary survival alone cannot settle an unlimited forecast.
measurement_requirements: Dated legal or operational records establishing each failure and the sequence of events. Distinguish bankruptcy from financial distress and ordinary acquisition.
source_requirements: Court records, regulatory filings, or authoritative company disclosures; reliable reporting where primary records are unavailable.
