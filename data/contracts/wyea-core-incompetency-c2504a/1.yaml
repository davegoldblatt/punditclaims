  - GPUs are depreciating assets
  - will eventually become problematic
  - these companies
evaluator_interpretation:
  - The surrounding discussion identifies GPU-backed compute sellers, particularly CoreWeave, Crusoe and Lambda.
  - A problem means a documented adverse financial consequence attributable to GPU depreciation, such as a collateral shortfall, accelerated repayment, material impairment or financing distress.
  - Ordinary depreciation expense, an existing amortization schedule or a warning about possible losses does not alone establish that the predicted problem occurred.
support_condition: A dated disclosure establishes a material adverse financing or asset-value consequence caused by GPU depreciation at an identified GPU-backed compute seller.
contradiction_condition: A decisive event permanently removes the relevant depreciation exposure without the predicted harm. Continued operation or successful borrowing for a limited period cannot disprove an eventual forecast.
measurement_requirements: Identify the affected GPUs or financing arrangement, the adverse consequence and evidence connecting that consequence to depreciation.
source_requirements: Prefer borrower or lender disclosures, financial statements and collateral assessments. General risk commentary is context only.
