evaluator_interpretation:
  - The literal claim is a report of his own belief, which cannot be checked. The checkable part is that the results are robust.
  - "Plain reading of 'robust': the reasoning-failure findings he cites, led by the Apple GSM-Symbolic/GSM-NoOp results, hold up when others re-test or re-analyse them."
  - "Target period: from the Apple paper's release (2024-10-07) to the evaluation date. Robustness can only be shown by replications after the post, so the period covers the scrutiny window; this choice is flagged."
  - The test is replication of the findings on comparable setups, not whether newer models later improved. Later model improvement alone does not make the original findings fragile.
support_condition: Independent studies reproduce the main effects, such as sensitivity to irrelevant context and drops on altered problems, with sound statistics.
contradiction_condition: Independent re-analyses or replications find the main effects largely vanish under proper statistics or cleaner test data, even for the original models.
measurement_requirements: Outcomes of independent replications and re-analyses of the cited reasoning-failure studies, mainly GSM-Symbolic and GSM-NoOp.
source_requirements: Peer-reviewed papers, preprints, or documented independent replications with released code or data.
