evaluator_interpretation:
  - The relevant day is February 27, 2026, using US local dates.
  - Public support means Altman's public endorsement of Anthropic's safety position, rather than his earlier private staff message.
  - Signed a deal means concluded an agreement; an announcement alone does not establish the precise execution time.
  - Similar terms means substantively comparable restrictions on domestic surveillance and autonomous weapons, not merely similar public statements.
  - Taking away business means securing the Pentagon role from which Anthropic was being excluded. It does not require proving a malicious motive.
support_condition: Evidence establishes public support and a concluded agreement on February 27, substantively comparable safeguards, and replacement of Anthropic's Pentagon business.
contradiction_condition: Evidence establishes different dates, materially different safeguards, or that the agreement did not replace the relevant Anthropic business.
measurement_requirements: Compare the original agreement and Anthropic's final proposed terms, distinguishing contractual restrictions, technical safeguards, and subsequent amendments.
source_requirements: Contemporaneous statements and agreement records, supplemented by reliable reporting on negotiations and procurement.
