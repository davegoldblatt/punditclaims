  - The investment figure is a hedged estimate ('what must be close to'). I treat it as framing, and it is contradicted only if credible estimates put the investment far below that order of magnitude.
  - "Period: 2025 up to the post date."
support_condition: Evidence from early-to-mid 2025 that leading agents were unreliable for personal or financial tasks, or were barred from them, plus investment estimates in the hundreds of billions or more.
contradiction_condition: Evidence that leading agents in this period reliably handled calendars or bank accounts, or that the investment was far below the stated order of magnitude.
