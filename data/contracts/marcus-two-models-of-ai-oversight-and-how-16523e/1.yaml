  - "The conjunction requires a connected example: a damaging false statement that Bing supported with an article whose actual meaning opposed it."
  - The generic plurals do not specify a minimum number of victims or articles; one verified connected incident establishes the asserted failure mode.
  - The historical period is the Bing Chat preview's existence through the post, February 7 to June 8, 2023.
support_condition: A documented Bing response makes a false, reputation-damaging statement about a real person and cites an article that actually rejects or corrects that statement.
contradiction_condition: The purported incident is shown to concern a different system, an altered output, a true allegation, or an article that actually supports Bing's statement.
measurement_requirements: Compare the reported Bing assertion and cited source. Do not substitute a ChatGPT-only incident or infer legally proven damages.
source_requirements: Prefer original outputs or contemporaneous firsthand reporting, together with the article that Bing allegedly misrepresented.
