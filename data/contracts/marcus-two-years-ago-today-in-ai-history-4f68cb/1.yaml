evaluator_interpretation:
  - The comparison runs from the May 16, 2023 hearing to publication on May 16, 2025.
  - The surrounding discussion makes US federal regulation and international governance involving the US the principal scope.
  - The ordinary reading is that only a small minority of the substantive regulatory proposals had been implemented. It does not mean literally no action.
  - Implementation requires an operating measure. Introducing legislation or announcing intentions does not suffice. Voluntary cooperation is distinguished from mandatory regulation.
support_condition: A proposal-by-proposal comparison shows that nearly all substantive regulatory proposals remained unimplemented by May 16, 2025.
contradiction_condition: The comparison shows substantial implementation across the hearing's substantive regulatory proposals, rather than isolated measures.
measurement_requirements: Identify distinct proposals, avoid counting repeated mentions separately, and establish each proposal's implementation status. Test whether reasonable grouping choices change the conclusion.
source_requirements: Use the hearing record and implementation records. Later publications may establish earlier facts, but later policy changes cannot settle this observation.
