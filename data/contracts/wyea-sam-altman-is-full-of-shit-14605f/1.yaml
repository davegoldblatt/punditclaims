explicit_source_elements:
  - Mira Murati, OpenAI's CTO
  - lied to Kylie Robison of The Verge
  - when she said that "Sky" wasn't meant to sound like Scarlett Johansson
evaluator_interpretation:
  - The claim is true if Sky was in fact meant to sound like Johansson and Murati knew this when she denied it. It is false if Sky was not designed to imitate Johansson, or if Murati honestly believed it was not.
  - The period runs from Sky's casting and design (from early 2023) to Murati's May 2024 statement.
support_condition: Evidence such as casting briefs, direction notes, internal messages or testimony showing Sky was meant to sound like Johansson, and that Murati knew it.
contradiction_condition: Strong independent records showing Sky was cast and produced without reference to Johansson, with no evidence that Murati knew of any such aim.
