assessment_axis: historical_observation
explicit_source_elements:
  - Sam Altman
  - stood next to me in the Senate
  - strongly favored AI regulation
  - behind the scenes his team fought to water down the EU AI Act
evaluator_interpretation:
  - Standing next to Marcus means appearing alongside him at the same Senate hearing, not a claim about their physical posture.
  - Strongly favored regulation means an affirmative endorsement of government rules or oversight.
  - Water down means seeking narrower coverage or fewer obligations in the proposed EU law. It does not imply opposition to every form of regulation.
  - The historical comparison encompasses OpenAI's 2022 EU engagement and the May 16, 2023 hearing; it does not require the lobbying to have followed the hearing.
support_condition: The hearing record establishes Altman's endorsement alongside Marcus, and documentary evidence establishes OpenAI personnel privately advocating reduced obligations under the EU proposal.
contradiction_condition: The hearing record contradicts the endorsement or joint appearance, or reliable records establish that the alleged lobbying instead sought equivalent or stronger obligations without the claimed narrowing.
measurement_requirements: Assess the two factual components separately. Do not infer dishonesty or causal responsibility for the final law from their coexistence.
source_requirements: Official hearing records and OpenAI's submissions or reporting based on identifiable lobbying documents.
