explicit_source_elements:
  - existing profit-sharing deals with Microsoft
  - deep, deep unprofitability
  - any such returns are, at the best, theoretical
evaluator_interpretation:
  - In context, 'such returns' means distributions from OpenAI's profits, rather than proceeds from selling an investment to another investor.
  - Read 'theoretical' as contingent and not yet realized, rather than a prediction that investors can never make money.
  - Use September 2024 through the post date for the current contractual and distribution status being described. This is an as-of observation, not a full-year profitability claim.
support_condition: Reliable records establish that the relevant profit-participation returns remained contingent and unpaid as of the post, with no distributable profits supporting them.
contradiction_condition: Reliable records establish realized profit distributions to the investors discussed before the post, rather than resale proceeds, valuation gains or commercial revenue-sharing payments.
measurement_requirements: Distinguish investor profit distributions from secondary sales, revenue-sharing payments and accounting valuation gains.
source_requirements: Prefer the operative investment agreements and distribution records. Reporting must specifically address realized profit returns, not merely investment risk.
