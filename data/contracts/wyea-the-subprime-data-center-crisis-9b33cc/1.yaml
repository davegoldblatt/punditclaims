assessment_axis: forecast_outcome
explicit_source_elements:
  - just as expensive to run these things
  - in 2030
  - as it is today
  - no post-bubble economy to replace this one
evaluator_interpretation:
  - Today means July 22, 2026. The comparison concerns comparable AI data centers operating in 2030.
  - The plain reading is that operating comparable capacity will remain roughly as costly in nominal money, leaving no economically viable successor use after the predicted bubble.
  - Compare operating costs at similar utilization, location and service requirements. Construction costs, GPU purchase prices and electricity consumption alone do not measure total operating costs.
  - The statement predicts a collapse and its consequences; it does not expressly make the cost forecast conditional on a collapse.
support_condition: Comparable operating records show that 2030 running costs remain approximately at July 2026 levels, and post-collapse operating results establish the claimed absence of a viable successor business.
contradiction_condition: Representative comparable facilities operate materially more cheaply in 2030, or sustained profitable successor uses establish that the predicted economic conclusion failed.
measurement_requirements: Comparable facility operating expenses, capacity, utilization, energy prices, maintenance and staffing; successor-use revenues and operating expenses. Report nominal and inflation-adjusted comparisons separately.
source_requirements: Operator disclosures or independently documented operating records. Forecasts and vendor efficiency claims are context, not realized 2030 outcomes.
metric_scope: null
original_horizon: in 2030
horizon_interval:
  start: 2026-07-22
  end: 2030-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Only an already-realized, sustained post-collapse successor business could settle the categorical economic component early. Efficiency improvements, announced tariffs and projected 2030 expenses cannot settle the future cost comparison.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No cost denominator or tolerance for 'just as expensive' is specified.
  - Nominal versus inflation-adjusted costs is unspecified.
  - The facilities, utilization assumptions and geographic scope are unspecified.
  - "'Post-bubble economy' has no defined profitability threshold or observation period."
retrospective_or_prospective: prospective
