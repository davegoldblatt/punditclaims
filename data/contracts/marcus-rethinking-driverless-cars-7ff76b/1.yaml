assessment_axis: forecast_outcome
explicit_source_elements:
  - Uber and Lyft
  - stop worrying about being disintermediated by machines
  - will still need human drivers
  - for quite some time
evaluator_interpretation:
  - The checkable forecast is continued operational dependence on human drivers at both companies, not a claim about executives' emotions.
  - Limited autonomous services do not by themselves eliminate either company's need for human drivers.
  - Displacement of human drivers and displacement of the ride-hailing platforms are different outcomes.
  - "'Quite some time' supplies no calendar deadline; no fixed number of years is imposed."
support_condition: Both companies remain materially dependent on human drivers throughout the intended substantial period, once that period can be identified.
contradiction_condition: Dated operational evidence establishes that autonomous services promptly eliminated a named company's need for human drivers or displaced its platform, rather than merely adding limited autonomous rides.
measurement_requirements: Company-wide operational coverage and human-driven versus autonomous ride volumes, with onboard safety drivers distinguished from driverless operation.
source_requirements: Dated company disclosures, regulatory records or reliable independent operational measurements available by the evaluation date.
metric_scope: null
original_horizon: for quite some time
horizon_interval:
  start: 2023-11-05
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented company-wide transition eliminating human-driver dependence, or completed machine-driven displacement of a named platform, could settle the relevant factual component. A launch, partnership or market-share loss alone cannot. Timing must also be unambiguously inconsistent with continued dependence for 'quite some time'; otherwise the forecast remains open.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Quite some time' has no deadline."
  - No minimum human-driver share or geographical scope is specified.
  - Disintermediation of platforms is different from automation of driving.
  - "'Stop worrying' is rhetorical advice rather than a measurable outcome."
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
