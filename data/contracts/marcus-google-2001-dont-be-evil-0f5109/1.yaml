assessment_axis: forecast_outcome
explicit_source_elements:
  - Powerful AI
  - sooner or later
  - will wind up in bad hands
evaluator_interpretation:
  - Powerful AI means advanced general-purpose systems capable of substantial coding, reasoning, or operational assistance; it does not require superintelligence.
  - Bad hands means actors engaged in documented criminal or abusive conduct, rather than actors classified as bad solely by nationality or affiliation.
  - Usable access to a hosted system counts as having AI in one's hands; ownership of model weights is unnecessary.
  - A documented instance after publication can settle this existential forecast.
support_condition: A documented post-publication case establishes that malicious actors obtained usable access to powerful AI and used it in criminal or abusive activity.
contradiction_condition: A finite period without documented misuse cannot contradict this forecast, which has no deadline.
measurement_requirements: Identify the system, its relevant capabilities, the actors' conduct, and the date of actual use.
source_requirements: A detailed incident investigation or comparable primary record; distinguish observed misuse from hypothetical demonstrations.
metric_scope: null
original_horizon: sooner or later
horizon_interval:
  start: 2025-02-05
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported upon a documented post-publication instance of malicious actors actually using an advanced AI system for criminal or abusive operations.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Powerful has no specified capability threshold.
  - Bad hands is evaluative.
  - Hands could mean usable access or ownership; this assessment uses usable access.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
