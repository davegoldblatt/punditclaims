assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI had $5.7 billion
  - Anthropic a little under $5 billion
  - in the first quarter of this year
  - those revenues mostly came from companies
  - forced to pay the actual cost of AI
  - now everybody’s pulling back on that spend
evaluator_interpretation:
  - The revenue figures describe realized revenue during January–March 2026, separately for each company.
  - Mostly means more than half. The wording leaves unclear whether this applies to each company or their combined revenue.
  - I read everybody as a broad customer spending retreat, rather than requiring literally every customer to reduce spending.
  - For now, I use June 2026, the latest complete month before the post. The target interval therefore covers the Q1 revenue assertion and the subsequent spending assertion; it does not permit substituting June revenue for Q1 revenue.
  - Actual cost could mean metered API prices or the provider’s underlying production costs. These are different measures.
  - The supplied passage does not identify an accounting basis or explicitly attribute these figures to company disclosures or press estimates.
support_condition: Comparable records establish both Q1 revenue figures, a majority contribution from the described business token spending, the asserted pricing cause, and a broad subsequent decline in that spending by June 2026.
contradiction_condition: Comparable records materially contradict either revenue figure, the majority attribution, the asserted pricing cause, or the broad spending retreat. Isolated customers cutting costs do not establish the broad retreat.
measurement_requirements: Separate quarterly revenue records for both companies; customer and product revenue breakdowns; dated pricing changes; matched customer spending before and after those changes. Distinguish API list prices from production costs and total spending from adoption counts.
source_requirements: Prefer financial disclosures and transaction records. Press accounts of private financial documents require explicit attribution and cannot establish an unstated accounting basis.
