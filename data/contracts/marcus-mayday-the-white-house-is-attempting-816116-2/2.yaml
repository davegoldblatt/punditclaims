explicit_source_elements:
  - federal AI standards in lieu of state standards
  - there are (sensible) federal standards
  - Congress has not put anything serious forward to a vote
evaluator_interpretation:
  - The plain contextual reading concerns substantive federal AI safeguards that could provide a national alternative to state AI regulation.
  - A qualifying proposal would impose meaningful, cross-cutting obligations on AI developers or deployers. A framework covering high-impact systems or frontier models could qualify; it need not address every AI harm or expressly preempt state law.
  - A targeted intimate-imagery law, research funding, government procurement rules, or voluntary technical guidance alone would not satisfy that scope.
  - I interpret 'to a vote' as a vote before either full chamber, including a vote on qualifying provisions within a larger bill. Passage or enactment is not required. Marcus did not expressly exclude committee votes.
  - The period is cumulative through November 19, 2025. Its start is unspecified because 'has not' supplies no starting date. Legislative proceedings were publicly reportable immediately, so a quarterly reporting period would be inappropriate.
  - I treat 'serious' as substantive regulatory obligations, without judging whether Marcus would personally approve of them.
support_condition: A sufficiently complete review of legislative texts and chamber proceedings establishes that no qualifying federal AI safeguards were brought to a floor vote by November 19, 2025.
contradiction_condition: An official record identifies at least one floor vote by November 19, 2025 on qualifying federal AI safeguards, whether those provisions passed or failed.
measurement_requirements: Check the substance of each plausible framework and its procedural history. Distinguish introduction, committee approval, calendar placement, floor voting, and enactment. Include amendments and provisions in larger bills.
source_requirements: Prefer Congress.gov action histories, congressional journals and records, and official bill texts. Legislative reviews can identify candidates but absence of enactment alone cannot establish absence of a vote.
