  - a lot of demand to put AI in stuff
  - some demand to buy stuff with AI on it by enterprises buying software
  - little evidence to suggest significant user adoption or usage
  - I'd argue because Large Language Models do not lend themselves to features that provide meaningful business returns
evaluator_interpretation:
  - "The descriptive core is the checkable part: as of the post, there was little evidence of significant actual use of AI features by users, as opposed to purchases by enterprises."
  - The explanation is offered as the speaker's argument ('I'd argue'), as one reason, not proven cause. It is not graded as a factual claim beyond noting whether evidence bears on it.
  - No claim is read in that purchases greatly exceed use; only that evidence of significant use was thin.
  - "Target period: July 2024 to February 2025, the most recent public adoption surveys before the post. The claim names no period."
support_condition: Credible measurements from the period showing low actual use of generative AI by workers or firms, for example low firm-level use rates or low worker usage.
contradiction_condition: Credible measurements from the period showing significant use of generative AI by workers or firms, available before the post.
measurement_requirements: Survey or telemetry measures of generative AI use by workers and firms, July 2024 to February 2025.
source_requirements: Official statistics (for example the Census Business Trends and Outlook Survey), peer-reviewed or working-paper surveys, or company usage disclosures.
