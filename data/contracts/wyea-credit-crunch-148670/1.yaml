assessment_axis: historical_observation
explicit_source_elements:
  - Hyperscalers have no other hypergrowth ideas left
  - to sell investors
  - the most asset-burdened companies on the Fortune 500
  - rivaling ExxonMobil, Berkshire Hathaway and Chevron
  - GPUs that only retain value during a hype cycle
evaluator_interpretation:
  - Hyperscalers is read as Alphabet, Amazon, Microsoft and Meta, based on the surrounding examples. Including Oracle is a plausible alternative.
  - The ordinary reading is that AI investment has made these businesses exceptionally burdened by capital tied up in assets, with no credible new growth engine comparable to the businesses named.
  - Asset burden could mean absolute assets, fixed assets, or fixed assets relative to business size. Total assets alone do not measure the burden of operating infrastructure.
  - For the ongoing balance-sheet observation, the target is April through June 2026, the latest completed quarter with public reports before the October 6 post.
  - GPU age, depreciation or continued value during an AI boom does not establish value outside a hype cycle.
  - No numerical definition of hypergrowth or end of the hype cycle is added.
support_condition: Comparable balance sheets establish exceptionally high asset burdens relative to the named firms and the Fortune 500 under a defensible common measure; investor disclosures support the absence of credible alternative major growth engines; and market evidence establishes that GPU value depends on the hype cycle.
contradiction_condition: Comparable evidence shows the claimed asset ranking materially fails, credible alternative major growth engines are being presented to investors, or GPUs retain economically meaningful value in a clearly identified period outside the hype cycle. Any finding must identify which clause it settles.
measurement_requirements: Comparable total assets and net PP&E, with consistent treatment of leases and business size; Fortune 500 comparison data; contemporary investor presentations; and realized GPU resale or operating-value evidence across a defined market-cycle change.
source_requirements: Company filings and investor disclosures for the quarter ended June 30, 2026; a consistent Fortune 500 comparison; and dated independent GPU transaction evidence.
