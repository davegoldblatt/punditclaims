assessment_axis: historical_observation
explicit_source_elements:
  - In recent years
  - financial stakes of benchmark performance have increased
  - trained more often directly on benchmarks
  - synthetic data closely resembling them
evaluator_interpretation:
  - Recent years means the several years preceding publication, operationalized as 2020 through February 17, 2026.
  - More often means an increase in the prevalence of this training practice. Individual examples establish occurrence but do not establish an increase.
  - Training exposure can be deliberate or accidental; the claim does not require proof that every developer intentionally cheated.
  - The financial-stakes phrase describes accompanying circumstances. It does not, by itself, establish financial incentives as the cause.
support_condition: Comparable evidence across time shows that systems increasingly trained on benchmark examples or closely resembling synthetic examples, alongside evidence of increasing commercial stakes.
contradiction_condition: Comparable evidence across time shows that such training did not become more common, or that its prevalence declined.
measurement_requirements: Distinguish benchmark material appearing on the internet from its inclusion in actual training datasets. Compare model cohorts or documented training practices using consistent detection methods.
source_requirements: Training disclosures and primary contamination studies with dated datasets and methods. Commercial stakes require separate evidence.
