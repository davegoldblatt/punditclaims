explicit_source_elements:
  - raised a little under $300 billion combined since 2019
  - I estimate their true cost is at least $500 billion
  - hyperscaler capex investments that were necessary for them to exist
  - before you consider the $340 billion or more
  - 7.1GW
evaluator_interpretation:
  - Assess cumulative funding and attributable costs from 2019 through publication on June 30, 2026.
  - Read raised as completed financing, while distinguishing received funds from committed future installments.
  - Read true cost as funding plus additional infrastructure investment attributable to the two labs, excluding Oracle's named Stargate buildout.
  - Avoid counting the same financial transfer both as lab funding and as additional infrastructure cost.
  - Little under has no supplied tolerance; no arbitrary numerical band is imposed.
  - The Oracle amount is an asserted excluded component, not evidence that the included costs exceed $500 billion.
support_condition: A reconciled funding record places combined financing just below $300 billion, and a documented allocation of additional infrastructure costs establishes at least $500 billion without duplication or the excluded Oracle buildout.
contradiction_condition: Comparable complete records establish financing incompatible with the stated amount or a reliable upper bound below $500 billion for the included costs. An incomplete lower total is insufficient.
measurement_requirements: Separate financing commitments, funds received, operating expenses, capital investment, and future construction plans. Allocate shared infrastructure and reconcile overlapping investment and spending flows.
source_requirements: Financing records, company filings, infrastructure ledgers, and primary trial records where available. News accounts may provide context but cannot substitute for a complete allocation.
