assessment_axis: forecast_outcome
explicit_source_elements:
  - expect some sort of fundraising
  - likely heavily-funded by asset managers
  - the potential for NVIDIA to break its pledge and invest again
evaluator_interpretation:
  - The firm expectation is a subsequent OpenAI capital raise, established by a formal announcement of committed new financing or a completed financing.
  - Preliminary discussions alone do not establish that financing was secured.
  - Payments fulfilling financing commitments announced before the post do not establish a subsequent round.
  - Asset-manager participation is qualified by ‘likely’; NVIDIA participation is only a possibility. Neither is an antecedent required to score the core fundraising forecast.
  - No amount, valuation, accounting basis, or deadline is specified.
support_condition: OpenAI or its investors formally announce committed new financing, or reliable records establish completion of a new capital raise, after August 18, 2026.
contradiction_condition: A definitive terminal event establishes that OpenAI can no longer raise capital and did not undertake the predicted subsequent financing. A delayed or abandoned individual round is insufficient.
measurement_requirements: Distinguish new capital for OpenAI from secondary share sales, preliminary talks, and installments of previously committed financing. Record investor composition separately.
source_requirements: Prefer OpenAI or investor announcements and filings. Reliable reporting may establish negotiations, but negotiations alone are context.
