ambiguity_flags:
  - ‘Fundraising’ could include soliciting investors, rather than securing financing.
  - ‘Heavily-funded’ has no stated share or threshold.
  - NVIDIA participation is described as possible, not promised.
  - No deadline or monetary accounting basis is specified.
