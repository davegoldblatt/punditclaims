assessment_axis: forecast_outcome
explicit_source_elements:
  - 2026 or 2027’s great financial crisis
  - will replace “homes” with “data centers”
  - I worry it’ll be calamitous for the pensions and insurance funds
evaluator_interpretation:
  - The firm prediction is a systemic financial crisis centered on data-center financing, with data-center debt playing a central role comparable to housing debt in the earlier crisis.
  - An isolated default, falling share prices, tighter credit or warnings about future losses do not meet that description.
  - The pension and insurance consequences are expressed as a worry, not a separate unconditional prediction.
  - The latest stated deadline is December 31, 2027.
support_condition: A systemic financial crisis occurs within the forecast interval and authoritative evidence identifies data-center debt as a central cause or transmission mechanism.
contradiction_condition: The interval ends without such a crisis, or the identified crisis is demonstrably centered on unrelated causes without a central data-center-debt role.
measurement_requirements: Evidence of broad financial-system disruption and a documented connection to data-center debt, rather than sector losses alone.
source_requirements: Central-bank, regulator or IMF assessments, supplemented by dated records of defaults, institutional failures and credit-market disruption.
metric_scope: null
original_horizon: 2026 or 2027
horizon_interval:
  start: 2026-03-17
  end: 2027-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve supported before the deadline only after a dated systemic crisis has occurred and authoritative evidence establishes the central role of data-center debt. Warnings and isolated failures do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
