evaluator_interpretation:
  - The plain reading concerns dependable completion of English programming requests, not whether LLMs have any programming ability or usefulness.
  - Support requires substantial correctness or completion failures on clearly specified programming tasks. An occasional error alone would not establish the claim.
  - "Because no reporting period is specified, assess early 2024: the latest completed calendar month and the elapsed portion of February before publication."
support_condition: Contemporaneous evaluations show substantial failures to produce complete, correct programs from clear natural-language specifications, with testing or repair still necessary.
contradiction_condition: Broad evaluations of contemporaneous systems show dependable completion of varied programming requests without substantial correction, making the stated reliability concern unrepresentative.
measurement_requirements: Identify the model, task distribution, prompting procedure, correctness tests, and number of attempts. Do not equate competitive-programming scores with success rates for all everyday programming.
source_requirements: Primary evaluations or independently documented tests of models available by the post date.
