evaluator_interpretation:
  - They refers to coding LLM tools in the preceding sentence.
  - The plain reading is a general claim about engineers' work, not an explicitly limited claim about one study population.
  - Speed means elapsed working time to complete comparable engineering tasks, including interaction with the tool and correction of its output.
  - Assess causal evidence available for tools and work conducted before the post. No particular trial or reporting period is named.
  - Opposite effects in credible controlled settings warrant a mixed verdict, while rejecting an unconditional generalization.
support_condition: Randomized or comparably credible studies show that access to coding LLMs increases time to complete comparable tasks.
contradiction_condition: Randomized or comparably credible studies show that access to coding LLMs decreases time to complete comparable tasks.
measurement_requirements: Measure actual task-completion time with and without AI under comparable acceptance criteria. Self-reported speed and task throughput are not interchangeable with completion time.
source_requirements: Prefer controlled primary studies. Identify populations, task types, tools and study dates before generalizing.
