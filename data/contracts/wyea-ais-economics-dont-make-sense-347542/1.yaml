explicit_source_elements:
  - If we assume
  - 15.2GW of data center capacity under construction (due by the end of 2028)
  - PUE of around 1.35
  - roughly 11.2GW of critical IT
  - At $14 million per megawatt
  - around $156.8 billion in annual revenue in GPU rental revenue required to actually make these data centers worth it
evaluator_interpretation:
  - The claim is a calculation built on assumptions he states openly (15.2GW, PUE 1.35, $14M per MW). The arithmetic can be checked. 'Required to make these data centers worth it' is a modelling judgment with no stated basis.
  - Earlier in the post, the $14M per MW figure is a construction cost per MW of data-center capacity. Here it is used as an annual revenue requirement per MW. Nothing in the post explains that step, so the 'required' figure cannot be tested as a fact.
  - If the claim were testable, it would describe the build-out as of the post date, April 2026.
support_condition: A test would need reliable sources confirming the 15.2GW figure and an accepted basis showing that $14M per MW of critical IT per year is the revenue needed to justify these builds, plus correct arithmetic.
contradiction_condition: Arithmetic that does not produce about $156.8B from his inputs, or authoritative evidence that the inputs he presents as fact are wrong.
measurement_requirements: The capacity under construction by end of 2028, the PUE assumption, and the basis for revenue required per MW of critical IT.
source_requirements: Industry trackers (for example BNEF, Sightline, SemiAnalysis) for capacity under construction. The TD Cowen note for the $14M per MW figure.
