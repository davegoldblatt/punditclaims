assessment_axis: causal_assessment
explicit_source_elements:
  - funded by limited partners
  - historic liquidity crisis
  - they can’t raise money and their investments aren’t selling
  - which means
  - cannot sustain the AI industry forever
evaluator_interpretation:
  - The ordinary reading is severe fundraising and exit constraints, rather than literally zero fundraising or sales.
  - The causal assertion is that these constraints prevent venture capital from continuing to finance the AI industry's needs.
  - Use 2025, the latest completed annual reporting period before publication, to assess the historical fundraising and exit premise.
  - US venture data is informative but does not automatically represent global venture capital.
  - The word forever supplies no deadline. Because the submitted claim is causal, assess the financing mechanism rather than inventing a forecast end date.
support_condition: Historical fundraising and exit evidence establishes severe liquidity constraints, and financing evidence shows that those constraints create a binding inability to meet continuing AI funding needs.
contradiction_condition: Comparable historical and financing evidence shows that the alleged liquidity constraint is absent or does not bind the venture industry's capacity to support AI. A strong funding year alone does not establish indefinite capacity.
measurement_requirements: Separate fundraising into VC funds, investments into VC-backed companies, exits, and cash distributions to limited partners. Distinguish traditional VC capital from corporate and other investors, and compare available funding with AI funding needs.
source_requirements: Consistent historical venture datasets, limited-partner distribution evidence, and records or analysis linking liquidity constraints to AI financing decisions.
