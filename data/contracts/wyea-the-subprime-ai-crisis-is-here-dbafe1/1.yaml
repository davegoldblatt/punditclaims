explicit_source_elements:
  - The entire generative AI industry
  - unprofitable, unsustainable economics
  - funded by venture capitalists and bankers
  - speculating on the theoretical value
evaluator_interpretation:
  - The ordinary reading is that generative AI businesses depend on outside financing because their services cannot durably cover their full costs.
  - I use calendar 2025, the latest completed annual financial period before publication, consistent with the surrounding discussion of 2025 results.
  - Current losses, dependence on financing, and lasting economic unsustainability are distinct propositions. Evidence of the first two does not establish the third.
  - The industry-wide assertion requires evidence beyond selected loss-making companies. The words do not specify an accounting basis.
support_condition: Representative financial and operating records establish industry-wide losses, dependence on speculative outside financing, and an inability to sustain operations through customer receipts.
contradiction_condition: Comparable records establish durable, independently financed profitability in a material part of the industry; a verified sustainable counterexample would also challenge the literal assertion about the entire industry.
measurement_requirements: Separate net losses, operating losses, cash consumption, gross margins, financing proceeds, and realized revenue. Assess sustainability using full costs and financing dependence, not losses alone.
source_requirements: Company financial statements and funding disclosures, supplemented by representative industry data. Individual companies are context for the industry-wide proposition.
