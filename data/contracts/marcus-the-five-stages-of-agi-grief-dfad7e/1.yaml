assessment_axis: historical_observation
explicit_source_elements:
  - frontier models
  - write a biography of X individual without making stuff up
  - remains pretty unreliable
  - play grandmaster level chess without making up illegal moves
evaluator_interpretation:
  - The ordinary reading concerns repeated performance by contemporary general-purpose language models, rather than a specially trained chess engine or an isolated successful response.
  - "Both examples matter: factual biography generation and sustained grandmaster-level chess with legal moves."
  - For the ongoing state, I use December 2024, the latest complete month before publication. Marcus supplied no reporting period.
  - A nontrivial recurring failure rate would establish unreliability; a single error would not establish its prevalence. No numerical reliability threshold is imposed.
support_condition: Representative evaluations of models current in the target period show recurring invented biographical facts and failure to sustain grandmaster-level legal chess.
contradiction_condition: Representative evaluations establish reliable factual biographies and sustained grandmaster-level chess without recurring illegal moves for contemporary frontier models.
measurement_requirements: Identify model versions, evaluation dates, prompts, access to retrieval or chess tools, sample sizes, factual-error rates, illegal-move rates, and playing-strength calibration. Distinguish short factual questions from complete biographies and chess puzzles from complete games.
source_requirements: Prefer reproducible primary evaluations. Older models and later successor models provide context only unless the source establishes performance during the target period.
