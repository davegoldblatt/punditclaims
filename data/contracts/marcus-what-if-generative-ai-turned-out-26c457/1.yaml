assessment_axis: forecast_outcome
explicit_source_elements:
  - I seriously doubt it.
  - AGI is imminent
  - AGI in 2-3 years
  - as smart and resourceful as humans if not more so
evaluator_interpretation:
  - Read the doubt as a directional forecast against human-level AGI arriving within the preceding two-to-three-year window.
  - Anchor the window to the post because the date of the referenced prediction is not supplied. The latest anniversary deadline is August 13, 2026.
  - Human-level AGI requires broad, adaptable competence. A product label, executive declaration, or single benchmark result does not establish it.
  - This evaluates the predicted event, not the calibration of an unstated probability.
support_condition: Evidence covering the deadline establishes that available leading systems still lacked human-level general competence under a defensible, broad assessment.
contradiction_condition: A system demonstrably attained human-level general competence on or before August 13, 2026, with independent evidence covering breadth, adaptation, and practical resourcefulness.
measurement_requirements: Use broad evaluations with human comparisons and documented system dates. Distinguish narrow benchmark success from general competence.
source_requirements: Prefer independent evaluations and reproducible demonstrations. Later publications may establish earlier capabilities only when those capabilities are explicitly dated.
metric_scope: null
original_horizon: in 2-3 years
horizon_interval:
  start: 2023-08-13
  end: 2026-08-13
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An independently substantiated demonstration of human-level general intelligence by a dated system before the deadline would settle the predicted event against the forecast. Failure on selected earlier tests would not settle it early in Marcus's favor.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The forecast is expressed as doubt, without a probability.
  - The antecedent includes both a two-to-three-year prediction and unspecified near-term predictions.
  - The post date is used as the interval anchor.
  - Human-level general intelligence has no supplied operational test.
retrospective_or_prospective: retrospective
