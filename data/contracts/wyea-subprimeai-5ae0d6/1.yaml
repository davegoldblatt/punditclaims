ambiguity_flags:
  - "'Significant' has no numerical threshold or stated comparison period."
  - "'Face the wheel' specifies neither a price decline nor a measurement window."
  - "'Next quarter' could mean the next earnings cycle or results for the next calendar quarter; the supplied context and screens favor the next earnings cycle."
  - The wording leaves unclear whether qualitative growth disclosures demonstrate sufficient revenue growth.
  - The condition could be collective or company-specific; this assessment uses the company-specific reading.
  - The investment total has no stated accounting basis or accumulation period and is not separately adjudicated here.
