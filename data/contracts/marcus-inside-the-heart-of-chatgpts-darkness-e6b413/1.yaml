evaluator_interpretation:
  - Read this as an explanation of the contemporary system's behavior, not a forecast with an indefinite future deadline.
  - Matching words is read generously as learned associations with training material, not necessarily literal retrieval from stored documents.
  - The full claim includes both political shifts caused by prompting and the asserted explanation for those shifts.
  - Use February 1–11, 2023, for the ongoing behavior discussed in the surrounding current examples.
support_condition: Controlled experiments on the contemporaneous ChatGPT show prompt-dependent left, right, and intermediate political responses, with evidence connecting those changes to the asserted training-based mechanism.
contradiction_condition: Controlled evidence establishes that a material part of the asserted causal explanation is false. A stable default political leaning alone does not refute a claim that different outputs sometimes occur.
measurement_requirements: Comparable political questions, an explicit stance classification, repeated trials, controlled prompt changes, and separation of wording effects from sampling variability and deliberate role-play.
source_requirements: Original experiments and training documentation. Examples of partisan text alone cannot establish the causal mechanism.
