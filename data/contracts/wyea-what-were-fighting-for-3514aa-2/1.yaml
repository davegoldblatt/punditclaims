assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT
  - burns billions of dollars a year
evaluator_interpretation:
  - Only the normalized financial proposition is assessed. The adjacent statements about usefulness and a killer app are outside this claim.
  - The plain financial reading of 'burns' is net cash consumption attributable to ChatGPT, rather than gross spending or financing raised.
  - "'Billions' is operationalized as at least USD 2 billion over a year."
  - Calendar 2024 is the most recent completed annual period before the post and is used because the claim describes an ongoing annual amount without naming a year.
  - ChatGPT is treated as the product named in the claim. Applying all OpenAI losses to it would require an additional attribution assumption.
  - The supplied wording cites no financial source or accounting basis. The contract therefore records the basis as unknown.
support_condition: Evidence establishes at least USD 2 billion of net cash consumption attributable to ChatGPT during calendar 2024, with a disclosed and compatible measurement basis.
contradiction_condition: Comparable evidence establishes that ChatGPT's net cash consumption during calendar 2024 was below USD 2 billion, including a cash surplus.
measurement_requirements: Product-level annual cash receipts and cash expenditures, including a defensible allocation of shared costs. Distinguish net cash burn from accounting losses, gross expenses and annualized revenue.
source_requirements: Prefer company financial disclosures. Credible reporting based on financial records may qualify if it identifies the period, cash measure and ChatGPT allocation. Company-wide projections alone cannot settle the claim.
