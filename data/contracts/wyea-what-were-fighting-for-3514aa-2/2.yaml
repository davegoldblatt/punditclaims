assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT
  - burns billions of dollars a year
evaluator_interpretation:
  - Read ChatGPT as shorthand for OpenAI's ChatGPT-driven business.
  - Read burns billions as losing multiple billions of US dollars after revenue, rather than merely spending billions.
  - Treat the amount as an approximate financial estimate of the kind reported in the press, without attributing a formal accounting standard to the speaker.
  - Use calendar 2024, the latest completed annual period before the February 11, 2025 post. The speaker did not specify a year.
  - Interpret billions as at least $2 billion annually. Do not require losses allocated exclusively to the ChatGPT product.
support_condition: Credible reporting of completed-year results establishes an estimated OpenAI business loss of at least $2 billion for 2024.
contradiction_condition: Comparable completed-year reporting establishes that OpenAI's annual business loss was below $2 billion, or that it was profitable.
measurement_requirements: Measure annual losses after revenue. Distinguish completed-year results from forecasts, and distinguish accounting losses from cash flow. Funding raised, gross spending and annualized revenue do not establish the claim.
source_requirements: Prefer financial statements or company disclosures. If these are unavailable, use credible financial reporting and disclose its limitations. Do not use Zitron's own reporting as independent confirmation.
