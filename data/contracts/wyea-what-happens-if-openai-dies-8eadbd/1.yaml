evaluator_interpretation:
  - The plain reading is that OpenAI's actual quarterly compute expenses exceed $12 billion.
  - The full post explicitly anchors its compute-cost discussion to Q1 2026. I therefore use January–March 2026, rather than select a later quarter based on its results.
  - Compute includes training and inference. Total research and development expense is not automatically all compute expense.
  - The surrounding discussion relies on press reports and estimates, so the accounting basis is estimate.
support_condition: Reliable evidence places OpenAI's total compute expenses for Q1 2026 above $12 billion.
contradiction_condition: Reliable evidence places the same quarter's total compute expenses at or below $12 billion.
measurement_requirements: A quarterly compute-expense total, or a reconciliation identifying training and inference expenses without double counting. Cash burn, total research and development expense, and future commitments cannot substitute for compute expenses.
source_requirements: Company financial records or independent reporting that identifies the period and expense categories. Repetitions of Zitron's calculation are insufficient.
