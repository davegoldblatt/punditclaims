assessment_axis: forecast_outcome
explicit_source_elements:
  - anyone raising any AI-related debt
  - is going to get shafted
  - overall Treasury prices
  - sentiment around AI in general
  - their own specific financial situation
evaluator_interpretation:
  - The plain reading forecasts materially adverse borrowing terms for AI-related issuers, with Treasury rates, sector sentiment and issuer credit all contributing.
  - Use comparable earlier financing terms and contemporaneous market benchmarks to assess deterioration; the speaker supplies no numerical cutoff.
  - The scope includes strong and weak issuers and different financing structures.
  - Economic borrowing cost includes fees and conversion rights where relevant. A low convertible coupon alone does not establish cheap financing.
  - This is a qualitative sector-wide financing forecast, rather than a specified company's accounting metric.
support_condition: Comparable subsequent financing records consistently show materially worse borrowing terms across the claimed issuer scope, with evidence of contributions from all three named factors.
contradiction_condition: A clear subsequent AI-related financing obtains non-punitive economic terms, or materially improved comparable terms, and reliable attribution shows that the claimed adverse combination does not apply.
measurement_requirements: Compare like currencies, maturities, seniority, collateral, guarantees and embedded options. Separate Treasury benchmark changes from credit-spread changes and identify sector versus issuer effects.
source_requirements: Final offering documents and dated market pricing, supported by credible attribution analysis. Secondary-market distress alone does not establish the terms of a new financing.
