explicit_source_elements:
  - Per my own analysis
  - $1 trillion in Blackwell and Vera Rubin GPU sales
  - by the end of 2027
  - around 40GW
  - assuming a PUE of 1.35
  - around 30GW of usable capacity
  - around $12 million a megawatt
  - around $435 billion in global annual compute revenue
evaluator_interpretation:
  - Assess the calculation presented on the publication date, not whether NVIDIA will ultimately achieve its sales forecast.
  - Treat 40 GW as total facility capacity and divide by the stipulated PUE to obtain usable capacity.
  - Read $12 million per megawatt as an annual revenue requirement because the stated result is annual revenue. The source does not explicitly supply the annual unit.
  - Test the stated numerical assumptions without assuming that they establish actual commercial necessity.
support_condition: The sales-to-capacity assumptions are substantiated and the stated capacity, PUE and per-megawatt assumptions yield approximately $435 billion in annual revenue.
contradiction_condition: The stated arithmetic produces a materially different annual revenue figure, or independently established inputs invalidate a necessary conversion.
measurement_requirements: Reproduce the capacity and revenue calculations, keeping GW and MW distinct. Separately establish hardware prices, product mix, power requirements and the economic basis for the annual revenue requirement.
source_requirements: Company disclosures for the sales premise; documented engineering and pricing assumptions for physical capacity. The post may supply operands for testing its arithmetic, but cannot independently validate those operands.
