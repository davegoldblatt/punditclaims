assessment_axis: historical_observation
explicit_source_elements:
  - Every single AI app is subsidized
  - its price is fake
evaluator_interpretation:
  - The ordinary testable reading is that every commercial generative-AI application charges less than the cost of delivering its service and therefore requires subsidy.
  - The surrounding discussion concerns generative-AI applications. I do not extend the claim to every historical use of machine learning.
  - Fake price and none of this is real are treated as rhetoric accompanying the subsidy claim, not separate accounting measures.
  - For this ongoing financial state, I use July through September 2025, the latest completed calendar quarter ordinarily reportable before the December 29 post.
  - The wording supplies no accounting basis or cited financial source. The contract therefore retains unknown accounting_basis, which prevents a supported or contradicted money verdict.
  - App-level delivery economics, company-wide net losses, and subsidies embedded in upstream model prices are separate questions.
support_condition: Comparable app-level records establish that every application in the defined population earned less from customers than its delivery costs during the target period and required external subsidy.
contradiction_condition: At least one in-scope application demonstrably covered its delivery costs without subsidy during the target period, using a defined and comparable accounting basis.
measurement_requirements: Realized application revenue and matching delivery costs, including inference, hosting and credits, for the same period. Identify upstream subsidies separately. Company fundraising and consolidated net losses are insufficient.
source_requirements: App-level financial disclosures or independently verified cost and revenue records. Survey averages are context unless the underlying population, periods and cost definitions can be matched.
