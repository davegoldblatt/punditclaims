assessment_axis: historical_observation
explicit_source_elements:
  - Every single AI app
  - is subsidized
  - its price is fake
  - you are being lied to
  - none of this is real
evaluator_interpretation:
  - "Plain reading: every AI app is sold at a price that does not cover what it costs its maker to provide, with the gap covered by outside money such as venture capital."
  - "'Every single' is a universal. One AI app whose maker is profitable on its own revenue contradicts it."
  - "'You are being lied to' and 'none of this is real' are rhetoric, not separately testable."
  - "Target period: he gave none. I use calendar 2025, the year of the post, because the most recent public reporting before the post covers it. This avoids narrowing the window to a single quarter."
support_condition: Evidence that, through 2025, AI app makers generally, with no credible exceptions, sold below their cost of provision and relied on outside funding to cover losses.
contradiction_condition: A credible report that at least one AI app was profitable in 2025, with prices covering its costs, without needing subsidy.
measurement_requirements: Company-reported profitability or cost-to-revenue figures for AI app makers in 2025.
source_requirements: Company disclosures or filings, or reputable news reports of them.
metric_scope:
  company: Any AI app maker
  metric: Price versus cost of provision (profitability / subsidy)
  currency: USD
  units: null
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2025-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01-01
  end: 2025-12-31
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Subsidized' could mean the app maker itself loses money, or that it buys model access from providers who sell below cost (an indirect subsidy)."
  - He gave no period. Calendar 2025 is used as the present state at the time of the post.
  - "'Price is fake' does not say which costs count, for example whether training is included or only serving costs."
retrospective_or_prospective: retrospective
