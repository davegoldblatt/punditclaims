evaluator_interpretation:
  - The ordinary reading is that hallucination was a recognized, recurring failure of contemporary language models trained to predict text.
  - Hallmark does not require every answer or every model to hallucinate.
  - The sentence describes an observed characteristic; it does not establish that word-distribution learning is the sole cause.
  - For this ongoing research state, I use the current reporting year through publication, January 1–October 21, 2023. There is no standard quarterly reporting period for this literature.
support_condition: Contemporaneous research and model evaluations identify hallucinations as a recurring, broadly recognized limitation across language models.
contradiction_condition: Representative contemporary evaluations establish that hallucination was exceptional rather than characteristic, and the claimed broad recognition is unsupported.
measurement_requirements: Evidence across models or a research synthesis, with hallucination understood as generated content conflicting with its input, context or established facts.
source_requirements: Research papers and model developers' technical evaluations available by publication; later evidence must explicitly concern the target period.
