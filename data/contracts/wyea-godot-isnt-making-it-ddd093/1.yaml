assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI
  - on course to lose
  - more than $5 billion
  - this year
evaluator_interpretation:
  - "'This year' means calendar 2024, and 'more than' requires a result strictly above $5 billion."
  - I assess the eventual annual result, rather than merely whether a forecast existed when Zitron wrote.
  - The surrounding discussion relies on reported financial estimates. Contemporary reporting describes the approximately $5 billion forecast as excluding equity-based compensation; that basis must be preserved when comparing it with an outcome.
  - The words 'lose' and 'net loss' do not by themselves establish that a later GAAP result is comparable to the original adjusted estimate.
support_condition: An independently established full-year 2024 loss exceeds $5 billion on the same basis as the contemporaneous estimate.
contradiction_condition: An independently established full-year 2024 loss is $5 billion or less on that same basis.
measurement_requirements: Full-year realized loss, with treatment of equity compensation and other material adjustments reconciled to the original estimate. A rounded $5 billion figure does not establish a strict exceedance.
source_requirements: Company records or independent financial reporting with a clear accounting bridge. Repetition of Zitron's own later reporting is insufficient by itself.
metric_scope:
  company: OpenAI
  metric: Annual loss on the contemporaneous reported estimate basis, excluding equity-based compensation
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2024-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: net
original_horizon: this year
horizon_interval:
  start: 2024-12-03
  end: 2024-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Only a final, independently documented result on the matching basis could settle the annual threshold; interim losses alone cannot exclude later offsets.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'On course' can describe a current forecast or predict the eventual result; this assessment uses the latter."
  - The claim does not specify accounting adjustments.
  - Contemporary loss estimates excluded equity compensation.
  - The threshold is strict, while several reports round the loss to $5 billion.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
