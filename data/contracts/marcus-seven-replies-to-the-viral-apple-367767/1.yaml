horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve positively once dated primary research collectively establishes a substantial collection of analogous failures across multiple independent studies and distinct task families. Isolated examples are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
