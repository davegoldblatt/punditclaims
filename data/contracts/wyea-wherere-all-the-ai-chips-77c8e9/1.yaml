assessment_axis: forecast_outcome
explicit_source_elements:
  - 90%+ of NVIDIA’s sales
  - ever end up generating a single dollar of revenue
  - very little that exists to protect investors
  - if AI compute demand never arrives
evaluator_interpretation:
  - The ordinary reading concerns revenue earned by purchasers using NVIDIA hardware, rather than NVIDIA's revenue from selling it. Revenue does not require profitability or recovery of the purchase price.
  - The surrounding discussion limits the relevant hardware to the AI data-center buildout.
  - For a provisional test, use hardware sold by publication and weight it by sales value. Neither that cohort nor value weighting is explicitly specified; unit-weighted results should also be reported.
  - The revenue forecast is unconditional. The additional investor-protection assertion is conditional and is not separately scored without evidence that the relevant demand failed to arrive.
support_condition: Lifetime records for a defined sales cohort show that hardware representing at least 90% of its sales value never generated downstream revenue. Supporting the additional protection assertion also requires failed demand and evidence of little effective contractual recourse or recovery across the relevant financed projects.
contradiction_condition: Matched deployment and customer-revenue records show that hardware representing more than 10% of the same sales cohort already generated downstream revenue. Substantial enforceable protection under failed demand would contradict the additional protection assertion.
measurement_requirements: Match hardware sales, their values and unit counts to deployment and downstream revenue. Distinguish revenue from utilization, bookings, financing and profit. Examine guarantees, collateral, seniority and recoveries separately.
source_requirements: NVIDIA shipment records, customer operating and revenue records, and executed financing agreements or court recovery records. Broad company statements alone cannot establish the percentage.
metric_scope:
  company: NVIDIA and purchasers of its AI data-center hardware
  metric: Share of NVIDIA hardware sales whose hardware never generates downstream customer revenue
  currency: USD
  units: percent of sales value; denominator not specified by speaker
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: The revenue forecast can be contradicted before hardware retirement if matched records establish that more than 10% of a defined cohort has already earned downstream revenue. Support requires irreversible retirement or disposal without revenue for at least 90%. Neither event alone settles the separate investor-protection assertion.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Sales could mean sales value, hardware units or transactions.
  - The sales cohort and its starting date are unspecified.
  - The text does not explicitly exclude future sales.
  - Customer revenue attributable to internally used hardware is undefined.
  - Very little protection has no numerical threshold.
  - The demand-failure condition for the protection assertion has not been established.
  - No accounting basis is specified.
retrospective_or_prospective: retrospective
