assessment_axis: historical_observation
explicit_source_elements:
  - the margins fucking stink
  - every product is unprofitable
  - none of these companies can afford their bills based on their actual cashflow
evaluator_interpretation:
  - "These companies refers principally to the standalone model developers discussed: OpenAI, Anthropic, MiniMax and Zhipu."
  - "The observation concerns the latest interim 2025 results discussed or reportable before publication: year-to-date periods ending no later than September 30, with the context explicitly using first-half results for Zhipu."
  - Unprofitable products means losses after attributable costs. Positive gross margins alone do not establish full product profitability, and company losses do not establish losses on every product.
  - Cashflow means internally generated operating cash, excluding new financing and previously raised cash reserves.
  - The surrounding financial examples come from press reporting, so the contract records an estimate basis. No common accounting definition is supplied for the broader assertion.
  - Bad margins has no objective cutoff; the universal profitability and operating-cash assertions remain testable.
support_condition: Comparable disclosures show that every covered product loses money after attributable costs and that each covered company has insufficient internally generated operating cash to meet operating outflows.
contradiction_condition: Comparable evidence identifies a profitable covered product or a covered company whose internally generated operating cash covers its operating bills.
measurement_requirements: Separate gross profit, product profit, company net income, operating cash flow and cash burn. Product-level costs and consistent company-level operating cash-flow statements are required.
source_requirements: Financial statements and product-cost disclosures are preferred. Clearly identified press estimates may provide context but must retain their definitions and periods.
metric_scope:
  company: OpenAI, Anthropic, MiniMax and Zhipu
  metric: Product profitability, margins and operating cash-flow sufficiency
  currency: USD
  units: Profit or loss and cash-flow amounts; margin percentages
  accounting_basis: estimate
  fiscal_or_calendar: calendar
