  - Product profitability has no specified cost allocation.
  - Bad margins has no threshold.
  - Actual cashflow could mean operating cash flow or free cash flow.
  - The target period uses the latest interim year-to-date reporting window implied by the context, with different company endpoints.
  - The compound claim combines several financial measures and accounting definitions.
