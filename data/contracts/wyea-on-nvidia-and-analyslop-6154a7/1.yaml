support_condition: A sufficiently complete review of the relevant public record establishes that the particular run and application were supported only by Anthropic's assertions, with no published artifact, demonstration or independent verification by the post date.
contradiction_condition: A pre-post public artifact, demonstration, execution record or credible independent verification substantiates the particular 30-hour run or resulting Slack/Teams-like application beyond Anthropic's unsupported assertion.
measurement_requirements: Link any purported verification to the specific model, run and application. Separate elapsed runtime from productive coding and distinguish app existence from completeness or quality.
