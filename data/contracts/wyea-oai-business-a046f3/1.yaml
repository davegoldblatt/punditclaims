ambiguity_flags:
  - The statement does not specify pre-money or post-money valuation.
  - The valuation is rounded rather than an exact contractual figure.
  - "'Few weeks' has no exact endpoint."
  - The post and financing announcement share a date; their precise publication times were not independently established.
