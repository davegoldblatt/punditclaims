assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI
  - burn $5 billion
  - make $3.4 billion
  - no proof that it’s capable of bringing down costs
evaluator_interpretation:
  - Terrible business is an opinion; assess the financial amounts and the asserted absence of cost-reduction evidence.
  - The financial context points to calendar-2024 estimates circulating before the post, rather than a completed audited year.
  - Read burn as net cash consumption, while flagging the plausible colloquial alternative of accounting losses.
  - Read make as revenue for the same annual period, rather than silently substituting an annualized monthly run rate.
  - Bringing down costs means reducing OpenAI's own production costs. Lower customer prices alone do not prove that.
support_condition: Comparable contemporary estimates establish approximately $5 billion of annual cash burn against $3.4 billion of annual revenue, and the contemporaneous record contains no credible demonstration of lower internal production costs.
contradiction_condition: Matched financial evidence establishes materially different amounts, or credible evidence available before the post demonstrates lower internal production costs.
measurement_requirements: Keep cash burn, accounting losses, annual revenue, annualized revenue, API prices, and internal production costs separate. Identify exclusions and whether figures are estimates.
source_requirements: Prefer public company financial records. Where unavailable, use contemporary reporting based on documents or identified financial disclosures, with its limitations stated.
