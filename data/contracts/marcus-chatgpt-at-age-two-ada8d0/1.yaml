evaluator_interpretation:
  - Regular means recurring factual fabrications across systematic evaluations of contemporary LLMs. It does not mean that most responses hallucinate.
  - The reference to the latest 2024 edition anchors the observation to 2024 through publication. I use that current-year reporting window because model evaluations have no standard quarterly reporting cycle.
  - Benchmark frequencies establish recurring failures in the tested tasks, not a population-wide rate for everyday conversations.
support_condition: Systematic evaluations during the target period find repeated false or unsupported factual answers from contemporary, widely used LLMs.
contradiction_condition: Broad, representative evaluations establish that hallucinations have become exceptional, isolated failures across contemporary LLMs and ordinary factual tasks.
measurement_requirements: Distinguish incorrect factual answers from refusals, omissions, creative writing, and grader errors. Identify deliberate selection of difficult questions.
source_requirements: Primary evaluations with documented questions, grading methods, and model identities.
