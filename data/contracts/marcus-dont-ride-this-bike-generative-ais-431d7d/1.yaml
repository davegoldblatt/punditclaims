explicit_source_elements:
  - the relation between language and images remains superficial and unpredictable
  - in current approaches
  - Any one trial might be correct
  - never much of a guarantee
evaluator_interpretation:
  - In context, the ordinary testable reading is unreliable adherence to the discussed compositional constraints across prompts and repeated generations.
  - Superficial is treated as a description of observed prompt adherence, not a demonstrated claim about internal representations.
  - Little guarantee means insufficient practical reliability on these tasks, not that every prompt is equally difficult or that no prompt can succeed consistently.
  - Current approaches is a scope restriction, not the antecedent of a conditional forecast.
  - With no standard quarterly research reporting period, the observation window is the latest reporting year to date, ending on publication.
support_condition: Systematic and repeated-trial evaluations show substantial, task-dependent failures to preserve relational, numerical, or other compositional constraints in contemporary image generators.
contradiction_condition: Contemporary systems consistently satisfy these constraints across repeated trials and prompt variations, with failures rare across the relevant tasks.
measurement_requirements: Use unselected generations, repeated samples where available, human-validated correctness, and results separated by task difficulty.
source_requirements: Primary evaluations of systems available by December 8, 2024. Broader conclusions require evidence beyond a single illustrative failure.
