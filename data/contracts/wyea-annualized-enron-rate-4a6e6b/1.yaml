explicit_source_elements:
  - Anthropic and OpenAI
  - $1.3 trillion in compute commitments
  - at least $413 billion
  - uncancellable
  - discounted compute costs and adjusted operating profits
  - don’t actually resolve the underlying problem
evaluator_interpretation:
  - Assess the combined stock of outstanding multiyear compute obligations, not annual spending or cash already paid.
  - Treat $1.3 trillion as a rounded reported estimate, conventionally about $1.25–$1.35 trillion.
  - Use September 2026, the latest pre-post reporting month for the commitment snapshot. The contractual payment years are separate from that snapshot.
  - Treat the monetary basis as estimate because the post relies on reported private-company figures.
  - The testable reading of 'do not resolve' is that reporting adjusted profit or receiving temporary discounts does not itself discharge the remaining contractual obligations.
  - Uncancellable means the buyer cannot simply walk away; ordinary breach and default provisions do not automatically make an obligation freely cancellable.
support_condition: A reconciled, non-overlapping schedule establishes approximately $1.3 trillion of combined outstanding compute commitments, at least $413 billion without ordinary unilateral cancellation rights, and no discharge of those obligations merely from the cited discounts or profit adjustments.
contradiction_condition: Comparable records establish a combined total outside the rounded range, an uncancellable amount below $413 billion, or contractual amendments that materially discharge the obligations invoked by the claim.
measurement_requirements: Separate binding minimum payments, conditional delivery commitments, cancellable contracts, spending plans, financing and overlapping project announcements. Account for payments already made and contract amendments.
source_requirements: Contracts and financial disclosures for both companies, or reputable reporting that identifies the underlying documents and permits reconciliation.
