ambiguity_flags:
  - The current-year development window is inferred; no starting date is stated.
  - Bigger could refer to parameter count, training data, or compute.
  - Just could mean literal exclusivity or a dismissive description of the central strategy.
  - Mostly has no specified denominator.
  - The scope could encompass frontier-model development or the companies' entire AI research portfolios.
