explicit_source_elements:
  - Tesla FSD
  - is getting better
  - But is getting enough better? (rhetorical question, not an assertion)
evaluator_interpretation:
  - "Only the first sentence is a checkable assertion: that Tesla's Full Self-Driving software was improving at the time of the post. The second sentence is a question, so it is not graded."
  - He named no period. I read 'is getting better' as recent progress in the months before the 2024-04-09 post, which in practice means the FSD v12 rollout from January to early April 2024.
  - "Plain reading: crowdsourced or reported performance data, such as miles between disengagements, or broad reports on driving quality show the newer FSD versions doing better than earlier ones."
support_condition: Evidence from early 2024 shows newer FSD versions, such as v12.x, performing better than earlier versions, for example more miles between critical disengagements or clearly better reported driving.
contradiction_condition: Evidence from early 2024 shows FSD performance flat or getting worse compared with earlier versions.
measurement_requirements: Version-to-version comparison of FSD performance. Examples are miles between critical disengagements from community trackers, or consistent reports of improved driving behavior.
source_requirements: Tesla does not publish official intervention data. Crowdsourced tracker summaries and news reports dated on or before 2024-04-09 are acceptable.
