explicit_source_elements:
  - last week
  - machine-generated articles
  - errors in 41 of the 77 articles
  - all missed by editors who weren’t paying enough attention
evaluator_interpretation:
  - The claim combines a correction count with an explanation for the editorial failures. Both are material.
  - Last week is read as the January 23–29, 2023 discovery and correction episode concerning an already published corpus, rather than a claim that all 77 articles were first published during that week.
  - Inadequate attention means an actual failure of scrutiny, not merely the circular observation that errors escaped review.
support_condition: Records corroborate errors requiring corrections in 41 of the 77 AI-assisted articles, and direct evidence establishes that inadequate editorial attention caused the missed errors.
contradiction_condition: Reliable records establish a different count or demonstrate that the asserted explanation for the missed errors is false.
measurement_requirements: Count distinct articles, not individual errors. Separate factual corrections from other changes and distinguish failed review from evidence about reviewers' attention.
source_requirements: CNET's audit, article correction histories, and direct accounts or records of editorial review; contemporaneous reputable reporting may establish the count where the primary disclosure omits it.
