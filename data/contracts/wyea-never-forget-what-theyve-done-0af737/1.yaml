explicit_source_elements:
  - Large Language Models were able to generate a lot of text or generate pictures
  - barely approximated a thing that society wanted or needed
  - other than it was something that people used to be willing to pay more for
evaluator_interpretation:
  - "Plain reading: from ChatGPT's launch to the post, there was little real demand for LLM output, apart from businesses wanting cheaper substitutes for paid human work."
  - "I measure 'wanted' by revealed demand: how many people chose to use LLM products, and for what. 'Needed' is normative, so I do not test it separately."
  - "Target period: November 2022 to the post date."
support_condition: Usage of LLM products by the public stayed small, or was mostly businesses replacing paid work.
contradiction_condition: Hundreds of millions of people chose to use LLM products regularly, including a large share of personal, non-work use, before the post.
measurement_requirements: Weekly or monthly active users of major LLM products, and the mix of uses.
source_requirements: Company disclosures or research papers with usage data.
