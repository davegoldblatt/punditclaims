ambiguity_flags:
  - The preceding transactions and delays have no stated starting date.
  - Covered for could imply public defense or a stronger allegation of concealment.
  - Jensen's deals could mean Nvidia's business under Huang or arrangements personally organized by him.
  - Indirect access through offshore computing and physical chip smuggling are different mechanisms.
  - Possibly illegal expressly leaves legality unsettled.
