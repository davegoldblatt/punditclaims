assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI plans to burn $121 billion
  - in the next two years
  - on compute for training its models
  - the media's response is to say that somehow it will break even in 2030
  - no actual explanation anywhere as to how
  - other than vague statements about "efficiency"
evaluator_interpretation:
  - The $121 billion figure is the one the Wall Street Journal reported on 2026-04-06, two days before the post, from OpenAI's investor documents. I treat 'compute for training' and the WSJ's 'computing power for AI research' as the same thing.
  - "Plain reading of 'in the next two years': spending over the roughly two years after April 2026, not one year further out. Ed Zitron did not say which he meant."
  - The media part holds if mainstream outlets reported that OpenAI expects to break even or turn profitable around 2030.
  - The 'no explanation anywhere other than efficiency' part is partly his opinion. I test only whether coverage gave reasons other than efficiency, such as revenue growth, ads or subscriber conversion.
  - "Target period: OpenAI's plans and the coverage as they stood before the post, starting with the November 2025 WSJ-based reporting on 2030 profitability."
support_condition: Credible reports before the post show that OpenAI planned about $121 billion of research or training compute within the two-year window he named, that the media reported break-even around 2030, and that the coverage gave no reason beyond efficiency.
contradiction_condition: Reports show the $121 billion is for a different period than he described, or that no outlet reported break-even around 2030, or that the coverage explained the path to profit with concrete drivers other than efficiency.
measurement_requirements: Compare the reported dollar amount and its year with his '$121 billion in the next two years'. Check what the coverage said about OpenAI's break-even year and why.
source_requirements: The WSJ/Dow Jones report on OpenAI's investor documents, or faithful reprints of it; mainstream coverage of OpenAI's profitability timeline.
