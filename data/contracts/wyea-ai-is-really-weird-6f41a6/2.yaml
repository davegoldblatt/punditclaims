claim_id: wyea-ai-is-really-weird-6f41a6
version: 2
claim_revision_ref:
  id: wyea-ai-is-really-weird-6f41a6
  version: 1
  content_hash: 33a95a7068dba101bbc5b93a2b263f6853b4843b01a6fd13bbbfcaae086f4d6b
assessment_axis: forecast_outcome
explicit_source_elements:
  - fantastical thoughts about "agents on the internet"
  - do not exist, cannot exist, and will never exist
  - executives and members of the media keep acting as if that's the case
  - "next sentence: OpenAI's Operator Agent does not work; AI browsers are fundamentally broken"
evaluator_interpretation:
  - He admits that basic web agents like Operator exist ('does not work'). So 'do not exist' cannot mean any web agent at all. It means the 'fantastical' agents executives describe.
  - "Reading in his terms: autonomous agents that reliably carry out the complex, delegated, multi-step work on the open web that executives and the media promise, not demos or tools that only partly work."
  - "'Will never exist' has no deadline. It cannot be confirmed by any date. It can only be shown false by such agents actually existing."
support_condition: The claim can never be fully confirmed by a date. Ongoing evidence that the best web agents still fail often on realistic live-web tasks is consistent with it.
contradiction_condition: Agents are widely available and independently shown to reliably do the complex, delegated multi-step web work executives describe, at about the reliability of a human assistant.
measurement_requirements: Independent, human-checked success rates of top agents on hard, realistic live-web tasks, plus evidence of real everyday use for the delegated work executives promise.
source_requirements: Peer-reviewed or independent benchmarks with human-verified grading (for example Online-Mind2Web on hard tasks), or independent field studies. Vendor demos and self-reported scores are not enough.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: "Contradicted early only if, by the evaluation date, an independently verified agent in broad public use reliably completes complex, multi-site delegated web tasks of the kind executives describe. Rough bar: at least 90% human-verified success on the hard tier of a realistic live-web benchmark, with that reliability confirmed in real use. No dated event can confirm 'never'."
interpretation_determines_result: true
ambiguity_flags:
  - "'Fantastical' agents are not defined. The capability bar is supplied by the evaluator."
  - "'Cannot exist' and 'will never exist' have no deadline."
  - Where 'works' ends and 'does not work' begins for a partly reliable agent is not stated.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
