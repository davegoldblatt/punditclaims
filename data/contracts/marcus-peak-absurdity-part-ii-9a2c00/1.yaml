explicit_source_elements:
  - Oracle doesn’t have the chips
  - they would need to fulfill the contracts
  - or even the cash to buy them
evaluator_interpretation:
  - The statement describes Oracle around September 11, 2025.
  - The plain reading is that Oracle lacked the full required chip capacity and enough cash already held to purchase the missing chips.
  - It does not say Oracle had zero chips, and it does not necessarily predict an eventual failure to procure them.
  - Both the hardware shortfall and the cash shortfall require evidence.
  - The monetary comparison concerns cash against remaining chip purchase costs, not total data-center spending or the contract's revenue value.
  - The claim does not identify an accounting basis.
support_condition: Matched records show a September 2025 shortfall between available chip capacity and contractual requirements, and establish that the cost of the missing chips exceeded Oracle's available cash.
contradiction_condition: Matched records show Oracle already possessed the required capacity, or held enough cash to purchase the missing chips. Any verdict must distinguish the two clauses.
measurement_requirements: Identify contractual capacity, delivery dates, existing allocated chips, remaining purchase quantities and prices, and cash available on the same date.
source_requirements: Prefer Oracle filings, procurement records and contractual disclosures. Separate reported planned purchases from delivered equipment.
