assessment_axis: historical_observation
explicit_source_elements:
  - current AI
  - doesn’t “decide to teach itself”
  - or even have consistent beliefs
evaluator_interpretation:
  - The context concerns mainstream conversational language models, particularly ChatGPT, GPT-4 and Bard, rather than every experimental AI architecture.
  - The ordinary behavioral reading is that these systems do not independently initiate persistent learning and do not reliably maintain consistent answers across equivalent questions. This does not establish whether they possess subjective beliefs.
  - "For the ongoing state, I use January 1 through April 17, 2023: the recent months discussed in the post and the latest publicly documented systems before publication."
  - Learning information within a supplied conversation is distinct from independently initiating changes to the trained model.
support_condition: Contemporary technical documentation describes externally controlled training without autonomous learning from use, and reproducible tests show inconsistent answers to equivalent inputs.
contradiction_condition: Contemporary documentation or reproducible tests demonstrate independently initiated persistent learning in the named chatbot class, or establish the consistent positions that the claim denies.
measurement_requirements: Identify the model version and distinguish persistent training from temporary use of context. Consistency tests must preserve the meaning of the question.
source_requirements: Contemporary technical documentation and reproducible research, with model versions attributable to the target period.
