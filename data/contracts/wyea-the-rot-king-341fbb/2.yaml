explicit_source_elements:
  - Tesla’s unsafe and unreliable Full Self-Driving Beta software
  - currently appears to have a “phantom braking problem.”
evaluator_interpretation:
  - The sentence combines a firm safety and reliability assertion with a tentative allegation about phantom braking. The hedge applies to the braking allegation, not to the preceding adjectives.
  - The ordinary reading of 'unsafe and unreliable' is that the software has material safety and driving-performance problems. It does not mean every use causes harm or assert a particular comparative crash rate.
  - I interpret 'currently' as July 2023 through the July 27 publication date. This is an ongoing software condition, without a natural quarterly reporting period.
  - Under the supplied exclusion of hedged claims, the combined proposition cannot receive a single factual grade as submitted. Replacing 'appears to' with either 'has' or 'has credible reports of' would change the speaker's commitment.
support_condition: No support verdict for the combined proposition under the hedged-claim exclusion. The firm safety and reliability assertion could separately be supported by documented material safety and driving-performance defects affecting FSD Beta during the target period.
contradiction_condition: No contradiction verdict for the combined proposition under the hedged-claim exclusion. A separate assessment of the firm assertion would require evidence addressing safety and reliability during the target period; absence of reported crashes would not by itself contradict it.
measurement_requirements: Any separate factual assessment must identify FSD Beta, relevant software versions, and conditions during July 2023. Earlier defects require evidence of persistence; complaints alone do not establish causation.
source_requirements: Prefer dated regulatory records, company technical disclosures, and independent tests. Distinguish FSD Beta from Autopilot and adaptive cruise control.
