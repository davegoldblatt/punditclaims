assessment_axis: historical_observation
explicit_source_elements:
  - Tesla’s unsafe and unreliable Full Self-Driving Beta software
  - currently appears to have a “phantom braking problem.”
evaluator_interpretation:
  - The ordinary reading is that FSD Beta had material safety and reliability problems, including credible reports of braking without an apparent road hazard. This does not assert that every trip was unsafe.
  - I interpret 'currently' as July 2023 through the post date, July 27. Software problems can be reported continuously, so a financial reporting quarter would be inappropriate.
  - The evidence must identify FSD Beta. Reports about standard Autopilot alone do not establish this claim.
  - Earlier recalls establish historical defects, but require evidence of persistence to establish the state of software in July.
support_condition: Evidence about FSD Beta operating during the target period documents material safety or reliability failures and credible unintended braking. The tentative braking allegation requires credible evidence, not a completed regulatory finding.
contradiction_condition: Reliable evidence addressing FSD Beta during the target period establishes that the alleged failures were misattributed or absent. Isolated successful drives or improvements alone do not contradict the claim.
measurement_requirements: Identify the software version, operating circumstances, and date. Distinguish observed failures, user complaints, manufacturer statements, and regulatory findings.
source_requirements: Prefer regulatory records, dated manufacturer disclosures, and direct testing. Use contemporary reporting with explicit limits where primary evidence cannot be obtained.
