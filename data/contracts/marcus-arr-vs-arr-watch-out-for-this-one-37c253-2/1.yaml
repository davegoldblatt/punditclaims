  - companies like ATT
  - are increasingly turning to open source models from other vendors
  - in order to save costs
evaluator_interpretation:
  - "The graded part is the present-tense observation: AT&T and similar companies were increasingly shifting AI work to open models from other vendors to cut costs, as the tokenmaxxing trend faded. The hedged forecast that Anthropic's Q2 revenue 'may well not recur' is not graded here."
  - "'Collapse of tokenmaxxing' is read as the widely reported mid-2026 retreat from encouraging maximum token use, not a measured collapse in total spending."
  - "'Increasingly' means a rising share of AI workloads moving to open models over the months before the post."
support_condition: Reports from around mid-2026 show AT&T moving a growing share of AI work to open models from other vendors, explicitly for cost savings, against a broader backdrop of companies pulling back from tokenmaxxing.
contradiction_condition: Reports show AT&T was not shifting to open models, was not doing it for cost, or that tokenmaxxing had not faded.
measurement_requirements: AT&T's share of AI usage on open models and its stated reasons; reporting on the tokenmaxxing trend.
source_requirements: AT&T statements, ideally first-hand, or major news reports quoting AT&T executives.
