assessment_axis: causal_assessment
explicit_source_elements:
  - This cold reality
  - undermines
  - a large fraction
  - the use cases that people initially fantasized about
evaluator_interpretation:
  - The ordinary reading is that reliability limitations materially impair the practical viability or value of a substantial share of previously promoted LLM applications.
  - Undermines need not mean makes completely impossible. Extra verification, restricted autonomy, or substantially reduced value could qualify.
  - A large fraction requires evidence across an identifiable set of proposed applications; several failures in selected domains are insufficient.
  - The causal assertion requires separating technical reliability from cost, integration, organizational readiness, and other causes of disappointing results.
  - The assessment concerns applications and impairments established by publication. No start date is inferred for the initially imagined use cases.
support_condition: Representative evaluations or deployment studies show material impairment across a substantial share of documented proposed use cases, with evidence attributing that impairment to the stated technical limitations.
contradiction_condition: Comparable evidence shows that such limitations materially impair only a small share of those applications, or that the claimed broad impairment is principally caused by other factors.
measurement_requirements: Define the application population, intended performance, practical impairment, and weighting of use cases. Include successful deployments and identify causal mechanisms.
source_requirements: Independent evaluations and credible deployment studies across multiple domains, linked to dated descriptions of the proposed applications.
