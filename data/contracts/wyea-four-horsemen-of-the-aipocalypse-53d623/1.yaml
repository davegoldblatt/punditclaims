assessment_axis: historical_observation
explicit_source_elements:
  - vast majority of AI services
  - currently subsidize their subscriptions
  - using another measure
  - requests
  - rate limits
evaluator_interpretation:
  - In context, AI services means paid generative-AI subscription services, including coding assistants and chat services.
  - Subsidize means subscription receipts do not cover the actual cost of serving subscribers at observed usage. Charging less than an equivalent retail API bill is not by itself proof of a subsidy.
  - Vast majority means a large preponderance of services, counted by service rather than by revenue or users. No precise percentage is supplied.
  - For the ongoing state, I use April 2026 through the post date as the current observation window. Historical billing data must establish economics holding in that window.
support_condition: Representative service-level evidence shows a large preponderance of paid generative-AI subscriptions operating below actual serving cost during the target period.
contradiction_condition: Representative evidence shows that a large enough share of these services covers serving costs to rule out a vast majority being subsidized.
measurement_requirements: A defined service population and representative sample, matched subscription receipts and serving costs, and actual usage distributions. Separate subscriptions from API sales, free tiers, and company-wide research expenditure.
source_requirements: Provider financial records or transparent independent measurements with a defensible sampling method. Selected expensive users and posted API prices cannot establish industry prevalence.
