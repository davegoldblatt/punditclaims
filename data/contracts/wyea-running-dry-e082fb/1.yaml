explicit_source_elements:
  - all but certain
  - have to raise debt
  - 8% to 11% range
evaluator_interpretation:
  - The plain reading concerns the annual interest rate on Anthropic's next substantial borrowing to fund its obligations.
  - Next substantial borrowing is an evaluator interpretation; the speaker names neither an issuance nor a minimum size.
  - The range includes 8% and 11%. Interest paid in kind counts as interest, but equity conversion discounts and fees must be disclosed separately.
  - A borrowing by a separate infrastructure financing vehicle is not automatically borrowing by Anthropic.
support_condition: Anthropic completes a substantial borrowing after publication at an annual interest rate between 8% and 11%, with evidence that it was required to fund its obligations.
contradiction_condition: Anthropic completes the relevant substantial borrowing outside the stated range under comparable terms. A small subsidized facility or a separate project's borrowing does not suffice.
measurement_requirements: Identify the borrower, issuance date, principal, annual rate, fixed or floating terms, interest paid in kind, fees, collateral, conversion rights, and purpose.
source_requirements: Executed borrowing documents or company disclosures; reliable reporting of a completed transaction if the documents are unavailable.
