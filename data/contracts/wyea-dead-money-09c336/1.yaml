  - coming from Anthropic and OpenAI
evaluator_interpretation:
  - The ordinary reading is an estimate of the five companies' current combined annual AI revenue pace and its customer concentration.
  - "For this ongoing observation, the target covers the latest completed reporting quarters available before the post: April through June for calendar-quarter reporters and June through August for Oracle. This envelope is not a common accounting period."
  - The surrounding inputs mix Microsoft fiscal-year revenue, calendar-2026 estimates and annualized quarterly figures. They cannot be treated as a single realized annual total without reconciliation.
  - "'Coming from' requires separate identification of direct payments by the labs and indirect attribution through another hyperscaler."
  - The dollar total is approximate. Small rounding differences alone would not contradict the economic claim.
support_condition: A reproducible reconciliation establishes approximately $183 billion of comparable annual AI revenue for the named companies, approximately $118.2 billion attributable to the two labs, and a share of at least 64.3%.
contradiction_condition: Comparable evidence establishes a materially different total or attributable amount, or a customer share below 64.3%, beyond rounding uncertainty.
measurement_requirements: Company-level AI revenue and customer attribution on a consistent annual basis, with explicit treatment of fiscal periods, forecasts, run rates, intercompany sales and reseller accounting.
source_requirements: Company disclosures and independently sourced customer spending records, or accessible analyst estimates whose definitions and calculations can be checked.
