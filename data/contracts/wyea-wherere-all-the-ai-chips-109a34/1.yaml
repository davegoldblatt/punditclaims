assessment_axis: forecast_outcome
explicit_source_elements:
  - when the first hyperscaler pulls out
  - when the debt stops flowing
  - everybody will realize
  - both the markets and the economy will suffer as a result
evaluator_interpretation:
  - "Read the preceding questions as alternative triggers: a hyperscaler withdrawal or a cessation of relevant data-center financing."
  - A withdrawal from a committed AI data-center project qualifies under a project-level reading. The speaker does not explicitly require an industry-wide exit or a demand-related reason.
  - A narrower reading requiring a hyperscaler's broad retreat from AI remains possible and would change the condition assessment.
  - Read everybody will realize as a broad loss of market confidence in the AI investment thesis, not a literal claim about every person's beliefs.
  - The outcome requires adverse effects on both financial markets and real economic activity attributable to the trigger. Temporal coincidence or a single stock decline is insufficient.
  - Use broad US markets and economic activity as the primary scope, with international spillovers as additional evidence; the geography is an evaluator choice.
support_condition: After a qualifying trigger, credible evidence establishes broad reassessment of the AI investment thesis and adverse effects on both financial markets and real economic activity attributable to the withdrawal or financing cessation.
contradiction_condition: A completed episode with credible causal evidence establishes that a qualifying trigger did not produce the predicted joint market and economic harm. A short period without harm is insufficient because no response deadline was stated.
measurement_requirements: Date the trigger, distinguish project withdrawal from sector retreat, measure broad market and economic effects, and account for interest rates, energy prices and other competing causes.
source_requirements: Company confirmation or reliable reporting of the trigger, financing records, market measurements, official economic statistics and credible causal analysis.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: A trigger alone cannot settle the forecast. Early support requires a documented episode establishing both market and economic harm caused by it; contradiction requires a completed episode that rules out that joint effect.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Pulls out could mean one project or a broad withdrawal from AI investment.
  - The two preceding questions do not explicitly specify whether either trigger or both are required.
  - Debt stops flowing has no stated market coverage or duration.
  - Markets and economy have no specified geography or magnitude.
  - No response deadline is supplied.
  - Condition met depends on accepting a project-level withdrawal.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
