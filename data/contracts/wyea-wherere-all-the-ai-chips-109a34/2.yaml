assessment_axis: forecast_outcome
explicit_source_elements:
  - when the first hyperscaler pulls out
  - when the debt stops flowing
  - everybody will realize
  - conflated a great sales pitch with a thriving industry
  - both the markets and the economy will suffer as a result
evaluator_interpretation:
  - In context, a hyperscaler pulling out means a material retreat from AI infrastructure investment or commitments. A single project cancellation or a delay caused by power or delivery constraints does not establish that retreat.
  - Debt stopping means a broad interruption of financing for the AI infrastructure buildout, rather than one failed transaction or higher borrowing costs.
  - Either development can activate the forecast; the surrounding questions do not clearly require both.
  - Everybody is ordinary rhetorical language for widespread recognition that the industry's commercial strength was overstated, not literal unanimity.
  - Both broad financial-market harm and real economic harm must result from the triggering retreat or financing interruption. Relevant measures include broad asset prices, output, investment and employment; sector share-price declines alone are insufficient.
  - No numerical harm threshold, geographic boundary, deadline or post-trigger waiting period is supplied. No fixed percentage loss, recession requirement or invented deadline is imposed.
support_condition: A qualifying retreat or broad financing interruption occurs, followed by widespread reassessment of AI's commercial prospects and both market and real economic harm credibly attributable to that event.
contradiction_condition: After a qualifying event and its consequences have substantially played out, reliable evidence establishes that the predicted joint market and economic harm did not occur, or that observed harm arose from unrelated causes. A short period without harm cannot falsify this undated forecast.
measurement_requirements: Establish the trigger's scale and date first. Then examine broad market measures and economic activity, with evidence separating the AI-investment shock from other causes.
source_requirements: Use company announcements or filings for investment retreats, financing records for a broad lending interruption, independent market data, official economic statistics and credible causal analysis. Reports of financing stress require corroboration before they establish the trigger.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a dated qualifying trigger and decisive evidence of the resulting widespread reassessment and both market and economic harm, or a completed episode that decisively rules out the predicted joint harm. Individual cancellations, sector selloffs and temporary financing difficulties do not suffice.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The scale of a hyperscaler withdrawal is unstated.
  - The breadth and duration of a financing stoppage are unstated.
  - The two triggering questions do not explicitly specify an either/or relationship.
  - No deadline or post-trigger observation period is given.
  - Markets, economy, suffer and widespread recognition have no specified measures or geographic scope.
retrospective_or_prospective: retrospective
