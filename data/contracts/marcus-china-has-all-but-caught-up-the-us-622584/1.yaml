assessment_axis: forecast_outcome
explicit_source_elements:
  - Ban Chinese models altogether
  - sure to raise prices to consumers
  - stifle innovation
evaluator_interpretation:
  - Altogether means an implemented general US prohibition on Chinese AI models, including ordinary commercial and consumer use. A restriction on federal agencies or one vendor alone does not establish that condition.
  - Consumer prices means prices paid by US end users for comparable AI services.
  - Stifle innovation means a material reduction in new products, model improvements, or market entry caused by the ban.
  - Both effects are evaluated against what would have happened without the ban.
support_condition: A qualifying general ban takes effect and credible causal evidence establishes both higher consumer prices and reduced innovation.
contradiction_condition: A sufficiently complete evaluation of a qualifying ban establishes that consumer prices did not rise because of it or that innovation was not suppressed. Brief post-ban observations alone are insufficient.
measurement_requirements: Verify the ban's coverage and effective date; measure comparable-service consumer prices, product releases, capability improvements, and entry using a credible comparison that accounts for other market changes.
source_requirements: Official implementation records and independent price and innovation evidence. Proposals, chip export controls, and government-device restrictions do not establish a general model ban.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A dated causal evaluation of an implemented general ban may settle the forecast once its effects can be assessed sufficiently completely. Neither the announcement of a ban nor isolated short-term changes suffice.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Consumer prices and innovation have no specified measures or thresholds.
  - No deadline or duration of effects is stated.
retrospective_or_prospective: retrospective
