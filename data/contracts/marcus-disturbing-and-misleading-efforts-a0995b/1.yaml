assessment_axis: historical_observation
explicit_source_elements:
  - the essay attacks a strawman
  - precipitated by an immediate safety concern
  - diverting from the board’s actual, stated concern (candor)
evaluator_interpretation:
  - Test the factual basis of the criticism by comparing the essay's treatment of the firing with the board's stated rationale.
  - Diverting means substituting a safety rebuttal for substantive engagement with candor or trust; it does not require proof of deliberate deception.
  - The target period spans the November 2023 firing announcement through the May 2024 essay.
support_condition: The complete essay rebuts an immediate-safety explanation while failing to engage the former board's stated candor or trust rationale.
contradiction_condition: The essay substantively engages that rationale, or reliable records show that an immediate safety violation was the former board's stated trigger.
measurement_requirements: A complete textual comparison, including passages addressing honesty even if they do not use the words candor or trust.
source_requirements: The full Taylor/Summers essay and original board statements. Reporting can establish quoted passages but cannot establish omissions from an inaccessible full text.
