explicit_source_elements:
  - Microsoft and OpenAI
  - only one play
  - make GenAI profitable
  - all out 24x7 surveillance
evaluator_interpretation:
  - The plain reading is that continuous user surveillance is necessary for either company's generative-AI business to earn a sustainable profit.
  - Profit means revenue exceeding the relevant business's costs, not revenue growth, financing, or a positive inference margin.
  - The claim supplies no accounting basis, cost-allocation method, or financial reporting period. These cannot be silently supplied.
  - This assesses the necessity asserted in the August 2026 post, rather than imposing a deadline on the earlier quoted warning.
support_condition: Comparable financial and operational evidence establishes that continuous user surveillance is necessary for profitable generative-AI operations at both companies, including evidence excluding viable alternatives.
contradiction_condition: A documented generative-AI business at either company earns a sustainable profit without continuous user surveillance, with relevant costs and data practices established.
measurement_requirements: Separate generative-AI revenue and costs, including an explicit allocation of development and infrastructure costs, linked to verified surveillance practices. Company-wide earnings and gross margins alone do not suffice.
source_requirements: Financial disclosures or independently verifiable financial records, together with technical or contractual evidence about data collection.
