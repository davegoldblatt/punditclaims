evaluator_interpretation:
  - OpenAI is the implied comparator.
  - Read supporting business customers as helping them adopt, operate, and obtain dependable service from the products, including assistance and problem resolution.
  - The qualification expresses limited confidence rather than an external condition.
  - Use January 2026, the latest complete month before publication that contemporaneous service evidence could cover. Adoption alone does not measure support quality.
support_condition: Comparable evidence from business customers shows a consistent Anthropic advantage in assistance, problem resolution, reliability, or implementation support during the target period.
contradiction_condition: Comparable evidence shows OpenAI providing equal or better business-customer support during the target period.
measurement_requirements: Compare similar customer tiers and workloads using support satisfaction, response and resolution times, implementation outcomes, and service reliability. Do not substitute market share or model benchmarks.
source_requirements: Prefer independently collected customer comparisons and documented service records with known measurement periods.
