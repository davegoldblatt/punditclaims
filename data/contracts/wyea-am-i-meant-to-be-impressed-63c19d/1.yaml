assessment_axis: causal_assessment
explicit_source_elements:
  - OpenAI and Anthropic both lose tens of billions of dollars a year
  - the majority of AI revenue and compute demand
  - dependent on whether Anthropic and OpenAI can continue to raise money
evaluator_interpretation:
  - Both means each company separately. Tens of billions ordinarily means at least $20 billion annually.
  - For the annual-loss premise, use calendar 2025, the latest completed annual period before publication. Assess the claimed industry dependence as of publication.
  - Majority means more than half of both industry revenue and compute demand. This requires industry-wide denominators and evidence that continuing fundraising is necessary to sustain that activity.
  - The passage does not consistently distinguish accounting losses from cash burn. Its reference to a reported forecast does not establish the accounting basis of the asserted actual annual losses.
support_condition: Comparable annual records establish losses of at least $20 billion for each company, and financing, liquidity, and industry data establish that more than half of AI revenue and compute demand depends on their continuing fundraising.
contradiction_condition: Comparable records establish that either company's annual losses fall below the threshold, or reliable industry and financing evidence disproves the asserted majority dependence.
measurement_requirements: Separate annual losses, operating cash flow, financing proceeds, cash reserves, and compute commitments. Define industry coverage and avoid counting the same revenue at multiple supply-chain stages.
source_requirements: Company financial statements or independently verified financial records, plus documented industry totals and financing requirements.
