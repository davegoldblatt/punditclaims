assessment_axis: forecast_outcome
explicit_source_elements:
  - Cancer is more than one thing
  - it will take more than a decade to eradicate it
  - curing mental illness
  - that quickly is absolute fantasy
evaluator_interpretation:
  - "Assess the two future commitments separately: cancer will not be eradicated within ten years, and mental illness will not be broadly cured within ten years."
  - Use 2036-11-12, ten years after publication, as the deadline.
  - Read eradication as eliminating cancer as an ongoing disease burden, rather than producing a cure for an individual patient or subtype.
  - Read curing mental illness as broad, durable cures across the category, rather than symptom improvement or individual remission.
  - "'Cancer is more than one thing' is a factual premise. Establishing that premise does not settle either forecast."
  - "'Some other things' is unspecified and is not expanded into additional independently scored predictions."
support_condition: At the deadline, authoritative evidence establishes both that cancer has not been eradicated and that mental illness has not been broadly cured.
contradiction_condition: Cancer is eradicated and mental illness is broadly cured within the decade. Achievement of only one would contradict that component; a mixed outcome would require evidence settling the other component as well.
measurement_requirements: Clinical evidence of durable cures and population evidence of cancer elimination, with adequate coverage of disease subtypes and follow-up.
source_requirements: Clinical studies, cancer registries, public-health surveillance and authoritative medical assessments.
metric_scope: null
original_horizon: more than a decade
horizon_interval:
  start: 2026-11-12
  end: 2036-11-12
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Validated cancer eradication and broad cures for mental illness within the decade would contradict the complete compound forecast early. Attainment of only one settles only that component.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Eradicate' could mean eliminating incidence or eliminating cancer as a serious disease burden."
  - The coverage required for 'curing mental illness' is unspecified.
  - "'Some other things' does not identify additional diseases."
retrospective_or_prospective: prospective
