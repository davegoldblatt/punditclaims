explicit_source_elements:
  - it will slow down
  - one of the leading US AI labs
evaluator_interpretation:
  - The surrounding text identifies the lab as Anthropic and the cause as the June White House decision.
  - The plain reading includes an actual interruption or delay in Anthropic's research, releases or deployments caused by that decision.
  - No minimum duration or permanent loss of competitiveness is stated.
  - Because the shutdown began before the post, early resolution requires evidence that a qualifying interruption continued after June 14.
support_condition: A dated record documents a post-publication delay or interruption of Anthropic's research, releases or deployments attributable to the decision.
contradiction_condition: A sufficiently complete operational record establishes that the decision caused no post-publication interruption or delay. Continued releases or growth alone would not disprove a temporary slowdown.
measurement_requirements: Identify the affected activity, its interruption or delay, dates after publication, and the link to the specific decision. Do not substitute overall revenue growth for deployment continuity.
source_requirements: Prefer Anthropic deployment notices, service records or government records; use independent reporting to test the causal link and scope where available.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated disclosure establishes that an actual Anthropic deployment or research interruption caused by the decision persisted after June 14, 2026. A temporary interruption qualifies because no duration threshold was stated.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Slow down does not specify research, deployment, release pace or business growth.
  - No duration or magnitude threshold.
  - The initial shutdown preceded the forecast.
