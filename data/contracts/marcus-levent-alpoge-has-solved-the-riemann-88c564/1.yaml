evaluator_interpretation:
  - Assess only the supplied normalized reliability claim, not the separate profitability assertion in the same sentence.
  - The plain reading is that current general-purpose AI cannot reliably complete many consequential applications without additional checking or safeguards.
  - "'Many' means multiple substantial application classes, not every application or a majority of all possible uses."
  - For the ongoing state, use November 2026 through the day before publication, the current technical reporting window.
support_condition: Contemporaneous evaluations show persistent consequential errors or frequent failures against professional requirements across multiple substantial application classes.
contradiction_condition: Representative evaluations establish reliable completion at the required standard across those applications, including realistic inputs and deployment conditions.
measurement_requirements: Use task-level reliability and documented consequential mistakes. Distinguish complete professional deliverables from partial-credit scores, and autonomous use from supervised assistance.
