assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI does not have a business model
  - value remotely commensurate with its costs
  - isn’t getting cheaper for the providers or the customers
evaluator_interpretation:
  - In context, no business model means no economically sustainable way to sell the service, rather than literally no pricing mechanism.
  - The ordinary testable reading of getting cheaper includes lower customer prices for comparable service. Aggregate spending can increase while unit prices decline.
  - Because no period is named, I use May 2026, the latest completed calendar month before publication, for the ongoing customer-price observation.
  - The three assertions are assessed as a conjunction. A clear counterexample to the categorical customer-price assertion contradicts that component without settling the broader value and sustainability judgments.
  - This is a sector-wide economic assertion, not a specified company's financial metric.
support_condition: Comparable customer prices and provider costs show no decline, and credible economic evidence supports the asserted absence of sustainable value relative to costs.
contradiction_condition: A documented reduction in customer prices for comparable generative-AI service contradicts the categorical customer-price component; demonstrated sustainable economics could separately contradict the business-model component.
measurement_requirements: Keep customer prices, provider serving costs, total expenditure and customer returns separate. Compare equivalent services or explicitly identify differences.
source_requirements: Dated provider price announcements for customer prices; credible cost and return measurements for the broader economic assertions.
