assessment_axis: historical_observation
explicit_source_elements:
  - whether generative AI in particular can be made into AGI just using more data and compute
  - AlphaFold 3 that combines classical AI with generative AI
  - a different axis that has seen far less investment
evaluator_interpretation:
  - The plain reading is that the contemporary scaling debate centrally concerned whether increasing generative models' data and compute could produce general intelligence.
  - The comparison concerns investment in research approaches across the field, not the finances of a named company. Contract metric_scope is therefore null.
  - Read 'far less investment' as a substantial funding disparity under comparable definitions and coverage; no numerical ratio is supplied.
  - Use 2024 through the post date as the observation period for the ongoing debate and technical distinction. The investment statement concerns accumulated investment by then, not exclusively investment received during 2024.
  - Do not assume that every non-generative component is classical AI, or that every scientific AI system belongs to a separate hybrid investment category.
support_condition: Contemporary statements establish the stated central scaling question; technical documentation establishes AlphaFold 3's combination of classical and generative AI; comparable investment records show substantially less accumulated investment in that hybrid approach.
contradiction_condition: Representative contemporary statements materially contradict the characterization of the scaling debate, technical documentation rules out the claimed architectural combination, or comparable investment records show hybrid approaches received similar or greater investment.
measurement_requirements: Investment comparisons must use the same time coverage, geography, funding measure and treatment of internal corporate spending. Categories must address overlap between generative AI and hybrid systems. Financing, research expenditure and compute spending cannot be treated as interchangeable.
source_requirements: Use contemporary participant statements, original technical documentation and investment records with disclosed classifications. Later publications may establish earlier facts, but later investment cannot settle the historical comparison.
