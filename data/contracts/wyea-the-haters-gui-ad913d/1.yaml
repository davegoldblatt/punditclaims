assessment_axis: causal_assessment
explicit_source_elements:
  - Apple Intelligence
  - radicalized millions of people against AI
  - mostly because it fucking stank
evaluator_interpretation:
  - The ordinary reading is that poor Apple Intelligence performance made at least two million people substantially more opposed to AI generally.
  - Radicalized is read as a substantial adverse attitude change, not political extremism.
  - Mostly because requires product performance to be the principal explanation for the claimed attitude changes.
  - Assess effects from the initial public rollout through the post date. Low usage, dissatisfaction and unwillingness to pay do not alone establish changed attitudes toward AI generally.
support_condition: Representative evidence identifies at least two million people whose attitudes toward AI became substantially more negative principally because of poor Apple Intelligence performance.
contradiction_condition: Adequately powered, representative causal evidence rules out an effect of that size or establishes that product performance was not its principal cause.
measurement_requirements: Measure prior and subsequent AI attitudes, Apple Intelligence exposure, performance experiences and competing causes; supply a defensible population estimate and uncertainty.
source_requirements: Representative longitudinal surveys, credible causal studies or equivalent population evidence. Product reviews and anecdotes are insufficient.
