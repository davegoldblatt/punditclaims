assessment_axis: causal_assessment
explicit_source_elements:
  - nobody actually knows
  - in any given quarter
  - current token spend
  - entirely experimental
  - which is why organizations keep burning through their tokens so fast
evaluator_interpretation:
  - The plain reading concerns practical quarterly budget predictability, not perfect advance knowledge of every dollar.
  - The claim makes a broad assertion that enterprise token spending lacks reliable forecasts and established uses, and that this experimentation causes rapid budget exhaustion.
  - A few overruns cannot establish the broad assertion, while evidence of reliable forecasts and established production spending would count against it.
  - The relevant spending practices are those current at the May 19 post; older and later surveys are context unless they describe that period.
support_condition: Representative enterprise forecast-versus-actual records show widespread inability to predict quarterly token costs, and usage records establish that experimental activity causes rapid exhaustion of budgets.
contradiction_condition: Contemporaneous records show reliably forecast quarterly costs and substantial established production spending, or identify other causes of the cited overruns that undermine the asserted causal explanation.
measurement_requirements: Compare forecasts fixed before a quarter with actual costs, distinguish token spending from other AI infrastructure costs, and separate experimental workloads from production workloads and price changes.
source_requirements: Dated enterprise budgets, invoices and workload records are preferred. Surveys must disclose their period and scope; tool availability alone does not demonstrate successful forecasting.
