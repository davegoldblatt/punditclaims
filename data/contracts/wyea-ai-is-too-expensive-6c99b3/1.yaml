ambiguity_flags:
  - Nobody may be rhetorical rather than a literal universal.
  - Knows does not specify an acceptable forecasting error.
  - Entirely experimental does not distinguish production use from experimentation with budgets.
  - Burning through tokens could mean exhausting purchased allowances or exhausting financial budgets.
