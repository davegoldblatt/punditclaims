evaluator_interpretation:
  - The definite factual assertion concerns NVIDIA GPUs reaching mainland China through the diversion channels discussed in the context.
  - The knowledge statement is expressly qualified as the speaker's judgment. It is not an assertion that knowing participation has been proved.
  - The context discusses prior shipments and investigations through the post date, without supplying a starting date. The historical interval therefore has an unspecified start and ends March 24, 2026.
  - Because the supplied claim combines arrival and knowledge, evidence of arrival alone cannot settle the entire proposition. The two components will be described separately.
support_condition: Reliable records establish actual GPU arrivals in China. Supporting the additional knowledge inference would require contemporaneous communications, testimony or other direct evidence showing relevant awareness by NVIDIA or Huang.
contradiction_condition: Reliable records disprove the alleged arrivals or establish that the relevant shipments were intercepted before reaching China. Specific evidence of successful concealment from NVIDIA could weaken the knowledge inference, but a denial alone would not settle it.
measurement_requirements: Distinguish completed shipments from attempted exports, mainland China from other destinations, and corporate or executive knowledge from smugglers' knowledge.
source_requirements: Court records, guilty pleas, shipment records or independently corroborated reporting. Indictment allegations must remain identified as allegations.
