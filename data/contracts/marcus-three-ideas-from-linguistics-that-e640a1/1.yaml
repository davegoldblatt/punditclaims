explicit_source_elements:
  - inadequate attention to these three factors
  - has serious consequences
  - the struggle in these models to avoid perpetuating bias and toxic speech
evaluator_interpretation:
  - The claim attributes some difficulty avoiding bias and toxicity to inadequate reference, cognitive models and compositionality. It does not say these are the only causes.
  - Support requires evidence about that causal connection, rather than evidence that biased or toxic outputs occur.
  - The relevant systems are the language models discussed in the June 2022 post. Later research may test the proposed mechanism, but later models alone cannot establish its historical importance.
support_condition: Controlled comparisons show that improving the specified capabilities materially reduces biased and toxic outputs, with competing explanations such as training data and safety fine-tuning addressed.
contradiction_condition: Well-controlled tests of the specified capabilities show that their inadequacy does not materially contribute to the reported difficulties. Improvement through another intervention alone is insufficient.
measurement_requirements: Measure both bias and toxicity, verify that the intervention changes the specified capabilities, and control relevant differences in data, model size and safety training.
source_requirements: Primary experimental studies with documented interventions, comparison groups and evaluations.
