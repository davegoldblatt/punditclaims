evaluator_interpretation:
  - Reliable ordinarily means consistently completing a broad range of delegated tasks without frequent consequential errors or human rescue. It does not mean infallible.
  - The knowledge qualifier expresses limited certainty; the assessment concerns publicly observable performance, not Marcus's private knowledge.
  - For this ongoing state, use July 2025 through publication as the latest reporting window. Earlier evaluations are background unless they establish performance of the products current in that window.
  - Success in a narrow application is compatible with the stated exception.
support_condition: Broad, contemporaneous evaluations of the major providers' current agents establish frequent consequential failures or intervention needs, with adequate coverage to support the claim that none was broadly reliable.
contradiction_condition: At least one major provider's agent demonstrably completed a broad range of ordinary tasks consistently, with low consequential error and intervention rates.
measurement_requirements: Report agent version, task coverage, repeated-run success, error severity and human intervention. Do not equate a model in a research framework with a different commercial agent.
source_requirements: Prefer independent evaluations with reproducible tasks and dated versions; distinguish demonstrations and testimonials from systematic measurements.
