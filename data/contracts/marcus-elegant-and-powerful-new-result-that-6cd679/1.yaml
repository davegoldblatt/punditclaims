evaluator_interpretation:
  - Assess the empirical assertion that contemporary popular neural models have substantial failures of systematic relational and compositional reasoning.
  - The metaphor about blurry memory and the standard expressed by ought are not separately measurable claims.
  - "Because model evaluations have no fixed quarterly reporting cycle, use the latest annual evaluation period available before the post: 2023, restricted to work preceding September 22."
support_condition: Controlled evaluations of contemporary widely used neural models show substantial failures when combining or transferring learned relationships and reasoning operations.
contradiction_condition: Relevant controlled evaluations show consistently reliable systematic transfer, with the alleged failures absent or attributable to invalid tests.
measurement_requirements: Identify models, tasks and generalization conditions; distinguish demonstrated failures from a claim that models merely memorize everything.
source_requirements: Primary empirical evaluations of contemporary models, with methods and results.
