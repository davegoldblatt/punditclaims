assessment_axis: historical_observation
explicit_source_elements:
  - If we assume
  - $120 billion in annual compute demand
  - tens of billions of dollars’ worth of data centers have been announced since
  - over 15 times
  - 70% to 90% of that demand
  - Anthropic and OpenAI’s unprofitable services
  - February’s Sightline Climate report
  - 190GW
  - a 1.35 PUE
  - $1.68 Trillion
evaluator_interpretation:
  - Treat $120 billion as a stipulated annual demand estimate, not a forecast antecedent requiring proof that it happened.
  - The claim concerns the February pipeline plus additional announcements through July 22, 2026.
  - The plain reading of over 15 times is a comparison of planned service capacity with current demand measured on compatible terms.
  - Interpret the 70%–90% figure as the two companies' combined share of the stipulated annual compute-demand total, without counting the same spending again at successive suppliers.
  - Annual demand is an estimated current annual pace; it is not company revenue, financing or the total value of multiyear contracts.
support_condition: A reconciled project inventory and comparable capacity-demand calculation establish a ratio above 15, while matching annual compute-spending evidence establishes a combined OpenAI and Anthropic share of 70%–90%. The description of their services as unprofitable also requires matching financial evidence.
contradiction_condition: Comparable evidence establishes a ratio at or below 15, a combined demand share outside 70%–90%, or profitability of the relevant services under an identified financial measure.
measurement_requirements: Use consistent geography, AI workload scope, delivery dates, utilization and prices. Convert capital investment and annual spending to comparable measures before calculating a ratio. Distinguish planned projects from operating or financed capacity.
source_requirements: Sightline's project inventory, dated subsequent project announcements, and independently supported compute-spending estimates or customer disclosures.
