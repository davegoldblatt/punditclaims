evaluator_interpretation:
  - The surrounding discussion makes dependable general operation beyond specially prepared locations the strongest contextual reading.
  - Prime time can also ordinarily mean useful commercial service within defined operating limits. That alternative must be considered.
  - Treat the ongoing operational observation as describing November 2023 through publication, the current reporting month. Earlier safety measurements are context, not measurements of that period.
  - No numerical crash-rate threshold or requirement of zero accidents is added.
support_condition: Contemporaneous deployment and safety records establish that dependable general driverless operation remained unavailable.
contradiction_condition: Contemporaneous records establish dependable general driverless operation. Reliable bounded commercial service would challenge the broader reading that autonomous cars were not ready for any practical commercial use.
measurement_requirements: Separate operating restrictions, commercial availability, and safety performance. Safety comparisons require comparable exposure and driving conditions.
source_requirements: Contemporaneous regulatory records, deployment documentation, and credible comparative safety measurements.
