assessment_axis: forecast_outcome
explicit_source_elements:
  - AI “Agents” will be endlessly hyped throughout 2025
  - but far from reliable
  - except possibly in very narrow use cases
evaluator_interpretation:
  - "The claim has two parts. (1) Hype: prominent industry figures and vendors heavily promote AI agents during 2025. (2) Reliability: on general multi-step tasks, agents complete well under most tasks or are judged unreliable by credible evaluators. Success in some narrow areas is allowed by his carve-out."
  - Whether coding agents count as a 'very narrow use case' is open. Here they are treated as a specialised domain, not as general-purpose agents.
support_condition: Evidence of heavy agent promotion in 2025, plus independent 2025 evaluations or credible experts showing that general-purpose agents fail a large share of realistic tasks.
contradiction_condition: Credible 2025 evidence that agents worked reliably across broad, varied real-world tasks, for example high completion rates on realistic workplace benchmarks, or wide dependable deployment beyond narrow niches. Alternatively, evidence that agents were not heavily hyped.
measurement_requirements: Agent benchmark completion rates and expert or analyst assessments from 2025, plus examples of 2025 agent promotion.
source_requirements: Benchmark papers, analyst reports, and statements by industry leaders.
metric_scope: null
original_horizon: throughout 2025
horizon_interval:
