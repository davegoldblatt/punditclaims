assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI and Anthropic
  - both burning billions of dollars a year
  - do not appear to have found a way to stop doing so
evaluator_interpretation:
  - The ordinary contextual reading is that each company incurs annual financial losses of multiple billions of dollars. Zitron explicitly includes noncash costs, so a cash-flow-only reading would omit part of his meaning.
  - Use calendar 2024, the latest completed annual period before the post. The surrounding discussion refers to that year's financial figures.
  - Interpret 'billions' as at least $2 billion for each company separately, not their combined total.
  - Interpret the second clause as an observation about a demonstrated route to ending losses as of publication, not a prediction that either company can never become profitable.
  - Cash burn, operating losses, net losses and gross compute spending must remain separate. Supporting the combined claim requires a defensible reconciliation of the measures used for both companies.
support_condition: Comparable 2024 financial evidence establishes at least $2 billion in annual losses for each company under the contextual interpretation, and contemporaneous evidence establishes that neither had demonstrated a sustainable route to ending those losses.
contradiction_condition: Comparable 2024 financial evidence establishes that either company's annual losses were below $2 billion, or contemporaneous evidence establishes a demonstrated sustainable route to ending losses that contradicts the second clause.
measurement_requirements: Separate realized annual results from forecasts and annualized figures. Reconcile noncash expenses and cash-flow timing before comparing cash burn with accounting losses. Funding and gross spending cannot substitute for losses.
source_requirements: Prefer financial statements. Otherwise use credible reporting based on financial records, identifying estimates and inaccessible underlying documents. Assess what appeared established by publication separately from later evidence about 2024.
