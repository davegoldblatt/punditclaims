explicit_source_elements:
  - OpenAI and Anthropic
  - both burning billions of dollars a year
  - do not appear to have found a way to stop doing so
evaluator_interpretation:
  - The numerical clause is a checkable historical observation. I read 'billions' as at least $2 billion annually for each company separately.
  - I use calendar 2024, the latest completed annual period before publication, for the numerical clause. The surrounding discussion explicitly concerns 2024 figures.
  - The context uses 'burning' broadly for financial losses, including noncash costs. It does not consistently mean cash burn as measured in a cash-flow statement.
  - The second clause expresses a qualified impression as of February 17, 2025. It does not assert that neither company has a plan, that neither can become profitable, or that losses will continue until a particular deadline.
  - The speaker supplies no objective threshold for 'appear to have found a way'. Requiring a demonstrated sustainable route would strengthen his words. Treating a management forecast as automatically refuting them would also remove the qualification.
  - Because the supplied claim combines a checkable financial observation with that unscorable appraisal, I do not assign a binary verdict to the whole statement.
support_condition: The financial clause would be supported by appropriately defined 2024 figures showing at least $2 billion of annual losses or burn for each company, retaining the distinction between those measures. There is no speaker-supplied observable condition that conclusively establishes the qualified appraisal; supporting the financial clause alone does not settle the combined statement.
contradiction_condition: The financial clause would be contradicted by comparable 2024 figures below $2 billion for either company under the intended measure. The existence of a plan or forecast alone does not contradict 'do not appear'. A definitive contradiction condition for that appraisal would require adding a threshold the speaker did not supply.
measurement_requirements: Assess each company separately. Identify whether a figure measures cash burn, operating loss, net loss, or a projection. Do not substitute one for another or treat projected annual results as completed results.
source_requirements: Prefer financial disclosures. Where contemporaneous primary figures are unavailable, use credible reporting with its attribution and limitations. Assess the qualified impression using information public by February 17, 2025; later developments cannot establish what appeared true then.
