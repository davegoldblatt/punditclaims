assessment_axis: forecast_outcome
explicit_source_elements:
  - If they keep their promises
  - by the end of 2025
  - Meta, Amazon, Microsoft, Google and Tesla
  - over $560 billion
  - capital expenditures on AI
  - in the last two years
  - around $35 billion
evaluator_interpretation:
  - The plain reading of the condition is that each named company fulfills its spending plan in place when the post appeared. Other companies overspending does not replace an individual company's unmet plan.
  - The two-year outcome period is calendar 2024–2025, following the heading and year-end deadline.
  - Making around $35 billion means aggregate AI revenue over those two years, rather than profit or financing.
  - The contextual calculation combines company spending plans with press and analyst revenue estimates, so its composite accounting basis is estimate.
  - Around has no numerical tolerance. I do not invent a tolerance that determines the result.
  - The single metric_scope records the compound claim; expenditure and revenue must still be tested separately.
support_condition: The antecedent is met, and comparable evidence shows aggregate AI capital expenditures above USD 560 billion and approximately USD 35 billion of realized AI revenue across the five companies during calendar 2024–2025.
contradiction_condition: The antecedent is met, but comparable evidence establishes that either the expenditure threshold or the approximate revenue amount failed. Failure of the antecedent is not a failed forecast.
measurement_requirements: Separate AI-only expenditure from total capital expenditure; reconcile fiscal and calendar years, cash expenditure and finance leases, and realized revenue and annualized run rates.
source_requirements: Spending guidance available at publication and subsequent financial disclosures available by 2026-10-28. Traceable secondary reporting may be used where the primary document cannot be read, with that limitation disclosed.
metric_scope:
  company: Meta, Amazon, Microsoft, Alphabet/Google, and Tesla, aggregated
  metric: AI capital expenditures above 560 billion and AI revenue around 35 billion
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2024-01-01
  period_end: 2025-12-31
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: by the end of 2025
horizon_interval:
  start: 2025-07-21
  end: 2025-12-31
  precision: day
target_period:
  start: 2024-01-01
  end: 2025-12-31
  precision: day
condition_status: not_met
early_resolution_rule: Resolve early only if completed, comparable disclosures irrevocably settle both financial components and establish fulfillment of every named company's spending condition. Interim spending or revenue projections are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Keeping promises could alternatively mean achieving an aggregate spending total.
  - The context combines Microsoft fiscal-year figures with other companies' calendar-year figures.
  - AI capital expenditure is not consistently separated from broader infrastructure expenditure.
  - The revenue calculation mixes annualized figures and annual estimates.
  - Around has no specified tolerance.
retrospective_or_prospective: retrospective
