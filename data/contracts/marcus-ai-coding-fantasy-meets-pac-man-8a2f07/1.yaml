evaluator_interpretation:
  - "'They' refers to the current AI coding tools discussed immediately before this sentence."
  - The plain reading is that substantial maintenance difficulties remain despite these tools. It does not claim that AI cannot improve maintenance.
  - I use January 1 through March 12, 2025 as the latest pre-publication reporting window for current tool capabilities.
  - "'Over time' requires evidence about continued upkeep or recurring maintenance needs, rather than code generation alone."
support_condition: Evidence concerning target-period tools shows substantial unresolved maintenance difficulties in complex repositories, including continued need for human upkeep.
contradiction_condition: Representative evidence shows that these tools reliably handle sustained maintenance of complex repositories without substantial remaining maintenance difficulties.
measurement_requirements: Identify tool versions, repository complexity, follow-up duration, regressions, maintainability measures, and human maintenance work.
source_requirements: Prefer longitudinal repository studies or documented maintenance deployments. Earlier-period studies are context unless their applicability to the target period is established.
