evaluator_interpretation:
  - Read this as an estimate of worldwide monthly active ChatGPT users across app and web access, counting overlapping users once.
  - Use January 2025, the latest completed calendar month before the February 24 post.
  - The range is approximate. Do not manufacture a numerical tolerance or decide the claim on a marginal boundary difference.
  - Website visits, website visitors, mobile-app users and weekly users cannot independently establish the cross-platform monthly total.
support_condition: A credible worldwide estimate or disclosure for January 2025, with cross-platform overlap addressed, places monthly active users approximately within 500–600 million.
contradiction_condition: A comparable January 2025 count or well-supported estimate places the total clearly outside that approximate range.
measurement_requirements: A defined activity threshold and monthly window, worldwide coverage, and deduplication across web, mobile apps, devices and accounts, with uncertainty explained.
source_requirements: Company usage records with a disclosed method or independent audience measurement covering the relevant month and platforms.
