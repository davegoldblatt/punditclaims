assessment_axis: forecast_outcome
explicit_source_elements:
  - Both companies burn billions of dollars
  - require an infinite amount of venture capital
  - the Saudi Public Investment Fund is struggling
  - the US venture capital system is set to run out of cash
  - in the next year and a half
evaluator_interpretation:
  - Assess the screened forecast about exhaustion of US venture capital, rather than issuing separate verdicts on every contextual clause.
  - The ordinary reading is system-wide exhaustion of available investment capital, not merely difficult fundraising for some managers.
  - Available investment capital means deployable fund capital, including callable commitments and replenishment through fundraising.
  - Eighteen months from December 8, 2025 ends on June 8, 2027.
  - The statements about AI-company financing and the PIF provide context; the forecast does not expressly make their continuation an antecedent.
  - Infinite is rhetorical and supplies no measurable funding amount.
support_condition: Reliable system-wide records establish exhaustion of deployable US venture-fund capital within the forecast interval.
contradiction_condition: At the deadline, material deployable capital remains and records show no earlier system-wide exhaustion during the interval.
measurement_requirements: Track available fund capital, capital calls, deployment and new fundraising. Investment deal value alone is not a measure of remaining cash.
source_requirements: PitchBook/NVCA or comparable comprehensive fund-level measurements, with clear coverage and reporting dates.
metric_scope: null
original_horizon: in the next year and a half
horizon_interval:
  start: 2025-12-08
  end: 2027-06-08
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Documented system-wide exhaustion of deployable US venture capital before the deadline would settle the forecast as supported. Continued fundraising or investment before the deadline does not settle it as contradicted.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Cash could mean literal cash balances, dry powder or broader investment capacity.
  - The sentence combines contextual observations with a dated forecast.
  - No numerical threshold for system-wide exhaustion is supplied.
retrospective_or_prospective: prospective
