ambiguity_flags:
  - "'Burns' could mean accounting net loss or cash burn. Reported cash burn for the first half of 2024 was much lower than the net loss. The plain reading in November 2024 was the reported ~$5B loss."
  - "'A year' names no period. Read as calendar 2024, the year in progress at the time of the post."
