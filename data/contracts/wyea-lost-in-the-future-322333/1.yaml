assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI being "worth" $157 billion
  - burns $5 billion or more a year
  - destroys our environment
  - yet to find any real meaning
evaluator_interpretation:
  - The ordinary financial reading of 'burns' is net cash consumption at an annual rate, although the speaker may be referring loosely to reported annual losses.
  - For the ongoing burn-rate observation, use the latest completed calendar quarter before the post, July through September 2024. This is an evaluator-selected reporting interval, not a period supplied by the speaker.
  - The valuation refers to the latest financing valuation before the post. It is a separate stock measure and cannot establish annual cash burn.
  - The contract's metric_scope records the principal quantified burn claim. The passage does not identify its accounting basis or explicitly attribute it to company figures or press estimates, so that basis remains unknown.
  - "'Destroys our environment' has no stated footprint threshold. 'Real meaning' and deserving coverage are evaluative judgments; neither is treated as a claim of literally zero useful applications."
support_condition: Comparable financial evidence establishes a current annual net cash-burn rate of at least USD 5 billion on an identified basis, with the separate valuation established by financing records. Resolving the broader environmental wording would additionally require an interpretable harm criterion and matching footprint evidence.
contradiction_condition: Comparable evidence establishes an annual net cash-burn rate below USD 5 billion on the same basis, or financing records refute the valuation. Different-period losses or cash flows cannot establish either result.
measurement_requirements: Keep valuation, projected losses and cash burn separate. Identify the measurement period, annualization method, treatment of noncash expenses and accounting basis. Do not convert an approximate loss forecast into a firm cash-burn floor.
source_requirements: Prefer financing disclosures and cash-flow records. Attribute press estimates explicitly when public financial statements are unavailable.
