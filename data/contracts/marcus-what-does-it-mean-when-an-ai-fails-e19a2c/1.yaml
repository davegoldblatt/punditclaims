assessment_axis: historical_observation
explicit_source_elements:
  - GPT-3 is genuinely better than GPT-2
  - for any given example, the probability of a correct answer has gone up
  - maybe (but maybe not, see footnote 1)
evaluator_interpretation:
  - Read 'genuinely better' as a broad improvement in measured task accuracy, without implying that the underlying reasoning problems were solved.
  - "Assess 'any given example' separately: read literally, it extends the improvement to every example. If it instead means a general tendency, the overall assessment would be supported rather than mixed."
  - Use correct-answer rates under comparable testing conditions as the observable measure. These rates do not directly measure the probability assigned to each individual answer.
  - The context compares the models retrospectively across 2020 and the period leading up to the June 2022 post. Use January 1, 2020 through the post date as the reporting window; the year-start boundary is a convention, not a claimed event date.
  - The InstructGPT qualification expresses uncertainty. It is neither a firm superiority claim nor a condition that must occur before assessing GPT-3 versus GPT-2.
support_condition: Comparable evaluations show substantial accuracy gains for GPT-3 across multiple tasks. Supporting the stronger per-example wording additionally requires evidence that improvement extends to individual examples under specified prompting and decoding conditions.
contradiction_condition: Comparable evaluations show no broad improvement, or show lower correct-answer rates in particular matched settings, contradicting the unrestricted reading of improvement on any example. Broad gains alongside such exceptions warrant a mixed assessment.
measurement_requirements: Compare GPT-3 and GPT-2 on the same datasets, task formats, number of demonstrations, and decoding method. Distinguish ordinary decoding from calibrated outputs and dataset accuracy from individual-answer probabilities.
source_requirements: Primary benchmark reports available before the evaluation cutoff, describing the models and testing methods. Prefer independent comparisons and retain material exceptions.
