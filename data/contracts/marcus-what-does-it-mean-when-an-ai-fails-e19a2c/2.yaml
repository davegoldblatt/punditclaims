ambiguity_flags:
  - "'Genuinely better' names no benchmark, task distribution, or improvement threshold."
  - "'Any given example' could express a general tendency or a strict universal statement."
  - No sampling settings or definition of correct-answer probability are supplied.
  - The observation has no reporting interval; the contextual 2020-to-post comparison is used.
  - A reading limited to broad benchmark improvement would receive stronger support than the combined accuracy-and-probability reading.
