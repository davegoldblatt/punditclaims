assessment_axis: historical_observation
explicit_source_elements:
  - GPT-3 is genuinely better than GPT-2
  - for any given example, the probability of a correct answer has gone up
  - maybe (but maybe not, see footnote 1)
  - at least for GPT-2 to GPT-3
evaluator_interpretation:
  - The ordinary reading of 'genuinely better' is a broad improvement in task performance. It does not require improvement on every benchmark.
  - The probability statement concerns the chance of producing a correct answer when an example is held fixed. Comparable benchmark accuracy can establish broad improvement, but does not directly measure that probability.
  - I do not interpret 'any given example' as a formal universal claim whose entire assessment can be overturned by one exception. I look for a general improvement across matched examples.
  - InstructGPT's superiority is explicitly left uncertain. This is neither a firm assertion of superiority nor a condition on the GPT-2-to-GPT-3 comparison.
  - The target period covers the capability comparison discussed retrospectively from 2020 through the post. These are model capabilities, not a financial reporting flow; the relevant state is that of the models available by June 7, 2022.
support_condition: Comparable evaluations show broad improvement from GPT-2 to GPT-3, and matched-prompt probability measurements or repeated sampling show that correct-answer probability generally increased under comparable settings.
contradiction_condition: Comparable evaluations show no broad improvement, or direct probability measurements or repeated sampling establish that correct-answer probability generally failed to increase on matched examples. Lower greedy-decoding accuracy alone does not contradict the probability statement.
measurement_requirements: Identify model versions, use the same examples and correctness criteria, and control prompting and decoding settings. Distinguish accuracy of the selected answer from probability assigned to correct answers. Repeated sampling should report uncertainty; probability measurements should account for alternative correct formulations.
source_requirements: Primary evaluations of the relevant GPT-2 and GPT-3 models, with methods and results available by October 28, 2026. Later publications must concern the models and capabilities within the target period.
