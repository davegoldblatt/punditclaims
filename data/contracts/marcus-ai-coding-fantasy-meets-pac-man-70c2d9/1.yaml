assessment_axis: forecast_outcome
explicit_source_elements:
  - AI will be a tool to help people write code
  - AI will not soon replace people
  - conceive of, write, and debug code
evaluator_interpretation:
  - Replace refers to broad substitution for skilled developers across the combined responsibilities of conceiving, writing, and debugging software.
  - The claim does not rule out individual job losses, fewer hires, or automation of substantial coding tasks.
  - Soon supplies no fixed deadline. The screeners' suggested 2026 cutoff is not a deadline Marcus stated.
  - The spell-checker comparison expresses an assisting role; it is not a measurable ceiling on the amount of work AI may perform.
support_condition: Over an agreed near-term period, representative production evidence shows AI assisting developers while people retain the integrated responsibilities of conception, implementation, and debugging.
contradiction_condition: Verified, widespread production practice demonstrates that AI has substituted for skilled developers across those integrated responsibilities within the near term after publication.
measurement_requirements: Combine evidence of production responsibilities and human oversight with employment and hiring evidence. Code volume, benchmark scores, and isolated deployments do not alone establish occupational replacement.
source_requirements: Prefer original workplace studies, official employment data, and documented production deployments. Separate task automation from replacement of people and account for company-specific conditions.
metric_scope: null
original_horizon: soon
horizon_interval:
  start: 2025-03-12
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, independently corroborated transition to widespread production replacement across conception, coding, and debugging could contradict the claim early. Continued assistance cannot conclusively establish an indefinite negative forecast.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Soon has no fixed endpoint.
  - Replace does not specify the fraction of workers or organizations affected.
  - The occupation-wide reading follows the surrounding discussion but is not a numerical threshold.
  - The spell-checker analogy could be read more narrowly than the substantive assistance claim.
retrospective_or_prospective: retrospective
