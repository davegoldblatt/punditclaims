assessment_axis: forecast_outcome
explicit_source_elements:
  - The capacity never existed
  - this deal will never happen
  - Oracle’s OpenAI-driven remaining performance obligations
evaluator_interpretation:
  - The main forecast concerns performance of the Oracle–OpenAI compute agreement identified in the context, not merely signing an agreement.
  - Actual delivery and paid use attributable to that agreement would refute the ordinary meaning of 'will never happen'; completion of every promised facility is not required.
  - The historical capacity assertion concerns capacity associated with that agreement before the post. Capacity under a separate or earlier agreement cannot automatically settle it.
  - The surrounding text supplies a $300 billion contract figure but does not identify its accounting or reporting basis.
support_condition: Definitive termination or extinguishment of the identified agreement without substantive delivery or paid use, together with records establishing that its promised capacity had not existed before the post.
contradiction_condition: Documented delivery and payment for compute under the identified agreement, or direct evidence that the capacity denied by the historical assertion already existed.
measurement_requirements: Identify the agreement and connect customer acceptance, operational capacity, and payment to it. Distinguish contracted future capacity from operational capacity and RPO from revenue.
source_requirements: Contract records, customer-specific company disclosures, filings, or independently verified delivery and payment records available by 2026-10-28.
metric_scope:
  company: Oracle and OpenAI
  metric: Performance of the compute purchase commitment identified in the context
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve against the forecast upon verified substantive delivery and payment under the identified agreement. Resolve for it only upon definitive extinguishment without performance; delay alone is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The boundaries between the referenced agreement, Abilene, and the wider Stargate program are unclear.
  - "'The capacity' could mean any operational capacity or the entire promised buildout."
  - "'Will never happen' has no deadline."
  - The monetary reporting basis is unspecified.
retrospective_or_prospective: retrospective
