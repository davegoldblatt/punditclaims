  - DALL-E
  - a blue cube is on top of a red cube
  - both a blue cube and a red cube
  - as likely as not
  - the red cube winds up on top
evaluator_interpretation:
  - As likely as not is read as approximately half or more, rather than merely sometimes.
  - The preceding sentence suggests a denominator of outputs containing both correctly colored cubes; an evaluation should also report the rate across all outputs.
  - DALL-E's version is unspecified. Evidence about DALL-E 2 is relevant but cannot silently fix that ambiguity.
  - The observation concerns the current calendar year through publication, 2022-01-01 to 2022-06-22, rather than later product versions.
support_condition: An adequately sized, unselected sample from the relevant contemporary DALL-E version, using the stated two-cube prompt, shows approximately half or more of eligible outputs placing the red cube above the blue cube.
contradiction_condition: Comparable sampling shows that reversed stacking is clearly uncommon and inconsistent with approximately half, with uncertainty reported.
measurement_requirements: Exact prompt, model version, generation settings, sample size, unselected outputs, clear scoring rules and uncertainty. Separate reversed order from missing cubes, wrong colors and other failures.
source_requirements: A primary experiment or archived generation record matching the prompt and period. General binding failures or selected images cannot establish a frequency.
