explicit_source_elements:
  - little compelling evidence
  - providing any inference-based services is profitable
evaluator_interpretation:
  - This concerns the public evidence available on July 7, 2026, rather than asserting that every inference provider loses money.
  - The target period is the publication-day state of the evidence. Earlier financial disclosures are relevant context, but their financial event dates are not changed to publication day.
  - Profitability means realized profit attributable to operating an inference service. The wording does not specify whether gross contribution or fully allocated operating profit is sufficient.
  - The hypothetical survival of open-source AI is explanatory context, not a separate forecast being scored.
support_condition: A sufficiently comprehensive review establishes that credible public disclosures of realized inference-service profit were sparse at publication.
contradiction_condition: Substantial credible public disclosures available at publication establish realized inference-service profits on an adequately specified cost basis.
measurement_requirements: Service-level realized revenue and costs, with explicit treatment of hardware, hosting, utilization, staff and shared expenses. Distinguish contribution margins from operating and net profit.
source_requirements: Prefer financial statements or company service-level disclosures. Credible reporting on private financial records may inform the assessment, with its limitations stated.
