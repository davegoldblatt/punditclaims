evaluator_interpretation:
  - Read the analogy as describing differentiated alternatives in substantially overlapping assistant, coding, and knowledge-work markets.
  - Do not interpret 'slightly different' as numerical performance parity or identical product portfolios.
  - Treat 'loyal fans' as ordinary brand preference rather than a specified retention-rate claim.
  - Use the week of the post, February 2–8, 2026, matching its discussion of this week's competition and Super Bowl campaigns.
support_condition: The companies offer broadly substitutable products for core assistant, coding, and professional-work tasks and demonstrably compete for overlapping users.
contradiction_condition: Their principal offerings and intended customers occupy substantially separate markets, or their core functions are too different to be practical alternatives under this ordinary reading.
measurement_requirements: Compare advertised functions, intended users, product releases, and documented customer competition. Distinguish broad overlap from equality on every capability.
source_requirements: Use dated product announcements for offerings and independent reporting or customer research for competition.
