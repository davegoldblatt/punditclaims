explicit_source_elements:
  - Sora — OpenAI’s video creation tool
  - replace actors or animators
  - No, not at all
evaluator_interpretation:
  - The plain reading concerns practical substitution for actors’ or animators’ substantive production work using Sora available at publication.
  - A production may retain directors, editors and other staff while replacing an actor or animator. Complete automation of filmmaking is not required.
  - A documented substitution need not involve firing an existing employee; avoiding otherwise necessary acting or animation work can qualify.
  - With no reporting calendar specified, I use the current calendar year through publication as the latest reportable capability period. Earlier productions provide context.
support_condition: Representative production evidence establishes that Sora could not perform the relevant acting or animation work to usable production standards without humans supplying that substantive work.
contradiction_condition: A documented production in the target period uses Sora output to substitute for substantive acting or animation work, with sufficient workflow detail to distinguish substitution from assistance.
measurement_requirements: Identify the Sora version, production dates, generated material and human contributions. Distinguish a completed production from a planned project and generated imagery from documented role substitution.
source_requirements: Prefer production records, credits and firsthand workflow accounts. Demonstrations can establish capabilities but require workflow evidence to establish substitution.
