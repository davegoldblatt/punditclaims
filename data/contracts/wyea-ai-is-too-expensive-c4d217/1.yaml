evaluator_interpretation:
  - Assess infrastructure capital expenditure attributable to OpenAI, excluding equity investments and operating costs of hosting its workloads.
  - "Use July 1, 2022 through March 31, 2026: the stated FY2023 start through the latest reported quarter before publication."
  - The context allows company-reported capex including finance leases, rather than only cash purchases of property and equipment.
  - Treat the attributed amount as an estimate derived from reported testimony. 'Around' permits ordinary rounding, but does not permit changing the cost category or period.
support_condition: A comparable-period allocation shows approximately $87 billion of OpenAI infrastructure capex and approximately a 30% share of Microsoft's total capex.
contradiction_condition: A comparable-period allocation establishes an OpenAI infrastructure capex amount or share materially inconsistent with those approximations.
measurement_requirements: Reconcile cash capex, finance leases, operating hosting expenses, equity investments, and commitments. Numerator and denominator must use the same period and treatment of leases.
source_requirements: Microsoft capex records plus a documented allocation to OpenAI. A combined partnership spending figure without a capital-versus-operating split is insufficient.
