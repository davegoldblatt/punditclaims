explicit_source_elements:
  - Three companies
  - have not yet shown themselves to be profitable
  - are expected to soon IPO
  - a total of something like four trillion dollars
evaluator_interpretation:
  - This describes expectations existing at the post date, rather than promising that the IPOs will occur by a deadline.
  - The likely companies are SpaceX, OpenAI, and Anthropic, but the supplied passage does not name them.
  - The monetary amount means combined anticipated equity valuations, not money raised.
  - The current-state assessment covers May 1–26, 2026. Soon means a near-term anticipated listing, without an invented deadline.
  - The valuation is treated as a press or analyst estimate. The profitability clause has no specified accounting basis or financial reporting period.
  - Something like permits ordinary rounding, but not combining incompatible valuation measures or dates.
support_condition: Contemporaneous records identify three near-term IPO candidates with combined anticipated equity valuations reasonably described as approximately $4 trillion, and establish that none had demonstrated company-wide profitability.
contradiction_condition: Comparable contemporaneous records establish a materially different combined valuation, refute the near-term IPO expectations, or show demonstrated company-wide profitability for at least one of the identified companies.
measurement_requirements: Match all three company identities, valuation dates, expected IPO equity values, and profitability definitions. Keep private funding valuations, IPO proceeds, operating profit, and net profit distinct.
source_requirements: Contemporaneous filings or company disclosures where available; otherwise credible reporting of private-company finances and listing expectations.
