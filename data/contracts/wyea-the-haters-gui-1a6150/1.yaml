assessment_axis: forecast_outcome
explicit_source_elements:
  - needs to convert by the end of the year
  - or it's effectively dead
evaluator_interpretation:
  - The deadline is December 31, 2025.
  - Conversion means completing the contemplated restructuring of OpenAI's commercial business. It does not require abolishing nonprofit control.
  - Effectively dead means unable to obtain sufficient financing or sustain substantive operations.
  - The deadline explicitly applies to conversion; the timing of the predicted business failure is less clear.
  - This assessment covers the normalized conditional forecast, not the separate statements about annual losses or continual funding.
support_condition: OpenAI fails to complete the restructuring by December 31, 2025, and that failure makes its business financially or operationally unviable.
contradiction_condition: OpenAI fails to complete the restructuring by December 31, 2025, but demonstrably retains durable financing and substantive operating viability.
measurement_requirements: Establish completion of the restructuring first. Examine financing and operating viability only if the failure-to-convert condition occurred.
source_requirements: Dated corporate announcements, legal records or regulatory records establishing completion; financing and operating records if the condition occurred.
metric_scope: null
original_horizon: by the end of the year
horizon_interval:
  start: 2025-07-21
  end: 2025-12-31
  precision: day
target_period: null
condition_status: not_met
early_resolution_rule: Completed restructuring before the deadline establishes that the conditional forecast's antecedent did not occur; it does not establish whether the predicted consequence was correct.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Conversion does not specify whether nonprofit control must end.
  - Effectively dead has no stated financial or operational threshold.
  - The conversion deadline is explicit, but a separate deadline for business failure is not.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: true
