explicit_source_elements:
  - Success on a few problems
  - in no way guarantees
  - all problems in a similar way
  - unreliability, bizarre errors, failures in compositionality and discomprehension
  - have not changed since Fodor and Pinker pointed them out
  - in separate articles
  - in 1988
evaluator_interpretation:
  - The checkable historical assertion is that the broad kinds of failure identified in the 1988 critiques remained present in neural systems by May 14, 2022.
  - I read 'have not changed' as persistence of failure categories, rather than identical error rates, unchanged architectures, or no progress on individual problems.
  - I read compositionality as applying familiar components in unfamiliar combinations, and discomprehension as observable errors in interpreting meaning.
  - The target period follows the explicit comparison from 1988 through the post date. It does not extend to systems introduced after the post.
  - The statement about guarantees is a logical caution, and 'inductive folly' is an evaluative judgment. Neither is treated as a separate empirical forecast or as a prediction that neural methods can never succeed.
support_condition: The original critiques identify problems with systematic generalization and language processing, and research available by the post documents analogous compositional, comprehension, and unreliable or anomalous output failures in contemporary neural systems.
contradiction_condition: The original articles do not identify the relevant problems, or evidence establishes that the broad failure categories had been overcome by the post date. Improvements on particular tasks alone do not contradict persistence of the categories.
measurement_requirements: Compare the original arguments with documented tests of neural systems available by May 14, 2022. Distinguish persistence of a category from unchanged frequency, severity, mechanism, or performance.
source_requirements: Use the original 1988 articles and primary empirical research. Include research showing that particular historical objections were overcome.
