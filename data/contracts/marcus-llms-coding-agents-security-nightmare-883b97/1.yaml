assessment_axis: causal_assessment
explicit_source_elements:
  - have already led multiple “vibe coders” to lose databases
  - new reports coming in every day or two
  - stemming simply from the unreliability inherent in LLMs
evaluator_interpretation:
  - Multiple means at least two distinct users. Losing a database includes deletion followed by recovery; permanent loss is not explicitly required.
  - The historical scope ends on the post date. No starting date is supplied, so the target period has an unspecified start.
  - The report-frequency assertion concerns distinct incident reports near publication, rather than repeated coverage of one incident. Marcus supplies no duration over which that frequency should hold.
  - The causal assertion requires evidence connecting erroneous LLM-directed actions to deletion. An agent's explanation of its own behavior is not a technical postmortem.
  - The word simply is read as identifying the principal explanation, without assuming Marcus denied the necessary role of database access.
support_condition: At least two distinct pre-publication database losses are attributable to erroneous autonomous LLM actions; a dated series establishes new incident reports approximately every one or two days near publication; and technical evidence supports the proposed principal cause.
contradiction_condition: Reliable incident records refute the asserted multiplicity or reporting frequency, or technical investigations establish materially different causes for the incidents offered as examples. Failure to find reports alone is insufficient.
measurement_requirements: Deduplicate reports by incident and user. Separate incident dates from publication dates, databases from ordinary files, and temporary deletion from permanent loss. Assess causation using execution records and postmortems.
source_requirements: Contemporaneous firsthand reports, vendor acknowledgments, and technical postmortems. Anonymous reports require qualification.
