evaluator_interpretation:
  - This is a publication-date index-exposure calculation, not a forecast that the hypothetical selloff will occur.
  - The ordinary reading compares percentage index losses with the April 14, 2000 session identified immediately before the sentence.
  - Apply a simultaneous 20% decline to the named constituents while holding other constituents unchanged. Additional contagion is not specified.
  - Test the Nasdaq Composite and S&P 500 separately. Nasdaq-100 weights cannot substitute for Composite weights.
  - The sentence excludes Microsoft, while its heading includes Microsoft. Both baskets require separate calculations.
  - Use the October 20, 2026 publication-date snapshot. The source does not identify an intraday timestamp or a numerical tolerance for 'around' and 'same'.
support_condition: Independently verified publication-date weights imply approximately the cited historical percentage losses when the named basket falls about 20%, with any Microsoft-dependent difference disclosed.
contradiction_condition: Verified publication-date weights imply materially different index losses under both reasonable basket readings, or show that the claimed equivalence depends on substituting a different index.
measurement_requirements: For each index, calculate hypothetical return as minus 0.20 multiplied by the sum of the basket's constituent weights. Include both Alphabet share classes where applicable, verify membership, and obtain the historical comparison from an independent record.
source_requirements: Dated index-provider constituent weights are preferred. Any fund-holdings proxy must match the publication date and disclose tracking differences. Historical index returns require an independently readable source.
