assessment_axis: historical_observation
explicit_source_elements:
  - Important aspects of commonsense reasoning
  - most forms of spatial and physical reasoning
  - remain untested in any of these benchmarks
  - We do not yet have a good reliable way
  - measuring how much commonsense reasoning an AI can carry out
evaluator_interpretation:
  - The coverage assertion concerns the union of existing commonsense benchmarks, not whether each individual benchmark is comprehensive.
  - Most forms means a majority of meaningful reasoning categories under a defensible taxonomy, rather than a majority of imaginable individual questions.
  - A good reliable measure means a validated assessment of broad commonsense reasoning that generalizes beyond its particular test items.
  - The relevant benchmark inventory is the one available on the post date. Individual benchmark scores can be useful without constituting the broad measure claimed to be missing.
support_condition: An independent coverage audit establishes that the benchmark inventory collectively omits most meaningful spatial and physical reasoning categories, alongside evidence of missing or inadequate validation for broad commonsense measurement.
contradiction_condition: An independent audit establishes coverage of most relevant categories, or validation establishes an existing reliable broad measure. Evidence for opposing components would warrant mixed rather than a blanket verdict.
measurement_requirements: A defined benchmark inventory, a defensible category taxonomy, coverage across the inventory, and evidence about reliability and generalization of broad scores.
source_requirements: Independent benchmark documentation and coverage or validation studies. The authors' own survey is useful for scope, but cannot independently corroborate the conclusion.
