ambiguity_flags:
  - Fully has their back does not identify a particular commitment or degree of support.
  - No longer supplies no explicit comparison date.
  - February 2025 is an evaluator-selected reporting window for the ongoing state.
  - Reduced exclusivity can reflect either reduced backing or an accommodation that supports expansion.
