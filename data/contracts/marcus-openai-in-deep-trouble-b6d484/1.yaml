explicit_source_elements:
  - Microsoft
  - no longer
  - fully has their back
evaluator_interpretation:
  - Their refers to OpenAI.
  - The ordinary reading is that Microsoft materially reduced its willingness to support OpenAI relative to the earlier partnership. The claim does not say Microsoft ended all support.
  - A material withdrawal or refusal of previously expected infrastructure, financial or strategic support would qualify.
  - "Permission to use other suppliers does not alone establish reduced backing: it could also help OpenAI expand."
  - For this ongoing observation, the target is February 2025, the latest complete month before publication. Earlier partnership changes and later explanations are context unless they establish the state during February.
  - This is a qualitative partnership claim, not a specified financial or compute-commitment amount.
support_condition: Reliable evidence establishes that, during the target period, Microsoft had materially withdrawn or declined previously expected support for OpenAI's expansion or strategy.
contradiction_condition: Reliable evidence establishes that the alleged reductions did not occur and that Microsoft maintained the relevant scope of backing during the target period. Continued support alone does not disprove a partial reduction.
measurement_requirements: Compare the earlier and current scope of actual support. Distinguish exclusivity rights, supplier diversification, capacity shortages and deliberate withdrawal of backing.
source_requirements: Prefer partnership agreements, direct company statements or records of decisions. Use reputable reporting for private decisions, with its sourcing limitations stated.
