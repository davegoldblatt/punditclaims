horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, sustained pattern of GE-like decline across major technology companies, with evidence establishing the shareholder-policy cause and distinctively severe sector effects.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Uniquely supplies no comparison group or magnitude.
  - The GE analogy supplies no numerical decline threshold or duration.
  - Shareholder supremacy is not an independently measured policy category.
  - No deadline is supplied.
