assessment_axis: forecast_outcome
explicit_source_elements:
  - Shareholder Supremacy
  - contorting companies to please analysts and investors
  - will uniquely punish the tech industry
  - just like it did to General Electric
evaluator_interpretation:
  - The forecast concerns sustained deterioration in major technology companies' economic position, comparable to the GE decline invoked in the passage.
  - Shareholder-first policies must cause the deterioration; their coexistence with a downturn is insufficient.
  - Uniquely is read as distinctively severe relative to other sectors, not as claiming that only technology can suffer, since GE is itself the comparison.
  - The GE reference is a historical analogy, not evidence that the technology-sector forecast has occurred.
  - No deadline is supplied.
support_condition: Broad, sustained GE-like decline or distress-driven restructuring among major technology companies, credibly caused by shareholder-first policies and distinctively severe relative to comparable sectors.
contradiction_condition: Decisive evidence ruling out the asserted causal and sector-specific consequences. A temporary recovery or successful individual firm would not suffice.
measurement_requirements: Longitudinal evidence of economic deterioration and restructuring, a credible causal comparison separating shareholder policies from other causes, and cross-sector evidence addressing uniquely.
source_requirements: Filings, industry statistics and credible causal research. GE's experience alone cannot establish the technology-sector outcome.
