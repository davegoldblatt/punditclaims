explicit_source_elements:
  - connect something to something else
  - does not mean that anything useful happens
  - LLMs are extremely bad
  - deterministic actions
  - the modern knowledge economy
  - especially when choosing to do them based on their interpretation of human language
evaluator_interpretation:
  - The plain reading is that LLM-driven systems are broadly unreliable at completing rule-bound workplace actions correctly when given natural-language instructions.
  - Deterministic actions means actions with checkable requirements or state changes, not a requirement that a probabilistic model generate identical tokens.
  - Mere connectivity does not guarantee usefulness; this is not read as claiming that every connected system is useless.
  - Especially identifies an emphasized use case, not a conditional forecast requiring an antecedent.
  - Use January through March 2026, the latest completed quarter before the post, because the ongoing observation supplies no reporting period.
  - No numerical cutoff is imposed on extremely bad.
support_condition: Reproducible, reasonably representative evaluations show frequent incorrect or harmful completion of rule-bound workplace tasks, including action selection from natural-language instructions.
contradiction_condition: Comparable evaluations show consistently reliable end-to-end completion across a reasonably representative range of those tasks. Success in selected domains challenges a blanket characterization but does not alone establish broad reliability.
measurement_requirements: Measure end-to-end task correctness, unintended changes, repeated-run consistency, and sensitivity to instruction wording. Preserve model version, tools, task difficulty, retry budget, and human oversight.
source_requirements: Dated benchmark methods, tasks, grading rules, and results; independent evaluations preferred. Vendor testimonials must remain distinguished from reproducible measurements.
