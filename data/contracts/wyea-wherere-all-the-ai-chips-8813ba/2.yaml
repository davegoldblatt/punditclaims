evaluator_interpretation:
  - The sentence opens with "It appears that", and the timing part is hedged again with "likely". The speaker offers an inference, not a firm factual claim.
  - "\"Being vague ... to hide\" is a claim about Microsoft's motive, which cannot be checked."
  - Microsoft does not disclose the value of GPUs bought but not installed or powered, so the size claim ("hundreds of billions") rests on the speaker's estimates.
  - Under the register's policy, a hedged inference is not scored. It is recorded as not adjudicable.
support_condition: Not scored. It could only be supported if a primary source showed Microsoft held GPUs worth hundreds of billions of dollars that were uninstalled or unpowered, and that it withheld this on purpose.
contradiction_condition: Not scored. It could only be contradicted if a primary source showed Microsoft's uninstalled or unpowered GPU stock was far below hundreds of billions of dollars.
measurement_requirements: None, because the claim is not scored. A score would need a disclosed value of GPUs held but not in service.
source_requirements: Microsoft filings or executive statements quantifying GPUs not yet installed or powered.
