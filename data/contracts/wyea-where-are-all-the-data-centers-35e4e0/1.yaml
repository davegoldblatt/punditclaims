  - very, very few data centers are actually getting finished
  - if that’s true
  - years worth of chips
  - yet to be digested
evaluator_interpretation:
  - This is a tentative observation followed by a conditional inference about existing chip inventory, not a forecast with a future deadline.
  - The speaker supplies no completion population, comparison rate or period for 'very, very few'.
  - "'Years worth' requires a deployment rate or other denominator, and 'digested' could mean installed, operational or economically utilized."
  - Selecting those definitions would create a quantitative commitment the speaker did not supply.
support_condition: A stable definition of the antecedent and of chip absorption would first be needed; then matched completion and inventory records would have to establish both.
contradiction_condition: Under those same definitions, reliable records would need to rule out the proposed completion shortage or the claimed multi-year chip backlog. The wording alone does not supply those definitions.
measurement_requirements: A specified project population and completion period, a count of shipped but unabsorbed chips, and a defined annual absorption rate.
source_requirements: Representative completion records and customer-level deployment or inventory records. Revenue and shipments alone would not establish unused inventory.
