assessment_axis: forecast_outcome
explicit_source_elements:
  - hyperscalers
  - brutal depreciation charges or onerous write-offs
  - for years to come
  - whether their capacity turns into revenue or not
evaluator_interpretation:
  - The plain reading is a severe and persistent earnings burden from AI infrastructure depreciation or impairment across major hyperscalers.
  - Hyperscalers is read to include Microsoft, Alphabet, Amazon, Meta and Oracle; the speaker supplies no company list.
  - Years to come requires a multiyear pattern but supplies no final deadline.
  - Whether capacity produces revenue is an unconditional assertion, not an antecedent that must occur before assessment.
  - Ordinary depreciation, or an increase in its dollar amount alone, does not establish the claimed severity.
  - The sentence supplies no accounting basis, currency or numerical threshold. Accounting basis remains unknown, which bars a supported or contradicted money assessment under the stated rules.
support_condition: Comparable multiyear financial statements show depreciation or AI infrastructure impairments imposing a severe, persistent burden relative to earnings across major hyperscalers, under a clarified accounting basis.
contradiction_condition: Under a clarified accounting basis and assessment period, representative multiyear results show depreciation and impairments remaining manageable relative to earnings, without the claimed severe burden. A single profitable quarter cannot settle the forecast.
measurement_requirements: Separate depreciation from amortization, other cash-flow adjustments and impairments. Identify AI infrastructure where possible, normalize useful-life changes, and compare charges with earnings over multiple years.
source_requirements: Company financial statements and accounting notes, preferably audited, with consistent company, period and accounting scope.
