ambiguity_flags:
  - No reliability threshold or task distribution is specified.
  - The contextual exception for narrow use cases limits what counts as a counterexample.
  - Solving hallucination may mean elimination or dependable system-level control.
  - The distinction between hallucinations and other reasoning errors is unspecified.
