assessment_axis: causal_assessment
explicit_source_elements:
  - you can't build reliable agents unless you can solve the hallucination problem
  - there is still no principled trustworthy answer to that problem
evaluator_interpretation:
  - "The first part is a necessity claim: reliable agents need hallucination solved first. It can be refuted by agents widely accepted as reliable while their models still hallucinate. It cannot be confirmed directly, only fail to be refuted."
  - "The second part describes the state of the field at the post date and after: no principled, trustworthy fix for hallucination."
  - No time period is stated. I assess it from evidence up to the evaluation date.
support_condition: Hallucination remains unsolved, and no agents widely accepted as reliable exist; agent failures are traced in part to fabrication.
contradiction_condition: Agents widely accepted as reliable for open-ended tasks are deployed while their underlying models still hallucinate, or hallucination is shown to be solved in a principled way.
measurement_requirements: Evidence on hallucination status and on whether any agents are judged reliable despite it.
source_requirements: Research papers from model developers; independent benchmarks of agents.
