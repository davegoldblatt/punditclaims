evaluator_interpretation:
  - The context makes this a claim about the organization promised in exchange for Musk's support, not a claim about a financial return or a particular amount of money.
  - The ordinary reading compares documented commitments associated with Musk's contributions against the organization that existed by March 1, 2024.
  - Changes Musk agreed to must be considered; his later dissatisfaction alone does not establish an unfulfilled commitment.
  - The target period covers the founding discussions and subsequent contributions through the post.
support_condition: Records establish material commitments linked to Musk's support that OpenAI had failed to fulfill by the post date, without an agreed change that permitted the departure.
contradiction_condition: Records establish that OpenAI fulfilled those commitments or that Musk agreed to the material departures identified.
measurement_requirements: Separate Musk's preferences, proposed arrangements, accepted commitments, and enforceable contractual rights. The claim does not require a legal breach to be established.
source_requirements: Authenticated founding and subsequent communications, evidence of agreed changes, and records of the resulting organization.
