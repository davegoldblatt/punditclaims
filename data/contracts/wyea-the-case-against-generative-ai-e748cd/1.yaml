assessment_axis: causal_assessment
explicit_source_elements:
  - nobody that wants it can afford it
  - those who can afford it don’t need it
evaluator_interpretation:
  - It refers to commercially substantial AI compute supplied by neoclouds.
  - The ordinary test is whether a major customer other than OpenAI both has a genuine demand for compute and credible financial capacity to purchase it.
  - A material commercial capacity agreement is evidence of demand; current financial resources provide evidence of affordability. Neither establishes that the customer's AI investment will ultimately earn a return.
  - I assess customer relationships in the September 2025 setting described by the post, through publication. Earlier financial statements are context for purchasing capacity.
  - I exclude purchases merely passing compute through to OpenAI. I do not exclude a wealthy technology company buying for its own AI activities.
support_condition: Customer and financial evidence establishes the claimed mismatch between substantial compute demand and ability to pay, including evidence that this mismatch explains the absence of other major customers.
contradiction_condition: A major customer other than OpenAI demonstrably contracts for AI compute for its own activities and has credible resources to pay, contradicting the universal mismatch.
measurement_requirements: Identify the actual customer and use, distinguish signed contracts from speculative announcements, and assess financial capacity separately from the supplier's profitability.
source_requirements: Executed contracts or regulatory disclosures, supported by customer financial statements. Marketing claims alone are insufficient.
