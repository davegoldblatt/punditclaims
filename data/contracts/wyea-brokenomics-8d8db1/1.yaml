ambiguity_flags:
  - The passage calls contemplated reductions 'price cuts' before establishing implementation.
  - The relevant models and discount terms are not identified.
  - Customer resistance and efficiency gains can both influence a pricing decision.
  - The June target period is inferred from the immediately surrounding reporting.
