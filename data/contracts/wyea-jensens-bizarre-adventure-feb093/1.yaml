explicit_source_elements:
  - a coordinated, multi-layered conspiracy
  - to dodgy US export controls
  - may very well have been totally ignored
  - if it wasn’t for the espionage angle
evaluator_interpretation:
  - Dodgy is read as a typographical error for dodge.
  - The checkable core is an organized, knowing effort involving Megaspeed and multiple actors or entities to evade applicable US export controls.
  - Corporate complexity, Chinese commercial ties, remote access or an investigation alone does not establish knowing unlawful evasion.
  - The surrounding account places the affair from early 2024 onward; use that period through the post date. Earlier corporate history is context.
  - The suggestion that coverage might otherwise have been absent is a hedged counterfactual and is not separately scored.
  - A conviction is not required, but the evidence must substantiate coordination and evasion rather than merely repeat allegations.
support_condition: Official findings, admissions or independently corroborated transaction and communication records establish coordinated Megaspeed-related evasion of controls that applied to the transactions.
contradiction_condition: A sufficiently comprehensive investigation or verified transaction record establishes that the alleged transactions were authorized, did not occur, or did not involve the asserted coordinated evasion.
measurement_requirements: Identify participants, transactions, destinations, dates, applicable restrictions and evidence of coordination or concealment. Distinguish lawful cloud access and corporate ownership from prohibited transfers.
source_requirements: Court records, enforcement findings, authenticated transaction records or well-corroborated investigations. Charges and interested-party denials must retain their evidentiary limits.
