assessment_axis: causal_assessment
explicit_source_elements:
  - good at writing a lot of code, not good code
  - the more people you allow to use them
  - the more code you’re going to generate
  - more time you’re either going to need to review that code
  - more vulnerabilities
evaluator_interpretation:
  - "The plain reading is a general causal claim about expanding LLM-assisted development: output increases, while maintaining quality requires more total review effort or accepting more vulnerabilities."
  - Good code means code that is correct, maintainable and secure in ordinary development work.
  - Review time means total review labor, not merely elapsed time per change. Vulnerabilities means actual security weaknesses, not all warnings from a code analyzer.
  - The claim describes a general mechanism, not a forecast with a deadline. Historical experiments can test parts of that mechanism, but older tools cannot establish its prevalence in April 2026.
support_condition: Credible comparisons show that broader LLM adoption increases code output and causes additional review labor or security vulnerabilities, with evidence that the generated code generally has quality shortcomings.
contradiction_condition: Credible comparisons across relevant development settings show increased output without additional total review labor or vulnerabilities, and maintained or improved code quality.
measurement_requirements: Measure adoption, output, total review labor, correctness, maintainability and security together. Account for developer skill, task difficulty, change size, review practices and model version.
source_requirements: Prefer randomized field experiments or well-controlled longitudinal studies. Surveys and isolated incidents can establish concerns but cannot independently establish the general causal tradeoff.
