evaluator_interpretation:
  - The ordinary reading is that substantial configuration and supervision are generally required of users of agentic workflows, especially the multi-agent workflows discussed in context.
  - Coordination failures are presented as an expected operational problem, not necessarily something that happens on every run.
  - Because no observation period is specified, use January–March 2026, the latest completed quarter before publication.
  - Distinguish work done by a product's developers from setup required of its end users.
support_condition: Representative workflow documentation and evaluations show substantial required user configuration, service integration, agent-specific instructions and supervision, alongside actual coordination failures.
contradiction_condition: Representative evidence shows that ordinary users generally achieve the relevant workflows without those burdens, or that the asserted coordination problems are not characteristic of them.
measurement_requirements: Measure required setup steps, external connections, human intervention time and coordination failures across representative products and tasks. Separate optional customization from requirements.
source_requirements: Dated documentation and firsthand workflow evaluations covering products available before the post.
