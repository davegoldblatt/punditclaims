  - Use the CFO's statement as written, including its lower-bound qualifier, rather than replacing it with an exact total.
  - Treat the reported $4.5 billion for 2025 as the premise being tested, without assuming it has been independently verified.
  - The target period covers 2025 reporting through the March 9, 2026 declaration. Full-quarter revenue through March 31 cannot automatically be assigned to March 9.
support_condition: The declaration supplies a total, upper bound, period, or revenue definition that cannot coexist with the reported 2025 revenue and compatible revenue earned before the declaration.
contradiction_condition: The declaration states only a cumulative lower bound above $5 billion, leaving room for the reported 2025 amount and subsequent revenue without contradiction.
measurement_requirements: Exact wording and temporal scope of the declaration; distinguish cumulative realized revenue, annual revenue, and annualized run rate.
source_requirements: The sworn declaration is decisive for its wording. The original 2025 report would be needed to verify that separate estimate, but not to test whether a lower bound imposes a ceiling.
