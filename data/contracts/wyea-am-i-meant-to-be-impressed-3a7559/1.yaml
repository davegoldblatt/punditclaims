explicit_source_elements:
  - Anthropic and OpenAI
  - vast majority of all AI revenues and compute capacity
  - I estimate 70% of all revenues and capacity demand, if not higher
evaluator_interpretation:
  - Assess a combined share of approximately 70% or more separately for revenue and compute; the two shares cannot be averaged.
  - The ordinary reading concerns the AI industry broadly. A narrower frontier-model, enterprise-API or selected-cloud market cannot silently replace all AI.
  - Use January–March 2026, the latest completed reporting quarter before the post, for the ongoing observation.
  - Revenue means realized revenue on a consistent market perimeter. Compute means operational capacity attributable to the labs, with contracted future demand reported separately.
  - The author's estimate is a confidence qualifier, not a conditional antecedent.
  - The contextual heading's 75% GPU figure is not substituted for the 70% threshold in the selected claim.
support_condition: Comparable industry-wide estimates place both labs' combined realized revenue share and operational compute share at approximately 70% or higher during the target period.
contradiction_condition: A defensible, comparable industry denominator places either combined share materially below 70%, allowing for estimation uncertainty.
measurement_requirements: Define the industry perimeter, avoid double-counting cloud and model-provider transactions, align gross versus net revenue treatment, and measure heterogeneous compute on a common basis. Separate installed capacity, actual usage and future demand.
source_requirements: An industry-wide revenue dataset and independently documented compute estimates covering both labs and the rest of the market for the same period.
