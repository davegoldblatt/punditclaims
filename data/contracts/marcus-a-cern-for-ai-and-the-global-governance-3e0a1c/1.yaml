target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Serious problems has no explicit severity threshold.
  - Control could mean technical restraint, human supervision, or institutional oversight.
  - The real issue could imply exclusive causal primacy; the assessment uses the ordinary contextual reading of a material safety concern.
