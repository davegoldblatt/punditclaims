evaluator_interpretation:
  - Both policies means blocking state AI regulation and allowing advanced H200 chip exports to China.
  - Strong bipartisan resistance means substantive opposition from prominent members of both major parties, demonstrated through legislation, organized opposition, or efforts to block a policy. It does not require majority opposition within each party.
  - Use December 1–9, 2025 as the current reporting window, reflecting the post's references to earlier today and last week. Earlier votes are background rather than new December events.
support_condition: Contemporaneous records show substantial Republican and Democratic opposition to each policy, including concrete political or legislative action.
contradiction_condition: Reliable records establish that opposition to either policy was confined to one party or that the cited actions did not resist the policy.
measurement_requirements: Identify the policy opposed, opponents' party affiliations, dates, and concrete actions. Distinguish opposition to blanket preemption from opposition to every possible federal standard.
source_requirements: Legislative records and officials' statements, supplemented by contemporaneous reporting where primary statements cannot be retrieved.
