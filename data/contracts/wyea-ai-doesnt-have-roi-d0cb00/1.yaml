  - Profitable has no defined accounting basis.
  - Running infrastructure could mean owning hardware or managing rented capacity.
  - Makes profitable implies causation; a profitable lab operating infrastructure establishes only coexistence.
  - The assessment date within the claim is inferred from the present-tense statement about available evidence.
