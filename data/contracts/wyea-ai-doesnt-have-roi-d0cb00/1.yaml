assessment_axis: historical_observation
explicit_source_elements:
  - AI labs may be able to run their own infrastructure
  - save some costs
  - we have no evidence
  - this makes anything “profitable.”
evaluator_interpretation:
  - This is a claim about the public evidence available when the post appeared, not a forecast or a claim that future profitability is impossible.
  - The target is the public evidence record as of 2026-06-02. Earlier disclosures can inform that record but are not automatically outcome observations dated to publication.
  - The plain reading requires evidence of realized profitability attributable to operating infrastructure, rather than merely a theoretical serving-margin calculation.
  - The words anything and profitable leave open whether the intended unit is an inference service or the whole lab. Both readings must be distinguished.
  - No accounting basis is stated, preventing a decisive monetary score under the specified rules.
  - May be able to is a concession, not a conditional forecast antecedent.
support_condition: A sufficiently comprehensive examination of the public record at publication establishes the absence of evidence demonstrating realized profitability attributable to lab-operated infrastructure.
contradiction_condition: A disclosure available by publication demonstrates realized profitability on a defined basis and credibly connects it to operating infrastructure, within the intended service or company scope.
measurement_requirements: Separate hypothetical revenue from realized revenue, inference contribution margins from company profit, and infrastructure operation from ownership. Identify how infrastructure choices affect profitability.
source_requirements: Prepublication financial disclosures or independently verified operating records with clear cost boundaries. Later evidence cannot retroactively establish what was publicly known at publication.
metric_scope:
  company: AI labs operating their own infrastructure
  metric: Realized profitability attributable to operating infrastructure
