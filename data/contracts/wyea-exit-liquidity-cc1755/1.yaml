condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Alienate has no specified measure.
  - Largest customers has no stated ranking threshold.
  - Dangerous game can describe an observed commercial risk or an unavoidable binary outcome; the latter is not established.
