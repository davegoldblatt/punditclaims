assessment_axis: causal_assessment
explicit_source_elements:
  - alienate some of its largest customers
  - or drain them of what remains of their venture capital
  - demanding they guarantee a minimum spend on tokens
evaluator_interpretation:
  - Read as a claim that minimum-spend demands create material commercial harm, rather than as a literal prediction that every customer must leave or become insolvent.
  - Alienation means a major customer materially reduces business or changes its preferred supplier because of these demands. The demands need to contribute materially, but need not be the sole cause.
  - "The alternatives are disjunctive: evidence of customer alienation can support the claim without evidence that customers exhausted their funding."
  - This is a qualitative claim about customer relationships, not a quantified claim about a named customer's finances.
support_condition: Credible customer accounts or contract reporting establish that a clearly major Anthropic customer materially shifted business because of minimum-spend demands, or financial records establish that those demands exhausted a major customer's remaining venture funding.
contradiction_condition: Reliable accounts or records refute the alleged spending demands or establish that the cited customer changes were unrelated to them, with no demonstrated funding-depletion alternative.
measurement_requirements: Identify a major customer, the spending demand, the resulting commercial change, and evidence connecting them. General price competition alone is insufficient.
source_requirements: Prefer customer statements and contracts. Attribute anonymous-source reporting and distinguish it from independently verified contract terms.
