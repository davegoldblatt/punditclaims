explicit_source_elements:
  - an alternative AI paradigm
  - learn much of what it needed to know
  - effective in the world
  - without going through all your personal data
  - does not yet exist
evaluator_interpretation:
  - The ordinary reading is that no demonstrated learning approach could acquire useful real-world capabilities without extensive access to people's personal information.
  - Effective means demonstrated competence on real-world tasks. The statement does not explicitly require human-level general intelligence.
  - An alternative can be a different learning approach, such as learning through interaction and an internal world model; it need not abandon neural networks.
  - The existence claim covers research demonstrated by September 7, 2023. Its cumulative target period has no stated starting date.
support_condition: Evidence establishing that approaches demonstrated by the post date could not learn useful real-world capabilities without extensive personal-data collection.
contradiction_condition: A demonstrated learning approach available by the post date that acquired useful real-world capabilities from interaction or other sources without extensive personal-data collection.
measurement_requirements: Identify the learning method, its training inputs, and demonstrated real-world performance. A proposal without working demonstrations is insufficient.
source_requirements: Research papers or documented demonstrations available by September 7, 2023, with enough methodological detail to identify the source of learning.
