explicit_source_elements:
  - an alternative AI paradigm
  - learn much of what it needed to know
  - effective in the world
  - without going through all your personal data
  - does not yet exist
evaluator_interpretation:
  - The firm assertion concerns the nonexistence of a demonstrated alternative as of September 7, 2023.
  - The ordinary contextual reading is a broadly effective alternative to prevalent data-intensive AI. A useful system confined to a narrow task does not by itself contradict it.
  - I read 'all your personal data' as extensive use of personal information, rather than literally every datum about a particular person. Public availability alone does not establish that training data contain no personal information.
  - Research has no regular reporting period. I use the post date as the snapshot for 'not yet'; earlier demonstrations provide historical context.
  - Marcus supplies no numerical threshold for breadth, effectiveness, or personal-data dependence. I do not impose one.
support_condition: A sufficiently comprehensive contemporary assessment establishes that available alternative approaches had not demonstrated broad effectiveness without extensive dependence on personal information. Merely failing to find a counterexample is insufficient.
contradiction_condition: A documented alternative existing by the post date demonstrates broadly effective learning across varied domains, with training-data evidence establishing that it learned much of what it needed without extensive use of personal information. An isolated narrow success is insufficient.
measurement_requirements: Evidence must address capability breadth and learning-data dependence together. Benchmark success alone, a proposed architecture, or the use of publicly available data alone does not settle the claim.
source_requirements: Research papers, reproducible demonstrations, training-data documentation, or substantial contemporary reviews concerning systems existing by September 7, 2023.
