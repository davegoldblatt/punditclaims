explicit_source_elements:
  - don’t think they really understand
  - adaptively and flexibly reason
  - things they haven’t encountered before
  - in a reliable way
evaluator_interpretation:
  - They refers to contemporary generative language models, not every kind of AI.
  - Reliable novel reasoning means dependable transfer to unfamiliar problems, rather than perfect performance or success on every task.
  - A failure of transfer can establish a reliability limitation without establishing the absence of understanding.
  - Use July–September 2023, the latest completed calendar quarter before publication, as the reporting window for this ongoing observation.
support_condition: Controlled evaluations establish substantial, recurring failures of novel-task transfer across contemporary systems, and a defensible operational account connects those findings to the claim about understanding.
contradiction_condition: Broad evaluations establish dependable adaptive transfer to genuinely unfamiliar problems. Isolated successes are insufficient to contradict the reliability qualification.
measurement_requirements: Identify model versions, distinguish training exposure from novel problems, assess repeated performance, and separate behavioral reliability from claims about understanding.
source_requirements: Primary controlled studies with documented models and tasks. Earlier studies may inform interpretation but cannot independently establish behavior in the target quarter.
