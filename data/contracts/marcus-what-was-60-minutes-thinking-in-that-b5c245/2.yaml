  - adaptively and flexibly reason
  - things they haven’t encountered before
  - in a reliable way
evaluator_interpretation:
  - The observation concerns generative AI available at publication in October 2023, not subsequent systems or the preceding calendar quarter.
  - The behavioral reading is dependable generalization to unfamiliar problems, including straightforward changes to familiar problems. It does not require perfection.
  - The statement expresses skepticism about understanding. Behavioral failures can support that skepticism without establishing that understanding is absent.
  - The target is the October publication-time state. Earlier experiments are retained as context without assigning them invented October measurement dates.
support_condition: Controlled tests of contemporary systems show substantial, reproducible failures to transfer reasoning to unfamiliar problems. Supporting the entire statement would additionally require a defensible connection between those failures and the claimed absence of understanding.
contradiction_condition: Representative, contamination-controlled evaluations show dependable and flexible reasoning across unfamiliar problems. Occasional successful answers alone would not contradict the reliability claim.
measurement_requirements: Identify model versions, prompts, task novelty, contamination controls, repeated trials, and performance across task variations. Evaluate behavioral reliability separately from claims about understanding.
source_requirements: Primary evaluations of systems available by 2023-10-10. Later publications qualify only when their measurements explicitly concern those contemporary systems.
