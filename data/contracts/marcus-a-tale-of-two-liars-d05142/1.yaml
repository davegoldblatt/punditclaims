assessment_axis: causal_assessment
explicit_source_elements:
  - GPT has a truthiness problem
  - it’s not deliberate
  - it doesn’t know any better
evaluator_interpretation:
  - GPT means the GPT systems discussed in November 2023, not every future model.
  - The ordinary reading attributes recurring false answers to inadequate factual knowledge rather than a purpose to deceive.
  - Knowing a correct answer is operationally tested by whether the same model can produce it under controlled alternative prompts. This does not establish human-like knowledge or conscious intent.
  - The statement does not expressly claim that every false answer has the same cause.
support_condition: Controlled studies establish that inadequate factual knowledge explains the described errors and distinguish those errors from purposeful deception.
contradiction_condition: Controlled evidence establishes that the described false answers instead involve accessible correct information and purposeful deception. Knowledge-output mismatches alone challenge the explanation but do not establish intent.
measurement_requirements: Identify model versions, prompts, correct answers, and interventions. Separate missing knowledge, failure to use available knowledge, and behavior directed toward misleading someone.
source_requirements: Primary controlled studies or documented model evaluations. Model-generated explanations alone cannot establish conscious intent.
