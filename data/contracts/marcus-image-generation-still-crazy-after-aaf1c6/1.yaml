explicit_source_elements:
  - you can't count on the system to correctly interpret any given prompt
  - because the language understanding still is far from perfect
  - Even three years later
  - You can get what you want if you fiddle with prompts
evaluator_interpretation:
  - "'The system' means Imagen 4, and more broadly the leading text-to-image models of mid-2025."
  - "There are two parts. (1) Reliability: the models often get unusual prompts wrong, such as reversed roles, matching attributes to the right objects, or clock times. (2) Cause: these failures come from weak understanding of the prompt's language, not only from other limits such as rendering or training-data bias."
  - The period is mid-2025, when the post was written.
support_condition: Controlled tests or benchmarks of Imagen 4 (or its peers) from about mid-2025 show frequent failures on unusual prompts, and the evidence links those failures to misreading the prompt rather than to other causes.
contradiction_condition: Controlled tests show that Imagen 4 reliably follows unusual compositional prompts, or that its failures come from something other than language understanding (for example, it reads the prompt correctly but cannot draw it).
measurement_requirements: Compositional prompt-adherence results for Imagen 4 from about mid-2025, plus evidence on why failures happen.
source_requirements: Peer-reviewed or preprint benchmarks, or independent controlled tests.
