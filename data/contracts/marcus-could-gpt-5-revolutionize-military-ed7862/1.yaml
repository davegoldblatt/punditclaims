assessment_axis: historical_observation
explicit_source_elements:
  - Generative AI systems
  - like GPT-4
  - more general purpose
  - can’t even handle
  - the static situations
evaluator_interpretation:
  - In context, static situations means fixed-rule games, especially chess.
  - Handle means follow the rules reliably and play competently without a separate engine choosing moves. It does not require world-champion performance or absolute perfection.
  - The statement generalizes across contemporary general-purpose systems while naming GPT-4 as an example.
  - The observation window covers the GPT-4-era evidence available before the post, beginning March 14, 2023. These systems have no standard reporting quarter.
  - Failures of reliability and evidence of competent play are assessed separately.
support_condition: Contemporary evaluations show repeated rule-following failures or inability to play competently in fixed-rule games.
contradiction_condition: Contemporary general-purpose models demonstrate sustained legal and competent play under a documented procedure without a separate engine selecting their moves.
measurement_requirements: Record exact model, prompts, supplied board information, handling of illegal moves, game outcomes and sample size. Separate move-level accuracy from complete-game reliability.
source_requirements: Direct contemporary experiments with methods and game records. Later model performance cannot settle the historical observation.
