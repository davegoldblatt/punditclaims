assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI has a declining reputation
  - Anthropic has conflict with the administration
  - Microsoft and Amazon don’t have the same talent pool
evaluator_interpretation:
  - The administration means the United States administration in office when the post appeared.
  - Declining reputation means worsening public perceptions over time, rather than merely receiving criticism or being less popular than another company.
  - In this AI competition context, the talent comparison means Microsoft and Amazon lack AI research depth and expertise comparable to Google's, rather than literally employing different people.
  - Use July 2026, the latest completed month before publication, for these ongoing observations. Reputation trends require comparable earlier measurements as a baseline.
  - All three assertions require support to support the combined claim. An unmeasured component is not automatically false.
support_condition: Comparable reputation measurements show deterioration through July; public records establish an active Anthropic-administration dispute in July; and comparable staffing or research records establish Google's stronger AI talent pool than both Microsoft and Amazon.
contradiction_condition: Comparable evidence shows stable or improving OpenAI reputation over the relevant comparison, no active Anthropic-administration conflict, or AI talent depth at Microsoft or Amazon comparable to or exceeding Google's.
measurement_requirements: Reputation comparisons must use consistent populations and measures. Talent comparisons must measure existing expertise and research depth, not total company employment, job openings or isolated hires.
source_requirements: Prefer longitudinal surveys, court or government records, and comparable research staffing records. Distinguish disputes from findings about who was legally right.
