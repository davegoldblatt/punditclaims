assessment_axis: causal_assessment
explicit_source_elements:
  - AI data centers coming online massively outpaces the demand for AI compute
  - the AI bubble doesn’t have to burst
  - all it takes is for the revenue to not exist to pay for the compute
evaluator_interpretation:
  - This combines a present oversupply assertion with a proposed cause of financing distress.
  - For the ongoing capacity assertion, use April through June 2026, the latest completed quarter that public evidence could report before the July 22 post.
  - The ordinary reading requires a large excess of usable AI compute capacity over paying demand, not merely large construction announcements or capital expenditure.
  - The causal part means revenue shortfalls can trigger material distress in financed AI data centers without requiring a prior broad AI-market collapse.
  - The claim does not specify a company financial figure; metric_scope is therefore null.
support_condition: Comparable measurements establish substantial excess commissioned AI compute capacity over paying demand in the target period, and project financing records establish that revenue shortfalls can cause material distress independently of a broad AI-market collapse.
contradiction_condition: Representative measurements show that paying AI compute demand absorbs or exceeds commissioned capacity in the target period. The causal part would be undermined by evidence that the relevant financing structures prevent revenue shortfalls alone from producing the asserted distress.
measurement_requirements: Match commissioned and usable capacity to contracted demand, actual utilization and payments on comparable hardware, geography and dates. Separately examine debt service, reserves, guarantees and refinancing access.
source_requirements: Representative capacity and utilization measurements, customer payment records, financing agreements and documented distress events. General data center vacancy is context unless it isolates the claimed AI compute market.
