ambiguity_flags:
  - The ongoing observation has no explicit period; the latest completed quarter is used.
  - Massively has no numerical threshold.
  - Coming online could include imminent projects as well as already commissioned capacity.
  - Demand could mean reservations, utilization, paid compute purchases or sustainably financed end-customer demand.
  - The geographic scope and the scale constituting a crisis are unspecified.
