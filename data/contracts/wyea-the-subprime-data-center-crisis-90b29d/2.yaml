assessment_axis: historical_observation
explicit_source_elements:
  - '"the sheer scale of AI data centers coming online"'
  - '"massively outpaces the demand for AI compute"'
  - "\"the AI bubble doesn't have to burst for the subprime data center crisis to begin\""
  - '"all it takes is for the revenue to not exist to pay for the compute"'
evaluator_interpretation:
  - "The testable part is the present-tense statement that AI data center capacity coming online massively outpaces demand for AI compute. The second half is a conditional mechanism: if revenue is missing, the crisis can start without the bubble bursting. It is close to true by definition and is not scored."
  - '"Coming online" covers capacity being delivered and capacity under construction that will deliver soon. The test is not limited to capacity already commissioned.'
  - '"Demand for AI compute" is read plainly as customers leasing, booking and paying for capacity. It is not read as demand that he considers sustainable or funded by profits. He may mean the latter, which is flagged.'
  - He named no period. The claim describes conditions when he wrote, so the target period is 2026-01-01 to 2026-07-22, using the latest reported data.
support_condition: Data from the period show substantial unleased or idle capacity, rising vacancy, falling rents or GPU rental prices, or low utilization, consistent with supply massively exceeding demand.
contradiction_condition: Data from the period show very low vacancy, high preleasing of capacity under construction, rising rents and GPU rental prices, or major providers saying demand exceeds supply.
measurement_requirements: Vacancy, preleasing share, absorption and rents for data center capacity; GPU rental price indices; capacity statements from major cloud providers, in H1 2026.
source_requirements: Commercial real estate research, independent GPU market indices, company earnings statements or reliable reports of them.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-01-01
  end: 2026-07-22
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - '"Demand" could mean current bookings or demand backed by sustainable revenue; the speaker may mean the latter.'
  - '"Coming online" could mean already delivered or the near-term pipeline.'
  - The causal half of the sentence is a conditional mechanism and is not scored.
  - No period stated; first half of 2026 used.
retrospective_or_prospective: retrospective
