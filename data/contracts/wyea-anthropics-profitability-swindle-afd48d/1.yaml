explicit_source_elements:
  - proof that AI can be profitable
  - that inference is profitable
  - some sort of business model is emerging
  - that’s not what’s happening
evaluator_interpretation:
  - Read in context, this rejects the reported June-quarter profit as evidence of underlying commercial profitability. It is not a prediction that AI can never make money.
  - The target is the April–June 2026 quarter explicitly discussed in the post, although its profit was still a projection when Zitron wrote.
  - The ordinary test is whether the reported profit reflects operating economics that persist beyond temporary pricing and accounting exclusions.
  - Company operating profit, inference profitability, and long-term business viability are separate questions. No single profit figure settles all three.
support_condition: Records show that the cited profit disappears after relevant omitted operating expenses and temporary pricing effects are included, and that the report does not establish profitable inference.
contradiction_condition: Comparable records establish positive underlying operating and inference profitability without dependence on the alleged temporary effects.
measurement_requirements: A reconciliation of the reported operating-profit measure, inference revenue and expenses, and the financial effect of temporary compute pricing.
source_requirements: Company financial records and supplier terms, with independent reporting used where the underlying investor materials are unavailable.
