evaluator_interpretation:
  - The plain reading predicts investor harm substantially greater than the dot-com crash, not merely a temporary decline in AI shares.
  - A proposed comparison is aggregate investor losses on a consistent inflation-adjusted basis, including comparable public and private exposures.
  - Several echelons supplies no numerical multiplier. No arbitrary multiplier is imposed.
  - The speaker gives no deadline. The forecast remains open unless a decisive event establishes the predicted severity.
  - An AI collapse is the predicted event, not an independently stated conditional antecedent.
support_condition: A documented AI-market collapse produces investor losses clearly and substantially exceeding the dot-com comparison under consistent coverage and inflation adjustment.
contradiction_condition: A clearly completed episode identifiable as the predicted collapse produces losses no greater than the dot-com comparator, with no material ambiguity about episode boundaries or loss measurement. Mere nonoccurrence cannot contradict this undated forecast.
measurement_requirements: Comparable investor populations, asset coverage, episode boundaries, treatment of recoveries and inflation adjustment. Distinguish realized losses from market-capitalization declines and hypothetical stress tests.
source_requirements: Reliable market data and loss estimates, preferably official or independently measured, with transparent comparison methods.
