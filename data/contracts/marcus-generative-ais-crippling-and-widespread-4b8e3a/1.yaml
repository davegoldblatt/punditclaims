ambiguity_flags:
  - Explicit models is not operationally defined.
  - Leaving our lives in the hands of could mean autonomous control or consequential human reliance.
  - The wording can be read as a general risk warning or as an architectural causal explanation.
  - No comparison baseline or acceptable risk threshold is specified.
