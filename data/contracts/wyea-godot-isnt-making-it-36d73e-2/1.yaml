assessment_axis: forecast_outcome
explicit_source_elements:
  - at some point
  - somebody is going to blink in one of the hyperscalers
  - the AI era will be over
evaluator_interpretation:
  - Blink means a major retreat from planned AI expansion by a leading cloud hyperscaler.
  - In the surrounding investment discussion, the AI era ending means a broad, sustained end to the AI investment and expansion boom.
  - An individual cancelled project or a shift of capacity to another buyer does not establish the full sequence.
  - This is a qualitative industry forecast, not a prediction of a specified company's spending amount.
support_condition: A documented major hyperscaler retreat is followed by a broad and sustained collapse in AI investment and expansion.
contradiction_condition: A completed episode presented as the predicted retreat is followed by sustained broad expansion, contradicting that episode as fulfillment. Continued investment alone cannot disprove an eventual forecast with no deadline.
measurement_requirements: Compare actual spending, capacity commitments, cancellations, and expansion across major hyperscalers over multiple reporting periods. Distinguish changed accounting or project allocation from a genuine retreat.
source_requirements: Company disclosures and filings, supplemented by independently sourced reporting on cancellations and industry conditions.
metric_scope: null
original_horizon: at some point
horizon_interval:
  start: 2024-12-03
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as fulfilled only when a dated major hyperscaler retreat and the subsequent broad, sustained end of the boom are both established. A local pullback is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Blink has no stated scale.
  - The AI era being over has no stated indicator or duration.
  - At some point supplies no deadline.
