explicit_source_elements:
  - don’t make up any references
  - People have done this in a legal context
  - the systems will still make up references
  - don’t use any copyrighted materials
  - the systems will continue to use copyrighted materials
evaluator_interpretation:
  - The plain reading is that explicit prohibitions do not reliably prevent these failures, not that every prohibited request produces a failure.
  - Both the legal-reference and copyrighted-material limbs must be established for full support.
  - I read 'use copyrighted materials' as producing or reproducing protected content in the response. Prior exposure during training is insufficient.
  - The phrase 'People have done this' makes this an assertion about examples occurring before publication. The start date is unspecified; the target period therefore has no fixed start.
  - The explicit prohibition must precede the relevant output. A later request to verify a citation is not equivalent.
support_condition: Documented interactions or sufficiently specific primary findings establish fabricated legal references despite a prior prohibition, and reproduction of copyrighted material despite a prior prohibition.
contradiction_condition: Primary records refute the asserted failures under their stated instructions. Successful isolated interactions do not disprove the existence of failures elsewhere.
measurement_requirements: Identify the prior instruction, the subsequent output, and verification of the fabricated reference or reproduced protected content. Distinguish nonexistent references from inaccurate quotations or descriptions of real authorities.
source_requirements: Interaction logs, reproducible experiments, or court findings recording both the instruction and the resulting failure.
