support_condition: A sufficiently comprehensive contemporaneous assessment establishes that systems with the combined Agent-1-like capabilities existed only as demonstrations or non-operational prototypes.
contradiction_condition: A documented operational system existed by the post date and demonstrated both broad useful capabilities and particularly strong AI-research assistance comparable to Agent-1.
measurement_requirements: Assess availability and capability separately. A coding benchmark, research paper, or preview label alone does not establish or exclude the combined capability.
