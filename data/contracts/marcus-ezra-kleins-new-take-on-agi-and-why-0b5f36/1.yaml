evaluator_interpretation:
  - Read the grammatical omission as 'hallucinations have not been solved'.
  - The ordinary reading is that contemporary LLM systems still generate fabricated or unsupported factual answers in practical use. It does not claim that hallucination rates never improved.
  - Use February 2025, the latest completed reporting month before the post, for the ongoing model-performance observation.
  - Read 'constant assurances' as repeated public assurances about preventing or overcoming hallucinations, not a literal uninterrupted stream or a promise by every provider.
support_condition: Contemporary model evaluations document continuing factual hallucinations, while earlier public records establish repeated assurances about preventing or overcoming them.
contradiction_condition: Contemporary evidence establishes a broadly effective solution to factual hallucinations in the systems under discussion. Improvements or successful narrow safeguards alone do not contradict the claim.
measurement_requirements: Use factuality evaluations or documented failures with identifiable models and tasks. Do not equate benchmark error rates with the rate in all ordinary conversations.
source_requirements: Prefer contemporary model documentation and empirical research. Earlier assurances must be independently documented and kept separate from current outcome evidence.
