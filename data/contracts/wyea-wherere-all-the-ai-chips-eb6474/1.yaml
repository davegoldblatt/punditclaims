assessment_axis: forecast_outcome
explicit_source_elements:
  - An incomplete data center
  - cost just as much to finish in 2030 as it will today
  - the GPUs cost just as much to run
evaluator_interpretation:
  - Today means September 22, 2026; in 2030 allows observation through December 31, 2030.
  - The plain reading in the stranded-infrastructure context is that waiting will not materially reduce completion or operating costs, rather than exact equality to the cent.
  - Compare the same remaining construction work and the same GPU equipment, utilization and operating service. Cheaper new GPUs or lower cost per token are different comparisons.
  - Use nominal costs because no inflation adjustment is stated, while reporting real costs as a sensitivity check.
  - No company-specific monetary metric is asserted, so metric_scope is null.
support_condition: Comparable 2030 evidence shows neither the cost of completing the remaining facility work nor the cost of operating the same GPUs has materially fallen from September 2026.
contradiction_condition: Comparable evidence shows a material decline in either component. If one component holds and the other fails, report a mixed result.
measurement_requirements: Match location, remaining construction scope, equipment, operating hours, utilization, electricity, cooling and maintenance. Separate operating costs from equipment purchase prices and depreciation. Report nominal and inflation-adjusted comparisons.
source_requirements: Completed-project costs or binding completion quotations and documented GPU operating expenses, with comparable September 2026 and 2030 observations.
metric_scope: null
original_horizon: in 2030
horizon_interval:
  start: 2026-09-22
  end: 2030-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early only if binding, comprehensive arrangements fix the comparable 2030 costs and remove material exposure to later price changes. Forecasts, current efficiency improvements and nonbinding quotations do not qualify.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Exact equality versus no material decrease.
  - Nominal versus inflation-adjusted costs.
  - No location, facility specification or GPU operating-cost basket is supplied.
  - The population of incomplete facilities is unspecified.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
