evaluator_interpretation:
  - The claim bundles three or more broad trends plus an open-ended 'and so on'. Only the cyberscam part has an ordinary measurable reading (reported scam losses rising). 'Enshittification of the web' is a loose, value-laden term with no agreed measure, and 'mass spread of misinformation' has no stated threshold or baseline.
  - Whether Marcus made the warnings is a fact about his own writing, which cannot serve as evidence that he was right.
support_condition: Measurable evidence that all named harms (web quality decline, mass misinformation, rising cyberscams) are occurring in the period up to January 2026.
contradiction_condition: Measurable evidence that one or more named harms is not occurring, e.g. falling scam losses or improving web quality on an agreed metric.
