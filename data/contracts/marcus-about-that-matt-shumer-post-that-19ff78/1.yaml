explicit_source_elements:
  - when he describes how AI's are doing longer and longer tasks on METR's famous task-time benchmark
  - he neglects to say the criterion on that benchmark is 50% correct, not 100%
  - and that the benchmark is only about coding and not tasks in general
evaluator_interpretation:
  - The claim is about what Shumer's post 'Something Big Is Happening' says in its passage on METR's task-time results.
  - It holds if that passage does not mention the 50% success criterion and does not say the tasks are limited to software or coding work.
  - "'Only about coding' is read loosely to mean software-type tasks. METR describes them as mainly software engineering, machine learning and cybersecurity tasks."
support_condition: Shumer's METR passage gives the time-horizon figures without mentioning the 50% success threshold and without saying the tasks are software-focused.
contradiction_condition: Shumer's post states that the METR figures reflect a 50% success rate, or that the tasks are software or coding tasks.
measurement_requirements: Read the full text of Shumer's post where it discusses METR, and check METR's own documentation for the success criterion and task domain.
source_requirements: Shumer's post itself (primary) and METR's time-horizon documentation (primary).
