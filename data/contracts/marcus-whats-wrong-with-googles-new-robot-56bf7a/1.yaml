evaluator_interpretation:
  - Performance means overall end-to-end execution success in the evaluation discussed, rather than planning accuracy.
  - Best case means the better overall evaluated setting, not the highest-scoring individual task or task family.
  - Around 75% allows ordinary rounding of a reported result close to three quarters.
  - The target is the evaluation released in August 2022, not subsequent versions.
support_condition: The best overall evaluated setting reports approximately 75% execution success using a finite, predefined skill repertoire.
contradiction_condition: The comparable best overall execution result is materially different from approximately 75%, or the evaluation did not restrict execution to an available skill repertoire.
measurement_requirements: Compare overall execution success across the reported settings. Keep planning success and individual task scores separate.
