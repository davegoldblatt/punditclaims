early_resolution_rule: A documented sustained financial turnaround materially attributable to the reasoning technology could contradict the forecast. Permanent business cessation after the antecedent, without such a turnaround, could support it. A launch, financing round, revenue increase, or finite period of losses alone is not decisive.
