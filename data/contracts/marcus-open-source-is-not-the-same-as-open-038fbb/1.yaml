explicit_source_elements:
  - you can run them
  - posttrain
  - can't customize or improve them to remotely the same degree
  - can't investigate them to nearly the same degree
evaluator_interpretation:
  - Assess capabilities available as of August 10, 2026.
  - The comparison with open-source models is a comparator, not a forecast antecedent.
  - "Read the claim primarily through the examples in context: changing original training inputs, repeating original training stages and investigating how training choices affect behavior."
  - Do not interpret it as saying that released weights cannot be changed, fine-tuned or examined.
  - Remotely the same degree means a substantial practical gap across these activities, not a specified difference in benchmark scores.
support_condition: Comparable release records show that weight-only users can run and post-train models but lack materials necessary for a substantial range of original-training interventions and audits that fully open releases enable.
contradiction_condition: Weight-only releases provide substantially equivalent access to those interventions and audits, or documented comparisons show no substantial practical gap.
measurement_requirements: Compare runnable inference, post-training, original-data substitution, training-stage reproduction and data-linked investigation. Separate missing information from compute costs and achieved performance gains.
source_requirements: Versioned release artifacts and documented experiments or capability comparisons available by the evaluation date, describing the state at the post date.
