explicit_source_elements:
  - AI Safety Institutes
  - will also offer guidance
  - but have little legal authority
  - to stop truly dangerous models
  - should they arise
  - where we will be at the end of this year
evaluator_interpretation:
  - "Plain reading: during 2025, the main national AI safety institutes (the US and UK institutes, including under their new names CAISI and the AI Security Institute) would issue guidance and run evaluations, but would lack legal power to block or halt a model's release."
  - "'Should they arise' describes the hypothetical scope of the authority. It is not a condition on the forecast, so the claim is scored whether or not a dangerous model appeared."
  - Being renamed does not take the bodies out of scope.
support_condition: During 2025 the institutes work mainly through guidance, testing and voluntary agreements, and no statute gives them power to block a model's release.
contradiction_condition: During 2025 a major AI safety institute gains binding legal power to stop deployment of dangerous models, or stops offering guidance.
measurement_requirements: Legal mandate and powers of US and UK AI safety institutes during 2025; nature of their agreements with developers.
source_requirements: Government announcements, reputable news, and policy analyses of institute powers.
