  - the driverless car industry
evaluator_interpretation:
  - Read 'core problem' as a central obstacle to reliable driving, rather than a measured ranking of every technical and commercial obstacle.
  - Read 'woken up' as substantive recognition expressed in technical work and testing, rather than private beliefs.
  - The claim combines the state of the problem in August 2022 with the history of industry recognition. That historical component has no stated starting date.
support_condition: Contemporaneous technical evidence identifies unusual situations as a central reliability challenge, and historical records place substantive industry recognition only within the few years preceding the post.
contradiction_condition: Contemporaneous evidence shows edge cases were no longer a central reliability challenge, or substantially earlier industry records demonstrate recognition and sustained work on that challenge.
measurement_requirements: Distinguish recognition of rare scenarios from recognition that enumerating them cannot exhaust the problem. Examine technical practices as well as statements.
source_requirements: Dated industry technical publications or original research, including records predating the claimed recent recognition.
