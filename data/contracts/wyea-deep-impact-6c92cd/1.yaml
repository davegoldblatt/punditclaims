  - o1
  - 96%~ cheaper to run
  - can even be run locally
evaluator_interpretation:
  - I compare the original full R1 with released o1, rather than substituting an R1 distillation or o1-mini.
  - Competitive means broadly comparable performance across relevant reasoning benchmarks, not superiority on every task.
  - The surrounding pricing discussion makes standard API charges per matching token category the ordinary reading of the approximate 96% figure.
  - Local means self-hostable. This sentence supplies no hardware ceiling; the nearby MacBook anecdote does not establish that full R1 retains its benchmark performance on that machine.
  - I use January 2025 through publication as the reporting period for this ongoing comparison.
  - These are API product prices, not company financial-accounting measures; metric_scope is null.
support_condition: Contemporaneous benchmarks show broadly comparable R1 and o1 performance, matching standard API token rates are approximately 96% lower for R1, and the full R1 model can be self-hosted.
contradiction_condition: Comparable benchmarks show a substantial general performance deficit, matching API rates materially fail the approximate discount, or the full model cannot be self-hosted.
measurement_requirements: Use original R1 and o1 versions; compare uncached input with uncached input and output with output. Include reasoning tokens where billed. Distinguish benchmark performance from local hardware performance.
source_requirements: Versioned benchmark results, contemporaneous provider prices and original model deployment documentation.
