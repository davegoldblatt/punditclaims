assessment_axis: causal_assessment
explicit_source_elements:
  - demand from those building AI data centers
  - inflating the cost of RAM and storage
  - making all electronics more expensive
  - doubled the cost of a gigawatt data center
  - from $50 billion to $100 billion
  - in a little under 10 months
evaluator_interpretation:
  - The ordinary reading is that comparable, fully equipped AI data centers became roughly twice as expensive per gigawatt, with AI-driven memory and storage inflation materially causing that increase.
  - Use the ten months ending on the post date as the outer observation window. The two comparable estimates must themselves be less than ten months apart.
  - A change in equipment generation, computing capacity per gigawatt, or included construction costs cannot automatically be treated as price inflation.
  - No accounting or project-cost basis is specified.
support_condition: Comparable dated budgets or cost estimates establish an increase from approximately USD 50 billion to USD 100 billion per gigawatt in less than ten months, and component-price evidence attributes a material part of that increase to AI-driven RAM and storage shortages.
contradiction_condition: Comparable cost records show that the claimed doubling did not occur, or a reliable cost decomposition shows that the increase came from changed specifications or other causes rather than the stated memory-and-storage mechanism.
measurement_requirements: Match power definitions, hardware generation, equipment quantities, geography, construction scope, and treatment of power infrastructure and operating costs. Separate realized prices from forecasts.
source_requirements: Prefer dated supplier disclosures, project budgets, and independent component-price measurements. A repeated executive estimate alone cannot establish the claimed causal chain.
