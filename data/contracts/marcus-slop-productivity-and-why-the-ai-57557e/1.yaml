assessment_axis: historical_observation
explicit_source_elements:
  - The one possible major productivity story (coding)
  - the one burning the most cash
evaluator_interpretation:
  - The firm, testable assertion is that coding accounts for more aggregate cash burn than any other generative-AI use case. The productivity description is qualified by 'possible'; it does not assert a measured productivity gain.
  - Read 'burning the most cash' as the largest absolute net cash outflow, not the highest token consumption, largest financing round, or worst percentage margin.
  - Use January–March 2026, the latest completed calendar quarter that could have been reported before the June 7 post. Marcus supplies no reporting period.
  - Compare cash attributable to each application, including reasonably allocated shared costs. Do not assign all of a multipurpose provider's losses to coding or double-count payments between providers and suppliers.
  - The surrounding discussion invokes an analyst estimate, so estimate is the closest implied accounting basis. No formal cash-flow definition, currency, or unit is specified.
support_condition: Comparable financial disclosures or credible estimates for January–March 2026 show that aggregate net cash burn attributable to coding exceeded that attributable to every other major generative-AI use case.
contradiction_condition: Comparable evidence for January–March 2026 identifies another generative-AI use case with greater aggregate net cash burn, or establishes that coding had no positive net cash burn.
measurement_requirements: Use realized net cash flows for the same period, with consistent cost allocation and currency conversion. Separate coding from other uses within multipurpose companies. Explain treatment of training, capital expenditure, and upstream suppliers. Revenue, gross margins, accounting losses, and token counts cannot alone establish the ranking.
source_requirements: Prefer filings and company financial disclosures. Credible reported estimates must identify their financial basis and application coverage. Sources must have been available by October 28, 2026.
