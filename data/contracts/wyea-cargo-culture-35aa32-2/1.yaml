assessment_axis: forecast_outcome
explicit_source_elements:
  - on course to burn
  - tens of billions of dollars each
  - in 2026
evaluator_interpretation:
  - Assess the forecast of realized calendar-year cash burn separately for OpenAI and Anthropic.
  - Read burn as net cash consumed by operations and capital expenditure, excluding financing proceeds, purchases of cash-management securities, and noncash accounting losses.
  - The ordinary reading of plural tens is at least $20 billion each. The screens proposed $10 billion; retain that alternative as a sensitivity check. Neither threshold can presently be resolved.
  - The qualification about funding rounds closing modifies the adjacent fundraising statement, not this cash-burn forecast.
  - The quoted passage does not identify an accounting basis for cash burn.
support_condition: Comparable full-year records show that both companies consumed at least $20 billion of net cash in calendar 2026.
contradiction_condition: Comparable full-year records show that either company consumed less than $20 billion. Separately report whether the conclusion changes at the screens' $10 billion threshold.
measurement_requirements: Separate company cash-flow reconciliations covering all of 2026, with operating cash flow, capital expenditure, financing, securities transactions, and noncash charges distinguished.
source_requirements: Prefer company financial statements. Independently verified reporting can establish reported estimates, but projections cannot establish realized results.
