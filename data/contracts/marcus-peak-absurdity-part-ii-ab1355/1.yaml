assessment_axis: historical_observation
explicit_source_elements:
  - Today
  - even after a very strong week
  - Oracle stands at just $170
  - On September 11, Oracle stock stood at about $308
evaluator_interpretation:
  - Read $170 as an ordinary whole-dollar quotation of Oracle common stock, in US dollars per share, rather than an assertion of exactly $170.00.
  - Use April 15, 2026 as 'today' and September 11, 2025 as the comparison date.
  - Use regular-session closing prices to check the daily quotations because Marcus supplies no intraday timestamp.
  - Read 'a very strong week' as a substantial recent rise, including the current trading week through the post date. It does not require a completed calendar week.
  - The target interval contains the explicitly named comparison date and the April observation; it does not assert a continuous price level throughout that interval.
  - This is a quoted securities-price observation, rather than a claim about Oracle's corporate finances or accounting results; metric_scope is null.
support_condition: Reliable historical records show an April 15 quotation rounding to $170 and a September 11 quotation rounding to about $308, with contemporaneous evidence of a substantial rally leading into April 15.
contradiction_condition: Reliable records show materially different prices on the named dates, beyond ordinary whole-dollar rounding, or show that the recent substantial rally did not occur.
measurement_requirements: Oracle common stock, ticker ORCL; US dollars per share; contemporaneous market prices without subsequent dividend adjustments. Distinguish closing prices from intraday prices and assess the recent rally separately.
source_requirements: Prefer exchange records, company historical-price records, or filings quoting market data. Reputable contemporaneous financial reporting may establish the recent rally. All evidence must have been available by October 28, 2026.
