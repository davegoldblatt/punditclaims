explicit_source_elements:
  - hundreds of billions of dollars of GPUs
  - sitting in warehouses
  - aren’t being installed
  - six months to install a single quarter’s worth of GPU sales
evaluator_interpretation:
  - The ordinary reading concerns NVIDIA AI GPUs across its customer supply chain, including equipment already sold to intermediaries or customers.
  - Read 'hundreds of billions' as at least approximately US$200 billion. The speaker supplies no inventory valuation method.
  - "Read the installation statement as an aggregate deployment rate: installing approximately one quarter's sales requires six months. It does not mean every individual installation takes six months."
  - For the ongoing observation, use NVIDIA's latest reported fiscal quarter before the post, ending January 25, 2026. This reporting-period choice is an evaluator interpretation.
  - Both the inventory valuation and the deployment-rate assertion must be established to support the whole claim.
support_condition: Contemporaneous, sufficiently comprehensive records establish approximately US$200 billion or more of sold NVIDIA AI GPUs physically awaiting installation, and matched shipment and deployment data establish approximately six months to install one quarter's sales.
contradiction_condition: Comparable records establish a substantially smaller warehoused balance or a materially different aggregate installation rate. A smaller balance at one company alone would not contradict the global claim.
measurement_requirements: Identify ownership, physical location, installation status, valuation basis and reference date. Avoid double-counting GPUs within servers or across successive owners. Match deployment counts to the products, geography and sales quarter being compared.
source_requirements: Inventory and commissioning records from NVIDIA, manufacturers and customers, or an independently documented industry census. Revenue, announced orders and data-center capacity alone are insufficient.
