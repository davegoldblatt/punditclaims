explicit_source_elements:
  - Both
  - endlessly hinted that AGI is near
  - quietly moved the deadline back
  - when they didn’t deliver
evaluator_interpretation:
  - Both means Amodei and Altman separately, not merely one of them.
  - Read 'endlessly' as repeated statements, not literally without end.
  - A qualifying postponement requires an original deadline, non-delivery by that deadline, and a later deadline for substantially the same capability.
  - Read 'quietly' as not acknowledging the missed earlier commitment in the later statement.
  - The historical claim ends at publication on March 8, 2026. No beginning date is supplied.
  - Later events cannot retroactively establish that a deadline had already been missed when Marcus posted.
support_condition: Dated records establish repeated near-term AGI statements and the missed-deadline-then-postponement sequence for each executive before March 8, 2026.
contradiction_condition: Affirmative records establish that the identified purported postponements were not post-failure deadline extensions, or that the asserted history for either executive is incompatible with the record. Failure to locate examples alone is insufficient.
measurement_requirements: Compare the same capability, preserve probability and safety qualifications, use the full forecast window, and distinguish predictions from commitments.
source_requirements: Prefer complete original interviews and writings, including surrounding qualifications and dated revisions.
