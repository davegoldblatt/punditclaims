explicit_source_elements:
  - The AI industry
  - obfuscating
  - how brittle its economics really are
evaluator_interpretation:
  - The ordinary reading is that industry disclosures and public presentation materially obscure weak economics or financing dependence.
  - Obfuscation need not mean proven fraud or coordinated intent. Mere commercial confidentiality does not by itself establish that financial fragility was obscured.
  - "For the ongoing economic state, use the latest completed calendar reporting quarter before publication: October through December 2025. Consider disclosures about that period available before the post."
  - The claim concerns disclosure quality and economic fragility, not a particular company's monetary balance.
support_condition: Representative comparisons between industry disclosures and independently documented costs, losses, or financing dependence show that material economic fragility was obscured.
contradiction_condition: Representative comparisons show that the relevant economic weaknesses and dependencies were clearly disclosed and that public presentation did not materially obscure them.
measurement_requirements: Compare what firms disclosed with what was economically material. Measure both disclosure gaps and the underlying fragility; neither alone settles the claim.
source_requirements: Primary disclosures, independent disclosure research, and verified information about underlying economics. Evidence of deliberate concealment would strengthen, but is not required by, the ordinary reading.
