evaluator_interpretation:
  - The preceding comparison to annual compute demand makes the ordinary reading approximately $22 billion per year of current AI compute demand from customers other than the two named labs.
  - Treat this as an approximate estimate, not an exact dollar threshold or a hard upper bound.
  - Use the latest completed calendar quarter with public reporting before the post, April through June 2026, as the measurement window for the current annualized spending pace.
  - Measure purchases of AI compute once at the customer-to-provider boundary. Exclude the two labs’ purchases and avoid adding downstream AI application revenue to upstream compute spending.
  - The statement does not make clear how internally operated compute should be valued.
support_condition: A reasonably comprehensive estimate of annualized AI compute spending by other customers, using a consistent definition and the selected reporting period, centers near $22 billion with uncertainty compatible with that approximation.
contradiction_condition: A comparable comprehensive estimate or defensible lower bound places the annualized total materially away from $22 billion, beyond measurement uncertainty and ordinary rounding.
measurement_requirements: Separate AI compute from other cloud services, identify customers, remove OpenAI and Anthropic spending, eliminate resale double counting and state the annualization method.
source_requirements: Provider revenue breakdowns, customer compute-spending records or an independently documented market estimate that reconciles both sides.
