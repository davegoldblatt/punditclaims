assessment_axis: forecast_outcome
explicit_source_elements:
  - all it takes
  - the vibe souring
  - people lose faith in the AI trade
  - everything to start to collapse
evaluator_interpretation:
  - The ordinary reading is that a broad loss of investor confidence in the global AI trade is sufficient to start widespread severe financial deterioration.
  - "'Everything' refers to the interconnected AI-linked markets discussed in context, rather than literally every asset."
  - Confidence loss must be established independently of falling prices; otherwise the condition and outcome become circular.
  - The source specifies no sentiment threshold, collapse magnitude or response interval. These cannot be selected after observing an episode.
  - Earlier selloffs provide context. A forecast outcome requires a qualifying event after the October 20 publication.
support_condition: A documented broad confidence-loss event is followed by widespread severe deterioration in AI-linked markets, with evidence that the confidence shock was sufficient rather than merely coinciding with other material shocks.
contradiction_condition: A clearly qualifying broad confidence-loss event is followed by demonstrated resilience across the relevant markets over a defensible response interval, inconsistent with the asserted sufficiency.
measurement_requirements: Independent measures of investor confidence, a defined cross-market universe, equity and credit performance, event timing and assessment of competing causes. Ordinary volatility or one company's fall is insufficient.
source_requirements: Dated investor surveys, positioning or flow records and market data, supported by credible event analysis. Price declines alone cannot establish the antecedent.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A decisive dated episode after publication must independently establish broad loss of confidence and a subsequent market response that clearly meets or defeats the ordinary meaning of widespread collapse, without relying on an invented numerical threshold or lag.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No measurable confidence-loss threshold
  - No collapse magnitude
  - No response interval or deadline
  - Scope of 'everything' unspecified
  - Sentiment alone versus concurrent financing and economic shocks
retrospective_or_prospective: retrospective
