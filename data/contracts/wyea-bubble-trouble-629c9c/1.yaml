assessment_axis: historical_observation
explicit_source_elements:
  - we're in an artificial intelligence bubble
evaluator_interpretation:
  - The ordinary reading is that speculation had pushed AI investment and valuations materially beyond plausible economic returns.
  - Use Q1 2024, the latest completed quarter before publication, to assess the ongoing market state.
  - The proposed Stargate expenditure is his reason for the conclusion, not a numerical definition of a bubble.
  - The claim does not predict a crash by any deadline.
support_condition: Evidence establishes widespread speculative overvaluation in AI during the target period, beyond what plausible earnings and growth expectations could justify.
contradiction_condition: Evidence establishes that the apparent industry-wide overvaluation was substantially explained by defensible economic fundamentals during the target period.
measurement_requirements: Compare valuations and investment commitments with earnings, realistic expected returns, and evidence of speculation. High spending or subsequent price movements alone do not settle the claim.
source_requirements: Independent financial analysis grounded in contemporaneous data; distinguish measured valuations from opinions about their sustainability.
