explicit_source_elements:
  - OpenAI’s $2.947 billion in inference spend
  - in that quarter
  - around 71% ($11.7bn)
  - Microsoft’s Q3 FY2025 AI revenue run rate
evaluator_interpretation:
  - Q3 FY2025 means January through March 2025.
  - Assess the reported spending amount and the resulting comparison, rather than arithmetic alone.
  - Annualize the quarter's inference spending by multiplying by four. Compare it with Microsoft's annualized AI revenue measure, preserving the author's stated constant-revenue assumption.
  - Treat the author's reporting as an estimate, rather than an audited company disclosure.
support_condition: Independent records establish approximately $2.947 billion of OpenAI Azure inference spending during January–March 2025, and a comparable Microsoft AI revenue run rate makes four times that spending approximately 71% of the denominator.
contradiction_condition: Comparable records establish materially different quarterly inference spending or a materially different ratio. Failure to verify the private billing figures is insufficient.
measurement_requirements: Quarter-specific Azure inference charges, with training, credits and revenue-sharing payments distinguished; Microsoft's corresponding AI revenue run rate and its measurement method.
source_requirements: Company disclosures, authenticated billing records, or independent reporting that verifies the underlying records. Repetition of Zitron's figures is insufficient.
