assessment_axis: causal_assessment
explicit_source_elements:
  - Noncanonical situations continue to remain difficult
  - for generative AI systems
  - precisely because frequent statistics are a mediocre substitute for deep understanding
evaluator_interpretation:
  - Noncanonical situations means unusual arrangements or uses of otherwise familiar concepts.
  - The testable causal reading is that reliance on frequent training patterns materially contributes to failures on unusual requests. The wording does not require frequency to be the sole cause.
  - Deep understanding is interpreted behaviorally as applying concepts successfully in unfamiliar situations.
  - The temporal scope is the systems discussed in February 2024, not systems first introduced later.
support_condition: Controlled changes to training-example frequencies, or comparably strong causal evidence, show that frequent patterns materially drive failures on matched noncanonical tasks in the relevant systems.
contradiction_condition: Well-controlled tests show that frequency bias does not materially explain the failures and identify another explanation that accounts for them, or establish reliable generalization across the relevant noncanonical tasks.
measurement_requirements: Measure canonical and noncanonical task success while separating training frequency from caption quality, task complexity, model architecture and sampling. Correlation alone cannot establish the full causal explanation.
source_requirements: Primary experimental studies with documented training data, controls and model versions. Output examples and authors' causal interpretations alone are insufficient.
