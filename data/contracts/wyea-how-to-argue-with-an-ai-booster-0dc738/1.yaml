explicit_source_elements:
  - around $82 billion
  - capex from 2024 onward
  - 30% of Microsoft's capex
  - $41.4 billion of funding it’s received so far
  - not everything has been invested yet in 2025
evaluator_interpretation:
  - Assess the disclosed funding-plus-capex estimate, rather than treating it as an accounting measure of losses.
  - The context supplies $55.6 billion for 2024 and $80 billion planned for 2025. The calculation includes the full stated plan.
  - Treat 30% as an expressly disclosed allocation assumption, not an independently established share.
  - Around $82 billion permits ordinary rounding to the nearest billion.
  - Funding received requires distinguishing completed receipts from announced commitments and undrawn credit.
support_condition: Independent dated records validate the funding and capital-spending inputs on compatible definitions and periods, and applying the disclosed 30% allocation produces approximately $82 billion.
contradiction_condition: Comparable verified inputs materially differ from the stated inputs or produce a total outside ordinary rounding of approximately $82 billion.
measurement_requirements: Reconcile calendar and fiscal years, cash purchases and lease-inclusive investment, completed funding and commitments, and any overlap between periods.
source_requirements: Company financial statements and investor disclosures for capital spending and funding, supplemented by dated reputable reporting where private-company records are unavailable.
