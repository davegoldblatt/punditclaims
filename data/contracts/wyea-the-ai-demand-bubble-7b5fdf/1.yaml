  content_hash: 1dede976111e8a48379a4c327aa2da235a63e6414edc41321b5ee88520848593
assessment_axis: historical_observation
explicit_source_elements:
  - without OpenAI and Anthropic
  - Microsoft, Google, and Amazon’s AI revenues
  - absolutely pathetic
  - entirely-dependent on their compute spend
evaluator_interpretation:
  - Treat 'without' as an accounting exclusion of the labs' direct compute purchases, not a forecast conditional on their disappearance.
  - Read 'entirely-dependent' as overwhelming practical revenue dependence. The surrounding discussion acknowledges other revenue, so a literal zero-other-revenue interpretation would be unfair.
  - The adjective 'pathetic' supplies no independent financial threshold and is not separately graded.
  - Use April–June 2026 as the latest comparable completed quarter before the post. The context also discusses Microsoft's completed fiscal year and calendar-year forecasts; those cannot be silently combined.
  - Payments by third-party customers for model access are distinct from compute spending by the labs, even when those customers use the labs' models.
support_condition: Comparable customer-level evidence shows that removing the labs' direct compute purchases leaves only a minor residual AI revenue business at each of the three companies.
contradiction_condition: Comparable evidence shows that one or more companies has a substantial independent AI revenue business after excluding the labs' direct compute purchases, sufficient to defeat the claim of overwhelming practical dependence.
measurement_requirements: Obtain realized AI revenue by paying customer and product, with consistent periods and gross-versus-net treatment. Separate direct lab purchases, model revenue-sharing payments and third-party purchases of AI services.
source_requirements: Company customer-level disclosures or original analyst estimates with transparent definitions. Customer counts, usage growth and total cloud revenue alone cannot establish residual AI revenue.
metric_scope:
  company: Microsoft; Alphabet Google; Amazon, assessed separately
  metric: AI revenue remaining after excluding OpenAI and Anthropic direct compute spending
  currency: USD
  units: revenue and percent of total AI revenue
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-04-01
  period_end: 2026-06-30
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period:
  start: 2026-04-01
  end: 2026-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Current-state period is unstated; latest comparable pre-post quarter selected.
  - Context mixes a completed Microsoft fiscal year with calendar-year forecasts.
  - Pathetic is an evaluative adjective without a financial threshold.
  - Entire dependence can mean literal exclusivity or overwhelming practical reliance.
  - Company-wide AI revenue and cloud-only AI revenue are not clearly separated.
  - Direct compute purchases and third-party purchases of model access may be conflated.
  - Gross-versus-net revenue treatment is unspecified.
retrospective_or_prospective: retrospective
