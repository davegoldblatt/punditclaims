ambiguity_flags:
  - Not that much more has no numerical threshold.
  - Could have bought may be rhetorical shorthand for comparable valuations, but its ordinary wording asserts acquisition feasibility.
  - A financing valuation does not establish a price for acquiring control.
  - Broader adoption does not identify consumer, enterprise, developer or combined usage.
  - Far less controversy supplies neither a common measurement method nor a historical starting point.
  - One sentence combines acquisition feasibility, adoption and reputation comparisons.
