assessment_axis: historical_observation
explicit_source_elements:
  - Neurosymbolic AI
  - a hybrid of neural networks and classical approaches
  - is starting to rise
evaluator_interpretation:
  - The surrounding retrospective identifies 2025 as the period described. The target period therefore runs from the beginning of 2025 through publication.
  - The plain reading is that neurosymbolic AI is gaining research attention and visible development. It need not be dominant or commercially widespread.
  - Evidence must concern integration of neural methods with symbolic reasoning or other classical methods. Generic AI announcements do not qualify.
  - Starting to rise describes emerging momentum, not a claim that the field originated in 2025.
support_condition: Contemporaneous research records show growing attention or development during 2025, through comparable activity measures or converging evidence such as research reviews and newly established research venues.
contradiction_condition: Comparable records show that research attention and visible development were flat or declining during the target period. A lack of commercial deployment alone would not contradict this claim.
measurement_requirements: Assess changes in research activity and visibility against the recent prior baseline. Distinguish publication growth and institutional attention from improvements on individual benchmarks.
source_requirements: Prefer research papers, publication records, conference proceedings and documented announcements. General statements by advocates require corroboration.
