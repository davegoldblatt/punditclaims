explicit_source_elements:
  - To our knowledge
  - no LLM-based system
  - can yet reliably do
  - what SHRLDU tried to do then
evaluator_interpretation:
  - SHRLDU is read as SHRDLU, the system identified in the surrounding text.
  - The checkable proposition concerns publicly demonstrated capabilities, not the authors' private knowledge.
  - The ordinary comparison covers consistent blocks-world understanding, state tracking and execution of language-directed manipulations across an exchange.
  - LLM-based systems include systems that combine an LLM with an external planner; the claim does not explicitly exclude them.
  - Reliably means repeatable success across varied relevant tasks, rather than a selected successful demonstration. No numerical cutoff is supplied.
  - For the ongoing capability state, I use January 1–October 21, 2023, the current research reporting year through publication.
support_condition: Broad contemporaneous evaluations covering relevant LLM-based systems, including hybrids, establish persistent failures across the SHRDLU-style task bundle and identify no reliable qualifying system.
contradiction_condition: A publicly documented system existing by October 21, 2023 repeatedly performs comparable blocks-world language understanding, state tracking and manipulation reliably.
measurement_requirements: A clearly specified SHRDLU-style task suite, repeated trials and documented success criteria. Distinguish isolated planning success from sustained dialogue and world-state tracking.
source_requirements: Contemporaneous primary evaluations, reproducible systems or recorded demonstrations with enough detail to assess reliability and task comparability.
