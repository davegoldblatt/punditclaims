  - This is an industry-level scaling claim, not a financial amount for a named company; metric_scope is null.
support_condition: Comparable results show that equal performance gains require exponentially increasing total development expenditure, with the performance measure and cost basis held consistent.
contradiction_condition: Comparable results in the claimed setting show equal performance gains without the asserted exponential cost increase.
measurement_requirements: A fixed performance metric, comparable model-development methods, measured data and compute use, and corresponding financial costs. Separate relationships across concepts from improvements across model generations.
source_requirements: Primary scaling research and reproducible cost measurements; quoted forecasts of future training budgets do not establish the relationship.
