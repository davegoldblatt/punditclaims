assessment_axis: historical_observation
explicit_source_elements:
  - Software like LaMDA
  - doesn’t even try to connect to the world at large
  - just tries to be the best version of autocomplete
  - predicting what words best fit a given context
evaluator_interpretation:
  - Assess the publicly described LaMDA dialogue system, including its grounding tools, rather than only its pretrained base model.
  - The ordinary technical reading of connecting to the world includes consulting external information to ground factual answers. It does not require consciousness or human understanding.
  - For this ongoing technical observation, use the current-year documentation window from the beginning of 2022 through the post date. There is no standard reporting quarter for this system.
  - Next-token prediction can coexist with external retrieval. Establishing the former alone does not establish the claim's restrictive 'just' and 'doesn’t even try'.
support_condition: Technical documentation establishes that LaMDA only generates contextual text and contains no mechanism or training objective for consulting external information to ground its answers.
contradiction_condition: Technical documentation establishes that LaMDA explicitly attempts factual grounding through external knowledge sources or tools.
measurement_requirements: Distinguish the pretrained language model from the complete dialogue system and distinguish factual grounding from sentience.
source_requirements: Contemporaneous documentation or research from LaMDA's developers describing training and inference.
