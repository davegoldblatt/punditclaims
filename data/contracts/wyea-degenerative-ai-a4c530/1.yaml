explicit_source_elements:
  - do not have consistent results
  - Both Google’s Bard AI and Bing AI
  - obvious errors in their first demos
  - largely in part
  - from what I can tell
  - making their best guess every time
evaluator_interpretation:
  - Assess the full compound claim, retaining the proposed cause rather than scoring only the demo errors.
  - First demos means the initial February 2023 public promotional demonstrations, including Google's Bard advertisement.
  - The plain reading of inconsistent results is unreliable factual accuracy; it need not mean identical prompts must produce identical wording.
  - Best guess means probabilistic generation without assured factual correctness. Largely requires evidence that this mechanism substantially explains the particular errors.
  - From what I can tell qualifies confidence; it is not a condition that must occur.
support_condition: Records establish factual errors in both initial demonstrations and evidence connects unreliable accuracy chiefly to the proposed generation mechanism.
contradiction_condition: Reliable records disprove the alleged demo errors or controlled analysis establishes that the proposed mechanism did not substantially cause them.
measurement_requirements: Compare demo outputs with the underlying facts. Separately investigate generation, retrieval, source quality, prompting, and grounding as possible causes.
source_requirements: Prefer recordings, source documents, and technical investigations. Use reputable contemporaneous reporting when the original demonstration is not readable as text.
