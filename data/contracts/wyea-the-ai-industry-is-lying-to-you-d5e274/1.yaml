assessment_axis: historical_observation
explicit_source_elements:
  - North American data center absorption
  - the IT load of data centers actually turned on and in operation
  - around 3GW for 2025
  - about 3.9GW of total power
evaluator_interpretation:
  - Assess newly operational North American IT capacity during calendar 2025, including colocation and owner-operated facilities.
  - Capacity must be operational, rather than merely leased, announced or delivered as an unfinished shell.
  - "'Around' permits ordinary estimation uncertainty; no arbitrary numerical tolerance is imposed."
  - The total-power estimate implies a power usage effectiveness ratio of approximately 1.3, which requires separate support.
support_condition: Comparable commissioning or operating-capacity records establish approximately 3 GW of newly operational IT load in North America during 2025, with facility-power requirements consistent with approximately 3.9 GW.
contradiction_condition: Comparable records establish materially more or less operational IT capacity, beyond reasonable estimation uncertainty, or materially different associated facility-power requirements.
measurement_requirements: Reconcile geography, colocation and owner-operated coverage, operational status, phased commissioning, additions within existing facilities and retirements. Distinguish IT capacity from facility power and from actual metered utilization.
source_requirements: Commissioning records or a documented market census measuring operational capacity, with consistent beginning- and end-period coverage and an explicit power-overhead basis.
