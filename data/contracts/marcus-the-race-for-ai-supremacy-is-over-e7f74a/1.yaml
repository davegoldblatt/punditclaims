ambiguity_flags:
  - The ongoing-state reporting window is evaluator-selected.
  - "'Quickly' has no stated interval."
  - "'Catch up' does not specify tasks, modalities, or acceptable performance differences."
  - "'Moat' could encompass technical or commercial advantages."
  - "'Introduces' could include announced demonstrations as well as available products."
