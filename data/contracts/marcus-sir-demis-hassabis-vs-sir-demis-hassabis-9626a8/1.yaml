evaluator_interpretation:
  - This decade means the 2020s, ending December 31, 2029.
  - "AGI uses the definition Marcus endorses in context: a system with all human cognitive capabilities, including breakthrough scientific and artistic creativity and physical intelligence."
  - The definition specifies the forecast’s target; it is not a conditional antecedent.
  - The phrase 'not even close' reinforces the forecast but supplies no separate measurable distance threshold.
support_condition: By the end of 2029, credible assessments of available systems establish that none meets the endorsed AGI definition.
contradiction_condition: A system achieved by December 31, 2029 demonstrably meets the endorsed definition, with independent verification across cognitive, creative, and physical capabilities.
measurement_requirements: Evaluate general capability across domains, including original scientific and artistic invention and physical intelligence. A narrow benchmark result or a vendor’s AGI label is insufficient.
source_requirements: Public technical records, reproducible demonstrations, and independent evaluations sufficient to assess the endorsed capabilities and establish when they were achieved.
