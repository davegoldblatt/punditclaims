explicit_source_elements:
  - Opposition to data centers
  - is rising fast
  - this new poll from the Annenberg Public Policy Center
evaluator_interpretation:
  - In context, opposition means respondents opposing new data centers in their own area.
  - The ordinary reading of rising fast is a substantial increase over a short interval that exceeds sampling uncertainty. Marcus supplied no numerical threshold.
  - "The target period covers the two survey waves compared in the referenced poll: February 17–March 20 and June 16–July 19, 2026. These measure the recent trend available before the post."
support_condition: Comparable Annenberg survey waves show a substantial increase in local data-center opposition over a few months, with statistical uncertainty excluding no change.
contradiction_condition: Comparable survey waves show opposition declining, remaining effectively unchanged, or increasing only slightly rather than sharply.
measurement_requirements: Compare the same question, population and combined opposition categories across waves. Check weighting, field dates and uncertainty in the change.
source_requirements: Annenberg's original survey tables and methodology, or an accessible reproduction attributable to Annenberg.
