evaluator_interpretation:
  - The qualification expresses uncertainty about a factual mechanism; it is not an antecedent that must occur.
  - Read the claim as saying that established test-time scaling methods use explicit algorithmic repetition, search, and answer aggregation. It does not say every method uses all these operations.
  - Calling these operations 'symbolic' follows the post's broad use of that term for explicit computational procedures; it does not establish formal symbolic reasoning inside the neural model.
  - Treat this as an as-of observation about publicly documented methods available before July 13, 2025. These methods have no recurring reporting period, so the target has a publication cutoff and no invented lower bound.
support_condition: Public implementations show test-time scaling through repeated generation or revision together with explicit search, voting, or selection procedures.
contradiction_condition: The relevant implementation descriptions show that the asserted iteration and aggregation mechanisms are absent or have been misdescribed.
measurement_requirements: Identify actual inference procedures, distinguishing algorithmic control and aggregation from the neural generation of reasoning text.
source_requirements: Primary implementation papers or technical documentation published before the post; proprietary implementation details must not be inferred from unrelated open models.
