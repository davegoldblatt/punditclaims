horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Verified data exhaustion followed by either a demonstrated insurmountable capability ceiling or a demonstrated escape from that same ceiling.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Quickly-approaching has no specified duration.
  - Training data could mean public human text or all usable training data.
  - No capability measure or ceiling is specified.
