assessment_axis: forecast_outcome
explicit_source_elements:
  - generative AI
  - a quickly-approaching wall
  - can’t leap over
  - as it runs out of training data
evaluator_interpretation:
  - The claim predicts a lasting capability ceiling caused by exhaustion of usable training data.
  - Exhaustion of public human-written text alone does not establish exhaustion of every usable source of training data.
  - Quickly-approaching supplies no definite deadline. I do not substitute another researcher's projected date.
  - The data-exhaustion condition must be established before scoring the predicted inability to overcome it.
support_condition: Verified exhaustion of usable training data, followed by a demonstrated capability ceiling caused by that exhaustion, with evidence that alternative data sources or training methods cannot overcome it.
contradiction_condition: Verified exhaustion of the relevant training data followed by reproducible capability gains that overcome the same asserted constraint.
measurement_requirements: Evidence must distinguish data exhaustion from compute limits, deployment costs, benchmark saturation and temporary slowdowns. Progress before exhaustion cannot alone contradict this conditional forecast.
source_requirements: Primary research or independently verifiable training-data and capability measurements. Forecasts of future exhaustion are context, not proof that the condition occurred.
metric_scope: null
