assessment_axis: historical_observation
explicit_source_elements:
  - A new article from UCSD and Nanyang
  - simple prompts
  - can get LLMs to collate and report information
  - in a seriously nefarious way
evaluator_interpretation:
  - The referenced result is the Imprompter research disclosed in October 2024.
  - The surrounding passage identifies the behavior as extracting personal information from a conversation and transmitting it to an attacker-controlled destination.
  - Can is an existence claim about tested systems, not a claim that every LLM is vulnerable.
  - Simple describes using a prompt to trigger the behavior; it does not imply that constructing the optimized prompt requires little expertise or computation.
  - The target month identifies the newly disclosed research. Exact laboratory experiment dates are not supplied.
support_condition: The named research demonstrates that obfuscated prompts induce an LLM agent to extract personal information and transmit it through its tools or interface.
contradiction_condition: The named research does not demonstrate personal-information extraction and exfiltration, or the reported behavior is only hypothetical.
measurement_requirements: Check the attack objective, tested products, external transmission mechanism, and experimental results. Do not equate displaying information in chat with transmitting it externally.
source_requirements: The original paper and contemporaneous reporting establishing the identity and disclosure of the research.
