evaluator_interpretation:
  - Assess paid commercial Microsoft 365 Copilot seats, not organizations, free users, or users of other Copilot products.
  - The post's later explanation explicitly dates its underlying count to August 2025. Use that month as the target period.
  - "Using the stated denominator, the claim means fewer than 13.2 million paid seats: 440 million × 0.03."
  - Treat 'cannot get' as a statement about adoption then, not a prediction that adoption could never exceed 3%.
  - The surrounding assertion that Microsoft has no good news is rhetorical and is not the numerical proposition being assessed.
support_condition: Independent evidence establishes fewer than 13.2 million paid Microsoft 365 Copilot seats in August 2025.
contradiction_condition: Independent evidence establishes at least 13.2 million paid Microsoft 365 Copilot seats in August 2025.
measurement_requirements: A dated paid-seat count or sufficiently narrow bound. Distinguish paid licenses from active licensed users, free access, customer organizations, and other Copilot products.
source_requirements: Microsoft records or independently sourced reporting. Repetition of Zitron's anonymous-source figure is not independent corroboration.
