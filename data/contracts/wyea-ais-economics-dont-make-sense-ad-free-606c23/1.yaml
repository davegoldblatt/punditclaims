evaluator_interpretation:
  - Assess the hypothetical model published on April 28, 2026, rather than the performance of an actual company.
  - Check both the numerical calculation and its description as gross margin. These are distinct, checkable parts of the quoted claim.
  - Use the stated annual revenue of $1.06 billion and costs before financing of $837.4 million, including $521 million of depreciation.
  - Interpret the remaining five years as 60 equal monthly payments, with a monthly interest rate of 6% divided by 12 and no additional fees.
  - Treat the percentages as approximate. The model's changing revenue rounding does not justify rejecting the approximately 5% claim.
  - For derived evidence, event_date identifies the published model being recomputed. The cited textbooks supply the calculation methods, not independently verified commercial inputs.
support_condition: The stated loan terms reproduce approximately $54.1 million monthly payments, and a consistent calculation reproduces the claimed margins using the stated costs and revenue.
contradiction_condition: The payments or margins materially differ on recalculation, or the claimed gross margins require deducting financing payments that do not belong in gross profit.
measurement_requirements: Recompute interest-only payments, amortizing payments, and annual margins. Distinguish depreciation, interest expense, principal repayment, and cash flow.
source_requirements: Use independent financial calculation and accounting references. Treat the speaker's numbers as hypothetical premises, not corroborated observations. Other companies' margins cannot decide this model.
