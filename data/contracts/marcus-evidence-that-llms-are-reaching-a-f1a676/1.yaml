explicit_source_elements:
  - Bright humans
  - can probably get something like 90%+
  - on any given data
  - current models aren’t close
evaluator_interpretation:
  - Read 'current' as the latest Connections benchmark reporting period available before April 13, 2024; use April 1–13, 2024.
  - Read 'bright humans' as skilled human solvers, without assuming that all people or the average player achieve 90%.
  - Compare human and model performance on the same puzzles and scoring rules. Preserve the hedge on the human estimate.
  - A model score around one-third of the maximum would plainly be far from 90%; no arbitrary boundary for 'close' is imposed.
support_condition: Comparable evidence for the target period places skilled humans around or above 90% and leading contemporary models substantially below that level.
contradiction_condition: Comparable evidence places leading contemporary models near or above 90%, or establishes that the proposed skilled-human baseline was materially overstated.
measurement_requirements: Specify whether scores count solved puzzles or correct groups, permitted attempts, feedback, prompts, puzzle sample, and human selection.
source_requirements: Dated benchmark records and documented human results. Anecdotes or later tests may supply context but cannot substitute for the historical comparison.
