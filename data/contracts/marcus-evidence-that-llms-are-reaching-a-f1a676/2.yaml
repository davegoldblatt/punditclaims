  - Bright humans can probably get something like 90%+
  - current models aren’t close
  - thanks to Lech Mazur
evaluator_interpretation:
  - Assess the firm assertion that contemporary models scored well below roughly 90% on the Connections benchmark identified in context.
  - The human estimate is explicitly tentative. It is neither a scored factual requirement nor a condition that must be established before assessing model scores.
  - Read 'current' as the latest publicly reported benchmark performance in April 2024 through the April 13 post.
  - Read 'aren’t close' as a substantial performance gap, without inventing an exact cutoff. Borderline scores would remain unresolved.
  - Use the benchmark's reported score, without treating it as an established human win rate under ordinary gameplay rules.
support_condition: Contemporaneous results for leading models on the cited Connections benchmark show scores substantially below roughly 90%.
contradiction_condition: Comparable results show that a leading model available at the time scored near or above roughly 90%.
measurement_requirements: Identify the benchmark, model versions where reported, scoring scale, and contemporaneous results. Distinguish benchmark scores from human gameplay success rates and later model results.
source_requirements: Prefer dated results from the benchmark's evaluator. Marcus's own graph or assertion cannot establish the outcome.
