assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority of enterprises
  - just don’t spend that much money on AI
evaluator_interpretation:
  - The ordinary reading is that a large majority of businesses spend modest amounts on AI relative to their size and ordinary software budgets.
  - Spending less than a few exceptionally large customers does not by itself establish modest spending.
  - Use July 2026, the latest monthly spending period in the pre-publication Ramp report located during source verification.
  - No numerical definition of modest spending or vast majority is added.
  - The aside about software revenue is contextual rather than a separate quantitative claim.
support_condition: Representative spending distributions show that a large majority of enterprises have modest AI expenditure relative to their size or software budgets.
contradiction_condition: Representative spending distributions show that substantial AI expenditure is common enough to rule out the claimed large majority with modest spending.
measurement_requirements: A representative distribution of actual expenditure, with company-size and budget denominators, covering more than the median and including AI purchases outside the two named labs.
source_requirements: Prefer transaction measurements and representative enterprise surveys. Adoption rates and intentions to increase spending cannot substitute for actual expenditure.
