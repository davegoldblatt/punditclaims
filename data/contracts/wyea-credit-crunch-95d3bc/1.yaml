assessment_axis: forecast_outcome
explicit_source_elements:
  - CoreWeave
  - per analysts at UBS
  - needs to raise $102 billion in debt
  - through 2030
  - will have to keep raising on its own two feet
evaluator_interpretation:
  - The forecast says CoreWeave must continue borrowing on its own credit rather than obtain all required financing through strong counterparties' credit.
  - "'Keep raising' does not specify that most borrowing, measured by dollars or deal count, must be standalone. No majority threshold is added."
  - The UBS attribution is an asserted factual premise, not an explicit if-then condition. Its accuracy is examined separately from whether the forecast comes true.
  - Read 'through 2030' as ending December 31, 2030.
  - The USD 102 billion figure is an analyst estimate of required future debt financing, not current debt outstanding or company guidance.
support_condition: Evidence through the deadline establishes the claimed debt-financing requirement and continued borrowing materially dependent on CoreWeave's own credit, rather than exclusively on stronger counterparties.
contradiction_condition: Evidence establishes that the claimed financing program can be completed without continued borrowing on CoreWeave's own credit, or establishes a materially different required debt amount on the same forecast basis.
measurement_requirements: Distinguish total financing needs from debt needs, gross issuance from net funding gaps, and committed facilities from actual borrowing. Examine borrower, recourse, guarantees, collateral and customer-contract dependence for each relevant financing.
source_requirements: The underlying UBS analysis or reliable reporting of it, followed by CoreWeave filings and executed financing documents through 2030.
metric_scope:
  company: CoreWeave
  metric: Estimated required debt financing through 2030
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: null
  period_end: 2030-12-31
  stock_or_flow: flow
  annualized_or_realized: not_applicable
  gross_or_net: gross
original_horizon: through 2030
horizon_interval:
