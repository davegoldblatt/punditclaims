  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Early contradiction requires completed or irrevocably secured financing for the same underlying program that eliminates any further need for own-credit borrowing. Individual standalone or counterparty-backed deals do not settle the complete amount-and-necessity forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'On its own two feet' does not define the required degree of recourse or counterparty support."
  - "'Keep raising' provides no majority threshold."
  - The quoted estimate has no explicit starting year.
  - Gross debt issuance, net funding need and total financing need may differ.
  - The forecast's dependence on the assumed expansion program is unstated.
retrospective_or_prospective: prospective
