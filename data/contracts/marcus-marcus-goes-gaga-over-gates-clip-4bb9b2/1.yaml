ambiguity_flags:
  - Metacognition can work has no supplied success threshold.
  - High-level metacognition is not operationally defined.
  - Explicit symbols could refer to external machinery, represented language or learned internal structure.
  - A literal ban on any metacognition is stronger than the surrounding high-level discussion.
