  - Generative AI
  - half of US GDP growth
  - Turns out it wasn’t
evaluator_interpretation:
  - Read the denial as saying the contribution was materially below approximately half, rather than merely different from exactly 50%.
  - Provisionally identify the target as the first half of 2025, the period identified in indexed coverage of the November statement. The underlying statement and article could not be verified through read_page.
  - GDP contribution means domestic output growth after accounting for imported inputs. Broad technology investment is a proxy, not a direct measurement of generative AI.
  - Do not substitute full-year or first-nine-month estimates for the first-half comparison.
support_condition: A credible decomposition for the referenced period isolates generative AI, or establishes a defensible upper bound, and places its contribution materially below half of US real GDP growth.
contradiction_condition: A credible decomposition for the same period and scope attributes approximately half or more of US real GDP growth to generative AI.
measurement_requirements: Match the numerator and denominator periods. Distinguish gross investment contributions from domestic contributions after imports, and distinguish AI from broader technology categories.
source_requirements: National accounts combined with a transparent attribution method. Verify the original November statement to establish its period and intended measure.
