evaluator_interpretation:
  - Read this as a public-evidence claim about identifiable AI compute purchases, rather than an unverifiable claim about the author's private search history.
  - The search universe ends at publication. Because the statement concerns what has been found and supplies no starting date, use an open-start period ending October 6 rather than invent an annual spending window.
  - The ordinary reading identifies buyers other than OpenAI and Anthropic. It does not specify whether intermediary purchases ultimately serving those companies are excluded.
  - The words do not distinguish completed purchases, annual spending and multiyear contractual commitments. These measures will not be treated as interchangeable.
  - The dollar sign is read as US dollars. No cited company figures, press estimate or accounting basis are identified in the supplied wording.
support_condition: A documented and sufficiently complete inventory, using a stated purchase measure and consistent time basis, establishes that identifiable purchases by the eligible buyers total no more than USD 22 billion.
contradiction_condition: A non-overlapping set of eligible purchases exceeds USD 22 billion on the same purchase, accounting and time basis as the claim.
measurement_requirements: Identify the spending period, distinguish realized payments from contract face values and optional capacity, identify ultimate or direct buyers consistently, and remove overlapping agreements.
source_requirements: Prefer contracts, filings and company announcements. A list of examples can establish a lower bound but cannot establish a complete market ceiling.
