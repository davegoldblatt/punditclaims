evaluator_interpretation:
  - Read the physical claim as saying that many announced facilities had little or no physical development, with Nscale offered as a concrete example.
  - Do not equate an unbuilt facility with the absence of a genuine development project or infer fraud from construction status.
  - Use 2026 Q1, the latest completed calendar quarter before publication, for the ongoing site-status observation.
  - Read the funding clause as a $2 billion financing round, not revenue, valuation, or funding dedicated solely to this site.
  - The source does not specify the funding accounting basis, closing status, or treatment of previously committed financing. Preserve that uncertainty.
support_condition: Dated inspections and construction records establish little or no physical development at Nscale's referenced site and across a sufficiently broad set of announced projects to support many; financing records establish the stated raise on a matching basis.
contradiction_condition: Dated records establish substantial construction or operation at the referenced Nscale site, or representative evidence contradicts the wider prevalence claim; matching financing records disprove the stated raise.
measurement_requirements: Identify sites and distinguish announced, permitted, under-construction, commissioned, and operational status. Distinguish announced financing from closed cash proceeds and previously committed instruments.
source_requirements: Prefer dated inspections, permits, construction records, and financing disclosures. Firsthand reporting can establish visible site conditions when no primary inspection record is available.
