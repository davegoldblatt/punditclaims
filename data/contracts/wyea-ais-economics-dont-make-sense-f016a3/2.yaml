explicit_source_elements:
  - Even if they somehow succeed
  - pathetic businesses with mediocre margins
  - 70% at best
  - assuming consistent payments, tenancy, and six fucking years of depreciation to actually break even
  - might be difficult considering the yearly upgrade cycle
evaluator_interpretation:
  - "The claim describes a hypothetical: AI data centers that 'somehow succeed' with full payments and tenancy. It names no type of margin (gross, EBITDA, operating, project-level), no operator and no period."
  - "'Pathetic' and 'mediocre' are value judgments. The obsolescence point is hedged with 'might be difficult'."
  - Testing it against any one operator's reported margin would mean supplying a margin type and a period he did not give. That is why earlier criteria were found unfair.
support_condition: Not testable as written. A test would need a defined margin measure for successful, fully tenanted AI data centers showing at most 70%, plus evidence that break-even takes about six years of depreciation.
contradiction_condition: Not testable as written. A test would need evidence that successful, fully tenanted AI data centers reliably earn well above 70% on the measure he meant, or break even well before six years.
measurement_requirements: A defined margin type, project-level economics under full tenancy, and depreciation schedules.
source_requirements: Operator filings with project-level economics. None are standard disclosures.
