assessment_axis: causal_assessment
explicit_source_elements:
  - NVIDIA’s revenues are dependent
  - hyperscalers keep being paid by OpenAI and Anthropic
  - the only two companies
  - justify their trillion-plus dollars of capex
evaluator_interpretation:
  - The plain reading is a necessary economic dependence on payments from the two labs, not merely meaningful exposure to them.
  - In context, 'their' refers to hyperscalers' capital expenditure.
  - The claim requires showing that other external customers and internal uses cannot economically justify the relevant investment scale.
  - Use NVIDIA's latest reported quarter before the post, ending July 26, 2026, for the current revenue-dependence assessment.
  - Treat 'could ever hope' as emphasis within a present causal claim, not a separate forecast with an invented deadline.
  - Use company_reported for NVIDIA revenue because the surrounding argument invokes its earnings; the trillion-plus capex assertion has no stated aggregation period.
support_condition: Customer-level payment and purchasing records establish that payments from OpenAI and Anthropic are necessary to sustain the relevant NVIDIA revenue and hyperscaler investment scale, with other demand and internal returns insufficient.
contradiction_condition: Comparable records demonstrate economically sufficient alternative demand or internal returns supporting the relevant investment and NVIDIA purchases independently of payments from the two labs.
measurement_requirements: Trace lab payments through hyperscaler cash generation, infrastructure commitments and NVIDIA purchases. Measure alternative customer demand and returns from internal workloads; customer concentration alone does not establish necessity.
source_requirements: NVIDIA and hyperscaler filings, customer-level revenue and backlog disclosures, procurement records and investment-return evidence.
