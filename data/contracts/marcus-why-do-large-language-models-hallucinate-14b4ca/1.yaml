evaluator_interpretation:
  - Assess the spending and reliability assertions together; exclude the judgement that the situation is embarrassing.
  - Read the money figure as approximately USD 500 billion in cumulative costs attributable to LLM technology, not funding raised, valuations or future commitments.
  - The surrounding post describes roughly eight years of expenditure. Use 2017 as the approximate starting year, with January 1 only as an inclusive year boundary, and end at the post date.
  - For the ongoing capability assertion, use the latest pre-post evidence, including the April 2025 report linked by Marcus. Older capability studies are context.
  - Read reliable checking as dependable detection or avoidance of factual mismatches against supplied sources, not perfect performance on every possible input. No numerical reliability threshold is imposed.
support_condition: A defined, non-duplicative accounting of cumulative LLM costs supports approximately USD 500 billion by the post, and contemporary evaluations show material failures when checking against available or supplied sources.
contradiction_condition: Comparable expenditure records place cumulative costs clearly outside a defensible approximation to USD 500 billion, or representative contemporary evaluations establish dependable source checking under the claimed conditions.
measurement_requirements: Define included companies, activities and cost categories, and avoid counting financing or transactions between suppliers and customers as additional costs. Separately measure source-checking errors, distinguishing generation from explicit verification.
source_requirements: A documented sector cost estimate with a stated basis, plus dated primary evaluations of supplied-source fidelity or fact-checking.
