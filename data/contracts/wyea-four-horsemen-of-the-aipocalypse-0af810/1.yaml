assessment_axis: historical_observation
explicit_source_elements:
  - can’t seem to keep its services online with any level of consistency
  - appears to be making its products worse
  - refuses to actually address or discuss the problem
evaluator_interpretation:
  - Assess the three listed factual assertions. The expression of disbelief and hedged valuation are framing rather than separate propositions graded here.
  - Read the reliability language as recurring material disruptions, not literally zero reliable service.
  - Read product deterioration as observable regressions in the products discussed, without requiring every underlying model to worsen.
  - Read refusal to address or discuss as absence of substantive engagement. An explanation can count as engagement even if incomplete or disputed.
  - Use the surrounding 90-day reliability window through publication. Later accounts may establish earlier defects, but later communications cannot rebut a claim about silence as of April 21.
support_condition: Records show recurring material outages and product regressions, alongside evidence that Anthropic declined substantive engagement with those problems before publication.
contradiction_condition: Reliable records show stable service or no relevant regression, or dated pre-publication responses show substantive discussion or remediation. Evidence supporting some clauses and contradicting others warrants mixed.
measurement_requirements: Dated service incidents, documented product regressions, and the content and timing of company responses. Do not equate an unsatisfying answer with no discussion.
source_requirements: Prefer official incident records, controlled evaluations or postmortems, and original dated company responses.
