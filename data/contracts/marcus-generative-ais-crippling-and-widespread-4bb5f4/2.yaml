assessment_axis: historical_observation
explicit_source_elements:
  - LLMs fail to induce proper world models of chess
  - they never induce proper worlds of anything
  - Everything that they do is through mimicry
  - rather than abstracted cognition across proper world models
evaluator_interpretation:
  - The context concerns general-purpose LLMs such as those powering ChatGPT and o3. A small transformer trained solely on game sequences is not a sufficient counterexample.
  - The plain reading of a proper world model is a coherent representation of a domain's entities, relationships and rules that the model reliably uses to track changes and reason about unfamiliar situations.
  - "Robustness matters: isolated successes, decodable factual features and above-chance predictions alone are insufficient. Robustness does not require perfect performance or competence in every domain."
  - A representation may be implicit in the model's computations. Marcus does not require a particular architecture or a separately stored symbolic database.
  - I read never retrospectively through the post date, rather than as a forecast about future models. This covers the history asserted by never; the wording supplies no starting date.
  - I read mimicry in contrast with the abstraction described in the same sentence. Learning from examples does not by itself establish that a model only mimics.
support_condition: Evidence establishes that the relevant general-purpose LLMs lack robust, usable world models across the claimed scope, and that their apparent world-model reasoning is accounted for by mimicry. Failures in selected tasks support a narrower concern but cannot establish never or everything.
contradiction_condition: "A reproducible demonstration shows that a general-purpose LLM existing by the post date induces and uses a coherent world model in at least one domain: it reliably maintains and updates relevant state and applies the domain's relationships or rules to unfamiliar cases, with controls distinguishing this ability from memorization or superficial matching."
measurement_requirements: Specify the model, domain, inputs and evaluation procedure. Test state updates, novel combinations and relevant changes in presentation or circumstances. Report failures as well as successes. Mechanistic interventions or carefully controlled behavioral tests should connect the representation to the model's answers. No numerical robustness threshold was supplied by Marcus.
source_requirements: Primary empirical studies or reproducible demonstrations concerning general-purpose LLMs. Specialized game models, externally supplied simulators and evidence of static factual representations alone cannot settle the claim. Evidence must be available by 2026-10-28 and establish facts about the target period.
