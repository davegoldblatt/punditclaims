  - Successful transfer means tracking the absent character's belief about the bookmark's location, separately from deciding where that character should resume reading.
  - The experiment occurred before publication, but its exact date is unspecified. The target interval has an unknown start and ends on February 17, 2023.
support_condition: An independent original transcript, or a faithful documented replication on the contemporary system, shows incorrect belief tracking in the bookmark variant despite success on the corresponding toy task.
contradiction_condition: The authenticated record shows correct belief tracking, or establishes that the alleged transfer failure resulted from a transcription error or a materially different question.
measurement_requirements: Complete toy and bookmark prompts, responses, conversational context, model identity and dates. Distinguish expected bookmark location from the appropriate page for resuming reading.
source_requirements: An independently preserved Eisenberg transcript or documented contemporary replication. Failures on unrelated task variations cannot substitute for this record.
