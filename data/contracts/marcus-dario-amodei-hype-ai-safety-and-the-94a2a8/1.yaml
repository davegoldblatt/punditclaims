explicit_source_elements:
  - synthetic coding agents (like Cursor)
  - apparently don’t always follow
  - basic principles
  - always keep independent backups
evaluator_interpretation:
  - The plain reading is an occasional failure to observe basic operational safeguards, not failure by every agent on every run.
  - A destructive production action without checking authorization or recoverability qualifies. The backup example concerns useful independent recovery, not merely the existence of any old copy.
  - Use April 1–27, 2026, the current month through publication, for the ongoing observation.
  - Apparently expresses uncertainty about the evidence; it does not remove the factual assertion.
support_condition: A documented contemporary agent run takes a destructive action without applying basic authorization or recovery safeguards.
contradiction_condition: The cited apparent failures are reliably disproved, or demonstrated enforced safeguards establish that the agents under discussion cannot take the alleged unprotected actions.
measurement_requirements: Separate agent behavior from user permissions and infrastructure design. Establish what backups existed, what was deleted, and whether recovery later occurred.
source_requirements: Prefer affected organizations' accounts, execution records, and provider confirmation. Do not treat an agent's generated confession as independent proof.
