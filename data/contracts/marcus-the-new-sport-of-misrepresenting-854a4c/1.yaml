explicit_source_elements:
  - Over and over I have stressed
  - a good model of engineering
  - without being a good model of humans
  - or vice versa
evaluator_interpretation:
  - The plain reading is that Marcus publicly distinguished engineering usefulness from faithfully reproducing human cognition on multiple earlier occasions.
  - Equivalent examples count; he need not have repeated this exact sentence.
  - The target is his public record before the post, with no stated beginning.
  - Interview records are evidence that he expressed these views, not evidence that his technical views were correct.
support_condition: Multiple independently hosted earlier interviews or reports show Marcus distinguishing engineering goals from reproducing human cognitive behavior, including recognizing that faithfully copying human limitations can be undesirable.
contradiction_condition: A documented examination of the relevant earlier record shows that the alleged repeated distinction was absent or misattributed, and that he instead consistently required useful AI to reproduce human cognition.
measurement_requirements: Identify separate public occasions, their dates, the speaker, and the surrounding discussion. Do not count multiple copies of one interview as repetition.
source_requirements: Dated interview transcripts or independent reporting of earlier statements. The September 2022 self-description is not outcome evidence.
