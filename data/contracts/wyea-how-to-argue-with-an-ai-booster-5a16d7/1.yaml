assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT
  - basically the same product
  - Claude or Grok
  - different LLMs
evaluator_interpretation:
  - The ordinary reading is practical substitutability for common assistant tasks, not identical models, source code or outputs.
  - The surrounding discussion makes capability, supported tasks and comparable consumer pricing relevant. Merely belonging to the chatbot category is insufficient.
  - The named comparators are Claude and Grok; the unspecified other LLMs are not treated as a universal claim about every language model.
  - For this ongoing product-state observation, the target is the current calendar quarter through publication, July 1–August 25, 2025. Only offerings available by publication count.
  - No numerical benchmark tolerance or evaluator-selected weighting of features is treated as something Zitron committed to.
support_condition: Contemporaneous product records and comparisons show that ChatGPT, Claude and Grok are practical substitutes across ordinary assistant tasks at broadly comparable consumer tiers, with differences that do not materially change those uses.
contradiction_condition: Contemporaneous comparisons demonstrate material differences in supported ordinary tasks, practical performance, access or cost that prevent the claimed broad substitutability.
measurement_requirements: Compare products and subscription tiers available by publication, including task success, tools, modalities, limits and prices. Model benchmark results alone do not establish equivalence of complete products.
source_requirements: Prefer dated vendor documentation for available features and independent or reproducible comparisons for performance. Do not substitute current product pages for historical capabilities without dated evidence.
