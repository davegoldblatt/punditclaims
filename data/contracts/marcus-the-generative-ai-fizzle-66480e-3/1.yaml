explicit_source_elements:
  - profits for the LLM providers have been elusive
  - profitability is still a struggle
  - last year
evaluator_interpretation:
  - The plain reading is that earning company-level profits had generally been difficult for LLM providers. It does not assert that every provider lost money.
  - Use net income or loss as the ordinary company-level profitability measure; operating results are separate context.
  - Use calendar 2025, the latest completed annual period anchored by the accompanying last-year financial example. This does not measure June 2026 operations.
  - The surrounding financial illustration comes from third-party reporting, so the claim's accounting basis is estimate rather than an asserted GAAP or IFRS basis.
  - The provider population is not specified. Results for individual companies cannot by themselves establish a sector-wide outcome.
support_condition: Comparable results for a representative set of major LLM providers show that company-level net losses were widespread in 2025.
contradiction_condition: Comparable results for a representative set of major LLM providers show that company-level net profits were widespread in 2025.
measurement_requirements: A defensible provider population and comparable realized annual net results. Do not substitute gross margins, operating results, cash burn, revenue, or diversified parent-company earnings.
source_requirements: Prefer provider financial statements. Where unavailable, use credible reports identifying the period, profitability measure, and accounting treatment.
