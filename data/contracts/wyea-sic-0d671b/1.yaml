assessment_axis: historical_observation
explicit_source_elements:
  - Can you replace an accountant? No.
  - A doctor? No.
  - A writer? Not if you want good writing.
  - the technology that exists today
evaluator_interpretation:
  - Replace means sustain the core duties of an actual job without another professional doing those duties in the AI's place. It does not require replacing every member of the profession.
  - Good writing means competent work fit for its intended professional purpose, rather than an evaluator's personal literary taste.
  - The reference to technology that exists today fixes the capability snapshot at June 16, 2025.
  - Task scores, assistance to an employed professional, and licensing-exam performance are insufficient by themselves to establish full-job replacement.
support_condition: Credible evaluations covering the essential duties of all three job categories establish that available systems could not reliably replace the worker, including professional-quality writing.
contradiction_condition: A verified sustained deployment or comprehensive evaluation demonstrates replacement of at least one named job category using technology available by publication; assess the remaining categories separately.
measurement_requirements: Identify the job's duties, system version, availability date, human intervention, sustained output quality, and whether an employee's core work was actually replaced.
source_requirements: Prefer deployment records and independent professional evaluations. Treat demonstrations, narrow benchmarks, and vendor claims according to their limited scope.
