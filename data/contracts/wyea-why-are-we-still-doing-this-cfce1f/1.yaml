  - It has never done so again
evaluator_interpretation:
  - The target is the disclosure record through March 17, 2026, not disclosures made afterward.
  - Annualized AI revenue counts because the speaker explicitly accepts Microsoft's run-rate disclosure.
  - A quantified dollar band such as multi-billion dollars counts as talking about AI revenues; it is less precise than an exact figure but is still a revenue disclosure.
  - Microsoft, Amazon, Alphabet/Google and Meta are within the hyperscaler population.
  - The metric_scope records the annualized revenue measure explicitly accepted by the speaker. Realized quarterly revenue is retained separately as context.
  - The parenthetical monthly conversion is not used to decide the normalized disclosure claim.
support_condition: The disclosure record establishes Microsoft's January 2025 statement and contains neither another hyperscaler's qualifying AI revenue disclosure nor a later qualifying Microsoft disclosure by the post date.
contradiction_condition: A primary record shows another hyperscaler disclosed AI-specific dollar revenue or an annual revenue run rate, or Microsoft made another qualifying disclosure after January 2025 and before the post.
measurement_requirements: Require a dollar amount or quantified dollar band tied explicitly to AI. Do not count undifferentiated cloud revenue, bookings, investment commitments or percentage growth alone.
source_requirements: Dated company earnings transcripts, releases or filings.
