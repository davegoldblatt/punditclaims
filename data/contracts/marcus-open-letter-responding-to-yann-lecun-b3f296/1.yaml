evaluator_interpretation:
  - "'Strong results' means substantial demonstrated performance relative to relevant prior systems or human benchmarks, not proof of general intelligence."
  - A neurosymbolic system must combine learned neural components with explicit symbolic representations or reasoning that contribute to its operation.
  - The claim concerns accumulated achievements by June 4, 2024. No starting date is supplied, so the target period has an open beginning.
  - "'Among others' requires evidence involving another research organization as well as DeepMind. A documented collaboration can satisfy this wording."
  - The broader context mentions Cicero, but the selected sentence does not require Cicero specifically to establish the claim.
support_condition: Published architecture descriptions and results establish strong performance by AlphaGeometry and another qualifying project involving researchers outside DeepMind.
contradiction_condition: The reported systems do not meaningfully combine neural and symbolic methods, or their applicable results fail to show substantial performance and the claimed achievements are materially misstated.
measurement_requirements: Identify the neural and symbolic components, benchmark scope, comparison systems and reported performance. Do not generalize narrow benchmark results to broad intelligence.
source_requirements: Primary research papers, accompanying code or company research disclosures available by the evaluation date and documenting achievements by the post date.
