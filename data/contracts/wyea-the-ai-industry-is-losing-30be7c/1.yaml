assessment_axis: forecast_outcome
explicit_source_elements:
  - At some point
  - Anthropic or OpenAI
  - slow down and then stop making models entirely
  - because it costs too much money to train models
  - said costs are only increasing
evaluator_interpretation:
  - Either company can satisfy the forecast, but the sequence requires a slowdown followed by durable cessation of new-model training.
  - "'Entirely' excludes stopping one product line, a temporary training pause, or restrictions on particular training environments."
  - Rising unaffordable training costs must be an established cause of cessation.
  - "'Because' supplies a causal explanation, not a separate 'if' antecedent."
  - No deadline or financial affordability threshold is supplied.
support_condition: Either company demonstrably slows and then durably ceases new-model training because rising training costs have become unaffordable.
contradiction_condition: A decisive terminal event makes this outcome impossible for both companies, with reliable evidence establishing that the predicted cost-driven sequence did not occur. Continued training for a finite period is insufficient.
measurement_requirements: Document the slowdown, the scope and durability of cessation, and its financial cause. Distinguish training from release, and temporary safety pauses from ending model development.
source_requirements: Company or legal records establishing cessation, corroborated reporting where necessary, and financial or management evidence establishing rising costs as its cause.
metric_scope:
  company: Anthropic or OpenAI
  metric: Model training costs becoming unaffordable and increasing
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
