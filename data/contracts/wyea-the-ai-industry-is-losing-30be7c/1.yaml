early_resolution_rule: Resolve only upon documented slowdown followed by durable cessation of new-model training at either company, with rising unaffordable training costs established as the cause, or a terminal event conclusively foreclosing that sequence at both companies.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'At some point' supplies no deadline."
  - "'Slow down' supplies no baseline or minimum duration."
  - "'Stop making models entirely' does not specify how permanence would be demonstrated."
  - No cost measure, currency, accounting basis or affordability threshold is supplied.
