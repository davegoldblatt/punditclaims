evaluator_interpretation:
  - "The plain reading is behavioral: models sometimes present materially flawed proofs as completed solutions."
  - Failure to sanity-check means that errors remain undetected or uncorrected in the delivered answer. It does not establish that no internal checking was attempted.
  - Deeply problematic is an evaluative judgment and is not separately scored.
  - The surrounding discussion concerns the March 2025 USAMO evaluation. I use March 2025 as the latest completed monthly observation period before the post.
support_condition: An evaluation pairs model outputs presented as solved with independent mathematical grading that identifies substantive errors or gaps.
contradiction_condition: The relevant alleged examples are shown to be valid solutions or explicit acknowledgments of failure, and a comprehensive review of the defined evaluation finds no false claims of completion.
measurement_requirements: Distinguish wrong final answers, invalid proofs and explicit admissions of failure. Expert grading must assess the argument rather than only its final answer.
source_requirements: A primary evaluation reporting both model behavior and independently checked proof validity.
