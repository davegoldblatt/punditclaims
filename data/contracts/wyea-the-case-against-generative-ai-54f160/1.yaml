explicit_source_elements:
  - LLMs can generate code
  - break down
  - hallucinating more as the tasks get more complex
evaluator_interpretation:
  - Read the rhetorical description of breakdown as declining functional reliability, and hallucination as invented or unsupported code elements or factual assertions.
  - The ordinary reading predicts increasing failure and hallucination rates as coding tasks become more demanding.
  - No reporting period is specified. Use September 1–29, 2025, the latest calendar month observable before publication, for the ongoing capability claim; earlier studies provide context.
  - Task complexity must be measured independently of whether the model failed. Task duration, dependencies and required changes are possible measures, not definitions supplied by Zitron.
support_condition: Comparable evaluations of contemporary coding models show that both failures and separately measured hallucinations increase across independently defined levels of task complexity.
contradiction_condition: Comparable evaluations show reliable performance and stable or declining hallucination rates as complexity increases across a representative task range.
measurement_requirements: Hold model versions, tools and evaluation conditions comparable. Measure task complexity, functional failures and hallucinations separately.
source_requirements: Prefer reproducible primary evaluations with task-level results and explicit definitions. General coding failures cannot automatically be counted as hallucinations.
