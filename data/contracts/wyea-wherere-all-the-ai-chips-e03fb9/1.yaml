explicit_source_elements:
  - over $374 billion in construction in progress
  - including Google, Meta, Oracle, Amazon, SpaceX, and Tesla
  - CoreWeave and IREN
  - Core Scientific and Applied Digital
  - Amazon’s contribution ($71.7 billion) is only current as of the end of 2025
evaluator_interpretation:
  - Test the sum of reported CIP balances, including Alphabet's equivalent assets-not-yet-in-service category.
  - Use the latest reporting dates available before publication, retaining Amazon's expressly specified December 2025 balance.
  - The target interval accommodates these differently dated stocks; it is not a period over which spending is accumulated.
  - Reconstruct the ten named companies first. Because 'including' and 'like' need not identify the complete dataset, a subtotal below the threshold does not conclusively disprove a larger undisclosed cohort.
  - "An older Amazon balance does not by itself establish an undercount: assets can enter service and leave CIP."
support_condition: A complete, non-duplicated reconstruction of the article's company cohort exceeds USD 374 billion using its reporting-date convention. Evidence of subsequent net CIP additions would support the undercount qualification.
contradiction_condition: The complete intended cohort totals USD 374 billion or less on that convention. A subtotal for only part of an unspecified cohort is insufficient.
measurement_requirements: Use reported CIP stocks, not capex flows, future project budgets, purchase commitments, or all property and equipment. Preserve company boundaries, dates, units, and equivalent accounting categories.
source_requirements: Company filings and property-and-equipment notes, with an identifiable complete company roster.
