assessment_axis: forecast_outcome
explicit_source_elements:
  - Anthropic and OpenAI
  - losing tens of billions of dollars a year
  - a trillion or more dollars’ worth of GPUs
  - they’ll never, ever be able to make the money back
evaluator_interpretation:
  - "This is a compound claim: a present annual-loss observation and an indefinite forecast about recovery of hyperscaler GPU investment. The forecast determines the overall horizon."
  - For the loss clause, I use calendar 2025, the latest completed annual period before publication. I do not annualize a later half-year figure.
  - I read tens of billions as at least USD20 billion annually for the two labs collectively. The wording could also be read as applying separately to each.
  - The source does not specify net loss, operating loss or cash burn. Those measures must not be substituted for one another.
  - Making the money back means cumulative attributable returns after operating costs and recoveries covering the relevant GPU purchase cost. Company-wide revenue alone would not demonstrate recovery.
  - The contract metric_scope describes the forecast's GPU investment. The separate loss clause concerns Anthropic and OpenAI, USD billions, realized annual flows for January–December 2025, with an unspecified accounting basis.
  - No deadline, fixed GPU investment cohort or exhaustive list of hyperscalers is supplied.
support_condition: Comparable annual figures establish the lab-loss assertion, and a closed investment lifecycle establishes that the relevant trillion-plus GPU spending was not recovered and can generate no further recoveries. Present losses or slow returns alone cannot establish never.
contradiction_condition: Comparable annual figures refute the loss assertion, or verified cumulative attributable net returns and recoveries cover the relevant GPU investment. Because the financial basis is unspecified, a supported or contradicted score requires resolving that basis first.
measurement_requirements: Separate annual operating-loss, net-loss and cash-flow records for both labs; a defined hyperscaler and GPU investment cohort; cumulative investment costs, attributable operating cash returns and residual recoveries on a consistent basis.
source_requirements: Audited statements or clearly identified company financial disclosures, supplemented by independently verified reporting where primary records are unavailable. Lifetime investment recovery requires records of attributable returns, not aggregate cloud revenue or total capital expenditure.
metric_scope:
  company: Hyperscalers, unspecified
  metric: Cumulative GPU purchase spending of at least one trillion and its lifetime recovery
  currency: USD
  units: trillions
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01-01
  end: 2025-12-31
  precision: day
condition_status: not_applicable
early_resolution_rule: Verified cumulative net recovery of the defined GPU investment would conclusively contradict never. Support would require final retirement or disposal and closure of all relevant economic interests, with no possible further recoveries and cumulative returns below cost. Neither current losses nor forecasts qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Combines a historical observation with an open-ended forecast.
  - Latest completed annual period selected for the ongoing annual-loss observation.
  - Collective versus separate lab-loss threshold.
  - Accounting basis for losing money is unspecified.
  - Hyperscalers and the relevant GPU investment cohort are not enumerated.
  - No deadline or explicit investment-return measure.
  - One metric_scope object cannot represent both distinct financial components; the secondary scope is stated in evaluator_interpretation.
retrospective_or_prospective: retrospective
