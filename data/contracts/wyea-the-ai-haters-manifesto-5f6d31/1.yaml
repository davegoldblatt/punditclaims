assessment_axis: causal_assessment
explicit_source_elements:
  - AI-authored code
  - especially vibe-coded programs
  - inherently dangerous
  - disrespectful to the user
  - I believe
  - behind the overall deterioration of software at large
evaluator_interpretation:
  - Disrespectful is a value judgment and is not scored as an empirical finding.
  - The assessable causal assertion is that substantially AI-authored software creates security or reliability hazards and materially contributes to a broad decline in software quality.
  - The surrounding passage permits small scripts and emphasizes surrendering understanding and responsibility. It should not be read as condemning every AI-assisted line of code.
  - I believe expresses uncertainty about the causal explanation; it is not a conditional antecedent.
  - No beginning or baseline for the alleged deterioration is supplied. The assessment concerns deterioration already occurring by the post date.
support_condition: Representative evidence establishes an underlying decline in software quality and isolates a material contribution from AI-authored code, with evidence that the asserted danger persists in the relevant development conditions.
contradiction_condition: Representative causal evidence rules out a material contribution to the alleged decline, or demonstrates that the asserted inherent danger does not hold under the relevant conditions. A limited favorable study cannot settle software at large.
measurement_requirements: Measure security, defects, reliability, or maintainability; identify AI authorship and review practices; establish a baseline; control for project complexity, developer experience, and other changes.
source_requirements: Prefer controlled experiments and longitudinal production studies. Surveys, benchmark defects, and anecdotes alone cannot establish industry-wide causation.
