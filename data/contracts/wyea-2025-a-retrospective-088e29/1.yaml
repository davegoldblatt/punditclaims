assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI's revenues
  - around $4.5 billion
  - by the end of September
  - $4.3 billion for the first half of the year published by other outlets
evaluator_interpretation:
  - Read the main amount as cumulative realized revenue from January 1 through September 30, 2025.
  - The basis is estimate because the assertion derives from reporting and documents rather than a stated accounting standard.
  - The ordinary reading is total company revenue, before treating a commercial partner's net settlement as the company's revenue.
  - "'Around' permits rounding and modest estimation differences; no precise tolerance was supplied."
  - The first-half figure is a separate statement about reporting. It cannot itself establish nine-month revenue.
  - "'By the end of September' specifies the observation period, not a conditional antecedent."
support_condition: Independent evidence measuring cumulative OpenAI revenue through September 2025 on the same basis places it around $4.5 billion.
contradiction_condition: Independent evidence measuring the same nine-month revenue on the same basis places it materially outside an ordinary approximation to $4.5 billion.
measurement_requirements: Use realized cumulative revenue, not annualized run rate, financing, Microsoft receipts or net revenue-sharing settlements. Reconcile gross and net treatment.
source_requirements: Company financial records or independently verified reporting based on them. Repetition of Zitron's calculation is not independent confirmation.
