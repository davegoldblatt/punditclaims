explicit_source_elements:
  - free
  - impossible-to-disable
  - ask questions and generate images
  - virtually any Facebook property
evaluator_interpretation:
  - "Facebook property means Meta's four main social and messaging apps: Facebook, Instagram, WhatsApp, and Messenger."
  - Impossible to disable means that ordinary users of the current apps had no setting to remove the integrated assistant entirely.
  - Muting, deleting a conversation, disabling group participation, or using an older app is distinct from disabling the assistant throughout the current app.
  - The observation concerns the April–May 2024 rollout in supported countries, rather than availability to every account worldwide.
  - For this ongoing product-state claim, the target period is the rollout immediately preceding the post.
support_condition: Contemporaneous documentation establishes the assistant's question-answering and image-generation capabilities across the four main apps, and contemporary tests or company statements establish the absence of a complete user-facing off switch.
contradiction_condition: A documented ordinary setting completely disabled the integrated assistant, or the assistant was absent from a substantial part of the named app family during the rollout.
measurement_requirements: Distinguish complete removal from notification controls, conversation deletion, group controls, regional availability, and use of older app versions.
source_requirements: Dated Meta product documentation and contemporary reporting or interface tests.
