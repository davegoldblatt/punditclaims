explicit_source_elements:
  - '"only a few hundred megawatts — if that"'
  - '"of actual, usable AI compute capacity"'
  - '"is being spun up every quarter"'
  - '"I think in reality"'
evaluator_interpretation:
  - '"I think" signals belief, but the claim is a firm figure: industry-wide, no more than a few hundred megawatts of usable AI capacity comes online per quarter.'
  - Scope is the whole AI industry worldwide, since no company or region is named.
  - "Present tense with no named period: tested against the most recent full quarter before the 12 May 2026 post, January to March 2026."
  - '"Usable" means capacity that is operational (energized, with compute running), not merely built or contracted. Independent measurement is preferred over company claims, which he disputes.'
  - '"A few hundred megawatts, if that" is read as roughly 500 MW or less per quarter.'
support_condition: Independent measurement showing that operational AI data center capacity worldwide rose by about 500 MW or less in January to March 2026.
contradiction_condition: Independent measurement showing that operational AI capacity added in January to March 2026 clearly exceeded a few hundred megawatts, for example well over 500 MW of IT power across a subset of sites.
measurement_requirements: Megawatts (IT or facility power) of AI data center capacity that became operational between 2026-01-01 and 2026-03-31.
source_requirements: Independent site-level measurement (satellite imagery, permits) or official statistics. Company capacity claims are context only, because he disputes them.
