explicit_source_elements:
  - OpenAI and Anthropic don't really have assets
  - don't own any of their data center infrastructure
  - the chips inside
  - or even their office buildings
  - their negative cashflows
  - products under constant threat from cheaper open source alternatives
evaluator_interpretation:
  - The claim describes the two companies' state when the post ran on 2026-10-06. He named no period, so the target period is 2026 up to the post date. That covers the most recent results either company had reported (Q1 2026 for OpenAI, H1 2026 for Anthropic). The Anthropic H1 figures were disclosed in its S-1 on 2026-10-26, after the post but before the evaluation date.
  - "Plain reading of the ownership part: neither company owns, in any material way, the data centers or chips it runs on or the office buildings it uses. Leased or rented capacity, including finance-leased equipment, does not count as owned."
  - "Plain reading of 'negative cashflows': the cash the business generates is negative. Operating cash flow, free cash flow or reported cash burn can each show this. The claim says this of both companies."
  - "'Under constant threat from cheaper open source alternatives' is a qualitative judgment with no measure. It is not scored."
  - The claim is scored part by part. The ownership part and the cash-flow part are tested separately for each company.
support_condition: Credible reporting or filings from 2026 show neither company owns material data centers, chips or offices, and both report negative cash flow or cash burn.
contradiction_condition: Filings or credible reporting from 2026 show that either company owns material data center infrastructure or chips, or that either reported positive operating or free cash flow for its latest reported period before the post.
measurement_requirements: Ownership versus lease status of data centers and accelerators. Sign of operating cash flow, free cash flow or cash burn for the latest 2026 period each company reported.
source_requirements: Company filings (Anthropic S-1) or reputable news reporting on them, and reputable reporting on OpenAI's shareholder documents and infrastructure strategy.
