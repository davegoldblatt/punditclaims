assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI and Anthropic
  - don’t really have assets
  - don’t own any of their data center infrastructure
  - the chips inside
  - or even their office buildings
  - negative cashflows
  - under constant threat from cheaper open source alternatives
evaluator_interpretation:
  - In the collateral discussion, the ordinary reading is little owned tangible infrastructure, rather than literally no cash, intellectual property or accounting assets.
  - The categorical ownership assertions remain testable separately from the loose phrase 'don’t really have assets'.
  - Read negative cashflows as negative operating cash flow; free cash flow is a plausible alternative and must not be substituted silently.
  - Read competitive threat as the existence of commercially credible lower-cost substitutes, not a prediction that the companies must fail.
  - Use April–June 2026 as the latest normally reportable calendar quarter before the post. First-half and third-quarter flows are context unless they separately establish the June-quarter result.
  - The contract metric_scope describes the asset-stock component. Cash flow is a separate flow component requiring its own matching records.
support_condition: For both companies, ownership records establish the claimed lack of owned infrastructure, matching cash-flow records establish negative operating cash flow, and comparable cost and capability evidence establishes credible cheaper open-source substitutes.
contradiction_condition: Matching evidence establishes ownership of an explicitly excluded asset or nonnegative operating cash flow for either company, or otherwise decisively refutes a specified component. Partial findings must not be presented as settling every component.
measurement_requirements: Separate legal ownership from operating leases and finance-lease right-of-use assets. Separate operating cash flow, free cash flow and net loss. Compare competing models on the same workloads, dates and total usage costs.
source_requirements: Balance sheets, asset and lease notes, ownership records and cash-flow statements for both companies; dated model licenses, prices and independent capability or adoption evidence.
