  - People really do use them for coding
  - searching defined libraries of documents
  - generating draft materials
  - brainstorming
  - summarizing and searching documents
  - These are useful, but they are not magical
evaluator_interpretation:
  - The plain reading is that these are genuine, useful applications of LLMs, without implying perfect performance or universal adoption.
  - Use 2024, the latest completed calendar year before publication, for the ongoing usage observation.
  - "'Not magical' is rhetorical emphasis on limitations, not a separate measurable proposition."
  - Usefulness means practical assistance with the task, not proven enterprise-wide profitability.
support_condition: User studies or documented deployments establish actual use across the listed categories, with reports or measurements of practical assistance.
contradiction_condition: Credible evidence establishes that the asserted applications were not real uses or provided no practical assistance during the target period.
measurement_requirements: Distinguish observed or reported use from product availability and future intentions. Cover coding, bounded document retrieval, drafting, brainstorming and summarization.
source_requirements: Primary usage surveys, deployment records or task studies. Company reports are acceptable for establishing existence, with their limitations stated.
