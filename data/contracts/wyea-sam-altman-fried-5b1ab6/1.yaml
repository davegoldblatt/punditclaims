  - ChatGPT
  - anodyne business copy
  - always require enough editing
  - questionable how much time you've actually saved
evaluator_interpretation:
  - The plain reading is that editing routinely consumes enough of the initial drafting advantage to make meaningful overall time savings doubtful, even for ordinary business writing.
  - Business copy includes routine professional emails, reports, and promotional writing. Controlled assignments resembling this work are relevant, but do not establish performance under every employer's publication requirements.
  - I use 2023 through the post date as the recent pre-publication observation window for the contemporaneous technology. This capability has no regular reporting quarter; the wording does not limit the observation to work performed on the publication day.
  - The test concerns total task time and assessed final quality, rather than the speed of generating an initial draft.
support_condition: Contemporaneous controlled evaluations show that editing and checking generally eliminate substantial time savings on ordinary business-writing tasks at comparable final quality.
contradiction_condition: Contemporaneous controlled evaluations demonstrate substantial total completion-time savings on ordinary business-writing tasks, including participants' editing, without worse assessed final quality. This would contradict the blanket assertion, without establishing savings for every task.
measurement_requirements: Compare completed human-only and ChatGPT-assisted work, measuring total completion time and independently assessed quality. Identify any omitted checking or company-specific requirements.
source_requirements: Prefer original randomized studies of contemporaneous ChatGPT and professional writing; distinguish experimental assignments from production workflows.
