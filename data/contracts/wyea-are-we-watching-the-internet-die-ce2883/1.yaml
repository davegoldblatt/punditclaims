assessment_axis: historical_observation
explicit_source_elements:
  - The algorithms are easily-tricked
  - tools used to trick them
  - becoming easier to use and scale
evaluator_interpretation:
  - The ordinary reading is that major platforms have ranking systems that people can successfully manipulate with readily available content tools. It does not require every algorithm to be vulnerable.
  - Easier to use and scale means reducing the human work needed to produce and publish manipulative content.
  - "Because this describes an ongoing trend without a reporting cadence, I use the latest completed calendar year through the post date: January 2023 to March 11, 2024."
  - Documented workflows and observed distribution can establish the qualitative claim, although they cannot establish a platform-wide success rate.
support_condition: Contemporaneous cases show readily available automated tools producing manipulative content at substantial scale and obtaining platform distribution, with evidence that these tools reduced production effort.
contradiction_condition: Representative contemporary tests show that the described workflows generally fail to obtain distribution, or that producing successful manipulative content has not become easier or more scalable.
measurement_requirements: Distinguish content production from successful ranking manipulation. Report effort, output volume and observed distribution where available; distinguish estimates and promotional claims from independently verified results.
source_requirements: Prefer platform disclosures and independent measurements. Reporting on observed campaigns is acceptable when underlying platform records are unavailable.
