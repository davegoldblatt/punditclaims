assessment_axis: forecast_outcome
explicit_source_elements:
  - Coding LLMs Don’t Actually Replace Software Engineers
  - Never Will
  - Due To The Inherent Unreliability Of Large Language Models
evaluator_interpretation:
  - Never supplies no finite deadline.
  - Replacement means sustained substitution for substantive software-engineering jobs, including demonstrably avoided hiring, rather than just generating code or saving some worker time.
  - Ordinary human management and review do not automatically disqualify replacement. Evidence must show that humans are not still doing the substantive work attributed to the replacement.
  - Inherent unreliability is the proposed explanation, not a conditional antecedent that must occur before the forecast can be assessed.
support_condition: No finite period without replacement can establish the unlimited never prediction.
contradiction_condition: A documented deployment demonstrates reliable, sustained substitution for substantive software-engineering jobs and verifies the resulting labor substitution.
measurement_requirements: Document work scope, duration, reliability, human intervention, and actual eliminated or avoided engineering labor. Benchmark scores and code volume alone are insufficient.
source_requirements: Prefer employer deployment and staffing records with independent corroboration. Vendor reports require scrutiny of remaining human work and the staffing counterfactual.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted upon a dated, corroborated deployment that reliably performs substantive engineering jobs and demonstrably substitutes for their human staffing. Assistance, task automation, or an unsupported hiring claim alone does not meet the rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Replace could mean individual jobs, partial labor substitution, or elimination of the profession.
  - No reliability threshold, deployment duration, or deadline is stated.
  - The distinction between an LLM and an LLM-based agent with tools is unstated.
retrospective_or_prospective: retrospective
