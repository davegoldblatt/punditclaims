  start: 2023-08-25
  end: 2025-08-25
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No application population, weighting method, or unit of completed work is specified.
  - The context moves between per-task costs, changing frontier models, and total application spending.
  - The two-year window is approximate; exact boundaries are evaluator-supplied.
  - A reading that denies every individual cost decrease is stronger than the general application-spending trend assessed here.
