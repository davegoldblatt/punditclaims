assessment_axis: historical_observation
explicit_source_elements:
  - The cost of inference has gone up
  - Statements otherwise are purely false
  - cost-per-tokens
  - use more tokens to create an output
evaluator_interpretation:
  - Read this as a claim about the general direction of actual inference spending per application workload, including reasoning tokens, as applications adopt newer models.
  - A representative workload trend is needed to establish the general claim. Neither a token-price reduction nor one expensive application settles that trend.
  - The surrounding discussion refers to growth over the last two years. Use approximately August 2023 through the publication date, with the exact anniversary as an operational boundary.
  - This is an industry service-cost claim, not a claim about a named company's financial accounts; metric_scope is null.
support_condition: Representative longitudinal application data show rising inference spending per comparable unit of work after accounting for token consumption, model choice, caching, quality, and workload changes.
contradiction_condition: Representative longitudinal application data show falling inference spending per comparable unit of work over the period, including reasoning tokens and changes in deployed models.
measurement_requirements: Application bills linked to input, output, reasoning and cached tokens, completed work, quality, and model versions. Separate changing task volume and difficulty from changes in cost.
source_requirements: Primary application usage records or an independent study with a documented sample and comparable longitudinal measurements.
