early_resolution_rule: Representative records establishing a broad, material, realized reduction in enterprise AI expenditure caused by high and volatile costs could settle the forecast early.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline or size of reduction is specified.
  - AI gets cut could mean particular projects or total expenditure.
  - The population of enterprises is unspecified.
  - Higher than anything else does not specify total expenditure, unit cost, or volatility.
  - The accounting basis is unspecified.
