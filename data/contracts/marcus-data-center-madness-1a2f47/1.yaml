evaluator_interpretation:
  - Assess the supplied proposition about public appetite, not the separate judgment that the economics make no sense.
  - The US political context identifies the relevant public as Americans.
  - The plain reading is essentially absent public support, allowing ordinary rhetorical exaggeration. It is stronger than saying opponents outnumber supporters.
  - Use August 1–21, 2026, the current month through publication, for an ongoing public-opinion state that surveys could measure before the post. Earlier polling is background; later publication of pre-post fieldwork is admissible.
support_condition: Representative polling finds negligible support for AI data-center construction, with the result robust to ordinary differences between national and local questions.
contradiction_condition: Representative polling finds a substantial supportive minority for AI data-center construction, even if opposition is greater.
measurement_requirements: Measure support directly. Distinguish AI-specific construction from generic data centers, national construction from nearby siting, and all support from strong support alone.
source_requirements: Primary representative survey results with field dates, population, question wording, and weighting or sampling information.
