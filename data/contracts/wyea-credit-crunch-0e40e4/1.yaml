ambiguity_flags:
  - No deadline is stated.
  - "'Horrendously expensive' has no numerical threshold."
  - The source and accounting basis of the $174 billion debt premise are unspecified.
  - It is unclear whether 'impossible to complete' refers to financing or construction.
  - The additional-interest clause lacks a baseline and time unit.
  - The claim combines one named project with an unrestricted class of future projects.
