assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority
  - Anthropic’s recent surge in revenue
  - experimental revenue
  - clear visibility into their organizational token spend
evaluator_interpretation:
  - The claim concerns the source of incremental revenue, not the share of total revenue or the number of customers.
  - The ordinary reading of experimental spending is spending on trials, exploration, or unproven uses rather than established production work.
  - "The same spending must satisfy both descriptions: experimental use and inadequate organizational spending visibility."
  - Vast majority means an overwhelming share, clearly above half. The speaker supplies no numerical cutoff.
  - Clear visibility means reasonably usable information about organizational token consumption and associated charges. It does not necessarily require attribution to every task.
  - I interpret recent as March through May 2026, the latest three completed months before the post, following the context's references to a few months of changed billing and late-May spending concerns. This period is an evaluator choice.
  - Revenue ordinarily means realized revenue. The claim does not specify an accounting basis or explicitly identify annualized run-rate revenue.
support_condition: Representative customer-level records, reconciled to Anthropic's revenue increase during the target period, show that an overwhelming share came from experimental spending by customers lacking reasonably clear organizational token-spend information.
contradiction_condition: Comparable records show that spending satisfying both descriptions accounted for at most half of the increase, or establish another upper bound clearly incompatible with an overwhelming share. The mere existence of reporting tools or production customers is insufficient.
measurement_requirements: Measure incremental revenue over a consistent baseline and classify the associated spending by experimental versus established use and by reporting access and adequacy. Use revenue-weighted coverage, not customer counts. Keep realized revenue separate from annualized run rates.
source_requirements: Company financial records and representative customer spending disclosures, supported by contemporaneous reporting documentation or customer evidence. Isolated anecdotes and promotional descriptions cannot establish the claimed share.
