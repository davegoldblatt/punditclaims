assessment_axis: historical_observation
explicit_source_elements:
  - burns billions of dollars
  - does not appear to have any path
  - making a profit
evaluator_interpretation:
  - Burns billions ordinarily means annual net cash consumption measured in multiple billions of dollars, rather than gross expenditure or an accounting loss.
  - I use calendar 2024, the latest completed annual period before publication, for the cash-burn observation.
  - No apparent path means no publicly substantiated route to sustainable profitability apparent by April 28, 2025. It does not mean OpenAI could never become profitable.
  - The financial assertion is treated as an estimate because the context discusses externally reported financial information rather than identified audited accounts.
  - A company break-even forecast is relevant counterevidence, but its existence alone does not establish that the route is credible.
support_condition: Comparable evidence establishes multi-billion-dollar net cash consumption in 2024, while public revenue and cost information available by the post supports the absence of a substantiated route to profitability.
contradiction_condition: Comparable 2024 cash-flow evidence refutes multi-billion-dollar net cash consumption, or a publicly documented and substantiated revenue-and-cost plan establishes an apparent route to profitability by the post date.
measurement_requirements: Separate cash consumption from net loss, operating loss, stock compensation and gross spending. Assess the profitability plan using information public by publication, without treating subsequent business developments as contemporaneous knowledge.
source_requirements: Financial records or reputable reporting that identifies the cash measure and period; contemporaneous public plans with revenue, cost and break-even assumptions.
