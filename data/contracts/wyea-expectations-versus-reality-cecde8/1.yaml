explicit_source_elements:
  - none of this shit actually works
  - if you’re making an actual movie
  - the same person or character look and move and act the same way across a contiguous series of shots
evaluator_interpretation:
  - The ordinary contextual reading concerns Sora's usefulness for making directed, consistent movie scenes, rather than whether it can produce any usable footage.
  - Ordinary editing and color grading do not establish failure. Repeatedly changing the intended scene or repairing unwanted content is relevant evidence of a workflow limitation.
  - The speaker supplies no reporting period. I use the latest completed month and the elapsed publication month, April 1 through May 13, 2024, for the ongoing preview workflow.
  - The phrase about making a movie specifies the use case; it is not a conditional forecast.
support_condition: Contemporary production records establish that Sora could not reliably deliver intended, consistent movie scenes without substantial corrective work or changes to the intended scenes.
contradiction_condition: A documented professional movie production demonstrates that the contemporary Sora workflow reliably delivered intended, consistent scenes with ordinary production work.
measurement_requirements: Production records identifying the Sora version, intended shots, usable output, continuity failures, retries, corrective work, and completed results. A selected demonstration alone cannot establish general reliability.
source_requirements: Firsthand production accounts or independently documented workflows. Later Sora versions cannot settle this historical claim.
