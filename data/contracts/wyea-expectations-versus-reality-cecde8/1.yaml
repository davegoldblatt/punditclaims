ambiguity_flags:
  - Actual movie does not specify length, distribution, or production standard.
  - Works does not specify acceptable retries or corrective work.
  - A literal prohibition on any useful footage is stronger than the surrounding discussion of reliable scene production.
  - The observation period is evaluator-selected because the speaker describes an ongoing state.
