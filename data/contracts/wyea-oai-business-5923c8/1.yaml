explicit_source_elements:
  - ChatGPT’s free version
  - a marketing channel
  - burns billions of dollars
  - only ten million people will actually pay for
evaluator_interpretation:
  - The surrounding sentence expressly describes ten million existing paying subscribers. I therefore assess a contemporaneous observation, not a permanent ceiling on future subscriptions.
  - For the ongoing state, I use July through September 2024, the latest completed calendar quarter before publication. Contemporaneous subscriber observations within that quarter are relevant.
  - I read billions as an annual spending scale, rather than billions spent each quarter; the source does not state the cost period.
  - The cost measure must isolate serving free ChatGPT users. Total company losses, training expenses, and inference for paying customers or API users are not substitutes.
  - Ten million is an approximate consumer-subscription count. Business seats require separate treatment.
  - Poison is evaluative language and is not separately scored.
support_condition: Contemporaneous records establish roughly ten million paying consumer subscribers and free-tier operating costs at a multibillion-dollar annual rate during the target period, with evidence that the tier serves user acquisition.
contradiction_condition: Comparable records establish materially different consumer subscriber numbers or free-tier costs below the claimed annual scale. Different-period or company-wide figures cannot supply that contradiction.
measurement_requirements: Separate free-tier costs from paid ChatGPT, API inference, research, and training. Identify whether costs are gross expenses or net losses and whether they are realized or annualized. Separate individual subscriptions from business seats.
source_requirements: Company records or reliable reporting based on financial documents that identifies both the free-tier cost allocation and contemporaneous subscriber population.
