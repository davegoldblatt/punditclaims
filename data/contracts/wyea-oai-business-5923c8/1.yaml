ambiguity_flags:
  - The observation supplies no reporting period; the latest completed quarter is used.
  - Burns billions does not specify an annual, cumulative, or quarterly amount.
  - Burns could mean gross operating expense or net cash loss.
  - Ten million could refer to consumer subscribers or all paid seats.
  - Will actually pay could sound predictive in isolation, but the surrounding text identifies current subscribers.
