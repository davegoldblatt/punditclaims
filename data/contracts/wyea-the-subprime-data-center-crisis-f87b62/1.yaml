evaluator_interpretation:
  - The surrounding discussion limits the claim to AI data centers.
  - The plain reading is that operating AI data centers generally fail to earn a profit after operating costs, depreciation and financing costs. It does not require every facility to lose money.
  - Use January–March 2026, the latest quarterly financial reporting period publicly available before the July 22 post.
  - Consolidated operator results are informative but cannot automatically establish the profitability of individual facilities or the sector.
  - The supplied passage specifies no accounting basis; the contract therefore records unknown.
support_condition: Representative financial evidence establishes that AI data-center operations generally incurred losses after all relevant costs during the target period.
contradiction_condition: Representative financial evidence establishes that AI data-center operations generally earned profits after those same costs during the target period.
measurement_requirements: Separate AI data-center operations from other businesses and investment gains. Include depreciation, financing costs and allocated overhead. Apply a consistent accounting basis and aggregation method.
source_requirements: Facility or segment financial statements, supplemented by operator filings. Consolidated results alone require evidence that they represent the claimed operations.
