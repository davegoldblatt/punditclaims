evaluator_interpretation:
  - The antecedent is the prediction of AGI, rather than the separate promise of being the smartest AI.
  - The ordinary reading of AGI is general, adaptable competence at approximately human level across a broad range of intellectual tasks. It does not require perfect answers.
  - The target is the launch version demonstrated on February 17 US time, February 18 UTC.
support_condition: Evaluations of the launch version establish substantial, systematic limitations inconsistent with broadly general human-level competence.
contradiction_condition: Credible evaluations establish that the launch version exhibited broadly general human-level competence under the stated reading.
measurement_requirements: Broad capability testing with human comparisons, identified model configurations and enough coverage to distinguish general limitations from isolated mistakes.
source_requirements: Independent evaluations of the launch version. Benchmark leadership, company marketing and absence of AGI certification are insufficient by themselves.
