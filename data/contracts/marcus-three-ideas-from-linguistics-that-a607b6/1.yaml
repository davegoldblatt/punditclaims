explicit_source_elements:
  - choose to interpret language compositionally, or not
  - this degree of cognitive flexibility
  - lacking in current large language models
evaluator_interpretation:
  - The ordinary reading concerns reliable switching between literal and idiomatic interpretations as context changes. It does not require conscious choice.
  - The comparison with humans concerns flexibility, not perfect accuracy or merely recognizing that an expression is an idiom.
  - Current refers to models available when the post appeared, including the GPT-3 and BERT models named in its context. The target is their state on 2022-06-22; these capabilities have no regular reporting period.
support_condition: Representative tests of contemporaneous models show substantial difficulty switching between literal and idiomatic meanings of the same expressions, where people reliably make that switch.
contradiction_condition: Representative tests demonstrate reliable context-appropriate switching between literal and idiomatic meanings by contemporaneous models, sufficient to refute the claimed absence of this flexibility.
measurement_requirements: Paired contexts for the same expressions, identified model versions, separate results for both readings, held-out examples, and a human comparison. Distinguish recognizing idiomatic usage from interpreting its meaning.
source_requirements: Independent experimental results or independently evaluated public outputs for models available by the post date. Later models cannot settle the historical claim.
