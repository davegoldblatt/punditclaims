explicit_source_elements:
  - revenue grew about 46.9%
  - $11.5 billion to a little under $17 billion
  - quarter-over-quarter
  - compute costs nearly doubled
  - $5.6bn to $9.9bn
  - about 77.4%
evaluator_interpretation:
  - The comparison is Q3 2026 against Q2 2026.
  - Compute costs means the filing's compute and infrastructure expense line.
  - About permits small rounding discrepancies; for this assessment, a difference below 0.5 percentage points is immaterial.
  - Nearly doubled is read alongside the explicit 77.4% figure, not as a separate promise of 100% growth.
support_condition: Comparable company-reported quarterly figures produce revenue growth within 0.5 percentage points of 46.9% and compute expense growth within 0.5 percentage points of 77.4%, with amounts approximately as stated.
contradiction_condition: Comparable figures materially differ from either stated growth rate or amount, or the comparison combines incompatible periods or metrics.
measurement_requirements: Use unrounded Q2 and Q3 realized revenue and compute and infrastructure expense. Calculate growth as 100 × (Q3/Q2 − 1).
source_requirements: Anthropic's amended registration statement, preferably the original filing, with any reproduction clearly identified.
