explicit_source_elements:
  - GPT-5 will continue to hallucinate
  - make a bunch of wacky errors
  - whenever it finally drops
evaluator_interpretation:
  - The release of GPT-5 is the antecedent.
  - Hallucination means generating false factual assertions as though they were true.
  - The plain reading of a bunch of wacky errors is recurring, conspicuous mistakes across prompts, without a specified population-wide error rate.
  - Assess the released GPT-5 system near launch. Improvements over predecessors are compatible with continuing errors.
  - Errors attributable solely to a separate image-generation model do not establish errors by GPT-5.
support_condition: After release, launch-era evaluations establish continuing hallucinations and multiple conspicuous errors across prompts attributable to GPT-5.
contradiction_condition: Broad, transparent launch-era evaluations establish that GPT-5 no longer hallucinates and does not exhibit recurring conspicuous mistakes, with purported examples shown to be invalid or misattributed.
measurement_requirements: Identify the model and release version, distinguish factual hallucinations from other mistakes, and assess repeated failures rather than one unverified screenshot.
source_requirements: A dated release record plus primary evaluations or documented tests. News reports may supplement primary evidence where original user transcripts are unavailable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Once GPT-5 is publicly released, documented launch-era hallucinations and repeated conspicuous failures can conclusively support this persistence forecast without waiting for a further deadline.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - A bunch supplies no count or failure-rate threshold.
  - Wacky is subjective; interpreted as conspicuous factual or elementary task errors.
  - GPT-5 was released as a routed system, so results need not apply equally to every component or mode.
  - Whenever it drops points to launch-era behavior but supplies no calendar deadline.
