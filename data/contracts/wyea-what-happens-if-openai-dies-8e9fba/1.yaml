  - over $300 billion in commitments
  - due in the next three years
  - similarly-unprofitable
evaluator_interpretation:
  - The commitments assertion concerns obligations outstanding on August 18, 2026, with payments due by August 18, 2029. It is an observation about existing obligations, not a forecast of future spending.
  - "For ongoing unprofitability, use the latest completed quarter that could ordinarily have been reported before publication: April–June 2026."
  - The target interval covers that quarter and the August 18 commitment snapshot; it does not move the snapshot to the later filing date.
  - Read 'similarly-unprofitable' as both companies being loss-making, not having equal dollar losses.
  - Net income is the ordinary profitability reading, but the surrounding discussion of cash burn creates a genuine ambiguity.
  - The passage identifies no accounting basis or source for Anthropic's commitment total. Record unknown rather than assigning GAAP or a press-estimate basis.
support_condition: A complete schedule of obligations existing at publication shows more than $300 billion payable within the following three years, and comparable latest-period results show both Anthropic and OpenAI loss-making.
contradiction_condition: A complete schedule establishes no more than $300 billion due within that window, or comparable results establish profitability on the relevant measure. A smaller partial contract total or positive operating income alone does not establish contradiction.
measurement_requirements: Contract-by-contract payment dates, cancellation rights, contingent amounts, leases, and overlapping agreements as of August 18, 2026. Separately compare Q2 2026 net results, distinguishing cash flow and operating income.
source_requirements: Contracts, commitment schedules, and financial statements. Later publications may document earlier facts, but later contracts cannot be backdated to the post.
