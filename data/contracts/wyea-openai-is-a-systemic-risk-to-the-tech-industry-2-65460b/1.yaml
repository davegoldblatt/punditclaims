early_resolution_rule: Resolve only on documented inability caused by the retained financing policy, or a sustained record of approximately $40 billion annual funding with policy compliance. A smaller round, an uncompleted commitment or one year's funding is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline or required number of years.
  - "'Near-impossible' has no numerical probability."
  - The $40 billion round includes potential co-investor funding.
  - The policy allows different treatment in extraordinary market conditions.
  - The final 'may not be enough' clause is hedged.
