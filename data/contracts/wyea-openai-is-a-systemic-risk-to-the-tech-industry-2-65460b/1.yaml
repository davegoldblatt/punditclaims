assessment_axis: forecast_outcome
explicit_source_elements:
  - promise to not borrow more than 25% of its holdings
  - near-impossible
  - continue funding OpenAI at this rate ($40 billion a year)
  - $40 billion a year may not actually be enough
evaluator_interpretation:
  - The checkable forecast is that SoftBank cannot sustain approximately $40 billion of its own annual funding to OpenAI while retaining the stated financing policy.
  - "'Continue' requires repeated annual funding after the 2025 round. A single funding announcement does not demonstrate sustained capacity."
  - Count SoftBank's own funded contribution, excluding amounts syndicated to other investors and counting completed funding separately from commitments.
  - The policy concerns adjusted net debt relative to holdings, rather than a simple ceiling on gross borrowing.
  - The suggestion that $40 billion 'may not' be enough supplies neither a firm outcome nor a period and is not separately scored.
  - No deadline is supplied.
support_condition: While retaining the policy, SoftBank demonstrably cannot meet recurring approximately $40 billion annual OpenAI funding requirements because of the financing constraint, rather than choosing a smaller investment.
contradiction_condition: Verified repeated annual contributions around $40 billion after the 2025 round, together with compliance with the stated policy and demonstrated continuing financing capacity, refute the claimed near-impossibility.
measurement_requirements: Measure completed SoftBank-funded contributions in consistent annual periods, exclude syndication, and reconcile adjusted net debt and equity value of holdings under the company's LTV definition.
source_requirements: SoftBank investment-completion disclosures and comparable LTV records; evidence of inability must identify a financing constraint rather than infer it from a smaller contribution.
metric_scope:
