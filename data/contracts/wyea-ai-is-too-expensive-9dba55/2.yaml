assessment_axis: historical_observation
explicit_source_elements:
  - You're more than $800 billion in the hole
  - I estimate
  - less than half of that
  - resulting in operational GPUs and capacity
evaluator_interpretation:
  - "'You' refers to the hyperscalers he is discussing. The nearby text names Microsoft, Google and Amazon, though earlier passages also mention Meta; the scope is unclear."
  - "'In the hole' reads as cumulative AI capital spending plus lab investments not yet recovered, roughly $800 billion or more."
  - The testable core is his estimate that less than half of that amount had become operational (in-service) GPUs and data center capacity by the time of the post.
  - He names no cut-off date, so I use the window from the start of 2026 to the post date (2026-05-19), covering the latest reported quarter.
support_condition: Disclosures or credible measurement showing that, around the post date, less than half of these firms' cumulative AI-related investment (about $800 billion or more) was in-service GPUs and capacity, with the rest in construction in progress, assets not yet in service, leases not yet started, or lab investments.
contradiction_condition: Disclosures or credible measurement showing that half or more of that cumulative investment was in service as operational GPUs and capacity around the post date, or that the cumulative total was well under $800 billion.
measurement_requirements: Cumulative AI capex and lab investments for the named firms, and the portion placed in service (for example, gross property and equipment excluding construction in progress, or commissioned MW and GPUs) near the post date.
source_requirements: Company 10-Q and 10-K filings and earnings calls, or credible independent infrastructure measurement.
metric_scope:
  company: Microsoft, Alphabet (Google), Amazon (scope unclear; possibly Meta)
  metric: Cumulative AI capital investment and the share placed in service as operational GPUs and capacity
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: unknown
  period_start: null
  period_end: 2026-05-19
  stock_or_flow: stock
