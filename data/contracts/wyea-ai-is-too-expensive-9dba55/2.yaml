early_resolution_rule: null
interpretation_determines_result: true
ambiguity_flags:
  - Unclear whether 'you' means three hyperscalers or four companies including Meta.
  - "'In the hole' is not defined: capex alone, capex plus lab investments, or capex net of AI revenue."
  - "'I estimate' marks his own estimate of a figure no company discloses."
  - No cut-off date; I chose early 2026 through the post date.
