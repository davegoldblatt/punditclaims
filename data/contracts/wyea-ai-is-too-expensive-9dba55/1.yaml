explicit_source_elements:
  - more than $800 billion in the hole
  - I estimate
  - less than half of that
  - operational GPUs and capacity
evaluator_interpretation:
  - The post's earlier discussion identifies Microsoft, Meta, Amazon, and Google and describes investment over the preceding three years. Use those four companies as the aggregate scope, while flagging the immediate passage's emphasis on three cloud providers.
  - Read in the hole as cumulative AI-related investment awaiting recovery, not as a claim of an audited net loss.
  - Less than half refers to the actual claimed investment total, not a fixed $400 billion ceiling.
  - Operational means commissioned capacity available for workloads, rather than announced, contracted, or under construction.
  - Use January–March 2026, the latest completed reporting quarter before publication, for the deployment snapshot. The exact beginning of the cumulative investment window is unspecified and remains null.
  - The operational-share figure is expressly an estimate. Spending, commitments, equity investments, and leased assets require reconciliation before aggregation.
support_condition: A reconciled investment total for the identified companies exceeds $800 billion, and less than 50% of that same investment pool is attributable to commissioned, usable AI equipment and supporting capacity.
contradiction_condition: Matching records establish a total at or below $800 billion, or establish that at least 50% of the same investment pool had resulted in operational AI equipment and capacity.
measurement_requirements: A common investment window and valuation basis; separation of AI from other capital expenditure; no double counting of investments, leases, and commitments; project-level commissioning records tied to the same expenditure pool.
source_requirements: Company capital expenditure and investment records combined with dated infrastructure commissioning records or an independently documented reconciliation.
