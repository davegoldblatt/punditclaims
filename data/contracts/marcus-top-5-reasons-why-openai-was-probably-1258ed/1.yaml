explicit_source_elements:
  - The real value was always the people
  - not the IP
  - not the data
  - not the customer list
  - not the infrastructure
evaluator_interpretation:
  - The ordinary reading is that OpenAI's workforce accounted for substantially all its economic value, while the listed assets had little independent value.
  - Always refers to OpenAI's history through publication. The claim does not identify a particular accounting period or valuation method.
  - Evidence that employees were important would not establish that the other assets lacked substantial value.
support_condition: Credible valuations or transactions separate workforce value from the listed assets and show that substantially all economic value depended on retaining the workforce.
contradiction_condition: Credible valuations or transactions establish substantial independent economic value in the listed assets during the claimed period.
measurement_requirements: An allocation of economic value between the workforce and the listed assets, with assumptions about employee retention and continuing operations made explicit.
source_requirements: Transaction documents, independent asset valuations, or financial disclosures. An overall company valuation alone is insufficient.
