assessment_axis: causal_assessment
explicit_source_elements:
  - Augmentation is way easier
  - because you don’t have to solve the whole job
evaluator_interpretation:
  - The plain reading compares useful assistance with autonomous performance of the same occupation's full duties.
  - Easier means materially lower capability and engineering requirements at a comparable standard of useful, reliable service.
  - The proposed mechanism is that people retain duties the machine cannot perform. Mere adoption of assistance does not establish this mechanism or its size.
  - The claim concerns the technical situation at publication, rather than an unconditional law about every occupation.
support_condition: Comparisons or task analyses show that retaining difficult duties with people materially reduces the capabilities and engineering effort needed for useful assistance relative to full replacement.
contradiction_condition: Comparable evidence shows that effective assistance generally requires essentially the same capabilities and effort as full replacement, or that human-machine coordination removes the claimed advantage.
measurement_requirements: Distinguish development difficulty from user productivity. Compare task coverage, reliability requirements and integration effort within the same occupation.
source_requirements: Primary implementation studies, controlled comparisons or explicit technical analyses of assistance and full-job automation.
