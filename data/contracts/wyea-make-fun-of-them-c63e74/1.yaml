evaluator_interpretation:
  - The full post explicitly identifies this figure as annualized revenue and links to reporting of the company's disclosure.
  - The claim therefore describes OpenAI's current revenue run rate, not realized full-year revenue or a permanent ceiling on future revenue.
  - June 2025 is the observation period for the current revenue rate; the sentence supplies no separate reporting period.
  - Unstable monolith and vague product are evaluative descriptions outside the financial test.
  - Revenue, not profit identifies the measure; it does not by itself assert a particular net-loss figure.
support_condition: Contemporaneous reporting of OpenAI's own disclosure places its annualized revenue run rate at approximately US$10 billion in June 2025.
contradiction_condition: Comparable evidence places that June annualized revenue measure materially above or below US$10 billion.
measurement_requirements: Use annualized revenue on the disclosed product scope. Do not substitute realized annual revenue, forecasts, valuation, funding or profit.
source_requirements: A dated company disclosure or credible reporting directly attributing the figure to OpenAI.
