assessment_axis: historical_observation
explicit_source_elements:
  - By the midgame
  - LLMs often get lost
  - quality of play diminish deeper into the game
  - start to make illegal moves
evaluator_interpretation:
  - "The plain reading is a recurring pattern across relevant LLM games: deterioration in move quality and illegal moves appearing by the middlegame."
  - Often does not mean every model or every game. An isolated failure is insufficient.
  - Middlegame means the chess phase following the opening, not an evaluator-imposed move number.
  - Move quality and legality must be assessed separately. This claim does not require proving the proposed world-model explanation.
  - The target is the performance of relevant models as known by publication, including applicable earlier tests. There is no June-only cutoff.
support_condition: Repeated-game evaluations show that illegal moves commonly occur by the middlegame and that independently scored move quality declines from the opening into later play across relevant models.
contradiction_condition: Representative stage-specific evaluations show generally maintained or improved move quality and consistently legal play through the middlegame. An exceptional successful model alone does not refute often.
measurement_requirements: Report model and prompt, game transcripts, phase labels, first-illegal-move distribution and engine-scored move quality by phase. Separate notation errors and account for games terminated at the first illegal move.
source_requirements: Primary game evaluations with reproducible methods or transcripts, applicable to models existing by publication.
