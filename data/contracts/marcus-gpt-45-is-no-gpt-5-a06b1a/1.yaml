assessment_axis: historical_observation
explicit_source_elements:
  - GenAI revenue
  - low tens of billions per year
  - pre price wars
  - GenAI expenditures
  - half a trillion dollars to date
evaluator_interpretation:
  - Treat the amounts as approximate USD industry estimates, not exact audited figures.
  - Use realized calendar-2024 annual revenue as the latest completed annual period before the early-2025 price competition discussed in the post.
  - Cumulative expenditure runs from the industry's unspecified inception through 2025-02-26; no start date is invented.
  - The contract contains two measures with different periods. Its single metric_scope records that composite explicitly.
  - The ordinary reading is revenue in the lower tens of billions and cumulative spending roughly around $500 billion. The source supplies no precise tolerance.
  - The price-war reference qualifies the revenue period; it is not a conditional forecast.
support_condition: Consistently scoped industry estimates establish both realized annual pre-price-war GenAI revenue in the low tens of USD billions and cumulative GenAI expenditure around USD500 billion through publication.
contradiction_condition: Consistently scoped estimates place either component clearly outside its stated approximate magnitude. Evidence establishing one component and refuting the other would support a mixed assessment.
measurement_requirements: Separate annual revenue from annualized run rate, cumulative expenditure from annual capital spending, and realized expenditure from financing or future commitments. Avoid double-counting transactions between industry layers.
source_requirements: Industry estimates must disclose coverage and methodology. Company disclosures require a defensible aggregation and identification of GenAI-specific amounts.
