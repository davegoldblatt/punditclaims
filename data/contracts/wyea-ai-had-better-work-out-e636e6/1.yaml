  - neoclouds and hyperscalers
  - over $374 billion
  - construction in progress
  - I estimate
  - $200 billion or more
  - GPUs, primarily from NVIDIA
evaluator_interpretation:
  - The total is an asset stock, not accumulated capital expenditure or future purchase commitments.
  - The referenced earlier analysis uses companies' latest disclosed balances at different dates, including Amazon's year-end 2025 balance. The target period covers those reporting dates rather than imposing a common quarter-end.
  - The referenced population includes Alphabet, Meta, Oracle, Amazon, SpaceX, Tesla, CoreWeave, IREN, Core Scientific and Applied Digital. Its GPU estimate also introduces assumptions about additional companies and balances.
  - The GPU subtotal must distinguish GPUs from TPUs, networking, complete servers, buildings and other infrastructure. 'I estimate' permits an uncertainty range, but still requires a defensible method.
support_condition: A reproducible, nonduplicated aggregation of the relevant disclosed balances exceeds $374 billion, and an independently defensible asset breakdown supports at least $200 billion of GPUs, predominantly NVIDIA products.
contradiction_condition: A sufficiently complete, comparable accounting establishes a total no greater than $374 billion or a GPU component below $200 billion. A smaller sample or missing breakdown is not a contradiction.
measurement_requirements: Identify the company population and each balance date; reconcile equivalent asset categories; exclude unspent commitments; prevent double counting; substantiate the GPU fraction separately from capex composition.
source_requirements: Company asset disclosures and equipment breakdowns, supplemented by a transparent estimation method. Repetition of Zitron's estimate is not independent verification.
