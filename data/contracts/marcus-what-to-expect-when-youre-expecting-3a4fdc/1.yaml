evaluator_interpretation:
  - The target is released GPT-4, including its alignment training, rather than an unprotected development model.
  - The plain reading is that material failures remain common or systematic enough that users cannot depend on adherence across the three named values. Reliability does not require perfection.
  - Recurring failures of truthfulness can establish failure of the combined commitment; this does not require failure on every dimension.
  - The claim concerns GPT-4 as released, not every subsequent model or all future alignment methods.
support_condition: Evaluations of released GPT-4 document recurring material failures of truthfulness, harmlessness, or helpfulness despite alignment training.
contradiction_condition: Broad evaluations establish dependable adherence across the three named dimensions, with remaining errors too limited to defeat ordinary reliability.
measurement_requirements: Model-specific evaluations and substantive failures, rather than isolated harmless mistakes or comparisons showing only relative improvement.
source_requirements: Primary technical evaluations or documented independent tests that distinguish the released model from development versions.
