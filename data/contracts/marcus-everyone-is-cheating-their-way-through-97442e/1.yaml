assessment_axis: historical_observation
explicit_source_elements:
  - Term papers
  - an economically efficient way of teaching and evaluation large numbers of students
  - Now they are basically worthless
evaluator_interpretation:
  - The plain reading is that ordinary take-home term papers have lost nearly all their practical value for teaching and assessing large university classes because students can use GenAI.
  - Worth includes writing practice, reflection, assessment validity, and the staff time needed to provide these benefits.
  - I use the current 2024–25 academic year through the post as the latest educational reporting period. August 1 is a reporting convention, not a date Marcus supplied.
  - An isolated successful assignment or a demonstration that AI can complete an assignment does not establish the general value of term papers at scale.
support_condition: Representative evidence shows that ordinary term papers provide negligible learning and assessment benefits under widespread GenAI access, relative to their staffing costs.
contradiction_condition: Representative evidence shows that ordinary term papers retain substantial learning or assessment benefits in large classes at practical staffing costs despite GenAI access.
measurement_requirements: Measure independent writing and subject learning, the relationship between submitted work and students' own competence, class size, and staff workload. Distinguish permitted assistance from outsourcing the assignment.
source_requirements: Studies or institutional records covering actual term-paper assignments and multiple large classes; student-use surveys alone cannot settle educational value.
