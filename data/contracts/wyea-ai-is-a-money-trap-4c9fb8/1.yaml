explicit_source_elements:
  - OpenAI
  - appears to have burned
  - at least ten billion dollars
  - in the last two months
evaluator_interpretation:
  - Burned means net cash consumed by the business, excluding financing inflows, rather than money raised, total expenditure, or accounting losses.
  - The literal two-month window is June 6 through August 6, 2025. The surrounding references to June and August financing also permit an approximate June–July reading.
  - The estimate accounting basis reflects his inference from cited press reporting about financing.
  - Appears qualifies confidence but does not erase the numerical assertion.
support_condition: Reliable cash-flow records establish at least $10 billion of net business cash consumption during the stated two-month window.
contradiction_condition: Comparable records establish less than $10 billion of net business cash consumption during that window.
measurement_requirements: A cash-flow reconciliation for the window, separating business cash consumption from financing, non-cash expenses, and movements between cash and marketable securities.
source_requirements: Company cash-flow records or reputable reporting explicitly measuring the relevant dates and cash-burn definition.
