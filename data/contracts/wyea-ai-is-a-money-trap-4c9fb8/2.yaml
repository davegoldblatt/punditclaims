assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI
  - appears to have burned
  - at least ten billion dollars
  - in the last two months
evaluator_interpretation:
  - "'Burned' is read as net cash burn (cash going out, net), its ordinary meaning in startup finance. Non-cash accounting charges are not burn."
  - "'The last two months' is read as roughly early June to early August 2025, the two months before the 6 August 2025 post."
  - "'Appears' hedges the claim. Even so, it asserts a specific quantity with a threshold of $10 billion or more. It is tested by whether OpenAI's reported cash burn makes that quantity plausible. Money raised is not money burned."
support_condition: Reported figures show OpenAI's net cash burn over roughly June to early August 2025 was $10 billion or more, or come close enough that it plausibly appeared so.
contradiction_condition: Reported figures show OpenAI's cash burn in and around that window was far below $10 billion. An example would be a first-half 2025 burn and a full-year target that together make a $10 billion two-month burn impossible or implausible.
measurement_requirements: OpenAI's net cash burn covering June to early August 2025, or bounding figures for overlapping periods (first half 2025, full year 2025).
source_requirements: Reports of OpenAI's own financial disclosures (to shareholders or in leaked statements) by credible outlets. OpenAI is private.
