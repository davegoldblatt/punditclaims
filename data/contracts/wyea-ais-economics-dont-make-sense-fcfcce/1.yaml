explicit_source_elements:
  - LLMs
  - are inherently unpredictable
evaluator_interpretation:
  - In context, the ordinary reading concerns practical uncertainty about an LLM's behavior and successful completion of a task during ordinary use.
  - I do not interpret this as a technical assertion that identical output is impossible under every controlled inference configuration.
  - "For this ongoing technical observation, I use current-year evaluations available through the post: January 1–April 28, 2026."
support_condition: Controlled repeated inference shows varying behavior or intermittent failures despite fixed prompts and conservative settings.
contradiction_condition: Representative evaluations establish reliably predictable behavior and correctness across ordinary uses covered by the claim. Repeatable text alone does not establish predictable correctness.
measurement_requirements: Record prompts, model versions, decoding settings and repeated trials. Separate textual variation, inconsistent actions and factual correctness.
source_requirements: Primary controlled experiments or reproducible demonstrations. Include evidence that inference variability can be engineered away under specified conditions.
