explicit_source_elements:
  - Hallucinations
  - a huge, unsolved issue
evaluator_interpretation:
  - The plain reading is that fabricated or incorrect factual output remained a substantial practical reliability problem for contemporary general-purpose LLMs.
  - Huge means consequential enough to require care and safeguards in important applications; Marcus supplies no numerical error-rate threshold.
  - Unsolved means that available models and mitigations had not eliminated the general problem. It does not mean that no improvements or useful applications existed.
  - The target is the latest public 2023 model-reliability picture through the post date. Model evaluations have no fixed quarterly reporting period.
support_condition: Contemporaneous primary evaluations or model disclosures identify continuing hallucinations and practical limitations serious enough to require safeguards in consequential uses.
contradiction_condition: Robust contemporaneous evidence establishes that hallucinations had been reliably eliminated across the relevant general-purpose uses, or reduced to a negligible practical issue.
measurement_requirements: Assess factual reliability and practical consequences. Do not substitute stylistic errors, refusal rates, or a single narrow benchmark for general hallucination performance.
source_requirements: Prefer contemporary model disclosures and primary research. Improvements must be acknowledged without treating them as proof of elimination.
