explicit_source_elements:
  - an incredibly unprofitable business
  - so much more money than it currently does
  - to pay Oracle on an ongoing basis
evaluator_interpretation:
  - The ordinary reading is that OpenAI has large losses relative to revenue and that its current revenue is substantially below the recurring Oracle payments contemplated in the surrounding discussion.
  - Use calendar 2025, the latest completed annual financial period reportable before the post, for realized revenue and losses.
  - Compare that revenue with the contractual payment schedule known at the post date. Do not treat an average over a multiyear contract as the amount currently due.
  - The surrounding reliance on press reports makes estimate the appropriate accounting basis for the claim. Cash burn, operating loss and net loss remain distinct measures.
support_condition: Comparable financial records establish substantial realized losses relative to revenue, and the Oracle payment schedule establishes a substantial recurring payment gap against that revenue.
contradiction_condition: Comparable records establish profitability, or show that current revenue adequately covers the recurring Oracle payments described. Evidence resolving only one component does not settle the whole claim.
measurement_requirements: Realized annual revenue, clearly defined losses, and Oracle payments by service period, including commencement dates and any delivery conditions.
source_requirements: Prefer financial statements and the Oracle contract. Independently corroborated reporting may substitute where private-company records are unavailable.
