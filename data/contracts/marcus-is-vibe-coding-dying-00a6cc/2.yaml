evaluator_interpretation:
  - "The ordinary reading is a recurring trajectory within the same project: promising initial results followed by substantial failure, abandonment or serious unresolved problems."
  - Often means a common recurring pattern, not necessarily a majority. The speaker supplies no numerical threshold.
  - Ordinary debugging alone does not establish a bad ending.
  - The claim describes experience leading up to the post, without a stated starting date. Earlier project histories remain eligible.
  - No comparison with conventional software-development failure rates is required.
support_condition: Longitudinal observations or systematically collected project histories establish that initially promising vibe-coding experiments commonly later fail, are abandoned or encounter substantial unresolved problems.
contradiction_condition: Comparable project histories establish that this trajectory is rare and initially promising experiments generally reach satisfactory outcomes.
measurement_requirements: Link initial and later observations for the same projects. Include successful outcomes and enough information about sampling and project counts to assess whether the pattern is common.
source_requirements: Longitudinal studies, project cohorts or systematically collected firsthand histories. Individual incidents can illustrate the trajectory but cannot establish its frequency.
