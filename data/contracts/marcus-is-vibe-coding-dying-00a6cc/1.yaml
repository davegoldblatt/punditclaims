evaluator_interpretation:
  - "The claim describes a recurring project trajectory: promising early results followed by failure, abandonment, or substantial unresolved problems."
  - "'Often' means common enough to be a recurring practical pattern. It does not necessarily mean a majority, and I do not impose a numerical threshold."
  - The context concerns amateurs building applications. Professional productivity studies alone do not measure this trajectory.
  - With no reporting cycle or stated period, I use the latest pre-publication month-to-date period, October 1–21, 2025, for the ongoing state. Project histories may begin earlier, but must establish outcomes relevant to that state.
support_condition: Systematic project histories or a sufficiently broad longitudinal sample show that initially promising experiments commonly develop serious problems or fail.
contradiction_condition: Comparable longitudinal evidence shows that this transition is rare, with initially promising projects generally meeting their stated goals.
measurement_requirements: Identify projects at the initial-success stage, follow their later outcomes, record failures and successes, and distinguish technical breakdown from unrelated commercial failure or voluntary experimentation.
source_requirements: Prefer longitudinal studies or systematically collected project histories with a denominator. Selected success stories and failure anecdotes cannot establish frequency.
