explicit_source_elements:
  - seems hellbent on using AI absolutely everywhere
  - prepared to hold Anthropic
  - at gunpoint
  - including for mass surveillance and to guide autonomous weapons
  - presumably ultimately other companies
evaluator_interpretation:
  - Read 'at gunpoint' as threatened governmental penalties, and 'absolutely everywhere' as a broad deployment push.
  - The testable core is pressure to remove Anthropic's contractual restrictions, including restrictions concerning surveillance and autonomous weapons. It does not require proof that those applications were already deployed.
  - Use February 22–25, 2026 for the context's 'last few days' and present-tense description.
  - The parenthetical about other companies is speculation, not a separate unconditional forecast.
support_condition: Contemporaneous records establish demands to remove the relevant restrictions, backed by concrete threats, as part of a broad military AI deployment push.
contradiction_condition: Reliable records establish that the alleged demands or threats did not occur, or that the administration accepted the relevant restrictions.
measurement_requirements: Distinguish contractual permission from actual deployment, and demands for lawful use from demands for unlawful use.
source_requirements: Official records, participants' accounts, or reputable contemporaneous reporting identifying the demands and threatened consequences.
