assessment_axis: forecast_outcome
explicit_source_elements:
  - I believe
  - on course for a truly horrible crash
  - may rewrite the venture capital industry
  - mortally wound one or more hyperscalers
  - fundamentally divide society
evaluator_interpretation:
  - The sentence firmly predicts a crash but presents its listed consequences as possibilities through 'may'.
  - Assess the firm crash prediction using the same ordinary reading as the other claim extracted from this sentence.
  - A severe crash means a broad collapse in the relevant AI sector with substantial financing, investment, or business disruption.
  - Do not convert possible venture-capital restructuring, hyperscaler damage, or social division into mandatory tests.
  - "'I believe' is not an external condition that must occur before scoring."
support_condition: A dated, broad severe collapse of the AI boom establishes the firm forecast. Evidence of the listed possible consequences may describe its severity but is not required.
contradiction_condition: The absence of consequences introduced by 'may' cannot contradict the sentence. Continued prosperity for a finite period also cannot disprove its undated crash prediction.
measurement_requirements: Representative valuation and investment measurements, together with records of financing or business disruption. A stock-price decline alone does not establish that a hyperscaler has been mortally wounded.
source_requirements: Prefer original market and funding data, filings, insolvency records, and documented investment cancellations. Social division would require separate defined measures if treated as an independent claim.
