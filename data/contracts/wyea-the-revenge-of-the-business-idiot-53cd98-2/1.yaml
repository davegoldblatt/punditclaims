horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve the firm component only upon dated evidence of a broad severe AI-sector collapse. Do not resolve it from one optional consequence or isolated company failure.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - The reach of 'may' across the listed consequences is ambiguous.
  - Mortally wound, rewrite, and fundamentally divide have no supplied measures.
  - The firm crash component duplicates the preceding claim.
  - Sector and geographical scope are inferred from context.
