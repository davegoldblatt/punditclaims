explicit_source_elements:
  - When the nonprofit Board ... remove[d] Altman
  - both employees and investors
  - quickly set to work
  - push out the board
  - undo its decisions
evaluator_interpretation:
  - The observation describes efforts between Altman's November 17 dismissal and the November 19 post.
  - Employees includes employed executives; the wording does not require every employee or investor to participate.
  - Undoing the decision means seeking Altman's return, alongside efforts to displace the board.
  - The contrast with the intended structure concerns pressure on nonprofit authority. It does not establish that lobbying breached a legal rule or that participants acted solely for financial reasons.
  - The board's private motives and whether removal was prudent are not treated as independently established facts.
support_condition: Evidence of actions during November 17–19 showing employees and investors seeking Altman's return and displacement of the board.
contradiction_condition: Reliable evidence that the described efforts did not occur during November 17–19, or that employees or investors instead supported retaining the dismissal and board.
measurement_requirements: Separate the initiation of pressure from its eventual success. Later reporting may document earlier actions, but later actions alone cannot establish this observation.
source_requirements: Contemporaneous statements or reliable reporting of the negotiations, identifying participants and timing. Use news reports where private negotiations lack public primary records.
