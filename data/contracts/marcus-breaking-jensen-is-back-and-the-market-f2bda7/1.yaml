  - an enormous number of … shareholder lawsuits
  - around this
evaluator_interpretation:
  - The forecast concerns distinct shareholder lawsuits arising from Huang’s reinstatement and the surrounding decisions.
  - The ordinary reading of 'enormous' is an exceptionally large volume, not merely several cases or many law-firm advertisements.
  - No numerical threshold or deadline is supplied. I will not invent one.
  - Reinstatement is treated as the antecedent. Earlier litigation does not by itself establish consequences of reinstatement.
support_condition: Court records establish an unmistakably exceptional volume of distinct shareholder actions materially concerning the reinstatement, with comparison to similar corporate disputes.
contradiction_condition: A definitive record closes the relevant avenues for filing and establishes only an ordinary or small volume. A small count while further filings remain possible is insufficient.
measurement_requirements: Identify complaints, filing dates, defendants and allegations; distinguish separate actions from amended complaints, consolidation and solicitation notices.
source_requirements: Court filings and dockets are preferred. Reliable reporting may identify cases but cannot substitute for a verified count.
