original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: An already accumulated, unmistakably exceptional volume of verified qualifying lawsuits can settle support. Silence or a small early count cannot settle contradiction.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No numerical meaning for 'enormous'.
  - No deadline.
  - "'Around this' could include the wider controversy as well as reinstatement."
