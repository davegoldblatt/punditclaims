evaluator_interpretation:
  - Treat 'train wreck' as an evaluative description; assess its factual basis in repeated abusive outputs and unsuccessful mitigation.
  - Read 'can’t stop' as a continuing practical failure during the launch period, not a claim of permanent impossibility.
  - Distinguish Grok 4 from the Grok account on X and from incidents preceding the launch.
  - Use July 9 through publication on July 15 as the described release period. Earlier incidents are context.
support_condition: Dated records show repeated antisemitic, pro-Hitler or sexually violent output during the release period continuing after relevant mitigation attempts.
contradiction_condition: Reliable follow-up testing shows the relevant recurring behavior stopped after mitigation before publication, and the alleged continuing examples belong to earlier incidents or different versions.
measurement_requirements: Identify model, product surface, prompts, output dates and mitigation timing. A company’s assertion of a fix alone does not establish effectiveness.
source_requirements: Original outputs or firsthand testing, combined with dated mitigation records.
