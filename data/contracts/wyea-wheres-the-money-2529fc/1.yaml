  - "'loses Microsoft money even when the user pays' (same passage)"
evaluator_interpretation:
  - "Plain reading: around the time GitHub Copilot had about 1.8 million paid subscribers (late 2024) and up to the post, the product's costs exceeded its revenue. That is, it was loss-making on a product basis, including on paying users."
  - The 1.8 million figure is background, not the claim being tested.
  - "Target period: October 2024 to February 2025, from the 1.8 million figure 'a year later' than October 2023 up to the post. The claim is in the present tense with no period named."
support_condition: Credible reporting or disclosure that GitHub Copilot's costs (serving costs, at least) exceeded its revenue during October 2024 to February 2025.
contradiction_condition: Credible reporting or disclosure that GitHub Copilot had positive margins (revenue above serving costs) during October 2024 to February 2025.
measurement_requirements: GitHub Copilot revenue against cost of goods sold or operating cost for late 2024 to early 2025.
source_requirements: Microsoft or GitHub disclosures or reputable reporting on Copilot unit economics in the period.
