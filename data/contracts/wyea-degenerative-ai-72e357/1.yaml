evaluator_interpretation:
  - The numerical claim concerns OpenAI's daily computing cost for operating ChatGPT, excluding model training, other products and total company expenses.
  - I read 'millions of dollars a day' as at least US$2 million daily. The result would be unchanged using a US$1 million threshold.
  - The ongoing observation describes February 2023 as of the February 16 post. I use that current month, rather than a later operating period.
  - The post links the cost assertion to Forbes reporting, so the accounting basis is estimate.
  - "'Extremely expensive' supplies no separate measurable threshold. I assess the accompanying daily-cost figure."
support_condition: A substantiated estimate or disclosure for ChatGPT's contemporaneous daily operating compute cost reaches at least US$2 million.
contradiction_condition: A credible estimate measuring the same contemporaneous daily operating compute cost places it below US$2 million.
measurement_requirements: Daily computing cost for serving ChatGPT users in February 2023. Exclude training expenditure, company-wide losses, API prices and later models' costs.
source_requirements: Prefer the original cost analysis or company disclosure. Accessible reputable reporting may establish an otherwise inaccessible analysis, with its estimated status preserved.
