explicit_source_elements:
  - once OpenAI dies
  - CoreWeave, IREN
  - the many circular-financed neoclouds
  - unable to secure funding
  - how do you know your customers won’t die?
evaluator_interpretation:
  - "The preceding collapse condition governs this sentence: OpenAI must cease operating as an AI lab and model provider through business failure."
  - Unable to secure funding means inability to obtain new external debt or equity financing, rather than merely facing higher costs or less favorable terms.
  - The predicted obstacle is financiers' concern about customer survival.
  - CoreWeave and IREN are explicit targets. No precise population of other neoclouds or post-collapse observation window is supplied.
support_condition: After OpenAI collapses, documented funding attempts by CoreWeave, IREN and a sufficiently broad group of the referenced neoclouds fail because financiers regard their customers as financially unsafe.
contradiction_condition: After OpenAI collapses, a named target completes new external debt or equity financing despite the asserted customer-survival obstacle. This would contradict the categorical inability assertion for that company.
measurement_requirements: Establish when financing was negotiated, committed and completed. Separate new financing from drawdowns on earlier commitments, refinancing announcements without completion, and customer revenue.
source_requirements: Company filings, executed financing disclosures or lender records, supplemented where necessary by reputable reporting on failed financing attempts and their reasons.
