explicit_source_elements:
  - Oracle has no other path to making this revenue without OpenAI
  - these projects
  - entirely financed and paid for
  - using the projected cashflow of the data centers themselves
evaluator_interpretation:
  - This revenue means the projected revenue from the Stargate projects discussed immediately beforehand, not all Oracle revenue.
  - The ordinary reading is that the projects depend exclusively on OpenAI demand and their expected cash receipts to justify funding and repay their costs.
  - The words do not expressly say that every loan is legally non-recourse. Corporate borrowing alone therefore does not conclusively refute the economic-dependence claim.
  - Use the latest reported Oracle fiscal quarter before the post as the financing baseline. Earlier project agreements and later syndication reports are context unless they establish arrangements within that period.
support_condition: Project contracts and financing records establish exclusive dependence on OpenAI for the projected revenue and complete reliance on project cash receipts for funding recovery, with no commercially viable replacement demand.
contradiction_condition: Project-specific records establish material independent revenue or repayment support, or a commercially viable alternative customer arrangement capable of replacing the revenue at issue.
measurement_requirements: Distinguish contractual customer identity, economic repayment assumptions, legal recourse, equity contributions, corporate borrowing, and replacement-customer feasibility.
source_requirements: Executed Stargate customer contracts, leases, credit agreements, guarantees, and project financial models. A list of unrelated Oracle customers is insufficient.
