assessment_axis: historical_observation
explicit_source_elements:
  - Google
  - like the rest of tech's hyper-scalers
  - not had a meaningful new product in over a decade
  - most meaningful acquisition in years
  - paying $2.7 billion
  - barely made any money
  - specifically to hire back a guy
  - Google wouldn't release an early version of Large Language Models in 2021
evaluator_interpretation:
  - A meaningful new product ordinarily means a distinct product that achieved substantial adoption or commercial importance. It need not match Search's revenue or invent an entirely new category.
  - The ten years immediately preceding publication are the minimum interval covered by 'over a decade'. A qualifying launch within that interval can contradict the product assertion.
  - The transaction is the Character.AI licensing and hiring arrangement. The post links press reporting, so the $2.7 billion figure is assessed on an estimate basis.
  - The contract's monetary scope covers the payment. The separate statement about Character.AI's earnings lacks a specified period and does not distinguish revenue from profit.
  - Mixed is appropriate if material transaction facts are supported while the product assertion is contradicted. It does not establish the acquisition ranking or every asserted motive.
support_condition: Product histories show no substantially adopted or commercially important new Google product during the stated interval, and reliable records substantiate the transaction amount, limited startup earnings, hiring purpose, and departure account.
contradiction_condition: A distinct Google product launched within the preceding decade achieved substantial adoption or commercial importance, or reliable records contradict a material transaction assertion.
measurement_requirements: Dated launches and actual adoption or revenue measurements; transaction consideration distinguished from valuation and goodwill; startup revenue distinguished from profit; attributed evidence of the founder's departure and return.
source_requirements: Prefer company disclosures and filings. Use attributed reporting for private-company finances and internal motives when accessible primary records are unavailable.
