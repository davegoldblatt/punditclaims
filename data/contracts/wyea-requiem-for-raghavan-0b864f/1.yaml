ambiguity_flags:
  - Meaningful has no stated measure.
  - New could exclude products developed from existing services.
  - Over a decade supplies no exact starting date.
  - The other hyperscalers are not enumerated.
  - Most meaningful acquisition has no ranking criterion or comparison period.
  - Acquisition may mean a licensing and hiring arrangement rather than purchase of the company.
  - Barely made any money does not distinguish revenue from profit or specify a period.
  - Specifically does not establish whether hiring was the sole purpose.
