assessment_axis: historical_observation
explicit_source_elements:
  - Friday’s decision helped OpenAI
  - whose President, Greg Brockman
  - is a huge Trump donor
evaluator_interpretation:
  - Friday means June 12, 2026. The observation concerns the decision and its immediate effects through the June 14 post.
  - Helped means a concrete improvement in OpenAI’s competitive position, without requiring a measured revenue gain.
  - Huge Trump donor means substantial personal giving to Trump or a political committee supporting him. It does not mean corporate donations by OpenAI.
  - The sentence does not itself establish that donations caused the decision.
support_condition: Records establish an immediate competitive benefit to OpenAI, Brockman’s presidency, and substantial Trump-related giving already made by the post.
contradiction_condition: Reliable records establish that the decision did not confer the claimed competitive benefit, or disprove the leadership or donation component. Missing evidence alone is insufficient.
measurement_requirements: Identify the restrictions on Anthropic and OpenAI’s contemporaneous competitive position. Distinguish an opportunity to benefit from a demonstrated benefit, and personal donations from corporate spending.
source_requirements: Decision records and contemporaneous product or competitive evidence; leadership records and campaign-finance filings or reliable reporting.
