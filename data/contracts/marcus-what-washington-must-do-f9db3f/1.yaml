ambiguity_flags:
  - Helped has no stated measure; an immediate competitive opportunity is a weaker reading than a demonstrated benefit.
  - Huge has no numerical threshold.
  - Leadership and donor status are ongoing descriptions; the decision weekend is used as the observation period, with earlier donation records treated as background.
