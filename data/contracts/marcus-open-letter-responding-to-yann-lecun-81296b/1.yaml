assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - give you none of that for free
  - commonsense, physical reasoning or world models
evaluator_interpretation:
  - Assess the supplied technical proposition, rather than merely whether LeCun expressed agreement.
  - The ordinary reading is that standard language-model training does not by itself deliver reliable commonsense reasoning, physical reasoning and world models. This does not mean literally zero relevant ability.
  - Interpret 'for free' as without dedicated mechanisms or additional training specifically supplying those capabilities, not without financial or computational cost.
  - "Assess the current state in the latest year-to-date reporting window before the post: January 1 through June 4, 2024. Earlier experiments and later experiments are context unless their timing and applicability can be established."
  - Do not substitute perfect performance or general intelligence for reliable performance on the stated capabilities.
support_condition: Applicable evaluations show substantial, repeatable failures in these capabilities in ordinary LLMs, with sufficient training and architecture information to establish that the assessment concerns what ordinary language modeling supplies by itself.
contradiction_condition: Applicable evaluations show that ordinary language-model training produces reliable, generalizing capabilities across the stated areas without dedicated mechanisms or capability-specific training.
measurement_requirements: Use varied tasks, generalization tests, suitable baselines and training details. Distinguish encoded factual knowledge from usable models of dynamics, and partial competence from reliable capability.
source_requirements: Primary empirical studies or reproducible evaluations. Agreement by Marcus or LeCun is not outcome evidence.
