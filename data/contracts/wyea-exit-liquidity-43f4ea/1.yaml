assessment_axis: causal_assessment
explicit_source_elements:
  - AI does not appear to be increasing revenue or margin growth
  - across the S&P 500, other than in the magnificent seven
  - over a trillion dollars of capital expenditures
  - return on invested capital drop on a quarterly basis
evaluator_interpretation:
  - The central assertion concerns AI's contribution, not merely whether aggregate revenue or margins increased.
  - The Mag 7 means Alphabet, Amazon, Apple, Meta, Microsoft, NVIDIA and Tesla.
  - Read the spending threshold as cumulative realized capital expenditures since the November 2022 launch period, not announced future spending.
  - Read the ROIC clause as a decline in the group's latest quarterly observations, not necessarily a decline at every member.
  - Use the contextual AI period through Q3 2026, the latest completed calendar quarter potentially reported before the post.
  - The contract contains distinct revenue, margin, capex and ROIC components. The single metric_scope records the explicit monetary threshold; the other components require separate matching measurements.
support_condition: Evidence isolates negligible AI-attributable revenue or margin gains outside the Mag 7, establishes cumulative realized Mag 7 capex above $1 trillion, and shows declining quarterly Mag 7 ROIC on a consistent definition.
contradiction_condition: Matching evidence establishes material AI-attributable gains outside the Mag 7, or shows that the stated capex threshold or quarterly Mag 7 ROIC trend is false.
measurement_requirements: Separate total revenue from revenue per worker; margins from margin growth; actual capex from forecasts; and the Mag 7 from other hyperscaler groups. Specify ROIC numerator, capital denominator, weighting and quarterly comparison.
source_requirements: Company financial statements or reproducible financial aggregates for capex and ROIC, plus credible attribution evidence for AI's effects.
