ambiguity_flags:
  - Capex accumulation period is unstated and inferred from the surrounding AI-bubble discussion.
  - ROIC definition, weighting and number of declining quarters are unstated.
  - The surrounding discussion names hyperscalers; the claim names the Mag 7.
  - An ongoing-state endpoint of Q3 2026 is an evaluator interpretation.
  - Aggregate trends alone do not identify AI's causal effect.
