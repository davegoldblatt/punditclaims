explicit_source_elements:
  - Scaling here was largely AWOL
  - even the best model was only at 80.6%
  - for most models
  - scaling had at best a neglible effect
evaluator_interpretation:
  - The target is the 2022 Ruis et al. study as available when the post appeared, not subsequent models or paper revisions.
  - The ordinary reading of 80.6% is the paper's headline accuracy averaged across prompt templates, including its few-shot evaluations.
  - Scaling means increasing model size within the tested model families. 'Most models' is read as most families, since scaling requires comparisons between sizes.
  - Negligible means little or no consistent improvement across the sizes tested, judged against the paper's reported comparisons. This is not a claim that every family had a flat curve or that a permanent ceiling was proved.
  - The target period is the study's 2022 experimental results. The post does not specify individual experiment dates.
support_condition: The original manuscript reports a best overall mean accuracy of 80.6%, and its size comparisons show little or no consistent improvement for most tested model families.
contradiction_condition: The original manuscript reports a higher best overall mean accuracy under its main evaluation protocol, or substantial consistent gains with size for most tested model families.
measurement_requirements: Use the original version's accuracy averaged across prompt templates. Distinguish overall means from individual-template results, zero-shot from few-shot evaluation, and model-size scaling from increasing the number of prompt examples.
source_requirements: The original Ruis et al. manuscript and its results tables, available by 2022-10-29.
