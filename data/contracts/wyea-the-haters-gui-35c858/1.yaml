evaluator_interpretation:
  - The operational claim concerns coding agents available in early 2025 through publication. The period follows the contemporary-product discussion and its reference to the early-2025 coding study.
  - Let run rampant means agents can execute changes without effective human review or approval of each consequential action.
  - The ordinary reading is a general tendency to cause material breakage and additional remediation work. Everything is rhetorical emphasis, not a literal assertion that every action fails.
  - Not remotely intelligent has no supplied operational definition and cannot be independently resolved by a coding benchmark.
support_condition: Representative evaluations of contemporary unchecked coding agents show material introduced defects or destructive changes and substantial net human remediation work.
contradiction_condition: Representative evaluations under the same unchecked conditions show dependable useful completion without material breakage and without substantial additional remediation work.
measurement_requirements: Record agent versions, permissions, supervision, task difficulty, introduced defects, destructive actions and human repair time against a suitable baseline.
source_requirements: Prefer independent evaluations and reproducible incident records. Separate supervised AI assistance from unchecked execution and isolated incidents from prevalence.
