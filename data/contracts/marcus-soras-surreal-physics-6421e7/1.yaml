  - Because no observation period is specified, assess the February 2024 model through the post date.
  - The broader value of Sora as a research direction is outside this behavioral assessment.
support_condition: Original-model demonstrations or evaluations document remaining spatial, temporal, or physical-causality failures incompatible with treating those problems as solved.
contradiction_condition: Representative tests establish reliable spatial, temporal, and causal consistency across relevant scenes, and the claimed remaining failures are shown to be mistaken.
measurement_requirements: Examine spatial relations, persistence across frames, motion, and consequences of interactions. Successful geometry alone does not establish causal understanding.
