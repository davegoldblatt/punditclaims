assessment_axis: historical_observation
explicit_source_elements:
  - Absolutely none of these companies have a plan.
  - without explaining how
  - becoming margin positive
evaluator_interpretation:
  - These companies means AI application startups, rather than the established public companies discussed afterward.
  - A plan means a stated, concrete business approach addressing revenue and serving costs. It need not guarantee success.
  - I use calendar 2025, the latest completed annual business-reporting period before publication, to test whether these startups had articulated an economic strategy.
  - This assesses the existence of a strategy, not a numerical margin or a financial forecast; metric_scope is therefore null.
support_condition: Evidence would need to establish that none of the relevant startups had a concrete approach to achieving sustainable positive product margins. Failure to find public plans is insufficient.
contradiction_condition: A qualifying startup's documented plan explaining how pricing, costs, product mix, or delivery changes would support sustainable positive product economics refutes the universal assertion.
measurement_requirements: Distinguish an actual economic mechanism from an unsupported aspiration to become profitable. Do not require the plan already to have succeeded.
source_requirements: A dated company explanation or an attributable management statement describing the mechanism.
