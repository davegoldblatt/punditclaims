explicit_source_elements:
  - The LLM providers no longer want to offer all-you-can-eat
  - customers no longer want to pay for a la carte
  - stated as of 2026-06-10
evaluator_interpretation:
  - "This is two claims. (a) Providers: major LLM and AI-tool providers were moving away from flat-rate plans that covered heavy or agent use. (b) Customers: customers were resisting usage-based (per-token) pricing, shown by falling or stalling usage-based spending."
  - "Target period is April to June 2026: the recent pricing changes and spending up to the end of the quarter in which the post appeared."
  - Customer reluctance is judged from total spending by customers at the leading usage-based provider, alongside reports of individual firms capping spend.
support_condition: (a) Major providers restricted or ended flat-rate access for heavy or agent use in April–June 2026, and (b) usage-based spending fell or stalled, or customers widely refused metered pricing.
contradiction_condition: (a) Providers kept or expanded flat-rate access, or (b) customer spending on usage-based AI kept rising sharply in the period.
measurement_requirements: Provider pricing announcements; company-reported revenue for the period, much of it usage-based.
source_requirements: Company announcements or changelogs; company-reported financials or reputable reports on them.
