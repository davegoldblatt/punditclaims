evaluator_interpretation:
  - The plain reading is that CoreWeave will fail to honor material debt obligations, not merely that its bonds will fall in price.
  - Use debts outstanding at publication as the initial population; the statement does not specify how future borrowing should be treated.
  - Ordinary refinancing that pays existing creditors, and conversion permitted by the original terms, count as honoring an obligation.
  - A distressed restructuring imposing creditor losses can establish failure. A routine amendment, technical breach or temporary payment delay cannot by itself establish eventual nonpayment.
support_condition: An authoritative record establishes a material debt obligation ending in nonpayment or a distressed settlement that impairs creditors' contractual claims.
contradiction_condition: All debts in the defined publication-date population are fully paid or satisfied under their original contractual terms.
measurement_requirements: Track the relevant obligations, contractual payment and conversion terms, grace periods, recoveries and any distressed exchanges.
source_requirements: CoreWeave filings, trustee notices, credit agreements or court records; reliable reporting may corroborate a default or creditor loss.
