ambiguity_flags:
  - The comparison universe is unspecified.
  - "'Essentially none' supplies no numerical tolerance."
  - "'Some role' could mean direct vehicle control or broader operational guidance."
  - It is unclear whether simulated comparisons count as comparisons of cars.
