assessment_axis: historical_observation
explicit_source_elements:
  - Essentially NONE
  - comparisons we have heard
  - humans were not playing some role
  - either in the car or remotely
evaluator_interpretation:
  - "'Comparisons we have heard' means publicly circulated human-versus-automated-driving safety comparisons available by the post date, rather than an unknowable personal reading history."
  - "'Some role' includes operational remote guidance, not merely direct control of steering or braking. It excludes designing the software and unrelated passenger support."
  - "'Essentially none' allows isolated exceptions; one comparison does not automatically settle the claim."
  - The target is the accumulated comparison literature through November 5, 2023, with no specified starting date.
support_condition: A sufficiently comprehensive review shows that virtually all relevant comparisons included onboard human intervention or remote operational guidance, without isolating operation free of both.
contradiction_condition: A meaningful body of relevant comparisons explicitly excludes or separately measures both onboard intervention and remote operational guidance.
measurement_requirements: Identify the comparison population and examine each study's onboard intervention, remote-assistance and simulation methods. Rider-only operation alone is insufficient.
source_requirements: Original studies and contemporaneous operational documentation; later studies cannot establish what comparisons were public before the post.
