  - does not exist
  - that includes Mythos
  - They say these things to make you think
evaluator_interpretation:
  - Read in context, the claim denies hidden capabilities commensurate with the sweeping white-collar automation claims immediately preceding it. It does not merely deny that a model named Mythos exists.
  - Use May 2026 through the publication date as the latest pre-post observation period for the ongoing technical claim.
  - Verified autonomous performance on substantial work is relevant, but a narrow cyber benchmark does not by itself establish broad occupational replacement.
  - The alleged persuasive motive is distinct from the capability assertion and cannot be inferred from benchmark performance.
support_condition: Independent evaluations or verifiable internal records establish that the implicated systems lacked the broad autonomous work capabilities supposedly already present behind the public automation claims.
contradiction_condition: Independent demonstrations or verifiable records establish that systems possessed those broad autonomous work capabilities by publication. Mere model existence or isolated benchmark success is insufficient.
measurement_requirements: Dated, version-specific tests of autonomous work across the occupations implicated, including reliability, human assistance and deployment constraints.
source_requirements: Independent evaluations and verified demonstrations, supplemented by dated company disclosures. Promotional claims alone cannot settle capability or motive.
