ambiguity_flags:
  - The source supplies no growth interval; the latest completed quarter is the evaluator's choice.
  - Business could refer to revenue, users, or another measure; context favors revenue.
  - The current revenue baseline and tolerance around effectively 10x are unspecified.
  - The statement does not distinguish annualized current revenue from realized revenue in 2030.
  - The relevant financing, expense, and contract assumptions are unspecified.
