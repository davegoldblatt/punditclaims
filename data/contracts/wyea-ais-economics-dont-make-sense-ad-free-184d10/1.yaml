assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI’s growth is slowing
  - at precisely the time it needs to accelerate
  - effectively 10x its current business by 2030
  - to make its obligations
evaluator_interpretation:
  - This is a present assessment of growth and financial requirements, not a prediction that OpenAI will actually grow tenfold.
  - Business means revenue scale, given the surrounding discussion of annual revenue and compute payments.
  - For the ongoing growth observation, use the latest completed calendar quarter before publication, January through March 2026, compared with earlier comparable periods.
  - The tenfold statement concerns obligations understood at publication and revenue requirements through December 31, 2030. It does not supply an independent forecast horizon.
  - Meeting obligations means paying contractual amounts when due, considering operating costs, cash, and financing. A revenue target alone does not establish necessity.
  - The dying language is a warning without a separate measurable failure threshold.
  - The financial basis is estimate because the passage relies on press reporting.
support_condition: Comparable revenue growth data establish deceleration in early 2026, and a documented financial model using contractual payment schedules establishes that roughly tenfold expansion from the contemporaneous revenue scale was needed to meet obligations through 2030.
contradiction_condition: Comparable data establish accelerating rather than slowing revenue growth, or documented cash flows and contractual terms establish that meeting obligations did not require approximately tenfold expansion.
measurement_requirements: Use consistent revenue definitions and comparable growth intervals. Distinguish missed targets from deceleration, annualized run rate from realized annual revenue, and projected spending from binding payment obligations.
source_requirements: Prefer financial disclosures and contracts. Credible reporting may establish reported figures or concerns, but financial necessity requires payment schedules, cash-flow assumptions, and financing assumptions.
metric_scope:
