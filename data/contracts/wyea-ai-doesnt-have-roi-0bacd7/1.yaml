assessment_axis: causal_assessment
explicit_source_elements:
  - the overall economic impact
  - appears to be worse code, worse software
  - massive, multi-million dollar bills from Anthropic and Cursor
  - might allow some things to go theoretically faster
evaluator_interpretation:
  - This is a claim about effects caused by AI coding, so comparative causal evidence is needed.
  - The plain reading concerns the overall balance of benefits and costs. Individual failures or expensive deployments cannot establish that balance.
  - Worse code and software means increased defects, security problems, maintenance burdens or operational failures relative to comparable development without the tools.
  - The billing component concerns customers' actual expenses, not the vendors' revenue or customers' projected annual spending. USD is assumed; the customer, billing period and accounting basis are unspecified.
support_condition: Representative comparisons show that AI coding causes an overall deterioration in software quality and net economic outcomes, with records establishing actual multimillion-dollar customer expenditure on the named services.
contradiction_condition: Representative comparisons establish an overall improvement in software quality and net economic outcomes. Comparable billing records could separately contradict the spending component once its customer and period are specified.
measurement_requirements: Compare similar projects and account for developer time, review, defects, maintenance, operating costs and tool charges. Distinguish actual bills from spending projections and vendor revenue.
source_requirements: Prefer comparative research and customer expenditure records. Executive statements reported by reputable news outlets can provide context but do not substitute for invoices or an overall economic assessment.
