explicit_source_elements:
  - Anthropic, OpenAI, Cursor, and every other AI company
  - Microsoft has been subsidizing the cost of compute
  - allowing users to burn way, way more in tokens than their subscriptions cost
evaluator_interpretation:
  - The plain reading is that permitted heavy subscription use can cost the provider substantially more to serve than the subscription fee; it does not require every subscriber to be unprofitable.
  - Actual provider compute costs are distinct from the retail API value of tokens.
  - March 2026 is the latest completed monthly subscription period before the post and is used for this ongoing observation. The speaker supplied no period.
  - The claim covers the named companies and every other AI company; evidence for selected providers alone cannot establish that universal statement.
  - No accounting basis is supplied for this assertion. It cannot receive a supported or contradicted money-claim score with the basis unknown.
support_condition: Comparable records establish substantially excessive permitted compute costs relative to subscription fees for the named companies and the claimed wider population, with an identifiable accounting basis.
contradiction_condition: Comparable records on an identified basis establish a counterexample to the universal assertion, or show that the alleged excess is only retail API value rather than actual provider cost.
measurement_requirements: Match each subscription's monthly fee, permitted usage, model mix, caching, and actual serving costs. Separate heavy-user economics from average subscriber margins and company-wide losses.
source_requirements: Provider cost records, authenticated internal analyses, or transparent independent estimates for the relevant period. Price lists alone are insufficient.
