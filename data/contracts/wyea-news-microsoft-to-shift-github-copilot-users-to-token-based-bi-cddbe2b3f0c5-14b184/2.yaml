assessment_axis: historical_observation
explicit_source_elements:
  - Much like Anthropic, OpenAI, Cursor, and every other AI company
  - Microsoft has been subsidizing the cost of compute
  - allowing users to burn way, way more in tokens than their subscriptions cost
evaluator_interpretation:
  - "Plain reading: under flat-rate subscription plans, each named company let at least some subscribers use tokens whose cost exceeded what they paid, so the company covered the gap. The claim does not say every user was unprofitable. The heavy-user reading is fair to the speaker, and reviewers accepted it."
  - "'Cost' is read as either the company's own stated losses or absorbed costs on subscription users, or credible reports of the same. A dollar value at list API prices alone counts only as weaker support. Where it matters, reports of the actual cost of serving users are preferred."
  - "'Has been' describes an ongoing state up to the post date with no start named. I use the flat-rate AI and coding-agent subscription era leading up to the post: 2025-01-01 to 2026-04-20. The window is not limited to a single month."
  - "'Every other AI company' is a sweeping generalization that cannot be checked company by company. The test covers the four named firms (Microsoft/GitHub, Anthropic, OpenAI, Cursor). The universal part is flagged, not scored."
  - No dollar figure, metric or accounting basis is claimed. This is treated as a qualitative claim about pricing practice, not a specific financial metric, so metric_scope is null.
support_condition: For each named company, a company statement or credible report from the period shows that subscription users could consume, or did consume, compute costing more than their subscription fee, with the company absorbing the difference or losing money on those subscribers.
contradiction_condition: "Credible evidence that one or more of the named companies did not absorb compute costs above subscription prices during the period. Examples: a company reports its subscription plans were profitable even for its heaviest users, or its plans already charged users the full token cost."
measurement_requirements: Company statements of losses or absorbed inference costs on subscription plans, company-disclosed examples of usage beyond the plan price, or reputable reports of negative margins on subscription users.
source_requirements: Company blogs, executive statements, or reputable news reports quoting company statements or sources familiar with company financials, available by 2026-10-28.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period:
  start: 2025-01-01
  end: 2026-04-20
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Every other AI company' is a universal claim that cannot be fully checked; only the named firms are tested."
  - No period is named; I chose 2025-01-01 to 2026-04-20 as the recent flat-rate subscription era.
  - "'Cost' could mean list API price or actual serving cost; the size of the subsidy differs a lot between the two."
  - Whether 'users' means typical users or heavy users; read as at least heavy users.
