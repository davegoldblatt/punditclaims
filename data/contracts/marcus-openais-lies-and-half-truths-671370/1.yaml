evaluator_interpretation:
  - The ordinary reading is that OpenAI repeatedly avoided material questions or encouraged misleading impressions before the Sora interview.
  - A disclosed decision to withhold information does not, by itself, establish evasion.
  - The context describes a history beginning with the 2015 announcement and ending at publication. The target period covers that history.
  - Examples of candid communication can weaken particular allegations without disproving a broader pattern.
support_condition: Records establish repeated earlier instances of materially evasive communication over several years, together with the Sora interview.
contradiction_condition: Records substantively rebut the alleged earlier evasions and establish that the claimed recurring conduct did not occur. A few examples of transparency alone would not suffice.
measurement_requirements: Compare the questions or public representations with contemporaneous answers, disclosures and relevant internal records.
source_requirements: Original statements and contemporaneous records where accessible; independent reporting where those records cannot be obtained.
