assessment_axis: forecast_outcome
explicit_source_elements:
  - Once every media story isn’t about AI
  - stops posting about it every day
  - when everyone stops asking about your AI strategy
  - actual demand for AI was not particularly strong
evaluator_interpretation:
  - The condition means a sustained, broad retreat in media and corporate promotion of AI, rather than literally every person stopping discussion.
  - Underlying demand means voluntary, durable use supported by willingness to pay economically sustainable prices.
  - The speaker supplies neither a deadline nor a numerical definition of weak demand.
support_condition: After the stated retreat in promotion is established, representative evidence shows weak paid adoption, retention and willingness to pay sustainable prices.
contradiction_condition: After the stated retreat in promotion is established, representative evidence shows substantial, durable paid demand at sustainable prices.
measurement_requirements: Longitudinal measures of media coverage and corporate promotion, followed by representative paid usage, retention, prices and service costs.
source_requirements: Independent measurements of the antecedent and demand, supplemented by disclosed provider data. Sentiment surveys alone cannot establish either.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: A documented sustained retreat in promotion followed by sufficiently broad evidence of durable demand or its collapse can settle the forecast without a calendar deadline.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No threshold or duration for hype subsiding.
  - No measure or threshold for strong demand.
  - The geographic and product scope of AI demand is unspecified.
