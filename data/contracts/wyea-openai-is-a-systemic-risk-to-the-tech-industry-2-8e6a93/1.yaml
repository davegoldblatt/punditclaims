assessment_axis: forecast_outcome
explicit_source_elements:
  - continue to raise money at this rate
  - even if OpenAI somehow actually receives the $40 billion
  - which will require it becoming a for-profit entity
  - at least another $40 billion in the next year
evaluator_interpretation:
  - The ordinary reading is that OpenAI cannot repeat fundraising at approximately $40 billion annually after the original round.
  - Count completed primary investments, excluding the original March 2025 round, secondary share sales, valuation increases, revenue, and undrawn commitments.
  - A subsequent twelve-month interval with at least $40 billion in completed new investments is a decisive counterexample to that reading.
  - "'Even if' is a concession, not an antecedent restricting when the fundraising prediction applies."
  - The for-profit wording is treated as a description of the contemplated restructuring, not a separate prediction that nonprofit control must disappear.
  - The post references SoftBank's funding filings, so company-reported transaction amounts are the applicable basis. No fixed future accounting period was specified.
support_condition: A terminal financing failure establishes that OpenAI cannot obtain another comparable annual amount. Merely observing a funding gap for an evaluator-selected period is insufficient.
contradiction_condition: Completed new primary investments, separate from the original round, total at least approximately USD 40 billion within a subsequent twelve-month interval.
measurement_requirements: Add non-overlapping completed investments in USD. Distinguish cash invested from commitments, investment carrying values, and secondary transactions.
source_requirements: Investor or company disclosures identifying completed investments and their dates; filings preferred.
metric_scope:
  company: OpenAI
  metric: New primary investment funding received, excluding the March 2025 round
  currency: USD
  units: billions
  accounting_basis: company_reported
