evaluator_interpretation:
  - The timing identifies the target as ChatGPT Images 2.0, introduced on April 21, 2026.
  - The plain reading is that the system makes recurring mistakes depicting how objects work or are used. It does not assert that every output fails or that the system has no useful capabilities.
  - Because this describes an ongoing capability without a reporting period, assess the newly released system from April 21 through the April 22 post. This is the latest publicly observable period before publication.
  - Assess observable output errors, without treating them as proof of a particular internal cognitive mechanism.
support_condition: Documented tests or independently verifiable outputs attributable to the system in the target period show recurring errors in ordinary object operation or use, with prompts and outputs sufficient to distinguish functional mistakes from deliberately unusual requests.
contradiction_condition: Broad, reproducible tests of ordinary object operation and use show reliable functional depictions, and attempts to reproduce the alleged difficulty establish that it arose from misleading prompts, misidentified models, or isolated artifacts rather than a recurring limitation.
measurement_requirements: Identify the model, test dates, prompts, outputs, and relevant generation mode. Examine repeated attempts or multiple functional tasks, including successful outputs. General visual quality, text rendering, or image recognition scores alone do not settle this claim.
source_requirements: Prefer original tests with inspectable prompts and outputs or a documented company capability evaluation. The speaker's own assertion is not independent evidence. Later publications must establish that their results concern the system during the target period.
