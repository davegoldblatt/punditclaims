explicit_source_elements:
  - At some point
  - investors
  - will begin to question mounting R&D costs
  - AI token burn
  - when the company’s revenue growth fails to follow
evaluator_interpretation:
  - The plain reading is public investor or investment-analyst scrutiny of rising R&D expenses attributable at least partly to internal AI token use, after revenue fails to keep pace.
  - Revenue need not decline; sustained R&D growth exceeding revenue growth can meet the stated condition.
  - General criticism of data-center capital spending alone does not establish the narrower token-related R&D claim.
  - At some point supplies no deadline. The six-month deadline in the following sentence belongs to a different claim.
support_condition: After the antecedent is documented for an identifiable company, a dated investor statement or earnings-call question explicitly challenges the relevant R&D spending or its justification.
contradiction_condition: No finite period of investor silence disproves this deadline-free forecast. A contrary outcome would require a decisive event permanently foreclosing the forecast for its stated scope.
measurement_requirements: Match revenue and R&D growth over comparable periods, establish the contribution of internal AI token spending, and connect investor scrutiny to that spending.
source_requirements: Company filings or disclosures for the antecedent; earnings-call transcripts, investor letters, or attributable investor statements for the response.
