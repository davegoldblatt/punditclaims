evaluator_interpretation:
  - The surrounding discussion suggests broadly superhuman machines, rather than systems exceeding humans on one narrow task.
  - Close could refer to elapsed time, capability distance or remaining scientific obstacles.
  - The post supplies neither a proximity threshold nor a sufficiently specific capability criterion.
  - A later model release cannot settle this statement without first adding those missing criteria. The post’s separate hundred-year discussion of extinction is not a deadline for this claim.
support_condition: No determinate condition can be set without supplying an unstated meaning of close and an operational threshold for super-smart.
contradiction_condition: No determinate condition can be set without the same additions; subsequent advances alone do not establish how close the field was under the speaker’s intended meaning.
measurement_requirements: A specified capability threshold and either a time interval or a measurable distance from that threshold.
source_requirements: Once defined, use broad capability evaluations and dated demonstrations; forecasts and marketing descriptions alone would not establish attainment.
