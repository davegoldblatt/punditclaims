contradiction_condition: The recording clearly explains that exposure, or reliable contemporaneous evidence contradicts the assertion that such preparation was an established practice.
measurement_requirements: Inspect the complete relevant audio and slides, including the meaning and visibility of any tuned label. Identify preparation separately from test-time training.
