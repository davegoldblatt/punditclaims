evaluator_interpretation:
  - "Plain reading: agents cost more than single chat queries mainly because they make many repeated model calls (often several models or sub-agents in loops) and check results before finishing, which uses far more tokens."
  - The separate hyperbole about 'a million times or billion times' is outside the exact words being graded.
  - The claim describes current practice. I read it as agent systems from 2025 up to the post date.
support_condition: Credible technical or provider sources show that agents make many repeated or parallel model calls, often several models or sub-agents with checking steps, and that this repeated use drives much higher token use and cost than chat.
contradiction_condition: Credible sources show that agents' higher cost comes mainly from something other than repeated model calls (for example, higher per-token prices alone), or that agents do not typically use many more model calls or tokens than chat.
measurement_requirements: Provider data or documentation comparing agent and chat token use, and descriptions of how agents run.
source_requirements: Provider engineering documentation, papers, or company statements.
