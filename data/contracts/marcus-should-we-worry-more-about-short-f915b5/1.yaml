assessment_axis: historical_observation
explicit_source_elements:
  - A lot of machine learning researchers are worried
  - most people carry on as if they weren’t
  - 2022 survey
evaluator_interpretation:
  - A lot means a substantial share, not necessarily a majority.
  - Assigning a meaningful probability to extremely bad outcomes is evidence of concern in the survey context; it is not a direct emotional measure.
  - Most means more than half. Carry on as if they weren't refers to behavior apparently unresponsive to the stated risk.
  - Most people could mean the public or the machine-learning community; neither population is silently substituted for the other.
  - The compound observation combines the explicitly referenced 2022 survey with behavior ongoing at publication. Its enclosing target period is 2022 through March 14, 2023; behavioral evidence must address the latest pre-post state.
support_condition: The referenced survey establishes substantial researcher concern, and representative evidence establishes that a majority of the intended population behaved without a meaningful response to that concern.
contradiction_condition: The survey establishes negligible researcher concern, or representative behavioral evidence shows that most of the intended population meaningfully responded to the risk.
measurement_requirements: Keep probability judgments, expressed concern, policy preferences and actual behavior distinct. The behavioral population and response measure must be identified.
source_requirements: Original survey results and methods, plus representative contemporaneous behavioral evidence for the second clause.
