  - Altman simply could not deliver what he (over)promised
  - GPT-5 was his primary mission as a leader
  - he couldn’t get there convincingly
  - In no way was it AGI
evaluator_interpretation:
  - Assess the GPT-5 system released in August 2025, not later models bearing the GPT-5 name.
  - The plain reading of failed delivery is a material shortfall against Altman's actual commitments, not a requirement that every promotional phrase be literally measurable.
  - The ordinary AGI reading requires broadly human-level general competence and adaptation, rather than strong performance on selected benchmarks.
  - The claim contains separate assertions about delivery, leadership priority, and AGI status. Establishing the AGI clause alone does not settle the complete claim.
  - A company goal of eventually developing AGI is not automatically a promise that GPT-5 would achieve it.
support_condition: The released system materially falls short of documented GPT-5 commitments, evidence establishes the claimed leadership priority, and capability evidence shows that the system did not meet the ordinary AGI reading.
contradiction_condition: The released system demonstrably meets the relevant commitments and contradicts the alleged material shortfall, credible records contradict the leadership-priority assertion, or the system demonstrably meets the ordinary AGI reading.
measurement_requirements: Compare promises with corresponding launch capabilities. Evaluate generality and adaptation across tasks, and distinguish benchmark success from AGI. Leadership priority requires evidence beyond the importance of a product launch.
source_requirements: Original Altman statements, launch documentation, independent capability assessments, and records relevant to leadership priorities.
