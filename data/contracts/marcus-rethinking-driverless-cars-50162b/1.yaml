assessment_axis: historical_observation
explicit_source_elements:
  - It appears
  - most or all the work at present
  - all of the published numbers
  - no disclosure about how much remote centers are contributing
evaluator_interpretation:
  - Treat the statement as a qualified factual generalization about the industry and the public evidence available at the post date.
  - For the ongoing disclosure state, use a snapshot on 2023-11-05. The statement concerns the stock of published information, rather than a quarterly operating statistic.
  - Read 'how much' as quantitative information about remote assistance and its contribution to reported results. Merely acknowledging a remote-support team does not satisfy that requirement.
  - Do not treat remote guidance as automatically equivalent to direct human control.
support_condition: A sufficiently complete review establishes that most relevant programs depended on human driving or remote assistance, and that the published performance figures lacked quantitative disclosure of remote assistance's contribution.
contradiction_condition: A contemporaneous published performance report quantifies the remote contribution to its results, disproving the categorical disclosure assertion, or representative evidence disproves the industry-majority assertion.
measurement_requirements: Define the population of programs and reports; distinguish human control, remote guidance, assistance frequency, and the effect of assistance on reported safety or performance.
source_requirements: Reports and disclosures public by 2023-11-05, including company safety papers and regulatory submissions. Later disclosures cannot establish what was public at the post date.
