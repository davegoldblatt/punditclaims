assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft is the only remaining hyperscaler
  - funding the AI buildout without debt
  - none of them will talk about AI revenues
evaluator_interpretation:
  - Read hyperscalers as Microsoft, Amazon, Alphabet, Meta and Oracle.
  - Funding without debt concerns financing used for the buildout, not merely whether a company has outstanding debt.
  - Ordinary borrowing includes financing leases, but distinguish those from bond issuance and ordinary purchase commitments.
  - Talk about AI revenues ordinarily includes quantified company statements, including explicitly labeled revenue run rates; it does not require audited standalone AI segments.
  - The disclosure assertion concerns the public record through publication and therefore has no stated starting date. For financial flows, use the latest completed quarter before publication, October through December 2025.
  - The combined claim states no common accounting basis for debt attribution and revenue disclosure.
support_condition: Comparable financing records establish that Microsoft alone avoided debt funding for the buildout, and no named hyperscaler publicly quantified AI revenues before publication.
contradiction_condition: A named company publicly quantified AI revenues before publication, or comparable financing records show Microsoft used debt for the buildout or another hyperscaler avoided it. Financial evidence must meet the supplied accounting-scope requirements.
measurement_requirements: Distinguish new bonds, financing leases, existing debt and general corporate funding. Keep annualized revenue run rates separate from realized revenue.
source_requirements: Dated earnings transcripts, filings and financing disclosures. Company statements are sufficient to establish that a disclosure occurred, but not necessarily its economic accuracy.
