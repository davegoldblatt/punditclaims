explicit_source_elements:
  - by-the-hour compute
  - regular companies
  - that market just doesn't exist at a meaningful revenue point
evaluator_interpretation:
  - The plain reading is that hourly AI-compute sales to ordinary business customers had not become a commercially substantial market.
  - In context, 'regular companies' excludes hyperscalers. Whether it also excludes specialist AI laboratories is unclear.
  - I use calendar 2024, the latest completed annual period underlying the post's CoreWeave financial discussion.
  - No dollar threshold is supplied. 'Meaningful' means commercially substantial, not literally positive revenue or an invented billion-dollar minimum.
  - The claim concerns a market beyond CoreWeave, so a small CoreWeave revenue share cannot establish market-wide absence.
  - The claim supplies no accounting basis for market revenue; it remains unknown.
support_condition: Reliable, sufficiently comprehensive 2024 evidence shows that realized hourly AI-compute revenue from ordinary business customers was commercially negligible across the relevant market.
contradiction_condition: Reliable 2024 evidence identifies commercially substantial realized hourly AI-compute revenue from ordinary business customers, separately from hyperscaler contracts and other revenue.
measurement_requirements: Separate hourly usage revenue by customer type, exclude hardware sales and committed capacity contracts, and distinguish realized annual revenue from annualized run rates.
source_requirements: Provider segment disclosures or a credible market estimate with transparent definitions, customer coverage and revenue methodology.
