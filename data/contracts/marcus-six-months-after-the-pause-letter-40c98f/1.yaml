assessment_axis: causal_assessment
explicit_source_elements:
  - If we don’t know what is in the data sets
  - we can’t know what biases these systems will spread through society
  - if they are widely used
  - the extent to which individual content creatore are being exploited
  - any outside efforts to mitigate risks are greatly undermined
evaluator_interpretation:
  - The ordinary reading is that training-data secrecy prevents reliable assessment of propagated biases and the extent of creator exploitation, and substantially weakens independent risk mitigation.
  - Identifying particular biased outputs or particular training examples is relevant counterevidence, but does not by itself establish societal effects or the extent of exploitation.
  - Creator exploitation includes uncompensated or unauthorized use and resulting harm; identifying dataset membership alone does not establish either legal infringement or economic harm.
  - This is a general causal claim, so later research may test its mechanism. It is not scored as a forecast conditional on a particular deployment.
support_condition: Independent audits or comparative studies show that withholding training-data information prevents the stated assessments and materially reduces outside mitigation effectiveness, with disclosure addressing those limitations.
contradiction_condition: Independent investigators reliably assess the stated societal biases and extent of creator exploitation without training-data disclosure, or comparisons show that nondisclosure does not substantially impair outside mitigation. Evidence settling only one component would warrant a component-level finding.
measurement_requirements: Distinguish output bias from effects in society, dataset membership from exploitation, and successful mitigation from the additional benefit of disclosure. Isolate training-data access from access to weights, deployment records, or developer assistance.
source_requirements: Primary research and independent audits with documented access conditions, methods, and limitations.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - “Can’t know” could mean inability to identify any bias or inability to assess likely societal consequences reliably.
  - “Exploited” has no specified legal or economic measure.
  - “Greatly undermined” has no stated effect size.
  - “Widely used” has no specified deployment scale.
