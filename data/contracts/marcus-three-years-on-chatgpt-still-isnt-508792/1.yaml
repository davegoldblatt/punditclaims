explicit_source_elements:
  - $500 billion valuation
  - on hopes, not profits
  - those hopes are slipping away
  - usage declines
  - others catch up
evaluator_interpretation:
  - Read 'on hopes, not profits' as valuation resting on expected future earnings while the company is unprofitable, not as proof that the valuation is irrational.
  - Read 'usage declines' as falling absolute use of ChatGPT, not merely falling market share or referral traffic.
  - For the ongoing state without a specified reporting period, use October 2025, the latest complete calendar month before publication. November developments are contextual unless measured separately before the post.
  - Treat declining investor confidence as a separate proposition requiring evidence; it cannot be inferred from losses or a competitor's benchmark results alone.
  - The monetary scope records the explicit valuation. The separate profitability assertion supplies neither an accounting basis nor a reporting period.
support_condition: Matching evidence establishes the valuation, lack of profits, declining absolute usage, competitive convergence, and weakening investor expectations in the relevant period.
contradiction_condition: Matching evidence establishes a materially different valuation, profitability, increasing absolute usage, or strengthening investor expectations for the corresponding components.
measurement_requirements: Separate equity valuation from financing proceeds, net profit from operating loss or cash burn, absolute usage from market share, and investor confidence from competitive performance.
source_requirements: Transaction disclosures, appropriately scoped financial records, consistent usage measurements, and dated evidence of investor expectations.
