assessment_axis: historical_observation
explicit_source_elements:
  - In 2024 alone
  - 31 states, Puerto Rico, and the Virgin Islands
  - AI-related legislation or resolutions
  - at least 27 states
  - deepfake laws
evaluator_interpretation:
  - Count distinct states with enacted AI legislation or adopted resolutions during calendar 2024, with the two territories listed separately.
  - The deepfake threshold counts states, not individual laws.
  - Deepfake laws include sexual imagery, child-abuse imagery, impersonation, and election-related measures; the claim does not restrict the count to elections.
  - The ordinary reading is a reported legislative tally, not a claim that all enactments were comprehensive regulatory statutes.
support_condition: A reliable 2024 legislative tally reports 31 states and both named territories adopting AI legislation or resolutions, and at least 27 states enacting deepfake legislation during that year.
contradiction_condition: Comparable records establish a different AI jurisdiction count or fewer than 27 states enacting deepfake legislation during 2024. A narrower election-only count would not contradict the broader deepfake claim.
measurement_requirements: Use enactment or resolution-adoption dates in 2024. Deduplicate states and distinguish enacted measures from introduced bills and cumulative prior-year totals.
source_requirements: Legislative records, a legislative tracking organization, or an identifiable contemporaneous tally by legislators. Disclose when the underlying bills have not been independently recounted.
