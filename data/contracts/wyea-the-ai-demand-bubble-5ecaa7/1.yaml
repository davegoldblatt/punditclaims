explicit_source_elements:
  - the vast majority
  - their capex
  - exists to support these two
evaluator_interpretation:
  - Their refers to Amazon, Microsoft and Alphabet. These two refers to OpenAI and Anthropic.
  - The plain reading concerns an overwhelming share of the three companies' combined capital expenditure, with provider-level allocations also relevant.
  - The denominator is total capex, not merely AI capex or selected dedicated projects.
  - I use April–June 2026, the latest completed reporting quarter before the post, for the ongoing spending assertion.
  - Vast majority means substantially more than half. I do not invent an exact percentage absent from the claim.
  - The allocation to the labs is an estimate inferred from the projects and relationships cited in context; it is not presented as a disclosed accounting line.
support_condition: A comparable allocation of total capital expenditure shows that an overwhelming share was incurred to serve OpenAI and Anthropic, including a defensible allocation of shared infrastructure.
contradiction_condition: Comparable allocations show that spending serving the two labs is not an overwhelming share of total capex. A share at or below half would clearly contradict the claim.
measurement_requirements: Use a consistent treatment of cash purchases, finance leases and shared assets across providers. Keep current-quarter spending separate from future guidance, multiyear contracts, equity investments and cumulative project costs.
source_requirements: Company capital-spending disclosures and customer-specific infrastructure allocations, or independently documented estimates that reconcile to those disclosures.
