assessment_axis: historical_observation
explicit_source_elements:
  - Four years
  - a trillion dollars in
  - AI is more expensive
  - its companies more cash-intensive
  - its products just as unreliable
evaluator_interpretation:
  - Assess the normalized factual proposition. The accompanying insults and claims about boosters' desperation are not measurable components.
  - The plain reading compares approximately June 2022 with the state of the industry at the June 2026 post.
  - More expensive means higher cost for comparable useful work; more cash-intensive means greater cash requirements, although the speaker does not specify absolute spending or spending relative to output.
  - Just as unreliable means no material improvement in failure rates on comparable tasks, not merely that errors remain possible.
  - For the ongoing company-finance component, the latest completed calendar quarter before the post is Q1 2026; annual disclosures can supply background but cannot automatically replace that endpoint.
  - The trillion-dollar amount has no stated company perimeter, accounting basis, or treatment of financing, acquisitions, spending, and future commitments.
support_condition: Consistently defined records establish approximately one trillion dollars absorbed over the stated period, increased company cash requirements, increased matched-task costs, and no material improvement in matched-task reliability.
contradiction_condition: Comparable evidence establishes a material decline in task costs or improvement in reliability, or financial records contradict the spending and cash-intensity assertions under a defensible common definition. A mixed finding requires affirmative evidence for both supported and contradicted components.
measurement_requirements: Use a stable industry perimeter; avoid double-counting investment and expenditure or counting commitments as realized spending. Compare cash measures on the same accounting basis and reliability on unchanged tasks and success criteria.
source_requirements: Financial filings or clearly identified financial estimates, together with independent matched-task cost and reliability measurements. The unstated financial accounting basis must not be silently supplied.
