ambiguity_flags:
  - Four years gives an approximate baseline rather than a named reporting period.
  - Q1 2026 is the evaluator's latest-completed-quarter interpretation for ongoing finances.
  - The trillion-dollar total has no accounting basis or aggregation rule.
  - Cash intensity could mean absolute cash spending or spending relative to revenue or output.
  - No cost basket or reliability measure is specified.
  - The surrounding text also uses a three-year cost comparison.
