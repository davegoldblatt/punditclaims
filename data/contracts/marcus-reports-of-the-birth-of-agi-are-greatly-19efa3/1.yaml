assessment_axis: historical_observation
explicit_source_elements:
  - by the classical criteria for AGI
  - LLM’s hardly qualify
  - flexible and general
  - resourcefulness and reliability comparable to (or beyond) human intelligence
evaluator_interpretation:
  - Use the definition supplied in the surrounding passage; do not assume that 'classical criteria' names a universally accepted test.
  - The plain reading requires broad adaptability and reliability comparable to ordinary human performance. It does not require error-free performance.
  - Treat 'current' as the 2023 generation discussed in the post. With no reporting cycle specified, use the current calendar year's evaluations through publication.
  - The definition is a standard for assessment, not an antecedent of a conditional forecast.
support_condition: Representative evaluations show that contemporary frontier LLMs substantially fall short of human-comparable flexibility, resourcefulness or reliability across general tasks.
contradiction_condition: A contemporary LLM demonstrates the stated combination of generality, resourcefulness and human-comparable reliability across a sufficiently broad and representative evaluation.
measurement_requirements: Comparable human and model tasks, explicit prompting and tool conditions, and a defensible account of task breadth. Hallucinations alone do not establish performance below humans, who also make errors.
source_requirements: Primary evaluations of contemporary LLMs. Authors' labels such as AGI or incomplete AGI cannot substitute for measured performance.
