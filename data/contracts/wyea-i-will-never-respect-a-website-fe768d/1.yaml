assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic and OpenAI
  - unsustainable and unprofitable services
  - burn less money
  - the more extra capacity they buy, the more money they lose
evaluator_interpretation:
  - The claim combines current losses with a causal claim that purchasing additional capacity increases those losses after associated revenue is counted.
  - For the current financial state, use calendar 2025, the latest completed annual period with financial estimates available before the post. The speaker supplies no reporting period.
  - Unsustainable is read as an assertion about service economics, not merely the existence of present losses.
  - The sentence does not identify an accounting basis or distinguish cash burn, operating losses, net losses, and service-level margins. No one measure is silently substituted for another.
  - The two companies must be assessed separately within the joint claim; one company's figures cannot establish the other's economics.
support_condition: Comparable accounts for each company's services show losses, and evidence linking incremental capacity costs with resulting revenue establishes that buying more capacity increases those losses.
contradiction_condition: Comparable service accounts establish profitability or show that additional purchased capacity generates a positive incremental contribution rather than increasing losses.
measurement_requirements: Separate inference from training and other expenses; distinguish operating losses, net losses, and cash burn; compare incremental capacity costs with the revenue that capacity enables.
source_requirements: Prefer audited accounts and company disclosures. Press estimates can provide context but cannot replace an unstated accounting basis or establish marginal causation.
