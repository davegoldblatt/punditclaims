evaluator_interpretation:
  - In context, the forecast concerns commercial revenue at the scale expected to justify generative AI investment, rather than literally no sales.
  - The speaker provides no revenue amount, accounting basis, industry boundary, comparison forecast, or deadline.
  - Company revenue growth is relevant context but cannot substitute for an industry-wide comparison with the expectations underlying the investment.
  - No 2025–2026 deadline is imported from the screening suggestions.
support_condition: Comparable industry evidence shows the anticipated revenue failed to materialize, with a definitive commercial wind-down establishing that it will not arrive later.
contradiction_condition: Realized generative AI revenue demonstrably reaches the commercial scale anticipated in the contemporaneous investment cases.
measurement_requirements: A consistent industry boundary, realized revenue without double-counting, contemporaneous commercial projections, and comparable infrastructure investment figures and time periods.
source_requirements: Filings or company disclosures for realized revenue and investment; dated records of the commercial expectations being tested. Annualized run rates and financing proceeds must remain separate.
