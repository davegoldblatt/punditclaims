assessment_axis: causal_assessment
explicit_source_elements:
  - AI doesn’t need to be AGI
  - to cause harm
evaluator_interpretation:
  - "This is an existence claim: a documented case in which a limited-purpose AI system contributed causally to harm is sufficient."
  - Causing harm does not require being the sole cause or acting without human involvement.
  - A system limited to perception and vehicle control is non-AGI under the ordinary meaning of general intelligence.
support_condition: A credible investigation establishes that a non-AGI system's operation or failure contributed to actual harm.
contradiction_condition: Evidence establishes that general intelligence is necessary for AI to cause harm. Discrediting one proposed example would not establish this.
measurement_requirements: Identify actual harm, the system's causal contribution, and its limited capabilities. Mere allegations or hypothetical risks are insufficient.
source_requirements: Prefer official investigations or controlled research with a documented causal mechanism.
