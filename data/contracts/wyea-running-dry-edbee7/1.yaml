evaluator_interpretation:
  - A quarter means three months, rather than one-fourth of an unspecified total.
  - This is a comparison with current spending, not a forecast about a specified future quarter.
  - Use July 1 through September 30, 2026, the latest completed quarter before the post and the period corresponding to the context's latest Microsoft fiscal quarter.
  - Compute costs include training and inference across suppliers. Broader research expenses, revenue-sharing payments and future commitments are not interchangeable with compute expenditure.
  - The estimate basis reflects the speaker's inference from press-reported expenses and supplier disclosures.
support_condition: Comparable evidence establishes that OpenAI incurred more than USD 11 billion in compute costs during the target quarter.
contradiction_condition: Comparable evidence establishes that OpenAI incurred USD 11 billion or less in compute costs during the target quarter.
measurement_requirements: A realized quarterly total covering training and inference across suppliers, separated from non-compute expenses and without double counting.
source_requirements: OpenAI financial records or reliable reporting that explicitly isolates compute costs for the target quarter.
