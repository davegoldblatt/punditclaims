explicit_source_elements:
  - humanoid robots
  - a whole set of challenges
  - well beyond our current grasp
  - humanoid robots in the home
  - expect them to be safe
evaluator_interpretation:
  - The plain contextual reading concerns reliable, autonomous, general-purpose operation in ordinary homes, including practical understanding and safety.
  - The statement does not deny that humanoid prototypes could walk, manipulate objects, or perform selected demonstrations.
  - “Beyond our current grasp” means important capabilities remained unsolved, not that they were permanently impossible.
  - The target is technology available at the October 1, 2022 post. Because robotics has no standard reporting quarter, the reporting window is 2022 through the post date; earlier years and subsequent advances are not decisive outcome evidence.
  - No numerical reliability threshold is supplied. The assessment therefore concerns demonstrated general household readiness rather than an invented benchmark cutoff.
support_condition: Contemporary technical evidence identifies substantial unresolved problems in general autonomy, practical understanding, or safe operation that prevent reliable general-purpose humanoid use in unstructured homes.
contradiction_condition: Credible evidence establishes that technology available by the post already enabled reliable, autonomous, general-purpose humanoid operation in ordinary homes with demonstrated safety. Selected demonstrations or narrow tasks do not suffice.
measurement_requirements: Evidence must distinguish controlled demonstrations and restricted skills from general household operation, and identify the remaining capability limitations.
source_requirements: Contemporary primary robotics research, developer evaluations, or documented capability assessments. Broad robotics evidence may establish shared intelligence limitations, but tests of other robot types cannot directly establish humanoid performance.
