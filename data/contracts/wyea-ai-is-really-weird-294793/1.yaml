explicit_source_elements:
  - growth” is only possible
  - all of the companies in question
  - heavily subsidize their products
  - spending $3 to $15 for every dollar of revenue
evaluator_interpretation:
  - The ordinary reading concerns rapidly growing generative-AI vendors, including OpenAI and Anthropic, rather than every company supplying AI infrastructure.
  - The claim combines a spending ratio with a stronger assertion that subsidies are necessary for growth. Losses alone do not establish that necessity.
  - I use calendar 2025, the latest completed annual reporting period before the post, consistent with the surrounding discussion of annual revenue.
  - Spending means company-wide expenditure relative to realized revenue. The speaker does not specify cash expenditure, accounting expenses, treatment of investment, or an accounting basis.
support_condition: Comparable records show spending of $3–$15 per dollar of realized revenue for every company in the intended group, and credible evidence shows that their growth depended on those subsidies.
contradiction_condition: A company clearly within the intended group has a comparable spending ratio outside the stated range, or credible evidence shows that its growth continued without the claimed subsidy dependence.
measurement_requirements: Match expenditure and realized revenue for the same company and period. Distinguish operating expenses, capital expenditure, cash burn, and valuation-related accounting charges. Establish subsidy dependence separately from financial losses.
source_requirements: Company financial statements or independently verified financial records, plus evidence about growth following subsidy or pricing changes.
