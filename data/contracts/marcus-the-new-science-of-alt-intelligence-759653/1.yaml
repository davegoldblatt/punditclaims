assessment_axis: historical_observation
explicit_source_elements:
  - Literally billions of dollars
  - poured into Transformers
  - training data sets have expanded from megabytes to gigabytes
  - parameter counts from millions to trillions
  - discomprehending errors
  - since 1988
  - remain
evaluator_interpretation:
  - This is a compound claim about resources, model scale, and continuing comprehension failures. Supporting the whole claim requires evidence for each material component.
  - The historical comparison runs from 1988 through publication. The assertion that errors remain concerns systems available by May 14, 2022.
  - I read dollars as US dollars and poured into Transformers as resources actually devoted to developing this technology. General AI investment, company financing, and expenditure cannot automatically be substituted for one another.
  - I read discomprehending errors as observable failures of compositional interpretation or generalization, without treating those failures as proof about subjective understanding.
support_condition: Establish multibillion-dollar resources attributable to Transformer development by publication, the stated growth in training data and parameter counts, and independently documented comparable comprehension failures in early research and contemporary systems.
contradiction_condition: Comparable evidence establishes that a material component is false, such as a comprehensive Transformer expenditure total below the claimed scale or reliable elimination of the specified failures. Missing expenditure records alone do not contradict the claim.
measurement_requirements: Separate financing from expenditure; identify allocation to Transformers; distinguish total from active parameters and dataset storage size from token counts. Historical and contemporary error examples must concern comparable capabilities.
source_requirements: Financial disclosures or transparent spending estimates, original model specifications, and independent historical and contemporary research. Marcus's own work cannot establish his claim.
