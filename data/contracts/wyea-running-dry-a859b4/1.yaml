assessment_axis: forecast_outcome
explicit_source_elements:
  - the only guarantees
  - costs will expand dramatically
  - every single year without fail
evaluator_interpretation:
  - The ordinary reading concerns substantial annual growth in company-wide operating costs, including compute, rather than only one expense category.
  - Compare complete future financial years on a consistent basis. The first complete calendar year after publication is 2027.
  - Dramatically means substantial growth, but the speaker provides no percentage threshold. A marginal increase would remain ambiguous.
  - The universal wording allows a flat or declining future year to contradict the claim; a finite sequence of increases cannot prove it indefinitely.
support_condition: Every relevant future annual comparison shows substantial growth in comparable total operating costs. A finite series can support the trend but cannot conclusively establish the unrestricted every-year claim.
contradiction_condition: A complete future year has flat or declining comparable total operating costs relative to the preceding year.
measurement_requirements: Consistent annual total operating costs, including cost of revenue where separately presented, with accounting and organizational changes reconciled. Do not substitute commitments or cash outflows for expenses.
source_requirements: Annual company financial statements with comparable prior-year figures and explanatory notes.
metric_scope:
  company: Anthropic
  metric: Annual total operating costs, including cost of revenue
  currency: USD
  units: billions per year
  accounting_basis: company_reported
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A reported complete post-publication year with flat or declining comparable total operating costs conclusively contradicts every-year growth. No finite sequence of growing costs conclusively supports an unlimited annual guarantee.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No end date.
  - No numerical meaning for dramatically.
  - Costs could mean expenses, cash spending, or compute costs alone.
  - No fiscal-versus-calendar convention is specified.
