assessment_axis: historical_observation
explicit_source_elements:
  - From what I can tell
  - the exact same corporate entity
  - that was selling NFTs and hyping an AI-powered metaverse platform
  - is now ... selling an AI-powered gadget
  - mere months after disappearing on its users
  - after raising $30 million in venture capital
evaluator_interpretation:
  - "'From what I can tell' marks this as the speaker's reading of the evidence, not a claim of certainty. The test is whether the public record bears out the factual points he lists. A hedged reading confirmed by the record counts as supported. It is not held to a stricter standard than he set."
  - "'Exact same corporate entity' means the company that ran GAMA (Cyber Manufacture Co.) and the company selling the R1 (Rabbit Inc.) are one renamed entity."
  - "'Selling an AI-powered gadget' is met by Rabbit selling and shipping the R1 by early May 2024."
  - "'$30 million in venture capital' means Rabbit's announced cumulative funding as of the post. Funding is not revenue."
  - "'Disappearing on its users' is the speaker's description of GAMA going dormant. It is covered by his hedge and checked only loosely: did GAMA activity stop or get shelved within months before the R1 went on sale?"
support_condition: The record shows Cyber Manufacture Co., GAMA's company, became Rabbit Inc. It also shows GAMA was an NFT project that was later shelved, Rabbit was selling the R1 by spring 2024, and Rabbit had announced $30 million in total funding.
contradiction_condition: The record shows the NFT seller and the R1 seller are different legal entities, or Rabbit's announced funding before the post was materially different from $30 million, or Rabbit was not selling the R1 by May 2024.
measurement_requirements: Cumulative venture funding announced by Rabbit as of the post date, in US dollars.
source_requirements: Company releases, contemporaneous tech press, and company statements to the press. The speaker's own post is not evidence.
