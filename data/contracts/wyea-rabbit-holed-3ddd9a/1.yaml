explicit_source_elements:
  - From what I can tell
  - the exact same corporate entity
  - selling NFTs and hyping an AI-powered metaverse platform
  - mere months after disappearing on its users
  - selling an AI-powered gadget
  - after raising $30 million in venture capital
evaluator_interpretation:
  - The opening qualification expresses uncertainty about a concrete historical account; it does not make the account uncheckable.
  - Disappearing on users means withdrawing meaningful company-led development and communication, not literal disappearance of every file or account.
  - Mere months means the late-2023 to early-2024 transition described in the surrounding text.
  - After raising $30 million describes an attained financing stage, not necessarily an exact lifetime total at publication.
  - The funding basis is company_reported because the surrounding text expressly relies on Rabbit's funding announcement.
  - The target period covers the earlier GAMA activity, the transition, and R1 sales through publication.
support_condition: Records establish legal continuity, the NFT and AI-metaverse activity, withdrawal from users several months before R1 sales, and company-reported venture funding of $30 million before those sales.
contradiction_condition: Records establish distinct legal entities, no relevant prior NFT/metaverse activity, continued substantive GAMA operations inconsistent with withdrawal, a materially different sequence, or failure to reach the stated financing amount.
measurement_requirements: Separate capital raised from NFT sales and device revenue. Establish the timing of withdrawal from users independently of the date source code was released.
source_requirements: Corporate records, company funding announcements, and dated GAMA operational and customer communications.
