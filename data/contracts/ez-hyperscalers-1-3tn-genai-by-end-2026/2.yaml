explicit_source_elements:
  - Hyperscalers
  - will have sunk
  - over $1.3 trillion dollars
  - into generative AI
  - by the end of 2026
  - "the same post: between March 2022 and July 2026, Meta, Google, Amazon, and Microsoft spent over $1 trillion in capital expenditures"
  - post dated 2026-07-28
evaluator_interpretation:
  - We read 'by the end of 2026' as on or before 2026-12-31.
  - We take the companies (Meta, Google, Amazon, Microsoft) and the start date (March 2022) from the same post.
  - The post counts the four companies' capital expenditures since March 2022. It does not say whether all of that, or only the part spent on generative AI, is what was 'sunk into generative AI'. We do not choose between these now.
support_condition: From March 2022 to 2026-12-31, the four companies sunk over $1.3 trillion into generative AI, on the measure the speaker meant.
contradiction_condition: From March 2022 to 2026-12-31, the four companies sunk $1.3 trillion or less into generative AI, on the measure the speaker meant.
