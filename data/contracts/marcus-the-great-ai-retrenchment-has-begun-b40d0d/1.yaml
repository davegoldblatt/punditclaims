ambiguity_flags:
  - No numerical threshold or population is specified for 'more'.
  - "'Throughout' could mean recurring examples or a sustained industry-wide trend."
  - The claim does not distinguish expectations about scaling, practical reliability, and AGI arrival.
  - "'Revisionism' could imply retrospective misrepresentation, which ordinary changes of opinion would not establish."
