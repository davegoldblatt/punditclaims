evaluator_interpretation:
  - "Assess the two factual statements separately: approximately 2GW of AI-specific capacity, and three quarterly announcements of approximately 1GW of capacity additions."
  - "Read 'last three fiscal quarters' as the last three publicly reported quarters before publication: quarters ending December 2025, March 2026 and June 2026."
  - For the ongoing capacity stock, use July–September 2026, the latest completed quarter before publication. The combined target interval also includes the three historical quarters explicitly referenced.
  - The wording does not explicitly say the quarterly additions were entirely AI-specific. Supporting both figures does not establish that they conflict.
support_condition: Independent reporting places Microsoft's AI-specific capacity at approximately 2GW, and Microsoft's statements confirm approximately 1GW of total capacity additions in each of the three referenced reporting quarters.
contradiction_condition: Comparable reporting establishes a materially different AI-specific capacity stock, or Microsoft's statements do not substantiate the three approximately 1GW quarterly announcements.
measurement_requirements: Distinguish AI-specific capacity from total datacenter capacity, existing capacity from additions, and operating facilities from planned facilities. Identify whether rented external compute is included.
source_requirements: Microsoft's original quarterly statements and independent reporting on the existing AI-specific fleet. Reporting establishes a reported estimate, not an independently audited physical inventory.
