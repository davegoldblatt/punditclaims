explicit_source_elements:
  - mostly because
  - Large Language Models don’t really do the things
  - take someone’s job at scale
  - to this point
evaluator_interpretation:
  - The claim attributes limited widespread worker displacement chiefly to inadequate LLM capability as of June 16, 2025.
  - The ordinary reading of capability includes reliably completing the work needed for a substantive role under practical operating conditions.
  - "'Mostly because' requires evidence comparing capability constraints with other causes, such as adoption, integration, organizational choices, labor-market rigidity, and demand."
  - A lack of research showing displacement is not itself evidence of either absent displacement or its cause.
  - The observation is bounded by the post date and supplies no starting date.
support_condition: Employment research and deployment evidence identify inadequate LLM capabilities as the principal cause of limited widespread displacement, after comparing plausible alternative causes.
contradiction_condition: Comparable evidence identifies another cause as dominant, or demonstrates broadly sufficient replacement capability while establishing that other constraints principally explain limited displacement.
measurement_requirements: Measure both actual employment substitution and practical capabilities, and distinguish their causal contribution from adoption, organizational, economic, and institutional barriers.
source_requirements: Prefer causal employment studies and documented deployments. Benchmarks can establish capability limitations but cannot alone rank causes of labor-market outcomes.
