assessment_axis: historical_observation
explicit_source_elements:
  - the majority of all AI capex
  - from big tech
  - a massive systemic weakness in our economy
evaluator_interpretation:
  - Big tech means Microsoft, Amazon, Alphabet and Meta, the four companies identified in the surrounding discussion.
  - Majority means more than 50% of AI capital expenditure, measured consistently across the numerator and denominator.
  - The plain reading is that investment is concentrated enough that a spending retrenchment by these companies would materially threaten US economic activity.
  - For the ongoing observation, use April–June 2025, the latest completed reporting quarter before publication. The context mixes that quarter with full-year 2025 estimates; this is not treated as a forecast of completed full-year spending.
  - All AI capex has an unspecified geography. Test global spending first, while requiring US-specific evidence for the economic-risk clause.
  - The contextual comparison uses compiled spending estimates, so the accounting basis is estimate.
support_condition: Comparable estimates show the four companies supplying more than half of all AI capital expenditure during the target quarter, and credible analysis establishes material US economic exposure to that concentration.
contradiction_condition: Comparable estimates put their combined share at 50% or less, or credible analysis rejects the claimed material economic exposure. Evidence against only one component would not establish that every component is false.
measurement_requirements: Separate AI expenditure from other capital expenditure. Use the same geography, period, lease treatment and asset coverage throughout. Avoid counting both a developer's asset purchase and its customer's financing of the same asset. Assess domestic economic exposure separately from worldwide spending.
source_requirements: Company disclosures combined with a comprehensive independent spending estimate; official statistics or transparent economic research for US exposure.
