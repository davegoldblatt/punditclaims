  end: 2024-06-30
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Killer app has no supplied adoption, retention or utility threshold.
  - The wording does not distinguish professional from general-consumer applications.
  - On the horizon could alternatively be read as an undated forecast.
  - The observation period is the evaluator's latest-completed-quarter convention.
