assessment_axis: historical_observation
explicit_source_elements:
  - Real world customers
  - many of whom are disappointed
  - are rarely mentioned
evaluator_interpretation:
  - The surrounding paragraph identifies the relevant coverage as AI-progress discussion by pundits such as Roose, Newton and Cowen.
  - The ordinary reading is that customer experiences receive infrequent attention, while substantial numbers of customers experience disappointment. Many does not necessarily mean a majority.
  - Customers includes organizational adopters and individual users; vendor executives discussing their own products do not substitute for customer experiences.
  - The target is the public coverage and customer experience observable through April 7, 2025. This is the latest public state before publication; no beginning is specified.
  - Rarely is a frequency claim. Isolated examples cannot establish either rare or regular coverage.
support_condition: A representative or complete record shows infrequent customer discussion in the relevant coverage, and credible evidence establishes substantial dissatisfaction among actual users or organizational adopters.
contradiction_condition: A representative or complete record shows regular customer discussion, or sufficiently representative customer evidence rules out substantial dissatisfaction. A few mentions or many satisfied customers alone do not suffice.
measurement_requirements: Define the coverage population and count both relevant articles or segments and those discussing customers. Report results by commentator and distinguish customer experience from company promotion. Examine survey population, fieldwork dates and what dissatisfaction measures.
source_requirements: Dated coverage by the named commentators and customer surveys or documented customer experiences describing the period before publication. Prefer original coverage and original survey disclosures.
