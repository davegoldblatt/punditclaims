explicit_source_elements:
  - An LLM didn’t solve the math problem on its own
  - used in a very narrow, prescribed way
  - inside of larger system
evaluator_interpretation:
  - The target is the FunSearch system reported in December 2023 and discussed in the post, not later systems.
  - The ordinary reading of 'narrow, prescribed' is that the LLM generated a designated part of a program within a separately specified search and evaluation process.
  - The claim concerns the division of work within the system. It does not imply that the LLM's contribution was trivial or that the results lacked novelty.
support_condition: The original study describes the LLM generating designated program components within a larger system that supplies problem structure, evaluates candidates, and selects programs for further search.
contradiction_condition: The original study shows that the reported mathematical result came from the LLM solving the problem end to end, without the claimed restriction to a designated component and surrounding search and evaluation system.
measurement_requirements: Inspect the original system description, program skeletons, prompting procedure, and evaluation loop.
source_requirements: Use the original paper or contemporaneous documentation from its authors.
