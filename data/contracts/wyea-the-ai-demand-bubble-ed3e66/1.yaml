assessment_axis: historical_observation
explicit_source_elements:
  - AI demand
  - doesn’t really exist
  - without hyperscalers paying themselves
evaluator_interpretation:
  - The plain reading is that substantial commercial AI demand depends on hyperscaler investments funding purchases from those same hyperscalers.
  - This is stronger than saying that circular financing exists or that investment exceeds customer spending.
  - For this ongoing observation, use April–June 2026, the latest completed calendar quarter that could be publicly reported before the post.
  - Customer payments establish demand, but do not by themselves establish whether that demand would survive withdrawal of hyperscaler funding.
support_condition: Evidence tracing customer spending and financing shows that commercially substantial AI demand depends on hyperscalers funding their own customers.
contradiction_condition: Evidence establishes substantial commercial AI purchases financed independently of hyperscaler investments, with enough information to distinguish independent demand from investment-funded purchases.
measurement_requirements: Identify actual purchases, customers' financing sources, credits and subsidies, and the share of demand attributable to hyperscaler-funded labs. Avoid counting the same spending repeatedly across suppliers.
source_requirements: Customer transaction records, financial disclosures, funding agreements, or independent research connecting purchases to financing sources.
