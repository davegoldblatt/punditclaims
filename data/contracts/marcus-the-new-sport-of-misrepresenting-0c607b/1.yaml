ambiguity_flags:
  - The source embeds a February tweet in a September post.
  - The ongoing capability observation is assessed using February records through the tweet date.
  - Cognitive depth and reliable have no stated numerical measures.
  - Vision alone does not specify treatment of maps, localization, or other nonvisual inputs.
  - Lack of deployment and lack of technical capability are different propositions.
