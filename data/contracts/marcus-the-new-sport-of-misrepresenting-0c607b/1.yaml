assessment_axis: historical_observation
explicit_source_elements:
  - Current neural nets
  - lack the cognitive depth and robustness
  - necessary to support reliable L5 self-driving
  - vision alone
evaluator_interpretation:
  - Current refers to the quoted February 25, 2022 statement, not systems available in September 2022 or at evaluation.
  - The target is the February 2022 capability state through the tweet date, using that month's public records for this ongoing observation.
  - L5 means full driving automation across the driving conditions covered by that level, without requiring a supervising driver.
  - The plain reading concerns insufficient capability and robustness in contemporary vision-only neural systems. It is stronger than the observation that no qualifying product had been deployed.
  - Cognitive depth has no independent measurement here; the capability assessment must rely on demonstrated driving performance and diagnosed limitations.
support_condition: Contemporaneous evaluations of relevant vision-only neural systems establish perception or decision-making limitations that prevent reliable Level 5 operation. Mere nondeployment or one manufacturer's failure is insufficient to establish the whole claim.
contradiction_condition: A documented system using neural networks and vision alone demonstrates reliable Level 5 operation with the technology available by February 25, 2022.
measurement_requirements: Identify the model and sensor configuration, operating conditions, human interventions, failure rates, and whether failures arise from the neural system rather than unrelated components or deliberate driving policies.
source_requirements: Primary capability evaluations, regulator findings, or independently validated driving records. Marketing labels and the absence of a deployment do not suffice.
