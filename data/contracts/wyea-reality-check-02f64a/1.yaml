evaluator_interpretation:
  - The plain reading is a broad reduction in hyperscalers' AI infrastructure spending, rather than merely slower growth or fewer new leases.
  - The surrounding discussion identifies Microsoft, Amazon, Google, Meta and Oracle as the relevant companies.
  - For realized expenditure, I use January–March 2025, the latest completed calendar quarter for which results could have been public before publication. April announcements about investment plans are context, not realized quarterly spending.
  - The claim relies on analyst reports, so its accounting basis is estimate. Company guidance and reported expenditure must retain their separate bases.
  - The sentence describes coincident economic uncertainty; it does not establish a separate causal claim about tariffs.
support_condition: Comparable estimates show a broad reduction in AI infrastructure capital expenditure during the target quarter, against the preceding quarter or previously committed expenditure for the same period.
contradiction_condition: Comparable estimates show that AI infrastructure expenditure broadly increased or remained unchanged, without a material reduction against previously committed expenditure.
measurement_requirements: Separate AI infrastructure from other capital expenditure. Compare the same companies, periods and expenditure definitions. Distinguish realized spending, budgets, lease negotiations and power-capacity commitments.
source_requirements: Contemporaneous expenditure estimates with disclosed methods, supported where possible by company filings and announcements.
