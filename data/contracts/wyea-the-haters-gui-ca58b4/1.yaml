explicit_source_elements:
  - no path to profitability
  - recently jacked up prices on Cursor
  - its largest customer
  - had to put restraints on Claude Code
  - 100% to 10,000% of their revenue
  - actions of a desperate company
evaluator_interpretation:
  - Assess the factual components separately within the supplied compound claim.
  - Read 'recently' as June 1 through publication on July 21, 2025, covering the immediately preceding pricing and usage-limit changes. This window is an evaluator interpretation.
  - Read the percentage as service costs relative to subscription revenue from affected users, not relative to all Anthropic revenue.
  - API retail value is not automatically Anthropic's cost of serving a user.
  - Read 'no path' as no workable financial route apparent at that time, not an unlimited prediction.
  - "'Desperate' is an evaluative characterization and receives no separate factual score."
support_condition: Evidence establishes an Anthropic price increase paid by Cursor, Cursor's first-place customer ranking, tighter Claude Code limits caused by the stated user-level cost burden, and the absence of a workable financial route to profitability.
contradiction_condition: Comparable evidence disproves a material factual component, such as showing no relevant supplier price increase, another larger customer, materially different cost ratios, or a workable financial path.
measurement_requirements: Obtain Cursor's supplier terms before and after the change, customer revenue rankings, dated usage-limit changes, and actual serving costs matched to subscription receipts. Keep API list-price equivalents separate from costs.
source_requirements: Prefer contracts, company pricing histories, customer disclosures, and financial records. Independent reporting can establish observed service restrictions but not undisclosed costs.
