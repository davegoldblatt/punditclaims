condition_status: not_applicable
early_resolution_rule: A dated, industry-wide financial collapse with documented persistence can establish the predicted fall. Resolving the full claim as supported additionally requires evidence that supporters postponed it. Isolated failures or regional selloffs do not meet this rule.
interpretation_determines_result: false
