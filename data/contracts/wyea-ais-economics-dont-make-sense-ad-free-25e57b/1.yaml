evaluator_interpretation:
  - The surrounding discussion makes this a forecast of financial collapse in the generative-AI industry and its infrastructure investment boom.
  - The ordinary reading is a broad, sustained collapse in investment and valuations. A correction in one market or the failure of one company would not by itself establish the industry's fall.
  - The speaker supplies no numerical collapse threshold, minimum duration, or deadline. I do not add one.
  - The claim that supporters delayed the collapse adds a causal assertion. A subsequent collapse alone would not establish that assertion.
support_condition: Evidence establishes a broad and sustained financial collapse of the industry after publication. Supporting the entire statement also requires evidence that the support described postponed that collapse.
contradiction_condition: Evidence establishes that the asserted delaying mechanism did not operate. Continued growth or survival over a finite period cannot conclusively contradict an inevitable collapse forecast with no deadline.
measurement_requirements: Broad investment and valuation records covering the generative-AI industry and infrastructure providers, with enough subsequent observations to distinguish a sustained collapse from a temporary or regional correction. Separate evidence is needed for the claimed causal delay.
source_requirements: Prefer original investment datasets, filings and transaction disclosures. News accounts may document market events but cannot alone establish the counterfactual timing of a collapse.
