  - the grim financials
  - there’s a backlash now
evaluator_interpretation:
  - The plain reading is substantial financial difficulty among prominent driverless-car businesses alongside organized public or official opposition.
  - The wording does not imply that every company is insolvent or that most people oppose driverless cars.
  - For financial conditions, the latest completed reporting quarter before publication is July–September 2023. For the ongoing backlash, the window extends through October 27. The combined target period therefore covers July 1–October 27.
  - Marcus supplies no industry membership list, financial metric, accounting basis, or threshold for grim. I do not substitute one company's adjusted loss for an industry-wide result.
support_condition: Comparable evidence establishes substantial financial difficulty across a sufficiently representative set of prominent industry participants, and dated records establish organized opposition during the target period.
contradiction_condition: Representative financial evidence establishes healthy conditions inconsistent with the stated financial difficulty, or records establish that the alleged backlash did not occur.
measurement_requirements: Assess financial conditions and backlash separately. Keep company-specific losses, cash expenditure, funding, and industry aggregates distinct.
source_requirements: Company financial disclosures for the financial component; official records or reputable contemporaneous reporting for organized opposition.
