assessment_axis: causal_assessment
explicit_source_elements:
  - Without data transparency
  - we can’t make sure our models are without bias
  - or even know the sources of the biases
  - we can’t truly understand the scope and limits of their generalization
  - we are hamstrung in our ability to mitigate their harmful consequences
evaluator_interpretation:
  - Data transparency means access to meaningful information about the data used to train a model.
  - The ordinary reading contains strong necessity claims about bias assurance, identifying bias sources, and understanding generalization, alongside a weaker claim that opacity impairs mitigation.
  - Impaired mitigation does not mean that all mitigation is impossible.
  - Detecting some bias is different from assuring its absence; identifying predictive features is different from establishing the training-data cause of a bias.
  - This is a general causal claim rather than an observation tied to a reporting period. Research available by the evaluation date may bear on it.
support_condition: Research establishes that withholding training-data information prevents the asserted assurance, attribution, and generalization assessments, and materially impairs harm mitigation, rather than merely making some evaluations less convenient.
contradiction_condition: Research demonstrates that the asserted necessary assessments can be achieved without training-data transparency, or that comparable mitigation is not impaired by withholding that information. Partial bias detection alone does not refute the full claim.
measurement_requirements: Separate training-data access from access to weights, code, outputs, and deployment information. Specify the bias criterion and generalization domain, and compare assessment or mitigation performance with and without data disclosure.
source_requirements: Primary empirical or theoretical research, preferably controlled comparisons that isolate data access. Reviews can support mechanisms but do not alone establish universal impossibility.
