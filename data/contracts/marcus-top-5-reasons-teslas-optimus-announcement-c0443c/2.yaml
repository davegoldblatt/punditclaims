ambiguity_flags:
  - "'Apparently' qualifies the shutdown account; it is not a conditional antecedent."
  - "'Last year' can denote the reported shutdown or its occurrence; these dates differ."
  - "'Anything that looked remotely like a product' supplies no precise boundary between research tools and a practical robotics product."
  - The historical sequence begins with the named demonstration month; 'never shipping' also reaches back into the effort's earlier history.
