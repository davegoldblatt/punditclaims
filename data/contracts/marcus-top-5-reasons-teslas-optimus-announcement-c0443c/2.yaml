assessment_axis: historical_observation
explicit_source_elements:
  - Rubik’s cube robot demo in October 2019
  - apparently shut the whole thing down last year
  - never shipping anything that looked remotely like a product
evaluator_interpretation:
  - Treat 'apparently' as a qualified account based on public reporting, not a firm assertion of independently verified facts.
  - Read 'last year' as referring to the shutdown account reported in 2021. Distinguish the reporting year from the actual shutdown date.
  - Read 'the whole thing' as the robotics research effort responsible for the demonstration, not OpenAI as a company.
  - The ordinary reading of 'product' is a robotics system delivered for practical use outside the research demonstration. Research papers and experimental software alone do not establish such a delivery.
  - Assess the historical sequence from the named demonstration month through the post date. 'Never shipping' concerns the effort's history up to that date, not its future.
  - Treat the descriptions of press attention as background emphasis rather than a numerical publicity threshold.
support_condition: Reliable reporting published in 2021 supports the qualified account that OpenAI ended the relevant robotics effort, and reliable release histories or explicit accounts establish that it had shipped no practical robotics product through September 29, 2022.
contradiction_condition: Reliable evidence shows that the reported shutdown account was mistaken, or identifies a practical robotics product from this effort delivered by September 29, 2022. An earlier shutdown date alone does not contradict the qualified reporting-based reading.
measurement_requirements: Separate demonstration, research release, and delivery of a practical robotics product. Separate the shutdown date from the date it became public.
source_requirements: Prefer OpenAI announcements or statements by the responsible researchers. Reliable reporting may establish the reported shutdown. Lack of search results alone cannot establish that no product shipped.
