evaluator_interpretation:
  - In context, 'use' means obtain useful software-development results, not merely operate the interface.
  - The post includes supervised coding agents within 'vibe-coded tools'; it does not restrict the phrase to accepting code without inspection.
  - Careful oversight includes experienced engineers setting requirements, checking results, testing, monitoring, and maintaining the workflow.
  - Assess capabilities and reported operating practices during April 1–27, the current month before publication. This is a possibility claim, not a guarantee of faster or safer work on every task.
support_condition: A documented deployment shows experienced engineers obtaining useful results from coding agents while applying substantive testing, monitoring, or review.
contradiction_condition: Credible evidence establishes that skilled developers cannot obtain useful results from these tools even with substantive oversight.
measurement_requirements: Identify both useful results and actual oversight. Adoption alone is insufficient; universal productivity or safety gains are not required.
source_requirements: Prefer firsthand deployment accounts, reproducible projects, or evaluations that describe the developers and their oversight.
