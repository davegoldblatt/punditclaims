assessment_axis: causal_assessment
explicit_source_elements:
  - expensive
  - unproductive
  - actively damaging to the learning and efficacy of its users
  - depriving them of the opportunities to learn and grow
  - they know less and do less because all they do is prompt
evaluator_interpretation:
  - The testable core concerns generative AI's effects on useful work, learning and independent performance.
  - "'Poisonous to the future' is an evaluative conclusion without a separate measurable endpoint."
  - The ordinary reading is a broad negative causal assessment, not merely that some users can experience harm.
  - Mixed requires demonstrated harm on an assessed component and demonstrated benefits that limit the broad negative assessment. It does not establish every component.
  - "'Expensive' lacks a cost benchmark; the claim does not identify a particular company's financial metric."
support_condition: Controlled or longitudinal evidence shows that AI reliance reduces useful output, learning or independent effectiveness. Establishing the full broad claim also requires evidence of generality and costs relative to benefits.
contradiction_condition: Controlled evidence shows meaningful productivity or learning gains, contradicting the broad negative characterization while allowing that other users or tasks may be harmed.
measurement_requirements: Measure task time and quality, retained learning and unaided performance separately. Distinguish reduced acquisition of new skills from deterioration of existing skills, and immediate results from long-term effects.
source_requirements: Prefer randomized experiments and longitudinal assessments. Self-reports and associations alone cannot establish causal harm.
