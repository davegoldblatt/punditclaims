ambiguity_flags:
  - The denominator could be sales value, chip count or transaction count.
  - The text does not distinguish ordering from revenue-recognized sales.
  - The operational-use definition and two-year minimum are evaluator interpretations.
  - The sales cohort is inferred from the surrounding 'since 2022' discussion, with the latest broadly reportable quarter used as its endpoint.
  - It is unclear whether the threshold applies jointly or separately to NVIDIA and Broadcom.
