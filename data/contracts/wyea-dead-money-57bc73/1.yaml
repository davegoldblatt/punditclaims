assessment_axis: historical_observation
explicit_source_elements:
  - at least half of all those chip sales
  - Broadcom’s TPU sales too
  - years before anything actually happens with the chips
evaluator_interpretation:
  - Read 'anything actually happens' as first operational use for computing, rather than shipment, storage or testing.
  - Read plural 'years' as at least two years between sale and first operational use.
  - The surrounding dollar discussion suggests weighting sales by value; chip counts and transaction counts are alternative readings.
  - "'All those chip sales' refers back to sales since 2022. Use sales through June 2026, the latest broadly reportable calendar quarter before the post."
  - Treat NVIDIA GPUs and Broadcom TPUs as a combined population, while also checking each supplier separately.
support_condition: Representative sale-to-use records establish that at least 50% of the relevant sales value precedes first operational use by two years or more.
contradiction_condition: Comparable records establish that less than 50% does so, with enough coverage and sufficiently narrow uncertainty to exclude the threshold.
measurement_requirements: Match sale recognition dates, sales values and first operational dates by shipment or cohort. Do not count an order date as a completed sale or infer a two-year delay merely because a chip is currently unused.
source_requirements: Supplier and customer records or a transparent representative study covering both NVIDIA GPUs and Broadcom TPUs.
metric_scope:
  company: NVIDIA and Broadcom
  metric: Share of AI GPU and TPU sales value preceding first operational use by at least two years
  currency: USD
  units: percent of sales value
  accounting_basis: estimate
