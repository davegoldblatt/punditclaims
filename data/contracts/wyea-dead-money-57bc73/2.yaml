support_condition: Credible deployment data showing that at least half (by value or volume) of NVIDIA and Broadcom AI chips sold in 2026 will not be installed and used until a year or more after sale.
contradiction_condition: Credible deployment data showing that most NVIDIA and Broadcom AI chips sold in 2026 were installed and in use within about a year of sale.
measurement_requirements: Sale dates matched to install or power-on dates for a large share of 2026 NVIDIA GPU and Broadcom TPU shipments.
source_requirements: Buyer or vendor disclosures of install timing, independent deployment tracking, or analyst studies based on such data.
