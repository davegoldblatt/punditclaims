evaluator_interpretation:
  - '"Those chip sales" are read as current NVIDIA GPU sales plus Broadcom TPU sales being made now, in 2026. The present tense and the Morgan Stanley context point there.'
  - '"Years before anything actually happens" is read in his own words: a gap of more than a year between sale and the chips being installed and used. No extra threshold is added.'
