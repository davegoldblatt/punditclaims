evaluator_interpretation:
  - Assess both the proof's substantial dependence on Lean/mathlib and the asserted absence of comparable medical resources.
  - Comparable means a broadly reusable formal knowledge library and verification system for domain conclusions, not simply a medical database.
  - The wording does not imply that medicine has no formal-methods projects whatsoever.
  - Assess the proof released November 20 and the resource comparison as of the November 22 post.
support_condition: Proof records establish substantial Lean/mathlib dependence, and a sufficiently broad contemporary comparison establishes that medicine lacks an analogous formal knowledge and verification infrastructure.
contradiction_condition: Proof records establish no substantial dependence, or medical resources demonstrably provide comparable scope, reuse, and verification of domain conclusions.
measurement_requirements: Compare actual dependencies and the coverage and guarantees of medical resources. Isolated verification demonstrations do not establish infrastructure equivalence.
source_requirements: Prefer proof dependency records, maintainers' verification reports, medical research papers, and inventories of formal medical resources.
