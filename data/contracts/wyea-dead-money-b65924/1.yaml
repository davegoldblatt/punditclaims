explicit_source_elements:
  - AI data center customers
  - brittle
  - unprofitable
  - dependent on near-perpetual funding
  - the average customer
evaluator_interpretation:
  - The plain reading is a general description of the customer base, not a claim about every customer or only selected startups.
  - Include actual tenants and compute purchasers, distinguishing their finances from those of downstream application developers.
  - Read brittle as vulnerable to payment failure if external funding stops, and near-perpetual funding as repeated financing needed to sustain operations and commitments.
  - Use April–June 2026, the latest completed calendar quarter ordinarily reportable before the September 29 post.
  - The surrounding discussion relies on financial reporting and estimates, but supplies no single accounting basis for the customer population; do not silently equate GAAP losses, cash burn and financing dependence.
support_condition: Representative customer evidence shows that unprofitability and reliance on recurring external financing were general characteristics in the target quarter, with insufficient internal resources to sustain commitments.
contradiction_condition: Representative customer evidence shows that the typical customer was profitable and could sustain its commitments without recurring external financing.
measurement_requirements: A defined tenant population and weighting method, comparable profitability measures, operating cash flow, liquidity, payment obligations and financing histories. Losses alone do not establish imminent payment failure.
source_requirements: Prefer tenant disclosures and filings, connected to verified customer relationships. Use press estimates for private companies only with their limitations stated.
