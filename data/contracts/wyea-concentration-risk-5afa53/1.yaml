assessment_axis: forecast_outcome
explicit_source_elements:
  - begin in earnest in 2027
  - expand dramatically every year following
  - though I doubt we will make it that far
evaluator_interpretation:
  - The subject is OpenAI's and Anthropic's contractual compute payments, taken together.
  - The plain reading is a substantial increase in annual payments in 2027 relative to 2026, followed by substantial increases each subsequent year.
  - No numerical definition of 'in earnest' or 'dramatically' is supplied. I do not invent one.
  - The horizon below covers the expressly dated 2027 ramp. The subsequent annual-growth assertion has no final deadline.
  - The parenthetical expresses doubt about the industry's survival; it is not a clear conditional antecedent.
support_condition: Comparable payment records show a substantial ramp in 2027 relative to 2026 and substantial annual increases thereafter. A finite record can support only the years observed, not an indefinite continuation.
contradiction_condition: Comparable records show no substantial 2027 ramp, or a subsequent completed year clearly fails to show the asserted substantial increase.
measurement_requirements: Annual contractual compute payments for both companies, with consistent coverage and treatment of prepayments, leases, cancellations and capacity delivery. Separate payments from supplier capital expenditure and multiyear contract totals.
source_requirements: Company financial disclosures, contractual payment schedules or reliable reporting based on those records.
metric_scope:
  company: OpenAI and Anthropic
  metric: Combined annual contractual compute payments
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2027-01-01
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: in 2027, and expand dramatically every year following
horizon_interval:
  start: 2026-09-08
  end: 2027-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An irreversible event or complete, unconditional payment records must make the asserted 2027 ramp impossible or certain. Capacity announcements and provisional schedules alone do not qualify. No finite early event can establish substantial growth every year indefinitely.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No quantitative threshold for 'in earnest' or 'dramatically'.
  - No final year for 'every year following'.
  - Payments due and payments actually made are not expressly distinguished.
  - The survival parenthetical has no defined event or deadline.
retrospective_or_prospective: prospective
