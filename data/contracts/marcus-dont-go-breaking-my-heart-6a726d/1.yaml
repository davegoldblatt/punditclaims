explicit_source_elements:
  - More and more people
  - are using chatbots
evaluator_interpretation:
  - The plain reading is a recent rise in adoption of conversational AI, including general-purpose chatbots.
  - It does not require every chatbot to gain users or predict indefinite growth.
  - Use December 2022 through January 2023 to assess the trend through the latest complete calendar month before the post.
  - Comparable unique-user measures are informative; raw visits alone can rise without more people using a service.
support_condition: Comparable recent user measures show substantial growth in adoption of prominent conversational chatbots.
contradiction_condition: Comparable evidence shows that adoption was broadly stable or falling over the same period, making examples of growth unrepresentative.
measurement_requirements: Compare like-for-like user measures across time; distinguish unique visitors, active users, visits, and registrations.
source_requirements: Prefer platform disclosures or independent audience measurement. Reputable reporting of identified measurement is acceptable when the underlying report cannot be retrieved.
