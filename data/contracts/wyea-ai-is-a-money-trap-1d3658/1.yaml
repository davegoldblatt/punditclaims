ambiguity_flags:
  - Ongoing observation assigned to the latest completed reportable quarter
  - Scale could mean customer volume, model size, or both
  - Profitability level and cost allocation are unspecified
  - Functionality sufficient to justify costs has no explicit measure
  - Industry-wide scope cannot be inferred from one company's accounts
