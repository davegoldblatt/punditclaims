assessment_axis: historical_observation
explicit_source_elements:
  - Large Language Models
  - do not scale profitably
  - functionality is not significant enough
  - justify the costs of running them
evaluator_interpretation:
  - The ordinary commercial reading is that delivering LLM services at scale cannot earn enough from their useful functionality to cover the costs of providing those services.
  - The context makes provider economics central. Customer productivity gains and provider profitability are separate questions.
  - Use April through June 2025, the latest completed calendar quarter before the post that public financial reporting could describe.
  - The claim names an industry and technology, not a particular company's financial measure; contract metric_scope is therefore null.
  - Company losses, serving costs, training costs, and cash burn must be distinguished.
support_condition: Representative service-level evidence for the target period shows that scaled LLM offerings fail to cover properly allocated costs, with evidence that increasing scale does not remedy the shortfall.
contradiction_condition: Reliable evidence for the target period shows sustained profitable operation of material LLM services at scale, with the relevant costs included and paying demand attributable to their functionality.
measurement_requirements: Service-level realized revenue, serving costs, necessary training and development costs, overhead, utilization, and changes with scale. Positive gross margin alone does not establish overall profitability; company losses alone do not establish unprofitable serving economics.
source_requirements: Prefer financial disclosures with explicit cost allocations and periods. Use press reports only with their sourcing and verification limits stated.
metric_scope: null
