ambiguity_flags:
  - Narrowed has no stated comparison date; the launch announcement is the evaluator's baseline.
  - The ongoing planned focus is assessed using the latest programme public before the post.
  - Greatly and primarily have no quantitative thresholds.
  - Frontier risks include both current harms and prospective hazards.
  - Not enough supplies no adequacy standard.
  - Unclear authority is not an assertion that participating governments lack legal powers.
