assessment_axis: forecast_outcome
explicit_source_elements:
  - no hope
  - $800 billion or so invested in AI startups
  - in the last four years
  - AI acquisitions are thin
  - high costs, miserable revenues and utter lack of intellectual property
evaluator_interpretation:
  - The normalized claim predicts that investors will fail to recover the aggregate capital invested in the identified AI-startup cohort.
  - No hope is read as a forecast of substantial permanent aggregate losses, not a claim that every individual investment returns zero.
  - The preceding four years is read as October 6, 2022 through October 6, 2026. Calendar-year totals for 2022–2026 would cover a different cohort.
  - The dollar amount is read as US dollars. Geography, financing instruments, fees and the definition of an AI startup are unspecified.
  - Recovery means realized proceeds attributable to the original investment cohort. New financing, paper valuations and IPO market capitalizations are not themselves investor recovery.
  - The surrounding phrase next few years is not imported as a deadline because it describes other companies and failures.
support_condition: Cohort-level realized proceeds, final write-offs and bounded remaining recoveries establish substantial permanent losses on the aggregate invested capital. Limited exits at an interim date do not suffice.
contradiction_condition: Documented realized proceeds attributable to this investment cohort recover approximately its verified aggregate invested capital. Individual successful exits alone do not suffice.
measurement_requirements: A reconciled investment cohort and denominator; cash distributions and realized sale proceeds attributable to those investments; subsequent capital contributions; final write-offs; remaining recoverable claims; and consistent treatment of fees and currencies.
source_requirements: Investor or fund distribution records, completed transaction documents and liquidation records, supplemented by a consistent investment database. Financing totals and valuations cannot substitute for realized returns.
metric_scope:
  company: AI startups receiving investment during the preceding four years, in aggregate
  metric: Approximately $800 billion of invested capital and its eventual recovery
  currency: USD
  units: billions
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2022-10-06
  period_end: 2026-10-06
  stock_or_flow: flow
