condition_status: not_applicable
early_resolution_rule: Resolve against the forecast if verified cumulative realized proceeds from the specified cohort recover approximately its verified invested capital. Resolve in its favor only if final realizations and write-offs, including any remaining recoverable claims, establish substantial permanent aggregate losses.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No recovery deadline is stated.
  - The investment cohort and source of the approximately $800 billion estimate are unspecified.
  - Rolling four years and calendar-year aggregates differ.
  - No accounting basis or treatment of investment fees is supplied.
  - No numerical loss threshold defines no hope.
  - The contract's monetary period identifies investment deployment, not a deadline for subsequent recovery.
retrospective_or_prospective: retrospective
