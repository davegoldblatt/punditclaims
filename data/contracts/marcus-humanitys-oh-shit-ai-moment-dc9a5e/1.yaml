evaluator_interpretation:
  - This is a general judgment that delaying AI regulation raises risk to society. It names no regulation, no measure of risk, and no comparison.
  - It is a policy argument about future likelihoods, with no counterfactual one could observe. Harm under weak regulation would not show that delay caused more risk. Absence of harm would not show the opposite.
support_condition: Credible comparative studies showing that places that delayed AI regulation saw measurably higher AI-related harm or exposure than places that regulated sooner, all else equal.
contradiction_condition: Credible comparative studies showing that delaying AI regulation did not raise, or lowered, AI-related harm or exposure.
