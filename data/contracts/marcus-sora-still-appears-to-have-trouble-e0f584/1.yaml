support_condition: The launch record documents repeated continuity failures across scenes or identifies them explicitly as a recurring model failure mode.
contradiction_condition: A sufficiently comprehensive examination establishes that the alleged continuity failure was isolated, while the other purported examples preserve object existence and identity.
measurement_requirements: Distinguish unexplained appearance, disappearance or identity loss from legitimate occlusion, camera framing and requested scene changes. A prevalence claim would additionally require representative sampling.
source_requirements: Contemporaneous primary documentation or independent inspection of the February demonstrations.
