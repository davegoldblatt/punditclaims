evaluator_interpretation:
  - "Preserve 'appears': Marcus expresses uncertainty about past use, rather than asserting confirmed use."
  - Reports can establish a basis for that impression, but their existence does not establish that the underlying uses occurred.
  - Marcus supplies no confidence threshold for 'appears'. Assigning one would add a commitment he did not make.
  - "'Thousands of other places' does not identify whether places means organizations, applications, individual uses, or government deployments. The surrounding discussion does not settle that scope."
  - The temporal scope is prior to publication on 2026-02-25. 'Already' supplies no starting date.
support_condition: No sufficiently determinate condition supports a categorical grade of the entire statement as written. Credible reports of the named uses could substantiate its evidential basis; verified use would establish a stronger proposition.
contradiction_condition: No sufficiently determinate condition contradicts the entire statement as written. Reliable refutations could undermine the reported appearances, but missing confirmation alone would not contradict 'appears'.
measurement_requirements: A categorical assessment would require a defined meaning or evidential threshold for 'appears' and an identified scope and counting unit for 'thousands of other places'.
source_requirements: Use contemporaneous reporting to assess the available evidential basis. Prefer operational records and drafting records for actual use. Distinguish tariff calculations from authorship of regulations.
