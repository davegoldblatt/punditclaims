evaluator_interpretation:
  - The claim tentatively asserts actual prior use, rather than merely the existence of speculation.
  - Use in the Maduro operation need not mean autonomous targeting or control of weapons.
  - Writing tariff regulations means contributing to the actual policy or drafting process; reproducing a similar formula is insufficient by itself.
  - Read 'places' as deployment settings or organizations, not necessarily physical locations or thousands of distinct tasks.
  - The period includes prior uses through the post date. No lower date bound is supplied.
support_condition: Credible evidence establishes both named uses and deployment in at least thousands of other settings.
contradiction_condition: Reliable evidence refutes one or more claimed uses. Lack of confirmation alone is insufficient.
measurement_requirements: Separate operational use from autonomous authority, actual drafting from output resemblance, and organizations from distinct use cases.
source_requirements: Operational or drafting records where available; otherwise credible reporting. Broad deployment counts may use clearly identified company disclosures.
