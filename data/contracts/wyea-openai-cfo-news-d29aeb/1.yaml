evaluator_interpretation:
  - The surrounding quotation identifies the measure as gross profit margin and the comparison as OpenAI's own projection for 2025.
  - Treat 2025 as the full calendar year.
  - The claim concerns the company-defined margin communicated to investors. The accounting basis is company_reported because the context expressly attributes the figures to OpenAI's investor presentation, although the information reaches readers through reporting.
  - Any shortfall satisfies the claim; no minimum size is stated.
support_condition: Comparable reporting or company records show that OpenAI's realized full-year 2025 gross profit margin was below its earlier projection for that year.
contradiction_condition: Comparable records show that OpenAI's realized full-year 2025 gross profit margin met or exceeded its earlier projection.
measurement_requirements: Compare actual and projected full-year margins on the same company-defined basis. Do not substitute paying-customer compute margins, operating margins, net margins, or another year's results.
source_requirements: Prefer the investor presentation or company financial records. Reporting must identify a comparable actual result and forecast; disclose reliance on secondary reporting.
