  - Spiral has no specified size or duration.
  - Anything along the lines of inability to pay leaves the qualifying news threshold imprecise.
  - The loan estimate and approximately $60 trigger lack disclosed calculations or covenants.
  - The claim may conflate collateral value with loan principal.
