explicit_source_elements:
  - another $9.2 billion in stock-backed personal loans
  - by my count
  - around $30 billion
  - margin calls will start somewhere around $60 a share
  - anything along the lines of “OpenAI can’t pay Oracle”
  - guaranteed to start a spiral
evaluator_interpretation:
  - Read the antecedent as credible public information indicating that OpenAI cannot meet its Oracle payment obligations. General concern about growth or a different revenue presentation does not automatically qualify.
  - Read spiral as a sustained, self-reinforcing stock decline, rather than any negative trading day.
  - Examine the proposed collateral mechanism separately. The value of pledged shares is not the amount borrowed.
  - Ellison's personal borrowing is distinct from Oracle's corporate debt. The contract's monetary scope records the asserted personal-loan premise; the forecast itself concerns Oracle stock.
support_condition: Qualifying news is followed by a sustained self-reinforcing decline attributable to that news, with evidence supporting the stated personal-loan exposure and approximately $60 collateral trigger.
contradiction_condition: A qualifying report is followed by a sufficiently observed market response without a sustained self-reinforcing decline. Verified loan documents could separately contradict the asserted borrowing amount or collateral trigger without settling the conditional market forecast.
measurement_requirements: Identify the qualifying news and timestamp; examine subsequent prices, trading volumes, market-wide moves and forced sales. Obtain loan balances, collateral terms, other pledged assets and cure rights before calculating a trigger price.
source_requirements: Credible dated reporting of inability to pay, exchange price records, loan or collateral documents and insider-sale disclosures. Company proxy statements may describe pledges without disclosing loan principal or call thresholds.
