explicit_source_elements:
  - The stock is crashing.
  - now it is down 13
  - as I write this at the opening bell
evaluator_interpretation:
  - The stock means Nasdaq-listed NVDA shares.
  - Crashing means a sharp opening-session decline. The context supplies an approximate magnitude of 13%, so no separate crash threshold is invented.
  - The comparison is with the previous regular-session close.
  - This is a market-price observation; corporate accounting basis does not apply.
  - The claim does not require establishing that the resignation alone caused the decline.
support_condition: Contemporaneous price records or reliable reporting show an opening decline of approximately 13%, with a comparably severe early-session fall.
contradiction_condition: Comparable opening-session records show no sharp fall and are materially inconsistent with the reported approximately 13% decline.
measurement_requirements: Use the November 12 opening or immediate opening-session price relative to the November 11 close. Do not substitute the November 12 closing return.
source_requirements: Prefer exchange or market-data records, corroborated by contemporaneous financial reporting.
