assessment_axis: causal_assessment
explicit_source_elements:
  - As the use of artificial intelligence grows
  - so do these revenue streams
  - forcing almost every single dollar spent on AI
  - into the hands of a few trillion-dollar tech firms
evaluator_interpretation:
  - The named beneficiaries are Microsoft, Amazon and Google.
  - The ordinary reading is that growing AI use channels nearly all AI expenditure to these firms through the described commercial arrangements.
  - Nearly all means only a small residual remains elsewhere; no numerical cutoff is supplied.
  - Use the latest completed calendar quarter before publication for the ongoing spending claim.
  - The denominator is AI spending, not all cloud infrastructure spending. Count flows consistently without counting the same dollar at successive layers twice.
support_condition: A representative expenditure breakdown shows nearly all AI spending flowing to the named providers, with contractual or usage evidence explaining why growing AI use causes those flows.
contradiction_condition: A comparable expenditure breakdown shows a substantial share remaining with other recipients or bypassing the named providers, undermining the asserted near-total channel.
measurement_requirements: A defined AI-spending denominator, recipient-level flows, treatment of indirect payments, and evidence connecting usage growth to provider receipts.
source_requirements: Market measurements specifically covering AI expenditure, supported by contracts or billing evidence. General cloud market shares are context only.
