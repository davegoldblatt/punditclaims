explicit_source_elements:
  - LLMs also tend to hallucinate
  - a virtually-unsolvable problem
  - too unreliable for any kind of mission critical work
evaluator_interpretation:
  - The ordinary reading is that confidently false answers prevent dependable use in work where errors can have serious consequences.
  - Any kind is broader than autonomous decision-making. The claim does not expressly exclude supervised or externally checked workflows.
  - For the ongoing state described on April 15, 2024, use January–March 2024, the latest complete quarter before publication. LLM research has no standard reporting quarter, so this is an explicit temporal convention.
  - Virtually unsolvable means resistant to practical mitigation sufficient for dependable use, rather than a requirement of mathematical perfection.
support_condition: Evidence for the target period establishes persistent hallucinations and shows that practical controls cannot provide adequate reliability across the mission-critical uses covered by the claim.
contradiction_condition: Evidence for the target period demonstrates a dependable mission-critical LLM workflow under realistic conditions, or practical mitigation sufficient to defeat the asserted broad prohibition.
measurement_requirements: Measure consequential errors, task-specific reliability requirements, oversight, verification, and actual workflow outcomes. Benchmark accuracy alone does not establish deployment safety.
source_requirements: Contemporaneous controlled evaluations and deployment studies, with clear distinctions between autonomous use and supervised assistance.
