evaluator_interpretation:
  - "'Pretty much every year' means a sustained, approximately annual pattern of public predictions about eventual driverless capability; it does not require an identical promise or deadline every year."
  - The historical promise component covers 2014 through the post date.
  - For the ongoing software-status component, use the latest publicly documented release before the post, in September 2022.
  - "'Driverless' means operation without a human continuously supervising and remaining ready to intervene."
support_condition: Dated records establish approximately annual driverless predictions beginning in 2014, while contemporary Tesla software documentation identifies FSD as beta and requires continuous driver attention.
contradiction_condition: The historical record lacks the claimed recurring predictions, or Tesla had released the relevant system for operation without continuous driver supervision before the post.
measurement_requirements: Separate promises of future autonomy from delivered driver assistance. Check software status and supervision requirements as they stood before September 29, 2022.
source_requirements: Prefer Tesla documentation for software status and original statements for promises. Accessible contemporaneous reporting may document statements where original records cannot be retrieved.
