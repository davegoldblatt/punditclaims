assessment_axis: historical_observation
explicit_source_elements:
  - a mid-tier AI model
  - an AI app that nobody uses
  - what exactly did they end up doing?
evaluator_interpretation:
  - The context refers to Meta's model and standalone Meta AI app, rather than all AI features embedded in Facebook, Instagram, and WhatsApp.
  - “Mid-tier” means broadly middling against contemporary leading general-purpose models, not merely failing to rank first.
  - “Nobody uses” is ordinary hyperbole for negligible meaningful adoption, not a literal assertion of zero users.
  - I use May 2026, the latest completed month before publication, for the ongoing performance and adoption assessment.
  - The context criticizes the hiring's visible results; it does not supply an auditable inventory of everything the researchers produced.
support_condition: Comparable May 2026 evidence shows middling overall model performance and negligible active use of the standalone app, with evidence connecting the assessed outputs to the hiring discussed.
contradiction_condition: Matching-period evidence establishes clearly leading overall model performance or a substantial active audience for the standalone app. Downloads alone or usage across Meta's other apps do not suffice.
measurement_requirements: Use dated comparative model evaluations and standalone-app active-user or engagement measurements. Keep releases, benchmark versions, geography, and observation periods explicit.
source_requirements: Prefer independent benchmark operators and app-measurement providers. Company-wide assistant reach cannot substitute for standalone-app use.
