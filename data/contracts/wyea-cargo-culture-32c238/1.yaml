  - “Mid-tier” supplies no benchmark, comparison set, or cutoff.
  - “Nobody uses” supplies no numerical adoption threshold.
  - May 2026 is an evaluator-selected reporting period for an ongoing state.
  - Attributing all visible outputs to a particular hiring cohort is uncertain.
