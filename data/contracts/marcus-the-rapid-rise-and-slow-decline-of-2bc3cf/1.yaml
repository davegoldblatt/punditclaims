evaluator_interpretation:
  - Profit ordinarily means company-wide net income after expenses, not revenue, financing, gross profit or positive cash flow.
  - Never covers the business's history through January 13, 2026. The start is left unspecified because the words do not identify an entity inception date.
  - The commercial-business context points to OpenAI's operating business rather than a standalone nonprofit parent's donation surplus.
  - Annual and any disclosed interim results are relevant; recent annual losses alone cannot establish never.
  - The words identify no accounting basis or underlying financial source, so accounting_basis is unknown.
support_condition: Consistent company-wide financial records establish no positive net-income period throughout the relevant operating history, with entity scope and accounting basis resolved.
contradiction_condition: A reliable record establishes at least one positive company-wide net-income period before the post on the applicable basis.
measurement_requirements: Use realized net income for the same business and consistent accounting basis. Do not substitute operating losses, cash burn, gross margins or financing.
source_requirements: Prefer consolidated financial statements. If unavailable, use credible reporting on actual statements and distinguish it from forecasts. Standalone nonprofit filings are not interchangeable with consolidated business results.
