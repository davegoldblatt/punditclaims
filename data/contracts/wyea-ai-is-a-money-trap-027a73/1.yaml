early_resolution_rule: A completed acquisition at the stated valuation or higher, or completed private shareholder liquidity, decisively contradicts the relevant exclusion. Announced transactions and primary funding alone do not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Liquidity could mean any shareholder cash realization or a complete exit for all investors.
  - The valuation is not identified as pre-money or post-money.
  - The embedded loss figure has no explicit reporting period or accounting definition.
  - No forecast deadline is supplied.
