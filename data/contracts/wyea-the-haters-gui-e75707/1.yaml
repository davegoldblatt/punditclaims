explicit_source_elements:
  - Cursor's growth story was a lie
  - $500 million in annualized revenue
  - a product it can no longer afford to sell
  - suggesting material weakness
  - any and all coding startups
evaluator_interpretation:
  - The context identifies a June 2025 revenue milestone and changes to the offering before publication on July 21.
  - Cannot afford means the former offering was economically unsustainable at its existing price and usage terms, rather than that Cursor was insolvent.
  - Growth story was a lie is read as criticism of the offering's sustainability, not as a separately evidenced allegation that the revenue figure was fabricated.
  - The industry-wide conclusion is introduced as a suggestion; it is not treated as an independently quantified claim about every startup.
  - The run-rate figure is treated as a press-reported estimate. ARR terminology must not silently substitute for a disclosed monthly-revenue calculation.
support_condition: Evidence establishes the stated annualized revenue milestone and shows that the former offering's actual serving costs made its continued sale economically unsustainable.
contradiction_condition: Matching records disprove the revenue milestone or show that the former offering could sustainably cover its relevant costs. Funding or subsequent growth alone does not establish affordability.
measurement_requirements: Verify the revenue definition, prior product terms, realized serving costs, customer usage distribution and margins under those terms.
source_requirements: Prefer company revenue disclosures and contemporaneous pricing explanations, supplemented by financial records or independently sourced reporting on costs.
