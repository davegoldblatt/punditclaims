assessment_axis: causal_assessment
explicit_source_elements:
  - To survive
  - must continue raising more money than any startup has ever raised before
  - only able to do so from SoftBank
  - which in turn must take on debt
evaluator_interpretation:
  - This asserts necessary financing conditions for survival, rather than merely predicting that another funding round will occur.
  - The post elsewhere explicitly acknowledges a syndicate of other investors. In that context, dependence on SoftBank can mean dependence on its backing or arrangement of the round, not that every dollar must originate from SoftBank.
  - The ordinary test is whether OpenAI could obtain sufficient continuing finance without indispensable SoftBank support, and whether SoftBank could provide its necessary support without borrowing.
  - "'To survive' describes the purpose of financing, not a conditional antecedent whose occurrence must first be established."
  - The startup funding comparison does not specify a single round, cumulative capital raised or a particular financing instrument.
support_condition: Financial records establish the amount of financing necessary for OpenAI's survival, show that it exceeded the relevant historical startup funding record, demonstrate that adequate alternatives to SoftBank were unavailable, and establish that SoftBank needed debt to supply the required support.
contradiction_condition: Evidence establishes an adequate financing path independent of indispensable SoftBank support, survival without the alleged record funding requirement, or sufficient SoftBank resources to provide the necessary support without borrowing.
measurement_requirements: Separate funding commitments from cash received, primary capital from secondary share sales, and actual borrowing from borrowing that was necessary. Define the historical startup funding comparison.
source_requirements: Financing agreements, investor identities, cash-flow requirements and evidence about alternative funding availability. Participation by other investors alone does not settle indispensable-arranger dependence.
