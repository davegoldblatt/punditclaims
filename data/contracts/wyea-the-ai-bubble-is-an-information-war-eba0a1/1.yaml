evaluator_interpretation:
  - The checkable proposition is willingness to help improve the reliability of autonomous lethal weapons, including the drones discussed in the surrounding passage.
  - An explicit offer of relevant research and development establishes willingness; an accepted contract or completed weapon is not required.
  - Loves them is rhetorical emphasis, not a separately measurable corporate emotion.
  - The target period is the contemporary negotiation window ending with publication, rather than an unspecified future weapons program.
support_condition: Anthropic publicly offered or authorized work with the military to improve autonomous lethal weapons' reliability or targeting accuracy.
contradiction_condition: Authoritative records establish that the alleged offer did not occur, or that it concerned only unrelated nonlethal systems while Anthropic categorically rejected the relevant work.
measurement_requirements: Distinguish willingness to research safer autonomous weapons from readiness to deploy them, actual weapons construction, or enthusiasm for civilian harm.
source_requirements: Company statements, documented proposals, or credible reporting describing the offer and its scope.
