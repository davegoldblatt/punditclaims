assessment_axis: forecast_outcome
explicit_source_elements:
  - massive, multi-billion dollar compute deals
  - data centers that won’t be built before
  - at this rate
  - "2030"
evaluator_interpretation:
  - Assess the construction forecast, rather than the separate complaint about unanswered GPU questions.
  - The latest day before 2030 is December 31, 2029.
  - The relevant projects are those underlying the large compute deals discussed by the post, not every data center worldwide.
  - Treat at this rate as a condition requiring evidence that the relevant construction pace persisted.
  - Built ordinarily means completion of the relevant facility or contracted phase; an operating portion does not necessarily establish completion of an entire campus.
support_condition: For an identified project set whose referenced construction pace persisted, the relevant facilities or phases remain incomplete through December 31, 2029.
contradiction_condition: An identified in-scope facility or contracted phase is completed before January 1, 2030 while the stated construction-rate condition holds.
measurement_requirements: A fixed project list, the baseline construction pace at publication, subsequent milestone records, and a consistent definition of completion.
source_requirements: Developer completion disclosures, commissioning or occupancy records, and dated construction records establishing the condition.
metric_scope: null
original_horizon: before 2030
horizon_interval:
  start: 2026-03-24
  end: 2029-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: A dated completion before 2030 can contradict the forecast early only if the completed facility belongs to the forecast's identified project set and evidence establishes that the referenced rate persisted. Partial operation alone does not satisfy full-campus completion.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The project set is not enumerated.
  - The baseline rate and its measurement window are unspecified.
  - Built may refer to an individual building, a contracted phase, or a complete campus.
  - The scope could be some announced deals rather than every announced deal.
retrospective_or_prospective: prospective
