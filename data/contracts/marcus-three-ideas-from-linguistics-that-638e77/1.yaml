assessment_axis: causal_assessment
explicit_source_elements:
  - Its words simply don’t refer to an external world
  - or an update-able cognitive model thereof
  - not so remediable
  - tendency towards the fabrication misinformation ensues
evaluator_interpretation:
  - The target is GPT-3 as discussed in June 2022, not all subsequent language models.
  - The ordinary reading is that missing connections to external facts or dynamically updated world representations cause recurrent factual fabrication, and that reliably correcting this problem is difficult.
  - Difficulty of remediation does not mean that no improvement is possible.
  - External reference is operationalized as connections to verifiable facts; an updatable cognitive model means representations that track entities and changes in their states.
  - This is a causal assessment, so no observation reporting period or forecast deadline is imposed.
support_condition: Controlled GPT-3 experiments establish that missing grounding or world-state representations cause recurrent factual fabrication, while substantial errors persist across representative tasks despite serious remediation attempts.
contradiction_condition: Controlled GPT-3 experiments undermine the proposed causal mechanism, or demonstrate reliable, broadly effective remediation without supplying the allegedly missing grounding or world-state mechanism.
measurement_requirements: Compare matched GPT-3 systems and prompts, independently vary grounding or state tracking, and measure externally verified false claims. Separate fabricated facts from copied misconceptions, abstention, and answers unsupported by supplied text. Report remediation effectiveness and effort.
source_requirements: Primary experimental reports with identifiable GPT-3 versions, controls, evaluation methods, and results, available by 2026-10-28.
