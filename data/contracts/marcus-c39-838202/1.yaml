assessment_axis: causal_assessment
explicit_source_elements:
  - the wrong experiment was performed
  - key data weren’t given
  - we can’t compare directly with humans
  - best humans still outperformed the model
evaluator_interpretation:
  - Wrong experiment is read as a missing control relevant to the scientific comparison, not as a violation of benchmark rules.
  - Direct comparison means a meaningful comparison of learning and generalization under sufficiently comparable protocols, not merely placing two percentages beside each other.
  - Best humans ordinarily means strong individual human solvers. Pooling successful answers from different people is a distinct measure.
  - Both the causal explanation and the asserted human advantage must be established to support the whole claim.
  - The target is the December demonstration and the evidence available when Marcus discussed it.
support_condition: Protocols establish that the missing ARC-untrained control prevents the claimed comparison of generalization, and matched results establish that top individual humans exceeded the demonstrated o3 system.
contradiction_condition: A suitable controlled comparison was available despite the alleged missing data, or matched results establish that o3 equaled or exceeded the relevant top human performance.
measurement_requirements: Identify task splits, scoring, attempts, feedback, prior ARC exposure, model configuration, and whether human results describe individuals, averages, or pooled answers.
source_requirements: Model evaluation records and human experimental protocols with comparable outcomes. Expert opinions and launch statements alone cannot establish the causal explanation.
