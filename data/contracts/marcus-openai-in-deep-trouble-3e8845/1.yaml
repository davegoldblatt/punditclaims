evaluator_interpretation:
  - The context limits the claim to OpenAI's applications.
  - A killer app ordinarily means an application with substantial demonstrated demand. A clear business model means an identifiable way of charging customers that has attracted paying users; it does not necessarily mean established profitability.
  - Use February 2025, the latest completed month before publication, to assess the ongoing state.
support_condition: Evidence shows that OpenAI lacked an application combining substantial adoption with an established, commercially used payment model in February 2025.
contradiction_condition: At least one OpenAI application had substantial adoption and an established payment model with paying customers in February 2025.
measurement_requirements: Distinguish active users from registrations and paying users from free users. Product pricing establishes a payment mechanism, not profitability.
source_requirements: Dated product disclosures and adoption reports. Identify company-supplied usage figures as such.
