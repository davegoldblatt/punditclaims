assessment_axis: forecast_outcome
explicit_source_elements:
  - These are not real companies
  - real companies make money and sell things
  - venture capitalists hope can be sold
  - there isn’t a chance in hell they become functional businesses
evaluator_interpretation:
  - These refers to the pre-revenue AI startups raising large rounds described immediately before this sentence, including Character.AI and the linked Reka example.
  - Read the categorical forecast as saying that none of this cohort will become commercially self-sustaining.
  - Functional business means sustained customer receipts sufficient to support ordinary operations without recurring outside financing. This follows the surrounding discussion of independence from further funding; merely launching a paid product is insufficient.
  - No specific profit measure, accounting basis or financial threshold is supplied. This is assessed as a business-viability forecast, not a numerical earnings forecast.
  - The statement about hoped-for exits concerns investor intentions. An eventual sale alone would not prove that this was the original motive.
  - No deadline is supplied, and the cohort is not an exhaustive named list.
support_condition: Conclusive evidence establishes that every member of the identified cohort permanently ceased operating without ever becoming commercially self-sustaining. Failure of one example does not establish the categorical claim.
contradiction_condition: At least one demonstrably qualifying startup develops sustained customer-funded operations that no longer depend on recurring outside financing.
measurement_requirements: Establish that each candidate raised a large round while pre-revenue before the post. Evaluate actual customer receipts alongside operating costs and financing dependence over a sustained period. Distinguish annualized revenue, investment proceeds, asset sales and licensing transactions.
source_requirements: Prefer financial statements, court records and company disclosures with sufficient revenue, expense and cash-flow detail. Funding announcements, product launches and revenue estimates alone cannot establish self-sufficiency.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A dated, reliable record establishing sustained customer-funded operations by any qualifying startup conclusively contradicts the categorical forecast. Bankruptcy, an acquisition, or further financing of one startup does not conclusively support it; support would require an exhaustively identified cohort and terminal evidence for every member.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Functional businesses could mean selling a product or becoming financially self-sustaining; the surrounding passage favors the latter.
  - Make money could mean revenue or profit.
  - The cohort is not exhaustively named.
  - No deadline is stated.
  - Investor hopes are distinct from observable business outcomes.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
