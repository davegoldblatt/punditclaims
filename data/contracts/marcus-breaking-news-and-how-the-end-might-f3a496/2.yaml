early_resolution_rule: Support may be established by a dated failed pricing attempt, actual valuation reduction, or actual postponement or withdrawal demonstrably attributable to investor resistance to the higher IPO valuation. Contradiction requires a completed higher-valued IPO with evidence that valuation was secured without material difficulty. Provisional advice, unrelated delays and private financing alone do not…
