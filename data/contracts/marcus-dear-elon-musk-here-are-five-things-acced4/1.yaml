assessment_axis: forecast_outcome
explicit_source_elements:
  - In 2029
  - work as a competent cook
  - in an arbitrary kitchen
  - extending Steve Wozniak’s cup of coffee benchmark
evaluator_interpretation:
  - The ordinary reading requires an embodied AI system that can prepare ordinary meals competently in unfamiliar, usable kitchens.
  - "'Arbitrary' means varied ordinary kitchens without installation tailored to the robot; it does not mean impossible or unequipped environments."
  - Competence includes locating and using equipment, handling ingredients, managing cooking stages, and producing safe, edible food with reasonable consistency.
  - Human meal requests are allowed, but teleoperation or human completion of cooking steps does not demonstrate the robot's competence.
  - Use 2029-12-31 as the latest deadline and assess this forecast independently of the surrounding wager.
support_condition: Evidence covering the end of 2029 shows that available AI robots still cannot consistently complete ordinary cooking tasks in varied unfamiliar kitchens without substantial human assistance or robot-specific installation.
contradiction_condition: An AI robot repeatedly prepares ordinary meals competently and safely across varied unfamiliar kitchens without teleoperation, task completion by people, or bespoke kitchen installation.
measurement_requirements: Use held-out real kitchens, multiple meals and repeated trials. Disclose preparation, interventions, failures, elapsed time, food quality and safety outcomes.
source_requirements: Primary demonstrations and evaluations with documented autonomy and environment selection; independent observation and reproducibility are required for early resolution.
metric_scope: null
original_horizon: In 2029
horizon_interval:
  start: 2022-05-31
  end: 2029-12-31
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve early as contradicted upon a dated, independently observed and repeatable demonstration of competent end-to-end cooking across varied unfamiliar ordinary kitchens. Fixed-installation cooking and unrelated household skills do not satisfy this rule.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - "'Competent' specifies no menu, speed or success-rate threshold."
  - "'Arbitrary kitchen' leaves the required range of layouts and equipment unspecified."
  - Permissible setup and human assistance are not expressly defined.
  - Treating earlier durable capability as refuting 'In 2029' is an evaluator interpretation.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
