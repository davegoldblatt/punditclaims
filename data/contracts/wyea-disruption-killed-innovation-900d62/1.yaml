  - "examples: Snap, Meta, Salesforce"
evaluator_interpretation:
  - "'Seemingly every major company' is rhetorical exaggeration. Plain reading: in the weeks before the post, a broad wave of major (mainly tech) companies publicly announced plans or products to build generative AI into their offerings."
  - The claim describes the state of affairs when the post was written. Target period is 2023-01-01 to the post date, 2023-03-06.
  - "The trust and safety part is read as: generative AI tools then had publicly known reliability or safety problems (for example misleading or erratic chatbot output) that companies themselves acknowledged."
  - A literal count showing that every single major company did so is not required, and the claim is not contradicted by a few holdouts.
support_condition: Several of the largest tech companies (for example Microsoft, Google, Meta, Snap) publicly announced generative AI products or integration plans in early 2023, and there were documented trust and safety problems with these tools at the time.
contradiction_condition: Few or no major companies announced generative AI integration in early 2023, or the move was limited to one or two isolated firms, or there were no known trust and safety problems with the tools.
measurement_requirements: null
source_requirements: Company announcements or reputable news reports dated between January 2023 and 2023-03-06 describing generative AI product plans by major companies, and any documented safety or reliability problems.
