evaluator_interpretation:
  - The graded proposition is Zitron's full-year estimate. The preceding $833 million December statement is an attributed company forecast, not a separate outcome being graded here.
  - "'End of year' means December 31, 2025, and the revenue period is the complete calendar year."
  - The ordinary reading is approximately $5 billion in realized revenue, rather than a minimum threshold or a year-end annualized run rate.
  - I operationalize the rounded estimate as at least $4.5 billion and below $5.5 billion. This tolerance is evaluator-supplied and affects the result.
  - The claim's basis is estimate. It does not specify whether its treatment of cloud-partner revenue matches subsequent GAAP statements.
support_condition: Comparable full-year 2025 realized revenue would fall within the stated rounding interval, with the forecast's revenue basis reconciled to the outcome evidence.
contradiction_condition: Comparable full-year 2025 realized revenue would fall outside the stated rounding interval. Failure to reach exactly $5 billion would not alone contradict the approximate reading.
measurement_requirements: Calendar-year realized revenue, with gross-versus-net cloud-partner accounting reconciled. Do not substitute December revenue multiplied by twelve.
source_requirements: Prefer audited company statements. Under the required basis-matching rule, a GAAP figure needs reconciliation to the estimate's basis before becoming decisive.
