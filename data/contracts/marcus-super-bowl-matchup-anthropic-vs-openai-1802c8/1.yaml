  start: 2023-05-16
  end: 2026-02-08
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The Senate hearing is not dated in the claim.
  - "'Lip service' can describe insincerity or insufficient follow-through; public positions cannot directly establish private intent."
  - "'AI regulation' does not distinguish federal rules, state rules, content transparency, or frontier-model safety."
  - The retrospective comparison and ongoing policy position have no explicit reporting period; the interval is anchored to the Senate reference and post date.
