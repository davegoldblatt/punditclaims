assessment_axis: historical_observation
explicit_source_elements:
  - OpenAI gave lip service to AI regulation at the US Senate
  - Anthropic actually supports regulation
evaluator_interpretation:
  - I read 'lip service' as a claimed gap between OpenAI's stated support for regulation and its substantive regulatory advocacy. Opposition to one bill does not by itself establish that gap.
  - I read Anthropic's 'actually supports regulation' as support for concrete, binding AI rules, including rules applicable to itself.
  - The Senate reference is interpreted as the May 2023 hearing and its follow-up record. The comparison concerns subsequent conduct through the post date.
  - Regulatory advocacy has no quarterly reporting period. The target period therefore covers the referenced Senate episode through February 8, 2026; later changes in policy do not settle this historical comparison.
support_condition: The record shows that OpenAI's regulatory advocacy substantially failed to follow through on its Senate commitments, while Anthropic advocated concrete, binding AI regulation. Selective disagreement with legislation is insufficient by itself.
contradiction_condition: The record shows substantive OpenAI advocacy implementing the regulatory commitments at issue, or shows that Anthropic's claimed concrete support did not occur. Evidence against one component would not erase evidence supporting the other.
measurement_requirements: Compare specific proposals, their binding obligations, the companies' positions, and the reasons given. Distinguish voluntary standards from mandatory regulation and general AI rules from frontier-model safety rules.
source_requirements: Contemporaneous testimony, legislative submissions, company endorsements, and legislative records. Use independent reporting where the underlying submission cannot be obtained.
