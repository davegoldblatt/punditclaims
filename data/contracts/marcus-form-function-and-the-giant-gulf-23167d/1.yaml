evaluator_interpretation:
  - The plain reading concerns visual quality, rather than intelligence, originality, or prompt accuracy.
  - The surrounding discussion concerns the generation of systems available since DALL-E 2 appeared in 2022, through the post date. April through September 18 is the assessment window.
  - A fair comparison would use comparable image-making tasks and distinguish ordinary participants from highly trained artists. Neither training level nor a quality threshold is specified.
support_condition: Blinded comparisons of contemporaneous model outputs and human work show high model image quality, with superior human performance confined to highly trained artists.
contradiction_condition: Comparable blinded evaluations show that people without extensive artistic training reliably surpass the contemporaneous systems in visual quality.
measurement_requirements: Comparable tasks, documented human training levels, identified model versions, disclosed image selection, and human ratings of visual quality.
source_requirements: Independent comparisons or inspectable experimental results. Model demonstrations alone cannot establish the restriction to highly trained artists.
