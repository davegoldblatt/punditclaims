explicit_source_elements:
  - “these are annualized figures”
  - “OpenAI does not state that”
  - Context identifies OpenAI's December 17, 2025 post and its revenue graphic.
evaluator_interpretation:
  - Assess whether the specified graphic and accompanying post disclose annualization, including an ARR label.
  - The claim concerns disclosure, not whether the revenue amounts themselves are correct; metric_scope is therefore null.
  - A later disclosure elsewhere cannot establish what appeared in the December post.
  - An omitted label would not by itself establish deliberate deception.
support_condition: An authenticated complete version of the December 17 post and graphic shows the figures without an annualized or ARR qualification.
contradiction_condition: The complete December 17 post or its graphic explicitly identifies the figures as annualized or ARR.
measurement_requirements: Inspect all graphic labels, footnotes and accompanying post text. Do not infer that an image lacks a label from a text extraction that omits the image.
source_requirements: The original post and readable graphic, or an authenticated contemporaneous reproduction.
