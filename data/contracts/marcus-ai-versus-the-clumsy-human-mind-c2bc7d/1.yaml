assessment_axis: historical_observation
explicit_source_elements:
  - LLMs are great at some kinds of pattern matching
  - but lousy at floating point arithmetic
evaluator_interpretation:
  - Read as a claim about leading 2023 LLMs (for example GPT-4) used on their own, without a calculator or code tool.
  - "'Floating point arithmetic' is read in the ordinary sense he uses in contrast with calculators: exact multi-digit numeric calculation. Integer multi-digit multiplication counts as a fair test."
  - "'Lousy' means error rates on routine multi-digit arithmetic far worse than a calculator, and worse than a careful human with pencil and paper."
  - "'Great at some kinds of pattern matching' holds if LLMs score highly on some tasks that reward recognising learned patterns."
  - No period is named. I use 2023-01 to the post date of 2023-11-25.
support_condition: 2023 evaluations show leading LLMs doing well on some pattern-heavy tasks, while failing often at routine multi-digit arithmetic without tools.
contradiction_condition: 2023 evaluations show leading LLMs doing multi-digit arithmetic reliably without tools, or doing poorly at pattern-based tasks generally.
measurement_requirements: Tool-free accuracy of 2023 LLMs on multi-digit arithmetic, and their performance on pattern-based benchmarks.
source_requirements: Peer-reviewed papers, preprints, or developer technical reports from 2023.
