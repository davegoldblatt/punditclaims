explicit_source_elements:
  - hallucinations
  - will remain inevitable
  - no matter what investors and CEOs might tell you
evaluator_interpretation:
  - The ordinary reading is that useful, general-purpose LLMs will retain some risk of producing false or unsupported assertions.
  - No deadline is stated.
  - Inevitable does not mean every answer hallucinates or that error rates cannot fall.
  - A system that always abstains or operates only in a narrowly verified domain does not by itself settle the general-purpose claim.
  - Near-zero benchmark error is relevant progress but is not equivalent to demonstrated elimination.
support_condition: A validated impossibility result establishes unavoidable hallucination under assumptions that genuinely cover useful general-purpose LLMs and their permitted mitigations.
contradiction_condition: A useful general-purpose LLM system demonstrates a substantiated, independently checked guarantee against hallucinated assertions across its broad intended scope.
measurement_requirements: Distinguish observed error rates from guarantees. Specify task coverage, abstention, factual verification, and any assumptions behind formal results.
source_requirements: Primary theoretical research and independently checkable system evaluations or guarantees available by the evaluation date.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon a dated, validated impossibility result matching the full interpreted scope, or a dated demonstration of a useful general-purpose system with an independently substantiated guarantee against hallucination. Continued errors, marketing claims, and finite zero-error test samples are insufficient.
interpretation_determines_result: true
