assessment_axis: historical_observation
explicit_source_elements:
  - ChatGPT plugins
  - open a wide range of security problems
  - access the internet
  - read and write files
  - impersonate people (e.g., to phish for credentials)
  - all alarms to any security professional
evaluator_interpretation:
  - The claim concerns capabilities and security risks across the plugin ecosystem, not a requirement that every plugin possess every capability.
  - File access includes files in the code interpreter's workspace and connected services; it does not imply unrestricted access to a user's computer.
  - Impersonation includes malicious use of a person's delegated authority or deceptive communications. Phishing is an example of the risk, not an assertion of a named successful credential theft.
  - The reference to any security professional is rhetorical emphasis rather than a literal survey claim.
  - For this ongoing observation, use the current plugin release period, March 23 through June 8, 2023.
support_condition: Contemporaneous documentation establishes internet and file capabilities, and documentation or demonstrations establish concrete risks of deceptive communications, unauthorized use of delegated authority, or sensitive-data exposure.
contradiction_condition: The named capabilities were unavailable in the relevant period, or the purported attacks concerned unrelated products and the claimed mechanisms were technically excluded by the released architecture.
measurement_requirements: Separate capabilities from vulnerabilities, authorized operations from misuse, and hypothetical attacks from demonstrated ones. Record sandbox boundaries and relevant fixes.
source_requirements: Prefer OpenAI's original plugin documentation and dated security demonstrations. Later research must identify a relevant historical event before it can be decisive.
