evaluator_interpretation:
  - The plain reading is that Meta's generative AI activities consume more cash than they generate, including attributable operating costs and investment.
  - Use January–March 2025, the latest reported quarter before the post, for this ongoing observation. The surrounding full-year projections do not turn it into a forecast.
  - Include attributable advertising and licensing receipts, not just subscriptions to a standalone AI product.
  - The surrounding argument invokes Meta's own financial projections, so company_reported is the indicated basis. No GAAP profitability claim is inferred.
  - Cash consumption does not by itself establish that an investment is wasteful or will never earn a return.
support_condition: Comparable realized figures show negative net cash flow from Meta's generative AI activities during the target quarter after attributable operating and investment outlays.
contradiction_condition: Comparable realized figures show that cash generated by those activities covered their attributable operating and investment outlays during the target quarter.
measurement_requirements: A consistent allocation of shared infrastructure, personnel costs, licensing receipts and incremental advertising receipts to generative AI. Do not compare company-wide capital expenditure with generative AI revenue alone.
source_requirements: Meta disclosures or sufficiently documented financial records separating generative AI cash receipts and outlays.
