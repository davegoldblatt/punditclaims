evaluator_interpretation:
  - "'Implicated' means linked through substantive public allegations, investigations or findings; it does not mean proven to have caused a death."
  - "'A number' requires multiple completed suicides."
  - Use at least four victims killed, excluding the perpetrator, as a conservative operational meaning of mass murder.
  - The present-perfect wording describes the cumulative public record through publication, rather than only the latest quarter.
support_condition: Public records implicate chatbots in at least two completed suicides and at least one intentional killing of four or more victims by October 5, 2026.
contradiction_condition: Reliable records establish that the alleged examples do not meet these conditions, with sufficient coverage to reject either component.
measurement_requirements: Count distinct deaths and distinguish allegations from established causal findings. Exclude the perpetrator from the mass-killing victim count.
source_requirements: Court filings, official investigations or reputable reporting that identifies the incidents and alleged chatbot connection.
