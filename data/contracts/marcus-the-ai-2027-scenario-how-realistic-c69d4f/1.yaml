assessment_axis: forecast_outcome
explicit_source_elements:
  - highly doubt
  - AGI will arrive in three years
  - can’t absolutely promise
  - it won’t happen in 10
evaluator_interpretation:
  - Three years means the interval ending on 2028-05-22.
  - AGI means a system with broadly human-level general learning and intellectual capabilities, rather than success on one benchmark.
  - The forecast is assessed directionally. One outcome cannot establish whether an unstated probability was well calibrated.
  - The ten-year statement acknowledges uncertainty through 2035-05-22; it is neither a prediction of arrival nor an antecedent condition.
support_condition: At the three-year deadline, no system has been independently established to meet the stated broad AGI reading. This would support only the directional forecast.
contradiction_condition: A system is independently established to meet the broad AGI reading on or before 2028-05-22. This would contradict the directional forecast, without proving that a low-probability judgment was irrational.
measurement_requirements: Independent evidence of broad human-level learning, transfer and task performance, with disclosed evaluation conditions. A company declaration or isolated benchmark score is insufficient.
source_requirements: Independent evaluations and primary technical reports available by the evaluation date.
metric_scope: null
original_horizon: in three years
horizon_interval:
  start: 2025-05-22
  end: 2028-05-22
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve the directional forecast early only if a dated, independently verified demonstration establishes broadly human-level general intelligence before the deadline. Announcements and narrow benchmark saturation do not meet this rule.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AGI is undefined.
  - Highly doubt supplies no numerical probability.
  - Three years is read as an anniversary deadline.
  - The ten-year clause is an uncertainty statement, not a second positive forecast.
retrospective_or_prospective: prospective
