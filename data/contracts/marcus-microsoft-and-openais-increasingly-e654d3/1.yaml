evaluator_interpretation:
  - Satya and Sam refer to Nadella and Altman; they refers to Altman's OpenAI.
  - Direct competition means selling overlapping products to the same customers. It does not require identical products or independent underlying models.
  - Rescue means the public offer of employment at Microsoft following Altman's dismissal.
  - The ongoing commercial state is assessed using April 2024, the latest reported customer-pitching period before publication. The November employment offer is a separate historical background event.
  - The passage does not make a checkable claim about Altman's private feelings or contractual disloyalty.
support_condition: Evidence shows OpenAI selling or pitching overlapping AI services to Microsoft's customers before publication, and establishes Microsoft's employment offer following Altman's dismissal.
contradiction_condition: Reliable evidence establishes that the described competing offers did not exist in the target period, or that the stated employment offer did not occur.
measurement_requirements: Identify overlapping products, customers, and dates. Distinguish commercial competition from merely developing similar technology.
source_requirements: Product announcements and contemporaneous reporting of customer pitches; a company statement or reliable reporting of the employment offer.
