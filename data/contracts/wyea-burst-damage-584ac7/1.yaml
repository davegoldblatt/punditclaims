assessment_axis: historical_observation
explicit_source_elements:
  - an acquisition by stealth
  - Google paying investors $2.5bn
  - Investors will still own that equity
  - without exclusive access to their models
  - without an engineering team
  - the company is effectively dead
evaluator_interpretation:
  - The target is the immediate position following the August 2 deal, through the August 5 post.
  - Stealth acquisition means transfer of the business's essential operating capacity without a conventional corporate acquisition; absence of a legal merger alone would not refute it.
  - The ordinary reading of effectively dead is that Character.AI could no longer sustain an independent operating and developing business. Merely changing strategy or losing its founders is insufficient.
  - The $2.5 billion statement concerns money paid to investors, not company valuation, total licensing consideration or accounting goodwill.
  - The funding amount is treated as a press estimate in the surrounding deal-reporting context.
support_condition: Deal terms and staffing records show that Google obtained the essential business while Character.AI lacked a viable independent engineering and operating capability, and substantiate the stated investor payment and retained equity.
contradiction_condition: Contemporaneous records establish retained engineering and viable independent operations, or transaction records materially contradict the investor-payment or retained-equity assertions.
measurement_requirements: Distinguish founders and pre-training researchers from the entire engineering workforce; distinguish licensing rights from company ownership; distinguish investor proceeds from valuation and total transaction consideration.
source_requirements: Executed transaction terms, staffing and operating records, or reliable reporting identifying those facts. Later operations are context unless the evidence explicitly establishes the immediate post-deal position.
