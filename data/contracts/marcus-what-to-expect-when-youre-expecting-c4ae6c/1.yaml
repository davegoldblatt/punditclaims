  - explicit tools for reasoning and planning
  - lacking in systems like GPT
evaluator_interpretation:
  - This is an event-conditioned forecast about the architecture of trustworthy, aligned AGI. It supplies no deadline for its arrival.
  - The ordinary reading requires a system with broad general capability, dependable behavior and alignment with human values. Strong performance on selected tasks or tool use alone does not establish that condition.
  - I interpret the architectural comparison as being with GPT-style systems discussed in December 2022.
  - Independent acceptance and testing are evidentiary requirements added by the evaluator, not thresholds specified by Marcus.
support_condition: A demonstrated trustworthy, aligned AGI has sufficiently disclosed architecture showing greater structure, built-in knowledge, and explicit reasoning and planning tools.
contradiction_condition: A demonstrated trustworthy, aligned AGI has sufficiently disclosed architecture showing that it lacks at least one of the architectural features Marcus says will be required.
measurement_requirements: Assess general capability, reliability and alignment separately from architectural features. Do not equate benchmark success, reasoning text or access to tools with trustworthy aligned AGI.
source_requirements: Public technical architecture disclosures and credible independent evaluations establishing that the system meets the antecedent.
