assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI will need to raise funding
  - at least three more times
  - in the next decade
  - audited financials from 2024 and 2025
evaluator_interpretation:
  - The decade runs from publication through July 15, 2036.
  - Count distinct new financings after publication. Payments under an already agreed round and secondary sales that do not fund OpenAI are not additional rounds.
  - Need means financing required to meet operating or contractual obligations. Raising money alone does not establish necessity.
  - The cited financial basis is company-reported accounts. The word audited does not establish a particular accounting standard.
support_condition: At least three distinct additional financings occur within the horizon, with financial records establishing that they were necessary.
contradiction_condition: Complete records through the deadline establish fewer than three necessary additional financings.
measurement_requirements: Identify each financing agreement, closing, recipient and relationship to earlier rounds; examine liquidity and obligations to establish necessity.
source_requirements: Company or investor disclosures and financial records. News reports can identify transactions but cannot substitute for evidence of necessity.
metric_scope:
  company: OpenAI
  metric: Number of necessary additional financings
  currency: null
  units: financing rounds
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2026-07-15
  period_end: 2036-07-15
  stock_or_flow: flow
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: in the next decade
horizon_interval:
  start: 2026-07-15
  end: 2036-07-15
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: Support can be established early by three completed, distinct additional financings whose necessity is documented. Negotiations, commitments under existing rounds and secondary share sales do not meet this rule.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Funding could include equity or debt.
  - Separate rounds versus installments is unspecified.
  - Need is stronger than choosing to raise.
retrospective_or_prospective: prospective
