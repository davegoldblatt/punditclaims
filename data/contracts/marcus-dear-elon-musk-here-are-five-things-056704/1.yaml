evaluator_interpretation:
  - An adequate methodology means a repeatable engineering approach for building and modifying integrated cognitive systems with dependable behavior and manageable regressions.
  - Adequacy does not require eliminating every bug. Conversely, a successful isolated model does not establish a generally adequate integration methodology.
  - The context concerns perception, reasoning, planning and action working together, including autonomous vehicles.
  - The current observation window is calendar 2022 through May 31 because the research field has no regular reporting cycle; earlier methods are context.
support_condition: Broad contemporary evidence shows that available engineering approaches cannot reliably manage integration and modification of complex cognitive systems across relevant applications.
contradiction_condition: A publicly documented, repeatable methodology had demonstrated dependable construction and modification of such systems across relevant applications by May 2022.
measurement_requirements: Evidence of system integration, changes over time, regression control, deployment reliability and reproducibility. Neither isolated failures nor isolated successes establish the field-wide proposition.
source_requirements: Empirical engineering studies, documented methods and evaluated deployments. Promotional assertions require corroboration.
