explicit_source_elements:
  - isn’t because it doesn’t want to, but because it can’t
  - an inevitable side-effect of LLMs as a whole
evaluator_interpretation:
  - The plain reading is that hallucinations are an unavoidable property of useful general-purpose LLM operation, making a fix technically impossible.
  - A theorem about answering every possible question must be distinguished from a theorem requiring false assertions when uncertainty and abstention are allowed.
  - A finite error-free benchmark or a system that always refuses to answer is insufficient to establish a general solution.
  - The asserted architectural explanation is assessed causally, without adding a forecast deadline.
support_condition: A theoretical result establishes unavoidable false factual assertions under assumptions covering useful general-purpose LLM operation and the ordinary meaning of hallucination.
contradiction_condition: A reproducible general solution, or a theoretical result covering the same practical scope, establishes that useful LLM operation need not produce false factual assertions.
measurement_requirements: Specify the definition of hallucination, permitted abstention, task coverage, training assumptions and any guarantees. Separate benchmark error reduction from a general result.
source_requirements: Primary theoretical papers and reproducible evaluations, with assumptions and limitations inspected.
