evaluator_interpretation:
  - Assess the tracking information available by November 17, not the eventual full-quarter result.
  - The ordinary reading is slowing customer spending growth, used as an indicator of demand.
  - The historical comparisons refer to Q3 and Q2 2026. They must be distinguished from Ramp's sample-based spending estimates.
  - The target period covers Q2, Q3 and the elapsed portion of Q4.
support_condition: Comparable spending measurements establish the stated sequence, or documented reconciliation shows why historical revenue growth and Ramp's current spending estimate provide a valid comparison.
contradiction_condition: Comparable measurements materially disagree with the stated rates or show that the asserted spending-growth slowdown did not occur.
measurement_requirements: Identify the sample, quarterly comparison windows, treatment of prices and extrapolation method. Separate spending, revenue and token volume.
