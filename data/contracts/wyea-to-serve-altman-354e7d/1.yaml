assessment_axis: historical_observation
explicit_source_elements:
  - generative AI
  - is not automation
evaluator_interpretation:
  - The ordinary categorical reading is that generative AI does not automate substantive tasks previously performed by people.
  - Automation can concern a bounded task. Human setup, supervision, or review does not automatically negate task automation.
  - The claim describes an ongoing technological state. I use April through June 2024, the latest completed calendar quarter before the post, rather than later capabilities.
  - The surrounding discussion could instead imply reliable replacement of entire jobs or economic functions; that narrower proposition is not equivalent to the categorical sentence.
support_condition: Evidence establishes that the relevant generative AI deployments merely assist people who still execute the substantive tasks, without demonstrated task automation.
contradiction_condition: A documented production deployment during the target period uses generative AI to execute a substantive task otherwise performed by people, without equivalent manual execution of that task.
measurement_requirements: Evidence must identify the generative system, the task it performs, and a deployed use. Adoption statistics or future product promises alone are insufficient.
source_requirements: Deployment documentation from a customer or provider, preferably corroborated by operational records or independent measurement.
metric_scope: null
original_horizon: null
horizon_interval: null
