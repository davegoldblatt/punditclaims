  end: 2024-06-30
  precision: quarter
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Automation could mean task execution or complete replacement of a job.
  - No reporting period is stated; the latest completed pre-post quarter is the evaluator's observation window.
  - The surrounding argument concerns economy-scale replacement, which is stronger than task automation.
