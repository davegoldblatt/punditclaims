explicit_source_elements:
  - has raised no more than $12 billion
  - funding from sources outside of NVIDIA, SoftBank, Microsoft or Amazon
evaluator_interpretation:
  - The standalone sentence and normalized proposition describe cumulative funding through the post date. The start is left unspecified to encompass the company's funding history.
  - "The surrounding discussion also permits a materially different reading: funding in an individual round, particularly the March 2026 round."
  - Count primary financing raised by OpenAI. Exclude purchases of existing shareholders' shares and undrawn credit facilities. Distinguish announced commitments from money received.
  - The quoted assertion does not identify the provenance or accounting basis of its cumulative figure. Its accounting_basis is therefore unknown.
support_condition: A reconciled funding history establishes that cumulative primary financing from investors other than the four named companies was at most USD 12 billion through August 18, 2026, on an identified and consistent basis.
contradiction_condition: A reconciled funding history, or a documented lower bound from nonoverlapping transactions, establishes more than USD 12 billion from those other investors through August 18, 2026, on the same identified basis.
measurement_requirements: Identify investor allocations, transaction dates, primary versus secondary transactions, and commitments versus disbursements. Avoid counting successive announcements of the same round twice.
source_requirements: Prefer company or investor disclosures. Reported estimates must be identified as estimates and cannot silently replace company-reported amounts.
