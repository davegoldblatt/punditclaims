assessment_axis: forecast_outcome
explicit_source_elements:
  - a moment that spooks a venture capital firm
  - pushing one of its startups to sell
  - or
  - the sudden, unexpected yet very obvious collapse of a major player
evaluator_interpretation:
  - Either alternative can fulfill the forecast.
  - The sale alternative requires evidence of a shock, an affected venture investor, and that investor pressing an AI startup to sell.
  - The failure alternative concerns a prominent AI company experiencing an abrupt business failure whose timing was unexpected despite warning signs.
  - Bankruptcy is evidence of financial failure, but it does not alone establish every timing qualifier or permanent closure.
  - Unlike the preceding broader forecast, this sentence does not independently require a completed sector-wide crash.
support_condition: A dated event establishes either shock-induced venture-investor pressure to sell an AI startup, or an abrupt and unexpected failure of a prominent AI company.
contradiction_condition: With no deadline, the absence of a qualifying event cannot establish contradiction. Disproving a candidate event excludes that candidate only.
measurement_requirements: For a sale, establish investor action and its cause. For failure, establish company prominence, actual financial or operational failure, and evidence about its abruptness and unexpected timing.
source_requirements: Company or court records for failure, supplemented by contemporaneous reporting; investor records or well-sourced reporting for sale pressure and motivation.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented event satisfying either complete alternative resolves the forecast immediately; no market-wide collapse is additionally required.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Major player has no threshold.
  - Sudden and unexpected have no specified timescale or reference audience.
  - Collapse may mean financial failure or permanent operational closure.
  - No deadline is stated.
retrospective_or_prospective: retrospective
