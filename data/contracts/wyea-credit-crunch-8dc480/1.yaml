assessment_axis: causal_assessment
explicit_source_elements:
  - As a result of their $1.3 trillion in compute commitments
  - neither company
  - capital efficient
  - by cutting their training costs
  - the only means of further growth
  - outside of massive price increases
evaluator_interpretation:
  - Assess the contractual and economic situation at publication on October 6, 2026.
  - Read capital efficient as materially reducing outside capital required to operate and grow.
  - The causal assertion requires showing that reducing training expenditure cannot materially reduce funding needs because unavoidable compute payments remain.
  - Distinguish enforceable minimum commitments from spending forecasts, optional capacity, contingent payments and overlapping announcements.
  - The assertion that training is the only growth route also requires evidence about alternatives such as greater utilization, distribution, product improvements and inference efficiency.
support_condition: Reconciled contracts establish the claimed aggregate on a consistent basis, and payment schedules plus operating evidence show that training cuts cannot materially reduce either company's funding needs while sustaining growth.
contradiction_condition: Contract terms and operating evidence show that either company can materially lower funding needs through genuine training-cost reductions while maintaining growth, or establish that the asserted binding commitment total materially misstates the relevant obligations.
measurement_requirements: Contract-by-contract minimum payments, dates, cancellation and substitution rights, training-versus-inference allocation, avoidable costs and revenue effects. Avoid adding projections to binding commitments or counting the same capacity twice.
source_requirements: Executed contracts and financial disclosures, supplemented by credible reporting where private contract terms are unavailable. A causal conclusion needs more than aggregate spending announcements.
