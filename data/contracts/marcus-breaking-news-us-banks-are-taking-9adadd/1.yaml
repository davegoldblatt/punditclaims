assessment_axis: historical_observation
explicit_source_elements:
  - hackers are stepping up their malicious use of agents
  - they don't need state-of-the-art "frontier" models to cause mayhem
evaluator_interpretation:
  - "'Stepping up' means threat reports from recent months show attackers giving AI agents a bigger or growing role in real attacks."
  - "'Don't need frontier models' means damaging attacks were carried out with models below the top state of the art (for example open-weight models, smaller models, or models below Anthropic's Mythos), not that no capable commercial model was used at all."
  - The period is the few months before the October 22, 2026 post.
support_condition: Threat intelligence or credible reporting from mid-2026 shows attackers increasing their use of AI agents, and shows damaging attacks that relied on non-frontier, open-weight or smaller models.
contradiction_condition: Credible reporting shows no growth in malicious agent use, or shows that effective agent-driven attacks depended on the most advanced frontier models only.
measurement_requirements: Qualitative trend in threat reports; identification of the models used in reported attacks.
source_requirements: Threat intelligence reports from security firms or AI developers, or reputable news reports of their findings.
