assessment_axis: causal_assessment
explicit_source_elements:
  - social networks are so algorithmically charged
  - barely show us the things we want
  - executives dedicated to filling our feeds with AI-generated slop
  - we are also the revenue mechanism
evaluator_interpretation:
  - The ordinary factual reading is that recommendation systems substantially displace content users actually prefer and that executives promote generated content to monetize attention.
  - Treat 'slop' as the speaker's quality judgment, not a measurable category established merely by AI authorship.
  - Assess the state and executive strategy at the post date. Earlier experiments provide context, not direct measurements of November 2024 feeds.
  - "'Despite being the customer' is a characterization of the user-platform relationship, not a conditional forecast antecedent."
  - Time spent and engagement are not interchangeable with users' stated satisfaction or preferences.
support_condition: Representative feed audits and preference studies show users rarely receive content they want because of algorithmic ranking, while executive records establish deliberate expansion of generated content for monetization.
contradiction_condition: Representative evidence shows ranking generally supplies preferred content rather than substantially displacing it, or reliable strategy records refute the proposed generated-content monetization mechanism.
measurement_requirements: Measure exposure against users' stated preferences across platforms and compare algorithmic ranking with a suitable alternative. Separately measure generated-content prevalence and document executive motives.
source_requirements: Independent audits and experiments, supplemented by executive statements and platform disclosures. Company engagement claims alone cannot establish user welfare.
