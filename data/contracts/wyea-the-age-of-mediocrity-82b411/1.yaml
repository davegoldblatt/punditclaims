assessment_axis: forecast_outcome
explicit_source_elements:
  - we are entering an era
  - companies will begin testing
  - automate away the human element of their business
  - how much of the customer experience they can trim off
  - until they start losing money
evaluator_interpretation:
  - The forecast concerns corporate behavior after 2023-08-03, with no stated deadline.
  - The ordinary reading is that multiple companies will experiment with reducing human involvement and customer service, using financial consequences to determine how far those reductions can go.
  - The financial-limit clause is material. Adoption of AI or reduced staffing alone does not establish the whole claim.
  - Losing money can mean an adverse financial effect from the service reduction; it need not mean the entire company reports a net loss.
  - A trial explicitly testing the financial boundary could qualify without deliberately continuing until a realized loss occurs.
  - This is a forecast about corporate experimentation, not a specified company's financial metric, so metric_scope is null.
support_condition: Documented post-publication experiments at multiple companies connect reduced human involvement and customer service to testing or discovering a financial stopping point.
contradiction_condition: Evidence that examined trials retain human support and improve service would challenge those examples, but cannot conclusively contradict an industry forecast with no deadline. Mere absence of observed losses is insufficient.
measurement_requirements: Records of actual automation trials, changes to human service, customer effects, and financial results or explicit financial decision rules connecting service reductions to the limit of automation.
source_requirements: Prefer company disclosures, filings and trial results. Executive interviews may establish strategy, but general financial losses cannot establish losses caused by automation.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as supported when dated records from multiple companies establish both service-reduction experiments and a financial boundary used to evaluate or reverse those reductions.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Era specifies neither breadth nor duration.
  - Customer experience reductions have no stated measure.
  - Until they start losing money could describe a stopping rule or an eventual realized loss.
  - The claim does not specify whether losing money means incremental harm or company-wide losses.
retrospective_or_prospective: retrospective
