assessment_axis: historical_observation
explicit_source_elements:
  - Hyperscalers
  - getting increasingly worse
  - turning their capex into operational capacity
evaluator_interpretation:
  - Use Microsoft, Alphabet, Amazon and Meta from the surrounding discussion.
  - "The ordinary reading is a deteriorating conversion process: comparable spending takes longer to become operational, or less becomes operational at a comparable age."
  - The endpoint is the quarter ended June 30, 2026, the latest completed reporting quarter publicly reportable before the post.
  - The historical baseline is unspecified and remains open rather than being selected to fit the evidence.
  - A falling D&A-to-capex ratio is a proposed proxy, not the outcome itself.
support_condition: Comparable historical spending cohorts show a broad deterioration in commissioning time or the share operational at a fixed age, after accounting for asset mix and cost changes.
contradiction_condition: Comparable records show stable or improving conversion across the group. An improvement at one company is material counterevidence but does not settle a group-level trend.
measurement_requirements: Compare like assets and equally aged spending cohorts. Distinguish purchase-to-service time from dock-to-live installation time, and separate physical capacity from accounting expense.
source_requirements: Company commissioning records, consistent operational measurements and financial statements covering multiple comparable periods.
