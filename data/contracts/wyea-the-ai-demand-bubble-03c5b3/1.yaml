assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI projects to spend $750 billion in compute
  - in the next three-and-a-half years
  - grow its revenue to hundreds of billions a year very soon
  - raise half a trillion dollars or more over the next few years
  - even hyperscalers are having trouble raising that much money
evaluator_interpretation:
  - The antecedent is the existence of the stated spending projection, rather than expenditure already incurred.
  - I provisionally use three-and-a-half years from publication as the funding horizon, ending February 4, 2030. The phrases 'very soon' and 'next few years' do not supply separate precise deadlines.
  - I read 'hundreds of billions a year' as at least $200 billion in realized annual revenue and 'raise' as at least $500 billion in cumulative new financing proceeds, excluding valuation and secondary share sales.
  - Reaching a threshold would not, by itself, establish that it was necessary. The necessity claim requires a reconstruction of spending, revenue receipts, existing cash and financing.
  - The projection is treated as a reported estimate. The single metric_scope records the compute-spending antecedent; the revenue and financing alternatives require separate, explicitly reconciled measurements.
support_condition: Verify the stated $750 billion projection over the stated period, then establish that carrying it out required either at least $200 billion in annual revenue or at least $500 billion in new financing within the interpreted horizon. Contemporaneous evidence must separately establish the claimed hyperscaler financing difficulty.
contradiction_condition: With the antecedent verified, complete financial records show OpenAI carrying out the projected expenditure within the horizon without either funding threshold, after accounting for existing cash, other obligations and alternative funding sources.
measurement_requirements: Separate projected compute expenditure from contractual commitments and realized payments. Measure realized annual revenue separately from annualized run rate. Count financing proceeds once and distinguish company proceeds from valuation, guarantees and secondary transactions. Reconcile gross versus net revenue and accounting definitions.
source_requirements: A dated company projection or reliable reporting identifying its exact expenditure period; subsequently, financial statements and financing records. News reporting is acceptable for otherwise unavailable private-company projections, with its limitations stated.
