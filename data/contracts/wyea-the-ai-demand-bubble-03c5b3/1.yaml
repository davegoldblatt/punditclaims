target_period: null
condition_status: unknown
early_resolution_rule: Resolve early only if complete records establish that the projected spending has already been carried out and demonstrate whether either funding threshold was necessary. A funding announcement, revenue run rate or spending commitment alone is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The funding deadlines are imprecise.
  - The reported projection runs through 2030, whereas three-and-a-half years from publication ends February 4, 2030.
  - The source does not define revenue accounting or which financing instruments count.
  - The statement combines a funding forecast, a necessity claim and a contemporaneous assertion about hyperscalers.
