  content_hash: 4d745c57fb201ad6daee203b18a3f623403b6e065dfd0b56facbe72ba042c726
assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI projects to spend $750 billion in compute
  - in the next three-and-a-half years
  - will need to grow its revenue to hundreds of billions a year very soon
  - or raise half a trillion dollars or more over the next few years
  - at a time when even hyperscalers are having trouble raising that much money
evaluator_interpretation:
  - "Antecedent: OpenAI has a projection of about $750B in compute spending. The reports say 'through 2030', while he says 3.5 years. I treat the antecedent as met if the projection is publicly reported, and note the window mismatch."
  - "The two funding arms keep his separate timing words. The revenue arm is 'very soon': annual revenue of at least $200B (the plain reading of 'hundreds of billions'). He gave no date, and no date is imposed here beyond 'well within' the 3.5-year spending window. The financing arm is 'over the next few years': cumulative new equity plus debt of $500B or more raised by OpenAI, read as no later than t…"
  - The claim is about necessity ('will need to'). It is supported if OpenAI keeps spending on the projected path and funds it through one of the two arms. It is contradicted if OpenAI spends on that path while revenue stays well below $200B a year and cumulative raises stay below $500B.
  - The clause about hyperscalers having trouble raising money is context and not scored.
support_condition: OpenAI keeps the ~$750B compute plan, and either reaches $200B+ in annual revenue soon or raises $500B+ in cumulative equity and debt by early 2030.
contradiction_condition: OpenAI carries out spending on the ~$750B path through the window while its annual revenue stays well under $200B and cumulative new financing stays under $500B.
measurement_requirements: OpenAI's actual compute spending against the projection; annual revenue; cumulative equity and debt raised after 2026-08-04.
source_requirements: OpenAI filings (e.g., an S-1 or 10-K after an IPO), company announcements, or reputable financial press.
metric_scope:
  company: OpenAI
  metric: projected cumulative compute spending; revenue; capital raised
  currency: USD
  units: billions
  accounting_basis: estimate
  fiscal_or_calendar: calendar
  period_start: 2026-08-04
  period_end: 2030-02-04
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: gross
original_horizon: over the next few years
horizon_interval:
  start: 2026-08-04
  end: 2030-02-04
  precision: day
target_period: null
condition_status: met
early_resolution_rule: Supported early if, before the deadline, OpenAI reports annual revenue of $200B+ or closes cumulative new financing of $500B+ after the post. Not adjudicable early if OpenAI publicly cuts the compute plan far below $750B, because the antecedent would no longer hold.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - "'Very soon' has no date."
  - "'Next few years' is vague; bounded here by the 3.5-year window."
  - The reported projection runs 'through 2030', longer than his 3.5 years.
  - Unclear whether partner-financed or guaranteed capacity (e.g., vendor lease guarantees) counts as OpenAI 'raising' money.
  - A 'need' claim can be dodged if spending is cut or deferred.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
