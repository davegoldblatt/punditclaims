explicit_source_elements:
  - current AI
  - still really weak on compositionality
  - at the very core of how language works
evaluator_interpretation:
  - The plain reading is that prominent contemporary neural language and vision-language systems had substantial weaknesses in combining familiar elements according to sentence structure.
  - It does not assert that every AI architecture fails every compositional task.
  - Because these systems have no common quarterly reporting period, use the 2022 year-to-post evaluation period. The context explicitly discusses contemporary 2022 models and evaluations.
  - Treat compositionality's central role as an established linguistic principle, rather than infer a numerical majority of linguists without a survey.
support_condition: Contemporary evaluations show substantial structural or compositional generalization failures across prominent model families, while linguistic research recognizes compositionality as a basic property of language.
contradiction_condition: Representative contemporary systems reliably handle unfamiliar compositional structures across relevant tasks, making the characterization of a substantial general weakness untenable.
measurement_requirements: Use tests that require novel combinations or sensitivity to structure. Separate structural generalization from lexical substitutions and ordinary in-distribution accuracy.
source_requirements: Contemporary research papers with described tasks and evaluated models. Include successful specialized systems and easier task categories as qualifications.
