assessment_axis: forecast_outcome
explicit_source_elements:
  - I am hypothesizing
  - for OpenAI to survive for longer than two years
  - Raise more money than any startup has ever raised in history
  - continue to do so at a pace totally unseen in the history of financing
evaluator_interpretation:
  - Treat continued operation beyond July 29, 2026 as the antecedent.
  - Use the two-year anniversary as the checkpoint for the funding said to be necessary for that survival; the wording does not explicitly state a fundraising completion date.
  - The ordinary reading requires both unprecedented cumulative startup funding and repeated fundraising at an unprecedented rate. A single record round does not establish both.
  - Distinguish money received from announced commitments, valuation and secondary share sales.
  - The forecast names no accounting basis. Do not infer company_reported or estimate merely from the sources later found.
  - The outcome test concerns whether the predicted funding accompanied survival. Co-occurrence alone cannot prove that it was causally necessary.
support_condition: After the survival antecedent is established, comparable funding records show that OpenAI had exceeded historical cumulative startup fundraising and repeated-fundraising pace benchmarks by the two-year checkpoint.
contradiction_condition: OpenAI survives beyond the checkpoint and sufficiently complete, comparable records establish that at least one required funding benchmark was not reached.
measurement_requirements: A dated funding ledger separating received primary capital from commitments and secondary transactions, plus consistent historical comparisons of cumulative amounts and amounts raised per unit of time.
source_requirements: Company and investor disclosures for funding execution; reliable historical financing datasets for comparisons.
