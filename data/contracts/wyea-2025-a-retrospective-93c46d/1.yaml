explicit_source_elements:
  - its future relies on endless debt
  - millions of GPUs are sitting waiting to be installed
  - it no longer makes sense to buy more GPUs
evaluator_interpretation:
  - The checkable physical assertion concerns at least two million NVIDIA AI GPUs awaiting initial installation or activation.
  - Use July 28–October 26, 2025, NVIDIA's latest reported fiscal quarter before the post, for the ongoing inventory observation.
  - Shipments, orders, dollar-valued inventories and announced capacity do not establish installed or uninstalled GPU counts.
  - Read debt dependence as potentially including customers' financing, rather than assuming it refers only to NVIDIA's own borrowing.
  - The purchasing assertion concerns economic returns, but supplies no buyer, workload, cost measure or required return. It cannot independently receive a firm numerical verdict.
support_condition: Reliable records establish at least two million relevant GPUs awaiting installation in the target period, together with evidence that continued demand depends on recurring debt and that additional purchases lack economically viable uses.
contradiction_condition: A sufficiently comprehensive inventory reconciliation places the uninstalled population below two million, or matched financing and purchasing records disprove the corresponding necessity claim. Isolated deployments or profitable GPU sales are insufficient.
measurement_requirements: Reconcile physical GPU packages, rather than dies or performance equivalents, across delivered, installed and powered-on inventories. Assess buyer returns separately from NVIDIA's sales.
source_requirements: Customer installation records, an independently measured inventory census, and financing or investment-return records with clearly defined scope.
