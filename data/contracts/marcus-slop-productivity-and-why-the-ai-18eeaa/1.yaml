explicit_source_elements:
  - The providers (Open AI, Anthropic, Cursor, etc)
  - lose tons of money
  - scrambling to raise prices
  - Customers are balking at the new usage models
evaluator_interpretation:
  - "This combines three observations: large company losses, attempts to increase effective prices, and observable customer resistance."
  - Usage restrictions can increase effective prices even when the advertised monthly fee remains unchanged.
  - "'Scrambling' is read as urgency in changing commercial terms, not a separately measurable mental state."
  - Use Q1 2026 for financial results and current-year developments through June 7 for pricing and customer reactions.
  - The ordinary financial measure is company-wide net income or loss, but the passage does not identify its accounting basis.
  - The parenthetical names examples; it does not clearly assert that every provider made every change.
support_condition: Comparable financial records establish large losses, while dated pricing changes and customer reactions establish the commercial pattern among the named providers.
contradiction_condition: Comparable records establish profitability or negligible losses, or dated commercial records directly refute the asserted pricing and customer-response pattern.
measurement_requirements: Separate net losses from cash burn and gross margins. Establish effective pricing changes against earlier terms and distinguish customer complaints from measured churn.
source_requirements: Prefer financial disclosures, archived company pricing announcements and attributable customer responses. Use reputable reporting when underlying private records are unavailable.
