assessment_axis: forecast_outcome
explicit_source_elements:
  - If the AI bubble pops
  - the entire tech industry will suffer
  - venture capitalists are once again washed out
evaluator_interpretation:
  - A bubble popping means a broad, sustained collapse in AI investment or valuations, rather than an isolated company failure or brief market selloff.
  - Industry-wide suffering means substantial harm across the technology sector; venture capitalists being washed out means severe investment losses and impaired fundraising.
  - The claim concerns sector-wide effects, not a specified company's financial metric.
  - The collapse must cause the predicted harm.
support_condition: An established AI investment collapse followed by broad technology-sector harm and severe venture-capital losses attributable to that collapse.
contradiction_condition: An established collapse followed by a sufficiently documented aftermath in which the technology sector and venture investors broadly avoid the predicted harm.
measurement_requirements: Dated investment and valuation series, technology-sector performance, venture returns and fundraising, and evidence connecting the changes to the collapse.
source_requirements: Prefer investment datasets, filings and official statistics. Reports of concern about a bubble do not establish that it burst.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a documented broad collapse and sufficiently clear subsequent industry and venture-capital outcomes. An isolated failure cannot trigger resolution.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No definition or numerical threshold for the bubble popping.
  - No specified magnitude for suffering or being washed out.
  - No deadline or duration for the aftermath.
  - The geographical scope of the tech industry is unspecified.
retrospective_or_prospective: retrospective
