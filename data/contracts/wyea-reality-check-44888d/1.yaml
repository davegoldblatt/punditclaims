assessment_axis: forecast_outcome
explicit_source_elements:
  - generative AI
  - isn't going to do much more
  - than it does today
evaluator_interpretation:
  - Today means April 28, 2025.
  - The plain reading is a ceiling on substantial additional capability, rather than a prediction about profitability.
  - A large, independently verified improvement in solving demanding tasks can refute that ceiling without demonstrating general intelligence.
  - No deadline or numerical definition of much more is supplied. Benchmark choice and the significance of a gain are evaluator judgments.
  - Models with reasoning and task-specific scaffolding count as generative-AI systems; the claim does not restrict future systems to an unchanged architecture or compute budget.
support_condition: A decisive and applicable limit establishes that generative-AI systems cannot substantially exceed April 2025 capabilities. A temporary absence of progress is insufficient for this deadline-free claim.
contradiction_condition: Independent evaluation demonstrates a substantial new capability or a large improvement in reliable completion of demanding tasks compared with April 2025 systems.
measurement_requirements: Use identified April 2025 baselines and later systems on comparable tasks. Examine task coverage, reproducibility, compute costs, benchmark exposure and the scope of generalization.
source_requirements: Independent benchmark evaluations or reproducible demonstrations, preferably with published methods and verification.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted when a dated independent evaluation verifies a substantial capability gain over the April 2025 baseline on comparable demanding tasks. The gain must represent improved task completion, not merely a promotional claim or an unrepresentative partial test.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No numerical threshold for much more.
  - No specified capability domain.
  - The surrounding discussion concerns revenue, while this sentence is naturally read as a capability forecast.
  - Treating a substantial abstract-reasoning gain as sufficient is an evaluator interpretation.
retrospective_or_prospective: retrospective
