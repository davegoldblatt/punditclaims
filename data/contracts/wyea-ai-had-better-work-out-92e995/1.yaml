explicit_source_elements:
  - how many GPUs are in operation
  - how much money the hyperscalers make from using them or renting them
  - how many active gigawatts of AI capacity they have
  - their actual customer concentration outside of analyst estimates
  - how much people pay to rent GPUs
  - how much it costs to run a GPU on an hourly basis
evaluator_interpretation:
  - I read 'we don’t know' as a claim about reliable public knowledge, not the speaker's personal knowledge.
  - The six categories must be assessed separately. A disclosure for one facility or provider does not establish complete hyperscaler-wide knowledge.
  - I distinguish deployed GPUs from orders, active capacity from planned capacity, AI-specific revenue from total cloud revenue, actual rental payments from posted offers, and operating costs from depreciation alone.
  - The observation concerns the current disclosure environment. I use October 1 through the October 20 post as the current month-to-date period; older disclosures are context unless their continuing applicability is established.
  - This tests the availability of information, not a specified monetary amount or accounting result, so metric_scope is null.
support_condition: A systematic review of disclosures in force during the target period establishes that reliable public measurements are unavailable for all six listed categories at the claimed scope.
contradiction_condition: Public records establish the listed quantities at the claimed scope. Evidence that some categories are disclosed while others remain unavailable would support a mixed assessment, with the categories identified.
measurement_requirements: Inventory each category by provider, reporting date, definition, and coverage. Separate actual operating quantities and transaction prices from plans, estimates, list prices, and broader cloud aggregates.
source_requirements: Company filings, dated operating disclosures, transaction records, and documented independent measurements. A failed search alone cannot establish that information is not public.
