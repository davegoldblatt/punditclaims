  - The wording could refer to each company separately or their pooled revenue.
  - Subsidized has no stated cost-allocation definition.
  - Enterprise subscriptions and metered enterprise consumption must be distinguished.
  - The concessive phrase about whether numbers are real is not treated as a forecast antecedent.
