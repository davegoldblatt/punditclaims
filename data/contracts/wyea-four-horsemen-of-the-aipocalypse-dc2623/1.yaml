assessment_axis: historical_observation
explicit_source_elements:
  - the majority
  - OpenAI, Cursor and Anthropic’s revenues
  - come from subsidized software subscriptions
evaluator_interpretation:
  - The ordinary reading is more than half of each named company's revenue, rather than more than half of their pooled revenue.
  - Software subscriptions include individual and enterprise subscription plans, but not separately metered API consumption merely because it is sold under a continuing contract.
  - Subsidized means subscription revenue fails to cover the associated cost of delivering those subscriptions. Company-wide losses or venture financing alone do not establish this.
  - For this ongoing observation, use January through March 2026, the latest completed calendar quarter before the post that public evidence could report.
  - The surrounding argument relies on reported private-company figures, so the claimed basis is estimate rather than an explicitly stated GAAP measure.
support_condition: Comparable evidence shows that below-delivery-cost software subscriptions generated more than 50% of realized revenue at each of OpenAI, Cursor, and Anthropic during the target quarter.
contradiction_condition: Comparable evidence establishes that at least one named company received no more than 50% of revenue from such subscriptions during the target quarter.
measurement_requirements: For each company, measure realized subscription revenue, total realized revenue, and the delivery costs attributable to the relevant subscription products. Distinguish customer type from billing model and gross margin from net income.
source_requirements: Prefer financial statements or product-level company disclosures. Credible reporting may supply estimates, but customer counts, run rates, funding, and aggregate losses are insufficient.
metric_scope:
