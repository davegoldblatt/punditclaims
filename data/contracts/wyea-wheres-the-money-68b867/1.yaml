assessment_axis: causal_assessment
explicit_source_elements:
  - Its products do not scale like traditional software
  - the more users it gets, the more expensive its services are to run
  - because its models are so compute-intensive
evaluator_interpretation:
  - Its refers to OpenAI.
  - The ordinary reading concerns total serving costs as active usage grows, assuming comparable usage per user and product mix. It does not say that cost per request necessarily rises.
  - The comparison implies materially heavier incremental computation than conventional software services, not merely that operating a service has some cost.
  - Use Q4 2024, the latest completed calendar quarter before publication, as the reporting proxy for the ongoing operating relationship.
  - The claim gives no monetary accounting basis.
support_condition: Matched operating evidence shows that additional active usage materially increases OpenAI's serving costs through inference computation, with a materially heavier incremental cost relationship than comparable conventional software.
contradiction_condition: Matched evidence shows that the asserted cost relationship or comparative difference does not hold, or that the observed increase is attributable to another cause rather than additional inference workload.
measurement_requirements: Measure active usage, tokens, model mix, capacity utilization and serving costs together. Separate training from inference and total cost from cost per request. Compare like service workloads over a meaningful capacity range.
source_requirements: Company operating records or independently measured deployments and a documented conventional-software comparison. API prices alone do not measure OpenAI's own costs.
