  - The hypothetical installation clause does not assert that installation occurred.
  - Turning this into a firm claim would require selecting a capacity universe, an analyst forecast, a spending period, and a standard for what counts as clear.
support_condition: No fair binary support condition follows from the stated uncertainty without adding a stronger proposition.
contradiction_condition: Identifying customers would not alone contradict uncertainty about whether their purchases will match unspecified expectations.
measurement_requirements: A testable replacement would need a named forecast, its date and coverage, and comparable customer spending or commitments.
source_requirements: Customer contracts and spending disclosures matched to the specified analyst forecast.
