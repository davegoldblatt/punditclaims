explicit_source_elements:
  - his customers
  - increasingly struggling to pay for his GPUs
  - their customers
  - increasingly difficult to afford to rent them
evaluator_interpretation:
  - The ordinary reading is worsening financial ability to purchase GPUs among NVIDIA customers and to rent GPU capacity among their customers.
  - Increasingly requires a comparison over time for both groups. It does not require every customer to be distressed.
  - For the ongoing financial condition, use July through September 2026, the latest completed calendar quarter ordinarily reportable before the post, compared with earlier periods.
  - Higher borrowing costs, losses, and financing dependence are relevant indicators but do not alone establish inability to pay.
  - No accounting basis or numerical financial measure is supplied.
support_condition: Comparable records show a broad worsening in payment capacity among GPU buyers and renters, such as increasing arrears, affordability-driven cancellations, or deteriorating liquidity relative to obligations.
contradiction_condition: Representative records for both groups show stable or improving payment capacity and establish that apparent delays or cancellations arose from other causes.
measurement_requirements: Use consistent customer samples and periods. Separate payment arrears from negotiated credit terms, and affordability-driven cancellations from export restrictions or supply delays.
source_requirements: Customer financial statements, supplier collection records, rental-provider disclosures, and credible reporting identifying actual payment or funding difficulties.
