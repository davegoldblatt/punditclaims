condition_status: not_applicable
early_resolution_rule: A dated, independently verified event satisfying either contradiction condition can resolve the forecast against the speaker. A launch, benchmark result, or lack of reported deployment cannot resolve it in support.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
