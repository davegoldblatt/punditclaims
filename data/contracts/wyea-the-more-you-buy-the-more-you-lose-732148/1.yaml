early_resolution_rule: Contradict upon a dated, verified crossing of USD 2 trillion in realized incremental LLM revenue under a reconciled scope. A low current total cannot establish 'never'.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Annual versus cumulative revenue is unspecified.
  - The companies whose revenue should count are unspecified.
  - "'Brand new' lacks an explicit counterfactual baseline."
  - Accounting basis and treatment of intercompany transactions are unspecified.
  - The investment return implied by 'worth it' is undefined.
