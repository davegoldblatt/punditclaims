assessment_axis: forecast_outcome
explicit_source_elements:
  - nothing that large language models (LLMs) have done, do or will do in the future
  - can or will ever bring in
  - more than $2 trillion
  - brand new revenue
evaluator_interpretation:
  - This is an unlimited negative forecast about incremental revenue attributable to LLMs.
  - The plain reading concerns realized new revenue, not valuation, funding, economic surplus, projected sales or annualized run rate.
  - No annual period is stated. Cumulative realized incremental revenue is the provisional reading, while annual versus cumulative remains a material ambiguity.
  - The context concerns returns to hyperscaler investment, but the wording does not clearly restrict whose revenue counts.
  - "'Required to make any of this worth it' is an investment judgment, not an independently specified return threshold."
support_condition: No finite period of low revenue can establish that the threshold will never be crossed. Support would require a decisive permanent end to the relevant revenue-generating activity with a complete lifetime total at or below USD 2 trillion.
contradiction_condition: Reliable financial evidence establishes more than USD 2 trillion of realized incremental revenue attributable to LLMs under a consistent, explicitly defined scope.
measurement_requirements: Define company coverage, baseline, accumulation period and accounting basis. Identify incremental LLM revenue and avoid double counting transactions across cloud providers, model developers and applications.
source_requirements: Financial disclosures and a transparent aggregation that distinguish realized revenue from forecasts, financing, valuation and run rate.
metric_scope:
  company: LLM-related businesses; company coverage unspecified
  metric: Incremental revenue attributable to LLMs
  currency: USD
  units: Trillion dollars
  accounting_basis: unknown
  fiscal_or_calendar: unknown
