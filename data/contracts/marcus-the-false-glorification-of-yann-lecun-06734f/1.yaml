evaluator_interpretation:
  - "The surrounding essay identifies five subjects: convolutional neural networks, criticism of LLMs, criticism of pure scaling, commonsense and physical reasoning, and world models."
  - I read the concluding sentence as a historical assertion that these broad ideas have predecessors, not a denial that LeCun made any original technical contributions.
  - A prior related publication establishes an antecedent. Establishing that LeCun did not originate a particular argument also requires comparison with his earliest relevant work.
  - The target is the historical record through the post date. No single starting date is supplied.
support_condition: Dated records and a priority comparison establish predecessors for all five broad ideas attributed to LeCun in the essay.
contradiction_condition: A documented priority comparison establishes that LeCun originated an identifiable broad idea that the essay says he did not originate. Original refinements alone do not contradict the scoped claim.
measurement_requirements: Define each idea at a consistent level of specificity and distinguish antecedents, independent development, technical refinements, and public credit.
source_requirements: Dated research publications and attributable public statements, including LeCun's relevant earliest work. The existence of media praise or Marcus's accusation alone is insufficient.
