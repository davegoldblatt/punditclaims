evaluator_interpretation:
  - The ordinary reading is that LLM-based methods cannot by themselves produce AI that reliably follows intended human goals and safety constraints across relevant deployment settings.
  - Solve means a robust solution, rather than improved results on selected safety tests.
  - Alone restricts the proposed solution's technical scope; it is not a separate future antecedent that must occur before the claim can be evaluated.
  - Ordinary training data, human-specified goals and LLM-based feedback are not automatically excluded. A solution depending on a separate non-LLM mechanism would not falsify this claim.
support_condition: An independently validated impossibility result establishes that the relevant class of LLM-based methods cannot solve alignment under assumptions matching the ordinary reading.
contradiction_condition: A publicly documented, independently validated solution achieves reliable alignment using LLM-based methods alone across the relevant deployment settings.
measurement_requirements: Specify the alignment goals, deployment scope, failure criteria and technical components. Distinguish benchmark improvements, general verification limits and a solution to alignment.
source_requirements: Primary research with inspectable methods and independent validation for any decisive solution or impossibility result.
