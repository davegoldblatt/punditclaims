evaluator_interpretation:
  - The plain reading is that errors substantially reduced usable task completion or imposed substantial checking and correction work.
  - The claim does not require agents to be useless, or errors to be the sole or largest limitation.
  - ChatGPT agent is the named example. Assess its introduction-to-publication period, July 17 through August 3, 2025; evidence about earlier agents is background.
  - Distinguish model mistakes from deliberate approval requirements, access restrictions, outages and slow execution.
support_condition: Task evaluations or deployment records directly connect errors to substantial loss of usable results or substantial correction burdens across ordinary uses.
contradiction_condition: Comparable records show that errors caused little practical loss of utility, with usable completion and correction burdens largely unaffected.
measurement_requirements: Identify errors, their effects on completed work, and checking or correction costs. Establish enough task coverage to assess the claimed magnitude.
source_requirements: Prefer firsthand task records or deployment studies that separate error effects from other causes of reduced usefulness.
