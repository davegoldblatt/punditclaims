assessment_axis: causal_assessment
explicit_source_elements:
  - Tall tales about the imminence of AGI
  - aren’t slowing down the AI race dynamic
  - they are speeding that very dynamic up
evaluator_interpretation:
  - The ordinary reading is that imminent-AGI narratives, including AI 2027, cause a net increase in competitive AI development, investment or political support.
  - The claim concerns an effect already occurring by 2025-05-22, not an unlimited forecast about subsequent influence.
  - Narrative exposure must affect decisions relative to what would otherwise have happened. Public attention and simultaneous investment growth are insufficient.
support_condition: Causal studies or documented decision rationales establish that exposure to imminent-AGI narratives increased competitive development or resources, with evidence sufficient to support the claimed net direction.
contradiction_condition: Comparable evidence establishes that the narratives caused net slowing rather than acceleration in the relevant decisions or population.
measurement_requirements: Measure changes in development pace, investment decisions or policy support attributable to narrative exposure, accounting for prior competition and any slowing effects.
source_requirements: Decision-maker records, contemporaneous funding or development records, or credible causal research. Narrative authors' intentions do not establish effects.
