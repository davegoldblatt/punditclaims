  - Sir Demis Hssabis sees it now, too
  - the critique of LLMs
  - the need for world models
  - the limitations of pure prediction
  - scaling LLMs is “all you need”
evaluator_interpretation:
  - "The plain reading is that Hassabis shared the substantive criticism described nearby: current LLMs have important limitations, and scaling pure language prediction alone is insufficient for general intelligence."
  - Agreement need not include endorsing Marcus personally, accepting every criticism he has made, or supporting his preferred solutions.
  - For this ongoing description of a person's views, use public statements in 2025 through September 26. There is no quarterly reporting cycle; this calendar-year window represents contemporary views before the post.
  - Treat 'now' as describing his position by the post date, without requiring proof of a recent conversion.
support_condition: Contemporary statements show Hassabis acknowledging important LLM limitations and accepting that general intelligence requires capabilities or advances beyond scaling pure language prediction.
contradiction_condition: Contemporary statements show Hassabis rejecting those limitations or explicitly leaving scaling existing systems sufficient as an open possibility, contrary to the claim that he had accepted its insufficiency. Agreement about limitations alongside that reservation supports a mixed assessment.
measurement_requirements: Assess Hassabis's expressed position, preserving qualifications and distinguishing current shortcomings from claims about what scaling can ultimately achieve.
source_requirements: Prefer Hassabis's own public statements, company publications under his name, and original interview transcripts published before the post. Identify any reliance on third-party transcripts.
