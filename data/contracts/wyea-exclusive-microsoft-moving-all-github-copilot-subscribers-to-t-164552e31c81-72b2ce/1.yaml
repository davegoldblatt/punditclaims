explicit_source_elements:
  - Microsoft’s transition to token-based billing for GitHub Copilot
  - grapples with spiraling costs of AI compute
evaluator_interpretation:
  - The ordinary reading is that a billing transition was being prepared while AI compute costs were rising sharply and creating operating pressure.
  - The word 'as' establishes concurrence; it does not by itself establish that costs caused the transition.
  - "For the ongoing financial assertion, use the latest reported fiscal quarter before publication: October–December 2025. Assess the billing preparations as of April 22, 2026. The target interval encloses these two component periods."
  - No numerical threshold, currency, cost definition, or accounting basis is supplied. Broad capital expenditure or total cost of revenue cannot substitute for AI compute costs.
support_condition: Authenticated records establish billing preparations by April 22 and comparable AI compute cost evidence establishes a sharp increase and operating pressure in the relevant financial period.
contradiction_condition: Reliable records establish that no such transition was being prepared, or comparable AI compute costs were stable or falling without the asserted pressure.
measurement_requirements: A consistent definition of AI compute costs, a comparison period, and evidence of operating pressure. The unspecified accounting basis must be resolved before a definitive financial score.
source_requirements: Dated company disclosures, authenticated planning records, or independently sourced reporting. Reporting that merely repeats Zitron is insufficient.
