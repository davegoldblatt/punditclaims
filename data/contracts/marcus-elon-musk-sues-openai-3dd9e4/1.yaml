assessment_axis: historical_observation
explicit_source_elements:
  - The company Sam and Greg built
  - has little to do with
  - what was originally promised
evaluator_interpretation:
  - The ordinary reading is substantial departure from the founding commitments concerning nonprofit purpose, research openness, and freedom from investor-return pressures.
  - This is a comparison from OpenAI's 2015 founding to its position by March 1, 2024. The target period covers that expressly implied historical comparison.
  - Assess documented structure and practices, not whether OpenAI ultimately benefits humanity or whether a legally enforceable contract was breached.
  - The claim supplies no numerical threshold. Major departures support it; meaningful continuity in nonprofit governance and public-benefit obligations weighs against its breadth.
  - The endpoint is the latest publicly documented structure and practices before the post. Later restructuring is excluded.
support_condition: "Founding records and subsequent records show substantial departures in the central organizational commitments: nonprofit operation, research sharing, and insulation from investor-return incentives."
contradiction_condition: Records show substantial continuity in those central commitments, including effective nonprofit governance, public-benefit obligations, and research practices consistent with the original promises.
measurement_requirements: Compare the founding announcement with documented governance and research practices through the post date. Distinguish nonprofit control from the existence of a commercial subsidiary, and encouragement to publish from an unconditional promise to release every model.
source_requirements: Prefer founding documents, dated company disclosures, and direct accounts of research-release decisions. Do not use Marcus's characterization or Musk's allegations as proof of institutional departure.
