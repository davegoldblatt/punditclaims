  start: 2015-12-11
  end: 2024-03-01
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Little to do with supplies no threshold or weighting among commitments.
  - Originally promised could mean public founding statements or private assurances to Musk.
  - The ongoing endpoint has no specified reporting period; the latest documented pre-post practices are used.
  - Legal nonprofit control and practical commercial influence are different measures of continuity.
