assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA is ... selling GPUs to China
  - through a web of proxies and shell corporations
evaluator_interpretation:
  - The plain reading is that NVIDIA-origin GPU sales reach Chinese buyers through intermediaries that conceal the ultimate destination.
  - Diversion by intermediaries does not by itself establish NVIDIA management's knowledge or participation.
  - For this ongoing, nonfinancial observation, use October 2026, the latest complete calendar month before publication. The speaker supplies no reporting period.
support_condition: Reliable shipment, ownership, invoice or investigative records trace NVIDIA GPU sales through proxy or shell buyers to Chinese end users during the target period.
contradiction_condition: Affirmative, sufficiently comprehensive records disprove the alleged sales routes during the target period. Company denials or unsuccessful investigations alone are insufficient.
measurement_requirements: Identify the GPUs, intermediary relationships, ultimate Chinese destination and transaction dates. Distinguish physical shipments into China from lawful access to offshore computing.
source_requirements: Prefer transaction records and official findings. Independent reporting can establish the route if it documents its evidence and distinguishes allegations from findings.
