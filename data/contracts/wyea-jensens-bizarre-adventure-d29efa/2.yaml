assessment_axis: historical_observation
explicit_source_elements:
  - NVIDIA is not selling GPUs to China
  - through a web of proxies and shell corporations
  - the only real questions are how much, to whom, and when
evaluator_interpretation:
  - The factual core is that NVIDIA GPUs are sold onward to Chinese customers through intermediary and shell-company networks.
  - This reading does not require proof that NVIDIA executives directed or knowingly authorized the downstream evasion. The surrounding allegations of deliberate conduct are stronger and remain separate.
  - The target is the continuing distribution pattern described in the multiyear account through publication, not transactions in an arbitrarily selected month.
  - The speaker supplies no exact starting date and expressly leaves quantities, buyers and timing open.
support_condition: Documented completed sales or shipments establish that NVIDIA GPUs reached Chinese customers through a network involving intermediaries and shell companies. Attempted shipments alone are insufficient.
contradiction_condition: Reliable records disprove the alleged completed distribution routes or establish that the relevant chips did not reach Chinese customers through such networks. A denial concerning one intermediary is insufficient to disprove the general pattern.
measurement_requirements: Identify NVIDIA GPUs, completed movement to China, and intermediary or shell-company participation. Distinguish completed conduct from attempts and admitted facts from pending allegations.
source_requirements: Prefer court records and official accounts of admissions. Use reputable reporting for inaccessible court documents, with that limitation disclosed.
