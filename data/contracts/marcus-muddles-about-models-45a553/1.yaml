evaluator_interpretation:
  - The plain reading predicts failure of military applications of the described GPT-like approach because it cannot support dependable inference on novel questions.
  - Military applications include support tasks; the wording does not limit the claim to autonomous combat.
  - Being toast means failing to provide dependable usefulness for the intended task, not merely making an occasional error.
  - No deadline is supplied. Military application identifies the scope rather than a separate conditional antecedent.
support_condition: Operational evaluations establish failure across the claimed scope and attribute it to the specified inability to infer reliably on novel questions. Individual failures provide partial evidence but cannot establish every possible application.
contradiction_condition: At least one application using the described approach demonstrates repeatable operational usefulness under representative conditions, with enough technical detail to establish that it falls within the claimed scope.
measurement_requirements: Identify the model, supporting software, human involvement, intended task, success criteria, novel inputs, and operational results. Separate deployments and demonstrations from validated performance.
source_requirements: Public operational evaluations, reproducible trials, or documented user results with adequate methods. Procurement announcements alone are insufficient.
