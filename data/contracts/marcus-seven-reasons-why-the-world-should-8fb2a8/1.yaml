explicit_source_elements:
  - Already
  - pressure from GenAI
  - keep coal plants on
evaluator_interpretation:
  - The claim requires generative AI demand to contribute to pressure against coal-plant retirement; it need not be the only cause.
  - Pressure includes a documented proposal or reconsideration. A completed retirement delay is not required.
  - For this ongoing state, the target is the latest completed calendar month before publication, January 2024, plus the elapsed days through February 10. Utility planning pressure can be reported contemporaneously rather than only in quarterly accounts.
  - General data-center demand is relevant context, but does not by itself establish a contribution from generative AI.
support_condition: Records establish that, during the target period, actual or expected generative AI electricity demand contributed to an operator's consideration of retaining coal generation.
contradiction_condition: Evidence establishes that the asserted contemporary pressure was absent or that the relevant purported examples were wrongly attributed to generative AI, with adequate coverage to reject the claim.
measurement_requirements: Identify a coal plant or operator, the retirement issue, when the pressure existed, and a documented connection to generative AI demand.
source_requirements: Prefer utility plans, regulatory filings, or operator statements. Contemporaneous reporting may establish the connection if it identifies its basis.
