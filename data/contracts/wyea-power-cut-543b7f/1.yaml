assessment_axis: causal_assessment
explicit_source_elements:
  - if Microsoft ... is reducing capacity
  - it heavily suggests
  - the growth is not there
evaluator_interpretation:
  - Assess whether the reported February 2025 capacity pullback was strong evidence of inadequate generative-AI demand growth.
  - The contextual reading is growth insufficient to justify the planned infrastructure expansion, not literally zero revenue or usage growth.
  - The opening statement about the entirety of the technology industry is rhetorical framing rather than a separately quantified industry-composition claim.
  - This is a causal inference about an observed business decision, not a conditional forecast.
  - Later growth alone cannot identify why Microsoft changed particular plans in early 2025.
support_condition: Evidence links a material reduction in Microsoft's aggregate expansion plans principally to generative-AI demand falling below the expectations underlying those plans, with meaningful corroboration beyond isolated cancellations.
contradiction_condition: Evidence establishes that the reported changes were predominantly reallocations, supplier changes or other adjustments without a material demand shortfall, and that relevant demand continued to justify the aggregate expansion plan.
measurement_requirements: Distinguish canceled prospective leases from reduced installed capacity, and compare net planned capacity with the demand expectations behind it. Industrywide conclusions require broader evidence than one provider's decisions.
source_requirements: Contemporaneous planning explanations, capacity records and demand measures. Revenue growth can provide context but cannot alone establish the cause of cancellations.
