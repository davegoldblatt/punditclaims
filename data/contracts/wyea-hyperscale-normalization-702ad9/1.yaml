ambiguity_flags:
  - Q2 2026 is an evaluator-selected reporting period for an ongoing state.
  - "'Wrapper' is not a defined statistical industry."
  - The geography and employment denominator are unspecified.
  - "'Negligible' has no numerical threshold."
  - The boundary between new application businesses and established software companies is unspecified.
