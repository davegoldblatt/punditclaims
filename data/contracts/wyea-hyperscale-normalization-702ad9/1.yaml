assessment_axis: historical_observation
explicit_source_elements:
  - companies that exist to throw a layer over an existing AI model
  - those “industries” employ a negligible amount of people
evaluator_interpretation:
  - Read the target as new businesses selling applications built on existing models, rather than all employers that use AI.
  - Read 'negligible' as a very small contribution to employment in the broader economy. This does not mean literally zero employees.
  - Use Q2 2026, the latest complete calendar quarter before the post, for the ongoing employment observation.
  - No numerical cutoff is imposed. Any comparison must use a consistent business population, geography, and employment denominator.
support_condition: A reasonably complete count of employment in the specified application businesses, compared with total employment in the same geography and period, establishes an unambiguously very small contribution.
contradiction_condition: Comparable aggregate evidence establishes a substantial employment contribution inconsistent with the ordinary reading of 'negligible.'
measurement_requirements: Define model-wrapper or application businesses, separate them from model developers and AI adopters, avoid double-counting contractors, and match the workforce count to the broader employment denominator.
source_requirements: Prefer official employer statistics or transparent company-level aggregations. Individual company examples and counts of job advertisements cannot establish aggregate employment.
