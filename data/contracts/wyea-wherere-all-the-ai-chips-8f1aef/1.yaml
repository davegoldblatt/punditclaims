assessment_axis: forecast_outcome
explicit_source_elements:
  - tens of billions of dollars of write-downs
  - dead data center debt deals
  - every investor involved losing every penny
  - big tech ... admitting that they wasted all their capex
evaluator_interpretation:
  - Treat the wording as a substantive forecast despite its conversational framing.
  - Read tens of billions as at least USD 20 billion in aggregate realized AI infrastructure write-downs. The numerical floor is an evaluator interpretation.
  - Read dead debt deals as defaults or failed restructurings with final losses, rather than lower secondary-market bond prices.
  - Every investor involved means all investor classes in the failed deals identified as fulfilling the forecast.
  - Capex refers to the AI buildout discussed in the post, rather than every capital expenditure by technology companies.
  - Support requires the write-downs, failed deals with total investor losses, and public acknowledgment of wasted AI capex; one component does not establish the whole claim.
support_condition: Financial statements establish at least USD 20 billion of relevant write-downs, final recovery records show complete losses for every investor class in the qualifying failed deals, and relevant big-tech companies publicly acknowledge that the associated AI capex was wasted.
contradiction_condition: A completed resolution of a defined investment cohort establishes that the required losses and admissions did not occur. Recoveries in a particular failed deal contradict total-loss claims about that deal, but do not rule out other qualifying failures in the indefinite future.
measurement_requirements: Separate asset impairments, ordinary depreciation, debt principal, trading losses and final creditor recoveries. Avoid counting the same economic loss twice. Identify the investments covered by any admission.
source_requirements: Company financial statements, restructuring or liquidation distributions, executed debt documents and direct public company statements.
metric_scope:
  company: AI data-center owners, financing investors and big-tech companies; individual companies unspecified
  metric: Aggregate AI infrastructure write-downs and final investor losses on failed data-center debt deals
  currency: USD
  units: billions of dollars
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: realized
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Support requires dated, completed events establishing all components, including final zero recoveries and the admissions. Current trading losses, anticipated impairments or the absence of defaults cannot settle this forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline or fixed investment cohort.
  - Tens of billions has no exact stated floor.
  - The allocation of the dollar threshold between write-downs and dead debt deals is unclear.
  - Every investor involved could refer to particular failed deals or the wider sector.
  - The companies and capex covered by all their capex are unspecified.
  - No accounting basis is specified.
retrospective_or_prospective: retrospective
