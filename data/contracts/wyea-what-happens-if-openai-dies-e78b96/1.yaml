explicit_source_elements:
  - Based on this description of the deal
  - NVIDIA only has to guarantee things
  - in the event the data center is actually built
evaluator_interpretation:
  - The claim concerns the Ohio agreement described immediately before the post, announced on August 17, 2026.
  - The plain reading is that the backstop becomes operative for completed, service-ready facilities or phases, rather than construction expenditure.
  - Completion of every planned phase is not required before any guarantee can apply.
  - The surrounding contrast with ongoing lease payments is read as residual-value protection rather than routine payment of OpenAI's rent. It does not mean lease defaults can never trigger NVIDIA's liability.
support_condition: The reported agreement makes the backstop operative upon completion or readiness for service of the applicable facilities and protects residual value rather than financing unfinished construction.
contradiction_condition: The agreement makes NVIDIA liable for unfinished construction regardless of delivery or requires it to pay ordinary ongoing rent independently of the completed-asset backstop.
measurement_requirements: Identify the guarantee's activation conditions, construction-phase treatment, default triggers, and payment mechanism.
source_requirements: The executed agreement or company filings are preferred. Independent reporting on the terms is acceptable where the underlying contract is unavailable.
