  end: 2025-03-05
  precision: day
condition_status: not_applicable
early_resolution_rule: null
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - The ongoing observation supplies no reporting period; current-year announcements through publication are used.
  - Largest investments has no comparison class or inflation convention.
  - Investments could mean announced plans, binding commitments or completed expenditure.
  - Enormous number and at the center have no numerical thresholds.
  - AGI timelines may mean a specific arrival date or broader expectations of rapid capability growth.
