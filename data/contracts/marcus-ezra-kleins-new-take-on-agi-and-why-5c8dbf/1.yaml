assessment_axis: historical_observation
explicit_source_elements:
  - AGI timelines
  - the focus of some of the largest investments in history
  - at the center of an enormous number of very delicate policy questions
evaluator_interpretation:
  - The ordinary reading is that expectations about when AGI will arrive materially influence exceptionally large investment projects and multiple consequential policy debates.
  - The ongoing observation is assessed over the current year's public investment and policy announcements through the post date, January 1 to March 5, 2025.
  - Investment announcements can demonstrate the scale of intended commitments, but cannot be treated as completed spending.
  - This is a qualitative claim about investment and policy across the sector, not a specified company's financial metric; contract metric_scope is therefore null.
  - Largest in history requires a defensible comparison with historical investments, not merely a large dollar figure.
support_condition: Public records connect AGI timing expectations to investment commitments demonstrably among historically exceptional projects and to multiple major policy questions.
contradiction_condition: Comparable historical evidence shows the cited investment scale was not exceptional, or direct records establish that the claimed investment and policy decisions did not materially involve AGI timing expectations.
measurement_requirements: Separate announced commitments from realized spending; specify the historical comparison class and account for differences in prices, duration and project scope.
source_requirements: Investor announcements, public statements explaining investment decisions, official policy documents, and credible historical investment comparisons.
