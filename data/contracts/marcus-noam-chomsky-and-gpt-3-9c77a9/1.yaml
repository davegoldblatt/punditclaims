evaluator_interpretation:
  - This concerns results available when Marcus wrote, not whether later models overcame those limitations.
  - I interpret recent studies as work reported in 2021 and 2022 through the post date. The source does not specify an exact starting date.
  - The ordinary reading is that increasing model size improved some measured capabilities while leaving substantial deficits on some reasoning and common-sense tasks.
  - Falling short means documented weaknesses against relevant task or human-performance benchmarks. It does not require failure on every task or an absence of improvement.
support_condition: Contemporary scaling research reports improvements on some tasks alongside substantial remaining weaknesses on particular reasoning and common-sense benchmarks.
contradiction_condition: The relevant contemporary studies show that larger models eliminated the alleged reasoning and common-sense deficits, or that the reported combination of gains and remaining deficits was misrepresented. Success on other tasks alone does not contradict this limited claim.
measurement_requirements: Comparisons across model sizes with identifiable tasks and evaluation methods, together with benchmark results establishing remaining deficits. Distinguish parameter scaling from changes in prompting, training data, and other methods.
source_requirements: Primary research or researchers' contemporaneous disclosures describing results available by 2022-05-21.
