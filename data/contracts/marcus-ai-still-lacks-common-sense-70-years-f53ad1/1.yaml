explicit_source_elements:
  - reliable commonsense
  - simply “emerge”
  - large databases and video
  - has proven unrealistic
  - again and again
evaluator_interpretation:
  - The ordinary reading is that large-scale text and video learning had repeatedly fallen short of dependable commonsense across varied situations by publication.
  - The claim does not deny useful learned knowledge or success on particular tasks, and it does not establish permanent impossibility.
  - Repeated evidence must cover multiple evaluations and both language-based and video-based approaches.
  - The retrospective period runs from 2020, when the surrounding discussion introduces GPT-3, through January 5, 2025.
support_condition: Multiple evaluations within the period document recurring commonsense failures in language-based systems and failures of physical generalization in video-based systems.
contradiction_condition: Representative evaluations establish broad, repeatable commonsense reliability in both model classes, making the claimed pattern of shortcomings inaccurate.
measurement_requirements: Use tasks requiring entity-state reasoning, implicit everyday assumptions, or physical interactions. Distinguish failure on unfamiliar situations from success on familiar benchmarks.
source_requirements: Primary evaluations with identifiable models and tasks. Evidence must describe capabilities during the target period.
