assessment_axis: historical_observation
explicit_source_elements:
  - every single Large Language Model company is unprofitable
  - Outside of one exception — Midjourney
  - often wildly so
evaluator_interpretation:
  - The surrounding paragraph includes businesses building models and businesses selling products built on others' models. It does not naturally include the consolidated finances of diversified technology companies.
  - The plain reading is company-wide losses, rather than negative gross margins or cash consumption alone.
  - For the ongoing financial observation, use April–June 2025, the latest completed calendar quarter before publication. Zitron supplies no reporting period.
  - The universal assertion does not identify an accounting basis. The reference to Midjourney's own profitability claim does not establish a basis for every other company.
  - A single qualifying profitable company would defeat the universal assertion. 'Often wildly so' has no separate numerical threshold.
support_condition: Comparable company-wide financial results show losses throughout the defined population, excluding Midjourney, for the target period.
contradiction_condition: At least one qualifying company other than Midjourney reports company-wide profit for the target period on an accounting basis comparable to the claim.
measurement_requirements: Distinguish company-wide profit from gross margin, operating cash flow, accumulated cash and annualized revenue. Establish the reporting period and accounting basis.
source_requirements: Company financial disclosures or credible financial reporting. A company's unsupported profitability statement is relevant but does not establish a particular accounting measure.
