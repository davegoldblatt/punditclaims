explicit_source_elements:
  - Anthropic
  - loses billions of dollars
  - subsidized accounts
  - $8,000 a month in tokens for $200
evaluator_interpretation:
  - The statement combines annual company losses with subscription economics at the time of publication.
  - I read the loss component against 2025, the latest completed calendar year before the post. I read the subscription component against June 2026. The target interval encompasses these two component periods; evidence must still match the relevant component.
  - The ordinary reading is that some subscribers can obtain approximately $8,000 of tokens at equivalent API prices for a $200 monthly payment. It does not say every subscriber consumes that amount.
  - Subsidized can mean discounted relative to API prices or supplied below Anthropic's cost. Those are different propositions.
  - The loss statement identifies neither an accounting basis nor an attributed financial source. A later company filing cannot supply the missing basis in the original claim.
support_condition: Comparable financial results establish multi-billion-dollar annual losses, and dated subscription measurements establish approximately $8,000 of equivalent API-priced usage for $200 monthly. Establishing a subsidy below cost additionally requires evidence of the cost of serving those accounts.
contradiction_condition: Comparable financial results exclude multi-billion-dollar annual losses, or applicable subscription limits and reproducible measurements establish that the claimed usage was unavailable. A smaller average subscriber's usage would not contradict a claim about what some accounts allow.
measurement_requirements: Distinguish net loss, operating loss and cash burn. For subscription usage, identify models, input and output tokens, cache treatment, API prices, billing period and any extrapolation from weekly limits. API list-price value must not be treated as provider cost.
source_requirements: Prefer company financial statements and dated plan documentation, supplemented by reproducible independent usage measurements. Cost-based subsidy claims require actual cost evidence.
