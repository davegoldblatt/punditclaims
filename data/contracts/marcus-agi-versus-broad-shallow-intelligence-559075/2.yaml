assessment_axis: historical_observation
explicit_source_elements:
  - the inability of LLMs to do basic fact checking and sanity checking
  - speak to their lack of resourcefulness
  - reliability is not their strong suit
  - they fail to sanity check their own work
evaluator_interpretation:
  - In context, the ordinary reading concerns dependable checking, rather than an inability to perform any successful check.
  - Basic fact checking means verifying straightforward factual claims against available evidence. Sanity checking means detecting obvious errors, inconsistencies or unsupported conclusions, including in the system's own work.
  - External sources, retrieval, calculators, code and checking workflows are allowed. Marcus did not restrict the claim to unaided self-correction.
  - The observation concerns systems contemporary with the post. Because research has no regular reporting quarter, use the latest completed calendar year and the elapsed publication year, January 2024 through January 13, 2025, as the recent evaluation period.
  - Treat resourcefulness as the practical ability to use available information and methods to check an answer. Checking failures alone cannot establish a general absence of that ability.
  - Neither isolated failures nor isolated successes settle the reliability claim.
support_condition: Representative evaluations of contemporary LLMs show substantial recurring failures to verify straightforward facts and detect obvious inconsistencies, including when ordinary external verification is available. The failures must concern checking itself, rather than merely producing an initially incorrect answer.
contradiction_condition: Reproducible evaluations show dependable factual verification and obvious-error detection across varied basic tasks using ordinary resources. Success on selected examples or improvement over a weak baseline is insufficient.
measurement_requirements: Identify model versions, task difficulty, available evidence and tools, checking prompts, error-detection rates and false alarms. Distinguish factual verdict accuracy from retrieval scores, answer-generation accuracy and correction after a human supplies the error. Examine benchmark-label quality and whether results generalize across basic tasks.
source_requirements: Prefer original evaluations with described methods, datasets and results. Use evidence available by October 28, 2026, concerning the target-period systems and evaluations.
