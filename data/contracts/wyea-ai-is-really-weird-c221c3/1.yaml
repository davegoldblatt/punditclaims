  - The relevant comparison is equivalent work before and after the default changed, accounting for caching, compaction, model choice, and task completion.
  - The assessment concerns the rollout discussed in the post through April 8, 2026. Capacity alone does not establish actual consumption.
support_condition: Representative usage data or controlled comparisons show a substantial increase in billed token consumption attributable to the default context-window change.
contradiction_condition: Comparable measurements show that the change generally leaves billed token consumption materially unchanged or reduces it.
measurement_requirements: Measure actual input, output, cache-write and cache-read tokens for comparable completed tasks. Separate API charges from subscription usage limits.
source_requirements: Dated product documentation to establish the change, plus reproducible measurements or sufficiently detailed usage records to establish its effect.
