assessment_axis: forecast_outcome
explicit_source_elements:
  - Its unraveling
  - will be framed as impossible to see coming
  - because nobody in power had bothered to look
evaluator_interpretation:
  - Its refers to the AI-demand boom discussed immediately beforehand.
  - Unraveling means a substantial, sustained, broad reversal in demand, rather than a stock-price correction or one company's failure.
  - Will be framed means a widespread public explanation by relevant decision-makers and commentators, rather than one isolated quotation.
  - The sentence predicts both an unraveling and its subsequent explanation. I do not convert it into a conditional forecast that assumes a collapse.
  - The causal explanation requires evidence about prior scrutiny; retrospective surprise alone would not establish that nobody investigated.
support_condition: A broad AI-demand collapse occurs, representative subsequent accounts portray it as unforeseeable, and records substantiate the asserted failure of prior scrutiny.
contradiction_condition: After a qualifying collapse and a sufficiently developed public record, representative explanations acknowledge that it was foreseeable. Documented prior scrutiny would also undermine the categorical causal explanation.
measurement_requirements: Use multiple measures of actual AI purchasing or usage across providers and customers. Assess a representative body of public explanations and distinguish demand from investment valuations.
source_requirements: Demand measurements, company disclosures, official records, and dated statements or reporting about the aftermath. Prior risk assessments are relevant to the scrutiny component.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A documented broad demand collapse followed by an established public explanation can settle the forecast. A market sell-off, warning, or individual failure alone cannot.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - Unraveling has no numerical threshold or duration.
  - The relevant population of people in power is unspecified.
  - The prevalence and observation period required for public framing are unspecified.
  - Nobody had bothered to look may be rhetorical rather than literally universal.
retrospective_or_prospective: retrospective
