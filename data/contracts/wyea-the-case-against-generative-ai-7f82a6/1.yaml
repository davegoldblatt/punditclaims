explicit_source_elements:
  - OpenAI and Anthropic’s true costs
  - about $159 billion
  - in the past two years
  - Uber’s $30 billion all-time burn
evaluator_interpretation:
  - The linked calculation defines the period as beginning in 2024. I therefore assess January 2024 through publication, rather than two completed calendar years.
  - The linked calculation adds fundraising to an estimated allocation of supplier capital expenditure. This identifies the author's method; it does not independently establish expenditure.
  - The ordinary reading of costs is resources actually spent or consumed, including attributable supplier infrastructure, without double counting. Financing raised but not spent is not a realized cost.
  - Uber's cumulative cash burn requires a separate reconciliation. Accumulated accounting losses are not automatically cash burn.
support_condition: Independent records establish approximately $159 billion of combined, attributable costs during the target period, without double counting, and approximately $30 billion of comparable cumulative Uber cash burn.
contradiction_condition: A sufficiently complete reconciliation establishes materially different costs or demonstrates that the comparison depends on counting unspent financing, duplicate expenditure, or a different financial measure.
measurement_requirements: Reconcile company spending, supplier infrastructure allocations, unspent fundraising, intercompany payments, and the definition and cutoff of Uber's cumulative burn.
source_requirements: Company accounts and supplier disclosures where available; clearly identified estimates otherwise. The speaker's calculation can define the claim but cannot validate it.
