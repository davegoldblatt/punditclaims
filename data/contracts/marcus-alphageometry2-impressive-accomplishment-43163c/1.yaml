  - these systems
  - anywhere close to the level of professional human mathematicians
  - research problems in mathematics are mostly incomparably more difficult
  - well beyond what was previously possible for AI systems
evaluator_interpretation:
  - The targets are AlphaGeometry2 and AlphaProof as discussed in February 2025, not later systems or AI mathematics generally.
  - The ordinary reading concerns the breadth and independence needed for professional mathematical research, alongside a substantial advance over earlier AI on comparable mathematical tasks.
  - The post supplies no reporting period. I use February 1–17, 2025 for the ongoing capability assessment, ending on the publication date. Earlier demonstrations provide context.
  - A single research-level solution would not establish broad professional parity. Conversely, finding no published research solution would not establish inability.
  - The progress comparison does not require these systems to be the first AI ever to make a mathematical discovery.
support_condition: Evidence about the versions discussed establishes a substantial gap from professional research capability, while comparable evaluations establish substantial progress over earlier AI systems.
contradiction_condition: Evidence establishes broadly comparable professional research capability for the versions discussed, or comparable evaluations refute the claimed substantial advance over earlier systems.
measurement_requirements: Identify the tested versions, tasks, human assistance, computational allowances and comparison groups. Competition scores alone cannot measure distance from professional research capability.
source_requirements: Prefer primary evaluations and documented research outputs. Later publications may describe earlier results, but later system capabilities cannot settle this observation.
