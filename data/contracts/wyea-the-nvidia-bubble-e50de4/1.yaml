evaluator_interpretation:
  - The ordinary reading is that Huang's leadership was necessary to sustain the speculative AI investment boom.
  - A bubble here means the financing and valuation boom described in the surrounding paragraphs; no independent finding that assets were mispriced is assumed.
  - The relevant observed episode is the leadership transition described in the post and developments through November 17.
support_condition: Evidence shows the speculative financing boom ending after Huang's departure and establishes that the loss of his role was necessary to that outcome, rather than merely one contributing factor.
contradiction_condition: A sustained speculative AI financing and valuation boom continues without Huang's leadership, supported by other decision-makers and sources of capital.
measurement_requirements: Examine financing, valuations, investment commitments, and their dependence on Huang. Separate causal evidence from timing, investor opinions, and individual stock movements.
source_requirements: Dated company and financing records, supplemented by independent market measurements and reporting that addresses alternative causes.
