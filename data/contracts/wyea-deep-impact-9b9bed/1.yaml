  - OpenAI, Anthropic, Google and Meta
  - unprofitable and unsustainable
  - in 2024
evaluator_interpretation:
  - The nearby explanation expressly cites 2024 losses, so calendar 2024 is the target period.
  - The claim concerns the economics of the named companies' LLM services, rather than consolidated corporate profitability.
  - The ordinary reading of unprofitable is that attributable revenue does not cover full development and operating costs.
  - The minimum testable reading of unsustainable is dependence on continuing financial support outside the services' own earnings. No bankruptcy deadline is supplied.
  - The nearby reported private-company figures imply an estimate basis; they do not establish GAAP or another consistent accounting standard for all four businesses.
support_condition: Comparable 2024 revenue and full-cost evidence establishes losses and dependence on outside financial support for the named LLM businesses.
contradiction_condition: Comparable evidence establishes that a named LLM business covered its full costs and could sustain its operations from its own earnings during 2024.
measurement_requirements: Separate LLM-service revenue and attributable training, inference, staffing and other costs. Do not substitute cash burn for loss, gross margin for full-cost profit, or consolidated company and cloud-segment results for LLM-service results.
source_requirements: Prefer financial statements or direct company disclosures with service-level allocations. Clearly identified press estimates may provide context where private-company accounts are unavailable.
