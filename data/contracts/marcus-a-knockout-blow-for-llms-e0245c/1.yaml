explicit_source_elements:
  - write python code
  - supplementing their own weaknesses with outside symbolic code
  - even this is not reliable
evaluator_interpretation:
  - The ordinary reading is that generating and executing Python does not by itself make LLM solutions dependably correct across tasks.
  - Reliable does not mean mathematically perfect. Material, recurring errors matter; isolated failures would be insufficient.
  - Useful code generation and substantial performance improvements are compatible with this claim.
  - Use calendar 2025 through June 7 for contemporary capability reports because the statement gives no period and this field has no standard reporting interval.
support_condition: Execution-based evaluations show material errors or unstable task performance when contemporary LLMs use generated Python to solve verifiable problems.
contradiction_condition: Broad, representative execution-based evaluations show dependably correct task completion using generated Python, without material correction or task-specific intervention.
measurement_requirements: Execute generated Python, evaluate the resulting answers against task specifications or ground truth, and distinguish code-assisted performance from direct answering.
source_requirements: Primary evaluations documenting model versions, execution settings, and observed errors. Success demonstrations should also be considered.
