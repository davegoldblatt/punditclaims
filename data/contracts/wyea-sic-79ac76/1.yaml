evaluator_interpretation:
  - The company is Anthropic.
  - The ordinary reading concerns software capable of substituting for paid workers in substantive, ongoing roles. Automating isolated tasks does not by itself establish this.
  - Replacement can occur through reduced staffing or avoided replacement hiring; it need not involve a public layoff announcement.
  - The phrase 'has made' describes the cumulative product record through June 16, 2025, so the target period has no specified starting date.
  - Claude-powered applications built by customers are relevant, provided the contribution of Anthropic software is identified.
support_condition: Credible assessments of Anthropic's available software establish that it could not perform substantive ongoing worker roles, with apparent replacement examples shown to be task assistance or unsuccessful substitutions.
contradiction_condition: At least one sufficiently documented deployment or realistic evaluation shows Anthropic software successfully substituting for paid workers in a substantive ongoing role by June 16, 2025.
measurement_requirements: Identify the product, work performed, human supervision, staffing substitution, duration, and acceptable work quality.
source_requirements: Prefer employer records or independently verified deployments. Vendor case studies are relevant but require scrutiny of what their staffing and performance claims establish.
