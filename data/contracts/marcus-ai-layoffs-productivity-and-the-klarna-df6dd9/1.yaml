assessment_axis: historical_observation
explicit_source_elements:
  - Employers of late are often looking to cut employees
  - They often use vague talk of AI to license their layoffs
  - they often don't know what the hell they are talking about, at least when it comes to AI
evaluator_interpretation:
  - "Plain reading: in the recent period, a large number of employers who cut jobs cited AI to justify the cuts. Those AI justifications were often vague or forward-looking, not tied to AI that was actually doing the work. And the executives making the cuts often misjudged what AI could do."
  - "'Often' has no threshold. I read it as 'a common, widely noted pattern', not 'most layoffs'."
  - "'Of late' describes an ongoing state with no named period. I use calendar 2025, the year the post was written in, as the period public evidence could report on."
  - Independent analyst findings that many firms citing AI for cuts lacked mature AI able to do the work count as evidence for both halves of the claim.
support_condition: Independent analysts or researchers find that, in 2025, firms commonly attributed layoffs to AI without having AI ready to do the work, or used AI as cover for cuts made for other reasons, and that executives commonly misjudged AI's readiness.
contradiction_condition: Independent evidence shows that AI-attributed layoffs in 2025 were generally backed by AI actually doing the work, or that AI was rarely invoked to justify layoffs at all.
measurement_requirements: Independent research or analyst reports on 2025 layoff attributions and on whether AI was actually replacing the eliminated work.
source_requirements: Independent research firms, economists, layoff trackers, or reputable news reports of them. Not Marcus's own writing.
metric_scope: null
