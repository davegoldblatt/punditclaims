assessment_axis: forecast_outcome
explicit_source_elements:
  - fully autonomous (Level 5) driverless cars
  - safely taking us from any old point A to any old point B
  - any time soon
evaluator_interpretation:
  - The target is unrestricted Level 5 driving under conditions a competent human driver could handle. Geographically restricted driverless services do not meet that threshold.
  - Arrival means demonstrated deployment for passenger transport, rather than an announcement or a selected demonstration.
  - Any time soon expresses a near-term forecast but supplies no determinate deadline. October 2026 is the evaluation cutoff, not a deadline Marcus supplied.
  - Safely does not mean that a vehicle must be incapable of ever having an accident.
support_condition: Reliable deployment records show that qualifying Level 5 vehicles did not arrive throughout the intended near-term period. A final supportive judgment requires a defensible endpoint for that period.
contradiction_condition: Independent evidence establishes deployment of safe, unrestricted Level 5 passenger vehicles sufficiently close to publication to fall clearly within the ordinary meaning of any time soon.
measurement_requirements: Verify actual operation, operating restrictions, human intervention requirements, and safety evidence. A driverless label alone is insufficient.
source_requirements: Prefer regulatory deployment records and independently examined operational evidence. Company announcements and expert opinions alone cannot establish unrestricted Level 5 capability or its worldwide absence.
metric_scope: null
original_horizon: any time soon
horizon_interval:
  start: 2022-06-15
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: A verified Level 5 deployment soon enough after June 15, 2022 to contradict any reasonable ordinary reading of the phrase could settle the forecast against it. Continued nondeployment cannot conclusively settle a negative forecast whose endpoint remains unspecified.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - Any time soon has no fixed endpoint.
  - Arrival could mean initial deployment or widespread availability.
  - No numerical safety threshold is stated.
retrospective_or_prospective: retrospective
