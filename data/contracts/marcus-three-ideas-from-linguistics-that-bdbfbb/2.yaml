assessment_axis: historical_observation
explicit_source_elements:
  - The “states” that such systems visit
  - lack reference
  - lack ties to dynamically updated cognitive models
  - refer to an external world, or an update-able cognitive model thereof
evaluator_interpretation:
  - Reference means reference to the external world, as the surrounding text explicitly states. Tracking an entity mentioned in a passage is not sufficient by itself.
  - The ordinary reading of dynamically updated cognitive models is internal representations of the world that can change as relevant information changes. No particular architecture or benchmark is imposed.
  - Such systems refers to the contemporary neural language systems discussed in the footnote, including GPT-3. It is not expanded to every neural system or to later models.
  - Because this describes an ongoing technical state without a reporting cycle, the target is a snapshot of systems current on the post date, 2022-06-22.
  - Pretty is treated as rhetorical description, not a separately measurable proposition.
support_condition: Evidence about the intended contemporary systems establishes both that their states lack external-world reference and that they lack ties to dynamically updated representations of that world. Failure on selected prompts or absence of a named architectural module alone is insufficient.
contradiction_condition: Evidence establishes external-world reference or ties to dynamically updated cognitive models in an in-scope system as it existed at the post date. Discourse tracking, semantic similarity, or task-specific state changes alone are insufficient.
measurement_requirements: Identify the model and historical version. Explain how the evidence distinguishes external-world reference from textual association, and world-model updating from ordinary changes in activations or discourse tracking.
source_requirements: Primary analyses, controlled experiments, or technical records concerning systems current at the post date. Later publications may inform the assessment only when their findings concern those historical systems; philosophical arguments alone are context.
