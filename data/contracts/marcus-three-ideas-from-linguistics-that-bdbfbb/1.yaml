assessment_axis: historical_observation
explicit_source_elements:
  - The “states” that such systems visit
  - lack reference
  - lack ties to dynamically updated cognitive models
evaluator_interpretation:
  - The scope is contemporary text-based neural language systems discussed in the footnote, with GPT-3 as its example; it is not every neural network.
  - For an empirical test, read reference as linking expressions to discourse entities, and dynamic models as representations that update entity properties and relations when the described situation changes.
  - This operational interpretation does not settle the stronger philosophical question of reference to an external world.
  - Use June 2022 through publication as the contemporaneous observation period because the post identifies no testing interval.
  - The description of which systems are meant is a scope restriction, not a conditional forecast.
support_condition: Controlled analyses of identified in-scope checkpoints establish the claimed absence of referent-linked, dynamically updated representations across representative tasks, beyond isolated failures or unsuccessful probes.
contradiction_condition: Controlled decoding and intervention studies of identified in-scope checkpoints demonstrate referent-linked state updates that affect subsequent processing, thereby contradicting the categorical absence under the operational reading.
measurement_requirements: Identify checkpoints and training conditions. Control for unchanged entities, lexical shortcuts, probe learning and memorization; distinguish successful internal-state tracking from surface output accuracy.
source_requirements: Primary probing or intervention studies with reproducible methods and a documented connection to the systems and period described.
