evaluator_interpretation:
  - Assess whether the launch-period LAM used Playwright to perform users' requested app actions. Finding Playwright only in the login mechanism is insufficient.
  - The claim does not necessarily mean that no AI existed anywhere in Rabbit's system.
  - Use the launch and scrutiny period from April 23 through the May 13 post. The wording supplies no precise observation window.
  - The author's unnamed private confirmations cannot independently establish the technical claim.
support_condition: Authenticated code, direct inspection or a dated technical disclosure establishes that the launch-period app-action mechanism repurposed Playwright.
contradiction_condition: Authenticated implementation evidence establishes that the relevant app actions did not use Playwright and that the cited code concerned a separate function.
measurement_requirements: Distinguish authentication containers, browser execution tools and the mechanism that selects app actions.
source_requirements: Prefer authenticated source code and firsthand technical inspection. A partial code leak cannot establish the contents of components it omits.
