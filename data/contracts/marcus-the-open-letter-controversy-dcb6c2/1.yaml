explicit_source_elements:
  - LLMs are unreliable
evaluator_interpretation:
  - In the adjacent factuality context, unreliable means that contemporary LLMs could produce material factual or reasoning errors and should not be trusted without checking.
  - The statement does not mean that every answer is wrong or that LLMs fail at every task.
  - The current-state assessment uses March 1–30, 2023, the latest publication-month evidence through the post date.
support_condition: Contemporary leading LLMs have documented factual or reasoning failures that prevent dependable unchecked use.
contradiction_condition: Representative evaluations establish dependable factual and reasoning performance across ordinary uses without material recurring errors or a need for verification.
measurement_requirements: Assess factual and reasoning reliability in context. Distinguish improvement over earlier models from dependable absolute performance.
source_requirements: Contemporary evaluations or detailed developer disclosures identifying the models and their limitations.
