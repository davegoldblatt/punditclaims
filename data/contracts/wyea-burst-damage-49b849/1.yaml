early_resolution_rule: A dated, verified commercial event can settle a clause against the forecast only if it establishes search-specific purchases at the stated annual price or clearly aggressive advertising on paid search access. A launch price, a bundled subscription, or an advertising pilot alone does not qualify.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - I can’t imagine expresses likelihood rather than an explicit absolute prediction.
  - Aggressively has no stated frequency or intrusiveness threshold.
  - Search-specific payment versus payment for a bundle containing search.
  - Whether if OpenAI does charge includes bundled access.
  - No accounting basis for the hypothetical annual payment.
