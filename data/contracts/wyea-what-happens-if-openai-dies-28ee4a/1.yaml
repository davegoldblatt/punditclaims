assessment_axis: forecast_outcome
explicit_source_elements:
  - leave 2026
  - somewhere in the region of $75 billion
  - annualized revenue
  - to have even a snowball’s chance of paying its ridiculous compute costs
evaluator_interpretation:
  - This asserts a necessary revenue threshold for paying compute obligations. It does not predict that OpenAI will reach $75 billion.
  - The revenue checkpoint is December 31, 2026. Subsequent payment performance may be needed to evaluate the asserted necessity.
  - Read 'any chance' as financial feasibility, allowing for cash, financing and the timing of obligations.
  - The purpose clause does not identify a separate external antecedent that must first occur.
  - No precise tolerance around $75 billion or accounting basis is supplied. A contradiction would require revenue clearly below the approximate threshold, not a borderline difference.
support_condition: A substantiated funding and payment analysis establishes that OpenAI could not feasibly meet the identified compute obligations with an exit-2026 annualized revenue level materially below roughly $75 billion.
contradiction_condition: OpenAI exits 2026 materially below roughly $75 billion annualized revenue and nevertheless meets the relevant compute obligations, or binding funding arrangements establish its ability to do so without that revenue threshold.
measurement_requirements: Measure the year-end annualized revenue run rate, not total 2026 revenue. Compare dated compute payments with cash resources, financing and other required expenditures.
source_requirements: Reliable year-end revenue disclosure, contractual payment schedules, and evidence of payment or secured funding. Fundraising alone cannot establish that all relevant obligations are payable.
metric_scope:
  company: OpenAI
  metric: Year-end annualized revenue run rate required for compute-payment feasibility
  currency: USD
  units: billions per year
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-12-31
  period_end: 2026-12-31
  stock_or_flow: flow
  annualized_or_realized: annualized
  gross_or_net: not_applicable
original_horizon: leave 2026
horizon_interval:
  start: 2026-08-18
  end: 2026-12-31
  precision: day
target_period: null
condition_status: unknown
early_resolution_rule: Resolve early only if binding arrangements comprehensively establish that the relevant compute obligations can be paid without the asserted revenue threshold. Interim revenue, announced fundraising or financial distress alone is insufficient.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Approximate threshold without a tolerance
  - Compute obligations and their payment horizon are not precisely identified
  - Revenue accounting basis unspecified
  - Revenue checkpoint precedes potentially necessary payment evidence
  - No separate antecedent despite classification as a conditional forecast
retrospective_or_prospective: prospective
