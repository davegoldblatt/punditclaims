assessment_axis: historical_observation
explicit_source_elements:
  - For years
  - GPT-5 was going to land imminently
  - those predictions turned out to be wrong so often
evaluator_interpretation:
  - The claim concerns publicly circulated release expectations, not necessarily promises by OpenAI.
  - Repeatedly means multiple distinct episodes of premature release expectations across years. Reprints of one report do not count as separate episodes.
  - The historical period ends on the post date. Its beginning is unspecified.
  - The words 'endlessly' and 'so often' emphasize repetition rather than specify a measurable frequency.
support_condition: Dated publications across multiple years predict a near-term GPT-5 release, and subsequent records establish that GPT-5 remained unreleased after those anticipated windows.
contradiction_condition: The cited expectations were fulfilled, concerned training rather than release, or do not establish multiple distinct episodes of premature release expectations.
measurement_requirements: Distinguish public release from training completion, demonstrations, and differently named models. Preserve qualifications in the original predictions.
source_requirements: Contemporaneous records of predictions and subsequent release status. Marcus's own retrospective accounts cannot establish the outcome.
