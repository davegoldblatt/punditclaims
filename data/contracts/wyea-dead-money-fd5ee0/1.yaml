  - repricing CoreWeave at today’s rates
  - increase its costs by 35.8%
  - adding $1.2 billion
  - lifetime cost of the bonds
evaluator_interpretation:
  - Today means September 29, 2026.
  - Costs means undiscounted lifetime cash interest, with the percentage increase measured against original lifetime interest.
  - Hold principal and original tenor constant when comparing hypothetical replacement bonds with their original terms.
  - Assess the bond basket discussed in context; resolve the heading's 2025 scope against the body's reference to 2025 and 2026.
  - The $640 million quarterly-interest aside is outside the screened normalized proposition and cannot establish the repricing result.
  - The metric dates identify the repricing date, not the full interest-payment period.
support_condition: For one consistently identified bond basket, the additional lifetime interest rounds to $1.2 billion and the increase over original lifetime interest rounds to 35.8%.
contradiction_condition: A reproducible calculation using matching principal amounts, original terms and September 29, 2026 replacement yields places either result outside its stated rounding interval.
measurement_requirements: Calculate original interest as the sum of principal times coupon times tenor, and incremental interest as the sum of principal times replacement-minus-original coupon times tenor. Divide incremental interest by original interest for the percentage increase. Explain treatment of reopenings and partial years.
source_requirements: Issuer documents for every included tranche and independently dated publication-date market yields. Do not treat total corporate interest expense as bond-basket interest.
