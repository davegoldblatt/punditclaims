explicit_source_elements:
  - A few hours after I posted this
  - Cruise CEO Kyle Vogt essentially confirmed
  - need very regular human intervention
evaluator_interpretation:
  - The plain reading is that Vogt acknowledged recurring human assistance as part of ordinary driverless operations, including confirmations and navigation guidance.
  - Human intervention does not necessarily mean remote steering or a safety-critical rescue. Requests resolved before a person responds do not themselves establish human intervention.
  - The target is the statement described in the update. November 4–5 accommodates a statement a few hours after the November 4 post crossing a calendar-day or timezone boundary.
  - Very regular is treated as recurring operational assistance, not as a numerical threshold or an assertion that humans controlled vehicles most of the time.
support_condition: Vogt’s statement acknowledges recurring actual human assistance during driverless operation.
contradiction_condition: Vogt denies recurring human assistance, or the statement establishes only automated requests without acknowledging actual human input.
measurement_requirements: Keep time spent in assistance sessions separate from the frequency of requests and from the frequency of completed human interventions.
source_requirements: Vogt’s contemporaneous statement, or reputable reporting quoting it and verifying its authorship with Cruise.
