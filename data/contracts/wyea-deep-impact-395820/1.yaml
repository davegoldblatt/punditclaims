assessment_axis: historical_observation
explicit_source_elements:
  - DeepSeek's models actually exist, they work
  - independently verified to be competitive in performance
  - magnitudes cheaper in price
  - "than those from both hyperscalers (EG: Google's Gemini, Meta's Llama, Amazon Q, etc.) and from OpenAI and Anthropic"
evaluator_interpretation:
  - "'DeepSeek's models' means V3 and R1, the models discussed in the post."
  - "'Magnitudes cheaper' is read as at least about ten times cheaper per token in API list prices. The plural suggests more."
  - The comparison set as written is models from the hyperscalers (Gemini is named) and from OpenAI and Anthropic. The test is whether DeepSeek was that much cheaper across those providers' offerings, and at minimum against their peer models.
  - "'Independently verified competitive' is read as third-party testing finding performance broadly comparable to leading models."
  - The period runs from V3's release (2024-12-26) to the post date (2025-01-29).
support_condition: Third-party testing found DeepSeek's models competitive, and their API prices were about ten times lower or more than those of the named providers' models.
contradiction_condition: Third-party testing found them clearly not competitive, or the named providers offered models priced about the same as or below DeepSeek's.
measurement_requirements: Published USD list prices per million tokens around January 2025 for DeepSeek V3 and R1, and for OpenAI, Anthropic and Google models. Third-party evaluations of the period.
source_requirements: Archived company pricing pages and independent evaluations or user reports.
metric_scope:
  company: DeepSeek
  metric: API list price per million tokens for V3 and R1, as a ratio to rival providers' list prices
  currency: USD
  units: USD per 1M tokens; price ratio
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
