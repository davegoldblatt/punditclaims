  - a single announced data center
  - from the last three years
  - got turned on
  - outside of its Fairwater Atlanta and Wisconsin sites
  - I’ve failed to find
evaluator_interpretation:
  - Read the sentence with the surrounding categorical statements as a claim about the absence of publicly documented qualifying openings, rather than an assessment of his private search.
  - The announcement window is May 12, 2023 through May 12, 2026; operation must have begun by publication.
  - Require the announcement and operational evidence to identify the same facility.
  - The post's distinction between completed facilities and partial campus openings must be retained. Construction completion alone does not establish operation.
  - The introductory four-gigawatt attribution is background to this selected claim, not a separate claim scored here.
support_condition: A sufficiently complete record of projects announced during the window establishes that none outside the two Fairwater sites had a completed, operational qualifying facility by publication.
contradiction_condition: A matched announcement and operational record establishes at least one qualifying completed facility outside the two Fairwater sites by publication.
measurement_requirements: Project identity, announcement date, actual commissioning date, and the scope completed and operating.
source_requirements: Prefer company opening announcements, commissioning records, or utility records. Reporting must distinguish actual operation from planned completion.
