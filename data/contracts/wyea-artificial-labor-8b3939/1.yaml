evaluator_interpretation:
  - Assess the supplied proposition about a cause of the strike, not the separate assertion about share-value losses.
  - The claim requires both a material dispute over AI writing and evidence that executives sought that capability. Rejection of restrictions is relevant but does not uniquely establish their motives.
  - "Use May 1–12, 2023: the negotiating positions immediately before the strike and the situation described at publication."
support_condition: Negotiation records establish that executives' desire to retain AI writing capabilities materially contributed to the failure to reach an agreement and the resulting strike.
contradiction_condition: Reliable records establish that AI writing was not a material disputed issue, or that the attributed executive objective was materially mistaken.
measurement_requirements: Distinguish bargaining positions, participants' stated reasons, and independently established motives. Evidence of a dispute alone settles only part of the claim.
source_requirements: Contemporaneous bargaining documents and statements from both parties; corroborated reporting or internal records for the attributed motive.
