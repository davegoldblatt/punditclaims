assessment_axis: historical_observation
explicit_source_elements:
  - Over half a trillion dollars
  - has gone into an entire industry
  - without a single profitable company
  - developing models or products built on top of models
evaluator_interpretation:
  - The investment claim concerns money actually invested through publication, not announced future commitments or company valuations.
  - The ordinary reading of profitable is company-level earnings after expenses, not revenue, gross margin, or positive cash flow alone.
  - In context, the relevant companies are generative-AI model and product businesses. Profits from unrelated businesses of diversified parents do not establish profitability of their generative-AI operations.
  - The investment period is cumulative through publication. For ongoing profitability, use each company's latest publicly reportable financial period before publication, ordinarily the quarter ending June 2025; the speaker specifies no common reporting period.
  - The surrounding revenue estimate does not establish an accounting basis for either the investment total or the universal profitability assertion.
support_condition: A reconciled total exceeding USD 500 billion actually invested in generative AI through publication, together with sufficiently comprehensive financial evidence that no relevant model or model-product company was profitable.
contradiction_condition: A reliable, scope-matched investment total of USD 500 billion or less, or a relevant company reporting positive company-level earnings for the applicable period. A smaller investment subtotal or a diversified parent's unrelated profits would not suffice.
measurement_requirements: Define the industry boundary, distinguish financing from capital expenditure, eliminate double counting, and distinguish completed investment from future commitments. Identify the period and accounting meaning of every profitability figure.
source_requirements: Prefer financial statements and financing disclosures. Private-company reporting may be used with its attribution and limitations preserved. An unknown accounting basis prevents a supported or contradicted money score.
