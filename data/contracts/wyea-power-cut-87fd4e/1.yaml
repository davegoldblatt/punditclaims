explicit_source_elements:
  - based on TD Cowen's analysis
  - canceled leases
  - deliberate expiration of Letters of Intent
  - effectively abandoned data center expansion
  - over 14% of its current capacity
evaluator_interpretation:
  - Abandoned expansion includes proposed projects and expired agreements, as the speaker explicitly specifies; it does not mean operating facilities were closed.
  - The comparison requires abandoned prospective capacity divided by Microsoft's contemporaneous operating capacity, measured on a comparable power basis.
  - The target period covers the latest February reporting through the post date. It describes the reported state of the expansion pipeline, not necessarily the dates every agreement expired.
  - The contextual 6–7 GW denominator is an estimate requiring verification, not an established measurement.
support_condition: Comparable capacity records establish that the abandoned expansion exceeded 14% of Microsoft's operating capacity at the time, without double-counting projects.
contradiction_condition: Comparable records establish that the abandoned expansion was no more than 14% of contemporaneous operating capacity.
measurement_requirements: Verify both numerator and denominator in comparable GW of capacity. Distinguish IT load from total facility power, proposed capacity from operating capacity, and overlapping agreements from separate projects.
source_requirements: Prefer Microsoft's capacity records and TD Cowen's original analysis. Reputable reporting may establish what the unavailable analyst report said, with that limitation disclosed.
