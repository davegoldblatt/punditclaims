explicit_source_elements:
  - "to the Senate, May 2023: Please regulate us"
  - revealed a few weeks later
  - behind the scenes
  - try hard to water down your regulations
evaluator_interpretation:
  - Read this as a retrospective description of lobbying revealed after the hearing, despite the satirical future tense.
  - Watering down means seeking narrower coverage, exemptions, or fewer binding obligations than a proposed regulatory text.
  - Read regulations broadly enough to include the EU AI Act. A claim specifically about a U.S. Senate proposal would require different evidence.
  - The target includes the earlier lobbying subsequently revealed in June 2023; Marcus supplies no starting date.
  - Assess documented efforts, not their intensity, success, or sincerity.
support_condition: The hearing shows public support for regulation, and records show nonpublic efforts to narrow proposed AI regulatory obligations during the episode subsequently reported.
contradiction_condition: The alleged lobbying records show no effort to narrow obligations, or establish that the reported private proposals instead sought equally strict or stronger coverage.
measurement_requirements: Compare requested changes with the proposed rules. Distinguish the date of lobbying from the date it was reported.
source_requirements: The Senate record and regulatory submissions, official meeting records, or reputable reporting based on those documents.
