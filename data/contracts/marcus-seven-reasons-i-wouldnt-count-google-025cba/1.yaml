explicit_source_elements:
  - Only a small number of companies
  - Meta, Microsoft, Amazon, maybe a few in China
  - can match
  - sheer compute and expertise building distributed systems
evaluator_interpretation:
  - The ordinary reading is that Google's peers on both usable computing capacity and demonstrated large-scale systems engineering form a small group.
  - The named companies are examples, not an exhaustive list.
  - Capacity includes resources a company can reliably use, including rentals; ownership alone is not sufficient.
  - Use April through June 2026, the latest completed reporting quarter before the post, for the ongoing company-capacity comparison.
  - Do not invent a numerical cutoff for 'small number' or a narrow performance ratio for 'match'. An assessment requires a clear result across reasonable comparisons.
support_condition: Broad company comparisons show that only a handful have capacity comparable to Google's and demonstrated ability to build and operate distributed systems at a similar scale.
contradiction_condition: Broad comparisons show a substantially larger group matching Google on both dimensions, or show that the named core examples do not meet the comparison.
measurement_requirements: Compare deployed usable capacity on a consistent basis, distinguish ownership from use and planned from operational hardware, and assess systems expertise separately from spending.
source_requirements: Independent capacity estimates and primary technical deployment records with sufficient company and geographic coverage.
