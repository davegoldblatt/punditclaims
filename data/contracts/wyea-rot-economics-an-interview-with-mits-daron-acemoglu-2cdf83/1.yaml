explicit_source_elements:
  - a pattern of slowing growth
  - within these companies
  - there isn't a new thing
  - pick up and acquire
evaluator_interpretation:
  - The ordinary financial reading is slowing company revenue growth, coupled with a lack of new businesses or technologies capable of sustaining growth.
  - "Revenue is an evaluator-selected proxy: Zitron did not specify revenue, earnings, users, or another measure."
  - For the ongoing financial observation, use January–March 2024 as the latest common reported quarter for a comparable big-tech panel before the post. This common-quarter convention need not be the latest individual report for every company.
  - Microsoft is explicitly named in the surrounding discussion. Apple, Alphabet, Amazon, and Meta are plausible additional members, but the speaker supplies no closed list.
  - A new product announcement alone cannot establish a commercially meaningful growth engine or an available acquisition.
  - No accounting basis is indicated by the claim, so it remains unknown and the financial proposition cannot receive a supported or contradicted score.
support_condition: A defined company panel shows sustained deceleration on the same financial measure and basis, and a bounded assessment of opportunities supports the absence of a qualifying new growth business.
contradiction_condition: Comparable records defeat the asserted broad deceleration pattern, or an identifiable available business meets a stated commercial threshold for the new growth opportunity he says is absent.
measurement_requirements: Specify companies, financial measure, accounting basis, comparison years or quarters, treatment of acquisitions and currency, and what scale of opportunity qualifies.
source_requirements: Company filings or earnings disclosures for comparable periods, plus dated evidence about acquisition availability and commercially demonstrated opportunities.
