explicit_source_elements:
  - I don’t really think
  - the big picture that human radiologists do
  - better on vision than understanding the case files and notes
evaluator_interpretation:
  - I assess the functional comparison, not whether machines possess subjective understanding.
  - Big picture means integrating imaging findings with patient history and clinical notes to reach an appropriate diagnosis.
  - Better on vision means stronger relative performance on image interpretation than on clinical-context integration.
  - For this ongoing capability claim, I use the latest pre-post reporting window, 2023 through 2023-10-10. This field has no standard quarterly reporting period.
support_condition: Matched evaluations of contemporary systems show stronger performance on image interpretation than clinical-context integration, with radiologists superior on integrated cases.
contradiction_condition: Matched evaluations show that contemporary AI matches or exceeds radiologists on integrated cases and does not exhibit the claimed relative weakness in clinical-context interpretation.
measurement_requirements: Evaluate comparable systems and cases with images, clinical records, and both together. Include radiologist comparators and measures of diagnostic correctness and clinically significant errors.
source_requirements: Primary evaluations of systems available by 2023-10-10. Exam summaries can provide context but cannot substitute for matched clinical comparisons.
