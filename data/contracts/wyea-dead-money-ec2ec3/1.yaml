explicit_source_elements:
  - that’s absolutely what’s happening
  - suggesting
  - more like
  - five or six large companies (hyperscalers)
  - feeding money to two companies (NVIDIA and Broadcom)
  - feed money to two companies (Anthropic and OpenAI)
  - feed that money back to them whenever capacity comes online
evaluator_interpretation:
  - "The analogy contains a checkable factual core: recurring financial relationships connect hyperscaler chip purchases, supplier financing of the labs, and lab payments for compute."
  - Suggesting and more like qualify the broader characterization. They are not antecedent conditions for a forecast.
  - Use 2026-04-01 through 2026-06-30, the latest completed calendar quarter before publication, for the ongoing financial flows.
  - The plain reading does not require tracing particular banknotes. It does require evidence for each material link and its timing, rather than treating every commitment as a completed payment.
  - The wording does not by itself establish fraud, fictitious sales, or the absence of independent customer demand.
support_condition: Disclosures establish material recurring flows through the described links in the selected period, including supplier financing and corresponding lab purchases as capacity becomes available.
contradiction_condition: Comparable records establish that material links in the described chain did not occur, or that the asserted recurring payment pattern is materially inconsistent with the actual financing and purchasing arrangements.
measurement_requirements: Separate chip revenue, equity investment, lending, guarantees, compute purchase commitments, and actual service payments. Establish counterparties, execution dates, and whether financing is linked to purchases.
source_requirements: Filings, investment disclosures, chip sales records, and executed compute contracts from the participating firms, preferably corroborated across counterparties.
