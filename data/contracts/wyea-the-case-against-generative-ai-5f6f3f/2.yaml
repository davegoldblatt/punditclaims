explicit_source_elements:
  - In the current relationship
  - OpenAI does not have the money
  - to pay Oracle
  - "Context: $300 Billion It Owes Oracle"
evaluator_interpretation:
  - The claim concerns whether OpenAI's resources secured as of September 29, 2025 could fund the Oracle commitments described in the September deal reports.
  - The comparison covers the promised Oracle commitment, not merely invoices already payable on publication day.
  - Use cash, liquid assets, and binding financing available under the arrangements then in force. Distinguish them from contingent investment intentions and hoped-for future fundraising.
  - Payment timing matters when assessing whether secured resources cover the commitment. Do not assume the whole contract was immediately payable.
  - A June 30 balance cannot substitute for the September publication-date financial state.
  - The claim is about existing funding sufficiency, not an unconditional prediction of future default.
support_condition: A September 29 funding position and the applicable Oracle terms establish that existing cash and secured financing were insufficient to fund the promised Oracle commitment.
contradiction_condition: The same-date records establish sufficient cash or binding funding arrangements to cover that commitment under its payment terms.
measurement_requirements: Reconcile September cash, liquid assets, financing conditions, restricted funds, competing commitments, and Oracle's contract value and payment schedule. Do not compare annualized revenue with cash or treat a valuation as financing.
source_requirements: Prefer the contract, financial statements, financing agreements, and contemporaneous company disclosures. Clearly attribute press estimates where private records are unavailable.
