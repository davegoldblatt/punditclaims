assessment_axis: historical_observation
explicit_source_elements:
  - More than 37%
  - all US household wealth
  - tied up in a US stock market
  - pumped full of hot air
  - often framed as a skeptic, a cynic or somehow ignorant
evaluator_interpretation:
  - Read wealth as aggregate household net worth, not gross assets, financial assets alone, or the holdings of a typical household.
  - Read stock-market exposure as directly and indirectly held publicly traded equity, without counting fund holdings twice.
  - The geographic phrase refers to the US stock market; a broader total containing foreign and closely held corporate equity is a comparison, not an exact match.
  - Because this is an ongoing-state assertion, use Q2 2026, the latest quarter covered by the Federal Reserve release available before the post.
  - Read 'pumped full of hot air' as an overvaluation judgment. No valuation benchmark is supplied.
  - Read 'often framed' as a claim of recurring public characterization. Isolated examples cannot establish its frequency.
support_condition: Comparable household balance-sheet data show that US stock-market exposure exceeded 37% of household net worth in Q2 2026. Supporting the remaining clauses would additionally require a defensible valuation comparison and representative evidence of recurring characterizations of critics.
contradiction_condition: Comparable data place the specified stock-market exposure at 37% or less. The other clauses require a defined valuation benchmark and coverage population before a contrary result can fairly be established.
measurement_requirements: Use the same date and household population for numerator and denominator; separate listed US equity from foreign and closely held equity; include indirect exposure without double counting. Do not infer overvaluation or treatment of critics from portfolio concentration.
source_requirements: Federal Reserve balance sheets and instrument definitions for the percentage. Valuation research and a defined sample of public coverage would be needed for the additional assertions.
