assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft was allowing users
  - more than their subscription costs in tokens
  - every single month for three years
evaluator_interpretation:
  - The ordinary reading is that heavy users could incur inference costs exceeding their monthly fees. It does not require every subscriber to do so.
  - Three years means approximately the three years preceding publication, represented as April 28, 2023 through April 28, 2026.
  - The surrounding discussion of subsidies and losses makes Microsoft's actual costs the relevant measure. Retail API-equivalent prices alone are insufficient.
  - The accounting basis is estimate because Zitron explicitly relies on press reporting about internal costs.
support_condition: Historical plan allowances and credible actual-cost records establish that users could consume more than their subscription fees in each month throughout the stated interval.
contradiction_condition: Comparable records establish an intervening period when enforced allowances prevented subscribers from incurring inference costs above their fees. Overall service profitability alone would not establish this.
measurement_requirements: Monthly subscription fees, permitted usage, enforced limits, model mix, caching and Microsoft's actual inference costs. Distinguish individual heavy users from average users and service-wide results.
source_requirements: Historical company records or credible reporting based on internal cost records. A pricing change or retail token-price comparison cannot establish three years of continuous subsidy.
