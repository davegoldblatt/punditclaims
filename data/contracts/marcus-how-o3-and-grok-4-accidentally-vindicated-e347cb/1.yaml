evaluator_interpretation:
  - Them refers to LLMs. The ordinary reading is an overwhelming share of AI funding directed solely toward increasing LLM scale.
  - Funding a company that develops LLMs does not establish that its money was devoted solely to larger models.
  - Use calendar 2024 as the latest complete annual funding period publicly reportable before the post. The alternative cumulative reading has no specified starting date.
  - This is an aggregate sector allocation claim, not a financial figure for a named company; metric_scope is null.
support_condition: Comparable funding and allocation records show that an overwhelming share of AI funding was directed solely toward increasing LLM size or pretraining scale.
contradiction_condition: Comparable records establish that a substantial share of the same funding total was allocated to other purposes.
measurement_requirements: Specify the funding denominator, geographic coverage, treatment of public and private funding, and allocation by purpose. Distinguish financing, expenditure, infrastructure, inference, research, and final training runs.
source_requirements: Comprehensive investment records combined with documented allocations of funds. Company valuations and fundraising totals alone are insufficient.
