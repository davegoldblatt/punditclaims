assessment_axis: forecast_outcome
explicit_source_elements:
  - Assuming a burn rate of even $3 billion a year
  - would still have to raise more capital than anyone has ever raised
  - for as long as it takes to either increase revenues or reduce costs
evaluator_interpretation:
  - Treat the $3 billion annual burn as an antecedent that must be established before scoring the forecast.
  - Read burn as net cash consumption, rather than accounting losses or gross spending.
  - Read the financing claim as a claim about necessary external capital, not merely the amount investors might supply.
  - The surrounding discussion permits multiple rounds, so cumulative financing is a plausible reading. A record for an individual round is another plausible reading; neither is silently substituted for the other.
  - No deadline is supplied. The statement about a few years elsewhere in the context does not establish a deadline for this conditional claim.
support_condition: After the assumed annual burn is established, financial records show that continuing operations required external capital exceeding the relevant historical fundraising record during the conditional episode.
contradiction_condition: After the assumed annual burn is established, a completed conditional episode and financial records show that operations could be financed without exceeding the relevant historical record.
measurement_requirements: Comparable cash-flow records, cash balances, financing proceeds and commitments, revenue and cost changes, and historical fundraising totals. Separate necessary funding from funding actually raised, and committed capital from cash received.
source_requirements: Prefer company financial disclosures and financing announcements. Independently reported financial documents may be used with their accounting limitations stated.
