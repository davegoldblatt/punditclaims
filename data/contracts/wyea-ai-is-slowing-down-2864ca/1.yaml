assessment_axis: causal_assessment
explicit_source_elements:
  - do as much AI as possible or we’ll fire you
  - forcing them to use these tools day-in-day-out
  - has radicalized them against you
  - any major tech company
evaluator_interpretation:
  - Radicalized means materially increased hostility, distrust or organized opposition toward leadership. It does not require political extremism.
  - The claim concerns employees exposed to compulsory AI use and associated employment pressure at major technology companies.
  - The surrounding generalization requires evidence of a broad pattern, rather than merely one dissatisfied employee or workplace.
  - Has radicalized describes a causal change already occurring by June 8, 2026. No starting date is specified, so the target period has an open start.
  - General dissatisfaction with AI, layoffs or working conditions is insufficient unless the evidence connects increased opposition to the mandates.
support_condition: Credible employee testimony across multiple major technology employers, representative surveys or longitudinal comparisons show that compulsory AI use and employment threats materially increased opposition to leadership, with plausible alternative causes addressed.
contradiction_condition: Comparable evidence among employees exposed to mandates finds no material increase in opposition, or shows that the alleged change preceded the mandates or was attributable to other causes.
measurement_requirements: Measure exposure to mandates, prior and subsequent attitudes toward leadership, prevalence across employers, and competing explanations such as layoffs, workload and pre-existing distrust.
source_requirements: Employee testimony with verifiable provenance, transparent surveys, or research comparing attitudes before and after mandates or across otherwise comparable workplaces.
