explicit_source_elements:
  - AI had become load-bearing for the entire stock market
  - the only people making money on AI were NVIDIA and other semiconductor companies
evaluator_interpretation:
  - The surrounding historical narrative places this claim in 2023–2024.
  - The ordinary reading of making money is earning profit attributable to AI products or services.
  - Load-bearing means AI-linked companies materially sustained broad stock-market gains. US equity indexes are the working measure because the discussion centers on NVIDIA.
  - The passage supplies no accounting basis for its industry-wide profit claim. Under the specified money-claim rules, that prevents a supported or contradicted verdict.
support_condition: Comparable AI-specific profit evidence establishes that profits were confined to semiconductor companies, and index attribution establishes substantial dependence on AI-linked companies during 2023–2024.
contradiction_condition: A non-semiconductor company earned AI-specific profits on a comparable basis during the period, or broad index attribution contradicts the asserted market dependence.
measurement_requirements: Separate AI profits from company-wide profits, revenue, financing and annualized run rates. Separate stock-return attribution from proof that AI caused those returns.
source_requirements: Prefer financial disclosures and index-provider measurements. Clearly identify private-company profit reports that lack published accounts.
