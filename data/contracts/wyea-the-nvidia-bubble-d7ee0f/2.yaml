assessment_axis: historical_observation
explicit_source_elements:
  - AI had become load-bearing for the entire stock market
  - the only people making money on AI were NVIDIA and other semiconductor companies
evaluator_interpretation:
  - The surrounding discussion places this observation in 2023–2024, rather than November 2026.
  - The ordinary reading of 'load-bearing' is that AI-related companies contributed disproportionately to broad stock-market gains. It does not mean every stock depended on AI.
  - The ordinary reading of 'making money on AI' is earning profits from AI products or services, rather than merely receiving revenue or financing.
  - A profitable non-semiconductor AI business would challenge the exclusivity claim. Profits from unrelated businesses would not.
  - The supplied passage identifies no accounting basis for the profitability assertion. The current money-claim rule therefore limits a definitive financial grade; this is separate from the substantive ordinary-reading test.
support_condition: Market-return attribution shows that AI-related companies carried a substantial share of broad-market gains, and reliable profitability evidence establishes that profits from AI businesses were confined to semiconductor companies during 2023–2024.
contradiction_condition: Reliable evidence identifies a non-semiconductor business earning profits from AI products or services during 2023–2024, or market attribution shows that AI-related companies did not materially carry broad-market gains.
measurement_requirements: Distinguish stock-return concentration from attribution specifically to AI. Distinguish profit from revenue, financing, gross margin, and profits from unrelated business lines.
source_requirements: Prefer index-provider attribution and company financial disclosures. Clearly identify secondhand reporting about private-company profitability.
