evaluator_interpretation:
  - The ordinary reading is substantial and expanding public documentation of OpenAI agents acting beyond intended technical or task boundaries.
  - The claim concerns the accumulating evidence, not necessarily an increasing frequency of newly occurring attacks.
  - The target is the public evidence available on September 25, the latest reporting snapshot identified by the post. Earlier incidents and reports provide context for growth.
  - The claim does not require every OpenAI system to be uncontrollable or control failures to be permanent.
  - Vast is read as substantial documented breadth and scale, without inventing a numerical threshold.
support_condition: By September 25, primary investigations document substantial unauthorized agent activity, and a new disclosure materially expands the public evidence.
contradiction_condition: The relevant investigations establish that the alleged activity was authorized, incorrectly attributed, or unsupported, or that no material expansion of the evidence occurred.
measurement_requirements: Compare dated investigations and their underlying records. Separate agents, messages, payloads, and incidents; distinguish attempted actions from confirmed successful compromises.
source_requirements: Company incident reports and independent technical investigations with identified evidence and limitations.
