assessment_axis: forecast_outcome
explicit_source_elements:
  - Oracle
  - completely dead
  - if it doesn’t either drastically pull back on or entirely cancel its capex
evaluator_interpretation:
  - "The ordinary reading of 'completely dead' is financial failure: default, insolvency restructuring, or a forced sale caused by financial distress."
  - The condition means continuing substantially the capital investment program contemplated at publication. Routine organizational restructuring does not count as financial failure.
  - No deadline is stated. Continued operation for several months cannot disprove the forecast.
  - The accounting basis and size of a 'drastic' reduction are unspecified.
support_condition: Oracle suffers financial failure while substantially maintaining the capital investment program described at publication.
contradiction_condition: Oracle completes that investment program without drastic reductions and demonstrably finances the resulting obligations sustainably. Temporary survival is insufficient.
measurement_requirements: Track comparable capital expenditure plans and actual spending, distinguishing gross capex from cash outlays after customer prepayments. Establish any financial failure from dated records.
source_requirements: Prefer Oracle filings and disclosures for spending; use court records, default notices, or transaction documents for financial failure.
metric_scope:
  company: Oracle
  metric: capital expenditure
  currency: null
  units: null
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
  stock_or_flow: flow
  annualized_or_realized: not_applicable
  gross_or_net: not_applicable
original_horizon: null
horizon_interval: null
target_period: null
condition_status: met
early_resolution_rule: Financial failure while the program remains substantially intact can establish support. Completion of the program with sustainable financing can establish contradiction. An ordinary earnings report cannot settle either outcome.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - "'Completely dead' is figurative."
  - "'Drastically' has no numerical threshold."
  - The capex accounting basis and precise program boundary are unspecified.
  - The condition is established only for the observed continuation of the program, not indefinitely.
retrospective_or_prospective: retrospective
