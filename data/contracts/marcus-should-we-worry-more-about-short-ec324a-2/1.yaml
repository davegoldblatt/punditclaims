evaluator_interpretation:
  - The supplied normalized proposition isolates the state of technical knowledge. The separate assertion that this is the only solution is not graded here.
  - The ordinary reading of a long way is that substantial foundational problems remained, rather than a forecast of a particular number of years.
  - Consensus human values means broadly shared human values reliably reflected in machine behavior across relevant situations.
  - For this ongoing research-state observation, the target is the publication month through March 14, 2023. Research has no standard reporting quarter.
support_condition: Contemporaneous research documents substantial unresolved problems in reliably aligning powerful systems with human values, with no established validated general solution.
contradiction_condition: An established and validated method available at publication reliably implements broadly shared human values across relevant situations, leaving only routine implementation work.
measurement_requirements: Distinguish improvements on selected safety tests from reliable general alignment, and distinguish a developer's chosen policies from human consensus.
source_requirements: Contemporaneous primary research or technical disclosures describing demonstrated capabilities and unresolved alignment problems.
