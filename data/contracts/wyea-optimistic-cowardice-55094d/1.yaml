  - needs to spend tens of billions of dollars
  - it does not have
  - may not have access
  - depending on the terms of their loans and the overall state of the market
evaluator_interpretation:
  - Assess the spending obligation and funding position asserted to exist at publication, not a forecast that financing would certainly fail.
  - Tens of billions means at least approximately $20 billion of required spending attributable to serving the original OpenAI agreement.
  - The post's surrounding press-based financial projections indicate an estimate, not a stated GAAP measure.
  - Use the latest pre-post reported balance-sheet date, December 31, 2024, together with financing and contract changes disclosed through March 24, 2025.
  - Does not have concerns existing resources. Future financing may be needed without being impossible.
  - The possible-access clause is a risk qualification. It is not an independently falsifiable prediction that borrowing will fail.
support_condition: A credible budget isolates at least approximately $20 billion of necessary spending for the original OpenAI contract and shows that contemporaneously available resources fall short.
contradiction_condition: A reliable complete budget places required OpenAI-specific spending materially below that threshold, or dated funding records show the required amount was already available.
measurement_requirements: Isolate the original OpenAI project's required capital spending. Separate it from company-wide capital expenditures, operating losses, customer contract revenue, undrawn conditional credit and later expanded contracts.
source_requirements: An attributable project budget or cost estimate, contemporaneous liquidity and committed-credit records, and applicable draw conditions.
