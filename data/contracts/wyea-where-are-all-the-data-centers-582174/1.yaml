evaluator_interpretation:
  - Read this as an approximate typical construction duration for ordinary individual facilities comparable to his examples, rather than a universal deadline or a claim about fully completed gigawatt campuses.
  - The contextual period is the recent construction and opening experience discussed in the post, from 2024 through its publication date.
  - Groundbreaking starts the clock; prior land acquisition, permitting, and equipment procurement do not.
  - An industry construction benchmark can support the ordinary approximate claim, but it does not establish that a specified percentage of projects opened within an exact interval.
support_condition: Credible industry measurements or representative project evidence place the typical construction duration for comparable facilities near 18 months.
contradiction_condition: Comparable industry measurements or representative completed-project evidence establish a typical groundbreaking-to-opening duration materially different from approximately 18 months.
measurement_requirements: Comparable facility sizes and construction endpoints. Distinguish construction from predevelopment, grid-connection waiting, full-campus expansion, and customer utilization.
source_requirements: Primary industry research or verified groundbreaking and operational-opening dates. Planned completion dates alone are insufficient.
