assessment_axis: causal_assessment
explicit_source_elements:
  - SPVs only pay out to their creditors
  - in the event that customer revenue flows in
  - dependent both on the speed of construction
  - and their customers' ability to pay
evaluator_interpretation:
  - The claim is about what the SPV itself pays, not about every way a creditor could recover. The next paragraph of the post says CoreWeave stays on the hook for payments on the debt, and the post says interest during construction comes from a pre-funded reserve. A parent guarantee or the interest reserve therefore does not contradict the claim.
  - "Plain reading: in public CoreWeave SPV loan terms, debt repayment beyond the construction-period reserve is sized against, secured by, and paid from the customer contract's cash flows. Repayment starts only once the data center is built and the customer has accepted it."
  - CoreWeave's DDTL facilities are the test case, because the post names them as its main example.
support_condition: "Primary loan documents or company disclosures show three things: SPV debt is non-recourse or ring-fenced, it is secured by a customer contract, and amortization or debt-service tests start only after deployment, stabilization or customer acceptance, with customer payments servicing the debt."
contradiction_condition: Public loan terms show that the SPVs repay creditors mainly from sources unrelated to customer revenue and unrelated to construction milestones, such as fixed amortization from day one funded by the parent under full recourse.
measurement_requirements: null
source_requirements: CoreWeave investor presentations, 8-K exhibits or filings describing DDTL terms; reputable reports quoting the loan agreements.
