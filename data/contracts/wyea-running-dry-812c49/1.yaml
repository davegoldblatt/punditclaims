ambiguity_flags:
  - No numerical threshold defines 'vast majority' or 'several dollars'.
  - Subscriptions could be counted by plans, providers, or paying accounts.
  - "'Worth of tokens' could mean API retail value or provider delivery cost."
  - No current reporting period is named; Q3 2026 is the evaluator's latest-completed-quarter convention.
  - The final clause mixes an asserted historical pattern with an expectation of recurrence.
