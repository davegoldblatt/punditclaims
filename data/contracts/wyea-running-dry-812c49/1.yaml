assessment_axis: historical_observation
explicit_source_elements:
  - the vast majority of AI subscriptions
  - heavily subsidized
  - several dollars’ worth of tokens for every dollar worth of subscription
  - eating the costs to get them through the door
  - rugpull them the months or years to follow
evaluator_interpretation:
  - Read this as an asserted market-wide business pattern, including existing examples of later retrenchment, rather than a forecast about a specified future cohort.
  - The plain reading requires a large majority of paid AI subscriptions, not merely a few unusually heavy users.
  - Because the claim says providers absorb costs, subsidy requires delivery costs exceeding associated receipts. API retail value alone does not establish provider cost.
  - Read 'rugpull' as materially worse prices or usage allowances introduced to contain costs, without importing an allegation of fraud.
  - Use Q3 2026 as the latest completed quarter for current unit economics. Include the historical pattern from June 2025, which the surrounding text identifies as its beginning.
support_condition: Representative evidence establishes widespread delivery costs several times subscription receipts, an acquisition or retention rationale, and subsequent cost-driven pricing or allowance reductions across a large majority of the relevant subscriptions.
contradiction_condition: Representative evidence shows that most subscriptions cover delivery costs, or that the claimed subsidy-and-retrenchment pattern is confined to a minority.
measurement_requirements: Define the subscription population and weighting; measure actual consumption, provider delivery costs, receipts, and subsequent terms. Distinguish maximum allowances, API list prices, and actual costs.
source_requirements: Representative plan-level financial or usage evidence and dated pricing histories. Individual anecdotes and company-wide net losses are insufficient.
