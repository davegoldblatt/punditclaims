explicit_source_elements:
  - systems like DALL-E
  - understand what wheels are—or what they are for
  - as I discovered on Sunday
  - systematically fail to properly illustrate requests like these
evaluator_interpretation:
  - The plain reading is a repeatable failure to depict wheel parts and functions correctly, rather than an occasional malformed image.
  - Sunday means September 18, 2022. The claim describes systems tested then and their capabilities when the post appeared.
  - The linked essay identifies Craiyon and Stable Diffusion experiments. These must not be treated as experiments on OpenAI's DALL-E 2.
  - Correct depiction is an observable test of the claimed understanding. Rendering failures alone do not establish the absence of every internal representation of wheels.
support_condition: Independent, documented tests of the referenced contemporary systems and prompts show recurring failures to identify or depict wheels and their functions, with controls separating these failures from general problems following instructions or rendering labels.
contradiction_condition: Repeated tests of the same contemporary systems reliably satisfy the referenced wheel and function requests, showing that the alleged systematic failure does not hold.
measurement_requirements: Record model versions, complete prompts, sampling settings, all generated outputs, sample sizes, and explicit scoring rules for parts and functions.
source_requirements: Independent prompt-and-output records or reproducible evaluations of the September 2022 systems. Marcus's examples establish the claim's scope, not its truth.
