explicit_source_elements:
  - ability to expand its infrastructure
  - ability to raise funding
  - entirely dependent on SoftBank
  - must borrow money to fund it
evaluator_interpretation:
  - Assess the arrangements in place when the post appeared, not whether OpenAI subsequently acquired additional partners.
  - The contextual period runs from the Stargate announcement on January 21 through March 3, 2025. These are current contractual arrangements rather than quarterly operating results.
  - Entirely dependent means SoftBank was indispensable to both activities. Merely identifying another supplier or co-investor does not establish financial independence from SoftBank.
  - Must borrow means borrowing was necessary, rather than simply SoftBank's preferred financing method.
  - The financial basis is estimate because the surrounding argument relies on press reports about proposed financing.
support_condition: Records establish that both infrastructure expansion and fundraising required SoftBank's participation, and that SoftBank could not meet the relevant obligations without borrowing.
contradiction_condition: Records establish an independently financed expansion or fundraising route available during the target period without SoftBank, or establish that SoftBank could fund its obligations without borrowing.
measurement_requirements: Identify contractual dependencies, funding conditions, available liquidity and alternative financing. Distinguish infrastructure suppliers from the ultimate source of funding.
source_requirements: Contemporaneous agreements and financial disclosures are preferred. Reporting about negotiations can establish proposed arrangements but not necessarily financing necessity.
