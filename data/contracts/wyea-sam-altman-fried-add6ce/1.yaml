assessment_axis: forecast_outcome
explicit_source_elements:
  - regular people
  - will find this stuff deeply offensive
  - just won't care
  - strange visual hallucinations
evaluator_interpretation:
  - The forecast concerns ordinary viewers' strong negative reactions to visibly erroneous AI-generated video, not merely opposition to AI or concern about artists' employment.
  - Regular people means a broadly representative audience, rather than a self-selected set of online commenters.
  - Deeply offensive means strong aversion or offense; noticing an error, disliking an advertisement or identifying AI use is insufficient by itself.
  - No deadline is supplied.
support_condition: Representative audience studies consistently find strong offense attributable to visible visual errors across multiple AI-generated videos.
contradiction_condition: Representative studies across such videos find that viewers generally tolerate or ignore the errors, with little strong offense even when the errors are noticed.
measurement_requirements: Measure strong offense directly, verify exposure to visible errors, and distinguish reactions to those errors from branding, disclosure and employment concerns.
source_requirements: Prefer original audience studies with disclosed sampling and methods. Reports of backlash and advertising-effectiveness scores are contextual unless they satisfy the measurement requirements.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve without a deadline only after dated, representative audience evidence replicated across multiple videos decisively meets the support or contradiction condition. A single campaign's backlash or favorable test score is insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No audience geography or population share.
  - Deeply offensive has no specified survey measure.
  - This stuff could refer to visual errors, AI-generated video generally, or its perceived displacement of creative workers.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
