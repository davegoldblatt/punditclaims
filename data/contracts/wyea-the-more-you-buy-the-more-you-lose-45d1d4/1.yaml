explicit_source_elements:
  - Every AI startup
  - is unprofitable
evaluator_interpretation:
  - The ordinary reading is that no startup whose principal business is AI earns a company-wide profit after expenses.
  - Gross margins, revenue growth and financing do not establish profitability.
  - Use January–March 2026 as the latest generally reported quarter before publication. The claim supplies no reporting period.
  - The statement identifies neither an accounting basis nor a source for its universal financial assertion. The required accounting_basis is therefore unknown, which prevents a supported or contradicted score.
support_condition: Comparable financial records establish losses for every company within the stated population during the target period.
contradiction_condition: At least one qualifying AI startup credibly discloses company-wide profit for the target period on a financial basis that can be matched to the claim.
measurement_requirements: Company-wide profit after expenses; distinguish net income from gross profit, adjusted earnings and cash flow.
source_requirements: Financial statements or a sufficiently specific company disclosure. News reporting may identify a counterexample but must establish its period and profit measure.
