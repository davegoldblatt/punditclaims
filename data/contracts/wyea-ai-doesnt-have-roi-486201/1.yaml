evaluator_interpretation:
  - The measurable premise is that successive NVIDIA systems had shown no reduction in the cost of comparable AI work by publication.
  - The surrounding comparison with three years earlier supplies a contextual observation window from June 2, 2023 through June 2, 2026.
  - The ordinary cost reading is unit cost for comparable work, rather than total spending while workloads and demand grow.
  - The statement does not identify its three generations. I do not assume Rubin had completed a normal commercial deployment cycle.
  - A demonstrated counterexample can contradict the no-reduction premise. It cannot independently establish that the industry's business model is sound.
  - The business-model conclusion is a qualitative inference without a specified profitability measure.
support_condition: Comparable cross-generation measurements show no lower AI workload costs, with evidence supporting any separately claimed connection to business-model viability.
contradiction_condition: Evidence available by publication shows lower comparable AI unit costs on a later NVIDIA generation, contradicting the stated no-reduction premise.
measurement_requirements: Compare model, service speed, precision or quality, and workload configuration. Include hardware and operating costs through a disclosed ownership-cost model or equivalent deployment-cost evidence.
source_requirements: Prefer independently executed benchmarks with inspectable methods and cost assumptions. Do not infer company profitability from throughput or modeled serving margins.
