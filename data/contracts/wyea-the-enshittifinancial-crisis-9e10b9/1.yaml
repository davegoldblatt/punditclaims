explicit_source_elements:
  - $300 billion deal with OpenAI
  - Oracle does not have the capacity to fill
  - OpenAI does not have the money to pay for
evaluator_interpretation:
  - Read as an observation about resources available at publication, not a forecast of eventual default.
  - Use December 1–29, 2025 as the latest month-to-publication status period. The reference to September identifies the announcement; the present-tense assertions describe the current position.
  - Compare available capacity and funding with the contract's delivery and payment schedule. Do not assume the entire contract requires immediate delivery or payment.
  - The monetary scope records OpenAI's available funding. Oracle's physical capacity is a separate, nonmonetary component.
  - The passage supplies no accounting basis or definition of available money.
support_condition: Records establish both that Oracle lacked capacity required by the delivery obligations and that OpenAI lacked available funds required by the payment obligations, as assessed at publication.
contradiction_condition: Comparable records establish adequate capacity and funding for the respective obligations. If only one component is established and the other disproved, assess the compound claim as mixed.
measurement_requirements: Contract delivery milestones, payment dates, usable capacity allocated to this contract, and OpenAI's unrestricted cash and committed financing after other obligations.
source_requirements: Prefer the executed contract, company disclosures, financial statements, and construction records. Financing announcements alone do not establish available cash.
