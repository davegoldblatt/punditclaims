ambiguity_flags:
  - No numerical threshold defines major problem.
  - No numerical threshold or company population defines few.
  - Transparency could refer to training, inference, aggregate consumption, or per-query measurements.
  - The consumption clause does not explicitly distinguish generative AI from other AI workloads.
