assessment_axis: forecast_outcome
explicit_source_elements:
  - in both cases
  - investors will be left holding the bag
  - Anthropic wants to raise in its IPO
  - That $97.5 billion number
evaluator_interpretation:
  - Read holding the bag as substantial lasting investment losses for purchasers in the identified Anthropic and Meta offerings.
  - Assess the two investor groups separately. Losses in only one do not establish the prediction about both.
  - Measure returns against actual purchase prices, including distributions and corporate actions. Losses to investors are distinct from losses reported by the companies.
  - No deadline or numerical loss threshold is supplied. Do not invent a holding period or treat temporary price declines as permanent losses.
  - The offerings identify the investments being predicted, rather than an explicit if-then condition.
support_condition: Final distributions or another irreversible event establish substantial losses relative to purchase cost for investors in both identified offerings.
contradiction_condition: An irreversible cash exit or final distribution establishes that the relevant investors recovered their purchase cost and earned positive total returns, contradicting the loss prediction for that investor group.
measurement_requirements: Actual offering purchase prices, securities received, splits, distributions, and final proceeds for each investor group. Secondary-market prices alone cannot establish lasting impairment without a stated deadline.
source_requirements: Final offering documents, exchange records, corporate-action notices, and liquidation or acquisition records.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A final liquidation, cancellation of equity with no remaining recovery rights, or compulsory cash acquisition fixes the investors' total recovery. Evaluate each offering separately; no such event may be inferred from an ordinary price decline.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No deadline.
  - No percentage-loss threshold or holding period.
  - Holding the bag does not specify whether the loss must be realized.
  - Meta's financing package includes different securities and purchase dates.
retrospective_or_prospective: retrospective
