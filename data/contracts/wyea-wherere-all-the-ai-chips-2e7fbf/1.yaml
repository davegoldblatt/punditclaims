assessment_axis: forecast_outcome
explicit_source_elements:
  - There is not 5GW of capacity for Anthropic to buy
  - nor will there be 10GW more
  - in 2027
evaluator_interpretation:
  - This combines a present observation with a forecast. The present clause refers to September 22, 2026; the surrounding paragraph also permits an end-2026 reading.
  - Capacity means powered, commissioned AI compute capacity that Anthropic can actually procure and use, rather than proposed construction or a contract for future delivery.
  - The 2027 clause concerns an additional 10GW becoming available during that calendar year, without counting the same capacity twice.
  - The threshold concerns availability to Anthropic, not necessarily capacity that Anthropic ultimately purchases.
support_condition: A sufficiently complete inventory establishes less than 5GW available at publication and, after 2027 ends, less than 10GW of additional eligible capacity becoming available during 2027.
contradiction_condition: Verified operational and procurement records establish at least 5GW available at publication, or at least 10GW of additional eligible capacity becoming available during 2027. If only one component fails, preserve the separate finding on the other component.
measurement_requirements: Use consistent GW definitions, identify IT load versus total facility power, confirm commissioning and procurement availability, and remove overlapping cloud and campus announcements.
source_requirements: Operator commissioning records, power-delivery records, and Anthropic procurement disclosures. Announced agreements alone do not demonstrate operating capacity.
metric_scope: null
original_horizon: in 2027
horizon_interval:
  start: 2026-09-22
  end: 2027-12-31
  precision: day
target_period:
  start: 2026-09-22
  end: 2026-09-22
  precision: day
condition_status: not_applicable
early_resolution_rule: Dated operational records can conclusively contradict the relevant component once its threshold is reached within its stated period. Announcements and planned deliveries cannot settle it early. Supporting the negative 2027 forecast requires the year to end.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - The sentence says now, while the preceding sentence discusses the end of 2026.
  - GW may denote IT load or total facility power.
  - Available to buy is not defined in terms of price, technical suitability or contractual access.
  - The reference point for 10GW more is not explicitly specified.
retrospective_or_prospective: prospective
outcome_known_at_freeze: false
