evaluator_interpretation:
  - The ordinary reading is that machine learning will continue to cause substantial changes in work and everyday life. It does not require beneficial changes.
  - The historical statement supplies background; the forward-looking commitment is assessed here.
  - Marcus gives no deadline or measure of substantial change. Adoption alone does not establish the size or cause of an effect.
support_condition: Dated evidence establishes substantial changes attributable to machine learning after publication, across major areas of work or everyday life.
contradiction_condition: Decisive evidence establishes that continued substantial effects cannot occur. A period without a qualifying development does not contradict this undated forecast.
measurement_requirements: Evidence must distinguish actual effects from availability, adoption, forecasts, and promotional claims, and identify effects occurring after 2025-07-13.
source_requirements: Prefer independently corroborated deployment evidence and empirical studies of real-world effects.
