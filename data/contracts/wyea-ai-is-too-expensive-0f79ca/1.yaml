evaluator_interpretation:
  - The ordinary reading is that the preceding revenue-versus-capex comparison omits the recurring costs of running the infrastructure.
  - The immediate comparison concerns Microsoft FY2025, so that is the target period.
  - Operating expenses is used in its everyday sense, including running costs classified as cost of revenue in financial statements.
  - This does not mean that asset construction cannot capitalize labor or that depreciation should be added to capex when calculating cash spending.
  - This assessment concerns accounting categories, not the correctness of the preceding revenue estimates.
support_condition: Microsoft's disclosures distinguish capital additions and revenue from the recurring costs of operating its cloud infrastructure.
contradiction_condition: The cited measures already include recurring datacenter operating costs, or the purported revenue amounts are profits after those costs.
measurement_requirements: Identify what the capital-expenditure and revenue categories contain. Distinguish capitalized asset costs, recurring expenses, and depreciation.
source_requirements: Microsoft's financial-statement definitions and its explanation of reported capital expenditures.
