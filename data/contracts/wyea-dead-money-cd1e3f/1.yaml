evaluator_interpretation:
  - The plain reading is that borrowing costs are unusually high across AI data center financing, rather than merely high for one distressed borrower.
  - Compare borrowing rates and spreads with historical levels and comparable infrastructure financing, accounting for maturity, collateral and credit quality.
  - Use September 1–29, 2026 as the current market observation window. This is an evaluator-selected window because the claim supplies no reporting period.
  - The surrounding discussion uses market quotations and estimated refinancing costs, so the financial basis is estimate.
support_condition: Representative September evidence shows unusually high borrowing costs across the relevant financing market, supported by historical or comparable-financing benchmarks.
contradiction_condition: Representative September evidence shows ordinary or relatively inexpensive borrowing costs across that market after accounting for financing structure and borrower risk.
measurement_requirements: Dated yields, loan margins and fees; comparable maturities, currencies, collateral and credit ratings; coverage of both strong-credit and speculative borrowers. Distinguish existing coupons, secondary-market yields and new borrowing costs.
source_requirements: Prefer pricing documents, credit agreements and independently measured market data. Individual transactions cannot establish the sector-wide claim.
