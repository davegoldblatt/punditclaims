assessment_axis: historical_observation
explicit_source_elements:
  - generative AI is deeply unprofitable
  - doesn't seem to provide tangible productivity benefits (hedged)
  - appears to only lose both the business and the customer money (hedged)
evaluator_interpretation:
  - Only the unhedged clause, 'generative AI is deeply unprofitable', is scored. The other two clauses are hedged with 'doesn't seem to' and 'appears to'. They are his impressions, not firm claims, so they are not scored.
  - "Plain reading of the scored clause: the companies that build and sell generative AI models and services were losing large sums relative to their revenue. In context he is talking about OpenAI, Anthropic, and AI startups."
  - "He named no period. I use the latest periods public data could cover before the April 21, 2026 post: calendar 2025 (he cites 'last year' revenues) through the March 2026 quarter. This is my choice and is flagged."
  - I read 'deeply' as losses that are large relative to revenue, not small or near breakeven.
support_condition: Company-reported results for leading generative AI developers show operating losses that are large relative to revenue in 2025 through Q1 2026.
contradiction_condition: Company-reported results show leading generative AI developers were profitable or near breakeven in 2025 through Q1 2026.
measurement_requirements: Operating income (loss) and revenue in USD for leading generative AI model developers over 2025 to Q1 2026.
source_requirements: Company filings (such as an S-1) or reputable reporting of them.
metric_scope:
  company: Leading generative AI model developers (tested with Anthropic)
  metric: Operating income (loss) relative to revenue
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2025-01
  period_end: 2026-03
  stock_or_flow: flow
