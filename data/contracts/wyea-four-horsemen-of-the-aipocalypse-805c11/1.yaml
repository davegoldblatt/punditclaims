explicit_source_elements:
  - generative AI is deeply unprofitable
  - doesn’t seem to provide tangible productivity benefits
  - appears to only lose both the business and the customer money
evaluator_interpretation:
  - The ordinary reading is a broad assessment of provider economics and customer outcomes, retaining the uncertainty expressed by 'seem' and 'appears'.
  - The financial comparison uses calendar 2025, the latest completed annual reporting period before the post. This is an evaluator choice because no common industry reporting period is supplied.
  - Productivity means measured output relative to labor or other inputs, with quality accounted for. Customer financial benefit means returns after adoption and operating costs.
  - Provider profitability, customer productivity, and customer net returns are separate questions. Evidence for one does not establish the others.
  - A single successful or unsuccessful deployment does not settle the broad assessment.
support_condition: Comparable industry financial evidence shows substantial net losses, and representative customer evidence shows no material productivity gains and negative net financial returns during the target period.
contradiction_condition: Comparable evidence establishes broad provider profitability or substantial, repeatable customer productivity and net financial gains inconsistent with the asserted general pattern.
measurement_requirements: Separate provider net results from cash burn and gross margins; distinguish measured productivity from perceived time savings and distinguish productivity from customer profit.
source_requirements: Financial disclosures with comparable accounting definitions and representative customer studies reporting methods, dates, quality, and relevant costs.
