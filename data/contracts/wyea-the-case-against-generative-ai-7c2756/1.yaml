explicit_source_elements:
  - Generative AI can’t do the job of a software engineer
  - it fails
  - costing abominable amounts of money
evaluator_interpretation:
  - The surrounding passage distinguishes generating code from an engineer's broader responsibilities. Read the claim as inability to perform a sustained engineering role reliably with ordinary workplace oversight.
  - "Do not require flawless performance: human engineers also make mistakes."
  - No reporting period is specified. Use September 1–29, 2025, the latest calendar month observable before publication.
  - The expense description supplies no company, amount, cost category or comparison. It is a value judgment that cannot receive a separate numerical verdict.
  - Metric scope is null because this is not a claim about an identified company's finances.
support_condition: Representative end-to-end evaluations show contemporary systems unable to carry a sustained engineering workload at acceptable quality with ordinary oversight. The expense component additionally needs a stated cost basis and meaningful comparator.
contradiction_condition: A verified sustained deployment or representative trial demonstrates that a contemporary system performs an engineer's substantive responsibilities at acceptable quality and supervision levels.
measurement_requirements: Assess requirements clarification, implementation, testing, maintenance, security, coordination, human intervention and total deployment costs. Task benchmark scores alone do not measure an entire job.
source_requirements: Prefer independent longitudinal evaluations and documented deployments. Report vendor involvement and distinguish benchmark success from production responsibility.
