  - The real lesson of DeepSeek
  - we can still make vast improvements in efficency
evaluator_interpretation:
  - The plain reading is that DeepSeek demonstrates substantial reductions in the computing resources needed for broadly comparable AI capability.
  - I read 'vast' as large proportional or multiple-fold improvements, rather than small incremental savings. Marcus supplies no numerical threshold.
  - The target period is December 2024 through the post date, covering the recent DeepSeek results discussed in the post. This is an inferred reporting window for an observation without explicit dates.
  - The claim does not require DeepSeek to outperform every contemporary model on every task. It also does not establish the separate suggestion that general intelligence could be built with dozens of GPUs.
  - I assess the demonstrated efficiency gains, rather than treating this sentence as a forecast of a specified future improvement.
support_condition: Documented DeepSeek results show large reductions in training computation or inference resources relative to systems with broadly comparable measured capability, with the comparison's scope and assumptions disclosed.
contradiction_condition: Comparable technical evidence shows that the apparent large savings disappear when capability and resource scope are accounted for, leaving only small gains or no gains.
measurement_requirements: Compare physical computing resources and benchmark performance together. Distinguish training from inference, final training from earlier research, and hardware hours from estimated computation. API prices alone do not establish resource efficiency.
source_requirements: Use technical reports and reproducible benchmark results, preferably supplemented by independent analysis. Identify estimates and company-reported measurements.
