assessment_axis: forecast_outcome
explicit_source_elements:
  - There isn’t a need for a bailout here
  - one won’t be forthcoming
evaluator_interpretation:
  - Here refers to banks' or lenders' investments in unfinished or failed AI data centers, as described immediately before the sentence.
  - The government is the United States government, given the surrounding discussion.
  - A bailout is exceptional public financial assistance intended to absorb losses or prevent failure arising from distressed investments.
  - Ordinary infrastructure grants, tax incentives and private financing do not automatically qualify.
  - The no-bailout prediction is checkable. The separate assertion that no bailout is needed has no supplied necessity test and is not independently scored.
  - No deadline or completed episode bounds the negative prediction.
support_condition: A specified, completed distress episode without a qualifying bailout could support a bounded version of the forecast. The unbounded wording cannot be conclusively supported merely by observing no bailout to date.
contradiction_condition: The US government implements exceptional financial assistance rescuing banks, lenders or their distressed AI data-center investments.
measurement_requirements: Identify the beneficiary, investment exposure, financial distress, public assistance, implementation date and rescue purpose. Distinguish proposals and ordinary development support from executed rescues.
source_requirements: Legislation, agency announcements, transaction records, guarantees or disbursement records. Official statements of intent alone do not prove implementation.
