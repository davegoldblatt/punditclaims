  - generative AI
  - has burned $1 trillion
  - one of the most-wasteful products in history
evaluator_interpretation:
  - The testable financial reading is approximately $1 trillion in cumulative realized spending attributable to generative AI by publication.
  - The post discusses infrastructure expenditure and industry financing. I read 'burned' as money spent, without silently converting it into net accounting losses.
  - The figure is an industry estimate, not a named company's reported accounting total.
  - No inception date is given, so the cumulative period has an unspecified start and ends on the post date.
  - The historical wastefulness ranking supplies neither a measure nor a comparison set and is not separately scored.
support_condition: A credible, reconciled industry accounting shows approximately $1 trillion of realized generative-AI expenditure through May 19, 2026, without double-counting financing and subsequent expenditure.
contradiction_condition: A sufficiently comprehensive accounting using the same scope establishes a cumulative total materially below $1 trillion.
measurement_requirements: Separate realized expenditure from commitments, forecasts, valuations, and funding raised. Allocate shared infrastructure to generative AI and eliminate transfers counted at multiple stages.
source_requirements: Company disclosures or a transparent industry estimate with stated coverage, allocation rules, dates, and treatment of double-counting.
