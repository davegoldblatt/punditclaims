assessment_axis: causal_assessment
explicit_source_elements:
  - tortured prompts that did work
  - only go to show
  - not with GenAI’s drawing capacity
  - but with its language understanding
evaluator_interpretation:
  - The claim concerns the left-handed drawing examples discussed on February 13, 2024, not every image-generation error.
  - Drawing capacity means the same model can render the requested handedness. Language understanding means correctly following the handedness specified in an ordinary prompt.
  - Successful alternative prompts can demonstrate rendering capacity, but identifying the cause of ordinary-prompt failures also requires separating language interpretation from sampling, visual preferences, and other pipeline effects.
support_condition: Repeated same-model comparisons establish successful rendering under equivalent reformulations and isolate incorrect interpretation of the ordinary handedness request as the cause of failure.
contradiction_condition: Controlled comparisons establish that the request is correctly interpreted but a rendering limitation causes the failure, or that the purported successful alternatives change the model or requested scene materially.
measurement_requirements: Preserve model version, ordinary and reformulated prompts, any automatic prompt rewriting, generation settings, repeated outputs, and blinded handedness judgments. Use controls that distinguish understanding the request from rendering it.
source_requirements: Independent original experiment records and controlled comparisons concerning the historical systems in question. Selected screenshots or general prompt-following studies alone cannot settle the exclusive causal attribution.
