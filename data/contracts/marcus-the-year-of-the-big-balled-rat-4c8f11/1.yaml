  - Two clearest examples so far this year
  - the now retracted paper with the above-mentioned rat
  - a new lithium battery paper
  - an opening sentence clearly written by an LLM
evaluator_interpretation:
  - "Assess the two factual examples together: an AI-illustrated rat paper already retracted by March 14, and a publicly available lithium-battery paper whose introduction contained unmistakable chatbot-response wording."
  - "'Clearest' expresses the speaker's assessment of the examples; no objective ranking among all scientific publications is supplied."
  - "'Opening sentence' is read as the opening of the introduction, rather than the abstract."
  - The stated period is January 1 through March 14, 2024.
support_condition: Reliable records establish both that the rat paper contained AI-generated imagery and had been retracted by the post date, and that the lithium-battery paper already contained the described LLM-style opening by that date.
contradiction_condition: "Reliable records establish that either factual example was materially misdescribed: the rat paper lacked AI imagery or was not yet retracted, or the lithium paper lacked the alleged opening during the target period."
measurement_requirements: Verify the papers' identities, the rat paper's retraction date, and the lithium paper's introduction in a version publicly available by March 14, 2024.
source_requirements: Prefer original papers, archived versions and dated publisher notices. Independent reproductions may corroborate inaccessible originals, but their dates and provenance must establish the relevant historical version.
