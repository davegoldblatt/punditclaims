ambiguity_flags:
  - Current-state observation; latest available financial information informs the July 7 snapshot without imposing a single reporting quarter.
  - Industry membership and treatment of transactions within the industry are unspecified.
  - Compute spend could mean payments, expenses, projected spending or commitments.
  - Accounting basis and loss measure are unspecified.
  - The words 'for the most part' do not specify how funding flows are measured.
  - The schema has no unknown option for annualized_or_realized or gross_or_net; not_applicable here does not resolve those ambiguities.
