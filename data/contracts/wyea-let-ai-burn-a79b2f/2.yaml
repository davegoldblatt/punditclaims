assessment_axis: historical_observation
explicit_source_elements:
  - I estimate
  - at least 70%
  - the entire AI industry’s revenues
  - OpenAI and Anthropic’s compute spend
  - both companies are horrendously unprofitable
  - for the most part
  - venture capitalists funnelling money to hyperscalers
evaluator_interpretation:
  - The ordinary reading is that the two labs' compute spending accounts for at least 70% of current AI-sector revenue, with outside investment financing most of this spending chain.
  - Assess the current position on July 7 using the latest revenue, spending and funding information then reportable. The nearby first-quarter figures do not restrict the entire assertion to that quarter.
  - Do not silently choose between payments, recognised expenses, annual spending projections and contractual commitments. Identify the convention underlying the estimate and compare like periods and measures.
  - Calling the calculation an estimate does not identify an accounting basis. The contract therefore records that basis as unknown.
  - The funding-flow explanation requires evidence beyond the two companies making losses.
support_condition: Comparable figures establish a share of at least 70% for the stated industry, both labs have substantial losses on an identified basis, and funding records establish that investor-financed compute purchases account for most of the described revenue chain.
contradiction_condition: Comparable figures establish a share below 70%, or financial and funding records materially disprove the asserted loss-dependent funding chain. A result obtained only by selecting an unstated industry boundary or spending convention is insufficient.
measurement_requirements: Define the industry denominator, compute-spending convention, observation period, treatment of transactions between industry participants, loss measure and funding sources. Do not count commitments as recognised revenue or assume that every dollar spent by a loss-making company came from venture capital.
source_requirements: Company financial statements and customer spending disclosures, supplemented by independently documented industry estimates and funding records. Reconcile differences in periods and recognition rules.
