explicit_source_elements:
  - I estimate
  - at least 70%
  - the entire AI industry’s revenues
  - OpenAI and Anthropic’s compute spend
  - both companies are horrendously unprofitable
  - for the most part
  - venture capitalists funnelling money to hyperscalers
  - NVIDIA or data center capex
evaluator_interpretation:
  - This is a numerical estimate with a checkable threshold, despite the introductory hedge.
  - The numerator is combined realized compute expenditure by OpenAI and Anthropic. The denominator is realized AI-industry revenue over the same period.
  - Entire AI industry ordinarily includes AI applications, models, cloud services, and AI hardware, rather than only a selected group of model startups.
  - For the ongoing financial state, I use Q1 2026, the latest quarter with reportable financial results before the July 7 post. No period is explicitly supplied for the ratio.
  - A defensible industry total must specify whether transactions between AI suppliers are counted at each stage or consolidated.
  - For the most part means a majority. Losses alone do not establish that most industry revenue originated as venture capital.
  - The speaker's estimate supplies the accounting basis for the ratio; the basis and severity threshold for the separate profitability assertion remain unspecified.
support_condition: Same-period estimates with a defined industry boundary show combined compute expenditure at least 70% of industry revenue, while matching financial and funding records establish both companies' losses and predominantly venture-funded downstream flows.
contradiction_condition: Comparable records establish a ratio below 70%, or matching evidence materially contradicts the asserted majority funding flow or losses. Capacity shares, annual forecasts, and multi-year commitments cannot substitute for the stated ratio.
measurement_requirements: Both companies' realized compute expenditure, a complete same-period industry revenue denominator, explicit treatment of intercompany transactions, comparable profitability measures, and evidence tracing funding into supplier receipts.
source_requirements: Company financial statements, supplier disclosures, and a transparent industry-revenue methodology. Funding announcements establish commitments, not necessarily cash received or spent.
