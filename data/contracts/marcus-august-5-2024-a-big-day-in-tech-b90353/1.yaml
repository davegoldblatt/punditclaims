assessment_axis: forecast_outcome
explicit_source_elements:
  - LLMs are not AGI
  - (on their own) never will be
evaluator_interpretation:
  - Assess the enduring prediction, including its present-tense premise; no deadline is supplied.
  - Read AGI as broadly human-level ability to learn, reason and apply knowledge across unfamiliar intellectual tasks.
  - Read 'on their own' as requiring the LLM itself to supply the relevant intelligence, without external solvers, retrieval systems or human assistance supplying essential capabilities.
  - Ordinary input/output and model execution do not by themselves disqualify a system.
  - "'On their own' restricts which systems count as counterexamples; it is not an antecedent requiring a separate future event."
support_condition: A conclusive, independently scrutinized general result establishes that LLMs alone cannot reach the specified breadth of intelligence. Failures of existing models cannot establish 'never'.
contradiction_condition: A documented LLM alone demonstrates broadly human-level general intelligence under independent evaluation, with sufficient system disclosure to verify the scope restriction.
measurement_requirements: Broad testing on unfamiliar tasks, independent replication, and disclosure sufficient to separate the LLM's capabilities from external assistance. One benchmark or a developer's AGI declaration is insufficient.
source_requirements: Primary evaluations and technical documentation, with independent scrutiny of both capabilities and system composition.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve as contradicted upon a dated, independently validated LLM-only AGI demonstration. Resolve as supported only upon a conclusive general impossibility result covering the claimed class.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - AGI has no threshold specified in the claim.
  - The boundaries of 'LLM' and 'on their own' are not defined.
  - The sentence combines a present observation with an unlimited prediction.
  - No forecast deadline is supplied.
