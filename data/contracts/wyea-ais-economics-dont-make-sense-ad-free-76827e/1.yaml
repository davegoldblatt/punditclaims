explicit_source_elements:
  - Anthropic fucking lied
  - Claude Mythos being too powerful to release
  - it was actually a capacity issue
  - Large Language Model Nothingburger
evaluator_interpretation:
  - The checkable core concerns Anthropic's April 2026 decision to restrict public access to Claude Mythos Preview.
  - Lied means Anthropic knowingly presented a false capability or safety rationale while capacity was the actual reason for withholding broad release.
  - Evidence that capacity was constrained does not establish that the safety explanation was false; both considerations could have mattered.
  - Nothingburger is an evaluative characterization without a specified performance threshold. It receives no separate factual verdict.
support_condition: Credible decision records or corroborated firsthand accounts establish that capacity caused the restriction and that Anthropic knowingly misrepresented its capability or safety rationale.
contradiction_condition: Credible decision records establish a genuine capability-related safety reason for restricting access and rebut the allegation that capacity was the concealed actual explanation.
measurement_requirements: Distinguish model capability, infrastructure availability, the release decision, and knowledge or intent. Benchmark results alone cannot establish the decision-makers' motives.
source_requirements: Prefer contemporaneous decision documents, capacity records, and corroborated firsthand accounts. Treat public company explanations and competitor speculation as context unless independently substantiated.
