explicit_source_elements:
  - NVIDIA
  - making hundreds of billions of dollars of revenue
  - chips that aren’t being installed
evaluator_interpretation:
  - The ordinary reading is that NVIDIA has recognized at least $200 billion of revenue attributable to chips that remain physically uninstalled. Total revenue, orders and planned infrastructure spending do not establish that amount.
  - For the ongoing financial observation, the reference period is the latest reported fiscal quarter before the post, ending January 25, 2026. The speaker does not specify the period over which the alleged revenue accumulated; the metric's accumulation dates therefore remain unspecified.
  - The passage does not identify an accounting basis or attribute the amount to a particular financial source. The contract's accounting basis is unknown, which prevents a supported or contradicted money verdict.
  - The description of NVIDIA's stock-market rank is incidental to the proposition being assessed.
support_condition: Matched sales and deployment records establish at least $200 billion of NVIDIA revenue from chips remaining uninstalled during the reference period, with the revenue accumulation period and accounting basis established.
contradiction_condition: A sufficiently comprehensive reconciliation establishes an upper bound below $200 billion for that same revenue measure. Examples of installed GPUs alone do not contradict the aggregate claim.
measurement_requirements: Reconcile NVIDIA's recognized chip revenue with customer and distributor inventories and installation records. Separate chips from networking, complete servers, software, commitments and reseller markups.
source_requirements: Financial filings plus customer deployment or inventory disclosures, or a transparent independent reconciliation with adequate coverage.
