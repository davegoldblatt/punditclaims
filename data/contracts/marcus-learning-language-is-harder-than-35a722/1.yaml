ambiguity_flags:
  - Spectacular and very little have no supplied thresholds.
  - Real comprehension could mean behavioral competence or a stronger theoretical account of understanding.
  - The statement combines several distinct propositions without specifying how to weigh them.
  - GPT-3 version, prompting conditions and passage length are unspecified.
  - The ongoing-state wording supplies no reporting interval; 2022 through the post date is the evaluator's choice.
