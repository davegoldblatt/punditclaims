assessment_axis: historical_observation
explicit_source_elements:
  - systems like GPT-3
  - spectacular at memorization
  - stochastic imitations of their input
  - very little real coherence
  - very little comprehension
evaluator_interpretation:
  - GPT-3 is the named target. Results for other model families provide context rather than direct measurements of GPT-3.
  - Memorization means reproducing learned training material, rather than merely knowing facts or using familiar words.
  - The ordinary behavioral reading of coherence is maintaining consistent, connected meaning across generated passages. Comprehension means correctly using the meaning of supplied language across varied tasks.
  - Very little is stronger than imperfect or less capable than humans. A few failures cannot establish it, and a few successes cannot refute it.
  - Statistical generation alone does not establish that outputs are merely copied or that comprehension is absent.
  - The target period is January 1 to July 20, 2022, the current research year through the post. Older evaluations are historical context unless evidence establishes their applicability during this period.
support_condition: Direct evidence establishes strong GPT-3 memorization together with broadly slight sustained coherence and comprehension on varied, appropriately controlled tasks.
contradiction_condition: Representative evaluations establish substantial sustained coherence or comprehension beyond reproduction of training material, or directly undermine the claimed strength of memorization.
measurement_requirements: Specify the GPT-3 version, prompts, sampling settings, passage lengths and task selection. Separate memorization, fluent writing, sustained coherence and comprehension; examine training-data overlap where possible.
source_requirements: Primary model documentation and independent empirical studies. Findings must concern the named model and target period to be decisive.
