evaluator_interpretation:
  - The plain reading is that numerous prominent OpenAI personnel had departed by the post date.
  - “Best people” means people with documented founding, senior research or major technical leadership roles. It is not an objective ranking of individual ability.
  - “Many” does not mean most employees or most leaders.
  - “Have left” is cumulative. No starting date is supplied, so the target period has no asserted lower bound and ends on August 9, 2025.
  - Sabbaticals and merely announced future departures are not counted as permanent departures unless later records establish that the person left before the post.
support_condition: Public records establish several distinct departures by prominent founders or technical leaders before the post.
contradiction_condition: Reliable employment records show that the purported numerous departures did not occur, or principally concern people without the claimed prominence.
measurement_requirements: Identify distinct people, their OpenAI roles and their departures. Do not count temporary leave as an exit.
source_requirements: Prefer company and employee announcements, supplemented by reputable reporting that identifies roles and departure dates.
