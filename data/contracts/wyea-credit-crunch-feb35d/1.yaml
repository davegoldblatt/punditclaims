explicit_source_elements:
  - Both of them
  - massive amounts of concentration risk
  - unstable customers
  - brittle economics
  - own virtually no assets
  - little to no ability to reduce their costs
  - cannot afford their bills
evaluator_interpretation:
  - Use the first half of 2026 as the latest completed half-year that could reasonably have been reported before publication; assess balance-sheet quantities at June 30.
  - Concentration risk includes reliance on major customers, distribution channels and compute suppliers.
  - The ordinary reading of assets includes cash, investments and owned property. The broader post's emphasis on data centers also permits a narrower reading about infrastructure available as collateral.
  - Cannot afford their bills means insufficient available liquidity and receipts to meet obligations when due. Accounting losses or large future commitments alone do not establish this.
  - Cost reduction means a comparable reduction in actual expenses or unit costs, rather than merely relabeling expenses.
support_condition: Records for both companies establish substantial concentration, customer fragility, weak operating economics, negligible relevant assets, little genuine cost improvement and liquidity inadequate for bills falling due.
contradiction_condition: Comparable records materially refute one or more asserted weaknesses, such as substantial relevant owned assets, adequate liquidity for obligations due, diversified durable customers or demonstrated genuine cost reductions.
measurement_requirements: Customer and supplier concentration, customer payment and retention data, balance sheets, comparable expense trends and a dated liquidity-to-obligations schedule. Separate owned infrastructure, leased assets, cash and intangibles.
source_requirements: Financial statements, contractual payment schedules, customer disclosures and creditor records. Company claims about demand require appropriate qualification.
