explicit_source_elements:
  - Autocomplete as we know it
  - works surprisingly well, for some purposes
  - just isn’t good enough for world model induction
  - proper world models
  - abstract models of the world that they can reliably engage
evaluator_interpretation:
  - The plain reading concerns learning coherent accounts of a domain's states and rules that the model can reliably use for prediction and action. Merely decoding information from internal representations does not meet that standard.
  - Reliable use should survive unfamiliar cases and meaningful changes within the domain. This does not require flawless performance, humanlike mechanisms, or understanding every domain.
  - The observation concerns the publicly reportable state of the technology immediately before the August 12, 2025 post. The target interval has no stated beginning because 'as we know it' concerns capabilities established by that date, rather than a reporting quarter.
  - Purpose-trained next-token models are relevant tests of the proposed limitation of autocomplete. Whether their competence establishes adequacy for the broader everyday world modeling discussed in the post remains a material scope question.
  - The surrounding language informs the reliability requirement. It does not turn this selected present-tense observation into a forecast about all future systems.
support_condition: Representative tests of then-existing LLMs show systematic failures to learn and reliably use coherent state-and-rule models, including on unfamiliar cases, with coverage sufficient to support the broad limitation after accounting for successful demonstrations. Isolated factual mistakes are insufficient.
contradiction_condition: Controlled experiments demonstrate coherent models learned through next-token prediction and reliably used across held-out situations, multiple relevant tasks, and meaningful changes within the tested domain. Probes, single interventions, and familiar-case accuracy alone are insufficient. A definitive contradiction also requires that the demonstrated scope reasonably matches the functional world modeling discussed in the post.
measurement_requirements: Identify training objectives, datasets, model versions, task coverage, held-out cases, error rates, and responses to changes in state or circumstances. Distinguish internal information from reliable behavioral use, and model performance from assistance supplied by external solvers.
source_requirements: Primary experimental papers or benchmark reports available by October 28, 2026. Later publications must describe capabilities within the target period to count as outcome evidence.
