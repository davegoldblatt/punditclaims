explicit_source_elements:
  - Autocomplete as we know it
  - works surprisingly well, for some purposes
  - isn’t good enough for world model induction
evaluator_interpretation:
  - Read 'autocomplete' as autoregressive next-token prediction, the training mechanism criticized in the surrounding passage.
  - The ordinary testable reading denies that this mechanism can learn a functional representation of an environment's states and relationships.
  - A bounded game's world counts because the post itself uses chess as an example. This does not require a comprehensive human-like model of reality.
  - Assess capabilities demonstrated through 2025-08-12; no lower bound is supplied for the accumulated capability record.
support_condition: Controlled evidence establishes that next-token training fails to learn functional environmental representations across the relevant tested settings, rather than merely showing imperfect performance.
contradiction_condition: A model trained on next-token prediction without supplied states or rules learns an environmental representation whose causal use in predictions is experimentally demonstrated.
measurement_requirements: Document the training objective and inputs, test on held-out sequences, and use interventions to distinguish a representation used by the model from information merely recoverable by a probe.
source_requirements: Primary experiments on autoregressive prediction, with intervention evidence and clear limits on generalization.
