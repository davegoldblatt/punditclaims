explicit_source_elements:
  - has not updated its annualized revenue publicly since January
  - projected to be $13 billion this year
  - suggesting it’s stalled
evaluator_interpretation:
  - Assess the normalized proposition as an inference that Microsoft's AI business had stopped growing materially beyond approximately $13 billion in annualized revenue.
  - The latest completed quarter with public results before the post was January through March 2025; use that quarter for the ongoing revenue state.
  - Assess the absence-of-disclosure assertion separately over January through June 30. Revenue growth does not itself prove that an updated figure was publicly announced during that interval.
  - "'Suggesting' makes the stall inference tentative. It is not a forecast that revenue would remain flat indefinitely."
  - Use Microsoft's company-reported AI revenue run rate, not realized annual revenue or Azure's total revenue.
support_condition: Comparable company-reported figures establish that the AI revenue run rate remained approximately $13 billion through the target quarter, alongside a documented absence of a public update before the post.
contradiction_condition: Comparable figures establish a materially higher AI revenue run rate during the target quarter, contradicting the stall inference; alternatively, a dated pre-publication update contradicts the disclosure assertion.
measurement_requirements: Compare the same company-defined AI revenue run-rate measure. A later disclosure is admissible only insofar as it establishes the historical target-period value.
source_requirements: Microsoft investor disclosures, with any historical value inferred from a later year-over-year comparison explicitly calculated.
