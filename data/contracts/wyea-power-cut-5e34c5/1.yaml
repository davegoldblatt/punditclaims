explicit_source_elements:
  - will continue selling
  - unprofitable, unsustainable software
  - because
  - the capacity it has right now
  - more than sufficient
  - lack of demand
evaluator_interpretation:
  - The forecast combines continued sales, losses attributable to Microsoft's generative AI software, and a causal explanation based on surplus capacity.
  - Current capacity means capacity available when the post appeared on March 3, 2025.
  - No deadline or duration is supplied. I do not add one.
  - Profitability requires attributable revenue and costs. Microsoft's consolidated earnings or its investment gains and losses cannot establish software profitability.
  - The words supply no accounting basis for the profitability assertion.
support_condition: Microsoft continues selling generative AI software at an attributable loss, and dated evidence establishes that surplus March 2025 capacity relative to demand explains that decision.
contradiction_condition: Direct evidence disproves a necessary component, such as attributable profitability over the relevant continuation period or an actual capacity shortage at the stated March 2025 baseline.
measurement_requirements: Separate generative AI software economics from consolidated results. Compare usable capacity with matching workloads, locations and demand; establish the claimed causal connection.
source_requirements: Product sales records, attributable financial disclosures, and contemporaneous capacity or operational records.
