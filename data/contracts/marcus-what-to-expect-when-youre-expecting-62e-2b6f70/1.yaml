assessment_axis: forecast_outcome
explicit_source_elements:
  - GPT-5 by itself
  - won’t be a general purpose artificial general intelligence
  - capable of taking on arbitrary tasks
evaluator_interpretation:
  - The ordinary reading is broad competence at unfamiliar, feasible tasks, rather than literal success at every conceivable task.
  - ‘By itself’ excludes external reasoning systems, specialist controllers and retrieval tools. Ordinary input and output interfaces are permitted.
  - The target is the original GPT-5 system, not every later model carrying a GPT-5 family name.
  - No deadline is supplied. Release is not treated as an unstated deadline.
support_condition: Controlled evaluations establish substantial, persistent failures of generalization across ordinary task families in GPT-5 itself, after reasonable attempts to elicit its capabilities.
contradiction_condition: Controlled evaluations establish broad, dependable competence on unfamiliar tasks using GPT-5 alone, sufficient for the ordinary meaning of general-purpose intelligence.
measurement_requirements: Identify the model version, permitted tools, prompting, reasoning budget, task selection, human comparison and repeatability. An isolated failure or benchmark title containing AGI is insufficient.
source_requirements: Primary capability evaluations with disclosed methods; independent replication is preferable.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: A reproducible evaluation of the original GPT-5 could settle its capability without waiting for a deadline if it establishes broad competence or persistent generalization limits under the specified unaided configuration.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - No operational definition of AGI or arbitrary tasks.
  - The boundary of external aids is unspecified.
  - The target could mean the initial system or subsequent updates.
  - No deadline.
retrospective_or_prospective: retrospective
