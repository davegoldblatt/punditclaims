assessment_axis: forecast_outcome
explicit_source_elements:
  - hundreds of billions of dollars’ worth of AI data center loans
  - I believe the vast majority of them will go unpaid
  - hit bank balance sheets and private credit funds
  - to indeterminate levels
evaluator_interpretation:
  - I believe expresses a forecast, not a condition that must occur.
  - The forecast primarily concerns the AI data-center loans already outstanding at publication. Future originations should not silently change that cohort.
  - Because the source frames exposure in dollars, the primary reading weights nonpayment by outstanding principal. Loan-count results should also be reported if available.
  - Vast majority means a share clearly well above half. No exact percentage is supplied, so a borderline result cannot be resolved by inventing a cutoff.
  - Go unpaid means lasting failure to satisfy contractual payments after recoveries or restructuring, rather than a temporary delinquency or a fall in traded debt prices.
  - Hundreds of billions implies at least $200 billion of outstanding loans, not projected future financing, equity, leases, or all corporate bonds.
  - The amount of resulting lender damage is expressly unspecified.
support_condition: A documented publication-date loan cohort totals hundreds of billions of dollars, a clearly overwhelming share ultimately remains unpaid after recoveries, and banks and private credit funds record attributable losses.
contradiction_condition: Complete repayment and recovery records show that most of the relevant loan principal was paid, making nonpayment by a vast majority impossible. A verified substantially smaller initial loan stock would separately contradict the scale clause.
measurement_requirements: A deduplicated inventory of outstanding AI data-center loans at publication, principal balances, contractual maturities, defaults, repayments, recoveries, write-offs, and lender holdings. Distinguish loans from other financing instruments.
source_requirements: Borrower filings, lender disclosures, loan-level servicing or court records, and transparent aggregate credit datasets. Forecast financing needs and market-implied default probabilities are context only.
metric_scope:
  company: AI data-center borrowers; exposed banks and private credit funds
  metric: Outstanding AI data-center loan principal and its ultimately unpaid share
  currency: USD
  units: billions and percent of principal
  accounting_basis: unknown
  fiscal_or_calendar: calendar
  period_start: 2026-08-04
  period_end: 2026-08-04
  stock_or_flow: stock
  annualized_or_realized: not_applicable
  gross_or_net: gross
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve when irreversible write-offs and recoveries establish overwhelming nonpayment across the defined cohort, or completed repayments make that outcome impossible. A single default, refinancing, or market selloff cannot settle the aggregate forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - No repayment deadline or forecast end date.
  - Vast majority has no numerical cutoff.
  - Principal weighting versus loan-count weighting.
  - Existing loans versus an expanding future cohort.
  - Treatment of partial recoveries and restructuring.
  - No source or accounting basis for the initial loan-stock estimate.
retrospective_or_prospective: retrospective
outcome_known_at_freeze: false
