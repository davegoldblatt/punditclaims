evaluator_interpretation:
  - Targeting includes assisting target identification, assessment or prioritization. It does not require autonomous weapon release.
  - The observation concerns operations before and after the public dispute, through the March 8 post. The source supplies no beginning date.
  - Consent and assistance are hedged suggestions. General deployment assistance does not establish participation in individual targeting decisions.
support_condition: Reliable records establish actual Claude-assisted targeting on both sides of the dispute. Documentation of Anthropic's authorization and assistance would additionally substantiate the hedged clauses.
contradiction_condition: Reliable operational records establish that Claude was not used for targeting during one of the claimed phases. Evidence against consent or assistance would address those clauses separately.
measurement_requirements: Distinguish operational targeting from general intelligence work, software availability, demonstrations and autonomous weapons.
source_requirements: Prefer operational records and company disclosures. Reporting based on knowledgeable sources is acceptable where operational records are unavailable.
