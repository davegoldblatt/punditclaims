explicit_source_elements:
  - if it can’t afford to do so further
  - nobody else can either
  - continue subsidizing compute
evaluator_interpretation:
  - The antecedent requires Microsoft's financial inability to continue compute subsidies. Changing a product's prices does not by itself establish that inability.
  - The comparison concerns other AI providers' ability to finance comparable subsidies, rather than whether every provider chooses the same prices.
  - The hedged description of Microsoft's relative position is supporting reasoning, not a separate precise financial ranking.
support_condition: After Microsoft's financial inability to continue comparable compute subsidies is established, evidence establishes that no other relevant provider can finance them.
contradiction_condition: After the antecedent is established, at least one other provider demonstrably can finance and sustain comparable compute subsidies.
measurement_requirements: Define the subsidy, its size and duration, and comparable service costs. Assess available financial resources and obligations; subscription prices alone do not measure subsidies or affordability.
source_requirements: Financial disclosures or reliable reporting establishing Microsoft's inability, followed by comparable evidence about other providers.
