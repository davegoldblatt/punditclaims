assessment_axis: causal_assessment
explicit_source_elements:
  - the “demand” for AI GPUs
  - was manufactured by Jensen Huang
  - the hype cycle he created
  - exploiting the desperation of a flailing tech industry
evaluator_interpretation:
  - The ordinary reading is that Huang's promotion and financing materially created purchases that underlying customer demand would not otherwise justify.
  - The claim concerns the AI GPU boom up to publication. It supplies no precise starting date.
  - Manufactured demand is stronger than ordinary marketing or financing that enables customers to satisfy existing demand.
  - A financing relationship alone does not establish the claimed causal explanation.
support_condition: Purchasing and financing records show that Huang's interventions materially induced unjustified AI GPU purchases, with evidence distinguishing that effect from demand for productive workloads.
contradiction_condition: Credible causal evidence shows that the relevant purchases were driven by independently justified workloads and would substantially have occurred without Huang's promotion and financing.
measurement_requirements: Customer purchase decisions, financing terms, actual deployment and utilization, and a defensible comparison of demand with and without the claimed interventions.
source_requirements: Customer records, contracts, internal communications, independent investigations or causal research. Supplier promotional claims alone cannot settle causation.
