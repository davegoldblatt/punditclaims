explicit_source_elements:
  - new study
  - Stanford, MIT CSAIL, Carnegie Mellon, ITU Copenhagen, and NVIDIA and Elloe AI Labs
  - 847 autonomous agent deployments
  - healthcare, finance, customer service and code-generation
  - 91% were vulnerable to subtle but dangerous tool-chaining attacks
evaluator_interpretation:
  - This claim reports what a study found. It is not a claim that 91% of all real-world agents are vulnerable. It holds if the cited study reported that about 91% of 847 deployments in those sectors were susceptible to tool-chaining attacks.
  - No link to the paper was given and the primary text could not be found. A reputable report on the paper's findings, especially one quoting its author, counts as evidence of what the paper reported.
support_condition: The study, or a reliable report of it, says that it examined 847 agent deployments in healthcare, finance, customer service and code generation, and that 91% were susceptible to tool-chaining attacks.
contradiction_condition: The study, or a reliable report of it, gives a materially different sample size or rate, or reports no such tool-chaining figure.
measurement_requirements: Sample size of 847 deployments; share vulnerable to tool-chaining of about 91%.
source_requirements: Ideally the paper itself. Failing that, a reputable news report on the paper's findings.
