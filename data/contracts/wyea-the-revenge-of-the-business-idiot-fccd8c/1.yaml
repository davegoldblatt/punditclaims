ambiguity_flags:
  - Costs could mean inference costs, compute expenses, or all operating expenses.
  - No tolerance or comparison interval is supplied for linear scaling.
  - Q1 is the evaluator's latest-completed-quarter interpretation of the ongoing cost assertion.
  - Q2 was unfinished when the speaker described it as profitable.
  - The initial fee reduction may reflect capacity ramp-up rather than a lower price for identical service.
  - The source's non-GAAP terminology does not supply a complete accounting reconciliation.
