assessment_axis: causal_assessment
explicit_source_elements:
  - Anthropic’s costs scale linearly with its revenues
  - the only reason Q2 was profitable
  - costs were artificially suppressed
evaluator_interpretation:
  - Interpret linear scaling ordinarily as costs rising roughly in proportion to revenue, rather than merely increasing at the same time.
  - The linked companion article expressly treats Q2 profitability as non-GAAP. Assess operating profitability on that basis without equating it with net income or automatically equating it with EBITDA.
  - For the ongoing cost assertion, Q1 2026 is the latest completed quarter before the post. The causal assertion concerns calendar Q2 2026, including the May–June fee reductions.
  - Because the source itself treats Q2 as an exception caused by discounts, the cost-scaling test requires a comparable series before discounts or adjusted for their effect.
  - "The 'only reason' assertion requires a counterfactual: with the same services and revenue, replacing the reduced fees with ordinary comparable fees must eliminate operating profit."
support_condition: Comparable cost and revenue records establish roughly proportional scaling, and a reconciled Q2 calculation shows that removing temporary fee concessions eliminates non-GAAP operating profit.
contradiction_condition: Comparable costs excluding the temporary concession effect do not scale roughly proportionally, or Q2 remains profitable on the same non-GAAP basis after replacing the concessions with ordinary fees for the same services.
measurement_requirements: Obtain realized revenue, consistently defined operating costs, the non-GAAP reconciliation, actual May–June invoices, and comparable service volumes. Separate reduced prices from lower capacity delivered during ramp-up.
source_requirements: Company accounts and contract or invoice records, supplemented by reputable reporting when primary records are unavailable.
