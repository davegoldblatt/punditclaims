explicit_source_elements:
  - these services still burn tokens
  - $5 per million input and $25 per million output for Opus 4.7
  - the company almost always loses money
  - unless a person doesn’t use the subscription very much
evaluator_interpretation:
  - "The core claim concerns subscriber-level economics across AI services: ordinary and heavy users almost always cost more to serve than they pay."
  - Light use must be defined by usage volume or frequency independently of profitability, rather than defining every profitable user as light.
  - The token-price example is a proposed explanation, not sufficient evidence of the broader profitability claim.
  - For the ongoing state, I use April 2026 through publication as the current observation window, including the newly named Opus model.
  - The exception for light users describes the population being assessed; it is not a conditional forecast.
support_condition: Representative subscriber-level evidence across services shows that actual serving costs exceed subscription receipts for nearly all ordinary and heavy users in the target period, with profitable exceptions concentrated among independently defined light users.
contradiction_condition: Representative evidence shows a substantial share of ordinary or heavy users covering their actual serving costs, inconsistent with almost always losing money.
measurement_requirements: Matched per-user subscription receipts, token usage, model mix, caching, actual supplier or infrastructure costs, and usage distributions. Account for overage payments and distinguish retail API prices from actual provider costs.
source_requirements: Provider records or transparent independent per-user cost studies spanning representative services and usage levels. Hypothetical maximum usage is insufficient.
