evaluator_interpretation:
  - The four problems are generalization to new instances, abstract reasoning, tracking individuals and properties without hallucination, and understanding complex syntax and semantics.
  - The plain contextual reading of a principled solution is a reliable general method for at least one capability, not a narrow task-specific algorithm or benchmark improvement.
  - Treat quarter century as approximate. The stated history runs from the book’s writing in 2000 through March 5, 2025.
  - Evidence of failures in selected models cannot by itself establish that the entire field lacks a solution.
support_condition: A sufficiently broad research record establishes that all four capabilities still lack reliable general solutions by the post date.
contradiction_condition: A reproducible, established method provides a reliable general solution to at least one of the four capabilities by the post date.
measurement_requirements: Specify the capability, generalization domain, reliability criterion, and limits of each proposed solution. Do not equate benchmark success with a general solution.
source_requirements: Independent primary research and benchmark records covering proposed solutions as well as failures; a field-wide conclusion requires broader coverage than isolated examples.
