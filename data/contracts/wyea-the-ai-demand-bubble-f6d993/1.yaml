original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Resolve only after a dated economic failure establishes the antecedent and sufficiently complete post-failure measurements settle both claimed declines. Continued operation cannot contradict this conditional forecast.
interpretation_determines_result: false
plain_reading: true
ambiguity_flags:
  - Die has no formal insolvency or operating threshold.
  - All AI lacks a defined industry boundary.
  - Compute demand could mean consumption, spending, or commitments.
  - No mapping of individual lab failures to the percentage endpoints.
  - No post-failure measurement window.
  - No accounting basis or treatment of transactions within the AI supply chain.
retrospective_or_prospective: retrospective
