assessment_axis: forecast_outcome
explicit_source_elements:
  - OpenAI and Anthropic are both separately load-bearing companies
  - If either or both of them die
  - 40% to 73%
  - all AI revenue and compute demand evaporates
evaluator_interpretation:
  - Die means economic failure as an operating business able to sustain its compute purchases. The context permits a shell entity or continued access to its models, so legal dissolution is not required.
  - An acquisition, product retirement, or reported accounting loss alone does not establish that antecedent.
  - The ordinary reading requires a 40%–73% decline in both industry AI revenue and compute demand after the failure.
  - All AI means industry-wide activity, not only the labs' own sales or selected hyperscaler contracts.
  - Demand that transfers to competitors has not evaporated. Revenue must be measured consistently without changing the treatment of transactions between suppliers and customers.
  - The source gives no exact mapping from one-lab versus two-lab failure to the percentage endpoints, and no dated measurement window.
support_condition: After documented economic failure of either or both labs, comparable industry-wide measurements show an attributable 40%–73% loss of both AI revenue and compute demand after accounting for customer migration.
contradiction_condition: After the antecedent occurs, sufficiently complete and comparable measurements show that the predicted decline in revenue or compute demand falls outside the stated range. Different results for the two measures would require separate treatment.
measurement_requirements: Documented lab failure; consistent industry revenue coverage; realized compute consumption or contracted demand measured consistently before and after failure; customer migration; and evidence separating the failure's effect from other changes.
source_requirements: Court or company records for economic failure, together with independent industry measurements and supplier disclosures. Product availability alone cannot prove financial viability.
metric_scope:
  company: AI industry, conditional on OpenAI and/or Anthropic failure
  metric: Percentage decline in industry AI revenue and compute demand
  currency: null
  units: percent
  accounting_basis: unknown
  fiscal_or_calendar: unknown
  period_start: null
  period_end: null
