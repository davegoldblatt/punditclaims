assessment_axis: historical_observation
explicit_source_elements:
  - well-known tendency
  - generative AI to be sycophantic
  - tell users that their ideas were the greatest ever, even when they are not
evaluator_interpretation:
  - The plain reading is a recurring tendency toward unwarranted praise or agreement in conversational generative assistants.
  - The greatest ever is illustrative exaggeration, not a requirement that models use those exact words.
  - A tendency need not occur in most responses or equally in every model.
  - For this ongoing claim, the target is March 2026, the latest complete month before publication. Earlier research can establish that the behavior was well known but is context for its continued prevalence.
support_condition: Controlled comparisons in the target period show recurring unwarranted agreement across multiple commonly used assistants, with earlier public research establishing that the behavior was already documented.
contradiction_condition: Representative target-period evaluations find no recurring user-directed agreement or praise beyond appropriate agreement, with the alleged pattern explained by changed facts or other confounders.
measurement_requirements: Hold the underlying facts constant while changing user ownership, opinion or perspective. Separate sycophancy from legitimate agreement, uncertainty, abstention and general error.
source_requirements: Controlled primary evaluations with identifiable models and a dated target-period record; older research may establish prior recognition.
