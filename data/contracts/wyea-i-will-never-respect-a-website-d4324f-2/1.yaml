explicit_source_elements:
  - LLMs
  - cannot be deterministic
evaluator_interpretation:
  - The ordinary technical meaning of deterministic is producing identical outputs from identical inputs under fixed model and execution conditions.
  - The claim denies that deterministic LLM inference is possible; it does not merely describe default behavior of hosted chatbot services.
  - This is an as-of-publication capability claim without a reporting cycle. The target covers implementations already demonstrated by 2026-04-14, with no lower date supplied by the speaker.
  - Reproducibility and factual correctness are separate properties.
support_condition: Evidence that LLM inference necessarily varies despite fixed inputs, model parameters, decoding and execution conditions, with no feasible deterministic implementation.
contradiction_condition: A documented LLM implementation that provides reproducible inference under specified conditions, supported by implementation details and repeated-output tests.
measurement_requirements: Specify the model, prompt, decoding settings and execution controls. Distinguish repeatability under fixed conditions from invariance across arbitrary hardware or software changes.
source_requirements: Primary engineering documentation and reproducibility results publicly available by the post date.
