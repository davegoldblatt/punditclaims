explicit_source_elements:
  - In Q1 2026
  - Amazon had $18.94 billion
  - Microsoft $10.1 billion
  - Google $4.4 billion in depreciation
  - That’s $33.44 billion!
  - That’s more than $25 billion!
evaluator_interpretation:
  - Q1 means January–March 2026, including Microsoft's fiscal third quarter.
  - Google means consolidated Alphabet, the reporting entity used for this comparison.
  - The amounts are presented as company-reported expenses.
  - For a comparable total, depreciation means property-and-equipment depreciation, including amortization of finance-leased property. Broader cash-flow adjustments containing content amortization, operating lease assets, or other items are not interchangeable with this measure.
  - The $25 billion is the stated comparison threshold. This assessment does not independently certify the underlying global AI revenue estimate.
  - Assess the accuracy of the stated amounts separately from whether comparable expenses exceeded $25 billion.
support_condition: Matching quarterly disclosures substantiate the three amounts and their $33.44 billion total. The comparison component holds if a comparable total exceeds $25 billion.
contradiction_condition: Matching disclosures materially disagree with the stated amounts or total. The comparison component fails if the comparable total is at most $25 billion.
measurement_requirements: Use realized quarterly expenses for January–March 2026. Separate property depreciation from broader depreciation-and-amortization cash-flow adjustments. Preserve rounding uncertainty.
source_requirements: Company quarterly filings or financial disclosures, with reproducible calculations across the three companies.
