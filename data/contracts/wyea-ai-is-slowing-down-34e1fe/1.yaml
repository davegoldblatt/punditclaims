assessment_axis: historical_observation
explicit_source_elements:
  - Microsoft’s $37 billion in AI annual run rate
  - predominantly made up of OpenAI’s compute
  - with the rest of it
  - maybe $8 billion in annual revenue at best
  - Copilot
evaluator_interpretation:
  - The target period is Microsoft's fiscal third quarter ending March 31, 2026, the latest reported quarter before the post.
  - "'Predominantly' means more than half of the stated AI revenue run rate."
  - The claim attributes the remainder to Copilot. Copilot is read broadly because the sentence does not identify a particular Copilot product.
  - The $8 billion figure is explicitly tentative. It is assessed as an estimate, not an unconditional numerical ceiling.
  - Annual realized revenue cannot be divided by a point-in-time annualized run rate to establish a customer share.
  - The pejorative description of selling Copilot is not a separate measurable proposition.
support_condition: A compatible breakdown of the fiscal-third-quarter AI revenue run rate shows that OpenAI compute accounts for more than half and Copilot accounts for the remainder, with any $8 billion estimate reconciled to its stated measurement basis.
contradiction_condition: A compatible breakdown shows OpenAI compute at half or less, or shows a material remainder attributable to products or customers outside Copilot.
measurement_requirements: The components and annualization method of the $37 billion measure, OpenAI compute revenue on the same basis, and comparable Copilot and other AI revenue.
source_requirements: Microsoft disclosures or authenticated reporting that directly reconciles the same-period revenue components. Backlog, investment income, and later full-year revenue are not interchangeable.
