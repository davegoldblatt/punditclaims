assessment_axis: forecast_outcome
explicit_source_elements:
  - never going to have a moratorium
  - anytime in the near-term
evaluator_interpretation:
  - In the pause-letter context, a moratorium means a broad government-imposed or industry-wide pause in frontier-model development.
  - Restrictions on particular uses, local data-center construction, and pauses on AI regulation do not constitute that moratorium.
  - “Near-term” supplies no duration from which a latest date can be calculated. No six-month, one-year, or two-year deadline is added.
  - The forecast therefore remains open for formal scoring, although evidence from the months following publication can bear on its direction.
support_condition: Reliable records establish that no qualifying moratorium occurred throughout a bounded near-term period grounded in the speaker’s wording or contemporaneous clarification.
contradiction_condition: A broad frontier-development moratorium was adopted during a period unambiguously within the forecast’s near-term scope.
measurement_requirements: Distinguish enacted or implemented pauses from proposals, voluntary risk-contingent commitments, product restrictions, and regulatory moratoria.
source_requirements: Government records, implemented industry agreements, and reliable contemporaneous accounts covering the relevant jurisdictions and developers.
metric_scope: null
original_horizon: anytime in the near-term
horizon_interval:
  start: 2023-09-21
  end: null
  precision: day
target_period: null
condition_status: not_applicable
early_resolution_rule: An adopted broad moratorium in the months immediately following publication could conclusively contradict the forecast. Continued development or absence of a moratorium at a selected date cannot conclusively support it without a source-grounded endpoint.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - “Near-term” has no fixed endpoint.
  - The geographical scope of “we” is unstated.
  - The breadth and legal form of a qualifying moratorium are unstated.
retrospective_or_prospective: retrospective
