evaluator_interpretation:
  - Read as a claim about safety preparation for the July 2025 Grok 4 release, following the supplied release context.
  - The ordinary reading concerns whether meaningful checks were completed before release, including safety documentation. It does not require checks to prevent every subsequent failure.
  - Missing public documentation can establish a disclosure failure. It cannot by itself establish that internal testing was absent or inadequate.
  - Use July 1–15, 2025 as the release-period snapshot described by the post. Later reports qualify only insofar as they establish what happened before release.
support_condition: Dated release records or an independent investigation establish that standard safety preparation was omitted or materially inadequate. Missing launch documentation supports the documentation component but does not alone settle the broader claim about internal checks.
contradiction_condition: Dated records establish that meaningful pre-release safety evaluations, adversarial testing, and appropriate safety documentation were completed, with no demonstrated material deficiency relevant to the claim.
measurement_requirements: Identify the model and deployed configuration, dates of testing, tested risks, findings, mitigations, and publication dates of safety documentation. Separate Grok 4 from earlier Grok incidents.
source_requirements: Prefer contemporaneous company records and independent evaluations. A later model card must explicitly establish pre-release timing to resolve the internal-testing component.
