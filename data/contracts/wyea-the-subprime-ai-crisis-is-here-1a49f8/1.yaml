explicit_source_elements:
  - they collectively
  - $2 trillion
  - brand new AI revenues
  - by 2030
  - for any of it to make sense
evaluator_interpretation:
  - Read 'make sense' as financially sustainable investment that covers costs and earns a reasonable return.
  - Assess the claimed financial requirement, not a prediction that hyperscalers will actually receive this revenue.
  - Read the amount as additional annual revenue in 2030. The sentence does not explicitly distinguish annual revenue from cumulative revenue.
  - The supplied passage does not establish an accounting basis or enumerate the hyperscalers.
support_condition: A reproducible financial model for the relevant hyperscalers establishes that their AI investment requires approximately $2 trillion of additional annual AI revenue in 2030, with explicit costs, asset lives and return assumptions.
contradiction_condition: Comparable financial evidence establishes that the same investment can earn sustainable returns with materially less additional AI revenue, or establishes a materially different required amount.
measurement_requirements: Identify the companies, investment commitments, operating expenses, depreciation, utilization, revenue baseline and required return. Avoid counting transactions between companies twice.
source_requirements: Company financial disclosures and independently reproducible investment-return calculations. An industry scenario alone does not establish an unavoidable company-level requirement.
