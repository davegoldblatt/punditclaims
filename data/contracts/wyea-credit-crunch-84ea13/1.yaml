explicit_source_elements:
  - OpenAI’s audited 2025 financials
  - $34 billion of expenses
  - $13.07 billion in losses
  - EBITDA of $20.92 billion
  - EBITDA margin of negative 160%
evaluator_interpretation:
  - Assess the 2025 annual results, not annualized revenue or a later forecast.
  - The negative margin and surrounding discussion imply negative EBITDA, despite the missing minus sign before $20.92 billion.
  - Preserve the explicit reference to $13.07 billion in losses as a possible labeling error; do not silently change it to revenue.
  - An audited financial statement does not necessarily report EBITDA. A reconciliation is needed before treating operating loss as EBITDA.
support_condition: The annual statements establish approximately $34 billion in expenses, and a valid EBITDA reconciliation establishes approximately negative $20.92 billion and a margin rounding to negative 160%. The stated loss figure must also be reconciled.
contradiction_condition: Comparable annual statements and an EBITDA reconciliation establish materially different expenses or an EBITDA margin that does not round to negative 160%. A mislabeled input alone does not establish that the margin is false.
measurement_requirements: Annual revenue, total expenses, operating and net losses, depreciation, amortization, interest, taxes and any EBITDA adjustments. Preserve the distinction between operating margin and EBITDA margin.
source_requirements: Prefer the audited statements and notes. Independent reporting on reviewed or verified statements may corroborate individual figures but cannot supply a missing EBITDA bridge.
