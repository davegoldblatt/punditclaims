assessment_axis: historical_observation
explicit_source_elements:
  - a technology that has only ever lost money
  - has no path to sustainability
  - large language models
  - ChatGPT and Claude
evaluator_interpretation:
  - The ordinary financial reading concerns the overall economics of developing and supplying commercial LLM services, including research and deployment costs.
  - Only ever covers commercial history through the post date. No arbitrary starting date is supplied.
  - Overall profit is distinct from gross margin, operating profit, cash flow and the profitability of a diversified parent company.
  - No path to sustainability is read as asserting that no demonstrated, credible self-financing business model existed at publication. Its stronger reading as permanent impossibility is an undated forecast that historical losses cannot establish.
  - The statement identifies no accounting basis. Under the money-claim rules, that prevents a supported or contradicted financial verdict.
support_condition: Comparable historical financial records establish overall losses throughout the relevant commercial history, and evidence about operating economics supports the absence of a credible self-financing model at publication. Losses at two developers alone cannot establish the technology-wide assertion.
contradiction_condition: A commercially relevant LLM business demonstrably earned overall profit under a comparable accounting measure before publication, or had a demonstrated durable self-financing model. Gross or operating profit alone does not establish net profitability.
measurement_requirements: Separate net income, operating income and cash flow; include full development and delivery costs; distinguish company-wide and LLM-specific results. A matched accounting basis and business perimeter are required for a decisive verdict.
source_requirements: Prefer company financial statements. Independently verified reporting may provide context where public statements are unavailable; the speaker's own reporting cannot establish the claim.
