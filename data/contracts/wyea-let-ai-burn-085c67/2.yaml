assessment_axis: historical_observation
explicit_source_elements:
  - LLMs
  - a technology that has only ever lost money
  - has no path to sustainability
evaluator_interpretation:
  - The ordinary reading concerns commercial LLM businesses covering their full costs, including development, training, inference, staff and overhead, rather than merely earning revenue or a positive inference margin.
  - The target is LLM technology's commercial economics broadly. OpenAI and Anthropic are prominent examples, but the wording does not restrict the claim to those two companies.
  - "'Only ever' covers commercial history through the post date, not merely the latest quarter. The start is left unspecified because the source supplies no inception date."
  - "'Has no path' is assessed as a present assertion that no commercially credible route to self-sustaining operations existed at the post date. It is not assigned an invented future deadline."
  - A credible route requires evidence linking attainable revenue to full costs; financing, optimistic projections and isolated positive gross margins do not by themselves establish one.
  - No accounting standard is stated. Evidence must be compared on its actual cost coverage; the missing accounting label alone is not the substantive reason for leaving this claim unresolved.
support_condition: Comparable evidence covering the claimed industry and its commercial history shows continuing full-cost losses, and evidence about feasible revenues and costs establishes the absence of a credible self-sustaining business model as of the post. Losses at selected developers alone do not establish both categorical assertions.
contradiction_condition: A documented LLM business achieved genuine full-cost profitability during the target period, or evidence available about that period demonstrates a commercially credible route to sustained full-cost profitability. The business must be attributable to LLM activity rather than unrelated profitable operations.
measurement_requirements: Compare realized LLM-attributable revenue with full costs over matching periods. Distinguish net income, operating income, cash flow, gross margins and hypothetical inference margins; reconcile exclusions and material noncash charges. Assess commercial viability separately from the historical profit record.
source_requirements: Prefer public company financial statements and sufficiently detailed operating disclosures. Independent reporting may be used where primary private-company accounts are unavailable, with that limitation stated. The speaker's own reporting cannot establish his claim.
