assessment_axis: historical_observation
explicit_source_elements:
  - current AI simply isn’t reliable
  - mistakes will absolutely made
  - problems with reasoning and with visual cognition
evaluator_interpretation:
  - In context, current AI means contemporary general-purpose generative AI, including systems with visual capabilities.
  - The ordinary reading is that these systems retain material, recurring failures that prevent dependable use across demanding tasks without verification. It does not mean every system fails on every task.
  - Because the claim describes an ongoing state without a reporting period, the target period is February 2026, the latest complete month before publication.
support_condition: Contemporaneous evaluations or scientific assessments establish recurring factual, reasoning or perception failures that materially limit dependable use.
contradiction_condition: Representative evaluations establish dependable performance across the relevant tasks and conditions, with the alleged recurring reliability failures absent or adequately controlled.
measurement_requirements: Identify the systems, tasks and evaluation conditions. Distinguish benchmark failures from measured military targeting errors. An isolated error alone is insufficient.
source_requirements: Research evaluations or authoritative scientific assessments describing systems available before the post.
