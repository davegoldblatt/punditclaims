assessment_axis: historical_observation
explicit_source_elements:
  - incrementally better
  - previous recent models
  - certainly not an off-the-chart breakthrough
evaluator_interpretation:
  - The accompanying ECI comparison makes broad measured capability relative to the recent cross-company frontier the most natural reading.
  - Incremental means an improvement broadly consistent with the recent trajectory, rather than a clear, unusually large departure. Marcus supplies no numerical boundary.
  - The target is the Mythos Preview version announced on April 7, as assessed during April 7–9, 2026. Later publications may inform that historical assessment only when they concern this version.
  - A cyber-specific capability jump is relevant counterevidence to the broad wording, but cannot by itself determine a general-capability index.
support_condition: Comparable broad benchmark aggregates place launch-version Mythos near the recent cross-company trajectory, with a modest lead that is robust to reasonable benchmark and trend choices.
contradiction_condition: Comparable broad benchmark aggregates show a clear, unusually large departure from the recent cross-company trajectory, robust to reasonable benchmark and trend choices.
measurement_requirements: Use comparable model versions, benchmark configurations, and dates. Separate Anthropic's internal index from Epoch's index and general capability from cyber-specific capability.
source_requirements: Prefer original benchmark results and reproducible independent aggregate analyses. Check corrections and checkpoint differences before relying on early comparisons.
