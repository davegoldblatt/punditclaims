evaluator_interpretation:
  - Read our as the United States, contrasted with China in the surrounding paragraph.
  - Read lead as frontier AI model capability, given the explicit reference to DeepSeek and the supplied proposition.
  - Diminishing requires comparison with an earlier capability gap, rather than evidence that DeepSeek is merely capable.
  - Use January 1 through March 2, 2025 for the ongoing early-2025 state. Earlier results serve as the comparison baseline.
support_condition: Comparable evaluations show that DeepSeek approached leading US models by early 2025 and that the US-China frontier-model performance gap had narrowed from its earlier level.
contradiction_condition: Comparable evaluations show that the US-China frontier-model gap remained unchanged or widened, with DeepSeek failing to approach the US frontier.
measurement_requirements: Compare dated model results on the same evaluation system. Do not interpret benchmark or rating differences as a direct measure of total national AI capacity.
source_requirements: Prefer independent benchmark histories and research reports identifying model providers, dates, and evaluation methods.
