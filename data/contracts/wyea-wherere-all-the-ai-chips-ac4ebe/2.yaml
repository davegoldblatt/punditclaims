  - the vast majority of capex is yet to be put in service
evaluator_interpretation:
  - The claim says what depreciation trends 'suggest'. It is his reading of a ratio (D&A as a share of capex), not a firm factual statement.
  - He names no spending period (no cohort of capex), no company-by-company scope, and no in-service measure. Testing whether 'the vast majority' of capex is out of service would mean supplying a cohort and a measure he did not give, and dropping his hedge.
  - So it is treated as not adjudicable.
support_condition: "Not applicable: the claim is a hedged inference with no stated capex cohort or measure."
