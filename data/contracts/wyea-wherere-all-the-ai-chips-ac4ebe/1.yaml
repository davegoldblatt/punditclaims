explicit_source_elements:
  - hyperscaler depreciation
  - spread out the cost of GPUs over 6 years starting from when they enter service
  - suggests that the vast majority of capex is yet to be put in service
evaluator_interpretation:
  - Use Microsoft, Alphabet, Amazon and Meta, the companies identified in the surrounding discussion.
  - The plain reading is that a clearly dominant share of the capital spending being discussed remains undeployed; no numerical cutoff is supplied.
  - Use the quarter ended June 30, 2026, as the latest completed reporting quarter publicly reportable before the September 22 post.
  - The spending cohorts are unspecified. Do not silently equate current-quarter capex, cumulative spending and the surviving asset stock.
  - Company-reported accounting figures are implied by the surrounding D&A-to-capex discussion; the speaker does not explicitly specify GAAP.
support_condition: A reconciliation of relevant spending cohorts, assets placed in service and assets awaiting service shows that a clearly dominant share remains undeployed across the named hyperscalers.
contradiction_condition: A comparable reconciliation shows that most relevant spending has entered service. Merely demonstrating that D&A divided by current capex is an invalid estimator does not establish the opposite factual outcome.
measurement_requirements: Match capital-spending cohorts to commissioned assets. Reconcile useful lives, depreciation timing, finance leases, retirements, acquisitions, land and non-datacenter assets. Do not interpret an expense-to-spending ratio as the share deployed.
source_requirements: Company financial statements and asset notes, preferably supplemented by commissioning records and cohort reconciliations.
