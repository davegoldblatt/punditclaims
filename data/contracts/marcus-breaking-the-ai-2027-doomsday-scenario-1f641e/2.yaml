explicit_source_elements:
  - As far I can tell
  - The White House is getting its cues from the podcast crowd
  - All-In, Dwarkesh, Lex, Hard Fork, etc
  - those guys refused to allow me to voice a rebuttal
evaluator_interpretation:
  - The influence clause is expressly qualified as Marcus's inference. It cannot fairly be graded as an unqualified assertion that podcasts determined White House policy.
  - The refusal clause alleges a separately checkable event. In context, the rebuttal concerns AI 2027, rather than whether Marcus ever appeared on these podcasts.
  - The supplied claim combines these clauses. A single factual grade would require either removing the hedge or assessing only part of his statement.
  - The influence inference concerns the situation at publication on November 21, 2025. The alleged refusals occurred earlier, but their dates are unspecified. No target period is imposed because the combined claim is not being scored as an observation.
support_condition: No single factual support condition fairly settles the combined statement as written. Officials' statements or communications tracing their thinking to the named podcasts could corroborate the influence inference. Authenticated rebuttal requests and refusals, or acknowledgments from the recipients, could establish the separate refusal allegation.
contradiction_condition: No single factual contradiction condition fairly settles the combined statement as written. Correspondence showing that the relevant rebuttal requests were accepted could contradict the refusal allegation. Missing public appearances cannot establish refusals, and missing evidence of influence cannot falsify Marcus's expressly qualified inference.
measurement_requirements: For the refusal allegation, identify the recipients, dates, requested rebuttal and responses. Distinguish an explicit refusal from silence, scheduling difficulties or an unrelated appearance.
source_requirements: Use authenticated communications, statements from the podcast hosts or producers, and official records or attributable statements about influence. Marcus's own allegation is not independent confirmation.
