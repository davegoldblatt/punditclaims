evaluator_interpretation:
  - "This combines two allegations: podcast influence on White House AI policy and refusals to air Marcus's rebuttal to AI 2027."
  - Getting cues means identifiable influence on policy thinking; shared language or social connections alone are insufficient.
  - The qualification expresses uncertainty, not a conditional antecedent.
  - The observation concerns the current administration through the post date. Because policy influence has no quarterly reporting period, the target interval runs from the administration's start through November 21, 2025.
  - A refusal requires evidence of a request and a rejection or equivalent decision. An absent appearance alone does not establish refusal.
support_condition: Records establish substantive influence from the identified podcast circle and independently corroborate the alleged refusals by the named programs.
contradiction_condition: Authenticated records directly disprove the alleged influence or demonstrate that the named programs offered the relevant rebuttal opportunity rather than refusing it.
measurement_requirements: Identify the program, communication, date, requested rebuttal, response, and policy decision or statement allegedly influenced.
source_requirements: Official statements, policy-development records, disclosed correspondence, or corroborated reporting. Marcus's own account cannot independently establish the allegation.
