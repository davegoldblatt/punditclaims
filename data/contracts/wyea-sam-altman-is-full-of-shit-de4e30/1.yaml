explicit_source_elements:
  - OpenAI lied to the media
  - multiple times
  - Murati said Sky wasn't meant to sound like Johansson
  - "\"AI voices should not deliberately mimic a celebrity's distinct voice\""
  - "\"in conversations\" with Johansson's representatives, by omission"
evaluator_interpretation:
  - Read in context, the claim is that OpenAI's statements to the press about Sky in May 2024 were knowingly false or deliberately misleading on more than one occasion. The core alleged falsehood is the denial that Sky was meant to imitate Johansson.
  - A lie means a statement the company knew was false, or an omission meant to mislead. Showing that Sky resembles Johansson is not enough by itself. There has to be evidence that the denials were untrue.
  - The period covers Sky's casting and design, from early 2023, through OpenAI's statements up to the post date.
support_condition: Public documents, testimony, court records or credible reporting showing that OpenAI meant Sky to imitate Johansson, or that its May 2024 press statements about Sky's origin or withdrawal were false and OpenAI knew it.
contradiction_condition: Credible records showing Sky was cast and designed without reference to Johansson, so that OpenAI's denials were accurate, and no evidence that other statements were false.
measurement_requirements: null
source_requirements: Casting and production records, court filings, or independent reporting based on documents. OpenAI's statements alone cannot establish that they were true.
