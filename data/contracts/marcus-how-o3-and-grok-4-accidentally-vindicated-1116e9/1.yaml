assessment_axis: historical_observation
explicit_source_elements:
  - Neural networks are good at learning
  - weak at generalization
  - symbolic systems are good at generalization
  - not at learning
evaluator_interpretation:
  - "The surrounding examples make systematic and out-of-distribution generalization the relevant reading: applying learned components or explicit rules in unfamiliar combinations."
  - The statement describes broad strengths and weaknesses, not a claim that every neural network fails every generalization task or that symbolic learning is logically impossible.
  - Good at learning includes learning useful rules or representations from examples; it is not restricted to perceptual learning from raw data.
  - This is a general summary of established methods, not a periodically reported quantity. The target is the research record available through the post, with no stated historical start. Earlier established results are therefore relevant rather than reassigned to 2025.
support_condition: "Comparative research substantiates the proposed complementary strengths: effective neural learning with systematic generalization weaknesses, and reliable symbolic rule application with substantial learning limitations."
contradiction_condition: Research demonstrates material neural systematic-generalization successes or effective symbolic learning that makes the broad division misleading. Isolated successes do not establish the reverse universal claim.
measurement_requirements: Distinguish ordinary held-out prediction from systematic generalization, and distinguish symbolic rule execution from learning rules. Record task, training regime, background knowledge, and limits of transfer.
source_requirements: Primary empirical studies and research reviews that describe methods, comparisons, and limitations, available by the post.
