  - "'Close' has no numerical deadline."
  - "'On the premise' could mean a material stated rationale or a necessary assumption; this assessment uses the former."
  - The ongoing observation has no stated reporting period; the current year through publication is used.
  - Some relevant decision-makers discuss superintelligence rather than AGI.
