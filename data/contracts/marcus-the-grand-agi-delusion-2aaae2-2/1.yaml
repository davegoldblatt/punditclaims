assessment_axis: historical_observation
explicit_source_elements:
  - we are reshaping our world
  - on the premise that we are
  - close to AGI
evaluator_interpretation:
  - Assess the supplied normalized proposition about decisions premised on AGI being close. Do not separately assess whether humanity actually was close to AGI.
  - The plain reading is that expectations of near-term AGI materially inform substantial changes in infrastructure and institutional priorities. It does not require every decision-maker to share that expectation.
  - Close means an anticipated development within the coming few years, or explicitly described as approaching or in sight. A general aspiration to develop AGI is insufficient by itself.
  - Statements about approaching superintelligence count as expectations of approaching at least AGI-level capabilities, while retaining the distinction between those terms.
  - Use the current year through publication, 2025-01-01 to 2025-10-12, as the latest observable period for this ongoing state. These decisions have no common quarterly reporting period.
  - Publicly stated reasons establish an expressed premise, not proof that an investment would have been cancelled without that premise.
support_condition: Contemporaneous records show substantial infrastructure or institutional decisions, with decision-makers explicitly connecting their plans to expectations that AGI or more capable general intelligence is approaching.
contradiction_condition: Evidence establishes that the substantial changes invoked as examples were justified independently of approaching AGI, and that near-term AGI expectations were not a material stated premise. A single alternative rationale would limit the claim's scope without disproving the broader trend.
measurement_requirements: Identify concrete decisions or implementation, their societal reach, and their publicly stated rationale. Distinguish construction from announcements, and approaching AGI from ordinary improvements in existing AI.
source_requirements: Prefer dated statements by decision-makers, investment announcements, infrastructure updates, and official policy documents. Do not infer an AGI premise merely from increased AI spending.
