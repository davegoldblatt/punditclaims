evaluator_interpretation:
  - The plain reading predicts failure to honor material Oracle debt obligations.
  - Use debts outstanding at publication as the initial population; future borrowing is not clearly included or excluded.
  - A developer's project debt is not automatically Oracle's debt. Establish Oracle's legal obligation before treating a project-level event as decisive.
  - Refinancing that pays creditors is fulfillment. A notice preserving contractual rights is not itself proof of nonpayment.
support_condition: An authoritative record establishes material nonpayment or a completed distressed settlement imposing losses on creditors of an obligation Oracle legally owes.
contradiction_condition: All obligations in the defined publication-date debt population are fully paid or satisfied under their original contractual terms.
measurement_requirements: Identify the legal borrower and guarantors, relevant debt population, contractual payments, grace periods and final recoveries. Separate corporate borrowing from developer debt and lease obligations.
source_requirements: Oracle filings, debt agreements, trustee notices or court records. Reporting about project disputes is context unless it establishes an Oracle debt-payment outcome.
