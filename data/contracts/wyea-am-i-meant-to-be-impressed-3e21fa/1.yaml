assessment_axis: historical_observation
explicit_source_elements:
  - whatever growth these businesses currently have
  - is being eaten by depreciation
  - Last quarter
  - year-over-year
  - Microsoft, Google, Amazon, and Meta
evaluator_interpretation:
  - Use January–March 2026, the latest reported quarter before the post, compared with January–March 2025. For Microsoft this is fiscal Q3.
  - Read growth as consolidated operating-income growth and 'whatever growth ... is being eaten' as rising depreciation consuming the operating improvement, rather than merely reducing it.
  - Operating income already includes depreciation. Do not deduct depreciation from reported operating income a second time.
  - Evaluate each named company separately. The single metric_scope object describes this collection of company-specific tests, not a combined financial statement.
  - The accounting basis is company_reported because the passage invokes the companies' reported quarterly figures.
support_condition: For each named company, increased depreciation consumes the increase in operating earnings before depreciation, leaving no material operating-income growth after that expense.
contradiction_condition: The named companies report material operating-income growth after depreciation. Comparisons showing depreciation increases smaller than operating-income increases also contradict the proposed offset.
measurement_requirements: Compare the same quarters year over year. Distinguish depreciation alone from depreciation-and-amortization cash-flow adjustments and other noncash items. Compare changes rather than expense levels.
source_requirements: Company quarterly financial statements and accompanying explanations available by the evaluation date.
metric_scope:
  company: Microsoft; Alphabet (Google); Amazon; Meta, each separately
  metric: Year-over-year consolidated operating-income growth relative to increased depreciation expense
  currency: USD
  units: billions
  accounting_basis: company_reported
  fiscal_or_calendar: calendar
  period_start: 2026-01-01
