explicit_source_elements:
  - Most parts of the US
  - still don’t have functioning driverless cars systems
  - over a decade of lavish promises
evaluator_interpretation:
  - The ordinary reading concerns geographic availability of working driverless passenger services, without an onboard safety driver. It does not deny that services work in some cities.
  - "For the ongoing state, use the latest publicly reportable month-to-date period before publication: March 1–5, 2025."
  - Read 'most parts' as most US places lacking access, rather than requiring a particular population or land-area denominator.
  - Read 'lavish promises' as ambitious public commitments. The adjective is evaluative; the existence and age of commitments are checkable.
support_condition: Contemporary deployment records show services confined to a small number of local areas, leaving most US places unserved, and historical records establish ambitious commitments more than ten years earlier.
contradiction_condition: Contemporary records show functioning driverless passenger services broadly available across most US places, or the claimed history of commitments is disproved.
measurement_requirements: Distinguish public driverless service from supervised driver assistance, employee testing, and announced future deployments.
source_requirements: Dated operator disclosures and contemporary reporting on deployment geography; original announcements for historical commitments.
