assessment_axis: historical_observation
explicit_source_elements:
  - current AI
  - cannot learn except by downloading internet-sized gobs of content
  - not a logical necessity for any imaginable AI
evaluator_interpretation:
  - The plain reading is that contemporary generative AI requires internet-scale training content to learn useful capabilities. Marcus supplies no frontier-performance benchmark.
  - A model trained on a substantially smaller corpus is a counterexample only if its learning does not depend on a teacher pretrained on a much larger corpus.
  - "For this ongoing technical observation, the reporting window is the latest completed calendar research year and elapsed days before publication: 2023-01-01 through 2024-01-08. AI research has no standard quarterly reporting period."
  - The qualification about imaginable AI limits the assertion of necessity; it is not a conditional forecast.
support_condition: Evidence establishes that internet-scale content was necessary for useful learning by the contemporary generative methods under discussion, rather than merely documenting its use.
contradiction_condition: A contemporary generative model demonstrably learns useful capabilities from substantially less data, without inheriting internet-scale pretraining.
measurement_requirements: Identify training-corpus size, teacher-model training provenance, and measured learned capabilities. Distinguish data volume from parameter count and repeated training epochs.
source_requirements: Contemporaneous research papers or training documentation with methods and results.
