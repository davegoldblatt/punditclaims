explicit_source_elements:
  - Oracle
  - at a scale it’s never built at before
  - Crusoe
  - which has never done this
  - OpenAI
  - regularly underestimates the demands it puts on its servers
evaluator_interpretation:
  - The claim contains three assertions, all of which must be established for full support.
  - Scale means a comparable single-campus AI infrastructure build, assessed primarily by power capacity and computing deployment.
  - Never done this means Crusoe had not previously delivered a comparable hyperscale campus. It does not mean Crusoe had no computing infrastructure experience.
  - Regularly underestimates means repeated demand surprises producing capacity shortfalls, rather than outages of any cause.
  - Never and before refer to the companies' histories through May 27, 2025. The historical window therefore has no specified starting date.
support_condition: Comparable project records establish unprecedented scale for Oracle and no prior comparable delivery by Crusoe, while repeated documented demand surprises establish the OpenAI component.
contradiction_condition: Comparable prior projects refute either experience assertion, or demand-planning evidence refutes the asserted recurring underestimation. If other components are established, the combined result is mixed.
measurement_requirements: Compare planned Abilene capacity with previously delivered campuses on consistent measures; distinguish construction from leasing and operation. Identify multiple demand surprises rather than infer forecasting errors from outages alone.
source_requirements: Company project records, reliable historical reporting, and direct admissions or documented demand-versus-capacity comparisons.
