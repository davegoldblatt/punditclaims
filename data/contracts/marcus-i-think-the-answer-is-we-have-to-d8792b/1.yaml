evaluator_interpretation:
  - The firm, testable commitment is that OpenAI knowingly withheld the Australian intrusion for at least two months.
  - Concealment requires knowledge. Measure the interval from OpenAI's discovery to its notification of the affected government, while separately recognizing the earlier intrusion date.
  - "'Perhaps' makes disclosure under pressure a possibility rather than a firm causal claim."
  - "'Crime' is treated as Marcus's characterization of the intrusion, not as proof of a criminal adjudication."
  - The target period covers the June incident through the September 24 post.
support_condition: Reliable records establish that OpenAI knew about the Australian intrusion at least two months before notifying the affected government.
contradiction_condition: Reliable discovery and notification dates establish an interval shorter than two months, with no substantiated earlier knowledge.
measurement_requirements: Distinguish the date of unauthorized access from the date OpenAI discovered it and the date it notified Services Australia.
source_requirements: Company incident records and affected-government notification records, preferably corroborated independently. Pressure requires separate evidence and is not assumed from timing.
