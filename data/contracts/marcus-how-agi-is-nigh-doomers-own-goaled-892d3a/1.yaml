assessment_axis: causal_assessment
explicit_source_elements:
  - led governments to start using
  - today’s manifestly unreliable tech
  - in the context of war
evaluator_interpretation:
  - The technology refers to contemporary LLM-based systems in the surrounding passage.
  - Wartime use includes intelligence analysis and operational planning, not only autonomous weapons.
  - Unreliability means documented failures or limitations relevant to the military application; it does not mean every output is wrong.
  - Doomer advocacy must have materially contributed to adoption. Temporal coincidence is insufficient.
  - The claim concerns adoption and use by the post date, with no specified beginning date.
support_condition: Evidence establishes wartime deployment of contemporary LLM systems, relevant reliability deficiencies, and a material causal contribution from doomer advocacy to adoption.
contradiction_condition: Evidence disproves the identified deployment or relevant reliability premise, or directly establishes that the asserted advocacy did not contribute to the adoption decision.
measurement_requirements: Identify deployed models, tasks, safeguards, and task-relevant failure evidence. Separate deployment from procurement announcements and general model limitations from operational performance.
source_requirements: Military deployment and adoption records, model evaluations, and decision-maker testimony. Reputable reporting may establish classified deployments when primary records are unavailable.
