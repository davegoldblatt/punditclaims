assessment_axis: historical_observation
explicit_source_elements:
  - on September 12 2025
  - OpenAI couldn't afford to pay Oracle
  - Oracle didn't have the capacity to service
  - $300 billion, 5-year-long deal
evaluator_interpretation:
  - Assess the financial and delivery position as of September 12, 2025.
  - Affordability means resources and committed financing sufficient for scheduled payments, accounting for other obligations. It does not require holding the entire five-year contract value in cash immediately.
  - Capacity means the ability, established at the assessment date, to supply the services when contractually required. Distinguish existing operating capacity from planned construction.
  - Treat the two assertions separately; evidence for one does not establish the other.
  - The reported contract value is an estimate from press reporting. The five-year term is a service duration, not a deadline for this retrospective observation.
support_condition: Contract schedules and contemporaneous records establish both insufficient financial resources for the required payments and insufficient deliverable capacity for the required services.
contradiction_condition: Contract schedules and contemporaneous records establish adequate funding and deliverable capacity. Opposing findings for the two components would support a mixed assessment.
measurement_requirements: Payment dates and amounts, deposits and termination terms, available cash and committed financing net of other obligations, and required versus deliverable computing capacity by service date.
source_requirements: The executed contract or authenticated schedules, OpenAI financial records, and Oracle construction, power and commissioning records. Revenue forecasts and announced projects alone are insufficient.
