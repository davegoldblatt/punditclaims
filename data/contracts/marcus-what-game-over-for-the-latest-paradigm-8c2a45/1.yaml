assessment_axis: forecast_outcome
explicit_source_elements:
  - Scaling maximalism
  - won’t get us to AGI
evaluator_interpretation:
  - The post defines scaling maximalism as reaching AGI through larger scale without fundamental new innovation, allowing more data, efficiencies and infrastructure.
  - AGI is read as broadly human-level general cognitive capability, including learning and applying skills across unfamiliar tasks. A single benchmark score is insufficient.
  - Independent, broadly accepted validation is an evidentiary requirement added by the evaluator, not an explicit threshold supplied by Marcus.
  - No deadline is stated. Continued failure to demonstrate AGI cannot by itself establish that scaling will never produce it.
support_condition: A validated general impossibility result or equivalent decisive evidence establishes that scaling the relevant existing approaches cannot achieve AGI.
contradiction_condition: A publicly demonstrated and independently validated AGI is achieved principally through scaling the relevant existing approaches, without a fundamental change in method.
measurement_requirements: Evaluate broad general capability and the methods responsible for it. Distinguish benchmark success from AGI and engineering improvements from fundamental innovation.
source_requirements: Independent capability evaluations and technical evidence about the system's development. Developer declarations alone cannot settle the claim.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: not_applicable
early_resolution_rule: Resolve only upon a dated, independently validated AGI demonstration meeting the contradiction condition, or a validated impossibility result meeting the support condition. Elapsed time and isolated benchmark results are insufficient.
interpretation_determines_result: true
plain_reading: true
ambiguity_flags:
  - AGI has no operational definition in the post.
  - The boundary between an efficiency improvement and fundamental new innovation is unspecified.
  - There is no deadline.
retrospective_or_prospective: retrospective
