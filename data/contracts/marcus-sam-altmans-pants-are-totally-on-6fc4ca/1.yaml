evaluator_interpretation:
  - "Assess the combined allegation: an earlier request existed, it contradicted the specified denial, and Altman knowingly made that denial."
  - Read 'just a week earlier' as an approximate reference to the preceding week or two, not an exact seven-day threshold.
  - The target window covers late October through the November 7 post; its start allows the approximate preceding-week reference.
  - The phrase 'once again' invokes prior allegations but does not make this a conditional forecast.
  - This is a claim about a request and its consistency with a statement, not a measured financial quantity.
support_condition: The earlier OSTP submission sought guarantees covering the financing denied by Altman, and records establish that he knowingly denied wanting those guarantees.
contradiction_condition: Reliable records affirmatively establish that the earlier request did not exist, expressly excluded the denied financing, or otherwise establish that the alleged knowing contradiction was false.
measurement_requirements: Identify what the guarantees would cover and distinguish them from tax credits and indirect assistance to suppliers.
source_requirements: The original OSTP submission, Altman's complete denial, and evidence bearing on his knowledge.
