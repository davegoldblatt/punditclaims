ambiguity_flags:
  - ‘AI revenues’ has no uniform product or customer boundary.
  - ‘We do not know’ is interpreted as public availability.
  - The ongoing portions use the latest reported quarters, which differ across companies.
  - ‘Calculated from’ may mean mathematical derivation or broader reporting context.
  - ‘A single year’ requires a historical disclosure search, not merely checking the latest report.
