explicit_source_elements:
  - We do not know Google, Amazon or Oracle’s AI revenues
  - a single year
  - fiscal year 2026
  - an estimate from Bloomberg
  - calculated from its disclosure of its OpenAI revenues in an SEC filing
evaluator_interpretation:
  - ‘We do not know’ means publicly available information, not the speaker's personal knowledge.
  - The context refers to separately identifiable realized AI revenue. Total cloud revenue, growth percentages and annualized run rates are insufficient.
  - "For the ongoing disclosure claim, inspect the latest reported quarters available before the post: quarters ending June 2026 for Google and Amazon, and August 2026 for Oracle."
  - The target period spans those latest reporting periods and Microsoft's explicitly named fiscal 2026. Public availability is assessed as of October 13, 2026.
  - The Microsoft assertion includes both the existence of an annual estimate and the stated method used to calculate it.
  - The references to fiscal 2026 and Bloomberg are scope restrictions, not antecedents of a conditional forecast.
  - The metric_scope records the Microsoft annual estimate. Other companies' disclosures require separate component scopes.
support_condition: A sufficiently complete disclosure review finds no separately reported realized AI revenue for Google, Amazon or Oracle, and establishes that the only available annual Microsoft figure is the stated FY2026 Bloomberg estimate calculated as described.
contradiction_condition: A qualifying public disclosure defeats the claimed absence or exclusivity, or the original estimate's methodology materially differs from the stated derivation.
measurement_requirements: Distinguish realized AI revenue from cloud totals and annualized metrics. Check historical estimates as well as current filings, and inspect Bloomberg's actual calculation.
source_requirements: Company filings, earnings releases and transcripts for disclosure coverage; Bloomberg's complete report for its estimate and methodology.
