ambiguity_flags:
  - No numerical definition of 'substantively' or 'very expensive'.
  - No denominator for 'most of those costs'.
  - The statement combines cumulative achievement with ongoing costs.
  - The cumulative target follows 'yet'; the ongoing cost component uses the latest completed month.
  - The Twitter exception is rhetorical and has no objective membership test.
