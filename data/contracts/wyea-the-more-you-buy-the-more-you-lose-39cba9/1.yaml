assessment_axis: historical_observation
explicit_source_elements:
  - very, very, very expensive to use
  - most of those costs
  - hidden from the user or subsidized by employers
  - yet to substantively replace or even enhance human beings
  - outside of the loudest and most annoying people on Twitter
evaluator_interpretation:
  - The plain reading of the enhancement clause denies demonstrated, meaningful gains in real work beyond social-media testimonials.
  - A substantial measured workplace productivity gain can contradict that blanket denial without proving widespread replacement or profitability.
  - The word 'yet' makes the achievement claim cumulative through July 28, 2026; the target therefore includes earlier workplace experiments.
  - For the ongoing cost component, June 2026 is the latest completed monthly reporting period before publication.
  - "'Most' requires a defined population and more than half of relevant costs; employer payment and provider subsidy are different quantities."
  - The Twitter description is treated as a contrast with credible workplace evidence, not a literal personality classification.
support_condition: Representative cost evidence establishes the stated majority burden, while credible workplace evidence supports the absence of meaningful enhancement or replacement through the post date.
contradiction_condition: Credible real-work evidence establishes meaningful enhancement beyond testimonials, contradicting the categorical enhancement clause; alternatively, representative cost records contradict the majority-cost assertion.
measurement_requirements: Controlled measures of completed work, time and quality; employment evidence distinguishing replacement from hiring changes; representative costs and payer shares for the expense component.
source_requirements: Original workplace studies and public cost records. Self-reported productivity and vendor anecdotes require separate treatment.
