assessment_axis: historical_observation
explicit_source_elements:
  - the output is mediocre
  - the product is unprofitable
evaluator_interpretation:
  - Assess only the normalized quality-and-profitability claim, not the adjacent assertions about training data or architectural limits.
  - The ordinary reading is that generative AI generally produces middling practical results and fails to cover its full development and operating costs.
  - Use January–March 2024, the latest normally reportable financial quarter before publication, as a common observation period for this combined claim.
  - Mediocre would require comparison with ordinary competent performance on representative practical tasks. No particular model, task mixture or quality threshold is supplied.
  - The financial clause names no company, currency or accounting basis.
support_condition: Representative evaluations show broadly middling practical output, and comparable financial records show negative full-cost profitability for the relevant products in the target period.
contradiction_condition: Representative evaluations establish consistently strong practical output, or comparable financial records establish profitability for the relevant product population in the target period.
measurement_requirements: Use specified models, task samples and human or operational baselines for quality. For profitability, match revenue and all attributable costs within one period and accounting basis.
source_requirements: Prefer independent evaluations and product-level financial disclosures. Isolated failures, selected successes and parent-company financial totals cannot settle the combined generalization.
