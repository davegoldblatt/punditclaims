evaluator_interpretation:
  - The referenced capability is planning ahead to navigate the web autonomously and reliably for research.
  - Exactly the same thing means a comparable research objective, not identical code or model architecture.
  - The claim combines three companies' development activity with a universal, architecture-based explanation of model limitations.
  - I use July 2024 through the post date as the current reporting window. Earlier research is context, not proof that an identical project remained active then.
support_condition: Records establish that all three named companies were developing comparable autonomous research capabilities by the post date, while evaluations and technical analysis establish the claimed shared architectural limitation.
contradiction_condition: Reliable records show that a named company was not pursuing that objective, or a contemporary LLM demonstrates the allegedly missing reliable autonomous research capability, or technical evidence refutes the asserted architectural cause.
measurement_requirements: Company-specific evidence of active development, a clear autonomous-research task definition, reliability measurements, and evidence distinguishing architectural constraints from training, tooling, or resource limitations.
source_requirements: Dated company research records and contemporary evaluations. Later releases alone cannot establish what was under development in July 2024.
