explicit_source_elements:
  - If all the “self-driving” efforts
  - leaning heavily (eg hourly) on call-centers
  - true self-driving is a LONG way away
  - close to true Level 5
  - probably been deceived
evaluator_interpretation:
  - The antecedent concerns industry-wide dependence at the post date; Cruise alone cannot establish it.
  - "'Hourly' is an illustrative rate, not a specified universal numerical threshold."
  - Level 5 means unrestricted driving capability across conditions human drivers can handle, without a required human driver.
  - No numerical meaning is assigned to 'close' or 'a LONG way away'. The surrounding discussion does not supply a deadline for this particular forecast.
  - The statement about deception is a qualified inference, not a separately specified event.
support_condition: First establish the universal antecedent. Then establish that Level 5 remained unavailable for a duration defensibly grounded in the speaker's meaning of 'a LONG way away'; the statement supplies no such duration.
contradiction_condition: With the antecedent established, independently verified Level 5 availability at the post date would contradict the forecast. A later deployment requires a speaker-grounded interpretation of 'close' before it can settle the timing claim.
measurement_requirements: Comparable contemporaneous remote-assistance rates across the claimed population, plus independently verified Level 5 capability and an operational timing criterion.
source_requirements: Program-level operational disclosures for the antecedent; official or independently verified deployment and capability records for the outcome.
metric_scope: null
original_horizon: null
horizon_interval: null
target_period: null
condition_status: unknown
early_resolution_rule: Proof that Level 5 was already operational at the post date, together with proof that the antecedent held, could decisively contradict the claim. Mere passage of time or later Level 4 deployment cannot settle it.
interpretation_determines_result: true
ambiguity_flags:
  - The population covered by 'all' is unspecified.
  - "'Leaning heavily' has no firm threshold."
  - "'Hourly' is an example rather than a required rate."
  - "'Close' and 'a LONG way away' provide no deadline."
  - The deception inference is hedged and identifies no specific representation.
